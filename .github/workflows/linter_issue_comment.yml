name: rerun-staged-recipes-linter

on:
  issue_comment: null

permissions:
  contents: read
  checks: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rerun-linter:
    name: rerun-linter
    runs-on: ubuntu-slim
    if: ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request) }}
    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install code
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          micromamba-version: "2.7.0-0"
          environment-name: lint
          condarc: |
            show_channel_urls: true
            channel_priority: strict
            channels:
              - conda-forge
          create-args: >-
            pygithub

      - name: rerun linter
        run: |
          python .github/workflows/scripts/linter_issue_comment.py \
            --owner=${{ github.repository_owner }} \
            --pr-num=${{ github.event.issue.number  }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
