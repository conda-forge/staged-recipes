name: Temporary letta-code Windows check
on:
  push:
    branches: [letta-code]
    paths:
      - recipes/letta-code/**
      - .github/workflows/letta-code-windows-check.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: tooling
          create-args: rattler-build=0.80.2
          init-shell: none
          cache-environment: true
      - name: Build and test letta-code
        shell: pwsh
        run: >-
          micromamba run -n tooling rattler-build build
          --recipe recipes/letta-code/recipe.yaml
          --variant c_stdlib=vs --variant c_stdlib_version=2022
          --output-dir "$env:RUNNER_TEMP/letta-output"
