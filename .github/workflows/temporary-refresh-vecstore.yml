name: Temporary refresh VecStore recipe

on:
  push:
    branches:
      - vecstore

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vecstore
          fetch-depth: 0

      - name: Rebuild recipe on current staged-recipes main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git remote add upstream https://github.com/conda-forge/staged-recipes.git || true
          git fetch upstream main
          git reset --hard upstream/main

          version="0.1.0"
          revision="82fb7c5e572c5d9aca73ff5facdc5365d9133503"
          source_url="https://github.com/PhilipJohnBasile/vecstore/archive/${revision}.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            --output /tmp/vecstore-source.tar.gz "$source_url"
          source_sha256="$(sha256sum /tmp/vecstore-source.tar.gz | awk '{print $1}')"
          echo "VecStore source SHA-256: ${source_sha256}"

          mkdir -p recipes/vecstore
          cat > recipes/vecstore/build.sh <<'EOF'
          #!/bin/bash
          set -ex

          cargo install --locked --features server --bin vecstore-server --path . --root "$PREFIX"
          cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
          EOF

          cat > recipes/vecstore/meta.yaml <<EOF
          {% set name = "vecstore" %}
          {% set version = "${version}" %}

          package:
            name: {{ name|lower }}
            version: {{ version }}

          source:
            url: ${source_url}
            sha256: ${source_sha256}

          build:
            number: 0
            skip: true  # [win]

          requirements:
            build:
              - {{ compiler('rust') }}
              - {{ compiler('c') }}
              - {{ stdlib("c") }}
              - cargo-bundle-licenses
              - pkg-config
              - protobuf

          test:
            commands:
              - vecstore-server --help

          about:
            home: https://github.com/PhilipJohnBasile/vecstore
            license: MIT
            license_family: MIT
            license_file:
              - LICENSE
              - THIRDPARTY.yml
            summary: Embeddable vector database with HNSW search and RAG tooling
            description: |
              VecStore is an embeddable Rust vector database with HNSW indexing,
              metadata filtering, hybrid search, snapshots, and an optional HTTP/gRPC
              server. This recipe builds the server feature from the immutable source
              commit corresponding to the repository's current 0.1.0 package version.
            doc_url: https://docs.rs/vecstore
            dev_url: https://github.com/PhilipJohnBasile/vecstore

          extra:
            recipe-maintainers:
              - PhilipJohnBasile
          EOF

          chmod +x recipes/vecstore/build.sh
          rm -f .github/workflows/temporary-refresh-vecstore.yml
          git add -A
          git commit -s -m "Add vecstore 0.1.0"
          test "$(git rev-list --count upstream/main..HEAD)" = "1"
          git diff --check upstream/main...HEAD

      - name: Publish clean candidate branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/PhilipJohnBasile/staged-recipes.git" \
            HEAD:sync/vecstore-recipe-ready \
            --force
