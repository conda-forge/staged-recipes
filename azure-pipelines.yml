# Don't run build jobs for branches
trigger:
  batch: false
  branches:
    include:
      - gh-readonly-queue/*

# Still allow PR builds to run against main
pr:
- main

stages:
- stage: check
  jobs:
    - job: skip
      pool:
        vmImage: 'ubuntu-22.04'
      variables:
        DECODE_PERCENTS: 'false'
        RET: 'true'
      steps:
      - checkout: self
        # We only need two: the PR merge commit, and the actual commit added by the user
        fetchDepth: '2'
      - bash: |
          git_log=`git log --max-count=1 --skip=1 --pretty=format:"%B" | tr "\n" " "`
          echo "##vso[task.setvariable variable=log]$git_log"
        displayName: Obtain commit message
      - bash: echo "##vso[task.setvariable variable=RET]false"
        condition: or(contains(variables.log, '[skip azp]'), contains(variables.log, '[azp skip]'), contains(variables.log, '[skip ci]'), contains(variables.log, '[ci skip]'))
        displayName: Skip build?
      - bash: echo "##vso[task.setvariable variable=start_main;isOutput=true]$RET"
        name: result
        displayName: Export result
- stage: build
  condition: and(succeeded(), eq(dependencies.check.outputs['skip.result.start_main'], 'true'))
  dependsOn: check
  jobs:
  - job: fast_finish
    displayName: fast finish
    pool:
      vmImage: 'ubuntu-22.04'
    steps:
    - script: |
        ./.scripts/fast_finish.sh
      name: fast_finish
      displayName: Fast finish
      env:
        CI: azure
  - template: ./.azure-pipelines/azure-pipelines-linux-aarch64.yml
  - job: status
    pool:
      vmImage: 'ubuntu-22.04'
    dependsOn:
      - fast_finish
      - linux_aarch64
    condition: always()
    variables:
      linux_aarch64: $[ dependencies.linux_aarch64.result ]
    steps:
      - checkout: none
      - bash: |
          # a build is successful if any of the jobs succeeds or all are skipped

          echo "linux_aarch64 status: ${LINUX_AARCH64}"

          has_success=false
          all_skipped=true

          for val in ${LINUX_AARCH64}; do
            if [[ "${val}" == "Succeeded" ]]; then
              has_success=true
            fi

            if [[ "${val}" != "Skipped" ]]; then
              all_skipped=false
            fi
          done

          echo "any successful builds: ${has_success}"
          echo "all builds skipped: ${all_skipped}"

          if [[ ("${has_success}" == "true") || ("${all_skipped}" == "true") ]]; then
            exit 0
          else
            exit 1
          fi
        displayName: check
