schema_version: 1

context:
  version: "0.1.81"

package:
  name: extra-streamlit-components
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/extra-streamlit-components/extra_streamlit_components-${{ version }}.tar.gz
  sha256: eb9beb7bacfe8b3d238f1888a21c78ac6cfa569341be484bca08c3ea0b15f20d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - streamlit >=1.40.1

tests:
  - python:
      imports:
        - extra_streamlit_components
      pip_check: true

about:
  summary: An all-in-one place, to find complex or just natively unavailable components on streamlit.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Mohamed-512/Extra-Streamlit-Components

extra:
  recipe-maintainers:
    - EllaBootQC
