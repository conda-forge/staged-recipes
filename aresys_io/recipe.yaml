    ## Contributing

    Contributions are welcome! If you encounter a bug, have a feature request, or want to contribute code:

    - **Report bugs & request features**: open an issue on [GitHub](https://github.com/aresys-srl/aresys_io/issues). Include a clear description, steps to reproduce, and environment details.
    - **Submit changes**: fork the repository, create a feature branch, and open a pull request. Ensure your code passes all linting (`ruff`), typing (`pyrefly`), and test suites (`pytest`).
    - **Questions**: use GitHub Discussions for general questions and discussions.

