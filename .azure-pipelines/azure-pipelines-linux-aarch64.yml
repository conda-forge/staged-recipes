jobs:
- job: linux_aarch64
  dependsOn: fast_finish
  condition: and(not(eq(variables['Build.SourceBranch'], 'refs/heads/main')), eq(dependencies.fast_finish.outputs['fast_finish.buildMe'], 'true'))
  pool:
    vmImage: ubuntu-latest
  timeoutInMinutes: 360
  steps:
  - script: |
      sudo mkdir -p /opt/empty_dir
      for d in \
          /opt/ghc \
          /opt/hostedtoolcache \
          /usr/lib/jvm \
          /usr/local/.ghcup \
          /usr/local/android \
          /usr/local/powershell \
          /usr/share/dotnet \
          /usr/share/swift \
          ; do
          sudo rsync --stats -a --delete /opt/empty_dir/ $d || true
      done
    displayName: Manage disk space

  - script: |
      SWAPFILE=/swapfile
      # If there is already a swapfile, disable it and remove it
      if swapon --show | grep -q $SWAPFILE; then
          echo "Disabling existing swapfile..."
          sudo swapoff $SWAPFILE || true
      fi
      [ -f "$SWAPFILE" ] && sudo rm -f $SWAPFILE
      sudo fallocate -l 10GiB $SWAPFILE
      sudo chmod 600 $SWAPFILE
      sudo mkswap $SWAPFILE
      sudo swapon $SWAPFILE
    displayName: Create swap file

  - script: |
      # sudo pip install --upgrade pip
      sudo pip install setuptools shyaml
    displayName: Install dependencies

  - script: |
      docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
    displayName: Set up QEMU for aarch64 emulation

  - script: |
      set -e

      # make sure there is a package directory so that artifact publishing works
      mkdir -p build_artifacts/{noarch,linux-aarch64}/

      export CI=azure
      export CONFIG=linux_aarch64
      export AZURE=True
      .scripts/run_docker_build.sh

    displayName: Run docker build

  - publish: build_artifacts/linux-aarch64/
    artifact: conda_pkgs_linux_aarch64

  - publish: build_artifacts/noarch/
    artifact: conda_pkgs_noarch
