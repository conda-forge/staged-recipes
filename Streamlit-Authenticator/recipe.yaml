schema_version: 1

context:
  version: "0.4.2"

package:
  name: streamlit-authenticator
  version: ${{ version }}

source:
  url: https://github.com/mkhorasani/Streamlit-Authenticator/archive/v${{ version }}.tar.gz
  sha256: ca156de88830bf53dc69f690f57b4ef75dd18c6f72b819c197672110570ff34f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - bcrypt >=3.1.7
    - captcha >=0.5.0
    - cryptography >=42.0.5
    - extra-streamlit-components >=0.1.70
    - pyjwt >=2.3.0
    - pyyaml >=5.3.1
    - streamlit >=1.37.0

tests:
  - python:
      imports:
        - streamlit_authenticator
      pip_check: true

about:
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mkhorasani/Streamlit-Authenticator

extra:
  recipe-maintainers:
    - EllaBootQC
