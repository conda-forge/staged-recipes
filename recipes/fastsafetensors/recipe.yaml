schema_version: 1

context:
  version: "0.5.0"

package:
  name: fastsafetensors
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/f/fastsafetensors/fastsafetensors-${{ version }}.tar.gz
  sha256: 2532cd58c779035eeadea4f8da8cd4340ba1d4a1a04753946e4f89aed2043c13

build:
  number: 0
  skip: match(python, ">=3.16")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    - python >=3.10,<3.16
    - setuptools >=78.1.1
    - pybind11 >=3.1.0
    - pip
  run:
    - python >=3.10,<3.16
    - typer >=0.9.0

tests:
  - python:
      imports:
        - fastsafetensors
      pip_check: true

about:
  summary: High-performance safetensors model loader
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/fastsafetensors/
  repository: https://github.com/foundation-model-stack/fastsafetensors

extra:
  recipe-maintainers:
    - shermansiu
