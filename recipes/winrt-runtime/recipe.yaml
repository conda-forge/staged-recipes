context:
  version: "4.2.0"

package:
  name: winrt-runtime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/winrt-runtime/winrt_runtime-${{ version }}.tar.gz
  sha256: 5cc256e403e18cf00d2072890dc4b2b39d6c255d709a0a35e46a03efa7511f5e

build:
  number: 0
  skip:
    - not win
    - match(python, "<3.11")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=78
  run:
    - python
    - typing-extensions >=4.12.2

tests:
  - python:
      imports:
        - winrt._winrt
        - winrt.runtime
        - winrt.system
      pip_check: true

about:
  summary: The runtime that every PyWinRT projection package runs on
  description: |
    Core runtime of PyWinRT, the Python projection of the Windows Runtime (WinRT)
    APIs. The per-namespace projection packages (winrt-windows-*) all build on
    this compiled extension.
  homepage: https://github.com/pywinrt/pywinrt
  repository: https://github.com/pywinrt/pywinrt
  documentation: https://pywinrt.readthedocs.io
  # src/include/pythoncapi_compat.h is vendored under 0BSD; everything else
  # (including the vendored C++/WinRT headers) is MIT.
  license: MIT AND 0BSD
  license_file:
    - LICENSE
    - LICENSE-pythoncapi_compat.txt

extra:
  recipe-maintainers:
    - roaldarbol
