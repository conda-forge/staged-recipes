context:
  name: trame-dockview
  version: "2.0.1"
  python_min: "3.10"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/trame_dockview-${{ version }}.tar.gz
  sha256: 8b1db7a4ffd5a3eab4d877a2eb4bb5b73006d05634e6f9f3a873dc97da458cba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - trame-client >=3.9.1

tests:
  - python:
      imports:
        - trame_dockview
        - trame.widgets.dockview
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/Kitware/trame-dockview
  summary: Trame wrapper to a Docking Layout Manager
  description: |
    trame-dockview exposes the dockview docking layout manager as trame
    widgets so trame applications can arrange panels in tabs, splits and
    floating groups.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/Kitware/trame-dockview

extra:
  recipe-maintainers:
    - jourdain
