# Flang COFF objects + MSVC link.exe: force MSVC lib.exe as the archiver.
# flang's llvm-ar writes GNU archives that link.exe rejects (LNK1107).
[binaries]
ar = 'lib'

# The flang activation exports its linker flags in clang syntax, including
# -Wl,-defaultlib:<clang runtime>. meson hands those to every language, and
# cl.exe rejects the flag outright:
#
#     cl : Command line error D8021 : invalid numeric argument
#     '/Wl,-defaultlib:.../clang_rt.builtins-x86_64.lib'
#
# which kills the C and C++ sanity checks before anything is compiled. A
# native file wins over the environment, so this empties the link arguments
# for those two languages only; Fortran still gets the flags flang wants.
[built-in options]
c_link_args = []
cpp_link_args = []
