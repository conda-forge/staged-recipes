schema_version: 1

context:
  name: mawk
  upstream_version: "1.3.4"
  upstream_date: "20260302"
  version: ${{ upstream_version }}.${{ upstream_date }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url:
    - https://invisible-island.net/archives/mawk/mawk-${{ upstream_version }}-${{ upstream_date }}.tgz
    - https://invisible-mirror.net/archives/mawk/mawk-${{ upstream_version }}-${{ upstream_date }}.tgz
  sha256: e2c08a77d0a84a01f9be454d1ca3872d4f103f9ada683d075198b0c6e965633d

build:
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make

tests:
  - script:
      - mawk -W version | grep -F "${{ upstream_version }} ${{ upstream_date }}"
      - test "$(printf '1 2\n3 4\n' | mawk '{ s += $1 * $2 } END { print s }')" = "14"
      - test "$(echo 'a,b,c' | mawk -F, '{ print $2 }')" = "b"
      - test "$(echo foo123bar | mawk '{ gsub(/[0-9]+/, "X"); printf "%s-%d\n", $0, length($0) }')" = "fooXbar-7"

about:
  homepage: https://invisible-island.net/mawk/
  summary: mawk is an interpreter for the AWK programming language
  description: |
    mawk is an interpreter for the AWK programming language, as specified by
    POSIX. It is a fast, lightweight alternative to gawk, maintained by
    Thomas E. Dickey.
  license: GPL-2.0-only
  license_file: COPYING
  documentation: https://invisible-island.net/mawk/manpage/mawk.html
  repository: https://github.com/ThomasDickey/mawk-snapshots

extra:
  recipe-maintainers:
    - nh13
