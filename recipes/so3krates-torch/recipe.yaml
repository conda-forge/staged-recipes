schema_version: 1

context:
  name: So3krates-torch
  version: "0.2.1"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/so3krates_torch-${{ version }}.tar.gz
  sha256: ea51f6cfcc5471370474e964a50c12f4fd4c6871939ca90dd71952f0a37c76d4

build:
  number: 0
  skip: win
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - torchkrates-jax2torch = so3krates_torch.cli.jax_to_torch:main
      - torchkrates-torch2jax = so3krates_torch.cli.torch_to_jax:main
      - torchkrates-eval = so3krates_torch.cli.run_eval:main
      - torchkrates-metric = so3krates_torch.cli.run_metric:main
      - torchkrates-train = so3krates_torch.cli.run_train:main
      - torchkrates-preprocess = so3krates_torch.cli.run_preprocess:main
      - torchkrates-create-lammps-model = so3krates_torch.cli.create_lammps_model:main
      - torchkrates-merge = so3krates_torch.cli.run_merge:main
      - torchkrates-tune-pme = so3krates_torch.cli.run_tune_pme:main

requirements:
  host:
    - python 
    - setuptools >=61.0
    - pip
  run:
    - python
    - ase >=3.26.0
    - h5py >=3.14.0
    - matscipy >=0.8.0
    - numpy >=1.26.4
    - prettytable >=3.0.0
    - pydantic >=2.0
    - pyyaml >=6.0.2
    - pytorch >=2.6.0
    - torch-ema >=0.3.0
    - pytorch_geometric ==2.7.0
    - torchmetrics >=1.0.0
    - jax
    - flax
    - ml-collections
    - pandas >=1.5.0 
tests:
  - python:
      imports:
        - so3krates_torch
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - torchkrates-jax2torch --help
      - torchkrates-torch2jax --help
      - torchkrates-eval --help
      - torchkrates-metric --help
      - torchkrates-train --help
      - torchkrates-preprocess --help
      - torchkrates-create-lammps-model --help
      - torchkrates-merge --help
      - torchkrates-tune-pme --help

about:
  summary: PyTorch implementation of So3krates neural network potential for atomistic simulations
  license: MIT
  license_file: LICENSE.md
  homepage: https://pypi.org/project/So3krates-torch/

extra:
  recipe-maintainers:
    - tohenkes
    - ansobolev
