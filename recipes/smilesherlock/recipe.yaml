schema_version: 1

context:
  version: 1.7.0
  python_min: 3.10

package:
  name: smilesherlock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/smilesherlock/smilesherlock-${{ version }}.tar.gz
  sha256: a116c4a55800229950faba663a26a56738fc17b195a178a8aa555d5d85b48608

build:
  noarch: python
  number: 0
  script:
    - python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - smilesherlock = smilesherlock.cli:app

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools >=68.0
    - wheel
  run:
    - python >=${{ python_min }}
    - typer >=0.9.0
    - rich >=13.0.0
    - tqdm >=4.66.0
    - pandas >=2.0.0
    - requests >=2.31.0
    - aiohttp >=3.8.0
    - rdkit >=2023.09.0
    - pydantic >=2.0.0
    - pydantic-settings >=2.0.0
    - platformdirs >=4.0.0
    - packaging >=23.0

tests:
  - python:
      imports:
        - smilesherlock
        - smilesherlock.core
        - smilesherlock.cli
        - smilesherlock.utils
  - requirements:
      run:
        - pip
    script:
      - pip check
      - smilesherlock --help
      - smilesherlock --version

about:
  homepage: https://github.com/AtharvaTilewale/SmileSherlock
  license: MIT
  license_file: LICENSE
  summary: A high-performance tool for SMILES validation, PubChem lookup, and chemical structure retrieval
  documentation: https://smilesherlock.readthedocs.io/
  repository: https://github.com/AtharvaTilewale/SmileSherlock

extra:
  recipe-maintainers:
    - AtharvaTilewale
