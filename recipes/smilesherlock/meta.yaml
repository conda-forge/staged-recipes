{% set name = "smilesherlock" %}
{% set version = "1.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/smilesherlock-{{ version }}.tar.gz
  sha256: a116c4a55800229950faba663a26a56738fc17b195a178a8aa555d5d85b48608

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - smilesherlock = smilesherlock.cli:app

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68.0
    - wheel
  run:
    - python >=3.10
    - typer >=0.9.0
    - rich >=13.0.0
    - tqdm >=4.66.0
    - pandas >=2.0.0
    - requests >=2.31.0
    - aiohttp >=3.8.0
    - rdkit >=2023.09.0
    - pydantic >=2.0.0
    - pydantic-settings >=2.0.0
    - platformdirs >=4.0.0
    - packaging >=23.0

test:
  imports:
    - smilesherlock
    - smilesherlock.core
    - smilesherlock.cli
    - smilesherlock.utils
  commands:
    - pip check
    - smilesherlock --help
    - smilesherlock --version
  requires:
    - pip

about:
  home: https://github.com/AtharvaTilewale/SmileSherlock
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A high-performance tool for SMILES validation, PubChem lookup, and chemical structure retrieval
  doc_url: https://smilesherlock.readthedocs.io/
  dev_url: https://github.com/AtharvaTilewale/SmileSherlock

extra:
  recipe-maintainers:
    - AtharvaTilewale
