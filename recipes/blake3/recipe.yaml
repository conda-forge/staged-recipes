schema_version: 1

context:
  version: 1.8.5

recipe:
  name: blake3
  version: ${{ version }}

source:
  url: https://github.com/BLAKE3-team/BLAKE3/archive/refs/tags/${{ version }}.tar.gz
  sha256: 220bd81286e2a0585beac66d41ac3f4c2c33ae8a4e339fc88cf22d5e00514fe9

build:
  number: 0

outputs:
  - package:
      name: libblake3
    build:
      script: build-libblake3
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
      run_exports:
        - ${{ pin_subpackage('libblake3', upper_bound='x.x') }}
    tests:
      - package_contents:
          lib:
            - blake3
          include:
            - blake3.h
    about:
      license: Apache-2.0 OR CC0-1.0
      license_file:
        - LICENSE_A2
        - LICENSE_CC0
      summary: BLAKE3 cryptographic hash function C library

  - package:
      name: blake3sum
    build:
      script: build-blake3sum
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('rust') }}
        - cargo-bundle-licenses
    tests:
      - script:
          - b3sum --version
          - if: unix
            then: printf 'abc' | b3sum
    about:
      license_file:
        - LICENSE_A2
        - LICENSE_A2LLVM
        - LICENSE_CC0
        - THIRDPARTY.yml
      summary: BLAKE3 command line hashing tool (b3sum)
      description: |
        b3sum is a command line utility for computing BLAKE3 hashes, analogous
        to the sha256sum and md5sum tools. It supports hashing files, standard
        input, keyed hashing, key derivation, extendable output, and parallel
        hashing across multiple threads.

        This package is distributed as "blake3sum" to avoid a name collision
        with the existing conda-forge "b3sum" feedstock; it installs the same
        "b3sum" command.

about:
  license: CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception
  license_file:
    - LICENSE_A2
    - LICENSE_A2LLVM
    - LICENSE_CC0
  summary: BLAKE3 cryptographic hash function
  description: |
    BLAKE3 is a cryptographic hash function that is much faster than MD5,
    SHA-1, SHA-2, SHA-3, and BLAKE2; secure against length extension;
    highly parallelizable across any number of threads and SIMD lanes;
    capable of verified streaming and incremental updates; and serves as
    a PRF, MAC, KDF, and XOF as well as a regular hash.
  homepage: https://github.com/BLAKE3-team/BLAKE3
  repository: https://github.com/BLAKE3-team/BLAKE3

extra:
  feedstock-name: libblake3
  recipe-maintainers:
    - phreed
