{% set name = "diffpy.cmistructure" %}
{% set version = "0.1.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/d/diffpy_cmistructure/diffpy_cmistructure-{{ version }}.tar.gz
  sha256: 0537a82001e02d37724c19bb1364dac2594c8e2bfbe5d1282def92a53128b03f

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .
  entry_points:
    - diffpy-cmistructure = diffpy.cmistructure.cmistructure_app:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-git-versioning >=2.0
    - pip

  run:
    - python >={{ python_min }}
    - numpy
    - diffpy.srreal
    - diffpy.srfit
    - diffpy.structure
    - pyobjcryst

test:
  requires:
    - python {{ python_min }}
    - pip
    - pytest

  source_files:
    - tests

  imports:
    - diffpy.cmistructure

  commands:
    - pip check
    - diffpy-cmistructure --version
    - pytest

about:
  home: https://github.com/diffpy/diffpy.cmistructure/
  summary: diffpy.cmi package for doing refinements with structure objects
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE.rst
    - LICENSE_DANSE.rst
  description: |
    diffpy.cmi package for doing refinements with structure objects
  dev_url: https://github.com/diffpy/diffpy.cmistructure/

extra:
  recipe-maintainers:
    - sbillinge
    - cadenmyers13
