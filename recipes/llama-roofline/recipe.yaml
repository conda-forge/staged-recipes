schema_version: 1

context:
  version: "0.2.3"

package:
  name: llama-roofline
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-roofline/llama_roofline-${{ version }}.tar.gz
  sha256: 5554b8250818a5266eedad3f8056ad82d2039db60274311124f787d593bf02b2

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - llama-roofline = llama_roofline.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.20
    - matplotlib-base >=3.4

tests:
  - python:
      imports:
        - llama_roofline
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - llama-roofline --help
      - llama-roofline --version

about:
  homepage: https://github.com/manunicholasjacob/llama-roofline
  repository: https://github.com/manunicholasjacob/llama-roofline
  documentation: https://github.com/manunicholasjacob/llama-roofline#readme
  summary: Check whether llama.cpp decode is memory-bandwidth-bound, in one command.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - manunicholasjacob
