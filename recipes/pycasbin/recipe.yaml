schema_version: 1

context:
  version: "2.8.0"

package:
  name: pycasbin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pycasbin/pycasbin-${{ version }}.tar.gz
  sha256: 2615c8940d58caf03c9206246d9499209fd520448c682d2f2ca101c41d9b0aee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - simpleeval >=1.0.3
    - wcmatch >=10.1

tests:
  - python:
      imports:
        - casbin
        # - dist
        # - examples
        # - node_modules
      pip_check: true
      python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: An authorization library that supports access control models like ACL, RBAC, ABAC in Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pycasbin/

extra:
  recipe-maintainers:
    - ocefpaf
