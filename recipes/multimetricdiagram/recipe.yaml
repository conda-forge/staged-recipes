schema_version: 1

context:
  name: multimetricdiagram
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/multimetricdiagram-${{ version }}.tar.gz
  sha256: 660f02d0a7c85573dc56912229cb64472afcfa85f4765ec154c66173b32dfbe6

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.26
    - matplotlib-base >=3.8

tests:
  - python:
      imports:
        - multimetricdiagram
        - multimetricdiagram.alt.taylor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    script:
      - pytest tests -q

about:
  homepage: https://github.com/oceanmodeling/multimetricdiagram
  summary: 'Multimetric diagram: 5-metric (total/bias/pattern/amplitude/phase) alternative, that rewards realistic variance, to Taylor diagram'
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/oceanmodeling/multimetricdiagram

extra:
  recipe-maintainers:
    - DanCodiga
    - tomsail
