context:
  version: "0.10.1"

package:
  name: anyplotlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anyplotlib/anyplotlib-${{ version }}.tar.gz
  sha256: e94ae8779e76d9b3f78722380ae8ba1b600efd5928bd51f039ee98bce4d15c3b

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python >=3.10
    - anywidget >=0.9.0
    - colorcet >=3.0
    - numpy >=2.0.0
    - traitlets >=5.0.0

tests:
  - python:
      imports:
        - anyplotlib
      pip_check: true

about:
  homepage: https://cssfrancis.github.io/anyplotlib/
  summary: A fast, interactive plotting library for Jupyter, built on anywidget and a pure-JavaScript canvas renderer
  description: |
    anyplotlib is a fast, interactive plotting library for Jupyter, built on
    anywidget and a pure-JavaScript canvas renderer. It follows matplotlib's
    object-oriented API - create a Figure, call methods on Axes - while all
    rendering happens in the browser, so pan, zoom and drag interactions never
    touch the kernel. Supported plot types include 1-D lines, 2-D images,
    non-uniform meshes, bar charts and 3-D surfaces/scatter, with matplotlib-
    style markers, draggable widgets and a two-tier event callback system.
  license: MIT
  license_file: LICENSE
  documentation: https://cssfrancis.github.io/anyplotlib/
  repository: https://github.com/CSSFrancis/anyplotlib

extra:
  recipe-maintainers:
    - cssfrancis
    - ericpre
