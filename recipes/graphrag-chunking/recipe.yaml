schema_version: 1

context:
  version: "3.1.1"

package:
  name: graphrag-chunking
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphrag-chunking/graphrag_chunking-${{ version }}.tar.gz
  sha256: 2e006fd150c539a42c4cb8b69509dd12f0b3cdf404cb3c6cff2de8f50a0d4605

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27.0,<2.0.0
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - graphrag-common ==3.1.1
    - pydantic >=2.10,<3.dev0

tests:
  - python:
      imports:
        - graphrag_chunking
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Chunking utilities for GraphRAG
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/graphrag-chunking/
  repository: https://github.com/microsoft/graphrag

extra:
  recipe-maintainers:
    - jan-janssen
