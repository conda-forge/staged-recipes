context:
  version: "1.4.0.post1"

package:
  name: compwa-python-constraint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/compwa-python-constraint/compwa_python_constraint-${{ version }}.tar.gz
  sha256: dea00720a05debce39f6e4f384ad04b6b9235c316d1b984a4ee543e8c6952f45

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - constraint
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/ComPWA/python-constraint
  summary: Support for handling constraint-solving problems over finite domains
  license: BSD-2-Clause
  license_file: LICENSE
  documentation: https://python-constraint.github.io/python-constraint
  repository: https://github.com/ComPWA/python-constraint

extra:
  recipe-maintainers:
    - redeboer
