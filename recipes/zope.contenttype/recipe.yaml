schema_version: 1

context:
  version: "6.0"

package:
  name: zope.contenttype
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.contenttype/zope_contenttype-${{ version }}.tar.gz
  sha256: fce58a333d9b94a128dda8ceda475c976d13a1af8a3b123b6c768eafe1e92f63

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ==78.1.1
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.contenttype
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.contenttype
  repository: https://github.com/zopefoundation/zope.contenttype
  summary: Zope contenttype
  license: ZPL-2.1
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - killua156
