schema_version: 1

context:
  version: "2.1.0"
  build_number: 0
  mpi_prefix: ${{ "mpi_" + mpi }}

package:
  name: surfatt
  version: ${{ version }}

source:
  url: https://github.com/TomoATT/SurfATT/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9a793cfd487a127d0938709c246df8a4b209e8a20a6488082b4e3ddc44725786

build:
  number: ${{ build_number }}
  string: ${{ mpi_prefix }}_h${{ hash }}_${{ build_number }}
  skip:
    - win
  script:
    - cmake ${CMAKE_ARGS} -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${PREFIX} -DBUILD_TESTS=OFF
    - cmake --build build --parallel ${CPU_COUNT}
    - cmake --install build

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ compiler("fortran") }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
  host:
    - ${{ mpi }}
    - hdf5 * nompi_*
    - eigen
    - yaml-cpp
    - spdlog
  run:
    - ${{ mpi }}

tests:
  - package_contents:
      bin:
        - SURFATT_tomo
        - SURFATT_cb_fwd
        - SURFATT_rotate_model
        - SURFATT_rotate_src_rec
        - SURFATT_rotate_topo
  - script:
      - SURFATT_tomo -h
      - SURFATT_cb_fwd -h
      - SURFATT_rotate_model -h
      - SURFATT_rotate_src_rec -h
      - SURFATT_rotate_topo -h

about:
  summary: Surface-wave adjoint travel-time tomography software
  license: GPL-3.0-only
  license_file:
    - LICENSE.txt
  homepage: https://tomoatt.com/
  repository: https://github.com/TomoATT/SurfATT
  documentation: https://tomoatt.com/

extra:
  recipe-maintainers:
    - xumi1993
