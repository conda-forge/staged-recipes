context:
  name: dbdelve
  version: "0.2.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/ShayanAbbas1/dbdelve/archive/refs/tags/v${{ version }}.tar.gz
  sha256: fed19b10133759839e3811a3cc2a6fbc5b76bec05eebf08469891296c05ac091

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - pkg-config
    - cmake
  host:
    - if: linux
      then:
        - fontconfig
        - freetype
        - expat
        - libxcb
        - libxkbcommon
        - xorg-libx11
        - wayland
        - dbus
        - libvulkan-loader

tests:
  - package_contents:
      bin:
        - dbdelve

about:
  homepage: https://github.com/ShayanAbbas1/dbdelve
  repository: https://github.com/ShayanAbbas1/dbdelve
  summary: Native, keyboard-driven SQL client for Postgres, MySQL, SQLite, SQL Server and Snowflake
  description: |
    DBDelve is a native, cross-platform SQL client built with GPUI (the GPU-accelerated
    UI framework from the Zed editor team). It supports Postgres, MySQL, SQLite,
    Snowflake and SQL Server, with SSH tunneling, per-connection access controls,
    inline cell editing with UPDATE-statement preview, schema-aware autocomplete,
    and CSV/JSON export.
  license: MIT
  license_file:
    - LICENSE
    - NOTICES.md
    - licenses/OFL-1.1.txt
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - sumanth-manchala
