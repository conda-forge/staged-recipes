schema_version: 1

context:
  version: 1.0.0a39

package:
  name: courier-pigeon
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/courier-pigeon/courier_pigeon-${{ version }}.tar.gz
  sha256: fe64cd2b547f9efcd4e0555e29530c5e447c8d758688e4478a0e7e748bb05acb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - courier = courier.cli.app:app
      - lzl = courier.cli.app:app

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - rich
    - jinja2
    - watchdog
    - prometheus_client
    - pydantic
    - kombu
    - typer
    - lexeme-type
    - opentelemetry-api >=1.20
    - opentelemetry-exporter-otlp-proto-http >=1.20
    - opentelemetry-sdk >=1.20
    - pyyaml
    - loki-logger-handler >=1.1.2,<2
  run_constraints:
    - redis-py >=4.0
    - grafanalib >=0.7.0
    - boto3 >=1.26
    - botocore >=1.29
    - kafka-python >=2.0
    - croniter *
    - httpx >=0.24
    - docker-py >=7.0
    - types-docker *
    - sphinx *
    - sphinx_rtd_theme *
    - sphinx-argparse *
    - sphinx-copybutton *
    - sphinx-autodoc-typehints *
    - sphinxcontrib-mermaid *
    - textual >=0.52.0
    - myst-parser *
    - pinkrst *
    - doc8 *
    - prettier *
    - ruff *
    - vulture *
    - mypy *
    - pytest *
    - pytest-cov *
    - pytest-timeout *
    - pytest-xdist *
    - pytest-mock *
    - types-pyyaml *
    - types-dateparser *
    - fakeredis *
    - hypothesis *
    - mutmut *
    - packaging *
    - pre-commit *

tests:
  - python:
      imports:
        - courier
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - courier --help
      - lzl --help

about:
  summary: A plugin-based, event-driven orchestration framework for building data processing pipelines
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/CIRA-GEOIPS/courier
  documentation: https://cira-geoips.github.io/courier/

extra:
  recipe-maintainers:
    - biosafetylvl5
    - jthielen
    - dgshanee
    - jsolbrig
