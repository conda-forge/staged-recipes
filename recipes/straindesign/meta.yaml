{% set name = "straindesign" %}
{% set version = "1.19.1" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e3a51ac978e07b124ddc07595b421d4cfea0c976b03426800a22948927384489

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=77
    - wheel
  run:
    - python >={{ python_min }}
    - cobra
    - matplotlib-base
    - numpy
    - optlang
    - pandas
    - psutil
    - pyscipopt
    - scipy
    - swiglpk

test:
  imports:
    - straindesign
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/klamt-lab/straindesign
  summary: Computational strain design package for the COBRApy framework
  description: |
    StrainDesign is a COBRApy-based package for the computational design of
    metabolic networks. It provides standard and advanced tools for the analysis
    and redesign of biological networks, including minimal cut sets, OptKnock,
    RobustKnock and OptCouple, built on a common mixed-integer linear programming
    core. Computations can be run with GLPK, SCIP, CPLEX or Gurobi.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://straindesign.readthedocs.io/
  dev_url: https://github.com/klamt-lab/straindesign

extra:
  recipe-maintainers:
    - VonAlphaBisZulu
