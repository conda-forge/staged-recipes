schema_version: 1
package:
  name: process-trace-studio
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Process-Trace-Studio/language-sdks-v1.0.0/process-trace-studio-sdk-source-1.0.0.zip
  sha256: db530051f5a2f646a2d3f772a084bff54753387951d0dd93a4e1098bc9d6696f
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - process_trace_studio
    pip_check: true
- script:
  - python -m pip check
  - python -c "from process_trace_studio import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Process-Trace-Studio
  summary: Windows x64 Process-Trace-Studio Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Process-Trace-Studio-C-ffi/LICENSE
  - Process-Trace-Studio-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
