context:
  version: "2.1.0"

package:
  name: secretcolors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/S/SecretColors/secretcolors-${{ version }}.tar.gz
  sha256: ad2297bb2fd5df43bd4bdcb8d7e535218931acf2ef26679fa5da4d6f7e05a6f5

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
  run:
    - python >=${{ python_min }}
  run_constraints:
    - matplotlib-base >=3.10
    - pillow >=13.0

tests:
  - python:
      imports:
        - SecretColors
        - SecretColors.cmaps
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/secretBiology/SecretColors
  summary: Color palettes, colormaps and accessible colors for Python
  description: |
    Ready-to-use palettes (IBM, Material, Adobe Spectrum, ColorBrewer, Tableau ...),
    83 matplotlib colormaps, colorblind-safe color selection, WCAG contrast checks
    and color science utilities (CIE Lab, Delta E).
  license: MIT
  license_file: LICENSE
  documentation: https://secretcolors.readthedocs.io/
  repository: https://github.com/secretBiology/SecretColors

extra:
  recipe-maintainers:
    - rohitsuratekar
