schema_version: 1

context:
  version: "6.1"
  test_modules:
    - zope.browserresource.tests.test_configure
    - zope.browserresource.tests.test_directives
    - zope.browserresource.tests.test_directory
    - zope.browserresource.tests.test_file
    - zope.browserresource.tests.test_i18nfile
    - zope.browserresource.tests.test_icondirective
    - zope.browserresource.tests.test_resource
    - zope.browserresource.tests.test_resources

package:
  name: zope.browserresource
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.browserresource/zope_browserresource-${{ version }}.tar.gz
  sha256: bd7a2579014f3c893a2139ef818c455f5ae4b865ce73c34d9874f3df069b5c92

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - zope.component >=3.8.0
    - zope.configuration
    - zope.contenttype >=4.0.1
    - zope.i18n
    - zope.interface
    - zope.location
    - zope.publisher >=3.8
    - zope.schema
    - zope.traversing >3.7

tests:
  - python:
      imports:
        - zope.browserresource
        - zope.browserresource.file
        - zope.browserresource.directory
        - zope.browserresource.resource
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest -v ${{ test_modules | join(" ") }}
    requirements:
      run:
        - zope.security
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.browserresource
  repository: https://github.com/zopefoundation/zope.browserresource
  documentation: https://zopebrowserresource.readthedocs.io
  summary: Browser resources implementation for Zope
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
