schema_version: 1

context:
  version: "1.1.1"

package:
  name: daaf-plot
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/daaf-plot/daaf_plot-${{ version }}.tar.gz
  sha256: 6f400e0bd6db13002bba1d174eae823f2aec506865c2463a23ae1a7619f21be3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.11
    - hatchling
    - pip
  run:
    - python >=3.11
    - cartopy
    - ipympl
    - ipython
    - ipywidgets
    - matplotlib-base
    - numpy
    - pandas
    - xarray

tests:
  - python:
      imports:
        - daaf_plot
      pip_check: true

about:
  summary: Personal python toolbox to make interactive plot in python notebooks
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/daaf-plot/
  repository: https://github.com/aFarchi/daaf-plot

extra:
  recipe-maintainers:
    - aFarchi
