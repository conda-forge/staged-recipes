schema_version: 1

context:
  version: "1.1.1"

package:
  name: lexeme-type
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/l/lexeme-type/lexeme_type-${{ version }}.tar.gz
  sha256: 15c6cb4c58826753347be7c8df52eda5158952a398454b61df89cdfbe96d4239

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
  run_constraints:
    - sphinx
    - sphinx_rtd_theme
    - sphinx-argparse
    - sphinx-copybutton
    - sphinx-autodoc-typehints
    - sphinxcontrib-mermaid
    - myst-parser
    - pinkrst
    - doc8
    - prettier
    - ruff
    - mypy
    - pytest
    - pytest-cov
    - pytest-xdist
    - pydantic

tests:
  - python:
      imports:
        - lexeme_type
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: This provides a no-dependency type for string manipulation of similar words (eg. Car, car, Cars, cars)
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/biosafetylvl5/lexeme-type
  documentation: https://biosafetylvl5.github.io/lexeme-type/

extra:
  recipe-maintainers:
    - biosafetylvl5
    - jthielen
