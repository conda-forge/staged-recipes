schema_version: 1

context:
  python_min: "3.9"
  version: "0.2.0"

package:
  name: pydantic-settings-yaml
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pydantic-settings-yaml/pydantic_settings_yaml-${{ version }}.tar.gz
  sha256: ee3c679ecd04ae045de100458387ff92bb54b435807ca8ac0726c141f63b1c8d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - pyyaml
    - pydantic-settings >=2.0,<3.0

tests:
  - python:
      imports:
        - pydantic_settings_yaml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Yaml support for Pydantic settings
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pydantic-settings-yaml/

extra:
  recipe-maintainers:
    - imagejan
