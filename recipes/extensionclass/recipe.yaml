schema_version: 1

context:
  version: "6.5"
  test_modules:
    - ExtensionClass.tests
    - ComputedAttribute.tests
    - MethodObject.tests

package:
  name: extensionclass
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/extensionclass/extensionclass-${{ version }}.tar.gz
  sha256: 853ab4b32f3e1810e2a0f06af7c7da51d896557a0c69c654481ec41c728db283

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - ExtensionClass
        - ExtensionClass._ExtensionClass
        - ComputedAttribute
        - ComputedAttribute._ComputedAttribute
        - MethodObject
        - MethodObject._MethodObject
      pip_check: true
  - script:
      - python -m unittest -v ${{ test_modules | join(" ") }}

about:
  homepage: https://github.com/zopefoundation/ExtensionClass
  repository: https://github.com/zopefoundation/ExtensionClass
  summary: Metaclass for subclassable extension types
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
