schema_version: 1

context:
  version: "6.5"

package:
  name: extensionclass
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/extensionclass/extensionclass-${{ version }}.tar.gz
  sha256: 853ab4b32f3e1810e2a0f06af7c7da51d896557a0c69c654481ec41c728db283

build:
  number: 0
  skip: match(python, "<3.11")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - ExtensionClass
        - ComputedAttribute
        - MethodObject
        - ExtensionClass._ExtensionClass
        - ComputedAttribute._ComputedAttribute
        - MethodObject._MethodObject
      pip_check: true

about:
  homepage: https://github.com/zopefoundation/ExtensionClass
  summary: Metaclass for subclassable extension types
  description: |
    ExtensionClass provides a metaclass that allows classes implemented in
    extension modules to be subclassed in Python. The distribution also
    ships ComputedAttribute and MethodObject.
  license: ZPL-2.1
  license_file: LICENSE.txt
  repository: https://github.com/zopefoundation/ExtensionClass

extra:
  recipe-maintainers:
    - jsmolic
