{% set python_min = "3.9" %}
{% set version = "1.0a5" %}

package:
  name: ifotools
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/i/ifotools/ifotools-{{ version }}.tar.gz
  sha256: c19b9ecc183858b8dcf8b71822489a75dbfc585ff7534866cddd9d96c3df364f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - setuptools >=77.0.3
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - sympy
    - pygments
    - finesse
    - tabulate

test:
  imports:
    - ifotools
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://pypi.org/project/ifotools/
  summary: Collection of functions useful for simulating interferometers
  license: AGPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mironleon
