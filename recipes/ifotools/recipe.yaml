schema_version: 1

context:
  version: 1.0a6
  python_min: "3.10"

package:
  name: ifotools
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/i/ifotools/ifotools-${{ version }}.tar.gz
  sha256: 3400da2750703bf3baf1d9bd677b0609698893da01a36d66dea4cd81adbc7b6f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - sympy
    - pygments
    - finesse
    - tabulate

tests:
  - python:
      imports:
        - ifotools
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"

about:
  summary: Collection of functions useful for simulating interferometers
  license: AGPL-3.0-only
  license_file: LICENSE
  homepage: https://pypi.org/project/ifotools/

extra:
  recipe-maintainers:
    - mironleon
