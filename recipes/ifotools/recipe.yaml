schema_version: 1

context:
  version: 1.0a5

package:
  name: ifotools
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/i/ifotools/ifotools-${{ version }}.tar.gz
  sha256: c19b9ecc183858b8dcf8b71822489a75dbfc585ff7534866cddd9d96c3df364f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.8
    - setuptools >=77.0.3
    - setuptools-scm >=8
    - pip
  run:
    - python >=3.8
    - sympy
    - pygments
    - finesse
    - tabulate

tests:
  - python:
      imports:
        - ifotools
      pip_check: true

about:
  summary: Collection of functions useful for simulating interferometers
  license: AGPL-3.0-only
  license_file: LICENSE
  homepage: https://pypi.org/project/ifotools/

extra:
  recipe-maintainers:
    - mironleon
