context:
  version: "2.1.0"

package:
  name: dlmmc
  version: ${{ version }}

source:
  url: https://github.com/sean-m-davis-NOAA/dlmmc/archive/refs/tags/v${{ version }}.tar.gz
  sha256: edb41b3dbdbdcb61b7eda7d32734523cd7edaeb1cc0904e3d124490b61113a85

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - cmdstanpy >=1.2
    - numpy >=1.24
    - pandas >=2.0
    - platformdirs >=4
    - xarray >=2024.1

tests:
  - python:
      python_version:
        - "${{ python_min }}.*"
        - "*"
      imports:
        - dlmmc
      pip_check: true

about:
  homepage: https://github.com/sean-m-davis-NOAA/dlmmc
  summary: Dynamical linear models for time-series analysis using CmdStanPy
  description: |
    dlmmc provides Bayesian dynamical linear models for time-series analysis,
    with CmdStanPy sampling and labeled xarray input and output.
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/sean-m-davis-NOAA/dlmmc
  repository: https://github.com/sean-m-davis-NOAA/dlmmc

extra:
  recipe-maintainers:
    - sean-m-davis-NOAA
