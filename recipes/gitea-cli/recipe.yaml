context:
  version: "1.0.0"

package:
  name: gitea-cli
  version: ${{ version }}

source:
  url: https://gitea.com/gitea/cli/archive/v${{ version }}.tar.gz
  sha256: 587669217030aabf4f1c344187832dbd1c41cf849fc4525a1cdbc11a11390c84

build:
  number: 0
  script:
    - if: unix
      then: bash $RECIPE_DIR/build.sh
      else: call %RECIPE_DIR%\build.bat

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - gt version
  - package_contents:
      bin:
        - gt
      files:
        - if: unix
          then:
            - share/bash-completion/completions/gt
            - share/fish/vendor_completions.d/gt.fish
            - share/man/man1/gt.1
            - share/zsh/site-functions/_gt
          else:
            - share/powershell/Modules/gt/gt.ps1

about:
  homepage: https://gitea.com/gitea/cli
  summary: Official command line interface for Gitea
  description: |
    gt is the official command line interface for Gitea. It manages
    repositories, issues, pull requests, releases, Actions, packages,
    organizations, and other resources on Gitea instances.
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/
  documentation: https://gitea.com/gitea/cli
  repository: https://gitea.com/gitea/cli

extra:
  recipe-maintainers:
    - romkhonglun
