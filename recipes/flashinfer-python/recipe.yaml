schema_version: 1

context:
  name: flashinfer-python
  version: 0.3.1
  cuda_build_string: cuda_${{ cuda_compiler_version | version_to_buildstring }}
  is_cross_compiling: ${{ build_platform != target_platform }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flashinfer_python-${{ version }}.tar.gz
  sha256: 992017d193dfbbc62e67401a6d5416629bf90b640872d14b7863de45e9371446
  patches:
    - patches/0001-Remove-unneeded-dependencies.patch
    - patches/0002-Include-the-BUILD_PREFIX-s-include-targets-directory.patch

build:
  number: 0
  script:
    # FlashInfer expects a space-separated list without PTX suffixes.
    # - export FLASHINFER_CUDA_ARCH_LIST=$(echo "$CF_TORCH_CUDA_ARCH_LIST" | tr ';' ' ' | sed 's/+PTX//g')
    # For debugging only build one arch.
    - export FLASHINFER_CUDA_ARCH_LIST="7.5"
    - if: x86_64
      then:
        - export CONDA_BUILD_INCLUDE_TARGETS_DIR=$BUILD_PREFIX/targets/x86_64-linux/include
    - if: aarch64
      then:
        - export CONDA_BUILD_INCLUDE_TARGETS_DIR=$BUILD_PREFIX/targets/sbsa-linux/include
    - export NVSHMEM_INCLUDE_PATH=$PREFIX/include
    - export NVSHMEM_LIBRARY_PATH=$PREFIX/lib
    - ${{ PYTHON }} -m flashinfer.aot
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip:
    - cuda_compiler_version == "None"
    - cuda_compiler_version < "13.0"
    - not linux
  string: ${{ cuda_build_string }}py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - ninja
    - if: is_cross_compiling
      then:
        - python
        - cross-python_${{ target_platform }}
        - pytorch * [build=cuda*]
  host:
    - python
    - cuda-cccl
    - cuda-cudart-dev
    - cuda-driver-dev
    - cuda-nvrtc-dev
    - cuda-bindings
    - cuda-version ${{ cuda_compiler_version }}.*
    - libcublas-dev
    - libcurand-dev
    - libnvshmem-dev
    - libcusolver-dev
    - libcusparse-dev
    - requests
    - setuptools >=77
    - packaging >=24
    - pynvml
    - pytorch * [build=cuda*]
    - pip
  run:
    - python
    - click
    - cuda-bindings
    - einops
    - filelock
    - jinja2
    - ninja
    - numpy
    - packaging >=24.2
    - pynvml
    - python-cudnn-frontend >=1.13.0
    - pytorch * [build=cuda*]
    - requests
    - tabulate
    - tqdm

tests:
  - python:
      imports:
        - flashinfer
      pip_check: true
  - script:
      - pytest ./tests
    requirements:
      run:
        - pytest
    files:
      source:
        - tests

about:
  homepage: https://flashinfer.ai/
  repository: https://github.com/flashinfer-ai/flashinfer
  documentation: https://docs.flashinfer.ai/
  summary: "FlashInfer: Kernel Library for LLM Serving"
  license: Apache-2.0 AND BSD-3-Clause AND MIT
  license_file:
    - LICENSE
    - licenses/LICENSE.flashattention3.txt
    - licenses/LICENSE.cutlass.txt
    - licenses/LICENSE.spdlog.txt
    - licenses/LICENSE.fmt.txt

extra:
  recipe-maintainers:
    - shermansiu
