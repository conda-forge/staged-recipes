schema_version: 1

context:
  name: flashinfer-python
  version: 0.7.2.post1
  cuda_build_string: cuda_${{ cuda_compiler_version | version_to_buildstring }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # The repository archive supplies the cache projects omitted from the sdist.
  - url: https://github.com/flashinfer-ai/flashinfer/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 37bcb689ddc7e68d6b6d23e1ddd1981407c61a7484cd94ea77881e0ad7c82ab7
    target_directory: upstream-source
  # The sdist supplies the release's bundled submodule headers.
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flashinfer_python-${{ version }}.tar.gz
    sha256: af60319898dcfd552ba12a34165b9dd46c0bbd83d48ce665b1df6bd6ae77e9f1

build:
  number: 0
  skip:
    - not linux
    - cuda_compiler_version != "13.0"
    - match(python, "<3.10")
    # Native cache compilation has not yet been validated with cross-python.
    - build_platform != target_platform
  string: ${{ cuda_build_string }}py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      FLASHINFER_BUILD_CUDA_VERSION: ${{ cuda_compiler_version }}
      FLASHINFER_BUILD_TARGET: ${{ target_platform }}
  python:
    entry_points:
      - flashinfer = flashinfer.__main__:cli

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - ninja
  host:
    - python
    - pip
    - setuptools >=77
    - wheel
    - cuda-version ==${{ cuda_compiler_version }}
    - cuda-cudart-dev
    - cuda-cccl
    - libcublas-dev
    - libcurand-dev
    - libcusolver-dev
    - libcusparse-dev
    - libnvshmem-dev
    - apache-tvm-ffi >=0.1.11,<0.2
    - click
    - cuda-python >=12.0
    - cutile-python >=1.4.0
    - einops
    - nccl-extensions >=0.1.0
    - nccl4py >=0.4.1
    - ninja
    - numpy
    - python-cudnn-frontend >=1.31.0
    - nvidia-cutlass-dsl >=4.6.2a0
    - nvidia-ml-py
    - packaging >=24.2
    - pytorch * [build=cuda*]
    - requests
    - tabulate
    - tqdm
  run:
    - cuda-version ==${{ cuda_compiler_version }}
    - python >=3.10,<4
    - apache-tvm-ffi >=0.1.11,<0.2
    - click
    - cuda-python >=12.0
    - cutile-python >=1.4.0
    - einops
    - nccl-extensions >=0.1.0
    - nccl4py >=0.4.1
    - ninja
    - numpy
    - python-cudnn-frontend >=1.31.0
    - nvidia-cutlass-dsl >=4.6.2a0
    - nvidia-ml-py
    - packaging >=24.2
    - pytorch * [build=cuda*]
    - requests
    - tabulate
    - tqdm

tests:
  - python:
      imports:
        - flashinfer
        - flashinfer_jit_cache
      pip_check: true
  - script:
      - python test_cache.py
      # Verify bundled JIT sources without requiring a GPU or invoking nvcc.
      - python -c "from importlib.resources import files; p = files('flashinfer') / 'data'; assert (p / 'include/flashinfer').is_dir(); assert (p / 'csrc').is_dir(); assert (p / 'cutlass/include/cutlass').is_dir(); assert (p / 'spdlog/include/spdlog').is_dir(); assert (p / 'cccl/cub/cub').is_dir()"
    files:
      recipe:
        - test_cache.py

about:
  homepage: https://flashinfer.ai/
  repository: https://github.com/flashinfer-ai/flashinfer
  documentation: https://docs.flashinfer.ai/
  summary: "FlashInfer: Kernel Library for LLM Serving"
  description: |
    FlashInfer includes CUDA kernel sources and kernel cache providers compiled
    from source for the selected CUDA version. A compatible NVIDIA GPU is
    required to execute kernels. Specializations outside the compiled cache
    require a CUDA toolkit and C++ compiler for JIT compilation. The optional
    native NIXL-EP backend is not included.
  license: Apache-2.0 AND (Apache-2.0 WITH LLVM-exception) AND BSD-2-Clause AND BSD-3-Clause AND BSL-1.0 AND MIT
  license_file:
    - LICENSE
    - licenses/LICENSE.kda-for-kda
    # The repository archive restores license texts omitted from the sdist.
    - upstream-source/licenses/LICENSE.flashattention3.txt
    - upstream-source/licenses/LICENSE.cutlass.txt
    - upstream-source/licenses/LICENSE.spdlog.txt
    - upstream-source/licenses/LICENSE.fmt.txt
    - ${{ RECIPE_DIR }}/licenses/LICENSE.cccl.txt

extra:
  recipe-maintainers:
    - shermansiu
