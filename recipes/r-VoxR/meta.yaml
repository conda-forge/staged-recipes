{% set version = "1.0.0" %}
package:
  name: r-voxr
  version: {{ version|replace("-", "_") }}

source:
  url: https://cran.r-project.org/src/contrib/VoxR_{{ version }}.tar.gz
  sha256: 4d05502e2235793bbc6c34b4e9e1975a15f7a6c0e16e2c337a09a15ed87b299b

build:
  number: 0
  merge_build_host: true
  script: R CMD INSTALL --build .
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  host:
    - r-FNN
    - r-Rfast
    - r-base
    - r-circular
    - r-data.table
    - r-dplyr
    - r-fastcluster
    - r-geometry
    - r-grDevices
    - r-raster
    - r-rgl
  run:
    - r-FNN
    - r-Rfast
    - r-base
    - r-circular
    - r-data.table
    - r-dplyr
    - r-fastcluster
    - r-geometry
    - r-grDevices
    - r-raster
    - r-rgl

test:
  commands:
    - $R -e "library('VoxR')"  # [not win]
    - "\"%R%\" -e \"library('VoxR')\""  # [win]

about:
  home: https://github.com/Blecigne/VoxR
  summary: Tools for 3D point cloud voxelisation, projection, geometrical and morphological description of trees (DBH, height, volume, crown diameter), analyses of temporal changes between different measurement times, distance based clustering and visualisation of 3D voxel clouds and 2D projection. Most analyses and algorithms provided in the package are based on the concept of space exploration and are described in Lecigne et al. (2018, <doi:10.1093/aob/mcx095>).
  license: GPL-3.0-or-later

extra:
  recipe-maintainers:
    - Marie59
