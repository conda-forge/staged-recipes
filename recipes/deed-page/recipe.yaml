context:
  version: "0.1.0"
  python_min: "3.9"

package:
  name: deed-page
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deed-page/deed_page-${{ version }}.tar.gz
  sha256: 3684a710e61c0459fbc994ee8a86ba581bb69b8bfe046c0b9c346a358b00015c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - deed-page = deed_page.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - deed_page
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - deed-page --help

about:
  homepage: https://deed.page
  summary: Official deed.page CLI and client to publish a file or folder to a permanent https URL.
  description: |
    deed-page is the official command-line tool and Python client for deed.page, a static
    host for AI agents. It publishes a file or folder to a permanent https://{slug}.deed.page/
    URL with no account. Pure Python, no runtime dependencies.
  license: MIT
  license_file: LICENSE
  documentation: https://deed.page/docs
  repository: https://github.com/f-o-x11/deed-page-python

extra:
  recipe-maintainers:
    - f-o-x11
