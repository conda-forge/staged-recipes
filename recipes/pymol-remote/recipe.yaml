schema_version: 1

context:
  name: pymol-remote
  version: 1.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pymol_remote-${{ version }}.tar.gz
  sha256: c5177133adf7bcc665077eb21ba0db0e2aa4333772fc1e4e203559365f8f8713

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pymol_remote = pymol_remote.cli:launch_pymol_with_rpc

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs ==0.4
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pymol_remote
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
        - pymol-open-source
    script:
      - pymol_remote --help

about:
  license: OpenVision
  license_file: LICENSE
  homepage: https://github.com/Croydon-Brixton/pymol-remote
  summary: A simple RPC client for sending commands and data between Python and PyMOL.

extra:
  recipe-maintainers:
    - Emrys-Merlin
