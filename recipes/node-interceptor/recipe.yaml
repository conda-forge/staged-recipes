schema_version: 1
package:
  name: node-interceptor
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/node-interceptor/language-sdks-v1.0.0/node-interceptor-sdk-source-1.0.0.zip
  sha256: 88220e2da7ced70f77df1708773b9f9c33ef9f104c9fab6c509212ccc0fe1eaf
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - node_interceptor
    pip_check: true
- script:
  - python -m pip check
  - python -c "from node_interceptor import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/node-interceptor
  summary: Windows x64 node-interceptor Python SDK with source-built native bridge
  license: LGPL-3.0-or-later
  license_file:
  - node-interceptor-C-ffi/LICENSE
  - node-interceptor-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
