# conda/recipe.yaml — authored conda-forge submission snapshot for `ember-advise`.
#
# This is the recipe submitted to conda-forge/staged-recipes; the canonical, live
# recipe is conda-forge/ember-advise-feedstock (kept current by the
# regro-cf-autotick-bot from PyPI). This in-repo copy is a frozen snapshot of the
# first submission (v0.15.0) and is intentionally NOT wired to commitizen: the bot
# carries future versions, and `source.sha256` cannot be refreshed by a version bump.
#
# The run dependencies pin the newest co-installable stack conda-forge offers for
# Python 3.12 (approved divergence, constitution v3.4.0): pytorch 2.12/2.13,
# torchvision 0.27/0.28, huggingface_hub 1.32.0. Retired when conda-forge catches up.

context:
  version: "0.15.0"
  python_min: "3.12"

package:
  name: ember-advise
  version: ${{ version }}

source:
  # The sdist filename uses the project's underscore form; the path segment keeps
  # the normalized name (the hyphen filename 404s on PyPI).
  url: https://pypi.org/packages/source/e/ember-advise/ember_advise-${{ version }}.tar.gz
  sha256: 91cf10abde277145d28e1c29e579b3dbfc21be563741438fe8fb63c20314b181

build:
  number: 0
  skip:
    - win                       # ember imports fcntl (Unix-only)
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ember = ember.cli:main
      - gut = ember.cli:main
      - ember-advise = ember.cli:main
      - ember-mcp = ember.mcp.mcp_server:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
  run:
    - python
    - pytorch >=2.12,<2.14
    - torchvision >=0.27,<0.29
    - transformers >=5.18,<6
    - safetensors >=0.8,<1
    - huggingface_hub >=1.32,<2
    - accelerate >=1.15,<2
    - pillow >=12,<13
    - fastapi >=0.142,<1
    - uvicorn-standard >=0.54,<1
    - pydantic >=2.13,<3
    - mcp >=2.3,<3
    - httpx >=0.28,<1
    - prometheus_client >=0.21,<1
    - boto3 >=1.40,<2

tests:
  - python:
      imports:
        - ember
      # The wheel's own metadata declares the upstream ranges that this environment
      # deliberately overrides (the recorded co-installability divergence), so
      # `pip check` would flag the approved divergence by design.
      pip_check: false
  - script:
      - ember --help

about:
  license: MIT
  license_file: LICENSE
  summary: "A gut feeling for coding agents: calibrated advice over MCP from Cloudflare's Clef model, run locally or on a server."
  homepage: https://shapeandshare.github.io/ember/
  repository: https://github.com/shapeandshare/ember

extra:
  recipe-maintainers:
    - joshburt
