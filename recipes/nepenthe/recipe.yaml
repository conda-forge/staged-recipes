context:
  version: "0.1.0"

package:
  name: nepenthe
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nepenthe/nepenthe-${{ version }}.tar.gz
  sha256: a3a57695fd1477224a3b3da37e2ae41f740668ac764d148182c58fbbae0383e7

build:
  number: 0
  python:
    version_independent: true
  script:
    - if: unix
      then: export PYO3_PYTHON="$PYTHON"
      else: set "PYO3_PYTHON=%PYTHON%"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: is_abi3 and not is_python_min

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - hatchling
    - hatch-rs
    - if: is_abi3
      then:
        - python-abi3
  run:
    - python

tests:
  - python:
      imports:
        - nepenthe
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - if: is_abi3
    then:
      script:
        - if: win
          then: abi3audit %PREFIX%/Lib/site-packages/nepenthe/nepenthe.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit $SP_DIR/nepenthe/nepenthe.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
      requirements:
        run:
          - abi3audit

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Forget your environment sorrows
  homepage: https://github.com/Point72/nepenthe
  repository: https://github.com/Point72/nepenthe

extra:
  recipe-maintainers:
    - timkpaine
