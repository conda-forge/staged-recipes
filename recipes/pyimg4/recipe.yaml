context:
  version: "0.8.9"

package:
  name: pyimg4
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyimg4/pyimg4-${{ version }}.tar.gz
  sha256: dd2d2a00573bdce3120d5d2a10a645727a1147930e45e67e40c79ad6061ce0dd

build:
  number: 0
  script:
    env:
      UV_DYNAMIC_VERSIONING_BYPASS: ${{ version }}
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyimg4=pyimg4.__main__:cli

requirements:
  host:
    - python
    - pip
    - hatchling
    - uv-dynamic-versioning
  run:
    - python
    - asn1 >=2.7.0,<3.0.0
    - click >=8.1.7
    - pycryptodome >=3.18.0
    - pylzss >=0.3.9
    - if: osx
      then: apple-compress >=0.2.3
      else: python-lzfse >=0.4.2

tests:
  - python:
      imports:
        - pyimg4
      pip_check: true
  - script:
      - pyimg4 --help

about:
  homepage: https://github.com/m1stadev/PyIMG4
  summary: Python library and CLI for parsing and manipulating Apple's Image4 format
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
