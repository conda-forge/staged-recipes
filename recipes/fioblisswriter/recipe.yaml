schema_version: 1

context:
  version: "0.3.0"

package:
  name: fioblisswriter
  version: ${{ version }}

source:
  url: https://github.com/nexdatas/fioblisswriter/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 68ede9a60415ea8c24a02d447ce7f30f7a0d0898a2b83edfacc8f42aedbe379b

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - pytango
    - blissdata

tests:
  - python:
      imports:
        - fioblisswriter
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - if: unix
        then:
          - test -x "$PREFIX/bin/FIOBlissWriter"
          - FIOBlissWriter --help
    requirements:
      run:
        - python ${{ python_min }}.*


about:
  homepage: https://github.com/nexdatas/fioblisswriter
  repository: https://github.com/nexdatas/fioblisswriter
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: FIO BlissData Writer Server
  description: |
    FIO BlissData Writer Server is a Tango Server which allows to write NeXus file
    from (meta)data stored in BlissData by NXSDataWriter tango server

extra:
  recipe-maintainers:
    - jkotan
