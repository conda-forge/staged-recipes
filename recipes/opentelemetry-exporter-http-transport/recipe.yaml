schema_version: 1

context:
  version: 0.66b0

package:
  name: opentelemetry-exporter-http-transport
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/opentelemetry-exporter-http-transport/opentelemetry_exporter_http_transport-${{ version }}.tar.gz
  sha256: 2c229b6593eaa22c86d9b8a15843dc23b406dbda00fb138339189aab07923b4e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.15,<2.dev0

tests:
  - python:
      imports:
        - opentelemetry.exporter.http.transport
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: OpenTelemetry Exporters HTTP transport
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-http-transport

extra:
  recipe-maintainers:
    - xhochy
    - conda-forge/opentelemetry-api
    - conda-forge/opentelemetry-sdk
