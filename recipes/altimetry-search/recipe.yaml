schema_version: 1

context:
  version: "1.0.1"

package:
  name: altimetry-search
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/altimetry-search/altimetry_search-${{ version }}.tar.gz
  sha256: d09891f89003b7a0dac2e54e9ddcbf814d8535caff2120012a1375d9f2001691

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.11
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=3.11
    - pandas
    - pyinterp

tests:
  - python:
      imports:
        - altimetry.search
      pip_check: true

about:
  summary: Orbit pass search API for SWOT altimetry (GUI-free subset of altimetry-search)
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/altimetry-search/

extra:
  recipe-maintainers:
    - annesophie-cls