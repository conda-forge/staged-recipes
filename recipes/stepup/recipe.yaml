schema_version: 1

context:
  version: "4.0.1"

package:
  name: stepup
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stepup/stepup-${{ version }}.tar.gz
  sha256: 2feccd22ff8ca1d413b9fe7fdb118516c50968d04004cc55bb8835b205c80268

build:
  number: 0
  skip:
    - win
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - stepup = stepup.core.__main__:main
      - sb = stepup.core.__main__:sb_main
      - sc-render-jinja = stepup.core.render_jinja:main

requirements:
  # Hacky workaround for weird `python 3.12.* *_debug_cpython` issue.
  ignore_run_exports:
    by_name:
      - python
  host:
    - python
    - setuptools >=77.0
    - setuptools-scm >=8.1
    - pip
  run:
    - python
    - if: linux
      then: asyncinotify >=4.0.9
    - attrs >=23.1.0
    - cattrs >=23.2.3
    - jinja2 >=3.1.6
    - parse >=1.19.1
    - path >=16.14.0
    - pyyaml >=6.0
    - rich >=13.0.0

tests:
  - python:
      imports:
        - stepup
      pip_check: true
  - script:
      - stepup --help
      - sb --help
      - sc-render-jinja --help

about:
  summary: A dynamic Python build tool for reproducible workflows
  license: LGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://pypi.org/project/stepup/
  repository: https://github.com/reproducible-reporting/stepup-core/
  documentation: https://reproducible-reporting.github.io/stepup-core/

extra:
  recipe-maintainers:
    - tovrstra
