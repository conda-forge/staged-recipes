# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.1"

package:
  name: openreview-py
  version: ${{ version }}

source:
  # the PyPI artifact: openreview-py publishes a wheel only (no sdist)
  url: https://github.com/openreview/openreview-py/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7ff67817ea92b79791a314d99568f04a964eeb2c054b0e41cc43825772f1c746

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=65.5.1,<81
    - pip
  run:
    - python >=${{ python_min }}
    - pycryptodome >=3.20,<4
    - requests >=2.32,<3
    - urllib3 >=2,<3
    - future >=1.0.0,<2
    - tqdm >=4.60,<5
    - deprecated >=1.2.0,<2
    - pylatexenc >=2.10,<3
    - tld >=0.12,<1
    - pyjwt >=2.0,<3
    - editdistance >=0.8.1,<1

tests:
  - python:
      imports:
        - openreview
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openreview/openreview-py
  repository: https://github.com/openreview/openreview-py
  documentation: https://openreview-py.readthedocs.io/
  license: MIT
  license_file: LICENSE
  summary: OpenReview API Python client library
  description: |
    openreview-py is the official Python client for the OpenReview API. It
    wraps the REST endpoints for notes, profiles, groups, invitations and
    venue configuration, so conference tooling and research scripts can read
    and write OpenReview data programmatically.

extra:
  recipe-maintainers:
    - rxm7706
