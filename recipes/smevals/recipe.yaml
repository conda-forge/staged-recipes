context:
  version: "0.2.0"
  # smevals requires python >=3.10, newer than conda-forge's global python_min
  python_min: "3.10"

package:
  name: smevals
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/s/smevals/smevals-${{ version }}.tar.gz
    sha256: 4b6d755df8c7c71c29bdb2042ce615209e1d85a27ac7af9ae91c0b6539715cc7
  # The sdist for this release does not include a LICENSE file, so fetch it
  # separately from the commit that added it upstream.
  - url: https://raw.githubusercontent.com/prime-radiant-inc/smevals/96dbcb88ce977522fd6ddd7bb4d7a85c2fcc798e/LICENSE
    sha256: c0e6dbbe3e403d9a1de70b374c7188376ec449d1ffb1bc791451d2632b90ddad
    file_name: LICENSE

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - smevals = smevals.cli:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.0,<0.12.0
  run:
    - python >=${{ python_min }}
    - click >=8.4.2
    - pyyaml >=6.0.3

tests:
  - python:
      imports:
        - smevals
      python_version: ${{ python_min }}.*
      pip_check: true
  - script:
      - smevals --help

about:
  homepage: https://github.com/prime-radiant-inc/smevals
  summary: A framework for running evals against small (and large) models
  license: MIT
  license_file: LICENSE
  repository: https://github.com/prime-radiant-inc/smevals

extra:
  recipe-maintainers:
    - tdsmith
