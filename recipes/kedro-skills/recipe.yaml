context:
  version: 0.2.0

package:
  name: kedro-skills
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/k/kedro-skills/kedro_skills-${{ version }}.tar.gz
  sha256: 01f006d8462bf621c714b978dae2d21fd7bd7d43ef78decec0764345e088253e

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - hatchling
  - pip
  run:
  - python >=${{ python_min }},<3.15
  - click >=8.0
  - kedro >=1.0
  - pyyaml >=6.0

tests:
  - python:
      imports:
        - kedro_skills
      pip_check: true
      python_version:
      - ${{ python_min }}.*
      - '*'

about:
  summary: Distribute AI coding skills to Kedro projects.
  homepage: https://github.com/kedro-org/kedro-skills
  license: Apache-2.0
  license_file:
  - LICENSE

extra:
  recipe-maintainers:
    - jsmolic
