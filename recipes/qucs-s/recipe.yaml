context:
  version: "26.1.1"

package:
  name: qucs-s
  version: ${{ version }}

source:
  # Release-tag auto-archives do not include the git submodules qucs-s's
  # CMake requires; add them pinned to the exact SHAs of the release tag.
  - url: https://github.com/ra3xdh/qucs_s/archive/refs/tags/${{ version }}.tar.gz
    sha256: bf4ccff9e975680129ba850c5045145ad121f4e0f7eef86799398abe2f68eb24
  - url: https://github.com/andresmmera/qucs-s-spar-viewer/archive/f231999a5c83125c3fabe36684c84b0207f476ae.tar.gz
    sha256: 156c679b896fbc6540463d58074ee97b6c66d482c4a3ae66265cd96e0b92bdde
    target_directory: qucs-s-spar-viewer
  - url: https://github.com/ra3xdh/qucsator_rf/archive/3971737dc6e446f8e3262d20e3087fa392299a7a.tar.gz
    sha256: 6cde86f95a428af8b2cabfe6bb38f4a6612e4b994538c6c99c33e0a966735a9f
    target_directory: qucsator_rf
  - url: https://github.com/arhiv6/rxcalc/archive/8ece6c4876e83771ad65f1b7bdbd938069f95430.tar.gz
    sha256: 5e4c1bdda397e824d16f65c94e5af875e367ca60ec7ca24b7b323946d2859807
    target_directory: rxcalc

build:
  number: 0
  skip:
    - win
    - osx
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
    - bison
    - flex
    - gperf
    - dos2unix
  host:
    - qt6-main
    - qt6-charts
  run:
    - qt6-charts

tests:
  - script:
      - QT_QPA_PLATFORM=offscreen qucs-s --version

about:
  homepage: https://ra3xdh.github.io/
  repository: https://github.com/ra3xdh/qucs_s
  # qucs-s: GPL-2.0-or-later; bundled submodule binaries: qucsator_rf GPL-2.0,
  # rxcalc GPL-3.0, qucs-s-spar-viewer GPL-3.0
  license: GPL-2.0-or-later AND GPL-3.0-or-later
  license_file:
    - COPYING
    - qucsator_rf/COPYING
    - rxcalc/LICENSE
    - qucs-s-spar-viewer/LICENSE
  summary: Quite universal circuit simulator with SPICE
  description: |
    Qucs-S provides a fancy graphical user interface for a number of popular
    circuit simulation engines. Qucs-S contains instruments for schematic
    capture, visualization and provides different passive and active
    components including device library.

extra:
  recipe-maintainers:
    - duyhieubui
