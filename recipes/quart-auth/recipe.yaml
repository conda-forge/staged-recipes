schema_version: 1

context:
  version: "0.12.0"

package:
  name: quart-auth
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/q/quart-auth/quart_auth-${{ version }}.tar.gz
  sha256: 245e0e52417f29a344cbbd59028b0728a43c035b0795eeab08acb1e84ae1e728

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - quart >=0.18

tests:
  - python:
      imports:
        - quart_auth
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - pytest
        - pytest-asyncio
    script:
      - pytest -vvv tests
    files:
      source:
        - tests/

about:
  summary: A Quart extension to provide secure cookie authentication
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/quart-auth/

extra:
  recipe-maintainers:
    - jsmolic
