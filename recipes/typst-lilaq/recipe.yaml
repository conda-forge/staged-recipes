schema_version: 1

context:
  name: lilaq
  version: "0.6.0"

package:
  name: typst-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/lilaq-project/lilaq/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8250843a53f2743408ce2bb7e18592c8b2c23fbd7aba4be688e491a5aae389eb

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/share/typst/packages/preview/${{ name }}/${{ version }}
    - cp -r src typst.toml README.md LICENSE* $PREFIX/share/typst/packages/preview/${{ name }}/${{ version }}/

requirements:
  run:
    - typst >=0.13.0
    - typst-elembic ==1.1.1
    - typst-tiptoe ==0.4.0
    - typst-zero ==0.6.1

tests:
  - package_contents:
      files:
        - share/typst/packages/preview/${{ name }}/${{ version }}/typst.toml
        - share/typst/packages/preview/${{ name }}/${{ version }}/src/lilaq.typ
  - script:
      # Use an empty package cache so the test fails if typst downloads the package instead of using the local one
      - export TYPST_PACKAGE_CACHE_PATH=$PWD/typst-cache
      - typst compile test.typ test.pdf
      - test -f test.pdf
      - test ! -e typst-cache
    files:
      recipe:
        - test.typ

about:
  license: MIT
  license_file:
    - LICENSE
  summary: Scientific data visualization in Typst.
  homepage: https://typst.app/universe/package/${{ name }}
  repository: https://github.com/lilaq-project/lilaq

extra:
  recipe-maintainers:
    - MarkusJungQC
