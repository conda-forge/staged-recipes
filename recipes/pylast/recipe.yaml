schema_version: 1

context:
  version: "7.1.0"

package:
  name: pylast
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylast/pylast-${{ version }}.tar.gz
  sha256: 0c1fc381d649f256842c665ede52591d3b32789e281cd9b5601c01d2dc3a2d88

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-vcs
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}
    - httpx2  
    
tests:
  - python:
      imports:
        - pylast
      pip_check: true

about:
  summary: A Python interface to Last.fm and Libre.fm
  license: Apache-2.0
  license_file:
    - COPYING
    - LICENSE.txt
  homepage: https://github.com/pylast/pylast
  repository: https://github.com/pylast/pylast

extra:
  recipe-maintainers:
    - HeavyTony2
