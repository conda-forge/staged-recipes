schema_version: 1

context:
  version: "0.9.0"

package:
  name: tonio
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/t/tonio/tonio-${{ version }}.tar.gz
    sha256: e0b693aac027cc5d3056c2a5555b5137ce07fe12dd61068eb018abbc5e802389

build:
  number: 0
  skip:
    - win
    - match(python, "<3.13")  # bump back to 3.14 once feedstock is created
  script:
    - exit 1  # remove this and add 3.14 migration file once feedstock is created
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - python
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - maturin >=1.8,<1.9
  host:
    - maturin >=1.8,<1.9
    - pip
    - python
  run:
    - python

tests:
  - python:
      imports: tonio
      pip_check: true

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/gi0baro/tonio
  repository: https://github.com/gi0baro/tonio
  summary: A multi-threaded async runtime for Python.

extra:
  recipe-maintainers:
    - davidbrochart
