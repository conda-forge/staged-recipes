schema_version: 1

context:
  version: "0.5.0"
  python_min: "3.11"

package:
  name: kawin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kawin/kawin-${{ version }}.tar.gz
  sha256: 5ac4417dc42cf5d8117283a72b15b6fb1525e91d42143e0a2c95ec54e63597ad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - setuptools-scm >=8.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.3
    - numpy >=2.0
    - pycalphad >=0.11
    - espei
    - scipy
    - setuptools-scm >=8.0

tests:
  - python:
      imports:
        - kawin
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Tool for simulating precipitation using the KWN model coupled with Calphad.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://kawin.org

extra:
  recipe-maintainers:
    - bocklund
    - nury12n
