schema_version: 1

context:
  version: "1.3.3"

package:
  name: pywavefront
  version: ${{ version }}

source:
  url: https://github.com/pywavefront/PyWavefront/archive/refs/tags/PyWavefront-${{ version }}.tar.gz
  sha256: 09fd4cd1fb78e9659ee33b82b1b5c7169df97f908d50cd3febfce26c6c61903d

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --no-build-isolation -vv .

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pywavefront
      pip_check: true

about:
  homepage: https://github.com/pywavefront/PyWavefront
  repository: https://github.com/pywavefront/PyWavefront
  license: BSD
  license_file: LICENSE
  summary: Python library for importing Wavefront .obj files
  description: |
    Python library for importing Wavefront .obj files
  documentation: https://github.com/pywavefront/PyWavefront

extra:
  recipe-maintainers:
    - langmm
