schema_version: 1

context:
  version: "1.4.12"

package:
  name: r-aisdk
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/aisdk_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/aisdk/aisdk_${{ version }}.tar.gz
  sha256: 07f09a209caa6a308221aafe2770276e104884caa55e3fd158d79e4930dc2f8e

build:
  number: 0
  noarch: generic
  script: R CMD INSTALL --build . ${R_ARGS}

requirements:
  host:
    - r-base
    - r-base64enc
    - r-callr
    - r-curl
    - r-digest
    - r-httr2
    - r-jsonlite
    - r-memoise
    - r-processx
    - r-r6
    - r-rlang
    - r-yaml
  run:
    - r-base >=4.1.0
    - r-base64enc
    - r-callr
    - r-curl
    - r-digest
    - r-httr2
    - r-jsonlite
    - r-memoise
    - r-processx
    - r-r6
    - r-rlang
    - r-yaml

tests:
  - r:
      libraries:
        - aisdk

about:
  homepage: https://yulab-smu.top/aisdk/
  repository: https://github.com/YuLab-SMU/aisdk
  summary: Unified Interface for AI Model Providers
  description: |
    An AI toolkit for R with a single interface to many model providers
    ('OpenAI', 'Anthropic' and others), request interception, retries with
    exponential backoff, 'MCP' support, multi-agent orchestration and
    reusable skills. Used by clusterProfiler.
  license: MIT
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/MIT
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
    - musharna
