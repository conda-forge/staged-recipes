context:
  version: "0.7.0"

package:
  name: pysad
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pysad/pysad-${{ version }}.tar.gz
  sha256: 565de8e2fb3b57a832b22332e20d06fefa4941365c15f2a16d9d628b2e6f94e7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.22.4
    - scikit-learn >=1.4.2
    - scipy >=1.13.0

tests:
  - python:
      imports:
        - pysad
        - pysad.core
        - pysad.evaluation
        - pysad.models
        - pysad.statistics
        - pysad.transform
        - pysad.utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/selimfirat/pysad
  summary: Streaming anomaly detection in Python
  description: |
    PySAD detects anomalies in data streams. Its detectors learn from one point at
    a time and score each point, with bounded memory. It also has preprocessing,
    postprocessing, ensembles, probability calibration and prequential evaluation
    for streams.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://pysad.readthedocs.io/
  repository: https://github.com/selimfirat/pysad

extra:
  recipe-maintainers:
    - selimfirat
