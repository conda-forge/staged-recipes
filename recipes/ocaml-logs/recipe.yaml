schema_version: 1

context:
  name: logs
  version: "0.10.0"
  findlib_version: "1.9.8"

  library: ${{ "Library/" if not unix else "" }}
  # ocaml matchspec tail: version, plus the gcc_ (MinGW) track on non-unix
  ocaml_spec: ${{ ocaml_compiler_version ~ (".*" if unix else ".* gcc_*") }}

package:
  name: ocaml-${{ name }}
  version: ${{ version }}

source:
  # findlib is built privately on all platforms (never installed): the cf ocaml-findlib build is stale
  - url: https://github.com/ocaml/ocamlfind/archive/refs/tags/findlib-${{ findlib_version }}.tar.gz
    sha256: d6899935ccabf67f067a9af3f3f88d94e310075d13c648fa03ff498769ce039d
    target_directory: findlib
  - url: https://erratique.ch/software/${{ name }}/releases/${{ name }}-${{ version }}.tbz
    sha256: 760ec291c128d75b74826091337764f925b5ca414b02e2d336a0b37bf30df4ea
    target_directory: ${{ name }}

build:
  number: 0
  script: bash ${{ RECIPE_DIR }}/build.sh --with-js_of_ocaml-compiler false --with-fmt true --with-cmdliner true --with-lwt true --with-base-threads true
  # python is build-only; avoid per-python variants
  variant:
    ignore_keys:
      - python

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
      else:
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
    - ${{ compiler("ocaml") }}
    # compiler("ocaml") renders no toolchain track; name the gcc_ (MinGW) one on non-unix
    - ocaml_${{ target_platform }} ${{ ocaml_spec }}
    # ocaml pin selects a build that ships ocamlbuild.cmo (_2 did not)
    - ocamlbuild 0.16.*
    - python
    - if: unix
      then:
        - make
      else:
        - m2-make
        - m2-bash
        - m2-coreutils
        - m2-findutils
        - m2-grep
        - m2-sed
  host:
    - ocaml ${{ ocaml_spec }}
    - ocaml-topkg >=1.1.1
    - ocaml-fmt >=0.11.0
    - ocaml-cmdliner >=2.1.1
    - ocaml-lwt >=6.1.2
  run:
    - ocaml ${{ ocaml_spec }}
    - ocaml-topkg >=1.1.1
    - ocaml-fmt >=0.11.0
    - ocaml-cmdliner >=2.1.1
    - ocaml-lwt >=6.1.2

tests:
  - package_contents:
      files:
        - ${{ library }}lib/ocaml/${{ name }}/META
        - ${{ library }}lib/ocaml/${{ name }}/lwt/logs_lwt.cmi
  - script: bash testing/test_ocaml_lib.sh logs
    files:
      recipe:
        - testing/test_ocaml_lib.sh
    requirements:
      run:
        - ocaml ${{ ocaml_spec }}
        - if: not unix
          then:
            - m2-bash
            - m2-coreutils

about:
  homepage: https://erratique.ch/software/logs
  repository: https://github.com/dbuenzli/logs
  license: ISC
  license_file: logs/LICENSE.md
  summary: Logging infrastructure for OCaml

extra:
  recipe-maintainers:
    - MementoRC
    - ManuelLerchner
