# Notes:
#  - findlib is built PRIVATELY into ${SRC_DIR}/_tools (see building/build_findlib.sh)
#    and is never published: the conda-forge ocaml-findlib feedstock is unmaintained.
#  - The library is built with topkg (`ocaml pkg/pkg.ml build`) and installed
#    with opam-installer from the conda-forge `opam` package.
schema_version: 1

context:
  name: logs
  version: "0.10.0"
  findlib_version: "1.9.8"

  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  c_toolchain: ${{ "" if unix else "gcc_*" }}

package:
  name: ocaml-${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/ocaml/ocamlfind/archive/refs/tags/findlib-${{ findlib_version }}.tar.gz
    sha256: d6899935ccabf67f067a9af3f3f88d94e310075d13c648fa03ff498769ce039d
    target_directory: findlib
  - url: https://erratique.ch/software/${{ name }}/releases/${{ name }}-${{ version }}.tbz
    sha256: 760ec291c128d75b74826091337764f925b5ca414b02e2d336a0b37bf30df4ea
    target_directory: ${{ name }}

build:
  number: 0
  script: bash ${{ RECIPE_DIR }}/building/build_topkg_pkg.sh --with-js_of_ocaml-compiler false --with-fmt true --with-cmdliner ${{ "false" if win else "true" }} --with-lwt true --with-base-threads true

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
      else:
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
    # Windows: conda-forge ocaml has gcc_ and vs2022_ tracks; these recipes use the gcc (MinGW) track only.
    - ocaml 5.4.* ${{ c_toolchain }}
    # ocamlbuild is pinned to build _3 (ships ocamlbuild.cmo); _2 fails at mtime. Fail-fast guard against stale repodata; drop once _3 is universally resolved.
    - ocamlbuild 0.16.* *_3
    - opam
    - ${{ m2 }}make
    - if: not unix
      then:
        - m2-bash
  host:
    - ocaml 5.4.* ${{ c_toolchain }}
    - ocaml-topkg >=1.1.1
    - ocaml-fmt >=0.11.0
    - ocaml-lwt
    - if: not win
      then:
        - ocaml-cmdliner >=2.1.1
  run:
    - ocaml 5.4.* ${{ c_toolchain }}
    - ocaml-topkg >=1.1.1
    - ocaml-fmt >=0.11.0
    - ocaml-lwt
    - if: not win
      then:
        - ocaml-cmdliner >=2.1.1

tests:
  - package_contents:
      files:
        - ${{ library }}lib/ocaml/${{ name }}/META
        - ${{ library }}lib/ocaml/${{ name }}/lwt/logs_lwt.cmxa
  - script: bash testing/test_ocaml_lib.sh logs
    files:
      recipe:
        - testing/test_ocaml_lib.sh
    requirements:
      run:
        - ocaml 5.4.* ${{ c_toolchain }}
        - if: not unix
          then:
            - m2-bash

about:
  homepage: https://erratique.ch/software/logs
  repository: https://github.com/dbuenzli/logs
  license: ISC
  license_file: logs/LICENSE.md
  summary: Logging infrastructure for OCaml

extra:
  recipe-maintainers:
    - MementoRC
    - ManuelLerchner
