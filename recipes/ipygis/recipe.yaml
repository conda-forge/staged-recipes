schema_version: 1

context:
  version: "0.1.0"

package:
  name: ipygis
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/i/ipygis/ipygis-${{ version }}.tar.gz
    sha256: 5c987b8a640ba92ff14a255ad2f02bd738eea2670cb000738dc30a59619c2ce3

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - nodejs <25
    - hatchling >=1.32.0
    - hatch-jupyter-builder >=0.8.3
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}
    - anyio >=4.15.0
    - ipython
    - ipywidgets >=8.1.9
    - numpy
    - traitlets
    - xarray
    - zarr

tests:
  - python:
      imports: ipygis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/davidbrochart/ipygis
  summary: A bridge to GIS libraries running in the browser

extra:
  recipe-maintainers:
    - davidbrochart
