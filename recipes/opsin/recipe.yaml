  - url: https://github.com/dan2097/opsin/releases/download/${{ version }}/opsin-cli-${{ version }}-jar-with-dependencies.jar
    sha256: c2e29326c281f87b59a05d934d8589adac6e9d17b95b984931b3e739111b360f
    file_name: opsin.jar
  # Licence texts of the jar's contents that are not inside the jar.
  # build.py adds the texts that are inside the jar.
  - url: https://raw.githubusercontent.com/dan2097/opsin/${{ version }}/LICENSE.txt
    sha256: aeeafe2053175a5b34cb2ded4410581ccd36b82c734315be1a7a81c6f9fb4834
    file_name: LICENSE.txt
    target_directory: licenses/opsin
  # dk.brics automaton 1.12-4 (the commit that sets version 1.12-4)
  - url: https://raw.githubusercontent.com/cs-au-dk/dk.brics.automaton/75db9df045892a4c59b8994f51e5cbc60be7fdc9/COPYING
    sha256: 033d2207533e95d29a13844a13956d1f355b08aaf95bacf493ce606c1bbe0b11
    file_name: COPYING
    target_directory: licenses/automaton
  - url: https://raw.githubusercontent.com/FasterXML/stax2-api/stax2-api-4.2.2/src/main/resources/META-INF/LICENSE
    sha256: b3e969d18f690ab8783e4ec77729c9fea85691b8090c550bb3c626dda5e837a7
    file_name: LICENSE
    target_directory: licenses/stax2-api
  # MSV (msv-core and xsdlib 2022.7), copied by woodstox-core into com/ctc/wstx/shaded
