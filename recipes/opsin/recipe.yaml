  - url: https://raw.githubusercontent.com/IUPAC-InChI/InChI/v1.07.2/LICENSE
    sha256: 86ed3c36c70eb57826374cc14b199cae09fec201d07cd369a50fcaa9905244af
    file_name: LICENSE
    target_directory: licenses/inchi

build:
  number: 0
  noarch: generic
  script:
    interpreter: python
    file: build.py
  variant:
    # python only runs build.py; the package is the same for every python
    ignore_keys:
      - python

requirements:
  build:
    - python
  run:
    - openjdk >=${{ openjdk_min }}

tests:
  - package_contents:
      files:
        - share/opsin/opsin.jar
        - bin/opsin
        - bin/opsin.bat
  - requirements:
      run:
        - openjdk ${{ openjdk_min }}.*
    script:
      - opsin --help
      - if: unix
        then:
          - test "$(echo ethanol | opsin -osmi)" = "C(C)O"
          - test "$(echo '(2R)-butan-2-ol' | opsin -o smi)" = "C[C@H](CC)O"
          # StdInChIKey output runs the InChI native library that ships inside the jar
          - test "$(echo ethanol | opsin -o stdinchikey)" = "LFQSCWFLJHTTHZ-UHFFFAOYSA-N"
      - if: win
        then:
          - echo ethanol | opsin -osmi | findstr /x /c:"C(C)O"
          - echo ethanol | opsin -o stdinchikey | findstr /x /c:"LFQSCWFLJHTTHZ-UHFFFAOYSA-N"
  - script:
      - opsin --help
      - if: unix
        then:
          - test "$(echo ethanol | opsin -osmi)" = "C(C)O"
          - test "$(echo ethanol | opsin -o stdinchikey)" = "LFQSCWFLJHTTHZ-UHFFFAOYSA-N"
      - if: win
        then:
          - echo ethanol | opsin -osmi | findstr /x /c:"C(C)O"
          - echo ethanol | opsin -o stdinchikey | findstr /x /c:"LFQSCWFLJHTTHZ-UHFFFAOYSA-N"

about:
  summary: Open Parser for Systematic IUPAC nomenclature (chemical name to structure)
  description: |
    OPSIN converts systematic chemical names (IUPAC and CAS style) to
    structures, written as SMILES, CML or InChI. This package ships the
    official OPSIN command-line jar and an `opsin` command that runs it.
    The jar is installed at `$PREFIX/share/opsin/opsin.jar`, a path that
    does not change between versions, so other programs can load it.
    Java options can be passed with the `JAVA_OPTS` environment variable.
  license: MIT AND Apache-2.0 AND Apache-1.1 AND BSD-2-Clause AND BSD-3-Clause AND LGPL-2.1-or-later AND (Apache-2.0 OR LGPL-2.1-or-later)
  license_file:
    - licenses/
  homepage: https://github.com/dan2097/opsin
  repository: https://github.com/dan2097/opsin
  documentation: https://github.com/dan2097/opsin/blob/master/README.md

extra:
  recipe-maintainers:
    - Kohulan
