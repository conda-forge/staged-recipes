  - url: https://raw.githubusercontent.com/dan2097/jna-inchi/jna-inchi-1.3.1/licenseheader.txt
    sha256: df5c56039cdd2e464c42c186851412d7ce66681c33ecfaa9bf184f0e6bb81683
