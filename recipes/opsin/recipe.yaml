    sha256: 69d5cba12ff92af30f8696db0bf96da7280167bf2e72e1873b894071b2a87d20
    file_name: NOTICE.txt
    target_directory: licenses/log4j
  - url: https://raw.githubusercontent.com/java-native-access/jna/5.10.0/LICENSE
    sha256: 521bb271ac56e0e29a1b1b688b94af17d00d378fc8e63478d8c8b2a7c4a229d0
    file_name: LICENSE
    target_directory: licenses/jna
  # libffi is compiled into JNA's native libraries
  - url: https://raw.githubusercontent.com/java-native-access/jna/5.10.0/native/libffi/LICENSE
    sha256: a61d06e8f7be57928e71e800eb9273b05cb8868c484108afe41e4305bb320dde
    file_name: libffi-LICENSE
