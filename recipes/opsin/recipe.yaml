    sha256: 51ef06c12bb08517357c6720b319771f94e8ddf633bf256c36e1b42e642178dd
    file_name: xsdlib-license.txt
    target_directory: licenses/msv
  # xsdlib's regular-expression code comes from Apache Xerces
  - url: https://raw.githubusercontent.com/xmlark/msv/msv-2022.7/docs/xsdlib/Apache-LICENSE-1.1.txt
    sha256: 1417075f2e81545660185430ec7f67847d3bcea97b060866c436d63ebf4be0d4
