schema_version: 1
context:
  version: 3.3.0
package:
  name: ttkthemes
  version: ${{ version }}
source:
  url: https://pypi.org/packages/source/t/ttkthemes/ttkthemes-${{ version }}.tar.gz
  sha256: a0b74087aa3bfa2ef159599376642f288d5c624073c6aaceb4d16359de0851b6
build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools >=77
  - wheel
  run:
  - python >=${{ python_min }}
  - pillow >=5.0.0
  - tk
tests:
- python:
    imports:
    - ttkthemes
    pip_check: true
    python_version:
    - ${{ python_min }}.*
    - '*'
- requirements:
    run:
    - python ${{ python_min }}.*
  script:
  - python -c "from importlib.metadata import version; assert version('ttkthemes') == '${{ version }}'"
  - python -c "from ttkthemes import ThemedTk, ThemedStyle; assert callable(ThemedTk); assert callable(ThemedStyle)"
about:
  homepage: https://github.com/TkinterEP/ttkthemes
  repository: https://github.com/TkinterEP/ttkthemes
  summary: A collection of themes for ttk Tkinter widgets
  license: GPL-3.0-or-later
  license_file: LICENSE.md
extra:
  recipe-maintainers:
  - EinarOlafsson
