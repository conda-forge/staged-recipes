schema_version: 1

context:
  version: "2.1.2"
  python_min: "3.10"

package:
  name: thermocouples
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/thermocouples/thermocouples-${{ version }}.tar.gz
  sha256: dee564ba7710c6d1e6726d582814c76ac6f00f7fc7b69b95522ea4b525cef443

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - thermocouples
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Object-oriented thermocouple conversion library
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/RogerGdot/thermocouples
  repository: https://github.com/RogerGdot/thermocouples

extra:
  recipe-maintainers:
    - wolfv
