schema_version: 1

context:
  name: aiida-chemshell
  version: "0.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace("-", "_") }}-${{ version }}.tar.gz
  sha256: 84c62f6808cdabbe7730468b4259d5945db54238defbccd7c8f9642366632afc

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiida-core >=2.5

tests:
  - python:
      imports:
        - aiida_chemshell
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      # Confirm the ChemShell CalcJob entry point is registered with AiiDA.
      - verdi plugin list aiida.calculations chemshell
    requirements:
      run:
        - aiida-core >=2.5

about:
  homepage: https://github.com/stfc/aiida-chemshell
  license: BSD-3-Clause
  license_file: LICENSE
  summary: AiiDA workflow plugin for the ChemShell chemical modelling software package
  description: |
    AiiDA plugin for the ChemShell multiscale computational chemistry package,
    providing CalcJobs, parsers and workflows (geometry optimisation, isolated
    atomic energies and batch processing) for running ChemShell through AiiDA.
  documentation: https://stfc.github.io/aiida-chemshell
  repository: https://github.com/stfc/aiida-chemshell

extra:
  recipe-maintainers:
    - BTSpeake
