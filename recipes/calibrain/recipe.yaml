context:
  version: "1.1.0"

package:
  name: calibrain
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/calibrain/calibrain-${{ version }}.tar.gz
  sha256: 568a379b33ac62d4300f74e880e675ff049db7b229b36aad7572307ce2338650

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.23
    - scipy >=1.9
    - pandas >=1.5
    - scikit-learn >=1.1
    - mne-base >=1.4
    - pot >=0.9
    - nibabel >=4.0
    - pyyaml >=6.0
    - h5py >=3.7
    - matplotlib-base >=3.5
    - joblib >=1.2
    - pooch >=1.6

tests:
  - python:
      imports:
        - calibrain
        - calibrain.workflows
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/braindatalab/CaliBrain
  summary: "CaliBrain: A Python toolbox for uncertainty quantification, calibration, and benchmarking in Bayesian M/EEG inverse source imaging"
  description: |
    CaliBrain simulates EEG/MEG data, estimates sources with Bayesian inverse
    solvers (Gamma-MAP and Bayesian minimum norm), and evaluates and recalibrates
    the uncertainty of the estimates.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://calibrain.readthedocs.io/
  repository: https://github.com/braindatalab/CaliBrain

extra:
  recipe-maintainers:
    - orabe
