schema_version: 1

context:
  version: "0.1.50"

package:
  name: tableau-api-lib
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/t/tableau-api-lib/tableau_api_lib-${{ version }}.tar.gz
    sha256: c85e81c2b245ddd42430dd71495691b8dd218c4fc87ddccc0aa3b10594a89d72
  - url: https://raw.githubusercontent.com/divinorum-webb/tableau-api-lib/99a1d3c2a4d7dc20d1c4a619d58cc756ace1db41/LICENSE
    sha256: 3f30416a0f02edc4e157a6dfebee6184b3c4e683176c662333c99495834c332d
    file_name: LICENSE

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - bleach >=3.0
    - packaging
    - pandas
    - requests >2
    - requests-toolbelt >=0.9.0
    - typeguard
    - urllib3

tests:
  - python:
      imports:
        - tableau_api_lib
        - tableau_api_lib.tableau_server_connection
        - tableau_api_lib.utils.pagination
        - tableau_api_lib.utils.querying
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/divinorum-webb/tableau-api-lib
  repository: https://github.com/divinorum-webb/tableau-api-lib
  license: MIT
  license_file: LICENSE
  summary: Call any method listed in Tableau Server's REST API documentation
  description: |
    tableau-api-lib wraps Tableau Server's REST API so every documented
    endpoint is reachable from Python. It handles signing in, paging through
    results and swapping between API versions, and returns responses either
    raw or as pandas DataFrames for querying sites, projects, workbooks,
    users and groups.

extra:
  recipe-maintainers:
    - killua156
