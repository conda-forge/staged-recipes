schema_version: 1

context:
  version: "3.23.1"

package:
  name: nxswriter
  version: ${{ version }}

source:
  url: https://github.com/nexdatas/nxsdatawriter/archive/refs/tags/v${{ version }}.tar.gz
  sha256: eefbc0f2ead0ead209cc57f13834b6571657c8e7c9668f58e26f5e21f042beab

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - argcomplete
    - lxml
    - pytango
    - pytz
    - nxstools
    - pymysql
    - mysql-client
    - psycopg2

tests:
  - python:
      imports:
        - nxswriter
        - nxswriter.ClientSource
        - nxswriter.DataHolder
        - nxswriter.DataSourceFactory
        - nxswriter.DataSourcePool
        - nxswriter.DataSources
        - nxswriter.DBaseSource
        - nxswriter.DecoderPool
        - nxswriter.EAttribute
        - nxswriter.EField
        - nxswriter.EGroup
        - nxswriter.Element
        - nxswriter.ElementThread
        - nxswriter.ELink
        - nxswriter.Errors
        - nxswriter.EStrategy
        - nxswriter.EVirtualField
        - nxswriter.FElement
        - nxswriter.FetchNameHandler
        - nxswriter.H5Elements
        - nxswriter.InnerXMLParser
        - nxswriter.Metadata
        - nxswriter.NexusXMLHandler
        - nxswriter.NXSFromXML
        - nxswriter.NXSWriter
        - nxswriter.PyEvalSource
        - nxswriter.Release
        - nxswriter.StreamSet
        - nxswriter.TangoDataWriter
        - nxswriter.TangoSource
        - nxswriter.ThreadPool
        - nxswriter.Types
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - if: unix
        then:
          - test -x "$PREFIX/bin/NXSDataWriter"
          - NXSDataWriter --help
    requirements:
      run:
        - python ${{ python_min }}.*


about:
  homepage: https://github.com/nexdatas/nxsdatawriter
  repository: https://github.com/nexdatas/nxsdatawriter
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: NeXus Data Writer tango server
  description: |
    NXSDataWriter is a Tango server which stores NeXuS Data in H5 files
    and/or publishes (meta)data to blissdata redis server.
    The server provides storing data from other Tango devices,
    various databases as well as passed by a user client via JSON strings
    and python snippets.

extra:
  recipe-maintainers:
    - jkotan
