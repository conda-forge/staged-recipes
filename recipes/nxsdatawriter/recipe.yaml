schema_version: 1

context:
  version: "3.23.0"

package:
  name: nxswriter
  version: ${{ version }}

source:
  url: https://github.com/nexdatas/nxsdatawriter/archive/refs/tags/v${{ version }}.tar.gz
  sha256: eece29af52763acab35fb02c5d1fcda519e3908401f644959f65b2825a871934

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - argcomplete
    - lxml
    - pytango
    - pytz
    - nxstools
    - pymysql
    - mysql-client
    - psycopg2

tests:
  - python:
      imports:
        - nxswriter
        - nxswriter.NXSDataWriter

      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - if: unix
        then:
          - test -x "$PREFIX/bin/NXSDataWriter"
          - NXSDataWriter --help
    requirements:
      run:
        - python ${{ python_min }}.*


about:
  homepage: https://github.com/nexdatas/nxsdatawriter
  repository: https://github.com/nexdatas/nxsdatawriter
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: NeXus Data Writer tango server
  description: |
    NXSDataWriter is a Tango server which stores NeXuS Data in H5 files
    and/or publishes (meta)data to blissdata redis server.
    The server provides storing data from other Tango devices,
    various databases as well as passed by a user client via JSON strings
    and python snippets.

extra:
  recipe-maintainers:
    - jkotan
