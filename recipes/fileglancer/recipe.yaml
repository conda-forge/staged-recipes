schema_version: 1

context:
  version: "4.1.0"

package:
  name: fileglancer
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/f/fileglancer/fileglancer-${{ version }}.tar.gz
  sha256: 3d4ee786973eea8f65e94f5cb5fdd606579fe932a70c37d324f992e7325914e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - fileglancer = fileglancer.cli:cli

requirements:
  host:
    - python >=3.12.0
    - hatchling >=1.5.0
    - hatch-nodejs-version >=0.3.2
    - pyyaml >=6
    - pip
  run:
    - python >=3.12.0
    - aiobotocore ==3.9.1
    - alembic ==1.19.2
    - atlassian-python-api ==4.0.7
    - authlib ==1.8.0
    - cachetools ==6.2.6
    - click ==8.5.0
    - fastapi ==0.136.3
    - httpx ==0.28.1
    - itsdangerous ==2.2.0
    - loguru ==0.7.3
    - pandas ==2.3.3
    - psycopg2-binary ==2.9.12
    - pydantic ==2.13.5
    - pydantic-settings ==2.15.0
    - python-jose ==3.5.0
    - cryptography ==50.0.1
    - sqlalchemy ==2.0.52
    - packaging ==26.3
    - uvicorn ==0.38.0
    - x2s3 ==1.6.1
    - py-cluster-api ==0.8.0

tests:
  - python:
      imports:
        - fileglancer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - fileglancer --help

about:
  summary: Browse, share, and publish files on the Janelia file system
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/JaneliaSciComp/fileglancer

extra:
  recipe-maintainers:
    - imagejan
