context:
  name: termscraper
  version: "0.10.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: bec8e4f6df1a5ee6cdb6593ee9d64c08b3ca8a22ba1e4988570133a2e4752565
  patches:
    # https://github.com/byexamples/termscraper/pull/1
    - 0001-Drop-pytest-machinery-in-setup.py.patch
    # https://github.com/byexamples/termscraper/pull/2
    - 0001-Do-not-install-the-LICENSE-into-the-root-of-the-PREF.patch
    # https://github.com/byexamples/termscraper/pull/4
    - 0001-Be-less-strict-on-dependencies.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - wcwidth >=0.2.5

tests:
  - python:
      imports:
        - termscraper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    script:
      # Disable test broken by missing files in sdist https://github.com/byexamples/termscraper/pull/3
      - pytest -v tests --ignore=tests/test_input_output.py

about:
  homepage: https://github.com/byexamples/termscraper
  repository: https://github.com/byexamples/termscraper
  summary: Simple VTXXX-compatible terminal emulator scraper.
  description: |
    termscraper is an in-memory VTXXX-compatible terminal emulator, a fork of
    pyte focused on scraping terminal output.
  license: LGPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - saraedum
