schema_version: 1
package:
  name: interceptor-keyboard-mouse
  version: 1.0.0
source:
- url: https://github.com/TitanCSA/Interceptor-Keyboard-Mouse/releases/download/input-language-sdks-v1.0.0/interceptor-keyboard-mouse-input-sdks-1.0.0-source.zip
  sha256: d3835e17a24ef9537a71c79429cb0ac47a3824d9c6bc8c52fe4d63d29430b5f9
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - interceptor_keyboard_mouse
    pip_check: true
- script:
  - python -m pip check
  - python -c "from interceptor_keyboard_mouse import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/Interceptor-Keyboard-Mouse
  summary: Windows x64 Interceptor-Keyboard-Mouse Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Interceptor-Keyboard-Mouse-C-ffi/LICENSE
  repository: https://github.com/TitanCSA/Interceptor-Keyboard-Mouse
extra:
  recipe-maintainers:
  - TitanCSA
