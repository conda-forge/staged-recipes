context:
  version: "0.3.0"

package:
  name: typer-injector
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/typer_injector/typer_injector-${{ version }}.tar.gz
  sha256: 7fa5b411b86c31aeeb22fc180d0ebf615c2a71c8f2b1dc97ad4d06a4c235b3a5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - typer >=0.20.0

tests:
  - python:
      imports:
        - typer_injector
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/BenjyWiener/typer-injector
  summary: Dependency injection for Typer
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - pavelzw
