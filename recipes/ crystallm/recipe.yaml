schema_version: 1

context:
  version: "1.0"

package:
  name: crystallm
  version: ${{ version }}

source:
  url: https://github.com/lantunes/CrystaLLM/archive/v${{ version }}.tar.gz
  sha256: b3459d860ff1ef19772e1b17bd709024c20f4703947472b3100c6907cb9222a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - pandas >=1.5.3
    - pymatgen >=2023.3.23
    - numpy >=1.24.2
    - scikit-learn >=1.2.2
    - tqdm >=4.65.0
    - pyzmq >=25.1.1
    - omegaconf >=2.3.0
    - pyyaml >=6.0.1
    - smact >=2.5.5
    - matminer >=0.9.0
    - torch >=2.0.1

tests:
  - python:
      imports:
        - crystallm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
