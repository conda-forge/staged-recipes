schema_version: 1

context:
  version: "6.0"

package:
  name: zope.size
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.size/zope_size-${{ version }}.tar.gz
  sha256: e5ceb10bc878aed4fa4c205e4865bfb936df916a4d0c5d2cd87e5b369c84048d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.i18nmessageid

tests:
  - python:
      imports:
        - zope.size
        - zope.size.interfaces
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # ZCMLTest loads configure.zcml, which needs zope.security (not on conda-forge yet)
      - python -m unittest -v zope.size.tests.Test
    requirements:
      run:
        - zope.component
        - zope.configuration

about:
  homepage: https://github.com/zopefoundation/zope.size
  repository: https://github.com/zopefoundation/zope.size
  documentation: https://zopesize.readthedocs.io
  summary: Interfaces and simple adapter that give the size of an object
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
