context:
  version: "2.1.1"

package:
  name: python-pcapng
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-pcapng/python-pcapng-${{ version }}.tar.gz
  sha256: 6477e72513165954e56d5836ebbd43ac7f8d28c4640f78d63d6506d1692ddc74

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - setuptools-scm >=3.4
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pcapng
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rshk/python-pcapng
  summary: Library to read and write the pcap-ng format
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
