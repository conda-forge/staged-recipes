context:
  version: "0.1.0"
  python_min: "3.11"
  pypi_name: pockit-optimal-control
  sdist_name: pockit_optimal_control

package:
  name: pockit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/${{ pypi_name }}/${{ sdist_name }}-${{ version }}.tar.gz
  sha256: "dc88861d1ba11497bc8dbe51ac7f3ca2a13f8456da072eab5894b1be9833bf44"

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.26
  run:
    - python >=${{ python_min }}
    - numpy >=1.26.0
    - sympy >=1.12
    - scipy >=1.11.3
    - numba >=0.58.1

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pockit
        - pockit.lobatto
        - pockit.radau
        - pockit.optimizer.scipy
      pip_check: true

about:
  homepage: https://github.com/zouyilin2000/pockit
  summary: Python toolkit for numerical optimal control
  description: |
    Pockit solves numerical optimal-control problems using pseudospectral methods
    and supports multiphase systems and constrained trajectory optimization.
  license: GPL-3.0-only
  license_file: LICENSE
  documentation: https://pockit.pages.dev
  repository: https://github.com/zouyilin2000/pockit

extra:
  recipe-maintainers:
    - zouyilin2000
