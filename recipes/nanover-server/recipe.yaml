schema_version: 1

context:
  python_min: "3.12"
  version: "0.1.2962"

package:
  name: nanover-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nanover-server/nanover_server-${{ version }}.tar.gz
  sha256: 032221283b4312532de1d34f13c70168779559f0182b12f8934f5d2240068bf2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - nanover-server = nanover.app.cli.server_cli:main
      - nanover-record = nanover.app.cli.recorder_cli:main
      - nanover-essd-list = nanover.essd.list_cli:main
      - nanover-dump-state = nanover.recording.cli.dump_cli:main
      - nanover-split-recording = nanover.recording.cli.split_cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - openmm
    - mdanalysis
    - numpy
    - nglview >=4.0.1
    - netifaces
    - ase >=3.21
    - websockets >=15.0.0
    - msgpack-python >=1.0.0
    - pooch

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - nanover
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - nanover-server --help
      - nanover-record --help
      - nanover-essd-list --help
      - nanover-dump-state --help
      - nanover-split-recording --help

about:
  summary: Python servers for NanoVer.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/nanover-server/

extra:
  recipe-maintainers:
    - Ragzouken
