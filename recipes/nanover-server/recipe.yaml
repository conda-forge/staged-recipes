context:
  version: "0.1.2962"
  python_min: "3.12"

package:
  name: nanover-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nanover-server/nanover_server-${{ version }}.tar.gz
  sha256: 032221283b4312532de1d34f13c70168779559f0182b12f8934f5d2240068bf2

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - openmm
    - mdanalysis
    - numpy
    - nglview >=4.0.1
    - netifaces
    - ase >=3.21
    - websockets >=15.0.0
    - msgpack-python >=1.0.0
    - pooch

test:
  imports:
    - nanover.app
  commands:
    - pip check
    - nanover-server --help
    - nanover-record --help
    - nanover-essd-list --help
    - nanover-dump-state --help
    - nanover-split-recording --help
  requires:
    - pip
    - python ${{ python_min }}

about:
  homepage: https://pypi.org/project/nanover-server/
  summary: Python servers for NanoVer.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Ragzouken
