schema_version: 1

context:
  python_min: "3.13"
  version: "0.1.2973"

package:
  name: nanover-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nanover-server/nanover_server-${{ version }}.tar.gz
  sha256: 73f942de6b0dc0c4b9899f3e431dda4d30063771f8cd0845655b376635f975f4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - nanover-server = nanover.app.cli.server_cli:main
      - nanover-record = nanover.app.cli.recorder_cli:main
      - nanover-essd-list = nanover.essd.list_cli:main
      - nanover-dump-state = nanover.recording.cli.dump_cli:main
      - nanover-split-recording = nanover.recording.cli.split_cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - openmm >=8.2.0
    - mdanalysis >=2.8.0
    - numpy >=1.26.4
    - psutil >=7.2.0
    - nglview >=4.0.1
    - ase >=3.21
    - websockets >=15.0.0
    - msgpack-python >=1.0.0
    - pooch

tests:
  - python:
      imports:
        - nanover
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - nanover-server --help
      - nanover-record --help
      - nanover-essd-list --help
      - nanover-dump-state --help
      - nanover-split-recording --help

about:
  summary: Python servers for NanoVer.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/nanover-server/

extra:
  recipe-maintainers:
    - Ragzouken
