schema_version: 1

context:
  version: "7.8"

package:
  name: accesscontrol
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/accesscontrol/accesscontrol-${{ version }}.tar.gz
  sha256: 0680aa799533468f3ef37b95ad857a986d91a979313487c528362d48407d0a6a

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - acquisition
    - authencoding
    - btrees
    - datetime
    - extensionclass
    - persistence
    - restrictedpython
    - transaction
    - zexceptions
    - zope.component
    - zope.configuration
    - zope.deferredimport
    - zope.interface
    - zope.publisher
    - zope.schema
    - zope.security
    - zope.testing

tests:
  - python:
      imports:
        - AccessControl
        - AccessControl.cAccessControl
        - AccessControl.SecurityManagement
        - AccessControl.ZopeGuards
        - AccessControl.userfolder
      pip_check: true
  - script:
      - zope-testrunner --auto-path -vc -s AccessControl
    requirements:
      run:
        - zope.testrunner

about:
  homepage: https://github.com/zopefoundation/AccessControl
  repository: https://github.com/zopefoundation/AccessControl
  summary: Security framework for Zope
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
