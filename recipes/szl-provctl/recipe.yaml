schema_version: 1

context:
  version: "0.1.0"
  python_min: "3.9"

package:
  name: szl-provctl
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/07/5b/ea6301c03bbf57994a05259cf63f1ece31d08d61867365feabb7f497710b/szl_provctl-0.1.0.tar.gz
  sha256: f1ca20561aa30e2f3950730dafb89af4901fc5135cb756c54e9410ca2787cdaf

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - szl_provctl
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - python -c "import importlib.resources as r; assert r.files('szl_provctl').joinpath('metadata.json').is_file()"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/szl-holdings/szl-provctl
  repository: https://github.com/szl-holdings/szl-provctl
  documentation: https://github.com/szl-holdings/szl-provctl#readme
  license: Apache-2.0
  license_file: LICENSE
  summary: Provenance-DAG control and in-toto / SLSA interop (software kernel)
  description: |
    szl-provctl is the provenance-DAG control kernel of the SZL Holdings governed-AI estate: constructs, verifies and walks provenance DAGs with in-toto / SLSA interop and receipt-bound provenance. Pure-python, zero runtime dependencies. Software kernel, not a trained model.

extra:
  recipe-maintainers:
    - stephenlutar2-hash
