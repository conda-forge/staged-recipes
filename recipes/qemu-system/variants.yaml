# TODO(human-review, staging/inherit refactor): qemu_system_arch is still
# needed for qemu-system-common/qemu-system-tools' existing
# `skip: qemu_system_arch != "aarch64"` build-once trick, which was NOT
# touched by this refactor. However, the new qemu-system-arch-staging output
# and the new qemu-system-aarch64/ppc64/riscv64 package outputs (recipe.yaml)
# now contain ZERO references to qemu_system_arch. Unverified/flagged risk:
# if rattler-build does not prune per-output "used variant keys" and instead
# fans out ALL outputs across every qemu_system_arch value, the staging build
# (and/or the new arch outputs) could be wastefully resolved/rebuilt 3x,
# defeating the point of this refactor. This agent had no live access to the
# rattler-build docs (https://rattler-build.prefix.dev/latest/multiple_output_cache/)
# to confirm either way, so variants.yaml was left unchanged per instructions.
# ACTION NEEDED: confirm rattler-build's used-variant-keys behavior for
# staging/inherit outputs before merging; if the risk is real, this file and/or
# the common/tools skip logic will need a follow-up change (e.g. splitting
# qemu_system_arch into a separate firmware-only variant key, or zip_keys).
qemu_system_arch:
  - "aarch64"
  - if: linux
    then:
      - "ppc64"
      - "riscv64"

