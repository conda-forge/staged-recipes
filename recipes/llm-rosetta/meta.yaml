{% set name = "llm-rosetta" %}
{% set version = "0.8.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/llm_rosetta-{{ version }}.tar.gz
  sha256: 756f77403516bb71d276d21fe15e2e2b4888f8df8471d5725fa98d6b24bff744

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - llm-rosetta-gateway = llm_rosetta.gateway:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - pip
  run:
    - python >={{ python_min }}
    - typing_extensions >=4.0.0
  run_constrained:
    - openai >=2.0.0
    - anthropic >=0.84.0
    - google-genai >=1.67.0

test:
  imports:
    - llm_rosetta
    - llm_rosetta.types
    - llm_rosetta.converters
  commands:
    - pip check
    - llm-rosetta-gateway --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Oaklight/llm-rosetta
  summary: "LLM-Rosetta: Unified LLM API adapter — bidirectional conversion between OpenAI, Anthropic, and Google formats via IR."
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://llm-rosetta.readthedocs.io
  dev_url: https://github.com/Oaklight/llm-rosetta

extra:
  recipe-maintainers:
    - Oaklight
