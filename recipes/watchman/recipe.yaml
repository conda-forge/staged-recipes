context:
  version: "2026.08.03.00"

package:
  name: watchman
  version: ${{ version }}

source:
  url: https://github.com/facebook/watchman/archive/v${{ version }}.tar.gz
  sha256: 36ecc782f7dc056e79bd664b3f4c6d4fe08ca78041835df2f1c39ef2566461f6

build:
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cmake
    - ninja
  host:
    - edencommon ==${{ version }}
    - fb303 ==${{ version }}
    - fbthrift ==${{ version }}
    - fizz ==${{ version }}
    - folly ==${{ version }}
    - mvfst ==${{ version }}
    - wangle ==${{ version }}
    # Only needed because watchman's CMake requires GMock at configure time.
    - gtest
    - pcre2
    - xxhash
    # Libraries referenced by folly's exported CMake targets.
    - bzip2
    - double-conversion
    - fmt
    - gflags
    - glog
    - if: linux
      then: libaio
    - libboost-devel
    - libevent
    - liblzma-devel
    - libsodium
    - lz4-c
    - openssl
    - snappy
    - zlib
    - zstd
  ignore_run_exports:
    by_name:
      - gtest

tests:
  - package_contents:
      bin:
        - watchman
        - watchmanctl
  - script:
      - watchman --version
      - watchmanctl --help
  - files:
      recipe:
        - run_test.sh
    script:
      - bash run_test.sh

about:
  homepage: https://facebook.github.io/watchman/
  summary: Watches files and records, or triggers actions, when they change
  description: |
    Watchman exists to watch files and record when they change. It can also
    trigger actions (such as rebuilding assets) when matching files change.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://facebook.github.io/watchman/docs/install
  repository: https://github.com/facebook/watchman

extra:
  recipe-maintainers:
    - baszalmstra
