context:
  version: "4!10.0.28000.2957"

package:
  name: winrt-windows-foundation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/winrt-windows-foundation/winrt_windows_foundation-${{ version }}.tar.gz
  sha256: 6f7d8e932e283991cd931741f84dc7c2e8bc595b4df09de73d16c1d580fc678a

build:
  number: 0
  # Pure-Python projection, but it only works on Windows (it needs winrt-runtime).
  skip:
    - not win
    - match(python, "<3.11")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling
    - winrt-table-compiler >=4,<5
  run:
    - python
    - winrt-runtime >=4.0.0,<5
    # winrt-windows-foundation-collections is left out for now: it depends on
    # this package, and the cycle can't be built in staged-recipes. To be added
    # back (with a build number bump) once both feedstocks exist.
    # - winrt-windows-foundation-collections >=${{ version }}

tests:
  - python:
      imports:
        - winrt.windows.foundation
      pip_check: false  # see note on winrt-windows-foundation-collections above

about:
  summary: PyWinRT projection of the Windows.Foundation namespace
  homepage: https://github.com/pywinrt/pywinrt
  repository: https://github.com/pywinrt/pywinrt
  documentation: https://pywinrt.readthedocs.io
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
