schema_version: 1

context:
  version: "4.0.2"

package:
  name: stepup-reprep
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stepup-reprep/stepup_reprep-${{ version }}.tar.gz
  sha256: deeef9fc32156f4e2088b474eedeb3014b489612061d5b21f3dde2efa8e0c9a5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - srr-add-notes-pdf = stepup.reprep.add_notes_pdf:main
      - srr-bibsane = stepup.reprep.bibsane:main
      - srr-cat-pdf = stepup.reprep.cat_pdf:main
      - srr-check-hrefs = stepup.reprep.check_hrefs:main
      - srr-check-inventory = stepup.reprep.check_inventory:main
      - srr-compile-latex = stepup.reprep.compile_latex:main
      - srr-compile-tectonic = stepup.reprep.compile_tectonic:main
      - srr-compile-typst = stepup.reprep.compile_typst:main
      - srr-convert-inkscape = stepup.reprep.convert_inkscape:main
      - srr-convert-jupyter = stepup.reprep.convert_jupyter:main
      - srr-convert-markdown = stepup.reprep.convert_markdown:main
      - srr-convert-weasyprint = stepup.reprep.convert_weasyprint:main
      - srr-execute-papermill = stepup.reprep.execute_papermill:main
      - srr-flatten-latex = stepup.reprep.flatten_latex:main
      - srr-make-inventory = stepup.reprep.make_inventory:main
      - srr-normalize-pdf = stepup.reprep.normalize_pdf:main
      - srr-nup-pdf = stepup.reprep.nup_pdf:main
      - srr-raster-pdf = stepup.reprep.raster_pdf:main
      - srr-sync-zenodo = stepup.reprep.sync_zenodo:main
      - srr-unplot = stepup.reprep.unplot:main
      - srr-wrap-git = stepup.reprep.wrap_git:main
      - srr-zip-inventory = stepup.reprep.zip_inventory:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0
    - setuptools-scm >=8.1
    - pip
  run:
    - __unix
    - python >=${{ python_min }}
    - attrs >=23.1.0
    - cattrs >=23.2.3
    - defusedxml >=0.7.0
    - idutils >=1.4.5
    - ipykernel >=6.20.1
    - lark >=1.3.1
    - markdown-it-py >=3.0.0
    - mdit-py-plugins >=0.4.2
    - nbconvert >=7.17.1
    - numpy >=1.24.3
    - papermill >=2.6.0
    - path >=16.14.0
    - pyiso4 >=0.1.6
    - pymupdf >=1.24.3
    - pyyaml >=6.0
    - requests >=2.33.0
    - scipy >=1.11.1
    - stepup >=4.0.0,<5.0.0a1
    - svg.path >=6.0
    - traitlets >=5.14.0
    - weasyprint >=69.0

tests:
  - if: unix
    then:
      python:
        imports:
          - stepup.reprep
        pip_check: true
        python_version:
          - ${{ python_min }}.*
          - "*"
  - if: unix
    then:
      script:
        - srr-add-notes-pdf --help
        - srr-bibsane --help
        - srr-cat-pdf --help
        - srr-check-hrefs --help
        - srr-check-inventory --help
        - srr-compile-latex --help
        - srr-compile-tectonic --help
        - srr-compile-typst --help
        - srr-convert-inkscape --help
        - srr-convert-jupyter --help
        - srr-convert-markdown --help
        - srr-convert-weasyprint --help
        - srr-execute-papermill --help
        - srr-flatten-latex --help
        - srr-make-inventory --help
        - srr-normalize-pdf --help
        - srr-nup-pdf --help
        - srr-raster-pdf --help
        - srr-sync-zenodo --help
        - srr-unplot --help
        - srr-wrap-git --help
        - srr-zip-inventory --help

about:
  summary: StepUp extension for Reproducible Reporting
  description: |
    StepUp RepRep is the publication build tool for Reproducible Reporting.
    It is a domain-specific extension of StepUp Core, a dynamic build tool,
    and targets the last mile of the publication process:
    the creation of a publication from raw research results.
  license: LGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://reproducible-reporting.github.io/stepup-reprep/
  repository: https://github.com/reproducible-reporting/stepup-reprep/
  documentation: https://reproducible-reporting.github.io/stepup-reprep/

extra:
  recipe-maintainers:
    - tovrstra
