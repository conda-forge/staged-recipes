schema_version: 1

context:
  python_min: "3.11"
  version: "1.0.1"

package:
  name: plantcv-geospatial
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/plantcv-geospatial/plantcv_geospatial-${{ version }}.tar.gz
  sha256: e63b0eebb3f8cae43518037ba55c73fbce3d6c17733ff35ad1a9f329921dfc3d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64.0
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - conda-forge/label/rc::plantcv ==5.0.0rc2
    - matplotlib-base
    - rasterio
    - affine <3
    - fiona
    - shapely
    - geopandas
    - geojson
    - napari
    - rasterstats
    - joblib
    - netcdf4
    - altair <6
    - dill
    - pyside6

tests:
  - python:
      imports:
        - plantcv
        - plantcv.geospatial
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: PlantCV Geospatial add-on package
  license: MPL-2.0
  license_file: LICENSE
  homepage: https://plantcv.org
  documentation: https://docs.plantcv.org/projects/geospatial

extra:
  recipe-maintainers:
    - nfahlgren
