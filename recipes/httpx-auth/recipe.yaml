schema_version: 1

context:
  version: "0.23.1"

package:
  name: httpx-auth
  version: ${{ version }}

source:
  url: https://github.com/Colin-b/httpx_auth/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 01004a598e96d62926d39012427901113c65833bd5de4af037a5f0d7e859f65b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - httpx ==0.28

tests:
  - python:
      imports:
        - httpx_auth
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - pytest
        - pyjwt
        - pytest-httpx
        - pytest-asyncio
        - time-machine
    script:
      - pytest -vvv tests/
    files:
      source:
        - tests/

about:
  summary: Authentication classes for HTTPX.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/httpx-auth/
  repository: https://github.com/Colin-b/httpx_auth

extra:
  recipe-maintainers:
    - jsmolic
