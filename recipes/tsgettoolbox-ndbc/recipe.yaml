context:
  version: 27.0.0

package:
  name: tsgettoolbox-ndbc
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-ndbc/tsgettoolbox_ndbc-${{ version }}.tar.gz
  sha256: 527c919442edd8ff03b89bf3b29cdf0f1b09a0a381159fd7c5178d25008b7034

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - aiodns >3.6.0
  - async_retriever
  - pandas
  - tsgettoolbox >=27.0.0

tests:
  - python:
      imports:
        - tsgettoolbox_ndbc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Plugin for tsgettoolbox to retrieve time series data from the National Data Buoy Center (NDBC).
  description: |
    The 'tsgettoolbox_ndbc' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    National Data Buoy Center (NDBC).
  homepage: https:/pypi.org/project/tsgettoolbox_ndbc/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
