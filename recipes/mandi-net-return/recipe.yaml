context:
  version: "0.1.3"

package:
  name: mandi-net-return
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/8f/bc/9f7b4f8fdf29227a9b43906bea9a3151dd06afbc187f3105e32700c3e4bc/mandi_net_return-0.1.3.tar.gz
  sha256: 9701264c6cf40a87fd384144a69063ebe7b9b545d405aeb9a927de1c4df4b951

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0
  skip:
    - match(python, "<3.10")

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - mandi_net_return
      pip_check: true
  - script:
      - pytest tests/ -v
    files:
      source:
        - tests/
    requirements:
      run:
        - pytest

about:
  homepage: https://github.com/swastiktawate/mandi-net-return
  summary: 'True net return maths for Indian mandi sales: sell today, hold, or travel to a better mandi'
  description: |
    A mandi price is not what the farmer keeps. Spoilage in transit and in
    storage eats part of the crop, the commission agent takes a cut, and
    transport plus any surcharge come off the top. This package computes what
    is left per quintal, and breaks it down so each cost is visible.
    The maths was first written for Kissan Saathi, an agri-tech decision
    assistant for Indian farmers. It is pure calculation: no network calls,
    no database, no API keys, no dependencies.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/swastiktawate/mandi-net-return

extra:
  recipe-maintainers:
    - swastiktawate
