schema_version: 1

context:
  version: "4.16.0"

package:
  name: azure-functions-core-tools
  version: ${{ version }}

source:
  - url: https://github.com/Azure/azure-functions-core-tools/archive/refs/tags/${{ version }}.tar.gz
    sha256: cc77d0570d2f68c7c81e41d34e5e331b22aeec8397cf7bf7ff3f0d32720f5aca
  - url: https://cdn.functions.azure.com/public/TemplatesApi/3.1.1648.zip
    sha256: 618281c1debd4c81d0285d6bf01ce5cc8c832c905c0aab406cadc584dbc0fb9b
    file_name: templates.zip
  - url: https://raw.githubusercontent.com/Azure/azure-functions-templates/3.1.1648/LICENSE.txt
    sha256: 40a35f410eb1057a5356c92d2d5e3911cd6118de664bbd3c46aaa43f56a1a546
    file_name: AZURE_FUNCTIONS_TEMPLATES_LICENSE.txt

build:
  number: 0
  script:
    file: build.sh
    interpreter: brush
  dynamic_linking:
    # Keep the DT_RPATH set by build.sh so native libraries loaded by .NET
    # can find their dependencies without an rpath of their own.
    binary_relocation: false

requirements:
  build:
    - ${{ "patchelf" if linux }}
    - brush
    - dotnet-sdk >=10.0.401,<11
    - nuget-license
    - python
  run:
    - if: linux
      then:
        - __glibc >=2.27  # See https://github.com/dotnet/core/blob/main/release-notes/10.0/supported-os.md#libc
        # libcoreclr/libclrjit link libstdc++ and libgcc_s.
        # No C/C++ compiler in build adds these runtime dependencies.
        - libstdcxx
        - libgcc
        - icu
        - krb5
        # .NET 10's crypto shim dlopens libssl.so.{3,1.1,1.0.x}, not .so.4
        - openssl <4
        - libzlib

tests:
  - script:
      - if: unix
        then:
          - func --version
          - func --help
          - test "$(func --version)" = "${PKG_VERSION}"
      - if: linux
        then:
          # Check that .NET can load OpenSSL without making network requests.
          - mkdir -p enc && cd enc
          - echo '{"IsEncrypted":false,"Values":{"FOO":"bar"}}' > local.settings.json
          - func settings encrypt
          - grep -Eq '"IsEncrypted":[[:space:]]*true' local.settings.json
      - if: win
        then:
          - call func.cmd --version
          - call func.cmd --help
          - for /f "delims=" %%i in ('call func.cmd --version') do if not "%%i"=="%PKG_VERSION%" exit /b 1
  - package_contents:
      bin:
        - func
      files:
        - if: unix
          then:
            - libexec/azure-functions-core-tools/func
        - if: win
          then:
            - Library/libexec/azure-functions-core-tools/func.exe

about:
  homepage: https://github.com/Azure/azure-functions-core-tools
  repository: https://github.com/Azure/azure-functions-core-tools
  documentation: https://learn.microsoft.com/azure/azure-functions/functions-run-local
  license: MIT  # Core Tools itself. See LICENSE_REVIEW.md for bundled dependencies.
  license_file:
    - THIRD_PARTY_NUGET_LICENSES.md
    - third-party-licenses/INDEX.md
    - third-party-licenses/SOURCES.json
    - third-party-licenses/texts/*
  summary: Command line tools for Azure Functions
  description: |
    The Azure Functions Core Tools provide a local development experience
    for creating, developing, testing, running, and debugging Azure Functions.

extra:
  recipe-maintainers:
    - eunos-1128
