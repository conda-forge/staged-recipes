schema_version: 1

context:
  name: mifarepy
  version: "3.1.0"
  python_min: "3.9"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: e02f7f7b819545decfd8fc79b7ead0e5340d17ce6a4f8e4d1ccd1bdd94aea9af

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - pyserial

tests:
  - python:
      imports:
        - mifarepy
        - mifarepy.reader
        - mifarepy.protocol
        - mifarepy.layout
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
    script:
      - pip check

about:
  homepage: https://github.com/SparkDrago05/mifarepy
  documentation: https://sparkdrago05.github.io/mifarepy/
  repository: https://github.com/SparkDrago05/mifarepy
  summary: Python library for MIFARE readers that speak the GNetPlus protocol (PROMAG PCR310U, MF5, MF10)
  license: LGPL-3.0-or-later
  license_file:
    - LICENSE
    - COPYING

extra:
  recipe-maintainers:
    - SparkDrago05
