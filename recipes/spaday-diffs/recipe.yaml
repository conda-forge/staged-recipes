context:
  version: "0.1.0"

package:
  name: spaday-diffs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-diffs/spaday_diffs-${{ version }}.tar.gz
  sha256: 221a6c267342b42d670b2e213a896c8b03a9d38f8356166dd12686e0a8cd2425

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.12.0,<1.0

tests:
  - python:
      imports:
        - spaday_diffs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Diffs, by Pierre, for spaday
  homepage: https://github.com/1kbgz/spaday-diffs
  repository: https://github.com/1kbgz/spaday-diffs

extra:
  recipe-maintainers:
    - timkpaine
