schema_version: 1

context:
  version: "0.2.0"

package:
  name: earthsciencekit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/earthsciencekit/earthsciencekit-${{ version }}.tar.gz
  sha256: 519a0ce8ad252422d61569368edab501becbf0690278b55200f1e0e0b83ddba1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.6

tests:
  - python:
      imports:
        - earthsciencekit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cpoli/earthsciencekit
  repository: https://github.com/cpoli/earthsciencekit
  documentation: https://cpoli.github.io/earthsciencekit/
  summary: Inspectable Earth-system models for learning and teaching
  description: |
    A teaching toolkit of Earth-system models (plate tectonics, seismology, atmosphere, climate, oceanography, geophysics and volcanology), each documenting its governing equation, units, input bounds and applicability, with a dated history of breakthroughs and a gallery example for each.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpoli
