schema_version: 1

context:
  name: oss-harmony
  version: "0.0.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/oss_harmony-${{ version }}.tar.gz
  sha256: ccad467b71d61490df1f2204b7a064990833338615ac135536c5b3a8e2d03a15

build:
  number: 0
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      # https://github.com/rust-lang/cargo/issues/10583#issuecomment-1129997984
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      # Optimize the Cargo build
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: win
        then:
          - copy "%RECIPE_DIR%\cargo-auditable-wrapper.bat" "%BUILD_PREFIX%\Library\bin\cargo-auditable-wrapper.bat"
          - set CARGO=cargo-auditable-wrapper.bat
        else:
          - cp "${RECIPE_DIR}/cargo-auditable-wrapper.sh" "${BUILD_PREFIX}/bin/cargo-auditable-wrapper"
          - chmod 755 "${BUILD_PREFIX}/bin/cargo-auditable-wrapper"
          - export CARGO=cargo-auditable-wrapper
       # Install the Python package using maturin
      - python -m pip install . -vv --no-deps --no-build-isolation
       # Generate the THIRDPARTY.yml file
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  skip: is_abi3 and not is_python_min

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.7,<2.0
  host:
    - python
    - if: is_abi3
      then: python-abi3
    - maturin >=1.8,<2.0
    - pip
  run:
    - python
    - pydantic >=2.11.7
  run_constraints:
    - openai-harmony <0a0

tests:
  - python:
      imports:
        - openai_harmony
      pip_check: true
      python_version:
        - if: is_abi3
          then: ${{ python_min ~ '.*' }}
        - '*'
  - if: is_abi3
    then:
      requirements:
        run:
          - abi3audit
      script:
        - if: unix
          then: abi3audit $SP_DIR/openai_harmony/openai_harmony.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit %SP_DIR%\openai_harmony\openai_harmony.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  homepage: https://pypi.org/project/oss-harmony/
  repository: https://github.com/oss-harmony/harmony
  summary: Response format library for the gpt-oss open-weight model series (fork of openai-harmony)
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - xhochy
