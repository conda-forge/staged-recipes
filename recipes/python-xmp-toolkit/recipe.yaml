schema_version: 1
context:
  python_min: '3.10'
package:
  name: python-xmp-toolkit
  version: 2.1.0
source:
  url: https://files.pythonhosted.org/packages/39/54/c0b3621568031346ce3306beef18c6cabbd10467cdf17fd257d1a7eb3783/python_xmp_toolkit-2.1.0.tar.gz
  sha256: ca0aa2c60d418dd2558767db59953ab5954fb5b87dc0b50cecd60566b0b4e2da
build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -v
requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - flit-core >=3.2,<4
  run:
  - python >=${{ python_min }}
  - pytz
  - exempi
tests:
- python:
    imports:
    - libxmp
    pip_check: true
about:
  homepage: https://github.com/python-xmp-toolkit/python-xmp-toolkit
  summary: XMP I/O wrapping Exempi
  license: BSD-3-Clause
  license_file: LICENSE
extra:
  recipe-maintainers:
  - Shavindra
