context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-hydstra
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-hydstra/tsgettoolbox_hydstra-${{ version }}.tar.gz
  sha256: 2863d9ad3a552aec7ecbb7754d09bb6e7c6ec9116bda422cecfc4b745c232f94

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools>=80
  - pip
  run:
  - python >=3.10
  - pandas
  - requests
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_hydstra
    pip_check: true

about:
  summary: Plugin for tsgettoolbox to retrieve time series data from Hydstra web services.
