    tsgettoolbox_hydstra - Quick Guide
    ==================================
    The 'tsgettoolbox_hydstra' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    Hydstra database.  The tsgettoolbox_hydstra is a plugin-in for the tsgettoolbox
    package. The tsgettoolbox_hydstra will work with Python 3.10+.

    Documentation
    -------------
    Reference documentation is at `tsgettoolbox HYDSTRA API`_.

    Installation
    ------------
    At the command line::

        $ pip install tsgettoolbox_hydstra

        OR

        $ conda install -c conda-forge tsgettoolbox_hydstra

    Usage Summary - Command Line
    ----------------------------
    Just run 'tsgettoolbox --help' to get a list of subcommands.  To get detailed
    help for a particular sub-command, for instance 'hydstra', type 'tsgettoolbox
    hydstra --help'.

    +------------------+---------+--------+---------+----------+-----------------------+
    | Sub-command      | Spatial | Time   | Type    | Time     | Description           |
    |                  | Extent  | Extent |         | Interval |                       |
    +==================+=========+========+=========+==========+=======================+
    | hydstra_ts       | varies  | varies | station | E,H,D,M  | Kisters Hydstra       |
    |                  |         |        |         |          | Webservice - time     |
    |                  |         |        |         |          | series values         |
    +------------------+---------+--------+---------+----------+-----------------------+
    | hydstra_catalog  | varies  | varies | station | -NA-     | Kisters Hydstra       |
    |                  |         |        |         |          | Webservice - variable |
    |                  |         |        |         |          | catalog               |
    +------------------+---------+--------+---------+----------+-----------------------+
    | hydstra_stations | varies  | varies | station | -NA-     | Kisters Hydstra       |
    |                  |         |        |         |          | Webservice - station  |
    |                  |         |        |         |          | list                  |
    +------------------+---------+--------+---------+----------+-----------------------+

    +-------------------+-------------+
    | Time Interval     | Description |
    | Code              |             |
    +===================+=============+
    | E                 | Event       |
    +-------------------+-------------+
    | H                 | Hourly      |
    +-------------------+-------------+
    | D                 | Daily       |
    +-------------------+-------------+
    | M                 | Monthly     |
    +-------------------+-------------+

    Usage Summary - Python Library
    ------------------------------
    To use the tsgettoolbox in a project::

        from tsgettoolbox import tsgettoolbox
        df = tsgettoolbox.cdec("PRA", start_date="2000-01-01", end_date="2000-02-01")
        print(df.head())

    Refer to the API Documentation at `tsgettoolbox HYDSTRA API`_.

    Usage Summary - Command Line
    ----------------------------

        tsgettoolbox cdec --start_date 2000-01-01 --end_date 2000-02-01 "PRA" > output.csv

    Refer to the command line documentation at `tsgettoolbox HYDSTRA CLI`_.

