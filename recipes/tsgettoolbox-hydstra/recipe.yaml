context:
  version: 27.0.0

package:
  name: tsgettoolbox-hydstra
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-hydstra/tsgettoolbox_hydstra-${{ version }}.tar.gz
  sha256: 2863d9ad3a552aec7ecbb7754d09bb6e7c6ec9116bda422cecfc4b745c232f94

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - pandas
  - requests
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
      - tsgettoolbox_hydstra
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: Plugin for tsgettoolbox to retrieve time series data from Hydstra web services.
  description: |
    The 'tsgettoolbox_hydstra' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    Hydstra database.  The tsgettoolbox_hydstra is a plugin-in for the tsgettoolbox
    package.
  homepage: https://pypi.org/project/tsgettoolbox-hydstra/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
