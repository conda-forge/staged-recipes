context:
  version: "0.3.3"

package:
  name: gputaskman
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/gputaskman/gputaskman-${{ version }}.tar.gz
  sha256: 1ef8a8291cfa26844c2f07c6071edf0610b11539f282d09b9ef24761b7f6d6b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - gputaskman = gputaskman.cli:main
      - gtm = gputaskman.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.26,<0.10.0
  run:
    - python >=${{ python_min }}
    - nvidia-ml-py >=13.615.71
    - psutil >=7.2.2
    - textual >=8.2.8

tests:
  - python:
      imports:
        - gputaskman
        - gputaskman.cli
        - gputaskman.app
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - gputaskman --help
      - gtm --help
      - gputaskman diff --help

about:
  homepage: https://github.com/shanselman/gputaskman
  summary: GPU task manager with per-process VRAM, engine load, and LLM memory insights
  description: |
    A terminal GPU task manager for Windows, Linux, WSL, and macOS that
    connects per-process GPU memory and engine activity with loaded runtimes,
    model files, and LLM weights and KV-cache breakdowns.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/shanselman/gputaskman

extra:
  recipe-maintainers:
    - ManuelLerchner
