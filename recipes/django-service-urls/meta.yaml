{% set version = "3.1.0" %}

package:
  name: django-service-urls
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/d/django-service-urls/django_service_urls-{{ version }}.tar.gz
  sha256: 83bf8da3afc6e8bccd5a2c74ad21370198bea6bdc311c4a4f521d1ded87f6c88

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - hatchling
    - pip
  run:
    - python >=3.10
    - django >=5.2

test:
  imports:
    - django_service_urls
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/django-service-urls/
  summary: setting helper for django to represent databases, caches and email settings via a single string
  doc_url: https://github.com/rsalmaso/django-service-urls/blob/main/README.md
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - al1sant0s
