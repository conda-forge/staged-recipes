schema_version: 1

context:
  python_min: "3.12"
  version: "0.2.0"

package:
  name: sarkit-processing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sarkit-processing/sarkit_processing-${{ version }}.tar.gz
  sha256: f32262aae45eb25d30c165fc7f0b3eea023a8ae5e8cb11b9e359dcaf62d8449d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - sarkit-processing = sarkit_processing.__main__:main
      - skp = sarkit_processing.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - lxml >=5.1.0
    - networkx >=3.4
    - numba >=0.63.1
    - numpy >=2.0.0
    - sarkit >=1.10.0
    - scipy >=1.15.0
    - shapely >=2.1.0

tests:
  - python:
      imports:
        - sarkit_processing
        - sarkit_processing.atmosphere
        - sarkit_processing.remocomp
        - sarkit_processing.sicd_alias
        - sarkit_processing.sicd_area_plane
        - sarkit_processing.sicd_deskew
        - sarkit_processing.sicd_pixel_type
        - sarkit_processing.sicd_scene_to_image
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - sarkit-processing --help
      - skp --help

about:
  summary: Interacting with SAR data in proven, but nonstandard ways in Python.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/sarkit-processing/
  repository: https://github.com/ValkyrieSystems/sarkit-processing

extra:
  recipe-maintainers:
    - pressler-vsc
    - bombaci-vsc
    - johnstob
