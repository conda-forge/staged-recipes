schema_version: 1

context:
  version: "0.9.0"

package:
  name: pydms-sorption
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyDMS-sorption/pydms_sorption-${{ version }}.tar.gz
  sha256: a033b774c8a0a9503aed159644a763c6842f6c5012d63f297b16d3e201ed47a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.* 
    - setuptools >=77.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - matplotlib-base
    - pillow
    - reportlab
    - scipy
    - statsmodels
    - scikit-learn

tests:
  - python:
      imports:
        - pyDMS
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python package for physics-informed dual-mode sorption (DMS) optimization
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/pyDMS-sorption/
  documentation: https://pydms.readthedocs.io
  repository: https://github.com/SmithLabMIT/pyDMS

extra:
  recipe-maintainers:
    - bctapia
