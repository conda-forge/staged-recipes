context:
  version: "2.2.1"

package:
  name: asgiwebdav
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asgiwebdav/asgiwebdav-${{ version }}.tar.gz
  sha256: b192ee7d601d240dca019efbb7a70bf5e87bff7f3dc98e7b2ec56084f0699e83

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - asgi-webdav=asgi_webdav.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - asgiref
    - aiofiles >=25.1.0
    - asgimiddlewarestaticfile >=0.7.0
    - xmltodict >=1.0.2,<1.1
    - dataclass-wizard >=1.0.0,<1.1
    - python-dotenv
    - chardet
    - click

tests:
  - python:
      imports:
        - asgi_webdav
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - asgi-webdav --help

about:
  homepage: https://github.com/rexzhang/asgi-webdav
  summary: An asynchronous WebDAV server implementation
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
