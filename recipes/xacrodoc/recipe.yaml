context:
  version: 2.0.1

package:
  name: xacrodoc
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/x/xacrodoc/xacrodoc-${{ version }}.tar.gz
  sha256: 073652f88cf5a1f6bb489daccf025fe89d5d08e39a4aab3d0da036d9d5f42191

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  python:
    entry_points:
    - xacrodoc = xacrodoc.cli:main
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - hatchling
  - pip
  run:
  - python >=${{ python_min }}
  - rospkg >=1.5.0
  - xacro >=2.1.1
  - mujoco

tests:
- python:
    imports:
    - xacrodoc
    pip_check: true

about:
  summary: 'Compile xacro files to URDF or MJCF from Python or the command line (no ROS required).'
  description: |
    xacrodoc is a tool for compiling xacro files to plain URDF files or Mujoco MJCF files
    from within Python code or via the command line.
    It is fully functional whether ROS is installed on the system or not.

  repository: https://github.com/adamheins/xacrodoc
  homepage: https://github.com/adamheins/xacrodoc
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
