context:
  version: "2.2.1"

package:
  name: pymanopt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymanopt/pymanopt-${{ version }}.tar.gz
  sha256: c784929a436eb06d73371b53ae5db3cdc19c5e60280f8131553bc805cbf7a1da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=66.1.0
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}
    - numpy >=1.16.0
    # upstream excludes scipy 1.10.*, 1.11.* and 1.12.*
    - scipy >=1.0,<1.10|>=1.13

tests:
  - python:
      imports:
        - pymanopt
        - pymanopt.manifolds
        - pymanopt.optimizers
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://pymanopt.org
  repository: https://github.com/pymanopt/pymanopt
  documentation: https://pymanopt.org/docs/stable/
  summary: Toolbox for optimization on Riemannian manifolds with support for automatic differentiation
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - vivekbhr
