schema_version: 1
package:
  name: interceptor-gamepad-controller
  version: 1.0.0
source:
- url: https://github.com/TitanCSA/Interceptor-Gamepad-Controller/releases/download/input-language-sdks-v1.0.0/interceptor-gamepad-controller-input-sdks-1.0.0-source.zip
  sha256: 8ead5798c05e99122c95e28ca1676ae08cc558990d338815904376f9235a2e86
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - interceptor_gamepad_controller
    pip_check: true
- script:
  - python -m pip check
  - python -c "from interceptor_gamepad_controller import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/Interceptor-Gamepad-Controller
  summary: Windows x64 Interceptor-Gamepad-Controller Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Interceptor-Gamepad-Controller-C-ffi/LICENSE
  repository: https://github.com/TitanCSA/Interceptor-Gamepad-Controller
extra:
  recipe-maintainers:
  - TitanCSA
