schema_version: 1

context:
  name: tiptoe
  version: "0.4.0"

package:
  name: typst-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Mc-Zen/tiptoe/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 519a6dc755208aea52a5d8f8c69bfe2bb3415792b26995906d11ca3ddfaeafed

build:
  number: 0
  noarch: generic
  script:
    - if: unix
      then:
        - mkdir -p $PREFIX/share/typst/packages/preview/${{ name }}/${{ version }}
        - cp -r src typst.toml README.md LICENSE* $PREFIX/share/typst/packages/preview/${{ name }}/${{ version }}/
      else:
        - set "DEST=%PREFIX%\share\typst\packages\preview\${{ name }}\${{ version }}"
        - xcopy /E /I /Y src "%DEST%\src"
        - for %%f in (typst.toml README.md LICENSE*) do copy /Y "%%f" "%DEST%"

requirements:
  run:
    - typst >=0.13.0

tests:
  - package_contents:
      files:
        - share/typst/packages/preview/${{ name }}/${{ version }}/typst.toml
        - share/typst/packages/preview/${{ name }}/${{ version }}/src/tiptoe.typ
  - script:
      # Use an empty package cache so the test fails if typst downloads the package instead of using the local one
      - if: unix
        then:
          - export TYPST_PACKAGE_CACHE_PATH=$PWD/typst-cache
          - typst compile test.typ test.pdf
          - test -f test.pdf
          - test ! -e typst-cache
        else:
          - set "TYPST_PACKAGE_CACHE_PATH=%CD%\typst-cache"
          - typst compile test.typ test.pdf
          - if not exist test.pdf exit 1
          - if exist typst-cache exit 1
    files:
      recipe:
        - test.typ

about:
  license: MIT
  license_file:
    - LICENSE.txt
  summary: Arrowheads and marks for lines and paths in Typst.
  homepage: https://typst.app/universe/package/${{ name }}
  repository: https://github.com/Mc-Zen/tiptoe

extra:
  recipe-maintainers:
    - MarkusJungQC
