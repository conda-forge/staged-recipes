schema_version: 1

context:
  version: "0.4.0"

package:
  name: typst-tiptoe
  version: ${{ version }}

source:
  url: https://github.com/Mc-Zen/tiptoe/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 519a6dc755208aea52a5d8f8c69bfe2bb3415792b26995906d11ca3ddfaeafed

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p "$TYPST_PACKAGE_PATH/preview/tiptoe/${{ version }}"
    - cp -r src typst.toml README.md LICENSE* "$TYPST_PACKAGE_PATH/preview/tiptoe/${{ version }}/"

requirements:
  host:
    - typst
  run:
    - typst >=0.13.0

tests:
  - package_contents:
      files:
        - share/typst/packages/preview/tiptoe/${{ version }}/typst.toml
        - share/typst/packages/preview/tiptoe/${{ version }}/src/tiptoe.typ
  - script:
      # Use an empty package cache so the test fails if typst downloads the package instead of using the local one
      - export TYPST_PACKAGE_CACHE_PATH=$PWD/typst-cache
      - typst compile test.typ test.pdf
      - test -f test.pdf
      - test ! -e typst-cache
    files:
      recipe:
        - test.typ

about:
  license: MIT
  license_file:
    - LICENSE.txt
  summary: Arrowheads and marks for lines and paths in Typst.
  homepage: https://typst.app/universe/package/tiptoe
  repository: https://github.com/Mc-Zen/tiptoe

extra:
  recipe-maintainers:
    - MarkusJungQC
