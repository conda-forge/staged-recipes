schema_version: 1

context:
  version: "0.10.1"

package:
  name: git-pkgs-forge
  version: ${{ version }}

source:
  url: https://github.com/git-pkgs/forge/archive/v${{ version }}.tar.gz
  sha256: 4e6674f10c84da580776d3b3c4eb6fcd46ef76828b43a2caa602f2cdcf483047

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - forge version
      - forge --help
  - package_contents:
      bin:
        - forge
      strict: true

about:
  homepage: https://git-pkgs.dev
  summary: Go library and CLI for working with git forges
  description: |
    forge is a Go library and command-line tool for working with git
    forges. It supports GitHub, GitLab, Gitea, Forgejo, Bitbucket Cloud,
    Gerrit, and Tangled through a single interface, so the same commands
    work for managing repositories, issues, pull requests, branches,
    releases, and CI pipelines regardless of which forge is hosting the
    project.
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  repository: https://github.com/git-pkgs/forge

extra:
  recipe-maintainers:
    - pb01ka
