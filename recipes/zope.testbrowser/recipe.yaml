schema_version: 1

context:
  version: "8.1"

package:
  name: zope.testbrowser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.testbrowser/zope_testbrowser-${{ version }}.tar.gz
  sha256: 09440718ef0bf7876357d272dc829b3e5d5502519b79a8294c5b288e5fd151da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.schema
    - zope.cachedescriptors
    - pytz
    - webtest >=2.0.30
    - beautifulsoup4
    - soupsieve >=1.9.0
    - wsgiproxy2
    # upstream: python_version > "3.12"; legacy-cgi is metadata only below 3.13
    - legacy-cgi

tests:
  - python:
      imports:
        - zope.testbrowser
        - zope.testbrowser.browser
        - zope.testbrowser.wsgi
        - zope.testbrowser.interfaces
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # dotted names: the tests use relative imports and mock.patch by module path
      - python -m unittest -v zope.testbrowser.tests.test_browser zope.testbrowser.tests.test_cookies zope.testbrowser.tests.test_wsgi
    requirements:
      run:
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.testbrowser
  repository: https://github.com/zopefoundation/zope.testbrowser
  documentation: https://zopetestbrowser.readthedocs.io
  summary: Programmable browser for functional black-box tests
  license: ZPL-2.1
  license_file:
    - LICENSE.rst
    - COPYRIGHT.rst

extra:
  recipe-maintainers:
    - killua156
