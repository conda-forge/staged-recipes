{% set version = "1.1.1" %}
{% set python_min = "3.10" %}

package:
  name: raschpy
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/r/raschpy/raschpy-{{ version }}.tar.gz
  sha256: f0414f3db4c24dd34911c096951aca007575fee458b125305aa81c007be61b75

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >={{ python_min }}
    - numpy >=1.24
    - pandas >=2.0
    - scipy >=1.9
    - scikit-learn >=1.1
    - matplotlib-base >=3.6
    - seaborn >=0.12
    - openpyxl >=3.0

test:
  imports:
    - raschpy
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/MarkElliott999/RaschPy
  license: Apache-2.0
  license_file: LICENSE
  summary: Rasch measurement in Python — SLM, PCM, RSM, and Many-Facet Rasch models
  doc_url: https://github.com/MarkElliott999/RaschPy

extra:
  recipe-maintainers:
    - MarkElliott999
