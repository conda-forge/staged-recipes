schema_version: 1

context:
  version: "0.1.0"

package:
  name: hothouse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/hothouse/hothouse-${{ version }}.tar.gz
  sha256: 059a8f71c122c9980d832ff97307bc55d7882d77aaf2fbba1586116f031b0374

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --no-build-isolation -vv .
  python:
    entry_points:
      - hothouse = hothouse.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >=${{ python_min }}
    - Click
    - embreex >=4.0.0
    - pooch >=0.3.1
    - plyfile >=0.7
    - matplotlib-base
    - numpy
    - traitlets >=4.3.3
    - traittypes >=0.2.1
    - pvlib >=0.7.2
    - pythreejs >=2.2.0
    - pywavefront

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - hothouse
        - hothouse.blaster
        - hothouse.scene
        - hothouse.sun_calc
        - hothouse.model
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - hothouse --help

about:
  homepage: https://github.com/cropsinsilico/hothouse
  repository: https://github.com/cropsinsilico/hothouse
  license: MIT
  license_file: LICENSE
  summary: Embree-based ray tracer for photosynthetic yields in plant canopies
  description: |
    Embree-based ray tracer for photosynthetic yields in plant canopies
  documentation: https://cropsinsilico.github.io/hothouse

extra:
  recipe-maintainers:
    - langmm
