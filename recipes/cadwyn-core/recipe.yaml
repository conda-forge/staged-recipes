schema_version: 1

context:
  name: cadwyn-core
  version: "9.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cadwyn_core-${{ version }}.tar.gz
  sha256: acbaf5feee7bbcffc4cec111d2afb89a359217851666f02b7a4e6c7fe4c9b36b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pydantic >=2.12.0
    - typing_extensions >=4.8.0
    - typing-inspection >=0.4.0

tests:
  - python:
      imports:
        - cadwyn_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - pyproject.toml
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    script:
      - pytest -v tests

about:
  summary: Cadwyn's Stripe-like API versioning without FastAPI
  description: |
    The parts of Cadwyn that work without FastAPI: versions, version changes,
    data migrations, and the models of every version. It only needs Pydantic.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/zmievsa/cadwyn
  documentation: https://docs.cadwyn.dev
  repository: https://github.com/zmievsa/cadwyn

extra:
  recipe-maintainers:
    - xylar
