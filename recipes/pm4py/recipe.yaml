schema_version: 1

context:
  version: "2.7.23.11"

package:
  name: pm4py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pm4py/pm4py-${{ version }}.tar.gz
  sha256: daf30bb678aea4d716e1adf93bc7b91f762aea79dcf73be5553708776ad351df

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - cvxopt
    - python-graphviz
    - lxml
    - matplotlib-base
    - networkx
    - numpy
    - pandas
    - pytz
    - scipy
    - tqdm

tests:
  - python:
      imports:
        - pm4py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://processintelligence.solutions/
  summary: Process mining for Python
  description: |
    PM4Py is a python library that supports state-of-the-art process mining
    algorithms. It is open source and intended to be used in both academia
    and industry process mining projects.
  license: AGPL-3.0-or-later
  license_file: LICENSE
  documentation: https://processintelligence.solutions/pm4py/
  repository: https://github.com/process-intelligence-solutions/pm4py

extra:
  recipe-maintainers:
    - pb01ka
