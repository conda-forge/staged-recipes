schema_version: 1

context:
  version: "0.25.0"

package:
  name: quart-schema
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/q/quart-schema/quart_schema-${{ version }}.tar.gz
  sha256: c34be5cb7e7a6e36631eb7cb195d378f975c375d45b509895b4f832f3b36bf95

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - quart >=0.19.0

tests:
  - python:
      imports:
        - quart_schema
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: A Quart extension to provide schema validation
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/quart-schema/

extra:
  recipe-maintainers:
    - jsmolic
