schema_version: 1

context:
  version: "0.1.1"

package:
  name: ipygeotiff
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/i/ipygeotiff/ipygeotiff-${{ version }}.tar.gz
    sha256: bf5931a4506280610f147f03b8a6d7d9c23b61d106b1dd7059651f97ffaef066

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - nodejs <25
    - hatchling >=1.21.1
    - hatch-jupyter-builder >=0.8.3
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}
    - ipywidgets >=8.0.0
    - numpy

tests:
  - python:
      imports: ipygeotiff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/davidbrochart/ipygeotiff
  summary: A Jupyter - geotiff.js bridge

extra:
  recipe-maintainers:
    - davidbrochart
