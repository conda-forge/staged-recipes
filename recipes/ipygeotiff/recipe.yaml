schema_version: 1

context:
  version: "0.1.0"

package:
  name: ipygeotiff
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/i/ipygeotiff/ipygeotiff-${{ version }}.tar.gz
    sha256: de0dca322f09ea0ba358d538b16812d0590546950386c006e1e6479dd13a3e05

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling >=1.21.1
    - hatch-jupyter-builder >=0.8.3
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}
    - ipywidgets >=8.0.0
    - numpy
    - xeus-python

tests:
  - python:
      imports: ipygeotiff
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/davidbrochart/ipygeotiff
  summary: A Jupyter - geotiff.js bridge

extra:
  recipe-maintainers:
    - davidbrochart
