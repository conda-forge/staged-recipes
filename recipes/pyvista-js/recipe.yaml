schema_version: 1

context:
  version: "0.15.2"
  python_min: "3.12"

package:
  name: pyvista-js
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pyvista-js/pyvista_js-${{ version }}.tar.gz
  sha256: 2be9900a09602454fd9496b31526069abc8ca39adc18d8b026c5d64d9f9a88c2
  patches:
    - patches/0001-build-renderer.js-with-esbuild-directly.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyvista-js = pyvista_js._cli:cli_main

requirements:
  build:
    # bundles ts/renderer.ts into src/pyvista_js/templates/renderer.js;
    # emits plain JS, so the output stays noarch
    - esbuild
  host:
    - python ${{ python_min }}.*
    - hatch-build-scripts
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - jinja2 >=3.0.1,<4.0.1
    - lazy-loader >=0.4.1,<1.0.1
    - numpy >=2.0.1,<3.0.1
    - typer >=0.9.1,<1.0.1

tests:
  - python:
      imports:
        - pyvista_js
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pyvista-js --help

about:
  summary: PyVista-like API for vtk.js
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/tkoyama010/pyvista-js
  documentation: https://github.com/tkoyama010/pyvista-js

extra:
  recipe-maintainers:
    - larsoner
    - tkoyama010
