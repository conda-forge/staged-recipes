schema_version: 1

context:
  version: "0.3.0"

package:
  name: pytest-aioresponses
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pytest-aioresponses/pytest_aioresponses-${{ version }}.tar.gz
  sha256: 5677b32dfa1a36908b347524b5867aab35ac1c5ce1d4970244d6f66009bca7b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry >=0.12
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - pytest >=3.5.0
    - aioresponses >=0.7.1,<0.8.0

tests:
  - python:
      imports:
        - pytest_aioresponses
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: py.test integration for aioresponses
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pheanex/pytest-aioresponses

extra:
  recipe-maintainers:
    - jsmolic
