context:
  version: "1.1.1"

package:
  name: inching
  version: ${{ version }}

source:
  url: https://github.com/jhmlam/Inching/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 86f46d8a7a2b7b00c27fe14b49e411b4987a044b94b9ff013204026edc1777da

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - pandas
    - matplotlib-base
    - seaborn-base
    - plotly
    - tqdm
    - pytorch
    - cupy >=12
    - openmm
    - mdtraj

tests:
  - python:
      imports:
        - inching
        - inching.cli
        - inching.util
        - inching.Fuel.Coordinate.T1
        - inching.Fuel.T1
        - inching.Burn.Krylov.T3
        - inching.Burn.JacobiDavidsonHotellingDeflation.T1
        - inching.Burn.ThickRestartLanczosHotellingDeflation.T1
        - inching.Burn.ImplicitlyRestartedLanczosHotellingDeflation.T1
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - inching --help
      - inching nma --help
      - inching animate --help
      - inching info --help

about:
  homepage: https://github.com/jhmlam/Inching
  summary: Scalable computation of anisotropic vibrations for large macromolecular assemblies
  description: |
    Inching performs GPU-resident Normal Mode Analysis of large macromolecular
    assemblies (millions of atoms) using globally-sparse-yet-locally-dense
    eigenproblem construction and Krylov-subspace eigensolvers (Jacobi-Davidson,
    thick-restart Lanczos, implicitly restarted Lanczos) with Chebyshev
    filtering, sum decomposition and external explicit deflation.
    Lam, J.H., Nakano, A. & Katritch, V. Nat Commun 15, 3479 (2024).
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  repository: https://github.com/jhmlam/Inching

extra:
  recipe-maintainers:
    - jhmlam
