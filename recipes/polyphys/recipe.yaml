context:
  version: "1.0.0"

package:
  name: polyphys
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/polyphys/polyphys-${{ version }}.tar.gz
  sha256: 6c37d65ea9559f0b7d8e008c038b56ad542eedff3596b858b092d42a4ac4585e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}
    - numpy >=2.0
    - pandas >=3.0
    - scipy >=1.14.1
  run_constraints:
    - mdanalysis >=2.8
    - matplotlib-base >=3.8.4

tests:
  - python:
      imports:
        - polyphys
        - polyphys.spec
        - polyphys.analyze
        - polyphys.manage
        - polyphys.simulate
        - polyphys.viz.colors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - mdanalysis
        - matplotlib-base
    script:
      - python -c "import polyphys.probe, polyphys.viz.helpers"

about:
  homepage: https://github.com/amirhs1/PolyPhys
  summary: Computer Simulation Data Management and Analysis.
  description: |
    PolyPhys manages and analyzes the data of large-scale polymer
    molecular-dynamics simulations. It turns the filename-encoded output of
    coarse-grained LAMMPS parameter sweeps into replicate-averaged
    measurements. The probe layer needs mdanalysis and the viz layer needs
    matplotlib-base; install them alongside polyphys when you use those
    layers.
  license: MIT
  license_file: LICENSE
  documentation: https://polyphys.readthedocs.io/en/latest/
  repository: https://github.com/amirhs1/PolyPhys

extra:
  recipe-maintainers:
    - amirhs1
