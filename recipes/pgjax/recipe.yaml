schema_version: 1

context:
  version: "0.1.0"
  name: "pgjax"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pgjax-${{ version }}.tar.gz
  sha256: 3cb526aeab1c26a2c588e327ea4115a01d337f23f828d14aa3e4b97581704408

build:
  number: 0
  skip:
    - win
    - python < "3.12"

  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - scikit-build-core >=0.10
    - nanobind >=2.0
    - jax >=0.9.0
    - pip
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - make

  run:
    - python
    - jax >=0.9.0
    - numpy

tests:
  - python:
      imports:
        - pgjax
      pip_check: true

about:
  summary: JAX-native on-device Pólya-Gamma sampler as an XLA FFI custom call
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/knaaptime/pgjax

extra:
  recipe-maintainers:
    - knaaptime
