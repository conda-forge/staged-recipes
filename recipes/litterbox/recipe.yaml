context:
  version: "0.6.2"

package:
  name: litterbox
  version: ${{ version }}

source:
  url: https://github.com/Gerharddc/Litterbox/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7a2244c7cbe7197ea89d5a996ea0598ed9fef471a1b07c03e4aae852289dcdd8

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - cd litterbox
      # upstream release lockfiles still contain the previous package version, meaning we need to correct them to be usable with `--locked`
      - sed -i -e '/^name = "litterbox"$/,+1 s/version = "0.6.1"/version = "${{ version }}"/' -e '/^name = "lbx-init"$/,+1 s/version = "0.6.1"/version = "${{ version }}"/' -e '/^name = "shared"$/,+1 s/version = "0.6.1"/version = "${{ version }}"/' Cargo.lock ../lbx-init/Cargo.lock ../shared/Cargo.lock
      - cargo auditable install --path=.           --root="$PREFIX" --no-track --locked --bins
      - cargo auditable install --path=../lbx-init --root="$PREFIX" --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=../THIRDPARTY.yml
  skip: not linux

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses

tests:
  - script:
      - litterbox --help
      - litterbox --version
      - lbx-init --help
      - lbx-init --version
  - package_contents:
      bin:
        - litterbox
        - lbx-init
      strict: true

about:
  summary: Somewhat isolated development environments
  description: |
    Litterbox is a Linux sandbox environment for developers. It provides some
    isolation between a containerised development environment and the host
    system, while also offering a repeatable and documented environment for
    development.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://litterbox.work/
  repository: https://github.com/Gerharddc/Litterbox

extra:
  recipe-maintainers:
    - salim-b
