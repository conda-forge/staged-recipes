schema_version: 1

context:
  version: "0.4.1"

package:
  name: xbuild
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/x/xbuild/xbuild-${{ version }}.tar.gz
  sha256: f0b1f76adab44b1be6d0587d1433ced1a0903e7402ef381f6f7c35b0e8126d17

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - xbuild = xbuild.__main__:entrypoint
      - xvenv = xvenv.__main__:entrypoint
      - xpython = xpython.__main__:entrypoint

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools ==84.0.0
    - setuptools-scm ==10.3.4
    - pip
  run:
    - python >=${{ python_min }}
    - python-build >=1.6.0
    - dependency-groups
    - platformdirs
    - filelock
    - tomli-w

tests:
  - python:
      imports:
        - xbuild
        - xpython
        - xvenv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - xbuild --version
      - xvenv --version
      - xpython --version

about:
  summary: A PEP517 build frontend for cross-compiling wheels.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/xbuild/
  repository: https://github.com/beeware/xbuild
  documentation: https://xbuild.beeware.org/

extra:
  recipe-maintainers:
    - freakboy3742
