context:
  version: "1.3.0"

package:
  name: spring2
  version: ${{ version }}

source:
  url: https://github.com/thisisamirv/SPRING2/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 379e91915f4d6ed5b72e6cfa5d2b2ea41f4b4096e4259c6777bbb4f260826036

build:
  number: 0
  variant:
    # python is a build-time codegen tool here, not an ABI dependency, so the
    # binary is identical across pythons; without this we'd build one per python.
    ignore_keys:
      - python

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.31
    - nasm
    # CMakeLists.txt does find_package(Python3 REQUIRED) to embed the reference
    - python
    - if: unix
      then: make
    - if: win
      then: ninja
  host:
    - if: linux
      then: _openmp_mutex * *_gnu
    - if: osx
      then: llvm-openmp
  run:
    - if: linux
      then: _openmp_mutex * *_gnu
    - if: osx or win
      then: llvm-openmp

tests:
  - script:
      - spring2 --version
      - spring2 --help

about:
  homepage: https://spring2.readthedocs.io/
  summary: Cross-platform FASTQ/FASTA compressor and decompressor
  description: |
    SPRING2 is a modernized derivative of SPRING for compressing and
    decompressing FASTQ/FASTA genomic read data across Linux, macOS, and Windows.
  license: LicenseRef-SPRING
  license_file:
    - LICENSE
    - REDISTRIBUTION_PERMISSION.md
  repository: https://github.com/thisisamirv/SPRING2

extra:
  recipe-maintainers:
    - thisisamirv
