context:
  version: "0.6.2"

package:
  name: policyengine-ng
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/policyengine-ng/policyengine_ng-${{ version }}.tar.gz
  sha256: e5ae29dec5124dcf24884c681d1bd131867514e207b7ebf769f0e0ed5bfe1efa

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2.1,<3
    - policyengine-core >=3.25,<4

tests:
  - python:
      imports:
        - policyengine_ng
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PolicyEngine/policyengine-ng
  summary: PolicyEngine tax-benefit model for Nigeria
  license: AGPL-3.0-only
  license_file: LICENSE
  repository: https://github.com/PolicyEngine/policyengine-ng

extra:
  recipe-maintainers:
    - MementoRC
