schema_version: 1

context:
  version: "3.36.0"

package:
  name: sardana-nxsrecorder
  version: ${{ version }}

source:
  url: https://github.com/nexdatas/sardana-nxs-recorder/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e9662b375e49e5b5771a827867b6ddb360ae8799528f84d2489bb1a2ba756b16

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - pytango
    - nxstools >=4.29.0
    - numpy
    - lxml
    - pytz
    - sardana
    - nxsrecselector

tests:
  - python:
      imports:
        - sardananxsrecorder
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nexdatas/sardana-nxs-filerecorder
  repository: https://github.com/nexdatas/sardana-nxs-filerecorder
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: Sardana NeXus File Recorder 
  description: |
    NeXus scan recorder for Sardana which stores experimenal data
    in NeXus/HDF5 file with use of NeXDatas Tango Server or packages,
    i.e. NXSDataWriter, NXSConfigServer, NXSRecSelector.

extra:
  recipe-maintainers:
    - jkotan
