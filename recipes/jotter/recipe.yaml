context:
  version: "0.5.2"

package:
  name: jotter
  version: ${{ version }}

source:
  url: https://github.com/samox73/jotter/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9d067863ea535db6005c20b4dbdaf6f96a701678509a9360aea458238adb6780

build:
  number: 0
  skip: win
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script: jotter --help
  - package_contents:
      bin:
        - jotter
      strict: true

about:
  homepage: https://samox73.github.io/jotter
  summary: |
    A fast Jupyter notebook TUI with vim keys, inline plots and rendered LaTeX
  description: |
    A fast Jupyter notebook TUI. Open, edit and run real .ipynb notebooks in
    your terminal, with vim keys, inline plots and rendered LaTeX.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  documentation: https://samox73.github.io/jotter
  repository: https://github.com/samox73/jotter

extra:
  recipe-maintainers:
    - apcamargo
