context:
  name: subsurfix
  version: "0.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9cab87d4b0d50a97b0e86969c458b92b39c1aa9d03b9bcee0698681744bb8eb8

build:
  number: 0
  skip:
    - win
    - match(python, "<3.12")
  script:
    content:
      - export LIBCLANG_PATH="$BUILD_PREFIX/lib"
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.14,<1.15
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cmake
    # bindgen in lightgbm3-sys needs libclang
    - libclang
    - clang
    - make
  host:
    - python
    - pip
    - maturin >=1.14,<1.15
    - if: osx
      then:
        - llvm-openmp
    - if: linux
      then:
        - _openmp_mutex
  run:
    - python
    - numpy >=1.26.4
    - pyarrow >=25.0.0
    - pyproj >=3.8.0
    - shapely >=2.1.2
    - pyshp >=3.1.6
    - openpyxl >=3.1.5
    - python-calamine >=0.4.0
    - flopy >=3.9.1
    - pyvista >=0.44
    - imageio >=2.31
    - omf >=1.0.1,<2
    - if: osx
      then:
        - llvm-openmp

tests:
  - python:
      imports:
        - subsurfix
        - subsurfix._native
      # omf's deps (properties, vectormath) ship conda metadata that pip check
      # flags as "not supported on this platform"; unrelated to this package
      pip_check: false
  - requirements:
      run:
        - pip
    script:
      - python -c "import subsurfix, subsurfix._native; print(subsurfix.__version__)"
      - pip show subsurfix

about:
  summary: A tool for automation in subsurface geological/petrophysical analysis and geomodeling workflows
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - NOTICE
    - THIRDPARTY.yml
  homepage: https://geolarrylai.com/projects/SubsurfiX/
  repository: https://github.com/GeoLarryLai/SubsurfiX

extra:
  recipe-maintainers:
    - GeoLarryLai
