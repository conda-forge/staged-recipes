context:
  version: "2026.9.26.post1"

package:
  name: manimgx-fonts-cjk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/manimgx-fonts-cjk/manimgx_fonts_cjk-${{ version }}.tar.gz
  sha256: d629f6aa180a50650de180cc647a2f18449b97bc8e56e27e52fd6a769323b521

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - manimgx_fonts_cjk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - package_contents:
      site_packages:
        - manimgx_fonts_cjk
        - manimgx_fonts_cjk/NotoSansCJK-VF.otf.ttc

about:
  homepage: https://manimgx.academa.ai/
  repository: https://github.com/academa-labs/manimgx
  documentation: https://manimgx.academa.ai/
  summary: The Noto Sans CJK font ManimGX sets Chinese, Japanese and Korean text in
  license: OFL-1.1
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
