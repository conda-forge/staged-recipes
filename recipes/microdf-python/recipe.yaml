context:
  version: "1.5.12"

package:
  name: microdf-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/microdf-python/microdf_python-${{ version }}.tar.gz
  sha256: f0c734c249d12b663fe41882a357e60374eae50610951f151dc853a1992f29e1

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas

tests:
  - python:
      imports:
        - microdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PolicyEngine/microdf
  summary: Survey microdata analysis with weighted pandas DataFrames
  license: MIT
  license_file: LICENSE
  repository: https://github.com/PolicyEngine/microdf

extra:
  recipe-maintainers:
    - MementoRC
