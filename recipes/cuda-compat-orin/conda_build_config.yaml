# The global pinning is 2.17 on linux, but libcudadebugger.so.1 in the prebuilt archive needs
# a newer glibc, so check-glibc rejects it against that pin:
#
#   $ readelf -V compat_orin/libcudadebugger.so.1 | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
#   GLIBC_2.25
#
# Everything else in the archive stays at 2.17. 2.28 is the next sysroot conda-forge ships.
c_stdlib_version:  # [linux]
  - "2.28"         # [linux]
