context:
  version: "1.1.4"

package:
  name: esp-pylib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/esp_pylib/esp_pylib-${{ version }}.tar.gz
  sha256: dcbd717e8a0d7139d18c28352b637f0ee70fc8e40f0db1c090796c9fad16c89a

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python
    - setuptools >=64
    - wheel
  run:
    - click >=8.0,<9
    - pyserial >=3.3
    - python
    - rich
    - rich-click >=1.7,<2
    - websockets >=12.0

tests:
  - python:
      imports:
        - esp_pylib
      pip_check: true

about:
  homepage: https://github.com/espressif/esp-pylib
  summary: 'Python library for logging, utils and constants for Espressif Systems Python projects'
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/espressif/esp-pylib

extra:
  recipe-maintainers:
    - m-rossi
