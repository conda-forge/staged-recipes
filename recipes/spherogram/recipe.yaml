schema_version: 1

context:
  name: spherogram
  version: "2.4.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9351a77308fee452421b914ae55f3cdaff805692b834777aa6a034a9a85bf970

build:
  number: 0
  script:
    # Remove pre-generated Cython output so it is regenerated with conda-forge's Cython
    - if: win
      then: del /f planarity_src\planarity.c planarmap_src\planarmap.c
      else: rm -f planarity_src/planarity.c planarmap_src/planarmap.c
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    - cython
  run:
    - python
    - decorator
    - networkx
    - packaging
    - snappy-manifolds >=1.4
    - knot-floer-homology >=1.2.2

tests:
  - python:
      imports:
        - spherogram
        - spherogram.planarity
        - spherogram.planarmap
        - spherogram.links
      pip_check: true
  - script:
      - python -m spherogram.test

about:
  homepage: https://github.com/3-manifolds/Spherogram
  repository: https://github.com/3-manifolds/Spherogram
  documentation: https://snappy.computop.org/spherogram.html
  summary: Spherical diagrams for 3-manifold topology
  description: |
    Spherogram is a Python module for dealing with diagrams drawn on the
    2-sphere: links, planar graphs, and related objects. It is used by
    SnapPy, and includes a vendored copy of the Edge Addition Planarity
    Suite and Gilles Schaeffer's PlanarMap random map generator.
  # Spherogram is GPL-2.0-or-later; the vendored Edge Addition Planarity Suite is BSD-3-Clause.
  license: GPL-2.0-or-later AND BSD-3-Clause
  license_file:
    - LICENSE-GPL-2.0.txt
    - LICENSE-planarity.txt

extra:
  recipe-maintainers:
    - soapy1
