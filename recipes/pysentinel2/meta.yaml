{% set name = "pysentinel2" %}
{% set version = "0.1.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pysentinel2/pysentinel2-{{ version }}.tar.gz
  sha256: c932ee9a22f6d62dcbc1f8700f10a6e73896735110a355f444effc2a253e56f5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >={{ python_min }}
    - troi-core
    - attrs
    - typing_extensions
    - numpy
    - xarray
    - zarr
    - dask
    - pyproj
    - affine
    - odc-stac
    - odc-geo
    - pystac
    - pystac-client
    - urllib3
    - opencv
    - rioxarray

test:
  imports:
    - pysentinel2
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/thestochasticman/pysentinel2
  summary: Machine-wide self-filling Sentinel-2 datacube over Digital Earth Australia
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thestochasticman
    - johnburley3000
