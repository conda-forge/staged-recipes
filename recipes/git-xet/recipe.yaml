context:
  version: "0.2.1"

package:
  name: git-xet
  version: ${{ version }}

source:
  url: https://github.com/huggingface/xet-core/archive/refs/tags/git-xet-v${{ version }}.tar.gz
  sha256: df2a90a8266918bf2aba35e22276c745d11bd9c39850410f78ebbf2b50d0c87c

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path git_xet
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path git_xet
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - pkgconf
    - zlib
    - if: win
      then: nasm
  host:
    - libgit2
    - openssl
  run:
    - git-lfs

tests:
  - package_contents:
      bin:
        - git-xet
    strict: true
  - script:
      - git xet --version
      - git init test-repo
      - cd test-repo
      - git xet track "*.bin"
      # "git xet track" delegates to "git lfs track", which registers the
      # pattern in .gitattributes.
      - if: unix
        then: grep -qF "*.bin filter=lfs diff=lfs merge=lfs -text" .gitattributes
        else: findstr /c:"*.bin filter=lfs diff=lfs merge=lfs -text" .gitattributes

about:
  homepage: https://github.com/huggingface/xet-core
  summary: A Git LFS custom transfer agent for the Xet protocol
  description: |
    Git-Xet is a Git LFS custom transfer agent that implements upload and
    download of files using the Xet protocol. Install git-xet, follow your
    regular workflow to `git lfs track ...`, `git add ...`, `git commit ...`
    and `git push`, and your files are uploaded to Hugging Face repos using
    the Xet protocol. Enjoy the dedupe!
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/huggingface/xet-core

extra:
  recipe-maintainers:
    - ruben-arts
