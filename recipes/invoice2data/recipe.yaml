schema_version: 1

context:
  version: "1.0.0"

package:
  name: invoice2data
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/invoice2data/invoice2data-${{ version }}.tar.gz
  sha256: 1f3cb559b7e7aa7ee4f7d7dc061e4d45cfd84de47c0f34c45cd5e7b10fce018e

build:
  # Pure-Python: invoice2data's mypyc compilation is opt-in
  # (INVOICE2DATA_COMPILE_MYPYC=1, off by default), so a plain pip install needs
  # no compiler and the package can ship noarch.
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click >=8.0.1
    - python-dateutil >=2.8
    - pyyaml >=6.0
    - regex >=2024.4.16

tests:
  - python:
      imports:
        - invoice2data
        - invoice2data.extract
        - invoice2data.input
        - invoice2data.output
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - invoice2data --help

about:
  homepage: https://github.com/invoice-x/invoice2data
  summary: Python parser to extract data from pdf invoice
  description: |
    A command-line tool and Python library to automate extraction of data from
    PDF invoices, using a flexible YAML/JSON template system, pluggable input
    backends (pypdfium2 by default, plus pdftotext, OCR and others) and
    CSV / JSON / XML output.
  license: MIT
  license_file: LICENSE.md
  documentation: https://invoice2data.readthedocs.io
  repository: https://github.com/invoice-x/invoice2data

extra:
  recipe-maintainers:
    - bosd
