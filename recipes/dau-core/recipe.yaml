schema_version: 1

context:
  version: "0.4.0"

package:
  name: dau-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dau-core/dau_core-${{ version }}.tar.gz
  sha256: e198d823c5a697a78b6e3291667cfac993c0a31286f3556362c98579675da873

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - ccflow >=0.9
    - hydra-core
    - pydantic >=2

tests:
  - python:
      imports:
        - dau_core
        - dau_core.config
        - dau_core.registry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    files:
      source:
        - dau_core/tests/test_design.py
        - dau_core/tests/test_record_batch.py
        - dau_core/tests/test_hdl_sources.py
    script:
      - python -m pytest dau_core/tests -v
      - python -c "from importlib.resources import files; assert files('dau_core.config').joinpath('dau-core/cores.yaml').is_file()"

about:
  homepage: https://github.com/dau-dev/dau-core
  repository: https://github.com/dau-dev/dau-core
  summary: Core IP for dau projects
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - timkpaine
