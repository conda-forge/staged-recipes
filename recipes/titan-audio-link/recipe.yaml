schema_version: 1
package:
  name: titan-audio-link
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Titan-Audio-Link/language-sdks-v1.0.0/titan-audio-link-sdk-source-1.0.0.zip
  sha256: 24fcf346043dc6ea23ec3b907cca6d05cb84413bba68580996c0f0c74daf93b6
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - titan_audio_link
    pip_check: true
- script:
  - python -m pip check
  - python -c "from titan_audio_link import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Titan-Audio-Link
  summary: Windows x64 Titan-Audio-Link Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Titan-Audio-Link-C-ffi/LICENSE
  - Titan-Audio-Link-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
