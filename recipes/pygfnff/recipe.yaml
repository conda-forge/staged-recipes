context:
  version: "0.0.3"

package:
  name: pygfnff
  version: ${{ version }}

source:
  url: https://github.com/LiuGaoyong/PyGFNFF/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8692491a34477a46d700ad117fc5515a4730e93c02b832e9781967651f017646

build:
  number: 0
  # The CMake build only supports GNU or Intel Fortran compilers; conda-forge
  # ships flang on Windows.
  skip: win
  script:
    - ${{ PYTHON }} -m pip install . -vv -Ccmake.define.BLA_VENDOR=Generic

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - python
    - pip
    - scikit-build-core >=0.11
    - f2py-cmake
    - numpy
    - libblas
    - liblapack
  run:
    - python
    - ase
    - typing-extensions

tests:
  - python:
      imports:
        - pygfnff
        - pygfnff._pygfnfflib
      pip_check: true
  - files:
      source:
        - tests/
    requirements:
      run:
        - pytest
    script:
      - pytest -v tests

about:
  homepage: https://github.com/LiuGaoyong/PyGFNFF
  summary: A Python library for GFN-FF, wrapping the Fortran implementation via F2PY.
  description: |
    PyGFNFF provides Python bindings (built with NumPy F2PY) to the GFN-FF
    general force field, including an ASE calculator interface.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://github.com/LiuGaoyong/PyGFNFF

extra:
  recipe-maintainers:
    - LiuGaoyong
