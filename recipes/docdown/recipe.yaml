context:
  version: "1.1.0"
  npm_version: "${{ version }}-stable"

package:
  name: downdoc
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/downdoc/-/downdoc-${{ npm_version }}.tgz
  sha256: 0649181e80c9e4bd9b7d279f21c1591ddfd34c174bad00497bdfc957ca37b1b7

build:
  number: 0
  script:
    - if: win
      then:
        - call npm pack
        - call npm install --global downdoc-${{ npm_version }}.tgz --prefix "%PREFIX%"
      else:
        - npm pack
        - npm install --global downdoc-${{ npm_version }}.tgz --prefix "$PREFIX"

requirements:
  build:
    - nodejs >=16.17
  run:
    - nodejs >=16.17

tests:
  - package_contents:
      bin:
        - downdoc
  - script:
      - if: win
        then:
          - call downdoc --version
          - call downdoc --help
        else:
          - downdoc --version
          - downdoc --help

about:
  homepage: https://github.com/opendevise/downdoc
  repository: https://github.com/opendevise/downdoc
  documentation: https://github.com/opendevise/downdoc#readme
  summary: Rapidly down-converts AsciiDoc to Markdown
  description: |
    downdoc provides a command-line interface and JavaScript function for
    rapidly down-converting AsciiDoc documents to Markdown.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - phreed
