schema_version: 1

context:
  version: "1.0.1"

package:
  name: scingestor
  version: ${{ version }}

source:
  url: https://github.com/jkotan/scingestor/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 2a03cb692fb4f5ff4efbd716dc711dc8350bfcd105685d8fd5ef02ed812a2532

build:
  number: 0
  skip:
    - win
    - osx
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python
    - numpy
    - argcomplete
    - nxstools >=3.56.1
    - requests
    - pyyaml
    - inotify_simple >=2.0.1

tests:
  - python:
      imports:
        - scingestor
        - scingestor.beamtimeWatcher
        - scingestor.configuration
        - scingestor.datasetIngestor
        - scingestor.datasetIngest
        - scingestor.datasetWatcher
        - scingestor.logger
        - scingestor.modelIngest
        - scingestor.pathConverter
        - scingestor.safeINotifier
        - scingestor.scanDirWatcher
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - if: unix or osx
        then:
          - test -x "$PREFIX/bin/scicat_dataset_ingestor"
          - test -x "$PREFIX/bin/scicat_dataset_ingest"
          - test -x "$PREFIX/bin/scicat_ingest"
          - scicat_dataset_ingestor --help
          - scicat_dataset_ingest --help
          - scicat_ingest --help
    requirements:
      run:
        - python ${{ python_min }}.*


about:
  homepage: https://github.com/jkotan/scingestor
  repository: https://github.com/jkotan/scingestor
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: Scicat Dataset Ingestor
  description: |
    The scingestor python package provides a support
    for scripts which ingest Datasets and OrigDatablocks
    into the SciCat metadata server.

extra:
  recipe-maintainers:
    - jkotan
