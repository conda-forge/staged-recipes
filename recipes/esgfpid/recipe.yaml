context:
  version: "0.8.2"

package:
  name: esgfpid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/esgfpid/esgfpid-${{ version }}.tar.gz
  sha256: 4f632021de05ff8ff4afdf6877eaa63188f2f81bbf360d7b84c4a0362e6092b9

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pika >=1.0.1,<=1.1.0
    - requests >=2.22.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - esgfpid
        - esgfpid.assistant
        - esgfpid.rabbit
        - esgfpid.solr
        - esgfpid.utils
      pip_check: true

about:
  homepage: https://github.com/IS-ENES-Data/esgf-pid
  summary: Library for sending PID requests to a rabbit messaging queue during ESGF publication.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/IS-ENES-Data/esgf-pid

extra:
  recipe-maintainers:
    - cofinoa
