context:
  version: "4.2.0"

package:
  name: keyring-rs
  version: ${{ version }}

source:
  url: https://github.com/open-source-cooperative/keyring-rs/archive/v${{ version }}.tar.gz
  sha256: 983887b709ea48b7196ed02ac5b3d06ac29db8f6149559a1239f74e483c62b9f

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
      - if: unix
        then: cargo auditable install -j ${CPU_COUNT} --root "${PREFIX}" --path . --locked --no-track --features cli --example keyring-cli
        else: cargo auditable install -j %CPU_COUNT% --root "%LIBRARY_PREFIX%" --path . --locked --no-track --features cli --example keyring-cli

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - keyring-cli --help
      - keyring-cli info
  - package_contents:
      strict: true
      bin:
        - keyring-cli

about:
  homepage: https://github.com/open-source-cooperative/keyring-rs
  summary: "Cross-platform library and utility to manage passwords."
  description: |
    The keyring-cli binary produced by building the keyring-cli example app in this crate is a command-line interface for issuing one keyring call at a time and examining its results.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  repository: https://github.com/open-source-cooperative/keyring-rs

extra:
  recipe-maintainers:
    - XhstormR
