schema_version: 1

context:
  version: "1.10.5"

package:
  name: nxsconfigserver-db
  version: ${{ version }}

source:
  url: https://github.com/nexdatas/nxsconfigserver-db/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5fe791301baa169122b159e84db6b54fc0c00ec527a568f9cd0e12de7f6b03f0

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - mysql-client # Provides the 'mysql' command line tool

tests:
  - script:
      - if: unix or osx
        then:
          - test -f "$PREFIX/share/nxsconfigserver/mysql_create.sql"
          
          # - mkdir -p ./tmp_mysql
          # - mysqld --initialize-insecure --datadir=./tmp_mysql --user=$(whoami)
          # - mysqld --datadir=./tmp_mysql --port=3307 --socket=./tmp_mysql/mysql.sock --user=$(whoami) &
          # - MYSQL_PID=$!
          # - sleep 5
          # - export DB_HOST="127.0.0.1"
          # - export DB_PORT="3307"
          # - export DB_USER="root"
          # - export DB_PASSWORD=""
          # - export DB_SOCKET="./tmp_mysql/mysql.sock"
          # - my-app init-db --name="production_test_db"
          # - mysqldump nxsconfig
          # - kill $MYSQL_PID
    requirements:
      run:
        - mysql-server
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/nexdatas/nxsconfigserver-db
  repository: https://github.com/nexdatas/nxsconfigserver-db
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: NeXDaTaS configuration server database
  description: |
    NeXuS Configuration Server is a Tango Server with its implementation
    based on a MySQL database. It allows to store XML configuration
    datasources and components. It also gives possibility to select
    mandatory components and perform the process of component merging.

extra:
  recipe-maintainers:
    - jkotan
