schema_version: 1
package:
  name: usb-over-ip-sdk
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/USB-over-IP-SDK/language-sdks-v1.0.0/usb-over-ip-sdk-sdk-source-1.0.0.zip
  sha256: 0e1b02c778322a725ded9369aa1b42fbf6f92fa3b8662d44874bc1b79c584c4f
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - usb_over_ip_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from usb_over_ip_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/USB-over-IP-SDK
  summary: Windows x64 USB-over-IP-SDK Python SDK with source-built native bridge
  license: MIT
  license_file:
  - USB-over-IP-SDK-C-ffi/LICENSE
  - USB-over-IP-SDK-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
