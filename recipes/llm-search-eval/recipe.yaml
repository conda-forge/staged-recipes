context:
  name: llm-search-eval
  version: "0.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/llm_search_eval-${{ version }}.tar.gz
  sha256: 725fe281653633ba6fd6d8ab4b37001f84c53962c659167d233b4ea846bd1a8c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - llm-search-eval = llm_search_eval.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.21
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - llm_search_eval
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - llm-search-eval --help

about:
  homepage: https://github.com/sadrmanesh/llm-search-eval
  summary: Evaluate product search quality with IR metrics, LLM relevance judges, and CI quality gates
  description: |
    llm-search-eval measures search quality with nDCG, precision, recall, MRR, and
    MAP, fills label gaps with panels of LLM relevance judges, reports judge
    agreement, cost, paired significance tests, and bootstrap confidence
    intervals, and fails CI when a ranking change regresses. It has no runtime
    dependencies.
  license: MIT
  license_file: LICENSE
  documentation: https://sadrmanesh.github.io/llm-search-eval/
  repository: https://github.com/sadrmanesh/llm-search-eval

extra:
  recipe-maintainers:
    - sadrmanesh
