schema_version: 1

context:
  version: "1.23.0"
  python_min: "3.10"

package:
  name: labjack-ljm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/labjack-ljm/labjack-ljm-${{ version }}.tar.gz
  sha256: 9d47838c59a74468b81de348689c6c534214bb93ee5a99b91c94b291cd4a49c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - labjack
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Python wrapper for the LabJack LJM library
  license: MIT
  license_file: LICENSE.TXT
  homepage: https://labjack.com/support/software/examples/ljm/python

extra:
  recipe-maintainers:
    - wolfv
