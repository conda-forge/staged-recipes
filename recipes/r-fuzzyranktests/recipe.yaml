schema_version: 1

context:
  version: "0.5"

package:
  name: r-fuzzyranktests
  version: ${{ version }}

source:
  url:
    - https://cran.r-project.org/src/contrib/fuzzyRankTests_${{ version }}.tar.gz
    - https://cran.r-project.org/src/contrib/Archive/fuzzyRankTests/fuzzyRankTests_${{ version }}.tar.gz
  sha256: fb3ed55d2650b35b21bfb2e7c63753cf02a83a37f5111fb3fb0c973b9c06a1e0

build:
  number: 0
  script:
    - Rscript -e "stopifnot(file.copy(file.path(R.home('share'), 'licenses', 'MIT'), 'LICENSE-MIT'))"
    - R CMD INSTALL --build .
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  build:
    - if: build_platform != target_platform
      then: cross-r-base ${{ r_base }}
    - if: unix
      then: ${{ compiler('c') }}
    - if: win
      then: ${{ compiler('m2w64_c') }}
    - if: unix
      then: ${{ stdlib('c') }}
    - if: win
      then: ${{ stdlib('m2w64_c') }}
    - make
  host:
    - r-base
  run:
    - r-base

tests:
  - script: Rscript --vanilla run_test.R
    files:
      recipe:
        - run_test.R

about:
  homepage: https://cran.r-project.org/package=fuzzyRankTests
  summary: Fuzzy rank tests and confidence intervals
  license: MIT
  license_file:
    - LICENSE
    - LICENSE-MIT

extra:
  recipe-maintainers:
    - whatever60
