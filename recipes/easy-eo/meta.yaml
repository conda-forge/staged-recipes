{% set name = "easy-eo" %}
{% set version = "0.2.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/easy_eo-{{ version }}.tar.gz
  sha256: 331c8bed961f61f75e421729c7a3a525ac5fc45bdb81f39e2536d0109216a933

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - rasterio >=1.4,<2
    - geopandas >=1.1,<2
    - numpy >=1.26,<3
    - matplotlib-base >=3.8

test:
  imports:
    - eeo
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/Tommy-Burns/easy-eo
  summary: A lightweight Earth Observation utilities library for chainable raster operations
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://easy-eo.readthedocs.io/en/latest/
  dev_url: https://github.com/Tommy-Burns/easy-eo

extra:
  recipe-maintainers:
    - Tommy-Burns
