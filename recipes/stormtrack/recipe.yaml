schema_version: 1

context:
  name: stormtrack
  version: "0.4.0"
  python_min: "3.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/ed/50/d925817a6044032769c733ebeaac9fd697ab963c7a1fa6f3838ed227cbf6/${{ name }}-${{ version }}.tar.gz
  sha256: b54633048f252e1653c34ee13d65f4e932120acdecdf38ebe6be372dfc3b2aad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - stormtrack = stormtrack.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - pandas >=1.5
    - pyarrow >=10.0

tests:
  - python:
      imports:
        - stormtrack
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - stormtrack --help

about:
  homepage: https://github.com/atmospy/stormtrack
  summary: Tropical-cyclone best tracks and forecasts in Python (IMD, IBTrACS, NHC/JTWC) as pandas / xarray
  description: |
    stormtrack serves the India Meteorological Department (RSMC New Delhi) best-track
    record and IBTrACS as tidy pandas DataFrames and CF-style xarray Datasets, reads
    real-time NHC and JTWC storms and forecasts, and provides analysis, comparison and
    forecast-verification tools. Optional extras add xarray output ([xarray]), cartopy
    map plotting ([plot]), shapely cones ([geo]) and the workbook-parsing pipeline ([pipeline]).
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://stormtrack.readthedocs.io/
  repository: https://github.com/atmospy/stormtrack

extra:
  recipe-maintainers:
    - syedhamidali
