schema_version: 1
package:
  name: fyrainput-gamepad
  version: 1.0.0
source:
- url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/FyraInput-Gamepad/input-language-sdks-v1.0.0/fyrainput-gamepad-input-sdks-1.0.0-source.zip
  sha256: cffba97a0a605fb12dd8db651ccd36c70e872dff401a44c8b2912f18145e83d5
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - fyrainput_gamepad
    pip_check: true
- script:
  - python -m pip check
  - python -c "from fyrainput_gamepad import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/FyraInput-Gamepad-SDK
  summary: Windows x64 FyraInput-Gamepad Python SDK with source-built native bridge
  license: MIT
  license_file:
  - FyraInput-Gamepad-C-ffi/LICENSE
  repository: https://github.com/TitanCSA/FyraInput-Gamepad-SDK
extra:
  recipe-maintainers:
  - TitanCSA
