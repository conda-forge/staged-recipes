schema_version: 1

context:
  version: "2.8.0"

package:
  name: adanos
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/adanos/adanos-${{ version }}.tar.gz
  sha256: cf5ad2675604d18f21a0ea1d438c62abfc6470baef2801ec6ca562a99dd6950e

build:
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx >=0.23,<1
    - attrs >=22.2
    - python-dateutil >=2.8

tests:
  - python:
      imports:
        - adanos
        - adanos._generated.client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script: python -m pytest tests -q --asyncio-mode=auto
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest >=8
        - pytest-asyncio >=0.23
        - respx >=0.22
    files:
      source:
        - tests/

about:
  homepage: https://adanos.org
  summary: Python SDK for the Adanos Market Sentiment API
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/adanos-software/adanos-python-sdk#readme
  repository: https://github.com/adanos-software/adanos-python-sdk

extra:
  recipe-maintainers:
    - alexander-schneider
