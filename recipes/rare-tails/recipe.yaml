schema_version: 1

context:
  version: "0.1.0"

package:
  name: rare-tails
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rare-tails/rare_tails-${{ version }}.tar.gz
  sha256: 10a1a3f9f03f3c76700aed005a3689c73354f653965239ccf6aa42a81f6f7300

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.26
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - pandas >=2.0
    - jax >=0.4.30

tests:
  - python:
      imports:
        - tails
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "Batched extreme-value analysis in Python: GEV, GPD, peaks over threshold, and IDF curves, for one station or thousands of series."
  license: MIT
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/rare-labs/tails
  documentation: https://rare-labs.github.io/tails/
  repository: https://github.com/rare-labs/tails

extra:
  recipe-maintainers:
    - camarois
