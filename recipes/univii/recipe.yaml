schema_version: 1

context:
  version: "0.1.0"

package:
  name: univii
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/univii/univii-${{ version }}.tar.gz
  sha256: fa2e610b075fffecac673e44ea1769098ccb2872967925c2cbd16787b8dc2b0d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - univii = univii.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.26
    - scipy >=1.11
    - pandas >=2.1
    - anndata >=0.10
    - scanpy >=1.11
    - pytorch >=2.2
    - scikit-learn >=1.3
    - h5py >=3.10
    - pyyaml >=6.0
    - matplotlib-base >=3.8
    - seaborn >=0.13
    - python-igraph >=0.11
    - leidenalg >=0.10
    - tqdm >=4.66
    - joblib >=1.3
    - openpyxl >=3.1

tests:
  - python:
      imports:
        - univii
        - univii.datasets
        - univii.geometry
        - univii.spatial
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - univii --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/Ashford-A/UniVII
  summary: Multimodal single-cell integration with a mixture-of-experts VAE, hyperbolic latent spaces, convolutional encoders and spatial tools
  description: |
    UniVII extends the UniVI mixture-of-experts multimodal variational autoencoder for
    single-cell multi-omics with hyperbolic and product latent spaces, convolutional
    encoders and decoders, spatial tools, and a plug-in registry for custom architectures.
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/Ashford-A/UniVII/tree/main/docs
  repository: https://github.com/Ashford-A/UniVII

extra:
  recipe-maintainers:
    - Ashford-A
