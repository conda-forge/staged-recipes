context:
  version: "0.1.14"

package:
  name: confident-trace
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/confident-trace/confident_trace-${{ version }}.tar.gz
  sha256: 5bc2165abbef7077e93a0f8b2951a050bae4c4f4618c7dacb2f9d1eb82b92e3e

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.39,<2
    - opentelemetry-sdk >=1.39,<2
    - opentelemetry-instrumentation-asgi >=0.60b0,<1
    - opentelemetry-exporter-otlp-proto-http >=1.39,<2
    - opentelemetry-exporter-otlp-proto-grpc >=1.39,<2
    - wrapt >=1.17,<3

tests:
  - python:
      imports:
        - confident_trace
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/confident-ai/confident-trace
  summary: OpenTelemetry-first tracing for AI applications
  description: |
    Confident Trace provides OpenTelemetry-first tracing for AI applications
    and agents, with no proprietary wire format or vendored agent. It is used
    by DeepEval and the Confident AI platform to capture traces from LLM
    applications.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/confident-ai/confident-trace

extra:
  recipe-maintainers:
    - pb01ka
