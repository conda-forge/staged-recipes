context:
  version: "3.1.1"

package:
  name: zxing-cpp
  version: ${{ version }}

source:
  url: https://github.com/zxing-cpp/zxing-cpp/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7286b1e6ade66fe82b7c8208b4595deeb55d6486b410834fdc65702f46650542

build:
  number: 0
  script:
    file: ${{ "build.sh" if unix else "build.bat" }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage('zxing-cpp', upper_bound='x.x') }}

tests:
  - package_contents:
      lib:
        - ZXing
      include:
        - ZXing/ReadBarcode.h
        - ZXing/MultiFormatWriter.h
      files:
        - "**/cmake/ZXing/ZXingConfig.cmake"
  - script:
      - if: unix
        then:
          - cmake -G Ninja -S test/ -B build-test/ ${CMAKE_ARGS}
          - cmake --build build-test/
          - ./build-test/test_zxing_cpp
        else:
          - cmake -G Ninja -S test/ -B build-test/ %CMAKE_ARGS%
          - cmake --build build-test/
          - build-test\test_zxing_cpp.exe
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
    files:
      recipe:
        - test/

about:
  homepage: https://github.com/zxing-cpp/zxing-cpp
  summary: Multi-format 1D/2D barcode image processing library in C++
  description: |
    ZXing-C++ ("zebra crossing") is an open-source, multi-format
    linear/matrix barcode image processing library implemented in C++.
    It was originally ported from the ZXing Java library, but has
    been developed further to include many improvements.
    This package installs only the C++ library, headers and CMake
    config (ZXing::ZXing). Barcode reading is fully supported; barcode
    writing/generation uses the self-contained legacy backend rather
    than the zint-based one (which lives in an un-vendored git
    submodule and cannot be built from a source tarball offline). The
    C API and Python bindings are not built (see the conda-forge
    zxing-cpp-python package for Python).

    Note for reviewers: the `zxing-cpp` name was previously used by a
    Python-bindings feedstock (conda-forge/zxing-cpp-feedstock), which
    its own maintainers agreed was a naming mistake (see
    conda-forge/zxing-cpp-feedstock#2) and migrated to
    zxing-cpp-python-feedstock, leaving zxing-cpp orphaned. This recipe
    reclaims the name for the actual C++ library it names upstream.
    Coordination with conda-forge/core is needed to retire/archive the
    old feedstock per
    https://conda-forge.org/docs/maintainer/guidelines/#renaming-packages.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/zxing-cpp/zxing-cpp

extra:
  recipe-maintainers:
    - TomNysWF
