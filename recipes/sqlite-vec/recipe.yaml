schema_version: 1

context:
  version: "0.1.9"

package:
  name: libsqlite-vec
  version: ${{ version }}

source:
  url: https://github.com/asg017/sqlite-vec/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9823e737d9934dcbe85dff75d3fca81018a9beee803d70fa77b16faab5d61dc9
  patches:
    - 0001-respect-build-flags.patch
    - 0002-avoid-using-uv-in-tests.patch

build:
  number: 0

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler('c') }}
    - gettext  # envsubst for sqlite-vec.h generation
    - if: unix
      then: make
    - if: win
      then:
        - m2-bash
        - m2-coreutils
        - m2-sed
        - m2-make
  host:
    - libsqlite
  # sqlite-vec use sqlite's table interface API, not a linked libsqlite.
  ignore_run_exports:
    by_name:
      - libsqlite

tests:
  - script: bash run_test.sh
    files:
      source:
        - tests/
        - Makefile
      recipe:
        - run_test.sh
    requirements:
      run:
        - python >=3.12
        - pytest
        - numpy
        - syrupy
        - if: unix
          then: make
        - if: win
          then:
            - m2-bash
            - m2-coreutils
            - m2-sed
            - m2-make

about:
  homepage: https://github.com/asg017/sqlite-vec
  summary: SQLite loadable extension for vector search
  description: |
    sqlite-vec is a SQLite loadable extension providing vector search
    functionality through the vec0 virtual table and vec_* SQL functions.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  repository: https://github.com/asg017/sqlite-vec
  documentation: https://alexgarcia.xyz/sqlite-vec/

extra:
  recipe-maintainers:
    - jsmolic
