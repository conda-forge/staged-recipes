context:
  version: "13.0"

package:
  name: pyobjc-framework-libdispatch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyobjc-framework-libdispatch/pyobjc_framework_libdispatch-${{ version }}.tar.gz
  sha256: 840f8f719984b1128ce69e3a586cd10f89a394795885a54be8c1769158cf8555

build:
  number: 0
  skip:
    - not osx
  script:
    # force pyobjc to use conda-forge's chosen SDK
    - export CFLAGS="${CFLAGS} -isysroot ${SDKROOT:-$CONDA_BUILD_SYSROOT}"
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - pyobjc-core >=${{ version }}
    - pyobjc-framework-cocoa >=${{ version }}

tests:
  - python:
      imports:
        - dispatch
        - libdispatch
      pip_check: true

about:
  summary: Wrappers for libdispatch on macOS
  description: |
    PyObjC wrappers for Apple's libdispatch (Grand Central Dispatch) library on
    macOS, exposed as the `dispatch` and `libdispatch` Python modules. Part of
    the PyObjC project; required by e.g. bleak's CoreBluetooth backend.
  homepage: https://github.com/ronaldoussoren/pyobjc
  repository: https://github.com/ronaldoussoren/pyobjc
  documentation: https://pyobjc.readthedocs.io/
  license: MIT
  license_file:
    - License.txt

extra:
  recipe-maintainers:
    - roaldarbol
