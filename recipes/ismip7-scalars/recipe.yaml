schema_version: 1

context:
  name: ismip7-scalars
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ismip/ismip7-scalar-processing/archive/refs/tags/${{ version }}.tar.gz
  sha256: 210bbc1f810e635d1091b1e051cebafff4cd43e33715176608a2a9fcfa4277f5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ismip7-scalars = ismip7_scalars.scalars:main
      - ismip7-scalars-ensemble = ismip7_scalars.ensemble:main
      - ismip7-scalars-set-params = ismip7_scalars.params:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - numpy >=2.1,<3
    - netcdf4 >=1.7,<2
    - isschecker >=0.2,<1
    # Windows is not supported
    - __unix

tests:
  - python:
      imports:
        - ismip7_scalars
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - ismip7-scalars --help
      - ismip7-scalars-ensemble --help
      - ismip7-scalars-set-params --help
  - files:
      source:
        - tests/
        - test-data/
        - manual-tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest >=8
    script:
      - pytest tests

about:
  license: MIT
  license_file: LICENSE
  summary: Sea-level contributions and other scalar diagnostics from ISMIP7 ice sheet model output
  description: |
    ismip7-scalars turns gridded ISMIP7 ice sheet model output into the scalar
    time series the community compares: three sea-level contributions, four
    state scalars and six integrated mass fluxes, for the whole ice sheet and
    optionally for each IMBIE3 basin.  It covers Antarctica (AIS) and
    Greenland (GrIS), and writes each scalar with the standard name, units and
    long name fixed by the ISMIP7 data request.
  homepage: https://github.com/ismip/ismip7-scalar-processing
  repository: https://github.com/ismip/ismip7-scalar-processing
  documentation: https://ismip.github.io/ismip7-scalar-processing/

extra:
  recipe-maintainers:
    - xylar
