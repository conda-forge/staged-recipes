schema_version: 1

context:
  version: "3.0.0"

package:
  name: zen-garden
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zen-garden/zen_garden-${{ version }}.tar.gz
  sha256: 780d584d63ad6ae203f470bf5f434d552fe9271f981e7af3d164443e5077b418

build:
  noarch: python
  python:
    entry_points:
      - zen-garden = zen_garden.cli.zen_garden_cli:create_zen_garden_cli
      - zen-example = zen_garden.cli.zen_example_cli:create_zen_example_cli
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }},<3.14
    - xarray
    - cython
    - numpy
    - pandas >3.0.0
    - scipy
    - pint
    - pytables
    - pydantic
    - tsam >=4.0
    - h5py
    - netcdf4
    - filelock
    - ordered-set
    - pyogrio
    - psutil
    - linopy ==0.6.7
    - requests
    - ipykernel
    - tqdm
    - pyyaml
    - typing-extensions

tests:
  - python:
      imports:
        - zen_garden
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - zen-garden --help

about:
  homepage: https://zen-garden.ethz.ch
  repository: https://github.com/ZEN-universe/ZEN-garden
  documentation: https://zen-garden.readthedocs.io/en/latest/
  license: MIT
  license_file: LICENSE.txt
  summary: Optimization framework for energy transition pathways
  description: |
    ZEN-garden is an open-source optimization software to model multi-year energy system transition pathways.

extra:
  recipe-maintainers:
    - csfunke
    - jacob-mannhardt
    - giovanni-sansavini
