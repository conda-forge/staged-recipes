schema_version: 1

context:
  version: "0.4.0"
  python_min: "3.11"

package:
  name: collageradiomics
  version: ${{ version }}

# Draft submission: replace with the release archive and checksum after publication.
source:
  url: https://github.com/radxtools/collageradiomics/archive/78f52da3659d866db676fd6782eaaddce784e359.tar.gz
  sha256: 5e1ac1436a7b4fe823aa69499b8a1281e27f2d43330fd0a58098009c4350992f

build:
  number: 0
  noarch: python
  script: python -m pip install ./module --no-deps --no-build-isolation -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.26,<3
    - scipy >=1.11,<2
    - scikit-image >=0.22,<1
    - mahotas >=1.4.19,<2
    - click >=8.1,<9
    - simpleitk >=2.3,<3

tests:
  - python:
      imports:
        - collageradiomics
        - _collageradiomics
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - collageradiomics --help
      - python packaging/conda/run_test.py
    files:
      source:
        - packaging/conda/run_test.py

about:
  homepage: https://github.com/radxtools/collageradiomics
  documentation: https://collageradiomics.readthedocs.io/
  repository: https://github.com/radxtools/collageradiomics
  summary: Local gradient-orientation radiomics in Python and 3D Slicer
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mohsenhariri
