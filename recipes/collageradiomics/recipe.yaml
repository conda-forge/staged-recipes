schema_version: 1

context:
  python_min: 3.9
  version: 0.3.8

package:
  name: collageradiomics
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/collageradiomics/collageradiomics-${{ version }}.tar.gz
  sha256: 74f202bacb57ff91ed8a6655b282374c5038da55bd2bf872a54100bccef659bf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - mahotas ==1.4.13
    - numpy >=1.21.6
    - pillow ==9.2.0
    - scikit-build >=0.15.0
    - scikit-image >=0.19.3
    - scipy >=1.7.3
    - pydicom >=2.3.0
    - scikit-learn

tests:
  - python:
      imports:
        - collageradiomics
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Python implementation of COLLAGE texture features from BRIC & INVENTLAB.
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - LICENSE
  homepage: https://github.com/ccipd/collageradiomics

extra:
  recipe-maintainers:
    - sarthakpati
