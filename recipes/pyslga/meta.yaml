{% set name = "pyslga" %}
{% set version = "0.1.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pyslga/pyslga-{{ version }}.tar.gz
  sha256: db360aac4867c55490c9e4a86e1633196397ef5f82b8463a204055da96efe8da

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >={{ python_min }}
    - troi-core
    - attrs
    - typing_extensions
    - numpy
    - xarray
    - zarr
    - rasterio
    - requests

test:
  imports:
    - pyslga
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/thestochasticman/pyslga
  summary: Machine-wide cache of SLGA 90 m soil properties for Australia
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thestochasticman
    - johnburley3000
