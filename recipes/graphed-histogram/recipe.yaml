# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: graphed-histogram
  version: "0.0.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphed-histogram/graphed_histogram-${{ version }}.tar.gz
  sha256: 05a9a03db7d966d017c1e1c2ffce318f7d04ae8aca4e0364bc76585f1c62bf8f

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - graphed >=0.0.2
    - boost-histogram >=1.4
    - numpy >=1.24

tests:
  - python:
      imports:
        - graphed_histogram
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "import graphed_histogram as gh; print(gh.factory)"

about:
  summary: Deferred boost-histogram/hist filling on graphed task graphs
  description: |
    The dask-histogram analogue for graphed: boost-histogram and hist objects are filled
    lazily inside a graphed plan, so the fill is a node in the task graph and is combined
    with a tree reduction at execute time.
  license: MIT
  # Upstream ships no LICENSE file in the sdist (verified: `tar tzf graphed_histogram-0.0.2.tar.gz |
  # grep -i licen` is empty), so the recipe carries it. Drop this copy once upstream includes one.
  license_file: LICENSE.txt
  homepage: https://github.com/graphed-org/graphed-histogram
  repository: https://github.com/graphed-org/graphed-histogram
  documentation: https://graphed-histogram.readthedocs.io

extra:
  recipe-maintainers:
    - lgray
