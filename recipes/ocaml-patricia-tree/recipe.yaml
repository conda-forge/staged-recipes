context:
  version: "0.15.0"

package:
  name: ocaml-patricia-tree
  version: ${{ version }}

source:
  url: https://github.com/codex-semantics-library/patricia-tree/releases/download/v${{ version }}/patricia-tree-${{ version }}.tbz
  sha256: e0fe66ab7da5b2ad240b64430d605f4064bc704bf487acc6314fd868e98ec279

build:
  number: 0
  skip:
    - win
  script:
    - dune build --profile=release -p patricia-tree @install
    - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" patricia-tree

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler("ocaml") }}
    - ocaml-dune >=3.0
  host:
    - ocaml >=4.14

tests:
  - package_contents:
      strict: true
      files:
        - lib/ocaml/patricia-tree/*
        - lib/ocaml/stublibs/dllPatriciaTree_stubs.*
        - doc/patricia-tree/*
        - doc/patricia-tree/odoc-pages/*

  - script:
      - ocaml -I "${PREFIX}/lib/ocaml/patricia-tree" "${PREFIX}/lib/ocaml/patricia-tree/PatriciaTree.cma" -noprompt -noinit < /dev/null
    requirements:
      run:
        - ocaml

about:
  homepage: https://codex.top/api/patricia-tree/
  repository: https://github.com/codex-semantics-library/patricia-tree
  documentation: https://codex.top/api/patricia-tree/
  summary: Patricia Tree data structure in OCaml for maps and sets
  license: LGPL-2.1-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ManuelLerchner
