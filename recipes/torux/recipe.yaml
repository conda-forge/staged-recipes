schema_version: 1

context:
  version: "0.1.0.post1"
  python_min: "3.12"

package:
  name: torux
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/t/torux/torux-${{ version }}.tar.gz
  sha256: 14daed2b545133f2fee9b93678d4e80e23f8117b678c32790af83a641dc6d408

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - torux = torux.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2.4
    - scipy >=1.18
    - jax >=0.9
    - numba >=0.65
    - mpmath >=1.3
    - threadpoolctl >=3.1

tests:
  - python:
      imports:
        - torux
        - torux.cli
        - torux.field
        - torux.io
        - torux.reference
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/test_field.py
        - tests/test_independence.py
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    script:
      - torux --help
      - torux version
      - pytest -v tests/test_independence.py tests/test_field.py -k "closed_form or imports_nothing"

about:
  homepage: https://github.com/philippbogdan/torux
  repository: https://github.com/philippbogdan/torux
  summary: Vacuum magnetic field and flux surfaces of coils and magnets for toroidal confinement.
  license: CC0-1.0
  license_file:
    - LICENSE
    - NOTICE.md

extra:
  recipe-maintainers:
    - philippbogdan
