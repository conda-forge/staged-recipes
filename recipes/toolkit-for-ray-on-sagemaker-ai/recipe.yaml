schema_version: 1

context:
  version: "0.1.1"
  # toolkit-for-ray-on-sagemaker-ai requires Python >=3.11, above conda-forge's
  # global python_min default (3.10), so it must be pinned here.
  python_min: "3.11"

package:
  name: toolkit-for-ray-on-sagemaker-ai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/toolkit-for-ray-on-sagemaker-ai/toolkit_for_ray_on_sagemaker_ai-${{ version }}.tar.gz
  sha256: b1bdccc7d80a9b43c972126e5e0be001daece511eced5187e7cba821822e40ee

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - toolkit_for_ray_on_sagemaker_ai
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://pypi.org/project/toolkit-for-ray-on-sagemaker-ai/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Amazon SageMaker AI toolkit for Ray.
  description: |
    Amazon SageMaker AI toolkit for Ray.

extra:
  recipe-maintainers:
    - HariniNarayanan
