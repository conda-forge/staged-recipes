schema_version: 1

context:
  version: "0.2.0"
  python_min: "3.13"

package:
  name: echodataflow
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/e/echodataflow/echodataflow-${{ version }}.tar.gz
  sha256: 9daeaabf7ca29f03d84edb89452c09a6229cb44e97f52c74be7cafaf82ccd4fd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - echodataflow-deploy = echodataflow.deployment.deploy_cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=6
    - wheel >=0.29.0
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - boto3
    - bokeh
    - cartopy
    - geopandas
    - geopy
    - geoviews
    - holoviews
    - matplotlib-base
    - numpy
    - openpyxl
    - pandas
    - panel
    - paramiko
    - prefect ==3.8.4
    - prefect-shell >=0.3.0
    - prefect-dask >=0.3.0
    - fastapi <0.151
    - pyarrow
    - pydantic >=2,<3
    - pyserial >=3.5
    - pyyaml
    - s3fs
    - shapely
    - sqlalchemy >=2.0,<2.1
    - psycopg >=3.2
    - psycopg-c    
    - watchdog
    - xarray

tests:
  - python:
      imports:
        - echodataflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - echodataflow-deploy --help

about:
  summary: Echosounder data processing pipeline orchestration
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/echostack-org/echodataflow

extra:
  recipe-maintainers:
    - leewujung
