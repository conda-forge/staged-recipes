context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-coops
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-coops/tsgettoolbox_coops-${{ version }}.tar.gz
  sha256: 9fb45bed972e04395f6205df5893fda6268ceb05b3145e10c4082cbf269dc52a

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools>=80
  - pip
  run:
  - python >=3.10
  - aiodns >3.6.0
  - async_retriever
  - python-dateutil
  - pandas
  - pydantic >=2
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_coops
    pip_check: true

about:
  summary: Plugin for tsgettoolbox to retrieve data from the US National Oceanic and Atmospheric Administration (NOAA) Center for Operational Oceanographic Products and Services (CO-OPS).
