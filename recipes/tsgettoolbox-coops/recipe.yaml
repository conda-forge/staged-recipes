context:
  version: 27.0.0

package:
  name: tsgettoolbox-coops
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-coops/tsgettoolbox_coops-${{ version }}.tar.gz
  sha256: 9fb45bed972e04395f6205df5893fda6268ceb05b3145e10c4082cbf269dc52a

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - aiodns >3.6.0
  - async_retriever
  - python-dateutil
  - pandas
  - pydantic >=2
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
      - tsgettoolbox_coops
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: Plugin for tsgettoolbox to retrieve data from the US National Oceanic and Atmospheric Administration (NOAA) Center for Operational Oceanographic Products and Services (CO-OPS).
  description: |
    The 'tsgettoolbox_coops' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    US National Oceanic and Atmospheric Administration (NOAA) Center for
    Operational Oceanographic Products and Services (CO-OPS).
  homepage: https://pypi.org/project/tsgettoolbox-coops/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
