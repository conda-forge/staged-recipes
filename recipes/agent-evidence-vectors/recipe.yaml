schema_version: 1

context:
  name: agent-evidence-vectors
  version: "0.23.0"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/agent_evidence_vectors-${{ version }}.tar.gz
  sha256: 54dcbd34ec126ad8e8e285200171b268a57db386da64a92a6cf70e250c4989e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - agent-evidence-vectors = agent_evidence_vectors.run_vectors:main
      - agent-evidence-heldout = agent_evidence_vectors.heldout:main
      - agent-evidence-vectors-remora-e7 = agent_evidence_vectors.remora_e7.run:main
      - agent-evidence-vectors-invocation-axes = agent_evidence_vectors.invocation_axes.run:main
      - agent-evidence-vectors-resume-turns = agent_evidence_vectors.resume_turns.run:main
      - agent-evidence-vectors-occurrence-binding = agent_evidence_vectors.occurrence_binding.run:main
      - agent-evidence-vectors-acs-outage = agent_evidence_vectors.acs_outage.run:main
      - agent-evidence-vectors-verdict-evidence = agent_evidence_vectors.verdict_evidence.run:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - agent_evidence_vectors
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - agent-evidence-vectors --help
      - agent-evidence-vectors --self-test

about:
  summary: Conformance corpora and reference verifiers for agent evidence records
  description: |
    A corpus of signed agent-evidence records with expected verdicts, and a
    runner that checks any verifier against them. agent-evidence-vectors
    --self-test runs the built-in checks; --verifier points the corpus at
    another implementation.
  license: Apache-2.0 AND BUSL-1.1
  license_file:
    - LICENSE
    - vectors-ai-generation/spec-vendored/LICENSE-13fd0a8b
    - vectors-ai-generation/spec-vendored/LICENSE-17b964ee
    - packaging/agent_evidence_vectors/remora_e7/upstream/LICENSE
    - packaging/agent_evidence_vectors/remora_e7/upstream/NOTICE
  homepage: https://github.com/probityai/agent-evidence-vectors
  repository: https://github.com/probityai/agent-evidence-vectors
  documentation: https://probityai.github.io/agent-evidence-vectors/start.html

extra:
  recipe-maintainers:
    - astrogilda
