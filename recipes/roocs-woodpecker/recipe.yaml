schema_version: 1

context:
  version: "0.7.1"
  python_min: "3.10"

package:
  name: roocs-woodpecker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/roocs-woodpecker/roocs_woodpecker-${{ version }}.tar.gz
  sha256: 5e11f7668342411ae329fc7972aea96831123d552ff68ce2511ae9c4d39180f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - woodpecker = woodpecker.cli:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - click >=8.1
    - lxml >=4.9
    - pydantic >=2.0
    - prov >=2.0
    - pyyaml >=6.0
    - rdflib >=7.0
    - xarray >=2024.1.0

tests:
  - python:
      imports:
        - woodpecker
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - woodpecker --help

about:
  summary: Lightweight fix catalog + scaffolding for climate dataset fixes
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/roocs-woodpecker/
  documentation: https://roocs.github.io/woodpecker/

extra:
  recipe-maintainers:
    - AddYourGitHubIdHere
