# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  # conda-forge does not package hier-config, and ciscoconfparse2 pins
  # hier-config==2.3.1 exactly (the 3.x line on PyPI adds a hard pydantic
  # dependency and changes the API), so this packages that exact version.
  version: "2.3.1"

package:
  name: hier-config
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/h/hier-config/hier_config-${{ version }}.tar.gz
  sha256: 38f6826b35b81b5ef6b08672ad37ac1cd221630f54fba43d07d8b5b2ecc8c8be

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python ${{ python_min }}.*
    - pyyaml >=5.4
    - types-pyyaml >=6.0.12.12,<7.0.0.0

tests:
  - python:
      imports:
        - hier_config
      pip_check: true

about:
  homepage: https://github.com/netdevops/hier_config
  summary: A network configuration comparison tool, used to build remediation configurations
  license: MIT
  license_file: LICENSE
  documentation: https://hier-config.readthedocs.io/
  repository: https://github.com/netdevops/hier_config

extra:
  recipe-maintainers:
    - pb01ka
