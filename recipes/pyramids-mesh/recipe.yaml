context:
  version: "0.5.0"

package:
  name: pyramids-mesh
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyramids-mesh/pyramids_mesh-${{ version }}.tar.gz
  sha256: 94d1b8d8203c555717007f3bfcf518a7dd5581587a2a394dc9a04da5e080051e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80.0.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    # pyramids-core (PyPI) is packaged as `pyramids` on conda-forge; the import
    # name stays `pyramids`. The 0.5.0 release declares pyramids-core >=0.70.0,
    # which is satisfiable on conda-forge (latest 0.74.0). conda `pyramids`
    # pulls in the real GDAL/osgeo stack, so GDAL is not declared here.
    - pyramids >=0.70.0
    - numpy >=2.0.0

tests:
  - python:
      imports:
        - pyramids_mesh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/serapeum-org/pyramids-mesh
  repository: https://github.com/serapeum-org/pyramids-mesh
  documentation: https://serapeum-org.github.io/pyramids-mesh
  summary: "Mesh file-format drivers for pyramids: 2DM, Selafin, DFSU, XMDF, PLY and more"
  description: |
    pyramids-mesh reads and writes the file formats of hydrodynamic and
    hydraulic mesh models - 2DM, Selafin, DFSU, XMDF, PLY and the rest of the
    MDAL driver table - as pyramids UGRID mesh objects. It owns only the
    file-format drivers; every mesh operation lives upstream in pyramids.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MAfarrag
