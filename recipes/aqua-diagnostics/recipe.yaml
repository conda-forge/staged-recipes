schema_version: 1

context:
  version: "0.26.0"
  python_min: "3.12"

package:
  name: aqua-diagnostics
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aqua-diagnostics/aqua_diagnostics-${{ version }}.tar.gz
  sha256: 77bb1fd74522a58357011dd8f8fd6af4b82bec9b0f4dbdf67e9af5f5c9d768c6

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }},<3.15
    - aqua-core >=1.2.3
    - ecmean >=0.2.2
    - cartopy
    - dask
    - distributed
    - filelock
    - geopandas
    - matplotlib-base
    - numpy
    - pandas
    - pillow
    - pooch
    - pypdf
    - regionmask
    - scipy
    - shapely >=2.1
    - xarray

tests:
  - python:
      imports:
        - aqua.diagnostics
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/DestinE-Climate-DT/AQUA-diagnostics/
  repository: https://github.com/DestinE-Climate-DT/AQUA-diagnostics/
  documentation: https://aqua-diagnostics.readthedocs.io/en/latest/index.html
  summary: "AQUA-diagnostics: the diagnostics set of the AQUA framework for high-resolution climate model evaluation"
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - oloapinivad
