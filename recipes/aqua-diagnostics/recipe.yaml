schema_version: 1

context:
  version: "0.25.1"

package:
  name: aqua-diagnostics
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/aqua-diagnostics/aqua_diagnostics-${{ version }}.tar.gz
  sha256: 06b45c06db6fda9c68724fd0b14c39fe4834d005b8bd4868892f6008c2877122

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}
    - aqua-core >=1.1.0
    - esmpy
    - ecmean
    - cartopy >=0.25.0
    - matplotlib-base <=3.10.8

tests:
  - python:
      imports:
        - aqua
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "AQUA-diagnostics: the diagnostics set of the AQUA framework for high-resolution climate model evaluation"
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/DestinE-Climate-DT/AQUA-diagnostics/
  repository: https://github.com/DestinE-Climate-DT/AQUA-diagnostics/
  documentation: https://aqua-diagnostics.readthedocs.io/en/latest/index.html

extra:
  recipe-maintainers:
    - oloapinivad
