{% set version = '0.2.0' %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-ggarrow
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/ggarrow_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/ggarrow/ggarrow_{{ version }}.tar.gz
  sha256: 659a7c91ebde849ef9b964058b2a79b49cac2f258438d31920748e7b10cc6687

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-s7
    - r-cli
    - r-ggplot2 >=3.5.0
    - r-lifecycle
    - r-polyclip
    - r-rlang >=1.1.0
    - r-scales
    - r-vctrs
  run:
    - r-base
    - r-s7
    - r-cli
    - r-ggplot2 >=3.5.0
    - r-lifecycle
    - r-polyclip
    - r-rlang >=1.1.0
    - r-scales
    - r-vctrs

test:
  commands:
    - $R -e "library('ggarrow')"           # [not win]
    - "\"%R%\" -e \"library('ggarrow')\""  # [win]

about:
  home: https://teunbrand.github.io/ggarrow/
  dev_url: https://github.com/teunbrand/ggarrow
  license: MIT
  summary: A 'ggplot2' extension that adds specialised arrow geometry layers. It offers more
    arrow options than the standard 'grid' arrows that are built-in many line-based
    geom layers.
  license_family: MIT
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/MIT'
    - LICENSE.md

extra:
  recipe-maintainers:
    - conda-forge/r
    - drammock

