schema_version: 1

context:
  version: "0.10"

package:
  name: bw_graph_tools
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/bw_graph_tools/bw_graph_tools-${{ version }}.tar.gz
  sha256: 9a0ba02feb82e3da0d73f921607136771a2dd170fbf3c4320cb3460dc03e623d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68.0
    - pip
  run:
    - python >=${{ python_min }}
    - bw2calc >=2.0.dev13
    - bw2data >=4.0.dev46
    - bw_processing >=1.6
    - matrix_utils >=0.9
    - numpy <3
    - pydantic
    - scipy
    - typing_extensions

tests:
  - python:
      imports:
        - bw_graph_tools
      # conda-forge's mkl has no Python metadata, so pip can't see pypardiso's mkl requirement
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Graph traversal class and utilities
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/brightway-lca/bw_graph_tools

extra:
  recipe-maintainers:
    - simonvanlierde
