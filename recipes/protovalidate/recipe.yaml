schema_version: 1

context:
  version: "1.2.0"

package:
  name: protovalidate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/protovalidate/protovalidate-${{ version }}.tar.gz
  sha256: 4cb9a5065f32abc9baf2cf25c5bd09a139f7dffb7b8692f636a8e3e6883bb9a2

build:
  number: 0
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install . -vv
      # protovalidate imports buf.validate.validate_pb2, which the wheel does
      # not ship. Install upstream's generated copy from gen/ so the package
      # works on its own.
      - ${{ PYTHON }} ${{ RECIPE_DIR }}/install_buf_validate.py

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - cel-python >=0.5
    # Upstream raises these floors with python_version markers (re2 for 3.12+,
    # protobuf for 3.14). noarch can't carry markers, so use the highest floor.
    - google-re2 >=1.1.20251105
    - protobuf >=6.31.0

tests:
  - python:
      imports:
        - protovalidate
        - buf.validate.validate_pb2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "import protovalidate; from buf.validate import validate_pb2; protovalidate.validate(validate_pb2.Violations())"

about:
  homepage: https://github.com/bufbuild/protovalidate-python
  repository: https://github.com/bufbuild/protovalidate-python
  documentation: https://protovalidate.com
  summary: Protocol Buffer Validation for Python
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
