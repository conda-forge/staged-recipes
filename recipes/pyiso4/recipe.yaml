schema_version: 1

context:
  version: "0.1.6"

package:
  name: pyiso4
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyiso4/pyiso4-${{ version }}.tar.gz
  sha256: 014947983b9302398bd4de0760eb243e54e32ca2bcfff5f1b5eadc25acbbbd03

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - iso4abbreviate = pyiso4.script:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=62
    - pip
  run:
    - python >=${{ python_min }}
    - unidecode

tests:
  - python:
      imports:
        - pyiso4
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - iso4abbreviate --help

about:
  summary: Abbreviate a scientific journal title following the ISO-4 rules
  description: |
    An attempt to implement the ISO 4 standard for journal titles abbreviations
    within a simple application written in Python,
    as described in Section 7.1 of the ISSN Manual.
    Inspired by the NPM package abbrevIso.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pierre-24/pyiso4
  repository: https://github.com/pierre-24/pyiso4

extra:
  recipe-maintainers:
    - tovrstra
