schema_version: 1

context:
  version: "3.1.0"

package:
  name: in-toto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/in-toto/in_toto-${{ version }}.tar.gz
  sha256: 56b02363e0eb74be3365faf98a60f6d2c3c6a06419be7fcb4dd59e0d1b86fb09

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - in-toto-match-products = in_toto.in_toto_match_products:main
      - in-toto-mock = in_toto.in_toto_mock:main
      - in-toto-record = in_toto.in_toto_record:main
      - in-toto-run = in_toto.in_toto_run:main
      - in-toto-sign = in_toto.in_toto_sign:main
      - in-toto-verify = in_toto.in_toto_verify:main
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - attrs
    - cryptography >=48.0.0
    - iso8601
    - pathspec
    - python-dateutil
    - securesystemslib >=1,<2

tests:
  - python:
      imports:
        - in_toto
        - in_toto.models.layout
        - in_toto.models.link
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - in-toto-run --help
      - in-toto-sign --help
      - in-toto-verify --help

about:
  homepage: https://in-toto.io
  repository: https://github.com/in-toto/in-toto
  summary: Define and verify the integrity of software supply chains
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jezdez
