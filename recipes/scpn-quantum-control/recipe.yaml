context:
  name: scpn-quantum-control
  version: "1.3.0"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scpn-quantum-control/scpn_quantum_control-${{ version }}.tar.gz
  sha256: 69bc0181ef741e9ae96975f07ebfad2bd28e686e1e6ca8bcbffe395b8960d4b0

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - scpn-bench = scpn_quantum_control.bench_cli:main
      - scpn-verify-hardware-packs = scpn_quantum_control.hardware_result_packs:main
      - scpn-generate-hardware-pack-evidence = scpn_quantum_control.hardware_result_pack_evidence:main
      - scpn-provider-smoke = scpn_quantum_control.hardware.provider_smoke:main
      - scpn-provider-certification = scpn_quantum_control.hardware.provider_certification:main
      - scpn-biological-qec-report = scpn_quantum_control.qec.biological_cli:main
      - install-differentiable-framework-overlay = scpn_quantum_control.differentiable_framework_overlay:main
      - scpn-emit-studio-manifest = scpn_quantum_control.studio.federation:main
      - scpn-studio-run = scpn_quantum_control.studio.executive_cli:main
      - scpn-studio-workflow = scpn_quantum_control.studio.workflow_cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - qiskit >=2.2,<3.0
    - qiskit-aer >=0.15,<1.0
    - qiskit-qasm3-import >=0.6,<1.0
    - python-symengine >=0.14,<1.0
    - numpy >=1.24,<3.0
    - scipy >=1.10,<2.0
    - oscillatools >=0.1.1
    - networkx >=3.0,<4.0
    - jinja2 >=3.1,<4.0
    - requests >=2.34.2,<3.0
    - urllib3 >=2.7,<3.0

tests:
  - python:
      imports:
        - scpn_quantum_control
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - scpn-bench --help

about:
  summary: NISQ quantum simulation of coupled Kuramoto oscillator networks via XY Hamiltonian mapping
  description: |
    scpn-quantum-control maps a Kuramoto oscillator network (coupling matrix
    and natural frequencies) to XY Hamiltonians, circuits, simulator runs and
    hardware experiments. It records results with raw counts, job identifiers,
    digests and an explicit claim boundary. The optional Rust acceleration is
    the separate scpn-quantum-engine package and is not required.
  license: AGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/anulum/scpn-quantum-control
  repository: https://github.com/anulum/scpn-quantum-control
  documentation: https://anulum.github.io/scpn-quantum-control

extra:
  recipe-maintainers:
    - anulum
