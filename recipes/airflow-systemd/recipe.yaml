schema_version: 1

context:
  name: airflow-systemd
  version: "0.2.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/airflow-systemd/airflow_systemd-${{ version }}.tar.gz
  sha256: d150dbd385e3f0b4738ae3487256e498afce4ee0b69c0f6657415412ac84810b

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - airflow-ha >=1.4.1,<1.7
    - airflow-pydantic >=1.6.1,<1.7
    - systemd-pydantic >=0.1,<0.2

tests:
  - python:
      imports:
        - airflow_systemd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/airflow-laminar/airflow-systemd
  summary: Systemd operators and configuration for long-running tasks
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://airflow-laminar.github.io/airflow-systemd/
  repository: https://github.com/airflow-laminar/airflow-systemd

extra:
  recipe-maintainers:
    - timkpaine
