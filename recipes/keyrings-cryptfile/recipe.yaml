schema_version: 1

context:
  version: 1.3.9

package:
  name: keyrings.cryptfile
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/k/keyrings.cryptfile/keyrings.cryptfile-${{ version }}.tar.gz
  sha256: 7c2a453cab9985426b8c21f7ad54a57e49ff8e819ba18e08340bd8801acf0091

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - cryptfile-convert = keyrings.cryptfile.convert:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - argon2-cffi
    - jaraco.classes
    - keyring >=20.0.0
    - pycryptodome

tests:
  - python:
      imports:
        - keyrings.cryptfile.cryptfile
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - cryptfile-convert --help
      - >-
        python -c "import tempfile;
        from pathlib import Path;
        from keyrings.cryptfile.cryptfile import CryptFileKeyring;
        p = Path(tempfile.mkdtemp()) / 'keyring.cfg';
        k = CryptFileKeyring();
        k.file_path = str(p);
        k.keyring_key = 'conda-recipe-test';
        k.set_password('recipe-test-service', 'recipe-test', 'secret');
        assert k.get_password('recipe-test-service', 'recipe-test') == 'secret'"

about:
  homepage: https://github.com/frispete/keyrings.cryptfile
  repository: https://github.com/frispete/keyrings.cryptfile
  license: MIT
  license_file: LICENSE.txt
  summary: Encrypted file keyring backend

extra:
  recipe-maintainers:
    - BartoszBlizniak
