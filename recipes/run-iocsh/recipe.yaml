schema_version: 1

context:
  version: "3.1.0.post1"
  python_min: "3.11"

package:
  name: run-iocsh
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/run-iocsh/run_iocsh-${{ version }}.tar.gz
  sha256: bda3be88dcfa0db06fd5fd88c1d3f71d87dd031edf0fea0f36de4d1208f7818a

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - run-iocsh = run_iocsh.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - run_iocsh
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - run-iocsh --help
  - requirements:
      run:
        - pytest
        - python ${{ python_min }}.*
    files:
      source:
        - tests/
    script:
      - pytest tests/

about:
  homepage: https://github.com/epics-extensions/run-iocsh
  summary: Wrapper to test IOCs
  description: |
    Python wrapper to run iocsh (or another IOC executable) for automated
    testing of EPICS applications. It starts an IOC, waits for iocInit to
    complete, and raises typed exceptions if errors are detected in the output.
  license: BSD-2-Clause
  license_file: LICENSE
  documentation: https://epics-extensions.github.io/run-iocsh
  repository: https://github.com/epics-extensions/run-iocsh

extra:
  recipe-maintainers:
    - anderslindho
