schema_version: 1

context:
  version: "0.0.18"

package:
  name: elementy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/elementy/elementy-${{ version }}.tar.gz
  sha256: bdb386f7bb14fec339ab0918b95c375292a1c3ee1ab2f04128c1ec6c63a14ddf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - elementy
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Interface to data on elements of the periodic table.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/Robert-Forrest/elementy

extra:
  recipe-maintainers:
    - jan-janssen
