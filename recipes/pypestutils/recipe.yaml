context:
  name: pypestutils
  version: "0.3.0"

recipe:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
    sha256: 58097fe17374de92d5faf0a06779c4d320b660279cdd000db698821d87337c49
    patches:
      # backport of upstream c7ab0c2 and 644e608; remove for > 0.3.0
      - mod2obs-mf6-pandas3.patch
      # prevent platform-specific binary wheel build
      - pypestutils_noarch.patch
  # upstream test suite, which the sdist does not include
  - url: https://github.com/pypest/pypestutils/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 28a1811a7998883829e62ad1c4a2c46ca3e87e29a53756f6776ee23af8efddd9
    filter:
      - tests/**

build:
  number: 0

outputs:
  - package:
      name: libpestutils
    build:
      script:
        file: build_libpestutils 
    requirements:
      build:
        # use the m2w64 gfortran toolchain on win-64, as for the PyPI wheels
        - if: win
          then:
            - ${{ compiler('m2w64_fortran') }}
            - ${{ stdlib('m2w64_c') }}
          else:
            - ${{ compiler('fortran') }}
            - ${{ stdlib('c') }}
        - meson
        - ninja
    tests:
      - script:
          - if: unix
            then:
              - test -f ${PREFIX}/lib/libpestutils${SHLIB_EXT}
              - test ! -f ${PREFIX}/lib/libpestutils.a
          - if: win
            then: if not exist %LIBRARY_LIB%\\libpestutils.lib exit 1
    about:
      license: BSD-3-Clause AND LicenseRef-GSLIB
      license_file:
        # vendored LAPACK 3.0 routines in pestutils/lapack1.F
        - LAPACK_LICENSE
        # geostatistics routines derived from GSLIB
        - GSLIB_LICENSE
      summary: PEST utilities for MODFLOW
      description: |
        Pestutils Fortran library, which provides utilities for
        spatial interpolation, geostatistics, and MODFLOW binary
        file processing used to build PEST interfaces.

  - package:
      name: pypestutils
    build:
      noarch: python
      script:
        - python -m pip install . --no-deps -vv
    requirements:
      host:
        - python
        - pip
        - setuptools >=77
        - libpestutils
      run:
        - python
        - libpestutils
        - numpy
        - pandas
    tests:
      - python:
          imports:
            - pypestutils
            - pypestutils.helpers
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
      - requirements:
          run:
            - python
            - flopy
            - numpy
            - pandas
            - pytest
            - pytest-timeout
            - libpestutils
        files:
          source:
            - tests/
          recipe:
            - test_load.py
        script:
          - python test_load.py
          - pytest -v

    about:
      license: Unlicense
      license_file:
        - LICENSE
      summary: Python PEST utilities for MODFLOW
      description: |
        Python interface to the pestutils Fortran library, which provides
        utilities for spatial interpolation, geostatistics, and MODFLOW binary
        file processing used to build PEST interfaces.

about:
  homepage: https://github.com/pypest/pypestutils
  repository: https://github.com/pypest/pypestutils
  summary: PEST utilities for MODFLOW
  license: Unlicense AND BSD-3-Clause AND LicenseRef-GSLIB
  license_file:
    - LICENSE
    # vendored LAPACK 3.0 routines in pestutils/lapack1.F
    - LAPACK_LICENSE
    # geostatistics routines derived from GSLIB
    - GSLIB_LICENSE

extra:
  recipe-maintainers:
    - jtwhite79
    - mwtoews
    - jdhughes-dev
