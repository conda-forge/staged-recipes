context:
  name: strawberry-sqlalchemy-mapper
  version: "0.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 8de01e616d0afe8a325736ea5483a1d9f439b5febb0c43449fe68e157735da70

build:
  noarch: python  # pure Python, no compiled extensions
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=1.4
    - strawberry-graphql >=0.236.0
    - sentinel >=0.3,<1.1
    - sqlakeyset >=2.0.1695177552,<3
  # greenlet is only required on Python >=3.12 for async support;
  # sqlalchemy already brings it in, but this constrains the minimum
  # version if it is installed. conda-forge only publishes stable releases,
  # so >=3.0.0 covers what upstream specifies as >=3.0.0rc1.
  run_constraints:
    - greenlet >=3.0.0

tests:
  - python:
      imports:
        - strawberry_sqlalchemy_mapper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/strawberry-graphql/strawberry-sqlalchemy
  summary: A library for autogenerating Strawberry GraphQL types from SQLAlchemy models.
  description: |
    strawberry-sqlalchemy-mapper lets you decorate a class and automatically
    generate Strawberry GraphQL fields for all columns and relationships in a
    given SQLAlchemy model, with native support for most common SQLAlchemy
    types, automatic N+1 query batching, and Relay connection support.
  license: MIT
  license_file: LICENSE.txt
  documentation: https://strawberry.rocks/
  repository: https://github.com/strawberry-graphql/strawberry-sqlalchemy

extra:
  recipe-maintainers:
    - m0nonoke
