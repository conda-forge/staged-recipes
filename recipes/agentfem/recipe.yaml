context:
  name: agentfem
  version: "0.1.3"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 531832eaf440e731b66bee55c1d95c3a9a345686f8e52708f792c971947d2da4

build:
  number: 0
  skip:
    - win
    - match(python, "<3.11")
    - match(python, ">=3.13")
  script: python -m pip install . -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=77
    - wheel
  run:
    - python
    - fenics-dolfinx
    - fenics-ufl
    - gmsh
    - mpi4py
    - numpy
    - petsc4py

tests:
  - python:
      imports:
        - agentfem
        - agentfem.fields
        - agentfem.materials
        - agentfem.mesh
        - agentfem.operators
      pip_check: true
  - script:
      - python -c "import agentfem; assert agentfem.__version__ == '0.1.3'"

about:
  homepage: https://github.com/haoming-luo/agentfem
  repository: https://github.com/haoming-luo/agentfem
  documentation: https://haoming-luo.github.io/agentfem/
  summary: AI-assisted finite-element simulation and agent-readable CAE workflows.
  description: |
    AgentFEM is an open-source finite-element workflow platform that keeps
    engineering concepts such as studies, models, fields, materials, loads,
    constraints, operators, solution steps, and results readable by both
    researchers and AI agents.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - haoming-luo
