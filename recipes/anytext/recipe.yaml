context:
  version: "9.3.0"

package:
  name: anytext
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anytext/anytext-${{ version }}.tar.gz
  sha256: 521ecd78a951502d47b3a619bb6b4676676182295cd1e4b559b6874067251a3b

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.13.5,<0.14
  run:
    - python >=${{ python_min }},<4
    - anyio >=4.11,<5
    - sniffio >=1.3,<2
    - markdown-it-py >=2.1.0
    - linkify-it-py >=1,<3
    - mdit-py-plugins
    - rich >=14.2.0
    - typing_extensions >=4.4.0,<5
    - platformdirs >=3.6.0,<5
    - pygments >=2.19.2,<3

tests:
  - python:
      imports:
        - anytext
        - anytext.app
        - anytext.widgets
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/davidbrochart/anytext
  summary: Python framework for building terminal user interfaces
  license: MIT
  license_file: LICENSE
  repository: https://github.com/davidbrochart/anytext

extra:
  recipe-maintainers:
    - davidbrochart
