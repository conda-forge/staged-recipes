schema_version: 1

context:
  version: "1.9.0"

package:
  name: sqlalchemy_adapter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlalchemy_adapter/sqlalchemy_adapter-${{ version }}.tar.gz
  sha256: 7a7f88c0ecda41ba3a6635197dd22f65cbf73e352bfb0f4a26207c24e683261a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pycasbin >=2.0.0
    - sqlalchemy >=1.2.18

tests:
  - python:
      imports:
        - sqlalchemy_adapter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: SQLAlchemy Adapter for PyCasbin
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/officialpycasbin/sqlalchemy-adapter

extra:
  recipe-maintainers:
    - ocefpaf
