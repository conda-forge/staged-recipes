schema_version: 1
package:
  name: network-emulation-sdk
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Network-Emulation-SDK/language-sdks-v1.0.0/network-emulation-sdk-sdk-source-1.0.0.zip
  sha256: f1d12a7094f8912566ee04ea704d4538c72fd31a15fd64c15857e44d259265a2
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - network_emulation_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from network_emulation_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Network-Emulation-SDK
  summary: Windows x64 Network-Emulation-SDK Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Network-Emulation-SDK-C-ffi/LICENSE
  - Network-Emulation-SDK-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
