schema_version: 1

context:
  version: "0.0.1"

package:
  name: extension-ray-jupyterlab-sagemaker-ai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/extension-ray-jupyterlab-sagemaker-ai/extension_ray_jupyterlab_sagemaker_ai-${{ version }}.tar.gz
  sha256: 678596876b9ff953686f3ac6d4e6ae01130b951a7654dae16d3771392fdb39b6

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - extension_ray_jupyterlab_sagemaker_ai
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://pypi.org/project/extension-ray-jupyterlab-sagemaker-ai/
  license: Apache-2.0
  license_file: LICENSE
  summary: Extension for Ray with JupyterLab on Amazon SageMaker AI
  description: |
    Extension for Ray with JupyterLab on Amazon SageMaker AI — HyperPod Ray
    cluster discovery and connection from JupyterLab notebooks.

extra:
  recipe-maintainers:
    - HariniNarayanan
