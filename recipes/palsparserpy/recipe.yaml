context:
  version: "0.0.1"
  # palsparserpy mirrors the C library's structs by layout (ctypes), so it pins
  # the exact palsparsercpp release it is tested against. palsparsercpp 0.0.4's
  # C API is 0.0.1's plus pals_parser_cpp_version(), so the structs are
  # unchanged.
  palsparsercpp_version: "0.0.4"

package:
  name: palsparserpy
  version: ${{ version }}

source:
  url: https://github.com/pals-project/PALSParserPy/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ecab3b8eb37719481c5a043a4dc2ea02c91397ed4548b3fcb3fed26419cb1b43

build:
  number: 0
  noarch: python
  script:
    # From 0.0.2, palsparserpy can bundle its own copy of the C library (for
    # PyPI wheels). The conda package must use palsparsercpp instead, so
    # bundling is turned off. Earlier versions ignore the variable.
    env:
      PALS_BUNDLE_NATIVE: "0"
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - palsparsercpp ==${{ palsparsercpp_version }}

tests:
  - python:
      imports:
        - palsparserpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  # The package's own test suite, against the installed package and the
  # palsparsercpp library it finds in the environment.
  - script:
      - pytest -q tests
    files:
      source:
        - tests/
        - lattice_files/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest

about:
  homepage: https://github.com/pals-project/PALSParserPy
  repository: https://github.com/pals-project/PALSParserPy
  documentation: https://pals-project.github.io/PALSParserPy/
  summary: Python interface for PALS accelerator lattice files
  description: |
    palsparserpy reads, expands and edits lattice files written in PALS
    (https://github.com/pals-project/pals), the standard for exchanging
    particle accelerator lattices, through the palsparsercpp C library. It
    also translates PALS lattices to Bmad and MAD-X lattice files and to
    Python scripts that build an Xsuite lattice.
  license: GPL-2.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - DavidSagan
