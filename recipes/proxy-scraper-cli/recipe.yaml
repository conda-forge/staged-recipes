context:
  name: proxy-scraper-cli
  version: "1.25.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/proxy_scraper_cli/proxy_scraper_cli-${{ version }}.tar.gz
  sha256: 157ba5f72d8bc50077362ba6ca30bd0ac739840f84f1f832bbf47d852d1936e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - proxy-scraper = proxyscraper.cli:run
      - proxy-scraper-cli = proxyscraper.cli:run
      - proxy-scraper-mcp = proxyscraper.mcp_entry:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - rich >=13
    - certifi

tests:
  - python:
      imports:
        - proxyscraper
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - proxy-scraper --version
      - proxy-scraper --help

about:
  homepage: https://github.com/maximilianfeix/proxy-scraper
  summary: Free HTTP and SOCKS proxies that actually work, verified against honeypots and injected scripts
  description: |
    proxy-scraper collects public HTTP, SOCKS4 and SOCKS5 proxies from 700+ sources and keeps only the ones
    that pass every check: a protocol handshake, the same exit IP on two unrelated sites (drops honeypots),
    a byte-for-byte content check (drops proxies that inject scripts) and, for HTTPS, a verified TLS
    handshake. It can serve the result as one rotating local proxy and has a Python API.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/maximilianfeix/proxy-scraper
  documentation: https://github.com/maximilianfeix/proxy-scraper#readme

extra:
  recipe-maintainers:
    - maximilianfeix
