schema_version: 1
package:
  name: fyrainput-keyboard-mouse
  version: 1.0.0
source:
- url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/FyraInput-Keyboard-Mouse/input-language-sdks-v1.0.0/fyrainput-keyboard-mouse-input-sdks-1.0.0-source.zip
  sha256: ba815ac086f1590982df9b71f9df19a9e243d8e3133c94f8c4f2970584f3df94
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - fyrainput_keyboard_mouse
    pip_check: true
- script:
  - python -m pip check
  - python -c "from fyrainput_keyboard_mouse import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/FyraInput-Keyboard-Mouse-SDK
  summary: Windows x64 FyraInput-Keyboard-Mouse Python SDK with source-built native bridge
  license: MIT
  license_file:
  - FyraInput-Keyboard-Mouse-C-ffi/LICENSE
  repository: https://github.com/TitanCSA/FyraInput-Keyboard-Mouse-SDK
extra:
  recipe-maintainers:
  - TitanCSA
