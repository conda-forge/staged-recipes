context:
  name: ome-writers
  version: "0.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ome_writers-${{ version }}.tar.gz
  sha256: 637d8a9222fcd11a1faa3c8c59170c2cbcb98d078fd8802dab89a8c0b781a411

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - numpy >=2
    - typing-extensions >=4.10.0
    - yaozarrs >=0.2.4
    # yaozarrs[io] extra
    - fsspec >=2025.0
    - aiohttp
    - s3fs
    - pydantic >=2.8
    - pydantic-extra-types >=2.11.0

tests:
  - python:
      imports:
        - ome_writers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pymmcore-plus/ome-writers
  summary: 'OME-TIFF and OME-ZARR writer APIs designed for microscopy acquisition'
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://pymmcore-plus.github.io/ome-writers/
  repository: https://github.com/pymmcore-plus/ome-writers

extra:
  recipe-maintainers:
    - tlambert03
