schema_version: 1

context:
  name: r-parallelplot
  version: 0.4.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://cran.r-project.org/src/contrib/parallelPlot_${{ version }}.tar.gz
  sha256: 1ce71ae05505b23db134e718db9d014174fa8fe6034f7a4858c3eaffd98f9051

build:
  number: 0
  noarch: generic
  script: R CMD INSTALL --build .
  merge_build_and_host_envs: true
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  host:
    - r-base
    - r-htmlwidgets
  run:
    - r-base
    - r-htmlwidgets

tests:
  - script:  R -e "library('parallelPlot')"


about:
  summary: Create a parallel coordinates plot, using `htmlwidgets` package and `d3.js`.
  license: MIT
  license_file: 
    - ${{ PREFIX }}/lib/R/share/licenses/MIT
  homepage: https://gitlab.com/drti/parallelplot

extra:
  recipe-maintainers:
    - DerThorsten
