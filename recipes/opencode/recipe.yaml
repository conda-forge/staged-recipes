schema_version: 1

context:
  name: opencode
  version: "1.19.6"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/anomalyco/opencode/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0dfc7c58a82a1f9ca635ebcfe8aad594009edb22a5ef752719d2b89fbe5918b8

build:
  number: 0
  skip:
    # not tried on Windows yet, it needs a build.bat
    - win
    # bun build --compile from the conda-forge bun fails on macOS with
    # OverlappingSegments, enable again once the bun feedstock is fixed
    - osx
  dynamic_linking:
    # bun --compile appends the app to the bun executable, patching it would
    # corrupt that payload. bun already uses $ORIGIN/../lib as its rpath.
    binary_relocation: false

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - bun
  host:
    - bun
  run:
    # The opencode binary is a copy of bun with the app appended, so it links
    # the same shared libraries as bun. Pinning the exact bun build lets the
    # bun feedstock own that list through its run dependencies.
    - ${{ pin_compatible('bun', exact=True) }}

tests:
  - script:
      - opencode --version
      - opencode --help

about:
  homepage: https://opencode.ai
  summary: The open source coding agent
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  documentation: https://opencode.ai/docs
  repository: https://github.com/anomalyco/opencode

extra:
  recipe-maintainers:
    - killua156
    - eunos-1128
