schema_version: 1

context:
  name: opencode
  version: "1.18.34"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/anomalyco/opencode/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c2c60efde22639b64c7bfa740da39b9c8079391a7540e2f67bf91b36e5797f17

build:
  number: 0
  skip:
    # bun is not available for Windows on conda-forge
    - win
    # bun build --compile from the conda-forge bun fails on macOS with
    # OverlappingSegments, enable again once the bun feedstock is fixed
    - osx
  dynamic_linking:
    # bun --compile appends the app to the bun executable, patching it would
    # corrupt that payload. bun already uses $ORIGIN/../lib as its rpath.
    binary_relocation: false

requirements:
  build:
    - ${{ compiler('cxx') }}
    - bun
  host:
    # The opencode binary is a copy of bun, so it links the same shared
    # libraries. Only bun is listed here so the global pins do not clash with
    # the versions bun was built against, the libraries come in through it.
    - bun
  run:
    - ${{ pin_compatible('c-ares', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('hdrhistogram-c', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('libarchive', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('libbrotlicommon', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('libbrotlidec', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('libbrotlienc', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('libdeflate', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('libhwy', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('libsqlite', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('libzlib', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('lol-html', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('ls-hpack', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - ${{ pin_compatible('zstd', lower_bound='x.x.x', upper_bound='x.x.x') }}
    - if: linux
      then: ${{ pin_compatible('icu', lower_bound='x.x', upper_bound='x') }}

tests:
  - script:
      - opencode --version
      - opencode --help

about:
  homepage: https://opencode.ai
  summary: The open source coding agent
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  documentation: https://opencode.ai/docs
  repository: https://github.com/anomalyco/opencode

extra:
  recipe-maintainers:
    - killua156
