schema_version: 1

context:
  name: opencode
  version: "1.18.34"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/anomalyco/opencode/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c2c60efde22639b64c7bfa740da39b9c8079391a7540e2f67bf91b36e5797f17

build:
  number: 0
  # bun is not available for Windows on conda-forge
  skip: win
  dynamic_linking:
    # bun --compile appends the app to the bun executable, patching it would
    # corrupt that payload. bun already uses $ORIGIN/../lib as its rpath.
    binary_relocation: false

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - bun
    - nodejs
  host:
    # The opencode binary is a copy of bun, so it needs the same shared
    # libraries at runtime. bun is listed here so the solver picks library
    # versions matching the bun that is copied.
    - bun
    - c-ares
    - hdrhistogram-c
    - if: linux
      then: icu
    - libarchive
    - libbrotlicommon
    - libbrotlidec
    - libbrotlienc
    - libdeflate
    - libhwy
    - libsqlite
    - libzlib
    - lol-html
    - ls-hpack
    - zstd

tests:
  - script:
      - opencode --version
      - opencode --help

about:
  homepage: https://opencode.ai
  summary: The open source coding agent
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  documentation: https://opencode.ai/docs
  repository: https://github.com/anomalyco/opencode

extra:
  recipe-maintainers:
    - timkpaine
    - killua156
