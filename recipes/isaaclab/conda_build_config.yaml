# The bundled isaaclab package vendors manylinux_2_35 wheels (isaaclab_ov ships C
# extensions built against glibc 2.35), and the test env pulls the manylinux_2_35
# omniverseclient wheel, so a glibc >= 2.35 image is required. The smallest sysroot /
# conda-forge image providing that is AlmaLinux 10 (glibc 2.39), so request 2.39.
c_stdlib:          # [linux]
  - sysroot        # [linux]
c_stdlib_version:  # [linux]
  - "2.39"         # [linux]
