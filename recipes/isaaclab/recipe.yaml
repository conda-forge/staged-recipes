context:
  name: isaaclab
  version: "3.0.0"
  build_number: 0
  python_min: "3.12"
  # Skipped: it needs isaacteleop, a PyPI-only binary package (like the ov* wheels), not on conda-forge.
  skip_extensions: "isaaclab_teleop"

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/isaac-sim/IsaacLab/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7d751e71662318cf2a545d6465bbc7d853c7537581b66625a4a990d8e9ff28d1
  # No source-layout patch is needed because upstream flattens the package itself (stage.py).
  patches:
    # Python 3.14 compatibility.
    - patches/0001-support-python-3.14-annotations-in-configclass.patch

build:
  noarch: python
  number: ${{ build_number }}

outputs:
  # ========================
  # isaaclab-build (staging)
  # ========================
  # Builds the bundled install once.
  # Every output below inherits it and selects only its files, so the clone and installs run a single time.
  - staging:
      name: isaaclab-build
    build:
      script:
        # Install every workspace member under source/, minus skip_extensions.
        # Kit-only stubs without a Python project are skipped by find.
        - |
          set -euo pipefail
          find source/isaaclab source/isaaclab_* -maxdepth 1 \
            \( -name pyproject.toml -o -name setup.py \) -printf '%h\n' \
            | sort -u | while read -r ext; do
            pkg=$(basename "$ext")
            case " ${{ skip_extensions }} " in
              *" $pkg "*) echo "::warning::skip $pkg, backend missing on conda-forge"; continue ;;
            esac
            ${{ PYTHON }} -m pip install "./$ext" -vv --no-deps --no-build-isolation
          done
        # Co-locate the runtime resources inside the flat package, so isaaclab/_paths.py::ISAACLAB_ROOT resolves them.
        - cp -r apps "${{ SP_DIR }}/isaaclab/apps"
        # apps/ ships no __init__.py, so make each directory importable.
        - find "${{ SP_DIR }}/isaaclab/apps" -type d -exec touch {}/__init__.py \;
        - mkdir -p "${{ SP_DIR }}/isaaclab/tools"
        - cp -r tools/template "${{ SP_DIR }}/isaaclab/tools/template"
        # Backs the `isaaclab demo` and `isaaclab example` catalogs (isaaclab/programs.py).
        - cp -r examples "${{ SP_DIR }}/isaaclab/examples"
        # Reinject the third-party deps into the installed metadata, since the per-member installs drop them.
        # The base pip_check then validates them against upstream.
        # Names only, since conda-forge serves newer builds, and closed-source deps are excluded.
        - ${{ PYTHON }} tools/wheel_builder/gen_pyproject.py pyproject.toml gen_deps.toml "0"
        - ${{ PYTHON }} "${{ RECIPE_DIR }}/gen_extra_metadata.py" base gen_deps.toml "${{ SP_DIR }}"
        # Generate a synthetic dist-info per packaged extra (the list lives in gen_extra_metadata.py).
        # The same call stops the build if upstream adds, renames or removes an extra.
        # Each metapackage selects its own for pip_check (see gen_extra_metadata.py).
        - ${{ PYTHON }} "${{ RECIPE_DIR }}/gen_extra_metadata.py" extras gen_deps.toml pyproject.toml "${{ SP_DIR }}" "${{ version }}"
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - setuptools >=70.0,<82.0.0
        - wheel
  # ========
  # isaaclab
  # ========
  # The bundled package contains every workspace member.
  # The synthetic isaaclab_extra_* dist-infos are excluded because they are the metapackages' payload.
  - package:
      name: isaaclab
    inherit:
      from: isaaclab-build
      run_exports: false
    build:
      python:
        entry_points:
          - isaaclab = isaaclab.cli:cli
      files:
        include:
          - "**"
        exclude:
          - "**/isaaclab_extra_*"
    requirements:
      run:
        - python >=${{ python_min }}
        - numpy >=2
        # Upstream pins torch==2.11.0 as a workaround for the NCCL bundled in the PyPI wheels (IsaacLab#8372).
        # conda-forge does not bundle NCCL in pytorch, so the exact pin is relaxed to a floor.
        - pytorch >=2.11.0
        - torchvision >=0.26.0
        - onnx >=1.18.0
        - prettytable >=3.3.0
        - psutil
        - protobuf >=4.25.8,!=5.26.0
        - hidapi >=0.14.0
        - gymnasium >=1.2.0
        - trimesh >=4.6.8
        - pyglet >=2.1.6,<3
        # Floored, not exact, because conda-forge has no 5.10.4 (nearest 5.16.1).
        - transformers >=5.10.4
        - einops
        - warp-lang 1.17.0.*
        - matplotlib-base >=3.10.3
        - pillow >=12.3.0
        - botocore
        - starlette >=1.3.1
        - filelock
        - lazy-loader >=0.4
        - jinja2
        - pinocchio
        - pink 3.3.0.*
        - daqp 0.8.5.*
        - usd-exchange 3.0.1.*
        - hf-xet >=1.4.1,<2.0.0
        - tensorboard
        - numba >=0.63.1
        - hydra-core
        - h5py >=3.15.0
        - packaging
        - rich
        - tqdm >=4.67.1
        - rsl-rl-lib 5.5.1.*
        - gitpython >=3.1.60
        - newton-sim 1.6.1.*
        - requests >=2.25.0
        - urllib3 >=2.8.0
        - scipy >=1.11.0
        - coacd >=1.0.7
        - fast-simplification >=0.1.11
        - alphashape >=1.3.1
        - meshio >=5.3.5
        - pycollada >=0.9
        - resolve-robotics-uri-py >=0.4.0
        - open3d >=0.19.0
        - newton-usd-schemas >=0.5.0
        - pyopengl-accelerate >=3.1.0
        - imgui-bundle >=1.92.5
        - typing-extensions >=4.15.0
    tests:
      # Validates the reinjected third-party deps resolve against the installed env.
      - python:
          imports:
            - isaaclab
          pip_check: true
          python_version: ${{ python_min }}.*
      # CLI test.
      # It reaches the dispatcher without Isaac Sim or a GPU, and exercises the flat package entry point plus ISAACLAB_ROOT resolution.
      - script:
          - isaaclab --help
          - isaaclab train --help
          - isaaclab play --help
          # Every demo and example script resolves inside the installed package.
          - python -c "from isaaclab.programs import DEMOS, EXAMPLES; missing = [p.relative_path for p in DEMOS + EXAMPLES if not p.path.is_file()]; assert not missing, missing"
      # Runs upstream's unit suite against the installed package.
      # The script adapts to the runner (GPU, omniverseclient, ovphysx) and is shared with the local pixi verification.
      - script:
          - bash run_unit_tests.sh .
        requirements:
          run:
            - python ${{ python_min }}.*
            - flaky
            - pytest
            - pytest-mock
        files:
          recipe:
            - run_unit_tests.sh
          source:
            - source/isaaclab/test/
            # Some tests load kernels by relative path, so ship the source tree next to test/.
            - source/isaaclab/isaaclab/
  # ============
  # isaaclab-all
  # ============
  # Aggregates the packaged extras except wandb, which upstream's `all` leaves out too.
  # Its synthetic `all` dist-info lets pip_check confirm they cover what upstream's `all` declares.
  - package:
      name: isaaclab-all
    inherit:
      from: isaaclab-build
      run_exports: false
    build:
      files:
        - "**/isaaclab_extra_all-*.dist-info/**"
    requirements:
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('isaaclab', exact=True) }}
        - ${{ pin_subpackage('isaaclab-leapp', exact=True) }}
        - ${{ pin_subpackage('isaaclab-mimic', exact=True) }}
        - ${{ pin_subpackage('isaaclab-rerun', exact=True) }}
        - ${{ pin_subpackage('isaaclab-sb3', exact=True) }}
        - ${{ pin_subpackage('isaaclab-tetrahedralization', exact=True) }}
        - ${{ pin_subpackage('isaaclab-torchrl', exact=True) }}
        - ${{ pin_subpackage('isaaclab-video', exact=True) }}
        - ${{ pin_subpackage('isaaclab-viser', exact=True) }}
    tests:
      - python:
          imports:
            - isaaclab
          pip_check: true
          python_version: ${{ python_min }}.*
  # ==============
  # isaaclab-video
  # ==============
  # Ships the synthetic `video` dist-info so pip_check validates the extra's deps against upstream.
  # The other extras below follow the same pattern.
  - package:
      name: isaaclab-video
    inherit:
      from: isaaclab-build
      run_exports: false
    build:
      files:
        - "**/isaaclab_extra_video-*.dist-info/**"
    requirements:
      run:
        - ${{ pin_subpackage('isaaclab', exact=True) }}
        - python >=${{ python_min }}
        - moviepy >=1.0.3,<2.0.0.dev0
    tests:
      - python:
          imports:
            - moviepy
          pip_check: true
          python_version: ${{ python_min }}.*
  # ==============
  # isaaclab-wandb
  # ==============
  - package:
      name: isaaclab-wandb
    inherit:
      from: isaaclab-build
      run_exports: false
    build:
      files:
        - "**/isaaclab_extra_wandb-*.dist-info/**"
    requirements:
      run:
        - ${{ pin_subpackage('isaaclab', exact=True) }}
        - python >=${{ python_min }}
        - wandb >=0.13.11
    tests:
      - python:
          imports:
            - wandb
          pip_check: true
          python_version: ${{ python_min }}.*
  # ============
  # isaaclab-sb3
  # ============
  - package:
      name: isaaclab-sb3
    inherit:
      from: isaaclab-build
      run_exports: false
    build:
      files:
        - "**/isaaclab_extra_sb3-*.dist-info/**"
    requirements:
      run:
        - ${{ pin_subpackage('isaaclab', exact=True) }}
        - python >=${{ python_min }}
        - stable-baselines3 >=2.6
        - tqdm
        - rich
    tests:
      - python:
          imports:
            - isaaclab_rl.sb3
          pip_check: true
          python_version: ${{ python_min }}.*
  # ==============
  # isaaclab-viser
  # ==============
  - package:
      name: isaaclab-viser
    inherit:
      from: isaaclab-build
      run_exports: false
    build:
      files:
        - "**/isaaclab_extra_viser-*.dist-info/**"
    requirements:
      run:
        - ${{ pin_subpackage('isaaclab', exact=True) }}
        - python >=${{ python_min }}
        - viser >=1.0.16
    tests:
      - python:
          imports:
            - isaaclab_visualizers.viser
          pip_check: true
          python_version: ${{ python_min }}.*
  # ==============
  # isaaclab-rerun
  # ==============
  - package:
      name: isaaclab-rerun
    inherit:
      from: isaaclab-build
      run_exports: false
    build:
      files:
        - "**/isaaclab_extra_rerun-*.dist-info/**"
    requirements:
      run:
        - ${{ pin_subpackage('isaaclab', exact=True) }}
        - python >=${{ python_min }}
        - rerun-sdk >=0.29.0
        - pyarrow 23.0.1.*
    tests:
      - python:
          imports:
            - isaaclab_visualizers.rerun
          pip_check: true
          python_version: ${{ python_min }}.*
  # ==============
  # isaaclab-mimic
  # ==============
  # robomimic is a Git dep upstream but has a feedstock, so gen_extra_metadata.py re-adds it by name for pip_check.
  - package:
      name: isaaclab-mimic
    inherit:
      from: isaaclab-build
      run_exports: false
    build:
      files:
        - "**/isaaclab_extra_mimic-*.dist-info/**"
    requirements:
      run:
        - ${{ pin_subpackage('isaaclab', exact=True) }}
        - python >=${{ python_min }}
        - ipywidgets >=8.1.5
        - robomimic 0.4.*
    tests:
      - python:
          imports:
            - robomimic
          pip_check: true
          python_version: ${{ python_min }}.*
  # ===========================
  # isaaclab-tetrahedralization
  # ===========================
  - package:
      name: isaaclab-tetrahedralization
    inherit:
      from: isaaclab-build
      run_exports: false
    build:
      files:
        - "**/isaaclab_extra_tetrahedralization-*.dist-info/**"
    requirements:
      run:
        - ${{ pin_subpackage('isaaclab', exact=True) }}
        - python >=${{ python_min }}
        # Upstream pins the pytetwild all extra >=0.3.0,<0.4 but conda-forge only ships 0.4.2.
        # Relax the upper bound, since the tetrahedralize API that isaaclab.sim.schemas uses is unchanged across 0.3 and 0.4.
        # pyvista mirrors the pytetwild all extra, which has it as its only member.
        # TODO: drop the relax once upstream lifts the <0.4 cap.
        - pytetwild >=0.3.0
        - pyvista
    tests:
      - python:
          imports:
            - pytetwild
          pip_check: true
          python_version: ${{ python_min }}.*
  # ==============
  # isaaclab-leapp
  # ==============
  - package:
      name: isaaclab-leapp
    inherit:
      from: isaaclab-build
      run_exports: false
    build:
      files:
        - "**/isaaclab_extra_leapp-*.dist-info/**"
    requirements:
      run:
        - ${{ pin_subpackage('isaaclab', exact=True) }}
        - python >=${{ python_min }}
        - leapp 0.7.2.*
    tests:
      - python:
          imports:
            - leapp
          pip_check: true
          python_version: ${{ python_min }}.*
  # ================
  # isaaclab-torchrl
  # ================
  # The torchrl extra maps to conda pytorchrl, which provides the torchrl module.
  # It co-solves with the newton-sim/mujoco stack only at the base torch 2.11 pin.
  - package:
      name: isaaclab-torchrl
    inherit:
      from: isaaclab-build
      run_exports: false
    build:
      files:
        - "**/isaaclab_extra_torchrl-*.dist-info/**"
    requirements:
      run:
        - ${{ pin_subpackage('isaaclab', exact=True) }}
        - python >=${{ python_min }}
        - pytorchrl >=0.13
    tests:
      - python:
          imports:
            - torchrl
          pip_check: true
          python_version: ${{ python_min }}.*
  # ==============
  # isaaclab-rlinf
  # ==============
  # Disabled: every dependency is on conda-forge, but isaaclab does not co-install with decord2.
  # decord2 needs ffmpeg 9, whose dependencies need libabseil 20260526.
  # isaaclab pins newton-sim 1.6.1, which needs mujoco 3.12, and mujoco-python 3.12.0 is built for libabseil 20260107.1.
  # Re-enable once mujoco-python 3.12 is rebuilt for libabseil 20260526, or when upstream moves to a newer newton.
  # Upstream's `all` extra does not include rlinf, so isaaclab-all would not pull this output anyway.
  #
  # - package:
  #     name: isaaclab-rlinf
  #   inherit:
  #     from: isaaclab-build
  #     run_exports: false
  #   build:
  #     files:
  #       - "**/isaaclab_extra_rlinf-*.dist-info/**"
  #   requirements:
  #     run:
  #       - ${{ pin_subpackage('isaaclab', exact=True) }}
  #       - python >=${{ python_min }}
  #       - ray-default >=2.47.0
  #       - virtualenv >=21.7.13
  #       - av >=12.3.0
  #       - numpydantic >=1.7.0
  #       # albumentations is archived upstream (superseded by albumentationsx).
  #       - albumentations >=1.4.18
  #       # The conda albumentations pins albucore 0.0.24, which imports simsimd.
  #       # simsimd 7 became NumKong and no longer ships that module, so stay on 6.x.
  #       # Drop the pin once the albumentations feedstock moves to a newer albucore.
  #       - simsimd <7
  #       - decord2
  #       - dm-tree >=0.1.8
  #       - diffusers >=0.35.0
  #       - timm >=1.0.14
  #       - peft >=0.17.0
  #       - pandas
  #   tests:
  #     - python:
  #         imports:
  #           - ray
  #           - av
  #           - timm
  #           - diffusers
  #           - albumentations
  #         pip_check: true
  #         python_version: ${{ python_min }}.*
  # Inactive extras are kept commented until they can be packaged.
  # rsl-rl is already in the base, so it needs no subpackage.
  # skrl and rl-games have no conda-forge feedstock, and rl-games also needs standard-distutils.
  #
  # - package:
  #     name: isaaclab-skrl
  #   requirements:
  #     run:
  #       - ${{ pin_subpackage('isaaclab', exact=True) }}
  #       - python >=${{ python_min }}
  #       - skrl >=2.1.0  # missing in conda-forge
  #
  # - package:
  #     name: isaaclab-rl-games
  #   requirements:
  #     run:
  #       - ${{ pin_subpackage('isaaclab', exact=True) }}
  #       - python >=${{ python_min }}
  #       - aiohttp >=3.14.3
  #       - gym
  #       - rl-games          # missing in conda-forge (git @ python3.11)
  #       - standard-distutils  # missing in conda-forge

about:
  homepage: https://isaac-sim.github.io/IsaacLab
  license: BSD-3-Clause AND Apache-2.0
  license_file:
    - LICENSE
    - LICENSE-mimic
  repository: https://github.com/isaac-sim/IsaacLab
  summary: Unified framework for robot learning built on NVIDIA Isaac Sim

extra:
  feedstock-name: isaaclab
  recipe-maintainers:
    - diegoferigo
    - StafaH
