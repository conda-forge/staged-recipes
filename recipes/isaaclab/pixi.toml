# Self-contained local smoke test for the isaaclab recipe.
# pixi-build currently drops conda-forge in the staging host env, so build the
# recipe with rattler-build into a local channel first, then run the tasks:
#   rattler-build build --recipe recipe.yaml -m ../../.ci_support/linux64.yaml --output-dir .pixi/channel
#   pixi run plain          # resolve and run the Newton idle smoke
#   pixi run -e ovrtx ovrtx # same, plus the PyPI-only Omniverse RTX backends

[workspace]
name = "isaaclab-conda-smoke"
channels = ["./.pixi/channel", "conda-forge"]
# Custom platform pinning glibc for the manylinux_2_35 Omniverse wheels and cuda
# for the CUDA pytorch build the examples need.
platforms = [
    { name = "linux-64-cuda13", platform = "linux-64", glibc = "2.35", cuda = "13" },
    { name = "linux-64-cpu", platform = "linux-64", glibc = "2.35" },
]

[dependencies]
isaaclab-all = "*"

[constraints]
python = "3.12.*"
# The driver here (580) supports CUDA 13.0, newer nvrtc PTX fails to load in warp.
cuda-version = "13.0.*"

# The Nucleus/S3 USD assets are fetched through omni.client, so even a Newton
# idle run needs omniverseclient. It is a closed-source wheel from pypi.nvidia.com
# (not on conda-forge), which is exactly the blocker described in the README.
[pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]
no-build-isolation = true

[pypi-dependencies]
omniverseclient = "==2.74.0"

# Newton idle smoke. The device is an argument so the long command lives once:
# it defaults to CPU (works on a GPU-less machine) and the CUDA platform wrapper
# below flips it to the GPU.
[tasks._cartpole]
args = [{ arg = "device", default = "cpu", choices = ["cpu", "cuda"] }]
cmd = """isaaclab train \
  --task=Isaac-Cartpole-Direct \
  --num_envs=16 \
  --rl_library=rsl_rl \
  --max_iterations=10 \
  physics=newton_mjwarp \
  --device {{ device }} \
  agent.device={{ device }}"""

[tasks.plain]
depends-on = ["_cartpole"]

[target.linux-64-cuda13.tasks.plain]
depends-on = [{ task = "_cartpole", args = ["cuda"] }]

# ovrtx layers in the closed-source Omniverse RTX backends from PyPI, on top of
# the omniverseclient the base env already needs.
[feature.ovrtx.pypi-dependencies]
ovrtx = "==0.5.1.*"
ovstage = "==0.2.1.*"

# RTX rendering needs a GPU, so expose this task only on the CUDA platform.
[feature.ovrtx.target.linux-64-cuda13.tasks]
ovrtx = """isaaclab train \
  --task=IsaacContrib-Reorient-Cube-Shadow-Camera-Benchmark-Direct \
  --num_envs=16 \
  --rl_library=rsl_rl \
  --max_iterations=10 \
  physics=newton_mjwarp \
  renderer=ovrtx \
  presets=newton_mjwarp,simple_shading_diffuse_mdl"""

[environments]
ovrtx = { features = ["ovrtx"] }
