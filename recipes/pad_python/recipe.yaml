schema_version: 1

context:
  version: "4.0.0"

package:
  name: pad_python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pad_python/pad_python-${{ version }}.tar.gz
  sha256: cb79a3802d81f9fef38d87356677af2179df12d20dd5f647bc74b80e02dadfb1

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=77
  run:
    - python
    - numpy >=1.23

tests:
  - python:
      imports:
        - pad_python
      pip_check: true
  - script:
      - python tests/test_pad_python.py
    files:
      source:
        - tests/test_pad_python.py

about:
  homepage: https://github.com/skokg/PAD
  summary: Precipitation Attribution Distance for fields on a planar grid
  description: |
    PAD measures spatial displacement between precipitation fields on a planar
    grid. It provides a NumPy interface to a C++ nearest-neighbor attribution
    implementation, returning attribution records, residual fields and
    amount-weighted mean attribution distances.
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/skokg/PAD#readme
  repository: https://github.com/skokg/PAD

extra:
  recipe-maintainers:
    - skokg
