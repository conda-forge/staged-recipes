context:
  version: 3.28.0
  build_number: 0

package:
  name: spdx-license-list-data
  version: ${{ version }}

source:
  url: https://github.com/spdx/license-list-data/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 52375a91b28b5f6f3142c4b3a555086482f1e09be68c4fa7fdbf377d37afa340

build:
  number: ${{ build_number }}
  noarch: generic
  script:
    - set -ex
    - target_dir="${{ PREFIX }}/share/spdx/license-list-data/json/"
    - mkdir -p "${target_dir}"
    - cp json/*.json "${target_dir}"

tests:
  - package_contents:
      files:
        - share/spdx/license-list-data/json/licenses.json
        - share/spdx/license-list-data/json/exceptions.json

about:
  homepage: https://github.com/spdx/license-list-data
  summary: Various data formats for the SPDX License List
  license: CC0-1.0
  license_file:
    - text/CC0-1.0.txt
  repository: https://github.com/spdx/license-list-data

extra:
  recipe-maintainers:
    - jaimergp
    - isuruf
