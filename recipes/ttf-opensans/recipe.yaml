schema_version: 1
context:
  version: 2020.10.30
package:
  name: ttf-opensans
  version: ${{ version }}
source:
  url: https://pypi.org/packages/source/t/ttf-opensans/ttf-opensans-${{ version }}.tar.gz
  sha256: bbc6e8e1f354a8a20970cb9e2a6fbd10cf2e855c9194e1d59268487d7d4d1e83
build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools
  - wheel
  run:
  - python >=${{ python_min }}
tests:
- python:
    imports:
    - ttf_opensans
    pip_check: true
    python_version:
    - ${{ python_min }}.*
    - '*'
- requirements:
    run:
    - python ${{ python_min }}.*
  script:
  - python -c "from importlib.metadata import version; assert version('ttf-opensans') == '${{ version }}'"
  - python -c "import ttf_opensans as f; assert len(f.FONTS) == 10; assert all(x.path.is_file() and x.path.stat().st_size > 0 for x in f.FONTS); assert f.opensans().path == f.OPENSANS_REGULAR.path"
about:
  homepage: https://github.com/Gorialis/ttf-opensans
  repository: https://github.com/Gorialis/ttf-opensans
  summary: Open Sans fonts bundled with a Python interface
  license: Apache-2.0
  license_file: LICENSE
extra:
  recipe-maintainers:
  - EinarOlafsson
