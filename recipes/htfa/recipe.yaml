context:
  version: "0.1.0"

package:
  name: htfa
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/htfa/htfa-${{ version }}.tar.gz
  sha256: 3d20dd265946f5650473ce3a62500d9d2bdfcc8f3ca33af496805c49347e73c6

build:
  number: 0
  skip: match(python, "<3.10")
  script: python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=77
  run:
    - python
    - numpy >=1.24
    - scipy >=1.10
    - scikit-learn >=1.3
    - nibabel >=5
    - joblib >=1.3
    - threadpoolctl >=3
    - packaging >=21
    # Match the upstream Apple Silicon dependency without requiring GPU
    # libraries for CPU installations on other platforms.
    - if: osx and arm64
      then: pytorch >=2.2

tests:
  - python:
      imports:
        - htfa
        - htfa.stats
        - htfa.groups
      pip_check: true
  - script: python run_test.py
    files:
      recipe:
        - run_test.py

about:
  homepage: https://github.com/ContextLab/htfa
  summary: Hierarchical Topographic Factor Analysis
  description: |
    HTFA represents spatial data using localized factors and shares their
    locations across subjects through a hierarchical model. It supports
    fMRI volumes and images, multiple spatial kernel shapes, mixture factors,
    reconstruction statistics, and brain network visualization.
  license: MIT
  license_file: LICENSE
  documentation: https://htfa.readthedocs.io/en/latest/
  repository: https://github.com/ContextLab/htfa

extra:
  recipe-maintainers:
    - jeremymanning
