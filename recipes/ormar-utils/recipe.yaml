context:
  version: "0.1.1"

package:
  name: ormar-utils
  version: ${{ version }}

source:
  url: https://github.com/ormar-orm/ormar-utils/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c318958f155db5f4a8518abea00600580ef18413cf33bfbc5b3e96f7baaa7cbc

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - python -m pip install . -vv

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
      - ormar_rust_utils
      pip_check: true

about:
  homepage: https://github.com/ormar-orm/ormar-utils
  summary: 'Rust-accelerated utility functions for the ormar async ORM.'
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - thewchan
