context:
  version: "0.1.1"

package:
  name: ormar-utils
  version: ${{ version }}

source:
  url: https://github.com/ormar-orm/ormar-utils/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a429e0321cd5d8ca61d966ab853a56155aa3f4e43e69054493323f4df1f7e4bc

build:
  number: 0
  script:
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - python -m pip install . -vv
  

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.0,<2.0
  run:
    - python

tests:
  - python:
      imports:
      - ormar_rust_utils
      pip_check: true

about:
  homepage: https://github.com/ormar-orm/ormar-utils
  summary: 'Rust-accelerated utility functions for the ormar async ORM.'
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - thewchan
