schema_version: 1

context:
  version: "2026.01.02"

package:
  name: fre-nctools
  version: ${{ version }}

source:
  url: https://github.com/NOAA-GFDL/FRE-NCtools/archive/refs/tags/${{ version }}.tar.gz
  sha256: 1fef452f7d9cf5a5b3124999ed7f4ab167d22020c6adf1179bbbe76626e54377

build:
  number: 0
  skip: win
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - autoconf
    - automake
    - make
  host:
    - libnetcdf * nompi_*
    - netcdf-fortran * nompi_*
    - nco
    - perl
  run:
    - nco
    - perl
    - tcsh

tests:
  - files:
      recipe:
        - run_test.sh
    script: bash run_test.sh

about:
  homepage: https://github.com/NOAA-GFDL/FRE-NCtools
  summary: Tools for creating model grids and manipulating netCDF files
  description: |
    FRE-NCtools provides tools for creating grids and mosaics used in climate
    and weather models, remapping data between grids, and creating and
    manipulating netCDF files for FMS-based models. This package includes
    the serial tools without MPI or GPU support.
  license: LGPL-3.0-or-later
  license_file: LICENSE.md
  documentation: https://github.com/NOAA-GFDL/FRE-NCtools/wiki
  repository: https://github.com/NOAA-GFDL/FRE-NCtools

extra:
  recipe-maintainers:
    - ilaflott
