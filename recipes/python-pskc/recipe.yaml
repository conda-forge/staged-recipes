schema_version: 1

context:
  version: "1.4"

package:
  name: python-pskc
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/python-pskc/python_pskc-${{ version }}.tar.gz
  sha256: 4a36381446ca067be728b30e01b4d18dbd9d1ad553bf07c3710abcd87653eefe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - csv2pskc = pskc.scripts.csv2pskc:main
      - pskc2csv = pskc.scripts.pskc2csv:main
      - pskc2pskc = pskc.scripts.pskc2pskc:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - cryptography
    - python-dateutil

tests:
  - python:
      imports:
        - pskc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - csv2pskc --help
      - pskc2csv --help
      - pskc2pskc --help

about:
  summary: Python module for handling PSKC files
  description: |
    A Python module to handle Portable Symmetric Key Container (PSKC) files
    as defined in RFC 6030, used for transporting symmetric keys such as
    HOTP/TOTP secrets.
  license: LGPL-2.1-or-later
  license_file: COPYING
  homepage: https://arthurdejong.org/python-pskc/
  repository: https://github.com/arthurdejong/python-pskc

extra:
  recipe-maintainers:
    - pavelzw
