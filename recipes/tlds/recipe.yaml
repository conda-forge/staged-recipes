schema_version: 1

context:
  version: 2026093003

package:
  name: tlds
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/t/tlds/tlds-${{ version }}.tar.gz
  sha256: 573e8eb20d9f5dcbaed6fdfc56f2fd6047e6fef6282af24147589e87700a32bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tlds
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Automatically updated list of valid TLDs taken directly from IANA
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/kichik/tlds

extra:
  recipe-maintainers:
    - akrherz
