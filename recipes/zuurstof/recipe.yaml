schema_version: 1

context:
  version: "0.1.0"
  python_min: "3.12"

package:
  name: zuurstof
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/z/zuurstof/zuurstof-${{ version }}.tar.gz
  sha256: 03ed295502d98d529416e1bcad7f45f1e54eb4c924ff674b1da2a7221af5f1f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1
    - pandas >=3,<4

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - zuurstof
      pip_check: true

about:
  summary: Dissolved oxygen data processing in Python
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://pypi.org/project/zuurstof/

extra:
  recipe-maintainers:
    - mvdh7
