schema_version: 1

context:
  version: "2.2.1"

package:
  name: nxsconfigtool
  version: ${{ version }}

source:
  url: https://github.com/nexdatas/nxsdesigner/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 87b88efbbd98d8961d2f4bfbc853feaffbffdc989ad75fed77d84747d5a62bc1

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
    - qt-main
  run:
    - python >=${{ python_min }}
    - pytango
    - nxstools >=4.29.0
    - pyqt >=5.15,<6

tests:
  - python:
      imports:
        - nxsconfigtool
        - nxsconfigtool.AttributeDlg
        - nxsconfigtool.ComponentCreator
        - nxsconfigtool.ComponentDlg
        - nxsconfigtool.ComponentItem
        - nxsconfigtool.ComponentList
        - nxsconfigtool.ComponentModel
        - nxsconfigtool.Component
        - nxsconfigtool.ConfigurationServer
        - nxsconfigtool.ConnectDlg
        - nxsconfigtool.CreatorDlg
        - nxsconfigtool.DataSourceDlg
        - nxsconfigtool.DataSourceList
        - nxsconfigtool.DataSourceMethods
        - nxsconfigtool.DataSource
        - nxsconfigtool.DataSources
        - nxsconfigtool.DefinitionDlg
        - nxsconfigtool.DimensionsDlg
        - nxsconfigtool.DomTools
        - nxsconfigtool.EditCommands
        - nxsconfigtool.EditSlots
        - nxsconfigtool.ElementList
        - nxsconfigtool.Errors
        - nxsconfigtool.FieldDlg
        - nxsconfigtool.FileCommands
        - nxsconfigtool.FileSlots
        - nxsconfigtool.GroupDlg
        - nxsconfigtool.HelpForm
        - nxsconfigtool.HelpSlots
        - nxsconfigtool.ItemCommands
        - nxsconfigtool.ItemSlots
        - nxsconfigtool.LabeledObject
        - nxsconfigtool.LinkDlg
        - nxsconfigtool.ListCommands
        - nxsconfigtool.ListSlots
        - nxsconfigtool.Logger
        - nxsconfigtool.MainWindow
        - nxsconfigtool.MapDlg
        - nxsconfigtool.Merger
        - nxsconfigtool.NodeDlg
        - nxsconfigtool.Release
        - nxsconfigtool.RichAttributeDlg
        - nxsconfigtool.SelectionDlg
        - nxsconfigtool.ServerCommands
        - nxsconfigtool.ServerSlots
        - nxsconfigtool.SourceViewDlg
        - nxsconfigtool.StrategyDlg
        - nxsconfigtool.VDSDlg
        - nxsconfigtool.WindowsSlots
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - if: unix
        then:
          - test -x "$PREFIX/bin/nxsdesigner"
          - nxsdesigner --help
    requirements:
      run:
        - python ${{ python_min }}.*
    files:
      source:
        - site-packages/nxsconfigtool/qrc/resources.rcc
  - package_contents:
      files:
        - site-packages/nxsconfigtool/qrc/resources.rcc


about:
  homepage: https://github.com/nexdatas/nxsdesigner
  repository: https://github.com/nexdatas/nxsdesigner
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: NeXus Component Designer GUI
  description: |
    Component Designer is a GUI configuration tool dedicated
    to create components as well as datasources
    which constitute the XML configuration strings of Nexus Data Writer (NXS).
    The created XML elements can be saved in the extended Nexus XML format
    in Configuration Tango Server or in disk files.

extra:
  recipe-maintainers:
    - jkotan
