schema_version: 1

context:
  version: "1.1.0"

package:
  name: r-futurize
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/futurize_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/futurize/futurize_${{ version }}.tar.gz
  sha256: b775378a36aeb812182735b9f62d75148cabb31f49c8d8e910bdcfb93a0a1b1d

build:
  number: 0
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
    - r-future >=1.80.0
  run:
    - r-base
    - r-future >=1.80.0

tests:
  - r:
      libraries:
        - futurize

about:
  homepage: https://futurize.futureverse.org
  summary: Parallelize Common Functions via One Magic Function
  description: |-
    The futurize() function <doi:10.48550/arXiv.2601.17578>
    turns sequential map-reduce functions such as base::lapply(),
    purrr::map(), 'foreach::foreach() %do% { ... }' into concurrent
    alternatives, providing you with a simple, straightforward path
    to scalable parallel computing via the 'future' ecosystem
    <doi:10.32614/RJ-2021-048>. By combining this transpiler
    function with R's native pipe operator, you have a convenient
    way for speeding up iterative computations with minimal
    refactoring, e.g. 'lapply(xs, fcn) |> futurize()',
    'purrr::map(xs, fcn) |> futurize()', and 'foreach::foreach(x =
    xs) %do% { fcn(x) } |> futurize()'. Other map-reduce packages
    that can be "futurized" are 'BiocParallel', 'plyr', 'crossmap',
    'pbapply' packages. There is also support for a growing set of
    domain-specific packages on CRAN (e.g. 'boot', 'caret',
    'DiceKriging', 'ez', 'fgsea', 'fwb', 'gamlss', 'glmmTMB',
    'glmnet', 'kernelshap', 'lme4', 'metafor', 'mgcv',
    'modelsummary', 'parameters', 'partykit', 'pls', 'pvclust',
    'riskRegression', 'rugarch', 'sandwich', 'seriation', 'shapr',
    'Sim.DiffProc', 'SimDesign', 'stars', 'strucchange',
    'SuperLearner', 'terra', 'tm', 'TSP', and 'vegan') and on
    Bioconductor (e.g. 'DESeq2', 'GenomicAlignments', 'GSVA',
    'Rsamtools', 'scater', 'scuttle', 'SingleCellExperiment', and
    'sva').
  license: Apache-2.0
  # The CRAN tarball ships no license file and r-base only provides
  # lib/R/share/licenses/Apache-2.0 from v4.6.0 onward
  license_file: LICENSE
  repository: https://github.com/futureverse/futurize
  documentation: https://futurize.futureverse.org

extra:
  recipe-maintainers:
    - conda-forge/r
    - HenrikBengtsson

