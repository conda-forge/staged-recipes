schema_version: 1

context:
  name: hipequivariance-ops-torch
  version: 0.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/hipequivariance_ops_torch-${{ version }}.tar.gz
  sha256: d0d9cef40e21228af826f8d0729e55d16073327d3dd44006eadedf16eddadc9f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}
    - geometric-nn-ops-torch ==${{ version }}
    - pytorch >=2.4

tests:
  - python:
      imports:
        - cuequivariance_ops_torch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Zero-code-change cuequivariance_ops_torch shim for AMD ROCm, backed by geometric-nn-ops Triton kernels.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/AMDResearch/geometric-nn-ops
  homepage: https://github.com/AMDResearch/geometric-nn-ops

extra:
  recipe-maintainers:
    - Emrys-Merlin
    - GMNGeoffrey
    - singagan
