context:
  version: "0.40.11"

package:
  name: buildpacks
  version: ${{ version }}

source:
  url: https://github.com/buildpacks/pack/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 3ec25f07ef7204911864a004cc5fa5bdf2ad523b422bc3a2e21695b2124a8238

build:
  number: 0
  script:
    - go-licenses save . --save_path library_licenses --ignore github.com/sagernet/
    - if: unix
      then: make PACK_VERSION=${{ version }} BINDIR="${PREFIX}/bin" build install
      else: make PACK_VERSION=${{ version }} BINDIR="%LIBRARY_BIN%" PACK_BIN=pack.exe build install

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses
    - make

tests:
  - script:
      - pack --version
      - pack --help
  - package_contents:
      strict: true
      bin:
        - pack

about:
  homepage: https://github.com/buildpacks/pack
  summary: CLI for building apps using Cloud Native Buildpacks.
  description: |
    CLI for building apps using Cloud Native Buildpacks.
  license: Apache-2.0
  license_file:
    - LICENSE
    - library_licenses/
  documentation: https://buildpacks.io/
  repository: https://github.com/buildpacks/pack

extra:
  recipe-maintainers:
    - XhstormR
