schema_version: 1

context:
  version: "2.3.7"

package:
  name: r-ternary
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/Ternary_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/Ternary/Ternary_${{ version }}.tar.gz
  sha256: a0e7976f452ba19306f24c10463c585e88ef1bf24c9cd256a480e1c02da1158e

build:
  number: 0
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
    - r-clue
    - r-plottools >=0.2.0
    - r-shiny
    - r-sp
  run:
    - r-base
    - r-clue
    - r-plottools >=0.2.0
    - r-shiny
    - r-sp

tests:
  - r:
      libraries:
        - Ternary

about:
  homepage: https://ms609.github.io/Ternary/
  repository: https://github.com/ms609/Ternary/
  documentation: https://ms609.github.io/Ternary/
  license: GPL-2.0-or-later
  license_family: GPL2
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-2
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: "Create Ternary and Holdridge Plots"
  description: |
    Plots ternary diagrams (simplex plots / Gibbs triangles) and Holdridge
    life zone plots <doi:10.1126/science.105.2727.367> using the standard
    graphics functions. Allows custom annotation, interpolating, contouring
    and scaling of plotting region. Includes a 'Shiny' user interface for
    point-and-click ternary plotting. An alternative to 'ggtern', which uses
    the 'ggplot2' family of plotting functions.

extra:
  recipe-maintainers:
    - conda-forge/r
    - ms609
