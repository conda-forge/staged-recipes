schema_version: 1

context:
  version: "0.5.0"

package:
  name: aioodbc
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/aioodbc/aioodbc-${{ version }}.tar.gz
  sha256: cbccd89ce595c033a49c9e6b4b55bbace7613a104b8a46e3d4c58c4bc4f25075

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - pyodbc >=5.0.1

tests:
  - python:
      imports:
        - aioodbc
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: ODBC driver for asyncio.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/aio-libs/aioodbc
  documentation: https://uddsketch.readthedocs.io

extra:
  recipe-maintainers:
    - jsmolic
