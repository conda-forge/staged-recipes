context:
  version: "0.6.3"
  python_min: "3.11"

package:
  name: anta-database
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anta_database/anta_database-${{ version }}.tar.gz
  sha256: 0d67ad0f0f0df61a67c35af3a2b68f9199da70b57ef6edd875fd2e9513063834

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - anta-sync = anta_database.cloud.sync:main
      - anta-publish = anta_database.cloud.publish:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - setuptools-scm >=9
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - pyarrow
    - xarray
    - h5netcdf
    - h5py
    - matplotlib-base
    - colormaps
    - tqdm
    - shapely

tests:
  - python:
      imports:
        - anta_database
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - anta-sync --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://antadatabase.com
  summary: SQLite database for the AntArchitecture Community Data
  description: |
    AntADatabase gathers the radar isochrones (internal reflection horizons) of
    the AntArchitecture community in one database, with tools to download,
    query and plot them.
  license: MIT
  license_file: LICENSE
  documentation: https://docs.antadatabase.com
  repository: https://github.com/antoinehermant/anta_database

extra:
  recipe-maintainers:
    - antoinehermant
