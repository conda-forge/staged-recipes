schema_version: 1

context:
  # Static version to bump per release.
  version: "0.1.0"

package:
  name: conda-pypi-repodata-patches
  version: ${{ version }}

source:
  - path: .

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pyyaml

tests:
  - python:
      imports:
        - conda_pypi_repodata_patches
        - conda_pypi_repodata_patches.loader
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "from conda_pypi_repodata_patches.loader import load_blocks; b=load_blocks(); assert {x.name for x in b} == {'lerc','tk'}, {x.name for x in b}"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/conda-forge/conda-pypi-repodata-patches-feedstock
  summary: Generates changes to the index metadata for the conda-pypi channel
  description: |
    This feedstock ships a declarative list of repodata patches to apply to the
    conda-pypi channel index, plus a loader/validator library. The repo-core
    channel server imports the loader, resolves each patch name against its
    shard index to artifact filenames, and makes the changes to the channel.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - danyeaw
