[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "conda-pypi-repodata-patches"
version = "0.0.0"
description = "Declarative block list for conda-pypi channel repodata removals."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3."
authors = [
  { name = "conda-forge" },
]
dependencies = [
  "pyyaml",
]

[tool.setuptools.packages.find]
include = ["conda_pypi_repodata_patches*"]

[tool.setuptools.package-data]
conda_pypi_repodata_patches = ["blocks/*.yaml", "py.typed"]
