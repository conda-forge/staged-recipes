[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "conda-pypi-repodata-patches"
version = "0.1.0"
description = "Declarative block list for conda-pypi channel repodata removals."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
  { name = "conda-forge" },
]
dependencies = [
  "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["conda_pypi_repodata_patches"]
exclude = ["**/__pycache__", "**/*.pyc"]
