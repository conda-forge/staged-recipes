schema_version: 1

context:
  version: "0.1.2"

package:
  name: jaxkd
  version: "${{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/j/jaxkd/jaxkd-${{ version }}.tar.gz
  sha256: 842e7837450feec39fa03bb6f5369fa4123ec526339dc359bfba7157884b77ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - jax

tests:
  - python:
      imports:
        - jaxkd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Minimal JAX implementation of k-nearest neighbors using a k-d tree.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/jaxkd/
  repository: https://github.com/dodgebc/jaxkd

extra:
  recipe-maintainers:
    - beckermr
