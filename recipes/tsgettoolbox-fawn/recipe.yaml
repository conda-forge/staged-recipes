context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-fawn
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-fawn/tsgettoolbox_fawn-${{ version }}.tar.gz
  sha256: f2aabccfd36b5a2b5a51995b6f0eb5f8c1477d2139c65485cca1135e2c8e8ff9

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - aiodns >3.6.0
  - async_retriever
  - python-dateutil
  - pandas
  - pydantic >=2
  - tsgettoolbox >=27.0.0

tests:
  - python:
    imports:
      - tsgettoolbox_fawn
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: Plugin for tsgettoolbox to retrieve data from the FAWN (Florida Automates Weather Network) REST API.
  description: |
    The 'tsgettoolbox_fawn' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    Florida Automated Weather Network (FAWN).
  homepage: https://pypi.org/project/tsgettoolbox_fawn/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
