context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-fawn
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-fawn/tsgettoolbox_fawn-${{ version }}.tar.gz
  sha256: f2aabccfd36b5a2b5a51995b6f0eb5f8c1477d2139c65485cca1135e2c8e8ff9

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools>=80
  - pip
  run:
  - python >=3.10
  - aiodns >3.6.0
  - async_retriever
  - python-dateutil
  - pandas
  - pydantic >=2
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_fawn
    pip_check: true

about:
  summary: Plugin for tsgettoolbox to retrieve data from the FAWN (Florida Automates Weather Network) REST API.
  description: |
    .. image:: https://img.shields.io/coveralls/github/timcera/tsgettoolbox_fawn
        :alt: Test Coverage
        :target: https://coveralls.io/r/timcera/tsgettoolbox_fawn?branch=master
        :height: 20

    .. image:: https://img.shields.io/pypi/v/tsgettoolbox_fawn
        :alt: Latest release
        :target: https://pypi.python.org/pypi/tsgettoolbox_fawn/
        :height: 20

    .. image:: https://img.shields.io/pypi/l/tsgettoolbox_fawn
        :alt: BSD-3 clause license
        :target: https://pypi.python.org/pypi/tsgettoolbox_fawn/
        :height: 20

    .. image:: https://img.shields.io/pypi/pyversions/tsgettoolbox_fawn
