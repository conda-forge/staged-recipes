context:
  version: "0.1.0"

package:
  name: libasdf
  version: ${{ version }}

source:
  url: https://github.com/asdf-format/libasdf/releases/download/${{ version }}/libasdf-${{ version }}.tar.gz
  sha256: efe0ad1938ee84502fea821afebe3e57e7abe9d19232c725229a93bd439cb498

build:
  number: 0
  skip: win
  script:
    # libasdf has a test that checks that no unintended symbols are visible
    # from the final shared object. Unfortunately conda's older glibc leaks
    # _init and _fini with default visibility, causing that test to fail.
    # Instructing the linker to make those symbols local-only has no apparent
    # downside, so apply this workaround until the upstream test can be fixed
    # to make this exception.
    - if: linux
      then:
      - |
        cat > linker-syms.map <<'EOF'
        {
          local:
            _init;
            _fini;
        };
        EOF
      - export LDFLAGS="${LDFLAGS} -Wl,--version-script=${SRC_DIR}/linker-syms.map"
    - ./configure --prefix="${PREFIX}" --disable-docs
    - make -j${CPU_COUNT}
    - |
      if [[ "${CONDA_BUILD_CROSS_COMPILATION:-}" != "1" || "${CROSSCOMPILING_EMULATOR:-}" != "" ]]; then
          make check || (cat tests/test-suite.log && exit 1)
      fi
    - make install

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - pkg-config
  host:
    - bzip2
    - libfyaml
    - libmd
    - lz4-c
    - zlib
    - libstatgrab
    - if: osx
      then: argp-standalone
  run_exports:
    - ${{ pin_subpackage('libasdf', upper_bound='x.x') }}

tests:
  - package_contents:
      bin:
        - asdf
      lib:
        - asdf
      include:
        - asdf.h
        - asdf/config.h
        - asdf/version.h
  - script: asdf --help

about:
  homepage: https://github.com/asdf-format/libasdf
  summary: "C implementation of ASDF"
  description: |
    libasdf is largely a wrapper around libfyaml but with an understanding of
    the structure of ASDF files, with the capability to read and write binary
    block data, as well as typed getters for metadata in the ASDF tree.
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - third_party/STC/LICENSE
  documentation: https://libasdf.readthedocs.io/
  repository: https://github.com/asdf-format/libasdf/

extra:
  recipe-maintainers:
    - embray
    - jhunkeler
