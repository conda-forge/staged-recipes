context:
  version: "0.4.7"

package:
  name: praat-parselmouth
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/praat-parselmouth/praat_parselmouth-${{ version }}.tar.gz
  sha256: 6dd81d246ce1eef5fd93d8cbdaf1bef61ca40ef1d2fc12aa23996a28071181e6

build:
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.18,<4
    - ninja
  host:
    - python
    - pip
    - setuptools >=42
    - wheel
    - scikit-build >=0.12
  run:
    - python
    - numpy >=1.7.0

tests:
  - python:
      imports:
        - parselmouth
      pip_check: true

about:
  homepage: https://github.com/YannickJadoul/Parselmouth
  summary: Praat in Python, the Pythonic way
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - IvoLeist
