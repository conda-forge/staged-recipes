schema_version: 1

context:
  python_min: "3.11"
  version: "0.1.4"

package:
  name: bax_algorithms
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bax_algorithms/bax_algorithms-${{ version }}.tar.gz
  sha256: 7dfa429eb1a65f619454f465bff9cddc253acf8a8a9bb0883bfc23e0f2e254f4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=75.0
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - botorch >=0.8.5
    - gpytorch >=1.10
    - pydantic >=1.10.9
    - scipy >=1.10.1
    - xopt >=3.1.2
    - jupyterlab >=3

tests:
  - python:
      imports:
        - bax_algorithms
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Collection of algorithms that can be used in Bayesian Algorithm Execution (BAX) Xopt generators.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/xopt-org/bax_algorithms

extra:
  recipe-maintainers:
    - dylanmkennedy
