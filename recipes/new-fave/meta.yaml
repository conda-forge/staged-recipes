{% set name = "new-fave" %}
{% set version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/new_fave-{{ version }}.tar.gz
  sha256: 42b12360f95ea8a38ef8acb2ee074c7637f5083248d9445a1a77e58898982017

build:
  entry_points:
    - fave-extract = new_fave.extract:fave_extract
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10,<3.14
    - uv-build >=0.10.0,<0.11.0
    - pip
  run:
    - python >=3.10,<3.14
    - aligned-textgrid >=0.8.1
    - click >=8.3.1
    - cloudpickle >=3.1.2
    - cloup >=3.0.8
    - fastexcel >=0.19.0
    - fasttrackpy >=0.6.1
    - fave-measurement-point >=0.1.5
    - fave-recode >=0.3.3
    - librosa >=0.11.0
    - numpy <=2.2
    - polars >=1.38.0
    - python-magic >=0.4.27  # [not win]
    - python-magic-bin >=0.4.14  # [win]
    - scipy >=1.15.3
    - toml >=0.10.2
    - tqdm >=4.67.3

test:
  imports:
    - new_fave
  commands:
    - pip check
    - fave-extract --help
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/new-fave/
  summary: New Vowel Extraction Suite
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - IvoLeist
