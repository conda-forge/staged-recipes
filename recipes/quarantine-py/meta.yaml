{% set python_min = "3.10" %}
{% set version = "1.0.0" %}

package:
  name: quarantine-py
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/q/quarantine-py/quarantine_py-{{ version }}.tar.gz
  sha256: 644aa6791f7666851b9345829af6efea66cc38702ffb12efb5dfe3252355d38e

build:
  entry_points:
    - quarantine = quarantine.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - hatchling >=1.24
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - quarantine
  commands:
    - pip check
    - quarantine --help
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://quarantine-py.aritro.cloud
  summary: When one bad item crashes your loop of 10,000 - don't crash. Set it aside, keep going, fix it later.
  doc_url: https://quarantine-py.aritro.cloud
  dev_url: https://github.com/halcyon-past/quarantine
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - halcyon-past
