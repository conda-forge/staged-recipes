schema_version: 1

context:
  version: "1.1.0"

package:
  # Upstream is `cem` on PyPI, but conda-forge `cem` is the unrelated CSDMS
  # Coastline Evolution Model, so this takes a distinct name. The import name
  # is still `cem`.
  name: cem-matching
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cem/cem-${{ version }}.tar.gz
  sha256: 6c3fc73fe7b4d079a088fa465813db65a04aabc4342190050a317e37303bde5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }},<3.13
    - pandas >=2.1.0,<3.0.0
    - numpy >=1.26.0,<2.0.0

tests:
  - python:
      # cem ships no __init__.py, so `import cem` alone resolves to an empty
      # namespace package and would pass even on a broken build.
      imports:
        - cem.coarsen
        - cem.imbalance
        - cem.match
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/lewisbails/cem
  repository: https://github.com/lewisbails/cem
  license: MIT
  license_file: LICENSE
  summary: Coarsened Exact Matching for Causal Inference
  description: |
    cem implements Coarsened Exact Matching, a monotonic imbalance bounding
    matching method for causal inference on observational data. Continuous
    covariates are coarsened into bins, units are matched exactly on the
    coarsened strata, and weights are returned for the matched sample.
    Imbalance is measured with the multivariate L1 distance so the effect of
    a coarsening choice can be checked directly.

extra:
  recipe-maintainers:
    - killua156
