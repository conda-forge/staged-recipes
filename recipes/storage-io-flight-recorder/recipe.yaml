schema_version: 1
package:
  name: storage-io-flight-recorder
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Storage-IO-Flight-Recorder/language-sdks-v1.0.0/storage-io-flight-recorder-sdk-source-1.0.0.zip
  sha256: 84a69e8083c335b281989102bfaab546e8269acf7d769ccded48077039ea1a92
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - storage_io_flight_recorder
    pip_check: true
- script:
  - python -m pip check
  - python -c "from storage_io_flight_recorder import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Storage-IO-Flight-Recorder
  summary: Windows x64 Storage-IO-Flight-Recorder Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Storage-IO-Flight-Recorder-C-ffi/LICENSE
  - Storage-IO-Flight-Recorder-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
