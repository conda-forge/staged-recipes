schema_version: 1

context:
  version: "1.0.0"

package:
  name: gonnect
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gonnect/gonnect-${{ version }}.tar.gz
  sha256: d3cac26aa183719e3fe5837ea38e437f4ab314aaf4d725922f6a2a663ea1e328

build:
  # Pure Python, no compiled extensions and no entry points.
  noarch: python
  number: 0
  script:
    - python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    # PEP 639 license expressions (`license = "MIT"`) need setuptools 77+.
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    # PyTorch is packaged as `pytorch` on conda-forge, not `torch`.
    - pytorch >=2.0
    - numpy >=1.22
    - pandas >=1.5
    - scikit-learn >=1.0
    - goatools >=1.2

tests:
  - python:
      imports:
        - gonnect
        - gonnect.model
        - gonnect.train
        - gonnect.data_processing
        - gonnect.paths
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
    script:
      - pip check

about:
  homepage: https://github.com/DelftBioinformaticsLab/GONNECT
  license: MIT
  license_file: LICENSE
  summary: Biologically-informed autoencoders constrained by the Gene Ontology
  description: |
    GONNECT trains autoencoders whose encoder and decoder connectivity is
    constrained by the Gene Ontology hierarchy, for analysing gene expression
    data. It accompanies the publication "A critical evaluation of Gene Ontology
    priors in biologically-informed neural networks".
  documentation: https://github.com/DelftBioinformaticsLab/GONNECT#readme
  repository: https://github.com/DelftBioinformaticsLab/GONNECT

extra:
  recipe-maintainers:
    - timoverlaan
