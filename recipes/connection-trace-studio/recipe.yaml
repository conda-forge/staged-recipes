schema_version: 1
package:
  name: connection-trace-studio
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Connection-Trace-Studio/language-sdks-v1.0.0/connection-trace-studio-sdk-source-1.0.0.zip
  sha256: 98c30abe6934567ad05f9b41105fdb827ed49ad74fe97a6ae3b5dd82ff429b2b
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - connection_trace_studio
    pip_check: true
- script:
  - python -m pip check
  - python -c "from connection_trace_studio import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Connection-Trace-Studio
  summary: Windows x64 Connection-Trace-Studio Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Connection-Trace-Studio-C-ffi/LICENSE
  - Connection-Trace-Studio-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
