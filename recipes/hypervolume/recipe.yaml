schema_version: 1

context:
  version: "3.1.7"
  
package:
  name: r-hypervolume
  version: ${{ version }}

source:
  url: https://cran.r-project.org/src/contrib/hypervolume_${{ version }}.tar.gz
  sha256: 4c1340277abb7ec6977d87fb298af4b0be5678561664fd86dfb0c06d13f71fae

build:
  number: 0
  script: 
  - cp $PREFIX/lib/R/share/licenses/GPL-3 LICENSE
  - R CMD INSTALL --build .
  merge_build_and_host_envs: true
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  build:
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then: cross-r-base ${{ r_base }}
    - if: unix
      then: autoconf
    - if: unix
      then: ${{ compiler('c') }}
    - if: win
      then: ${{ compiler('m2w64_c') }}
    - if: unix
      then: ${{ compiler('cxx') }}
    - if: win
      then: ${{ compiler('m2w64_cxx') }}
    - if: win
      then: posix
  host:
    - r-mass
    - r-base
    - r-rcpp
    - r-rcpparmadillo
    - r-caret
    - r-data.table
    - r-doparallel
    - r-dplyr
    - r-e1071
    - r-fastcluster
    - r-foreach
    - r-geometry
    - r-ggplot2
    - r-hitandrun
    - r-ks
    - r-maps
    - r-mvtnorm
    - r-palmerpenguins
    - r-pbapply
    - r-pdist
    - r-progress
    - r-purrr
    - r-raster
    - r-sp
    - r-terra
  run:
    - r-mass
    - r-base
    - r-rcpp
    - r-caret
    - r-data.table
    - r-doparallel
    - r-dplyr
    - r-e1071
    - r-fastcluster
    - r-foreach
    - r-geometry
    - r-ggplot2
    - r-hitandrun
    - r-ks
    - r-maps
    - r-mvtnorm
    - r-palmerpenguins
    - r-pbapply
    - r-pdist
    - r-progress
    - r-purrr
    - r-raster
    - r-sp
    - r-terra

tests:
  - script:
      - if: not win
        then: Rscript -e "library('hypervolume')"
      - if: win
        then: "\"%R%\" -e \"library('hypervolume')\""

about:
  summary: "Estimates the shape and volume of high-dimensional datasets and performs set operations: intersection / overlap, union, unique components, inclusion test, and hole detection. Uses stochastic geometry approach to high-dimensional kernel density estimation, support vector machine delineation, and convex hull generation. Applications include modeling trait and niche hypervolumes and species distribution modeling."
  license: GPL-3.0-only
  license_file:
    - LICENSE
  homepage: https://github.com/bblonder/hypervolume

extra:
  recipe-maintainers:
    - conda-forge/r
