schema_version: 1

context:
  version: "4.20.0"

package:
  name: fg-data-profiling
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fg-data-profiling/fg_data_profiling-${{ version }}.tar.gz
  sha256: 2836994c6010408d30d1dc3cce082e65c4950e14aeb5fb3fad6544ff085734ad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - data_profiling = data_profiling.controller.console:main
      - pandas_profiling = data_profiling.controller.console:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=72.0.0,<81.0.0
    - setuptools-scm >=8.0.0,<9.0.0
    - wheel >=0.38.4,<1.0.0
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - scipy >=1.8,<1.19.0
    - pandas >1.5,<3.0,!=1.4.0
    - matplotlib-base >=3.5,<3.12
    - pydantic >=2,<3
    - pyyaml >=6.0.3,<6.1
    - jinja2 >=3.1.6,<3.2
    - visions >=0.7.5,<0.9
    - numpy >=1.22,<2.6
    - minify-html >=0.15.0
    - filetype >=1.0.0
    - phik >=0.12.5,<0.13
    - requests >=2.32.0,<3
    - tqdm >=4.66.3,<5
    - seaborn >=0.10.1,<0.14
    - multimethod >=1.4,<2
    - statsmodels >=0.13.2,<1
    - typeguard >=4,<5
    - imagehash ==4.3.2
    - wordcloud >=1.9.4
    - dacite >=1.9,<2
    - numba >=0.60,<0.68

tests:
  - python:
      imports:
        - data_profiling
        - ydata_profiling
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python
    script:
      - data_profiling --help
      - pandas_profiling --help

about:
  summary: Generate profile report for pandas DataFrame
  license: MIT
  license_file: LICENSE
  homepage: https://ydata.ai
  repository: https://github.com/data-centric-ai-community/fg-data-profiling

extra:
  recipe-maintainers:
    - HeavyTony2
