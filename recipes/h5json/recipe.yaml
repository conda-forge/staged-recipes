schema_version: 1

context:
  version: "2.0.0"

package:
  name: h5json
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/h5json/h5json-${{ version }}.tar.gz
  sha256: f859aabdd51a0c5a8fc8fa1d40821e24d1431c6161f6ed36bcaef4831869b1bd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - h5tojson = h5json.apps.h5tojson:main
      - jsontoh5 = h5json.apps.jsontoh5:main
      - h5jvalidate = h5json.apps.validator:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
  run:
    - python >=${{ python_min }}
    - h5py >=3.10
    - numpy >=2.0
    - jsonschema >=4.4.0
    - pytz

tests:
  - python:
      imports:
        - h5json
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - h5tojson --help
      - jsontoh5 --help
      - h5jvalidate --help

about:
  summary: HDF5/JSON Tools
  license: LicenseRef-HDF5
  license_file: COPYING
  homepage: https://support.hdfgroup.org/documentation/hdf5-json/latest/
  repository: https://github.com/HDFGroup/hdf5-json
  documentation: https://support.hdfgroup.org/documentation/hdf5-json/latest/

extra:
  recipe-maintainers:
    - ocefpaf
