schema_version: 1

context:
  version: "0.19.0"
  python_min: "3.11"

package:
  name: hermes-agent
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hermes-agent/hermes_agent-${{ version }}.tar.gz
  sha256: ac986bede64a2785436676c0ea084ec586574f8cb00a9d047e095b435d3e21c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - hermes = hermes_cli.main:main
      - hermes-agent = run_agent:main
      - hermes-acp = acp_adapter.entry:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0,<83
    - pip
  run:
    - python >=${{ python_min }}
    - openai ==2.24.0
    - certifi ==2026.5.20
    - python-dotenv ==1.2.2
    - fire ==0.7.1
    - httpx ==0.28.1
    - rich ==14.3.3
    - tenacity ==9.1.4
    - pyyaml ==6.0.3
    - ruamel.yaml ==0.18.17
    - requests ==2.33.0
    - jinja2 ==3.1.6
    - pydantic ==2.13.4
    - prompt_toolkit ==3.0.52
    - croniter ==6.0.0
    - packaging ==26.0
    - markdown ==3.10.2
    - pyjwt ==2.13.0
    - urllib3 >=2.7.0,<3
    - cryptography ==46.0.7
    - psutil ==7.2.2
    - websockets ==15.0.1
    - pathspec ==1.1.1
    - fastapi >=0.104.0,<1
    - uvicorn >=0.24.0,<1
    - pillow ==12.2.0
    - python-multipart >=0.0.9,<1
    - if: not win
      then:
        - ptyprocess >=0.7.0,<1
    - if: win
      then: 
        - pywinpty >=2.0.0,<3
        - python-tzdata ==2025.3
        - concurrent-log-handler ==0.9.29

tests:
  - python:
      imports:
        - acp_adapter
        - agent
        - batch_runner
        - cli
        - cron
        - gateway
        - hermes_bootstrap
        - hermes_cli
        - hermes_constants
        - hermes_logging
        - hermes_state
        - hermes_time
        - mcp_serve
        - model_tools
        - plugins
        - providers
        - run_agent
        - tools
        - toolset_distributions
        - toolsets
        - trajectory_compressor
        - tui_gateway
        - utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

  - script:
      - hermes --help
      - hermes-agent --help
      - hermes-acp --help

about:
  homepage: https://hermes-agent.nousresearch.com
  documentation: https://hermes-agent.nousresearch.com/docs
  repository: https://github.com/NousResearch/hermes-agent
  license: MIT
  license_file:
    - LICENSE
    - skills/productivity/powerpoint/LICENSE.txt
    - skills/creative/humanizer/LICENSE
  summary: The agent that grows with you
  description: |
    **The self-improving AI agent built by [Nous Research](https://nousresearch.com).**
    It's the only agent with a built-in learning loop — it creates skills from experience,
    improves them during use, nudges itself to persist knowledge, searches its own past conversations, and builds a deepening model of who you are across sessions.
    Run it on a $5 VPS, a GPU cluster, or serverless infrastructure that costs nearly nothing when idle.
    It's not tied to your laptop — talk to it from Telegram while it works on a cloud VM.

    Use any model you want —
    [Nous Portal](https://portal.nousresearch.com), OpenRouter, OpenAI, your own endpoint, and [many others](https://hermes-agent.nousresearch.com/docs/integrations/providers).
    Switch with `hermes model` — no code changes, no lock-in.

extra:
  recipe-maintainers:
    - eunos-1128
