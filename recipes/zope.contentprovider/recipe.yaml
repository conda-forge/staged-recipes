schema_version: 1

context:
  version: "7.1"

package:
  name: zope.contentprovider
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.contentprovider/zope_contentprovider-${{ version }}.tar.gz
  sha256: 79087fdb8b0250dceac82ea8a056ba716be8d9b88751c8f68807c0f882e9b9cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - zope.component
    - zope.event
    - zope.interface >=3.8
    - zope.location
    - zope.publisher
    - zope.schema
    - zope.tales

tests:
  - python:
      imports:
        - zope.contentprovider
        - zope.contentprovider.interfaces
        - zope.contentprovider.provider
        - zope.contentprovider.tales
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest discover -v zope.contentprovider

about:
  homepage: https://github.com/zopefoundation/zope.contentprovider
  repository: https://github.com/zopefoundation/zope.contentprovider
  documentation: https://zopecontentprovider.readthedocs.io
  summary: Content Provider Framework for Zope Templates
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
