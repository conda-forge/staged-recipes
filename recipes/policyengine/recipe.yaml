context:
  version: "6.20.2"
  python_min: "3.11"

package:
  name: policyengine
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/policyengine/policyengine-${{ version }}.tar.gz
  sha256: 3692a377ce5c9cf45b54df23a8907e1276567e84de7d83ac4c0713416d63604e
  patches:
    - patches/0001-relax-microdf-python-pin.patch

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - setuptools-scm
    - wheel
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - pydantic >=2.10
    - pandas >=2.0
    - h5py >=3
    - microdf-python >=1.3.0
    - jsonschema >=4
    - requests >=2.31
    - psutil >=5.9
    - packaging >=23

tests:
  - python:
      imports:
        - policyengine
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/PolicyEngine/policyengine.py
  summary: Python package for running PolicyEngine tax-benefit simulations
  license: AGPL-3.0-only
  license_file: LICENSE
  repository: https://github.com/PolicyEngine/policyengine.py

extra:
  recipe-maintainers:
    - MementoRC
