schema_version: 1

context:
  version: "1.6.1"

package:
  name: x2s3
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/x/x2s3/x2s3-${{ version }}.tar.gz
  sha256: e3d3f785c888f9a4c1fc3c8eebc8b716e8242c57192738154bc8108fa8730e6a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.12
    - pip
  run:
    - python >=3.12
    - aiobotocore >=2.22
    - boto3 >=1.37
    - botocore >=1.37
    - fastapi >=0.115
    - loguru >=0.7
    - pydantic >=2.11
    - pydantic-settings >=2.9
    - pydantic-settings-yaml >=0.2.0
    - python-dateutil >=2.9
    - starlette >=0.46
    - uvicorn >=0.34
    - if: not win
      then: uvloop >=0.21
    - jinja2 >=3.1

tests:
  - python:
      imports:
        - x2s3
      pip_check: true

about:
  summary: RESTful web service which makes any storage system X available as an S3-compatible REST API
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/JaneliaSciComp/x2s3

extra:
  recipe-maintainers:
    - imagejan
