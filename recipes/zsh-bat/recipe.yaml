context:
  # Upstream publishes no tags or releases; pin the latest commit. A dev version
  # sorts below every future upstream release.
  version: "0.0.0.dev20241112"
  commit: 467337613c1c220c0d01d69b19d2892935f43e9f
  plugin_dir: share/zsh/plugins/zsh-bat

package:
  name: zsh-bat
  version: ${{ version }}

source:
  url: https://github.com/fdellwing/zsh-bat/archive/${{ commit }}.tar.gz
  sha256: bbc6feb06254c84bae7560232a96626b63041b5222a55ee271d36bd9299f6c24

build:
  number: 0
  skip: win
  script: |
    install -d "${PREFIX}/${{ plugin_dir }}"
    install -m 644 zsh-bat.plugin.zsh "${PREFIX}/${{ plugin_dir }}/"

requirements:
  run:
    - zsh
    - bat

tests:
  - package_contents:
      files:
        - ${{ plugin_dir }}/zsh-bat.plugin.zsh
  - script: |
      zsh -f -c 'source "${PREFIX}/${{ plugin_dir }}/zsh-bat.plugin.zsh"; [[ "$(alias cat)" == *bat* ]]'

about:
  homepage: https://github.com/fdellwing/zsh-bat
  summary: Zsh plugin that aliases cat to bat
  description: |
    Aliases cat to bat, keeps the original cat available as rcat, and routes
    man pages through bat.

    Activate it by adding this to your .zshrc:

      source "${CONDA_PREFIX}/share/zsh/plugins/zsh-bat/zsh-bat.plugin.zsh"
  license: MIT
  license_file: LICENSE
  repository: https://github.com/fdellwing/zsh-bat

extra:
  recipe-maintainers:
    - ManuelLerchner
