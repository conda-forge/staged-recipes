schema_version: 1

context:
  name: binmod1d
  version: "1.0.10"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
    sha256: 7985da9a98a60121e14f89afebcb0eadd4641eb68ceb91fd44ae8742e02f52dd
  - url: https://raw.githubusercontent.com/NOAA-National-Severe-Storms-Laboratory/BinMod1D/main/LICENSE
    sha256: 92ce9e384e0109a0e525ecbd4079149e9a094405997bfbb2ba0d1fe7b2adfb57
    file_name: LICENSE

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2.0.0
    - mpmath >=1.3.0
    - scipy >=1.15.0
    - numba >=0.61.0
    - matplotlib-base >=3.9.0
    - netcdf4 >=1.7.0
    - tqdm >=4.66.0
    - cloudpickle >=3.0.0

tests:
  - python:
      imports:
        - binmod1d
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A 1D Column bin microphysics model that performs collision-coalescence and breakup.
  license: CC-BY-NC-SA-4.0
  license_file: LICENSE
  homepage: https://github.com/NOAA-National-Severe-Storms-Laboratory/BinMod1D

extra:
  recipe-maintainers:
    - EdwinDunnavan
