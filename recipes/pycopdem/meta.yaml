{% set name = "pycopdem" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pycopdem/pycopdem-{{ version }}.tar.gz
  sha256: b850492c5a7666c3eb2a8c46a4a2f0e315c0d8e728b76babee8bcf22d2f1dbe0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >={{ python_min }}
    - troi-core
    - attrs
    - typing_extensions
    - numpy
    - xarray
    - zarr
    - rasterio
    - affine
    - pysheds

test:
  imports:
    - pycopdem
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/thestochasticman/pycopdem
  summary: Machine-wide Copernicus 30 m DEM store with on-read terrain derivatives
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thestochasticman
    - johnburley3000
