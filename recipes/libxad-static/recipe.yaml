context:
  version: "2.1.0"

package:
  name: libxad-static
  version: ${{ version }}

source:
  url: https://github.com/auto-differentiation/xad/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 110729586b1a097c9e4a7ec34c48e60f3aec7ec61ef192a417ce0774cc32be43

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja

tests:
  - package_contents:
      include:
        - XAD/XAD.hpp
        - XAD/Config.hpp
      files:
        - if: unix
          then:
            - lib/libxad.a
            - lib/cmake/XAD/XADConfig.cmake
          else:
            - Library/lib/cmake/XAD/XADConfig.cmake
  - files:
      recipe:
        - test/
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
    script:
      - if: unix
        then:
          - cmake -S test -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PREFIX
          - cmake --build build
          - ./build/test_xad
        else:
          - cmake -S test -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%LIBRARY_PREFIX%
          - cmake --build build
          - build\test_xad.exe

about:
  homepage: https://auto-differentiation.github.io
  repository: https://github.com/auto-differentiation/xad
  documentation: https://auto-differentiation.github.io
  summary: Automatic differentiation in C++
  description: |
    XAD is a C++ library for automatic differentiation using operator overloading.
    It provides forward and adjoint (reverse) modes of any order, vector modes,
    checkpointing and an external function interface, and works with Eigen.
    Upstream builds a static library only, so this package ships it under the -static name (CFEP-18).
  license: AGPL-3.0-or-later
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - auto-differentiation-dev
