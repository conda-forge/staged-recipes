context:
  version: 27.0.1
  build_number: '0'

package:
  name: tsgettoolbox-cdec
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-cdec/tsgettoolbox_cdec-${{ version }}.tar.gz
  sha256: d624a5d43907bb7da672ed5b50011690169dbddb26942d75206557f6d7406d52

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools>=80
  - pip
  run:
  - python >=3.10
  - cltoolbox >=4.0.4
  - dateparser
  - numpy
  - openpyxl
  - pandas [excel]
  - pint
  - pint-pandas
  - pydantic >=2
  - scipy
  - tabulate
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_cdec
    pip_check: true

