context:
  version: 27.0.1

package:
  name: tsgettoolbox-cdec
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-cdec/tsgettoolbox_cdec-${{ version }}.tar.gz
  sha256: d624a5d43907bb7da672ed5b50011690169dbddb26942d75206557f6d7406d52

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - cltoolbox >=4.0.4
  - dateparser
  - numpy
  - openpyxl
  - pandas
  - pint
  - pint-pandas
  - pydantic >=2
  - scipy
  - tabulate
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_cdec
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: Will get time series from different sources on the internet
  description: |
    The 'tsgettoolbox_cdec' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from
    the California Data Exchange Center (CDEC).
  homepage: https://pypi.org/project/tsgettoolbox-cdec/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
