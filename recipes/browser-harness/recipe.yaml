context:
  version: "0.1.13"
  python_min: "3.11"

package:
  name: browser-harness
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/browser-harness/browser_harness-${{ version }}.tar.gz
  sha256: 284dc547a042c309feafd9a9f4a74b2a8651b7963ea3ac6cb2f2d64889f6a8f3

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - browser-harness = browser_harness.run:main
      - browser-harness-mcp = browser_harness.mcp_cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ==84.0.0
  run:
    - python >=${{ python_min }}
    - cdp-use ==1.4.5
    - fetch-use ==0.4.0
    - pillow ==12.3.0
    - websockets ==15.0.1

tests:
  - python:
      imports:
        - browser_harness
      pip_check: true
      python_version: ${{ python_min }}.*

  - script: python run_test.py
    files:
      recipe:
        - run_test.py

about:
  homepage: https://github.com/browser-use/browser-harness
  summary: Browser control harness for AI agents
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - eunos-1128
