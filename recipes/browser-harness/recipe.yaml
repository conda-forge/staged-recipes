context:
  version: "0.1.13"

package:
  name: browser-harness
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/browser-harness/browser_harness-${{ version }}.tar.gz
  sha256: 284dc547a042c309feafd9a9f4a74b2a8651b7963ea3ac6cb2f2d64889f6a8f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - browser-harness = browser_harness.run:main
      - browser-harness-mcp = browser_harness.mcp_cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ==84.0.0
  run:
    - python >=${{ python_min }}
    - cdp-use ==1.4.5
    - fetch-use ==0.4.0
    - pillow ==12.3.0
    - websockets ==15.0.1

tests:
  - python:
      imports:
        - browser_harness
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

  - script: python run_test.py
    files:
      recipe:
        - run_test.py
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://browser-use.com/browser-harness
  repository: https://github.com/browser-use/browser-harness
  documentation: https://github.com/browser-use/browser-harness/blob/v${{ version }}/README.md
  license: MIT
  license_file: LICENSE
  summary: Browser control harness for AI agents
  description: |
    Browser Harness lets Claude Code, Codex or Cursor use your real Chrome browser: open pages, click, type, read and download, logged in as you. 
    Paste one prompt into your coding agent to set it up. 
    It talks to Chrome over the DevTools Protocol (CDP), and the agent writes any missing helper as it works, so the harness gets better with each task. Open source, MIT licensed.

    Try browser-harness in [Browser Use Cloud](https://cloud.browser-use.com/v4?utm_campaign=browser-harness-use-in-cloud&utm_source=github) or paste the setup prompt into your coding agent.

extra:
  recipe-maintainers:
    - eunos-1128
