context:
  version: "0.8.5"

package:
  name: clevercsv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/clevercsv/clevercsv-${{ version }}.tar.gz
  sha256: d35479001c6ad797b98d88a2ebf8e5dd41a82380ea678f36b71c601a3a7d91e5

build:
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=74.1.0
  run:
    - python
    - chardet >=3.0
    - regex >=2018.11
    - packaging >=23.0

tests:
  - python:
      imports:
        - clevercsv
      pip_check: true

about:
  homepage: https://github.com/alan-turing-institute/CleverCSV/
  summary: A Python package for handling messy CSV files
  description: |
    CleverCSV is a Python package for handling messy, non-standard CSV
    files. It provides a drop-in replacement for the standard library's
    csv module with more robust dialect detection, plus a command-line
    tool for exploring and standardizing such files.
  license: MIT
  license_file: LICENSE
  documentation: https://clevercsv.readthedocs.io/en/latest/
  repository: https://github.com/alan-turing-institute/CleverCSV/

extra:
  recipe-maintainers:
    - gwaybio
