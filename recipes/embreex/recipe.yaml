schema_version: 1

context:
  version: "4.4.0"

package:
  name: embreex
  version: ${{ version }}

source:
  url: https://github.com/trimesh/embreex/archive/refs/tags/${{ version }}.tar.gz
  sha256: 8434e8ce31cb9e6dc878efd2e9776e4bce146132d3c300e8762969ed0d2be25b

build:
  number: 0
  script: python -m pip install --no-deps --no-build-isolation -vv .

requirements:
  build:
    - {{ compiler('c') }}
    - cython
  host:
    - python ${{ python_min }}.*
    - pip
    - embree
    - cython
    - numpy
  run:
    - python >=${{ python_min }}
    - embree
    - numpy

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - embreex
      pip_check: true

about:
  homepage: https://github.com/trimesh/embreex
  repository: https://github.com/trimesh/embreex
  license: BSD-2
  license_file: LICENSE
  summary: Fork of pyembree that supports newer versions of Python and embree
  description: |
    Fork of pyembree that supports newer versions of Python and embree
  documentation: https://github.com/trimesh/embreex

extra:
  recipe-maintainers:
    - langmm
