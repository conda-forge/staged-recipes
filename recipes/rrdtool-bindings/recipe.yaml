schema_version: 1

context:
  version: "0.5.0"

package:
  name: rrdtool-bindings
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/r/rrdtool-bindings/rrdtool_bindings-${{ version }}.tar.gz
  sha256: d889ae62a5bd2dae3a9c8ee3b1e80ec3a1a8d85a9b5fb84d7bd278093e00ff73

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
    - rrdtool
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rrdtool
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Modern Python packaging for RRDtool Python bindings to C extension.
  license: GPL-2.0-or-later
  license_file: PLEASE_ADD_LICENSE_FILE
  homepage: https://github.com/smsearcy/rrdtool-python-bindings
  repository: https://github.com/smsearcy/rrdtool-python-bindings

extra:
  recipe-maintainers:
    - akrherz
