schema_version: 1

context:
  name: google-cloud-datacatalog-lineage
  version: "0.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_datacatalog_lineage-${{ version }}.tar.gz
  sha256: 44dd89ba3a898869d895a216a40b21134ea3d96485e883f4f3ac7e76aa547ff8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.28.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - grpcio >=1.59.0,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - google.cloud.datacatalog_lineage
        - google.cloud.datacatalog_lineage_v1
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-datacatalog-lineage
  summary: Google Cloud Datacatalog Lineage API client library
  description: |
    Python client library for the Google Cloud Data Lineage API. Data lineage
    is a map that tracks the lifecycle of your data: where it comes from,
    where it travels, and the transformations applied along the way.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://cloud.google.com/python/docs/reference/lineage/latest
  repository: https://github.com/googleapis/google-cloud-python

extra:
  recipe-maintainers:
    - soapy1
