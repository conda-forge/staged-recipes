schema_version: 1

context:
  name: pyiron_workflow_assyst
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2f9e32135b91012ba9e5a308a565211a50a88c24b1a5a30e98462860dbac7e8d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }},<3.14
    - ase >=3.22.0
    - flowrep >=0.6,<0.7
    - numpy >=1.20.0
    - pandas >=1.3.0
    - pyiron_workflow >=0.19,<0.21
    - pyiron_workflow_vasp >=0.2.0,<0.3
    - pymatgen >=2023.0.0

tests:
  - python:
      imports:
        - pyiron_workflow_assyst
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A workflow package for ASSYST (Automated Symmetry and Stability Testing) using VASP calculations
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/ligerzero-ai/pyiron_workflow_assyst
  repository: https://github.com/ligerzero-ai/pyiron_workflow_assyst

extra:
  recipe-maintainers:
    - ligerzero-ai
