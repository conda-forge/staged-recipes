schema_version: 1

context:
  python_min: "3.11"
  version: "1.1.2"

package:
  name: pyradiosky
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyradiosky/pyradiosky-${{ version }}.tar.gz
  sha256: 912bca9c85e7c1a90c66bc1300c5eebf055e87fc9d28f78ec9c7342513ffd621

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - download_gleam = pyradiosky.cli:download_gleam
      - make_flat_spectrum_eor = pyradiosky.cli:make_flat_spectrum_eor

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - wheel
    - setuptools-scm >=8.1
    - pip
  run:
    - python >=${{ python_min }}
    - astropy-base >=6.0
    - h5py >=3.7
    - numpy >=1.23
    - pyuvdata >=3.2.3
    - scipy >=1.9
    - setuptools >=64
    - setuptools-scm >=8.1
  run_constraints:
    - astropy-healpix >=1.0.2
    - astroquery >=0.4.4

tests:
  - python:
      imports:
        - pyradiosky
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
        - git
        - astropy-healpix >=1.0.2
        - astroquery >=0.4.4
        - coverage
        - pre-commit
        - pytest
        - pytest-cov
    files:
      source:
        - tests/
    script:
      - download_gleam --help
      - make_flat_spectrum_eor --help
      - pytest -vv -s tests

about:
  summary: Python objects and interfaces for representing diffuse, extended and compact astrophysical radio sources
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/pyradiosky/
  documentation: https://pyradiosky.readthedocs.io/

extra:
  recipe-maintainers:
    - bhazelton
