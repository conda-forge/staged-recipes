context:
  version: "2026.9.26.post1"

package:
  name: manimgx-fonts
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/manimgx-fonts/manimgx_fonts-${{ version }}.tar.gz
  sha256: 6540366821c720b5cb7fc0631e1831d85040e823ebdf7c656e0ba750df17dab2

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - manimgx_fonts
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "import manimgx_fonts, pathlib; fonts = list(pathlib.Path(manimgx_fonts.__file__).parent.glob('*.ttf')); assert fonts, 'no fonts installed'"

about:
  homepage: https://manimgx.academa.ai/
  repository: https://github.com/academa-labs/manimgx
  documentation: https://manimgx.academa.ai/
  summary: The Noto fonts ManimGX sets text in
  description: |
    Noto Sans, Noto Emoji, Noto Sans Symbols, and Noto Sans for the scripts
    Latin faces lack, packaged as the fonts ManimGX sets text in.
  license: OFL-1.1
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
