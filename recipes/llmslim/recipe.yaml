schema_version: 1

context:
  name: llmslim
  version: "0.11.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/llmslim-${{ version }}.tar.gz
  sha256: 59ffe9a6802be5261446625decfa6cdb36a09b8a1f3d26da3d31a1b398fd9d1f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - llmslim = llmslim.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.21
    - scikit-learn >=1.0
    - jsonschema >=4.18

tests:
  - python:
      imports:
        - llmslim
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - llmslim --help

about:
  homepage: https://www.llmslim.app
  summary: "Context compression and planning for RAG and AI agents: fit retrieved documents, chat history and tool output into a token budget."
  license: MIT
  license_file: LICENSE
  repository: https://github.com/Thanatos9404/llmslim
  documentation: https://www.llmslim.app

extra:
  recipe-maintainers:
    - Thanatos9404
