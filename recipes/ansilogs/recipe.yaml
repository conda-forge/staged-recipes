context:
  version: "1.1.0"

package:
  name: ansilogs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ansilogs/ansilogs-${{ version }}.tar.gz
  sha256: 15f0e3581f9e14d0ddadd3795408878ef6d9023966607abadfa718f24baff882

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ansilogs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/doronz88/ansilogs
  summary: Colorful ANSI logging helpers
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
