schema_version: 1

context:
  version: "0.4.6"

package:
  name: modelscope-hub
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/modelscope-hub/modelscope_hub-${{ version }}.tar.gz
  sha256: c54de09be2ccb27b9214f7c3ebe5751121f335f5016643f789589d0547e78c52

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - modelscope = modelscope_hub.cli.main:run_cmd
      - ms = modelscope_hub.cli.main:run_cmd
      - modelscope-hub = modelscope_hub.cli.main:run_cmd
      - ms-hub = modelscope_hub.cli.main:run_cmd

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68.0
    - pip
  run:
    - python >=${{ python_min }}
    - requests >=2.28
    - tqdm >=4.64.0
    - filelock >=3.9
    - urllib3 >=1.26
    - cryptography >=41

tests:
  - python:
      imports:
        - modelscope_hub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - modelscope --help
      - ms --help
      - modelscope-hub --help
      - ms-hub --help

about:
  summary: The official Python client to connect with ModelScope Hub.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/modelscope-hub/
  repository: https://github.com/modelscope/modelscope_hub

extra:
  recipe-maintainers:
    - shermansiu
