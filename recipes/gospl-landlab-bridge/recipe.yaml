context:
  name: gospl-landlab-bridge
  version: "0.0.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gospl_landlab_bridge-${{ version }}.tar.gz
  sha256: 853a7b6b4880eff56d54c1cb666c2bb950e36785c7c8e65bea84868c74798bd9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - landlab >=2.6
    - joblib
    - imageio >=2.31
    - imageio-ffmpeg
    - h5py
    - pandas
    - matplotlib-base
    - tqdm
    - pyyaml
    - threadpoolctl
    - pillow

tests:
  - python:
      imports:
        - gospl_landlab_bridge
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: "Add-on bridge: run Landlab landscape-evolution components inside goSPL timesteps"
  description: |
    Runs Landlab landscape-evolution components inside goSPL timesteps.
    goSPL itself (with mpi4py and petsc4py) is needed to run coupled models
    and is not installed by this package.
  license: AGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/GeoLarryLai/goSPL-LandLab-Bridge
  repository: https://github.com/GeoLarryLai/goSPL-LandLab-Bridge

extra:
  recipe-maintainers:
    - GeoLarryLai
