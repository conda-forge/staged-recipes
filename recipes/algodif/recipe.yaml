context:
  version: "1.0.0"

package:
  name: algodif
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/algodif/algodif-${{ version }}.tar.gz
  sha256: a223a25a8761bf8ff1e8ea0903810ca27facdbfe23a6ad2dba14051532aed917

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - h5py
    - pillow
    - matplotlib-base
    - joblib
    - xraydb

tests:
  - python:
      imports:
        - algodif
        - algodif.io.loadersaver
        - algodif.prep.preprocessing
        - algodif.proc.processing
        - algodif.post.postprocessing
        - algodif.util.utility
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  homepage: https://github.com/algodif/algodif
  license: Apache-2.0
  license_file: LICENSE
  summary: Data processing algorithms for diffraction-based X-ray techniques
  description: |
    Methods and software for calibrating multi-element
    energy-dispersive X-ray (EDX) detectors and processing
    energy-dispersive X-ray diffraction tomography data.
  documentation: https://algodif.readthedocs.io
  repository: https://github.com/algodif/algodif

extra:
  recipe-maintainers:
    - nghia-vo
