schema_version: 1

context:
  name: langchain-comment-scraper
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_comment_scraper-${{ version }}.tar.gz
  sha256: 1422c35149cd0abb4b3bc9b2356118cb109e8a5b24128a6b9060dfa046e57a1f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - langchain-core >=0.3.0,<2.0.0

tests:
  - python:
      imports:
        - langchain_comment_scraper
      pip_check: true
      python_version: ${{ python_min }}.*
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - pytest-socket
    script:
      # 0.1.0's home-directory test only sets HOME, which Windows ignores for "~";
      # fixed upstream in supertj/langchain-comment-scraper#1, drop this skip on the next release.
      - if: win
        then: pytest tests -v -k "not test_home_directory_in_the_path_is_expanded"
        else: pytest tests -v

about:
  summary: LangChain document loader for Reddit and Hacker News threads exported with Comment Scraper
  description: |
    Loads the JSON files that the Comment Scraper browser extension exports from
    Reddit and Hacker News threads into LangChain Documents: one for the post and
    one per comment, with score, depth and the comment it replies to kept as
    metadata. Reads local files only and makes no network requests.
  license: MIT
  license_file: LICENSE
  homepage: https://comment-scraper.com/langchain
  repository: https://github.com/supertj/langchain-comment-scraper

extra:
  recipe-maintainers:
    - supertj
