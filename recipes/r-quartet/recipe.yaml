schema_version: 1

context:
  version: "1.4.0"

package:
  name: r-quartet
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/Quartet_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/Quartet/Quartet_${{ version }}.tar.gz
  sha256: c6aa5e8e5f852f558c8cfe567724720c86d2b12b11b68ce1eef64d5cd74fb50c

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/
    missing_dso_allowlist:
      - if: win
        then:
          - "*/R.dll"
          - "*/Rblas.dll"
          - "*/Rlapack.dll"

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - cross-r-base ${{ r_base }}.*
    - if: not win
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - make
    - if: win
      then:
        - ${{ compiler('m2w64_c') }}
        - ${{ stdlib('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
        - m2-filesystem
        - m2-make
        - m2-sed
        - m2-coreutils
        - m2-zip
  host:
    - r-base
    - if: linux
      then:
        - libgomp
    - if: osx
      then:
        - llvm-openmp
    - r-ape
    - r-plottools
    - r-rcpp
    - r-rdpack >=0.7
    - r-ternary >=1.0
    - r-treetools >=1.4.0
  run:
    - r-base
    - r-ape
    - r-plottools
    - r-rcpp
    - r-rdpack >=0.7
    - r-ternary >=1.0
    - r-treetools >=1.4.0

tests:
  - r:
      libraries:
        - Quartet

about:
  homepage: https://ms609.github.io/Quartet/
  repository: https://github.com/ms609/Quartet/
  documentation: https://ms609.github.io/Quartet/
  license: GPL-2.0-or-later
  license_family: GPL2
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-2
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: "Comparison of Phylogenetic Trees Using Quartet and Split Measures"
  description: |
    Calculates the number of four-taxon subtrees consistent with a pair of
    cladograms, calculating the symmetric quartet distance of Bandelt & Dress
    (1986), Reconstructing the shape of a tree from observed dissimilarity
    data, Advances in Applied Mathematics <doi:10.1016/0196-8858(86)90038-2>,
    using the tqDist algorithm of Sand et al. (2014), tqDist: a library for
    computing the quartet and triplet distances between binary or general
    trees, Bioinformatics <doi:10.1093/bioinformatics/btu157> for pairs of
    binary trees; calculating the rooted triplet distance using the CPDT
    algorithm of Jansson & Rajaby (2017), A more practical algorithm for the
    rooted triplet distance, Journal of Computational Biology
    <doi:10.1089/cmb.2016.0185>.

extra:
  recipe-maintainers:
    - conda-forge/r
    - ms609
