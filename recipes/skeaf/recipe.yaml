schema_version: 1

context:
  version: "1.3.0"
  commit: "a8668df7ef46a2451a4493bda3b5e5415967eabc"

package:
  name: skeaf
  version: ${{ version }}

source:
  url: https://github.com/qiaojunfeng/skeaf/archive/${{ commit }}.tar.gz
  sha256: 369e7e4180e34ffc68b2265911975602ad56abf0db1506e4f882969effce195c

build:
  number: 0
  skip: win
  script:
    - $FC $FFLAGS -std=legacy -o skeaf src/skeaf_v1p3p0_r149.F90
    - $FC $FFLAGS -std=legacy -o ELK_exciting_BXSFconverter src/ELK_exciting_BXSFconverter_v04.F90
    - $FC $FFLAGS -std=legacy -o memoryestimateskeaf src/memoryestimateskeaf_for_v1p3p0_r149.F90
    - $FC $FFLAGS -std=legacy -o simbxsf_barrel src/simbxsf_barrel_v02.F90
    - $FC $FFLAGS -std=legacy -o simbxsf_cylinder src/simbxsf_cylinder_v02.F90
    - $FC $FFLAGS -std=legacy -o simbxsf_sphere src/simbxsf_sphere_v02.F90
    - $FC $FFLAGS -std=legacy -o simbxsf_spheroid src/simbxsf_spheroid_v03.F90
    - mkdir -p "${PREFIX}/bin"
    - install -m 755 skeaf "${PREFIX}/bin/skeaf"
    - install -m 755 ELK_exciting_BXSFconverter "${PREFIX}/bin/ELK_exciting_BXSFconverter"
    - install -m 755 memoryestimateskeaf "${PREFIX}/bin/memoryestimateskeaf"
    - install -m 755 simbxsf_barrel "${PREFIX}/bin/simbxsf_barrel"
    - install -m 755 simbxsf_cylinder "${PREFIX}/bin/simbxsf_cylinder"
    - install -m 755 simbxsf_sphere "${PREFIX}/bin/simbxsf_sphere"
    - install -m 755 simbxsf_spheroid "${PREFIX}/bin/simbxsf_spheroid"

requirements:
  build:
    - ${{ compiler("fortran") }}
    - ${{ stdlib("c") }}

tests:
  - script:
      - test -x "${PREFIX}/bin/skeaf"
      - test -x "${PREFIX}/bin/ELK_exciting_BXSFconverter"
      - test -x "${PREFIX}/bin/memoryestimateskeaf"
      - test -x "${PREFIX}/bin/simbxsf_barrel"
      - test -x "${PREFIX}/bin/simbxsf_cylinder"
      - test -x "${PREFIX}/bin/simbxsf_sphere"
      - test -x "${PREFIX}/bin/simbxsf_spheroid"

about:
  homepage: https://github.com/qiaojunfeng/skeaf
  repository: https://github.com/qiaojunfeng/skeaf
  summary: Supercell K-space Extremal Area Finder
  description: |
    SKEAF (Supercell K-space Extremal Area Finder) calculates extremal
    cross-sectional areas of Fermi surfaces and corresponding quantum
    oscillation frequencies.
  license: GPL-3.0-or-later
  license_file: COPYING.txt

extra:
  recipe-maintainers:
    - edan-bainglass
