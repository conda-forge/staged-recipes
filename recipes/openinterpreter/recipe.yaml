context:
  version: "0.0.61"

package:
  name: openinterpreter
  version: ${{ version }}

source:
  url: https://github.com/openinterpreter/openinterpreter/archive/refs/tags/rust-v${{ version }}.tar.gz
  sha256: 1cbb079f1ac1dcdd569cece1fa4c81d9e8fb65360acb1d554cde06b59fd76040
  patches:
    - patches/0001-isolate-conda-package-layout.patch
    - patches/0002-use-auditable-locked-package-builds.patch
    - patches/0003-increase-chatgpt-recursion-limit.patch

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    file: build

requirements:
  build:
    - python >=3.11
    - just
    - git
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - pkgconf
    - openssl
  host:
    - ${{ 'libcap' if linux }}
    - ${{ 'openssl' if unix }}
    - ripgrep
  run:
    - ripgrep

tests:
  - package_contents:
      bin:
        - i
        - interpreter
        - openinterpreter-code-mode-host
      files:
        - openinterpreter-package.json
        - ${{ 'openinterpreter-path/rg.exe' if win else 'openinterpreter-path/rg' }}
        - if: linux
          then: openinterpreter-resources/bwrap
        - if: unix
          then: openinterpreter-resources/zsh/bin/zsh
        - if: win
          then:
            - openinterpreter-resources/codex-command-runner.exe
            - openinterpreter-resources/codex-windows-sandbox-setup.exe
        - etc/pixi/i/global-ignore-conda-prefix
        - etc/pixi/interpreter/global-ignore-conda-prefix
        - etc/conda/test-files/openinterpreter/0/test_package.py
      strict: true
  - requirements:
      run:
        - codex
        - python >=3.11
    files:
      recipe:
        - test_package.py
    script:
      - codex --version
      - i --version
      - interpreter --help
      - openinterpreter-code-mode-host --help
      - python test_package.py

about:
  homepage: https://openinterpreter.com
  documentation: https://www.openinterpreter.com/docs/terminal
  repository: https://github.com/openinterpreter/openinterpreter
  summary: A lightweight coding agent for open models like Deepseek, Kimi, and Qwen
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  description: |
    **Open Interpreter** lets LLMs run code (Python, JavaScript, Shell, and more) locally.
    You can chat with Open Interpreter through a ChatGPT-like interface in your terminal by running `$ interpreter` after installing.

    This provides a natural-language interface to your computer's general-purpose capabilities:

    - Create and edit photos, videos, PDFs, etc.
    - Control a Chrome browser to perform research
    - Plot, clean, and analyze large datasets
    - ...etc.

extra:
  recipe-maintainers:
    - eunos-1128
