{% set version = "0.3.0" %}

package:
  name: py-svg-hush
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/py-svg-hush/py_svg_hush-{{ version }}.tar.gz
  sha256: 2fa88bc467a655f0040f581b48e0449be1cd5b95cac3669b4ff17e5107243b8a

build:
  skip: true  # [py<310]
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --config-settings="build-args=--locked --auditwheel=skip --features=pyo3/extension-module"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.0,<2.0
    - pip
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - py_svg_hush
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest

about:
  home: https://pypi.org/project/py_svg_hush/
  dev_url: https://github.com/jams2/py-svg-hush
  summary: 'a Python package for sanitizing SVG files using the svg-hush Rust library'
  license: MIT
  license_file:
    - LICENSE.txt
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - darynwhite
