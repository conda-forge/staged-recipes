{% set version = "0.3.0" %}

package:
  name: py-svg-hush
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/py-svg-hush/py_svg_hush-{{ version }}.tar.gz
  sha256: 2fa88bc467a655f0040f581b48e0449be1cd5b95cac3669b4ff17e5107243b8a

build:
  skip: true  # [py<310]
  script_env:
    - MATURIN_NO_INSTALL_RUST=1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib("c") }}
  host:
    - python
    - maturin >=1.0,<2.0
    - pip
  run:
    - python

test:
  imports:
    - py_svg_hush
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/py_svg_hush/
  dev_url: https://github.com/jams2/py-svg-hush
  summary: 'a Python package for sanitizing SVG files using the svg-hush Rust library'
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - darynwhite
