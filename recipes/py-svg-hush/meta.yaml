{% set version = "0.3.0" %}

package:
  name: py-svg-hush
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/py-svg-hush/py_svg_hush-{{ version }}.tar.gz
  sha256: 2fa88bc467a655f0040f581b48e0449be1cd5b95cac3669b4ff17e5107243b8a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - maturin >=1.0,<2.0
    - pip
  run:
    - python

test:
  imports:
    - py_svg_hush
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/py_svg_hush/
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - darynwhite
