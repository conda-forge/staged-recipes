schema_version: 1

context:
  version: "4.46.0"

package:
  name: asyn
  version: ${{ version }}

source:
  # Upstream tags omit the patch-level zero (R4-46, not R4-46-0).
  url: https://github.com/epics-modules/asyn/archive/refs/tags/R4-46.tar.gz
  sha256: 61548b7ff544d78dadd936cb8b2a5162824850afd19df7adab8f4b0087374ccb
  patches:
    - patches/vxi11-use-shipped-stubs.patch

build:
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - make
    - perl
    - sed
  host:
    - epics-base
    - readline
    - libusb
    - if: linux
      then: libtirpc
  run:
    - if: linux
      then: libtirpc
  run_exports:
    - ${{ pin_subpackage('asyn', upper_bound='x.x.x') }}

tests:
  - script:
      - test -f ${PREFIX}/epics/modules/asyn/include/asynDriver.h
      - test -f ${PREFIX}/epics/modules/asyn/db/asynRecord.db
      - test -n "$(find ${PREFIX}/epics/modules/asyn/lib -name 'libasyn.*')"
      - test -f ${PREFIX}/epics/modules/asyn/dbd/asyn.dbd
      - test -f ${PREFIX}/epics/modules/asyn/dbd/drvVxi11.dbd
      - test -f ${PREFIX}/epics/modules/asyn/dbd/drvAsynUSBTMC.dbd
      - test -f ${PREFIX}/epics/modules/asyn/dbd/devGpib.dbd

about:
  homepage: https://github.com/epics-modules/asyn
  license: EPICS
  license_file: LICENSE
  summary: EPICS module for driver and device support
  repository: https://github.com/epics-modules/asyn

extra:
  recipe-maintainers:
    - anderslindho
