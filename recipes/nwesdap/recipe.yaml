schema_version: 1

context:
  version: "0.1.0"
  python_min: "3.12"

package:
  name: nwesdap
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/nwesdap/nwesdap-${{ version }}.tar.gz
  sha256: 0f68a7c50627057e018bc242262fc3dab9971000d9517a37f5eb965ea405ffbc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pandas >=3.0.6,<4
    - pooch >=1.9.0,<2

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - nwesdap
      pip_check: true

about:
  summary: NWESDAP download and import tool for Python
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/nwesdap/nwesdap-python/

extra:
  recipe-maintainers:
    - mvdh7
