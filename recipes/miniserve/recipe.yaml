context:
    version: "0.35.0"

package:
    name: miniserve
    version: ${{ version }}

source:
    url: https://github.com/svenstaro/miniserve/archive/v${{ version }}.tar.gz
    sha256: 8ae108c161f2ed740f8c4b4dfd0a80805adcbaf7a05a6128f2b4d8f5093f5490

build:
    number: 0
    script:
        env:
            CARGO_PROFILE_RELEASE_STRIP: symbols
            CARGO_PROFILE_RELEASE_LTO: fat
        content:
            - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
            - if: unix
              then: cargo auditable install -j ${CPU_COUNT} --root "${PREFIX}" --locked --no-track --path .
              else: cargo auditable install -j %CPU_COUNT% --root "%PREFIX%" --locked --no-track --path .

requirements:
    build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('rust') }}
        - cargo-bundle-licenses
        - cargo-auditable

tests:
    - script:
          - miniserve --version
          - miniserve --help
    - package_contents:
          strict: true
          bin:
              - miniserve

about:
    homepage: https://github.com/svenstaro/miniserve
    summary: "For when you really just want to serve some files over HTTP right now!"
    description: |
        miniserve is a small, self-contained cross-platform CLI tool that allows you to just grab the binary and serve some file(s) via HTTP. Sometimes this is just a more practical and quick way than doing things properly.
    license: MIT
    license_file:
        - LICENSE
        - THIRDPARTY.yml
    repository: https://github.com/svenstaro/miniserve

extra:
    recipe-maintainers:
        - XhstormR
