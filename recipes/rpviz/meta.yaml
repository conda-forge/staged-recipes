context:
  name: "rpviz"
  version: "6.8.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/brsynth/rpviz/archive/refs/tags/${{ version }}.tar.gz
  sha256: f64861721392ca0fdecc016d9c9dd42f5ccdbc788819f79bf3ddd781174f49d9

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} setup.py install

requirements:
  host:
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - pandas
    - rdkit
    - bs4
    - rplibs >=6.9.5

test:
  requires:
    - python {{ python_min }}
  imports:
    - rpviz
  commands:
    - python -m rpviz --help

about:
  home: https://github.com/brsynth/rpviz/tree/main
  summary: "Visualize pathways from the RetroPath Suite"
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ramez17khaled
