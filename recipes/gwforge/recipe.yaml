context:
  name: gwforge
  version: "1.2"
  python_min: "3.11"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/koustavchandra/gwforge/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0327c825baaea1bc5468ec9bd8d8b960134f5025aa4469b938406f2d65de2dbe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.16.0,!=1.19.0
    - scipy
    - h5py
    - matplotlib-base
    - pandas >=2.1.4
    - astropy-base >=6.0.0
    - bilby >=2.7.0
    - bilby.cython
    - lalsuite
    - emcee >=3.1.6
    - corner >=2.2.0
    - pycbc >=2.10.0
    - gwpy >=3.0.7
    - rich >=13.7.0

tests:
  - python:
      imports:
        - GWForge
        - GWForge.fisher
        - GWForge.glitch
        - GWForge.ifo
        - GWForge.inject
        - GWForge.population
        - GWForge.population_fisher
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - gwforge_estimate_psd --help
      - gwforge_fisher --help
      - gwforge_glitch --help
      - gwforge_inject --help
      - gwforge_noise --help
      - gwforge_optimal_snr --help
      - gwforge_population --help
      - gwforge_population_fisher --help
      - gwforge_workflow --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: Tool for generating gravitational wave mock datasets and forecasting capabilities of gravitational wave detectors
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/koustavchandra/gwforge
  repository: https://github.com/koustavchandra/gwforge
  documentation: https://koustavchandra.github.io/gwforge/index.html

extra:
  recipe-maintainers:
    - koustavchandra
