schema_version: 1

context:
  version: "6.2.3"

package:
  name: silero-vad
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/silero-vad/silero_vad-${{ version }}.tar.gz
  sha256: d7a23b09202be4953915cb9173089bb307eed0418a9bd4794d9ec5af07fa1996

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - packaging
    - pytorch >=1.12.0

tests:
  - python:
      imports:
        - silero_vad
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/snakers4/silero-vad
  summary: Voice Activity Detector (VAD) by Silero
  description: |
    Silero VAD is a pre-trained enterprise-grade voice activity detector.
    The package bundles the pre-trained JIT and ONNX model files.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/snakers4/silero-vad

extra:
  recipe-maintainers:
    - BeyondITL-Mossaddique
