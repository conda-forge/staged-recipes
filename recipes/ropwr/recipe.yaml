schema_version: 1

context:
  name: ropwr
  version: "1.2.0"
  python_min: "3.10"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/0d/d2/329bcd5e097601b1e89367dbb2a3ac94756c539544cbf5946c0e0995c1dd/ropwr-1.2.0.tar.gz
  sha256: af0d8b7d6df279ce180f409660216ee3dd228f86a2127a1d9e7aa8f44adac8a2

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cvxpy >=1.6
    - numpy >=1.16
    - scikit-learn >=1.6.0
    - scipy >=1.6.1

tests:
  - python:
      imports:
        - ropwr
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "import numpy as np; from ropwr import RobustPWRegression; x = np.linspace(0.0, 1.0, 30); y = 2.0 * x + 1.0; model = RobustPWRegression(solver='direct'); model.fit(x, y, [0.5]); assert model.predict(x).shape == x.shape"

about:
  homepage: https://github.com/guillermo-navas-palencia/ropwr
  summary: Robust piecewise regression
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://gnpalencia.org/ropwr/
  repository: https://github.com/guillermo-navas-palencia/ropwr

extra:
  recipe-maintainers:
    - guillermo-navas-palencia

