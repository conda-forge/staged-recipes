schema_version: 1

context:
  name: ropwr
  version: "1.2.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: af0d8b7d6df279ce180f409660216ee3dd228f86a2127a1d9e7aa8f44adac8a2

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - cvxpy >=1.6
    - numpy >=1.16
    - scikit-learn >=1.6.0
    - scipy >=1.6.1

tests:
  - python:
      imports:
        - ropwr
      pip_check: false
  - script:
      - python -c "import numpy as np; from ropwr import RobustPWRegression; x = np.linspace(0.0, 1.0, 30); y = 2.0 * x + 1.0; model = RobustPWRegression(solver='direct'); model.fit(x, y, [0.5]); assert model.predict(x).shape == x.shape"

about:
  homepage: https://github.com/guillermo-navas-palencia/ropwr
  summary: Robust piecewise regression
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://gnpalencia.org/ropwr/
  repository: https://github.com/guillermo-navas-palencia/ropwr

extra:
  recipe-maintainers:
    - guillermo-navas-palencia