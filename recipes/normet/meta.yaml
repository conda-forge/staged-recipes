{% set name = "normet" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # The PyPI sdist of the release; update version, url and sha256 together.
  url: https://files.pythonhosted.org/packages/d5/d1/4dda970ff90c03f382427da9c95c9198c9a494102f70330a0df6e2ada932/normet-0.3.0.tar.gz
  sha256: 01845bc162cc1cc672dab87a00384b3bae6ece43258075df8d680b3c7f475365

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - normet = normet.cli:main
    - normet-mcp = normet.mcp_server:main
    - normet-gui = normet.gui:main
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >={{ python_min }}
    - numpy >=1.22
    - pandas >=2.0,<3.0
    - scipy >=1.10
    - scikit-learn >=1.1
    - joblib >=1.2
    - matplotlib-base >=3.6

test:
  imports:
    - normet
  commands:
    - python -c "import normet; assert normet.__version__ == '{{ version }}'; print(normet.__version__)"
    - python -c "import normet; print(normet.datasets.load_my1_pm25().shape)"
    - normet --help
  requires:
    - python {{ python_min }}
    - click
    - pyyaml

about:
  home: https://github.com/apai-sys/normet-py
  summary: Meteorological normalisation and counterfactual modelling for air quality time series
  description: |
    normet provides meteorological normalisation (deweathering), decomposition,
    trend and event analysis, and counterfactual modelling (synthetic control)
    for air quality time series. It wraps AutoML model training, Monte Carlo
    meteorological normalisation, and Synthetic Control Methods behind a
    high-level Python API, with optional CLI, MCP server, desktop GUI and
    Chronos-2 foundation-model support.
  doc_url: https://github.com/apai-sys/normet-py/tree/main/docs
  dev_url: https://github.com/apai-sys/normet-py
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - songnku
