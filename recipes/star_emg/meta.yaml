{% set name = "star_emg" %}
{% set version = "0.1.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://github.com/aceglia/star-emg/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 18e1b1a60ecd9710bf347da706cbaf6fac102094ee980a419eaf1248ea46ef08

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
  run:
    - biosiglive >=2.0.3
    - python >=3.10
    - packaging
    - matplotlib-base
    - numpy
    - scipy
    - pyqtgraph
    - pandas
    - pyqt >=5.15,<6
    - zarr
    - pip


test:
  imports:
    - star_emg
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/aceglia/star-emg
  license: MIT
  license_file: LICENSE
  summary: Package for Stimulation Artifact Removal in EMG during transcutaneous spinal stimulation.

extra:
  recipe-maintainers:
    - aceglia
