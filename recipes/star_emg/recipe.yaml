schema_version: 1

context:
  name: star_emg
  version: 0.1.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/aceglia/star-emg/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 18e1b1a60ecd9710bf347da706cbaf6fac102094ee980a419eaf1248ea46ef08

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - biosiglive >=2.0.3
    - packaging
    - matplotlib-base
    - numpy
    - scipy
    - pyqtgraph
    - pandas
    - pyqt >=5.15,<6
    - zarr

tests:
  - python:
      imports:
        - star_emg
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aceglia/star-emg
  license: MIT
  license_file: LICENSE
  summary: Package for Stimulation Artifact Removal in EMG during transcutaneous spinner stimulation.
  repository: https://github.com/aceglia/star-emg

extra:
  recipe-maintainers:
    - aceglia
