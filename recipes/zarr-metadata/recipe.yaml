schema_version: 1

context:
  name: zarr-metadata
  version: "0.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/zarr_metadata-${{ version }}.tar.gz
  sha256: 4462dc91cdb8c19c370bcd548096125591359579586f42de789dc495a33119d0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.29.0
    - hatch-vcs
    - setuptools-scm >=9
  run:
    - python >=${{ python_min }}
    - annotated-types >=0.6
    - typing_extensions >=4.16

tests:
  - python:
      imports:
        - zarr_metadata
        - zarr_metadata.v2
        - zarr_metadata.v3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - pydantic >=2.13
        - jsonschema
        - hypothesis
    script:
      # test_docs.py needs pytest-examples, which is not on conda-forge.
      - python -m pytest tests --ignore=tests/test_docs.py -q -p no:cacheprovider

about:
  homepage: https://zarr-metadata.readthedocs.io/
  summary: Spec-defined metadata types, models, and validators for Zarr v2 and v3.
  description: |
    Basic tools for modelling Zarr metadata, with minimal dependencies:
    data structures and routines that closely model the content of the
    Zarr v2 and v3 specifications. It is developed in the zarr-python
    repository and released independently of zarr itself.
  license: MIT
  license_file: LICENSE.txt
  repository: https://github.com/zarr-developers/zarr-python/tree/main/packages/zarr-metadata
  documentation: https://zarr-metadata.readthedocs.io/

extra:
  recipe-maintainers:
    - d-v-b
