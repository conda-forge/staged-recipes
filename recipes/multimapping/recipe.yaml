schema_version: 1

context:
  version: "5.1"

package:
  name: multimapping
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/multimapping/multimapping-${{ version }}.tar.gz
  sha256: 1b22334fcd4da12206283492e27f62857a1a3d329204e9890e0dfa5117907f9c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=78.1.1,<81
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - extensionclass

tests:
  - python:
      imports:
        - MultiMapping
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Special MultiMapping objects used in Zope.
  license: BSD-3-Clause AND ZPL-2.1
  license_file:
    - COPYRIGHT.txt
    - LICENSE.txt
  homepage: https://pypi.org/project/MultiMapping/
  repository: https://github.com/zopefoundation/MultiMapping

extra:
  recipe-maintainers:
    - jsmolic
