schema_version: 1

context:
  version: "5.1"

package:
  name: multimapping
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/multimapping/multimapping-${{ version }}.tar.gz
  sha256: 1b22334fcd4da12206283492e27f62857a1a3d329204e9890e0dfa5117907f9c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - extensionclass

tests:
  - python:
      imports:
        - MultiMapping
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest -v MultiMapping.tests

about:
  homepage: https://github.com/zopefoundation/MultiMapping
  repository: https://github.com/zopefoundation/MultiMapping
  summary: Special MultiMapping objects used in Zope
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
