context:
  name: kdsingleapplication
  version: "1.2.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/KDAB/KDSingleApplication/releases/download/v${{ version }}/kdsingleapplication-${{ version }}.tar.gz
  sha256: e3254ce9dc5ecf6d61ef83264bc61d486a307f0e3c9ed1bb2176f068cdbcbe09

build:
  number: 0
  script:
    - cmake -B build -G Ninja
        ${CMAKE_ARGS}
        -DKDSingleApplication_QT6=ON
        -DKDSingleApplication_EXAMPLES=OFF
        -DKDSingleApplication_TESTS=OFF
    - cmake --build build
    - cmake --install build

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - qt6-main
  run:
    - qt6-main

tests:
  - package_contents:
      # platform-neutral name (no "lib" prefix): CMake names the shared
      # library libkdsingleapplication-qt6.so/.dylib on unix but
      # kdsingleapplication-qt6.dll on Windows
      lib:
        - kdsingleapplication-qt6

about:
  homepage: https://github.com/KDAB/KDSingleApplication
  license: MIT
  license_file: LICENSE.txt
  summary: KDAB helper for single-instance Qt applications
  description: |
    KDSingleApplication is a helper class for single-instance policy
    applications written with Qt. It uses local sockets to detect already
    running instances of an application and to pass messages to them.
extra:
  recipe-maintainers:
    - claudiushaag
