schema_version: 1

context:
  version: "2.2.1"

package:
  name: r-rogue
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/Rogue_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/Rogue/Rogue_${{ version }}.tar.gz
  sha256: 4530de8eedd3581f3a6f18ea600871fe2a22591d95ea450393c0ef17501d7d78

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/
    missing_dso_allowlist:
      - if: win
        then:
          - "*/R.dll"
          - "*/Rblas.dll"
          - "*/Rlapack.dll"

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - cross-r-base ${{ r_base }}.*
    - if: not win
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - make
    - if: win
      then:
        - ${{ compiler('m2w64_c') }}
        - ${{ stdlib('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
        - m2-filesystem
        - m2-make
        - m2-sed
        - m2-coreutils
        - m2-zip
  host:
    - r-base
    - r-ape >=5.0
    - r-cli >=3.0
    - r-fastmatch
    - r-matrixstats
    - r-rdpack >=0.7
    - r-treedist >2.2.0
    - r-treetools >=1.9.1.9003
  run:
    - r-base
    - r-ape >=5.0
    - r-cli >=3.0
    - r-fastmatch
    - r-matrixstats
    - r-rdpack >=0.7
    - r-treedist >2.2.0
    - r-treetools >=1.9.1.9003

tests:
  - r:
      libraries:
        - Rogue

about:
  homepage: https://github.com/ms609/Rogue/
  repository: https://github.com/ms609/Rogue/
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: "Identify Rogue Taxa in Sets of Phylogenetic Trees"
  description: |
    Rogue ("wildcard") taxa are leaves with uncertain phylogenetic position.
    Their position may vary from tree to tree under inference methods that
    yield a tree set (e.g. bootstrapping, Bayesian tree searches, maximum
    parsimony). The presence of rogue taxa in a tree set can potentially
    remove all information from a consensus tree. The information content of
    a consensus tree - a function of its resolution and branch support values
    - can often be increased by removing rogue taxa. 'Rogue' provides an
    explicitly information-theoretic approach to rogue detection (Smith 2022)
    <doi:10.1093/sysbio/syab099>, and an interface to 'RogueNaRok' (Aberer et
    al. 2013) <doi:10.1093/sysbio/sys078>.

extra:
  recipe-maintainers:
    - conda-forge/r
    - ms609
