schema_version: 1

context:
  version: "0.6.0"

package:
  name: dynamic-metadata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dynamic-metadata/dynamic_metadata-${{ version }}.tar.gz
  sha256: a01ea4bbd5eda19b051889f9bc61d8d059d8113ff979fb3ce706343f4f6b9a73

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - dynamic-metadata = dynamic_metadata.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dynamic_metadata
        - dynamic_metadata.plugins
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - dynamic-metadata --help

about:
  homepage: https://github.com/scikit-build/dynamic-metadata
  summary: Specification and plugins for dynamic metadata in pyproject.toml build backends
  description: |
    dynamic-metadata documents the dynamic-metadata plugin protocol used by
    build backends such as scikit-build-core, and provides a set of
    reference plugins (regex, template, static, from_file, and more).
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://dynamic-metadata.readthedocs.io/
  repository: https://github.com/scikit-build/dynamic-metadata

extra:
  recipe-maintainers:
    - henryiii
