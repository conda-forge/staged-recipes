schema_version: 1

context:
  name: precice-adapter-schema
  version: "0.4.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/precice-adapter-schema/precice_adapter_schema-${{ version }}.tar.gz
  sha256: b636e6db5e74ceb8a06b6329b281779dd6fac9815171d3456699c72ce9c83bb6

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
    - setuptools-git-versioning
  run:
    - python >=${{ python_min }}
    - jsonschema >=4.0.0

tests:
  - python:
      imports:
        - preciceadapterschema
      pip_check: true

about:
  license: MIT
  license_file: LICENSE
  summary: Validation utility for preCICE adapter configurations
  homepage: https://precice.org
  repository: https://github.com/precice/adapter-schema
  documentation: https://precice.org/community-guidelines-adapters

extra:
  recipe-maintainers:
    - GandotraDiya
    - IshaanDesai