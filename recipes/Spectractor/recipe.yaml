schema_version: 1

context:
  version: "3.2.1"

package:
  name: spectractor
  version: ${{ version }}

source:
  url: https://github.com/LSSTDESC/Spectractor/archive/v${{ version }}.tar.gz
  sha256: f282f3cf299ea980eb56830da140feff01e037995a256968d8d7c991426c7947

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >1.15
    - scipy
    - matplotlib-base >3.1
    - pandas
    - llvmlite
    - numba
    - astropy-base >=3.2
    - photutils >=1.7.0
    - astroquery >=0.4.8
    - coloredlogs
    - scikit-image >=0.20
    - tqdm
    - configparser
    - deprecated
    - pyyaml
    - getcalspec >=2.0.0
    - lsst-utils
    - packaging

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - spectractor
      pip_check: false
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
        - wcwidth <0.9.1
    script:
      - pip check

about:
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/LSSTDESC/Spectractor
  summary: 'Spectractor aims at measuring the atmospheric transmission from slitless spectrophotometry images.'

extra:
  recipe-maintainers:
    - roceb
    - timj
    - jeremyneveu
    - erykoff
