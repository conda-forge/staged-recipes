# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: sphinx-rustdocgen
  version: ${{ version }}

source:
  # The crates.io release does not ship the license file, so build from the
  # sdist, which bundles the crate alongside the Python extension that drives it.
  url: https://pypi.org/packages/source/s/sphinxcontrib-rust/sphinxcontrib_rust-${{ version }}.tar.gz
  sha256: 71ddb07f99d074549ccecc12924f844d415b4024bc469e95efff6d5c8ef3727d

build:
  number: 0
  script:
    - cd sphinx-rustdocgen
    - if: unix
      then: cargo auditable install --locked --no-track --root "$PREFIX" --path .
      else: cargo auditable install --locked --no-track --root "%LIBRARY_PREFIX%" --path .
    - cargo-bundle-licenses --format=yaml --output ../THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses

tests:
  - package_contents:
      bin:
        - sphinx-rustdocgen
      strict: true

about:
  homepage: https://gitlab.com/munir0b0t/sphinxcontrib-rust
  repository: https://gitlab.com/munir0b0t/sphinxcontrib-rust
  documentation: https://sphinxcontrib-rust.readthedocs.io/en/latest/
  summary: Executable to extract rustdoc comments for Sphinx
  description: |
    sphinx-rustdocgen extracts doc comments from Rust crates and emits the
    reStructuredText or MyST sources consumed by Sphinx. It is tightly coupled
    with the sphinxcontrib-rust extension, which invokes it during the Sphinx
    build.
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - timkpaine
