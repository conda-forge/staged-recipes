schema_version: 1

context:
  version: "2.0.2"

package:
  name: r-tbrdist
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/TBRDist_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/TBRDist/TBRDist_${{ version }}.tar.gz
  sha256: 5497bad2680d21a557d29db3f2c4ef2c0f28d0677f21b33c2a8a7f9e476dd341

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/
    missing_dso_allowlist:
      - if: win
        then:
          - "*/R.dll"
          - "*/Rblas.dll"
          - "*/Rlapack.dll"

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - cross-r-base ${{ r_base }}.*
    - if: not win
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - make
    - if: win
      then:
        - ${{ compiler('m2w64_c') }}
        - ${{ stdlib('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
        - m2-filesystem
        - m2-make
        - m2-sed
        - m2-coreutils
        - m2-zip
  host:
    - r-base
    - r-ape
    - r-bh
    - r-rcpp
    - r-rdpack
    - r-treedist
    - r-treetools >=2.2.0
  run:
    - r-base
    - r-ape
    - r-bh
    - r-rcpp
    - r-rdpack
    - r-treedist
    - r-treetools >=2.2.0

tests:
  - r:
      libraries:
        - TBRDist

about:
  homepage: https://ms609.github.io/TBRDist/
  repository: https://github.com/ms609/TBRDist/
  documentation: https://ms609.github.io/TBRDist/
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: "Rearrangement Distances Between Phylogenetic Trees"
  description: |
    Fast calculation of tree rearrangement distances. For unrooted trees:
    Subtree Prune and Regraft (SPR), Tree Bisection and Reconnection (TBR),
    and Replug distances, using the algorithms of Whidden and Matsen (2017)
    <doi:10.48550/arXiv.1511.07529>. For rooted trees: rooted SPR (rSPR)
    distance, using the fixed-parameter algorithms of Whidden, Beiko, and Zeh
    (2013) <doi:10.1137/110845045>.

extra:
  recipe-maintainers:
    - conda-forge/r
    - ms609
