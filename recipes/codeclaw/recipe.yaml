context:
  version: "0.4.6"

package:
  name: codeclaw
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/codeclaw/codeclaw-${{ version }}.tar.gz
  sha256: 0842d956bb0161e3f878f86d41054c609afdf5b53f8c4478476ff3635a7b1bd3

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - codeclaw = codeclaw.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - huggingface_hub >=0.20.0
    - cryptography >=42.0.0
    - keyring >=24.0.0
    - prompt_toolkit >=3.0.39

tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - codeclaw
        - codeclaw.cli
      pip_check: true
  - script:
      - codeclaw --version
      - python -m pytest -q tests/test_classifier.py
    requirements:
      run:
        - pytest
    files:
      source:
        - tests/test_classifier.py

about:
  homepage: https://github.com/ychampion/codeclaw
  summary: Export Claude Code and Codex conversations to Hugging Face as structured training data
  license: MIT
  license_file: LICENSE
  repository: https://github.com/ychampion/codeclaw

extra:
  recipe-maintainers:
    - ychampion
