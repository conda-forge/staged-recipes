context:
  version: "2026.724.1"

package:
  name: pixi-mise
  version: ${{ version }}

source:
  url: https://github.com/amirhosseindavoody/pixi-mise/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9cda7f85ce97c8af455618b99368ae95a1ba42455ef40977ce2afa96c36247f3

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses

tests:
  - script:
      - pixi-mise --help
      - pixi-mise --version
  - package_contents:
      bin:
        - pixi-mise
      strict: true

about:
  homepage: https://github.com/amirhosseindavoody/pixi-mise
  repository: https://github.com/amirhosseindavoody/pixi-mise
  summary: Install GitHub release binaries into Pixi environments (Pixi extension)
  description: |
    Pixi extension (`pixi mise …`) that resolves and installs GitHub release
    binaries into Pixi-managed local or global environments, with mise-like
    asset matching and a lockfile for reproducible installs.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - amirhosseindavoody
