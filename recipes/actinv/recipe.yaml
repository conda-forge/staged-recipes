schema_version: 1

context:
  version: "1.7.1"

package:
  name: actinv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/actinv/actinv-${{ version }}.tar.gz
  sha256: c00454d16406b695359ac6a80bac8d4c88478b3f591d9ccde59f4d69e07c8997
  patches:
    # the 1.7.1 sdist lists crates/actinv-gui as a workspace member without shipping it; fixed upstream
    - 0001-workspace-members-glob.patch

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - actinv = actinv:_cli

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.9.4,<2
  host:
    - python
    - pip
    - maturin >=1.9.4,<2
  run:
    - python

tests:
  - python:
      imports:
        - actinv
  - script:
      - actinv --help

about:
  homepage: https://github.com/AvilaLabs/ACTINV
  repository: https://github.com/AvilaLabs/ACTINV
  summary: Open, standalone nuclide-inventory and activation solver
  description: |
    ACTINV computes nuclide inventories, activation and decay heat. This
    package ships the Python bindings and the `actinv` command-line tool.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - Connoravila1
