schema_version: 1

context:
  version: "1.7.2"

package:
  name: actinv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/actinv/actinv-${{ version }}.tar.gz
  sha256: 12846693b72f01619d88822cd8f47f020c61ab2161b5f64d1461059baaaae927

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - actinv = actinv:_cli

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.9.4,<2
  host:
    - python
    - pip
    - maturin >=1.9.4,<2
  run:
    - python

tests:
  - python:
      imports:
        - actinv
  - script:
      - actinv --help

about:
  homepage: https://github.com/AvilaLabs/ACTINV
  repository: https://github.com/AvilaLabs/ACTINV
  summary: Open, standalone nuclide-inventory and activation solver
  description: |
    ACTINV computes nuclide inventories, activation and decay heat. This
    package ships the Python bindings and the `actinv` command-line tool,
    and `actinv.openmc`, an activation step for OpenMC's R2S workflow
    (OpenMC itself is optional and not a dependency).
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - Connoravila1
