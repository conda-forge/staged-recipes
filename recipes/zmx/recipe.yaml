context:
  version: "0.7.0"

package:
  name: zmx
  version: ${{ version }}

source:
  url: https://github.com/neurosnap/zmx/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f278cbff940bc2d3fcaa3b2f023c4ab43bd6500f2791254d25a421ac006e7beb
  patches:
    # zig emits Mach-O binaries with no header padding, so rattler-build's
    # install_name_tool relocation can't rewrite the rpath ("larger updated load
    # commands do not fit"). Set headerpad_max_install_names on the installed exe
    # so relocation succeeds and @rpath/libc++.1.dylib resolves to conda libcxx.
    - patches/0001-headerpad-max-install-names.patch

build:
  number: 0
  skip:
    - win
  script:
    # zig fetches the ghostty (ghostty-vt) git dependency into this cache at
    # build time (needs network, git+https dep) -- same model as ghostty-feedstock.
    - export ZIG_GLOBAL_CACHE_DIR="${SRC_DIR}/.zig-global-cache"
    - zig build --prefix "${PREFIX}" -Doptimize=ReleaseSafe -Dversion="${PKG_VERSION}"
    # Ship the vendored ghostty-vt license (MIT). ghostty's build.zig.zon has
    # .paths={""}, so zig copies its whole tree (incl. LICENSE) into the fetch
    # cache; referenced from license_file. Glob is robust to ghostty hash bumps.
    - cp ${ZIG_GLOBAL_CACHE_DIR}/p/ghostty-*/LICENSE "${SRC_DIR}/LICENSE.ghostty"

requirements:
  build:
    # Upstream build.zig.zon: minimum_zig_version = 0.15.2, and the source uses
    # 0.15-era APIs (linkLibC/linkSystemLibrary2/addCSourceFile) that zig 0.16
    # removed.
    - zig >=0.15.2,<0.16
    # zig fetches the ghostty git dependency (git+https) -- git must be present.
    - git
  host:
    # macOS: zig dynamically links conda's libc++ (@rpath/libc++.1.dylib) via the
    # ghostty-vt/simdutf `-lc++`; libcxx must be present to link against.
    - if: osx
      then:
        - libcxx
  run:
    # libcxx ships no run_exports, so the host dep above does not propagate to
    # run. Declare it explicitly: rattler-build's relocation (enabled by the
    # headerpad patch) points @rpath/libc++.1.dylib at $PREFIX/lib, which must
    # exist at runtime.
    - if: osx
      then:
        - libcxx

tests:
  - package_contents:
      strict: true
      bin:
        - zmx
  - script:
      - zmx version
      - zmx --help

about:
  homepage: https://zmx.sh
  summary: Persist terminal shell sessions with attach/detach
  description: |
    zmx lets you create named shell sessions that persist after disconnecting.
    Attach and detach from a session without killing it, with native terminal
    scrollback and state restoration, and multiple concurrent clients per
    session. It deliberately does not provide windows, tabs, or splits.
  license: MIT
  license_file:
    - LICENSE
    - LICENSE.ghostty
  repository: https://github.com/neurosnap/zmx

extra:
  recipe-maintainers:
    - anjos
