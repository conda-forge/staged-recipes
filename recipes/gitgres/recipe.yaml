# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  # no releases upstream
  commit: eaf8743f2c137d61a75432e44e13467cad7eceaa
  version: "0.pre20260308"
  # needs to match https://github.com/conda-forge/postgresql-feedstock/blob/main/recipe/meta.yaml
  pg_llvm_version: 21

package:
  name: gitgres
  version: ${{ version }}

source:
  url: https://github.com/andrew/gitgres/archive/eaf8743f2c137d61a75432e44e13467cad7eceaa.tar.gz
  sha256: 82ad23f53602d57ba86e920c36cbae412f502adc56bf09a7d7671eb37cd0df8e

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - pkg-config
    - make
    # needed by pgxs makefile
    - if: unix
      then:
        - clang ${{ pg_llvm_version }}.*
        - llvm-tools ${{ pg_llvm_version }}.*
  host:
    - libpq
    - libgit2
    - openssl
  run:
    - git

tests:
  - package_contents:
      bin:
        - gitgres-backend
        - git-remote-gitgres
      lib:
        - gitgres
      files:
        - lib/bitcode/gitgres.index.bc
        - lib/bitcode/gitgres/*.bc
        - share/extension/gitgres*
      strict: true

about:
  summary: Store git objects and refs in PostgreSQL tables
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/andrew/gitgres

extra:
  recipe-maintainers:
    - mgorny
