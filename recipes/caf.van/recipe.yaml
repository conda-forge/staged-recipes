schema_version: 1

context:
  version: "0.2.0"

package:
  name: caf.van
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/caf.van/caf_van-${{ version }}.tar.gz
  sha256: d696f2f8f1070c10a8c9f4078d52e557827d35c2770abffd5f2387588691b6a8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - caf.van = caf.van.__main__:main

requirements:
  host:
    - python >=3.11
    - setuptools >=64.0.0
    - versioningit
    - pip
  run:
    - python >=3.11
    - caf.distribute >=0.5.1
    - caf.toolkit >=0.8.1
    - jinja2 >=2.11
    - matplotlib-base >=3.9.4
    - numpy >=1.26.4
    - openpyxl >=3.1.5
    - pandas >=1.4.4
    - scipy >=1.13.0
    - caf.base >=0.1.3

tests:
  - python:
      imports:
        - caf
        - caf.van
        - scripts
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - caf.van --help

about:
  summary: Transport demand model to produce van travel matrices.
  license: LicenseRef-TfN-License
  license_file: LICENSE
  homepage: https://github.com/transport-for-the-north/caf.van
  repository: https://github.com/transport-for-the-north/caf.van
  documentation: http://cafvan.readthedocs.io/

extra:
  recipe-maintainers:
    - MattBuckley-TfN
    - BenTaylor-TfN
    - isaac-tfn
    - Kieran-Fishwick-TfN
