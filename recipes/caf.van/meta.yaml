{% set version = "0.2.0" %}
{% set python_min = "3.11" %}

package:
  name: caf.van
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/c/caf.van/caf_van-{{ version }}.tar.gz
  sha256: d696f2f8f1070c10a8c9f4078d52e557827d35c2770abffd5f2387588691b6a8

build:
  entry_points:
    - caf.van = caf.van.__main__:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64.0.0
    - versioningit
    - pip
  run:
    - python >={{ python_min }}
    - caf.distribute >=0.5.1
    - caf.toolkit >=0.8.1
    - jinja2 >=2.11
    - matplotlib-base >=3.9.4
    - numpy >=1.26.4
    - openpyxl >=3.1.5
    - pandas >=1.4.4
    - scipy >=1.13.0
    - caf.base >=0.1.3

test:
  imports:
    - caf
    - scripts
  commands:
    - pip check
    - caf.van --help
  requires:
    - pip
    - python

about:
  home: https://github.com/transport-for-the-north/caf.van
  summary: Transport demand model to produce van travel matrices.
  doc_url: http://cafvan.readthedocs.io/
  dev_url: https://github.com/transport-for-the-north/caf.van
  license: LicenseRef-TfN-License
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MattBuckley-TfN
    - BenTaylor-TfN
    - isaac-tfn
    - Kieran-Fishwick-TfN
