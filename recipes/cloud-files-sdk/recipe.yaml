schema_version: 1
package:
  name: cloud-files-sdk
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Cloud-Files-SDK/language-sdks-v1.0.0/cloud-files-sdk-sdk-source-1.0.0.zip
  sha256: e98f8416525f8d920ffc72c47f78bf06bfd8402a3f7f9a25660a18f16cc30704
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - cloud_files_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from cloud_files_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Cloud-Files-SDK
  summary: Windows x64 Cloud-Files-SDK Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Cloud-Files-SDK-C-ffi/LICENSE
  - Cloud-Files-SDK-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
