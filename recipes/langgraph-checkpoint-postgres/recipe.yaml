schema_version: 1

context:
  name: langgraph-checkpoint-postgres
  version: 3.2.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langgraph_checkpoint_postgres-${{ version }}.tar.gz
  sha256: dffef0e6822d7c614019f7f2c4bdbef42859746aee2d3e6d9d9747cf3744ca90

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - langgraph-checkpoint >=4.3.0,<5.0.0
    - orjson >=3.11.5
    - psycopg >=3.2.0
    - psycopg-pool >=3.2.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - langgraph.checkpoint.postgres
      pip_check: true

about:
  summary: Library with a Postgres implementation of LangGraph checkpoint saver.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/langchain-ai/langgraph/tree/main/libs/checkpoint-postgres
  homepage: https://github.com/langchain-ai/langgraph

extra:
  recipe-maintainers:
    - Emrys-Merlin
