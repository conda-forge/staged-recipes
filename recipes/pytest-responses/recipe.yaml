schema_version: 1

context:
  version: "0.6.0"

package:
  name: pytest-responses
  version: ${{ version }}

source:
  url: https://github.com/getsentry/pytest-responses/archive/refs/tags/${{ version }}.tar.gz
  sha256: 645a7abe393a4e9b49bd1bbb94441d77580ea340b47cb4e013805da05ea96dee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest >=2.5.0
    - responses

tests:
  - python:
      imports:
        - pytest_responses
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - pytest
        - httpx2
    script:
      - pytest -vvv test_pytest_responses.py
    files:
      source:
        - test_pytest_responses.py

about:
  summary: py.test integration for responses
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/getsentry/pytest-responses

extra:
  recipe-maintainers:
    - jsmolic
