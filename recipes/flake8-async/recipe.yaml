schema_version: 1

context:
  version: "26.8.1"

package:
  name: flake8-async
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/f/flake8-async/flake8_async-${{ version }}.tar.gz
  sha256: c2d9e7b318169a85d821c8b2e661959481e59db1551626b7471c6e4627c99d9b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - flake8-async=flake8_async:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - libcst >=1.0.1

tests:
  - python:
      imports:
        - flake8_async
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - flake8-async --help

about:
  summary: A linter for Trio code.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/python-trio/flake8-async
  repository: https://github.com/python-trio/flake8-async
  documentation: https://flake8-async.readthedocs.io/

extra:
  recipe-maintainers:
    - jsmolic
