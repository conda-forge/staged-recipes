schema_version: 1

context:
  version: "0.2.1"

package:
  name: detect-installer
  version: ${{ version }}

source:
  url: https://github.com/patrick91/detect-installer/archive/refs/tags/${{ version }}.tar.gz
  sha256: 455e8149515324b60177005a51d0e4f31e517fa8cbc96da52f794dfe476f7a11

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - detect-installer-test = detect_installer._test:main

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.8,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - detect_installer
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - pytest
    script:
      - pytest -vvv tests --ignore=tests/e2e
    files:
      source:
        - tests/

about:
  summary: Detect how a Python package was installed and get the correct upgrade command
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/detect-installer/
  repository: https://github.com/patrick91/detect-installer

extra:
  recipe-maintainers:
    - jsmolic
