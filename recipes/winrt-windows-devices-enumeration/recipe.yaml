context:
  version: "4!10.0.28000.2957"

package:
  name: winrt-windows-devices-enumeration
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/winrt-windows-devices-enumeration/winrt_windows_devices_enumeration-${{ version }}.tar.gz
  sha256: a25e63b02f2d79e451e6a1a3418bfac527ca7525a4473758bb958ab7b6b8313f

build:
  number: 0
  # Pure-Python projection, but it only works on Windows (it needs winrt-runtime).
  skip:
    - not win
    - match(python, "<3.11")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling
    - winrt-table-compiler >=4,<5
  run:
    - python
    - winrt-runtime >=4.0.0,<5
    - winrt-windows-foundation-collections >=${{ version }}
    - winrt-windows-foundation >=${{ version }}
    - winrt-windows-storage-streams >=${{ version }}

tests:
  - python:
      imports:
        - winrt.windows.devices.enumeration
      pip_check: true

about:
  summary: PyWinRT projection of the Windows.Devices.Enumeration namespace
  homepage: https://github.com/pywinrt/pywinrt
  repository: https://github.com/pywinrt/pywinrt
  documentation: https://pywinrt.readthedocs.io
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
