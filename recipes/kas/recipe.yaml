context:
  version: "5.5"

package:
  name: kas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kas/kas-${{ version }}.tar.gz
  sha256: ae6b7be8d4396dabcbbef9f7d4fb3d4516b9f5038920cc7914d86e3ebe2ef687

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - kas = kas.kas:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.5
    - wheel
  run:
    - python >=${{ python_min }}
    - colorlog >=6,<7
    - distro >=1,<2
    - gitpython >=3.1,<4
    - jsonschema >=3.2,<5
    - pyyaml >=3,<7
  extras:
    tui:
      - kconfiglib >=14.1,<15
    verify:
      - python-gnupg >=0.4.0,<1

tests:
  - python:
      imports:
        - kas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - kas --version
      - kas --help

about:
  homepage: https://github.com/siemens/kas
  summary: Setup tool for bitbake based projects
  description: |
    kas provides an easy mechanism to set up bitbake based projects. It
    fetches the required layer repositories, checks them out at the
    configured revisions, generates the bitbake configuration files, and
    launches the bitbake build.
  license: MIT
  license_file: LICENSE
  documentation: https://kas.readthedocs.io/
  repository: https://github.com/siemens/kas

extra:
  recipe-maintainers:
    - baszalmstra
