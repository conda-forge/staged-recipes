schema_version: 1

context:
  version: "2.0.0"

package:
  name: r-fiastemmap
  version: ${{ version }}

source:
  url: https://cran.r-project.org/src/contrib/FIAstemmap_${{ version }}.tar.gz
  sha256: 76a8e6d48eb34324030bfd29d4ad0ace95227dd5bdeebf218094de8b3f2ac61e

build:
  # skip on win since dependency r-gdalraster currently does not build on win
  skip:
    - win
  number: 0
  script: 
    - Rscript -e "stopifnot(file.copy(file.path(R.home('share'), 'licenses', 'MIT'), 'LICENSE-MIT'))"
    - R CMD INSTALL --build .
  merge_build_and_host_envs: true
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  host:
    - r-base
    - r-bit64
    - r-cli
    - r-gdalraster >=2.5.0
    - r-spatstat.explore
    - r-spatstat.geom
  run:
    - r-base
    - r-bit64
    - r-cli
    - r-gdalraster >=2.5.0
    - r-spatstat.explore
    - r-spatstat.geom

tests:
  - script:
      - Rscript -e "library('FIAstemmap')"

about:
  summary: Maps individual tree stem locations on field plots of the Forest Inventory and Analysis Program of USDA Forest Service (<https://research.fs.usda.gov/programs/nfi>). Stem locations are mapped in cartesian coordinate space based on field-measured distance and azimuth from subplot and microplot centers. Per-tree crown widths are estimated using a curated set of allometric equations with coverage for the conterminous US. Spatial descriptors of tree point pattern are computed at the whole plot level. Several stand height metrics are also computed and provided in the output. The spatial
    representation of modeled tree crowns is used to generate estimates of fractional tree canopy cover at the microplot, subplot and whole plot levels. Convenience functions are provided for efficient data processing. Exploratory data analysis is also facilitated via integration with the 'spatstat' packages.
  license: MIT
  license_file:
    - LICENSE
    - LICENSE-MIT
  homepage: https://firelab.github.io/FIAstemmap/
  repository: https://github.com/firelab/FIAstemmap

extra:
  recipe-maintainers:
    - conda-forge/r
    - ctoney
