context:
  version: "1.3.0"

package:
  name: gdar-orbit
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/gdar_orbit/gdar_orbit-${{ version }}.tar.gz
  sha256: 06891c9af38b42c06777189aae1547c90bf0cd50df4418e687edcd1820f98d35

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - gdar-base >=1.3.0
    - quaternion >=2023.0.0
  extras:
    crs:
      - gdar-base[extras=[crs]]
    plotting:
      - matplotlib
      - gdar-base[extras=[plotting]]
    remote:
      - requests
    interactive:
      - ipython
      - gdar-base[extras=[interactive]]

tests:
  - python:
      python_version:
      - ${{ python_min }}.*
      - "*"
      imports:
      - gdar.orbit
      pip_check: true
  - script:
      - python -m pytest tests
    requirements:
      run:
        - pytest
    files:
      source:
        - tests/

about:
  homepage: https://pypi.org/project/gdar-orbit
  summary: 'GDAR-ORBIT -- satellite orbits for GDAR'
  description: |
    Satellite orbit and attitude handling for the GDAR processing framework.
    Part of the OpenGDAR family of packages. See gdar-base for the foundation
    package this builds on and an introduction to the DataRaster abstraction.
  license: Apache-2.0
  license_file: LICENSE-Apache-2.0.txt
  documentation: https://earth-observation-public.pages.norce.dev/gafa-doc

extra:
  recipe-maintainers:
    - avalentino
    - ylarsen
