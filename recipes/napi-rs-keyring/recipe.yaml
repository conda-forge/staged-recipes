schema_version: 1

context:
  version: "1.3.0"

package:
  name: napi-rs-keyring
  version: ${{ version }}

source:
  url: https://github.com/Brooooooklyn/keyring-node/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 349be987e7582e6aa26763b2de96c4cbbd0d3cfba2417d9733524589fdbc275f
  patches:
    # Link the Linux credential store to conda's D-Bus instead of vendoring it.
    - system-dbus.patch

build:
  number: 0
  script:
    - cargo generate-lockfile
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - cargo build --release --locked
    - if: win
      then: node "%RECIPE_DIR%\install.cjs"
      else: node "$RECIPE_DIR/install.cjs"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - if: linux
      then: pkgconf
  host:
    - nodejs >=24
    - if: linux
      then: dbus
  run:
    - nodejs >=24

tests:
  - files:
      recipe:
        - test.cjs
    script:
      - node test.cjs

about:
  homepage: https://github.com/Brooooooklyn/keyring-node
  repository: https://github.com/Brooooooklyn/keyring-node
  summary: Node.js bindings for native operating system credential stores
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - timkpaine
