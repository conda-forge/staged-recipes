schema_version: 1

context:
  version: "1.1.11"

package:
  name: onionpipe
  version: ${{ version }}

source:
  url: https://github.com/cmars/onionpipe/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8ee50b86b00181926fcf0845943dc38290dbec73f81dc4917298b002dcfff6a5
  target_directory: src

build:
  number: 0
  # onionpipe drives a `tor` daemon, which conda-forge does not ship for Windows.
  skip: win
  script:
    - cd src
    - go-licenses save . --save_path ../library_licenses
    - go build -v -o ${PREFIX}/bin/onionpipe -ldflags="-s -w"

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses
  run:
    - tor

tests:
  - script:
      - onionpipe --help
      - onionpipe forward --help
  - package_contents:
      bin:
        - onionpipe
      strict: true

about:
  homepage: https://github.com/cmars/onionpipe
  repository: https://github.com/cmars/onionpipe
  documentation: https://pkg.go.dev/github.com/cmars/onionpipe
  license: MIT
  license_file:
    - src/LICENSE
    - src/ATTRIBUTIONS
    - library_licenses/
  summary: Onion addresses for anything
  description: |
    onionpipe forwards ports on the local host to Tor onion addresses as a
    Tor onion service, and vice versa: forwarding onion services to the local
    host.

    What can you do with onionpipe? Export a local service without a public IP
    address, NAT traversal or DNS registration. Access a local service from
    anywhere, from behind any firewall, with end-to-end encrypted authenticated
    transport, and no third party in the middle.

extra:
  recipe-maintainers:
    - pavelzw
