context:
  version: "0.0.6"

package:
  name: ioregistry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ioregistry/ioregistry-${{ version }}.tar.gz
  sha256: d7187ad5f93276f1ca981f72f8bee74f6bef4754d9a058643d0726b611844f32

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - if: osx
          then: ioregistry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/doronz88/ioregistry
  summary: Python wrapper for the macOS IORegistry
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
