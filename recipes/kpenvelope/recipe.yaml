schema_version: 1

context:
  version: "0.11.0"

package:
  name: kpenvelope
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kpenvelope/kpenvelope-${{ version }}.tar.gz
  sha256: 10f4ecf041ad3821f8418ac1d6447bfce0d26265128fffc782e98f07272f82da

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.22

tests:
  - python:
      imports:
        - kpenvelope
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/kpenvelope
  license: Apache-2.0
  license_file: LICENSE
  summary: "Six-band k.p envelope-function solver for wurtzite heterostructures, self-consistent with Poisson"
  description: |
    Six-band k.p valence-band envelope solver for wurtzite
    heterostructures, self-consistent with the electrostatics of the
    confined hole gas, with cited material parameters, finite barriers and
    a conduction-band Rashba term.
  repository: https://github.com/TaN-MM-Org/kpenvelope
  documentation: https://github.com/TaN-MM-Org/kpenvelope#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
