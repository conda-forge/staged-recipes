schema_version: 1

context:
  version: "0.38.0"

package:
  name: kpenvelope
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kpenvelope/kpenvelope-${{ version }}.tar.gz
  sha256: 7fb5c4c4892161db6cf80c1526697d6877b1fd5c0a30050cf6cb7ed24baf35e7

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.22

tests:
  - python:
      imports:
        - kpenvelope
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/kpenvelope
  license: Apache-2.0
  license_file: LICENSE
  summary: "Nitride semiconductor layers and devices (GaN, AlN, InN and alloys), from interface charge and hole levels to transistor curves"
  description: |
    Started as a solver for the energy levels of holes in thin GaN layers
    (six-band k.p) and now covers the path from a stack of layers to a
    working transistor: interface polarization charge, electron and hole gas
    densities with error bars, fits to measured C-V curves, current in
    diodes and transistors in 1D, 2D and 3D with traps and self-heating, and
    process steps that build the device's shape. Every material number has a
    written source. The device and process parts need SciPy, so install
    scipy as well to use them.
  repository: https://github.com/TaN-MM-Org/kpenvelope
  documentation: https://github.com/TaN-MM-Org/kpenvelope#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
