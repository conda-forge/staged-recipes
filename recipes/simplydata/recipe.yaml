schema_version: 1

context:
  name: simplydata
  version: "0.2.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: cae822e81af30adeac7ab90cfcf938dcb1e4ceeb52b28bbec5db9e306f4d0d72

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.26
    - pip
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.7
    - seaborn-base >=0.13
    - pandas >=2.0
    - numpy >=1.24
    - scipy >=1.16
    - statsmodels >=0.14
    - openpyxl >=3.1
    - narwhals >=2.0

tests:
  - python:
      imports:
        - simplydata
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      env:
        MPLBACKEND: Agg
      content:
        - python -c "import simplydata as sdata; print(sdata.numbers([1, 2, 3]).find_average())"

about:
  homepage: https://github.com/bioforkgithub/simplydata
  license: MIT
  license_file: LICENSE
  summary: "Learn basic Python, and simplydata takes you from your first table to publication-ready statistics, in plain words, with every number checked against the field's standard tools."
  description: |
    simplydata gives plain-English names for data cleaning, tables, charts and
    statistics. Each word calls the matching function in pandas, Polars, NumPy,
    SciPy, statsmodels, matplotlib or seaborn underneath, so learners can move
    to the parent packages later.
  repository: https://github.com/bioforkgithub/simplydata
  documentation: https://github.com/bioforkgithub/simplydata/blob/main/docs/manual/simplydata_manual.pdf

extra:
  recipe-maintainers:
    - bioforkgithub
