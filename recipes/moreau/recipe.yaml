schema_version: 1

context:
  version: "0.4.1"
  build_number: 0
  cuda: ${{ cuda_compiler_version != "None" }}
  string_prefix: ${{ "cuda" ~ (cuda_compiler_version | replace(".", "")) if cuda_compiler_version != "None" else "cpu" }}
  # nanobind's stable ABI requires Python 3.12+, so the CUDA runtime is built against 3.12
  abi3_min: ${{ "3.12" if cuda_compiler_version != "None" else python_min }}

recipe:
  name: moreau-split
  version: ${{ version }}

source:
  url: https://github.com/moreau-project/moreau/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ec2f62ee50538c46526622d560a5663b16d0c0137647a8a634afe2fb6381d0ab

build:
  number: ${{ build_number }}

outputs:
  - package:
      name: moreau-runtime
    build:
      string: ${{ string_prefix }}_h${{ hash }}_${{ build_number }}
      skip:
        - win
        - is_abi3 and not match(python, abi3_min ~ ".*")
      python:
        version_independent: ${{ is_abi3 }}
      script:
        # cmake-rs passes --target to clang, which then picks the system ld instead of conda's
        - if: osx
          then: export LDFLAGS="$LDFLAGS --ld-path=$BUILD_PREFIX/bin/$LD"
        - cd packages/moreau-cpu
        - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
        - if: cuda
          then:
            - cd ../moreau-cuda
            # PyPI-only CUDA wheels and the moreau front end are provided by conda packages
            - sed -i '/"moreau==/d; /"nvidia-cudss/d; /"cuda-toolkit/d' pyproject.toml
            - export CUDSS_ROOT=$PREFIX
            - export CMAKE_ARGS="$CMAKE_ARGS -DMOREAU_BUILD_TESTS=OFF -DMOREAU_BUILD_EXAMPLES=OFF"
            - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('rust') }}
        - ${{ stdlib('c') }}
        - if: cuda
          then:
            - ${{ compiler('cuda') }}
        - cargo-bundle-licenses
        - cmake
        - make
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - maturin >=1.0,<2.0
      host:
        - python
        - if: is_abi3
          then:
            - python-abi3
        - pip
        - maturin >=1.0,<2.0
        - if: cuda
          then:
            - scikit-build-core >=0.5
            - nanobind >=2.11.0
            - cuda-version ${{ cuda_compiler_version }}.*
            - cuda-cudart-dev
            - libcublas-dev
            - libcusparse-dev
            - libcusolver-dev
            - libcudss-dev >=0.7.1,<0.8
      run:
        - python
        - numpy >=1.19.0
        - scipy >=1.6.0
        - if: cuda
          then:
            - __cuda
            # cuDSS config enum values shift between minor versions
            - libcudss >=0.7.1,<0.8
    tests:
      - python:
          imports:
            - moreau_cpu
          pip_check: true
          python_version:
            - if: is_abi3
              then: ${{ abi3_min }}.*
            - "*"
      - if: is_abi3
        then:
          requirements:
            run:
              - abi3audit
          script:
            - abi3audit $SP_DIR/moreau_cpu/_cpu_solver.abi3.so -s -v --assume-minimum-abi3 ${{ abi3_min }}
            - if: cuda
              then: abi3audit $SP_DIR/moreau_cuda/_moreau_cuda.abi3.so -s -v --assume-minimum-abi3 ${{ abi3_min }}
      # the noarch front end is built in one job only, so test it against each backend from source here
      - script:
          - export PYTHONPATH=packages/moreau/python
          - python -c "import moreau"
          - python test_solve.py
          # backend entry points that fail to load are swallowed, so assert registration explicitly
          - if: cuda
            then: python -c "import moreau; assert moreau.device_available('cuda'), moreau.device_error('cuda')"
        files:
          source:
            - packages/moreau/python/
          recipe:
            - test_solve.py
        requirements:
          run:
            - pydantic >=2.0.0
    about:
      summary: Compiled CPU and optional CUDA backends for moreau
      license: Apache-2.0 AND BSD-3-Clause AND MIT
      license_file:
        - packages/moreau-cpu/LICENSE
        - packages/moreau-cpu/NOTICE
        - packages/moreau-cpu/THIRDPARTY.yml
        - if: cuda
          then:
            - nanobind-LICENSE
            - robin-map-LICENSE

  - package:
      name: moreau
    build:
      noarch: python
      # built in one job; the runtime tests cover it against every backend
      skip: not (target_platform == "linux-64" and cuda_compiler_version == "None")
      script:
        - ${{ PYTHON }} -m pip install ./packages/moreau -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - hatchling
      run:
        - python >=${{ python_min }}
        - moreau-runtime ==${{ version }}
        - numpy >=1.19.0
        - pydantic >=2.0.0
    tests:
      - python:
          imports:
            - moreau
          pip_check: true
          python_version:
            - ${{ abi3_min }}.*
            - "*"
      - script:
          - python test_solve.py
        files:
          recipe:
            - test_solve.py
        requirements:
          run:
            - python ${{ abi3_min }}.*
    about:
      summary: "Moreau: conic optimization solver with CPU and optional GPU backends"
      license: Apache-2.0
      license_file:
        - packages/moreau/LICENSE
        - packages/moreau/NOTICE

  - package:
      name: ${{ "moreau-gpu" if cuda else "moreau-cpu" }}
    build:
      string: ${{ string_prefix }}_h${{ hash }}_${{ build_number }}
      skip:
        - win
    requirements:
      run:
        # not pin_subpackage: moreau is only built in the linux-64 CPU job
        - moreau ==${{ version }}
        - moreau-runtime ==${{ version }} ${{ "cuda" if cuda else "cpu" }}*
    about:
      summary: Metapackage selecting the ${{ "CUDA" if cuda else "CPU" }} build of moreau
      license: Apache-2.0
      license_file:
        - LICENSE

about:
  homepage: https://moreau.so
  repository: https://github.com/moreau-project/moreau
  documentation: https://moreau.so
  summary: GPU-native, batched, differentiable conic optimization
  description: |
    Moreau solves quadratic cone programs with a Rust CPU backend and a
    C++/CUDA GPU backend behind one Python API, with support for batching
    and differentiation through the solution.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  feedstock-name: moreau
  recipe-maintainers:
    - timkpaine
