schema_version: 1

context:
  version: "0.2.4"

package:
  name: pyccapt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyccapt/pyccapt-${{ version }}.tar.gz
  sha256: 58cf0f0985d42889d3f547f6b58e23e84155c7731801e4f9add126e4632cf431

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyccapt = pyccapt.control.__main__:main
      - pyccapt-data = pyccapt.control.core.data_integrity:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=69
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - h5py
    - matplotlib-base
    - numpy
    - pandas
    - scipy
    - pytables

tests:
  - python:
      imports:
        - pyccapt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Open-source atom probe control, calibration, and reconstruction.
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/mmonajem/pyccapt

extra:
  recipe-maintainers:
    - jan-janssen
