schema_version: 1

context:
  version: "0.1.0"

package:
  name: lsst-desc-dsf
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/l/lsst-desc-dsf/lsst_desc_dsf-${{ version }}.tar.gz
  sha256: 88cfab171774b94e757c1d82440effdadf034e81dd0140f51c08b19330ebf471

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - matplotlib-base
    - pyyaml
    - pyccl
    - astropy-base
    - pybinny >=0.6.0
    - derivkit
    - cmasher
    - getdist
    - tqdm
    - camb

tests:
  - python:
      imports:
        - dsf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Delta Sigma forecasting tools for LSST DESC galaxy-galaxy lensing analyses.
  license: MIT
  license_file: LICENSE
  homepage: https://lsstdesc.org/dsf/
  repository: https://github.com/LSSTDESC/dsf
  documentation: https://lsstdesc.org/dsf/

extra:
  recipe-maintainers:
    - lonbar
