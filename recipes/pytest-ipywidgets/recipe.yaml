schema_version: 1

context:
  version: "1.64.0"

package:
  name: pytest-ipywidgets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-ipywidgets/pytest_ipywidgets-${{ version }}.tar.gz
  sha256: 7e8856236bf13248d76efbc327218c1b770dfae8659f8304702344f31122fe83

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling ==1.26.3
    - pip
  run:
    - python >=${{ python_min }}
    - solara-ui ==1.64.0
    - solara-server ==1.64.0
    - pytest
    - playwright
    - pytest-playwright
    - pillow
    - pixelmatch

tests:
  - python:
      imports:
        - pytest_ipywidgets
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Test ipywidgets with playwright and pytest.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pytest-ipywidgets/
  documentation: https://solara.dev

extra:
  recipe-maintainers:
    - jan-janssen
