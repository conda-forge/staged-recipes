schema_version: 1

context:
  name: rosetta-soil
  version: "0.3.2"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/rosetta_soil-${{ version }}.tar.gz
  sha256: d3490ca70f8bbaa235902d5adf53b7db559a71514c10ae8d5e58969f855c2d28

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - numpy

tests:
  - python:
      python_version: ${{ python_min}}.*
      imports:
        - rosetta_soil
        - pytest
      pip_check: true
      script:
        pytest -v tests/

about:
  summary: Predict soil hydraulic parameters from basic soil properties.
  license: Unlicense
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rfiorella
