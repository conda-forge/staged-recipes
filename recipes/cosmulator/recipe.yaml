context:
  version: "0.0.35"

package:
  name: cosmulator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cosmulator/cosmulator-${{ version }}.tar.gz
  sha256: 3e7eacd7e033f9acc365c3dcde30f2adaf38c02e1d6d8d1bd2291d20ef5f5ee7

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - requests

tests:
  - python:
      imports:
        - cosmulator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/DilyOng/cosmulator
  summary: Train, validate and serve machine-learning emulators of posterior distributions
  description: |
    cosmulator trains, validates and serves normalising-flow emulators of
    posterior distributions. The training stack (JAX, flowjax, equinox, optax)
    and hyperparameter optimisation (optuna) are optional extras, so the core
    package installs and imports without them.
  license: MIT
  license_file: LICENSE
  documentation: https://cosmulator.readthedocs.io
  repository: https://github.com/DilyOng/cosmulator

extra:
  recipe-maintainers:
    - DilyOng
