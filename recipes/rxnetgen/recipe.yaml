context:
  version: "0.0.1"
  python_min: "3.12"

package:
  name: rxnetgen
  version: ${{ version }}

source:
  url: https://github.com/LiuGaoyong/RXNetGen/releases/download/v${{ version }}/rxnetgen-${{ version }}.tar.gz
  sha256: 0f21e7ec5cf5023602ca6107e14a41ca331fd0beec5ec6a0e76444a344704572

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - ase >=3.20
    - arrayff >=0.0.1
    - graphatoms >=3.0
    - hydra-core >=1.3
    - loguru >=0.7.3
    - omegaconf >=2.3.1
    - ray-default >=2.52
    - sqlalchemy = >=1
    - sqlmodel = >=0
    - typer = >=0.20
    - typing-extensions = >=4.12

tests:
  - python:
      imports:
        - rxnetgen
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/LiuGaoyong/RXNetGen
  summary: The reaction network generator & event table exploration.
  description: |
    The reaction network generator & event table exploration.
  license: GPL-3.0-or-later
  license_file: src/LICENSE
  repository: https://github.com/LiuGaoyong/RXNetGen

extra:
  recipe-maintainers:
    - LiuGaoyong
