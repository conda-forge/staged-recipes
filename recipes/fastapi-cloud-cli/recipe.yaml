schema_version: 1

context:
  version: "0.28.0"

package:
  name: fastapi-cloud-cli
  version: ${{ version }}

source:
  url: https://github.com/fastapilabs/fastapi-cloud-cli/archive/refs/tags/${{ version }}.tar.gz
  sha256: 813996daab417569e0e86abeb0b09cf3b43483aa03393d8adc366bd2da7191f9

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - typer >=0.26.1
    - uvicorn >=0.17.6
    - rignore >=0.5.1
    - httpx >=0.27.0
    - rich-toolkit >=0.20.6
    - if: match(python, "<3.13")
      then: pydantic >=2.7.4
    - if: match(python, "==3.13")
      then: pydantic >=2.8.0
    - if: match(python, ">=3.14")
      then: pydantic >=2.12.0
    - sentry-sdk >=2.20.0
    - fastar >=0.10.0
    - detect-installer >=0.1.0
    - agent-detector >=1.1.0

tests:
  - python:
      imports:
        - fastapi_cloud_cli
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - pytest
        - coverage
        - respx
        - time-machine
        - scripts
        - inline-snapshot
    script:
      - touch scripts/__init__.py
      - pytest -vvv tests/
    files:
      source:
        - tests/
        - scripts/

about:
  summary: Deploy and manage FastAPI Cloud apps from the command line 🚀
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/fastapilabs/fastapi-cloud-cli
  documentation: https://fastapi.tiangolo.com/fastapi-cloud-cli/

extra:
  recipe-maintainers:
    - jsmolic
