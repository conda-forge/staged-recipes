context:
  name: diffpy.cmirietveld
  version: "0.1.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/diffpy_cmirietveld/diffpy_cmirietveld-${{ version }}.tar.gz
  sha256: 9e7b781726cc83ed185f0e055fb8cdc1fdfec8874f6a93cfd43d218b04f82ec7

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - diffpy-cmirietveld = diffpy.cmirietveld.cmirietveld_app:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-git-versioning >=2.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - diffpy.srfit >=3.4.0
    - diffpy.cmistructure
    - pyobjcryst >2026.1.0
    - matplotlib-base
    - bg-mpl-stylesheets
    - pybaselines

tests:
  - python:
      imports:
        - diffpy.cmirietveld
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - scipy
        - diffpy.structure
    script:
      - diffpy-cmirietveld --version
      - pytest

about:
  homepage: https://github.com/diffpy/diffpy.cmirietveld/
  summary: A pack for diffpy.cmi that allows it to do Rietveld refinement of powder diffraction data
  description: |
    A pack for diffpy.cmi that allows it to do Rietveld refinement of
    powder diffraction data.
  license: BSD-3-Clause
  license_file: LICENSE.rst
  documentation: https://www.diffpy.org/diffpy.cmirietveld/
  repository: https://github.com/diffpy/diffpy.cmirietveld/

extra:
  recipe-maintainers:
    - sbillinge
    - cadenmyers13
