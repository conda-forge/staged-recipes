# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ag_ui_adk
  version: "0.6.0"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ag_ui_adk/ag_ui_adk-${{ version }}.tar.gz
  sha256: 7255d98f51024d7a1b42057bd76e088e0aefec0d2906496af9afe2e1fcb1207c

build:
  number: 0
  noarch: python
  script:
    - "python -c \"lines=open('pyproject.toml').readlines(); lines=[l for l in lines if 'asyncio>=3.4.3' not in l]; open('pyproject.toml','w').writelines(lines)\""
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.8.0,<0.11
  run:
    - python >=${{ python_min }}
    - ag-ui-protocol
    - aiohttp
    - fastapi
    - google-adk >=1.16.0,<2.0.0
    - pydantic
    - uvicorn

tests:
  - python:
      imports:
        - ag_ui_adk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ag-ui-protocol/ag-ui/tree/main/integrations/adk-middleware/python
  license: MIT
  license_file: LICENSE
  summary: ADK Middleware for AG-UI Protocol
  repository: https://github.com/ag-ui-protocol/ag-ui/tree/main/integrations/adk-middleware/python

extra:
  recipe-maintainers:
    - rxm7706
    - pb01ka
