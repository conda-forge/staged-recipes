# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.0"

package:
  name: ag_ui_adk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ag_ui_adk/ag_ui_adk-${{ version }}.tar.gz
  sha256: e27a3d9f2182d44b88964756beaf0c89f75c32d8e0d44077e414d1cae5fd988f

build:
  number: 0
  noarch: python
  script:
    - "python -c \"lines=open('pyproject.toml').readlines(); lines=[l for l in lines if 'asyncio>=3.4.3' not in l]; open('pyproject.toml','w').writelines(lines)\""
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.8.0,<0.11
  run:
    - python >=${{ python_min }}
    - ag-ui-protocol
    - ag-ui-a2ui-toolkit >=0.0.5
    - a2ui-agent-sdk >=0.9.0,<0.10.0
    - a2ui-core >=0.4.0,<0.5.0
    - aiohttp
    - fastapi
    - google-adk >=1.16.0,<2.0.0
    - pydantic
    - uvicorn

tests:
  - python:
      imports:
        - ag_ui_adk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ag-ui-protocol/ag-ui/tree/main/integrations/adk-middleware/python
  license: MIT
  license_file: LICENSE
  summary: ADK Middleware for AG-UI Protocol
  description: |
    Middleware that bridges agents built with Google's Agent Development Kit
    (ADK) to the AG-UI protocol, translating ADK's session and event model
    into AG-UI's streaming event format (and vice versa) so ADK-based agents
    can be served to AG-UI-compatible frontends.
  repository: https://github.com/ag-ui-protocol/ag-ui/tree/main/integrations/adk-middleware/python

extra:
  recipe-maintainers:
    - rxm7706
    - pb01ka
