schema_version: 1

context:
  version: "0.13.0"

package:
  name: taskiq
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/taskiq/taskiq-${{ version }}.tar.gz
  sha256: 7d56609a6c5a20b0c9da67e9f310ec9640266f620b8f81880bccd5f16913e687

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - versioningit
  run:
    - python >=${{ python_min }}
    - aiohttp >=3
    - anyio >=4
    - pycron >=3.0.0
    - pydantic >=2.5,<3.0
    - taskiq-dependencies >=1.3.1,<2

tests:
  - python:
      imports:
        - taskiq
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m taskiq --help

about:
  homepage: https://taskiq-python.github.io/
  summary: Distributed task queue with full async support
  description: |
    Taskiq is an asynchronous distributed task queue for Python, inspired by
    Celery and Dramatiq. It can send and run both sync and async functions,
    and integrates with async frameworks such as FastAPI and AioHTTP.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/taskiq-python/taskiq
  documentation: https://taskiq-python.github.io/

extra:
  recipe-maintainers:
    - pb01ka
