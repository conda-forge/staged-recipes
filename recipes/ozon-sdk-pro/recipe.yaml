context:
  version: "1.0.0"

package:
  name: ozon-sdk-pro
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/ozon-sdk-pro/ozon_sdk_pro-${{ version }}.tar.gz
  sha256: 4707f81b6cfd96b201c99ab9d1954b81daa30c62ae7e0a64ed8d06e8315f3312

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ozon-parser = ozon_parser.cli:main
      - ozon-sdk = ozon_parser.cli:main
      - ozon-gui = ozon_parser.gui:main_gui
      - ozon-mcp = ozon_parser.mcp_server:main_mcp

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx >=0.27.0
    - h2
    - openpyxl >=3.1.0
    - requests >=2.31.0
    - tomli >=2.0.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - ozon_parser
      pip_check: true
  - script:
      - ozon-parser --help
      - ozon-sdk --help
      - ozon-mcp --help
      - 'python -c "import ozon_parser; assert ozon_parser.__version__ == ''${{ version }}''"'

about:
  homepage: https://github.com/eminsk/ozon_parser
  summary: All-in-One Ozon Sync/Async SDK, CLI, Native MCP Server, Free/Paid AI & Desktop GUI
  description: |
    Ozon SDK Pro (`ozon-sdk-pro` / `ozon_parser`) provides a pure-Python Sync/Async
    client for Ozon product, category, seller INN, and buyer review extraction via Composer API,
    SQLite price and search rank trackers, Smart Review Analyzer with Offline NLP, Free zero-key
    AI (`g4f`/Ollama) and Paid LLMs, CLI, 9-tool MCP Server, and optional CustomTkinter GUI.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/ozon_parser
  documentation: https://github.com/eminsk/ozon_parser#readme

extra:
  recipe-maintainers:
    - eminsk
