schema_version: 1

context:
  version: "5.9.2"

package:
  name: yubikey-manager
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/y/yubikey-manager/yubikey_manager-${{ version }}.tar.gz
  sha256: 9584c7377449e6487140da6c3f13a289e618b0023c8414be91c1c212fce3c473

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ykman = ykman._cli.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=2.0
    - pip
  run:
    - python >=${{ python_min }}
    - cryptography >=3.0,<52
    - pyscard >=2.0,<3
    - fido2 >=2.0,<3
    - click >=8.0,<9
    - keyring >=23.4,<26
    - python-pskc >=1.3,<2
    - pywin32-on-windows

tests:
  - python:
      imports:
        - ykman
        - yubikit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - ykman --help
      - ykman --version

about:
  summary: Library and CLI for managing your YubiKey configuration.
  description: |
    Python library and command line tool for configuring a YubiKey over all
    transport modes (OTP, FIDO, PIV, OpenPGP, OATH).
  license: BSD-2-Clause
  license_file: COPYING
  homepage: https://developers.yubico.com/yubikey-manager/
  repository: https://github.com/Yubico/yubikey-manager
  documentation: https://docs.yubico.com/software/yubikey/tools/ykman/

extra:
  recipe-maintainers:
    - pavelzw
