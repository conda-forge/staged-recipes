context:
  version: "0.5.1"
  python_min: "3.9"

package:
  name: geoopt
  version: ${{ version }}

source:
  # no sdist on PyPI
  url: https://github.com/geoopt/geoopt/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d84d0bed6a2eccfa285fcde428aabd390bd40c7c6e724c4c9fe5b1022e88565f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - pytorch >=2.0.1
    - numpy
    - scipy

tests:
  - python:
      imports:
        - geoopt
        - geoopt.manifolds
        - geoopt.optim
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/geoopt/geoopt
  repository: https://github.com/geoopt/geoopt
  documentation: https://geoopt.readthedocs.io/en/latest/
  summary: Riemannian adaptive optimization methods with PyTorch
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - vivekbhr
