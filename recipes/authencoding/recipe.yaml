schema_version: 1

context:
  version: "6.1"

package:
  name: authencoding
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/authencoding/authencoding-${{ version }}.tar.gz
  sha256: ff621bf718119d55b4794f7608b2dede37573ae7c6415c2e457e74c09d87f1e9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1,<82
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - AuthEncoding
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "from AuthEncoding import pw_encrypt, pw_validate; h = pw_encrypt('secret'); assert pw_validate(h, 'secret'); assert not pw_validate(h, 'wrong')"

about:
  homepage: https://github.com/zopefoundation/AuthEncoding
  repository: https://github.com/zopefoundation/AuthEncoding
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt
  summary: Framework for handling LDAP style password hashes.
  description: |
    AuthEncoding provides a framework for handling LDAP-style password
    hashes. It supports the SSHA, SHA256, SHA, MYSQL and CRYPT schemes,
    allows new schemes to be registered, and offers constant-time
    comparison helpers. It is used by Zope and Plone for password storage.

extra:
  recipe-maintainers:
    - killua156
