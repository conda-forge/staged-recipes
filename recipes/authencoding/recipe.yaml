schema_version: 1

context:
  version: "6.1"

package:
  name: authencoding
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/authencoding/authencoding-${{ version }}.tar.gz
  sha256: ff621bf718119d55b4794f7608b2dede37573ae7c6415c2e457e74c09d87f1e9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - AuthEncoding
        - AuthEncoding.AuthEncoding
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - pytest -v --pyargs AuthEncoding
    requirements:
      run:
        - pytest

about:
  homepage: https://github.com/zopefoundation/AuthEncoding
  repository: https://github.com/zopefoundation/AuthEncoding
  summary: Framework for handling LDAP style password hashes
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
