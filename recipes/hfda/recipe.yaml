schema_version: 1

context:
  version: "0.1.1"

package:
  name: hfda
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/h/hfda/hfda-${{ version }}.tar.gz
  sha256: 6337cc0c117093c4dcf8d1d17be4e53c6975556979bc6ed3fcf3986cbcb71a74

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6

tests:
  - python:
      imports:
        - hfda
      pip_check: false

about:
  homepage: https://github.com/hiroki-kojima/HFDA
  license: MIT
  license_file: LICENSE
  summary: Higuchi Fractal Dimension Analysis

extra:
  recipe-maintainers:
    - futro
