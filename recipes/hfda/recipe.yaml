schema_version: 1

context:
  version: "0.1.1"
  python_min: "3.6"

package:
  name: hfda
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/h/hfda/hfda-${{ version }}.tar.gz
    sha256: 6337cc0c117093c4dcf8d1d17be4e53c6975556979bc6ed3fcf3986cbcb71a74
  - url: https://raw.githubusercontent.com/hiroki-kojima/HFDA/main/LICENSE
    sha256: d5558cd419c8d46bdc958064cb97f963d1ea793866414c025906ec15033512ed
    file_name: LICENSE

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hfda
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hiroki-kojima/HFDA
  license: MIT
  license_file: LICENSE
  summary: Higuchi Fractal Dimension Analysis

extra:
  recipe-maintainers:
    - f-utro