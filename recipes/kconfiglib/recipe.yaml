context:
  version: "14.1.0"

package:
  name: kconfiglib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kconfiglib/kconfiglib-${{ version }}.tar.gz
  sha256: bed2cc2216f538eca4255a83a4588d8823563cdd50114f86cf1a2674e602c93c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - menuconfig = menuconfig:_main
      - guiconfig = guiconfig:_main
      - genconfig = genconfig:main
      - oldconfig = oldconfig:_main
      - olddefconfig = olddefconfig:main
      - savedefconfig = savedefconfig:main
      - defconfig = defconfig:main
      - alldefconfig = alldefconfig:main
      - allnoconfig = allnoconfig:main
      - allmodconfig = allmodconfig:main
      - allyesconfig = allyesconfig:main
      - listnewconfig = listnewconfig:main
      - setconfig = setconfig:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - kconfiglib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - genconfig --help
      - setconfig --help

about:
  homepage: https://github.com/ulfalizer/Kconfiglib
  summary: A flexible Python Kconfig implementation
  description: |
    Kconfiglib is a Kconfig implementation in Python. It parses Kconfig
    files and provides an API for reading and writing configurations, along
    with menuconfig-style tools for configuring Kconfig-based projects.
  license: ISC
  license_file: LICENSE.txt
  repository: https://github.com/ulfalizer/Kconfiglib

extra:
  recipe-maintainers:
    - baszalmstra
