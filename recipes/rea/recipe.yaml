schema_version: 1

context:
  name: rea-agents
  version: 6.8.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/${{ name }}/-/${{ name }}-${{ version }}.tgz
  sha256: 8d542ec76a9cb350584b60a6c9c088706ff812d5bb5b094c20c95b6dc25698bb

build:
  number: 0
  # The tarball bundles only a win32-x64 native addon
  skip:
    - target_platform == "win-arm64"

requirements:
  build:
    - nodejs
  host:
    - nodejs
  run:
    - nodejs >=22.23.4,<23.0a0 | >=24.22.1,<25.0a0 | >=26.12.1
    # README: static JS/Electron analysis on Linux needs a procps-compatible `ps`
    - if: linux
      then: procps-ng

tests:
  - script:
      - rea --help
      - rea-agents --help

about:
  homepage: https://rea.tools
  repository: https://github.com/morluto/rea
  summary: Reverse engineer anything from your terminal or agent with one CLI and MCP server.
  description: |
    REA connects agents (via MCP) and the terminal to tools for inspecting
    native binaries, JavaScript/Electron apps, .NET assemblies, Android APKs
    and websites. Native analysis uses an existing Hopper, Ghidra or IDA
    installation, which is not installed by this package.
  license: MIT
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
    - licenses/

extra:
  recipe-maintainers:
    - jsmolic
