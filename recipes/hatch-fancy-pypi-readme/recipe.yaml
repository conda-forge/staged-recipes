schema_version: 1

context:
  version: "25.1.0"

package:
  name: hatch-fancy-pypi-readme
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hatch-fancy-pypi-readme/hatch_fancy_pypi_readme-${{ version }}.tar.gz
  sha256: 9c58ed3dff90d51f43414ce37009ad1d5b0f08ffc9fc216998a06380f01c0045

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - hatch-fancy-pypi-readme = hatch_fancy_pypi_readme.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - hatchling

tests:
  - python:
      imports:
        - hatch_fancy_pypi_readme
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - hatch-fancy-pypi-readme --help

about:
  summary: Fancy PyPI READMEs with Hatch
  license: MIT
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/hatch-fancy-pypi-readme/
  documentation: https://github.com/hynek/hatch-fancy-pypi-readme

extra:
  recipe-maintainers:
    - jan-janssen
