# lfric-env -- the LFRic Stage-1 environment, as a single metapackage.
#
# LFRic (Met Office / NERC next-generation weather & climate model) is delivered
# in two stages:
#
#   Stage 1  the ENVIRONMENT: compilers, MPI, parallel netCDF/HDF5, XIOS, yaxt,
#            PSyclone, rose/cylc, ... -- everything a science workflow builds and
#            runs against.
#   Stage 2  a scientist brings LFRic Fortran source and drives it with cylc/rose
#            to compile and run a suite.
#
# Stage 1 is currently delivered on HPC by Spack, as the `lfric-apps-isambard`
# bundle plus an Lmod modulefile:
#
#     module load lfric-env/<version>/<variant>
#
# This metapackage is the conda counterpart of BOTH halves of that -- the bundle's
# dependency list (`requirements/run` below) and the modulefile's exports (the
# activate.d script) -- so that
#
#     conda activate <env-with-lfric-env-installed>
#
# leaves a user in the same place, and Stage 2 cannot tell which mechanism got
# them there. The per-package and per-variable audit of that claim lives in
# ickc/lfric-conda's docs/stage1-parity.md; the two intended differences are the
# Cray/Slingshot MPI stack (no conda analogue by design -- this corresponds to the
# Spack repo's portable `spack` variant, not its `cray` one) and `foxml` (dropped
# as vestigial: nothing in lfric_core or lfric_apps references it).
#
# Every dependency below is either already on conda-forge or is one of the other
# recipes in this same PR. `yaxt` is the one that needed upstream work first: its
# Xt_int index type defaults to 32-bit, while LFRic's halo index is 64-bit, so
# this environment requires the `--with-idxtype=long` build added in
# conda-forge/yaxt-feedstock#6 -- hence the `*_idxtype_long_*` build-string pin.
# Solving onto the default 32-bit yaxt is not a clean link error, it is a silent
# ABI mismatch, which is exactly why that pin is spelled out here.
schema_version: 1

context:
  # Tracks the LFRic release this environment is the Stage-1 counterpart of
  # (lfric_apps vn3.2 / lfric_core vn3.2), not the version of any one dependency.
  version: "2026.07.1"

package:
  name: lfric-env
  version: ${{ version }}

build:
  number: 0
  script: build.sh
  # The MPI flavour is part of what this environment IS -- it pins mpi_${mpi}_*
  # builds of hdf5/libnetcdf/netcdf-fortran/yaxt/xios/pfunit, which are mutually
  # exclusive. Encode it in the build string, the same convention those packages
  # use, so `lfric-env * mpi_mpich_*` is expressible.
  string: mpi_${{ mpi }}_${{ hash }}_${{ build_number }}
  # mpich/openmpi are not built for win-64 on conda-forge, and the LFRic build
  # system is a Unix-only make/FCM/Fab stack besides.
  skip:
    - win

requirements:
  # No build/host section on purpose: this package ships no compiled artefact,
  # only its dependency closure and the activation contract. It is NOT noarch --
  # the run list pins MPI-flavoured builds, and the build string carries the MPI
  # variant.
  run:
    # --- toolchain ----------------------------------------------------------
    # The environment ships its own compilers rather than assuming the host has
    # them -- that is the whole point of Stage 1 being self-contained, and it is
    # a stronger position than the Spack side, which declares the system gcc as
    # an external.
    #
    # These are the conda-forge compiler METAPACKAGES, deliberately unpinned:
    # they resolve to whatever generation conda-forge currently builds its
    # Fortran stack with, which is the only generation that can read the .mod
    # files shipped by netcdf-fortran / xios / yaxt / shumlib. Pinning a specific
    # gcc here (the Spack env uses 14.3) would eventually contradict that.
    - c-compiler
    - cxx-compiler
    - fortran-compiler
    # --- MPI + parallel I/O -------------------------------------------------
    - ${{ mpi }}
    - hdf5 * mpi_${{ mpi }}_*
    - libnetcdf * mpi_${{ mpi }}_*
    - netcdf-fortran * mpi_${{ mpi }}_*
    # 64-bit Xt_int. See the header comment -- this is an ABI requirement, not a
    # preference.
    - yaxt * mpi_${{ mpi }}_idxtype_long_*
    # --- build tooling ------------------------------------------------------
    - make
    - cmake
    - pkg-config
    - python
    # --- LFRic build-time python -------------------------------------------
    # PSyclone >= 3.3 is a hard floor, not a preference: LFRic vn3.2's
    # optimisation scripts import OMPParallelTrans from psyclone.psyir
    # .transformations unguarded, and it only moved there in 3.3. 3.3.1 is what
    # the Met Office runs for this release.
    - psyclone >=3.3.1,<4
    - fparser
    # Fab, LFRic's newer build system. Not in the Spack bundle (which predates
    # it); LFRic's build shells out to it, so it belongs in the environment.
    - sci-fab
    - jinja2
    - pyyaml
    - sympy
    # --- workflow tooling ---------------------------------------------------
    # cylc-uiserver (the Jupyter web GUI) is deliberately absent: it is not
    # needed to build or run a suite on HPC, and the Spack bundle omits it too.
    - metomi-rose
    - cylc-flow
    - cylc-rose
    - ansimarkup
    - colorama
    # --- packaged alongside this recipe (same PR) ---------------------------
    - xios * mpi_${{ mpi }}_*
    # Redundant on paper -- blitzpp's run_exports already reaches here through
    # xios -- but listed because this is an environment CONTRACT, not a solve:
    # libxios.a is a STATIC archive that references -lblitz, so a user compiling
    # their own XIOS-linked code needs blitz's headers and library in the prefix
    # in their own right, not merely as somebody else's transitive pin.
    - blitzpp
    - rose-picker
    - shumlib
    # The unit-test tier. Not needed to build or run an application, but the
    # Spack bundle carries it (pfunit+mpi), so the parity environment does too.
    - pfunit * mpi_${{ mpi }}_*
    - gftl
    - gftl-shared
    - fargparse

tests:
  # This is the real test of a metapackage: install it, and check that what a
  # user gets is a working LFRic toolchain -- the activation contract applied,
  # the tools on PATH, and (the load-bearing one) the shipped Fortran modules
  # readable by the environment's own gfortran. Modules can only be read by the
  # compiler generation that wrote them, so `use xios` + `use yaxt` compiling is
  # what proves conda-forge's Fortran stack and the packages built here agree on
  # one compiler.
  - script:
      - bash test_lfric_env.sh
    files:
      recipe:
        - test_lfric_env.sh
        - test_lfric_env.f90

about:
  homepage: https://www.metoffice.gov.uk/research/approach/modelling-systems/lfric
  repository: https://github.com/ickc/lfric-conda
  documentation: https://github.com/ickc/lfric-conda/blob/main/docs/stage1-parity.md
  summary: LFRic Stage-1 environment (metapackage)
  description: |
    Installing this package gives you the LFRic Stage-1 environment: the
    compilers, MPI, parallel netCDF/HDF5, XIOS, yaxt, shumlib, PSyclone, Fab and
    rose/cylc that Met Office LFRic science workflows build and run against, plus
    an activation script that exports the handful of variables LFRic's build
    system requires to be spelled a particular way (FC=mpif90, CXX=mpic++,
    SHUMLIB_ROOT, ...).

    It is the conda counterpart of the Spack `lfric-apps-isambard` bundle and its
    `lfric-env` modulefile, so that `conda activate` and `module load lfric-env`
    put a user in the same place.

    This package contains no source of its own -- it is a metapackage plus an
    activation contract.
  # This recipe (dependency list + activation script) is original packaging work,
  # licensed as the ickc/lfric-conda repository it comes from. Each package it
  # depends on carries its own upstream licence.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ickc
