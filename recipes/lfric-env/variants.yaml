# mpich is the MPI LFRic documents and the one this environment is built and
# tested against. openmpi can be added later on the feedstock, once every
# MPI-dependent package pinned below publishes an openmpi build.
mpi:
  - mpich

# --- mpich generation -------------------------------------------------------
#
# conda-forge's BASE pinning is still `mpich: 4`, but the `mpich5` migration is
# under way and the dependencies this environment pins have already crossed:
# hdf5, libnetcdf, netcdf-fortran, yaxt, xios and pfunit all publish mpich-5 builds today.
#
# yaxt settles it. This environment needs the 64-bit-Xt_int build
# (`idxtype_long`, added in conda-forge/yaxt-feedstock#6); that feedstock is
# already migrated, so the variant exists only against mpich 5. Resolving this
# metapackage against mpich 4 would therefore pin a set that cannot co-install
# with the yaxt required here.
#
# staged-recipes builds against the base pinning and does not apply migrations,
# so the generation is stated here instead. The feedstock will then follow the
# mpich5 migration like any other.

mpich:
  - "5"
