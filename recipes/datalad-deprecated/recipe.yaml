schema_version: 1
context:
  python_min: '3.10'
package:
  name: datalad-deprecated
  version: 1.0.1
source:
  url: https://files.pythonhosted.org/packages/df/d2/65e5e75d2e8c8bd98491eca32c9acc6d7c789efa6c931aa94a93ede59abc/datalad_deprecated-1.0.1.tar.gz
  sha256: b52f777fef98d589c7c0aa10921c8fc69ab9fe2727bc6b4ded5c56cd82e5afef
build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -v
requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools
  - wheel
  run:
  - python >=${{ python_min }}
  - datalad >=0.18.0
  - jsmin
  - whoosh
  - pyyaml
  - mutagen >=1.36
  - exifread
  - python-xmp-toolkit
  - pillow
tests:
- python:
    imports:
    - datalad_deprecated
    pip_check: true
about:
  homepage: https://github.com/datalad/datalad-deprecated
  summary: DataLad extension package for deprecated functionality that was phased out in the core package
  license: MIT
  license_file: LICENSE
extra:
  recipe-maintainers:
  - Shavindra
