context:
  version: "0.6.0"

package:
  name: beamfeat
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/beamfeat/beamfeat-${{ version }}.tar.gz
  sha256: a284b8589fd3ce661a13dea4d0cd0b10d16a153cc30a33be22764f1dcddec3a5

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.25
    - pip
  run:
    - python >=${{ python_min }}
    - joblib >=1.2
    - numpy >=1.26
    - scikit-learn >=1.6

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - beamfeat
        - beamfeat.selection
      pip_check: true

about:
  homepage: https://github.com/LD-Shell/beamfeat
  summary: Beam-search feature construction with FDR-controlled selection
  description: |
    Builds interpretable symbolic features by beam search over an expression
    DAG on one part of the data, then screens them on the other with
    false-discovery-rate control: a permutation test under Benjamini-Hochberg
    or Benjamini-Yekutieli, or knockoffs. Packaged as scikit-learn estimators.
  license: MIT
  license_file: LICENSE
  documentation: https://ld-shell.github.io/beamfeat/
  repository: https://github.com/LD-Shell/beamfeat

extra:
  recipe-maintainers:
    - LD-Shell
