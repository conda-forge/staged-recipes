context:
  version: "0.4.2"

package:
  name: beamfeat
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/beamfeat/beamfeat-${{ version }}.tar.gz
  sha256: b3ca7ac45b70dac5c56df63c636f9cf55edc070414c5a7e323e200a0b2c0a978

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.25
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.26
    - scikit-learn >=1.6

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - beamfeat
        - beamfeat.selection
      pip_check: true

about:
  homepage: https://github.com/LD-Shell/beamfeat
  summary: Beam-search feature construction with FDR-controlled selection
  description: |
    Builds interpretable symbolic features by beam search over an expression
    DAG on one part of the data, then screens them on the other with an exact
    permutation test under Benjamini-Hochberg, Benjamini-Yekutieli or knockoff
    control. Packaged as scikit-learn estimators.
  license: MIT
  license_file: LICENSE
  documentation: https://ld-shell.github.io/beamfeat/
  repository: https://github.com/LD-Shell/beamfeat

extra:
  recipe-maintainers:
    - LD-Shell
