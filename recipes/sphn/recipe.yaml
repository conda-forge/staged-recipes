schema_version: 1

context:
  version: "0.2.1"

package:
  name: sphn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphn/sphn-${{ version }}.tar.gz
  sha256: 3b19b1fece67d979d84080458bed545d1f55ddc5abac6ca5deae2672a184c7fe

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.4,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - pkg-config
  host:
    - python
    - pip
    - maturin >=1.4,<2
    - libopus
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - sphn
        - sphn.sphn
      pip_check: true
  - requirements:
      run:
        - numpy
    script:
      - python test_roundtrip.py
    files:
      recipe:
        - test_roundtrip.py

about:
  summary: Python bindings to read/write audio files via the symphonia and opus crates
  description: |
    sphn provides Python bindings for the symphonia and opus Rust crates.
    It can load a variety of audio file formats into numpy arrays and
    read/write ogg/opus audio files with streaming support.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/LaurentMazare/sphn
  repository: https://github.com/LaurentMazare/sphn

extra:
  recipe-maintainers:
    - eginhard
