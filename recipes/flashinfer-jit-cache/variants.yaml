# One build of this package per CUDA architecture. cuda_arch_version is the
# minimum compute capability that the machine must have (the cuda-arch package),
# and cuda_provider_arch is the architecture that the kernels are compiled for.
zip_keys:
  - [cuda_arch_version, cuda_provider_arch]

# Single target for debugging purposes
cuda_arch_version:
  - "8.0"
cuda_provider_arch:
  - "8.0"

