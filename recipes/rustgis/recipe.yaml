schema_version: 1

context:
  name: rustgis
  version: "0.4.0"
  python_min: "3.12"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 69c2d41112ed312363fd0bb852b7f6746e2fe635bd18d1ce4abc9dbad82f284d

build:
  number: 0
  skip: is_abi3 and not is_python_min
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    version_independent: ${{ true if is_abi3 }}

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }} ${{ python_min }}.*
        - crossenv
        - maturin >=1.9.3,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - if: is_abi3
      then: python-abi3
    - python ${{ python_min }}.*
    - maturin >=1.9.3,<2
    - pip
  run:
    - python >=${{ python_min }}
  run_constraints:
    - anywidget >=0.9
    - geopandas >=0.14

tests:
  - python:
      imports:
        - rustgis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - if: is_abi3
          then: abi3audit
    script:
      - python -c "import rustgis; print(rustgis.__version__); assert rustgis.__version__ == '${{ version }}'"
      - if: unix and is_abi3
        then: abi3audit $SP_DIR/rustgis/_rustgis.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
      - if: win and is_abi3
        then: abi3audit %SP_DIR%/rustgis/_rustgis.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  homepage: https://rustgis.app
  repository: https://github.com/opengeos/RustGIS
  documentation: https://rustgis.app/python/
  summary: Python bindings to RustGIS, a fast, free and open-source GIS in pure Rust
  description: |
    RustGIS is a fast, free and open-source GIS in pure Rust for mapping, analyzing and
    sharing geospatial data. This package exposes its engine to Python: open and query vector
    and raster data, run geoprocessing tools, render maps, and show an interactive map in
    Jupyter (rustgis.Map, with anywidget installed).
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRD-PARTY-LICENSES.txt
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - giswqs
