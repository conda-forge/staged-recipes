schema_version: 1

context:
  version: "0.7.0"

package:
  name: semantic-schemas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/semantic-schemas/semantic_schemas-${{ version }}.tar.gz
  sha256: 84abd8548e7f51e64747a95469db5cf70eee03ceb7698cf479f45d960f72cd8d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68
    - pip
  run:
    - python >=${{ python_min }}
    - jsonata-python
    - rdflib
    - pyshacl
    - pyyaml

tests:
  - python:
      imports:
        - semantic_schemas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: OO-LD schema library and tooling for materials science data
  license: CC0-1.0
  license_file: LICENSE
  homepage: https://github.com/Semantic-Dataspace/semantic-schemas

extra:
  recipe-maintainers:
    - jan-janssen
