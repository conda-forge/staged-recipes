context:
  version: "2.5.1"

package:
  name: pkgtop
  version: ${{ version }}

source:
  url: https://github.com/orhun/pkgtop/archive/refs/tags/${{ version }}.tar.gz
  sha256: 3d8f1cd812fd2243fbf749ab03201bb86b9967cefd5d58cea456cdfcccfd416e

build:
  number: 0
  # upstream README: "designed for the GNU/Linux". pkgtop reads the distro's
  # package-manager database and /proc, so only linux is built.
  skip:
    - win
    - osx
  script:
    - go build -v -o $PREFIX/bin/pkgtop ./cmd/pkgtop.go

requirements:
  build:
    - ${{ compiler('go-nocgo') }}

tests:
  - script:
      - pkgtop -v
  - package_contents:
      bin:
        - pkgtop

about:
  homepage: https://github.com/orhun/pkgtop
  repository: https://github.com/orhun/pkgtop
  summary: Interactive TUI package manager and resource monitor for GNU/Linux
  description: |
    pkgtop is an interactive package manager and resource monitor designed for
    GNU/Linux. It lists installed packages with their sizes, shows which are in
    use, and can install, upgrade, remove and search packages through a terminal
    dashboard. It reads the distribution's package manager database and /proc,
    so it is Linux-only.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ravi-arnan
