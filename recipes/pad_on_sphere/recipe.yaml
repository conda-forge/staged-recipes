schema_version: 1

context:
  version: "6.0.1"

package:
  name: pad_on_sphere
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pad_on_sphere/pad_on_sphere-${{ version }}.tar.gz
  sha256: 3bc3faaa9a624f6f1cef39310240ff51b104c827b78261ba44674547e24f7c41

build:
  number: 0
  skip: match(python, "<3.10")
  script: pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=77
    - wheel
  run:
    - python
    - numpy >=1.23
    - pandas >=1.5
    - xarray >=2023.1

tests:
  - python:
      imports:
        - pad_on_sphere
      pip_check: true
  - script:
      - python tests/test_pad_on_sphere.py
    files:
      source:
        - tests/test_pad_on_sphere.py

about:
  homepage: https://github.com/skokg/PAD_on_Sphere
  summary: Precipitation Attribution Distance for fields on a sphere
  description: |
    PAD on Sphere measures spatial displacement between precipitation fields
    on a sphere. It provides NumPy and xarray interfaces to a C++ attribution
    implementation, together with postprocessing and regional statistics.
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/skokg/PAD_on_Sphere#readme
  repository: https://github.com/skokg/PAD_on_Sphere

extra:
  recipe-maintainers:
    - skokg
