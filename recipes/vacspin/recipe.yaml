schema_version: 1

context:
  version: "0.3.0"

package:
  name: vacspin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vacspin/vacspin-${{ version }}.tar.gz
  sha256: 247db364f1a42f18f2fca552906ed63767d57a65c11f2b60c147d0b2f3696741

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.22

tests:
  - python:
      imports:
        - vacspin
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/vacspin
  license: Apache-2.0
  license_file: LICENSE
  summary: "Group-IV colour-centre spin-photon interfaces, from the strained Hamiltonian to single-shot readout"
  description: |
    Strained spin Hamiltonians, optical transitions and cyclicity, cavity
    Purcell budgets and exact single-shot readout statistics for group-IV
    colour centres in diamond (SiV-, GeV-, SnV-). Every built-in parameter
    set is a measured, cited value.
  repository: https://github.com/TaN-MM-Org/vacspin
  documentation: https://github.com/TaN-MM-Org/vacspin#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
