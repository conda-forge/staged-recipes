schema_version: 1

context:
  version: "0.11.0"

package:
  name: vacspin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vacspin/vacspin-${{ version }}.tar.gz
  sha256: 636dfbb26f0dfd8c97c39c7d165e233abc280185b1c2354e37fc4b72c1f2dddc

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.22

tests:
  - python:
      imports:
        - vacspin
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/vacspin
  license: Apache-2.0
  license_file: LICENSE
  summary: "Group-IV color-center spins in diamond, from the strained Hamiltonian to single-shot readout"
  description: |
    How well a single electron spin in a group-IV vacancy color center in
    diamond (SnV-, SiV-, GeV-, PbV-) can be read out with light and linked
    to another spin: the qubit frequency and how many photons the spin can
    emit before it flips at a given field, how much a cavity speeds up the
    emission, how reliably one measurement tells the spin states apart, how
    often two nodes become entangled, and fits of a center's parameters to
    your own measured frequencies with error bars. Every built-in parameter
    set carries a citation.
  repository: https://github.com/TaN-MM-Org/vacspin
  documentation: https://github.com/TaN-MM-Org/vacspin#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
