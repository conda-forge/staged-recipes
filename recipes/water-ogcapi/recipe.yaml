schema_version: 1

context:
  version: "0.1.0"
  python_min: "3.13"

package:
  name: water-ogcapi
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/w/water-ogcapi/water_ogcapi-${{ version }}.tar.gz
  sha256: b8443f602a8721af2feddce45aaa182af90e753789350b8f95eeb42163b162d1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-vcs
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - h2 >=4.4.1,<5
    - httpx2 >=2.12

tests:
  - python:
      imports:
        - water_ogcapi
        - water_ogcapi.aio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A Python client for USGS water data services over OGC API Features, blocking or async.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/hyriver/water-ogcapi
  repository: https://github.com/hyriver/water-ogcapi
  documentation: https://docs.hyriver.io/water-ogcapi/

extra:
  recipe-maintainers:
    - cheginit
