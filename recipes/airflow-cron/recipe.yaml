schema_version: 1

context:
  name: airflow-cron
  version: "0.1.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/airflow-cron/airflow_cron-${{ version }}.tar.gz
  sha256: 28640d36bde4230f110e9d617535281a2dadbe0671fd7515b46d3cc3a0b262fa

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - airflow-pydantic >=1.7.0,<1.8
    - cron-pydantic >=0.1,<0.2

tests:
  - python:
      imports:
        - airflow_cron
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/airflow-laminar/airflow-cron
  summary: Airflow DAG generation from cron syntax
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://airflow-laminar.github.io/airflow-cron/
  repository: https://github.com/airflow-laminar/airflow-cron

extra:
  recipe-maintainers:
    - timkpaine
