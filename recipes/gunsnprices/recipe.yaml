context:
  version: "0.1.1"

package:
  name: gunsnprices
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gunsnprices/gunsnprices-${{ version }}.tar.gz
  sha256: 8c51c2367323bea7c27728deedf6d8cc432f0d777b7f9d5d9fc04013b69f5aa4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - gunsnprices = gunsnprices.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - gunsnprices
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - gunsnprices --version
      - gunsnprices "Glock 19 Gen 5 9mm 15rd"

about:
  homepage: https://gunsnprices.com
  summary: Parse firearm and ammunition product titles into brand, model, caliber, capacity and more.
  description: |
    gunsnprices parses firearm and ammunition product titles from US stores into structured data:
    brand and model (50 brands), calibers, magazine capacity, barrel length, rounds per box and
    cost per round. It is the title parser behind GunsNPrices (https://gunsnprices.com), a gun and
    ammo price comparison site. Pure Python, no dependencies.
  license: MIT AND CC-BY-4.0
  license_file:
    - LICENSE
    - LICENSE-DATA
  repository: https://github.com/gunsnprices/gunsnprices-python
  documentation: https://github.com/gunsnprices/gunsnprices-python#readme

extra:
  recipe-maintainers:
    - gunsnprices-admin
