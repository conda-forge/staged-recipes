context:
  version: 27.0.0

package:
  name: tsgettoolbox-ldas
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-ldas/tsgettoolbox_ldas-${{ version }}.tar.gz
  sha256: 8a28fd93a82be7d57352512501ff3c8738c0065c6547a0965c866f17e5a9e11b

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - aiodns >3.6.0
  - async_retriever
  - pandas
  - pydantic >=2
  - requests
  - tabulate
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
      - tsgettoolbox_ldas
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: Plugin for tsgettoolbox to retrieve data from the Land Data Assimmilation System (LDAS) web service.
  description: |
    The 'tsgettoolbox_ldas' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    California Data Exchange Center (CDEC).
  homepage: https://pypi.org/project/tsgettoolbox-ldas/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
