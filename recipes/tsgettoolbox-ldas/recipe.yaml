    tsgettoolbox_ldas - Quick Guide
    ===============================
    The 'tsgettoolbox_ldas' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    California Data Exchange Center (CDEC).  The tsgettoolbox_ldas will work with
    Python and 3.10+.

    Documentation
    -------------
    Reference documentation is at `tsgettoolbox LDAS API`_.

    Installation
    ------------
    At the command line::

        $ pip install tsgettoolbox_ldas

        OR

        $ conda install -c conda-forge tsgettoolbox_ldas

    Usage Summary - Command Line
    ----------------------------
    Just run 'tsgettoolbox --help' to get a list of subcommands.  To get detailed
    help for a particular sub-command, for instance 'ldas', type 'tsgettoolbox
    ldas --help'.

    +----------------------+---------+--------+---------+----------+-----------------------+
    | Sub-command          | Spatial | Time   | Type    | Time     | Description           |
    |                      | Extent  | Extent |         | Interval |                       |
    +======================+=========+========+=========+==========+=======================+
    | ldas (DEPRECATED)    | global  | varies | grid    | varies   | Land Data             |
    |                      |         |        |         |          | Assimilation System   |
    +----------------------+---------+--------+---------+----------+-----------------------+
    | ldas_gldas_noah      | global  | 2000-  | grid    | 3H       | GLDAS NOAH hydrology  |
    |                      |         |        | 0.25deg |          | model results         |
    +----------------------+---------+--------+---------+----------+-----------------------+
    | ldas_gldas_noah_v2_0 | global  | 1948-  | grid    | 3H       | GLDAS NOAH hydrology  |
    |                      |         | 2014   | 0.25deg |          | model                 |
    +----------------------+---------+--------+---------+----------+-----------------------+
    | ldas_gldas_noah_v2_1 | global  | 2000-  | grid    | 3H       | GLDAS NOAH hydrology  |
    |                      |         |        | 0.25deg |          | model                 |
    +----------------------+---------+--------+---------+----------+-----------------------+
    | ldas_grace           | NAmeric | 2002-  | grid 0. | 7D       | Groundwater and soil  |
    |                      | a       |        | 125deg  |          | moisture from GRACE   |
    +----------------------+---------+--------+---------+----------+-----------------------+
    | ldas_merra           | global  | 1980-  | grid    | H        | MERRA-2 Land surface  |
    |                      |         |        | 0.5x 0. |          |                       |
    |                      |         |        | 625deg  |          |                       |
    +----------------------+---------+--------+---------+----------+-----------------------+
    | ldas_nldas3_forcing  | NAmeric | 2001-  | grid    | HDM      | NLDAS3 Weather        |
    |                      | a       |        | 0.01deg |          | Forcing A (surface)   |
    +----------------------+---------+--------+---------+----------+-----------------------+
    | ldas_nldas_fora      | NAmeric | 1979-  | grid 0. | H        | NLDAS Weather Forcing |
    |                      | a       |        | 125deg  |          | A (surface)           |
    +----------------------+---------+--------+---------+----------+-----------------------+
    | ldas_nldas_noah      | NAmeric | 1979-  | grid 0. | H        | NLDAS NOAH hydrology  |
    |                      | a       |        | 125deg  |          | model                 |
    +----------------------+---------+--------+---------+----------+-----------------------+
    | ldas_nldas_vic       | NAmeric | 1979-  | grid 0. | H        | NLDAS VIC hydrology   |
    |                      | a       |        | 125deg  |          | model                 |
    +----------------------+---------+--------+---------+----------+-----------------------+
    | ldas_smerge          | global  | 1997-  | grid 0. | D        | SMERGE-Noah-CCI root  |
    |                      |         |        | 125deg  |          | zone soil             |
    +----------------------+---------+--------+---------+----------+-----------------------+

    +-------------------+-------------+
    | Time Interval     | Description |
    | Code              |             |
    +===================+=============+
    | H                 | Hourly      |
    +-------------------+-------------+
    | D                 | Daily       |
    +-------------------+-------------+
    | M                 | Monthly     |
    +-------------------+-------------+

    Usage Summary - Python Library
    ------------------------------
    To use the tsgettoolbox in a project::

        from tsgettoolbox import tsgettoolbox
        df = tsgettoolbox.ldas_nldas_fora(
            34,
            100,
            variables="NLDAS_FORA0125_H_2_0_Rainf",
            startDate="2001-01-01T00",
            endDate="2001-02-02T00",
        )
        print(df.head())

    Refer to the API Documentation at `tsgettoolbox LDAS API`_.

    Usage Summary - Command Line
    ----------------------------

        tsgettoolbox ldas_nldas_fora \
            --34 \
            --100 \
            --variables="NLDAS_FORA0125_H_2_0_Rainf" \
            --startDate="2001-01-01T00" \
            --endDate="2001-02-02T00" > output.csv

    Refer to the command line documentation at `tsgettoolbox LDAS API`_.

