schema_version: 1
package:
  name: file-trace-studio
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/File-Trace-Studio/language-sdks-v1.0.0/file-trace-studio-sdk-source-1.0.0.zip
  sha256: d77a95b2a4fcfd8ac9b24bf3345fd13b21ae0b70fa491c9871cefb5dcba19527
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - file_trace_studio
    pip_check: true
- script:
  - python -m pip check
  - python -c "from file_trace_studio import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/File-Trace-Studio
  summary: Windows x64 File-Trace-Studio Python SDK with source-built native bridge
  license: MIT
  license_file:
  - File-Trace-Studio-C-ffi/LICENSE
  - File-Trace-Studio-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
