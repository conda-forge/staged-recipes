schema_version: 1

context:
  version: "0.0.3"

package:
  name: pymu-eval
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pymu-eval/pymu_eval-${{ version }}.tar.gz
  sha256: dea889c4ec19c25914d5f1452043546c3477a1a618feed6e652e6caa77d8e19b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.9
    - setuptools >=61.0
    - pip
  run:
    - python >=3.9
    - numpy >=1.20

tests:
  - python:
      imports:
        - pymu_eval
      pip_check: true
  - script:
      - pytest -v tests

about:
  summary: Python implementation of muParser math syntax parser with NumPy and optional xarray support
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pymu-eval.readthedocs.io

extra:
  recipe-maintainers:
    - petebunting
