schema_version: 1

context:
  version: "0.0.3"

package:
  name: pymu-eval
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pymu-eval/pymu_eval-${{ version }}.tar.gz
  sha256: dbceead129ac44d3b55e999516d5677435bafd3b4a9864db20e15dd1741daaba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.9
    - setuptools >=61.0
    - pip
  run:
    - python >=3.9
    - numpy >=1.20

tests:
  - python:
      imports:
        - pymu_eval
      pip_check: true
  - script:
      - pytest -v tests
    files:
      source:
        - tests
    requirements:
      run:
        - pytest 

about:
  summary: Python implementation of muParser math syntax parser with NumPy and optional xarray support
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pymu-eval.readthedocs.io

extra:
  recipe-maintainers:
    - petebunting
