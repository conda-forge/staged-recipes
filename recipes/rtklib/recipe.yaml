context:
  version: 2.5.1

package:
  name: rtklib-ex
  version: ${{ version }}

source:
  url: https://github.com/rtklibexplorer/RTKLIB/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ad8e56f64dd2b71e2eb8098c27925a65b027b161eae366cf5afb71402348d2e1

build:
  number: 0
  skip:
    - win
    - osx
  script:
    - make -C app/consapp/str2str/gcc
    - install -D -m 755 app/consapp/str2str/gcc/str2str "${PREFIX}/bin/str2str"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make

tests:
  - package_contents:
      bin:
        - str2str
  - script:
      - str2str --version

about:
  homepage: https://rtkexplorer.com/
  summary: Open-source GNSS positioning toolkit (rtklibexplorer fork)
  description: |
    RTKLIB-EX is the rtklibexplorer fork of RTKLIB, an open-source program package
    for standard and precise positioning with GNSS, with improvements for low-cost
    receivers. This recipe builds its str2str command-line stream utility.
  license: BSD-2-Clause
  license_file: license.txt
  repository: https://github.com/rtklibexplorer/RTKLIB
