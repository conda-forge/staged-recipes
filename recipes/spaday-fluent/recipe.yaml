context:
  version: "0.1.0"

package:
  name: spaday-fluent
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-fluent/spaday_fluent-${{ version }}.tar.gz
  sha256: f3fe8e3fe9287da598b5abcc63d858fa7605ecae2a91a6a54cab421fd1f43490

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.8.2,<1

tests:
  - python:
      imports:
        - spaday_fluent
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Fluent components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-fluent
  repository: https://github.com/1kbgz/spaday-fluent

extra:
  recipe-maintainers:
    - timkpaine
