context:
  version: "3.2.0"

package:
  name: libmodbus
  version: ${{ version }}

source:
  url: https://github.com/stephane/libmodbus/releases/download/v${{ version }}/libmodbus-${{ version }}.tar.gz
  sha256: 72239f319b9b8483e3d393c5a60865d734fcff18a8abbb2486e389834a2f6ef1

build:
  number: 0
  script:
    - if: unix
      then: bash build.sh
      else: build.bat

requirements:
  build:
    - ${{ compiler('c') }}
    - if: unix
      then: ${{ stdlib('c') }}
    - if: unix
      then: make
  run_exports:
    - ${{ pin_subpackage('libmodbus', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - modbus/modbus.h
      lib:
        - modbus

about:
  homepage: https://libmodbus.org/
  summary: A Modbus library for sending and receiving data over serial lines or TCP/IP.
  license: LGPL-2.1-or-later
  license_file: COPYING.LESSER
  documentation: https://libmodbus.org/documentation/
  repository: https://github.com/stephane/libmodbus

extra:
  recipe-maintainers:
    - petermitrano
    - peter-mitrano-ar
