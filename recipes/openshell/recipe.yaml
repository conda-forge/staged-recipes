context:
  version: "0.1.5"

package:
  name: openshell
  version: ${{ version }}

source:
  url: https://github.com/NVIDIA/OpenShell/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b627a526427197854f8ee1d783996e666e0bfd6b7a785b70df7709304d9b6f62

build:
  number: 0
  skip: not (linux and (x86_64 or aarch64) or osx and arm64)
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - rust >=1.94
    - cargo-auditable
    - cargo-bundle-licenses
    - cmake
    - make
    - perl
    - pkg-config
    - libprotobuf
  run:
    - openssh
    - git

tests:
  - package_contents:
      bin:
        - openshell
  - script:
      - openshell --version
      - openshell --version | grep -Fx "openshell ${{ version }}"
      - openshell --help
      - openshell gateway --help
      - openshell sandbox --help
      - openshell policy --help

about:
  homepage: https://github.com/NVIDIA/OpenShell
  repository: https://github.com/NVIDIA/OpenShell
  documentation: https://docs.nvidia.com/openshell/latest/index.html
  summary: Command-line client for NVIDIA OpenShell agent sandboxes
  description: |
    OpenShell provides policy-enforced sandboxes for autonomous AI agents.
    This package contains the command-line client, built from source. It
    connects to a separately deployed OpenShell gateway; it does not include
    the gateway, policy prover, sandbox runtime, or Python SDK.
    Running sandboxes requires a compatible gateway and host container or
    virtualization runtime. Installing this package does not start services
    or configure host security settings.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRD-PARTY-NOTICES
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - wolfv
