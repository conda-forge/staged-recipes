schema_version: 1

context:
  python_min: "3.12"
  version: "0.12.1.post1"

package:
  name: seal-tool
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/seal-tool/seal_tool-${{ version }}.tar.gz
  sha256: f787308476ef7931c042642d0874dd2942997e6f1dcf5a432f9b27ad561d82a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - seal = seal.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=82.0
    - pip
  run:
    - python >=${{ python_min }}
    - alive-progress >=3.3,<4.dev0
    - plotnine >=0.15.7,<0.16.dev0
    - polars >=1.43.1,<1.44.dev0
    - polars-strsim >=0.2.5,<0.3.dev0
    - pyarrow >=24.0,<25.dev0
    - pydantic >=2.12,<3.dev0
    - tomli-w >=1.2,<2.dev0

tests:
  - python:
      imports:
        - seal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - seal --help


about:
  summary: A tool to perform richness-extent-grain analyses
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://codeberg.org/mmatous/seal-tool
  documentation: https://mmatous.codeberg.page/seal-tool/

extra:
  recipe-maintainers:
    - mmatous
