schema_version: 1

context:
  name: dml-rs
  version: "0.23.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dml-rs/dml_rs-${{ version }}.tar.gz
  sha256: 5d9bedd0a42201881490ca024d6c1fa20edbcc9daf01b01214c4366a21d57210

build:
  number: 0
  # The extension uses the stable ABI (abi3), so one build per platform serves every Python.
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.9,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - if: is_abi3
      then:
        - python-abi3
    - pip
    - maturin >=1.9,<2
  run:
    - python
    - numpy >=1.21
  run_constraints:
    - pandas >=1.3
    - optuna >=3

tests:
  - python:
      imports:
        - dml_rs
        - dml_rs.datasets
      pip_check: true
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
  - package_contents:
      site_packages:
        - dml_rs/__init__.py
        - dml_rs/_dml_rs.pyi
        - dml_rs/py.typed
        - if: is_abi3
          then: dml_rs/_dml_rs.${{ 'abi3.so' if unix else 'pyd' }}
          else: dml_rs/_dml_rs.${{ '*.so' if unix else '*.pyd' }}
  - files:
      recipe:
        - smoke_test.py
    script:
      - python smoke_test.py
  - if: is_abi3
    then:
      requirements:
        run:
          - abi3audit
      script:
        - if: unix
          then: abi3audit $SP_DIR/dml_rs/_dml_rs.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit %SP_DIR%\dml_rs\_dml_rs.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  homepage: https://github.com/AsadGudzevic94/dml-rs
  summary: Fast double / debiased machine learning for causal inference, implemented in Rust
  description: |
    dml-rs implements double / debiased machine learning (Chernozhukov et al., 2018) in Rust,
    with a scikit-learn-style Python interface modelled on DoubleML. It covers partially linear,
    interactive, instrumental, difference-in-differences, quantile, selection and regression
    discontinuity models, sensitivity analysis, clustered standard errors, CATE learners and
    causal forests, and ships fast built-in learners (lasso, forests, gradient boosting).
    Any scikit-learn estimator can be used as a nuisance learner.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  documentation: https://asadgudzevic94.github.io/dml-rs/
  repository: https://github.com/AsadGudzevic94/dml-rs

extra:
  recipe-maintainers:
    - AsadGudzevic94
