schema_version: 1

context:
  version: 1.0.0b260721

package:
  name: agent-framework-azure-ai-search
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agent-framework-azure-ai-search/agent_framework_azure_ai_search-${{ version }}.tar.gz
  sha256: 867d8ab961112034251e4efb4e7133e5b26336b225a051ff9b70058ae33a8b9e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.11,<4.0
    - pip
  run:
    - python >=${{ python_min }}
    - agent-framework-core >=1.11.0,<2
    - azure-search-documents >=12.0.0,<13

tests:
  - python:
      imports:
        - agent_framework_azure_ai_search
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Azure AI Search integration for Microsoft Agent Framework
  license: MIT
  license_file: LICENSE
  homepage: https://aka.ms/agent-framework
  repository: https://github.com/microsoft/agent-framework
  documentation: https://github.com/microsoft/agent-framework/tree/main/python

extra:
  recipe-maintainers:
    - killua156
