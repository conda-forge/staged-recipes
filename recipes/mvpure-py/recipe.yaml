
schema_version: 1

context:
  version: "2.3.2"
  python_min: "3.13"

package:
  name: mvpure-py
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/mvpure-py/mvpure_py-${{ version }}.tar.gz
  sha256: 78c391872156650c450deb846e766ac6264bcbbfc7e2ed70ee31d1ddbe38c154

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install .

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - joblib ==1.5.1
    - matplotlib-base ==3.11.2
    - mne ==1.13.2
    - numpy ==2.5.4
    - pandas ==3.1.0
    - scikit-learn ==1.9.1
    - scipy ==1.18.1
    - termcolor ==3.3.0
    - tqdm ==4.67.1
    - nibabel ==5.4.2
    - pyqt

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - mvpure_py
      pip_check: true

about:
  summary: EEG/MEG multi-source spatial filters and source localization tools
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/julia-jurkowska/mvpure-tools
  repository: https://github.com/julia-jurkowska/mvpure-tools
  documentation: https://julia-jurkowska.github.io/mvpure-tools/

extra:
  recipe-maintainers:
    - julia-jurkowska
