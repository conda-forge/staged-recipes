schema_version: 1

context:
  version: "0.31.2"

package:
  name: soco
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/soco/soco-${{ version }}.tar.gz
  sha256: 0836e5515f85e45576c66d9745d0582c02306bde122d579a6afaa694ad5a0ffa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pytest
    - pip
  run:
    - python >=${{ python_min }}
    - requests
    - xmltodict
    - ifaddr
    - appdirs
    - lxml

tests:
  - python:
      imports:
        - soco
      pip_check: true

about:
  summary: SoCo (Sonos Controller) is a simple library to control Sonos speakers.
  license: MIT
  license_file: LICENSE.rst
  homepage: https://github.com/SoCo/SoCo

extra:
  recipe-maintainers:
    - HeavyTony2
