schema_version: 1

context:
  version: 0.2.5
  python_min: "3.11"

package:
  name: iconspy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/iconspy/iconspy-${{ version }}.tar.gz
  sha256: 78914aeb1692d874dfa97c064a90ebbd4952a120982e94b67985a97eb8214b12

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - pip
    - numpy
    - xarray
    - cartopy
    - networkx
    - matplotlib-base
    - scipy
    - cmocean
    - netcdf4
    - requests
    - scikit-learn

tests:
  - python:
      imports:
        - iconspy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: ICON Sections in PYthon
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/eerie-project/iconspy
  repository: https://github.com/eerie-project/iconspy
  documentation: https://eerie-project.github.io/iconspy/

extra:
  recipe-maintainers:
    - fraserwg
