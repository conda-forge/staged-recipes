schema_version: 1

context:
  version: "1.1.0"

package:
  name: piscis
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/piscis/piscis-${{ version }}.tar.gz
  sha256: e1cff1db121965d6263ecceffd502c29481912a18532870f652d4f67e5794559

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - piscis = piscis.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - deeptile
    - huggingface_hub
    - imageio
    - numba
    - numpy
    - opencv
    - pandas
    - scikit-image
    - scipy
    - pytorch
    - torchvision
    - tqdm
    - xarray

tests:
  - python:
      imports:
        - piscis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - piscis --help

about:
  summary: An automatic deep learning algorithm for spot detection in fluorescence microscopy images.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/Piscis/

extra:
  recipe-maintainers:
    - imagejan
