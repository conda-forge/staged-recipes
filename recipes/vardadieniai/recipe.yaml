context:
  name: vardadieniai
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ello-lithuania/lietuviski-vardadieniai/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 63fcfc46e36ccff70c6f0083c2e518ea50393adcad2cf581a638c94b8f409c6e

build:
  number: 0
  noarch: python
  script: python -m pip install ./python -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - vardadieniai = vardadieniai.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - vardadieniai
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - vardadieniai --help
      - vardadieniai --version
      - vardadieniai 11-09
      - vardadieniai --vardas azuolas

about:
  homepage: https://dovanasuvardu.lt/vardadieniai/
  summary: 'Lithuanian name days (vardadieniai) calendar: Python library and CLI'
  description: |
    Lietuvos vardadienių kalendorius: šiandien, pagal datą, pagal vardą.
    Lithuanian name day calendar - today, by date or by name, as a Python library and CLI.
    Code MIT, data CC BY-SA 4.0 (source: Lithuanian Wikipedia).
  license: MIT AND CC-BY-SA-4.0
  license_file:
    - python/LICENSE
    - python/DATA_LICENSE
  documentation: https://dovanasuvardu.lt/vardadieniai/
  repository: https://github.com/ello-lithuania/lietuviski-vardadieniai

extra:
  recipe-maintainers:
    - ello-lithuania
