schema_version: 1

context:
  name: prodyparsers
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 4140c00797145073497eb875d7e474d74798f1bf4511ace8997f3412a53786eb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - pyparsing >=3.0.9
  # scipy is an optional run dependency, needed only for distance based
  # selections ("within", "exwithin")

tests:
  - python:
      imports:
        - prodyparsers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - scipy
    script:
      - pytest -W error tests
  # same tests on the latest Python
  - files:
      source:
        - tests/
    requirements:
      run:
        - python
        - pytest
        - scipy
    script:
      - pytest -W error tests

about:
  homepage: https://github.com/forlilab/prodyparsers
  repository: https://github.com/forlilab/prodyparsers
  license: MIT
  license_file: LICENSE
  summary: ProDy's PDB/mmCIF parsers and atom selections, trimmed down to a small pure Python package
  description: |
    prodyparsers contains the PDB and mmCIF parsers and the atomic data
    structures (atom groups, hierarchical views and atom selections) of
    ProDy v2.6.1, without ProDy's compiled extensions and other modules, so
    that it can be installed on any platform and recent Python versions.

extra:
  recipe-maintainers:
    - diogomart
