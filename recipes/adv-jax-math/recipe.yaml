schema_version: 1

context:
  version: "1.3"

package:
  name: adv-jax-math
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/adv-jax-math/adv_jax_math-${{ version }}.tar.gz
  sha256: fa89bd67ea949e7ec0e67051b3761b920c1f12ca5916856f14fc25de4a0e545c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - versioneer-518
    - pip
  run:
    - python >=${{ python_min }}
    - equinox >=0.11.0,!=0.13.3
    - jax >=0.4.38,!=0.5.1,!=0.5.2,!=0.6.0,!=0.7.1
    - packaging

tests:
  - python:
      imports:
        - adv_jax_math
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Advanced automatic-differentiation and batching utilities for JAX
  license: LGPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/unalmis/adv-jax-math
  repository: https://github.com/unalmis/adv-jax-math
  documentation: https://unalmis.github.io/adv-jax-math/

extra:
  recipe-maintainers:
    - matthewfeickert
