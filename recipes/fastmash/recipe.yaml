schema_version: 1

context:
  version: "0.1.0"

package:
  name: fastmash
  version: ${{ version }}

source:
  url: https://github.com/pederbe/fastmash/archive/refs/tags/v${{ version }}.tar.gz
  sha256: aa6b74c7e760622e615b44c5dbeb623aad50e4e6dc34a3808a3f3b1777964b60

build:
  number: 0
  # The published release supports Linux x86-64 with glibc.
  skip: not (linux and x86_64)
  script: build.sh

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - python >=3.10
tests:
  - script: bash run_test.sh ${{ version }}
    requirements:
      run:
        # This check exercises the optional system Sort route.
        - __linux >=5.11
    files:
      recipe:
        - run_test.sh
  - package_contents:
      bin:
        - fastmash
        - fastmash-sort-supervisor
      files:
        - etc/conda/test-files/fastmash/*/run_test.sh
        - share/doc/fastmash/README.md
        - share/doc/fastmash/LICENSE-MIT
        - share/doc/fastmash/LICENSE-APACHE
        - share/doc/fastmash/THIRD-PARTY-LICENSES.md
        - share/doc/fastmash/THIRDPARTY.yml
      strict: true

about:
  homepage: https://fastmash.io
  summary: Fast command-line statistics on text data, compatible with GNU datamash
  description: |
    Fastmash computes statistics and table transformations over delimited text
    using the GNU datamash command language. Software 80-bit arithmetic gives
    portable numerical results. Some sorted jobs use the host's /usr/bin/sort
    through the installed fastmash-sort-supervisor when host capabilities allow
    it; GNU or uutils coreutils and Linux kernel 5.11 or later are required for
    that route. Otherwise, built-in sorting produces the same output.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRD-PARTY-LICENSES.md
    - THIRDPARTY.yml
  documentation: https://fastmash.io
  repository: https://github.com/pederbe/fastmash

extra:
  recipe-maintainers:
    - pederbe
