schema_version: 1

context:
  version: "1.10.0"

package:
  name: scrapy-impersonate
  version: ${{ version }}

source:
  url: https://github.com/jxlil/scrapy-impersonate/archive/refs/tags/${{ version }}.tar.gz
  sha256: 8e40cfaea243db86a00ebee78a24b4e31cfa8613916975b1ca8543f028f8c0cb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - curl-cffi >=0.15.0
    - scrapy >=2.13.4

tests:
  - python:
      imports:
        - scrapy_impersonate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Scrapy download handler that can impersonate browser fingerprints
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jxlil/scrapy-impersonate

extra:
  recipe-maintainers:
    - holymonson
