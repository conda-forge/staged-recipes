schema_version: 1

context:
  version: "1.10.0"

package:
  name: scrapy-impersonate
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/scrapy-impersonate/scrapy_impersonate-${{ version }}.tar.gz
  sha256: 40d5f84d51126b9838d8bd404d21fa2eb0136994716c1521d21f05d87a8dbf8d

build:
  number: 0
  noarch: python
  script: |
    ${{ PYTHON }} -c "open('requirements.txt', 'a').close()"
    ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - curl-cffi >=0.15.0
    - scrapy >=2.13.4

tests:
  - python:
      imports:
        - scrapy_impersonate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Scrapy download handler that can impersonate browser fingerprints
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jxlil/scrapy-impersonate

extra:
  recipe-maintainers:
    - holymonson
