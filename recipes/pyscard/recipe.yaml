schema_version: 1

context:
  version: "2.3.2"

package:
  name: pyscard
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pyscard/pyscard-${{ version }}.tar.gz
  sha256: 5f5435e32aede88e6668fe1348d85fb7bea3d319e798ceb8c1eb0100cab53fb4

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - swig
    - if: linux
      then: pkgconf
  host:
    - python
    - setuptools
    - pip
    - if: linux
      then: pcsclite
  run:
    - python

tests:
  - python:
      imports:
        - smartcard
        - smartcard.scard
      pip_check: true

about:
  summary: Smartcard module for Python.
  description: |
    pyscard is a Python module adding smart card support (PC/SC) to Python.
  license: LGPL-2.1-or-later
  license_file: LICENSE
  homepage: https://pyscard.sourceforge.io/
  repository: https://github.com/LudovicRousseau/pyscard
  documentation: https://pyscard.sourceforge.io/user-guide.html

extra:
  recipe-maintainers:
    - pavelzw
