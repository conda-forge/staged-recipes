context:
  version: "0.1.12"

package:
  name: ajlab
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ajlab/ajlab-${{ version }}.tar.gz
  sha256: 0fb88fd5a2b09275b0bb19ae8b0f436c060467fea16814374776a4d66c590d56

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - jupyter-docprovider >=3.0.0
    - jupyter-server-mcp >=0.3.0
    - jupyter_server_ydoc >=3.0.0
    - jupyterlab >=4.6.1
    - jupyterlab-commands-toolkit >=0.2.0

tests:
  - python:
      imports:
        - ajlab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jtpio/ajlab
  summary: Agent ready JupyterLab
  description: |
    ajlab is an opinionated JupyterLab meta-package bundling a curated set of
    extensions and defaults for work with terminal coding agents.
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/jtpio/ajlab

extra:
  recipe-maintainers:
    - SylvainCorlay
    - jtpio
