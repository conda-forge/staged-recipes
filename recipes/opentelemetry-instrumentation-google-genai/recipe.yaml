schema_version: 1

context:
  version: 1.3b0

package:
  name: opentelemetry-instrumentation-google-genai
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/opentelemetry-instrumentation-google-genai/opentelemetry_instrumentation_google_genai-${{ version }}.tar.gz
  sha256: d818c8a3613d77f5b6cb97b1b9dd208df711ac8c7892f9303cb3336b134ceca6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.43,<2.dev0
    - opentelemetry-instrumentation >=0.64b0,<1
    - opentelemetry-semantic-conventions >=0.64b0,<1
    - opentelemetry-util-genai >=1.3b0.dev,<2
    - wrapt >=1.17.0,<3.0.0
    - google-genai

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.google_genai
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: OpenTelemetry
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-genai/tree/main/instrumentation/opentelemetry-instrumentation-google-genai

extra:
  recipe-maintainers:
    - jsmolic
