# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Internxt Drive Desktop for Windows from drive-desktop.

context:
  version: "2.6.5"

package:
  name: internxt-drive-windows
  version: ${{ version }}

source:
  url: https://github.com/internxt/drive-desktop/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d973cc553b1b6e89bb23b104e5e6faec3889f41e22c4bc6b2c7a2c6410e22807

build:
  number: 0
  skip:
    - not win
  script: build.bat

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - nodejs >=20.19
    - pnpm
    - pnpm-licenses
  host:
    - nodejs >=20.19
  run:
    - nodejs >=20.19

tests:
  - package_contents:
      files:
        - Library/lib/internxt-drive-windows/dist/main/main.js
        - Library/lib/internxt-drive-windows/package.json
        - Library/bin/internxt-drive-windows.cmd
  - script:
      - where internxt-drive-windows

about:
  homepage: https://internxt.com
  summary: Internxt Drive Desktop for Windows - encrypted cloud storage client
  description: |
    Internxt Drive for Windows is a privacy-focused cloud storage desktop
    application. It uses the Windows Cloud Files API for virtual drive
    integration, and files are end-to-end encrypted and synchronized with the
    Internxt cloud service.
  license: MIT OR AGPL-3.0-only
  license_file:
    - LICENSE
    - third-party-licenses.txt
  repository: https://github.com/internxt/drive-desktop

extra:
  recipe-maintainers:
    - phreed
