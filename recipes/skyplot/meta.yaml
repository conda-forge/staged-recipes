{% set name = "skyplot" %}
{% set version = "0.4.2_b" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/1cosmologist/skyplot/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 82478637b67c9045962e507f7da8caa3b4bf73deef133c766cfc1b7165d594cf

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python >={{ python_min }}
    - pip
    - meson-python >=0.16
    - meson >=1.3
    - ninja
  run:
    - python >={{ python_min }}
    - numpy >=1.24
    - healpy >=1.16
    - astropy-base >=5.0
    - matplotlib-base >=3.8
    - cartopy >=0.23
    - colormaps >=0.4

test:
  imports:
    - skyplot

about:
  home: https://github.com/1cosmologist/skyplot
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Sky visualization library for CMB and astrophysical data
  doc_url: https://skyplot.readthedocs.io/latest/

extra:
  recipe-maintainers:
    - 1cosmologist
