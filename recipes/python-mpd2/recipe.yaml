schema_version: 1

context:
  version: "3.1.1"

package:
  name: python-mpd2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-mpd2/python-mpd2-${{ version }}.tar.gz
  sha256: 4baec3584cc43ed9948d5559079fafc2679b06b2ade273e909b3582654b2b3f5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - tox
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mpd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A Python MPD client library
  license: LGPL-3.0-only
  license_file: LICENSE.txt
  homepage: https://github.com/Mic92/python-mpd2

extra:
  recipe-maintainers:
    - HeavyTony2
