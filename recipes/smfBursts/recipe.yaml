schema_version: 1

context:
  version: "0.1.3"

package:
  name: smfbursts
  version: ${{ version }}

source:
  url: https://github.com/OpenSMFS/smfBursts/archive/${{ version }}.tar.gz
  sha256: df45c78ce533cc07ea3c8c655531b61fa70053bb30aa5f45575b4148d13f38f7

build:
  number: 0
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - python
    - setuptools >=77
    - setuptools-scm >=8.0
    - numpy
    - scipy >=1.2
    - pandas >=2.0
    - pytables >=3.5
    - msgpack-python >=1.0
    - phconvert >=0.8
    - pyFCS
    - pip
  run:
    - python
    - scipy >=1.2
    - pandas >=2.0
    - pytables >=3.5
    - msgpack-python >=1.0
    - phconvert >=0.8
    - pyFCS
    - pytest

tests:
  - python:
      imports:
        - smfbursts.cfuncs
        - smfbursts
        - smfbursts.fcs
      pip_check: true
  - script:
    - python -m pytest tests/test_tables.py
    files:
      source:
        - tests/
    requirements:
      run:
        - python
        - numpy
        - scipy >=1.2
        - pandas >=2.0
        - pytables >=3.5
        - msgpack-python >=1.0
        - phconvert >=0.8
        - pyFCS
        - pytest

about:
  summary: Burst analysis toolkit for single and multi-spot smFRET data.
  license: MIT
  license_file: LICENSE.txt
  homepage: http://opensmfs.github.io/smfBursts/

extra:
  recipe-maintainers:
    - harripd
