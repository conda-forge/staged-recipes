schema_version: 1

context:
  version: "3.1.4"

package:
  name: seekrflow
  version: ${{ version }}

source:
  url: https://github.com/seekrcentral/seekrflow/archive/refs/tags/${{ version }}.tar.gz
  sha256: 26cafac0011b33a9ebfca611d10b519c46036b899939eba72fad902c52c40c4e

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0             # matches the PEP 639 license-fix bump upstream
    - versioningit >=3.0,<4.dev0    # matches the bump upstream; confirmed via `pip install -e .`
  run:
    - python >=${{ python_min }}
    - attrs
    - cattrs
    - numpy
    - scipy
    - mdtraj
    - parmed
    - rdkit
    - rich
    - fabric
    - networkx
    - radical.asyncflow
    - biopython
    - seekr ==3.1.4
    - six
    - openmm >=8
    
tests:
  - python:
      imports:
        - seekrflow
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - python -c "import openmm; import seekrflow; print(seekrflow.__version__); import importlib.metadata; assert importlib.metadata.version('seekrflow') == '3.1.4'; assert seekrflow.__version__ == '3.1.4'"

about:
  homepage: https://github.com/seekrcentral/seekrflow/
  repository: https://github.com/seekrcentral/seekrflow/
  documentation: https://seekrflow.readthedocs.io/
  summary: Simulation-Enabled Estimation of Kinetic Rates Workflow Utility
  description: |
    Seekrflow automates the handling of seekr (simulation-enabled estimation of
    kinetic rates), a multiscale software tool for the simulation of molecular
    processes. Seekrflow aims to reduce time, complexity, and manual intervention
    in the parameterization, preparation, and running of seekr calculations by
    automating all stages.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - lvotapka
