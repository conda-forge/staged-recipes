schema_version: 1

context:
  version: "1.3.2"

package:
  name: certbot-dns-desec
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/certbot-dns-desec/certbot_dns_desec-${{ version }}.tar.gz
  sha256: 7dec89001609abbc9fe9bf67b9ccb893c6de9fe061c3530fa176b4cc00ac52bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - certbot
    - dnspython
    - requests
    - setuptools

tests:
  - python:
      imports:
        - certbot_dns_desec
        - certbot_dns_desec.dns_desec
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - mock
        - requests-mock
    script:
      - pytest --pyargs certbot_dns_desec -v
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      # check that certbot discovers the plugin through its entry point
      - certbot plugins --config-dir ./cfg --work-dir ./work --logs-dir ./logs | grep dns-desec

about:
  homepage: https://github.com/desec-io/certbot-dns-desec
  summary: deSEC DNS Authenticator plugin for Certbot
  description: |
    This certbot plugin automates the DNS-01 challenge of the ACME protocol
    for domains managed by the deSEC DNS hosting service. It creates and
    removes the required TXT records through the deSEC API. This lets you
    obtain certificates from Let's Encrypt, including wildcard certificates.
  license: Apache-2.0
  license_file: LICENSE.txt
  repository: https://github.com/desec-io/certbot-dns-desec

extra:
  recipe-maintainers:
    - Hoeze
