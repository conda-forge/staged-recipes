schema_version: 1

context:
  version: "2.0.1"

package:
  name: manocca
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/manocca/manocca-${{ version }}.tar.gz
  sha256: ed37cca41f4cdd25e5a82cdb2d3c95f5d2319c834396b9e40329cf0d366728b2

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.21
    - scipy >=1.8
    - pandas >=1.4
    - scikit-learn >=1.0
    - joblib >=1.1
    - tqdm >=4.64

tests:
  - python:
      imports:
        - manocca
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://gitlab.pasteur.fr/statistical-genetics/manocca
  license: MIT
  license_file: LICENSE
  summary: "MANOCCA: Multivariate ANalysis of Conditional CovAriance"
  description: |
    MANOCCA tests whether a predictor X is associated with the covariance
    structure of outcomes Y after adjusting for covariates C: Cov(Y) ~ X + C.
    The test is orthogonal to mean and variance effects.
  repository: https://gitlab.pasteur.fr/statistical-genetics/manocca
  documentation: https://academic.oup.com/bib/article/25/4/bbae272/7690346

extra:
  recipe-maintainers:
    - christopheboetto
