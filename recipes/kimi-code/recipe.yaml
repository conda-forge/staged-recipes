# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kimi-code
  version: "2.8.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/MoonshotAI/kimi-code/archive/refs/tags/@moonshot-ai/kimi-code@${{ version }}.tar.gz
  sha256: 72f17b8859fa7e4771074cebac4e59be7c8f130ddb3210ad30c3746d0aecaf03

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - nodejs >=24.15.0
    - pnpm >=10.33.0
    - pnpm-licenses >=2.1.0
  host:
    - if: linux
      then:
        - libxcb
  run:
    - nodejs >=22.19.0

tests:
  - script:
      - kimi --help
      - if: not win
        then: kimi --version | grep "${{ version }}"
        else:
          - kimi --version | findstr "${{ version }}"
          - where kimi

about:
  homepage: https://www.kimi.com/code/docs/
  repository: https://github.com/MoonshotAI/kimi-code
  documentation: https://moonshotai.github.io/kimi-code/
  license: MIT
  license_file:
    - LICENSE
    - ThirdPartyLicenses.txt
  summary: Kimi Code CLI — AI coding agent for your terminal

extra:
  recipe-maintainers:
    - flferretti
