# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kimi-code
  version: "2.8.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@moonshot-ai/kimi-code/-/kimi-code-${{ version }}.tgz
  sha256: f7ca3c2da5fbf996b5d2abcb32549545e2d62d180a070c794b085e32762ad2b6

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs >=22.19.0
  run:
    - nodejs >=22.19.0

tests:
  - script:
    - kimi --help
    - kimi --version

about:
  homepage: https://www.kimi.com/code/docs/
  repository: https://github.com/MoonshotAI/kimi-code
  documentation: https://moonshotai.github.io/kimi-code/
  license: MIT
  license_file: LICENSE
  summary: Kimi Code CLI — The Starting Point for Next-Gen Agents

extra:
  recipe-maintainers:
    - flferretti
