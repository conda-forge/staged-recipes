schema_version: 1

context:
  version: 1.3b0

package:
  name: opentelemetry-util-genai
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/opentelemetry-util-genai/opentelemetry_util_genai-${{ version }}.tar.gz
  sha256: 29e7e9cf9b9f4742c178e837237f72356b8903a004b0edcc23e779232da7719f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-instrumentation >=0.64b0,<1
    - opentelemetry-semantic-conventions >=0.64b0,<1
    - opentelemetry-api >=1.43,<2.dev0
    - wrapt >=1.17.0,<3.0.0

tests:
  - python:
      imports:
        - opentelemetry.util.genai
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: OpenTelemetry GenAI Utils
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/util/opentelemetry-util-genai

extra:
  recipe-maintainers:
    - jsmolic
