{% set version = "0.1.5" %}


package:
  name: pyfcs
  version: {{ version }}

source:
  url: https://github.com/OpenSMFS/pyFCS/archive/{{ version }}.tar.gz
  sha256: 847de6c0becfe8b82603a0fc5297d0089be8925891fa38c4ef88baf7acc82419

build:
  skip: true  # [py<310]
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
  host:
    - python
    - setuptools >=77
    - setuptools-scm >=8.0
    - numpy
    - pip
  run:
    - python

test:
  imports:
    - pyFCS
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/OpenSMFS/pyFCS
  summary: Functions for performing auto and cross-correlations of single photon data with and without weights
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - harripd
