schema_version: 1

context:
  python_min: 3.10
  version: 0.1.4

package:
  name: pyfcs
  version: ${{ version }}

source:
  url: https://github.com/OpenSMFS/pyFCS/archive/${{ version }}.tar.gz
  sha256: f987d517979d2ff75411fbabe045acea3112bd6468013cd647cd84075fc33934

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=8.0
    - numpy >=1.20
    - pip
  run:
    - python >=${{ python_min }}
    - ${{ pin_compatible('numpy') }}

tests:
  - python:
      imports:
        - pyFCS
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Functions for performing auto and cross-correlations of single photon data with and without weights
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/OpenSMFS/pyFCS

extra:
  recipe-maintainers:
    - harripd
