schema_version: 1

context:
  python_min: "3.10"
  version: 0.1.5

package:
  name: pyfcs
  version: ${{ version }}

source:
  url: https://github.com/OpenSMFS/pyFCS/archive/${{ version }}.tar.gz
  sha256: 847de6c0becfe8b82603a0fc5297d0089be8925891fa38c4ef88baf7acc82419

build:
  number: 0
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION_FOR_${DIST_NAME}
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: build_platform != host_platform
      then:
        - python
        - cross-python_${{ host_platform }}
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=8.0
    - numpy >=1.20
    - pip
  run:
    - python >=${{ python_min }}
    - ${{ pin_compatible('numpy') }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pyFCS
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Functions for performing auto and cross-correlations of single photon data with and without weights
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/OpenSMFS/pyFCS

extra:
  recipe-maintainers:
    - harripd
