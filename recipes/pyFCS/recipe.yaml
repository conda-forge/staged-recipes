schema_version: 1

context:
  version: 0.1.5

package:
  name: pyfcs
  version: ${{ version }}

source:
  url: https://github.com/OpenSMFS/pyFCS/archive/${{ version }}.tar.gz
  sha256: 847de6c0becfe8b82603a0fc5297d0089be8925891fa38c4ef88baf7acc82419

build:
  number: 0
  skip: is_abi3 and not is_python_min
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install . -vv
  python:
      version_independent: ${{ is_abi3 }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: build_platform != host_platform
      then:
        - python
        - cross-python_${{ host_platform }}
  host:
    - if: is_abi3
      then: python-abi3
    - python
    - setuptools >=77
    - setuptools-scm >=8.0
    - numpy >=1.20
    - pip
  run:
    - python
    - ${{ pin_compatible('numpy') }}

tests:
  - python:
      imports:
        - pyFCS
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
  - if: is_abi3
    then:
      requirements:
        run:
          - abi3audit
      script:
        - if: unix
          then: abi3audit $SP_DIR/pyFCS.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit %SP_DIR%/pyFCS.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  summary: Functions for performing auto and cross-correlations of single photon data with and without weights
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/OpenSMFS/pyFCS

extra:
  recipe-maintainers:
    - harripd
