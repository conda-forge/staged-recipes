context:
  version: "1.14.0"

package:
  name: ocaml-re
  version: ${{ version }}

source:
  url: https://github.com/ocaml/ocaml-re/archive/refs/tags/${{ version }}.tar.gz
  sha256: e32eb4c6f319ff74241da9e1b00032f990241347271baf3adb468faaaa616147

build:
  number: 0
  skip:
    - win
  script:
    - dune build --profile=release -p re @install
    - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" re

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler("ocaml") }}
    - ocaml-dune >=3.17
  host:
    - ocaml >=4.13.0

tests:
  - package_contents:
      strict: true
      files:
        - lib/ocaml/re/*
        - doc/re/*

about:
  homepage: https://github.com/ocaml/ocaml-re
  repository: https://github.com/ocaml/ocaml-re
  summary: Pure OCaml regular expression library
  license: LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - ManuelLerchner
    - MementoRC
