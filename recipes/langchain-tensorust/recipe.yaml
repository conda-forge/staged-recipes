schema_version: 1

context:
  name: langchain-tensorust
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_tensorust-${{ version }}.tar.gz
  sha256: 52e296a5c2870612c342d151a4e2aa5acbbaabd1c5ab7e668f2de33b999ee5d0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}
    - langchain-core >=1.0,<2
    - httpx >=0.27,<1
    - pydantic >=2.7,<3
  run_constraints:
    - langchain-mcp-adapters >=0.1

tests:
  - python:
      imports:
        - langchain_tensorust
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
        - pyproject.toml
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - pytest-asyncio
        - langchain >=1.0
    script:
      # The standard-tests module needs langchain-tests, which is not on conda-forge;
      # the integration tests call the live API.
      - pytest tests/unit_tests -v --ignore=tests/unit_tests/test_standard.py

about:
  homepage: https://github.com/Mattbusel/langchain-tensorust
  summary: LangChain tools for the Tensorust Ontology (company and home ownership, private credit loan marks, contractor credit, sanctions and banned-vendor screens)
  description: |
    langchain-tensorust is a LangChain toolkit for the Tensorust Ontology, built
    from US public records (SEC subsidiary lists and BDC schedules of investments,
    state business registries, county property rolls, FCC, federal awards, OFAC
    and the CMS Federal IDR file). Its tools answer who owns or controls a company
    or a single-family home, what each BDC lender marks a private company's loan
    at, a federal contractor's credit health, OFAC plus DoD 1260H, Section 889,
    FCC Covered List, UFLPA and BIOSECURE screens, No Surprises Act arbitration
    outcomes, and dataset search. Every tool works without a key and returns a
    free preview; a TENSORUST_API_KEY returns full records.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/Mattbusel/langchain-tensorust
  documentation: https://github.com/Mattbusel/langchain-tensorust/blob/main/docs/index.md

extra:
  recipe-maintainers:
    - Mattbusel
