schema_version: 1

context:
  version: "0.11.0"

package:
  name: zyte-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zyte-api/zyte_api-${{ version }}.tar.gz
  sha256: c7f63f042d7dc0c5c0859c1ee7de7c756478e032832da5424197ae53a3897eca

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - zyte-api = zyte_api.__main__:_main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.8.0
    - attrs >=20.1.0
    - brotli-python >=0.5.2
    - python-dotenv >=1.0.0
    - runstats >=0.0.1
    - tenacity >=8.2.0
    - tqdm >=4.16.0
    - w3lib >=2.1.1

tests:
  - python:
      imports:
        - zyte_api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - zyte-api --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/zytedata/python-zyte-api
  summary: Python interface to Zyte API
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://python-zyte-api.readthedocs.io/en/stable/
  repository: https://github.com/zytedata/python-zyte-api

extra:
  recipe-maintainers:
    - AdrianAtZyte
    - wRAR
