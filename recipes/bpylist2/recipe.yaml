context:
  version: "4.1.1"

package:
  name: bpylist2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bpylist2/bpylist2-${{ version }}.tar.gz
  sha256: 0cc63284aee42f5c7e0ec87f8f59cdd35aaed05ad12d866b1868ea0c0caaafe1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - bpylist2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/parabolala/bpylist2
  summary: Parse and generate NSKeyedArchiver archives
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
