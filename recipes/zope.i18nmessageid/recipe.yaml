schema_version: 1

context:
  version: "8.4"

package:
  name: zope.i18nmessageid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.i18nmessageid/zope_i18nmessageid-${{ version }}.tar.gz
  sha256: f6b36c3753b71bbe9228ebe44a2657726e88d2d5ee4396350dfd8c9fe6cfdec1

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - zope.interface

tests:
  - python:
      imports:
        - zope.i18nmessageid
        - zope.i18nmessageid._zope_i18nmessageid_message
      pip_check: true
  - script:
      interpreter: python
      content: |
        import os, sys, unittest
        import zope.i18nmessageid as pkg
        here = os.path.dirname(pkg.__file__)
        top = os.path.dirname(os.path.dirname(here))
        suite = unittest.defaultTestLoader.discover(here, top_level_dir=top)
        result = unittest.TextTestRunner(verbosity=2).run(suite)
        sys.exit(not result.wasSuccessful() or result.testsRun == 0)

about:
  homepage: https://github.com/zopefoundation/zope.i18nmessageid
  repository: https://github.com/zopefoundation/zope.i18nmessageid
  documentation: https://zopei18nmessageid.readthedocs.io
  summary: Message Identifiers for internationalization
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
