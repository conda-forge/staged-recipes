schema_version: 1

context:
  version: "6.0"

package:
  name: zope.lifecycleevent
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.lifecycleevent/zope_lifecycleevent-${{ version }}.tar.gz
  sha256: cddf7e0c4ab9f6b7c2411ddafa54212270eabc40af315de5ae8b421f4a95298d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.event

tests:
  - python:
      imports:
        - zope.lifecycleevent
        - zope.lifecycleevent.interfaces
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest discover -v zope.lifecycleevent
    requirements:
      run:
        - zope.testing
        - zope.component

about:
  homepage: https://github.com/zopefoundation/zope.lifecycleevent
  repository: https://github.com/zopefoundation/zope.lifecycleevent
  documentation: https://zopelifecycleevent.readthedocs.io
  summary: Object life-cycle events
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
