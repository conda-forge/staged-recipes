schema_version: 1

context:
  name: strands-harness
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/strands_harness-${{ version }}.tar.gz
  sha256: 02b34d54255eb27a443303c80b45f2362750b04e45028cb69726862478faeae0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - strands-agents >=1.65.0,<2.0.0
    # strands-agents[otel]
    - opentelemetry-exporter-otlp-proto-http >=1.30.0,<2.0.0
    - opentelemetry-processor-baggage >=0.51b0,<1.00b0
    - anthropic >=1.7.0,<3.0.0
    - boto3 >=1.43.127,<2.0.0
    - botocore >=1.43.127,<2.0.0
    - pydantic-monty ==0.0.23
    - pydantic >=2.5,<3

tests:
  - python:
      imports:
        - strands_harness
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: "Strands harness: a batteries-included agent in one call, built on the Strands Harness SDK"
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/strands-agents/harness-sdk
  repository: https://github.com/strands-agents/harness-sdk/tree/main/harness-py
  documentation: https://strandsagents.com

extra:
  recipe-maintainers:
    - yonib05
