{% set name = "troi-core" %}
{% set version = "0.1.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/troi-core/troi_core-{{ version }}.tar.gz
  sha256: 82165aac4c71cc85203e8e50e06fe871b333932c2036eb023f51291b7cacb297

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >={{ python_min }}
    - attrs
    - tabulate
    - typing_extensions
    - geopandas

test:
  imports:
    - troi
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/thestochasticman/troi
  summary: Time and Region Of Interest (Troi) - shared identity and config core of the PaddockTS ecosystem
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thestochasticman
    - johnburley3000
