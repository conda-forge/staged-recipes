context:
  version: "0.3.9"

package:
  name: pylzss
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylzss/pylzss-${{ version }}.tar.gz
  sha256: 4a8c9922deceab516c4139627690dbffa59aa7b336c9a7364a8c48154790e86b

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - lzss
      pip_check: true
  - script:
      - python -c "import lzss; data = b'hello world' * 100; assert lzss.decompress(lzss.compress(data)) == data"

about:
  homepage: https://github.com/m1stadev/pylzss
  summary: Python bindings for LZSS compression
  license: LGPL-3.0-only
  license_file:
    - COPYING
    - COPYING.LESSER

extra:
  recipe-maintainers:
    - pavelzw
