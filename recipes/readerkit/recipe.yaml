schema_version: 1

context:
  name: readerkit
  version: "0.1.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/readerkit-${{ version }}.tar.gz
  sha256: fc0611ce5e0436d95d5600bb07fb413fc13452392fc04d1fc3692dde6b21a37f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.29,<0.12
  run:
    - python >=${{ python_min }}
    - platformdirs >=4.3
    - filelock >=3.30
    - requests >=2.32
    - requests-cache >=1.3
    - requests-ratelimiter >=0.10
    - urllib3 >=2.0

tests:
  - python:
      imports:
        - readerkit
        - readerkit.artifacts
        - readerkit.dirs
        - readerkit.exceptions
        - readerkit.http
        - readerkit.keys
        - readerkit.refresh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Cached HTTP sessions, cache-directory resolution, and a bulk artifact cache for data readers.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ONEcampaign/readerkit
  repository: https://github.com/ONEcampaign/readerkit

extra:
  recipe-maintainers:
    - jm-rivera
