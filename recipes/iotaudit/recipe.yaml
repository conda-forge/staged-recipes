schema_version: 1

context:
  name: iotaudit
  version: "0.1.26"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2fbeb315efb16db236887b812703e13c0b6a03ed6f479211fdfaf31007a87133

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - iotaudit = iotaudit.cli:main
      - iotaudit-mcp = iotaudit.mcp_server:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - scapy >=2.5
    - jinja2 >=3.1
    - pyyaml >=6.0
    - maxminddb >=2.4

tests:
  - python:
      imports:
        - iotaudit
        - iotaudit.cli
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - iotaudit --help

about:
  homepage: https://emirmrkaljevic.github.io/iotaudit/
  repository: https://github.com/emirmrkaljevic/iotaudit
  documentation: https://github.com/emirmrkaljevic/iotaudit/tree/main/docs
  summary: Audit your own smart home devices, who they talk to, plaintext vs TLS, open ports and an A-F grade
  description: |
    iotaudit audits the smart devices on a network you own: the domains and
    countries they contact, unencrypted traffic, open ports, default logins,
    UPnP port forwards and an A-F grade per device, with a local HTML report.
    An optional MCP server is available with the mcp extra from PyPI.
  license: MIT AND CC-BY-4.0
  license_file:
    - LICENSE
    - src/iotaudit/data/NOTICE

extra:
  recipe-maintainers:
    - emirmrkaljevic
