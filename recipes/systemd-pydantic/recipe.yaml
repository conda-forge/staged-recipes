schema_version: 1

context:
  name: systemd-pydantic
  version: "0.1.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/systemd-pydantic/systemd_pydantic-${{ version }}.tar.gz
  sha256: b379e9859baa4c7b453be0879c5449d5d21ea114439640d35726defe499e7ab3

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - _systemd_convenience = systemd_pydantic.convenience.commands:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - hydra-core
    - pydantic >=2
    - typer

tests:
  - python:
      imports:
        - systemd_pydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - _systemd_convenience --help

about:
  homepage: https://github.com/airflow-laminar/systemd-pydantic
  summary: Pydantic models for systemd
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://airflow-laminar.github.io/systemd-pydantic/
  repository: https://github.com/airflow-laminar/systemd-pydantic

extra:
  recipe-maintainers:
    - timkpaine
