context:
  version: "0.2.4"
  # upstream has no tag or sdist for 0.2.4; this commit is the version bump plus the LICENSE file
  commit: 0ddc87adf77e5850d7eeb542ac8a87d421b64daa

package:
  name: espeakng-loader
  version: ${{ version }}

source:
  url: https://github.com/thewh1teagle/espeakng-loader/archive/${{ commit }}.tar.gz
  sha256: c52fde6a08f790dc9f150b68205a35d3ce0aa95dbd5fa8be7b22989b26d1ba09
  patches:
    - patches/0001-Use-espeak-ng-from-the-conda-environment.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - espeak-ng

tests:
  - python:
      imports:
        - espeakng_loader
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "import espeakng_loader; print(espeakng_loader.get_library_path(), espeakng_loader.get_data_path())"
      - python test_paths.py
    files:
      recipe:
        - test_paths.py
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/thewh1teagle/espeakng-loader
  summary: Locate and load the espeak-ng shared library and its data
  description: |
    espeakng-loader provides the path to the libespeak-ng shared library and the
    espeak-ng-data directory so that libraries such as phonemizer can use them.
    The conda-forge package uses libespeak-ng from the espeak-ng package instead
    of bundling its own copy.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/thewh1teagle/espeakng-loader

extra:
  recipe-maintainers:
    - pavelzw
