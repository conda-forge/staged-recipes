schema_version: 1
package:
  name: fyradevice
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/FyraDevice/language-sdks-v1.0.0/fyradevice-sdk-source-1.0.0.zip
  sha256: 16e89ece0f72e6a54f8936eb57a3e0530c4d14dd82aff72dfc691b49eeb0c103
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - fyradevice
    pip_check: true
- script:
  - python -m pip check
  - python -c "from fyradevice import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/FyraDevice-SDK
  summary: Windows x64 FyraDevice Python SDK with source-built native bridge
  license: MIT
  license_file:
  - FyraDevice-C-ffi/LICENSE
  - FyraDevice-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
