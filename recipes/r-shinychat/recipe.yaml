schema_version: 1

context:
  version: "0.5.0"

package:
  name: r-shinychat
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/shinychat_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/shinychat/shinychat_${{ version }}.tar.gz
  sha256: 25f1249fb18457fe4a51a55c9507cafba49abfb5536fdf213fd8ba7bc11a4e47

build:
  number: 0
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
    - r-base64enc
    - r-bslib >=0.12.0
    - r-cli
    - r-coro
    - r-ellmer >=0.4.1
    - r-fastmap
    - r-htmltools
    - r-jsonlite
    - r-lifecycle
    - r-promises >=1.3.2
    - r-r6 >=2.5.0
    - r-rlang >=1.2.0
    - r-s7
    - r-shiny >=1.10.0
  run:
    - r-base
    - r-base64enc
    - r-bslib >=0.12.0
    - r-cli
    - r-coro
    - r-ellmer >=0.4.1
    - r-fastmap
    - r-htmltools
    - r-jsonlite
    - r-lifecycle
    - r-promises >=1.3.2
    - r-r6 >=2.5.0
    - r-rlang >=1.2.0
    - r-s7
    - r-shiny >=1.10.0

tests:
  - r:
      libraries:
        - shinychat

about:
  homepage: https://posit-dev.github.io/shinychat/r/
  repository: https://github.com/posit-dev/shinychat
  license: MIT
  license_family: MIT
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/MIT
    - LICENSE
  summary: Chat UI Component for 'shiny'
  description: |
    Provides a scrolling chat interface with multiline input, suitable for
    creating chatbot apps based on Large Language Models (LLMs). Designed
    to work particularly well with the 'ellmer' R package for calling LLMs.

extra:
  recipe-maintainers:
    - dipterix
    - conda-forge/r
