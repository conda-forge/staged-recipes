context:
  version: "0.2.0"

package:
  name: kaval
  version: ${{ version }}

source:
  url: https://github.com/AppachiTech/kaval/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8a5b046603c97cfa059e7f785aac5fe8e1ccd8949ee12fae9ce3442872cf6e24

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.PREFIX
      # build main app and generate license data
      - ^cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - ^cargo-bundle-licenses --format=yaml --output=./THIRDPARTY.yml
      # generate manpage and shell completions
      - if: build_platform == host_platform
        then:
          - ^kav man              | save --force ($prefix)/share/man/man1/kav.1
          - ^kav completions bash | save --force ($prefix)/share/bash-completion/completions/kav
          - ^kav completions fish | save --force ($prefix)/share/fish/vendor_completions.d/kav.fish
          - ^kav completions zsh  | save --force ($prefix)/share/zsh/site-functions/_kav
  skip: win # kaval supports only Unix

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell

tests:
  - script:
      - kav --help
      - kav --version
  - package_contents:
      bin:
        - kav
      files:
        - share/man/man1/kav.1
        - share/bash-completion/completions/kav
        - share/fish/vendor_completions.d/kav.fish
        - share/zsh/site-functions/_kav
      strict: true

about:
  summary: Guard your ports. A developer-focused port and process manager TUI.
  description: |
    Kaval is a developer-focused port and process manager TUI built in Rust.
    It shows listening ports, maps them to processes, identifies known development tools,
    and supports interactive and one-shot CLI workflows.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://www.appachi.tech/kaval
  repository: https://github.com/AppachiTech/kaval

extra:
  recipe-maintainers:
    - salim-b
