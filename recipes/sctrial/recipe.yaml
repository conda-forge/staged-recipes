context:
  name: sctrial
  version: "1.0.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 49c1c1a004c2b33eaf360b60a9077824f053b03e381e6b3c8dcde028a52e1fef

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - pandas >=1.5
    - scipy >=1.8
    - statsmodels >=0.13
    - anndata >=0.9
    - joblib >=1.2

tests:
  - python:
      imports:
        - sctrial
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/TheOmarLab/sctrial
  summary: "Participant-level differential analysis for longitudinal single-cell experiments"
  license: MIT
  license_file: LICENSE
  documentation: https://www.omar-lab.com/sctrial/
  repository: https://github.com/TheOmarLab/sctrial

extra:
  recipe-maintainers:
    - MohamedOmar2020
    - priyanka9991
