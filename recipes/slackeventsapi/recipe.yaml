context:
  version: "3.0.3"

package:
  name: slackeventsapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/slackeventsapi/slackeventsapi-${{ version }}.tar.gz
  sha256: 3277b66893bd16f3684b38d860b1fd42af6eca64060c5b7d1f50afbc49eb3b23

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  script_env:
    - PYTHONUTF8=1

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask >=2,<4
    - pyee >=8,<12

tests:
  - python:
      imports:
        - slackeventsapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/slackapi/python-slack-events-api
  summary: Python Slack Events API adapter for Flask
  description: |
    The Slack Events Adapter is a Python-based solution to receive and parse
    events from Slack's Events API. This library uses an event emitter
    framework to allow you to easily process Slack events by simply attaching
    functions to event listeners.
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/slackapi/python-slack-events-api
  repository: https://github.com/slackapi/python-slack-events-api

extra:
  recipe-maintainers:
    - m0nonoke
