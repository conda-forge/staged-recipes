schema_version: 1

context:
  version: "0.5.0"

package:
  name: napari-ome-zarr-navigator
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/napari-ome-zarr-navigator/napari_ome_zarr_navigator-${{ version }}.tar.gz
  sha256: f328c4cc5600217c0c34c3328721665cbb5841e829c91f206a755c794a36b2d4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - napari >=0.7
    - napari-ome-zarr !=0.8.0,!=0.8.1
    - magicgui
    - qtpy
    - numpy
    - pandas
    - ome-zarr
    - ngio >=1.1.2,<1.2
    - numcodecs !=0.14.0,!=0.14.1,!=0.16
    - requests
    - s3fs >=2024.2.0

tests:
  - script:
      - python -c "import napari_ome_zarr_navigator"
      - python -m pip check
    requirements:
      run:
        - python ${{ python_min }}.*
        - pip
        - pyqt6
  - script:
      - python -c "import napari_ome_zarr_navigator"
      - python -m pip check
    requirements:
      run:
        - python
        - pip
        - pyqt6

about:
  summary: A plugin to browse OME-Zarr plates by conditions and load images, labels and features from ROIs
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/fractal-napari-plugins-collection/napari-ome-zarr-navigator
  documentation: https://github.com/fractal-napari-plugins-collection/napari-ome-zarr-navigator

extra:
  recipe-maintainers:
    - jluethi
    - imagejan
