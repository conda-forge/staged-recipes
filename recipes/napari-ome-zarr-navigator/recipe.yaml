schema_version: 1

context:
  version: 0.4.0
  python_min: "3.11"

package:
  name: napari-ome-zarr-navigator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/napari-ome-zarr-navigator/napari_ome_zarr_navigator-${{ version }}.tar.gz
  sha256: dafb45a7223ab7243550277641ae9ffeb8bce44e61b114969f69c8ca44c6fb50

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - magicgui
    - qtpy
    - scikit-image
    - napari
    - napari-ome-zarr <0.8
    - ome-zarr
    - ngio >=0.5,<0.6
    - numcodecs !=0.14.0,!=0.14.1,!=0.16

tests:
  - script:
      - python -c "import napari_ome_zarr_navigator"
      - pip check
    requirements:
      run:
        - pyqt

about:
  summary: A plugin to browse OME-Zarr plates by conditions and load images, labels and features from ROIs
  # README.md
  license: BSD-3-Clause
  # README.md
  license_file: LICENSE  # README.md
  homepage: https://github.com/fractal-napari-plugins-collection/napari-ome-zarr-navigator
  documentation: https://github.com/fractal-napari-plugins-collection/napari-ome-zarr-navigator

extra:
  recipe-maintainers:
    - imagejan
