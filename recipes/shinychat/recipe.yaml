schema_version: 1

context:
  version: "0.6.0"

package:
  name: shinychat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shinychat/shinychat-${{ version }}.tar.gz
  sha256: fe7f19dc035f62b5cabb0467dff45129f11f786b2a5193d309ebcfebf3c3f705

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - htmltools >=0.7.0
    - shiny >=1.4.0
    - pydantic

tests:
  - python:
      imports:
        - shinychat
      pip_check: true
      python_version: ${{ python_min }}.*
  # Also exercise the import on the latest Python, but without pip_check:
  # shiny 1.4.0's pyhd8ed1ab_1 build pins python 3.10.*, so newer Pythons
  # resolve to pyhd8ed1ab_0, whose recorded metadata version is 0.0.0 (its
  # shiny.__version__ is correctly 1.4.0). That makes pip check report
  # "shinychat 0.6.0 has requirement shiny>=1.4.0, but you have shiny 0.0.0".
  # Once py-shiny-feedstock is unblocked by this recipe and rebuilt, pip_check
  # can be enabled here too.
  - python:
      imports:
        - shinychat
      pip_check: false
      python_version: "*"

about:
  summary: An AI Chat interface for Shiny apps.
  description: |
    shinychat provides a chat interface for Shiny for Python applications,
    making it straightforward to build conversational UIs backed by large
    language models. It supplies the `Chat` component and `chat_ui()` helper
    used by Shiny's `shiny.ui.Chat`, and streams responses from a range of
    model providers.
  license: MIT
  license_file: LICENSE
  homepage: https://posit-dev.github.io/shinychat/
  documentation: https://posit-dev.github.io/shinychat/py/
  repository: https://github.com/posit-dev/shinychat

extra:
  recipe-maintainers:
    - schloerke
    - cpsievert
    - gadenbuie
    - jcheng5
