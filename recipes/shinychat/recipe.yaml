schema_version: 1

context:
  version: "0.6.0"

package:
  name: shinychat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shinychat/shinychat-${{ version }}.tar.gz
  sha256: fe7f19dc035f62b5cabb0467dff45129f11f786b2a5193d309ebcfebf3c3f705

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - htmltools >=0.7.0
    - shiny >=1.4.0
    - pydantic

tests:
  - python:
      imports:
        - shinychat
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"

about:
  summary: An AI Chat interface for Shiny apps.
  license: MIT
  license_file: LICENSE
  homepage: https://posit-dev.github.io/shinychat/
  documentation: https://posit-dev.github.io/shinychat/py/

extra:
  recipe-maintainers:
    - schloerke
