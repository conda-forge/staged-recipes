{% set name = "shinychat" %}
{% set version = "0.6.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fe7f19dc035f62b5cabb0467dff45129f11f786b2a5193d309ebcfebf3c3f705

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - htmltools >=0.7.0
    - pydantic
    - shiny >=1.4.0

test:
  imports:
    - shinychat
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://posit-dev.github.io/shinychat/
  summary: An AI Chat interface for Shiny apps.
  description: |
    shinychat provides a chat interface for Shiny for Python applications,
    making it straightforward to build conversational UIs backed by large
    language models. It supplies the `Chat` component and `chat_ui()` helper
    used by Shiny's `shiny.ui.Chat`, and streams responses from a range of
    model providers.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://posit-dev.github.io/shinychat/py/
  dev_url: https://github.com/posit-dev/shinychat

extra:
  recipe-maintainers:
    - schloerke
    - cpsievert
    - gadenbuie
    - jcheng5
