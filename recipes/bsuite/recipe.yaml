schema_version: 1

context:
  version: "0.3.6"

package:
  name: bsuite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bsuite/bsuite-${{ version }}.tar.gz
  sha256: 18f1e6c49ff4092288b657e4f983c7794693300fb853cd65d59e027defa18a40

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - absl-py
    - dm-env
    - immutabledict
    - matplotlib-base
    - numpy
    - pandas
    - plotnine
    - scipy
    - scikit-image
    - six
    - termcolor

tests:
  - python:
      imports:
        - bsuite
        - bsuite.environments
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "import bsuite; env = bsuite.load_from_id('bandit/0'); env.reset(); env.step(0)"

about:
  summary: Core RL Behaviour Suite. A collection of reinforcement learning experiments.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/google-deepmind/bsuite
  repository: https://github.com/google-deepmind/bsuite

extra:
  recipe-maintainers:
    - jeongseok-meta
