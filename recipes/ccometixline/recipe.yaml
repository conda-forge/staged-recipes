context:
  version: "2.0.1"

package:
  name: ccometixline
  version: ${{ version }}

source:
  url: https://github.com/Haleclipse/CCometixLine/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d1966c51f28e12340a8be14826aee96a064bbce90b4211438d281f6022e8be2a

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - ccometixline --help
      - ccometixline --version
      - ccometixline preview --all --color none
  - package_contents:
      bin:
        - ccometixline
      strict: true

about:
  homepage: https://github.com/Haleclipse/CCometixLine
  summary: High-performance Claude Code StatusLine tool written in Rust
  description: |
    CCometixLine (ccline) is a fast, composable status line for Claude Code,
    written in Rust, with a full-screen configurator.
  license: MIT
  # upstream declares MIT in Cargo.toml and README but ships no LICENSE file
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/Haleclipse/CCometixLine

extra:
  recipe-maintainers:
    - pavelzw
