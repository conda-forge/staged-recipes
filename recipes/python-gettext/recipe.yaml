schema_version: 1

context:
  version: "5.0"

package:
  name: python-gettext
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-gettext/python-gettext-${{ version }}.tar.gz
  sha256: 869af1ea45e3dab6180557259824c2a62f1800e1286226af912431fe75c5084c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pythongettext
        - pythongettext.msgfmt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hannosch/python-gettext
  repository: https://github.com/hannosch/python-gettext
  summary: Python Gettext po to mo file compiler
  license: BSD-2-Clause
  license_file: LICENSE.rst

extra:
  recipe-maintainers:
    - killua156
