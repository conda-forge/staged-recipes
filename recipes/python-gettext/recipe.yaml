schema_version: 1

context:
  version: "5.0"

package:
  name: python-gettext
  version: ${{ version }}

source:
  # GitHub tag rather than the sdist: the sdist leaves out the .mo fixtures the tests compare against
  url: https://github.com/hannosch/python-gettext/archive/refs/tags/${{ version }}.tar.gz
  sha256: 59e1bffee8eaa2bb18c765d976b5a23b41dcf20208c96c339521ca5bb73263e5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pythongettext
        - pythongettext.msgfmt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - src/pythongettext/tests/
    script:
      - python -m unittest discover -v -s src/pythongettext/tests -t src/pythongettext/tests

about:
  homepage: https://github.com/hannosch/python-gettext
  repository: https://github.com/hannosch/python-gettext
  summary: Python Gettext po to mo file compiler
  license: BSD-2-Clause
  license_file: LICENSE.rst

extra:
  recipe-maintainers:
    - killua156
