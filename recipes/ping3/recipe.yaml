schema_version: 1

context:
  version: "5.1.6"
  build_number: "0"

package:
  name: ping3
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/ping3/ping3-${{ version }}.tar.gz
  sha256: 72588d79400d65dcd39c6c88a8f54b10ec46a9a0ff0a3e167d967e7e9c4fbe02

build:
  number: ${{ build_number }}
  noarch: python
  script: ${{ PYTHON }} -m pip install .
  python:
    entry_points:
      - ping3 = ping3.command_line:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - ping3
      pip_check: true

about:
  summary: A pure python3 version of ICMP ping implementation using raw socket.
  description: |-
    Ping3 is a pure python3 version of ICMP ping implementation using raw socket.
    (Note that on some platforms, ICMP messages can only be sent from processes running as root.)
  license: MIT
  license_file:
    - LICENSE
  homepage: https://github.com/kyan001/ping3

extra:
  recipe-maintainers:
    - soapy1
