schema_version: 1

context:
  version: "1.0.2"

package:
  name: stopwords
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stopwords/stopwords-${{ version }}.tar.gz
  sha256: 91cc3ecaab197dbd36164ab7cbaa02530154e5d75d0e562d4e1c1fd458b5b8cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - stopwords
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "import stopwords; assert 'the' in stopwords.get_stopwords('en'); assert stopwords.clean(['the', 'cat'], 'en') == ['cat']; assert len(stopwords.languages()) > 40"

about:
  homepage: https://github.com/astuanax/stopwords
  repository: https://github.com/astuanax/stopwords
  summary: Stopwords filter for 42 languages
  license: ISC
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
