context:
  name: uuid7-standard
  version: "1.1.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/uuid7_standard-${{ version }}.tar.gz
  sha256: 14cf739a37a1e6e85cff4c7460bd3f6bf4c48c1e44ce19a0857b08e172352c26

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - uuid7
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/uuid7-standard/
  repository: https://github.com/LeoVasanko/uuid7-standard
  summary: Pure Python UUIDv7 with datetime-based creation and timestamp extraction, filling gaps in stdlib and other implementations.
  license: MIT OR Unlicense
  license_file: LICENSE

extra:
  recipe-maintainers:
    - iparask
