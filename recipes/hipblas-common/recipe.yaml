schema_version: 1

context:
  version: "7.2.4"

package:
  name: libhipblas-common-devel
  version: ${{ version }}

source:
  url: https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/hipblas-common.tar.gz
  sha256: 5c7806accb2123b7a0a0d814517adc85335ab9c0ed3318fcbad2282d219f397b

build:
  number: 0
  skip: not linux
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - rocm-core ${{ version }}.*
    - rocm-cmake

tests:
  - requirements:
      run:
        - cmake-package-check
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    script:
      - cmake-package-check hipblas-common --targets roc::hipblas-common


  - package_contents:
      include:
        - hipblas-common/hipblas-common.h

about:
  homepage: https://github.com/ROCm/rocm-libraries
  repository: https://github.com/ROCm/rocm-libraries
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: Header-only library providing common definitions for hipBLAS and hipBLASLt.

extra:
  feedstock-name: hipblas-common
  recipe-maintainers:
    - traversaro
