context:
  version: "2026.11.4"

package:
  name: ophiolite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/ophiolite/ophiolite-${{ version }}.tar.gz
  sha256: 6b64c58f36b7ab62edea3a3effa7934dd38cd9c6ba262573bd7a471b03c8b9e6

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - ophiolite = ophiolite.cli:entrypoint

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - anyio >=4.2,<5
    - httpx >=0.28,<1
    - pydantic >=2.11,<3

tests:
  - python:
      imports:
        - ophiolite
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - ophiolite --help

about:
  homepage: https://github.com/tuna-soup/ophiolite-sdk
  summary: Preview scientific client for Ophiolite
  description: |
    The supported client for Ophiolite's public service API: it reads and publishes
    exact scientific revisions (wells, logs, tops, surfaces, seismic) from Python
    and from the `ophiolite` command line. Optional readers for LAS, ZGY and SEG-Y
    files are PyPI extras and are not part of this package.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  repository: https://github.com/tuna-soup/ophiolite-sdk

extra:
  recipe-maintainers:
    - tuna-soup
