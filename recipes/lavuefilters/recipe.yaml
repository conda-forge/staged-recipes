schema_version: 1

context:
  version: "1.2.5"

package:
  name: lavuefilters
  version: ${{ version }}

source:
  url: https://github.com/lavue-org/lavue-filters/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e748bb64da5afdf50df02ac5435b4bfab5d643c82fafae320606de77fd098fb1

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip 
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - lavue
    - pninexus
    - h5py
    - requests

tests:
  - python:
      imports:
        - lavuefilters

      python_version:
        - ${{ python_min }}.*
        - "*"


about:
  homepage: https://github.com/lavue-org/lavue-filters
  repository: https://github.com/lavue-org/lavue-filters
  license: GPL-2.0-or-later
  license_file: COPYRIGHT
  summary: Live Image Viewer plugins
  description: |
    LaVue Filters package contains a simple implementation of a LaVue plugins.

extra:
  recipe-maintainers:
    - jkotan
