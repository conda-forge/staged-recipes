context:
  name: skore-skills
  version: "0.8.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/skore-skills/skore_skills-${{ version }}.tar.gz
  sha256: 85246bc14e74de2d78d3b9430cfb73ee53028c5ef1714ef690f2df1ed2643c01

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - skore-skills = skore_skills.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - click

tests:
  - python:
      imports:
        - skore_skills
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - skore-skills --help

about:
  homepage: https://probabl.ai
  repository: https://github.com/probabl-ai/skore-skills
  summary: Deterministic CLI helpers for Probabl ML agent skills.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - glemaitre
    - GaetandeCast
    - thomass-dev
    - rouk1
    - jeromedockes
