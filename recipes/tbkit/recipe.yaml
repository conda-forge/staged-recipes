schema_version: 1

context:
  name: tbkit
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b2a6e51837d8aac4ecaf3b0f2534af9c5d20d9f9a4d6a7628bac3726cf56cb15

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.7

tests:
  - python:
      imports:
        - tbkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cpoli/tbkit
  repository: https://github.com/cpoli/tbkit
  summary: A Python package to build and solve Tight-Binding models
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpoli
