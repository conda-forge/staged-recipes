context:
  name: xlsx-viewer-pro
  version: "1.0.7"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xlsx-viewer-pro/xlsx_viewer_pro-${{ version }}.tar.gz
  sha256: 3ec7652133b26146f05312f0fcf88a46e9b62a9ace7ba3232b487f1b06042469

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - openpyxl >=3.1.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - xlsx_viewer
      pip_check: true
  - script:
      - python -m xlsx_viewer.cli --help

about:
  homepage: https://github.com/eminsk/xlsx_vievers
  summary: Modern Excel spreadsheet engine, 129 formula functions, SIMD SSE2 math, and desktop GUI viewer
  description: |
    A high-performance Python spreadsheet library, headless formula engine
    (129+ functions), native x64 SIMD SSE2 math engine, and modern desktop application.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/xlsx_vievers
  documentation: https://github.com/eminsk/xlsx_vievers#readme

extra:
  recipe-maintainers:
    - eminsk
