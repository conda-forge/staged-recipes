schema_version: 1

context:
  version: "1.7.0"

package:
  name: r-treesearch
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/TreeSearch_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/TreeSearch/TreeSearch_${{ version }}.tar.gz
  sha256: d5163182059dea5aa37235218c033a2533417c15a513c61ab7f4b9f0d1ac8b87

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/
    missing_dso_allowlist:
      - if: win
        then:
          - "*/R.dll"
          - "*/Rblas.dll"
          - "*/Rlapack.dll"

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - cross-r-base ${{ r_base }}.*
    - if: not win
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - make
    - if: win
      then:
        - ${{ compiler('m2w64_c') }}
        - ${{ stdlib('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
        - m2-filesystem
        - m2-make
        - m2-sed
        - m2-coreutils
        - m2-zip
  host:
    - r-base
    - r-ape >=5.6
    - r-cli >=3.0
    - r-cluster
    - r-fastmap
    - r-fastmatch >=1.1.3
    - r-fs
    - r-future
    - r-plottools
    - r-promises
    - r-protoclust
    - r-rcpp
    - r-rdpack >=0.7
    - r-rogue >2.0.0
    - r-shiny >=1.6.0
    - r-shinyjs
    - r-stringi
    - r-treedist >=2.6.3
    - r-treetools >=1.16
  run:
    - r-base
    - r-ape >=5.6
    - r-cli >=3.0
    - r-cluster
    - r-fastmap
    - r-fastmatch >=1.1.3
    - r-fs
    - r-future
    - r-plottools
    - r-promises
    - r-protoclust
    - r-rcpp
    - r-rdpack >=0.7
    - r-rogue >2.0.0
    - r-shiny >=1.6.0
    - r-shinyjs
    - r-stringi
    - r-treedist >=2.6.3
    - r-treetools >=1.16

tests:
  - r:
      libraries:
        - TreeSearch

about:
  homepage: https://ms609.github.io/TreeSearch/
  repository: https://github.com/ms609/TreeSearch/
  documentation: https://ms609.github.io/TreeSearch/
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: "Phylogenetic Analysis with Discrete Character Data"
  description: |
    Reconstruct phylogenetic trees from discrete data. Inapplicable character
    states are handled using the algorithm of Brazeau, Guillerme and Smith
    (2019) <doi:10.1093/sysbio/syy083> with the "Morphy" library, under equal
    or implied step weights. Contains a "shiny" user interface for
    interactive tree search and exploration of results, including character
    visualization, rogue taxon detection, tree space mapping, and cluster
    consensus trees (Smith 2022a, b) <doi:10.1093/sysbio/syab099>,
    <doi:10.1093/sysbio/syab100>. Profile Parsimony (Faith and Trueman, 2001)
    <doi:10.1080/10635150118627>, Successive Approximations (Farris, 1969)
    <doi:10.2307/2412182> and custom optimality criteria are implemented.

extra:
  recipe-maintainers:
    - conda-forge/r
    - ms609
