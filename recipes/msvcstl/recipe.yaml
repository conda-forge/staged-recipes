context:
  version: "14.44"

recipe:
  name: msvcstl-packages
  version: "${{ version }}"

source:
  # Upstream recently changed tagging to match MSVC, but the latest VS 2022 build still uses the old scheme
  - url: https://github.com/microsoft/STL/archive/refs/tags/2022-17.14.tar.gz
    sha256: 848542f4d92ea157dec5e66e1f71cde28675b34982390430ad11fcec0cd35bb0
  - url: https://github.com/boostorg/math/archive/4d0885ae44f7d4ce94568339b2ae5501eb234e8f.tar.gz
    sha256: 40d66987f3eabe43a2dcd02fdd96ea64dfd9b2b9387131051b7d8ba65436ea49
    target_directory: boost-math

build:
  number: 0
  skip: not win

outputs:
  - staging:
      name: msvcstl-build
    build:
      script:
        file: build.bat
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - python >=3.13

  - package:
      name: msvcstl-headers
    inherit: msvcstl-build
    build:
      noarch: generic
      files:
        - Library/include/c++/*
    requirements:
      run_constraints:
        - msvcstl-devel ==${{ version }}
        # Keep in sync with the __clang_major__ check in stl/inc/yvals_core.h
        - clangxx >=19
        - vs >=2022
    tests:
      - package_contents:
          files:
            - Library/include/c++/*
          strict: true

  - package:
      name: msvcstl
    inherit: msvcstl-build
    build:
      string: ${{ "debug_" if hardening == "debug" }}h${{ hash }}_${{ build_number }}
      files:
        - Library/bin/msvcp140_1${{ "d" if hardening == "debug" }}_conda.dll
        - Library/bin/msvcp140_2${{ "d" if hardening == "debug" }}_conda.dll
        - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_atomic_wait_conda.dll
        - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_codecvt_ids_conda.dll
        - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_conda.dll
    requirements:
      run_exports:
        - if: hardening == "debug"
          then: msvcstl * debug*
    tests:
      - package_contents:
          files:
            - Library/bin/msvcp140_1${{ "d" if hardening == "debug" }}_conda.dll
            - Library/bin/msvcp140_2${{ "d" if hardening == "debug" }}_conda.dll
            - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_atomic_wait_conda.dll
            - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_codecvt_ids_conda.dll
            - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_conda.dll
          strict: true

  - package:
      name: msvcstl-devel
    build:
      files:
        - Library/modules/modules.json
        - Library/modules/std.compat.ixx
        - Library/modules/std.ixx
        - Library/lib/stl_asan.lib
        - Library/lib/msvcprt${{ "d" if hardening == "debug" }}.lib
        - Library/lib/libcpmt${{ "d" if hardening == "debug" }}.lib
        - Library/lib/libcpmt${{ "d" if hardening == "debug" }}1.lib
        - if: hardening == "debug"
          then: Library/lib/libcpmtd0.lib
      string: ${{ "debug_" if hardening == "debug" }}h${{ hash }}_${{ build_number }}
    inherit: msvcstl-build
    requirements:
      host:
        - ${{ pin_subpackage("msvcstl", exact = True) }}
        - ${{ pin_subpackage("msvcstl-headers", exact = True) }}
      run:
        - if: hardening == "none"
          then: msvcstl * h*
          else: msvcstl * debug*
        - ${{ pin_subpackage("msvcstl", upper_bound = None) }}
        - ${{ pin_subpackage("msvcstl-headers", upper_bound = "x.x.x") }}
    tests:
      - package_contents:
          files:
            - Library/modules/modules.json
            - Library/modules/std.compat.ixx
            - Library/modules/std.ixx
            - Library/lib/stl_asan.lib
            - Library/lib/msvcprt${{ "d" if hardening == "debug" }}.lib
            - Library/lib/libcpmt${{ "d" if hardening == "debug" }}.lib
            - Library/lib/libcpmt${{ "d" if hardening == "debug" }}1.lib
            - etc/conda/test-files/*
            - if: hardening == "debug"
              then: Library/lib/libcpmtd0.lib
          strict: true
      - script: compile_test.bat
        requirements:
          run:
            - ${{ stdlib('c') }}
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
        files:
          recipe:
            - test_sources/

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: MSVC's implementation of the C++ Standard Library.
  homepage: https://github.com/microsoft/STL

extra:
  recipe-maintainers:
    - h-vetinari
    - isuruf
    - danielnachun
  feedstock-name: msvcstl
