context:
  version: 14.51

recipe:
  name: msvcstl-packages
  version: "${{ version }}"

source:
  - url: https://github.com/microsoft/STL/archive/refs/tags/msvc-build-tools-${{ version }}.tar.gz
    sha256: 504de81500b18e68829fcef9a14495d66b3d0c00e1a1b88456ff6e8b70cdf2c6
  - url: https://github.com/boostorg/math/archive/e0fcd19f7227d81391770ea46015acc3c80af810.tar.gz
    sha256: 1abfe848c60e409b88b3a7f4f592e2c0dad7a1e2798197dedf623588a77585a6
    target_directory: boost-math

build:
  number: 0
  skip: not win

outputs:
  - staging:
      name: msvcstl-build
    build:
      script:
        file: build.bat
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - python >=3.13

  - package:
      name: msvcstl-headers
    inherit: msvcstl-build
    build:
      noarch: generic
      files:
        - Library/include/c++/*
    requirements:
      run_constraints:
        - msvcstl-devel ==${{ version }}
        # Keep in sync with the __clang_major__ check in stl/inc/yvals_core.h
        - clangxx >=20
        - vs >=2022
    tests:
      - package_contents:
          files:
            - Library/include/c++/*
          strict: true

  - package:
      name: msvcstl
    inherit: msvcstl-build
    build:
      string: ${{ "debug_" if hardening == "debug" }}h${{ hash }}_${{ build_number }}
      files:
        - Library/bin/msvcp140_1${{ "d" if hardening == "debug" }}_conda.dll
        - Library/bin/msvcp140_2${{ "d" if hardening == "debug" }}_conda.dll
        - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_atomic_wait_conda.dll
        - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_codecvt_ids_conda.dll
        - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_conda.dll
    requirements:
      run_exports:
        - if: hardening == "debug"
          then: msvcstl * debug*
    tests:
      - package_contents:
          files:
            - Library/bin/msvcp140_1${{ "d" if hardening == "debug" }}_conda.dll
            - Library/bin/msvcp140_2${{ "d" if hardening == "debug" }}_conda.dll
            - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_atomic_wait_conda.dll
            - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_codecvt_ids_conda.dll
            - Library/bin/msvcp140${{ "d" if hardening == "debug" }}_conda.dll
          strict: true

  - package:
      name: msvcstl-devel
    build:
      files:
        - Library/modules/modules.json
        - Library/modules/std.compat.ixx
        - Library/modules/std.ixx
        - Library/lib/stl_asan.lib
        - Library/lib/msvcprt${{ "d" if hardening == "debug" }}.lib
        - Library/lib/libcpmt${{ "d" if hardening == "debug" }}.lib
        - Library/lib/libcpmt${{ "d" if hardening == "debug" }}1.lib
        - if: hardening == "debug"
          then: Library/lib/libcpmtd0.lib
      string: ${{ "debug_" if hardening == "debug" }}h${{ hash }}_${{ build_number }}
    inherit: msvcstl-build
    requirements:
      host:
        - ${{ pin_subpackage("msvcstl", exact = True) }}
        - ${{ pin_subpackage("msvcstl-headers", exact = True) }}
      run:
        - if: hardening == "none"
          then: msvcstl * h*
          else: msvcstl * debug*
        - ${{ pin_subpackage("msvcstl", upper_bound = None) }}
        - ${{ pin_subpackage("msvcstl-headers", upper_bound = "x.x.x") }}
    tests:
      - package_contents:
          files:
            - Library/modules/modules.json
            - Library/modules/std.compat.ixx
            - Library/modules/std.ixx
            - Library/lib/stl_asan.lib
            - Library/lib/msvcprt${{ "d" if hardening == "debug" }}.lib
            - Library/lib/libcpmt${{ "d" if hardening == "debug" }}.lib
            - Library/lib/libcpmt${{ "d" if hardening == "debug" }}1.lib
            - if: hardening == "debug"
              then: Library/lib/libcpmtd0.lib
          strict: true
      - script: compile_test.bat
        requirements:
          run:
            - ${{ stdlib('c') }}
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
        files:
          recipe:
            - test_sources/

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: MSVC's implementation of the C++ Standard Library.
  homepage: https://github.com/microsoft/STL

extra:
  recipe-maintainers:
    - h-vetinari
    - isuruf
    - danielnachun
  feedstock-name: msvcstl
