schema_version: 1

context:
  version: "2.1.0"
  python_min: "3.9"

package:
  name: shapegmmtorch
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/55/4e/7c387e68b79fc04921d1cc1fcac803f5721d730a80af80ef5fa38258477e/shapegmmtorch-${{ version }}.tar.gz
  sha256: 4f9f3f449d707a1db7b83bc8fe234a6cbc7ac345854399878dcbef02faeec18c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy          # new dependency in 2.x per changelog
    - pytorch >=2.6   # bumped requirement
    - matplotlib-base
    - mdanalysis
    - pillow >=10

tests:
  - python:
      imports:
        - shapeGMMTorch
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Gaussian Mixture Model clustering in size-and-shape space using PyTorch
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mccullaghlab/shapeGMMTorch

extra:
  recipe-maintainers:
    - FNTwin
