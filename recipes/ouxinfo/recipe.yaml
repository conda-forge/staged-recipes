schema_version: 1

context:
  name: ouxinfo
  version: "1.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: aa7af1e4a56a95465d2ecf1bb79d68f16998f2b3e62fd3baac3b0c0e7edbfcb8

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - pybind11
    - if: linux
      then: libgomp
    - if: osx
      then: llvm-openmp
  run:
    - python
    - numpy
    - matplotlib-base
    - scipy
    - tqdm
    - joblib
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
    - if: win
      then: vcomp14

tests:
  - python:
      imports:
        - ouxinfo
      pip_check: true

about:
  summary: Fast Shannon entropy estimator for causal inference in dynamical systems
  description: |
    OUxInfo is a high-performance Shannon entropy estimator for Python with a C++
    backend. It implements k-nearest-neighbor (KSG/Kozachenko-Leonenko) algorithms
    with a Chebyshev-metric k-d tree and OpenMP parallelization. Designed for
    information-theoretic causal inference: transfer entropy, mutual information,
    information flow, and KL divergence.
  license: MIT AND BSD-2-Clause AND BSL-1.0
  license_file:
    - LICENSE
    - third_party/nanoflann/LICENSE
    - third_party/boost/LICENSE_1_0.txt
  homepage: https://github.com/htymjun/OUxInfo
  repository: https://github.com/htymjun/OUxInfo
  documentation: https://htymjun.github.io/OUxInfo

extra:
  recipe-maintainers:
    - htymjun
