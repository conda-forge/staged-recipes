schema_version: 1

context:
  name: ouxinfo
  version: "1.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: cb6818e510e0ba00d2c5ac7559ce6c9fe0a35d44821c86e210d6d14b1f7b7768

build:
  number: 0
  skip: match(python, "<3.10")

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - pybind11
    - if: osx
      then: llvm-openmp
  run:
    - python
    - numpy
    - matplotlib-base
    - scipy
    - tqdm
    - joblib
    - if: osx
      then: llvm-openmp
    - if: linux
      then: _openmp_mutex >=4.5
    - if: win
      then: vcomp14

tests:
  - python:
      imports:
        - ouxinfo
      pip_check: true

about:
  summary: Fast Shannon entropy estimator for causal inference in dynamical systems
  description: |
    OUxInfo is a high-performance Shannon entropy estimator for Python with a C++
    backend. It implements k-nearest-neighbor (KSG/Kozachenko-Leonenko) algorithms
    with a Chebyshev-metric k-d tree and OpenMP parallelization. Designed for
    information-theoretic causal inference: transfer entropy, mutual information,
    information flow, and KL divergence.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/htymjun/OUxInfo
  repository: https://github.com/htymjun/OUxInfo
  documentation: https://htymjun.github.io/OUxInfo

extra:
  recipe-maintainers:
    - htymjun
