schema_version: 1

context:
  version: "0.1.1"

package:
  name: reactix
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/reactix/reactix-${{ version }}.tar.gz
  sha256: 0fc93f07138eab65f2d1628d258274ad2d4c53ea60d53226b7186a894d83ce3c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - jax >=0.4.14
    - equinox >=0.11.0
    - diffrax >=0.5.0
    - pymc >=5.0.0
    - arviz >=0.17.0
    - numpy >=1.24.0
    - nutpie >=0.13.0
    - matplotlib-base >=3.7.0
    - jupyter >=1.0.0
    - ipympl >=0.9.7
    - ipykernel >=6.29.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - reactix
      pip_check: true

about:
  summary: Reactive transport modelling with JAX and PyMC
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/astoeriko/reactix

extra:
  recipe-maintainers:
    - astoeriko
