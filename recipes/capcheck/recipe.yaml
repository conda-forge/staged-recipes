schema_version: 1

context:
  version: "0.1.4"

package:
  name: capcheck
  version: ${{ version }}

source:
  url: https://github.com/git-pkgs/capcheck/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d861b681b9abf3200dbd450bada80dffef72a887bee1cff630e6ee9b1250a134
  target_directory: src

build:
  number: 0
  script:
    - cd src
    - go-licenses save ./cmd/capcheck --save_path ../library_licenses
    - if: unix
      then: go build -v -o $PREFIX/bin/capcheck -ldflags="-s -w -X github.com/git-pkgs/capcheck/cmd/capcheck/app.Version=${{ version }}" ./cmd/capcheck
      else: go build -v -o %LIBRARY_BIN%\capcheck.exe -ldflags="-s -X github.com/git-pkgs/capcheck/cmd/capcheck/app.Version=${{ version }}" ./cmd/capcheck
    - if: unix
      then:
        - mkdir -p $PREFIX/share/zsh/site-functions $PREFIX/share/bash-completion/completions $PREFIX/share/fish/vendor_completions.d
        - $PREFIX/bin/capcheck completion zsh > $PREFIX/share/zsh/site-functions/_capcheck
        - $PREFIX/bin/capcheck completion bash > $PREFIX/share/bash-completion/completions/capcheck
        - $PREFIX/bin/capcheck completion fish > $PREFIX/share/fish/vendor_completions.d/capcheck.fish

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses
  run:
    # capcheck loads Go packages via golang.org/x/tools/go/packages, which shells out to `go list`
    - go

tests:
  - script:
      - capcheck --help
  - package_contents:
      bin:
        - capcheck
      files:
        - if: unix
          then:
            - share/bash-completion/completions/capcheck
            - share/fish/vendor_completions.d/capcheck.fish
            - share/zsh/site-functions/_capcheck
      strict: true

about:
  homepage: https://github.com/git-pkgs/capcheck
  summary: Fail CI when Go code or dependencies gain new privileged operations, using google/capslock
  description: |
    capcheck tells you when a Go module or one of its dependencies gains the
    ability to do something it couldn't before: spawn a process, open a socket,
    write a file, call cgo. A capability baseline is checked into the repository
    and CI fails when the capability set drifts. Built on google/capslock.
  license: MIT
  license_file:
    - src/LICENSE
    - library_licenses/
  documentation: https://pkg.go.dev/github.com/git-pkgs/capcheck
  repository: https://github.com/git-pkgs/capcheck

extra:
  recipe-maintainers:
    - soapy1
