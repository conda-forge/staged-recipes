schema_version: 1

context:
  version: "2.0.3"

package:
  name: spiralstrip
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/f1/71/51d1a7689e327784f2f1ac4ae0fca81d764d884b7e41e4163b954c512c3a/spiralstrip-2.0.3.tar.gz
  sha256: edb31fb1ecf8ae8f640fb1e9ab299d36c31d170d95566015415a4e1a8131257b

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.10
    - numpy >=1.23.5
    - matplotlib >=3.8

tests:
  - python:
      imports:
        - spiralstrip
        - spiralstrip_examples
      pip_check: true

about:
  homepage: https://github.com/skokg/Spiral-strip
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Draw data as colored segments arranged along a spiral using Matplotlib.
  description: |
    Spiral Strip draws color-coded segments arranged along a spiral. Segment
    widths and lengths can vary to represent additional data. The library
    supports standalone graphics and drawing into existing Matplotlib axes,
    including subplots and subfigures, with optional labels, titles, and colorbars.
  repository: https://github.com/skokg/Spiral-strip

extra:
  recipe-maintainers:
    - skokg
