schema_version: 1

context:
  version: "0.1.0"
  python_min: "3.9"

package:
  name: szl-formulas
  version: ${{ version }}

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - szl_formulas
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - python -c "import importlib.resources as r; assert r.files('szl_formulas').joinpath('formula_atlas.v1.json').is_file()"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/szl-holdings/szl-formulas
  repository: https://github.com/szl-holdings/szl-formulas
  documentation: https://github.com/szl-holdings/szl-formulas#readme
  license: Apache-2.0
  license_file: LICENSE
  summary: Canonical formula registry and governed-loop composer (software kernel)
  description: |
    szl-formulas is the canonical formula registry of the SZL Holdings governed-AI estate: a versioned atlas of named formulas with receipt-bound provenance, proof references, and governed-loop composition metadata. Pure-python, zero runtime dependencies. Software kernel, not a trained model.

extra:
  recipe-maintainers:
    - stephenlutar2-hash
