context:
  version: "0.1.5"

package:
  name: aristaproto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aristaproto/aristaproto-${{ version }}.tar.gz
  sha256: 8e736b3739bdc74989e6df5a146168570473a05ea150469cba45705be69c177f

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0,<2
  run:
    - python >=${{ python_min }}
    - grpclib >=0.4.1,<0.5
    - python-dateutil >=2.8,<3
    - typing-extensions >=4.7.1,<5

tests:
  - python:
      imports:
      - aristaproto
      pip_check: true
      python_version:
      - ${{ python_min }}.*
      - "*"

about:
  homepage: https://github.com/aristanetworks/python-aristaproto
  summary: Arista Protobuf / Python gRPC bindings generator & library
  description: |
    aristaproto is a Protobuf/gRPC bindings generator and library for Python,
    maintained by Arista Networks as a fork of betterproto. It provides
    idiomatic Python dataclasses generated from .proto files, along with
    async gRPC client/server support.
  license: MIT
  license_file: LICENSE.md
  repository: https://github.com/aristanetworks/python-aristaproto

extra:
  recipe-maintainers:
    - pb01ka
