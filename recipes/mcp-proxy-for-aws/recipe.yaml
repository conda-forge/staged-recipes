schema_version: 1

context:
  version: "1.7.0"

package:
  name: mcp-proxy-for-aws
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-proxy-for-aws/mcp_proxy_for_aws-${{ version }}.tar.gz
  sha256: f981ab4adb8862cdc3870decc39294c37bc37dd0f392bd98a93b3d73f7ea31dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - mcp-proxy-for-aws = mcp_proxy_for_aws.server:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - fastmcp >=3.2,<3.5
    - httpx >=0.27.1,<1.0
    - boto3 >=1.41.0
    # botocore[crt]
    - botocore >=1.41.0
    - awscrt

tests:
  - python:
      imports:
        - mcp_proxy_for_aws
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - mcp-proxy-for-aws --help

about:
  homepage: https://github.com/aws/mcp-proxy-for-aws
  summary: MCP Proxy for AWS
  description: |
    A lightweight proxy that connects MCP clients to MCP servers on AWS,
    signing requests with AWS SigV4 using the caller's AWS credentials.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://github.com/aws/mcp-proxy-for-aws/blob/main/README.md
  repository: https://github.com/aws/mcp-proxy-for-aws

extra:
  recipe-maintainers:
    - jviehhauser
