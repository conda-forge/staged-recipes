schema_version: 1

context:
  name: bioio-nd2
  version: "2.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/bioio_nd2-${{ version }}.tar.gz
  sha256: c07398784d68a1d4c6491305bafbe5608ab0fbc423389e242acee56eba786867

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=65
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - bioio-base >=3.4.0
    - nd2 >=0.10.3,!=0.11.0,!=0.11.1
    - imagecodecs >=2024.12.30
    - dask-core >=2021.4.1
    - numpy >=1.24
    - fsspec >=2022.8.0
    - pyyaml >=6.0
    - xarray >=0.16.1

tests:
  - python:
      imports:
        - bioio_nd2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "from importlib.metadata import entry_points as e; assert 'bioio-nd2' in [x.name for x in e(group='bioio.readers')]"
      - python -c "from bioio_nd2 import Reader"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: A BioIO reader plugin for reading Nikon ND2 files.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/bioio-devs/bioio-nd2
  repository: https://github.com/bioio-devs/bioio-nd2
  documentation: https://bioio-devs.github.io/bioio-nd2

extra:
  recipe-maintainers:
    - rmassei
