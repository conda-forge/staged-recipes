schema_version: 1

context:
  version: 0.66b0

package:
  name: opentelemetry-exporter-otlp-common
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/opentelemetry-exporter-otlp-common/opentelemetry_exporter_otlp_common-${{ version }}.tar.gz
  sha256: 362268ec6aa705e183776ff938539df1e8ce45bc5509d242538b1d40c26fe6a6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-sdk 1.45.*

tests:
  - python:
      imports:
        - opentelemetry.exporter.otlp.common
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: OpenTelemetry OTLP HTTP export utilities
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-common

extra:
  recipe-maintainers:
    - conda-forge/opentelemetry-api
    - conda-forge/opentelemetry-sdk
    - xhochy
