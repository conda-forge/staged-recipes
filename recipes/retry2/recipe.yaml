schema_version: 1

context:
  version: "0.9.5"

package:
  name: retry2
  version: ${{ version }}

source:
  url: https://github.com/eSAMTrade/retry/archive/refs/tags/${{ version }}.tar.gz
  sha256: 1538899bb054de81782622f041aedc928c87f253db8167574d70406d913ecac9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pbr
    - pip
  run:
    - python >=${{ python_min }}
    - decorator >=3.4.2


tests:
  - python:
      imports:
        - retry
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Easy to use retry decorator. [This is a fork of https://github.com/invl/retry which is not maintained anymore]
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/eSAMTrade/retry
  documentation: https://github.com/eSAMTrade/retry/blob/master/README.rst

extra:
  recipe-maintainers:
    - asuiu
    - pjtys
