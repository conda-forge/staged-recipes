schema_version: 1

context:
  version: "0.2.1"

package:
  name: r-jgd
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/jgd_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/jgd/jgd_${{ version }}.tar.gz
  sha256: 4f4db51ff1efb9d74e7e54b6727a77ceb6b2d6f84076099791eb125ae57eb57b

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/
    missing_dso_allowlist:
      - if: win
        then:
          - "*/R.dll"

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - cross-r-base ${{ r_base }}.*
    - if: not win
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - make
    - if: win
      then:
        - ${{ compiler('m2w64_c') }}
        - ${{ stdlib('m2w64_c') }}
        - m2-filesystem
        - m2-make
        - m2-sed
        - m2-coreutils
        - m2-zip
  host:
    - r-base
  run:
    - r-base

tests:
  - r:
      libraries:
        - jgd

about:
  homepage: https://github.com/REditorSupport/jgd
  repository: https://github.com/REditorSupport/jgd
  license: MIT
  # jgd vendors the MIT-licensed cJSON library (src/cjson/); its license is
  # shipped alongside jgd's own.
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/MIT
    - LICENSE
    - inst/COPYRIGHTS
    - LICENSE.cJSON
  summary: JSON Graphics Device
  description: |
    A graphics device that translates R plotting operations into JSON
    and streams them over a local connection to an external display
    application. The device acts as a pure recorder with no rendering
    dependencies; all rendering occurs in that application (e.g. a 'VS Code'
    extension or a web browser). Official display applications are available
    from the project homepage.

extra:
  recipe-maintainers:
    - conda-forge/r
    - roaldarbol
