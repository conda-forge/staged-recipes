schema_version: 1

context:
  name: fast-tsp
  version: "0.1.5"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fast_tsp-${{ version }}.tar.gz
  sha256: 0c801492ce5e56363faec5d9657a1b138a6765133f5b758f336e14a5185ee4b1

build:
  number: 0
  script:
    # scikit-build (classic) otherwise falls back to Makefiles/MSBuild
    env:
      CMAKE_GENERATOR: Ninja
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - pybind11
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - python
    - pip
    - setuptools
    - scikit-build
    - pybind11
  run:
    - python
    # pybind11/numpy.h binds to numpy at runtime, no numpy headers needed at build time
    - numpy >=1.0.0

tests:
  - python:
      imports:
        - fast_tsp
      pip_check: true
  - files:
      source:
        - tests/
    requirements:
      run:
        - pytest
    script:
      - pytest tests -v

about:
  homepage: https://github.com/shmulvad/fast-tsp
  summary: A fast TSP solver with Python bindings
  description: An SLS (Stochastic Local Search) solver for TSP (Travelling Salesman Problem).
  license: MIT AND BSD-3-Clause
  license_file: LICENSE
  documentation: https://fast-tsp.readthedocs.io
  repository: https://github.com/shmulvad/fast-tsp

extra:
  recipe-maintainers:
    - pmrv
