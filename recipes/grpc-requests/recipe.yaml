context:
  version: "0.1.21"

package:
  name: grpc-requests
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grpc_requests/grpc_requests-${{ version }}.tar.gz
  sha256: 9525bcbc5439f334b39248b9bd867313631e74530cfde1aaf43e76be0298bf20

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - grpcio >=1.60.1
    - grpcio-reflection >=1.60.1
    - protobuf >=4.25.0
    - google-api-core >=2.11.1
    - cryptography >=42.0.8

tests:
  - python:
      imports:
        - grpc_requests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/grpc-requests/grpc_requests
  summary: grpc for Humans. grpc reflection support client
  description: |
    grpc-requests leverages gRPC server reflection to interact with gRPC
    services in a familiar manner for users of the requests library, with
    support for all unary and stream methods, TLS, compression, and AsyncIO.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/grpc-requests/grpc_requests

extra:
  recipe-maintainers:
    - m0nonoke
