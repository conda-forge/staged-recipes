schema_version: 1

context:
  version: "1.0.3"

package:
  name: aiofastnet
  version: ${{ version }}

source:
  url: https://github.com/tarasko/aiofastnet/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b856b4127c44c05b0452756f0e0c1c25f5bb93ba38fbf1c20045352a50aca313

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: match(python, "<3.11")

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
  host:
    - python
    - setuptools >=78.0
    - wheel
    - cython >=3.2
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - aiofastnet
      pip_check: true

about:
  summary: Fast transport/protocol networking for asyncio
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tarasko/aiofastnet
  documentation: https://aiofastnet.readthedocs.io/en/latest

extra:
  recipe-maintainers:
    - thewchan
