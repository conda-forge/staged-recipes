context:
  version: "0.5.1"

package:
  name: osbng
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/osbng/osbng-${{ version }}.tar.gz
  sha256: 543f7a94b0b9a1f44e2ee6014b9c8ebe0b78b88b15e0950db36f7017fbe2c08e

build:
  noarch: python
  script:
    - python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    # Required to support the package's pyproject.toml PEP 639 SPDX license expression
    - setuptools >=78.0
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - shapely >=2.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - osbng
        - osbng.bng_reference
        - osbng.grids
        - osbng.hierarchy
        - osbng.indexing
        - osbng.traversal
      pip_check: true

about:
  homepage: https://github.com/OrdnanceSurvey/osbng-py
  summary: |
    A Python package supporting geospatial grid indexing and interaction 
    with Ordnance Survey's British National Grid index system
  description: |
    osbng offers a streamlined programmatic interface to Ordnance
    Survey's British National Grid (BNG) index system,
    enabling efficient spatial indexing and analysis based on
    grid references. It supports a range of geospatial
    applications, including statistical aggregation, data
    visualisation, and interoperability across datasets.
    Designed for developers and analysts working with
    geospatial data in Great Britain, osbng simplifies
    integration with geospatial workflows and provides
    intuitive tools for exploring the structure and logic of
    the BNG system.
  license: MIT
  license_file: LICENSE
  documentation: https://osbng-py.readthedocs.io/en/stable/
  repository: https://github.com/OrdnanceSurvey/osbng-py

extra:
  recipe-maintainers:
    - steve-kingston
    - kat-1218
