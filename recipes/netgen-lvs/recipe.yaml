context:
  version: "1.5.325"

package:
  name: netgen-lvs
  version: ${{ version }}

source:
  url: https://github.com/RTimothyEdwards/netgen/archive/${{ version }}.tar.gz
  sha256: 5fd4d16f88aa86d7ca32eff51120a4e298f7dbfba12af715eb14188ef92680c4

build:
  number: 0
  skip: 
    - win
    - osx

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - m4
  host:
    - tk
    - xorg-libx11
  run:
    - tk

tests:
  - script:
      # Simple test to verify the binary was linked properly and executes
      - echo "quit" | netgen

about:
  homepage: https://github.com/RTimothyEdwards/netgen
  summary: 'LVS tool for VLSI circuit netlists'
  license: GPL-1.0-only
  license_file: Copying

extra:
  recipe-maintainers:
    - MrAbhi19
