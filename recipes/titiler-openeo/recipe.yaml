schema_version: 1

context:
  version: "0.17.0"
  python_min: "3.11"

package:
  name: titiler-openeo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/titiler-openeo/titiler_openeo-${{ version }}.tar.gz
  sha256: f948f400e15ab92707e620e4de653aef9f99d59f92d123195fd6b938ccd495ec
  patches:
    # conda-forge only ships starlette-cramjam 0.7.0; upstream's <0.6 cap is
    # unsatisfiable here and pip_check reads the installed metadata.
    - patches/0001-relax-starlette-cramjam-pin.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.25.0
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - titiler-core >=2.0,<3.0
    - starlette-cramjam >=0.4
    - openeo-pg-parser-networkx ==2026.3.3
    - pystac-client
    - pydantic-settings >=2.0,<3.dev0
    - jsonpath-ng >=1.7.0,<1.8.dev0
    - obstore >=0.11
    - defusedxml >=0.7.1

tests:
  - python:
      imports:
        - titiler.openeo
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: TiTiler backend for openEO.
  license: MIT
  license_file: LICENSE
  homepage: https://sentinel-hub.github.io/titiler-openeo/
  repository: https://github.com/sentinel-hub/titiler-openeo
  documentation: https://sentinel-hub.github.io/titiler-openeo/

extra:
  recipe-maintainers:
    - martinRenou
    - arjxn-py
