schema_version: 1

context:
  version: "2.0.10"

package:
  name: deeptile
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/deeptile/deeptile-${{ version }}.tar.gz
  sha256: 81a0de2af28cc34cc8191f59eae541786b3f6308abf5a789d6ac6c7b08d8622b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - dask-core
    - nd2
    - numpy
    - tifffile

tests:
  - python:
      imports:
        - deeptile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Large image tiling and stitching library for scaling Python functions to arbitrary input image sizes.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/DeepTile/

extra:
  recipe-maintainers:
    - imagejan
