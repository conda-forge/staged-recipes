schema_version: 1

context:
  version: "6.0"

package:
  name: zope.sequencesort
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.sequencesort/zope_sequencesort-${{ version }}.tar.gz
  sha256: 81a745cc6261d5544de883593d1926867ceb5195b26727c88ed25bc39919fcea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.sequencesort
        - zope.sequencesort.ssort
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest discover -v zope.sequencesort

about:
  homepage: https://github.com/zopefoundation/zope.sequencesort
  repository: https://github.com/zopefoundation/zope.sequencesort
  documentation: https://zopesequencesort.readthedocs.io
  summary: Sequence Sorting
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
