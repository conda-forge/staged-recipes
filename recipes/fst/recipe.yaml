schema_version: 1

context:
  version: "0.0.2"

package:
  name: fst
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fst/fst-${{ version }}.tar.gz
  sha256: 66e0a8cc2561c0931bb5d79376e0219e35dc3c8dc584dc3da2127ebeee19ff12

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fst
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: FST in Python3 - NLP
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/fst/

extra:
  recipe-maintainers:
    - jan-janssen
