context:
  version: "0.1.0"

package:
  name: hdf5-jpeg2000
  version: ${{ version }}

source:
  url: https://github.com/hmaarrfk/hdf5_jpeg2000/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 29515b9e6eb7e68f9286e0368d580f062738f69c2659d4396fdf8c0c09ef1b52

build:
  number: 0
  script:
    - if: win
      then:
        - cmake -S . -B build -G Ninja %CMAKE_ARGS% -DCMAKE_BUILD_TYPE=Release -DHDF5_PLUGIN_INSTALL_DIR=lib/hdf5/plugin
        - cmake --build build
        - cmake --install build
      else:
        - cmake -S . -B build -G Ninja ${CMAKE_ARGS} -DCMAKE_BUILD_TYPE=Release -DHDF5_PLUGIN_INSTALL_DIR=lib/hdf5/plugin
        - cmake --build build
        - cmake --install build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - hdf5
    - libojph

tests:
  - package_contents:
      files:
        - if: linux
          then: lib/hdf5/plugin/libh5jpeg2000.so
        - if: osx
          then: lib/hdf5/plugin/libh5jpeg2000.dylib
        - if: win
          then: Library/lib/hdf5/plugin/h5jpeg2000.dll
  - if: not win
    then:
      requirements:
        run:
          - h5py
      script:
        - python -c "import h5py; assert h5py.h5z.filter_avail(32031)"
  # On Windows the hdf5 package has no default plugin directory inside the
  # environment, so HDF5 finds the plugin only through HDF5_PLUGIN_PATH. The
  # test sets it by hand, and first shows that it is needed.
  # https://github.com/conda-forge/hdf5-feedstock/pull/334 (hdf5 2.x) and
  # https://github.com/conda-forge/hdf5-feedstock/pull/335 (hdf5 1.14.x) set it
  # on activation instead.
  - if: win
    then:
      requirements:
        run:
          - h5py
      script:
        - set HDF5_PLUGIN_PATH=
        - python -c "import h5py; print('filter 32031 without HDF5_PLUGIN_PATH:', h5py.h5z.filter_avail(32031))"
        - set "HDF5_PLUGIN_PATH=%PREFIX%\Library\lib\hdf5\plugin"
        - python -c "import h5py; assert h5py.h5z.filter_avail(32031)"

about:
  homepage: https://github.com/hmaarrfk/hdf5_jpeg2000
  repository: https://github.com/hmaarrfk/hdf5_jpeg2000
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: HDF5 filter plugin 32031 that stores each chunk as a JPEG 2000 codestream
  description: |
    A dynamically loaded HDF5 filter plugin, registered as filter 32031, that
    stores each chunk of a dataset as one JPEG 2000 (including HTJ2K)
    codestream, encoded and decoded with libojph. It installs to
    lib/hdf5/plugin, the directory HDF5 searches by default on Linux and
    macOS, and to Library/lib/hdf5/plugin on Windows, which the hdf5
    package adds to HDF5_PLUGIN_PATH on activation.

extra:
  recipe-maintainers:
    - hmaarrfk
