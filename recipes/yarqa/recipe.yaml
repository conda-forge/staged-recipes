schema_version: 1

context:
  version: "0.5.0"
  python_min: "3.10"

package:
  name: yarqa
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/1b/00/9f0450d3518138e7ee2dac624b7c01738bc6b7b9c4f57c7231ea28dfacb5/yarqa-0.5.0.tar.gz
  sha256: b79b1033c995f199c80e2ad03f516eeb5bb6adee4a1f233cc112154579dc575e

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.23

tests:
  - python:
      imports:
        - yarqa
        - yarqa.core
        - yarqa.provenance
        - yarqa.agentic
        - yarqa.chain
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - 'python -c "import numpy as np; from yarqa import Mesh, compartmentalize; m = Mesh(np.array([[0.,0.],[1.,0.],[2.,0.]]), np.array([[1.,0.]]*3), [np.array([1]), np.array([0,2]), np.array([1])]); assert len(np.unique(compartmentalize(m))) == 3"'
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/szl-holdings/yarqa
  repository: https://github.com/szl-holdings/yarqa
  documentation: https://github.com/szl-holdings/yarqa#readme
  license: Apache-2.0
  license_file: LICENSE
  summary: Plug-flow compartmentalization for compartmental models (clean-room, Apache-2.0)
  description: |
    yarqa (Quechua: an Andean irrigation canal that divides and routes
    flowing water) partitions a CFD mesh into plug-flow compartments:
    maximal connected regions of cells whose velocity vectors are aligned
    and that span a coherent flow front. Ships receipt-bound provenance
    (compartmentalize_with_receipt, mesh fingerprints, receipt chains).
    Clean-room implementation by SZL Holdings, written from the published
    algorithm description only. numpy is the sole runtime dependency.

extra:
  recipe-maintainers:
    - stephenlutar2-hash
