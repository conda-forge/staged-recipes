context:
  name: option-risk-explain
  version: "0.2.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/bb/81/982012d6c21472359fad7c7722c25f25ccba57d48f41162b8d33eb04f098/option_risk_explain-0.2.0.tar.gz
  sha256: 265458fc204f274458ab550b8c29149ef7668d7f44c09866bcf0ff17c48e2c45

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - option_lab
      pip_check: true

about:
  homepage: https://garroshub.github.io/OptionRiskExplain/
  summary: 'Option Risk Explain: equity-option P&L attribution and exception review'
  license: MIT
  license_file: LICENSE
  repository: https://github.com/garroshub/OptionRiskExplain
  documentation: https://github.com/garroshub/OptionRiskExplain#readme

extra:
  recipe-maintainers:
    - garroshub
