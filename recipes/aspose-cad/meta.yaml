{% set name = "aspose-cad" %}
{% set version = "26.6.0" %}
{% set versionwin = "26.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source: 
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/aspose_cad-{{ version }}.tar.gz
    sha256: 8ff3ed303e09eba0ded4b78cfd7d3c6087ff6a015b2e5c4fefda15fd5ce06c1b

build:
  script: 
    - echo "Placeholder for Aspose.CAD documentation" > README.in
    
    {% if target_platform == "linux-64" %}
    - curl -L -O "https://pypi.org/packages/cf/7f/ed9b1cb3c1a258838ca36dcf782ecf91ac21f010bc6effc0882f87b4388b/aspose_cad-{{ version }}-py3-none-manylinux1_x86_64.whl"    
    - {{ PYTHON }} -m pip install aspose_cad-{{ version }}-py3-none-manylinux1_x86_64.whl --no-index --find-links . --no-deps --no-build-isolation --force-reinstall
    {% elif target_platform == "win-64" %}
    - curl -L -O "https://pypi.org/packages/b4/53/67ef7ac1d6a349319e282dfc23939c19656a0b68e382faf203b13a267ad3/aspose_cad-{{ versionwin }}-py3-none-win_amd64.whl"    
    - {{ PYTHON }} -m pip install aspose_cad-{{ versionwin }}-py3-none-win_amd64.whl --no-index --find-links . --no-deps --no-build-isolation --force-reinstall
    {% elif target_platform == "osx-arm64" %} 
    - curl -L -O "https://pypi.org/packages/fc/ad/79f8a37bfaf84183eec24ae400f104e0e8b12d831042dda743e91166d752/aspose_cad-{{ version }}-py3-none-macosx_11_0_arm64.whl"    
    - {{ PYTHON }} -m pip install aspose_cad-{{ version }}-py3-none-macosx_11_0_arm64.whl --no-index --find-links . --no-deps --no-build-isolation --force-reinstall
    {% endif %}
  number: 0
  missing_dso_allowlist:
    - "*/libc.so.6"  # [linux]
    - "*/libdl.so.2"  # [linux]
    - "*/libm.so.6"  # [linux]
    - "*/libpthread.so.0"  # [linux]
    - "*/librt.so.1"  # [linux]
    - "*/libz.so.1"  # [linux]
    - "*/libstdc++.so.6"  # [linux]
    - "*/libgcc_s.so.1"  # [linux]
    - "*/libutil.so.1"  # [linux]
    - "*/ld-linux-x86-64.so.2"  # [linux]
    - "*/libcurl.so.4"  # [linux]
    - "*/libgssapi_krb5.so.2"  # [linux]
    - "*/libkrb5.so.3"  # [linux]
    - "*/libcom_err.so.2"  # [linux]
    - "*/libk5crypto.so.3"  # [linux]
    - "*/libkrb5support.so.0"  # [linux]
    - "*/libresolv.so.2"  # [linux]
    - "*/liblttng-ust.so.0"  # [linux]
    - "*/kernel32.dll"  # [win]
    - "*/user32.dll"  # [win]
    - "*/gdi32.dll"  # [win]
    - "*/advapi32.dll"  # [win]
    - "*/shell32.dll"  # [win]
    - "*/ole32.dll"  # [win]
    - "*/version.dll"  # [win]
    - "*/vcruntime*.dll"  # [win]
    - "*/msvcp*.dll"  # [win]
    - "*/bcrypt.dll"  # [win]
    - "*/cryptsp.dll"  # [win]
    - "*/ws2_32.dll"  # [win]
    - "*/imm32.dll"  # [win]
    - "*/usp10.dll"  # [win]
    - "*/secur32.dll"  # [win]
    - "*/ncrypt.dll"  # [win]
    - "*/cfgmgr32.dll"  # [win]
    - "*/devobj.dll"  # [win]
    - "*/propsys.dll"  # [win]
    - "*/shcore.dll"  # [win]
    - "*/dwmapi.dll"  # [win]
    - "*/uxtheme.dll"  # [win]
    - "*/ntmarta.dll"  # [win]
    - "*/wldap32.dll"  # [win]
    - "*/winmm.dll"  # [win]
    - "*/winhttp.dll"  # [win]
    - "*/iphlpapi.dll"  # [win]
    - "*/dnsapi.dll"  # [win]
    - "*/netapi32.dll"  # [win]
    - "*/userenv.dll"  # [win]
    - "*/profapi.dll"  # [win]
    - "*/urlmon.dll"  # [win]
    - "*/wininet.dll"  # [win]
    - "*/wintrust.dll"  # [win]
    - "*/rsaenh.dll"  # [win]
    - "*/cryptbase.dll"  # [win]
    - "*/sspicli.dll"  # [win]
    - "*/sxs.dll"  # [win]
    - "*/apphelp.dll"  # [win]
    - "*/samcli.dll"  # [win]
    - "*/netutils.dll"  # [win]
    - "*/srvcli.dll"  # [win]
    - "*/wkscli.dll"  # [win]
    - "*/powrprof.dll"  # [win]
    - "*/setupapi.dll"  # [win]
    - "*/devrtl.dll"  # [win]
    - "*/linkinfo.dll"  # [win]
    - "*/portabledeviceapi.dll"  # [win]
    - "*/windowscodecs.dll"  # [win]
    - "*/xmllite.dll"  # [win]
    - "*/msxml6.dll"  # [win]
    - "*/api-ms-win-*"  # [win]
    - "*/python313.dll"  # [win]
    - "*/python*.dll"  # [win]
    - "*/python310.dll"  # [win]
    - "*/python311.dll"  # [win]
    - "*/python312.dll"  # [win]
    - "*/libSystem.B.dylib"  # [osx]
    - "*/libobjc.A.dylib"  # [osx]              
    - "*/CoreFoundation.framework/Versions/A/CoreFoundation"  # [osx]
    - "*/CFNetwork.framework/Versions/A/CFNetwork"  # [osx]
    - "*/ApplicationServices.framework/Versions/A/ApplicationServices"  # [osx]
    - "*/ImageIO.framework/Versions/A/ImageIO"  # [osx]
    - "*/Metal.framework/Versions/A/Metal"  # [osx]
    - "*/OpenGL.framework/Versions/A/OpenGL"  # [osx]
    - "*/QuartzCore.framework/Versions/A/QuartzCore"  # [osx]
    - "*/CoreGraphics.framework/Versions/A/CoreGraphics"  # [osx]
    - "*/CoreText.framework/Versions/A/CoreText"  # [osx]
    - "*/CoreData.framework/Versions/A/CoreData"  # [osx]
    - "*/Security.framework/Versions/A/Security"  # [osx]
    - "*/CoreFoundation.framework/Versions/A/CoreFoundation"  # [osx]
    - "*/libcompression.dylib"  # [osx]
  skip: true  # [not linux and not win]
requirements:
  host:
    - python 
    - pip
    - m2w64-toolchain  # [win and x64] 
    - setuptools
    - vs2015_runtime  # [win]
  run:
    - python 
    - vs2015_runtime  # [win]
    - libgcc >=15.2.0,<15.3.0  # [linux]
    - libstdcxx-ng >=15.2.0,<15.3.0  # [linux]
    - zlib >=1.3.2  # [linux]
    - libcurl >=8.21.0  # [linux]
    - krb5 >=1.22.2  # [linux] 

test:
  imports:
    - aspose.cad
  commands:
    - python -c "import aspose.cad; print(aspose.cad.__name__)"

about:
  home: https://products.aspose.com/cad/python
  summary: Aspose.CAD for Python is a CAD and BIM drawings Processing library that allows developers to modify, convert and publish various drawing and image formats without need to have any other CAD software.
  license: Proprietary
  license_file: License.txt

extra:
  recipe-maintainers:
    - alexefaspose
