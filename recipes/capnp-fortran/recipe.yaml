context:
  name: capnp-fortran
  version: "0.3.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/HaoZeke/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 902f93c1d178e9fa4d9cbde76b69f01335173e0d24c69dd9faf157ef2e9a8b88

build:
  number: 0
  # No native Windows Fortran compiler on conda-forge.
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - meson
    - ninja
    - pkg-config
  run_exports:
    - ${{ pin_subpackage('capnp-fortran', upper_bound='x.x') }}

tests:
  - package_contents:
      files:
        - include/capnp-fortran/capnp.mod
        - lib/pkgconfig/capnp-fortran.pc
      lib:
        - capnp_fortran
      bin:
        - capnpc-fortran

about:
  homepage: https://github.com/HaoZeke/capnp-fortran
  summary: Native modern-Fortran Cap'n Proto runtime and capnpc-fortran plugin
  description: |
    A Fortran 2018 implementation of the Cap'n Proto wire format: reader
    and builder, packed and canonical codecs, schema-evolution reads, an
    RPC vat, and capnpc-fortran, a plugin for the Cap'n Proto schema
    compiler that emits Fortran modules.

    Bytes are verified against the reference capnp CLI, including on
    big-endian hosts.
  license: MIT
  license_file:
    - LICENSE
  repository: https://github.com/HaoZeke/capnp-fortran
  documentation: https://capnp-fortran.rgoswami.me

extra:
  recipe-maintainers:
    - HaoZeke
