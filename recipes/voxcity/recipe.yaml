context:
  version: "1.8.3"

package:
  name: voxcity
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/voxcity/voxcity-${{ version }}.tar.gz
  sha256: fe82044dd503f389d7091f8725beab436faa47743c7f4c5a723962b8cd3b1009

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - affine
    - astral
    - contextily
    - earthengine-api
    - ezdxf >=1.1,<2
    - fiona >=1.9,<2
    - geemap
    - geopandas >=0.13,<2
    - geopy
    - h5py
    - ipyleaflet
    - ipython
    - ipywidgets >=7.6,<8
    - joblib
    - lxml
    - matplotlib-base
    - netcdf4
    - numba >=0.57,<1
    - numpy >=1.24,<3
    - osmnx
    - overturemaps
    - pandas >=1.5,<3
    - plotly
    - protobuf
    - py-vox-io
    - pycountry
    - pyproj >=3.4,<4
    - pyvista
    - rasterio >=1.3.11,<2
    - requests
    - reverse_geocoder
    - rio-cogeo
    - rtree
    - scikit-learn >=1.2,<2
    - scipy >=1.10,<2
    - seaborn
    - shapely >=2.0,<3
    - timezonefinder <9.1
    - tqdm
    - trimesh
    - xarray

tests:
  - python:
      imports:
        - voxcity
        - voxcity.io
        - voxcity.models
        - voxcity.generator
        - voxcity.exporter
        - voxcity.simulator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kunifujiwara/VoxCity
  summary: Generate 3D voxel city models anywhere from open geospatial data, then simulate solar, view and visibility and export to ENVI-met, PALM, OBJ and more
  description: |
    VoxCity builds a 3D voxel model of any urban area from open geospatial data
    (OpenStreetMap, Microsoft and Overture building footprints, global canopy
    height maps, Copernicus, FABDEM and national terrain) with no account needed,
    then runs solar irradiance, sky view factor, green view and visibility
    simulations on it, and exports to ENVI-met, PALM, OBJ, MagicaVoxel, NetCDF
    and GeoTIFF.
  license: MIT
  license_file: LICENSE
  documentation: https://voxcity.readthedocs.io/en/latest
  repository: https://github.com/kunifujiwara/VoxCity

extra:
  recipe-maintainers:
    - kunifujiwara
