# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"
  python_max: "3.13"

package:
  name: snowpark-connect-deps-iceberg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/snowpark-connect-deps-iceberg/snowpark_connect_deps_iceberg-${{ version }}.tar.gz
  sha256: 66271bcdecc8182c4cccfe5bd2fd2c081bb55466e17fcaf81332f82154775175

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<${{ python_max }}

tests:
  - python:
      imports:
        - snowpark_connect_deps_iceberg
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "import snowpark_connect_deps_iceberg as d; assert len(d.list_jars()) == 5"

about:
  homepage: https://www.snowflake.com
  summary: Iceberg Spark JAR dependencies for Snowpark Connect
  description: |
    This package contains Iceberg Spark SQL Extensions and runtime JAR files
    required for Iceberg SQL parser support on the SCOS server JVM classpath.
  license: Apache-2.0
  license_file:
    - LICENSE-binary
    - NOTICE-binary
    - LICENSE.txt

extra:
  recipe-maintainers:
    - sfc-gh-azhan
