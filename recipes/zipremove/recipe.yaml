schema_version: 1

context:
  version: "0.10.0"

package:
  name: zipremove
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/z/zipremove/zipremove-${{ version }}.tar.gz
  sha256: 3c5957c115447b54299d3a23128764b59c4558fc98c4b878ff2dbc5db8a62021

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - zipremove
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Extend `zipfile` with remove-related capabilities
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/danny0838/zipremove
  repository: https://github.com/danny0838/zipremove

extra:
  recipe-maintainers:
    - beenje
