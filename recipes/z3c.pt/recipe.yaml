schema_version: 1

context:
  version: "5.2"
  test_modules:
    - z3c.pt.tests.test_doctests
    - z3c.pt.tests.test_expressions
    - z3c.pt.tests.test_interfaces
    - z3c.pt.tests.test_loader
    - z3c.pt.tests.test_namespaces
    - z3c.pt.tests.test_templates

package:
  name: z3c.pt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/z3c.pt/z3c_pt-${{ version }}.tar.gz
  sha256: aaf5f547f2a7fd6d73248413a64dae3c0eeccd4c93c9b4cab76037587c1c3f07

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - zope.interface
    - zope.component
    - zope.i18n >=3.5
    - zope.traversing
    - zope.contentprovider
    - chameleon >=2.4

tests:
  - python:
      imports:
        - z3c.pt
        - z3c.pt.pagetemplate
        - z3c.pt.expressions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest -v ${{ test_modules | join(" ") }}
    requirements:
      run:
        - zope.configuration
        - zope.pagetemplate
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/z3c.pt
  repository: https://github.com/zopefoundation/z3c.pt
  summary: Fast ZPT engine
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
