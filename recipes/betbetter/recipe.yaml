context:
  name: betbetter
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/betbetter-${{ version }}.tar.gz
  sha256: b36ff9d05c4fb48873aede2c556149f97effce72503e99a5152a041d0fb8bf73

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - betbetter = betbetter.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - betbetter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - betbetter --help

about:
  homepage: https://betbetter.world/api/
  summary: Zero-dependency client for the free Bet Better sports model API (win probabilities and fair odds)
  description: |
    A small, dependency-free Python client and command-line tool for the free
    Bet Better sports model API. It returns published model win probabilities,
    the fair odds implied by them and predicted scores for upcoming fixtures in
    several leagues. No API key is required.
  license: MIT
  license_file: LICENSE
  documentation: https://betbetter.world/api/
  repository: https://gitlab.com/betbetterworld/betbetter-python

extra:
  recipe-maintainers:
    - edushinka
