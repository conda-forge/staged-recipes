package:
  name: tabiew
  version: 0.14.1

source:
  url: https://github.com/shshemi/tabiew/archive/refs/tags/v0.14.1.tar.gz
  sha256: b3e03aaaff81d68730d67392a135ac3fdfdf022880c66632ab188d2fe084cda3

build:
  number: 0
  skip: true  # [py27]

requirements:
  build:
    - rust >=1.80.0
    - cargo
  host:
    - rust >=1.80.0
  run:

test:
  commands:
    - tw --help
    - tw --version

about:
  home: https://github.com/shshemi/tabiew
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A lightweight TUI application to view and query tabular data files
  description: |
    Tabiew is a lightweight, terminal-based application to view and query
    delimiter-separated value formatted documents, such as CSV, TSV, Parquet,
    JSON, JSONL, Arrow, and other tabular data formats. It supports SQL queries,
    fuzzy search, and multiple data tables.
  doc_url: https://github.com/shshemi/tabiew
  dev_url: https://github.com/shshemi/tabiew

extra:
  recipe-maintainers:
    - christykanto