{% set name = "twobitreader-rs" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 2d480689e4ab85073fe6f01ae5d25c299125c3dc2bbdadb0770a7a88ca8fe254

build:
  number: 0
  skip: true  # [py<39]
  script:
    - export PYO3_CROSS_INCLUDE_DIR=$PREFIX/include            # [unix and build_platform != target_platform]
    - export PYO3_CROSS_LIB_DIR=$SP_DIR/../                    # [unix and build_platform != target_platform]
    - export PYO3_CROSS_PYTHON_VERSION=$PY_VER                 # [unix and build_platform != target_platform]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python                              # [build_platform != target_platform]
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - maturin >=1.15,<2.0                 # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - maturin >=1.15,<2.0
  run:
    - python

test:
  imports:
    - twobitreader_rs
  commands:
    - python -c "from twobitreader_rs import reverse_complement; assert reverse_complement('ACGTN') == 'NACGT'"
    - python -c "from twobitreader_rs import TwobitReader; assert hasattr(TwobitReader, 'get')"

about:
  home: https://github.com/andrewdelong/twobitreader-rust
  summary: Fast DNA sequence extraction from 2bit files
  description: |
    Python bindings for the twobitreader Rust crate. Reads the 2bit sequence format via
    memory map. Provides concatenation, reverse complement, and prefetch for cold files.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  doc_url: https://docs.rs/twobitreader
  dev_url: https://github.com/andrewdelong/twobitreader-rust

extra:
  recipe-maintainers:
    - andrewdelong
