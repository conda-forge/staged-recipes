schema_version: 1

context:
  name: pyiron_workflow_vasp
  version: "0.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 0ad46ad9354769b6d51dd72def75017cb90cbbb874172cccac5d4c31d604b776

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - versioneer ==0.29
  run:
    - python >=${{ python_min }},<3.15
    - ase >=3.21.0,<3.30.0
    - flowrep >=0.6.0,<0.7.0
    - monty >=2024.7.30,<2027.0.0
    - numpy >=1.22.0,<2.6.0
    - pandas >=1.3.0,<3.1.0
    - pyiron_snippets >=1.3.0,<2.0.0
    - pyiron_workflow >=0.19.0,<0.21.0
    - pyiron-workflow-atomistics >=0.2.2,<0.4.0
    - pymatgen >=2024.8.8,<2027.0.0
    - scipy >=1.17.1,<1.19.0
    - vaspparser >=0.0.9,<0.1.0

tests:
  - python:
      imports:
        - pyiron_workflow_vasp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A VASP workflow integration package for pyiron
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pyiron_workflow_vasp
  repository: https://github.com/pyiron/pyiron_workflow_vasp

extra:
  recipe-maintainers:
    - ligerzero-ai
