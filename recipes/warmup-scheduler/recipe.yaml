schema_version: 1

context:
  version: "0.3"

package:
  name: warmup-scheduler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/warmup-scheduler/warmup_scheduler-${{ version }}.tar.gz
  sha256: 63624cf5010772252c530ceb1a64e3fd60e3ee54264054da389f1b421089b714

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - warmup_scheduler
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"

about:
  summary: Gradually Warm-up LR Scheduler for Pytorch
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ildoonet/pytorch-gradual-warmup-lr

extra:
  recipe-maintainers:
    - jan-janssen
