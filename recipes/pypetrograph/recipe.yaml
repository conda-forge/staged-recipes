context:
  name: pypetrograph
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c65b3ea52be55c381087b21719829cd5ac506821db638147651c4030947d2e4f
  patches:
    # rapidocr_onnxruntime is not on conda-forge; the conda build has no
    # automatic legend names and the AMICS legend falls back to swatch_N
    - drop-rapidocr.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pypetrograph-app = pyPetrograph.webapp:main
      - pypetrograph-web = pyPetrograph.webapp:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - pillow >=10
    - matplotlib-base >=3.7
    - scikit-learn >=1.3
    - scipy >=1.10
    - geopandas >=0.14
    - shapely >=2
    - rasterio >=1.3
    - affine >=2.4
    - joblib >=1.3
    - pandas >=2
    - lightgbm >=4
    - scikit-image >=0.22
    - fastapi >=0.110
    - uvicorn >=0.27

tests:
  - python:
      imports:
        - pyPetrograph
        - pyPetrograph.amics.legend_read
        - pyPetrograph.common
        - pyPetrograph.image_processing
        - pyPetrograph.mineral_map
        - pyPetrograph.webapp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pypetrograph-app --help

about:
  summary: A toolkit for semi-automated, ML-assisted thin-section petrography
  license: AGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://geolarrylai.com/projects/pyPetrograph/
  repository: https://github.com/GeoLarryLai/pyPetrograph

extra:
  recipe-maintainers:
    - GeoLarryLai
