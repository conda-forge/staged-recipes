context:
  name: pypetrograph
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d549d5ce5642669cbc04325b37470a29fa81c37c4950683c7bc615be1717002f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pypetrograph-app = pyPetrograph.webapp:main
      - pypetrograph-web = pyPetrograph.webapp:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - pillow >=10
    - matplotlib-base >=3.7
    - scikit-learn >=1.3
    - scipy >=1.10
    - geopandas >=0.14
    - shapely >=2
    - rasterio >=1.3
    - affine >=2.4
    - joblib >=1.3
    - pandas >=2
    - lightgbm >=4
    - scikit-image >=0.22
    - rapidocr >=3,<4
    - onnxruntime
    - fastapi >=0.110
    - uvicorn >=0.27

tests:
  - python:
      imports:
        - pyPetrograph
        - pyPetrograph.amics.legend_read
        - pyPetrograph.common
        - pyPetrograph.image_processing
        - pyPetrograph.mineral_map
        - pyPetrograph.webapp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pypetrograph-app --help
  - package_contents:
      files:
        - site-packages/pyPetrograph/ocr_models/ch_PP-OCRv4_det_infer.onnx
        - site-packages/pyPetrograph/ocr_models/ch_PP-OCRv4_rec_infer.onnx
        - site-packages/pyPetrograph/ocr_models/ch_ppocr_mobile_v2.0_cls_infer.onnx

about:
  summary: A toolkit for semi-automated, ML-assisted thin-section petrography
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/GeoLarryLai/pyPetrograph
  repository: https://github.com/GeoLarryLai/pyPetrograph

extra:
  recipe-maintainers:
    - GeoLarryLai
