schema_version: 1

context:
  version: "0.11.0"

package:
  name: hamop
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hamop/hamop-${{ version }}.tar.gz
  sha256: c37fbacc4b5863d5d381985736d22aad85d27f4d840e65851e319f7b16378fec

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.8

tests:
  - python:
      imports:
        - hamop
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/hamop
  license: Apache-2.0
  license_file: LICENSE
  summary: "One tight-binding Hamiltonian, every observable: bands, optics, topology, transport, quantum geometry"
  description: |
    Bands, DOS, Kubo optical and Hall conductivity, topology (Chern,
    Berry), quantum geometric tensor and quantum weight, NEGF transport,
    magnetic fields and sparse solvers, all computed from one model and
    checked against closed-form results in the test suite.
  repository: https://github.com/TaN-MM-Org/hamop
  documentation: https://github.com/TaN-MM-Org/hamop#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
