schema_version: 1

context:
  version: "0.16.0"

package:
  name: hamop
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hamop/hamop-${{ version }}.tar.gz
  sha256: 97eb2799a9a0212fc447bc878f31442010deea305a1da51d1c1c7c49a229a8fd

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.8

tests:
  - python:
      imports:
        - hamop
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/hamop
  license: Apache-2.0
  license_file: LICENSE
  summary: "One tight-binding model, many results: bands, density of states, optical conductivity, transport and topology"
  description: |
    Build a tight-binding model once (a list of orbitals and the energies
    for hopping between them) and compute from it the band structure and
    density of states, the optical conductivity, the transmission of a small
    device between two leads with the conductance, current and thermovoltage
    it gives, and topological numbers such as the Chern number and the Z2
    index. It also fits model parameters to measured band energies, with
    error bars.
  repository: https://github.com/TaN-MM-Org/hamop
  documentation: https://github.com/TaN-MM-Org/hamop#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
