context:
  version: "3.0.2"

package:
  name: mealpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mealpy/mealpy-${{ version }}.tar.gz
  sha256: 979190bd1fb3844f7be313ba333296ff0a0f0d6e825de30d203cc9f953043972

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.17.5
    - matplotlib-base >=3.3.0
    - scipy >=1.7.1
    - pandas >=1.2.0
    - opfunu >=1.0.0

tests:
  - python:
      imports:
        - mealpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/thieu1995/mealpy
  summary: 'MEALPY: An Open-source Library for Latest Meta-heuristic Algorithms in Python'
  license: GPL-3.0-only
  license_file: LICENSE
  documentation: https://mealpy.readthedocs.io/
  repository: https://github.com/thieu1995/mealpy

extra:
  recipe-maintainers:
    - ChaiThere
