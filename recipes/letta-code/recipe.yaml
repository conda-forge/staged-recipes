schema_version: 1

context:
  version: "0.34.68"

package:
  name: letta-code
  version: ${{ version }}

source:
  - url: https://registry.npmjs.org/@letta-ai/letta-code/-/letta-code-${{ version }}.tgz
    sha256: c257511bd89e5926590ba51691fdae4e108eda7b0ab1f8f542fd006b2499f3b6
  # License sources for code already bundled in letta.js, absent from the
  # production npm tree. Versions match upstream v0.34.68's bun.lock.
  - url: https://registry.npmjs.org/@isaacs/balanced-match/-/balanced-match-4.0.1.tgz
    sha256: b4593f0b61a94bb72521b5868b9da79e5f26b353d2cb958a1822adc3759915b0
    target_directory: bundled-licenses/balanced-match
  - url: https://registry.npmjs.org/@isaacs/brace-expansion/-/brace-expansion-5.0.0.tgz
    sha256: 8fdc99765aecc21df209d673caff35e5da16b072344edcd127c31d996e87b964
    target_directory: bundled-licenses/brace-expansion
  - url: https://registry.npmjs.org/cli-spinners/-/cli-spinners-2.9.2.tgz
    sha256: 46c24c4edebc7b1297c6e9bb92b2f53f0be5c59037bbe1a695ffc953da02b48c
    target_directory: bundled-licenses/cli-spinners
  - url: https://registry.npmjs.org/ink-spinner/-/ink-spinner-5.0.0.tgz
    sha256: ec2d623b516cf3fe50584b6dc6d9c8b18cd4560a8be437fe70587d17dc8b70cf
    target_directory: bundled-licenses/ink-spinner
  - url: https://registry.npmjs.org/ink-text-input/-/ink-text-input-5.0.1.tgz
    sha256: d74b5ac29958f68c5da3020cace777e471bc0950c9fbddade8bf8b938b7d2aee
    target_directory: bundled-licenses/ink-text-input
  - url: https://registry.npmjs.org/picomatch/-/picomatch-2.3.1.tgz
    sha256: 1b14ee9ec867c090d7b52c77193d83e77910553b3d18b2f86dd2b7b55e82c11f
    target_directory: bundled-licenses/picomatch
  - url: https://registry.npmjs.org/typescript/-/typescript-5.9.3.tgz
    sha256: 10e108c9cf7d5f2879053dff18515fb405abf2ccef63eaaf017d9c571687a1d3
    target_directory: bundled-licenses/typescript
  # Additional upstream license texts missing from some npm packages.
  - url: https://raw.githubusercontent.com/AlCalzone/ansi-tokenize/f0bc91b9bb8dc1c201b6c5a21183464d6c9cfaf8/LICENSE
    sha256: c60f722e431aa92d949775157b269851c9d0e2a1bc18f77dcbf0d95363734443
    file_name: ANSI-TOKENIZE-LICENSE
    target_directory: supplemental-licenses
  - url: https://raw.githubusercontent.com/facebook/yoga/v3.2.1/LICENSE
    sha256: 52412d7bc7ce4157ea628bbaacb8829e0a9cb3c58f57f99176126bc8cf2bfc85
    file_name: YOGA-LICENSE
    target_directory: supplemental-licenses
  - url: https://raw.githubusercontent.com/aws/aws-sdk-js-v3/v3.998.0/LICENSE
    sha256: edea91454b811f127fbdea3d86f378f6719bd372ed440abf82b232f6fca06c3d
    file_name: AWS-SDK-LICENSE
    target_directory: supplemental-licenses
  - url: https://raw.githubusercontent.com/earendil-works/pi/v1.6.0/LICENSE
    sha256: 0457f5bcec3b3b211605dfb5d1a49042fd638f3686a410fe099c24a25af13c48
    file_name: PI-LICENSE
    target_directory: supplemental-licenses
  - url: https://raw.githubusercontent.com/standard-webhooks/standard-webhooks/daee8284cfe9d4e435ec16e3e68a8f30084d6aaf/libraries/LICENSE
    sha256: 5ec8c7b26b64d881a6706617bed25c049f97f2f35de034c756de8546fd6dbe27
    file_name: STANDARDWEBHOOKS-LICENSE
    target_directory: supplemental-licenses
  - url: https://raw.githubusercontent.com/TooTallNate/proxy-agents/890a2080267b35f5accfa3ee0edd165f158a3c4d/packages/proxy-agent/LICENSE
    sha256: 8d8c55319c7729d57be811c747452636688d54f19701ee0752b6b15ad3771d9a
    file_name: PROXY-AGENTS-LICENSE
    target_directory: supplemental-licenses

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - node-gyp >=13.1.0,<14
    - pnpm-licenses >=2.4.2,<3
    - if: unix
      then:
        - make
        - pkg-config
        - patch
    - if: win
      then:
        - m2w64-jq
        - m2-patch
      else: jq
    - python
    - nodejs
  host:
    - nodejs
    - libvips
    - glib
    - zlib
    - expat
    - bzip2
    - libxml2-devel
  run:
    - nodejs
    - ripgrep

tests:
  - script: letta --version
  - script: letta --help

about:
  homepage: https://docs.letta.com/letta-code
  repository: https://github.com/letta-ai/letta-code
  summary: Memory-first coding agent
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.txt
    - third-party-licenses/**
    - bundled-licenses/**/license*
    - bundled-licenses/**/LICENSE*
    - bundled-licenses/**/ThirdPartyNoticeText.txt
    - supplemental-licenses/*

extra:
  recipe-maintainers:
    - eunos-1128
