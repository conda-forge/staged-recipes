schema_version: 1

context:
  version: "0.0.3"

package:
  name: spey-hs3
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/spey_hs3/spey_hs3-${{ version }}.tar.gz
  sha256: e03a46536fa9759cc4cb6d5abed612e112a3b0b0605db645419b8058f88145ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - spey >=0.2.1
    - pyhs3 ==0.4.1
    - pytensor <3.0.0

tests:
  - python:
      imports:
        - spey_hs3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: HS3 plugin for spey interface
  description: |
    spey-hs3 is a Spey plug-in that reads statistical models serialised in the
    HEP Statistics Serialization Standard (HS3) JSON format.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/SpeysideHEP/spey-hs3
  repository: https://github.com/SpeysideHEP/spey-hs3
  documentation: https://spey-hs3.readthedocs.io

extra:
  recipe-maintainers:
    - jackaraz
