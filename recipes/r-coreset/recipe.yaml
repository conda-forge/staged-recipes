schema_version: 1

context:
  version: "1.0.0"

package:
  name: r-coreset
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/Coreset_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/Coreset/Coreset_${{ version }}.tar.gz
  sha256: daf2ee4f15a1ce6c8d68f66180865695e3b310db350724a7ced121453c69403c

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/
    missing_dso_allowlist:
      - if: win
        then:
          - "*/R.dll"
          - "*/Rblas.dll"
          - "*/Rlapack.dll"

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - cross-r-base ${{ r_base }}.*
    - if: not win
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - make
    - if: win
      then:
        - ${{ compiler('m2w64_c') }}
        - ${{ stdlib('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
        - m2-filesystem
        - m2-make
        - m2-sed
        - m2-coreutils
        - m2-zip
  host:
    - r-base
    - if: linux
      then:
        - libgomp
    - if: osx
      then:
        - llvm-openmp
    - r-cli >=3.0.0
    - r-rcpp
    - r-rdpack >=0.7
  run:
    - r-base
    - r-cli >=3.0.0
    - r-rcpp
    - r-rdpack >=0.7

tests:
  - r:
      libraries:
        - Coreset

about:
  homepage: https://ms609.github.io/Coreset/
  repository: https://github.com/ms609/Coreset
  documentation: https://ms609.github.io/Coreset/
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: "Discrete Diversity, Dispersion, and Coverage Subset Selection"
  description: |
    Solves discrete location objectives on a distance matrix or Euclidean
    coordinate set. The Max-Min Diversity (MMDP / p-dispersion) objective,
    which maximizes the minimum pairwise distance within a selection of k
    items, is solved by farthest-first selection (Gonzalez 1985)
    <doi:10.1016/0304-3975(85)90224-5>; the DropAdd tabu-search heuristic
    (Porumbel, Hao & Glover 2011) <doi:10.1007/s10479-011-0898-z>, GRASP with
    path-relinking (Resende, Marti, Gallego & Duarte 2010)
    <doi:10.1016/j.cor.2008.05.011>, and an exact node-packing integer
    program (Sayyady & Fathi 2016) <doi:10.1016/j.ejor.2016.02.026>. The
    Max-Mean Dispersion objective, which selects a subset of unrestricted
    size maximising the sum of its pairwise distances divided by the number
    of selected elements, is solved by reinforcement-learning-guided tabu
    search (Nijimbere et al. 2020) <doi:10.3934/jimo.2020115>. The discrete
    k-centre (min-max covering / facility location) objective, which chooses
    k centres to minimise the largest distance from any point to its nearest
    centre, is solved via the CDSh heuristic (Garcia-Diaz et al. 2017
    <doi:10.1007/s10732-017-9345-x>, 2019 <doi:10.1109/ACCESS.2019.2933875>),
    and an exact minimum-cover integer program. The maximum-entropy (maxdet)
    objective, which maximises the log-determinant of a similarity kernel
    built from the distances (Shewry & Wynn 1987
    <doi:10.1080/02664768700000020>; the mode of a determinantal point
    process, Kulesza & Taskar 2012 <doi:10.1561/2200000044>), is solved by
    greedy pivoted-Cholesky selection and, for small instances, exact
    enumeration.

extra:
  recipe-maintainers:
    - conda-forge/r
    - ms609
