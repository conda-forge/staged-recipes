schema_version: 1

context:
  name: rocprim
  version: "7.2.4"

package:
  name: librocprim-devel
  version: ${{ version }}

source:
  url: https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/rocprim.tar.gz
  sha256: 3ec26b7ae729aad766366110b3a5341793342ca1351cf4c72d38f28e8f26aa75

build:
  number: 0
  skip:
    - not linux
    - hip_compiler_version in (None, "None")
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('hip') }}
    - cmake
    - pkg-config
    - ninja
  host:
    - rocm-cmake
  run:
    - hip-devel

tests:
  - requirements:
      run:
        - cmake-package-check
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    script:
      - cmake-package-check rocprim
  - package_contents:
      include:
        - ${{ name }}/${{ name }}.hpp

about:
  homepage: https://rocm.docs.amd.com/projects/rocPRIM
  summary: "rocPRIM: ROCm Parallel Primitives Library"
  description: |
    rocPRIM is a header-only library that provides HIP parallel primitives.
    You can use this library to develop performant GPU-accelerated code on
    AMD ROCm platforms.
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  repository: https://github.com/ROCm/rocm-libraries

extra:
  recipe-maintainers:
    - flferretti
    - conda-forge/rocm-core
