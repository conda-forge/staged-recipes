context:
  version: "0.2.0"

package:
  name: bytestruct
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bytestruct/bytestruct-${{ version }}.tar.gz
  sha256: ef0767fe48c0be9b2e4585565d8b28959fa04c93256ddeb7efbbd1b8f5998011

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.1.0

tests:
  - python:
      imports:
        - bytestruct
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/doronz88/bytestruct
  summary: Declarative binary struct parsing and building
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
