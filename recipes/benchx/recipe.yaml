context:
  version: "0.1.0"

package:
  name: benchx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/benchx/benchx-${{ version }}.tar.gz
  sha256: 40815f23c97d6ac2cf31be3d3a568e9a04bbe6a56d82d1ed746c2a47ab38576c

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - bx = benchx.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.26
  run:
    - python >=${{ python_min }}
    - pyarrow >=19
    - jsonschema-with-format-nongpl >=4.18
    - jsonpointer >=2.0
    - referencing
    - rfc8785

tests:
  - python:
      imports:
        - benchx
        - benchx.cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - pyperf
        - asv_runner
    script:
      - bx --help
      # The test suite is POSIX-only; it uses os.geteuid().
      - if: unix
        then: python -m pytest --pyargs benchx -ra

about:
  homepage: https://github.com/benchx-dev/benchx
  repository: https://github.com/benchx-dev/benchx
  documentation: https://benchx-dev.github.io/benchx/benchx/
  summary: "BenchX: a flexible and powerful benchmarking framework"
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rok
    - ev-br
