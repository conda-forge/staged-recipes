context:
  version: "0.2.0"

package:
  name: benchx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/benchx/benchx-${{ version }}.tar.gz
  sha256: 9e8be566f8581baee2a51aadb2abea96ceeb1063cee35c60501a4042d87c5c8f

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv
  python:
    entry_points:
      - bx = benchx.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.26
  run:
    - python >=${{ python_min }}
    - jsonschema >=4.18
    - rfc3339-validator
    - rfc3986-validator >0.1.0
    - referencing
    - rfc8785

tests:
  - python:
      imports:
        - benchx
        - benchx.cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - pyperf
        - asv_runner
    script:
      - bx --help
      # The test suite is POSIX-only; it uses os.geteuid().
      - if: unix
        then: python -m pytest --pyargs benchx -ra

about:
  homepage: https://benchx.dev/
  repository: https://github.com/benchx-dev/benchx
  documentation: https://benchx.dev
  summary: "BenchX: a flexible and powerful benchmarking framework"
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rok
    - ev-br
