schema_version: 1

context:
  name: renovate
  version: "44.149.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/${{ name }}/-/${{ name }}-${{ version }}.tgz
  sha256: 99398318ba96eea465f855d5ec00b524078ac23425d655d8d6b784c0679066cd
  file_name: ${{ name }}-${{ version }}.tgz

build:
  number: 0
  script:
    # file_name keeps the tarball unextracted (npm installs from it); unpack a copy for pnpm-licenses
    - tar xzf ${{ name }}-${{ version }}.tgz --strip-components=1
    - pnpm install --prod --ignore-scripts --no-optional
    - pnpm-licenses generate-disclaimer --prod --output-file=third-party-licenses.txt
    - npm install -ddd --global --omit=optional --ignore-scripts ${{ SRC_DIR }}/${{ name }}-${{ version }}.tgz

requirements:
  build:
    - nodejs 24.*
    - pnpm
    - pnpm-licenses
  run:
    - nodejs >=24.11

tests:
  - script:
      - renovate --version
      - renovate-config-validator --help

about:
  homepage: https://github.com/renovatebot/renovate
  repository: https://github.com/renovatebot/renovate
  documentation: https://docs.renovatebot.com/
  summary: Automated dependency updates. Multi-platform and multi-language.
  license: AGPL-3.0-only
  license_file:
    - license
    - third-party-licenses.txt

extra:
  recipe-maintainers:
    - mediocretech
