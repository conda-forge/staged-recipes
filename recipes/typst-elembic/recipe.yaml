context:
  version: "1.1.1"

package:
  name: typst-elembic
  version: ${{ version }}

source:
  url: https://github.com/PgBiel/elembic/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 1feb83aae1144b1c91a1365dee1347c2840cf7dd3c58429464a4d1952227a08d

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p "$TYPST_PACKAGE_PATH/preview/elembic/${{ version }}"
    - cp -r src typst.toml README.md LICENSE* "$TYPST_PACKAGE_PATH/preview/elembic/${{ version }}/"

requirements:
  host:
    - typst
  run:
    - typst >=0.11.0

tests:
  - package_contents:
      files:
        - share/typst/packages/preview/elembic/${{ version }}/typst.toml
        - share/typst/packages/preview/elembic/${{ version }}/src/lib.typ
  - script:
      # Use an empty package cache so the test fails if typst downloads the package instead of using the local one
      - export TYPST_PACKAGE_CACHE_PATH=$PWD/typst-cache
      - typst compile test.typ test.pdf
      - test -f test.pdf
      - test ! -e typst-cache
    files:
      recipe:
        - test.typ

about:
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  summary: Framework for custom elements and types in Typst.
  homepage: https://typst.app/universe/package/elembic
  repository: https://github.com/PgBiel/elembic

extra:
  recipe-maintainers:
    - MarkusJungQC
