schema_version: 1

context:
  name: elembic
  version: "1.1.1"

package:
  name: typst-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/PgBiel/elembic/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 1feb83aae1144b1c91a1365dee1347c2840cf7dd3c58429464a4d1952227a08d

build:
  number: 0
  noarch: generic
  script:
    - if: unix
      then:
        - mkdir -p $PREFIX/share/typst/packages/preview/${{ name }}/${{ version }}
        - cp -r src typst.toml README.md LICENSE* $PREFIX/share/typst/packages/preview/${{ name }}/${{ version }}/
      else:
        - set "DEST=%PREFIX%\share\typst\packages\preview\${{ name }}\${{ version }}"
        - xcopy /E /I /Y src "%DEST%\src"
        - for %%f in (typst.toml README.md LICENSE*) do copy /Y "%%f" "%DEST%"

requirements:
  run:
    - typst >=0.11.0

tests:
  - package_contents:
      files:
        - share/typst/packages/preview/${{ name }}/${{ version }}/typst.toml
        - share/typst/packages/preview/${{ name }}/${{ version }}/src/lib.typ
  - script:
      # Use an empty package cache so the test fails if typst downloads the package instead of using the local one
      - if: unix
        then:
          - export TYPST_PACKAGE_CACHE_PATH=$PWD/typst-cache
          - typst compile test.typ test.pdf
          - test -f test.pdf
          - test ! -e typst-cache
        else:
          - set "TYPST_PACKAGE_CACHE_PATH=%CD%\typst-cache"
          - typst compile test.typ test.pdf
          - if not exist test.pdf exit 1
          - if exist typst-cache exit 1
    files:
      recipe:
        - test.typ

about:
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  summary: Framework for custom elements and types in Typst.
  homepage: https://typst.app/universe/package/${{ name }}
  repository: https://github.com/PgBiel/elembic

extra:
  recipe-maintainers:
    - MarkusJungQC
