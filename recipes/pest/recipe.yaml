schema_version: 1

context:
  version: 18

package:
  name: pest
  version: ${{ version }}

source:
  - if: unix
    then:
      url: https://s3.amazonaws.com/docs.pesthomepage.org/source_code/pest${{ version }}.tar.zip
      sha256: 7c8074a1cc4f9f9b4a305f374ec38914abce3698a9ad27641f5fe34dc3037095
  - if: win
    then:
      url: https://s3.amazonaws.com/docs.pesthomepage.org/software/pest{{ version }}.zip
      sha256: eb0345fa7088c7d5ade0e98d140be9fb3649e184749b7f6bd997cc3964156154

build:
  number: 0

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler('fortran') }}
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - make
        - unzip
        - gfortran
        - gcc

tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/bin/pest
          - test -f $PREFIX/bin/ppest
          - test -f $PREFIX/bin/eigproc
          - test -f $PREFIX/bin/parcalc
          - test -f $PREFIX/bin/addreg1
          - test -f $PREFIX/bin/cov2cor
          - test -f $PREFIX/bin/cmaes_p
          - test -f $PREFIX/bin/supobspar
          - test -f $PREFIX/bin/csv2par
          - test -f $PREFIX/bin/sensan
          - test -f $PREFIX/bin/beopest
      - if: win
        then:
          - if not exist %PREFIX%\bin\pest.exe exit 1
          - if not exist %PREFIX%\bin\ppest.exe exit 1
          - if not exist %PREFIX%\bin\eigproc.exe exit 1
          - if not exist %PREFIX%\bin\parcalc.exe exit 1
          - if not exist %PREFIX%\bin\addreg1.exe exit 1
          - if not exist %PREFIX%\bin\cov2cor.exe exit 1
          - if not exist %PREFIX%\bin\cmaes_p.exe exit 1
          - if not exist %PREFIX%\bin\supobspar.exe exit 1
          - if not exist %PREFIX%\bin\csv2par.exe exit 1
          - if not exist %PREFIX%\bin\sensan.exe exit 1
          - if not exist %PREFIX%\bin\beopest64.exe exit 1

about:
  summary: PEST optimizes calibration and calibration-constrained uncertainty analysis of any numerical model.
  description: |
    PEST interacts with a model through the model’s own input and output files.
    While estimating or adjusting its parameters, it runs a model many times.
    These model runs can be conducted either in serial or in parallel. Advanced
    dimensional-reduction methods can dramatically reduce the number of model
    runs required for attainment of a high level of model-to-measurement fit.
  license: LicenseRef-DISCLAIMER
  license_file: LICENSE.txt
  homepage: https://pesthomepage.org/
  documentation: https://s3.amazonaws.com/docs.pesthomepage.org/documents/all_manuals.zip

extra:
  recipe-maintainers:
    - timcera
