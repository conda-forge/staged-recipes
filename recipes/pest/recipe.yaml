    sha256: 64f0f631d3fb9bdf522a9ab52f8eff915fc03015b18da193201605a1797b98c8

build:
  number: 0

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler('fortran') }}
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - make
        - unzip
    - if: win
      then:
        - ${{ compiler('m2w64_fortran') }}
        - ${{ compiler('m2w64_c') }}
        - ${{ stdlib('m2w64_c') }}
        - m2-base
        - m2-make
        - m2-sed
        - m2-tar
        - oschmod
    - gfortran
    - gcc

