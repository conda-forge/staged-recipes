context:
  version: "0.0.0.2026.10.01"

package:
  name: openemacs
  version: ${{ version }}

source:
  # There are no releases or tags at the time of writing, so using 0.0.0.YYYY.MM.DD
  url: https://github.com/DavidSatimeWallin/openemacs/archive/f7e2d3566691cd9b1ad74d5b8b9efe8d7a27f6e9.tar.gz
  sha256: 1fe398906140162f4fad4355ce8ad1be731c5c659a40be254f99442db6b557d5
  patches:
    - unterminated-string-initialization.patch

build:
  script:
    - make
    - mkdir -p $PREFIX/bin/
    - cp openemacs $PREFIX/bin/
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make

tests:
  - script:
      - openemacs 2>&1 | grep "^Usage:"

about:
  homepage: https://github.com/DavidSatimeWallin/openemacs
  summary: 'Tiny emacs clone (≤ 1024 LOC) without any library dependencies'
  description: |
    openemacs: A tiny emacs clone (≤ 1024 LOC, BSD-licensed) without any
    library dependencies.

    The goal of the project is to implement the most important parts of emacs
    while staying under 1024 lines of code (as counted by cloc). openemacs is
    based on Kilo - a minimal editor written by Salvatore Sanfilippo (antirez).
  license: BSD-2-Clause
  license_file: LICENSE
  # The documentation and repository URLs are optional.
  documentation: https://github.com/DavidSatimeWallin/openemacs/blob/master/README.md
  repository: https://github.com/DavidSatimeWallin/openemacs/

extra:
  recipe-maintainers:
    # GitHub IDs for maintainers of the recipe.
    - peterjc
