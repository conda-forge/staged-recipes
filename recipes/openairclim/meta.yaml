{% set version = "0.18.0" %}

package:
  name: openairclim
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/o/openairclim/openairclim-{{ version }}.tar.gz
  sha256: 3b0de870fc80595b79b81771c56960c758c06b6b375fa2baaeb3408673d7f063

build:
  entry_points:
    - oac-run = openairclim.__main__:main
    - oac-gui = openairclim.gui.__main__:main
    - oac-download-data = openairclim.repository:main
    - oac-download-zenodo = openairclim.utils.download_zenodo:main
    - oac-create-artificial-inventories = openairclim.utils.create_artificial_inventories:main
    - oac-create-time-evolution = openairclim.utils.create_time_evolution:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.11.5
    - setuptools >=61.0
    - pip
  run:
    - python >=3.11.5
    - joblib
    - numpy
    - pandas <3
    - matplotlib
    - pint
    - xarray
    - netcdf4
    - scipy
    - deepmerge
    - ambiance
    - pydantic
    - platformdirs
    - requests
    - panel
    - param

test:
  imports:
    - openairclim
  commands:
    - pip check
    - oac-run --help
    - oac-gui --help
    - oac-download-data --help
    - oac-download-zenodo --help
    - oac-create-artificial-inventories --help
    - oac-create-time-evolution --help
  requires:
    - pip
    - python

about:
  home: https://openairclim.org/
  summary: A response model for calculating the climate impact of air traffic emissions
  doc_url: https://openairclim.org/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - liammegill
