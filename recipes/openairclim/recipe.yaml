schema_version: 1

context:
  version: 0.18.1
  python_min: "3.11"

package:
  name: openairclim
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openairclim/openairclim-${{ version }}.tar.gz
  sha256: 277e8463168360c590dbde469e44419e1238c5967c0213c6294b03ef8030d975

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - oac-run = openairclim.__main__:main
      - oac-gui = openairclim.gui.__main__:main
      - oac-download-data = openairclim.repository:main
      - oac-download-zenodo = openairclim.utils.download_zenodo:main
      - oac-create-artificial-inventories = openairclim.utils.create_artificial_inventories:main
      - oac-create-time-evolution = openairclim.utils.create_time_evolution:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - joblib
    - numpy
    - pandas <3
    - matplotlib-base
    - pint
    - xarray
    - netcdf4
    - scipy
    - deepmerge
    - ambiance
    - pydantic
    - platformdirs
    - requests  #
    # Extra: gui
    - panel
    - param

tests:
  - python:
      imports:
        - openairclim
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - oac-run --help
      - oac-gui --help
      - oac-download-data --help
      - oac-download-zenodo --help
      - oac-create-artificial-inventories --help
      - oac-create-time-evolution --help

about:
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://openairclim.org/
  documentation: https://openairclim.org/
  repository: https://github.com/dlr-pa/oac
  summary: 'A response model for aviation climate effects'
  description: |
    OpenAirClim is an open-source response model for quantifying the CO2 and
    non-CO2 climate effects of air traffic emissions, built for Python 3.11+.

extra:
  recipe-maintainers:
    - liammegill
    - stefan-voelk
