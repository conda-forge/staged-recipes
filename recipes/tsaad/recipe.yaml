schema_version: 1

context:
  name: tsaad
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - tsaad = tsaad.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy

tests:
  - python:
      imports:
        - tsaad
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - tsaad --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/dagewa/tsaad
  summary: "Time Series Analysis of Area Detectors: calibration-free estimation of detector response statistics from diffraction rotation scans"
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/dagewa/tsaad

extra:
  recipe-maintainers:
    - dagewa
