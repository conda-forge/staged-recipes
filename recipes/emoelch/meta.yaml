# conda-forge is the primary distribution channel for emoelch:
# pythonocc-core (the CAD kernel behind emoelch.geometry) exists only
# here, so a plain `pip install emoelch` cannot satisfy the full
# geometry stack.

{% set name = "emoelch" %}
{% set version = "0.2.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/brtkrtz/emoelch/archive/refs/tags/v{{ version }}.tar.gz
  sha256: d3d0aaae326c0efad414840a364128374d5f40cad9e3b3c74aa223d934f75f40

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - numpy >=1.26
    - scipy >=1.12
    - h5py >=3.10
    - vtk >=9.3
    - matplotlib-base >=3.8
    - numba >=0.59
    - pythonocc-core >=7.7

test:
  requires:
    - python {{ python_min }}
  imports:
    - emoelch
  commands:
    - python -c "import emoelch; print(emoelch.__version__)"

about:
  home: https://github.com/brtkrtz/emoelch
  dev_url: https://github.com/brtkrtz/emoelch
  license: LGPL-3.0-or-later
  license_file:
    - COPYING
    - COPYING.LESSER
  summary: Open-source 3D electromagnetic field simulation suite (FIT time domain)

extra:
  recipe-maintainers:
    - brtkrtz
