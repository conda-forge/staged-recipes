# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: hf-libero
  version: "0.1.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/hf_libero-${{ version }}.tar.gz
  sha256: 0a3b1d9969e8e74b8c810b1a5c7e92b78b9564f53c2d1044d2ce42c6fb37c7c4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - hydra-core >=1.2,<1.4
    - robosuite ==1.4.0
    - termcolor
    - bddl ==1.0.1
    - numpy
    - transformers
    - easydict
    - einops
    - thop
    - matplotlib-base >=3.5.3
    - cloudpickle >=2.0.0
    - py-opencv
    - wandb
    - gymnasium >=0.29.0
    - mujoco-python >=3.0.0,<3.9.0
    - future >=0.18.2

tests:
  - python:
      imports:
        - libero
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - echo N | python -c "import libero.libero"

about:
  summary: "LIBERO: Benchmark and environments for robot learning"
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/huggingface/LIBERO
  repository: https://github.com/huggingface/LIBERO

extra:
  recipe-maintainers:
    - flferretti
