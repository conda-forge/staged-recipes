schema_version: 1

context:
  name: python-environment-tools
  # release/2026.12 branch (upstream publishes release branches, not tags)
  version: "2026.12"
  commit: 89bf1c02290e09413e745cbbb0194bc50491bf0d

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/microsoft/python-environment-tools/archive/${{ commit }}.tar.gz
  sha256: d21a6a65b480e034992042dda8c1f2982fc3e0a49ba2a5e47e301f8a22a99e9c

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - if: unix
        then: cargo install --bins --no-track --locked --root ${{ PREFIX }} --path crates/pet
        else: cargo install --bins --no-track --locked --root %LIBRARY_PREFIX% --path crates\pet

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - package_contents:
      bin:
        - pet

about:
  homepage: https://github.com/microsoft/python-environment-tools
  repository: https://github.com/microsoft/python-environment-tools
  summary: Python Environment Tools (pet), a fast locator for Python interpreters and environments
  description: |
    pet discovers Python installations and environments (conda, venv, pyenv, poetry,
    pixi, uv, Windows Store, ...). It is used by the Python extensions for VS Code and Positron.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - mediocretech
