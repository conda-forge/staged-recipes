schema_version: 1

context:
  name: ntnda-qt-viewer
  version: 0.0.4
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ntnda_qt_viewer-${{ version }}.tar.gz
  sha256: 72bb0d2c99799d3d6bec6989a6d7aaa9e9ebb5abaca07ada7661358b2c2f22de

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ntnda-qt-viewer = ntnda_qt_viewer.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - aioca >=2.0
    - p4p >=4.2.2
    - pyqtgraph >=0.14.0
    - qtpy >=2.4.3
    - pyside6 >=6.9

tests:
  - python:
      imports:
        - ntnda_qt_viewer
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
    script:
      - ntnda-qt-viewer --help

about:
  summary: ntnda-qt-viewer
  homepage: https://github.com/jwlodek/ntnda-qt-viewer
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jwlodek
