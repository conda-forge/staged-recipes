schema_version: 1

context:
  version: "1.0.1"
  python_min: "3.12"

package:
  name: parserf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/parserf/parserf-${{ version }}.tar.gz
  sha256: fbd977894317b882afa9d29981415ae1487cf5fea06a5370eccaaf5709a1df86

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - geopandas
    - numpy >=1.26
    - pandas
    - pyarrow >=23.0.1
    - pyproj
    - shapely >=2.1.2

tests:
  - python:
      imports:
        - parserf
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      # Smoke test that the whitelisted data files (MANIFEST.in) actually landed in
      # the installed package -- not just that the module imports.
      - python -c "from parserf.models import FaultModel, FaultModelDataset; ds = FaultModelDataset(FaultModel.UCERF3_31); assert len(ds.subsections) > 0; assert len(ds.ruptures) > 0"

about:
  homepage: https://github.com/asarmy/parserf
  license: Apache-2.0
  license_file: LICENSE
  summary: Parser for earthquake rupture forecasts like UCERF3 and 2023 NSHMP.
  repository: https://github.com/asarmy/parserf
  documentation: https://parserf.readthedocs.io/

extra:
  recipe-maintainers:
    - asarmy
