schema_version: 1

context:
  version: "1.5.5"

package:
  name: get-gecko-driver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/get-gecko-driver/get_gecko_driver-${{ version }}.tar.gz
  sha256: 9e6e731f4132fce10cef00a3473d05ccbb52f9496d6dfac354c5c681f97fb58d
  patches:
    - patches/0001-limit-setuptools-package-discovery-to-the-package.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - get-gecko-driver = get_gecko_driver.app:app

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=84.0.0
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 >=4.13.5
    - requests >=2.33.0
    - urllib3 >=2.7.0
    - typer >=0.17.4

tests:
  - python:
      imports:
        - get_gecko_driver
        - get_gecko_driver.get_driver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - get-gecko-driver --help
      - python -c "import os, sys, sysconfig; sys.exit('tests leaked into site-packages' if os.path.isdir(os.path.join(sysconfig.get_paths()['purelib'], 'tests')) else 0)"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/zaironjacobs/get-gecko-driver
  repository: https://github.com/zaironjacobs/get-gecko-driver
  license: MIT
  license_file: LICENSE
  summary: A tool to download and install GeckoDriver
  description: |
    get-gecko-driver fetches GeckoDriver, the WebDriver proxy that Selenium
    and similar tools use to automate Firefox. It can report the latest
    release, print the download URL for a given version and platform, and
    download and extract the binary. Works as a command line tool or as an
    importable Python library.

extra:
  recipe-maintainers:
    - killua156
