schema_version: 1

context:
  name: stdio
  opam_name: stdio
  version: "0.17.0"
  build_number: 0

  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  # ocaml_<platform> matchspec tail: version, plus the gcc_ (MinGW) track on non-unix
  ocaml_spec: ${{ ocaml_compiler_version ~ (".*" if unix else ".* gcc_*") }}

package:
  name: ocaml-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/janestreet/stdio/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e7cb473d4bffcf419f307c658cf2599fab03a2b4fe655bfd0be699f8f7af176e

build:
  number: ${{ build_number }}
  string: ${{ "gcc_" if not unix }}h${{ hash }}_${{ build_number }}
  script: bash ${{ RECIPE_DIR }}/build.sh ${{ opam_name }}

requirements:
  build:
    - ${{ compiler("ocaml") }}
    # compiler("ocaml") renders no toolchain track; name the gcc_ (MinGW) one on non-unix
    - ocaml_${{ target_platform }} ${{ ocaml_spec }}
    # no C stubs; ocamlopt still links through the C compiler on non-unix
    - if: unix
      then:
        - ${{ stdlib("c") }}
      else:
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
    - ocaml-dune >=3.11
    - ${{ m2 }}make
    - if: not unix
      then:
        - m2-bash
        - m2-coreutils
        - m2-sed
        - m2-grep
        - m2-findutils
  host:
    # library: ocaml's run_export pins the compiler patch version
    - ocaml ${{ ocaml_spec }}
    - ocaml-dune >=3.11
    - ocaml-base >=0.17,<0.18
  run:
    - ocaml-base >=0.17,<0.18
  # the ocaml run_export does not encode the non-unix toolchain track
  run_constraints:
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_spec }}
    # installed dune-package declares (lang dune X.Y); older dune cannot read it
    - ${{ pin_compatible('ocaml-dune', lower_bound='x.x', upper_bound=None) }}

tests:
  - package_contents:
      files:
        - ${{ library }}lib/ocaml/${{ opam_name }}/META
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.cma
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.cmxa
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.a
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.cmxs
  - script:
      interpreter: bash
      content:
        - echo 'let () = Stdio.print_string "stdio ok"' > t.ml
        - ocamlfind ocamlopt -package stdio -linkpkg t.ml -o t
        - ./t | grep -q "stdio ok"
    requirements:
      run:
        - ocaml ${{ ocaml_spec }}
        - ocaml-findlib
        - if: unix
          then:
            - ${{ compiler("c") }}
        - if: not unix
          then:
            - m2-bash
            - m2-coreutils

about:
  homepage: https://github.com/janestreet/stdio
  repository: https://github.com/janestreet/stdio
  license: MIT
  license_file: LICENSE.md
  summary: Standard IO library for OCaml (Jane Street)

extra:
  recipe-maintainers:
    - MementoRC
    - ManuelLerchner
