schema_version: 1

context:
  version: "0.0.2"
  python_min: '3.11'

package:
  name: pothenon
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pothenon/pothenon-${{ version }}.tar.gz
  sha256: a58bda97cbefb00d42302e4f2640fe8d4eb5fb5eb889e412f84bd58426912117

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling ==1.31.0
    - hatch-vcs ==0.5.0
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - pyiron_snippets >=1.2.1,<1.3.0

tests:
  - python:
      imports:
        - pothenon
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: pothenon - dependency parser for python functions
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pothenon
  documentation: https://pothenon.readthedocs.io

extra:
  recipe-maintainers:
    - niklassiemer
