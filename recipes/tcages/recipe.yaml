schema_version: 1

context:
  name: tcages
  version: "0.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tcages/tcages-${{ version }}.tar.gz
  sha256: a8ac37c49e0c6210ab94a72dae95caf542bf77482322660509666de7b19b03f6

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake >=3.18
    - ninja
  host:
    - python
    - pip
    - scikit-build-core >=0.10
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - tcages
      pip_check: true
  - files:
      source:
        - tests/
    requirements:
      run:
        - pytest
    script:
      - pytest tests -v

about:
  homepage: https://github.com/HUGG/tcages
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Predicts low-temperature thermochronometer ages from time-temperature histories
  description: |
    tcages provides compiled versions of the RDAAM/ZRDAAM (U-Th)/He and ketch
    apatite fission-track age prediction codes with a simple Python interface.
    It is the age prediction engine used by Tc1D and tcplotter.
  documentation: https://github.com/HUGG/tcages
  repository: https://github.com/HUGG/tcages

extra:
  recipe-maintainers:
    - davewhipp
