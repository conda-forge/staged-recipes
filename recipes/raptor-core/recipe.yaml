schema_version: 1

context:
  name: raptor-core
  version: "0.2.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/raptor_core-${{ version }}.tar.gz
  sha256: 9cff4e9a54715394fedd73dde2ab6b971ddf4ab3c9bae213466138252882ef9e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - raptor
        - raptor.schema.manifest
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/amasat01/raptor
  repository: https://github.com/amasat01/raptor
  documentation: https://amasat01.github.io/raptor/
  summary: The protocol spine of the RAPTOR family (schema, typing.Protocols, golden conformance suite)
  description: |
    raptor-core holds the manifest schema, the engine/launcher/provider
    contracts and the conformance matrix shared by the RAPTOR packages
    (aether, hawk, eagle). Pure Python with zero runtime dependencies.
    The import name is `raptor`.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - amasat01
