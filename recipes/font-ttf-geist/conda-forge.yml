bot:
  version_updates:
    # Upstream mixes two tag lines in one repo: bare tags (1.8.0, 2026-03-03) track the font
    # design version, v-prefixed tags (v1.7.2, 2026-06-01) track the npm package and carry the
    # current font zip. `githubreleases` follows the /releases/latest redirect, which is the
    # same notion of "newest" this recipe was pinned to, so the bot will not offer the older
    # but numerically higher 1.8.0 as an upgrade.
    # See https://github.com/vercel/geist-font/issues/208
    sources: [githubreleases]
    exclude: ["1.8.0"]
