context:
  version: "2.304"

package:
  name: font-jetbrains-mono
  version: ${{ version }}

source:
  - url: https://github.com/JetBrains/JetBrainsMono/releases/download/v${{ version }}/JetBrainsMono-${{ version }}.zip
    sha256: 6f6376c6ed2960ea8a963cd7387ec9d76e3f629125bc33d1fdcd7eb7012f7bbf

build:
  noarch: generic
  number: 0
  script:
    - if: unix
      then:
        - mkdir -p $PREFIX/fonts
        - cp fonts/ttf/*.ttf $PREFIX/fonts
      else:
        - mkdir %PREFIX%\fonts
        - copy fonts\ttf\*.ttf %PREFIX%\fonts

tests:
  - package_contents:
      files:
        - fonts/JetBrainsMono-*.ttf
        - fonts/JetBrainsMonoNL-*.ttf
      strict: true
  - package_contents:
      files:
        - fonts/JetBrainsMono-Regular.ttf
        - fonts/JetBrainsMono-Bold.ttf
        - fonts/JetBrainsMono-Italic.ttf
        - fonts/JetBrainsMono-BoldItalic.ttf
        - fonts/JetBrainsMonoNL-Regular.ttf

about:
  homepage: https://www.jetbrains.com/lp/mono/
  summary: JetBrains Mono – the free and open-source typeface for developers
  license: OFL-1.1
  license_file: OFL.txt
  repository: https://github.com/JetBrains/JetBrainsMono

extra:
  recipe-maintainers:
    - pavelzw
