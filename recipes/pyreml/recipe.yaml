schema_version: 1

context:
  name: pyreml
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 37b551d8933d59c05180508ccb822971b309dc1065847e2cd44e806bfc4b6043

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - pytorch
    - numpy
    - scipy
    - pandas
    - patsy

tests:
  - python:
      imports:
        - pyreml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: General-purpose linear mixed model solver.
  description: |
    pyreml is a general-purpose linear mixed model solver. It fits linear
    mixed models for a wide range of applications: quantitative genetics,
    spatial statistics, health sciences, among others. Models are fitted by
    direct differentiation of the Restricted Maximum Likelihood (REML),
    using PyTorch for variance parameter estimation. It benefits from PyTorch
    parallelization and GPU acceleration.
  homepage: https://github.com/ai-for-genome-interpretation-lab/pyreml
  repository: https://github.com/ai-for-genome-interpretation-lab/pyreml
  documentation: https://ai-for-genome-interpretation-lab.github.io/pyreml/

extra:
  recipe-maintainers:
    - almarch
    - eddiewrc
