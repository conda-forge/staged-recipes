context:
  name: google-cloud-org-policy
  version: "1.19.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_org_policy-${{ version }}.tar.gz
  sha256: 56dd15ff736c8358d3c67c33ba26839b09c7a1e871d6b6b2da2cb1e1becd7224

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.28.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - grpcio >=1.59.0,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - google.cloud.orgpolicy
        - google.cloud.orgpolicy_v2
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-org-policy
  summary: Google Cloud Org Policy API client library
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/googleapis/google-cloud-python
  documentation: https://cloud.google.com/python/docs/reference/orgpolicy/latest

extra:
  recipe-maintainers:
    - soapy1
