schema_version: 1

context:
  version: "0.2.0"

package:
  name: brand-yml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/brand-yml/brand_yml-${{ version }}.tar.gz
  sha256: 73489597ff9d3a3259e7992de9ea8a9ea3adc6364c4fd22007fdac94e93d0e77

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - ruamel.yaml >=0.18.0
    - pydantic >=2.10.0
    - eval-type-backport >=0.2.0
    - htmltools >=0.7.0

tests:
  - python:
      imports:
        - brand_yml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Read brand yaml files, a unified way to store brand information.
  license: MIT
  license_file: LICENSE.md
  homepage: https://posit-dev.github.io/brand-yml/
  documentation: https://posit-dev.github.io/brand-yml/pkg/py/
  repository: https://github.com/posit-dev/brand-yml

extra:
  recipe-maintainers:
    - schloerke
