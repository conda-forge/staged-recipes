context:
  version: "1.0.2"

package:
  name: jupyterlab-cursor-dark
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-cursor-dark/jupyterlab_cursor_dark-${{ version }}.tar.gz
  sha256: eefec115ce6890708957fdde52c291dfd9201cdd85bd111e20dc2ba3dda955c9

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - hatch-jupyter-builder >=0.5
    - hatch-nodejs-version >=0.3.2
    - jupyterlab >=4.0.0,<5
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jupyterlab_cursor_dark
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - package_contents:
      files:
        - share/jupyter/labextensions/jupyterlab-cursor-dark/package.json

about:
  homepage: https://github.com/jtpio/jupyterlab-cursor-theme
  summary: JupyterLab dark theme with Cursor vibes
  description: |
    A JupyterLab dark theme with Cursor vibes, shipped as a prebuilt extension.
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/jtpio/jupyterlab-cursor-theme

extra:
  recipe-maintainers:
    - SylvainCorlay
    - jtpio
