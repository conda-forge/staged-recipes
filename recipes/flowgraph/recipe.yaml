context:
  version: "0.1.6"

package:
  name: flowgraph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flowgraph/flowgraph-${{ version }}.tar.gz
  sha256: 27f2a843024e870f43a242997f732436094c06113ada257516ef6b316c549e7b

build:
  noarch: python
  number: 0
  script: python -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - flowgraph = flowgraph.core_cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}
    - vtk >=9.2
    - muscat-core >=2.5.2
    - meshio >=5.3
    # Required upstream; must be available on conda-forge before this can build.
    #- meshlane >=5.5.0
    - scipy >=1.10
    - pandas
    - h5py
    - pillow >=10.0
    - numpy >=1.24
    - openpyxl >=3.1.5

tests:
  - python:
      imports:
        - flowgraph
        - flowgraph.core_cli
        - flowgraph.application.workflow_core
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - flowgraph --help
      - python -m flowgraph --help

about:
  homepage: https://github.com/FBW-Engineering-Solutions/FlowGraph
  summary: Headless typed workflow engine and execution runtime
  description: |
    FlowGraph Core is a GUI-free Python workflow engine for typed workflow
    composition, validation, persistence, execution, and mesh and image data
    operations.

    The companion browser-based workflow editor is available at
    https://flowgraph-web.fbw-es.com/.
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/FBW-Engineering-Solutions/FlowGraph

extra:
  recipe-maintainers:
    - fbordeu
