context:
  version: "0.1.0"

package:
  name: metacal
  version: ${{ version }}

source:
  url: https://github.com/esheldon/metacal/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ee19c76491a6cc76c20eea8b007a9566a545ed87afd1e41f4beecadf6d76cb7e

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - numpy
    - galsim

tests:
  - python:
      imports:
        - metacal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/esheldon/metacal
  summary: 'metacalibration weak lensing shear calibration.'
  license: MIT
  license_file: LICENSE-MIT

extra:
  recipe-maintainers:
    - beckermr
    - esheldon
