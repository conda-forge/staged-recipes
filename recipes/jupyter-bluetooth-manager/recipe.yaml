schema_version: 1

context:
  version: "0.3.2"

package:
  name: jupyter-bluetooth-manager
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-bluetooth-manager/jupyter_bluetooth_manager-${{ version }}.tar.gz
  sha256: 923776d03413ae17400a7e05f76a42d061c410277beca7e044fd5d9c3d14d3c4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - hatch-nodejs-version >=0.3.2
    - jupyterlab >=4,<5
    # Hidden in tool.hatch.build.hooks.jupyter-builder.dependencies
    - hatch-jupyter-builder >=0.5
  run:
    - python >=${{ python_min }}
    - ipywidgets >=7.6.0,<9

tests:
  - python:
      imports:
        - jupyter_bluetooth_manager
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/QuantStack/jupyter-bluetooth-manager
  summary: A JupyterLab extension to connect to devices with Web Bluetooth
  description: |
    jupyter-bluetooth-manager is a JupyterLab extension to connect
    to devices with Web Bluetooth.
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/QuantStack/jupyter-bluetooth-manager

extra:
  recipe-maintainers:
    - HaudinFlorence
    - SylvainCorlay
