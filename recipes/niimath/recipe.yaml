# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  version: "1.0.20261016"

package:
  name: niimath
  version: ${{ version }}

source:
  url: https://github.com/rordenlab/niimath/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 782d840d44f644739f79148b035ca8931e6262e44ec6f8eb142b113f9a66e6c1

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake >=3.16
    - ninja
    - pkg-config
  host:
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
    - zlib
    - zstd

tests:
  - files:
      source:
        - .github/scripts/release_smoke.py
    requirements:
      run:
        - python
    script:
      - niimath --version
      - python .github/scripts/release_smoke.py --expect-bsd --expect-zstd

about:
  homepage: https://github.com/rordenlab/niimath
  summary: A clone of fslmaths - a general neuroimaging image calculator
  license: BSD-2-Clause AND Apache-2.0 AND MIT
  license_file:
    - LICENSE
    - src/n4/LICENSE
    - src/n4/NOTICE
    - src/romeo.LICENSE
  repository: https://github.com/rordenlab/niimath

extra:
  recipe-maintainers:
    - hanayik
    - neurolabusc
    - psadil
