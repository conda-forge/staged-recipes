context:
  version: "0.4.0"

package:
  name: tailcat
  version: ${{ version }}

source:
  url: https://github.com/tailscale/tailcat/archive/v${{ version }}.tar.gz
  sha256: f3e87753aa45f8be249a2708a4220748fd8613f9ea0d0435a48ffedf8d724247

build:
  number: 0
  script:
    - go-licenses save ./cmd/tailcat --save_path library_licenses
    - if: unix
      then:
        - go build -tags "$(cat build-tags.txt)" -ldflags "-s -w -X main.version=v${{ version }}" ./cmd/tailcat
        - install -D -m0755 -t "$PREFIX/bin" tailcat
      else:
        - set /p GO_TAGS=<build-tags.txt
        - go build -tags "%GO_TAGS%" -ldflags "-s -w -X main.version=v${{ version }}" ./cmd/tailcat
        - install -D -m0755 -t "%LIBRARY_BIN%" tailcat.exe

requirements:
  build:
    - go-licenses
    - ${{ compiler("go") }}
    - if: osx
      then:
        - uutils-coreutils

tests:
  - script:
      - tailcat --version
      - tailcat --help
  - package_contents:
      strict: true
      bin:
        - tailcat

about:
  homepage: https://github.com/tailscale/tailcat
  summary: like netcat, but over Tailscale's data plane, without Tailscale's control plane.
  description: |
    Tailcat is a remix of Tailscale open source pieces to act like netcat, but over Tailscale's data plane, without Tailscale's control plane.
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - library_licenses/
  documentation: https://tailscale.com/tailcat
  repository: https://github.com/tailscale/tailcat

extra:
  recipe-maintainers:
    - XhstormR
