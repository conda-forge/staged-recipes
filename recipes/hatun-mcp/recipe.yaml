schema_version: 1

context:
  version: "1.0.4"
  python_min: "3.12"

package:
  name: hatun-mcp
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/bc/b0/69a1eacf83feca889894f9c558acb42ed665f1ef00c591b15a9a55846eb7/hatun_mcp-1.0.4.tar.gz
  sha256: c399e95db29d2a3e08f0a8834e6cc69e9bcde8b36dc60ad9fae2640a9d65f2f3

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - mcp >=2.3.0,<3
    - httpx >=0.28.1
    - starlette >=1.10.0
    - uvicorn >=0.54.0
    - cryptography >=50.0.2
    - pyjwt >=2.15.1,<3
    - py_ecc >=8.0.0

tests:
  - python:
      imports:
        - hatun_mcp
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/szl-holdings/hatun-mcp
  repository: https://github.com/szl-holdings/hatun-mcp
  documentation: https://github.com/szl-holdings/hatun-mcp#readme
  license: Apache-2.0
  license_file: LICENSE
  summary: "Governed MCP gateway: policy gate on every tool call, hash-chained DSSE receipt on every result"
  description: |
    hatun-mcp is the governed MCP gateway of the SZL Holdings estate: every tool call passes a policy gate and every result carries a hash-chained DSSE receipt, with formula receipts, quorum, and provenance interop built in.

extra:
  recipe-maintainers:
    - stephenlutar2-hash
