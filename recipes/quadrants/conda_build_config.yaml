# Quadrants uses Metal 3 APIs introduced in macOS 13.
MACOSX_SDK_VERSION:  # [osx]
  - "13.3"          # [osx]
c_stdlib_version:    # [osx]
  - "13.0"          # [osx]
# Match the LLVM/Clang 22 runtime bitcode toolchain used by Quadrants.
c_compiler_version:  # [osx]
  - "22"            # [osx]
cxx_compiler_version:  # [osx]
  - "22"              # [osx]
