schema_version: 1

context:
  name: quadrants
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - # The GitHub tag archive omits populated submodules needed by this source build.
    git: https://github.com/Genesis-Embodied-AI/quadrants.git
    tag: v${{ version }}
    patches:
      # Remove once upstream guards AMDGPU runtime headers when QD_WITH_AMDGPU is disabled.
      - patches/0003-guard-disabled-amdgpu-includes.patch
  # Quadrants redistributes a reduced CUDA Toolkit libdevice bitcode file.
  - url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/LICENSE.txt
    sha256: e2c71babfd18a8e69542dd7e9ca018f9caa438094001a58e6bc4d8c999bf0d07
    file_name: LICENSE-NVIDIA

build:
  number: 0
  # Upstream supports macOS on Apple Silicon only.
  skip:
    - win
    - target_platform == "osx-64"
    - linux and ppc64le
    - match(python, "<3.10")
    - match(python, ">=3.14")
  script:
    - export LLVM_DIR="${PREFIX}/lib/cmake/llvm"
    - if: linux
      then:
        - |
          printf '%s\n' '#!/bin/sh' \
            "exec \"${PREFIX}/bin/clang++-22\" --gcc-toolchain=\"${BUILD_PREFIX}\" \"\$@\"" \
            > "${SRC_DIR}/conda-clang++"
          chmod +x "${SRC_DIR}/conda-clang++"
        - export CLANG_EXECUTABLE="${SRC_DIR}/conda-clang++"
    - if: osx
      then:
        - export CLANG_EXECUTABLE="${PREFIX}/bin/clang++"
    - export CMAKE_GENERATOR=Ninja
    - export BUILD_NUM_THREADS=1
    - export SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }}
    - if: linux and x86_64
      then:
        - export CMAKE_ARGS="${CMAKE_ARGS} -DQD_WITH_CUDA=ON -DQD_WITH_AMDGPU=OFF -DQD_WITH_VULKAN=ON -DQD_WITH_METAL=OFF -DQD_BUILD_TESTS=OFF -DSPIRV_WERROR=OFF -DCLANG_EXECUTABLE=${CLANG_EXECUTABLE}"
    - if: linux and aarch64
      then:
        - export CMAKE_ARGS="${CMAKE_ARGS} -DQD_WITH_CUDA=OFF -DQD_WITH_AMDGPU=OFF -DQD_WITH_VULKAN=ON -DQD_WITH_METAL=OFF -DQD_BUILD_TESTS=OFF -DSPIRV_WERROR=OFF -DCLANG_EXECUTABLE=${CLANG_EXECUTABLE}"
    - if: osx
      then:
        - export CMAKE_ARGS="${CMAKE_ARGS} -DQD_WITH_CUDA=OFF -DQD_WITH_AMDGPU=OFF -DQD_WITH_VULKAN=OFF -DQD_WITH_METAL=ON -DQD_BUILD_TESTS=OFF -DCLANG_EXECUTABLE=${CLANG_EXECUTABLE}"
    - python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools_scm >=6.0
    - numpy >=2.0.0
    - nanobind >=2.0.0,<2.14.0
    - scikit-build-core >=0.10
    - cmake >=3.17
    - ninja
    # Upstream generates nanobind stubs at install time, which imports quadrants.
    - colorama
    - dill
    - pydantic >=2.0.0
    - rich >=1.0.0
    - setuptools >=77.0.0
    - cffi >=1.16.0
    - clang >=22,<23
    - llvmdev >=22,<23
    - zlib
    - zstd
  run:
    - python
    - numpy >=1.26.0
    - colorama
    - dill
    - pydantic >=2.0.0
    - rich >=1.0.0
    - setuptools >=77.0.0
    - cffi >=1.16.0
    - if: linux
      then: libvulkan-loader

tests:
  - python:
      imports:
        - quadrants
        - quadrants._lib.core.quadrants_python
  - script:
      - pip check
      - python run_test.py
    files:
      recipe:
        - run_test.py
    requirements:
      run:
        - pip
        - python

about:
  homepage: https://github.com/Genesis-Embodied-AI/quadrants
  summary: Python-embedded domain-specific language for accelerated simulation kernels
  license: Apache-2.0 AND MIT AND MPL-2.0 AND BSD-3-Clause AND LicenseRef-NVIDIA-End-User-License-Agreement
  license_file:
    - LICENSE
    - LICENSE-NVIDIA
    - LICENSE-vendored-components
    - external/FP16/LICENSE
    - external/PicoSHA2/LICENSE
    - external/SPIRV-Cross/LICENSE
    - external/SPIRV-Headers/LICENSE
    - external/SPIRV-Reflect/LICENSE
    - external/SPIRV-Tools/LICENSE
    - external/Vulkan-Headers/LICENSE.md
    - external/VulkanMemoryAllocator/LICENSE.txt
    - external/dlpack/LICENSE
    - external/eigen/COPYING.MPL2
    - external/spdlog/LICENSE
    - external/volk/LICENSE.md
  repository: https://github.com/Genesis-Embodied-AI/quadrants

extra:
  recipe-maintainers:
    - jeongseok-meta
