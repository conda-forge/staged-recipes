context:
  name: gammapy-plugin
  version: 0.0.2 

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/threeML/gammapy-plugin/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 29f3b027a7c3b3349ebbf805cc0606fdb35192939c839b286a2ee17b4d79e1ba

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm

  run:
    - python >=${{ python_min }}
    - numpy
    - matplotlib-base
    - astromodels >=2.6.0
    - threeML >=2.6.0
    - gammapy >=2.0
    - regions <0.12

tests:
  - python:
      imports:
        - gammapy_plugin
        - gammapy_plugin.gammapy_like
      python_version:
        - ${{ python_min }}.*
        - "*"

  - script:
      - gammapy download datasets
      - export GAMMAPY_DATA=$PWD/gammapy-datasets/2.0.1
      - pytest -vv --pyargs gammapy_plugin

    requirements:
      run:
        - pytest
        - filelock
        - pytest-xdist
        - if: not (linux and aarch64)
          then:
          - ultranest
          - pymultinest


about:
  homepage: https://github.com/threeML/gammapy-plugin
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: gammapy plugin for threeML
  documentation: https://gammapy-plugin.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - PreisTo
