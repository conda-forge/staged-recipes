context:
  name: gammapy-plugin
  version: 0.0.2 

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/gammapy-plugin/gammapy_plugin-${{ version }}.tar.gz
  sha256: acaa82d0b58d972637f47f8a898761f8c7b5737fa22ec9a9c95fbe550a420322

build:
  skip:
  - win
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm

  run:
    - python >=${{ python_min }}
    - numpy
    - matplotlib-base
    - astromodels >=2.6.0
    - threeML >=2.6.0
    - gammapy >=2.0
    - regions <0.12

tests:
  - python:
      imports:
        - gammapy_plugin
        - gammapy_plugin.gammapy_like
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/threeML/gammapy-plugin
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A gammapy-plugin for threeML
  documentation: https://gammapy-plugin.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - PreisTo
