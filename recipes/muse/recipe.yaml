schema_version: 1

context:
  version: "0.2.0"
  python_min: "3.12"

package:
  name: muse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/muse/muse-${{ version }}.tar.gz
  sha256: c0ddb3b93587e86403360c53e406f9c1d83feda424b8f426e6970ef7c5b1bb5c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=84.0.0
    - setuptools-scm >=10.2.0
    - wheel >=0.47.0
    - pip
  run:
    - python >=${{ python_min }}
    - astropy-base >=8.0
    - attrs >=26.1.0
    - loguru >=0.7.3
    - numpy >=2.5.0
    - tqdm >=4.70
    - xarray >=2026.7.0
    - dask >=2026.8.0
    - distributed >=2026.8.0
    - zarr >=3.3.0
    - netCDF4 >=1.7.4

tests:
  - python:
      imports:
        - muse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pytest
        - chiantipy
        - numexpr
        - periodictable
        - matplotlib-base
        - pytest-doctestplus
        - pytest-loguru
        - pytest-mpl
        - pytest-remotedata
    script:
      - pytest --pyargs muse

about:
  summary: A library to reduce and analyze data from the MUSE Mission.
  license: BSD-3-Clause
  license_file: licenses/LICENSE.rst
  homepage: https://muse.lmsal.com
  documentation: https://muse-lmsal.readthedocs.io/

extra:
  recipe-maintainers:
    - nabobalis
