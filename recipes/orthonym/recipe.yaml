context:
  name: orthonym
  version: "1.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 23524daa2e35ee853453e15066642c51db13b6bc04c6254f68e047b5274ed27c

build:
  number: 0
  noarch: python
  script:
    env:
      # The OPSIN and centres jars are not part of this package. They are
      # downloaded (with a SHA-256 check) the first time Orthonym needs them,
      # or ahead of time with `orthonym --fetch-jars`.
      ORTHONYM_SKIP_JAR_PREFETCH: "1"
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - orthonym = orthonym.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - rdkit ==2026.03.5
    - lxml ==6.1.3
    - jpype1 ==1.7.1
    - openjdk >=11

tests:
  - python:
      imports:
        - orthonym
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - orthonym --help

about:
  summary: Rule-based IUPAC names from molecular structures (SMILES)
  description: |
    A SMILES string goes in. A verified IUPAC name comes out, or a clear "no".
    Never a guess. Orthonym needs a Java runtime (installed with this package)
    and the pinned OPSIN and centres jars, which it downloads with a SHA-256
    check the first time it needs them (or run `orthonym --fetch-jars`).
  license: MIT
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/Steinbeck-Lab/Orthonym
  repository: https://github.com/Steinbeck-Lab/Orthonym
  documentation: https://steinbeck-lab.github.io/Orthonym/

extra:
  recipe-maintainers:
    - Kohulan
