context:
  version: "1.0.3"

package:
  name: speckit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/speckit/speckit-${{ version }}.tar.gz
  sha256: 0b6c42647e310237de7b84a343939f726301517cf6484dd7489125cfac630393

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - matplotlib-base
    - numba

tests:
  - python:
      imports:
        - speckit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mdovale/SpecKit
  repository: https://github.com/mdovale/SpecKit
  summary: A Python Toolkit for Dynamic-Resolution Spectral Analysis.
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - mdovale
