schema_version: 1

context:
  name: asyncmy
  version: "0.2.18"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/asyncmy-${{ version }}.tar.gz
  sha256: a5b28e1583814e6141ea59454baff43d1ca60df7c3be7a4c1c9bd77788d34689

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cython >=3.3
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - poetry-core
    - setuptools
    - cython >=3.3
  run:
    - python

tests:
  - python:
      imports:
        - asyncmy
        - asyncmy.connection
        - asyncmy.replication
      pip_check: true

about:
  summary: The fastest asyncio MySQL/MariaDB driver for Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/long2ice/asyncmy
  repository: https://github.com/long2ice/asyncmy

extra:
  recipe-maintainers:
    - xylar
