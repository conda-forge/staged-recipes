# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.2"

package:
  name: chonkie-core
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/chonkie-core/chonkie_core-${{ version }}.tar.gz
  sha256: c8e40ef8f3a034a7c5dd23a0401dce2ef2b4883f5a6a29cf94176d64b209bdbb

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.0,<2.0
  run:
    - python

tests:
  - python:
      imports:
        - chonkie_core
      pip_check: true
  - files:
      source:
        - packages/python/tests/
    requirements:
      run:
        - pytest
    script:
      - pytest packages/python/tests/ -vv

about:
  summary: The fastest semantic text chunking library
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  homepage: https://github.com/feyninc/chunk
  repository: https://github.com/feyninc/chunk

extra:
  recipe-maintainers:
    - pb01ka
