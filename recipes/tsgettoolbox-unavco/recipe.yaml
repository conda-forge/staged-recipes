context:
  version: 27.0.0

package:
  name: tsgettoolbox-unavco
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-unavco/tsgettoolbox_unavco-${{ version }}.tar.gz
  sha256: 33410cd7cb1e5e5321d33824b0d6b5aeddbb70036bc398cd77b186dbf4fe3d8e

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - aiodns >3.6.0
  - async_retriever
  - pandas
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
      - tsgettoolbox_unavco
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: Plugin for tsgettoolbox to retrieve time series data from UNAVCO.
  description: |
    The 'tsgettoolbox_unavco' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    UNAVCO data repository.  The UNAVCO data repository contains geodetic and
    geophysical data from the EarthScope Consortium, the NSF Geodetic Facility
    for the Advancement of Geoscience (GAGE), and other projects.
  homepage: https://pypi.org/project/tsgettoolbox-unavco/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
