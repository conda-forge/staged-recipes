context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-unavco
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-unavco/tsgettoolbox_unavco-${{ version }}.tar.gz
  sha256: 33410cd7cb1e5e5321d33824b0d6b5aeddbb70036bc398cd77b186dbf4fe3d8e

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools>=80
  - pip
  run:
  - python >=3.10
  - aiodns >3.6.0
  - async_retriever
  - pandas
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_unavco
    pip_check: true

about:
  summary: Plugin for tsgettoolbox to retrieve time series data from UNAVCO.
