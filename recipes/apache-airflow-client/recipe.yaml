context:
  version: "3.3.2"

package:
  name: apache-airflow-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-client/apache_airflow_client-${{ version }}.tar.gz
  sha256: e9bb8de3717bb3a62a2efa4d31458b35683d775e91c5667f8697df7847baeb49

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.10,!=3.15
    - hatchling
    - pip
  run:
    - python >=3.10,!=3.15
    - pydantic >=2.11.0
    - python-dateutil
    - urllib3 >=2.1.0,!=2.6.0

tests:
  - python:
      imports:
        - airflow_client
        - airflow_client.client
      pip_check: true

about:
  homepage: https://airflow.apache.org/
  summary: Python client for the Apache Airflow REST API
  description: |
    apache-airflow-client is the official Python client for the Apache
    Airflow REST API. It is generated from Airflow's OpenAPI specification
    and lets you manage DAGs, DAG runs, tasks, connections, pools,
    variables, and other Airflow resources programmatically from Python.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://airflow.apache.org/docs/apache-airflow/stable/stable-rest-api-ref.html
  repository: https://github.com/apache/airflow-client-python

extra:
  recipe-maintainers:
    - pb01ka
