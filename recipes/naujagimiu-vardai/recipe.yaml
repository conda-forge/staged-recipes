context:
  name: naujagimiu-vardai
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ello-lithuania/lietuviski-vardadieniai/archive/refs/tags/naujagimiu-vardai-v${{ version }}.tar.gz
  sha256: d78139afd2579ea118eca640f4e20b604dd158d8597ed82bb67d107524bcdeb3

build:
  number: 0
  noarch: python
  script: python -m pip install ./naujagimiu-vardai -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - naujagimiu-vardai = naujagimiu_vardai.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - naujagimiu_vardai
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - naujagimiu-vardai --help
      - naujagimiu-vardai --version
      - naujagimiu-vardai --top 5
      - naujagimiu-vardai --vardas jonas

about:
  homepage: https://krikstynudovana.lt/kriksto-vardai/
  summary: 'Most popular newborn names in Lithuania (2024, Registry Centre open data): Python library and CLI'
  description: |
    Populiariausi Lietuvos naujagimių vardai (2024 m., VĮ Registrų centras, data.gov.lt).
    Most popular newborn names in Lithuania, as a Python library and CLI.
    Code MIT, data CC BY 4.0.
  license: MIT AND CC-BY-4.0
  license_file:
    - naujagimiu-vardai/LICENSE
    - naujagimiu-vardai/DATA_LICENSE
  documentation: https://krikstynudovana.lt/kriksto-vardai/
  repository: https://github.com/ello-lithuania/lietuviski-vardadieniai

extra:
  recipe-maintainers:
    - ello-lithuania
