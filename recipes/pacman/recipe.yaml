schema_version: 1

context:
  version: "0.1.0"

package:
  name: pacman
  version: ${{ version }}

source:
  url: https://gitlab.com/drti/pacman/-/archive/v${{ version }}/pacman-v${{ version }}.tar.gz
  sha256: 3baba5b25bfed66bb49e20186192c6ac0ea75b8b1ba0932ed347449d29f7adb9
  patches:
    - 0001-install-python-extension-into-site-packages.patch

build:
  number: 0
  skip: osx and x86_64
  dynamic_linking:
    rpath_allowlist:
      - $ORIGIN

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - if: osx
      then: llvm-openmp
    - arborx >=2.1
    - kokkos >=5.2
    - kokkos-kernels >=5.2
    - numpy
    - pybind11 >=3
    - python
  run:
    - arborx >=2.1
    - kokkos >=5
    - kokkos-kernels >=5
    - numpy
    - python

tests:
  - python:
      imports:
        - pacman
  - script:
      - if: unix
        then: test -f $PREFIX/lib/cmake/PACMAN/PACMANConfig.cmake
        else: if exist %LIBRARY_PREFIX%\lib\cmake\PACMAN\PACMANConfig.cmake (exit 0) else (exit 1)

about:
  homepage: https://gitlab.com/drti/pacman
  summary: Portable algorithms for coupling, mapping, and adaptive interpolation
  description: PACMAN is a C++ library with Python and Fortran bindings for portable coupling, mapping, and adaptive interpolation of scientific data.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://drti.gitlab.io/pacman/
  repository: https://gitlab.com/drti/pacman

extra:
  recipe-maintainers:
    - fbordeu
