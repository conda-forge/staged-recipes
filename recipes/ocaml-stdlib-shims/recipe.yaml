context:
  version: "0.3.0"

package:
  name: ocaml-stdlib-shims
  version: ${{ version }}

source:
  url: https://github.com/ocaml/stdlib-shims/releases/download/${{ version }}/stdlib-shims-${{ version }}.tbz
  sha256: babf72d3917b86f707885f0c5528e36c63fccb698f4b46cf2bab5c7ccdd6d84a

build:
  number: 0
  skip:
    - win
  script:
    # Temporary workaround for conda-forge/ocaml-feedstock#101.
    - if: osx
      then: export CONDA_OCAML_CC="${CC}"
    - if: osx
      then: export CONDA_OCAML_MKEXE="${CC} -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -Wl,-headerpad_max_install_names -Wl,-rpath,@executable_path/../lib"
    - if: osx
      then: export CONDA_OCAML_MKDLL="${CC} -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -shared -Wl,-headerpad_max_install_names -undefined dynamic_lookup"
    - dune build --profile=release -p stdlib-shims @install
    - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" stdlib-shims

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("ocaml") }}
    - ocaml-dune >=1.0
  host:
    - ocaml >=4.02.3

tests:
  - package_contents:
      strict: true
      files:
        - lib/ocaml/stdlib-shims/*
        - doc/stdlib-shims/*

about:
  homepage: https://github.com/ocaml/stdlib-shims
  repository: https://github.com/ocaml/stdlib-shims
  summary: Backport some of the new stdlib features to older compilers
  license: LGPL-2.1-only WITH OCaml-LGPL-linking-exception
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ManuelLerchner
    - MementoRC
