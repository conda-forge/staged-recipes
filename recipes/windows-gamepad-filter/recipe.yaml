schema_version: 1
package:
  name: windows-gamepad-filter
  version: 1.0.0
source:
- url: https://github.com/titanfyre/Windows-Gamepad-Filter/releases/download/input-language-sdks-v1.0.0/windows-gamepad-filter-input-sdks-1.0.0-source.zip
  sha256: e9fbc599298897a363de5faa56214e7da6043a821eac465a22e7358ac91de756
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - windows_gamepad_filter
    pip_check: true
- script:
  - python -m pip check
  - python -c "from windows_gamepad_filter import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Windows-Gamepad-Filter
  summary: Windows x64 Windows-Gamepad-Filter Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Windows-Gamepad-Filter-C-ffi/LICENSE
  repository: https://github.com/titanfyre/Windows-Gamepad-Filter
extra:
  recipe-maintainers:
  - TitanCSA
