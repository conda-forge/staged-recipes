schema_version: 1
package:
  name: windows-input-filter
  version: 1.0.0
source:
- url: https://github.com/titanfyre/Windows-Input-Filter/releases/download/input-language-sdks-v1.0.0/windows-input-filter-input-sdks-1.0.0-source.zip
  sha256: 857f889aeb2491a2faa898e9f42769c036152176609cbf0e35739fd3844cb8f6
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - windows_input_filter
    pip_check: true
- script:
  - python -m pip check
  - python -c "from windows_input_filter import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Windows-Input-Filter
  summary: Windows x64 Windows-Input-Filter Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Windows-Input-Filter-C-ffi/LICENSE
  repository: https://github.com/titanfyre/Windows-Input-Filter
extra:
  recipe-maintainers:
  - TitanCSA
