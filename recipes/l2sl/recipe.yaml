schema_version: 1

context:
  version: "0.4.2"

package:
  name: l2sl
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/l/l2sl/l2sl-${{ version }}.tar.gz
  sha256: 6bad703a93c0b613ae9fac0ede3208ba36a7abc192fdcaeabff3c70b3d892acb

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - structlog >=25.2.0

tests:
  - python:
      imports:
        - l2sl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pytest
        - pydantic
    files:
      source:
        - tests/
    script:
      - pytest -vv

about:
  summary: logging to structured logging
  description: |
    l2sl funnels log records of third-party tools into your structlog
    pipeline. In addition, l2sl converts the text based log records into
    a structured representation.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/l2sl/
  documentation: https://l2sl.readthedocs.io/en/stable/
  repository: https://github.com/pmeier/l2sl

extra:
  recipe-maintainers:
    - mgorny
    - pb01ka
