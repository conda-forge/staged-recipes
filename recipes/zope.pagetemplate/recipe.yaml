schema_version: 1

context:
  version: "6.1"
  test_modules:
    - zope.pagetemplate.tests.test_basictemplate
    - zope.pagetemplate.tests.test_engine
    - zope.pagetemplate.tests.test_htmltests
    - zope.pagetemplate.tests.test_ptfile

package:
  name: zope.pagetemplate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.pagetemplate/zope_pagetemplate-${{ version }}.tar.gz
  sha256: 1303bcfb6cd6c28fa17aaaad542541d748f645e5a831a304ee9d29acb137eeba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.component
    - zope.tales
    - zope.tal >=4.2.0
    - zope.i18n >=4.0.1
    - zope.i18nmessageid
    - zope.traversing

tests:
  - python:
      imports:
        - zope.pagetemplate
        - zope.pagetemplate.pagetemplate
        - zope.pagetemplate.pagetemplatefile
        - zope.pagetemplate.engine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest -v ${{ test_modules | join(" ") }}
    requirements:
      run:
        - zope.proxy
        - zope.security
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.pagetemplate
  repository: https://github.com/zopefoundation/zope.pagetemplate
  documentation: https://zopepagetemplate.readthedocs.io
  summary: Zope Page Templates
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
