# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.1"

recipe:
  name: rpptx-split
  version: ${{ version }}

source:
  # One tag per family releases the CLI, the crates and the Python distribution.
  url: https://github.com/tensorbee/rdocx/archive/refs/tags/rpptx-v${{ version }}.tar.gz
  sha256: a00ccd831146154bbb48788855ce8f0b3bbc125e90986feefe0469b9f171008a

build:
  number: 0

outputs:
  - package:
      name: rpptx
    build:
      skip: is_abi3 and not is_python_min
      python:
        version_independent: ${{ is_abi3 }}
      script:
        - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
        - ${{ PYTHON }} -m pip install ./crates/rpptx-py -vv --no-deps --no-build-isolation --disable-pip-version-check
    requirements:
      build:
        - if: build_platform != host_platform
          then:
            - python
            - cross-python_${{ host_platform }}
            - maturin >=1.9,<2
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('rust') }}
        - cargo-bundle-licenses
      host:
        - if: is_abi3
          then: python-abi3
        - python
        - maturin >=1.9,<2
        - pip
      run:
        - python
    tests:
      - python:
          imports:
            - rpptx
          python_version:
            - if: is_abi3
              then: ${{ python_min }}.*
            - "*"
      - files:
          recipe:
            - test_rpptx.py
        script:
          - python test_rpptx.py
      - if: is_abi3
        then:
          requirements:
            run:
              - abi3audit
          script:
            - if: unix
              then: abi3audit $SP_DIR/rpptx/_rpptx.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
              else: abi3audit %SP_DIR%/rpptx/_rpptx.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
    about:
      summary: Native PPTX creation, editing, comments, notes, and rendering for Python

  - package:
      name: rpptx-cli
    build:
      script:
        - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
        - if: unix
          then: cargo install --locked --no-track --root "$PREFIX" --path crates/rpptx-cli
          else: cargo install --locked --no-track --root "%LIBRARY_PREFIX%" --path crates/rpptx-cli
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('rust') }}
        - cargo-bundle-licenses
    tests:
      - package_contents:
          bin:
            - rpptx
      - files:
          source:
            - crates/rpptx/assets/default.pptx
        script:
          - rpptx --version
          - rpptx inspect crates/rpptx/assets/default.pptx
          - rpptx validate crates/rpptx/assets/default.pptx
          - rpptx convert crates/rpptx/assets/default.pptx --to pdf --output default.pdf
    about:
      summary: CLI tool for inspecting, converting, and manipulating PPTX files

about:
  summary: Native PPTX creation, editing, comments, notes, and rendering
  homepage: https://github.com/tensorbee/rdocx
  repository: https://github.com/tensorbee/rdocx
  description: |
    rpptx creates, opens, edits, and renders PowerPoint (PPTX) presentations
    natively, without Microsoft PowerPoint or LibreOffice. It ships as a
    Python binding (rpptx) and a command line tool (rpptx-cli).
  # The code is dual licensed MIT OR Apache-2.0 upstream but only the MIT text
  # is shipped. The bundled fonts are Apache-2.0 (Caladea) and OFL-1.1 (Carlito,
  # Liberation, Noto); the embedded ICC profile has its own permissive license.
  license: MIT AND Apache-2.0 AND OFL-1.1 AND LicenseRef-sRGB2014
  license_file:
    - LICENSE
    - crates/oxml-layout/fonts/LICENSE-*
    - crates/oxml-layout/fonts/NOTICE-*
    - crates/oxml-pdf/assets/LICENSE-sRGB2014
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - hadim
