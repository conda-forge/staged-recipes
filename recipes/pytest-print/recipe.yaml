schema_version: 1

context:
  version: "1.4.3"

package:
  name: pytest-print
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pytest-print/pytest_print-${{ version }}.tar.gz
  sha256: a4bc4cf2f6834649d05620ac532f28d2ed1bae1d8f37c44d18a0f507b4f405c5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-fancy-pypi-readme >=25.1
    - hatch-vcs >=0.5
    - hatchling >=1.32.4
    - python-sbom >=0.1.2
    - pip
  run:
    - python >=${{ python_min }}
    - pytest >=9.1.1

tests:
  - python:
      imports:
        - pytest_print
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - pytest
        - httpx2
    script:
      - pytest -vvv -p pytester tests
    files:
      source:
        - tests/

about:
  summary: pytest-print adds the printer fixture you can use to print messages to the user (directly to the pytest runner, not stdout)
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pytest-dev/pytest-print
  repository: https://github.com/pytest-dev/pytest-print

extra:
  recipe-maintainers:
    - jsmolic
