{% set name = "esgcet" %}
{% set version = "5.5.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/esgcet-{{ version }}.tar.gz
  sha256: 2eba39509c8b87f65fbad226dcee80494885b1fe733f80b429d30b12d36fd15c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - esgpidcitepub = esgcet.cli.esgpidcitepub:main
    - esgmkpubrec = esgcet.cli.esgmkpubrec:main
    - esgindexpub = esgcet.cli.esgindexpub:main
    - esgpublish = esgcet.pub_internal:main
    - esgupdate = esgcet.cli.esgupdate:main
    - esgmapconv = esgcet.cli.esgmapconv:main
    - esgunpublish = esgcet.cli.esgunpublish:main
    - esgcet = esgcet.cli:app
    - esglogin = esgcet.cli.esglogin:main
    - esgadd = esgcet.cli.esgstacaddrep:main

requirements:
  host:
    - python >=3.10,<3.15
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=3.10,<3.15
    - requests
    - esgfpid
    - xarray
    - netcdf4
    - dask
    - distributed
    - pyyaml
    - cc-plugin-wcrp >=2.0.0
    - pystac-client
    - kerchunk
    - virtualizarr
    - esgvoc >=5.0.1
    - pydantic
    - typer
    - attrs
    - h5py
    - globus-cli
    - globus-sdk >=4.3.0
    - scipy >=1.15.3
    - fastparquet >=2026.5.0
    - duckdb >=1.5.5

test:
  imports:
    - esgcet
    - esgcet.cli
    - esgcet.project
    - esgcet.scan
    - esgcet.stac
  commands:
    - esgpublish --version
    - esgcet --help

about:
  home: http://esgf.github.io/
  summary: ESGCET publication package
  description: |
    Publishing client for the Earth System Grid Federation (ESGF).
    ESGCET provides tools for publishing climate model output data to ESGF
    data nodes, including metadata extraction, dataset validation, and
    publication to STAC catalogs and Solr indexes.
  license: BSD-3-Clause
  license_file: bsd-3-clause.txt
  doc_url: https://esg-publisher.readthedocs.io/
  dev_url: https://github.com/ESGF/esg-publisher

extra:
  recipe-maintainers:
    - sashakames
