schema_version: 1
package:
  name: titan-file-filter
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Titan-File-Filter/language-sdks-v1.0.0/titan-file-filter-sdk-source-1.0.0.zip
  sha256: 259e784bff8bbb1c395abf32589b8047130610f7af445e9be2fd09173375e349
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - titan_file_filter
    pip_check: true
- script:
  - python -m pip check
  - python -c "from titan_file_filter import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Titan-File-Filter
  summary: Windows x64 Titan-File-Filter Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Titan-File-Filter-C-ffi/LICENSE
  - Titan-File-Filter-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
