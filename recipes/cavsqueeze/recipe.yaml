schema_version: 1

context:
  version: "1.21.0"

package:
  name: cavsqueeze
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cavsqueeze/cavsqueeze-${{ version }}.tar.gz
  sha256: ce799d1b5dc4e87c1c85f55f6448adb743527d700220defb7b3dc22779880dfb

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.7

tests:
  - python:
      imports:
        - cavsqueeze
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/cavsqueeze
  license: Apache-2.0
  license_file: LICENSE
  summary: "Spin squeezing in solid-state spin ensembles coupled to a cavity, with the imperfections of a real crystal"
  description: |
    Simulates and measures spin squeezing in a large group of spins coupled
    to one microwave or optical resonator, including a spread of spin
    frequencies, decay into the cavity, thermal photons, loss of coherence
    and uneven coupling. It estimates the squeezing in shot-by-shot data
    with an error bar, plans how many shots a measurement needs, and says
    what the squeezing buys a clock or a magnetometer. It was built for
    171Yb3+:CaWO4 and works for any spin ensemble coupled to a resonator.
  repository: https://github.com/TaN-MM-Org/cavsqueeze
  documentation: https://github.com/TaN-MM-Org/cavsqueeze#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
