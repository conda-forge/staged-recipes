schema_version: 1

context:
  version: "1.15.0"
  python_min: "3.10"

package:
  name: cavsqueeze
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cavsqueeze/cavsqueeze-${{ version }}.tar.gz
  sha256: 2a057a368eeebdb50655f348820524cb01efff7c5856d2eaf84e961f4476e137

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.7

tests:
  - python:
      imports:
        - cavsqueeze
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/cavsqueeze
  license: Apache-2.0
  license_file: LICENSE
  summary: "Beyond-mean-field cavity-mediated spin squeezing for solid-state clock-transition ensembles"
  description: |
    Class-resolved cumulant solver for cavity-mediated spin squeezing whose
    cost is set by the shape of the ensemble rather than its size, with
    exact QuTiP/PIQS and DTWA cross-checks, squeezing estimation from
    measured shot records, Dick-effect clock budgets and synchronized
    differential clock comparisons.
  repository: https://github.com/TaN-MM-Org/cavsqueeze
  documentation: https://github.com/TaN-MM-Org/cavsqueeze#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
