schema_version: 1

context:
  version: 0.3b0

package:
  name: opentelemetry-opamp-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-opamp-client/opentelemetry_opamp_client-${{ version }}.tar.gz
  sha256: e49e4a49e5177fa20feef6a96760aeae4f84060ce2058a8da29a43354b74ee7d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.12,<2.dev0
    - protobuf >=5.0,<7.0
    - uuid-utils >=0.11.0,<1

tests:
  - python:
      imports:
        - opentelemetry._opamp
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: OpenTelemetry OpAMP client
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/opamp/opentelemetry-opamp-client

extra:
  recipe-maintainers:
    - BrownMunda1
