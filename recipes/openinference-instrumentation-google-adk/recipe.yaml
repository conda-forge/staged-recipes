schema_version: 1

context:
  version: "1.1.9"

package:
  name: openinference-instrumentation-google-adk
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/openinference-instrumentation-google-adk/openinference_instrumentation_google_adk-${{ version }}.tar.gz
  sha256: 9671d71c00407a9b07441876b403c38126804e2f8d353dd2dd83ac96495c184c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api
    - opentelemetry-instrumentation
    - opentelemetry-semantic-conventions
    - openinference-instrumentation >=0.1.82
    - openinference-semantic-conventions >=0.1.46
    - typing_extensions
    - wrapt

tests:
  - python:
      imports:
        - openinference.instrumentation.google_adk
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: OpenInference Google ADK Instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Arize-ai/openinference/tree/main/python/instrumentation/openinference-instrumentation-google-adk

extra:
  recipe-maintainers:
    - jsmolic
