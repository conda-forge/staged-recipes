schema_version: 1

context:
  version: "1.1.6"

package:
  name: langid
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/l/langid/langid-${{ version }}.tar.gz
  sha256: 044bcae1912dab85c33d8e98f2811b8f4ff1213e5e9a9e9510137b84da2cb293

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - langid = langid.langid:main

requirements:
  host:
    - python
    - pip
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - langid
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - langid --help

about:
  summary: langid.py is a standalone Language Identification (LangID) tool.
  license: FreeBSD-DOC
  license_file: PLEASE_ADD_LICENSE_FILE
  homepage: https://github.com/saffsd/langid.py

extra:
  recipe-maintainers:
    - MatthewNeko
