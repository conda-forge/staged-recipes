{% set name = "cheminformant" %}
{% set version = "2.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/cheminformant-{{ version }}.tar.gz
  sha256: 47c32ee1a8b4b7aeca27bf1bf7747cb26896aa423e5bff53b13a79e4db21f586

build:
  entry_points:
    - chemfetch = ChemInformant.cli:main_fetch
    - chemdraw = ChemInformant.cli:main_draw
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61.0
  run:
    - python >={{ python_min }}
    - requests >=2.25.0
    - requests-cache >=1.2.0
    - pydantic >=2.0
    - pandas >=1.5.0
    - sqlalchemy >=1.4

test:
  imports:
    - ChemInformant
  commands:
    - pip check
    - chemfetch --help
    - chemdraw --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/HzaCode/ChemInformant
  summary: A robust and high-throughput Python client for the PubChem API, designed for automated data retrieval and analysis
  description: |
    ChemInformant is a robust data acquisition engine for the PubChem database,
    engineered for the modern scientific workflow. It intelligently manages network
    requests, performs rigorous runtime data validation, and delivers analysis-ready
    results, providing a dependable foundation for any computational chemistry project in Python.
  license: MIT
  license_file: LICENSE
  doc_url: https://hezhiang.com/ChemInformant
  dev_url: https://github.com/HzaCode/ChemInformant

extra:
  recipe-maintainers:
    - HzaCode
