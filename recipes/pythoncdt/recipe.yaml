schema_version: 1

context:
  version: "2.0.1"

package:
  name: pythoncdt
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pythoncdt/pythoncdt-${{ version }}.tar.gz
  sha256: ed9165cf93cbbfec74ac5421001443a3ecbcaae67adff0660e4eb5c5c4f11aa1

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - pybind11
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
  host:
    - python
    - pip
    - scikit-build-core >=0.11
    - pybind11 >=3.0.4
    - setuptools-scm >=8
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - pythoncdt
      pip_check: true
  - files:
      source:
        - tests/
        - CDT/visualizer/data/
    requirements:
      run:
        - pytest
    script:
      - pytest tests -v

about:
  homepage: https://github.com/artem-ogre/PythonCDT
  summary: 'Python bindings for CDT: constrained Delaunay triangulation'
  license: MPL-2.0 AND BSD-3-Clause AND Apache-2.0 WITH LLVM-exception
  # CDT is bundled as source; its predicates.h is BSD-3-Clause and
  # portable_nth_element.hpp comes from LLVM's libc++
  license_file:
    - LICENSE
    - CDT/CDT/LICENSE
    - CDT/CDT/LICENSE-predicates.txt
    - CDT/CDT/LICENSE-LLVM.txt
  repository: https://github.com/artem-ogre/PythonCDT

extra:
  recipe-maintainers:
    - artem-ogre
    - mdealencar
