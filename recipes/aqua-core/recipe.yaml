schema_version: 1

context:
  version: "1.0.0"
  # AQUA requires Python >=3.11, but conda-forge's current global
  # python_min default is 3.10 - override it here per CFEP-25 guidance
  python_min: "3.11"

package:
  name: aqua-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aqua-core/aqua_core-${{ version }}.tar.gz
  sha256: 54de2df9f84d2c2a8ea58e62059fb90c9e3f6975d97ba0af2e9ed97c101530e8

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - aqua = aqua.core.console.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}
    - eccodes >=2.41.0
    - netcdf4
    - h5py >=3.12.1
    - astropy-healpix
    - boto3
    - cartopy >=0.24.1
    - cfgrib
    - dask
    - distributed
    - fastparquet
    - filelock
    - gcsfs
    - icechunk
    - intake >=2.0.9
    - intake-xarray >=2.0.0
    - jinja2
    - kerchunk
    - matplotlib-base
    - metpy
    - numpy
    - pandas >=3.0.0
    - pypdf
    - pyyaml
    - regionmask
    - ruamel.yaml
    - scipy
    - seaborn
    - smmregrid >=0.1.4
    - typeguard
    - xarray >=2025.12.0
    - zarr >=3.0

tests:
  - python:
      imports:
        - aqua
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - aqua --help

about:
  homepage: https://github.com/DestinE-Climate-DT/AQUA/
  repository: https://github.com/DestinE-Climate-DT/AQUA/
  documentation: https://aqua.readthedocs.io/en/latest/index.html
  summary: AQUA; a model evaluation framework for high-resolution climate model simulations
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - oloapinivad
