schema_version: 1

context:
  version: "4.0"

package:
  name: zope.browser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.browser/zope_browser-${{ version }}.tar.gz
  sha256: 7e5968051c776a37c412584c994468c5ff480e15af7961bf96232c85df1ad263

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface

tests:
  - python:
      imports:
        - zope.browser
        - zope.browser.interfaces
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - src/zope/browser/README.rst
    script:
      - python -m doctest -v -o NORMALIZE_WHITESPACE -o ELLIPSIS src/zope/browser/README.rst

about:
  homepage: https://github.com/zopefoundation/zope.browser
  repository: https://github.com/zopefoundation/zope.browser
  documentation: https://zopebrowser.readthedocs.io
  summary: Shared Zope Toolkit browser components
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
