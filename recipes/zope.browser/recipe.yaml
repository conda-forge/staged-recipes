schema_version: 1

context:
  version: "4.0"

package:
  name: zope.browser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.browser/zope_browser-${{ version }}.tar.gz
  sha256: 7e5968051c776a37c412584c994468c5ff480e15af7961bf96232c85df1ad263

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ==78.1.1
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface

tests:
  - python:
      imports:
        - zope.browser
        - zope.browser.interfaces
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.browser
  repository: https://github.com/zopefoundation/zope.browser
  documentation: https://zopebrowser.readthedocs.io
  summary: Shared Zope Toolkit browser components
  license: ZPL-2.1
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - killua156
