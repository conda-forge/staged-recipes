context:
  name: pinker
  version: "1.3.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 773325003ce829e4c99fa2a9534617d8a918fab5fd6d035ef73df39562d16b42

build:
  number: 0
  skip:
    - match(python, "<3.11")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
        - numpy
  host:
    - python
    - pip
    - setuptools >=77
    - numpy
  run:
    - python
    - qpsolvers >=4.3.1
    - typing-extensions

tests:
  - python:
      imports:
        - pinker
        - pinker.kinematics._kinematics_c
      pip_check: true
  - files:
      source:
        - tests/
    script:
      # Other unit tests need other dependencies or networking
      - cd tests/kinematics
      - python -m unittest --verbose test_algorithms test_mjcf test_urdf

about:
  homepage: https://pink-kinematics.github.io/pinker/
  summary: Python inverse kinematics for embedded robots
  description: |
    Pinker is a leaner version of Pink aimed in particular at single-board
    computers. It ships its own kinematics backend, so the whole library is
    NumPy, a QP solver and one C file that takes seconds to compile. Pinker is
    API-compatible with Pink 4.4.0 and produces the same results at the same
    speed.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://pink-kinematics.github.io/pinker/
  repository: https://github.com/pink-kinematics/pinker

extra:
  recipe-maintainers:
    - stephane-caron
