schema_version: 1

context:
  version: "2.2.0"
  # from build.py
  envoy_version: "1.39.0"
  udpa_version: "0.0.1"
  opencensus_proto_version: "0.2.0"
  opentelemetry_proto_version: "0.9.0"
  cel_spec_version: "0.24.0"
  # upstream uses main (!)
  xds_commit: dba9d589def2cd10099a3a64887d859188c2f57a
  googleapis_commit: 57aa4dbce5d23b2115b2732b10dcb7ddc8e8698d
  protoc_gen_validate_commit: 414042a5ff2e98dc47f8161937316a25b1da5bba
  prometheus_client_model_commit: 7c1a1b81eba301a47b3a7586810af31171f71a9b

package:
  name: envoy-data-plane
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/e/envoy-data-plane/envoy_data_plane-${{ version }}.tar.gz
    sha256: 79d6aecab054eecd79d5fa64bf6c775bf7f56ba7cb0b9cf9b34bf8f4c55b79e1
  - url: https://github.com/envoyproxy/envoy/archive/refs/tags/v${{ envoy_version }}.tar.gz
    sha256: a6c5b2af8387f7e9eb953d5ea66d61a57ecb1c2bef698ef154631092195b84b7
    target_directory: deps/envoy/
  - url: https://github.com/cncf/xds/archive/${{ xds_commit }}.tar.gz
    sha256: eaca6f7ac95a1addcc93e7d4bed4c8b697a767f122dbd1978e2dd62da0b701f0
    target_directory: deps/xds/
  - url: https://github.com/googleapis/googleapis/archive/${{ googleapis_commit }}.tar.gz
    sha256: 8cbdbd7b67d3ed5e09b5e3e8c4c46c340263a3b1d47bbc5171ef07e215ee2c5c
    target_directory: deps/googleapis/
  - url: https://github.com/cncf/udpa/archive/refs/tags/v${{ udpa_version }}.tar.gz
    sha256: 83a7dcc316d741031f34c0409021432b74a39c4811845a177133f02f948fe2d8
    target_directory: deps/udpa/
  - url: https://github.com/envoyproxy/protoc-gen-validate/archive/${{ protoc_gen_validate_commit }}.tar.gz
    sha256: 56971822d206666f072c9fec91f3dc86f9b54307059212d4d8579a116e12238c
    target_directory: deps/protoc-gen-validate/
  - url: https://github.com/census-instrumentation/opencensus-proto/archive/refs/tags/v${{ opencensus_proto_version }}.tar.gz
    sha256: 7d7ab5580b123999e0b2e76b3fc8201e0d9d4d24e575788b73bbd21de712884c
    target_directory: deps/opencensus-proto/
  - url: https://github.com/open-telemetry/opentelemetry-proto/archive/refs/tags/v${{ opentelemetry_proto_version }}.tar.gz
    sha256: 9ec38ab51eedbd7601979b0eda962cf37bc8a4dc35fcef604801e463f01dcc00
    target_directory: deps/opentelemetry-proto/
  - url: https://github.com/prometheus/client_model/archive/${{ prometheus_client_model_commit }}.tar.gz
    sha256: 1599894b5e99ed32291a5b09718d0bb1e79a362f7bf8efe055a243d1de626baf
    target_directory: deps/prometheus-client-model/
  - url: https://github.com/google/cel-spec/archive/refs/tags/v${{ cel_spec_version }}.tar.gz
    sha256: 5cba6b0029e727d1f4d8fd134de4e747cecc0bc293d026017d7edc48058d09f7
    target_directory: deps/cel-spec/

build:
  number: 0
  noarch: python
  script:
    # remove betterproto2 pin, we don't have version that old
    - sed -i -e '/betterproto2/s:,<[0-9.]*::' pyproject.toml
    # move the .proto dependencies, see build.py
    - mkdir BUILD/
    - mv deps/envoy/api/envoy BUILD/
    - mkdir BUILD/envoy/contrib/
    - mv deps/envoy/contrib/*/ BUILD/envoy/contrib/
    - mv deps/xds BUILD/
    - mv deps/googleapis/google BUILD/
    - mv deps/udpa/udpa BUILD/
    - mv deps/protoc-gen-validate/validate BUILD/
    - mv deps/opencensus-proto/src/opencensus BUILD/
    - mv deps/opentelemetry-proto/opentelemetry BUILD/
    - mv deps/prometheus-client-model BUILD/prometheus
    - mv deps/cel-spec/proto BUILD/cel
    # this one's not included in the result but needed at build time
    - mkdir BUILD/envoy-build
    - mv deps/envoy/test BUILD/envoy-build/
    # build the package
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-build-scripts
    - betterproto2-compiler
    - grpcio-tools >=1.75.1
    - requests
    - structlog
    - pip
  run:
    - python >=${{ python_min }}
    #- betterproto2

tests:
  - python:
      imports:
        - envoy_data_plane
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python dataclasses for the Envoy Data-Plane-API
  license: MIT AND Apache-2.0
  license_file:
    - LICENSE
    # source protobuf files used, all of them Apache-2.0
    - deps/envoy/LICENSE
    - BUILD/xds/LICENSE
    - deps/googleapis/LICENSE
    - deps/udpa/LICENSE
    - deps/protoc-gen-validate/LICENSE
    - deps/opencensus-proto/LICENSE
    - deps/opentelemetry-proto/LICENSE
    - deps/cel-spec/LICENSE
    - BUILD/prometheus/LICENSE
  homepage: https://pypi.org/project/envoy_data_plane/

extra:
  recipe-maintainers:
    - mgorny
