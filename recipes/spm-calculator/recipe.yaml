context:
  version: "1.1.0"

package:
  name: spm-calculator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spm-calculator/spm_calculator-${{ version }}.tar.gz
  sha256: 1be418c6a1baaba86f63c3287b38efecf7f94af563b864a73934ecbf60a01f38

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pandas >=2.0
    - numpy >=1.24
    - requests >=2.28
    - census >=0.8
    - us >=3.0
    - openpyxl >=3.1.5

tests:
  - python:
      imports:
        - spm_calculator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PolicyEngine/spm-calculator
  summary: Supplemental Poverty Measure calculator
  license: MIT
  license_file: LICENSE
  repository: https://github.com/PolicyEngine/spm-calculator

extra:
  recipe-maintainers:
    - MementoRC
