context:
  version: "0.2"

package:
  name: jumble
  version: ${{ version }}

source:
  url: https://github.com/lguez/Jumble/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5483b68a5a184e0fc074de98d6fd22b9feab43d203137007da947b73ab04fc49

build:
  skip:
    - win
  number: 0

requirements:
  build:
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake

tests:
  - package_contents:
      lib:
        - jumble

about:
  homepage: https://github.com/lguez/Jumble
  summary: 'A library of various utilities in Fortran 2003'
  description: |
    Jumble is a library of various utilities in Fortran 2003, basic
    mathematical constants and basic procedures for numerical tasks.
  license: GPL-3.0-only
  documentation: https://lguez.github.io/Jumble
