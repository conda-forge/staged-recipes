# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

# SolidCraft (https://github.com/tangency-labs/solidcraft), an open-source parametric 3D CAD
# application written in Rust. Two outputs:
#
#   solidcraft         the desktop app with the headless CLI next to it (`solidcraft`,
#                      `solidcraft-cli`), as upstream's desktop packages ship them, plus Linux
#                      desktop integration
#   solidcraft-python  the Python client, noarch: python, pinned to that package
#
# The Python client is pure Python, but its bindings under `python/src/solidcraft/_generated` are
# generated by `cargo xtask python` from a built `solidcraft-cli` and are not committed. This
# recipe generates them the same way, from the `solidcraft-cli` that the sibling `solidcraft`
# output provides as a build dependency, and then installs `python/` with hatchling, so both
# outputs are built from the source tag.
#
# The desktop app owns `bin/solidcraft`, so the Python output declares only the
# `solidcraft-session` entry point and drops the `solidcraft` console script the package
# installs, which would otherwise clobber the app's binary. `solidcraft-cli` is on `PATH` anyway.

context:
  version: "0.51.1"

recipe:
  name: solidcraft
  version: ${{ version }}

build:
  number: 0

outputs:
  - package:
      name: solidcraft
      version: ${{ version }}
    source:
      url: https://github.com/tangency-labs/solidcraft/archive/refs/tags/v${{ version }}.tar.gz
      sha256: a9ff9dade3310510143cdf3811743bb9b3545a7fa27aca5065da87e2199d0453
    build:
      script:
        # No line tables: they are a large share of the target directory (and of the package),
        # and they are what ran the Linux CI build out of disk.
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        content:
          # The CLI is installed with the render library its sibling app bundles, so cargo reuses
          # the app's compiled engine instead of building a second feature variant of it.
          - if: unix
            then:
              - cargo install --locked --no-track --path apps/solidcraft --root "${PREFIX}"
              - cargo install --locked --no-track --path apps/solidcraft-cli --root "${PREFIX}" --features bundled-render-library
            else:
              - cargo install --locked --no-track --path apps/solidcraft --root "%LIBRARY_PREFIX%"
              - cargo install --locked --no-track --path apps/solidcraft-cli --root "%LIBRARY_PREFIX%" --features bundled-render-library
          # Desktop integration: the entry upstream's .deb and .rpm install, with the hicolor
          # icons it names, and the design MIME type (.sc files).
          - if: linux
            then:
              - install -Dm644 assets/platforms/linux/io.tangencylabs.solidcraft.desktop "${PREFIX}/share/applications/io.tangencylabs.solidcraft.desktop"
              - install -Dm644 assets/platforms/linux/io.tangencylabs.solidcraft.workshop-links.desktop "${PREFIX}/share/applications/io.tangencylabs.solidcraft.workshop-links.desktop"
              - install -Dm644 assets/platforms/linux/io.tangencylabs.solidcraft.mime.xml "${PREFIX}/share/mime/packages/io.tangencylabs.solidcraft.mime.xml"
              - for size in 16 24 32 48 64 128 256 512; do install -Dm644 "assets/icons/app/linux/exports/hicolor/${size}x${size}/apps/io.tangencylabs.solidcraft.png" "${PREFIX}/share/icons/hicolor/${size}x${size}/apps/io.tangencylabs.solidcraft.png"; done
          - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('rust') }}
        - ${{ stdlib('c') }}
        - cargo-bundle-licenses
      run:
        # The binaries' unwinder is libgcc_s.so.1. The desktop app loads its display, input and
        # GPU libraries with dlopen, so none shows up as a link dependency: these are the
        # libraries upstream's .deb and .rpm require at run time.
        - if: linux
          then:
            - libgcc
            - libxkbcommon
            - libglvnd
            - libvulkan-loader
            - wayland
            - xorg-libx11
            - xorg-libxcursor
            - xorg-libxi
    tests:
      - package_contents:
          bin:
            - solidcraft
            - solidcraft-cli
      - if: linux
        then:
          - package_contents:
              files:
                - share/applications/io.tangencylabs.solidcraft.desktop
                - share/applications/io.tangencylabs.solidcraft.workshop-links.desktop
                - share/mime/packages/io.tangencylabs.solidcraft.mime.xml
                - share/icons/hicolor/256x256/apps/io.tangencylabs.solidcraft.png
      - script:
          content:
            - if: unix
              then:
                - solidcraft --version
                - solidcraft --help > /dev/null
                - solidcraft-cli --version
                - solidcraft-cli commands > /dev/null
                - solidcraft-cli run run-box.json --out box.step
                - test -s box.step
              else:
                - solidcraft --version
                - solidcraft --help > NUL
                - solidcraft-cli --version
                - solidcraft-cli commands > NUL
                - solidcraft-cli run run-box.json --out box.step
                - if not exist box.step exit /b 1
        files:
          recipe:
            - run-box.json
    about:
      homepage: https://solidcraft.io
      repository: https://github.com/tangency-labs/solidcraft
      documentation: https://docs.solidcraft.io/
      summary: SolidCraft - an open-source parametric 3D CAD application, with its headless CLI
      description: |
        SolidCraft is an open-source parametric 3D CAD application built in pure Rust: sketch,
        constrain and build solids with a parametric feature timeline, change a dimension and
        watch the model rebuild, in an assembly with joints and mass properties, sheet metal or
        plastic-enclosure features, with STEP, IGES, 3MF, STL, OBJ and glTF import and export.

        This package installs the desktop app (`solidcraft`) and the headless CLI next to it
        (`solidcraft-cli`), the same two programs upstream's desktop packages ship. The CLI runs
        command scripts, measures and exports designs, renders snapshots and serves the Model
        Context Protocol (MCP) server that agents and the Python client drive.
      license: MIT OR Apache-2.0
      license_file:
        - LICENSE-MIT
        - LICENSE-APACHE
        - NOTICE
        - THIRD-PARTY-LICENSES.txt
        - THIRDPARTY.yml

  - package:
      name: solidcraft-python
      version: ${{ version }}
    source:
      url: https://github.com/tangency-labs/solidcraft/archive/refs/tags/v${{ version }}.tar.gz
      sha256: a9ff9dade3310510143cdf3811743bb9b3545a7fa27aca5065da87e2199d0453
    build:
      noarch: python
      # Only the session daemon: the desktop app owns `bin/solidcraft` (see the note at the top).
      python:
        entry_points:
          - solidcraft-session = solidcraft.__main__:main
      script:
        content:
          # Generate the bindings the way upstream's release does, from a built solidcraft-cli:
          # the sibling output provides it as a build dependency, and only xtask compiles here.
          - cargo run --release --locked -p xtask -- python --cli solidcraft-cli
          # hatchling honours the package's VCS ignore files and `python/.gitignore` lists
          # `src/solidcraft/_generated/`, so drop it or the generated bindings are left out.
          - python -c "import os; os.path.exists('python/.gitignore') and os.remove('python/.gitignore')"
          - python -m pip install --no-deps --no-build-isolation python/
          - if: unix
            then:
              - python "${RECIPE_DIR}/drop_console_script.py"
            else:
              - python "%RECIPE_DIR%\drop_console_script.py"
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('rust') }}
        - ${{ stdlib('c') }}
        - solidcraft ==${{ version }}
      host:
        - python ${{ python_min }}.*
        - pip
        - hatchling
      run:
        - python >=${{ python_min }}
        # Version-exact rather than `pin_subpackage(..., exact=True)`: this output is noarch and
        # is built once, while `solidcraft` is built per platform with a per-platform build
        # string, so an exact subpackage pin would only resolve on the machine that built it.
        - solidcraft ==${{ version }}
    tests:
      - package_contents:
          files:
            not_exists:
              - python-scripts/**
      - python:
          imports:
            - solidcraft
            - solidcraft._generated.commands
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
      - script:
          content:
            - python test_session.py
          env:
            SOLIDCRAFT_NO_DOWNLOAD: "1"
        files:
          recipe:
            - test_session.py
    about:
      homepage: https://solidcraft.io
      repository: https://github.com/tangency-labs/solidcraft
      documentation: https://docs.solidcraft.io/
      summary: Drive SolidCraft, the parametric CAD app, from Python - every command and MCP tool, typed
      description: |
        The `solidcraft` Python client for SolidCraft: every engine command and every Model Context
        Protocol tool as a typed method, generated from the build's own command registry. A session
        starts a headless SolidCraft (`solidcraft-cli mcp --structured`) or attaches to one that is
        already running, and NumPy, SciPy and pandas values can be passed straight in.

        This package depends on the `solidcraft` conda package of the same version, which provides
        `solidcraft-cli`, so the client never downloads a binary at run time. The Python module is
        `solidcraft`; the `solidcraft` command itself belongs to the desktop app package.
      license: MIT OR Apache-2.0
      license_file:
        - LICENSE-MIT
        - LICENSE-APACHE
        - NOTICE

about:
  homepage: https://solidcraft.io
  repository: https://github.com/tangency-labs/solidcraft
  documentation: https://docs.solidcraft.io/
  summary: SolidCraft - an open-source parametric 3D CAD application and its Python client
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE

extra:
  feedstock-name: solidcraft
  recipe-maintainers:
    - oursland
