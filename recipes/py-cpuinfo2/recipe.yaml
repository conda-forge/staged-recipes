schema_version: 1

context:
  version: "10.1.1"

package:
  name: py-cpuinfo2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/py-cpuinfo2/py_cpuinfo2-${{ version }}.tar.gz
  sha256: 7861133863663f16e06eca63b12904ef100b5760415e92372dac0162799a4771

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - cpuinfo = cpuinfo.__main__:main
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
  run_constraints:
    # Both distributions install the cpuinfo module and command.
    - py-cpuinfo <0a0

tests:
  - python:
      imports:
        - cpuinfo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pytest >=8.4.2
    files:
      source:
        - tests/
    script:
      - cpuinfo --version
      - python -m cpuinfo --version
      - python -m pytest -q tests

about:
  homepage: https://github.com/akx/py-cpuinfo2
  repository: https://github.com/akx/py-cpuinfo2
  summary: Get CPU info with pure Python
  description: |
    A maintained, drop-in fork of py-cpuinfo that retrieves CPU information
    using pure Python without requiring compilation or additional libraries.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - timkpaine
