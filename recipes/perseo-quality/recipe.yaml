context:
  version: 1.1.0

package:
  name: perseo-quality
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/p/perseo-quality/perseo_quality-${{ version }}.tar.gz
    sha256: 85dcb44e75a10ea55ebfd239bc98c460a17505a6fa3da22b1e117e338eefce07

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - netcdf4 >=1.7.2
    - numba >=0.61
    - numpy >2
    - pandas >=1.4.0
    - perseo-core >=1.0.0
    - pydantic
    - scipy >1.13
    - xarray
    - matplotlib-base >=3.5 # extra == "graphs"

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - perseo_quality

about:
  homepage: https://github.com/aresys-srl/perseo
  summary: "Python Ecosystem for Remote Sensing & Earth Observation: SAR Products Quality analyses."
  description: |
    # perseo-quality

    **P**ython **E**cosystem for **R**emote **S**ensing & **E**arth **O**bservation (PERSEO) QUALITY package for SAR products
    quality analysis and calibration assessment.

    ## Features

    - Point Target Analysis
    - Radiometric Analysis
    - Interferometric Analysis
    - Spectral Analysis
    - Elevation Notch Analysis
    - Target Ambiguity Ratio (PTAR / DTAR)

  license: MIT
  license_file:
    - LICENSE.txt
  documentation: https://opensource.aresys.it/perseo

extra:
  recipe-maintainers:
    - matteoaletti
