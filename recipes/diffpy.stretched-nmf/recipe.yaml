schema_version: 1

context:
  version: "0.3.0"
  python_min: "3.12"

package:
  name: diffpy.stretched-nmf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/diffpy.stretched-nmf/diffpy_stretched_nmf-${{ version }}.tar.gz
  sha256: d5158dbe622add2e37bb627c3863a141004641063c831ef4dd449da40152c301

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - snmf = diffpy.stretched_nmf.snmf_app:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=62.0
    - setuptools-git-versioning >=2.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - matplotlib-base
    - scipy
    - cvxpy
    - diffpy.utils
    - numdifftools

tests:
  - python:
      imports:
        - diffpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - snmf --help

about:
  summary: A python package implementing the stretched NMF algorithm.
  license: BSD-3-Clause
  license_file: LICENSE.rst
  homepage: https://github.com/diffpy/diffpy.stretched-nmf/

extra:
  recipe-maintainers:
    - sbillinge
    - john-halloran
