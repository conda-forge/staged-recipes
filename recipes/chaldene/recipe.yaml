schema_version: 1

context:
  version: "0.2.0"

package:
  name: chaldene
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chaldene/chaldene-${{ version }}.tar.gz
  sha256: 1a0c9da10196eb5a0db877a077a8d386a39d1e6080d6aa6654b22ede5f286aaf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
    - hatch-jupyter-builder
    - pip
  run:
    - python >=${{ python_min }}
    - jupyterlab >=4.0.0,<5.0.0
    - jupyter_server >=2.0.0,<3.0.0
    - requests >=2.28.0
    - numpy ==2.2.4
    - pillow ==11.1.0
    - pandas ==2.2.3
    - scikit-image ==0.25.2
    - scipy ==1.15.2
    - comm ==0.2.2
    - ipywidgets >=7.0.0
    - opencv ==4.11.0.86
    - matplotlib-base ==3.10.1
    - chaldene-super-resolution
    - im2im
    - pyimagej ==1.7.0

tests:
  - python:
      imports:
        - chaldene
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Visual Programming in JupyterLab for Image Processing
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/c3di/chaldene.git

extra:
  recipe-maintainers:
    - jan-janssen
