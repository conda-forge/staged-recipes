# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dataeval-flow
  version: "0.2.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dataeval_flow-${{ version }}.tar.gz
  # Alternative if building directly from GitHub release archive:
  # url: https://github.com/aria-ml/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 19eeb0c9d728b6851b9eb4af84623c4ebe6f43aeff6d8286611ec6ef42b7cb25

build:
  number: 0
  noarch: python
  script:
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
  python:
    entry_points:
      - dataeval-flow = dataeval_flow.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }},<3.15
    - click >=8.0
    - dataeval >=1.1.1
    - datamaite >=0.4.1
    - numpy >=1.24.2
    - pydantic >=2.0
    - pyyaml >=6.0

tests:
  - python:
      imports:
        - dataeval_flow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - dataeval-flow --help

about:
  summary: Composable workflow engine for DataEval analytics
  description: |
    DataEval Flow is a composable workflow engine and CLI for running
    DataEval analytics, audits, and dataset health checks.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/aria-ml/dataeval-flow
  repository: https://github.com/aria-ml/dataeval-flow
  documentation: https://dataeval-flow.readthedocs.io/

extra:
  recipe-maintainers:
    - aria-ml
    - aweng
