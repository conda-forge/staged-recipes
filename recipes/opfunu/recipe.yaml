context:
  version: "1.0.4"

package:
  name: opfunu
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opfunu/opfunu-${{ version }}.tar.gz
  sha256: 1ae4e83f435c155d6a6ad28f6118d78df8c73d6827a59323167637d6a1d3bf07

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.16.5
    - matplotlib-base >=3.3.0
    - pillow >=9.1.0
    - requests >=2.27.0
    # opfunu imports pkg_resources at runtime (cec_based/cec.py) for data-file
    # lookups; setuptools removed pkg_resources in 82.0 (upstream's own
    # deprecation warning recommends pinning <81)
    - setuptools <81

tests:
  - python:
      imports:
        - opfunu
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/thieu1995/opfunu
  summary: 'Opfunu: An Open-source Python Library for Optimization Benchmark Functions'
  license: GPL-3.0-only
  license_file: LICENSE
  documentation: https://opfunu.readthedocs.io/
  repository: https://github.com/thieu1995/opfunu

extra:
  recipe-maintainers:
    - ChaiThere
