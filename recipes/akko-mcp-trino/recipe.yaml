context:
  version: "0.5.2"
  python_min: "3.12"

package:
  name: akko-mcp-trino
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/akko-mcp-trino/akko_mcp_trino-${{ version }}.tar.gz
  sha256: 28dfd8312e09f151029aa4c3f47dfe4b431fb3403dab5b90824a3ca14be41844

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - akko-mcp-trino = akko_mcp_trino.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - mcp >=2.2.0,<3
    - trino-python-client >=0.339.0,<1
    - httpx >=0.28.1,<1
    - starlette >=1.6.0,<2
    - uvicorn >=0.52.4,<1
    - sqlglot >=30.18.0,<31
    - prometheus_client >=0.21.1,<1
    - pyjwt >=2.15.0,<3
    - cryptography >=50.0.1

tests:
  - python:
      imports:
        - akko_mcp_trino
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - akko-mcp-trino --version

about:
  homepage: https://akko-ai.com/docs/akko-mcp-trino/
  repository: https://github.com/AKKO-p/akko-mcp-trino
  documentation: https://akko-ai.com/docs/coeur-open-source/
  summary: "Read-only MCP server for Trino: queries run as the user, and Trino's own policies decide."
  description: |
    akko-mcp-trino gives AI agents read-only MCP access to Trino: six tools, writes
    refused on the SQL tree, bounded rows and time, one audit line per call. Queries
    run as one configured identity, or as the user by their own verified token, so
    Trino's access control (OPA, Ranger, file rules) decides for each user.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - ab2dridi
