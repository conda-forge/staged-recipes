context:
  version: "0.1.0"

package:
  name: spaday-shoelace
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-shoelace/spaday_shoelace-${{ version }}.tar.gz
  sha256: ba05b792b1068e3c0a9ae78f70fb4b1b13b8e0d1e84e3fd8a354316e558ce045

build:
  number: 0
  noarch: python
  script:
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - spaday-webawesome

tests:
  - python:
      imports:
        - spaday_shoelace
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Compatibility alias for spaday-webawesome
  homepage: https://github.com/1kbgz/spaday-shoelace
  repository: https://github.com/1kbgz/spaday-shoelace

extra:
  recipe-maintainers:
    - timkpaine
