schema_version: 1

context:
  version: "0.8.2"

package:
  name: lintlang
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lintlang/lintlang-${{ version }}.tar.gz
  sha256: 09b6eb9f9f256db5b892455db45f80888a5a1e701b7307254723989f9c46727f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - lintlang = lintlang.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pyyaml >=6.0.3

tests:
  - python:
      imports:
        - lintlang
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - lintlang --version
      - lintlang --help
      - python -m lintlang --version

about:
  homepage: https://lintlang.ai/
  summary: Static linter for AI agent configs, tool descriptions, and system prompts with zero-LLM CI gating
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://lintlang.ai/
  repository: https://github.com/hermes-labs-ai/lintlang

extra:
  recipe-maintainers:
    - roli-lpci
