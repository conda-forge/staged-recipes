schema_version: 1

context:
  version: "0.6.0"
  python_min: "3.10"

package:
  name: lintlang
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lintlang/lintlang-${{ version }}.tar.gz
  sha256: 8640955c42eff4fa8245b89052e466b172a4a4ab0a49f763ab98082da1371ed0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pyyaml >=6.0.3

tests:
  - python:
      imports:
        - lintlang
      pip_check: true
  - script:
      - lintlang --version

about:
  homepage: https://lintlang.ai/
  summary: Static linter for AI agent configs, tool descriptions, and system prompts with zero-LLM CI gating
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://lintlang.ai/
  repository: https://github.com/hermes-labs-ai/lintlang

extra:
  recipe-maintainers:
    - roli-lpci
