schema_version: 1

context:
  version: "0.8.1"
  python_min: "3.10"

package:
  name: lintlang
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lintlang/lintlang-${{ version }}.tar.gz
  sha256: 69d1905e4562bbc05dc08b5fed451a9cec29f8dd5178574ff5218161525e0d2e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pyyaml >=6.0.3

tests:
  - python:
      imports:
        - lintlang
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -m lintlang --version
      - python -c "import sys,os,subprocess as sp;d=os.path.join(sys.prefix,'Scripts');print(sorted(x for x in os.listdir(d) if 'lint' in x.lower()));f=os.path.join(d,'lintlang-script.py');print(open(f).read() if os.path.exists(f) else 'NO-SCRIPT-PY');[print(c,(lambda r:(r.returncode,r.stdout,r.stderr))(sp.run(c,capture_output=True,text=True))) for c in ([sys.executable,f,'--version'],[os.path.join(d,'lintlang.exe'),'--version'],[sys.executable,'-m','lintlang','--version'])]"
      - python -c "import importlib.metadata as m;print([ (e.name,e.value,e.group) for e in m.entry_points() if e.name=='lintlang'])"
      - lintlang --version

about:
  homepage: https://lintlang.ai/
  summary: Static linter for AI agent configs, tool descriptions, and system prompts with zero-LLM CI gating
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://lintlang.ai/
  repository: https://github.com/hermes-labs-ai/lintlang

extra:
  recipe-maintainers:
    - roli-lpci
