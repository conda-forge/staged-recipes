schema_version: 1

context:
  version: "0.8.1"
  python_min: "3.10"

package:
  name: lintlang
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lintlang/lintlang-${{ version }}.tar.gz
  sha256: 69d1905e4562bbc05dc08b5fed451a9cec29f8dd5178574ff5218161525e0d2e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pyyaml >=6.0.3

tests:
  - python:
      imports:
        - lintlang
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -m lintlang --version
      - python -c "import sys,os;e=os.path.join(sys.prefix,'Scripts','lintlang.exe');d=open(e,'rb').read();print(len(d));print(d[-700:])"
      - python -c "import sys,os,subprocess as sp;e=os.path.join(sys.prefix,'Scripts','lintlang.exe');print([(a,sp.run([e]+a,capture_output=True,text=True).returncode) for a in ([],['--help'],['scan','--help'])])"
      - python -c "import sys,os;print(sorted(os.listdir(sys.prefix)));print(sys.version);import sysconfig;print(sysconfig.get_path('scripts'))"
      - lintlang --version

about:
  homepage: https://lintlang.ai/
  summary: Static linter for AI agent configs, tool descriptions, and system prompts with zero-LLM CI gating
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://lintlang.ai/
  repository: https://github.com/hermes-labs-ai/lintlang

extra:
  recipe-maintainers:
    - roli-lpci
