context:
  version: "2.2.1"

package:
  name: cuid2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cuid2/cuid2-${{ version }}.tar.gz
  sha256: f7d183b5988de4be691e4077beaa0e7932a5ee80fe1c4b6288d88381b62b4663

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - cuid2 = cuid2.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build ==0.13.5
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cuid2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - cuid2 --help
      - cuid2 --version
      - python -m cuid2 --version
      - python -c "from cuid2 import Cuid, create_id, is_cuid; ids = [Cuid().generate(), create_id(), create_id(length=10)]; assert all(is_cuid(value) for value in ids); assert [len(value) for value in ids] == [24, 24, 10]"

about:
  homepage: https://github.com/gordon-code/cuid2
  summary: Collision-resistant identifiers optimized for horizontal scaling and performance
  license: MIT
  license_file: LICENSE
  repository: https://github.com/gordon-code/cuid2

extra:
  recipe-maintainers:
    - timkpaine
