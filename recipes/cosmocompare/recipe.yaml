context:
  version: "0.0.12"
  python_min: "3.11"

package:
  name: cosmocompare
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cosmocompare/cosmocompare-${{ version }}.tar.gz
  sha256: 6d76624dfb35b2f143bbe122e4abdd62c0246515698b0c4329e09aac269ab196

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - pandas
    - pyyaml
    - anesthetic

tests:
  - python:
      imports:
        - cosmocompare
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/DilyOng/cosmocompare
  summary: Bayesian model comparison by importance sampling of existing nested-sampling chains
  description: |
    cosmocompare performs Bayesian model comparison without rerunning nested
    sampling. It reweights pre-computed nested-sampling chains onto narrowed or
    changed priors and onto extended models, and recomputes the Bayesian evidence
    with an uncertainty, so that a model-comparison verdict and its sensitivity to
    the prior can be obtained in seconds. The Cobaya likelihood stack and parallel
    execution are optional extras, so the core package installs and imports
    without them.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/DilyOng/cosmocompare

extra:
  recipe-maintainers:
    - DilyOng
