{% set name = "fave-recode" %}
{% set version = "0.3.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/fave_recode-{{ version }}.tar.gz
  sha256: 5b20415bba06fe663c5d615396cdc3434e693ad2ba6a17d97a4efbba1209b950

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - fave_recode = fave_recode.fave_recode:fave_recode

requirements:
  host:
    - python
    - pip
    - poetry-core
  run:
    - python
    - aligned-textgrid <0.9,>=0.8
    - pyyaml <7.0,>=6.0
    - cerberus <2.0.0,>=1.3.5
    - click <9.0.0,>=8.1.7
    - cloup <4.0.0,>=3.0.2

test:
  imports:
    - fave_recode
  commands:
    - pip check
    - fave_recode --help
  requires:
    - pip
    - python

about:
  home: https://forced-alignment-and-vowel-extraction.github.io/fave-recode
  summary: A package for recoding Praat TextGrids
  license: GPL-3.0-only
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - IvoLeist
