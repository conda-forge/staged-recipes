{% set name = "figuratively" %}
{% set version = "1.0.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/figuratively-{{ version }}.tar.gz
  sha256: e1b5caa42e92dd029dfe8ab9cb14b43ab1507bcc2bde73b1a5ec679dd3df9bf0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - figuratively = figuratively.cli:console
    - figly = figuratively.cli:console

requirements:
  host:
    - python {{ python_min }}
    - hatchling >=1.27
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.24
    - matplotlib-base >=3.7
    - mplhep >=0.3.40
    - uproot >=5,<6
    - tomli  # [py<311]

test:
  imports:
    - figuratively
  commands:
    - pip check
    - figuratively --help
    - figly --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/abhishekLHCb-CERN/figuratively
  summary: Figures, figuratively speaking, one call from a ROOT file to a publication plot (no ROOT install needed).
  description: |
    Figuratively makes publication-quality plots straight from ROOT files with uproot and matplotlib, without a
    ROOT installation: RooFit canvases with components and pulls, data/MC overlays with a ratio panel, 2D
    histograms and graphs, from one call (fg.plot("fit.root:canvas")) or the figly command.
  license: MIT
  license_file:
    - LICENSE
    - NOTICE
  doc_url: https://abhisheklhcb-cern.github.io/figuratively/
  dev_url: https://github.com/abhishekLHCb-CERN/figuratively

extra:
  recipe-maintainers:
    - abhishekLHCb-CERN
