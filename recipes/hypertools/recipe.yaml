schema_version: 1

context:
  version: "1.0.0"

package:
  name: hypertools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hypertools/hypertools-${{ version }}.tar.gz
  sha256: 2cd7752bbcd3d9e5d282592443e3a216c05d38fabe5415232beaa534d252b99a

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - scikit-learn >=1.4.2
    - pandas >=2.2.2
    - seaborn >=0.13.0
    - matplotlib-base >=3.9.0
    - scipy >=1.13.0
    - numpy >=2.0.0
    - umap-learn >=0.5.5
    - numba >=0.61.0
    - requests >=2.31.0
    - dill >=0.3.8
    - ipympl >=0.9.3
    - pykalman >=0.11
    - statsmodels >=0.14
    - pydata-wrangler >=0.5.1

tests:
  - python:
      imports:
        - hypertools
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/ContextLab/hypertools
  license: MIT AND Apache-2.0 AND OFL-1.1
  license_file:
    - LICENSE
    - hypertools/external/LICENSE-APACHE-2.0.txt
    - hypertools/external/THIRD_PARTY_NOTICES.md
    - hypertools/external/fonts/OFL.txt
  summary: A python package for visualizing and manipulating high-dimensional data
  description: |
    HyperTools is a Python library for visualizing and manipulating
    high-dimensional data. It provides a unified interface for dimensionality
    reduction, data alignment, clustering, and visualization, built on
    matplotlib, plotly, scikit-learn, and pydata-wrangler. Optional extras
    (the interactive plotly backend, text embeddings, extra forecasters, Lab
    Streaming Layer input, and more) are installed from PyPI, as a few of
    their dependencies are not yet available on conda-forge; the base package
    is fully functional without them.
  repository: https://github.com/ContextLab/hypertools
  documentation: https://hypertools.readthedocs.io/

extra:
  recipe-maintainers:
    - jeremymanning
