{% set name = "hypertools" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2cd7752bbcd3d9e5d282592443e3a216c05d38fabe5415232beaa534d252b99a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - setuptools >=77
    - pip
  run:
    - python >=3.10
    - scikit-learn >=1.4.2
    - pandas >=2.2.2
    - seaborn >=0.13.0
    - matplotlib-base >=3.9.0
    - scipy >=1.13.0
    - numpy >=2.0.0
    - umap-learn >=0.5.5
    - numba >=0.61.0
    - requests >=2.31.0
    - dill >=0.3.8
    - ipympl >=0.9.3
    - pykalman >=0.11
    - statsmodels >=0.14
    - pydata-wrangler >=0.5.1

test:
  imports:
    - hypertools
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/ContextLab/hypertools
  summary: A python package for visualizing and manipulating high-dimensional data
  description: |
    HyperTools is a Python library for visualizing and manipulating
    high-dimensional data. It provides a unified interface for dimensionality
    reduction, data alignment, clustering, and visualization, built on
    matplotlib, plotly, scikit-learn, and pydata-wrangler. Optional extras
    (interactive plotly backend, text embeddings, extra forecasters, Lab
    Streaming Layer input, etc.) are installed from PyPI, as some of their
    dependencies are not yet available on conda-forge.
  license: MIT AND Apache-2.0 AND OFL-1.1
  license_file:
    - LICENSE
    - hypertools/external/LICENSE-APACHE-2.0.txt
    - hypertools/external/THIRD_PARTY_NOTICES.md
    - hypertools/external/fonts/OFL.txt
  doc_url: https://hypertools.readthedocs.io
  dev_url: https://github.com/ContextLab/hypertools

extra:
  recipe-maintainers:
    - jeremymanning
