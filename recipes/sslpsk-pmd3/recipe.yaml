context:
  version: "1.2.2"

package:
  name: sslpsk-pmd3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sslpsk_pmd3/sslpsk_pmd3-${{ version }}.tar.gz
  sha256: be4a771ba4b31cd7425e7b22e01ed045bdf3e92c51dc879cbf0cd54ab1d71bcf

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
  host:
    - python
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
  run:
    - python

tests:
  - python:
      imports:
        - sslpsk_pmd3
      pip_check: true

about:
  homepage: https://github.com/doronz88/sslpsk-pmd3
  summary: TLS-PSK support for the Python ssl module
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - pavelzw
