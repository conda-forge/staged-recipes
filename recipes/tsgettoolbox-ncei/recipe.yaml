context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-ncei
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-ncei/tsgettoolbox_ncei-${{ version }}.tar.gz
  sha256: 71c1e176a82e56ea320acb5b7e03f0c4e6bf9caa35a6aca96c42a2aa7cd86fa8

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools>=80
  - pip
  run:
  - python >=3.10
  - numpy
  - pandas
  - platformdirs
  - requests
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_ncei
    pip_check: true

about:
  summary: Plugin for tsgettoolbox to access NOAA National Centers for Environmental Information (NCEI) data.
