context:
  version: 27.0.0

package:
  name: tsgettoolbox-ncei
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-ncei/tsgettoolbox_ncei-${{ version }}.tar.gz
  sha256: 71c1e176a82e56ea320acb5b7e03f0c4e6bf9caa35a6aca96c42a2aa7cd86fa8

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - numpy
  - pandas
  - platformdirs
  - requests
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_ncei
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: Plugin for tsgettoolbox to access NOAA National Centers for Environmental Information (NCEI) data.
  description: |
    The 'tsgettoolbox_ncei' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    National Centers for Environmental Information (NCEI) web services.
  homepage: https://pypi.org/project/tsgettoolbox-ncei/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
