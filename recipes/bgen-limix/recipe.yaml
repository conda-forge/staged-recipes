schema_version: 1

context:
  name: bgen-limix
  version: "4.8.2"
  # Distinct package names because this is a diverged fork of limix/bgen
  # (adds S3 streaming support, nanobind split-mode bindings, etc.) and would
  # otherwise collide with the existing conda-forge "bgen" package.
  clib_name: libbgen-limix
  py_name: bgen-limix

recipe:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/jpfeuffer/bgen-limix/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 2b1e55e8c03c51da4c71603f78ceb69430dff3cd342ec6a544835918983175fd

build:
  number: 0

outputs:
  # ---------------------------------------------------------------------
  # C library (src/, include/bgen) — installs headers, shared libs and the
  # bgen-config.cmake package so downstream `find_package(bgen)` works.
  # ---------------------------------------------------------------------
  - package:
      name: ${{ clib_name }}
      version: ${{ version }}
    build:
      script:
        - cmake -GNinja -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ PREFIX }}
          -DCMAKE_PREFIX_PATH=${{ PREFIX }}
          -DBUILD_SHARED_LIBS=ON
          -DBGEN_BUILD_TESTS=OFF
          -DBGEN_USE_SYSTEM_ZLIB_NG=ON
          -DBGEN_USE_SYSTEM_ZSTD=ON
          -DBGEN_USE_SYSTEM_ATHR=ON
          -DBGEN_USE_SYSTEM_CURL=ON
          -DBGEN_ENABLE_S3=ON
        - cmake --build build --parallel
        - cmake --install build
      dynamic_linking:
        overlinking_behavior: error
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
      host:
        - zlib-ng
        - zstd
        - almosthere
        - libcurl
        - openssl
      # Not all of these declare their own run_exports (e.g. almosthere
      # doesn't), so linking against libbgen.so wouldn't otherwise pull them
      # in at runtime -> declared explicitly to satisfy the overlinking check.
      run:
        - zlib-ng
        - zstd
        - almosthere
        - libcurl
        - openssl
      run_exports:
        - ${{ pin_subpackage(clib_name, upper_bound='x.x') }}
    tests:
      - script:
          - if: unix
            then:
              - test -f $PREFIX/lib/cmake/bgen/bgen-config.cmake
              - test -f $PREFIX/include/bgen/bgen.h
      - package_contents:
          include:
            - bgen/bgen.h
          lib:
            - bgen
            - bgen_s3

  # ---------------------------------------------------------------------
  # Python bindings (python/, imports as `cbgen`). Built via scikit-build-core
  # against the ${{ clib_name }} output above (find_package(bgen) picks it up).
  # BGEN_NANOBIND_BACKEND=private compiles nanobind's (and, transitively,
  # vendored robin-map's) source into our own binary instead of depending on
  # the external nanobind-backend package, which is not on conda-forge and
  # buys nothing there anyway (conda-forge already builds one package per
  # Python version regardless of stable-ABI sharing).
  # ---------------------------------------------------------------------
  - package:
      name: ${{ py_name }}
      version: ${{ version }}
    build:
      script:
        # nanobind's own dist-info always ships the exact LICENSE matching
        # whatever version got solved for the `nanobind` host dependency
        # below, so copying it here (rather than fetching a separately
        # pinned copy) can never drift out of sync as nanobind is upgraded.
        - mkdir -p third_party_licenses
        - cp "$(python -c "import nanobind, pathlib; print(pathlib.Path(nanobind.__file__).parent.parent / f'nanobind-{nanobind.__version__}.dist-info' / 'licenses' / 'LICENSE')")" third_party_licenses/NANOBIND-LICENSE
        # Force Ninja explicitly: scikit-build-core's generator autodetection
        # falls back to "Unix Makefiles" if it can't find ninja on PATH, and
        # that image has no `make` either, so CMake fails outright.
        # BGEN_NANOBIND_BACKEND is exported (not just passed as a cmake
        # define) so scripts/dynamic_metadata.py also sees it and omits the
        # nanobind-backend dependency from the wheel metadata accordingly.
        - export BGEN_NANOBIND_BACKEND=private
        - python -m pip install . -vv --no-build-isolation --no-deps --config-settings=cmake.define.BGEN_NANOBIND_BACKEND=private --config-settings=cmake.args=-GNinja
      python:
        entry_points: []
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
      host:
        - python
        - pip
        - scikit-build-core
        - nanobind >=2.4
        - numpy
        - ${{ pin_subpackage(clib_name, exact=True) }}
      run:
        - python
        - numpy >=2.0
        - pooch >=1.6
    tests:
      - python:
          imports:
            - cbgen
          pip_check: true
      - requirements:
          run:
            - pytest >=7
        script:
          - pytest --pyargs cbgen -v
        files:
          source:
            - python/tests/**
    about:
      license: MIT AND BSD-3-Clause
      license_file:
        - LICENSE.md
        - third_party_licenses/NANOBIND-LICENSE
        - third_party_licenses/ROBIN-MAP-LICENSE

about:
  homepage: https://github.com/jpfeuffer/bgen-limix
  repository: https://github.com/jpfeuffer/bgen-limix
  documentation: https://bgen.readthedocs.io
  summary: C library and Python bindings for the BGEN format (specifications 1.2 and 1.3)
  description: |
    bgen-limix is a fork of limix/bgen adding S3/HTTPS streaming support and
    nanobind-based Python bindings for reading BGEN genotype files.
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - jpfeuffer
