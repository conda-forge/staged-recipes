context:
  version: "0.1.1"

package:
  name: pygnuutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pygnuutils/pygnuutils-${{ version }}.tar.gz
  sha256: 51ab4f27deb59102b7a04192f7585ff2b3a9de03739982f0b19d3cd4d16bea76

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pygnuutils=pygnuutils.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - click

tests:
  - python:
      imports:
        - pygnuutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - pygnuutils --help

about:
  homepage: https://github.com/matan1008/pygnuutils
  summary: Pure Python implementation of GNU utilities
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
