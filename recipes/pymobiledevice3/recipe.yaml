context:
  version: "11.49.5"

package:
  name: pymobiledevice3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymobiledevice3/pymobiledevice3-${{ version }}.tar.gz
  sha256: 627834b88af88f562b413d97a014f29b3fd3cc246eb8b0249d795810eed35e22

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pymobiledevice3=pymobiledevice3.__main__:main

requirements:
  host:
    - python
    - pip
    - setuptools >=70.1
    - setuptools-scm >=8
  run:
    - python
    - asn1
    - ipython
    - bpylist2 >=4.0.1
    - pygments
    - daemonize
    - pykdebugparser >=1.10.0
    - rich >=13.0.0
    - ansilogs >=1.1.0
    - requests
    - packaging
    - typing_extensions >=4.1.0
    - pygnuutils >=0.0.7
    - cryptography >=43.0.0
    - pycrashreport >=2.0.0
    - fastapi >=0.93.0
    - uvicorn >=0.15.0
    - wsproto
    - pillow
    - questionary >=2.0.0
    - ipsw-parser >=1.9.0
    - ifaddr
    - hyperframe
    - qh3 >=1.0.0,<2
    - developer-disk-image >=0.3.0
    - opack2 >=0.2.0
    - psutil
    - pytun-pmd3 >=3.0.3
    - prompt_toolkit
    - if: match(python, "<3.13")
      then: sslpsk-pmd3 >=1.2.2
    - python-pcapng >=2.1.1
    - pyimg4 >=0.8.8
    - pyiosbackup >=0.2.4
    - typer >=0.25
    - typer-injector >=0.3.0
    - defusedxml
    - if: win
      then: pywin32
    - bytestruct >=0.1.0
    - if: osx
      then: ioregistry >=0.0.6
      else: av >=14.0.0
    - pmd-pytcp >=0.3.9
    - pmd-net-addr
    - asgiwebdav >=2.0.1
    - if: match(python, "<3.14")
      then: backports.zstd

tests:
  - python:
      imports:
        - pymobiledevice3
        - pymobiledevice3.lockdown
        - pymobiledevice3.remote.tunnel_service
      pip_check: true
  - script:
      - pymobiledevice3 --help
      - pymobiledevice3 version

about:
  homepage: https://github.com/doronz88/pymobiledevice3
  summary: Pure Python 3 implementation for working with iDevices (iPhone, etc.)
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
