context:
  name: c-capnproto
  version: "0.4.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/HaoZeke/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 33b8d08f47914308db229a6004e9019fdec32a9e7cd147c908c62421e9b268c1

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - meson
    - ninja
    - pkg-config
  run_exports:
    - ${{ pin_subpackage('c-capnproto', upper_bound='x.x') }}

tests:
  - package_contents:
      files:
        - if: unix
          then:
            - include/capnp_c.h
            - include/capn-rpc.h
            - include/c.capnp.h
            - lib/pkgconfig/c-capnproto.pc
            - share/c-capnproto/c.capnp
        - if: win
          then:
            - Library/include/capnp_c.h
            - Library/include/capn-rpc.h
            - Library/include/c.capnp.h
            - Library/lib/pkgconfig/c-capnproto.pc
            - Library/share/c-capnproto/c.capnp
  - script:
      - if: unix
        then: test -x $PREFIX/bin/capnpc-c
      - if: win
        then: if not exist %LIBRARY_BIN%\capnpc-c.exe exit 1

about:
  homepage: https://github.com/HaoZeke/c-capnproto
  summary: Pure C Cap'n Proto runtime and the capnpc-c schema plugin
  description: |
    A C99 implementation of the Cap'n Proto wire format: reader and
    builder, packed and canonical codecs, a two-party RPC vat, and
    capnpc-c, a plugin for the Cap'n Proto schema compiler that emits C
    structures and accessors.

    This is a maintained fork of opensourcerouting/c-capnproto, itself
    descended from jmckaskill/c-capnproto.
  license: MIT
  license_file:
    - COPYING
  repository: https://github.com/HaoZeke/c-capnproto
  documentation: https://c-capnproto.rgoswami.me

extra:
  recipe-maintainers:
    - HaoZeke
