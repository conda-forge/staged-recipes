context:
  version: "1.0.0"

package:
  name: edview
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/edview/edview-${{ version }}.tar.gz
  sha256: 093434e051742b9efe35c33acdf362a757e92bb2815b4b965551aace9d516fcb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - edview = edview.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - algodif >=1.1.0
    - numpy
    - scipy
    - h5py
    - pillow
    - joblib
    - pyside6
    - pyqtgraph
    - pyopengl

tests:
  - python:
      imports:
        - edview
        - edview.lib.utilities
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/algodif/edview
  license: Apache-2.0
  license_file: LICENSE
  summary: GUI software for viewing EDXD/EDDT data processed by Algodif

extra:
  recipe-maintainers:
    - nghia-vo
