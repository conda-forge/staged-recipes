schema_version: 1

context:
  version: "0.1.2"

package:
  name: vsp-otel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vsp-otel/vsp_otel-0.1.2.tar.gz
  sha256: 88f3df63a9621c559204a22bb9723ffcc09c2324de5684301af91da457ac7d70

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.25.0
    - opentelemetry-sdk >=1.25.0
    - opentelemetry-exporter-otlp-proto-grpc >=1.25.0

tests:
  - python:
      imports:
        - vsp_otel
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/szl-holdings/vsp-otel
  repository: https://github.com/szl-holdings/vsp-otel
  documentation: https://github.com/szl-holdings/vsp-otel#readme
  license: Apache-2.0
  license_file: LICENSE
  summary: Verifiable Span Provenance for OpenTelemetry, an OTLP/gRPC exporter plus a DSSE span processor
  description: |
    Verifiable Span Provenance for OpenTelemetry: an OTLP/gRPC exporter together with a span processor that
    attaches DSSE-signed, hash-chained provenance to spans, so traces carry verifiable evidence of origin.

extra:
  recipe-maintainers:
    - stephenlutar2-hash
