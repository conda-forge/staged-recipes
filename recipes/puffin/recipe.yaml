schema_version: 1

context:
  version: "1.9.1"
  build: 0
  mpi_prefix: mpi_${{ mpi }}

package:
  name: puffin
  version: ${{ version }}

source:
  url: https://github.com/UKFELs/Puffin/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0af3126db98f7064ccf5d928a4db2beb3f170dbb88893b076d527282e20fb6b2
  patches:
    - no-openmp-c-flags-for-fortran.patch
    - fix-version-to-match-release-tag.patch

build:
  number: ${{ build }}
  string: ${{ mpi_prefix }}_h${{ hash }}_${{ build }}
  skip:
    - win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - cmake
    - make
    - if: mpi == "openmpi" and build_platform != target_platform
      then: openmpi
  host:
    - ${{ mpi }}
    - hdf5 ${{ hdf5 }}.* ${{ mpi_prefix }}_*
    - fftw * ${{ mpi_prefix }}_*
    # find_package(OpenMP REQUIRED) covers C/C++ too, where osx uses clang
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
  run:
    - ${{ mpi }}

tests:
  - package_contents:
      bin:
        - puffin
      files:
        - share/puffin/examples/**/*
  - script:
      env:
        OMP_NUM_THREADS: "1"
        # mpich: avoid ssh-based process launch on CI
        # ref: https://github.com/conda-forge/pyamrex-feedstock/blob/main/recipe/recipe.yaml
        HYDRA_LAUNCHER: fork
        # OpenMPI - docker as root
        OMPI_ALLOW_RUN_AS_ROOT: "1"
        OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
        OMPI_MCA_btl: self,tcp
        PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
      content:
        # Shortened 1D CSE example used in upstream tests
        - cd test
        - mpiexec -n 2 puffin inputs/f1main.in
        - test -f inputs/f1main_aperp_0.h5
        - test -f inputs/f1main_aperp_2.h5
        - test -f inputs/f1main_electrons_2.h5
        - test -f inputs/f1main_integrated_2.h5
    files:
      source:
        - test/inputs/

about:
  homepage: https://github.com/UKFELs/Puffin
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Puffin (Parallel Unaveraged Fel INtegrator) simulates a Free Electron Laser (FEL).
  description: |
    Puffin is a massively parallel numerical solver for an unaveraged, 3D FEL
    system of equations, written in Fortran 90 using MPI and OpenMP. Puffin is
    an 'unaveraged' FEL code - meaning it is absent of the slowly varying
    envelope approximation (SVEA) and wiggler period averaging approximations.
    It does not utilize a 'slicing' model of the beam phase space and radiation
    field, and instead utilizes an algorithm which is much more similar to a
    Particle-In-Cell (PIC) code methodology.
  documentation: https://ukfels.github.io/puffinDocs/
  repository: https://github.com/UKFELs/Puffin

extra:
  recipe-maintainers:
    - ken-lauer
