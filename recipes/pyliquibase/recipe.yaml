schema_version: 1

context:
  version: "3.1.0"

package:
  name: pyliquibase
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyliquibase/pyliquibase-${{ version }}.tar.gz
  sha256: c5085109c8c7ac72cd6492b0d3c3dd5f63f131bbb72e48fc37e636d4165aae70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyliquibase = pyliquibase:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - jpype1 >=1.6,<1.8
    - tqdm >=4.67.1,<4.68.dev0
    # Not a declared PyPI dependency, but required at runtime: pyliquibase
    # embeds a JVM (via JPype) to call the Liquibase Java tool.
    - openjdk

tests:
  - python:
      imports:
        - pyliquibase
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pyliquibase --help

about:
  homepage: https://github.com/memiiso/pyliquibase
  summary: A Python wrapper for Liquibase, the database schema change management tool
  description: |
    pyliquibase is a Python module that wraps Liquibase, letting you run
    Liquibase database-migration commands (update, rollback, status,
    validate, etc.) from Python code or the command line. It embeds a Java
    Virtual Machine via JPype (JNI) to call Liquibase directly, so a Java
    runtime must be available on the system.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://memiiso.github.io/pyliquibase/
  repository: https://github.com/memiiso/pyliquibase

extra:
  recipe-maintainers:
    - pb01ka
