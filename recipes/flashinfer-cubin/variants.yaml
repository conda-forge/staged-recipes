# The minimum compute capability that the cubins in this package target. It
# must be called cuda_arch_version for the cuda-arch package and conda-forge CI.
# All of the cubins in 0.7.4 (trtllm-gen FMHA/BMM/GEMM and DeepGEMM) are sm100f,
# sm100a, sm103a or sm107a, which is checked by reading the ELF headers.
cuda_arch_version:
  - "10.0"
