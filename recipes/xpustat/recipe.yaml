schema_version: 1

context:
  version: 0.2.0

package:
  name: xpustat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xpustat/xpustat-${{ version }}.tar.gz
  sha256: 60863e1c0b158ce81221a17e738a38e3285b531e3258bd7841f43f6784e3e07a

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - xpustat = xpustat.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - psutil >=5.9

tests:
  - python:
      imports:
        - xpustat
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - xpustat --version

about:
  homepage: https://github.com/Bekhouche/xpustat
  license: MIT
  license_file: LICENSE
  summary: A unified stat tool for NVIDIA, AMD, Intel, Huawei, Hygon, Cambricon and Moore Threads accelerators
  repository: https://github.com/Bekhouche/xpustat
  documentation: https://github.com/Bekhouche/xpustat

extra:
  recipe-maintainers:
    - Bekhouche
