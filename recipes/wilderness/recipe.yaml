context:
  version: "0.1.10"

package:
  name: wilderness
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wilderness/wilderness-${{ version }}.tar.gz
  sha256: f6ca6de388586f3edf77fdccca2a8033f006eceabc0eb338a7034abebe551b44

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - wilderness
      pip_check: true

about:
  homepage: https://github.com/GjjvdBurg/wilderness
  summary: Easy multi-level command line applications with man pages
  description: |
    Wilderness is a Python package for building multi-level command line
    applications (with subcommands, similar to git or docker) on top of
    argparse, with automatic generation of man pages and other
    documentation.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/GjjvdBurg/wilderness

extra:
  recipe-maintainers:
    - gwaybio
