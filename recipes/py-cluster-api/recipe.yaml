schema_version: 1

context:
  python_min: "3.10"
  version: "0.8.1"

package:
  name: py-cluster-api
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/py-cluster-api/py_cluster_api-${{ version }}.tar.gz
  sha256: f137c02c3dad1c6ee55577a527c63873c46e2f753755deae658bf7821deb0341

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pyyaml

tests:
  - python:
      imports:
        - cluster_api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Generic Python library for running jobs on HPC clusters
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/JaneliaSciComp/py-cluster-api

extra:
  recipe-maintainers:
    - imagejan
