schema_version: 1

context:
  version: "3.0.1"

package:
  name: r-sess
  version: ${{ version }}

source:
  # sess is developed inside the vscode-R repository and released with its
  # tags; it is not on CRAN.
  url: https://github.com/REditorSupport/vscode-R/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f9812a227ca75f28415e8705873f36636b74d7c5a7561f64f05cdc661bfcfb9a

build:
  number: 0
  noarch: generic
  script:
    - ${{ R }} --vanilla --no-echo -f ${{ RECIPE_DIR }}/stamp_sess.R
    - ${{ R }} CMD INSTALL --build sess

requirements:
  build:
    - git
  host:
    - r-base
    - r-jsonlite
    - r-later
    - r-processx >=3.5.0
    - r-rstudioapi
  run:
    - r-base
    - r-jsonlite
    - r-later
    - r-processx >=3.5.0
    - r-rstudioapi

tests:
  - r:
      libraries:
        - sess
  - requirements:
      run:
        - r-tinytest
    script:
      # R on Windows rejects the C.UTF-8 locale set in CI and falls back to a
      # non-UTF-8 one, which breaks the tests' Unicode round-trips.
      - if: win
        then: set "LC_ALL=English_United States.utf8"
      - Rscript -e "res <- tinytest::test_package('sess'); if (!all(as.logical(res))) stop('tinytest failures')"

about:
  homepage: https://github.com/REditorSupport/vscode-R/tree/main/sess
  repository: https://github.com/REditorSupport/vscode-R
  license: MIT
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/MIT
    - sess/LICENSE
  summary: High-Performance IPC Bridge for R Sessions
  description: |
    Implements a high-performance IPC bridge for R sessions using Unix domain
    sockets and Windows named pipes. Replaces legacy file-system watcher based
    workflows while keeping JSON-RPC communication semantics for IDE/editor
    integration.

extra:
  recipe-maintainers:
    - conda-forge/r
    - roaldarbol
