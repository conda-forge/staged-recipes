schema_version: 1

context:
  version: "0.1.0"
  python_min: "3.12"

package:
  name: dau-scheduler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dau-scheduler/dau_scheduler-${{ version }}.tar.gz
  sha256: 0e7a82235e04d28fe7c27e60806ab15a3148288e865d4c8f569b43641d62f947
  patches:
    # Windows expands ~ from USERPROFILE; set it alongside HOME in the test.
    - fix-windows-home-directory-test.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=2

tests:
  - python:
      imports:
        - dau_scheduler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    files:
      source:
        - dau_scheduler/tests
        - README.md
    script: python -m pytest dau_scheduler/tests -v

about:
  homepage: https://github.com/dau-dev/dau-scheduler
  repository: https://github.com/dau-dev/dau-scheduler
  summary: Split row-parallel dataframe work across two compute engines and merge the partial results
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - timkpaine
