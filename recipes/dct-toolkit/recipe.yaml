schema_version: 1

context:
  name: dct-toolkit
  version: "0.6.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dct-toolkit/dct_toolkit-${{ version }}.tar.gz
  sha256: 7b5975397b859f8af492f9b4c9fba470336225c0cf7fb3d2528d6ae4ed0ffcdd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.25.0,<1.32.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.20
    - scipy >=1.8

tests:
  - python:
      imports:
        - dct_toolkit
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: DCT/FFT-based convolutional statistics for Cartesian and polar data
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/JValdivia23/dct-toolkit

extra:
  recipe-maintainers:
    - JValdivia23
