schema_version: 1

context:
  python_min: "3.12"
  version: "1.5.0.20260728"

package:
  name: types-rasterio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-rasterio/types_rasterio-${{ version }}.tar.gz
  sha256: 634fad70698a3a7c566539e0cfee66eb2ef32f7f2e08bad06fb548b987e85322

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=82.0.1
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2
    - click >=8

tests:
  - package_contents:
      site_packages:
        - rasterio-stubs/__init__.pyi
  - python:
      imports: []
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Typing stubs for rasterio
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - p-vdp
