context:
  version: "0.6.2"

package:
  name: scicommander
  version: ${{ version }}

source:
  url: https://github.com/samuell/scicommander/archive/refs/tags/${{ version }}.tar.gz
  sha256: cd91b1d11c57ebd6885424cabc2881f4f1abeb373849847b89ec8736734bef03

build:
  number: 0
  skip: win
  script:
    - go-licenses save ./cmd/sci --save_path library_licenses
    - if: unix
      then: go build -v -trimpath -o $PREFIX/bin/sci -ldflags="-s -w" ./cmd/sci

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses
  run:
    - graphviz

tests:
  - script: sci help
  - package_contents:
      bin:
        - sci
      strict: true

about:
  homepage: https://github.com/samuell/scicommander
  summary: Run shell commands in a scientifically reproducible and robust way.
  description: |
    SciCommander allows running shell commands in a scientifically more
    reproducible and efficient way without invoking a full pipeline tool. The
    main features includes skipping already available outputs, and generating
    an HTML audit report or reproducing shell script for any output produced by
    commands ran through SciCommander. SciCommander can also be combined with
    pipeline tools to provide additional provenance on the file level.
    
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/
  documentation: https://pkg.go.dev/github.com/samuell/scicommander
  repository: https://github.com/samuell/scicommander

extra:
  recipe-maintainers:
    - samuell
