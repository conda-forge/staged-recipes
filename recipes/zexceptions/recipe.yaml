schema_version: 1

context:
  version: "6.0"

package:
  name: zexceptions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zExceptions/zexceptions-${{ version }}.tar.gz
  sha256: 2785efab97362e57fa9e394a15c31a2e481b08fa953417d34f09eb1edc201242

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1,<81
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.publisher
    - zope.security

tests:
  - python:
      imports:
        - zExceptions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zExceptions
  repository: https://github.com/zopefoundation/zExceptions
  summary: Common exceptions used in Zope
  license: ZPL-2.1
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - killua156
