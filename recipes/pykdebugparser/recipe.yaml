context:
  version: "1.10.0"

package:
  name: pykdebugparser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pykdebugparser/pykdebugparser-${{ version }}.tar.gz
  sha256: d21c95d25e36e53b0a0542233bedfec68adf9e8f170bdf3da992e3837664263e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pykdebugparser=pykdebugparser.__main__:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
  run:
    - python >=${{ python_min }}
    - bytestruct >=0.1.0
    - click
    - termcolor

tests:
  - python:
      imports:
        - pykdebugparser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - pykdebugparser --help

about:
  homepage: https://github.com/matan1008/pykdebugparser
  summary: Parser for Apple kdebug events
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
