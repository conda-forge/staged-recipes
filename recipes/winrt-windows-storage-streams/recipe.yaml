context:
  version: "4!10.0.28000.2957"

package:
  name: winrt-windows-storage-streams
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/winrt-windows-storage-streams/winrt_windows_storage_streams-${{ version }}.tar.gz
  sha256: 6284341b4b01ab872007def0b8d29bf30d84d46f6922f6e42be1d738d6bf2ff7

build:
  number: 0
  # Pure-Python projection, but it only works on Windows (it needs winrt-runtime).
  skip:
    - not win
    - match(python, "<3.11")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling
    - winrt-table-compiler >=4,<5
  run:
    - python
    - winrt-runtime >=4.1.0,<5
    - winrt-windows-foundation-collections >=${{ version }}
    - winrt-windows-foundation >=${{ version }}

tests:
  - python:
      imports:
        - winrt.windows.storage.streams
      pip_check: true

about:
  summary: PyWinRT projection of the Windows.Storage.Streams namespace
  homepage: https://github.com/pywinrt/pywinrt
  repository: https://github.com/pywinrt/pywinrt
  documentation: https://pywinrt.readthedocs.io
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
