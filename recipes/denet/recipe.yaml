context:
  version: "0.10.3"

package:
  name: denet
  version: ${{ version }}

source:
  url: https://github.com/btraven00/denet/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8d0a1b27ee45c36e4e0aacc46a7b675db4f74ef11f6624be02847b3acc30ecb5

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - if: linux
      then: cargo install --locked --no-track --path . --bin denet --root ${{ PREFIX }} --features gpu
      else: cargo install --locked --no-track --path . --bin denet --root ${{ PREFIX }}

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - denet --version
  - if: unix
    then:
      script:
        - denet -o out.jsonl -q run sh -c "sleep 0.3"
        - grep -q '"kind":"metadata"' out.jsonl

about:
  homepage: https://github.com/btraven00/denet
  repository: https://github.com/btraven00/denet
  documentation: https://docs.rs/denet
  summary: A streaming process monitor
  description: |
    denet is a lightweight streaming process monitor. It tracks CPU, memory,
    I/O, and threads for a running process (and its children), with adaptive
    sampling and optional GPU support.
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - btraven00
