schema_version: 1

context:
  version: "0.1.2"

package:
  name: tabalyst
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tabalyst/tabalyst-${{ version }}.tar.gz
  sha256: 983d5c924073fccd939e7cf345a3ad151fc3c34b82714b636f5d3533dd31990d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - tabalyst = tabalyst.cli:main

requirements:
  host:
    - python >=3.11
    - setuptools >=77
    - pip
  run:
    - python >=3.11
    - jinja2 >=3.1
    - pandas >=2.2
    - pydantic >=2.10
    - typer >=0.12

tests:
  - python:
      imports:
        - tabalyst
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - tabalyst --help

about:
  summary: Open-source data profiling engine for structured JSON and customizable HTML reports.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/loribel-labs/tabalyst

extra:
  recipe-maintainers:
    - HeavyTony2
