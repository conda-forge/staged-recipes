schema_version: 1

context:
  python_min: "3.12"
  version: "1.0.0"

package:
  name: orloge
  version: ${{ version }}

source:
  # sdist is currently missing license and tests
  # see https://github.com/pchtsp/orloge/pull/13
  # and https://github.com/pchtsp/orloge/pull/14
  url: https://github.com/pchtsp/orloge/archive/v${{ version }}.tar.gz
  sha256: 1808373d9dbe3f455f0fcb529e2ae10d44b4590fcc189ec259f2bf66143d2b6e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - cpsat-logutils >=1.0.0

tests:
  - python:
      imports:
        - orloge
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    script:
      - python -m unittest discover -v tests/

about:
  summary: OR log extractor
  license: MIT
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/orloge/

extra:
  recipe-maintainers:
    - mgorny
