schema_version: 1

# Compiled nanobind extension. Windows is skipped: the engine is
# Meson/C++20 with Unix wrap layout, not a MSVC port.
context:
  name: pydseamslib
  version: "2.5.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
    sha256: c2beef57f0696566303a709b7db2c582d939cfc1c085fa60edd1370f793e0054
    patches:
      # Avoid std::format (macOS SDK availability vs libc++ to_chars).
      - 0001-bindings-no-std-format.patch
  # Engine pin matches subprojects/seams-core.wrap (v2.5.0).
  - url: https://github.com/d-SEAMS/seams-core/archive/refs/tags/v2.5.0.tar.gz
    sha256: 48349347eab3dd179692a823b388e8b0d7fd2ec7bb0da5f44cb69e1a7007fc02
    target_directory: _src_seams
  - url: https://github.com/Luthaf/vesin/archive/refs/tags/v0.5.7.tar.gz
    sha256: d1dbf85461b33799d7b65f899cfd651e860921eac2400316a307f2ac1d66935e
    target_directory: _src_vesin
  - url: https://github.com/d-SEAMS/linkcell/archive/refs/tags/v0.3.1.tar.gz
    sha256: a55e922febd0358dc2522f5825b5acbfcfe61deb6689584e94ad71b07bcc244c
    target_directory: _src_linkcell

build:
  number: 0
  skip:
    - win
    - match(python, "<3.12")
  script:
    file: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - meson >=1.3.0
    - ninja
    - pkg-config
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - numpy
        - python
  host:
    - python
    - pip
    - meson-python >=0.17
    - nanobind >=2.0
    - numpy
    - eigen
    - libblas
    - liblapack
    - libhwy
  run:
    - python
    - numpy >=1.24

tests:
  - python:
      imports:
        - pydseams
        - pydseamslib
      pip_check: true
  - script:
      - python -c "import pydseams as ds; assert ds.__version__ == '2.5.1'"
  - package_contents:
      site_packages:
        - pydseams/__init__.py
        - pydseamslib/__init__.py

about:
  homepage: https://dseams.info
  summary: Python bindings for the d-SEAMS C++ engine
  description: |
    pydseamslib is the Python front end for d-SEAMS. The import is
    pydseams; pydseamslib remains a compatibility alias. The compiled
    extension is pydseams.yoda. The C++ engine is seams-core.
  license: MIT AND BSD-3-Clause
  license_file:
    - LICENSE
    - LICENSE-seams-core
    - LICENSE-vesin
    - LICENSE-linkcell
  documentation: https://d-seams.github.io/PydSEAMSlib/
  repository: https://github.com/d-SEAMS/PydSEAMSlib

extra:
  recipe-maintainers:
    - HaoZeke
