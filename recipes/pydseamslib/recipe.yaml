schema_version: 1

# Compiled nanobind extension. Windows is skipped: the engine is
# Meson/C++20 with Unix wrap layout, not a MSVC port.
context:
  name: pydseamslib
  version: "2.6.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
    sha256: d200f1ec33f2595145b55b7b9f59a4d868092ef1d9bb4182f2fa98b9e6945058
    patches:
      # Avoid std::format (macOS SDK availability vs libc++ to_chars).
      - 0001-bindings-no-std-format.patch
  # Engine pin matches subprojects/seams-core.wrap (v2.6.0).
  - url: https://github.com/d-SEAMS/seams-core/archive/refs/tags/v2.6.0.tar.gz
    sha256: 887d8c870f77e9472012789a6fdb1323258a3ae4e04246aebedede89ab1612c8
    target_directory: _src_seams
  - url: https://github.com/Luthaf/vesin/archive/refs/tags/v0.5.7.tar.gz
    sha256: d1dbf85461b33799d7b65f899cfd651e860921eac2400316a307f2ac1d66935e
    target_directory: _src_vesin
  - url: https://github.com/d-SEAMS/linkcell/archive/refs/tags/v0.3.1.tar.gz
    sha256: a55e922febd0358dc2522f5825b5acbfcfe61deb6689584e94ad71b07bcc244c
    target_directory: _src_linkcell
  # Built with the wrap overlay so nanobind sees Py_LIMITED_API=0x030C0000.
  # The conda-forge nanobind package is a full-API build; linking that
  # into an abi3 extension segfaults at import.
  - url: https://github.com/wjakob/nanobind/archive/refs/tags/v2.14.0.tar.gz
    sha256: 937b08801b9b61c98192d9ec5ddb712256961fbe8ccc1122d6ee3d574600287c
    target_directory: _src_nanobind
  - url: https://github.com/Tessil/robin-map/archive/refs/tags/v1.4.0.tar.gz
    sha256: 7930dbf9634acfc02686d87f615c0f4f33135948130b8922331c16d90a03250c
    target_directory: _src_robin_map

build:
  number: 0
  skip:
    - win
    - match(python, "<3.12")
  script:
    file: build.sh
  # The extension is a Python module, not a prefix/bin executable.
  # Rattler tagged yoda.abi3.so as prefix:bin and relinked it, after
  # which import segfaults.
  dynamic_linking:
    binary_relocation: false
    rpaths:
      - lib/

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - meson >=1.3.0
    - ninja
    - pkg-config
    - if: linux
      then: patchelf
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - numpy
        - python
  host:
    - python
    - pip
    - meson-python >=0.17
    - numpy
    - eigen
    - libblas
    - liblapack
    - libhwy
  run:
    - python
    - numpy >=1.24

tests:
  - python:
      imports:
        - pydseams
        - pydseamslib
      pip_check: true
  - package_contents:
      site_packages:
        - pydseams/__init__.py
        - pydseams/yoda.abi3.so
        - pydseamslib/__init__.py
  - script:
      - python -c "import faulthandler; faulthandler.enable(); import pydseams; print(pydseams.__version__)"

about:
  homepage: https://dseams.info
  summary: Python bindings for the d-SEAMS C++ engine
  description: |
    pydseamslib is the Python front end for d-SEAMS. The import is
    pydseams; pydseamslib remains a compatibility alias. The compiled
    extension is pydseams.yoda. The C++ engine is seams-core.
  license: MIT AND BSD-3-Clause
  license_file:
    - LICENSE
    - LICENSE-seams-core
    - LICENSE-vesin
    - LICENSE-linkcell
  documentation: https://d-seams.github.io/PydSEAMSlib/
  repository: https://github.com/d-SEAMS/PydSEAMSlib

extra:
  recipe-maintainers:
    - HaoZeke
