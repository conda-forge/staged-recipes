context:
  name: capnp-janet
  version: "0.2.5"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/HaoZeke/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f8274cb7802a6caeaa6aeb1d64acae0e78c824af7ce5a37888c3b718a7712267

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - meson
    - ninja
    - pkg-config
  run_exports:
    - ${{ pin_subpackage('capnp-janet', upper_bound='x.x') }}

tests:
  - package_contents:
      files:
        - if: unix
          then:
            - include/capnp-janet/capnp_message.h
            - lib/pkgconfig/capnp-janet.pc
        - if: win
          then:
            - Library/include/capnp-janet/capnp_message.h
            - Library/lib/pkgconfig/capnp-janet.pc

about:
  homepage: https://github.com/HaoZeke/capnp-janet
  summary: Cap'n Proto runtime in C with a Janet native module
  description: |
    A C99 implementation of the Cap'n Proto wire format with a Janet
    binding: reader and builder, packed and canonical codecs, an RPC vat,
    and capnpc-janet, a plugin for the Cap'n Proto schema compiler.
  license: MIT
  license_file:
    - LICENSE
  repository: https://github.com/HaoZeke/capnp-janet

extra:
  recipe-maintainers:
    - HaoZeke
