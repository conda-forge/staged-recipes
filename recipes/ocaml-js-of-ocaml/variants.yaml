# Gives windows two toolchain lanes (vs2022/gcc), matching the ocaml_win-64 5.5.1 builds.
# ocaml 5.5.2 renames vs2022 to vs; switch once the ocaml deps are rebuilt for 5.5.2.
# Selector syntax because staged-recipes parses this file with conda-build.
c_compiler:
  - vs2022  # [win]
  - gcc     # [win]
c_compiler_version:
  - "19"    # [win]
