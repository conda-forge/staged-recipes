# Gives windows two toolchain lanes (vs/gcc), matching the ocaml_win-64 builds.
# Selector syntax because staged-recipes parses this file with conda-build.
c_compiler:
  - vs   # [win]
  - gcc  # [win]
# staged-recipes skips migrations and the vs track only exists for 5.5.2;
# drop once the global pinning moves to 5.5.2 (ocaml552 migration closes).
ocaml_compiler_version:
  - 5.5.2
