schema_version: 1

context:
  version: "6.4.1"
  build_number: 0

  library: ${{ "Library/" if not unix else "" }}
  # ocaml_win-64 ships gcc_* and vs2022_* at the same version/build; name the track.
  c_toolchain: ${{ "" if unix else c_compiler ~ "_*" }}

recipe:
  name: ocaml-js-of-ocaml-split
  version: ${{ version }}

source:
  url: https://github.com/ocsigen/js_of_ocaml/releases/download/${{ version }}/js_of_ocaml-${{ version }}.tbz
  sha256: e59bbffcaefaba3191620556514b7f53bb3249e3f881a070d72724234dffd819

build:
  number: ${{ build_number }}

outputs:
  - package:
      name: ocaml-js-of-ocaml-compiler
      version: ${{ version }}
    build:
      string: ${{ c_compiler ~ "_" if not unix }}h${{ hash }}_${{ build_number }}
      script: bash ${{ RECIPE_DIR }}/build.sh js_of_ocaml-compiler
    requirements:
      build:
        - ${{ compiler("ocaml") }}
        - if: not unix and c_compiler == "gcc"
          then:
            - ${{ stdlib("m2w64_c") }}
            - ${{ compiler("m2w64_c") }}
          else:
            - ${{ stdlib("c") }}
            # jsoo_runtime has C stubs
            - ${{ compiler("c") }}
        # compiler("ocaml") renders no toolchain track; name it on windows
        - if: not unix
          then:
            - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
            - m2-bash
            - m2-coreutils
        - ocaml-dune >=3.20
        - ocaml-menhir
      host:
        - ocaml ${{ ocaml_compiler_version }}.*
        # the noarch ocaml metapackage does not pin the windows toolchain track
        - if: not unix
          then:
            - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
        - ocaml-ppxlib >=0.33
        - ocaml-compiler-libs >=0.12.4
        - ocaml-cmdliner >=2.0
        - ocaml-sedlex >=3.3
        - ocaml-menhir
        - ocaml-yojson >=2.1
      run:
        # the installed META requires menhirLib, ocaml-compiler-libs, sedlex and yojson
        - ocaml-compiler-libs >=0.12.4
        - ocaml-sedlex >=3.3
        - ocaml-menhir
        - ocaml-yojson >=2.1
      # the ocaml run_export does not encode the windows toolchain track
      run_constraints:
        - if: not unix
          then:
            - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
    tests:
      - package_contents:
          files:
            - ${{ library }}lib/ocaml/js_of_ocaml-compiler/META
            - ${{ library }}lib/ocaml/js_of_ocaml-compiler/js_of_ocaml_compiler.cmxa
            - ${{ library }}lib/ocaml/js_of_ocaml-compiler/runtime/jsoo_runtime.cmxa
          bin:
            - js_of_ocaml
      - script:
          - js_of_ocaml --version
    about:
      summary: Compiler from OCaml bytecode to JavaScript
      license: LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
      license_file: LICENSE

  - package:
      name: ocaml-js-of-ocaml
      version: ${{ version }}
    build:
      string: ${{ c_compiler ~ "_" if not unix }}h${{ hash }}_${{ build_number }}
      script: bash ${{ RECIPE_DIR }}/build.sh js_of_ocaml
    requirements:
      build:
        - ${{ compiler("ocaml") }}
        - if: not unix and c_compiler == "gcc"
          then:
            - ${{ stdlib("m2w64_c") }}
            - ${{ compiler("m2w64_c") }}
          else:
            - ${{ stdlib("c") }}
            # js_of_ocaml has C stubs
            - ${{ compiler("c") }}
        # compiler("ocaml") renders no toolchain track; name it on windows
        - if: not unix
          then:
            - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
            - m2-bash
            - m2-coreutils
        - ocaml-dune >=3.20
      host:
        - ocaml ${{ ocaml_compiler_version }}.*
        # the noarch ocaml metapackage does not pin the windows toolchain track
        - if: not unix
          then:
            - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
        - ocaml-ppxlib >=0.33
        - ${{ pin_subpackage("ocaml-js-of-ocaml-compiler", exact=True) }}
      run:
        # the installed META requires only js_of_ocaml-compiler; ppxlib is build-only
        - ${{ pin_subpackage("ocaml-js-of-ocaml-compiler", exact=True) }}
      # the ocaml run_export does not encode the windows toolchain track
      run_constraints:
        - if: not unix
          then:
            - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
    tests:
      - package_contents:
          files:
            - ${{ library }}lib/ocaml/js_of_ocaml/META
            - ${{ library }}lib/ocaml/js_of_ocaml/js_of_ocaml.cmxa
      - script: bash testing/test_js.sh
        files:
          recipe:
            - testing/test_js.sh
        requirements:
          run:
            - ocaml ${{ ocaml_compiler_version }}.*
            - ocaml-dune >=3.20
            - nodejs
            - if: not unix and c_compiler == "gcc"
              then:
                - ${{ compiler("m2w64_c") }}
              else:
                - ${{ compiler("c") }}
            - if: not unix
              then:
                - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
                - m2-bash
                - m2-coreutils
    about:
      summary: Bindings and runtime library for programs compiled with js_of_ocaml
      license: LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
      license_file: LICENSE

  - package:
      name: ocaml-wasm-of-ocaml-compiler
      version: ${{ version }}
    build:
      string: ${{ c_compiler ~ "_" if not unix }}h${{ hash }}_${{ build_number }}
      script: bash ${{ RECIPE_DIR }}/build.sh wasm_of_ocaml-compiler
    requirements:
      build:
        - ${{ compiler("ocaml") }}
        - if: not unix and c_compiler == "gcc"
          then:
            - ${{ stdlib("m2w64_c") }}
            - ${{ compiler("m2w64_c") }}
          else:
            - ${{ stdlib("c") }}
            # wasm_of_ocaml-compiler.dynlink has C stubs
            - ${{ compiler("c") }}
        # compiler("ocaml") renders no toolchain track; name it on windows
        - if: not unix
          then:
            - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
            - m2-bash
            - m2-coreutils
        - ocaml-dune >=3.20
        - ocaml-menhir
        # the wasm runtime is linked with wasm-merge/wasm-opt during the build
        - binaryen >=119
      host:
        - ocaml ${{ ocaml_compiler_version }}.*
        # the noarch ocaml metapackage does not pin the windows toolchain track
        - if: not unix
          then:
            - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
        - ocaml-ppxlib >=0.33
        - ocaml-cmdliner >=2.0
        - ocaml-sedlex >=3.3
        - ocaml-menhir
        - ocaml-yojson >=2.1
        - ${{ pin_subpackage("ocaml-js-of-ocaml", exact=True) }}
      run:
        # wasm_of_ocaml shells out to wasm-opt and wasm-merge
        - binaryen >=119
        # the installed META requires js_of_ocaml-compiler and sedlex
        - ocaml-sedlex >=3.3
        - ${{ pin_subpackage("ocaml-js-of-ocaml", exact=True) }}
      # the ocaml run_export does not encode the windows toolchain track
      run_constraints:
        - if: not unix
          then:
            - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
    tests:
      - package_contents:
          files:
            - ${{ library }}lib/ocaml/wasm_of_ocaml-compiler/META
          bin:
            - wasm_of_ocaml
      - script:
          - wasm_of_ocaml --version
      - script: bash testing/test_wasm.sh
        files:
          recipe:
            - testing/test_wasm.sh
        requirements:
          run:
            - ocaml ${{ ocaml_compiler_version }}.*
            - ocaml-dune >=3.20
            - nodejs >=22
            - if: not unix and c_compiler == "gcc"
              then:
                - ${{ compiler("m2w64_c") }}
              else:
                - ${{ compiler("c") }}
            - if: not unix
              then:
                - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
                - m2-bash
                - m2-coreutils
    about:
      summary: Compiler from OCaml bytecode to WebAssembly
      license: LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
      license_file: LICENSE

about:
  homepage: https://ocsigen.org/js_of_ocaml/
  repository: https://github.com/ocsigen/js_of_ocaml
  documentation: https://ocsigen.org/js_of_ocaml/latest/manual/overview
  summary: Compiler from OCaml bytecode to JavaScript and WebAssembly
  license: LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ManuelLerchner
