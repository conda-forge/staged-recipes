schema_version: 1

context:
  version: "6.4.1"

recipe:
  name: ocaml-js-of-ocaml-split
  version: ${{ version }}

source:
  url: https://github.com/ocsigen/js_of_ocaml/releases/download/${{ version }}/js_of_ocaml-${{ version }}.tbz
  sha256: e59bbffcaefaba3191620556514b7f53bb3249e3f881a070d72724234dffd819

build:
  number: 0
  # sedlex is not yet published for win-64
  skip:
    - win

outputs:
  - package:
      name: ocaml-js-of-ocaml-compiler
      version: ${{ version }}
    build:
      script:
        - dune build --profile=release -p js_of_ocaml-compiler @install
        - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" --docdir="${PREFIX}/share/doc" --mandir="${PREFIX}/share/man" js_of_ocaml-compiler
    requirements:
      build:
        - ${{ stdlib("c") }}
        - ${{ compiler("ocaml") }}
        - ocaml-dune >=3.20
        - ocaml-menhir
      host:
        - ocaml ${{ ocaml_compiler_version }}.*
        - ocaml-ppxlib >=0.33
        - ocaml-compiler-libs >=0.12.4
        - ocaml-cmdliner >=2.0
        - ocaml-sedlex >=3.3
        - ocaml-menhir
        - ocaml-yojson >=2.1
      run:
        # the installed META requires menhirLib, ocaml-compiler-libs, sedlex and yojson
        - ocaml-compiler-libs >=0.12.4
        - ocaml-sedlex >=3.3
        - ocaml-menhir
        - ocaml-yojson >=2.1
    tests:
      - package_contents:
          files:
            - lib/ocaml/js_of_ocaml-compiler/META
            - lib/ocaml/js_of_ocaml-compiler/js_of_ocaml_compiler.cmxa
            - lib/ocaml/js_of_ocaml-compiler/runtime/jsoo_runtime.cmxa
          bin:
            - js_of_ocaml
      - script:
          - js_of_ocaml --version
    about:
      summary: Compiler from OCaml bytecode to JavaScript
      license: LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
      license_file: LICENSE

  - package:
      name: ocaml-js-of-ocaml
      version: ${{ version }}
    build:
      script:
        - dune build --profile=release -p js_of_ocaml @install
        - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" --docdir="${PREFIX}/share/doc" --mandir="${PREFIX}/share/man" js_of_ocaml
    requirements:
      build:
        - ${{ stdlib("c") }}
        - ${{ compiler("ocaml") }}
        - ocaml-dune >=3.20
      host:
        - ocaml ${{ ocaml_compiler_version }}.*
        - ocaml-ppxlib >=0.33
        - ${{ pin_subpackage("ocaml-js-of-ocaml-compiler", exact=True) }}
      run:
        # the installed META requires only js_of_ocaml-compiler; ppxlib is build-only
        - ${{ pin_subpackage("ocaml-js-of-ocaml-compiler", exact=True) }}
    tests:
      - package_contents:
          files:
            - lib/ocaml/js_of_ocaml/META
            - lib/ocaml/js_of_ocaml/js_of_ocaml.cmxa
      - script: bash testing/test_js.sh
        files:
          recipe:
            - testing/test_js.sh
        requirements:
          run:
            - ocaml ${{ ocaml_compiler_version }}.*
            - ocaml-dune >=3.20
            - nodejs
            - ${{ compiler("c") }}
    about:
      summary: Bindings and runtime library for programs compiled with js_of_ocaml
      license: LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
      license_file: LICENSE

  - package:
      name: ocaml-wasm-of-ocaml-compiler
      version: ${{ version }}
    build:
      script:
        - dune build --profile=release -p wasm_of_ocaml-compiler @install
        - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" --docdir="${PREFIX}/share/doc" --mandir="${PREFIX}/share/man" wasm_of_ocaml-compiler
    requirements:
      build:
        - ${{ stdlib("c") }}
        - ${{ compiler("ocaml") }}
        - ocaml-dune >=3.20
        - ocaml-menhir
        # the wasm runtime is linked with wasm-merge/wasm-opt during the build
        - binaryen >=119
      host:
        - ocaml ${{ ocaml_compiler_version }}.*
        - ocaml-ppxlib >=0.33
        - ocaml-cmdliner >=2.0
        - ocaml-sedlex >=3.3
        - ocaml-menhir
        - ocaml-yojson >=2.1
        - ${{ pin_subpackage("ocaml-js-of-ocaml", exact=True) }}
      run:
        # wasm_of_ocaml shells out to wasm-opt and wasm-merge
        - binaryen >=119
        # the installed META requires js_of_ocaml-compiler and sedlex
        - ocaml-sedlex >=3.3
        - ${{ pin_subpackage("ocaml-js-of-ocaml", exact=True) }}
    tests:
      - package_contents:
          files:
            - lib/ocaml/wasm_of_ocaml-compiler/META
          bin:
            - wasm_of_ocaml
      - script:
          - wasm_of_ocaml --version
      - script: bash testing/test_wasm.sh
        files:
          recipe:
            - testing/test_wasm.sh
        requirements:
          run:
            - ocaml ${{ ocaml_compiler_version }}.*
            - ocaml-dune >=3.20
            - nodejs >=22
            - ${{ compiler("c") }}
    about:
      summary: Compiler from OCaml bytecode to WebAssembly
      license: LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
      license_file: LICENSE

about:
  homepage: https://ocsigen.org/js_of_ocaml/
  repository: https://github.com/ocsigen/js_of_ocaml
  documentation: https://ocsigen.org/js_of_ocaml/latest/manual/overview
  summary: Compiler from OCaml bytecode to JavaScript and WebAssembly
  license: LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ManuelLerchner
