schema_version: 1

context:
  version: "0.5.0"

package:
  name: rule-audit
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/5d/9d/26b0e0bd9252e392989cb7acd1d88713ffcfdf4117395808a96eb8773108/rule_audit-${{ version }}.tar.gz
  sha256: d7e4b0b0094eb5d1759759f99adf936a794397dca4167c3243571166165870c0

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - rule-audit = rule_audit.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rule_audit
        - rule_audit.cli
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - rule-audit --help

about:
  homepage: https://hermes-labs.ai
  repository: https://github.com/hermes-labs-ai/rule-audit
  documentation: https://github.com/hermes-labs-ai/rule-audit#readme
  summary: Detect logical contradictions, gaps, and edge-case scenarios in AI system prompts
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roli-lpci
