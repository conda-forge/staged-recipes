{% set name = "strata-bench" %}
{% set version = "1.1.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/strata_bench-{{ version }}.tar.gz
  sha256: 8d8422b33a161143aa22a6cbda71987c25ecf0e76beaed0eeb485cb9cac35c6b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - pydantic >=2.6

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - strata_bench
  commands:
    - pip check

about:
  home: https://github.com/movahedi-ca/strata-bench
  license: Apache-2.0
  license_file: LICENSE
  summary: 36-task benchmark for AI agents on fragmented spatial-temporal market intelligence
  description: >
    STRATA-Bench scores whether AI agents disclose, tag, refuse, or model
    uncertainty when compiling longitudinal market intelligence from
    fragmented, geographically nested, and temporally incomplete evidence,
    across six failure families (geographic masking, temporal attrition,
    OCR laundering, silent interpolation, non-uniform axes, source blending).
  doc_url: https://movahedi-ca.github.io/strata-bench/
  dev_url: https://github.com/movahedi-ca/strata-bench

extra:
  recipe-maintainers:
    - movahedi-ca
