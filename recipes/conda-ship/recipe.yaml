schema_version: 1

context:
  version: "0.11.0"

package:
  name: conda-ship
  version: ${{ version }}

source:
  url: https://github.com/conda-incubator/conda-ship/archive/refs/tags/${{ version }}.tar.gz
  sha256: 384ccc9615fd1c6d2b05b7093cc9563a6e2fd4e68c21069e6c86e4cb2ea1de60
  patches:
    - 0001-find-installed-scripts.patch

build:
  number: 0
  dynamic_linking:
    # macOS templates reject LC_RPATH and link only system libraries.
    binary_relocation: ${{ not osx }}
  python:
    version_independent: true
  script:
    env:
      MATURIN_PEP517_ARGS: --locked --compatibility off
    content:
      - if: osx
        then: export CARGO_BUILD_RUSTFLAGS=""
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - maturin >=1,<2
    - if: build_platform != target_platform
      then:
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
  host:
    - python ${{ python_min }}.*
    - pip
    - maturin >=1,<2
  run:
    - python >=${{ python_min }}
    - conda >=25.1
    - pyproject_hooks >=1.2
    - if: match(python_min, "<3.11")
      then: tomli >=1.1

tests:
  - python:
      imports:
        - conda_ship
        - conda_ship.cli
        - conda_ship.plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script: python run_test.py
    files:
      recipe:
        - run_test.py
      source:
        - tests/fixtures/structural-runtime/

about:
  homepage: https://conda-incubator.github.io/conda-ship/
  summary: Build ready-to-run conda runtimes
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://conda-incubator.github.io/conda-ship/
  repository: https://github.com/conda-incubator/conda-ship

extra:
  recipe-maintainers:
    - jezdez
