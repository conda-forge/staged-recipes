context:
  version: "1.31.0"

package:
  name: cloudvision
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cloudvision/cloudvision-${{ version }}.tar.gz
  sha256: d17d05a8867d7e6f0f1506d35c43c10be746a3685005d9a881dd4626381fea3d

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=62.1.0
  run:
    - python >=${{ python_min }}
    - aristaproto ==0.1.5
    - cryptography ==50.0.0
    - grpcio >=1.81.1
    - msgpack-python >=1.0.3
    - protobuf >=6.33.6,<8.0dev
    - pyavd-utils ==0.0.1
    - requests >=2.20.1
    - typing-extensions >=4.2.0

tests:
  - python:
      imports:
        - cloudvision
        - arista
        - fmp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aristanetworks/cloudvision-python
  summary: A Python library for Arista's CloudVision APIs and Provisioning Action integrations
  license: Apache-2.0
  license_file: COPYING
  documentation: https://aristanetworks.github.io/cloudvision-python/
  repository: https://github.com/aristanetworks/cloudvision-python

extra:
  recipe-maintainers:
    - pb01ka
