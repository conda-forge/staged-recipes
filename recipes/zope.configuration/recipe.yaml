schema_version: 1

context:
  version: "7.1"

package:
  name: zope.configuration
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.configuration/zope_configuration-${{ version }}.tar.gz
  sha256: 5af51cefb4dcc66053e54cfece38483fb593a81be1010c38587dba91c9d154ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1,<81
  run:
    - python >=${{ python_min }}
    - zope.i18nmessageid
    - zope.interface
    - zope.schema >=4.9

tests:
  - python:
      imports:
        - zope.configuration
        - zope.configuration.xmlconfig
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.configuration
  repository: https://github.com/zopefoundation/zope.configuration
  documentation: https://zopeconfiguration.readthedocs.io/
  summary: Zope Configuration Markup Language (ZCML)
  license: ZPL-2.1
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - killua156
