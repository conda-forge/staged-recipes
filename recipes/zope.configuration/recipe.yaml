schema_version: 1

context:
  version: "7.1"

package:
  name: zope.configuration
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.configuration/zope_configuration-${{ version }}.tar.gz
  sha256: 5af51cefb4dcc66053e54cfece38483fb593a81be1010c38587dba91c9d154ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - zope.i18nmessageid
    - zope.interface
    - zope.schema >=4.9

tests:
  - python:
      imports:
        - zope.configuration
        - zope.configuration.config
        - zope.configuration.xmlconfig
        - zope.configuration.fields
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  # upstream CI is linux only; some tests treat "/path" as absolute
  - if: not win
    then:
      script:
        - python -m unittest discover -v zope.configuration
      requirements:
        run:
          - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.configuration
  repository: https://github.com/zopefoundation/zope.configuration
  documentation: https://zopeconfiguration.readthedocs.io
  summary: Zope Configuration Markup Language (ZCML)
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
