context:
  version: "0.3.6"
  python_min: "3.11"

package:
  name: jtoken
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jtoken/jtoken-${{ version }}.tar.gz
  sha256: 77a111cfd0cd6353a8545357889e1451aff4223fb5f03f800944cd1a16f6bf11

build:
  noarch: python
  script: python -m pip install . -vv
  # Declare the console script so rattler-build places/validates jtoken.exe correctly
  python:
    entry_points:
      - jtoken = jtoken.cli:main
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jtoken
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - jtoken --help
    requirements:
      run:
        - python
        - jtoken

about:
  homepage: https://github.com/HermannSamimi/jtoken
  summary: Compress JSON-shaped documents for LLM prompts with normalization, CLI, and token measurement
  description: |
    jtoken compresses JSON-shaped documents (plain JSON, MongoDB shell,
    MongoDB Extended JSON, Elasticsearch hits) for LLM prompts: fewer
    tokens, readable line-oriented output, and lossless round-trip.
    Includes a CLI and tiktoken-based token measurement helpers.
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/HermannSamimi/jtoken#readme
  repository: https://github.com/HermannSamimi/jtoken

extra:
  recipe-maintainers:
    - HermannSamimi
