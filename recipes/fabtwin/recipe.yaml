schema_version: 1

context:
  version: "0.13.0"

package:
  name: fabtwin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fabtwin/fabtwin-${{ version }}.tar.gz
  sha256: 8be8b58932ee60715d584c195357b8a3d674ee0efd889c68b682f08e0e2649b9

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.26
    - scipy >=1.11

tests:
  - python:
      imports:
        - fabtwin
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/fabtwin
  license: Apache-2.0
  license_file: LICENSE
  summary: "Multilayer optical filters designed to still work after they are made, using a learned model of the deposition errors"
  description: |
    Computes what a stack of thin layers transmits and reflects, learns how
    a deposition machine tends to err from logs of past runs, and changes
    the design so that the worst few percent of the fabricated filters are
    as good as possible. From one measured transmission spectrum of a
    finished stack it also estimates how far each layer was from its target
    thickness.
  repository: https://github.com/TaN-MM-Org/fabtwin
  documentation: https://github.com/TaN-MM-Org/fabtwin#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
