schema_version: 1

context:
  version: "0.7.0"

package:
  name: fabtwin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fabtwin/fabtwin-${{ version }}.tar.gz
  sha256: c15c4a1c003268f4cc25438411d4f50c5053bbac56c3c4a57c1621bb68b6556f

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.26
    - scipy >=1.11

tests:
  - python:
      imports:
        - fabtwin
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/fabtwin
  license: Apache-2.0
  license_file: LICENSE
  summary: "Learned fabrication-process twins and yield-aware inverse design of multilayer optics"
  description: |
    Learned generative process twins for deposition error behaviour, exact
    transfer-matrix optics with a hand-derived adjoint, pathwise CVaR
    robustification through twin and physics, and split-conformal
    prediction intervals that do not trust the twin. Exact gradients also
    cover oblique incidence, s/p/unpolarized light and absorbing layers,
    for merits that are nonlinear in R, T and A; CVaR can use the unbiased
    Rockafellar-Uryasev estimator; drift tests, joint thickness and index
    recovery from multi-angle spectra, group-wise and adaptive conformal
    intervals, and in-run correction of the remaining layers are included.
    The generative-model extras (JAX and Optax) are optional; the core is
    NumPy/SciPy only.
  repository: https://github.com/TaN-MM-Org/fabtwin
  documentation: https://github.com/TaN-MM-Org/fabtwin#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
