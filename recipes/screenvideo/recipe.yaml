context:
  version: "2.1.1"

package:
  name: screenvideo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/screenvideo/screenvideo-${{ version }}.tar.gz
  sha256: b27c757a34a31a60f63283ccca4002b71c07c2cc7dc0e075b6fd6420227b3b34

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24.0
    - mss >=9.0.0
    - keyboard >=0.13.5
    - ttkbootstrap >=1.10.0
    - pillow >=10.0.0
    - imageio-ffmpeg >=0.6.0
    - pysoundfile >=0.14.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - screenvideo
        - screenvideo.mcp_server
      pip_check: false
  - script:
      - python -c "import screenvideo; print(screenvideo.__version__)"

about:
  homepage: https://github.com/eminsk/screenvideo
  summary: Professional zero-memory screen recorder with modern UI, hotkey controls, and native MCP Server
  description: |
    ScreenCapture Pro (screenvideo) is a modern, high-performance desktop screen recording
    and screenshot suite with zero-memory direct-to-disk streaming, low-latency WASAPI
    loopback audio, customizable hotkeys, interactive region snipping, and native MCP Server.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/screenvideo
  documentation: https://github.com/eminsk/screenvideo#readme

extra:
  recipe-maintainers:
    - eminsk
