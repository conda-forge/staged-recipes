# cascadio's Linux worker sandbox uses seccomp/rseq definitions that are
# missing from the glibc 2.17 headers; upstream wheels target manylinux_2_28.
# macOS keeps the conda-forge default (an empty key there would leave the
# deployment target unpinned).
c_stdlib_version:
  - if: linux
    then: "2.28"
  - if: osx
    then: "11.0"
