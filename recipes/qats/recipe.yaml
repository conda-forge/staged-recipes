context:
  version: "5.4.1"

package:
  name: qats
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qats/qats-${{ version }}.tar.gz
  sha256: 894c47e45b28028a2d724676f01332b696a2ee91aa14c6387403541bc5096df8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - qats = qats.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - h5py >=3.11.0
    - matplotlib-base >=3.7.5
    - nptdms >=1.10.0
    - numpy >=1.24.4
    - openpyxl >=3.1.5
    - pandas >=2.0.3
    - pymatreader >=0.0.32
    - pyside6 >=6.10.1
    # pywin32 is only needed (and only installed) on Windows
    - pywin32-on-windows
    - qtpy >=2.4.2
    - scipy >=1.10.1

tests:
  - python:
      imports:
        - qats
        - qats.fatigue
        - qats.io
        - qats.stats
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      env:
        QT_API: pyside6
        QT_QPA_PLATFORM: offscreen
      content:
        - qats --help
        - qats app --help
        - qats config --help
        # the GUI main window can be created (without a display)
        - python -c "from qtpy.QtWidgets import QApplication; from qats.app.gui import Qats; app = QApplication([]); Qats()"

about:
  homepage: https://github.com/dnvgl/qats
  summary: Library for efficient processing and visualization of time series
  description: |
    QATS is a Python library and GUI for processing and visualising time series from marine and offshore
    simulations (SIMO, RIFLEX, SIMA and others): file input/output, signal processing, extreme value statistics,
    rainflow counting and fatigue.
  license: MIT
  license_file: LICENSE
  documentation: https://qats.readthedocs.io
  repository: https://github.com/dnvgl/qats

extra:
  recipe-maintainers:
    - tovop
    - eneelo
