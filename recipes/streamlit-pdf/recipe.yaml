schema_version: 1

context:
  python_min: "3.9"
  version: "2.0.1"

package:
  name: streamlit-pdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-pdf/streamlit_pdf-${{ version }}.tar.gz
  sha256: c6306381d0eeb291d7a4f6eb16cfbf937560a29be78049c64251fa2c3276e1a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - wheel
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - streamlit_pdf
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A Streamlit component for viewing PDF files
  license: Apache-2.0 AND MIT AND BSD-3-Clause
  license_file:
    - LICENSE
    - NOTICES
    - streamlit_pdf/frontend/build/assets/cmaps/LICENSE
    - streamlit_pdf/frontend/build/assets/standard_fonts/LICENSE_FOXIT
    - streamlit_pdf/frontend/build/assets/standard_fonts/LICENSE_LIBERATION
  homepage: https://streamlit.io

extra:
  recipe-maintainers:
    - FlorianFlatscher
