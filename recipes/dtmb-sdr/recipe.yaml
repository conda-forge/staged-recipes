schema_version: 1

context:
  name: dtmb-sdr
  version: "0.4.3"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dtmb_sdr-${{ version }}.tar.gz
  sha256: 2b56ed167a97f0b5eb5b6f64d64fc674ea8d43e14640aabaa60bf327d59f317b
  patches:
    - if: win
      then: patches/0001-use-dynamic-msvc-runtime.patch

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dtmb-decode = dtmb.decode:main
      - dtmb-ts-analyze = dtmb.ts:main

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.20
    - ninja
  host:
    - python
    - pip
    - scikit-build-core >=0.10
  run:
    - python

tests:
  - python:
      imports:
        - dtmb
      pip_check: true
  - requirements:
      run:
        - python
    files:
      recipe:
        - run_test.py
    script:
      - python run_test.py

about:
  summary: Vendor-neutral CI8 stream to MPEG-TS DTMB receiver
  license: MIT
  license_file:
    - LICENSE
    - THIRD_PARTY.md
  homepage: https://github.com/ningzichun/dtmb-sdr
  repository: https://github.com/ningzichun/dtmb-sdr
  documentation: https://github.com/ningzichun/dtmb-sdr

extra:
  recipe-maintainers:
    - ningzichun
