schema_version: 1

context:
  python_min: "3.10"
  version: "1.0.0"

package:
  name: osmfinder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/osmfinder/osmfinder-${{ version }}.tar.gz
  sha256: 41802a0db913f7fd211ae70ea25d245155a3e0199bef2c9693703c491e2e8cde

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv_build >=0.9.1,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}
    - shapely >=2
    - pyproj >=3
    - pooch >=1.6.0
    - requests
    - beautifulsoup4
    - rich >=12.0.0
    - tqdm >=4.42.0
    - platformdirs >=2
    - anyascii >=0.3.3
    - python-dateutil >=2.8
    - arro3-core >=0.8.0
    - arro3-io >=0.8.0

tests:
  - python:
      imports:
        - osmfinder
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  home: https://github.com/RaczeQ/osmfinder
  summary: Python library for finding and downloading OpenStreetMap *.osm.pbf extracts by name, id or geometry.
  license: MIT
  license_file: LICENSE.txt
  dev_url: https://github.com/RaczeQ/osmfinder

extra:
  recipe-maintainers:
    - RaczeQ