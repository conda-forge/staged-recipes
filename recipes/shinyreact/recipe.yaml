schema_version: 1

context:
  version: "0.1.0"

package:
  name: shinyreact
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shinyreact/shinyreact-${{ version }}.tar.gz
  sha256: 3df1d2f844fa5d3a070738611fa334796e56122e69e2b48f9dd024228403eb97

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - htmltools >=0.7.0
    - shiny >=1.8.0

tests:
  - python:
      imports:
        - shinyreact
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Shiny UI infrastructure for React-based component rendering.
  license: MIT
  # src/shinyreact/www/shinyreact.js is a pre-built bundle vendoring react,
  # react-dom and scheduler. All three ship the identical MIT text (Meta
  # Platforms), so LICENSE.react covers all of them.
  license_file:
    - LICENSE
    - licenses/LICENSE.shiny-react-js
    - licenses/LICENSE.react
  homepage: https://posit-dev.github.io/shinyreact/py/
  documentation: https://posit-dev.github.io/shinyreact/py/
  repository: https://github.com/posit-dev/shinyreact

extra:
  recipe-maintainers:
    - schloerke
