schema_version: 1

context:
  version: "0.9.3"

package:
  name: in-toto-attestation
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/i/in-toto-attestation/in_toto_attestation-${{ version }}.tar.gz
    sha256: cc0cf97417d94953b9fee6e9d415a11c59b4d47cee4f13746ffe935b28e3e8c4
  - url: https://raw.githubusercontent.com/in-toto/attestation/3f507243fa8936796b98fa77995bc0723e61337c/LICENSE
    sha256: b3a6ac899861c2c28a1abd5c7ea8733fefaed6938d730e099c42671386032aeb
    file_name: LICENSE

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=0.21.1
    - pip
  run:
    - python >=${{ python_min }},<4
    - protobuf

tests:
  - python:
      imports:
        - in_toto_attestation
        - in_toto_attestation.v1.statement
        - in_toto_attestation.v1.resource_descriptor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://in-toto.io
  repository: https://github.com/in-toto/attestation
  summary: Python bindings for the in-toto Attestation Framework
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jezdez
