schema_version: 1

context:
  version: "0.2.0"

package:
  name: cmglaciology
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cmglaciology/cmglaciology-${{ version }}.tar.gz
  sha256: 675a59b432d596dca1c4d6c9397d7f427138aeee6fda1c38a793cf6c3c497ea4

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.6
    - numpy
    # Optional on PyPI (the cvd extra); needed for show_cmaps(cvd=True)
    - colorspacious

tests:
  - python:
      imports:
        - cmglaciology
        - cmglaciology.cm
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - files:
      source:
        - tests/
        - scripts/
        - qgis/
    requirements:
      run:
        - pytest
    script:
      - pytest -v tests

about:
  homepage: https://github.com/pism/cmglaciology
  repository: https://github.com/pism/cmglaciology
  license: MIT
  license_file: LICENSE.txt
  summary: Colormaps for glaciology, packaged for Matplotlib
  description: |
    cmglaciology provides colormaps for glaciology, such as for ice surface
    speed and for the bathymetry and topography of Alaska and Greenland. They
    are registered with Matplotlib as cmg.<name> on import, each with a
    reversed version. show_cmaps(cvd=True) shows how they look with
    protanopia, deuteranopia and tritanopia.

extra:
  recipe-maintainers:
    - aaschwanden
