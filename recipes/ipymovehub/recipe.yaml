schema_version: 1

context:
  version: "0.4.0"

package:
  name: ipymovehub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipymovehub/ipymovehub-${{ version }}.tar.gz
  sha256: 2d1430a0bb79fa7fe4e81bfbd4e3c290260a373d1be42753e763f1e184a12667

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - hatch-nodejs-version >=0.3.2
    - jupyter-builder >=1.2.0,<2
    # Hidden in tool.hatch.build.hooks.jupyter-builder.dependencies
    - hatch-jupyter-builder >=0.5
  run:
    - python >=${{ python_min }}
    - jupyter-bluetooth-manager >=0.3.2

tests:
  - python:
      imports:
        - ipymovehub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/QuantStack/jupyter-movehub
  summary: A JupyterLab extension to connect to a Move Hub and drive robots
  description: |
    ipymovehub is a JupyterLab extension to connect to a Move Hub
    and drive robots.
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/QuantStack/jupyter-movehub

extra:
  recipe-maintainers:
    - HaudinFlorence
    - SylvainCorlay
