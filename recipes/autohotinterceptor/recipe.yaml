schema_version: 1
package:
  name: autohotinterceptor
  version: 1.0.0
source:
- url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/AutoHotInterceptor/input-language-sdks-v1.0.0/autohotinterceptor-input-sdks-1.0.0-source.zip
  sha256: dca6aa3d5439edd56370b7cb7636601e83054b9ee8f74b3b1687336f1270ba84
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - autohotinterceptor
    pip_check: true
- script:
  - python -m pip check
  - python -c "from autohotinterceptor import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/AutoHotInterceptor
  summary: Windows x64 AutoHotInterceptor Python SDK with source-built native bridge
  license: MIT
  license_file:
  - AutoHotInterceptor-C-ffi/LICENSE
  repository: https://github.com/TitanCSA/AutoHotInterceptor
extra:
  recipe-maintainers:
  - TitanCSA
