schema_version: 1

context:
  version: "4.7.2"

package:
  name: godot
  version: ${{ version }}

source:
  url: https://github.com/godotengine/godot/releases/download/${{ version }}-stable/godot-${{ version }}-stable.tar.xz
  sha256: a18ce0ccec3ecc40b0dd6c4f5132ca934e9fb7c2979717940ff32aee1eb35481
  patches:
    - compiler-tools.patch

build:
  number: 0
  skip: not linux or target_platform != "linux-64"
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    # Upstream enables SSE4.2 and POPCNT for x86-64.
    - x86_64-microarch-level 2
    - python >=3.9
    - scons >=4.4
    - pkg-config
    - wayland
  host:
    - alsa-lib
    - dbus
    - fontconfig
    - freetype
    - graphite2
    - libbrotlicommon
    - libbrotlidec
    - libdecor
    - libjpeg-turbo >=3
    - libogg
    - libpng
    - libtheora
    - libudev
    - libvorbis
    - libvulkan-loader
    - libwebp-base
    - libxkbcommon
    - pcre2
    - pulseaudio-client
    - sdl3 >=3.2.28
    - wayland
    - xorg-libx11
    - xorg-libxcursor
    - xorg-libxext
    - xorg-libxi
    - xorg-libxinerama
    - xorg-libxrandr
    - xorg-libxrender
    - zlib
    - zstd
  run:
    # OpenGL and EGL are loaded dynamically by upstream's generated GL loader.
    - libgl
    - libegl

tests:
  - package_contents:
      files:
        - bin/godot
        - share/applications/org.godotengine.Godot.desktop
        - share/icons/hicolor/scalable/apps/godot.svg
  - script:
      - godot --version
      - godot --help
      - godot --headless --path test-project --editor --import
      - godot --headless --path test-project --script smoke.gd
    files:
      recipe:
        - test-project/

about:
  homepage: https://godotengine.org/
  repository: https://github.com/godotengine/godot
  documentation: https://docs.godotengine.org/
  summary: Cross-platform 2D and 3D game engine and editor
  license: MIT
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt
    - thirdparty-licenses/

extra:
  recipe-maintainers:
    - baszalmstra
