schema_version: 1

context:
  version: "1.5.0"

package:
  name: griffe2md
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/griffe2md/griffe2md-${{ version }}.tar.gz
  sha256: 58e184dffcd506ca97f54516dc07dd41f98ddc76eb17ba30518cf3dda18f6a51

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - griffe2md = griffe2md:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - griffelib >=2.0
    - jinja2 >=3.1.2
    - mdformat >=0.7.16
    - tomli >=2.0

tests:
  - python:
      imports:
        - griffe2md
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - griffe2md --help

about:
  summary: Output API docs to Markdown using Griffe.
  license: MIT
  license_file: LICENSE
  homepage: https://mkdocstrings.github.io/griffe2md
  documentation: https://mkdocstrings.github.io/griffe2md
  repository: https://github.com/mkdocstrings/griffe2md

extra:
  recipe-maintainers:
    - JakobKlaushoferQC
    - ytausch
    - jakobkla
