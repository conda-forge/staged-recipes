schema_version: 1

context:
  name: plotastro
  version: "1.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 82b4b616eb6fc6bb9e4c6304867073fd87fa87011d6a6fd4c2283bf90c10aadd

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - plotastro-authors = plotastro._authors:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.5
    - numpy

tests:
  - python:
      imports:
        - plotastro
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - files:
      source:
        - tests/
        - examples/authors_example.csv
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    script:
      - plotastro-authors --help
      - pytest tests -v

about:
  homepage: https://github.com/BehnoodBandi/plotastro
  summary: Publication-quality matplotlib styles and helpers for astronomy journals
  description: |
    plotastro provides matplotlib style sheets and helpers for producing
    publication-ready figures for astronomy journals (MNRAS, A&A, ApJ, OJA,
    PRD, JCAP, Nature Astronomy): journal-accurate figure sizes, fonts and
    colorblind-friendly palettes, plus a tool that generates LaTeX
    author/affiliation blocks from a CSV file.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/BehnoodBandi/plotastro
  documentation: https://plotastro.readthedocs.io/

extra:
  recipe-maintainers:
    - BehnoodBandi
