{% set name = "leptris" %}
{% set version = "1.9.184.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 54f37fa60e0ae31fd25bb53b484ceb03edcf0297dfe169eee95012052f6efafc

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - make  # [unix]
  host:
    - python
    - pip
    - setuptools
    - cffi
  run:
    - python
    - cffi

test:
  source_files:
    - tests/
  requires:
    - pip
    - pytest
  commands:
    # the sdist vendors the pinned libleptris source; setup.py's
    # build hook compiles it — the installed package bundles the
    # engine (no LEPTRIS_LIB_PATH needed)
    - pytest tests/ -q

about:
  home: https://github.com/leptris/leptris-py
  summary: Python bindings for libleptris — fast XML 1.0 parsing and XPath 1.0, shaped like lxml
  description: |
    The Python binding for libleptris (XML 1.0, XPath 1.0/3.1,
    XSLT, XQuery, Schematron, HTML), built on cffi with a C
    accelerator. lxml-compatible read-path API. The pinned engine
    is compiled at build time from the source bundled in the sdist.
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/leptris/leptris-py#readme
  dev_url: https://github.com/leptris/leptris-py

extra:
  recipe-maintainers:
    - ronaldtse
