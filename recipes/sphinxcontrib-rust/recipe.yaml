# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: sphinxcontrib-rust
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinxcontrib-rust/sphinxcontrib_rust-${{ version }}.tar.gz
  sha256: 71ddb07f99d074549ccecc12924f844d415b4024bc469e95efff6d5c8ef3727d
  patches:
    # The Python package is pure Python; the executable it drives is packaged
    # separately as sphinx-rustdocgen.
    - 0001-build-the-rust-executable-separately.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sphinx >=7,<10
    - markdown-it-py >=3,<5
    - myst-parser >=3,<6
    - sphinx-rustdocgen ==${{ version }}

tests:
  - python:
      imports:
        - sphinxcontrib_rust
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitlab.com/munir0b0t/sphinxcontrib-rust
  repository: https://gitlab.com/munir0b0t/sphinxcontrib-rust
  documentation: https://sphinxcontrib-rust.readthedocs.io/en/latest/
  summary: Sphinx extension for documenting Rust projects
  description: |
    A Sphinx extension for integrating Rust programming language projects in
    Sphinx builds. It works with existing Rust docstrings with some minor
    tweaks, and adds Rust specific directives and roles that can be used to
    define and link to Rust items.

    Documentation is generated by shelling out to the sphinx-rustdocgen
    executable, which is packaged separately.
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - timkpaine
