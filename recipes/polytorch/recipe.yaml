schema_version: 1

context:
  version: "0.2.2"

package:
  name: polytorch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/polytorch/polytorch-${{ version }}.tar.gz
  sha256: 726336107ffb6864a0339e60c9c68c6a34db10d021245fb54c3272d9e9dbacda

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=2.2.0
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - pytorch >=1.10.2
    - plotly >=6.1.1
    - scikit-learn >=1.0.2
    - python-kaleido >=1.0.0,<2
    - attrs >=19
    - hierarchicalsoftmax >=1.4.1
    - pandas >=2.3.3,<3.0.0

tests:
  - python:
      imports:
        - polytorch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rbturnbull/polytorch/
  summary: Embeddings and loss functions for different data types.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://rbturnbull.github.io/polytorch
  repository: https://github.com/rbturnbull/polytorch/

extra:
  recipe-maintainers:
    - rbturnbull
