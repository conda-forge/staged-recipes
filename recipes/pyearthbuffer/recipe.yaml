# Define variables in this section that you can use in other parts.
context:
  name: pyearthbuffer
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/changliao1025/pyearthbuffer/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b496717934f0d25596a927ce226529c66d71d2f8f7155e254e26cc0be2a8b54e

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - gdal
    - numpy
    - pyearth >=0.2.5
    - scipy

tests:
  - python:
      imports:
        - pyearthbuffer
        - pyearthbuffer.vector
        - pyearthbuffer.raster
        - pyearthbuffer.utility
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/changliao1025/pyearthbuffer
  summary: 'Geographic Coordinate System Buffer Operations in Python'
  description: |
    pyearthbuffer is a Python package for creating geodesic buffer zones in
    Geographic Coordinate System (GCS) on the WGS84 ellipsoid. It provides
    buffer operations for points, lines, polygons, and multi-geometries with
    support for WKT, GeoJSON, and OGR geometry formats.
  license: BSD-3-Clause
  license_file: LICENSE.md
  documentation: https://pyearthbuffer.readthedocs.io/
  repository: https://github.com/changliao1025/pyearthbuffer

extra:
  recipe-maintainers:
    - changliao1025
