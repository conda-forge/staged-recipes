# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: metaworld
  version: "3.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/metaworld-${{ version }}.tar.gz
  sha256: 5f30950a5c71e4054c3d6d0293da13eddda9806a43f85cf576cf9632efd2cc87

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - gymnasium >=1.1
    - mujoco-python >=3.0.0
    - numpy >=1.18
    - scipy >=1.4.1
    - imageio
    - packaging

tests:
  - python:
      imports:
        - metaworld
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Collections of robotics environments geared towards benchmarking multi-task and meta reinforcement learning
  license: MIT
  license_file: LICENSE
  homepage: https://farama.org
  repository: https://github.com/Farama-Foundation/Metaworld

extra:
  recipe-maintainers:
    - flferretti
