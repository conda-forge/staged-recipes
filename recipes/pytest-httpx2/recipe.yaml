schema_version: 1

context:
  version: "1.0.0"

package:
  name: pytest-httpx2
  version: ${{ version }}

source:
  url: https://github.com/lundberg/pytest-httpx2/archive/refs/tags/${{ version }}.tar.gz
  sha256: eb9d8c23f2cb59075bdf88ad44630dc76f471c925ca7ede69406317bb8b14fb2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.11.14,<0.12
    - pip
  run:
    - python >=${{ python_min }}
    - respx
    - pytest

tests:
  - python:
      imports:
        - pytest_httpx2
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - pytest
        - httpx2
    script:
      - pytest -vvv -p pytester tests
    files:
      source:
        - tests/

about:
  summary: A pytest plugin for mocking out httpx2 using respx.
  license: BSD-3-Clause
  license_file: LICENSE.md
  homepage: https://pypi.org/project/pytest-httpx2/

extra:
  recipe-maintainers:
    - jsmolic
