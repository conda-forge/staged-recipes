schema_version: 1

context:
  version: 0.63b1
  python_min: "3.10"

package:
  name: opentelemetry-instrumentation-psycopg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-psycopg/opentelemetry_instrumentation_psycopg-${{ version }}.tar.gz
  sha256: 86819f4cccea21a47920807826495797b7261cc1893c8e855415e76fb7b8e2e8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.12,<2.dev0
    - opentelemetry-instrumentation ==0.63b1
    - opentelemetry-instrumentation-dbapi ==0.63b1

tests:
  - python:
      imports:
        - opentelemetry_instrumentation_psycopg
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: OpenTelemetry psycopg instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-psycopg

extra:
  recipe-maintainers:
    - BrownMunda1
