context:
  version: "5.0.3"

package:
  name: spectrapyle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spectrapyle/spectrapyle-${{ version }}.tar.gz
  sha256: 871611e3725dae97789277f15efea53ff3f0ab2a7e927cbd25867f5f82077bff

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.9
    - numpy >=1.23
    - scipy >=1.9
    - pandas >=1.5
    - matplotlib-base >=3.6
    - plotly >=5.0
    - astropy >=5.0
    - dust_extinction >=1.3
    - h5py >=3.7
    - pydantic >=2.0
    - pyyaml >=6.0
    - tqdm >=4.60
    - ipywidgets >=8.0
    - ipython >=8.0
    - ipyfilechooser >=0.6

tests:
  - python:
      imports:
        - spectraPyle
      pip_check: true
  - script:
      - spectrapyle --help

about:
  homepage: https://github.com/squai/SpectraPyle
  summary: A flexible and scalable tool for stacking astronomical spectra
  description: |
    SpectraPyle is a flexible and scalable Python package for stacking
    astronomical spectra. It provides both graphical and command-line
    interfaces and supports configurable normalization, resampling,
    sigma clipping, bootstrap analysis, and parallel processing.
  license: MIT
  license_file: LICENSE
  documentation: https://spectrapyle.readthedocs.io/
  repository: https://github.com/squai/SpectraPyle

extra:
  recipe-maintainers:
    - squai
