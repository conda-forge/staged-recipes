context:
  version: "0.2.0"

package:
  name: spaday-spectrum
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-spectrum/spaday_spectrum-${{ version }}.tar.gz
  sha256: a7af6f2dc4a2dfd9d12d3560d8b9398a71f9e45c961d4ee3c944c14dedd4eeaf

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.8.2,<1

tests:
  - python:
      imports:
        - spaday_spectrum
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Spectrum components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-spectrum
  repository: https://github.com/1kbgz/spaday-spectrum

extra:
  recipe-maintainers:
    - timkpaine
