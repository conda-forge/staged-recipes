context:
  version: "0.1.1"
  python_min: "3.11"

package:
  name: pockit-optimal-control
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pockit-optimal-control/pockit_optimal_control-${{ version }}.tar.gz
  sha256: "88d83f3aa7b8a02a152a26174637e69343c7dddd6e3366818ce8fc66665fbcf0"

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.26
  run:
    - python >=${{ python_min }}
    - numpy >=1.26.0
    - sympy >=1.12
    - scipy >=1.11.3
    - numba >=0.58.1

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pockit
        - pockit.lobatto
        - pockit.radau
        - pockit.optimizer.scipy
      pip_check: true

about:
  homepage: https://github.com/zouyilin2000/pockit
  summary: Python toolkit for numerical optimal control
  description: |
    Pockit solves numerical optimal-control problems using pseudospectral methods
    and supports multiphase systems and constrained trajectory optimization.
  license: MIT
  license_file: LICENSE
  documentation: https://pockit.pages.dev
  repository: https://github.com/zouyilin2000/pockit

extra:
  recipe-maintainers:
    - zouyilin2000
