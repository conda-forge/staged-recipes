schema_version: 1

context:
  name: cron-pydantic
  version: "0.1.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cron-pydantic/cron_pydantic-${{ version }}.tar.gz
  sha256: 1d2f0ddb686bedeca470357f5683df2197e2ed597ad18df9f0060842ebd6b5f6

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pydantic >=2
    - pyyaml

tests:
  - python:
      imports:
        - cron_pydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/airflow-laminar/cron-pydantic
  summary: Pydantic models for cron
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://airflow-laminar.github.io/cron-pydantic/
  repository: https://github.com/airflow-laminar/cron-pydantic

extra:
  recipe-maintainers:
    - timkpaine
