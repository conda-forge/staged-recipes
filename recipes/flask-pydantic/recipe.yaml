schema_version: 1

context:
  version: 0.14.0

package:
  name: flask-pydantic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-pydantic/flask_pydantic-${{ version }}.tar.gz
  sha256: eb27fa6fd62d952b421df05c72349b5b1dc6fadacbd52879aac80cc519e4eab6

build:
  # No `skip:` here. grayskull emitted `skip: match(python, "<3.9")` alongside
  # `noarch: python`, which the linter rejects outright: "noarch packages can't
  # have skips with selectors."
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    # requires-python is >=3.7, below conda-forge's floor, so python_min governs
    # and no context override is needed. grayskull set python_min: "3.7", which
    # would have tried to build against a Python conda-forge no longer ships.
    - python ${{ python_min }}.*
    - flit-core <4
    - pip
  run:
    - python >=${{ python_min }}
    - flask
    - pydantic >=2.0
    # typing_extensions is deliberately absent: upstream gates it behind
    # `python_version < "3.8"`, a marker that is never true at python_min 3.10.

tests:
  - python:
      imports:
        - flask_pydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Flask extension for integration with Pydantic library
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/pallets-eco/flask-pydantic
  repository: https://github.com/pallets-eco/flask-pydantic

extra:
  recipe-maintainers:
    - killua156
