{% set name = "pit-release-gate" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pit-release-gate/pit_release_gate-{{ version }}.tar.gz
  sha256: e936def6efe9b41c43371bfe75bad4c5334d8b29a2d4e3537715b06d106f9afd

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.24
    - pandas >=2.0
    - scipy >=1.10

test:
  imports:
    - pit_release_gate
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/MaxWellApexLab/pit-release-gate
  summary: Screen quant/ML feature pipelines for look-ahead bias from late-arriving data
  description: |
    pit-release-gate screens cross-sectional feature pipelines for look-ahead
    bias caused by late-arriving data. It measures each signal's leakage
    susceptibility on planted-truth controls and gates release until the
    cross-section is safe.
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/MaxWellApexLab/pit-release-gate#readme
  dev_url: https://github.com/MaxWellApexLab/pit-release-gate

extra:
  recipe-maintainers:
    - MaxWellApexLab
