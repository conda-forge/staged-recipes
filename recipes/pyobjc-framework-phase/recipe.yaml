schema_version: 1

context:
  version: "12.2.2"

package:
  name: pyobjc-framework-phase
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyobjc-framework-PHASE/pyobjc_framework_phase-${{ version }}.tar.gz
  sha256: 6afcfbf754d9959398ccd323e23042afff151c46559af75f7df63a07bf72ca48

build:
  number: 0
  skip: not osx
  script:
    content:
      # force pyobjc to use conda-forge's chosen SDK
      - export CFLAGS="${CFLAGS} -isysroot ${SDKROOT:-$CONDA_BUILD_SYSROOT}"
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    # upstream requires the exact same release (>=X.Y.Z); the <13 cap allows
    # newer 12.x releases while guarding against mixing pyobjc major
    # versions, which are released and ABI-matched in lockstep
    - python
    - pyobjc-core >=${{ version }},<13
    - pyobjc-framework-avfoundation >=${{ version }},<13

tests:
  - python:
      imports:
        - PHASE
      pip_check: true

about:
  homepage: https://github.com/ronaldoussoren/pyobjc
  repository: https://github.com/ronaldoussoren/pyobjc
  documentation: https://pyobjc.readthedocs.io/en/latest/
  summary: Wrappers for the framework PHASE on macOS
  description: |
    PyObjC wrappers for Apple's PHASE (Physical Audio Spatialization Engine)
    framework, giving Python access to spatial audio rendering, sound
    sources, and listener modeling on macOS. Part of the PyObjC project,
    which provides bridges between Python and Objective-C frameworks on
    macOS.
  license: MIT
  license_file: License.txt

extra:
  recipe-maintainers:
    - pb01ka
