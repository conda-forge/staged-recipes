{% set name = "aehcli" %}
{% set version = "0.1.2" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/be/62/1d7d1f309a57a1e18a22258e5bcb85262183c0d83cbfc07026671827e297/aehcli-0.1.2.tar.gz
  sha256: 00485f5eb584c940b92f09343821cf73543992f664fc1db55ac42f7c853649ba

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - aeh = agent_eval_harness.cli:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >={{ python_min }}

test:
  imports:
    - agent_eval_harness
  commands:
    - pip check
    - aeh --help
    - aeh judges
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/laninenterline/agent-eval-harness
  summary: Framework-neutral, task-level evaluation and regression harness for AI agents
  description: |
    aehcli ingests OpenTelemetry GenAI or OpenInference traces, applies a
    deterministic rubric, optionally calls an LLM judge, and emits a JSON report
    that can be diffed in CI to catch agent regressions.
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/laninenterline/agent-eval-harness
  doc_url: https://laninenterline.github.io/agent-eval-harness/

extra:
  recipe-maintainers:
    - laninenterline
