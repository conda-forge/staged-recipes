{% set name = "aehcli" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/c3/ad/7beeebb82df97ae369e5115b1c26aa77711ec5b5d8d8644cdc98d1d4accd/aehcli-0.1.0.tar.gz
  sha256: d185e6fb79cae7f6c517fd7d81e3b84cdfe6b073db4d5dca928e037ecc98df06

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - aeh = agent_eval_harness.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.10

test:
  imports:
    - agent_eval_harness
  commands:
    - pip check
    - aeh --help
    - aeh judges
  requires:
    - pip

about:
  home: https://github.com/laninenterline/agent-eval-harness
  summary: Framework-neutral, task-level evaluation and regression harness for AI agents
  description: |
    aehcli ingests OpenTelemetry GenAI or OpenInference traces, applies a
    deterministic rubric, optionally calls an LLM judge, and emits a JSON report
    that can be diffed in CI to catch agent regressions.
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/laninenterline/agent-eval-harness
  doc_url: https://github.com/laninenterline/agent-eval-harness#readme

extra:
  recipe-maintainers:
    - laninenterline
