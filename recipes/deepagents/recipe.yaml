context:
  version: "0.7.5"

package:
  name: deepagents
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deepagents/deepagents-${{ version }}.tar.gz
  sha256: ed44e956ed8e4ccd57203b9925c530707cdb815ffb56fe8ceb9b5b63d45a20c1

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.11,<4.0
    - pip
    - setuptools >=83.0.0
    - wheel
  run:
    - python >=3.11,<4.0
    - langchain >=1.3.14,<2.0.0
    - langchain-core >=1.5.0,<2.0.0
    - langchain-anthropic >=1.5.4,<2.0.0
    - langchain-google-genai >=4.3.1,<5.0.0
    - langsmith >=0.10.9
    - packaging >=23.2
    - wcmatch >=11.0

tests:
  - python:
      imports:
        - deepagents
      pip_check: true

about:
  homepage: https://docs.langchain.com/oss/python/deepagents/overview
  summary: General purpose 'deep agent' with sub-agent spawning, todo list capabilities, and mock file system
  description: |
    deepagents is a general purpose "deep agent" framework built on
    LangGraph. It provides sub-agent spawning, planning via a todo list
    tool, and a mock/virtual file system, enabling agents to tackle
    long-horizon, complex tasks.
  license: MIT
  license_file: LICENSE
  documentation: https://reference.langchain.com/python/deepagents/
  repository: https://github.com/langchain-ai/deepagents

extra:
  recipe-maintainers:
    - pb01ka
