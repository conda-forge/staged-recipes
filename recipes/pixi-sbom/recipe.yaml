# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: pixi-sbom
  version: ${{ version }}

source:
  url: https://github.com/millsks/pixi-sbom/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a4a06eb190ab94f32e617bb3ba49eb6ce971156baccc90320f5013454aa536d5

build:
  number: 0
  script:
    - if: unix
      then: cargo auditable install --locked --bins --no-track --path . --root "$PREFIX"
      else: cargo auditable install --locked --bins --no-track --path . --root "%LIBRARY_PREFIX%"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - pixi-sbom --version
      - pixi-sbom --help
  - package_contents:
      bin:
        - pixi-sbom
      strict: true

about:
  homepage: https://github.com/millsks/pixi-sbom
  repository: https://github.com/millsks/pixi-sbom
  documentation: https://github.com/millsks/pixi-sbom/blob/main/docs/README.md
  summary: Generate a CycloneDX or SPDX SBOM from a pixi.lock file
  description: |
    A pixi extension that writes a CycloneDX 1.6 or SPDX 2.3 JSON Software
    Bill of Materials for one or more environments of a pixi.lock file.
    Once installed with `pixi global install pixi-sbom`, pixi discovers the
    `pixi-sbom` executable on PATH and exposes it as `pixi sbom`.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - millsks
