context:
  version: "0.10.0"

package:
  name: frobby
  version: ${{ version }}

source:
  url: https://github.com/Macaulay2/frobby/releases/download/v${{ version }}/frobby-${{ version }}.tar.gz
  sha256: 5baf2133fa47c77fd87728d77b0a26e0a0e1de4a20fddab22619fe69a210ef34

build:
  number: 0
  skip:
    - win
  script:
    - ./configure --prefix=$PREFIX --disable-static
    - make -j${CPU_COUNT}
    - if: build_platform == target_platform
      then: make -j${CPU_COUNT} check
    - make install

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - make
  host:
    - gmp
  run_exports:
    - ${{ pin_subpackage('frobby', upper_bound='x.x') }}

tests:
  - package_contents:
      files:
        - include/frobby.h
      lib:
        - frobby
      bin:
        - frobby
  - script:
      - frobby genideal | frobby irrdecom

about:
  homepage: https://github.com/Macaulay2/frobby
  summary: Computations with monomial ideals
  description: |
    Frobby is a software system for computations with monomial
    ideals, intended for research in computational algebra. It
    supports Euler characteristics, Hilbert series, maximal standard
    monomials, combinatorial optimization, primary and irreducible
    decomposition, Alexander duals, associated primes, minimization
    and intersection of monomial ideals, and the computation of
    Frobenius problems with very large numbers.
  license: GPL-2.0-or-later
  license_file: COPYING
  documentation: https://macaulay2.com/Downloads/OtherSourceCode/manual.pdf
  repository: https://github.com/Macaulay2/frobby

extra:
  recipe-maintainers:
    - d-torrance
