schema_version: 1

context:
  version: "1.1.6"
  python_min: "3.10"

package:
  name: zuna
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zuna/zuna-${{ version }}.tar.gz
  sha256: 8131d018def1b529060920190f9060b387c2422bcc20110227365c7cf34f6724

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.20.0
    - pytorch >=2.5
    - scipy >=1.7.0
    - mne-base >=1.0.0
    - matplotlib-base
    - safetensors
    - joblib >=1.0.0
    - omegaconf
    - huggingface_hub
    - einops
    - python-dotenv

tests:
  - python:
      imports:
        - apps
        - apps.AY2latent_bci.transformer
        - lingua
        - zuna
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Foundation model for EEG reconstruction and interpolation
  license: Apache-2.0 AND BSD-3-Clause
  license_file:
    - LICENSE
    - LICENSE-LINGUA
  homepage: https://www.zyphra.com
  repository: https://github.com/Zyphra/zuna

extra:
  recipe-maintainers:
    - jonasmago
