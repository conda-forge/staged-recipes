schema_version: 1

context:
  version: 0.6.5

package:
  name: mmg_toolbox
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mmg_toolbox/mmg_toolbox-${{ version }}.tar.gz
  sha256: 13d19e311a41938dd78727fb9786a3ac481b3d9bf68460e14fa895023132da7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dataviewer = mmg_toolbox.tkguis:cli_run
      - create_notebooks = mmg_toolbox.scripts.experiment_startup:cli_create_notebooks

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python ${{ python_min }}
    - numpy
    - h5py
    - hdf5plugin
    - hdfmap >=1.1.0
    - matplotlib-base
    - imageio
    - scipy
    - lmfit
    - stomp.py

tests:
  - python:
      imports:
        - mmg_toolbox
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - create_notebooks --help

about:
  summary: Repository for useful python data analysis functions for the Diamond Magnetic Materials Group
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/mmg-toolbox/

extra:
  recipe-maintainers:
    - NatLeung96
    - DanPorter
