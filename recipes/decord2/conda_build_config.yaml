# The VideoToolbox decoder references kCMVideoCodecType_AV1, which is only
# available starting from the macOS 14 SDK. The deployment target is left at
# the conda-forge default so the binaries keep running on older macOS versions.
MACOSX_SDK_VERSION:  # [osx]
  - "14.5"           # [osx]
# nvcc from CUDA 12.x only supports host GCC up to 13, while the conda-forge
# default on linux is GCC 14. GCC 14 is pinned down to 13 so the CUDA 12.9
# build compiles. GCC 13 is also valid for the CPU and CUDA 13 builds.
c_compiler_version:    # [linux]
  - "13"               # [linux]
  - "13"               # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
cxx_compiler_version:  # [linux]
  - "13"               # [linux]
  - "13"               # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
