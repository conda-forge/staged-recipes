schema_version: 1
package:
  name: virtual-storage-fault-lab
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Virtual-Storage-Fault-Lab/language-sdks-v1.0.0/virtual-storage-fault-lab-sdk-source-1.0.0.zip
  sha256: 5a192eb0e9c0715c345c4b0dd5c364fa9f8f570aef6077223661f4e351d1e7b6
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - virtual_storage_fault_lab
    pip_check: true
- script:
  - python -m pip check
  - python -c "from virtual_storage_fault_lab import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Virtual-Storage-Fault-Lab
  summary: Windows x64 Virtual-Storage-Fault-Lab Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Virtual-Storage-Fault-Lab-C-ffi/LICENSE
  - Virtual-Storage-Fault-Lab-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
