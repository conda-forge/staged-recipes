context:
    version: "2.4.1"

package:
    name: rustscan
    version: ${{ version }}

source:
    url: https://github.com/bee-san/RustScan/archive/${{ version }}.tar.gz
    sha256: fa99c18a12d4c0939ab69ddb84ef7b85a1ea01d8fc86df227449d89473531765

build:
    number: 0
    script:
        env:
            CARGO_PROFILE_RELEASE_STRIP: symbols
            CARGO_PROFILE_RELEASE_LTO: fat
        content:
            - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
            - if: unix
              then:
                  - cargo auditable install -j ${CPU_COUNT} --root "${PREFIX}" --path . --locked --no-track
              else:
                  - cargo auditable install -j %CPU_COUNT% --root "%PREFIX%" --path . --locked --no-track

requirements:
    build:
        - ${{ stdlib('c') }}
        - ${{ compiler('rust') }}
        - cargo-bundle-licenses
        - cargo-auditable

tests:
    - script:
          - rustscan --version
          - rustscan --help
    - package_contents:
          strict: true
          bin:
              - rustscan

about:
    homepage: https://github.com/bee-san/RustScan
    summary: "The Modern Port Scanner."
    description: |
        The Modern Port Scanner. Find ports quickly (3 seconds at its fastest). Run scripts through our scripting engine (Python, Lua, Shell supported).
    license: GPL-3.0-or-later
    license_file:
        - LICENSE
        - THIRDPARTY.yml
    repository: https://github.com/bee-san/RustScan

extra:
    recipe-maintainers:
        - XhstormR
