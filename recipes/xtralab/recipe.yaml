context:
  version: "0.16.0"

package:
  name: xtralab
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xtralab/xtralab-${{ version }}.tar.gz
  sha256: 5a68e0c3a06757881cd1e7488cdce4bbc455e32cd2c9623ed93799d8c313205a

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-build-isolation
  python:
    entry_points:
      - xtralab = xtralab.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - hatch-jupyter-builder >=0.5
    - jupyter-builder >=1.0.2,<2.0.0a0
    - hatch-nodejs-version >=0.3.2
    - jupyterlab >=4.6.2,<5
  run:
    - python >=${{ python_min }}
    - ajlab >=0.1.11
    - jupyter-server-mcp >=0.4.1
    - jupyterlab >=4.6.2,<5
    - jupyterlab-commands-toolkit >=0.3.0
    - jupyterlab-cursor-dark >=1.0.2
    - jupyterlab-cursor-light >=1.0.2
    - jupyterlab-day >=0.2.0
    - jupyterlab-git >=0.54.0
    - jupyterlab-git-core >=0.54.0
    - jupyterlab-lsp >=5.3.0
    - jupyterlab-night >=0.5.2
    - jupyterlab-pierre-dark >=0.1.1
    - jupyterlab-pierre-light >=0.1.1
    - jupyterlab-quickopen >=2.3.0
    - jupyterlab-search-replace >=1.1.3
    - jupyterlab_vim >=4.1.4
    - platformdirs >=2.5
    - psutil >=5.9
    - ty >=0.0.65

tests:
  # pip check is not run: the `ty` runtime dependency is the conda-forge Rust
  # binary package, which installs no Python dist-info metadata.
  - python:
      imports:
        - xtralab
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - package_contents:
      files:
        - share/jupyter/labextensions/xtralab/package.json
  - script:
      - xtralab --version

about:
  homepage: https://github.com/jtpio/xtralab
  summary: An opinionated JupyterLab meta-package for coding agents
  description: |
    xtralab installs JupyterLab with a set of extensions and defaults for work
    with terminal coding agents: an agent launcher, side-by-side git diffs for
    text files and notebooks, prompts about selected code, and a Model Context
    Protocol server that lets agents drive the app. It builds on ajlab, the
    agent-ready JupyterLab base.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://jtpio.github.io/xtralab/
  repository: https://github.com/jtpio/xtralab

extra:
  recipe-maintainers:
    - SylvainCorlay
