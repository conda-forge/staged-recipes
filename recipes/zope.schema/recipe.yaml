schema_version: 1

context:
  version: "8.1"

package:
  name: zope.schema
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.schema/zope_schema-${{ version }}.tar.gz
  sha256: 2d9faa7f91a7bf09fcab2c039d9182fcc9ce7042dc77e18d3df277904aee0948

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - zope.interface >=5.0.0
    - zope.event

tests:
  - python:
      imports:
        - zope.schema
        - zope.schema.interfaces
        - zope.schema.vocabulary
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest discover -v zope.schema
    requirements:
      run:
        - zope.i18nmessageid

about:
  homepage: https://github.com/zopefoundation/zope.schema
  repository: https://github.com/zopefoundation/zope.schema
  documentation: https://zopeschema.readthedocs.io
  summary: zope.interface extension for defining data schemas
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
