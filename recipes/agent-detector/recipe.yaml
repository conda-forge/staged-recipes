schema_version: 1

context:
  version: "2.0.0"

package:
  name: agent-detector
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/agent-detector/agent_detector-${{ version }}.tar.gz
  sha256: 19c8ae185dbdca23c24abdcd8ac2cf58b8e84dc284c6f6db536656601f9ffc3f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - agent-detector = agent_detector._cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - agent_detector
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - pytest
    script:
      - pytest -vvv tests
    files:
      source:
        - tests/

about:
  summary: Detect AI coding agents from their execution environment or User-Agent
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/patrick91/agent-detector

extra:
  recipe-maintainers:
    - jsmolic
