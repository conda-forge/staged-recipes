schema_version: 1

context:
  version: "1.4.0"
  cuda: ${{ (cuda_compiler_version | default("None")) != "None" }}

package:
  name: s2fft
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/s/s2fft/s2fft-${{ version }}.tar.gz
    sha256: b84c0c2bb0c3dfabe3431360bf90224705554e92966ab87e92affc0fe8f956ba
  - if: cuda
    then:
      url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_documentation/LICENSE.txt
      sha256: e2c71babfd18a8e69542dd7e9ca018f9caa438094001a58e6bc4d8c999bf0d07
      file_name: LICENSE-NVIDIA

build:
  number: 0
  string: ${{ ("cuda" ~ (cuda_compiler_version | version_to_buildstring)) if cuda else "cpu" }}_py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
  variant:
    use_keys:
      - cuda_compiler_version
    down_prioritize_variant: ${{ 1 if cuda else 0 }}
  skip:
    - match(python, "<3.11")
    - win
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.19
    - make
    - if: cuda
      then:
        - ${{ compiler('cuda') }}
        - cuda-version ==${{ cuda_compiler_version }}
  host:
    - python
    - pip
    - setuptools
    - setuptools-scm
    - scikit-build-core >=0.8
    - nanobind >=1.3.2
    - jax >=0.5.0
    - if: cuda
      then:
        - cuda-version ==${{ cuda_compiler_version }}
        - cuda-cudart-dev
        - cuda-cudart-static
        - libcufft-dev
        - libcufft-static
    - if: cuda and match(cuda_compiler_version, ">=13")
      then:
        - cuda-culibos-static
  run:
    - python
    - numpy >=1.20
    - jax >=0.5.0

tests:
  - python:
      imports:
        - s2fft
        - s2fft_lib._s2fft
      pip_check: true
  - script:
      - if: cuda
        then: python -c "from s2fft_lib import _s2fft; assert _s2fft.COMPILED_WITH_CUDA"

about:
  homepage: https://github.com/astro-informatics/s2fft
  summary: Differentiable and accelerated spherical transforms with JAX
  description: |
    S2FFT provides differentiable and accelerated spin spherical harmonic
    and Wigner transforms, with JAX and PyTorch frontends and support for
    several spherical sampling schemes.
  license: ${{ "MIT AND LicenseRef-NVIDIA-End-User-License-Agreement" if cuda else "MIT" }}
  license_file:
    - LICENCE.txt
    - if: cuda
      then: LICENSE-NVIDIA
  documentation: https://astro-informatics.github.io/s2fft/
  repository: https://github.com/astro-informatics/s2fft

extra:
  recipe-maintainers:
    - mwyau
