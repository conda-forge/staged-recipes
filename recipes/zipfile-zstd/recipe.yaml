schema_version: 1

context:
  name: zipfile-zstd
  version: "0.0.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/zipfile_zstd-${{ version }}.tar.gz
  sha256: c1498e15b7922a3d1af0ea55df8b11b2af4e8f7e0e80e414e25d66899f7def89

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - pip
  run:
    - python >=${{ python_min }}
    - zstandard >=0.15.0

tests:
  - python:
      imports:
        - zipfile_zstd
      pip_check: true
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: Monkey patch the standard zipfile module to enable Zstandard support
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/taisei-project/python-zipfile-zstd
  repository: https://github.com/taisei-project/python-zipfile-zstd

extra:
  recipe-maintainers:
    - tdsmith
