context:
  version: "4.0.0"

package:
  name: winrt-table-compiler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/winrt-table-compiler/winrt_table_compiler-${{ version }}.tar.gz
  sha256: 4aa0b0fdb8e9a76d5cbdda19769fdcb13a57fb86f10146804b23b24e65761765

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - hatchling

tests:
  - python:
      imports:
        - winrt.table
        - winrt.table.build_hooks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Compiler for the projection tables of PyWinRT
  description: |
    Build-time hatchling plugin that compiles the projection tables shipped by
    the PyWinRT namespace packages (winrt-windows-*). Only needed to build
    those packages; it is platform independent.
  homepage: https://github.com/pywinrt/pywinrt
  repository: https://github.com/pywinrt/pywinrt
  documentation: https://pywinrt.readthedocs.io
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
