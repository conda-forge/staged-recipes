schema_version: 1

context:
  name: opentelemetry-processor-baggage
  version: "0.66b2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_processor_baggage-${{ version }}.tar.gz
  sha256: 1c5acb98a804d62314e0743a567e959bb44a95224c0442fca422536967370bf6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.5,<2
    - opentelemetry-sdk >=1.5,<2
    - wrapt >=1.0.0,<3.0.0

tests:
  - python:
      imports:
        - opentelemetry.processor.baggage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: OpenTelemetry Baggage Span Processor
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://opentelemetry.io
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/processor/opentelemetry-processor-baggage

extra:
  recipe-maintainers:
    - yonib05
