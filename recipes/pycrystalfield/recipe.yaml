context:
  version: "2.4.1"
  commit: de5abbfbb70e53c60dd758c4ee1a3246663c8460

package:
  name: pycrystalfield
  version: ${{ version }}

source:
  url: https://github.com/asche1/PyCrystalField/archive/${{ commit }}.tar.gz
  sha256: 8a0a712eaa407bf6050bdea042412f4f4f0f0e34d84503f465abead52751facd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }}  -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - matplotlib
    - scipy
    - numba
    - numpy
    - pyyaml

tests:
  - python:
      imports:
        - PyCrystalField
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Code to calculate the crystal field Hamiltonian of magnetic ions
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/asche1/PyCrystalField
  repository: https://github.com/asche1/PyCrystalField

extra:
  recipe-maintainers:
    - Skovrup1
