context:
  version: "1.9.0"

package:
  name: ttt
  version: ${{ version }}

source:
  url: https://github.com/eugenioenko/ttt/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 87b7623f5b02f1a7a549e7c33150740e7406b069124b7e48327c23c4586ec353

build:
  number: 0
  script:
    - go-licenses save ./cmd/ttt --save_path=library_licenses
    - if: unix
      then: go build -v -o $PREFIX/bin/ttt -ldflags="-s -w" ./cmd/ttt
      else: go build -v -o %LIBRARY_BIN%\ttt.exe -ldflags="-s" ./cmd/ttt

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - package_contents:
      bin:
        - ttt
      strict: true

about:
  homepage: https://github.com/eugenioenko/ttt
  summary: TTT Editor (Terminal Text Tool).
  description: |
    A real alternative to VS Code, Zed, and Sublime that runs in your terminal.
    A TUI that feels like GUI. Single binary, zero config.
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/
  documentation: https://pkg.go.dev/github.com/eugenioenko/ttt
  repository: https://github.com/eugenioenko/ttt

extra:
  recipe-maintainers:
    - imagejan
