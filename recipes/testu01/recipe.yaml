context:
  version: "1.2.3"
  commit: "57e98bf33880daedc930739c81e39b89a8d24dba"

package:
  name: testu01
  version: ${{ version }}

source:
  url: https://github.com/umontreal-simul/TestU01-2009/archive/${{ commit }}.tar.gz
  sha256: 8765c359c7cde77731c12d037221a31a29cf4f9e59a9414976cffa2022a91687
  patches:
    - 0001-fix-gcc15-prototypes.patch

build:
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
  run_exports:
    - ${{ pin_subpackage('testu01', upper_bound='x') }}

# TestU01 installs its public headers and three shared libraries.
# The build script also compiles and runs a client against the installed API.
tests:
  - package_contents:
      bin:
        - tcode
      lib:
        - mylib
        - probdist
        - testu01
      include:
        - TestU01.h
        - unif01.h
        - bbattery.h

about:
  homepage: https://simul.iro.umontreal.ca/testu01/tu01.html
  repository: https://github.com/umontreal-simul/TestU01-2009
  license: Apache-2.0
  license_file: LICENSE
  summary: A C library for empirical statistical testing of uniform random number generators
  description: |
    TestU01 is a software library implemented in ANSI C that provides utilities,
    statistical tests, and test batteries for empirical testing of uniform random
    number generators. This package is built from the maintained official GitHub
    tree for TestU01 1.2.3, pinned to a specific commit.

extra:
  recipe-maintainers:
    - mikemhenry
