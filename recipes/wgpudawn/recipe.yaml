schema_version: 1

context:
  version: "0.32.0.4"

package:
  name: wgpudawn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wgpudawn/wgpudawn-${{ version }}.tar.gz
  sha256: 285801512c52220c224e07a2a07452632aa9ed0c503c9f6b2078bb4ba3f9509c

build:
  number: 0
  # The cffi extension uses the limited API, so one build per platform covers
  # all supported Python versions.
  skip: not (match(python, python_min ~ ".*") and is_abi3)
  python:
    version_independent: true
  script:
    # build_cffi.py looks for webgpu.h and the webgpu_dawn library in
    # DAWN_PREFIX (and its Library/ on Windows); point it at the host prefix
    # also when cross-compiling.
    - if: unix
      then: export DAWN_PREFIX="${PREFIX}"
      else: set "DAWN_PREFIX=%PREFIX%"
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cffi >=1.17
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - python-abi3
    - pip
    - setuptools >=77
    - cffi >=1.17
    - dawn
  run:
    - python
    - cffi >=1.17
    # The extension uses Dawn's C++ API (dawn::native), which is not ABI
    # stable, and Dawn has no run_exports; require the exact Dawn release.
    - ${{ pin_compatible('dawn', upper_bound='x.x') }}
    - if: osx
      then:
        - rubicon-objc >=0.4.1

tests:
  - python:
      imports:
        - wgpudawn
        - wgpudawn.backends.dawn
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - abi3audit
    script:
      - if: unix
        then: abi3audit $SP_DIR/wgpudawn/_lib/_wgpu_dawn.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
        else: abi3audit %SP_DIR%\wgpudawn\_lib\_wgpu_dawn.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
  - files:
      source:
        - tests/
    requirements:
      run:
        - pip
        - pytest
        - numpy
        - psutil
        - imageio
        - anyio
        - trio
        - rendercanvas >=2.4.0
    script:
      - pip check
      - python -c "import wgpudawn.backends.dawn as d; print(d.__version__)"
      # Tests that need a GPU adapter skip themselves when there is none.
      - pytest tests -v

about:
  homepage: https://github.com/hmaarrfk/wgpudawn
  repository: https://github.com/hmaarrfk/wgpudawn
  summary: WebGPU for Python, on Dawn. A standalone build of the wgpu-py API with a Dawn backend.
  description: |
    wgpudawn provides the wgpu-py API for WebGPU in Python, implemented on
    top of Google's Dawn instead of wgpu-native. It is a cffi extension
    linked against Dawn's webgpu.h and native C++ API.
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmaarrfk
