context:
  version: "4.3.0"

package:
  name: meltano
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/meltano/meltano-${{ version }}.tar.gz
  sha256: 534526656ba4eb6b6ed55527c63906b953b03ac978e8c4bf31de1f2ec3065c68

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.32.0
  run:
    - python >=${{ python_min }}
    - alembic >=1.14.0,<2
    - anyio >=4.4.0,<5
    - click >=8.2,<8.5,!=8.2.2
    - click-default-group >=1.2.4,<2
    - dateparser >=1.2.1
    - fasteners >=0.19,<0.21
    - importlib-metadata >=5
    - jinja2 >=3.1.4,<4
    - jsonschema >=4.23,<5
    - packaging >=24.2,<27.0
    - pip >=25.1,<27.0
    - platformdirs >=4.3.8
    - psutil >=7.0.0,<8
    - python-dotenv >=1.0.1,<2
    # provides pip/importlib-visible metadata (dist name "uv") for the
    # conda-forge/uv-feedstock binary, which ships no such metadata on its own
    - python-uv >=0.8.14
    - pyyaml >=6.0.2,<7
    - requests >=2.32.3,<3
    - rich >=15,<16
    - ruamel.yaml >=0.18.6,<0.20
    - smart_open >=7.0.5,<9
    - snowplow-tracker >=1.0.4,<2
    - sqlalchemy >=2.0.35,<2.1
    - structlog >=25.5.0,<27
    - typing-extensions >=4.12.2,<5
    - tzlocal >=5.3,<6
    - urllib3 >=1.26.20
    - virtualenv >=20.26.6,<22

tests:
  - python:
      imports:
        - meltano
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m meltano.cli --version
      - uv --version

about:
  homepage: https://meltano.com
  summary: The declarative code-first data integration engine
  description: |
    Meltano is your CLI for ELT+: Open Source, Flexible, and Scalable.
    Move, transform, and test your data with confidence using a
    streamlined data engineering workflow. Meltano provides a
    declarative, code-first approach to data integration, letting you
    unlock hundreds of APIs and databases through Singer taps and
    targets, all managed from a single command-line tool.
  license: MIT
  license_file: LICENSE
  documentation: https://docs.meltano.com
  repository: https://github.com/meltano/meltano

extra:
  recipe-maintainers:
    - pb01ka
