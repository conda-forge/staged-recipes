schema_version: 1

context:
  version: "0.0.2"

package:
  name: mudas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mudas/mudas-${{ version }}.tar.gz
  sha256: c20873a9d29598b8da5edce4c9e8ba6b0f221d8db5c41c99ad065488f126a16e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - mudas = mudas.mudas:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}
    - pandas
    - numpy
    - scipy
    - biopython
    - geoparse
    - rpy2
    - qnorm
    - inmoose
    - speedtest-cli
    - psutil
    - bowtie2
    - r-base
    - bioconductor-rsubread
    - bioconductor-affxparser

tests:
  - python:
      imports:
        - mudas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - mudas --help

about:
  summary: A microarray data access system for GEO
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/freyrelab/MicroarrayProject

extra:
  recipe-maintainers:
    - diego-carc
