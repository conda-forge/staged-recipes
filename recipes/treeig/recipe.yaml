schema_version: 1

context:
  version: 0.2.0

package:
  name: treeig
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/treeig/treeig-${{ version }}.tar.gz
  sha256: c2dabd19321330c355ae20cc6856174351dd922c48eabd70c247551f8dff17fc

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - numba >=0.58

tests:
  - python:
      imports:
        - treeig
      python_version:
        - ${{ python_min }}.*
        - '*'
      pip_check: true
  - script: python run_test.py
    requirements:
      run:
        - python ${{ python_min }}.*
        - scikit-learn >=1.3
    files:
      recipe:
        - run_test.py

about:
  homepage: https://github.com/LudgerHentschel/treeig
  repository: https://github.com/LudgerHentschel/treeig
  documentation: https://ludgerhentschel.github.io/treeig/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Exact Integrated Gradients for tree ensembles.
  description: |
    TreeIG computes exact Integrated Gradients for supported tree models,
    including scikit-learn, XGBoost, and LightGBM. It supports weighted baseline
    distributions and includes a numerical fallback for other piecewise-constant
    models. Model libraries and CUDA support are optional dependencies.

extra:
  recipe-maintainers:
    - LudgerHentschel
