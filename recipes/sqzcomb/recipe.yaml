schema_version: 1

context:
  version: "0.12.1"

package:
  name: sqzcomb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqzcomb/sqzcomb-${{ version }}.tar.gz
  sha256: e87f59821f7a7f18ea627fdf21a4dcb52a86a1375fb72e87911a4ca289e278bc

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.10

tests:
  - python:
      imports:
        - sqzcomb
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/sqzcomb
  license: Apache-2.0
  license_file: LICENSE
  summary: "Squeezed light in Kerr microcombs: Lugiato-Lefever steady states, linearized quantum noise, detected spectra"
  description: |
    Lugiato-Lefever steady states, linearized quantum noise, detected
    squeezing spectra including loss and escape efficiency, photonic
    molecules, two-mode entanglement, and closed-form source inference
    from measured squeezing/antisqueezing pairs.
  repository: https://github.com/TaN-MM-Org/sqzcomb
  documentation: https://github.com/TaN-MM-Org/sqzcomb#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
