schema_version: 1

context:
  version: "0.13.0"

package:
  name: sqzcomb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqzcomb/sqzcomb-${{ version }}.tar.gz
  sha256: 58addba21f72fc79953cdbf5dbeb1021d6cbb95a949771370485620e74fc0a2f

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.10

tests:
  - python:
      imports:
        - sqzcomb
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/sqzcomb
  license: Apache-2.0
  license_file: LICENSE
  summary: "Squeezed light in Kerr microcombs: Lugiato-Lefever steady states, linearized quantum noise, detected spectra"
  description: |
    Lugiato-Lefever steady states, linearized quantum noise, detected
    squeezing spectra including loss and escape efficiency, photonic
    molecules (including rings with different line spacings), two-mode
    entanglement, source inference from measured squeezing/antisqueezing
    pairs and spectrum fitting, the Kerr parametric oscillator above
    threshold with an exact Fock-space master equation, classical
    (technical) noise, and pulsed pumping.
  repository: https://github.com/TaN-MM-Org/sqzcomb
  documentation: https://github.com/TaN-MM-Org/sqzcomb#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
