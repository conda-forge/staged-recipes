schema_version: 1

context:
  version: "0.19.0"

package:
  name: sqzcomb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqzcomb/sqzcomb-${{ version }}.tar.gz
  sha256: 642482658692c4f5b3af8b604c2812ace15f973290f93df62831fdd0493987c6

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.10

tests:
  - python:
      imports:
        - sqzcomb
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/sqzcomb
  license: Apache-2.0
  license_file: LICENSE
  summary: "Squeezed light from Kerr microcombs, from the field in the ring to the spectrum a detector reports"
  description: |
    Predicts squeezed light from Kerr microcombs (small optical ring
    resonators pumped by a laser) end to end: the classical field
    circulating in the ring, the quantum noise around it, and the noise a
    detector on the output fiber would report, including optical loss,
    detector electronics and local-oscillator phase jitter. It finds the
    best local-oscillator angle, compares one ring with two coupled rings,
    and checks whether two comb lines are entangled at the output.
  repository: https://github.com/TaN-MM-Org/sqzcomb
  documentation: https://github.com/TaN-MM-Org/sqzcomb#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
