context:
  version: "4.3.6"

package:
  name: deepeval
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/deepeval/deepeval-${{ version }}.tar.gz
  sha256: 8c7e0835c5a9fe81e3368e841ab1a441afb72af8996f65189972caf0c6aa4666

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0
  python:
    entry_points:
      - deepeval = deepeval.cli.main:app

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - aiohttp
    - click >=8.0.0,<8.4.0
    - confident-trace >=0.1.14,<0.2.0
    - grpcio >=1.67.1,<2.0.0
    - jinja2
    - nest-asyncio
    - openai
    - opentelemetry-api >=1.24.0,<2.0.0
    - opentelemetry-sdk >=1.24.0,<2.0.0
    - portalocker
    - posthog >=7.0.0,<8.0.0
    - pydantic >=2.11.7,<3.0.0
    - pydantic-settings >=2.10.1,<3.0.0
    - pyfiglet
    - pytest
    - pytest-asyncio
    - pytest-repeat
    - pytest-rerunfailures
    - pytest-xdist
    - python-dotenv >=1.1.1,<2.0.0
    - pyyaml >=6.0.0
    - questionary >=2.0.0,<3.0.0
    - requests >=2.31.0,<3.0.0
    - rich >=13.6.0,<15.0.0
    - setuptools
    - tabulate >=0.9.0,<0.10.0
    - tenacity >=8.0.0,<=10.0.0
    - tqdm >=4.66.1,<5.0.0
    - typer >=0.9,<1.0.0
    - wheel

tests:
  - python:
      imports:
        - deepeval
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://deepeval.com
  summary: The LLM Evaluation Framework
  description: |
    DeepEval is an open-source LLM evaluation framework, similar to Pytest
    but specialized for unit testing LLM outputs. It provides metrics such
    as G-Eval, hallucination, and answer relevancy, along with RAG, agentic,
    and conversational metrics, red teaming, benchmarks, and synthetic
    dataset generation, and integrates with the Confident AI platform.
  license: Apache-2.0
  license_file: LICENSE.md
  documentation: https://deepeval.com
  repository: https://github.com/confident-ai/deepeval

extra:
  recipe-maintainers:
    - pb01ka
