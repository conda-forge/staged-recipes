context:
  version: "0.4.8"
  python_min: "3.12"

package:
  name: claimbound-evidence
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/claimbound-evidence/claimbound_evidence-${{ version }}.tar.gz
  sha256: e4366a6cd0bbd111013198159467b9957728d835ffc73c9914df738668549e2e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - claimbound = claimbound_evidence.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-fancy-pypi-readme >=24.1.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2.5.2
    - pdfplumber >=0.11
    - pypdf >=6.16.0

tests:
  - python:
      imports:
        - claimbound_evidence
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - claimbound --version
      - claimbound doctor

about:
  homepage: https://github.com/ClaimBound/claimbound-evidence
  summary: Evidence cards for narrow public AI, ML and data claims
  description: |
    ClaimBound turns a narrow public claim into an evidence card with a frozen
    protocol, hashed sources, an exact result status, a claim boundary and a
    reproduction level. The package provides the card validator and the
    card-level command-line tools.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://claimbound.github.io/claimbound-evidence/docs/
  repository: https://github.com/ClaimBound/claimbound-evidence

extra:
  recipe-maintainers:
    - NeoZorK
