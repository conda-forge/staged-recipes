schema_version: 1

context:
  version: "0.7.0"

package:
  name: querychat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/querychat/querychat-${{ version }}.tar.gz
  sha256: 503016d130cec20c9c5bb5562296fa324a5aeebf8062506e370bc3c994614c63

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - python-duckdb
    - shiny >=1.6.2
    - shinychat >=0.6.0
    - htmltools
    - chatlas >=0.18.0
    - narwhals >=2.2.0
    - chevron
    - sqlalchemy >=2.0.0
    - great_tables >=0.16.0
    - pyyaml

tests:
  - python:
      imports:
        - querychat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Chat with your data using natural language
  license: MIT
  license_file:
    - LICENSE.md
    - pkg-py/LICENSE
  homepage: https://github.com/posit-dev/querychat
  repository: https://github.com/posit-dev/querychat/tree/main/pkg-py

extra:
  recipe-maintainers:
    - schloerke
