schema_version: 1

context:
  version: "0.9.3"

package:
  name: octavius
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/octavius/octavius-${{ version }}.tar.gz
  sha256: 8a79f4387a288fad4fd3e10979aa1f7997b34d03ac0982b65aab175b74b9e44a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - octavius = octavius.run_octavius:main

requirements:
  host:
    - python >=3.14
    - setuptools >=82.0
    - pip
  run:
    - python >=3.14
    - numpy >=2.4
    - scipy >=1.18
    - astropy >=8.0
    - h5py >=3.16
    - numba >=0.65
    - mpi4py >=4.0

tests:
  - python:
      imports:
        - octavius
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - octavius --help

about:
  summary: Simulation analysis toolkit for SPH codes with built-in galaxy finding.
  license: BSD-3-Clause
  license_file: LICENCE
  homepage: https://pypi.org/project/octavius/
  documentation: https://octavius.readthedocs.io/

extra:
  recipe-maintainers:
    - jp-duminy
