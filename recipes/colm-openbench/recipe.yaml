context:
  version: "3.0.1"

package:
  name: colm-openbench
  version: ${{ version }}

source:
  url: https://github.com/zhongwangwei/OpenBench/releases/download/v${{ version }}/colm_openbench-${{ version }}.tar.gz
  sha256: c64c9c33d4ed0a941202c35b88ebca9ba6e8e256409cbbcb15ce5d1c1cf652e1

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - openbench = openbench.cli.main:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - xarray >=0.19.0
    - numpy >=1.21.0
    - scipy >=1.7.0
    - pandas >=1.3.0
    - netcdf4 >=1.5.7
    - matplotlib-base >=3.4.0
    - cartopy >=0.20.0
    - dask-core >=2022.1.0
    - distributed >=2022.1.0
    - joblib >=1.1.0
    - flox >=0.5.0
    - pyyaml >=6.0
    - jinja2 >=3.0.0
    - click >=8.0
    - tqdm >=4.0
    - packaging >=21.0
    - scikit-learn >=1.0
    - statsmodels >=0.13
    - seaborn >=0.12
    - f90nml >=1.4.4

tests:
  - python:
      imports:
        - openbench
        - openbench.config
        - openbench.core.metrics
        - openbench.data.registry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - openbench --version
      - openbench model list
      - openbench smoke-test
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/CoLM-SYSU/OpenBench
  summary: Open Source Land Surface Model Benchmarking System
  description: |
    OpenBench benchmarks land surface models against reference datasets,
    with grid and station evaluation, scientific metrics, visualizations,
    and reports from a unified YAML configuration.
  license: MIT AND GPL-3.0-only AND LicenseRef-NCL-6.3.0
  license_file:
    - LICENSE
    - src/openbench/visualization/cmaps/LICENSE
    - src/openbench/visualization/cmaps/colormaps/ncar_ncl/Copyright
    - src/openbench/visualization/cmaps/colormaps/ncar_ncl/NCL_source_license.txt
  documentation: https://openbench.readthedocs.io
  repository: https://github.com/zhongwangwei/OpenBench

extra:
  recipe-maintainers:
    - zhongwangwei
