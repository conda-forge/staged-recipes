context:
  name: versatiles
  version: "5.4.1"
  # The workspace's `[profile.release]`, which a published crate leaves
  # behind: the settings that differ from cargo's defaults, including overflow
  # checks kept on in the crates that parse untrusted files.
  cargo_profile: >-
    --config profile.release.lto=true
    --config profile.release.codegen-units=1
    --config profile.release.strip=true
    --config profile.release.package.versatiles_core.overflow-checks=true
    --config profile.release.package.versatiles_container.overflow-checks=true
    --config profile.release.package.versatiles_geometry.overflow-checks=true

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # The published crate rather than the repository tarball: the workspace pins
  # an optional dependency to a git fork whose GDAL submodule cannot be checked
  # out on Windows (path too long), and `cargo metadata` fetches it even with
  # the feature off. crates.io resolves it to the registry release.
  - url: https://static.crates.io/crates/${{ name }}/${{ name }}-${{ version }}.crate
    sha256: 22bab81e3abecea3fd694ebdbd12d60d171a678ac79b0013458aca2a1d99adba
  # The crate does not include the licence file.
  - url: https://raw.githubusercontent.com/versatiles-org/versatiles-rs/v${{ version }}/LICENSE
    sha256: 41d4ca2336e27cc4de873d173946db1f450e4487014288789718aa1269479dcf
    file_name: LICENSE
  # Only for the licence of libwebp, which libwebp-sys 0.14 compiles in
  # statically from a vendored 1.6.0: THIRDPARTY.yml carries the crate's MIT
  # licence, not libwebp's own. The vendored copies of zstd and aws-lc have
  # theirs in THIRDPARTY.yml already, and SQLite is public domain.
  - url: https://github.com/webmproject/libwebp/archive/refs/tags/v1.6.0.tar.gz
    sha256: 93a852c2b3efafee3723efd4636de855b46f9fe1efddd607e1f42f60fc8f2136
    target_directory: libwebp

build:
  number: 0
  script:
    # Short paths for cargo's checkouts, which Windows otherwise exceeds.
    - if: win
      then:
        - set CARGO_HOME=C:\\.cargo
        - md %CARGO_HOME%
    # rattler-build does not unpack `.crate` files.
    - tar -xzf ${{ name }}-${{ version }}.crate --strip-components=1
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - if: unix
      then: cargo install --locked --no-track --bins --root ${{ PREFIX }} --path . ${{ cargo_profile }}
      else: cargo install --locked --no-track --bins --root %LIBRARY_PREFIX% --path . ${{ cargo_profile }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    # aws-lc-sys, the TLS backend of reqwest and russh
    - cmake
    - if: win
      then: nasm

tests:
  - package_contents:
      bin:
        - versatiles
  # Generated tiles, so the package doesn't carry test data: renders PNG,
  # writes MBTiles (bundled SQLite), then reads it back into PMTiles.
  - script:
      - versatiles --version
      - versatiles convert --max-zoom 3 "[,vpl](from_debug format=png)" test.mbtiles
      - versatiles convert test.mbtiles test.pmtiles
      - versatiles probe test.pmtiles

about:
  homepage: https://versatiles.org
  repository: https://github.com/versatiles-org/versatiles-rs
  documentation: https://docs.versatiles.org
  summary: Convert, serve and process map tiles (VersaTiles, PMTiles, MBTiles, tar)
  description: |
    VersaTiles is a toolbox for map tiles. The `versatiles` command converts
    between tile containers (VersaTiles, PMTiles, MBTiles, tar and folders),
    serves them over HTTP, and transforms them with VPL pipelines: filtering,
    merging, recompressing, and raster and vector tile processing.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
    - libwebp/COPYING
    - libwebp/PATENTS

extra:
  recipe-maintainers:
    - MichaelKreil
