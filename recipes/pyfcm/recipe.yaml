schema_version: 1

context:
  version: "2.1.1"

package:
  name: pyfcm
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pyfcm/pyfcm-${{ version }}.tar.gz
  sha256: d98ad804785a2be3999746898f7582fb1b52e7b541ccb61836ad3f8f180fea5e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - urllib3 >=1.26.0
    - google-auth >=2.22.0
    - aiohttp >=3.8.6

tests:
  - python:
      imports:
        - pyfcm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python client for FCM - Firebase Cloud Messaging (Android, iOS and Web)
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/olucurious/pyfcm

extra:
  recipe-maintainers:
    - HeavyTony2
