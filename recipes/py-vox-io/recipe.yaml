context:
  version: "0.1"

package:
  name: py-vox-io
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/py-vox-io/py-vox-io-${{ version }}.tar.gz
  sha256: fcfe119838ae1b70b6b7ef27cfcbda117572c451929e124e2870ff609a4407a9

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyvox
        - pyvox.models
        - pyvox.parser
        - pyvox.writer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gromgull/py-vox-io
  summary: A Python parser and writer for the MagicaVoxel .vox format
  description: |
    py-vox-io reads and writes MagicaVoxel .vox files, giving access to the
    voxel models, palettes and materials as Python objects and numpy arrays.
  license: MIT
  # The PyPI sdist ships no licence file; this is the LICENSE from the upstream
  # repository (https://github.com/gromgull/py-vox-io/blob/master/LICENSE).
  license_file: LICENSE
  repository: https://github.com/gromgull/py-vox-io

extra:
  recipe-maintainers:
    - kunifujiwara
