context:
  version: "0.0.3"

package:
  name: pmd-net-proto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pmd_net_proto/pmd_net_proto-${{ version }}.tar.gz
  sha256: e23d7d68cd13399ff2bf0613f9756e221ead6fd54010cf85186c2ab650631cd7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - pmd-net-addr ==0.0.3
    - typing_extensions >=4.6

tests:
  - python:
      imports:
        - pmd_net_proto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ccie18643/PyTCP
  summary: Network protocol classes from the PyTCP stack
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
