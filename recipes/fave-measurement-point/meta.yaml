{% set name = "fave-measurement-point" %}
{% set version = "0.1.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/fave_measurement_point-{{ version }}.tar.gz
  sha256: 9a13075674e2f5f753bd06f112a766e23764d7692c6b38ec7cbe6a82b58c0690

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >={{ python_min }},<3.14
    - numpy <=2.2

test:
  imports:
    - fave_measurement_point
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://pypi.org/project/fave-measurement-point
  summary: A library for defining and evaluating formant measurement point heuristics.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - IvoLeist
