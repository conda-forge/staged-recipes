schema_version: 1

context:
  python_min: "3.10"
  version: "0.1.5"

package:
  name: metamorph-mda-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/metamorph-mda-parser/metamorph_mda_parser-${{ version }}.tar.gz
  sha256: 3acb3874ef84c70c000805a74e613350726dcea591dc92838b0a4daea6ba43a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling ==1.26.3
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - lark
    - pandas
    - pydantic

tests:
  - python:
      imports:
        - metamorph_mda_parser
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Light-weight parsing of Metamorph/VisiView .nd files.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/metamorph-mda-parser/
  repository: https://github.com/fmi-faim/metamorph-mda-parser
  documentation: https://github.com/fmi-faim/metamorph-mda-parser

extra:
  recipe-maintainers:
    - imagejan
