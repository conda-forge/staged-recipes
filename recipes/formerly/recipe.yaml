context:
  version: "0.1.0"

package:
  name: formerly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/formerly/formerly-${{ version }}.tar.gz
  sha256: e30ce1f317b3a05689aea057faa3bc4ec89a105ba5a48433ca9899ac1bf69a62

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - formerly
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    script:
      - pytest tests

about:
  homepage: https://github.com/scrapy/formerly
  summary: Deprecate a class that users inherit from
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/scrapy/formerly

extra:
  recipe-maintainers:
    - AdrianAtZyte
    - kmike
    - wRAR
