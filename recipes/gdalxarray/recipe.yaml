context:
  name: gdalxarray
  version: "0.5.1"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: fb5948da8f33b20d40f5d784cc19606344aa9f46802fd992d8c476ee8b6b8cb0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - gdal
    - affine
    - numpy
    - packaging
    - rasterix >=0.2,<0.3
    - xarray >=2025.6
    - xproj

tests:
  - python:
      imports:
        - gdalxarray
        - gdalxarray.backend
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - python -c "import xarray as xr; assert 'gdalxarray' in xr.backends.list_engines()"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/hypertidy/gdalxarray
  repository: https://github.com/hypertidy/gdalxarray
  summary: GDAL backend for xarray
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - mdsumner
