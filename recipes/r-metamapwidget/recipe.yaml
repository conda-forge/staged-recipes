context:
  version: "0.1.0"

package:
  name: r-metamapwidget
  version: ${{ version }}

source:
  url: https://github.com/grunwaldlab/metaMapWidgetR/archive/refs/tags/${{ version }}.tar.gz
  sha256: "b3dd25235c726f5ae212a1c803f9877f14eace9cf075b9471772fb3eed2291f4"
            
build:
  noarch: generic
  number: 0
  script: R CMD INSTALL --build .
            
requirements:
  host:
    - r-base
    - r-htmlwidgets
    - r-rmarkdown
    - r-sass
  run:
    - r-base
    - r-htmlwidgets
    - r-rmarkdown
    - r-sass
  run_exports:
    - ${{ pin_subpackage("r-metamapwidget", upper_bound="x.x") }}
            
tests:
  - script:
    - R -e "library('metaMapWidgetR')"
    
about:
  homepage: https://github.com/grunwaldlab/metaMapWidgetR
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'R wrapper for the meta-map-widget JS package.'

extra:
  recipe-maintainers:
    - worthyc51
