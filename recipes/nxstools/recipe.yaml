schema_version: 1

context:
  version: "4.63.0"

package:
  name: nxstools
  version: ${{ version }}

source:
  url: https://github.com/nexdatas/nxstools/archive/refs/tags/v${{ version }}.tar.gz
  sha256: be00038fa7d9e1a9c0ceb71199dedd998edb22f5c82d88e161f4de0bb5114ca9
  patches:
    - add-windows-support.patch

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:  
    entry_points:
      - nxsconfig = nxstools.nxsconfig:main
      - nxscreate = nxstools.nxscreate:main
      - nxsdata = nxstools.nxsdata:main 
      - nxsetup = nxstools.nxsetup:main 
      - nxsfileinfo = nxstools.nxsfileinfo:main 
      - nxscollect = nxstools.nxscollect:main 

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - argcomplete
    - lxml
    - pytz
    - pyyaml
    - pytango
    - python-dateutil
    - pninexus
    - fabio
    - h5py
    - matplotlib-base
    - blissdata
    # - blissdata-h5file-detector

tests:
  - python:
      imports:
        - nxstools
        - nxstools.filewriter
        - nxstools.filenamegenerator
        - nxstools.nxsargparser
        - nxstools.nxsdevicetools
        - nxstools.nxscollect
        - nxstools.nxsconfig
        - nxstools.nxscreate
        - nxstools.nxscreator
        - nxstools.nxsdata 
        - nxstools.nxsetup
        - nxstools.nxsfileinfo
        - nxstools.nxsfileparser
        - nxstools.nxsparser
        - nxstools.nxsxml
        - nxstools.ontology
        - nxstools.pyeval.lambdavds
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - if: unix or osx
        then:
          - test -x "$PREFIX/bin/nxsconfig"
          - test -x "$PREFIX/bin/nxscreate"
          - test -x "$PREFIX/bin/nxsdata"
          - test -x "$PREFIX/bin/nxsetup"
          - test -x "$PREFIX/bin/nxsfileinfo"
          - test -x "$PREFIX/bin/nxscollect"
          - nxsconfig --help
          - nxscreate --help
          - nxsdata --help
          - nxsetup --help
          - nxsfileinfo --help
          - nxscollect --help
    requirements:
      run:
        - python ${{ python_min }}.*


about:
  homepage: https://github.com/nexdatas/nxstools
  repository: https://github.com/nexdatas/nxstools
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: NeXDaTaS configuration tools (nxsconfig, nxscreate, nxsdata, nxscollect, nxsetup, nxsfileinfo)
  description: |
    Command-line tools for Nexus Data Writer - python3 module
    It provides command-line tools to communicate with Tango servers:
    NXSDataWriter and NXSConfigServer as well as to create simple 
    datasources and components containing writer's configuration.
    It contains also python modules used by NXSDataWriter server
    to write NeXus files and publish metadata into blissdata.

extra:
  recipe-maintainers:
    - jkotan
