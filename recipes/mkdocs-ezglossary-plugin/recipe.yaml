schema_version: 1

context:
  version: 2.1.0
  build_number: '0'

package:
  name: mkdocs-ezglossary-plugin
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/mkdocs-ezglossary-plugin/mkdocs_ezglossary_plugin-${{ version }}.tar.gz
  sha256: 1494041d005caea7a15189d095daf7e13e9ed3249adc3df9af50683e615002c3

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - inflect >=7.0.0
    - jinja2
    - mkdocs >=1.1.0

tests:
  - python:
      imports:
        - mkdocs_ezglossary_plugin
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/realtimeprojects/mkdocs-ezglossary
  summary: A powerful glossary plugin for MkDocs
  description: A Python plugin for managing multiple glossaries in MkDocs
  license: MIT
  license_file: LICENSE
  documentation: https://realtimeprojects.github.io/mkdocs-ezglossary
  repository: https://github.com/realtimeprojects/mkdocs-ezglossary

extra:
  recipe-maintainers:
    - Zeitsperre
