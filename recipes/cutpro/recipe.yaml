context:
  name: cutpro
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cutpro-${{ version }}.tar.gz
  sha256: 3904d702fdbfbd0ba560d6cdba11778e1d7e15c1e1092c1a61266233c6af02aa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cutpro
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://cut.pro/en/models
  summary: Cut.Pro API client for video, image and voice generation (Seedance, Wan, Kling, Veo, Nano Banana, Gemini TTS)
  description: |
    Official Python SDK for the Cut.Pro API: one key for video, image and voice models,
    with sync and asyncio clients, idempotent retries and webhook verification. Standard library only.
  license: MIT
  license_file: LICENSE
  documentation: https://cut.pro/docs/en/generations
  repository: https://github.com/getcutpro/sdk-python

extra:
  recipe-maintainers:
    - ToledoSDL
