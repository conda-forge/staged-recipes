context:
  version: "0.3.1"

package:
  name: alpaca
  version: ${{ version }}

source:
  url: https://github.com/McGranahanLab/ALPACA-model/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 3ce7d4c863afe2e0f88853dde1c88c0902b0acb0a2aad07b13b4ae8551d727ae

build:
  noarch: python
  number: 0
  script: |
    export SETUPTOOLS_SCM_PRETEND_VERSION=${PKG_VERSION}
    python -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
  run:
    - __unix
    - python
    - numpy >=1.22,<3.0
    - pandas >=2.0,<3.0
    - pyomo >=6.0,<7.0
    - scipy >=1.10,<2.0
    - matplotlib-base >=3.5,<4.0
    - networkx >=3.0,<4.0
    - plotly >=5.0,<6.0
    - seaborn >=0.12,<0.14
    - tqdm >=4.60,<5.0
    - rdata >=0.5,<2.0
    - kneed
    - python-kaleido
    - scip
    - glpk

tests:
  - python:
      imports:
        - alpaca
        - alpaca.solvers
      pip_check: true
  - script:
      - alpaca --help

about:
  homepage: https://github.com/McGranahanLab/ALPACA-model
  repository: https://github.com/McGranahanLab/ALPACA-model
  license: MIT
  license_file: LICENSE
  summary: "ALPACA - Allele-specific Phylogenetic Analysis of Copy-number Aberrations"
  description: |
    ALPACA is a computational method to infer allele- and clone-specific
    copy-number profiles of tumour clones from multi-sample bulk DNA sequencing.
    The default backend is Pyomo with the SCIP solver.

    Optional dependencies:

    - Gurobi solver: users with a Gurobi license can install gurobi separately.
    - R support: some input conversion utilities require R and Rscript.

extra:
  recipe-maintainers:
    - wlippa
