context:
  version: "0.1.1"

package:
  name: widestats
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/widestats/widestats-${{ version }}.tar.gz
  sha256: ab1ccb0790f3285d18834254b5b7fbb37e4f4026bf1707589b6ba857263bd634

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.24
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - pytorch >=2.2

tests:
  - python:
      imports:
        - widestats
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # a small computation on the CPU; the GPU paths need hardware
      - python -c "import numpy as np, widestats as ws; x = np.random.default_rng(0).standard_normal((50, 30)); assert len(ws.cor_pairs(x, top=2, device='cpu')) == 60"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/nullsatz/widestats
  summary: Statistics for wide data on a GPU, on PyTorch
  description: |
    Statistics for data with far more variables than samples, where the
    questions are about every pair of variables: the strongly correlated
    pairs without forming the correlation matrix, permutation and maxT
    p-values for every correlation and every two-group t test, Granger
    causality tests for every pair of time series, and B-spline mutual
    information of every pair. A few large matrix products on the GPU
    (CUDA, Apple MPS) or the CPU, through PyTorch; a Python port of the
    R package gputools.
  license: GPL-3.0-or-later
  license_file: LICENSE
  documentation: https://nullsatz.github.io/widestats/
  repository: https://github.com/nullsatz/widestats

extra:
  recipe-maintainers:
    - nullsatz
