[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "mq-bridge-py"
# Version is read from Cargo.toml by maturin
dynamic = ["version"]
description = "Python bindings for mq-bridge (full: all brokers incl. Kafka)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "typing-extensions>=4.0",
]

license = { text = "MIT" }
license-files = ["LICENSE.python", "THIRD_PARTY_LICENSES.txt"]
keywords = ["messaging", "tokio", "pyo3", "maturin", "mq-bridge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
]

[project.optional-dependencies]
plugin-packaging = ["build>=1", "wheel>=0.45"]

[project.urls]
Homepage = "https://github.com/marcomq/mq-bridge"
Repository = "https://github.com/marcomq/mq-bridge"
Issues = "https://github.com/marcomq/mq-bridge/issues"

[dependency-groups]
dev = [
  "maturin>=1.7,<2.0",
  "pytest>=8.3",
]
bench = [
  "aiohttp>=3.10",
  "fastapi>=0.115",
  "faststream>=0.6; python_version >= '3.10'",
  "sanic>=24.6",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[tool.pytest.ini_options]
markers = [
  "performance: skipped-by-default benchmark smoke tests",
]

[tool.maturin]
bindings = "pyo3"
# `mq-bridge/full-dynamic` rather than this crate's `full`: same endpoint set,
# but librdkafka and libsqlite are linked from the environment via pkg-config
# instead of compiled from vendored C sources. `mq-bridge` is a direct
# dependency here, so the linkage feature is reachable by name; the rest of
# what `full` would have enabled is spelled out because `full` itself pins
# `link-static` and the two linkage features are mutually exclusive.
features = [
  "pyo3/extension-module",
  "mq-bridge/full-dynamic",
  "plugin",
  "rustls-aws-lc",
  "mimalloc",
  "schema",
]
module-name = "mq_bridge._mq_bridge"
python-source = "."
