schema_version: 1

context:
  version: "0.7.0"

package:
  name: labplan
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/labplan/labplan-${{ version }}.tar.gz
  sha256: 775c3fe3109923481212b4fb601cbeee94cd96d0d8770de477e6f78a0e4cdeb1

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.22

tests:
  - python:
      imports:
        - labplan
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/labplan
  license: Apache-2.0
  license_file: LICENSE
  summary: "Plan a measurement, fit the model and keep a record, for any lab model"
  description: |
    For any instrument or experiment whose readings a Python function of
    some unknown parameters can predict: check before measuring whether a
    plan can pin down the parameters and how large the error bars will be,
    choose the settings and the number of repeats, fit the model with error
    bars, test whether the readings agree with the model, and keep a record
    of what was fitted, to which data, with which software and when. When a
    plan cannot separate the parameters, it says so instead of returning
    numbers.
  repository: https://github.com/TaN-MM-Org/labplan
  documentation: https://github.com/TaN-MM-Org/labplan#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
