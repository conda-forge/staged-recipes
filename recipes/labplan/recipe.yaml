schema_version: 1

context:
  version: "0.1.1"

package:
  name: labplan
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/labplan/labplan-${{ version }}.tar.gz
  sha256: e29864a3fdcb036943462544d15c427ef42a6cb70a76bf808037d441c77d732e

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.22

tests:
  - python:
      imports:
        - labplan
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/labplan
  license: Apache-2.0
  license_file: LICENSE
  summary: "Plan, fit, and certify laboratory calibrations for any user-supplied model"
  description: |
    Fisher-information measurement planning, greedy D-optimal designs, a
    NumPy-only Levenberg-Marquardt fitter with linearized covariances,
    split-conformal prediction intervals with exact finite-sample coverage,
    and audit-ready calibration records (SHA-256 data digests, software
    versions, timestamps). Works with any forward model written as a Python
    function; flags designs that cannot determine the parameters, and
    refuses to fit or design with them, with an explanation.
  repository: https://github.com/TaN-MM-Org/labplan
  documentation: https://github.com/TaN-MM-Org/labplan#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
