# Generated by scripts/render-conda-recipe.py from python/pyproject.toml.
# Do not edit by hand — run `just conda-recipe` instead.
#
# This is the recipe submitted to conda-forge/staged-recipes to create the
# metaframe-widget-feedstock. Once the feedstock exists, conda-forge's autotick bot
# opens the version bumps there; see docs/development/deployment.md.
schema_version: 1

context:
  version: "0.3.12"

package:
  name: metaframe-widget
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/metaframe-widget/metaframe_widget-${{ version }}.tar.gz
  sha256: 46c44853ab3244ceadc2d5af09d10c6a989e7d606630fe300be36a0ac426e858

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anywidget >=0.9.0
    - traitlets >=5.0.0

tests:
  - python:
      imports:
        - metaframe_widget
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/metapages/framejs.io
  summary: anywidget for embedding metaframe URLs in Jupyter and marimo notebooks
  description: |
    metaframe-widget is an anywidget for embedding framejs.io and metapage URLs in
    Jupyter and marimo notebooks. A widget is created from a URL, so the code and
    data live in the URL rather than in the notebook: pass inputs in from Python,
    read outputs back out as they change, and pipe one widget's outputs into
    another widget's inputs.
  license: MIT
  license_file: LICENSE
  documentation: https://framejs.io/docs
  repository: https://github.com/metapages/framejs.io

extra:
  recipe-maintainers:
    - dionjwa
