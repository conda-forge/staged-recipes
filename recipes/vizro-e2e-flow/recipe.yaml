schema_version: 1

context:
  version: "0.1.7"

package:
  name: vizro-e2e-flow
  version: ${{ version }}

source:
  url: https://github.com/mckinsey/vizro/archive/refs/tags/vizro-e2e-flow-${{ version }}.tar.gz
  sha256: e42331df75bde0b6f96d7098fc8c40cb02ae4f4b526af044146aea15b6cd10a7

build:
  number: 0
  noarch: generic
  script:
    - if: unix
      then:
        - mkdir -p $PREFIX/share/agent-skills
        - cp -R vizro-e2e-flow/skills/. $PREFIX/share/agent-skills/
      else:
        - xcopy /E /I /Y vizro-e2e-flow\skills %PREFIX%\share\agent-skills

requirements:
  # The skills call `uv run`, and may use nodejs.
  # ref: https://github.com/mckinsey/vizro/tree/main/vizro-e2e-flow#requirements
  run:
    - python >=${{ python_min }}
    - uv
    - nodejs

tests:
  - package_contents:
      files:
        - share/agent-skills/dashboard-build/SKILL.md
        - share/agent-skills/dashboard-design/SKILL.md
        - share/agent-skills/designing-vizro-layouts/SKILL.md
        - share/agent-skills/selecting-vizro-charts/SKILL.md
        - share/agent-skills/wiring-vizro-actions/SKILL.md
        - share/agent-skills/writing-vizro-yaml/SKILL.md

about:
  summary: Agent skills for end-to-end Vizro dashboard development
  description: |
    Vizro e2e flow is a set of agent skills for end-to-end Vizro dashboard
    development, organized into a 2-phase workflow (dashboard-design and
    dashboard-build) with supporting reference skills (designing-vizro-layouts,
    selecting-vizro-charts, writing-vizro-yaml, wiring-vizro-actions).
    The skills are installed into share/agent-skills and can be configured
    for supported coding agents with pixi-skills.
  license: Apache-2.0
  license_file: vizro-e2e-flow/LICENSE.txt
  homepage: https://github.com/mckinsey/vizro/tree/main/vizro-e2e-flow
  repository: https://github.com/mckinsey/vizro
  documentation: https://vizro.readthedocs.io

extra:
  recipe-maintainers:
    - soapy1
