schema_version: 1

context:
  version: "0.1.0"

package:
  name: r-brand.yml
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/brand.yml_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/brand.yml/brand.yml_${{ version }}.tar.gz
  sha256: ee179ebaf4dd9e70564697048dbb59500aeb62183db829eb345dd39f01b9280e

build:
  number: 0
  noarch: generic
  script: R CMD INSTALL --build .

requirements:
  host:
    - r-base >=4.1.0
    - r-cli
    - r-rlang >=1.1.0
    - r-yaml
  run:
    - r-base >=4.1.0
    - r-cli
    - r-rlang >=1.1.0
    - r-yaml

tests:
  - r:
      libraries:
        - brand.yml

about:
  homepage: https://posit-dev.github.io/brand-yml/pkg/r/
  repository: https://github.com/posit-dev/brand-yml
  summary: Unified Branding with a Simple YAML File
  description: |
    Read and process 'brand.yml' 'YAML' files. 'brand.yml' is a simple,
    portable 'YAML' file that codifies your company's brand guidelines into a
    format that can be used by 'Quarto', 'Shiny' and 'R' tooling to create
    branded outputs. Maintain unified, branded theming for web applications to
    printed reports to dashboards and presentations with a consistent look and
    feel.
  license: MIT
  license_file:
    - LICENSE
    - LICENSE.md

extra:
  recipe-maintainers:
    - apeltzer
    - conda-forge/r
