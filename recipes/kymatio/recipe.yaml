schema_version: 1

context:
  name: kymatio
  version: "0.3.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # PyPI only ships a wheel for 0.3.0, so use the GitHub tag archive
  url: https://github.com/kymatio/kymatio/archive/refs/tags/${{ version }}.tar.gz
  sha256: f94b8ef1aedc1d2b1c2f829405b0eb670831d8aad2bebd7f185318692b8dcfb3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    # kymatio 0.3.0 imports scipy.special.sph_harm, removed in scipy 1.17
    - scipy <1.17
    - appdirs
    - configparser
    - packaging

tests:
  - python:
      imports:
        - kymatio
        - kymatio.numpy
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - pytest -v tests/scattering1d/test_numpy_scattering1d.py tests/scattering2d/test_numpy_scattering2d.py tests/scattering3d/test_numpy_scattering3d.py
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - scikit-learn
    files:
      source:
        - tests/

about:
  homepage: https://www.kymat.io
  summary: Wavelet scattering transforms in Python with GPU acceleration
  description: |
    Kymatio is an implementation of the wavelet scattering transform in the
    Python programming language, suitable for large-scale numerical experiments
    in signal processing and machine learning. Scattering transforms are
    translation-invariant signal representations implemented as convolutional
    networks whose filters are not learned, but fixed (as wavelet filters).
    Kymatio supports NumPy, scikit-learn, PyTorch, TensorFlow/Keras and JAX
    frontends.
  license: BSD-3-Clause
  license_file: LICENSE.md
  documentation: https://www.kymat.io/codereference.html
  repository: https://github.com/kymatio/kymatio

extra:
  recipe-maintainers:
    - carlodri
