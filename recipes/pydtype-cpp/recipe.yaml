schema_version: 1

context:
  version: "0.1.0"

package:
  name: pydtype-cpp
  version: "${{ version }}"

source:
  url: https://github.com/blackbox-tech/pydtype/archive/refs/tags/${{ version }}.tar.gz
  sha256: ce104e7cfc0538f68c370833b4b0101597a3d1330df8dc7c1b51de4719cdf765

build:
  noarch: generic
  number: 0
  script:
    - "{{ PYTHON }} -c \"import shutil, os; dst = os.path.join(os.environ['PREFIX'], 'include', 'pydtype'); os.makedirs(dst, exist_ok=True); shutil.copy('include/pydtype/desc.hpp', dst)\""

requirements:
  host:
    - python >=3.8
  run:
    - python >=3.8

tests:
  - script:
      - "${{ PYTHON }} -c \"import os; assert os.path.exists(os.path.join(os.environ['PREFIX'], 'include', 'pydtype', 'desc.hpp'))\""

about:
  homepage: https://github.com/blackbox-tech/pydtype
  license: MIT
  license_file: LICENSE
  summary: "Compile time C++26 header exposing C structs to numpy dtypes"

extra:
  recipe-maintainers:
    - blackbox-tech
