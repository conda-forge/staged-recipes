schema_version: 1

context:
  name: escape-fel
  version: "0.2.17"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace("-", "_") }}-${{ version }}.tar.gz
  sha256: 5d90a8c69b3b07ba7f352a00ee071498adfd4b332ab23201bf8711256ea8c2ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - dask >=2024.6.0
    - distributed >=2024.6.0
    - h5py
    - zarr
    - hickle
    - tqdm
    - rich
    - matplotlib-base
    - pandas
    - adjusttext
    - ipywidgets
    - ipython
    - lazy-object-proxy
    - oschmod

tests:
  - python:
      imports:
        - escape
        - escape.storage
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "import escape; print(escape.__version__)"

about:
  homepage: https://github.com/htlemke/escape-fel
  summary: Event-based data framework for free-electron lasers
  description: |
    escape (Event Synchronous Categorisation And Processing Environment) is a
    high-level, object-oriented framework for processing event-based data from
    free-electron laser experiments. It pairs raw measurement arrays with pulse
    IDs and scan metadata, and provides index-aligned arithmetic, scan-step
    aggregation, and HDF5/zarr storage.
  license: MIT
  license_file: LICENSE
  documentation: https://escape-fel.readthedocs.io

extra:
  recipe-maintainers:
    - htlemke
