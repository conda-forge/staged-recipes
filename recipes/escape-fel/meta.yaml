{% set name = "escape-fel" %}
{% set version = "0.2.2" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 4a6c904fcace68f4caa5673c5278cd7899e3b2057ed257e699c73d187c2c4e42

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - dask
    - distributed
    - h5py
    - zarr
    - hickle
    - tqdm
    - rich
    - matplotlib-base
    - pandas
    - adjusttext
    - ipywidgets
    - ipython
    - lazy-object-proxy
    - oschmod

test:
  requires:
    - python {{ python_min }}
  imports:
    - escape
    - escape.storage
  commands:
    - python -c "import escape; print(escape.__version__)"

about:
  home: https://github.com/htlemke/escape-fel
  summary: Event-based data framework for free-electron lasers
  description: |
    escape (Event Synchronous Categorisation And Processing Environment) is a
    high-level, object-oriented framework for processing event-based data from
    free-electron laser experiments. It pairs raw measurement arrays with pulse
    IDs and scan metadata, and provides index-aligned arithmetic, scan-step
    aggregation, and HDF5/zarr storage.
  license: MIT
  license_file: LICENSE
  doc_url: https://escape-fel.readthedocs.io

extra:
  recipe-maintainers:
    - htlemke
