schema_version: 1

context:
  name: xconv2
  version: "0.3.1"
  python_min: "3.12"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xconv2/xconv2-${{ version }}.tar.gz
  sha256: 9cd7b1dbf9eae2f954c100e9495897b13de4b1b95af69d7683b213e62892d958

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install .

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - cartopy
    - cf-plot >=3.5.0
    - cf-python >=3.21.0
    - cryptography
    - esmpy
    - fsspec
    - jsonschema
    - numpy
    - pandas
    - paramiko
    - pillow
    - prov
    - pyfive >=1.2.0
    - pyside6
    - pystac-client
    - rdflib
    - s3fs
    - setuptools >80
    - superqt
    - udunits2
    - umfive >=0.4.0
    - zarr

tests:
  - python:
      imports:
        - xconv2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests
        - data
    requirements:
      run:
        - pytest >6.0.0
        - pytest-cov
        - pytest-html
        - pytest-xdist
        - python ${{ python_min }}.*
    script:
      - which xconv2
      - pytest -m "not integration"

about:
  homepage: https://github.com/NCAS-CMS/xconv2
  repository: https://github.com/NCAS-CMS/xconv2
  license: MIT
  license_file: LICENSE
  summary: Graphical interface for viewing and processing weather and climate data
  description: |
    xconv2 provides a graphical interface for viewing and processing
    local and remote weather and climate data.

extra:
  recipe-maintainers:
    - valeriupredoi
