schema_version: 1

context:
  name: genesis-world
  version: "1.3.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/Genesis-Embodied-AI/genesis-world/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b7ef47f0ff694fc93d31b7a195786aff0c6c7790376ee415345543202f5cb914
  patches:
    # Remove once upstream metadata no longer conflicts with conda-forge's
    # moviepy stack and the optional binary helpers can be redistributed.
    - patches/0001-relax-conda-runtime-metadata.patch
    # Remove once the restricted IsaacGym helper is no longer shipped or is
    # made optional upstream without importing it at module load time.
    - patches/0002-drop-restricted-isaacgym-helper.patch

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - gs = genesis._main:main
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
    - cython >=3.0.0
    - numpy >=1.26.4
  run:
    - python >=${{ python_min }},<3.14
    - av
    - coacd
    - dracopy
    - fast-simplification >=0.1.12
    - freetype-py
    - frozendict
    - igl !=2.6.2
    - moviepy >=2.0.0
    - mujoco >=3.2.5
    - numba
    - numpy >=1.26.4
    - openexr-python
    - pillow >=10,<12
    - psutil
    - py-cpuinfo
    - py-opencv
    - pycollada
    - pydantic >=2.11.0
    - pygel3d
    - pyglet >=1.5,!=2.1.8
    - pygltflib >=1.16.0,<1.17
    - pymeshlab
    - pyopengl >=3.1.4
    - pysplashsurf >=0.14,<0.15
    - pytorch >=2.8
    - python-tetgen ==0.8.2
    - quadrants ==1.3.0
    - rtree
    - scikit-image
    - trimesh >=4.8.2
    - vtk
    - xacro
    - z3-solver <4.15.5.0

tests:
  - script:
      - python -c "import genesis; import genesis.vis.batch_renderer"
      - pip check
      - python run_test.py
      - gs --help
    files:
      recipe:
        - run_test.py
    requirements:
      run:
        - python ${{ python_min }}.*
        - pip
        # Keep the CI smoke test CPU-only without constraining package users.
        - if: linux
          then: pytorch * cpu_*
        - if: linux
          then: viskores * cpu_*

about:
  homepage: https://genesis-embodied-ai.github.io/
  summary: Universal and generative physics engine for robotics and embodied AI
  license: Apache-2.0 AND MIT AND OFL-1.1
  license_file:
    - LICENSE
    - LICENSE-vendored-pyrender-urdfpy
    - LICENSE-vendored-fonts
  repository: https://github.com/Genesis-Embodied-AI/genesis-world
  documentation: https://genesis-world.readthedocs.io/

extra:
  recipe-maintainers:
    - jeongseok-meta
