# Dawn sets its minimum macOS deployment target to 12.0
c_stdlib_version:  # [osx]
  - "12.0"         # [osx]
# The Metal backend uses newer SDK symbols (e.g. MTLGPUFamilyApple9) behind
# @available checks, so it needs a newer SDK than the deployment target.
MACOSX_SDK_VERSION:  # [osx]
  - "15.5"           # [osx]
