context:
  version: "20260929.200159"
  # Commits pinned by Dawn's git submodules at this version.
  # Only gl.xml is needed from the OpenGL registry; EGL headers come from the EGL registry.
  opengl_registry_commit: 1cdd228e34966dd6b95bd203e9f84faba0f371a1
  egl_registry_commit: db3425b8246136faccb5e2782b5694960bd6edf1

package:
  name: dawn
  version: ${{ version }}

source:
  - url: https://github.com/google/dawn/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 1d3bbe20e1c0e1344db888440b0a9698a8e73a2598b76757617f3b1a8c817dc4
    patches:
      - 0001-Link-imported-dependencies-into-the-monolithic-library.patch
  - url: https://raw.githubusercontent.com/KhronosGroup/OpenGL-Registry/${{ opengl_registry_commit }}/xml/gl.xml
    sha256: b9ca2cfa5c676e901c20d34af3407f1687cde0f1336a5ff7a8974d04c7494ad3
    target_directory: third_party/OpenGL-Registry/src/xml
  - url: https://github.com/KhronosGroup/EGL-Registry/archive/${{ egl_registry_commit }}.tar.gz
    sha256: 3d6b42b23da8030f5b29ade07d7384c5f885e713f17f04650f6cd4b8329b88e8
    target_directory: third_party/EGL-Registry/src

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    # Used by Dawn's code generators
    - python >=3.10
    - jinja2
  host:
    - libabseil
    - spirv-headers
    # Tint's SPIR-V reader uses the private headers in include/spirv-tools-private
    - spirv-tools
    - if: not osx
      then:
        - libvulkan-headers
        - vulkan-utility-libraries
    - if: linux
      then:
        - xorg-libx11
        - xorg-xorgproto
  ignore_run_exports:
    # Only the header-only Vulkan::UtilityHeaders target is used, and libX11
    # is loaded at runtime with dlopen.
    from_package:
      - if: not osx
        then: vulkan-utility-libraries
      - if: linux
        then: xorg-libx11
  run:
    # Tint uses the internal spvtools::opt C++ API, which is not ABI stable
    - ${{ pin_compatible('spirv-tools', upper_bound='x.x') }}
    # Dawn loads the Vulkan loader at runtime
    - if: linux
      then:
        - libvulkan-loader

tests:
  - package_contents:
      lib:
        - webgpu_dawn
      include:
        - webgpu/webgpu.h
        - dawn/webgpu_cpp.h
      files:
        - ${{ "Library/" if win }}lib/cmake/Dawn/DawnConfig.cmake
  - files:
      recipe:
        - test/
    requirements:
      run:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
    script:
      - cmake -S test -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build build
      - if: win
        then: build\dawn_test.exe
        else: ./build/dawn_test

about:
  homepage: https://dawn.googlesource.com/dawn
  repository: https://github.com/google/dawn
  documentation: https://dawn.googlesource.com/dawn/+/HEAD/docs/
  summary: Dawn, a WebGPU implementation
  description: |
    Dawn is an open-source and cross-platform implementation of the WebGPU
    standard. It exposes a C/C++ API that maps almost one-to-one to the
    WebGPU IDL and can be managed as part of a larger system such as a Web
    browser. Dawn provides several WebGPU building blocks, including the
    Tint shader compiler, and backends for D3D11, D3D12, Metal, Vulkan and
    OpenGL.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmaarrfk
