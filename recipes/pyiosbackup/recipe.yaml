context:
  version: "0.2.4"

package:
  name: pyiosbackup
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyiosbackup/pyiosbackup-${{ version }}.tar.gz
  sha256: 10b4d2a11c9bedc93a5467cad3addbe18bc2dc434156920e7223226ed4d0beb7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyiosbackup=pyiosbackup.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - bpylist2 >=4.0.1
    - cryptography >=35.0.0
    - packaging
    - construct
    - click

tests:
  - python:
      imports:
        - pyiosbackup
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - pyiosbackup --help

about:
  homepage: https://github.com/matan1008/pyiosbackup
  summary: Parse iOS backups
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
