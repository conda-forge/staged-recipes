{% set version = "0.1.9" %}

package:
  name: tilelang
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/tilelang/tilelang-{{ version }}.tar.gz
  sha256: 287f727c913bb648fcf6c1968809ba3390e55eeed257a5c6bb9a80bc05966af4
  patches:
    # Stop shipping the vendored CUTLASS headers; resolve them from the prefix,
    # where the `cutlass` package installs them.
    - patches/0001-do-not-vendor-cutlass.patch
    # Composable Kernel is only used by the ROCm/HIP backend, which is not
    # enabled here.
    - patches/0002-do-not-vendor-composable-kernel.patch

build:
  skip: true  # [win or (is_abi3 and not is_python_min)]
  number: 0
  python_version_independent: true   # [is_abi3]
  script:
    - export CMAKE_GENERATOR=Ninja
    - export CMAKE_ARGS="$CMAKE_ARGS -DCUDAToolkit_ROOT=$BUILD_PREFIX"
    # Look for Z3 in conda prefix
    - sed -i.bak 's/NO_DEFAULT_PATH//g' cmake/pypi-z3/FindZ3.cmake
    # The patches above stop these from being packaged; delete them so the build
    # cannot pick them up either. CUTLASS comes from the `cutlass` package and
    # Composable Kernel is only needed for the ROCm/HIP backend.
    - rm -rf 3rdparty/cutlass 3rdparty/composable_kernel
    - export USE_CUDA=OFF                # [cuda_compiler_version == "None"]
    - export USE_CUDA="${BUILD_PREFIX}"  # [cuda_compiler_version != "None"]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}  # [cuda_compiler_version != "None"]
    - {{ stdlib('c') }}
    - cmake >=3.18
    - ninja
    - make
  host:
    - python
    - pip
    - cython >=3.1.0
    - scikit-build-core
    - pybind11
    - patchelf >=0.17.2  # [linux]
    - cuda-cudart-dev    # [cuda_compiler_version != "None"]
    - libcudnn-dev       # [cuda_compiler_version != "None"]
    - libcublas-dev      # [cuda_compiler_version != "None"]
    - libcurand-dev      # [cuda_compiler_version != "None"]
    - libz3
    - z3-solver >=4.13.0,<4.15.5
    - python-abi3      # [is_abi3]
    - apache-tvm-ffi >=0.1.2,<=0.1.11
  run:
    - python
    - apache-tvm-ffi >=0.1.2,<=0.1.11
    - cloudpickle
    - ml_dtypes
    - numpy >=1.23.5
    - psutil
    - pytorch >=2.4
    - tqdm >=4.62.3
    - typing_extensions >=4.10.0
    - libz3
    - z3-solver >=4.13.0,<4.15.5
    # jit-compiling a torch extension needs setuptools on darwin
    - setuptools  # [osx]
    - torch-c-dlpack-ext
    # Header-only, and only consumed by the CUDA JIT at runtime (passed to nvcc
    # as an -I flag), so it is not needed at build time.
    - cutlass  # [cuda_compiler_version != "None"]

test:
  imports:
    - tilelang
    # tilelang has no `cpu`/`cuda` submodules; these cover the DSL, the lowering
    # pipeline (which is what consumes CUTLASS_INCLUDE_DIR) and the utils.
    - tilelang.language
    - tilelang.engine
    - tilelang.utils
  commands:
    - pip check
    # Neither of these is vendored any more
    - test ! -d $SP_DIR/tilelang/3rdparty/cutlass
    - test ! -d $SP_DIR/tilelang/3rdparty/composable_kernel
    # ...so check that the JIT still finds CUTLASS, now in the prefix
    - python -c 'import tilelang.env as e; print(e.CUTLASS_INCLUDE_DIR)'  # [cuda_compiler_version != "None"]
    - test -f "$(python -c 'import tilelang.env as e; print(e.CUTLASS_INCLUDE_DIR)')/cutlass/cutlass.h"  # [cuda_compiler_version != "None"]
    - abi3audit $SP_DIR/tilelang/lib/tilelang_cython_wrapper.abi3.so -s -v --assume-minimum-abi3 {{ python_min }}  # [unix and is_abi3]
  requires:
    - pip
    - abi3audit                      # [is_abi3]

about:
  home: https://github.com/tile-ai/tilelang
  summary: A tile level programming language to generate high performance code.
  license: Apache-2.0 AND BSD-3-Clause AND Unlicense AND MIT AND BSD-2-Clause
  license_file:
    - LICENSE
    - THIRDPARTYNOTICES.txt
    - 3rdparty/tvm/LICENSE
    - 3rdparty/tvm/NOTICE

extra:
  recipe-maintainers:
    - 1minds3t
    - isuruf
