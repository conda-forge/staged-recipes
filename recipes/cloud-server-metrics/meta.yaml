{% set name = "cloud-server-metrics" %}
{% set version = "1.0.0" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/iadminiserversupport/cloud-server-metrics/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 997f55d63d32ed7d0ece0cf7ca830f719daa0f013cee6b74cc4cd96de20d3a63

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=68
  run:
    - python >= {{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - cloud_server_metrics
  commands:
    - python -c "from cloud_server_metrics import collect_metrics; print(collect_metrics())"

about:
  home: https://iserversupport.com/cloud-server-management/
  summary: Lightweight Python package for collecting basic cloud server health metrics.
  description: |
    Collect basic cloud server health and runtime metrics using Python.
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/iadminiserversupport/cloud-server-metrics

extra:
  recipe-maintainers:
    - iadminiserversupport
