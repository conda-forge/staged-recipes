{% set name = "agent-memory-guard" %}
{% set version = "0.3.2" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/agent_memory_guard-{{ version }}.tar.gz
  sha256: 8e2506ce0f056c413f08f4e1bc52217af69795a28b6156d59388edda710d75d4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - amg = agent_memory_guard.cli:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=68
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - pyyaml >=6.0

test:
  imports:
    - agent_memory_guard
  commands:
    - pip check
    - amg --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://owasp.org/www-project-agent-memory-guard/
  summary: Runtime defense layer that protects AI agent memory from poisoning (OWASP Agent Memory Guard)
  description: |
    OWASP Agent Memory Guard is an open-source runtime guard for the persistent
    memory of AI agents. It validates memory writes with content detectors,
    attaches source-class provenance to each record, keeps integrity baselines
    on protected keys, and supports quarantine and rollback. Addresses ASI06
    (Memory & Context Poisoning) in the OWASP Top 10 for Agentic Applications.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.md
  doc_url: https://owasp.org/www-project-agent-memory-guard/
  dev_url: https://github.com/OWASP/www-project-agent-memory-guard

extra:
  recipe-maintainers:
    - vgudur-dev
