context:
  version: "9.0.1"

package:
  name: rqbit
  version: ${{ version }}

source:
  url: https://github.com/ikatson/rqbit/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 62a42c56259b737eea6580b63061589dc9940b145c40991cfff83470aa783291

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - cd crates/rqbit
      - if: unix
        then:
          - cargo auditable install --path=. --root="$PREFIX" --no-track --locked --bins
          # generate shell completions
          - mkdir -p "$PREFIX"/share/bash-completion/completions "$PREFIX"/share/fish/vendor_completions.d "$PREFIX"/share/zsh/site-functions
          - '"$PREFIX"/bin/rqbit completions bash > "$PREFIX/share/bash-completion/completions/rqbit"'
          - '"$PREFIX"/bin/rqbit completions fish > "$PREFIX/share/fish/vendor_completions.d/rqbit.fish"'
          - '"$PREFIX"/bin/rqbit completions zsh > "$PREFIX/share/zsh/site-functions/_rqbit"'
      - if: win
        then:
          - cargo auditable install --path=. --root="%LIBRARY_PREFIX%" --no-track --locked --bins
          # generate shell completions
          - mkdir "%LIBRARY_PREFIX%\share\bash-completion\completions"
          - mkdir "%LIBRARY_PREFIX%\share\fish\vendor_completions.d"
          - mkdir "%LIBRARY_PREFIX%\share\zsh\site-functions"
          - '"%LIBRARY_BIN%"\rqbit.exe completions bash > "%LIBRARY_PREFIX%"\share\bash-completion\completions\rqbit'
          - '"%LIBRARY_BIN%"\rqbit.exe completions fish > "%LIBRARY_PREFIX%"\share\fish\vendor_completions.d\rqbit.fish'
          - '"%LIBRARY_BIN%"\rqbit.exe completions zsh  > "%LIBRARY_PREFIX%"\share\zsh\site-functions\_rqbit'
      - cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml
      # bundle licenses from webui assets
      - cd ../../crates/librqbit/webui
      - pnpm install --ignore-scripts
      - pnpm-licenses generate-disclaimer --prod --output-file=../../../THIRDPARTY-webui.txt

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - cmake
    - nodejs
    - pkg-config
    - pnpm
    - pnpm-licenses
  host:
    - if: linux
      then: openssl

tests:
  - script:
      - rqbit --help
      - rqbit --version
  - package_contents:
      bin:
        - rqbit
      files:
        - if: unix
          then:
            - share/bash-completion/completions/rqbit
            - share/fish/vendor_completions.d/rqbit.fish
            - share/zsh/site-functions/_rqbit
        - if: win
          then:
            - Library/share/bash-completion/completions/rqbit
            - Library/share/fish/vendor_completions.d/rqbit.fish
            - Library/share/zsh/site-functions/_rqbit
      strict: true

about:
  summary: A bittorrent client with a CLI, server mode, and Web UI
  description: |
    rqbit is a bittorrent client written in Rust. It offers a command-line interface
    for downloading, sharing, and managing torrents, plus an HTTP API and Web UI.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
    - THIRDPARTY-webui.txt
  homepage: https://github.com/ikatson/rqbit
  documentation: https://github.com/ikatson/rqbit/blob/main/README.md
  repository: https://github.com/ikatson/rqbit

extra:
  recipe-maintainers:
    - salim-b
