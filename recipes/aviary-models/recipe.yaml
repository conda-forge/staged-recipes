context:
  version: "1.2.1"

package:
  name: aviary-models
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aviary-models/aviary_models-${{ version }}.tar.gz
  sha256: a32425a1c71c64d2755ebe6ce72c8ce59b85885e7fc9034f786cdf7a36c4440d

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.7.5
  run:
    - python >=${{ python_min }}
    - numpy >=2,<3
    - pandas
    - pymatgen >=2025.4.10
    - scikit-learn
    - tensorboard
    - pytorch >=2.3.0
    - tqdm
    - typing-extensions
    - wandb

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - aviary
      pip_check: true

about:
  homepage: https://github.com/CompRhys/aviary
  summary: A collection of machine learning models for materials discovery
  license: MIT
  license_file: LICENSE
  repository: https://github.com/CompRhys/aviary

extra:
  recipe-maintainers:
    - AntObi
    - KingaMas
