context:
  name: meteo_si
  version: "0.2"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/maahn/meteo_si/archive/refs/tags/v0.2.0.tar.gz
  sha256: 7c53e3be8389290cb8cdcfd1e9007b88be2364f37482e19e3549724b4d49e7c6

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - meteo_si
        - meteo_si.atmosphere
        - meteo_si.density
        - meteo_si.humidity
        - meteo_si.temperature
        - meteo_si.wind
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # --pyargs runs the test suite that ships inside the installed
      # package (meteo_si.tests is included by the project's own
      # packages.find config) rather than against a copied source tree,
      # so there's no risk of a local `meteo_si/` test directory
      # shadowing the actually-installed package during collection.
      - pytest --pyargs meteo_si.tests -v
    requirements:
      run:
        - pytest

about:
  homepage: https://github.com/maahn/meteo_si
  license: MIT
  license_file: LICENSE
  summary: Meteo SI is a collection of meteorological formulas
  documentation: https://meteo-si.readthedocs.io/en/latest/
  repository: https://github.com/maahn/meteo_si

extra:
  recipe-maintainers:
    - maahn
