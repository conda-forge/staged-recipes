schema_version: 1
package:
  name: virtual-network-adapter-sdk
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Virtual-Network-Adapter-SDK/language-sdks-v1.0.0/virtual-network-adapter-sdk-sdk-source-1.0.0.zip
  sha256: ee22ffa32835a2f87525f7ca0035e9fd0cc87a978ae12263edb05b277042e834
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - virtual_network_adapter_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from virtual_network_adapter_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Virtual-Network-Adapter-SDK
  summary: Windows x64 Virtual-Network-Adapter-SDK Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Virtual-Network-Adapter-SDK-C-ffi/LICENSE
  - Virtual-Network-Adapter-SDK-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
