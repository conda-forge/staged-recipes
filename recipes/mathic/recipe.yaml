context:
  version: "1.6"

package:
  name: mathic
  version: ${{ version }}

source:
  url: https://github.com/Macaulay2/mathic/releases/download/v${{ version }}/mathic-${{ version }}.tar.gz
  sha256: 337f303eeab2f834ee21973fc69ab862f9d6b8976887e4b5e2371759298abe2c

build:
  skip:
    - win
  script:
    - ./configure --prefix=$PREFIX --disable-static --enable-shared
    - make
    - if: build_platform == target_platform
      then: make check
    - make install
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - make
  host:
    - memtailor
    - gtest
  ignore_run_exports:
    from_package:
      - gtest
  run_exports:
    - ${{ pin_subpackage('mathic', upper_bound='x') }}

tests:
  - package_contents:
      files:
        - include/mathic.h
      lib:
        - mathic

about:
  homepage: https://github.com/Macaulay2/mathic
  summary: 'C++ library with optimized Gröbner basis data structures'
  description: |
    Mathic is a C++ library providing optimized data structures for
    Gröbner basis computation. It includes support for ordering
    S-pairs, divisor queries, and polynomial term ordering during
    reduction. The library is template-based and can be used with
    arbitrary monomial and coefficient representations, though it
    currently works best with dense term representations.
  license: LGPL-2.0-or-later
  license_file:
    - README.md
    - lgpl-2.0.txt
    - lgpl-2.1.txt
    - lgpl-3.0.txt
  repository: https://github.com/Macaulay2/mathic

extra:
  recipe-maintainers:
    - d-torrance
