context:
  name: e3sm-siteview
  version: "1.3.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/e3sm_siteview-${{ version }}.tar.gz
  sha256: 810faeda41d58dc67c2f7ab1de9c757412e5ce2170da197dc55a8d121ec84cdf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - e3sm-siteview = e3sm_siteview.app:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - vtk-base >=9.7
    - trame >=3.13.2
    - trame-vuetify >=3.3
    - trame-rca >=2.11.8
    - trame-plotly
    - trame-colormaps >=1.6.1
    - trame-dockview
    - trame-dataclass >=2.1.3
    - pyproj >=3.6.1
    - netcdf4 >=1.6.5

tests:
  - python:
      imports:
        - e3sm_siteview
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - e3sm-siteview --help

about:
  homepage: https://github.com/Kitware/SiteView
  summary: "E3SM Site View: explore EAM columns around a site of interest"
  description: |
    E3SM Site View is a trame web application that presents an ARM observatory
    (or any latitude/longitude) as a candidate location for in-depth analysis of
    E3SM simulation results. It extracts the E3SM atmosphere (EAM) columns around
    the site of interest and lets you explore how their fields evolve in space
    and time through a 3D view, column heatmaps and cell time charts.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/Kitware/SiteView

extra:
  recipe-maintainers:
    - jourdain
