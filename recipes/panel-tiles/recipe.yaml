context:
  name: panel-tiles
  version: "0.4.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/panel_tiles-${{ version }}.tar.gz
  sha256: 6f110984f7cf30983f7ce4b268b2d5402cb7776ffbf9eb93f0e56f4be57f66f8

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    # The hatch build hook recompiles the JS bundle with `panel compile`.
    - panel-core >=1.8.0
    - packaging
    - nodejs
    - esbuild
  run:
    - python >=${{ python_min }}
    - panel >=1.8.0
    - packaging

tests:
  - python:
      imports:
        - panel_tiles
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/panel-extensions/panel-tiles
  summary: Provides a draggable and resizable grid for Panel.
  license: BSD-3-Clause
  # The 0.4.0 sdist ships without a license file; drop this local copy once upstream includes it.
  license_file: LICENSE.txt
  repository: https://github.com/panel-extensions/panel-tiles

extra:
  recipe-maintainers:
    - philippjfr
