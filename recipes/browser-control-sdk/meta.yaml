package:
  name: browser-control-sdk
  version: "0.2.1"

source:
  url: https://files.pythonhosted.org/packages/16/17/26c5de064cf3c24e95aa466d89f73a736bd69e6e1091b65bf6b909702299/browser_control_sdk-0.2.1.tar.gz
  sha256: 204b2529facd1b00ce2fbbe99f34c2777bd42039079d6a09bbc8b6d5a64967ca

build:
  number: 0
  skip: true  # [not win64]
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.10

test:
  imports:
    - browser_control
  requires:
    - pip
  commands:
    - python -m pip check
    - python -c "from browser_control import Browser; assert callable(Browser.connect)"

about:
  home: https://github.com/TitanCSA/Browser-Control-SDK
  summary: Standard-library Python client for the Windows BrowserControl application
  description: |
    Control the local BrowserControl application using its private Windows IPC endpoint. The application is installed separately.
    Documentation, examples and license files are included in the package.
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/TitanCSA/Browser-Control-SDK
  dev_url: https://github.com/TitanCSA/Browser-Control-SDK

extra:
  recipe-maintainers:
    - TitanCSA
