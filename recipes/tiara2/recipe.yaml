context:
  version: "1.0.1"

package:
  name: tiara2
  version: ${{ version }}

source:
  - url: https://github.com/shwenyu/Tiara2/archive/refs/tags/v${{ version }}.tar.gz
    sha256: cc27311b7e6dac24bbc6b5a1c3dfd92ca8c25b2d2e7a867938eff53c67f76a4a
    target_directory: source
  - url: https://github.com/shwenyu/Tiara2/raw/v${{ version }}/tiara/models/default/multiobjective_model.pt
    sha256: 1b227cb5acd192fda07febcdd4a6eafa8cd6894eb695a0ca5ca34de45e98a887
    file_name: multiobjective_model.pt
    target_directory: source/tiara/models/default
  - url: https://github.com/shwenyu/Tiara2/raw/v${{ version }}/tiara/models/default/biosignal_expert.joblib
    sha256: 5d8c163f12d00b89004610df780fe14e8ce40f0bddc608197a6c3cffb140c372
    file_name: biosignal_expert.joblib
    target_directory: source/tiara/models/default
  - url: https://github.com/shwenyu/Tiara2/raw/v${{ version }}/tiara/models/default/tfidf/model.npy
    sha256: 2beeb73b339dab892cf68e43afb55194a7a7a4ede5fca6594139af396efa4715
    file_name: model.npy
    target_directory: source/tiara/models/default/tfidf

build:
  noarch: python
  python:
    entry_points:
      - tiara2-classify = tiara.cli:main
  script: cd source && ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68,<81
    - wheel
  run:
    - python >=${{ python_min }},<3.11
    - numpy ==1.26.4
    - pytorch >=2.4.1,<2.14
    - scikit-learn ==1.5.1
    - joblib ==1.4.2
    - numba ==0.58.1
    - llvmlite ==0.41.1
    - scipy >=1.15,<1.16

tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - tiara
        - tiara.api
        - tiara.hierarchical.biosignal_multi_expert
      pip_check: true
  - script:
      - tiara2-classify --show-config
      - tiara2-classify --verify

about:
  homepage: https://github.com/shwenyu/Tiara2
  summary: DNA contig classification with automatic BioSignal routing
  description: |
    Tiara2 is a reusable DNA contig classifier that combines a hierarchical
    multi-objective base model with a length-aware BioSignal residual expert.
    It provides a single command-line and Python interface with automatic
    routing for eukaryotic, prokaryotic, and organelle classification.
  license: MIT
  license_file: source/LICENSE
  documentation: https://github.com/shwenyu/Tiara2#readme
  repository: https://github.com/shwenyu/Tiara2

extra:
  recipe-maintainers:
    - shwenyu
