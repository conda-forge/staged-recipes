context:
  version: "1.0.2"

package:
  name: tiara2
  version: ${{ version }}

source:
  - url: https://github.com/shwenyu/Tiara2/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 13c590221e454f516aab0952636a3372fa817190545e0167817d90bd00315f76
    target_directory: source

build:
  noarch: python
  python:
    entry_points:
      - tiara2-classify = tiara.cli:main
      - tiara2-download-models = tiara.cli:download_main
  script: cd source && ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68,<81
    - wheel
  run:
    - python >=${{ python_min }},<3.11
    - numpy ==1.26.4
    - pytorch >=2.4.1,<2.14
    - scikit-learn ==1.5.1
    - joblib ==1.4.2
    - numba ==0.58.1
    - llvmlite ==0.41.1
    - scipy >=1.15,<1.16

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - tiara
        - tiara.api
        - tiara.hierarchical.biosignal_multi_expert
      pip_check: true
  - script:
      - tiara2-classify --show-config
      - tiara2-download-models --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/shwenyu/Tiara2
  summary: DNA contig classification with automatic BioSignal routing
  description: |
    Tiara2 is a reusable DNA contig classifier that combines a hierarchical
    multi-objective base model with a length-aware BioSignal residual expert.
    It provides a single command-line and Python interface with automatic
    routing for eukaryotic, prokaryotic, and organelle classification.
  license: MIT
  license_file: source/LICENSE
  documentation: https://github.com/shwenyu/Tiara2#readme
  repository: https://github.com/shwenyu/Tiara2

extra:
  recipe-maintainers:
    - shwenyu
