{% set name = "cnchash" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/Chuan1937/CNCHASH/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 09475d9cb617f8d505723a36cbd8c8114dd9c4831b5e871acd7b4dca9bcca83b

build:
  number: 0
  # Windows is skipped for now: the Python front-end hard-codes the
  # libhashhp.so search path and the flang/OpenMP toolchain needs
  # validation. Linux and macOS are built.
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('fortran') }}
    - cmake >=3.16
    - make
  host:
    - python
    - pip
    - setuptools >=61
    - wheel
    - numpy >=1.20
  run:
    - python
    - numpy >=1.20
    # libgfortran5 and the OpenMP runtime (_openmp_mutex / libgomp /
    # llvm-openmp) are added automatically by the compiler run_exports.

test:
  imports:
    - cnchash

about:
  home: https://github.com/Chuan1937/CNCHASH
  license: BSD-3-Clause
  license_file: LICENSE
  summary: >-
    High-performance HASH earthquake focal-mechanism solver with a Modern
    Fortran/OpenMP native backend and a clean Python front-end.
  description: >-
    CNCHASH determines earthquake focal mechanisms from P-wave polarities
    and optional S/P amplitude ratios using the HASH algorithm (Hardebeck
    and Shearer, 2002, 2003). All computation runs in a Modern
    Fortran/OpenMP core (libhashhp); the Python layer handles data, file
    formats, and the API.
  doc_url: https://chuan1937.github.io/CNCHASH/
  dev_url: https://github.com/Chuan1937/CNCHASH

extra:
  recipe-maintainers:
    - Chuan1937
