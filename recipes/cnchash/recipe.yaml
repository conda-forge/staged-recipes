schema_version: 1

context:
  name: cnchash
  version: "2.0.0"

package:
  name: cnchash
  version: ${{ version }}

source:
  url: https://github.com/Chuan1937/CNCHASH/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 09475d9cb617f8d505723a36cbd8c8114dd9c4831b5e871acd7b4dca9bcca83b

build:
  # Windows is skipped for now: the Python front-end hard-codes the
  # libhashhp.so search path and the flang/OpenMP toolchain needs
  # validation. Linux and macOS are built.
  number: 0
  skip: win
  script:
    - cmake -S . -B build-conda -DCMAKE_BUILD_TYPE=Release -DCNCHASH_BUILD_TESTS=OFF ${CMAKE_ARGS}
    - cmake --build build-conda -j ${CPU_COUNT}
    - ${PYTHON} -m pip install . --no-deps --no-build-isolation -vv
    - NATIVE_LIB=build-conda/libhashhp${SHLIB_EXT}
      mkdir -p ${SP_DIR}/cnchash/lib
      cp ${NATIVE_LIB} ${SP_DIR}/cnchash/lib/libhashhp.so

requirements:
  build:
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake >=3.16
    - make
  host:
    - python
    - pip
    - setuptools >=61
    - wheel
  run:
    - python
    - numpy >=1.20
    # OpenMP runtime: the compiler run_exports no longer add it, so
    # declare it explicitly on both platforms.
    - if: linux
      then: libgomp
    - if: osx
      then: llvm-openmp

tests:
  - python:
      imports:
        - cnchash
      pip_check: false
  - script: run_test.py

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: >-
    High-performance HASH earthquake focal-mechanism solver with a Modern
    Fortran/OpenMP native backend and a clean Python front-end.
  description: >-
    CNCHASH determines earthquake focal mechanisms from P-wave polarities
    and optional S/P amplitude ratios using the HASH algorithm (Hardebeck
    and Shearer, 2002, 2003). All computation runs in a Modern
    Fortran/OpenMP core (libhashhp); the Python layer handles data, file
    formats, and the API.
  homepage: https://github.com/Chuan1937/CNCHASH
  repository: https://github.com/Chuan1937/CNCHASH
  documentation: https://chuan1937.github.io/CNCHASH/

extra:
  recipe-maintainers:
    - He XingChen
