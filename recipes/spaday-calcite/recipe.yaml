context:
  version: "0.3.0"
  python_min: "3.11"

package:
  name: spaday-calcite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-calcite/spaday_calcite-${{ version }}.tar.gz
  sha256: 50dd3d66f981488508dcb7e074d0cf8dc0431819f6d0321a7d1f3860176d1fef

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.11.1,<1.0

tests:
  - python:
      imports:
        - spaday_calcite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Calcite Design System for spaday
  homepage: https://github.com/1kbgz/spaday-calcite
  repository: https://github.com/1kbgz/spaday-calcite

extra:
  recipe-maintainers:
    - timkpaine
