context:
  name: diffpy.cmisas
  version: "0.1.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/diffpy_cmisas/diffpy_cmisas-${{ version }}.tar.gz
  sha256: 7ce5c4d247f71eae9bc30e50dd6b0894649f97ba805c23b252398683b1368fa4

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - diffpy-cmisas = diffpy.cmisas.cmisas_app:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-git-versioning >=2.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - diffpy.srfit >=3.4.0
    - sasdata

tests:
  - python:
      imports:
        - diffpy.cmisas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - sasmodels
    script:
      - diffpy-cmisas --version
      - pytest

about:
  homepage: https://github.com/diffpy/diffpy.cmisas/
  summary: The code of the SAS pack of the diffpy.cmi package.
  description: |
    The code of the SAS pack of the diffpy.cmi package.
  license: BSD-3-Clause
  license_file:
    - LICENSE.rst
    - LICENSE_DANSE.rst
  repository: https://github.com/diffpy/diffpy.cmisas/

extra:
  recipe-maintainers:
    - sbillinge
    - cadenmyers13
