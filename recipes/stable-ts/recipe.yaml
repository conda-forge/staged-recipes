schema_version: 1

context:
  name: stable-ts
  version: "2.19.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/stable_ts-${{ version }}.tar.gz
  sha256: 0ecaf1ed93e029839569618d2da9a57b883ad04db21f0680146e0650caaf4f52

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - stable-ts = stable_whisper.whisper_word_level:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pytorch
    - torchaudio
    - tqdm
    - openai-whisper >=20230314,<=20250625

tests:
  - python:
      imports:
        - stable_whisper
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - stable-ts --help

about:
  homepage: https://github.com/jianfch/stable-ts
  summary: Modifies OpenAI's Whisper to produce more reliable timestamps.
  description: |
    stable-ts modifies OpenAI's Whisper to produce more reliable word-level
    timestamps and extends it with alignment, refinement, regrouping and
    output to SRT/VTT/ASS/TSV.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/jianfch/stable-ts

extra:
  recipe-maintainers:
    - BeyondITL-Mossaddique
