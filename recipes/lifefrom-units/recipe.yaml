schema_version: 1

context:
  name: lifefrom-units
  version: "1.0.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/lifefrom_units-${{ version }}.tar.gz
  sha256: 665efb5ac6081bc75adb6baa785c171c507058cbb0e894c2018fddaa1525016c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - lifefrom-units = lifefrom_units.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lifefrom_units
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - lifefrom-units --help
      - lifefrom-units normalize mg/dl

about:
  homepage: https://lifefrom.ai/research/open-data/lab-units
  summary: Normalise clinical lab unit spellings and convert lab values with sourced, analyte-specific factors.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/caraulani/lifefrom-units

extra:
  recipe-maintainers:
    - caraulani
