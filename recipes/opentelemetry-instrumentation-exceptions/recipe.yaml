schema_version: 1

context:
  version: 0.66b2

package:
  name: opentelemetry-instrumentation-exceptions
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/opentelemetry-instrumentation-exceptions/opentelemetry_instrumentation_exceptions-${{ version }}.tar.gz
  sha256: 1ade295078dc52237e63bd7bcb313c3a487a8a9b3f3cafddf47a14d0e0ff1dfb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.42.0.dev,<2.0.0
    - opentelemetry-instrumentation ==0.66b2
    - opentelemetry-semantic-conventions ==0.66b2

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.exceptions
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: OpenTelemetry unhandled exceptions instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-exceptions

extra:
  recipe-maintainers:
    - jsmolic
