context:
  version: 0.1.0
  build_number: '0'
  python_min: 3.11

package:
  name: sphinx-typst-math
  version: ${{ version }}

source:
  url: https://github.com/munechika-koyo/sphinx-typst-math/archive/v${{ version }}.tar.gz
  sha256: 869fd2124b74313b477e1c45434d71424feae89afb82bb6887b42298a3a2e74f

build:
  number: ${{ build_number }}
  noarch: python
  script:
    content: ${{ PYTHON }} -m pip install . -vv
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-vcs
    - hatchling >=1.26
    - pip
  run:
    - python >=${{ python_min }}
    - packaging >=23
    - sphinx <10,>=8.2
    - typst-py >=0.15

tests:
  - python:
      imports:
        - sphinx_typst_math
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - files:
      source:
        - pyproject.toml
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - pandoc
        - myst-parser
        - nbsphinx
        - sphinx-immaterial
    script:
      - pytest

about:
  homepage: https://github.com/munechika-koyo/sphinx-typst-math
  summary: Render native Typst math as MathML in Sphinx HTML builds
  description: |
    `sphinx-typst-math` is a Sphinx HTML math renderer for **native Typst math
    syntax**. It sends each equation to the official Typst compiler through
    [`typst-py`](https://github.com/messense/typst-py), extracts the compiler's
    MathML, and places that MathML directly into Sphinx's HTML.
  license: MIT
  license_file: LICENSE
  documentation: https://munechika-koyo.github.io/sphinx-typst-math/
  repository: https://github.com/munechika-koyo/sphinx-typst-math

extra:
  recipe-maintainers:
    - munechika-koyo
