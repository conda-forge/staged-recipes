schema_version: 1

context:
  version: "1.3.1"

package:
  name: security
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/security/security-${{ version }}.tar.gz
  sha256: 7ec0853c74c7dd22a9967bda087db5d4a7df58253574e60ec475c660f839da6d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - security
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The security toolkit for the Python community
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/pixee/python-security

extra:
  recipe-maintainers:
    - thewchan
