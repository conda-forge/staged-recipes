context:
  name: cluey
  version: "0.2.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cluey-${{ version }}.tar.gz
  sha256: e2d6c2369902c2b561e3ad5d4ad35f71de7cd3fb05809fb4285fa76e2b8f749f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - cluey-example-extendedml = cluey.examples.extendedml:ExtendedMLApp.main
      - cluey-example-productionml = cluey.examples.productionml:ProductionMLApp.main
      - cluey-example-productionml-tools = cluey.examples.productionml:ProductionMLApp.tools

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - typer >=0.4.0
    - rich >=10.16.1

tests:
  - python:
      imports:
        - cluey
        - cluey.cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - cluey-example-extendedml --help

about:
  homepage: https://github.com/rbturnbull/cluey
  summary: Build clever, class-based command line apps with minimal boilerplate.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://rbturnbull.github.io/cluey/
  repository: https://github.com/rbturnbull/cluey

extra:
  recipe-maintainers:
    - rbturnbull
