context:
  name: cluey
  version: "0.2.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # The GitHub archive is used because the PyPI sdist for 0.2.0 does not include the LICENSE file
  url: https://github.com/rbturnbull/cluey/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 50a352cfe1b73c92c3887ff7500800dd8ce38b2e9b6aa871a704dfc145c74448

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - cluey-example-extendedml = cluey.examples.extendedml:ExtendedMLApp.main
      - cluey-example-productionml = cluey.examples.productionml:ProductionMLApp.main
      - cluey-example-productionml-tools = cluey.examples.productionml:ProductionMLApp.tools

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - typer >=0.4.0
    - rich >=10.16.1

tests:
  - python:
      imports:
        - cluey
        - cluey.cli
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - cluey-example-extendedml --help

about:
  homepage: https://github.com/rbturnbull/cluey
  summary: Build clever, class-based command line apps with minimal boilerplate.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://rbturnbull.github.io/cluey/
  repository: https://github.com/rbturnbull/cluey

extra:
  recipe-maintainers:
    - rbturnbull
