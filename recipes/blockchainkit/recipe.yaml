schema_version: 1

context:
  version: "0.2.0"

package:
  name: blockchainkit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/blockchainkit/blockchainkit-${{ version }}.tar.gz
  sha256: 0f6c92bbf8728f81f22a46a5655b375338c49ac4a09dbf93d945031821eb9e1e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - matplotlib-base >=3.6

tests:
  - python:
      imports:
        - blockchainkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cpoli/blockchainkit
  repository: https://github.com/cpoli/blockchainkit
  documentation: https://cpoli.github.io/blockchainkit/
  summary: Cryptography and blockchain breakthroughs, explained through reproducible Python experiments
  description: |
    A teaching toolkit for cryptography, blockchain data structures, consensus, peer-to-peer networking, and virtual machines, with each historical breakthrough reproduced by a small, typed implementation and an experiment.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpoli
