schema_version: 1

context:
  version: "0.0.1"

package:
  name: simulatr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/simulatr/simulatr-${{ version }}.tar.gz
  sha256: 11c765c98e10a0d130fcd1267db11f04131f4e563e63a6991b044025a90cb628

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --no-build-isolation -vv .
  python:
    entry_points:
      - simulatr = simulatr.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
    - setuptools_scm
    - wheel
  run:
    - python >=3.10
    - gymnasium
    - msgpack-python
    - numpy >=1.13
    - pandas
    - pydantic
    - pyzmq
    - requests

tests:
  - python:
      imports:
        - simulatr
        - simulatr.apsimx
        - simulatr.cli
        - simulatr.utils
      pip_check: true
  - script:
      - simulatr --help

about:
  homepage: https://github.com/langmm/simulatr
  repository: https://github.com/langmm/simulatr
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Gym environment for reinforcement learning using process-based simulators
  description: |
    Gym environment for reinforcement learning using process-based
    simulators like crop growth models.
