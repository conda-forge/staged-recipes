schema_version: 1

context:
  name: ppx-optcomp
  opam_name: ppx_optcomp
  version: "0.17.1"
  build_number: 0

  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  # ocaml_<platform> matchspec tail: version, plus the gcc_ (MinGW) track on non-unix
  ocaml_spec: ${{ ocaml_compiler_version ~ (".*" if unix else ".* gcc_*") }}

package:
  name: ocaml-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/janestreet/ppx_optcomp/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 2efe65a0210ed7bda8ddd9e076385b76619f23ac3aee1db5b6140ac1a1feb99d

build:
  number: ${{ build_number }}
  string: ${{ "gcc_" if not unix }}h${{ hash }}_${{ build_number }}
  script: bash ${{ RECIPE_DIR }}/build.sh ${{ opam_name }}

requirements:
  build:
    - ${{ compiler("ocaml") }}
    # compiler("ocaml") renders no toolchain track; name the gcc_ (MinGW) one on non-unix
    - ocaml_${{ target_platform }} ${{ ocaml_spec }}
    # no C stubs; ocamlopt still links through the C compiler on non-unix
    - if: unix
      then:
        - ${{ stdlib("c") }}
      else:
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
    - ocaml-dune >=3.11
    - ${{ m2 }}make
    - if: not unix
      then:
        - m2-bash
        - m2-coreutils
        - m2-sed
        - m2-grep
        - m2-findutils
  host:
    # library: ocaml's run_export pins the compiler patch version
    - ocaml ${{ ocaml_spec }}
    - ocaml-dune >=3.11
    - ocaml-base >=0.17,<0.18
    - ocaml-stdio >=0.17,<0.18
    - ocaml-ppxlib >=0.36
  run:
    - ocaml-base >=0.17,<0.18
    - ocaml-stdio >=0.17,<0.18
    - ${{ pin_compatible('ocaml-ppxlib', upper_bound='x.x') }}
  # the ocaml run_export does not encode the non-unix toolchain track
  run_constraints:
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_spec }}
    # installed dune-package declares (lang dune X.Y); older dune cannot read it
    - ${{ pin_compatible('ocaml-dune', lower_bound='x.x', upper_bound=None) }}

tests:
  - package_contents:
      files:
        - ${{ library }}lib/ocaml/${{ opam_name }}/META
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.cma
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.cmxa
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.a
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.cmxs
  - script:
      interpreter: bash
      content:
        - export DUNE_CACHE=disabled
        - LIBDIR=$PREFIX/lib/ocaml; SEP=':'
        - if [[ -d $PREFIX/Library/lib/ocaml ]]; then LIBDIR=$PREFIX/Library/lib/ocaml; SEP=';'; fi
        - export OCAMLPATH="$LIBDIR${OCAMLPATH:+$SEP$OCAMLPATH}"
        - echo '(lang dune 3.0)' > dune-project
        - echo '(executable (name t) (preprocess (pps ppx_optcomp)))' > dune
        - printf '%s\n' '[%%if ocaml_version >= (4, 8, 0)]' 'let x = 1' '[%%else]' 'let x = this_identifier_does_not_exist' '[%%endif]' 'let () = assert (x = 1); print_string "ppx_optcomp ok"' > t.ml
        - dune build --root . ./t.exe
        - ./_build/default/t.exe | grep -q "ppx_optcomp ok"
    requirements:
      run:
        - ocaml ${{ ocaml_spec }}
        - ocaml-dune >=3.11
        - if: unix
          then:
            - ${{ compiler("c") }}
        - if: not unix
          then:
            - m2-bash
            - m2-coreutils
            - m2-grep

about:
  homepage: https://github.com/janestreet/ppx_optcomp
  repository: https://github.com/janestreet/ppx_optcomp
  license: MIT
  license_file: LICENSE.md
  summary: Optional compilation for OCaml (Jane Street ppx)

extra:
  recipe-maintainers:
    - MementoRC
    - ManuelLerchner
