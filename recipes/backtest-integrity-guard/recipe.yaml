schema_version: 1

context:
  version: "0.2.2"

package:
  name: backtest-integrity-guard
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/backtest-integrity-guard/backtest_integrity_guard-${{ version }}.tar.gz
  sha256: 10602cbf823fb766d6830dd5517f93dcd36205a69894ce797cf5e7c9664f61ba

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - btguard=backtest_integrity_guard.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - backtest_integrity_guard
        - backtest_integrity_guard.core
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - btguard --help

about:
  homepage: https://github.com/suguobin2021/backtest-integrity-guard
  repository: https://github.com/suguobin2021/backtest-integrity-guard
  summary: Auditable checks for causal backtests, OHLCV data, execution timing, and frozen inputs.
  description: |
    Backtest Integrity Guard is a dependency-free Python CLI that checks
    common research-integrity failures before backtest metrics are trusted.
    It validates OHLCV data, execution causality, same-bar exit ambiguity,
    deterministic audit output, and SHA256-frozen research inputs.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - suguobin2021
