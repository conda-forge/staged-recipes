schema_version: 1

context:
  name: antlrope
  version: "1.0.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # The PyPI sdist carries the vendored ANTLR4 C++ runtime.
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/antlrope-${{ version }}.tar.gz
  sha256: "678b235a7ed094074fa0c28133ee99d0570c44954307a474c5ed8d5fc377ecaa"

build:
  number: 0
  # Build via build.sh / build.bat: the unix script forces the Ninja generator
  # (the linux images export CMAKE_GENERATOR="Unix Makefiles"); the Windows one
  # keeps the image defaults (its CMAKE_GENERATOR_PLATFORM=x64 conflicts with Ninja).
  # abi3 / CEP-20: one build (against the 3.12 floor) is installable on any CPython
  # >=3.12. The extension is compiled with nanobind's STABLE_ABI (pyproject sets
  # wheel.py-api = "cp312"), so it ships as `_native.abi3.so`. `python_version_
  # independent` makes the package relocate that .so into the target env's
  # site-packages at install time (it is marked noarch:python but keeps its
  # platform subdir, since it is still compiled). No per-CPython build matrix.
  #
  # entry_points declares the console script so conda generates the launcher at
  # install time: with a version-independent package, pip's own Windows .exe
  # launcher bakes the build-prefix python path in as binary data, which prefix
  # replacement cannot rewrite — the shipped exe fails to start.
  python:
    version_independent: true
    entry_points:
      - antlrope = antlrope.cli.main:main

# NOTE FOR conda-forge REVIEWERS — why this recipe vendors the ANTLR4 C++ runtime
# (carried in the sdist under vendor/antlr4-cpp/) instead of depending on the
# conda-forge `antlr-cpp-runtime` package:
#   1. We carry two performance patches on the runtime (lock-free DFA-edge reads
#      and per-DFA write locks; see vendor/antlr4-cpp/UPDATING.md) that are not yet
#      upstream, so a stock shared runtime would silently drop antlrope's main
#      speedups. They are proposed upstream as antlr/antlr4#4953 and #4954; once
#      merged and released the vendored snapshot can be refreshed to stock upstream.
# The runtime is static-linked (ANTLR4CPP_STATIC, matching the PyPI wheels) and
# is a few hundred KB compiled in, so vendoring it costs essentially nothing in
# package size. Once the upstream PRs are merged and released, a future version
# can drop the patches and consider the shared `antlr-cpp-runtime` package.
requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.21
    - ninja
  host:
    # Build against the 3.12 floor; python-abi3 sets up the Stable-ABI build and
    # carries the run_exports that pin the runtime to `python >=3.12` + python-abi3.
    - python 3.12.*
    - python-abi3 3.12.*
    - pip
    - scikit-build-core >=0.10
    - nanobind >=2.0
    # Build-time README metadata plugin (in [build-system] requires from 1.0.1;
    # unused by the 1.0.0 sdist but keeps the autotick version bump working).
    - hatch-fancy-pypi-readme
  run:
    # The host python-abi3 run-exports add the abi3 marker and the
    # `cpython >=3.12` floor; the plain `python` satisfies the linter.
    - python
    - antlr4-python3-runtime >=4.13

tests:
  - python:
      imports:
        - antlrope
      pip_check: true
      # Test at the 3.12 abi3 floor and at the latest python, per the
      # python-abi3-feedstock example recipe.
      python_version: ["3.12.*", "*"]
  - script:
      - python -c "import antlrope as a; assert a.__version__"
      - antlrope --help
  # Verify the extension really is Stable-ABI at the declared floor
  # (from the python-abi3-feedstock example recipe).
  - requirements:
      run:
        - abi3audit
    script:
      - if: unix
        then: abi3audit $SP_DIR/antlrope/_native.abi3.so -s -v --assume-minimum-abi3 3.12
        else: abi3audit %SP_DIR%/antlrope/_native.pyd -s -v --assume-minimum-abi3 3.12

about:
  homepage: https://github.com/zuzukin/antlrope
  repository: https://github.com/zuzukin/antlrope
  documentation: https://zuzukin.github.io/antlrope/
  license: Apache-2.0
  license_file:
    - LICENSE
    - vendor/antlr4-cpp/LICENSE.txt
  summary: >-
    Fast, C++-accelerated ANTLR runtime for Python: a bulk filtered event-stream
    facade over the official ANTLR4 C++ runtime, driven by stock Python3-target
    output.

extra:
  recipe-maintainers:
    - analog-cbarber
