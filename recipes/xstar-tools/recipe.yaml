schema_version: 1

context:
  name: xstar-tools
  version: "0.6.89.5"
  sha256: "961b66b0ce0b3bc966a6322a3bef05e65879e1f09d50e8d4b9527030ad7a91b2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xstar-tools/xstar_tools-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  skip: win
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - make
    - pkg-config
  host:
    - python
    - pip
    - setuptools >=77
    - wheel
    - cfitsio
  run:
    - python
    - cfitsio
    - numpy >=1.24
    - astropy >=7.2

tests:
  - python:
      imports:
        - xstar_tools
      pip_check: true
  - script:
      - xstar-tools version
      - xstar-cpp --version
      - xstar-cpp --abi
      - xstar-xspec --version
      - xstar-tools doctor --require zone-cpp --json

about:
  homepage: https://github.com/xstar-tools/xstar-tools
  repository: https://github.com/xstar-tools/xstar-tools
  documentation: https://github.com/xstar-tools/xstar-tools/tree/main/docs
  license: GPL-3.0
  license_file: LICENSE
  summary: Source-faithful Python/C++ XSTAR tools, atomic-data utilities, and runtime
  description: |
    xstar-tools provides source-faithful Python/C++ XSTAR tools and the native
    non-MPI XSTAR runtime. The canonical scientific oracle remains FORTRAN
    XSTAR 2.59g. Atomic data file atdb.fits remains external and is discovered
    through the documented XSTAR data-path contract.

extra:
  recipe-maintainers:
    - danehkar
