schema_version: 1

context:
  version: "0.1.0"
  python_min: "3.12"

package:
  name: golden-retriever
  version: ${{ version }}

source:
  url: https://github.com/tschuelia/golden-retriever/archive/v${{ version }}.tar.gz
  sha256: f6fbb8917c605bb3a1b7dbde15f0b2ac0766b735c7d215b13e338364a6e9fada

build:
  noarch: python
  script:
    file: build.py
    interpreter: python
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - golden_retriever
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      interpreter: python
      content: |
        import golden_retriever as gr

        assert gr.__version__ == "${{ version }}", gr.__version__

about:
  homepage: https://github.com/tschuelia/golden-retriever
  summary: Extract HTML embedded in RTF (MS-OXRTFEX de-encapsulation).
  description: |
    golden-retriever extracts HTML encapsulated in Rich Text Format documents
    according to Microsoft's MS-OXRTFEX specification.
  license: MIT
  license_file: LICENSE
  documentation: https://tschuelia.github.io/golden-retriever/
  repository: https://github.com/tschuelia/golden-retriever

extra:
  recipe-maintainers:
    - tschuelia
