# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: openfeature-provider-flagd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openfeature-provider-flagd/openfeature_provider_flagd-${{ version }}.tar.gz
  sha256: d5cac8fb9194ccd454f67fa48da195b0e9d629c77493160b93fa2cf5400ec288

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-protobuf
    - grpcio-tools 1.81.1.*
    - mypy-protobuf >=3,<4
    - protobuf >=6.30.0,<7.0.0
  run:
    - python >=${{ python_min }}
    - cachebox >=5.1.0,<6.0.0
    - grpcio >=1.81.0
    - openfeature-flagd-core >=1.0.0,<2
    - openfeature-sdk >=0.8.2
    - protobuf >=6.30.0,<7.0.0
    - pyyaml >=6.0.1

tests:
  - python:
      imports:
        - openfeature.contrib.provider.flagd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-feature/python-sdk-contrib
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenFeature provider for the flagd flag evaluation engine
  description: |
    OpenFeature provider for the flagd flag evaluation engine

extra:
  recipe-maintainers:
    - rxm7706
