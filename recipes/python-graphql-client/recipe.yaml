schema_version: 1

context:
  version: "0.4.5"

package:
  name: python-graphql-client
  version: ${{ version }}

source:
  url: https://github.com/prodigyeducation/python-graphql-client/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5c2be57cf80e8ca70d159c56764f4b003a5cff226fd8ccab4a43d1502c831aa7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.0,<4.dev0
    - requests >=2.0,<3.dev0
    - websockets >=5.0

tests:
  - python:
      imports:
        - python_graphql_client
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - pytest
    script:
      - pytest -vvv tests
    files:
      source:
        - tests/

about:
  summary: Python GraphQL Client
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/prodigyeducation/python-graphql-client

extra:
  recipe-maintainers:
    - jsmolic
