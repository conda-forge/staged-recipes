schema_version: 1

context:
  version: "0.1.15"

package:
  name: pushtodisplay
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/pushtodisplay/-/pushtodisplay-${{ version }}.tgz
  sha256: bc7589b6eaa49c6e0d90c602bfc6642318edeeae7954d13e20f729acb9652314

build:
  number: 0
  noarch: generic
  # Pure-JS package: one artifact for all platforms. npm's global install lays
  # the package into lib/node_modules; we then write every platform's shim: a
  # shell launcher for bin/ plus cmd/PowerShell launchers for the Windows
  # Scripts directory (the conda Windows PATH convention). Each platform picks
  # up its own shim and ignores the others.
  script:
    - export HOME="${{ SRC_DIR }}"
    - export npm_config_cache="${{ SRC_DIR }}/.npm-cache"
    - npm pack --ignore-scripts
    - npm install -g --prefix "${{ PREFIX }}" "pushtodisplay-${{ version }}.tgz"
    - rm -f "${{ PREFIX }}/bin/pushtodisplay"
    - printf '#!/bin/sh\nexec node "$(dirname "$0")/../lib/node_modules/pushtodisplay/dist/cli.js" "$@"\n' > "${{ PREFIX }}/bin/pushtodisplay"
    - chmod +x "${{ PREFIX }}/bin/pushtodisplay"
    - mkdir -p "${{ PREFIX }}/Scripts"
    - printf '@echo off\r\nnode "%%~dp0..\\node_modules\\pushtodisplay\\dist\\cli.js" %%*\r\n' > "${{ PREFIX }}/Scripts/pushtodisplay.cmd"
    - printf "$ErrorActionPreference = 'Stop'\r\nnode \$PSScriptRoot\\..\\node_modules\\pushtodisplay\\dist\\cli.js \$args\r\n" > "${{ PREFIX }}/Scripts/pushtodisplay.ps1"

requirements:
  host:
    - nodejs
  run:
    - nodejs >=18

tests:
  - package_contents:
      bin:
        - pushtodisplay
  - script:
      - pushtodisplay --version
      - pushtodisplay --help

about:
  homepage: https://pushtodisplay.com
  summary: CLI and MCP server for Push To Display - send real-time updates to display boards from your terminal
  license: MIT
  license_file:
    - LICENSE
    - THIRD_PARTY_LICENSES.txt
  repository: https://github.com/pushtodisplay/cli
  documentation: https://pushtodisplay.com/docs/cli

extra:
  recipe-maintainers:
    - sourceshipper
