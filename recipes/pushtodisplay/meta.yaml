{% set name = "pushtodisplay" %}
{% set version = "0.1.14" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://registry.npmjs.org/{{ name }}/-/{{ name }}-{{ version }}.tgz
  sha256: e245863df13617b0764a4a9de18f4ae79fa3f47dcb9ad77e5c5f23bd5ceba1a2

build:
  number: 0

requirements:
  host:
    - nodejs
  run:
    - nodejs >=18

test:
  commands:
    - pushtodisplay --version
    - pushtodisplay --help

about:
  home: https://pushtodisplay.com
  summary: CLI and MCP server for Push To Display - send real-time updates to display boards from your terminal
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/pushtodisplay/cli
  doc_url: https://pushtodisplay.com/docs/cli

extra:
  recipe-maintainers:
    - sourceshipper
