context:
  version: "1.7.0"

package:
  name: brainweb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/brainweb/brainweb-${{ version }}.tar.gz
  sha256: b8d7dde584a01a269c2a66cd1684af5658343b986ba961ba0599e80e86ab7c1d

build:
  noarch: python
  script:
    content: ${{ PYTHON }} -m pip install . -vv --no-deps
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - numpy
    - requests
    - scikit-image
    - tqdm >=4.42

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - brainweb
      pip_check: true

about:
  homepage: https://github.com/casperdcl/brainweb
  summary: BrainWeb-based multimodal models of 20 normal brains
  description: |
    This project was initially inspired by "[BrainWeb: 20 Anatomical Models of 20 Normal Brains](http://brainweb.bic.mni.mcgill.ca/brainweb/anatomic_normal_20.html)".

    However there are a number of generally useful tools, image processing & display functions included in this project.
    For example, this includes
    `volshow()` for interactive comparison of multiple 3D volumes,
    `get_file()` for caching data URLs, and
    `register()` for image coregistration.
  license: MPL-2.0
  license_file: LICENCE
  repository: https://github.com/casperdcl/brainweb

extra:
  recipe-maintainers:
    - casperdcl
