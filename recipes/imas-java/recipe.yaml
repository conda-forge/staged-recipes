context:
  version: "5.6.0"
  # Data Dictionary version used to generate the IDS classes
  dd_version: "4.1.1"

package:
  name: imas-java
  version: ${{ version }}

source:
  # Java High Level Interface of the IMAS Access Layer
  - url: https://github.com/iterorganization/IMAS-Java/archive/refs/tags/${{ version }}.tar.gz
    sha256: a833aa086a1e79415db10c5c571aa81bcdd3299c56e341050f8dd74a0c1be962
  # IMAS Data Dictionary sources: IDSDef.xml is generated from these at build
  # time (see build.sh) and defines the IDS classes of the interface
  - url: https://github.com/iterorganization/IMAS-Data-Dictionary/archive/refs/tags/${{ dd_version }}.tar.gz
    sha256: a8aa78bacbd83801be13dfcca4e2347aa2173d6fd8de3537d724db7254d4c5f0
    target_directory: data-dictionary

build:
  number: 0
  # No Windows build for now: upstream builds Windows with vcpkg and the
  # build system needs more work to support conda on Windows
  skip: win
  # python is only a build-time tool: keep it out of the build variants
  variant:
    ignore_keys:
      - python
  script:
    file: build.sh
    env:
      DD_VERSION: ${{ dd_version }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - pkg-config
    # javac/jar for building the jars, and Saxon-HE (Java) for the XSLT 2.0
    # transformations that generate the IDS classes from the Data Dictionary
    # (replaces the PyPI-only saxonche)
    - openjdk
    - saxon-he
    # Used to pre-create the venv expected by the build system (see build.sh)
    - python
  host:
    # JNI headers for the native binding library
    - openjdk
    - libimas-core
  run:
    # The jars are compiled with `javac --release 11` (see build.sh)
    - openjdk >=11
  run_exports:
    # The generated API depends on both the AL and the DD version
    - ${{ pin_subpackage('imas-java', upper_bound='x.x.x') }}

tests:
  - package_contents:
      files:
        - lib/libal-java-binding${{ ".dylib" if osx else ".so" }}
        - jar/imas.jar
        - jar/al-identifiers.jar
  - script:
      # Compile a class against the jar, then load the imas class, whose
      # static initializer loads the native JNI library
      - printf 'public class TestImasJava {\n  public static void main(String[] args) throws Exception {\n    Class.forName("imasjava.Vect1DDouble");\n    Class.forName("imasjava.imas");\n    System.out.println("imas-java OK");\n  }\n}\n' > TestImasJava.java
      - javac -cp "${PREFIX}/jar/imas.jar" TestImasJava.java
      - java -cp "${PREFIX}/jar/imas.jar:." -Djava.library.path="${PREFIX}/lib" TestImasJava
    requirements:
      run:
        - openjdk

about:
  homepage: https://imas.iter.org/
  license: LGPL-3.0-only
  # Include the Data Dictionary licenses, as the generated IDS interfaces are
  # derived from the Data Dictionary sources
  license_file:
    - LICENSE.txt
    - data-dictionary/LICENSE-LGPL
    - data-dictionary/LICENSE-CC-BY-ND
  summary: Java High Level Interface of the IMAS Access Layer
  description: |
    IMAS-Java is part of the Integrated Modelling and Analysis Suite at ITER.
    It provides the Java High Level Interface (HLI) of the IMAS Access Layer,
    giving Java programs strongly-typed access to Interface Data Structures
    (IDSs) defined by the IMAS Data Dictionary, on top of the IMAS-Core
    low-level library. It installs jar/imas.jar and jar/al-identifiers.jar
    together with the native JNI binding library; run Java programs with
    -Djava.library.path=$CONDA_PREFIX/lib so that the binding library is
    found.
  repository: https://github.com/iterorganization/IMAS-Java
  documentation: https://imas-java.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - SimonPinches
