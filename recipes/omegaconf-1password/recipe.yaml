context:
  version: "0.1.0"

package:
  name: omegaconf-1password
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/omegaconf-1password/omegaconf_1password-${{ version }}.tar.gz
  sha256: 8ff90add64bd90e8e026ffa8ac4b8b950cfb1d87235bc3929507ada551ceda21

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - omegaconf

tests:
  - python:
      imports:
        - omegaconf_1password
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A 1Password secret reference resolver for OmegaConf and Hydra
  homepage: https://github.com/1kbgz/omegaconf-1password
  repository: https://github.com/1kbgz/omegaconf-1password

extra:
  recipe-maintainers:
    - timkpaine
