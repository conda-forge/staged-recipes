schema_version: 1

context:
  version: "0.5.1"

package:
  name: mam4-jax
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/mam4-jax/mam4_jax-${{ version }}.tar.gz
  sha256: de9ec4ef6e1aca75a1acf2ae7b1426270b4315aa54354f99f1edad35fd595e07

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - jax >=0.4.20
    - jaxlib >=0.4.20
    - numpy >=1.24
    - netcdf4 >=1.6
    - pyyaml >=6
    - matplotlib-base >=3.7
    - diffrax >=0.7

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - mam4_jax
      pip_check: true

about:
  summary: JAX port of the MAM4 aerosol-microphysics box model
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://pypi.org/project/mam4-jax/

extra:
  recipe-maintainers:
    - mahf708
