context:
  version: "0.2.0"

package:
  name: kavel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kavel/kavel-${{ version }}.tar.gz
  sha256: 36e52d473b8fbaefa11b5815b59bc921a786a20cc78f16fd64ca30d415706919

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - kavel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.kavel.ai
  summary: Generate and edit AI images from Python with no API key
  description: |
    A dependency-free client for the Kavel AI image service. Without a key it
    uses the anonymous free tier, so the first call works on a machine with
    nothing configured; with an API key it runs on your kavel.ai account.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/hanshs474/kavel-py
  documentation: https://kavel.readthedocs.io/

extra:
  recipe-maintainers:
    - hanshs474
