schema_version: 1

context:
  version: "2.1.1"

package:
  name: textfsm
  version: ${{ version }}

source:
  url: https://github.com/google/textfsm/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b49bdf902fed036184fcd02aa6a97359634325421c1e5bfb088bbbf0f1aa6984
  patches:
    - help-msg.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - textfsm=textfsm.parser:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - wheel
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - textfsm
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python
    script:
      - textfsm --help
  - requirements:
      run:
        - pytest
    script:
      - pytest -vvv tests
    files:
      source:
        - tests/
        - testdata/

about:
  summary: Python module for parsing semi-structured text into python tables.
  license: Apache-2.0
  license_file:
    - COPYING
    - LICENSE.txt
  homepage: https://github.com/google/textfsm

extra:
  recipe-maintainers:
    - jsmolic
