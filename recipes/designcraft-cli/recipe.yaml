context:
  name: designcraft-cli
  version: "0.21.1"
  # storytold/craft-fonts revision the upstream release embeds (flake.nix `craft-fonts` input)
  craft_fonts_rev: abb83316d96aa59c1cf64784289e378fe9fa5695

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/storytold/designcraft/archive/refs/tags/v${{ version }}.tar.gz
    sha256: e106fde2015783c69ad420ea9a3e5a1e33fa10d7261430a3515ed3a4021ccdac
  - url: https://github.com/storytold/craft-fonts/archive/${{ craft_fonts_rev }}.tar.gz
    sha256: 53e41ed01ee81a0ef664601a73fb87281f1fd748e724f560c8128d7d33eb3328
    target_directory: craft-fonts

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - designcraft-cli --version
      - designcraft-cli --help
  - package_contents:
      bin:
        - designcraft-cli

about:
  homepage: https://getartcraft.com/apps/designcraft
  repository: https://github.com/storytold/designcraft
  summary: Headless command runner and MCP server for DesignCraft page layouts
  description: |
    designcraft-cli is the command-line companion to DesignCraft, an
    open-source page layout and publishing application written in pure Rust.
    It runs DesignCraft commands headlessly against documents, exports pages
    to PDF and images, validates PDF/X output, and serves DesignCraft as an
    MCP server for AI agents. Part of the Craft App Suite from ArtCraft.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - NOTICE
    - THIRDPARTY.yml
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-JetBrainsMono.txt
    - assets/fonts/OFL-SourceSans3.txt
    - assets/fonts/OFL-SourceSerif4.txt
    - craft-fonts/ATTRIBUTION.md

extra:
  recipe-maintainers:
    - lsetiawan
