schema_version: 1

context:
  name: exasol-telemetry-client
  version: "0.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/exasol_telemetry_client-${{ version }}.tar.gz
  sha256: 3c690658e49307c981018f3d0e5dc23de70acc93386e7fa12663875e914ac465

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=2.0.0
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - requests >=2.33.0,<3
    - urllib3 >=2.6.3,<3

tests:
  - python:
      imports:
        - exasol.telemetry.client
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"

about:
  summary: Telemetry client library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/exasol/telemetry-client-python
  repository: https://github.com/exasol/telemetry-client-python

extra:
  recipe-maintainers:
    - xylar
