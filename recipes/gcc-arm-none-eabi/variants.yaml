# Build with conda-forge's compilers and standard library so the package is
# built the same way as the rest of the conda ecosystem. gcc 13 is closest to
# the distro compilers Arm builds this toolchain with, and the sysroot sets
# the __glibc >=2.28 floor via its strong run export, independent of the
# build host.
#
# This submission builds linux-64 only (see build.skip in recipe.yaml).
# c_stdlib/c_stdlib_version still need entries for the other platforms:
# staged-recipes' build_all.py merges this file over the conda-forge pinning
# per key, and the osx/win CI jobs render the recipe (to evaluate the skip),
# which fails if stdlib('c') has no value there.
c_compiler_version:
  - if: linux
    then: "13"
cxx_compiler_version:
  - if: linux
    then: "13"
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
  - if: win
    then: vs
c_stdlib_version:
  - if: linux
    then: "2.28"
  - if: osx
    then: "11.0"
