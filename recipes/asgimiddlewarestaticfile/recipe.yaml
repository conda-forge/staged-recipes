context:
  version: "0.7.0"

package:
  name: asgimiddlewarestaticfile
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asgimiddlewarestaticfile/asgimiddlewarestaticfile-${{ version }}.tar.gz
  sha256: 70935ab3bb9cdde5cf96dcc4eed2fce39c9cf51ec371490265e673df099ddf72

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - aiofiles >=25.1.0
    - asgiref

tests:
  - python:
      imports:
        - asgi_middleware_static_file
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rexzhang/asgi-middleware-static-file
  summary: ASGI middleware for serving static files
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
