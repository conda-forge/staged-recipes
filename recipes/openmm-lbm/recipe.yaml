schema_version: 1

context:
  name: openmm-lbm
  version: "0.6.6"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/lauricella/openmm-lbm/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 188654b521fc25a6e42ea8003ef220fdfb07ba93fb8e8100b33e33376881bf03

build:
  number: 0
  # Linux x86_64 only for now: the plugin is tested there. OpenMM on conda-forge for linux-64 is built with CUDA
  # only, so the CUDA variants are the ones to build (each one also has the Reference and OpenCL platforms).
  skip:
    - not (linux and x86_64)
    - cuda_compiler_version == "None"
  script: build.sh
  dynamic_linking:
    missing_dso_allowlist:
      # The NVIDIA driver library comes from the system at run time.
      - "*/libcuda.so*"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - if: cuda_compiler_version != "None"
      then:
        - ${{ compiler('cuda') }}
    - cmake
    - make
  host:
    - python
    - pip
    - setuptools
    - numpy
    # The Python wrapper must be generated by the SWIG version of the OpenMM Python module (4.5.1 for OpenMM
    # 8.6.1); CMake checks it and stops otherwise.
    - swig
    - openmm >=8.3
    - ocl-icd
    - if: cuda_compiler_version != "None"
      then:
        - cuda-version ==${{ cuda_compiler_version }}
        - cuda-cudart-dev
        - cuda-driver-dev
        - cuda-nvrtc-dev
        - libcufft-dev
  ignore_run_exports:
    # Only their headers are needed (through the CUDA headers of OpenMM): the plugin links the driver library and
    # OpenMM, which brings these runtime libraries itself.
    from_package:
      - if: cuda_compiler_version != "None"
        then:
          - cuda-cudart-dev
          - cuda-nvrtc-dev
          - libcufft-dev
  run:
    - python
    # A plugin works only with the minor version of OpenMM it was built against.
    - ${{ pin_compatible('openmm', lower_bound='x.x.x', upper_bound='x.x') }}
    - numpy
    - ocl-icd
    - ocl-icd-system

tests:
  - python:
      imports:
        - openmmlbm
  - files:
      recipe:
        - test_platforms.py
      source:
        - python/tests/TestLBMForce.py
    requirements:
      run:
        - pytest
        - pocl
    script:
      - python -m pytest -q -rs python/tests/TestLBMForce.py
      - python test_platforms.py

about:
  homepage: https://github.com/lauricella/openmm-lbm
  repository: https://github.com/lauricella/openmm-lbm
  documentation: https://github.com/lauricella/openmm-lbm/tree/main/docs
  license: MIT
  license_file: LICENSE
  summary: Lattice Boltzmann fluid coupled to particles, as a plugin for OpenMM
  description: |
    openmm-lbm adds to OpenMM a D3Q19 lattice Boltzmann fluid coupled to particles by a friction force
    (LBMForce), with walls, open faces, a fluctuating fluid and checkpoints, on the Reference, CUDA and OpenCL
    platforms, with a Python API.

extra:
  recipe-maintainers:
    - lauricella
