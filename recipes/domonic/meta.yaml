{% set name = "domonic" %}
{% set version = "1.3.0" %}
{% set sha256 = "2f11a9c19e8a1cfb64ce1bf2f1c0e9b4c3d0e5f6a7b8c9d0e1f2a3b4c5d6e7f" %}
{% set python_min = "3.10" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - elementpath >=5.1.4,<6
    - python-dateutil >=2.9.0.post0,<3
    - requests >=2.34.2,<3
    - urllib3 >=2.7.0,<3
    - html5lib >=1.1,<2
    - cssselect >=1.5.0,<2

test:
  imports:
    - domonic
    - domonic.html
    - domonic.dom

about:
  home: https://github.com/byteface/domonic
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Python DOM and HTML toolkit - generate, parse and manipulate HTML/XML/SVG with CSS selectors, XPath, Web APIs and JavaScript-like utilities
  description: |
    domonic is a pure-Python DOM toolkit inspired by the browser platform.
    It gives you one document model for creating, parsing, querying, 
    traversing, manipulating and rendering markup.
    Generate HTML, parse real pages, query with CSS or XPath, and manipulate a browser-style DOM.
  doc_url: https://domonic.readthedocs.io/
  dev_url: https://github.com/byteface/domonic

extra:
  recipe-maintainers:
    - byteface
