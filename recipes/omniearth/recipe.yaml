context:
  name: omniearth
  version: "1.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/omniearth-${{ version }}.tar.gz
  sha256: b13db00e5e972e58b1d7cd279fe997a9c9335825f4325663865f92b1bae26f81

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - omniearth = omniearth.cli:main
      - omniearth-mcp = omniearth.mcp_server:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - requests >=2.28.0
    - pydantic >=2.0.0
    - tqdm >=4.64.0
    - python-dotenv >=1.0.0

tests:
  - python:
      imports:
        - omniearth
        - omniearth.mcp_server
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - omniearth --version
      - omniearth --help

about:
  homepage: https://lokeshsk.github.io/omniearth/
  summary: Universal Multi-Modal Open Earth Observation, Hyperspectral, and Weather Data Engine
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  repository: https://github.com/lokeshsk/omniearth
  documentation: https://lokeshsk.github.io/omniearth/guide.html

extra:
  recipe-maintainers:
    - lokeshsk
