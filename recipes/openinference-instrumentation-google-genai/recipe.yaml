schema_version: 1

context:
  version: "1.6.7"

package:
  name: openinference-instrumentation-google-genai
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/openinference-instrumentation-google-genai/openinference_instrumentation_google_genai-${{ version }}.tar.gz
  sha256: d8c1d0f8c72085b871ba3e1d1c47f44025bbf4b962226ebf5173e3207af79274

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api
    - opentelemetry-instrumentation
    - opentelemetry-semantic-conventions
    - openinference-instrumentation >=0.1.82
    - openinference-semantic-conventions >=0.1.46
    - wrapt

tests:
  - python:
      imports:
        - openinference.instrumentation.google_genai
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: OpenInference Google GenAI Instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/openinference-instrumentation-google-genai/

extra:
  recipe-maintainers:
    - jsmolic
