      sha256: ca4858770945aa40677eff4b0bd6b0bdad73ef372d665eae4ec41202aecda830
      file_name: cuda_tile.whl
  - if: match(python, "3.13.*") and linux and aarch64
    then:
      url: https://files.pythonhosted.org/packages/58/09/5c3b6c8fc2f03303fe97156082792f2276deb94c974f57691ce86322f91c/cuda_tile-1.6.0-cp313-cp313-manylinux2014_aarch64.whl
      sha256: 43c846d903d3ed12680af28acbb936f141c71a306ac9c4b778974f81a6634550
      file_name: cuda_tile.whl
  - if: match(python, "3.13.*") and win
    then:
      url: https://files.pythonhosted.org/packages/52/58/47ee674b3834543fe6121787f9f55674884a514290c2f1b0752fb94d22f0/cuda_tile-1.6.0-cp313-cp313-win_amd64.whl
      sha256: 9defc23b669a06f1abff203c37899a46c826843b575890adfb5768f30e49cf71
      file_name: cuda_tile.whl
  # No sdist is published, so grab the license text straight from the tagged source repo.
  - url: https://raw.githubusercontent.com/NVIDIA/cutile-python/v${{ version }}/LICENSES/Apache-2.0.txt
    sha256: 074e6e32c86a4c0ef8b3ed25b721ca23aca83df277cd88106ef7177c354615ff
    file_name: LICENSE

build:
  number: 0
  skip:
    - osx
    - match(python, "<3.10")
    - match(python, ">=3.14")
  script:
    - python -m pip install cuda_tile.whl -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - typing-extensions
  run_constraints:
    - __cuda >=12

tests:
  - python:
      imports:
        - cuda.tile
      pip_check: true
  - script:
      - cutile-cache --help

about:
  homepage: https://github.com/NVIDIA/cutile-python
  repository: https://github.com/NVIDIA/cutile-python
  documentation: https://docs.nvidia.com/cuda/cutile-python
  summary: cuTile is a programming model for writing parallel kernels for NVIDIA GPUs
  description: |
    cuTile Python is a programming language for NVIDIA GPUs. It lets you write
    parallel kernels in Python using a tile-based programming model that compiles
    down to NVIDIA Tile IR, which requires NVIDIA Driver r580 or later to run.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - LeeNethertonQC
