context:
  version: "1.6.0"

package:
  name: cuda-tile
  version: ${{ version }}

# cuda-tile ships no sdist on PyPI -- only prebuilt wheels per (python, platform),
# because the official wheels are built with a proprietary NVIDIA-internal CMake
# overlay that is not part of the public source repository. This recipe therefore
# repackages the official PyPI wheels directly instead of compiling from source.
source:
  - if: match(python, "3.10.*") and linux and x86_64
    then:
      url: https://files.pythonhosted.org/packages/08/29/dba077e13479b7eb91c02dfe608b057c7eb6a2f2002dfcc447a21a199625/cuda_tile-1.6.0-cp310-cp310-manylinux2014_x86_64.whl
