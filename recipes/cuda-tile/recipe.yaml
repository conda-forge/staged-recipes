      file_name: cuda_tile.whl
  - if: match(python, "3.10.*") and linux and aarch64
    then:
      url: https://files.pythonhosted.org/packages/43/c4/b3833d6178c2e3ef3e4e19a5890676d066c682ad6fb5547357dfa4a43af4/cuda_tile-1.6.0-cp310-cp310-manylinux2014_aarch64.whl
      sha256: f83b0e8890d9da1e58697de2b68e7017b58ba3d7a2d881388102aae421527fe8
      file_name: cuda_tile.whl
  - if: match(python, "3.10.*") and win
