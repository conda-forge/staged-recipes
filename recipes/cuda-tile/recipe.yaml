  - if: match(python, "3.12.*") and linux and aarch64
    then:
      url: https://files.pythonhosted.org/packages/1f/cc/b4da247f624320c9898c14003e7b809b74c4a447251e1c98e33505f41757/cuda_tile-1.6.0-cp312-cp312-manylinux2014_aarch64.whl
      sha256: 77fb2b15c61960514f62fc41eeae3722cf6468c051f7593fd43970691624214b
      file_name: cuda_tile.whl
  - if: match(python, "3.12.*") and win
    then:
      url: https://files.pythonhosted.org/packages/45/70/363bad8f80a719a71071e9bf3d4bee4dd21506bd20b8b0bf8a0cc582eb08/cuda_tile-1.6.0-cp312-cp312-win_amd64.whl
