{% set version = "1.10.2" %}

package:
  name: python-osc
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/python-osc/python_osc-{{ version }}.tar.gz
  sha256: 732548f4f467dda9f890a6b0b3bfb085ab117f4bd38a45a58d2ca0f3bd6a546d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - uv-build
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - python_osc
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/python-osc/
  summary: Open Sound Control server and client implementations in pure Python
  license: Unlicense
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - whs2k
