# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: tokie
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/t/tokie/tokie-${{ version }}.tar.gz
  sha256: 8adc9bf1189574c78f3fe6bd7d1b3471a24126adbff094f454e0940b93449490

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.8,<2
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - tokie
      pip_check: true
  - files:
      source:
        - crates/tokie-python/tests/test_aliases.py
        - crates/tokie-python/tests/test_decode_input.py
        - crates/tokie-python/tokie.pyi
    requirements:
      run:
        - pytest
    script:
      - pytest crates/tokie-python/tests/test_aliases.py crates/tokie-python/tests/test_decode_input.py -vv

about:
  summary: Blazingly fast tokenizer — 50x faster, 10x smaller, 100% accurate
  license: MIT OR Apache-2.0
  license_file:
    - crates/tokie/LICENSE-MIT
    - crates/tokie/LICENSE-APACHE
    - THIRDPARTY.yml
  homepage: https://github.com/feyninc/tokie
  repository: https://github.com/feyninc/tokie
  documentation: https://docs.rs/tokie/latest/tokie/

extra:
  recipe-maintainers:
    - pb01ka
