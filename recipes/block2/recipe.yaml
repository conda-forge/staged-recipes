schema_version: 1

context:
  version: "0.5.3"

package:
  name: block2
  version: ${{ version }}

source:
  url: https://github.com/block-hczhai/block2-preview/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 2db131fa37ce83b1255e5eaa61a82c32c174165dfc383b13e3b0499a12d6d8da
  patches:
    - build.patch

build:
  skip:
    - win
  number: 0
  script:
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${CPU_COUNT}
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - cmake
    - make
  host:
    - python
    - python_abi <3.11
    - pip
    - setuptools
    - pybind11 !=2.10.3,!=2.10.4,!=2.11.0,!=2.11.1
    - pybind11-abi
    - llvm-openmp
    - if: x86_64
      then:
        - libblas * *mkl
        - liblapack * *mkl
    - if: not x86_64 and not osx
      then:
        - libblas
        - liblapack
    - if: osx and not x86_64
      then:
        - libblas * *newaccelerate
        - liblapack * *newaccelerate
  run:
    - python
    - numpy
    - scipy
    - psutil

tests:
  - python:
      imports:
        - pyblock2
      pip_check: true

about:
  summary: An efficient MPO implementation of DMRG for quantum chemistry.
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/block-hczhai/block2-preview
  documentation: https://block2.readthedocs.io/en/latest/index.html

extra:
  recipe-maintainers:
    - chillenb
    - hczhai
