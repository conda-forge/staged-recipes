schema_version: 1

context:
  version: "0.5.1"

package:
  name: mathematicskit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mathematicskit/mathematicskit-${{ version }}.tar.gz
  sha256: 8ea47f2834f38641ba429990e7c8ca5cacfb03d85ef5c26775999088e4027da2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.6

tests:
  - python:
      imports:
        - mathematicskit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cpoli/mathematicskit
  repository: https://github.com/cpoli/mathematicskit
  documentation: https://cpoli.github.io/mathematicskit/
  summary: Unified computational mathematics toolkit built on numpy and scipy
  description: |
    Numerical analysis, linear algebra, calculus, dynamical systems, PDEs, optimization, probability, statistics, number theory, combinatorics, graph theory, topology, special functions, and fractals/chaos. Install numba for JIT-compiled kernels.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpoli
