context:
  version: "0.3.0"
  python_min: "3.10"

package:
  name: mathematicskit
  version: ${{ version }}

source:
  url: https://github.com/cpoli/mathematicskit/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7fd74d86a5ab9551b5fde1bbd2d946ae3ca201f7f6261cbd731078108ce6d0cf

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.6
    - numba >=0.58

tests:
  - python:
      imports:
        - mathematicskit
        - mathematicskit.integrators
        - mathematicskit.fractals_chaos
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/cpoli/mathematicskit
  summary: Toolkit for learning and teaching computational mathematics, built on numpy/scipy
  description: |
    mathematicskit is a Python toolkit for learning and teaching numerical
    methods, dynamical systems, and discrete mathematics across 16 domains
    (numerical analysis, linear algebra, calculus, ODEs and PDEs, fractals and
    chaos, optimization, probability, statistics, number theory, combinatorics,
    complex analysis, graph theory, abstract algebra, geometry, and special
    functions). Iterative methods keep their iterates, results are
    inspectable dataclasses, and every domain ships matplotlib visualizers.
  license: MIT
  license_file: LICENSE
  documentation: https://cpoli.github.io/mathematicskit/
  repository: https://github.com/cpoli/mathematicskit

extra:
  recipe-maintainers:
    - cpoli
