context:
  name: pygeodata
  version: "0.5.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f53c34f40f231fc80fb29792ebd1c6f1318d73bb49301b842d75c4076bb479bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pygeodata = pygeodata.cli:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - numpy
    - rioxarray
    - geopandas
    - zarr
    - fiona
    - pyarrow
    - affine >=3
    - filelock
    - click
    - lazy_loader >=0.4
    - msgspec
    # conda-forge's rasterio only ships libgdal-core; netcdf: paths need this plugin
    - libgdal-netcdf

tests:
  - python:
      imports:
        - pygeodata
        - pygeodata.cli
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pygeodata --help

about:
  homepage: https://github.com/jasperroebroek/pygeodata
  repository: https://github.com/jasperroebroek/pygeodata
  documentation: https://pygeodata.readthedocs.io
  summary: Lightweight framework for geospatial data access and processing
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jasperroebroek
