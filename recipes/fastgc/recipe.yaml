schema_version: 1

context:
  version: "0.2.1"

package:
  name: fastgc
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/f/fastgc/fastgc-${{ version }}.tar.gz
  sha256: 6a5f3e3d041408c83629bb7df8e8e5488d1e4611a17f20100c93375e821efcd0

build:
  number: 0
  script:
    - cd native
    - cargo bundle-licenses --format yaml --output ../THIRDPARTY.yml
    - cd ..
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - fastgc = fastgc.cli:main
      - fastgc-check = fastgc.check_env:main

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.9,<2.0
  run:
    - python
    - numpy >=2.0,<3.0
    - scipy >=1.15,<2.0
    - laspy >=2.5.4,<3.0
    - lazrs-python >=0.7,<1.0
    - rasterio >=1.5,<2.0
    - pyproj >=3.7,<4
    - pyogrio >=0.13,<1.0
    - geopandas >=1.0,<2.0
    - shapely >=2.0.6,<3.0
    - tqdm >=4.66,<5.0
    - joblib >=1.4,<2.0
    - psutil >=6.0,<8.0
    - packaging >=24.2,<27.0

tests:
  - python:
      imports:
        - fastgc
        - fastgc._fastgc_native
      pip_check: true
  - script:
      - fastgc --help
      - fastgc-check --help

about:
  homepage: https://github.com/nadeemfareed/FAST-GC
  repository: https://github.com/nadeemfareed/FAST-GC
  documentation: https://nadeemfareed.github.io/fastgcBOOK/
  summary: "Fully Adaptive Self-Tuning Sensor-Agnostic Ground Classification for LiDAR point clouds"
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - nadeemfareed
