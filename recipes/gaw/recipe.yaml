# Upstream (https://github.com/StefanSchippers/xschem-gaw) has no release tags.
# This recipe pins a commit snapshot of `main`; version is the snapshot date.
context:
  version: "2026.11.10"
  commit: "731be0d9c99e33d66ab6ba074fcf598c940fa02d"

package:
  name: gaw
  version: ${{ version }}

source:
  url: https://github.com/StefanSchippers/xschem-gaw/archive/${{ commit }}.tar.gz
  sha256: 958e4dabc000b60c71cccebfc3b9da213ede3f92b223ade963841ce93a9022a1

build:
  number: 0
  skip:
    - win
    - osx
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - pkgconf
  host:
    - gtk3
    - glib         # ships glibconfig.h (libglib alone lacks it)
    - zlib         # gio-2.0.pc Requires.private: zlib (libzlib ships no zlib.pc)
    - expat        # fontconfig.pc Requires.private: expat (libexpat ships no expat.pc)
  run:
    - gtk3

tests:
  - script:
      - test -f ${PREFIX}/bin/gaw

about:
  homepage: https://gaw.tuxfamily.org/
  repository: https://github.com/StefanSchippers/xschem-gaw
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Analog waveform displaying tool (GTK3 fork shipped with xschem)
  description: |
    Gaw is a software tool for displaying analog waveforms from sampled data,
    for example from the output of simulators or input from sound cards.
    Data can be imported to gaw using files, direct tcp/ip connection or
    directly from the sound card. This is the GTK3 fork maintained alongside
    xschem (the original gaw at gaw.tuxfamily.org uses GTK2).

extra:
  recipe-maintainers:
    - duyhieubui
