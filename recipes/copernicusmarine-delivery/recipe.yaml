schema_version: 1

context:
  python_min: "3.11"
  version: "0.5.0"

package:
  name: copernicusmarine-delivery
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/copernicusmarine-delivery/copernicusmarine_delivery-${{ version }}.tar.gz
  sha256: 30132462783348486f3a4f1fa3300f2e7474a9d5de71fd1b1867207504723397

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - copernicusmarine-delivery = copernicusmarine_delivery.command_line_interface:cli
      - cm-de = copernicusmarine_delivery.command_line_interface:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - click >=8.4.0,<9
    - obstore >=0.10.0,<1
    - pydantic >=2.13.4,<3
    - pyyaml >=6.0.3,<7
    - tqdm >=4,<5
    - requests

tests:
  - python:
      imports:
        - copernicusmarine_delivery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - copernicusmarine-delivery --help
      - cm-de --help

about:
  summary: Python tool for data producers from the Copernicus Marine services
  license: EUPL-1.2
  license_file: LICENSE
  homepage: https://pypi.org/project/copernicusmarine-delivery/

extra:
  recipe-maintainers:
    - renaudjester
    - jordi-domingo
    - hectormauer
