schema_version: 1

context:
  name: opentelemetry-configuration
  version: "0.66b1"
  sdk_version: "1.45.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/o/opentelemetry-configuration/opentelemetry_configuration-${{ version }}.tar.gz
    sha256: ccc169457447c6910464591b9820b750896111b9d05ee8c2c4f7757173697b2b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ==${{ sdk_version }}
    - opentelemetry-sdk ==${{ sdk_version }}
    - pyyaml >=5.4
    - jsonschema >=4.0

tests:
  - python:
      imports:
        - opentelemetry.configuration
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: OpenTelemetry Python Declarative Configuration (experimental)
  description: |
    Declarative (file-based) configuration support for the OpenTelemetry
    Python SDK, implementing the OpenTelemetry configuration file schema.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/opentelemetry-configuration
  repository: https://github.com/open-telemetry/opentelemetry-python

extra:
  recipe-maintainers:
    - soapy1
