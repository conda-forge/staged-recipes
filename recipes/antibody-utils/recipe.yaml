context:
  version: "0.1.1"

package:
  name: antibody-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/antibody-utils/antibody_utils-${{ version }}.tar.gz
  sha256: 161fa1ac239525beea59cbd145634a1fb79e3b5186a0de6139d5a0ead1f4cdd9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.12.22,<0.13.0
  run:
    - python >=${{ python_min }}
    - gemmi
    - numpy
  run_constraints:
    # The optional `numbering` extra.
    - anarcii >=2

tests:
  - python:
      imports:
        - antibody_utils
        - antibody_utils.geometry
        - antibody_utils.liabilities
        - antibody_utils.numbering
        - antibody_utils.regions
        - antibody_utils.sequence
        - antibody_utils.structure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      # The packaged data, including NCBI's BLOSUM62 matrix.
      - python -c "from antibody_utils._data import load_blosum62; assert load_blosum62()['W', 'W'] == 11"
      - python -c "from antibody_utils.regions import get_region; assert get_region('111', 'H', scheme='imgt', definition='imgt') == 'cdrh3'"

about:
  homepage: https://github.com/oxpig/antibody-utils
  summary: Utilities for antibody sequence and structure analysis.
  description: |
    Utilities for antibody sequence and structure analysis: numbering, region
    definitions, sequence comparison, VH/VL orientation and more.
  license: BSD-3-Clause
  license_file: LICENCE
  documentation: https://antibody-utils.readthedocs.io
  repository: https://github.com/oxpig/antibody-utils

extra:
  recipe-maintainers:
    - benjaminhwilliams
    - chris-r-taylor
