schema_version: 1

context:
  version: "0.1.1"

package:
  name: elephant-goldfish-model
  version: ${{ version }}

source:
  url: https://github.com/google/elephant-goldfish-model/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a42bbad8128f7ffe00468713976dab77a49ddbcfbf76a1e9019203dd081cf7bf

build:
  number: 0
  noarch: generic
  script: python ${{ RECIPE_DIR }}/build_egm.py

requirements:
  build:
    - python >=3.10

tests:
  - package_contents:
      files:
        - share/elephant-goldfish-model/egm-claude/.claude-plugin/plugin.json
        - share/elephant-goldfish-model/egm-claude/skills/egm-review/SKILL.md
        - share/elephant-goldfish-model/egm-claude/agents/design_critic.md
        - share/elephant-goldfish-model/egm-claude.zip
        - share/elephant-goldfish-model/egm-openai/.codex-plugin/plugin.json
        - share/elephant-goldfish-model/egm-openai/skills/egm-review/SKILL.md
        - share/elephant-goldfish-model/egm-openai.zip

about:
  homepage: https://egm.dev
  repository: https://github.com/google/elephant-goldfish-model
  documentation: https://github.com/google/elephant-goldfish-model/blob/main/docs/getting_started.md
  summary: Plugin for designing and reviewing software with AI coding agents
  description: |
    Elephant-Goldfish Model (EGM) is a plugin for AI coding agents. The
    Elephant drafts a specification with your project context; Goldfish
    reviewers check it with fresh eyes. This package installs the Claude Code
    and OpenAI runtime bundles under $PREFIX/share/elephant-goldfish-model.
    Load it in Claude Code with
    `claude --plugin-dir $CONDA_PREFIX/share/elephant-goldfish-model/egm-claude`.
    Not an officially supported Google product.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
