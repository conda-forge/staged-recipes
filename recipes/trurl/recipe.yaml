context:
  version: "0.16.1"

package:
  name: trurl
  version: ${{ version }}

source:
  url: https://github.com/curl/trurl/archive/trurl-${{ version }}.tar.gz
  sha256: 23aa65146b7c44e633151ff4a4443a0481fed344ff80a6160a7e0fb9eb825681

build:
  number: 0
  script:
    content:
      - if: unix
        then: make NDEBUG=1 TRURL_IGNORE_CURL_CONFIG=1 LDLIBS=-lcurl PREFIX="${PREFIX}" all install
        else: cl.exe /nologo /MD /O2 /W3 /DNDEBUG /D_CRT_SECURE_NO_WARNINGS /I"%LIBRARY_INC%" trurl.c /Fe"%LIBRARY_BIN%\trurl.exe" /link /LIBPATH:"%LIBRARY_LIB%" libcurl.lib

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - if: unix
      then:
        - make
        - perl
  host:
    - libcurl

tests:
  - script:
      - trurl --version
      - trurl --help
      - trurl --url https://curl.se/we/are.html --get '{host}'
  - package_contents:
      bin:
        - trurl

about:
  homepage: https://curl.se/trurl/
  summary: Command line tool for URL parsing and manipulation
  description: |
    trurl is a command line tool that parses and manipulates URLs, designed to help
    shell script authors everywhere. It uses libcurl's URL parser.
  license: curl
  license_file:
    - COPYING
  repository: https://github.com/curl/trurl
  documentation: https://curl.se/trurl/manual.html

extra:
  recipe-maintainers:
    - XhstormR
