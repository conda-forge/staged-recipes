schema_version: 1

context:
  version: "2.9.2"
  rev: "609230c838a8753debf83b8535b7971e250d5888"

package:
  name: simset
  version: ${{ version }}

source:
  - git: https://github.com/NikEfth/simset
    # https://github.com/UWSimSET/simset/
    rev: ${{ rev }}
    depth: 200

build:
  number: 0
  skip:
    - win
  script:
    - cd $SRC_DIR
    - cmake -GNinja -S . -B build -DCMAKE_INSTALL_PREFIX:PATH="${PREFIX}" -DSIMSET_BUILD_STATIC=OFF
    - ninja -C build install

requirements:
  build:
    - cmake
    - ninja
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}

tests:
  - package_contents:
      include:
        - SimSET-*/simset/Photon.h
      files:
        - lib/cmake/SimSET-*/SimSETConfig.cmake
        - lib/cmake/SimSET-*/SimSETConfigVersion.cmake
        - lib/*simset.* # libsimset.a or equivalent should be present

about:
  summary: Simulation System for Emission Tomography (SimSET)
  license: MIT
  license_file: LICENSE
  homepage: https://depts.washington.edu/simset/html/simset_main.html

extra:
  recipe-maintainers:
    - dwbuw
    - KrisThielemans
