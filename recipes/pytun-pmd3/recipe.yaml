context:
  version: "3.0.3"

package:
  name: pytun-pmd3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytun_pmd3/pytun_pmd3-${{ version }}.tar.gz
  sha256: 7fa822092139b4b77e08fad9233dbd4a6fcca2cf2423b0775db962ca5e87a017

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pytun_pmd3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/doronz88/pytun-pmd3
  summary: Cross-platform TUN interface for pymobiledevice3
  license: MIT AND LicenseRef-Wintun-Prebuilt-Binaries
  license_file:
    - LICENSE
    - pytun_pmd3/wintun/LICENSE.txt

extra:
  recipe-maintainers:
    - pavelzw
