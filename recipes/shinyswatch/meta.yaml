{% set name = "shinyswatch" %}
{% set version = "0.10.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8a5320b39210f1d17209c1b850af3ffde8eff17f14f80cb59e618e31c730d59d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=60
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - typing-extensions >=3.10.0.0
    - packaging >=20.9
    - htmltools >=0.2.0
    - shiny >=1.2.0

test:
  imports:
    - shinyswatch
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/rstudio/py-shinyswatch
  summary: Bootswatch + Bootstrap 5 themes for Shiny.
  description: |
    shinyswatch packages the Bootswatch themes for use with Shiny for Python.
    Themes are applied with `shinyswatch.theme.<name>` and cover the full
    Bootswatch 5 set, letting an application switch its entire Bootstrap look
    with a single argument.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://posit-dev.github.io/py-shinyswatch/
  dev_url: https://github.com/rstudio/py-shinyswatch

extra:
  recipe-maintainers:
    - schloerke
    - cpsievert
    - gadenbuie
    - jcheng5
