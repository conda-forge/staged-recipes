context:
  version: "0.5.6"

package:
  name: urna
  version: ${{ version }}

source:
  url: https://github.com/hoffresearch/urna/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b370067bd926bd3d1b8633db9ac70be1a0c5eb313caf3e53422175402ce61aac

build:
  number: 0
  script:
    env:
      URNA_RELEASE_TAG: v${{ version }}
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - if: unix
        then: cargo install --locked --no-track --root "$PREFIX" --path rust/clitui --bin urna
        else: cargo install --locked --no-track --root "%LIBRARY_PREFIX%" --path rust/clitui --bin urna

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  run:
    - curl

tests:
  - script:
      - urna --version

about:
  homepage: https://urna.dev
  repository: https://github.com/hoffresearch/urna
  documentation: https://github.com/hoffresearch/urna/blob/main/docs/USAGE.md
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Offline-first vector database in one file, with citations you can verify

extra:
  recipe-maintainers:
    - brennercruvinel
