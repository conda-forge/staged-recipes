schema_version: 1

context:
  version: 0.66b2

package:
  name: opentelemetry-instrumentation-aiohttp-server
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/opentelemetry-instrumentation-aiohttp-server/opentelemetry_instrumentation_aiohttp_server-${{ version }}.tar.gz
  sha256: a0c80a1a44a67472e4674dab3ad60ee3205e34582afb3145b062aa0cf8e5a022

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.12,<2.dev0
    - opentelemetry-instrumentation ==0.66b2
    - opentelemetry-semantic-conventions ==0.66b2
    - opentelemetry-util-http ==0.66b2
    - wrapt >=1.0.0,<3.0.0
    - aiohttp

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.aiohttp_server
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: Aiohttp server instrumentation for OpenTelemetry
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-aiohttp-server

extra:
  recipe-maintainers:
    - jsmolic
