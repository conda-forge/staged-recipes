schema_version: 1

context:
  version: 1.1.3
  release_sha256: ffe0bf5a35f715bc055bdff6c6b46d12bbc2d41165719c145fd6ea4cfb14da16

package:
  name: epcsaft
  version: ${{ version }}

source:
  - url: https://github.com/tannerpolley/epcsaft/archive/refs/tags/v${{ version }}.tar.gz
    sha256: ${{ release_sha256 }}
  - url: https://github.com/coin-or/Ipopt/archive/refs/tags/releases/3.11.9.tar.gz
    sha256: c092093baceec820fb917f28059b87e48831d9a7f98f312b981efda02dc7a09a
    target_directory: ipopt-source
  - url: https://github.com/coin-or/CppAD/archive/refs/tags/20250000.3.tar.gz
    sha256: a3a4030ae49719e88e5057e923c4c97c5ba8910e22471f22661420ce65747fbe
    target_directory: engine/build/subprojects/CppAD-20250000.3
  - url: https://github.com/ERGO-Code/HiGHS/archive/refs/tags/v1.15.1.tar.gz
    sha256: a840d269dff2fafb371dd247df13ad5e026d7ce3b35ad3dc1eedd59bf0c2fb16
    target_directory: engine/build/subprojects/HiGHS-1.15.1
  - url: https://raw.githubusercontent.com/eigen-mirror/eigen/3.4.0/COPYING.MPL2
    sha256: fab3dd6bdab226f1c08630b1dd917e11fcb4ec5e1e020e2c16f83a0a13863e85
    file_name: Eigen-COPYING.MPL2
    target_directory: licenses

build:
  number: 0
  skip:
    - target_platform != "linux-64"
    - not match(python, "3.13.*")
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - make
    - cmake
    - ninja
    - pkg-config
    - patchelf
  host:
    - python
    - pip
    - meson >=1.8
    - meson-python >=0.18
    - nanobind ==2.12.0
    - eigen ==3.4.0
    - ceres-solver >=2.2.0,<2.3.0 cpu*
    - mumps-seq ==5.8.2
    - libblas
    - liblapack
  run:
    - python
    - ceres-solver >=2.2.0,<2.3.0 cpu*
    - mumps-seq >=5.8.2,<5.8.3.0a0
    - libblas
    - liblapack

tests:
  - python:
      imports:
        - epcsaft
      pip_check: true
  - script:
      file: run_test.py

about:
  homepage: https://github.com/tannerpolley/epcsaft
  repository: https://github.com/tannerpolley/epcsaft
  summary: Electrolyte PC-SAFT properties, equilibrium and exact derivative actions
  description: |
    Linux x86-64 / CPython 3.13 package, with private Ipopt 3.11.9 and MUMPS.
    Corresponding source is available from the distributor in the source-set
    download alongside the matching version at
    https://github.com/tannerpolley/epcsaft/releases. It contains the exact
    Engine and Ipopt sources, embedded dependency sources, recipe and patches.
  license: LicenseRef-GPL-3.0-with-Ipopt-permission AND EPL-1.0 AND (EPL-2.0 OR GPL-2.0-or-later) AND MPL-2.0 AND BSD-3-Clause AND MIT AND Zlib AND LicenseRef-NIST AND LicenseRef-ASL-headers
  license_file:
    - LICENSE
    - NOTICE
    - ipopt-source/Ipopt/LICENSE
    - engine/build/subprojects/CppAD-20250000.3/COPYING
    - engine/build/subprojects/CppAD-20250000.3/epl-2.0.txt
    - engine/build/subprojects/HiGHS-1.15.1/LICENSE.txt
    - engine/build/subprojects/HiGHS-1.15.1/extern/pdqsort/license.txt
    - engine/build/subprojects/HiGHS-1.15.1/highs/io/filereaderlp/LICENSE
    - engine/data/superancillary/LICENSE-NIST.md
    - engine/build/subprojects/packagefiles/asl/funcadd.h
    - engine/build/subprojects/packagefiles/asl/stdio1.h
    - licenses/Eigen-COPYING.MPL2
    - licenses/nanobind-LICENSE
    - licenses/robin-map-LICENSE

extra:
  recipe-maintainers:
    - tannerpolley
