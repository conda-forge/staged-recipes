schema_version: 1

context:
  name: langgraph-checkpoint-sqlite
  version: 3.1.3

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langgraph_checkpoint_sqlite-${{ version }}.tar.gz
  sha256: df305e347e66d97375e680bc4a5337e4d37d5a4996b3c24f49a942c515caa7d7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - langgraph-checkpoint >=4.3.1,<5.0.0
    - aiosqlite >=0.20
    - sqlite-vec-python >=0.1.6

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - langgraph.checkpoint.sqlite
      pip_check: true

about:
  summary: Library with a SQLite implementation of LangGraph checkpoint saver.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/langchain-ai/langgraph/tree/main/libs/checkpoint-sqlite
  homepage: https://github.com/langchain-ai/langgraph

extra:
  recipe-maintainers:
    - Emrys-Merlin
