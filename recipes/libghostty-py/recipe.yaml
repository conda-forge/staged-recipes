context:
  version: "0.2.0"

package:
  name: libghostty-py
  version: ${{ version }}

source:
  url: https://github.com/davidbrochart/libghostty-py/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f20928ca69265c10c75982cf316fa350db54963b10effcd889936b99e86b3e07

build:
  number: 0
  skip: match(python, "<3.10")
  script: python -m pip install . -vv --no-deps --no-build-isolation --config-settings=bundle=false

requirements:
  host:
    - python
    - pip
    - setuptools >=77
    # Its exact run export pins the experimental C ABI, including the build.
    - libghostty-vt ==0.1.0.dev
  run:
    - python >=3.10
    - cffi

tests:
  - python:
      imports:
        - ghostty
      pip_check: true
  - script: pytest -q tests/test_core.py tests/test_serialize.py
    requirements:
      run:
        - pytest
    files:
      source:
        - tests/test_core.py
        - tests/test_serialize.py

about:
  homepage: https://github.com/davidbrochart/libghostty-py
  summary: Python bindings for the Ghostty terminal emulation library
  license: Apache-2.0 AND MIT
  license_file:
    - LICENSE
    - LICENSE.ghostty
  repository: https://github.com/davidbrochart/libghostty-py

extra:
  recipe-maintainers:
    - davidbrochart
