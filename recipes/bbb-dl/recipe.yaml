schema_version: 1

context:
  version: "1.0.13"

package:
  name: bbb-dl
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/bbb-dl/bbb_dl-${{ version }}.tar.gz
  sha256: 7b558de0c2365958c7402c588153b114a7aff186cfdee2516e17e66420c2fbe8

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bbb-dl = bbb_dl.main:main
      - bbb-dl-batch = bbb_dl.batch:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ffmpeg
    - aiofiles >=22.1.0
    - aiohttp >=3.8.3
    - certifi >=2020.4.5.2
    - colorama >=0.4.6
    - playwright >=1.29.0
    - python-ffmpeg >=2.0.12
    - requests >=2.24.0

tests:
  - python:
      imports:
        - bbb_dl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - bbb-dl --help
      - bbb-dl-batch --help
      - ffmpeg -version

about:
  summary: Big Blue Button Downloader that downloads a BBB lesson as MP4 video
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/C0D3D3V/bbb-dl

extra:
  recipe-maintainers:
    - ReimarBauer
