schema_version: 1

context:
  version: "0.2.0"

package:
  name: canopy_factory
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/canopy-factory/canopy_factory-${{ version }}.tar.gz
  sha256: a0054fa776333c1d013841da1ae28124e7b9f7cfaf92e9c83f89d23dea3b6d16

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --no-build-isolation -vv .
  python:
    entry_points:
      - canopy_factory = canopy_factory.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >=${{ python_min }}
    - ffmpeg
    - hothouse
    - imageio
    - matplotlib
    - numpy
    - pandas
    - pvlib
    - pyshp
    - pyyaml
    - scipy
    - simulatr
    - yggdrasil-python-rapidjson

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - canopy_factory
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - canopy_factory --help

about:
  homepage: https://github.com/langmm/canopy_factory
  repository: https://github.com/langmm/canopy_factory
  license: GPL-3.0
  license_file: LICENSE
  summary: Tool for generating and utilizing 3D meshes for simulated canopies
  description: |
    Tool for generating and utilizing 3D meshes for simulated canopies
  documentation: https://langmm.github.io/canopy_factory/

extra:
  recipe-maintainers:
    - langmm
