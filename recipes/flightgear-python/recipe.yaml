schema_version: 1

context:
  version: "2.1.0"

package:
  name: flightgear-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flightgear_python/flightgear_python-${{ version }}.tar.gz
  sha256: aec0e6eede08ccce2723e665fc8a2655e5cfec67a5435c67251504714b3833fa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - construct >=2.10,<3.0
    - multiprocess >=0.70,<0.71
    - requests >=2.32,<3.0

tests:
  - python:
      imports:
        - flightgear_python
        - flightgear_python.fg_if
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/julianneswinoga/flightgear-python
  repository: https://github.com/julianneswinoga/flightgear-python
  documentation: https://flightgear-python.readthedocs.io/en/latest
  license: MIT
  license_file: LICENSE
  summary: Interface for FlightGear network connections
  description: |
    flightgear-python provides a Pythonic interface to FlightGear's network
    protocols. It supports the Flight Dynamics Model (FDM), controls, and GUI
    network interfaces, letting you read simulation state and write control
    inputs from Python while the simulator runs.

extra:
  recipe-maintainers:
    - killua156
