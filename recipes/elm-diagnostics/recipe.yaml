schema_version: 1

context:
  python_min: "3.10"
  version: "0.1.0"

package:
  name: elm-diagnostics
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/elm-diagnostics/elm_diagnostics-${{ version }}.tar.gz
  sha256: 260001fc4efaaf6832128ceeb89f719ee6107eabc4a1b14020379929c70dc682

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - elm-diagnostics = elm_diagnostics.cli:app

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - xarray >=2023.1
    - numpy >=1.24
    - pandas >=2.0
    - matplotlib-base >=3.7
    - jinja2 >=3.1
    - netcdf4 >=1.6
    - cftime >=1.6
    - pyyaml >=6.0
    - pint >=0.22
    - pint-xarray >=0.3
    - pydantic >=2.0
    - typer >=0.9
    - rich >=13.0

tests:
  - python:
      imports:
        - elm_diagnostics
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
        - pytest
    script:
      - elm-diagnostics --help
      - pytest -v

about:
  summary: Diagnostics and budget-closure tools for E3SM's ELM land model
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  homepage: https://pypi.org/project/elm-diagnostics/
  repository: https://github.com/ngee-arctic/elm-diagnostics

extra:
  recipe-maintainers:
    - rfiorella
