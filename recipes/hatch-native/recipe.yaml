schema_version: 1

context:
  name: hatch-native
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/hatch_native-${{ version }}.tar.gz
  sha256: a75a8473336caa1440e40ffdd80a9390910c953ba38bf0a7b875fedf6ab69910

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pydantic

tests:
  - python:
      imports:
        - hatch_native
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Shared native-build helpers for hatch plugins
  description: |
    Helpers shared by the hatch native build plugins (hatch-rs, hatch-cpp)
    for wheels that ship a C ABI library next to a Python extension.
  homepage: https://github.com/python-project-templates/hatch-native
  repository: https://github.com/python-project-templates/hatch-native

extra:
  recipe-maintainers:
    - timkpaine
