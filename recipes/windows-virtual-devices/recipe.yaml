schema_version: 1
package:
  name: windows-virtual-devices
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Windows-Virtual-Devices/language-sdks-v1.0.0/windows-virtual-devices-sdk-source-1.0.0.zip
  sha256: 863bf1fa4952d3e4e56388581cb591fcb691375d4d4a22ef825ec9fa8cf217a6
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - windows_virtual_devices
    pip_check: true
- script:
  - python -m pip check
  - python -c "from windows_virtual_devices import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Windows-Virtual-Devices
  summary: Windows x64 Windows-Virtual-Devices Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Windows-Virtual-Devices-C-ffi/LICENSE
  - Windows-Virtual-Devices-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
