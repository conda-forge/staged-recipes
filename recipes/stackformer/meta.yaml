{% set version = "0.1.10" %}

package:
  name: stackformer
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/stackformer/stackformer-{{ version }}.tar.gz
  sha256: 0fa25744b543ad2d6a9e14b82b028a32a574067c0bca3ae1e887f7c15423675b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - setuptools >=61
    - wheel
    - pip
  run:
    - python >=3.10
    - pytorch >=2.3,<3.0
    - numpy >=1.23,<3.0
    - tqdm >=4.5,<5.0
    - tensorboard >=2.14,<3.0
    - wandb >=0.17,<1.0
    - safetensors >=0.4,<1.0

test:
  imports:
    - stackformer
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/stackformer/
  summary: Modular transformer blocks built in PyTorch
  doc_url: https://github.com/stackformer-labs/Stackformer/tree/main/docs
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Gurumurthy30
