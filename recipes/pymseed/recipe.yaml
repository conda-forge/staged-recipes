schema_version: 1

context:
  version: "0.9.5"

package:
  name: pymseed
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymseed/pymseed-${{ version }}.tar.gz
  sha256: cd4144b9ef51a12bff3fa018b49979c293ed68dc9c5c6d979def3753aa24cf69

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=68.0.0
    - cffi >=2.0.0
  run:
    - python
    - cffi >=2.0.0
    - orjson >=3.11.7

tests:
  - python:
      imports:
        - pymseed
        - pymseed.MS3Record
        - pymseed.MS3TraceList

        - pymseed.MS3Record
        - pymseed.MS3TraceList

        - pymseed.MS3Record
        - pymseed.MS3TraceList

      pip_check: true

about:
  summary: A Python package for reading and writing miniSEED formatted data
  homepage: https://github.com/EarthScope/pymseed
  repository: https://github.com/EarthScope/pymseed
  license: Apache-2.0
  license_file:
    - LICENSE
    - cffi_module/libmseed/LICENSE

extra:
  recipe-maintainers:
    - chad-earthscope
