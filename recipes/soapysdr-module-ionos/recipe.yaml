schema_version: 1

context:
  name: soapysdr-module-ionos
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ionos-sdr/SoapyIonos/archive/refs/tags/v${{ version }}.tar.gz
  sha256: eec1e549a5d20493a9132a5a63e2c42e4bbf246d2ce6c61a2a8d56929b022b7b

build:
  number: 0

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
  host:
    - soapysdr
  run_exports:
    - ${{ pin_subpackage("soapysdr-module-ionos", upper_bound="x.x") }}

tests:
  - package_contents:
      strict: true
      files:
        - if: not win
          then: lib/SoapySDR/modules${{ soapysdr }}/libionosSupport.so
          else: Library/lib/SoapySDR/modules${{ soapysdr }}/ionosSupport.dll
  - script:
      - SoapySDRUtil --info
      - if: not win
        then: SoapySDRUtil --info | grep ionosSupport
        else: SoapySDRUtil --info | findstr /l ionosSupport

about:
  license: MIT
  license_file: LICENSE
  summary: SoapySDR Ionos SDR Support Module
  description: |
    SoapyIonos is a SoapySDR module for the Ionos SDR family (ESP32-S3 USB
    bridge with a Silicon Labs EFR32FG23 radio), streaming I/Q samples over
    USB CDC. Device capabilities are read from the hardware at runtime.
  homepage: https://github.com/ionos-sdr/SoapyIonos
  repository: https://github.com/ionos-sdr/SoapyIonos
  documentation: https://github.com/ionos-sdr/SoapyIonos/blob/main/README.md

extra:
  recipe-maintainers:
    - zodoczi
