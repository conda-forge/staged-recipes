context:
    version: "1.5.0"

package:
    name: caesiumclt
    version: ${{ version }}

source:
    url: https://github.com/Lymphatus/caesium-clt/archive/v${{ version }}.tar.gz
    sha256: c170c4d1ab1179b3757ec39f00c08250b121195e07f013fcbf9f3952db333a05

build:
    number: 0
    script:
        env:
            CARGO_PROFILE_RELEASE_STRIP: symbols
            CARGO_PROFILE_RELEASE_LTO: fat
        content:
            - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
            - if: unix
              then: cargo auditable install -j ${CPU_COUNT} --root "${PREFIX}" --path . --locked --no-track
              else: cargo auditable install -j %CPU_COUNT% --root "%PREFIX%" --path . --locked --no-track

requirements:
    build:
        - ${{ stdlib('c') }}
        - ${{ compiler('rust') }}
        - cargo-bundle-licenses
        - cargo-auditable

tests:
    - script:
          - caesiumclt --version
          - caesiumclt --help
    - package_contents:
          strict: true
          bin:
              - caesiumclt

about:
    homepage: https://github.com/Lymphatus/caesium-clt
    summary: "Caesium Command Line Tools - Lossy/lossless image compression tool."
    description: |
        caesiumclt is a powerful command-line tool for image compression written in Rust that delivers exceptional results with minimal effort. Whether you need pixel-perfect lossless compression or aggressive size reduction, caesiumclt has you covered.
    license: Apache-2.0
    license_file:
        - LICENSE.md
        - THIRDPARTY.yml
    repository: https://github.com/Lymphatus/caesium-clt

extra:
    recipe-maintainers:
        - XhstormR
