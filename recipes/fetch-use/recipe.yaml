context:
  version: "0.4.0"

package:
  name: fetch-use
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/f/fetch-use/fetch_use-${{ version }}.tar.gz
  sha256: 9511987d4907ec6dac501e21d66946d10098f66b5d21bc2aba4189cd81ba189a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fetch_use
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://browser-use.com
  summary: Python client for Browser-Use Fetch HTTP service
  license: MIT
  # Upstream declares MIT in PKG-INFO and README.md but omits the full text.
  # LICENSE is supplied by this recipe; no copyright attribution is inferred.
  license_file:
    - LICENSE
    - README.md

extra:
  recipe-maintainers:
    - eunos-1128
