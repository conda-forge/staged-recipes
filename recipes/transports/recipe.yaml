context:
  version: "0.8.0"

package:
  name: transports
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/transports/transports-${{ version }}.tar.gz
  sha256: fa676751457aaf51225b09a6a4b27b6cabfa9dc893218044f26c6bc95c1dde20

build:
  number: 0
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    - if: unix
      then:
        - export PYO3_PYTHON="$PYTHON"
        - export RUSTFLAGS=""
      else:
        - set "PYO3_PYTHON=%PYTHON%"
        - set "RUSTFLAGS="
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('rust') }}
    - rust-std-wasm32-unknown-unknown
    - wasm-bindgen-cli ==0.2.126
    - cargo-bundle-licenses
    - if: linux
      then:
        - pkg-config
  host:
    - python
    - pip
    - hatchling
    - hatch-js
    - hatch-rs
    - pnpm
    - if: is_abi3
      then:
      - python-abi3
  run:
    - python
    - bigbrother >=0.1.4
    - msgspec
    - pydantic

tests:
  - python:
      imports:
        - transports
      pip_check: true
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
  - if: is_abi3
    then:
      requirements:
        run:
          - abi3audit
      script:
        - if: unix
          then: abi3audit $SP_DIR/transports/transports.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit %SP_DIR%/transports/transports.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Generic communication library
  homepage: https://github.com/1kbgz/transports
  repository: https://github.com/1kbgz/transports

extra:
  recipe-maintainers:
    - timkpaine
