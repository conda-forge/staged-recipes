schema_version: 1

context:
  name: kallichore
  version: "0.1.71"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/posit-dev/kallichore/archive/refs/tags/${{ version }}.tar.gz
  sha256: 98c105f6a15dc1da352a7337117c125bd17179e081008e57fdaff4a911eb8047

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - if: unix
        then: cargo install --bins --no-track --locked --root ${{ PREFIX }} --path crates/kcserver
        else: cargo install --bins --no-track --locked --root %LIBRARY_PREFIX% --path crates\kcserver

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - package_contents:
      bin:
        - kcserver

about:
  homepage: https://github.com/posit-dev/kallichore
  repository: https://github.com/posit-dev/kallichore
  summary: Jupyter kernel supervisor used by the Positron IDE
  description: |
    Kallichore (kcserver) is a headless supervisor for Jupyter kernels. It starts,
    monitors and proxies kernel sessions for Positron.
  license: Elastic-2.0
  license_file:
    - LICENSE.txt
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - mediocretech
