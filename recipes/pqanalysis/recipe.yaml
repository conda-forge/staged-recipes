schema_version: 1

context:
  name: pqanalysis
  version: "1.6.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2a520c6cabad5a9647122232a8a9f656f7c3eba7a6b412fd47c6c19ea3fde7a7

build:
  number: 0
  skip: match(python, "<3.12")
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pqanalysis = PQAnalysis.cli.main:main
      - traj2box = PQAnalysis.cli.traj2box:main
      - traj2extxyz = PQAnalysis.cli.traj2extxyz:main
      - traj2qmcfc = PQAnalysis.cli.traj2qmcfc:main
      - rst2xyz = PQAnalysis.cli.rst2xyz:main
      - xyz2rst = PQAnalysis.cli.xyz2rst:main
      - continue_input = PQAnalysis.cli.continue_input:main
      - rdf = PQAnalysis.cli.rdf:main
      - msd = PQAnalysis.cli.msd:main
      - vacf = PQAnalysis.cli.vacf:main
      - build_spectrum = PQAnalysis.cli.build_spectrum:main
      - check_momentum = PQAnalysis.cli.check_momentum:main
      - vibrations = PQAnalysis.cli.vibrations:main
      - add_molecules = PQAnalysis.cli.add_molecules:main
      - activate_argcomplete = PQAnalysis.cli.activate_argcomplete:main
      - build_nep_traj = PQAnalysis.cli.build_nep_traj:main
      - xyz2gen = PQAnalysis.cli.xyz2gen:main
      - gen2xyz = PQAnalysis.cli.gen2xyz:main

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=70
    - setuptools-scm >=8
    - wheel
    - cython >=3
    - numpy
  run:
    - python
    - numpy
    - scipy
    - beartype
    - multimethod
    - lark
    - tqdm
    - decorator
    - argcomplete
    - rich-argparse

tests:
  - python:
      imports:
        - PQAnalysis
        - PQAnalysis.io
        - PQAnalysis.io.traj_file._slab_parser
        - PQAnalysis.io.traj_file.process_lines
        - PQAnalysis.analysis.momentum._momentum_kernel
        - PQAnalysis.analysis.msd._msd_kernel
        - PQAnalysis.analysis.rdf._rdf_kernel
        - PQAnalysis.analysis.vacf._vacf_kernel
      pip_check: true
  - script:
      - pqanalysis --help

about:
  homepage: https://github.com/MolarVerse/PQAnalysis
  repository: https://github.com/MolarVerse/PQAnalysis
  license: MIT
  license_file: LICENSE
  summary: A Python package for the post-processing and analysis of molecular dynamics simulations.
  description: |
    PQAnalysis reads, writes, and analyses molecular dynamics trajectories and
    related data (coordinates, restart files, cells), with command-line tools
    for common trajectory conversions.

extra:
  recipe-maintainers:
    - galjos
