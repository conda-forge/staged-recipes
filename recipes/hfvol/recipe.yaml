schema_version: 1

context:
  name: hfvol
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/hfvol-${{ version }}.tar.gz
  sha256: c1e5930c600c08f2b35cd57be944c685ac0261ed15a6b3593dd4ebdec8545712

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.18
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
  run_constraints:
    - scipy >=1.8

tests:
  - python:
      imports:
        - hfvol
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
        - pyproject.toml
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - scipy >=1.8
        - pandas
    script:
      # tests/test_sktime.py skips itself (pytest.importorskip) when sktime is absent.
      - pytest tests -v

about:
  homepage: https://github.com/Mattbusel/hfvol
  summary: Realized variance, bipower and jump variation, Hawkes intensity and HAR-RV forecasting on numpy, with sktime estimators
  description: |
    hfvol computes high-frequency volatility measures on plain numpy arrays:
    realized variance, bipower variation, jump variation, a Hawkes process
    intensity path and the HAR-RV (Corsi) forecaster. The same functions are
    wrapped as sktime transformers and a forecaster (RealizedVariance,
    BipowerVariation, JumpVariation, HawkesIntensity, HARForecaster) that pass
    sktime's check_estimator. The only required dependency is numpy; scipy and
    sktime are optional.
  license: MIT
  license_file:
    - LICENSE
    - NOTICE
  repository: https://github.com/Mattbusel/hfvol
  documentation: https://github.com/Mattbusel/hfvol/tree/main/docs

extra:
  recipe-maintainers:
    - Mattbusel
