schema_version: 1

context:
  version: 1.3b0

package:
  name: opentelemetry-instrumentation-genai-openai
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/opentelemetry-instrumentation-genai-openai/opentelemetry_instrumentation_genai_openai-${{ version }}.tar.gz
  sha256: 84c9f05227d213eeaeced4fac9630ffc908956195e73ada853a34883dfc4961f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.43,<2.dev0
    - opentelemetry-instrumentation >=0.64b0,<1
    - opentelemetry-semantic-conventions >=0.64b0,<1
    - opentelemetry-util-genai >=1.3b0.dev,<2
    - openai

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.genai.openai
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: OpenTelemetry Official OpenAI instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-genai/tree/main/instrumentation/opentelemetry-instrumentation-genai-openai

extra:
  recipe-maintainers:
    - jsmolic
