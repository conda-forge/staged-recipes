context:
  version: "0.3.1"

package:
  name: f2py-cmake
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/f2py-cmake/f2py_cmake-${{ version }}.tar.gz
  sha256: 066a19d7fdd579104d745eb4fb38ef08b99aef597dea344f6ea2c1adace617bb

build:
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - f2py-cmake = f2py_cmake.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - f2py_cmake
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - f2py-cmake --version
      - mkdir vendored
      - f2py-cmake vendor vendored
      - test -f vendored/UseF2Py.cmake
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/scikit-build/f2py-cmake
  summary: CMake helpers for building F2Py modules
  description: |
    f2py-cmake provides the UseF2Py CMake module, which makes it easy to
    build NumPy F2PY extension modules from CMake-based projects (for
    example together with scikit-build-core).
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/scikit-build/f2py-cmake

extra:
  recipe-maintainers:
    - LiuGaoyong
