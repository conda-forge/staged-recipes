context:
  name: pylogdigitizer
  version: "0.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: a639fe73fe89c2082c89062065c81f561ff6596ae319309a359b7e7b9211f867

build:
  number: 0
  skip:
    - win
    # conda-forge rapidocr requires Python >=3.11
    - match(python, "<3.11")
    # pyo3 0.22 supports CPython up to 3.13
    - match(python, ">=3.14")
  script:
    content:
      - cd rust && cargo-bundle-licenses --format yaml --output ../THIRDPARTY.yml && cd ..
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.5,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.5,<2
  run:
    - python
    - numpy
    - pillow
    - tifffile
    - lasio
    - pandas
    - pyyaml
    - py-opencv
    - scikit-image
    - scipy
    - rapidocr >=3,<4
    - onnxruntime
    - numba
    - fastapi
    - uvicorn
    - httpx
    - matplotlib-base

tests:
  - python:
      imports:
        - pylogdigitizer
        - pylogdigitizer.curve_tracing_rs
      pip_check: true
  - script:
      - pylogdigitizer --help
      - python -c "import pathlib, pylogdigitizer; d = pathlib.Path(pylogdigitizer.__file__).parent / 'ocr_models'; names = ['ch_PP-OCRv4_det_infer.onnx', 'ch_PP-OCRv4_rec_infer.onnx', 'ch_ppocr_mobile_v2.0_cls_infer.onnx']; missing = [n for n in names if not (d / n).is_file()]; assert not missing, missing"
    requirements:
      run:
        - python

about:
  summary: Semi-automatic and ML-assisted digitization of raster scans of petrophysical well logs
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - NOTICE
    - THIRDPARTY.yml
  homepage: https://github.com/GeoLarryLai/pyLogDigitizer
  repository: https://github.com/GeoLarryLai/pyLogDigitizer

extra:
  recipe-maintainers:
    - GeoLarryLai
