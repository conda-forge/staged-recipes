context:
  version: "0.1.1"

package:
  name: jupyterlab-pierre-dark
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-pierre-dark/jupyterlab_pierre_dark-${{ version }}.tar.gz
  sha256: 432d001490d2dc900123c2698924e321bcd1e7e1fb8c969ec907e045399a8cd2

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - hatch-jupyter-builder >=0.5
    - jupyter-builder >=1.0.0b1,<2.0.0a0
    - hatch-nodejs-version >=0.3.2
    - jupyterlab >=4.0.0,<5
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jupyterlab_pierre_dark
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - package_contents:
      files:
        - share/jupyter/labextensions/jupyterlab-pierre-dark/package.json

about:
  homepage: https://github.com/jtpio/jupyterlab-pierre-theme
  summary: JupyterLab dark theme matching the Pierre palette
  description: |
    A JupyterLab dark theme matching the Pierre palette, shipped as a prebuilt extension.
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/jtpio/jupyterlab-pierre-theme

extra:
  recipe-maintainers:
    - SylvainCorlay
    - jtpio
