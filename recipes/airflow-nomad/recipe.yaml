schema_version: 1

context:
  name: airflow-nomad
  version: "0.2.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/airflow-nomad/airflow_nomad-${{ version }}.tar.gz
  sha256: 572aa18793fbf002aaecbd6f1effed421742f2ca5c3708df5986f47ee3fe14fb

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - airflow-ha >=1.6.5,<1.7
    - airflow-pydantic >=1.7.0,<1.8
    - nomad-pydantic >=0.2.0,<0.3

tests:
  - python:
      imports:
        - airflow_nomad
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/airflow-laminar/airflow-nomad
  summary: Nomad operators and configuration for long-running tasks
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://airflow-laminar.github.io/airflow-nomad/
  repository: https://github.com/airflow-laminar/airflow-nomad

extra:
  recipe-maintainers:
    - timkpaine
