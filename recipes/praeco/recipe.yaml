schema_version: 1

context:
  version: 0.0.1

package:
  name: praeco
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/praeco/praeco-${{ version }}.tar.gz
  sha256: afd933b33b864f3359de3e21ca85111bc1a8cd5ad34aac79afeca380832a293a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.11,<3.14
    - hatchling ==1.29.0
    - hatch-vcs ==0.5.0
    - pip
  run:
    - python >=3.11,<3.14
    - pandas >=3.0.0,<3.1.0
    - pydantic >=2.0.0,<2.14.0
    - rdflib >=7.6.0,<7.7.0
    - requests >=2.32.5,<2.35.0
    - sparqlwrapper >=2.0.0,<2.1.0

tests:
  - python:
      imports:
        - praeco
      pip_check: true

about:
  summary: praeco - Interfaces for publishing workflow recipes, instances and related assets
  license: BSD-3-Clause
  license_file:
    - LICENSE
  homepage: https://pyiron.org/
  documentation: https://praeco.readthedocs.io

extra:
  recipe-maintainers:
    - mbruns91
