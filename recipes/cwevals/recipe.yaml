context:
  version: "0.0.1b1"

package:
  name: cwevals
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cwevals/cwevals-${{ version }}.tar.gz
  sha256: 2ae997369ff44941925e4db1bd07eb4e13c05de412e615636fd12881d63f8a13

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-fancy-pypi-readme
    - pip
  run:
    - python >=${{ python_min }}
    - anyio >=3.5.0,<5
    - distro >=1.7.0,<2
    - httpx >=0.23.0,<1
    - pydantic >=1.9.0,<3
    - sniffio
    - typing_extensions >=4.14,<5

tests:
  - python:
      imports:
        - coreweave_evaluations
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The official Python library for the CoreWeave Evaluations API
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/cwevals/

extra:
  recipe-maintainers:
    - dmitryduev
