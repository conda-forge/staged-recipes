schema_version: 1

context:
  name: mlx-whisper
  version: "0.4.3"
  # mlx-examples has no tags; this is the commit that bumped whisper to 0.4.3
  commit: c1af8c46bd4c4704cff1561736a634cee38efc6c

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/ml-explore/mlx-examples/archive/${{ commit }}.tar.gz
  sha256: 278eb33fda2aa9a6b632c9575b029c3f7e08cd98290464aca044ef0c4301163b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install ./whisper -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - mlx_whisper = mlx_whisper.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - mlx >=0.11
    - numba
    - numpy
    - pytorch
    - tqdm
    - more-itertools
    - tiktoken
    - huggingface_hub
    - scipy
    - ffmpeg

tests:
  - python:
      imports:
        - mlx_whisper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - mlx_whisper --help
      - python -c "from mlx_whisper.audio import mel_filters; mel_filters(80)"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/ml-explore/mlx-examples/tree/main/whisper
  summary: OpenAI Whisper on Apple silicon with MLX and the Hugging Face Hub
  description: |
    Speech recognition with Whisper in MLX. Whisper is a set of open source
    speech recognition models from OpenAI, ranging from 39 million to 1.5
    billion parameters.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/ml-explore/mlx-examples

extra:
  recipe-maintainers:
    - pavelzw
