context:
  version: "6.1.0"

package:
  name: esgvoc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/esgvoc/esgvoc-${{ version }}.tar.gz
  sha256: 4ce6f3735b3637d6b3390ea78aab670d587644e61872ec7bc15c82edd69950a9

build:
  noarch: python
  script: python -m pip install . -vv
  python:
    entry_points:
      - esgvoc = esgvoc.cli.main:main
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.26.3
  run:
    - python >=${{ python_min }}
    - idna >=3.10
    - pydantic >=2.9.2
    - sqlalchemy >=2.0.36
    - sqlmodel >=0.0.22
    - pyld >=3.0.0
    - requests >=2.32.3
    - toml >=0.10.2
    - typer >=0.15.0
    - platformdirs >=4.3.6
    - jinja2 >=3.1.6
    - pyyaml >=6.0.2

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - esgvoc
      pip_check: true
  - script:
      - esgvoc --help

about:
  homepage: https://esgf.github.io/esgf-vocab/
  summary: Python library and CLI to interact with WCRP CVs
  license: CECILL-2.1
  license_file: LICENSE.txt
  repository: https://github.com/ESGF/esgf-vocab

extra:
  recipe-maintainers:
    - cofinoa
