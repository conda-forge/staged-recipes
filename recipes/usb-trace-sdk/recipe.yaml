schema_version: 1
package:
  name: usb-trace-sdk
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/USB-Trace-SDK/language-sdks-v1.0.0/usb-trace-sdk-sdk-source-1.0.0.zip
  sha256: 224332254ee6669688d77fd2472259df3f471a22e4f85dcbb3dd71370cb298ff
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - usb_trace_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from usb_trace_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/USB-Trace-SDK
  summary: Windows x64 USB-Trace-SDK Python SDK with source-built native bridge
  license: MIT
  license_file:
  - USB-Trace-SDK-C-ffi/LICENSE
  - USB-Trace-SDK-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
