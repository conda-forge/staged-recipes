schema_version: 1

context:
  version: "0.4.0"

package:
  name: pixelmatch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pixelmatch/pixelmatch-${{ version }}.tar.gz
  sha256: 80a9ae1084941569f0e8cc7fe70b50c02312b4dbaf4b37b710e0f75f9667fa32

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0.0

tests:
  - python:
      imports:
        - pixelmatch
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A pixel-level image comparison library.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pixelmatch/

extra:
  recipe-maintainers:
    - jan-janssen
