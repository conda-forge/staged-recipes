context:
  name: pycellid
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pycellid-${{ version }}.tar.gz
  sha256: 42cb2ffd9ecafda7c5d391449983bdf2db9acc010378e6a0203c4170ca9ca273

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}
    - attrs >=22.2
    - matplotlib-base >=3.7
    - numpy >=1.24
    - pandas >=2.0

tests:
  - python:
      imports:
        - pycellid
        - pycellid.core
        - pycellid.io
        - pycellid.images
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyCellID/pyCellID
  repository: https://github.com/pyCellID/pyCellID
  documentation: https://pycellid.readthedocs.io
  summary: Functions to analyze Cell-ID single-cell cytometry data
  description: |
    pyCellID provides Python tools to load, merge and analyze the tables
    produced by Cell-ID from fluorescence microscopy images, and to
    inspect the corresponding segmented cell images.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - clementejose
