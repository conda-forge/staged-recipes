context:
  name: nrl-lib
  version: "1.0.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://gitlab.com/earthscope/public/epic/nrl-lib/-/archive/v${{ version }}/nrl-lib-v${{ version }}.tar.gz
  sha256: fd0c8219f93aa4f4d9a53fd0708612929b9cf2dd0e44e339cd0d7ed0789e46ca

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - requests
    - pyyaml

tests:
  - python:
      imports:
        - nrl
        - nrl.NRLQuery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest discover -s tests
    requirements:
      run:
        - python ${{ python_min }}.*
    files:
      source:
        - tests/

about:
  homepage: https://epic.earthscope.org/content/software-resources
  summary: Library to access the NRL v2 web service
  description: |
    nrl-lib is a Python library that provides access to the Nominal
    Response Library (NRL) v2 web service, with catalog, combine and
    prefix-lookup queries. The package is imported as `nrl`.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://gitlab.com/earthscope/public/epic/nrl-lib

extra:
  recipe-maintainers:
    - omid-earthscope
