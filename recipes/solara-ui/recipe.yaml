schema_version: 1

context:
  version: "1.64.0"

package:
  name: solara-ui
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/solara-ui/solara_ui-${{ version }}.tar.gz
  sha256: cd9e147fcbc9f17f5533caa2f1af8d2260f774cc8aae1d279c7c0ee6283fbce8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling =1.26.3
    - pip
  run:
    - python >=${{ python_min }}
    - reacton >=1.9
    - ipywidgets >=7.7
    - ipyvuetify >=1.6.10
    - ipyvue >=1.9.0
    - requests
    - humanize
    - executing

tests:
  - python:
      imports:
        - solara
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A Pure Python, React-style Framework for Scaling Your Jupyter and Web Apps
  license: MIT
  license_file:
    - LICENSE
    - solara/template/portal/LICENSE
  homepage: https://pypi.org/project/solara-ui/
  documentation: https://solara.dev

extra:
  recipe-maintainers:
    - jan-janssen
