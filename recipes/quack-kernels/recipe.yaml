schema_version: 1

context:
  name: quack-kernels
  version: "0.6.5"
  python_min: "3.10"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/quack_kernels-${{ version }}.tar.gz
  sha256: dd9405a4a6fa35fc3a5a18fe35b46a14b0bf7e3ad9fe2451903e355047ac471d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    # nvidia-cutlass-dsl is only available for linux
    - __linux
    - nvidia-cutlass-dsl >=4.7
    - pytorch
    - apache-tvm-ffi >=0.1.6,<0.2
    - torch-c-dlpack-ext
    - einops

tests:
  - python:
      imports:
        - quack
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Dao-AILab/quack
  summary: A Quirky Assortment of CuTe Kernels
  description: |
    QuACK provides high performance GPU kernels such as RMSNorm, softmax and
    cross entropy, written in Python with the CuTe DSL.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/Dao-AILab/quack

extra:
  recipe-maintainers:
    - timkpaine
    - killua156
