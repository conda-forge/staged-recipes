schema_version: 1

context:
  version: "4.0"

package:
  name: zope.processlifetime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.processlifetime/zope_processlifetime-${{ version }}.tar.gz
  sha256: f35279eca8f88ab41f22107b3b2d2908a3916d058f5fbfb5c1dccfc99f7155ce

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ==78.1.1
    - wheel
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface

tests:
  - python:
      imports:
        - zope.processlifetime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      interpreter: python
      content: |
        from zope.processlifetime import DatabaseOpened, IDatabaseOpened; assert IDatabaseOpened.providedBy(DatabaseOpened(None))

about:
  homepage: https://github.com/zopefoundation/zope.processlifetime
  repository: https://github.com/zopefoundation/zope.processlifetime
  documentation: https://zopeprocesslifetime.readthedocs.io
  summary: Zope process lifetime events
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
