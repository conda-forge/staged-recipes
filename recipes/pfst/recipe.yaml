schema_version: 1

context:
  version: "0.3.2"

package:
  name: pfst
  version: ${{ version }}

source:
  url: https://github.com/tom-pytel/pfst/archive/v${{ version }}.tar.gz
  sha256: 66e0a8cc2561c0931bb5d79376e0219e35dc3c8dc584dc3da2127ebeee19ff12

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fst
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/tom-pytel/pfst
  repository: https://github.com/tom-pytel/pfst
  documentation: https://tom-pytel.github.io/pfst/
  license: MIT
  license_file: LICENSE
  summary: Format-preserving high-level AST editing for Python 3.10+
  description: |
    pfst provides high-level Python AST manipulation that preserves source
    formatting and comments while keeping the AST and source synchronized.

extra:
  recipe-maintainers:
    - jan-janssen
