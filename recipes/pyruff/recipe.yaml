schema_version: 1

context:
  python_min: "3.14"
  version: 0.15.1rc5

package:
  name: pyruff
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/60/02/e11bad52cd4c8198740bb448365a62a51a2c1421eb325aaee589eb51e962/pyruff-0.15.1rc5-cp314-cp314-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
  sha256: 4feb98d501bf495d7669b8675cb4231c7d543f44389c312fb0a43287aafe33cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install pyruff-0.15.1rc5-cp314-cp314-manylinux_2_17_x86_64.manylinux2014_x86_64.whl -vv && unzip pyruff-0.15.1rc5-cp314-cp314-manylinux_2_17_x86_64.manylinux2014_x86_64.whl pyruff-0.15.1rc5.dist-info/licenses/LICENSE

requirements:
  build:
    - unzip
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python =${{ python_min }}

tests:
  - python:
      imports:
        - pyruff
      pip_check: true
      python_version:
        - ${{ python_min }}.*

about:
  summary: Native Python API for Ruff linter and formatter
  license: MIT
  license_file: pyruff-0.15.1rc5.dist-info/licenses/LICENSE
  homepage: https://github.com/emilt27/pyruff

extra:
  recipe-maintainers:
    - pont-us
