schema_version: 1

context:
  python_min: "3.11"
  version: 0.15.1rc5

package:
  name: pyruff
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pyruff/pyruff-${{ version }}.tar.gz
  sha256: 7f61bd5afc6fbc82158ab8a076acaa3b835eea66a6fc8a73e272cb780e8a654e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - maturin >=1.0,<2.0
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyruff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Native Python API for Ruff linter and formatter
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/emilt27/pyruff

extra:
  recipe-maintainers:
    - pont-us
