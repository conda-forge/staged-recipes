context:
  name: bitwarden-cli
  version: "2026.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/bitwarden/clients/archive/refs/tags/cli-v${{ version }}.tar.gz
    sha256: e62ee385ae1256521f85646cfe35372c6580949f353d35642c41b51ea74bc786

build:
  number: 0
  script:
    - if: unix
      then:
        - cp "$RECIPE_DIR/pnpm-workspace.yaml" .
        - pnpm import
        - pnpm install --frozen-lockfile --ignore-scripts
        - pnpm --filter @bitwarden/cli run build:oss:prod
        - pnpm --filter @bitwarden/cli licenses list --prod --json | pnpm-licenses generate-disclaimer --prod --json-input --output-file THIRD_PARTY_LICENSES.txt
        - pnpm --dir apps/cli pack --out ../../bitwarden-cli-${{ version }}.tgz
        - npm install --global --prefix ${{ PREFIX }} --omit=dev --ignore-scripts --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 ./bitwarden-cli-${{ version }}.tgz
      else:
        - copy "%RECIPE_DIR%\pnpm-workspace.yaml" .
        - call pnpm import
        - call pnpm install --frozen-lockfile --ignore-scripts
        - call pnpm --filter @bitwarden/cli run build:oss:prod
        - call pnpm --filter @bitwarden/cli licenses list --prod --json | pnpm-licenses generate-disclaimer --prod --json-input --output-file THIRD_PARTY_LICENSES.txt
        - call pnpm --dir apps/cli pack --out ../../bitwarden-cli-${{ version }}.tgz
        - call npm install --global --prefix ${{ PREFIX }} --omit=dev --ignore-scripts --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 ./bitwarden-cli-${{ version }}.tgz

requirements:
  build:
    - nodejs >=24.17,<25
    - pnpm >=10,<13
    - pnpm-licenses >=2.4,<3
  host:
    - nodejs >=24.17,<25
  run:
    - nodejs >=24.17,<25

tests:
  - script:
      - bw --version
      - bw --help
  - package_contents:
      bin:
        - bw

about:
  homepage: https://bitwarden.com/help/cli/
  license: GPL-3.0-only
  license_file:
    - LICENSE.txt
    - LICENSE_GPL.txt
    - THIRD_PARTY_LICENSES.txt
  summary: "A secure and free password manager for all of your devices."
  description: |
    `bw` is the command-line interface to a Bitwarden vault. It logs in and
    unlocks a vault, then creates, reads, edits and deletes items, folders,
    attachments and organization collections, either interactively or as JSON
    on stdin and stdout for scripting. It also generates passwords, imports
    and exports vault data, sends and receives Bitwarden Sends, and can serve
    a local REST API for other tools to query.
  documentation: https://bitwarden.com/help/cli/
  repository: https://github.com/bitwarden/clients/tree/main/apps/cli

extra:
  recipe-maintainers:
    - phreed
