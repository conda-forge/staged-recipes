schema_version: 1


context:
  name: r-scatterplotmatrix
  version: 0.3.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://cran.r-project.org/src/contrib/scatterPlotMatrix_${{ version }}.tar.gz
  sha256: 89c71e6a153c4297faa94e103cc9664f4c106cc9dfbba58862948f89814de4c1

build:
  number: 0
  noarch: generic
  script: R CMD INSTALL --build .
  merge_build_and_host_envs: true
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  host:
    - r-base
    - r-htmlwidgets
  run:
    - r-base
    - r-htmlwidgets

tests:
  - script: R -e "library('scatterPlotMatrix')"

about:
  summary: Create a scatter plot matrix, using `htmlwidgets` package and `d3.js`.
  license: MIT
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/MIT
  homepage: https://ifpen-gitlab.appcollaboratif.fr/detocs/scatterplotmatrix

extra:
  recipe-maintainers:
    - DerThorsten
