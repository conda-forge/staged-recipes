schema_version: 1

context:
  name: google-cloud-os-config
  version: "1.26.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_os_config-${{ version }}.tar.gz
  sha256: 51f5a90115afb60ea84e0f0e4b938c4067cff15cafcd18a3e09bcb923c24a6d0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core-grpc >=2.28.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - grpcio >=1.71.1,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - google.cloud.osconfig
        - google.cloud.osconfig_v1
        - google.cloud.osconfig_v1alpha
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-os-config
  summary: Google Cloud Os Config API client library
  description: |
    Python client library for the Google Cloud OS Config API, which lets you
    manage OS patch management, inventory, and configuration of VM instances
    on Google Compute Engine.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://cloud.google.com/python/docs/reference/osconfig/latest
  repository: https://github.com/googleapis/google-cloud-python

extra:
  recipe-maintainers:
    - soapy1
