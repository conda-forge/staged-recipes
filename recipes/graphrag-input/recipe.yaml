schema_version: 1

context:
  version: "3.1.1"
  python_min: "3.11"

package:
  name: graphrag-input
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphrag-input/graphrag_input-${{ version }}.tar.gz
  sha256: 1cc7461702c5d0eef1f2e13b4c77e5dfff07f707fc682b26ab9003d44b5ef282

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27.0,<2.0.0
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - graphrag-common ==3.1.1
    - graphrag-storage ==3.1.1
    - pydantic >=2.10,<3.dev0
    - markitdown >=0.1.0,<0.2.dev0
    - pyarrow >=14.0.0

tests:
  - python:
      imports:
        - graphrag_input
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Input document loading utilities for GraphRAG
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/graphrag-input/
  repository: https://github.com/microsoft/graphrag

extra:
  recipe-maintainers:
    - jan-janssen
