context:
  version: "0.7.0"

package:
  name: finch-tensor
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/finch-tensor/finch_tensor-${{ version }}.tar.gz
    sha256: e7b3fd48fc804dbaec90b98556c44dd44a37517b0553d96dbe355786fdf99a7c

build:
  noarch: python
  script: uv pip install --python ${{ PYTHON }} . -vv --no-deps
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - uv
  run:
    - python >=${{ python_min }}
    - numpy >=2.0,<2.4
    - numba >=0.61,<2
    - donfig >=0.8.1.post1,<0.9.0
    - lark >=1.3.0,<2
    - scipy >=1.7,<2
    # A C compiler is one of the optional backends, with the others based on Julia and MLIR.
    # Consider shipping each backend separately once optional dependency support
    # per https://conda.org/learn/ceps/cep-0044 is available in conda-forge.
    # C backend:
    - c-compiler >=2.0.0  # minimally activated on unix
    # Julia backend:
    # - pyjuliapkg >=0.1.16,<0.2.0
    # - pyjuliacall >=0.9.24,<0.10.0
    # MLIR backend:
    # - mlir-python-bindings  # pending https://github.com/finch-tensor/finch-tensor/issues/567

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports: finch
  - script: pytest -v -ra src/finch/tests/ -m "not slow and not mlir_backend" --ignore-glob=src/finch/tests/reference/* -o addopts=""
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - pytest-regressions
        - sparse
        # for array-api-tests:
        - pytest-json-report
        - hypothesis
        - ndindex
    files:
      source:
        - src/finch/tests/
        - array-api-skips.txt
        - pyproject.toml

about:
  homepage: https://github.com/finch-tensor/finch-tensor
  summary: Productive Sparse Array Programming
  description: Sparse array programming backed by Finch.jl.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - lucascolley
    - mtsokol
    - willow-ahrens
