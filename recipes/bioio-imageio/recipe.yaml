schema_version: 1

context:
  name: bioio-imageio
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/bioio_imageio-${{ version }}.tar.gz
  sha256: 6c0c3239fee5865a7dbae9dda40777ae6f4464cf4e252810a6e4a94cec538406

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=65
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - bioio-base >=1.4.0
    - dask-core >=2021.4.1
    - numpy >=1.24
    - fsspec >=2022.8.0
    - imageio >=2.31.0
    - imageio-ffmpeg
    - psutil
    - pillow >=9.3.0
    - xarray >=2022.6.0

tests:
  - python:
      imports:
        - bioio_imageio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "from importlib.metadata import entry_points as e; assert 'bioio-imageio' in [x.name for x in e(group='bioio.readers')]"
      - python -c "from bioio_imageio import Reader"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: A BioIO reader plugin for reading common image formats (PNG, GIF, MP4, ...) using imageio.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/bioio-devs/bioio-imageio
  repository: https://github.com/bioio-devs/bioio-imageio
  documentation: https://bioio-devs.github.io/bioio-imageio

extra:
  recipe-maintainers:
    - rmassei
