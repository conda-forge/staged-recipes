schema_version: 1

context:
  name: scirooplot
  version: "3.2.1"
  sha256: d5d512dc5bff63834bc4fbbc048aaa8e88aff5b05cfd91ca4aa0b17bfe5da02a

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/SciRooPlot/SciRooPlot/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  skip:
    - win
  script:
    - cmake -S . -B build ${CMAKE_ARGS}
    - cmake --build build --parallel ${CPU_COUNT}
    - cmake --install build

requirements:
  build:
    - cmake
    - make
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - root
    - libboost-devel
    - fmt
    - pybind11
    - python
  run:
    - root
    - python
  run_exports:
    - ${{ pin_subpackage('scirooplot', upper_bound='x.x') }}

tests:
  - script:
      - srp info

about:
  summary: A command-line plotting app to manage and visualize scientific data.
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/SciRooPlot/SciRooPlot

extra:
  recipe-maintainers:
    - mario-krueger
