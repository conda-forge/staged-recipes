schema_version: 1

context:
  version: "0.0.2.1"
  python_min: "3.12"

package:
  name: chem10-harvard
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/C/CHEM10-Harvard/chem10_harvard-${{ version }}.tar.gz
  sha256: 72aba83b2f6757196662726a9c3076f69497827697420966bd5c6354f0269868

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2.4.3
    - pandas >=3.0.1
    - matplotlib-base >=3.10.8
    - jupyter >=1.1.1
    - ipykernel >=7.2.0
    - dtw-python >=1.7.5

tests:
  - python:
      imports:
        - CHEM10_Harvard
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A package for interfacing with the spectrometer built by students in CHEM 10.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/biotungsten/CHEM10_Harvard

extra:
  recipe-maintainers:
    - biotungsten
