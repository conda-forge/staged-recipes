context:
  version: "1.5.0.6"

package:
  name: spacr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spacr/spacr-${{ version }}.tar.gz
  sha256: 3654060d0b729bd212430a7fda0f2ee8b7b0686f0da840389debfc3f41925b10

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.9,<3.15,!=3.14.1
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=3.9,<3.15,!=3.14.1
    - numpy >=1.26.4,<3.0
    - pandas >=2.2.1,<3.0
    - scipy >=1.12.0,<2.0
    # numba and llvmlite are NOT here, and their absence is deliberate. Both
    # carry an environment marker in setup.py --
    # `sys_platform != "darwin" or platform_machine != "x86_64"` -- because
    # llvmlite publishes no macOS x86_64 wheel from 0.46. This recipe is
    # `noarch: python`, one package for every platform, with no way to express
    # a marker; listing them would make them hard runtime dependencies on the
    # exact platform they were excluded for. Same reasoning the recipe already
    # applies to `win10toast`.
    - cellpose >=4.0.7,<5.0
    # cellpose imports this but its conda-forge package currently omits the
    # runtime dependency. Keep it explicit so mask imports work on a clean
    # conda installation.
    - segment-anything >=1.0,<2.0
    - scikit-image >=0.22.0,<0.28
    - scikit-learn >=1.5.0,<2.0
    - scikit-posthocs >=0.10.0,<0.20
    - trackpy >=0.6.2,<1.0
    - statsmodels >=0.14.0,<0.15
    - patsy >=0.5.6,<2.0
    - pypdf >=6.16.1,<7.0
    - shap >=0.47.0,<1.0
    - tensorboard >=2.21,<3.0
    - captum >=0.7.0,<1.0
    - seaborn >=0.13.2,<1.0
    - matplotlib-base >=3.8.3,<4.0
    - matplotlib-venn >=1.1,<2.0
    # spaCR imports cycler directly rather than reaching through
    # matplotlib.rcsetup, so it declares it rather than relying on
    # matplotlib to keep it installed.
    - cycler >=0.10,<1
    - adjusttext >=1.2.0,<2.0
    - bottleneck >=1.3.6,<2.0
    - numexpr >=2.8.4,<3.0
    - opencv >=4.9.0,<5.0
    - pillow >=10.2.0,<13
    - tifffile >=2023.4.12
    - nd2reader >=3.3.0,<4.0
    - czifile
    - readlif
    - openpyxl >=3.1,<4.0
    - imageio >=2.34.0,<3.0
    - umap-learn >=0.5.11,<1.0
    - xgboost >=2.0.3,<4
    - biopython >=1.80,<2.0
    - lxml >=5.1.0
    - psutil >=5.9.8,<8
    - gputil >=1.4.0,<2.0
    - nvidia-ml-py >=11.450.51,<14
    - pytables >=3.8.0,<4.0
    - screeninfo >=0.8.1,<1.0
    - fastremap >=1.14.1
    - tqdm >=4.65.0
    - requests >=2.28,<3.0
    - joblib >=1.2,<2.0
    - natsort >=8.0,<9.0
    - sympy >=1.12,<2.0
    - mpmath >=1.3,<2
    - vispy >=0.14,<1.0
    - ipython >=8.18.1,<10
    - ipywidgets >=8.1.2,<9.0
    - huggingface_hub >=0.25,<1.0
    - protobuf >=5.28.3
    # This package exposes spacr-qt, so declare the GUI extra directly instead
    # of relying on a scientific dependency to choose a Qt binding for us.
    - pyside6 >=6.6,<7
    - qtawesome >=1.3,<2
    # The interactive plots. spacr/qt/widgets/fast_plots.py is the volcano,
    # the Q-Q, the p-histogram, the control panel and the guide-agreement
    # plot; without this, opening any module raises out of the screen factory.
    - pyqtgraph >=0.13.3,<1

tests:
  - python:
      imports:
        - spacr
        - spacr.measure
        - spacr.qt
        - cellpose
        - segment_anything
  - script:
      - spacr-run --list

about:
  homepage: https://github.com/EinarOlafsson/spacr
  summary: Spatial phenotype analysis of CRISPR screens
  description: |
    spaCR is an end-to-end toolkit for microscopy segmentation,
    measurement, timelapse analysis, computer vision, image embeddings,
    barcode mapping, and integrated perturbation-screen analysis.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://einarolafsson.github.io/spacr/
  repository: https://github.com/EinarOlafsson/spacr

extra:
  recipe-maintainers:
    - EinarOlafsson
