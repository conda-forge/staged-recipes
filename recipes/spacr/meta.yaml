{% set version = "1.1.3" %}

package:
  name: spacr
  version: {{ version }}

source:
  url: https://github.com/EinarOlafsson/spacr/archive/refs/tags/v{{ version }}.tar.gz
  sha256: REPLACE_WITH_REAL_SHA256

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - numpy
    - pandas
    - scipy
    - scikit-image
    - scikit-learn
    - matplotlib

about:
  home: https://github.com/EinarOlafsson/spacr
  summary: Spatial phenotype analysis of crisp screens (SpaCr)
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/EinarOlafsson/spacr

extra:
  recipe-maintainers:
    - EinarOlafsson
