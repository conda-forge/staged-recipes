schema_version: 1

context:
  version: "1.0.8"

package:
  name: flashrnn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flashrnn/flashrnn-${{ version }}.tar.gz
  sha256: 3615b2f9dafa59d85f40cc6afbbbab32814eb09b581f6931d91f1777e747f95d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}
    - pytorch
    - einops
    - ninja
    # imported in flashrnn/cuda_init.py but not declared upstream
    - packaging
  run_constraints:
    # triton is only needed for the optional "triton_fused" backend and is
    # imported lazily. It is only available on Linux on conda-forge
    # (triton-windows is not packaged), so it is kept optional here.
    - triton

tests:
  - python:
      imports:
        - flashrnn
      python_version:
        - ${{ python_min }}.*
        - "*"
      # pip check is disabled because the upstream metadata requires
      # triton (Linux) / triton-windows (Windows), which are optional here.
      pip_check: false

about:
  summary: "FlashRNN: Optimizing Traditional RNNs on Modern Hardware"
  description: |
    FlashRNN provides fast, hardware-optimized implementations of traditional
    RNNs (LSTM, GRU, sLSTM, ...) in CUDA and Triton for PyTorch.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/NX-AI/flashrnn
  repository: https://github.com/NX-AI/flashrnn

extra:
  recipe-maintainers:
    - uruthia
    - daidahao
    - martinloretzzz
    - lukfischer
