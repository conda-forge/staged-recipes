schema_version: 1

context:
  version: 1.26.0

package:
  name: cloudsmith-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cloudsmith-cli/cloudsmith_cli-${{ version }}.tar.gz
  sha256: d7cf5d9a91a7ed2ba6391413ac3543b0b53a302135d7f6ec6353b0f7628c652b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - cloudsmith = cloudsmith_cli.cli.commands.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ==83.0.0
    - wheel ==0.47.0
  run:
    - python >=${{ python_min }}
    - click >=8.2,!=8.3.0
    - click-configfile >=0.2.3
    - click-didyoumean >=0.0.3
    - click-spinner >=0.1.7
    - json5 >=0.9.0
    - cloudsmith-api >=2.0.31,<3.0
    - keyring >=25.4.1
    - keyrings.alt >=5.0.2
    - keyrings.cryptfile >=1.3.9
    - mcp ==1.28.1
    - pyjwt >=2.0.0
    - cryptography >=3.3.1
    - python-toon ==0.1.2
    - requests >=2.18.4
    - requests-toolbelt >=1.0.0
    - rich >=13.0.0
    - semver >=2.7.9
    - urllib3 >=2.5
    - tomlkit >=0.15.0

tests:
  - python:
      imports:
        - cloudsmith_cli
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - cloudsmith --help
      - cloudsmith --version
      - cloudsmith credential-helper --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://cloudsmith.com
  repository: https://github.com/cloudsmith-io/cloudsmith-cli
  license: Apache-2.0
  license_file: LICENSE
  summary: Command-line interface for Cloudsmith
  documentation: https://docs.cloudsmith.com/developer-tools/cli

extra:
  recipe-maintainers:
    - BartoszBlizniak
