schema_version: 1

context:
  version: "2.0.6"

package:
  name: mlstm-kernels
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/mlstm-kernels/mlstm_kernels-${{ version }}.tar.gz
  sha256: 9e1a3866dc4db964a27d833e6c17fc0da7d74a2ed6aa9d4daf2cbdfbd42a9584

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
  run:
    - python >=${{ python_min }}
    - einops
    - matplotlib-base
    - numpy
    - pyyaml
    - pytorch

tests:
  - python:
      imports:
        - mlstm_kernels
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A library providing fast and efficient mLSTM kernels for the xLSTM.
  license: EPL-2.0 AND BSD-3-Clause
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/NX-AI/mlstm_kernels
  repository: https://github.com/NX-AI/mlstm_kernels

extra:
  recipe-maintainers:
    - uruthia
    - daidahao
    - martinloretzzz
    - lukfischer
