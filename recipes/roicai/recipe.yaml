context:
  version: "0.2.0"

package:
  name: roicai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/roicai/roicai-${{ version }}.tar.gz
  sha256: 77901634d95ef5a2bfe977ef9326de0a583ba56054e65c2008da68d948ad7953

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.21.2
    - pydantic >=2.1
    - typing_extensions >=4.6.1

tests:
  - python:
      imports:
        - roicai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/test_client.py
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - pytest-asyncio
        - respx
        - pandas
        - polars
    script:
      - pytest tests/test_client.py -v -p no:cacheprovider -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function

about:
  homepage: https://www.roic.ai
  repository: https://github.com/roicai/roicai-python
  documentation: https://www.roic.ai/api
  summary: Official Python SDK for the ROIC.ai financial data and stock API
  description: |
    The official Python client for the ROIC.ai financial data and stock API:
    fundamentals such as income statements, balance sheets, cash flow
    statements, ratios and valuation multiples, earnings call transcripts,
    stock and forex prices, SEC filings and company profiles. Responses are
    typed Pydantic models, lists page for you, and any response converts to a
    pandas or polars DataFrame.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - infovlad
