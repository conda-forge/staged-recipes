context:
  version: "1.36.4"

package:
  name: kubectl-oidc-login
  version: ${{ version }}

source:
  url: https://github.com/int128/kubelogin/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ddae6975006895791d0bbf8464f228b3911f697b869446fdf1b8233c12c30544
  target_directory: src

build:
  number: 0
  script:
    - cd src
    - go-licenses save . --save_path ../library_licenses
    - if: unix
      then: go build -v -o $PREFIX/bin/kubectl-oidc_login -ldflags="-s -w -X main.version=v${{ version }}"
      else: go build -v -o %LIBRARY_BIN%\kubectl-oidc_login.exe -ldflags="-s -X main.version=v${{ version }}"

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - kubectl-oidc_login --version
      - kubectl-oidc_login get-token --help
  - package_contents:
      bin:
        - kubectl-oidc_login
      strict: true

about:
  homepage: https://github.com/int128/kubelogin
  summary: kubectl plugin for Kubernetes OpenID Connect authentication (kubectl oidc-login)
  description: |
    kubelogin is a kubectl plugin for Kubernetes OpenID Connect (OIDC) authentication,
    also known as kubectl oidc-login. It opens the browser for the OIDC login, caches
    the tokens (on disk, in the OS keyring, or not at all) and refreshes them.
    This is int128/kubelogin, not the Azure kubelogin packaged as `kubelogin`.
  license: Apache-2.0
  license_file:
    - src/LICENSE
    - library_licenses/
  documentation: https://github.com/int128/kubelogin/blob/master/docs/usage.md
  repository: https://github.com/int128/kubelogin

extra:
  recipe-maintainers:
    - AlexanderDinnebierQC
