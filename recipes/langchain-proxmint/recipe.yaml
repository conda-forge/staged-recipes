schema_version: 1

context:
  name: langchain-proxmint
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/langchain_proxmint-${{ version }}.tar.gz
  sha256: 7f541931d2124ddc2a2dc615e028fe625812fd13013eb9ccef7a304d44e1d653

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}
    - langchain-core >=0.3,<2
    - httpx >=0.27,<1

tests:
  - python:
      imports:
        - langchain_proxmint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: LangChain tool and document loader that read web pages through Proxmint residential, datacenter and mobile proxies
  description: |
    langchain-proxmint adds a tool and a document loader to LangChain that fetch web pages through
    Proxmint proxies, with country, city and ASN targeting and sticky sessions.
  license: MIT
  license_file: LICENSE
  homepage: https://proxmint.com
  documentation: https://proxmint.com/docs/langchain
  repository: https://github.com/proxmint/langchain-proxmint

extra:
  recipe-maintainers:
    - prian3003
