schema_version: 1

context:
  name: geometric-nn-ops-torch
  version: 0.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/geometric_nn_ops_torch-${{ version }}.tar.gz
  sha256: 9dbbdb665ae5703b7e2baf44cb5719f0f5b391a40246fe7a0eba9751d8240314

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}
    - pytorch >=2.4
    - triton

tests:
  - python:
      imports:
        - geometric_nn_ops_torch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Vendor-neutral GPU kernels for geometry-aware neural nets (triangle/folding ops)
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/AMDResearch/geometric-nn-ops
  homepage: https://github.com/AMDResearch/geometric-nn-ops

extra:
  recipe-maintainers:
    - Emrys-Merlin
    - GMNGeoffrey
    - singagan
