schema_version: 1

context:
  version: "1.3.6"

package:
  name: fxrays
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/F/FXrays/FXrays-${{ version }}.tar.gz
  sha256: 7a93545a77b53ff4098d2c9768cc5422b54ac8c31797db96160ba48894db1c68

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=61
    - wheel
    - cython
  run:
    - python

tests:
  - python:
      imports:
        - FXrays
      pip_check: true
  - script:
      - python -m FXrays.test

about:
  homepage: https://github.com/3-manifolds/FXrays
  repository: https://github.com/3-manifolds/FXrays
  license: GPL-2.0-or-later
  # Upstream ships no license file: c_src/FXrays.c points at "the file GPL.txt",
  # which is absent from the sdist and from every commit in the GitHub history.
  # This is the verbatim GPL-2.0 text from
  # https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt, the license the
  # sources and the PyPI classifier both declare.
  license_file: LICENSE
  summary: Computes extremal rays with filtering
  description: |
    FXrays is a small, fast implementation of an algorithm for finding
    extremal rays of a polyhedral cone, with filtering. It is intended for
    finding normal surfaces in triangulated 3-manifolds, and therefore does
    not implement various features that might be useful for general
    extremal ray problems.

extra:
  recipe-maintainers:
    - killua156
