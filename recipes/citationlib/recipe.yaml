schema_version: 1

context:
  python_min: "3.9"
  version: "0.2.1"

package:
  name: citationlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/citationlib/citationlib-${{ version }}.tar.gz
  sha256: 103dadfa56fe7ba486556bc0d938b22491a2ac0573933aa7337a0a895a200ce1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - sgmllib3k ==1.0.0
    - habanero >=1.2.6
    - arxiv >=1.4.7
    - requests >=2.0.0
    - beautifulsoup4 >=4.12.0
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - citationlib
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A powerful Python library for generating academic citations from various sources
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/SuperAce100/citationlib

extra:
  recipe-maintainers:
    - volpatto
