# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.18"

package:
  name: ciscoconfparse2
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/ciscoconfparse2/ciscoconfparse2-${{ version }}.tar.gz
  sha256: a28d4117907664b0231c2d3c5702ede9fdc3c7d78f9336fcb857b3d5bb983dc7
  patches:
    - fix-pythonoptimize-empty-string.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - ccp = ciscoconfparse2.cli_script:ccp_script_entry

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - attrs >25.4.0,<27.0.0
    - dnspython ==2.8.0
    - macaddress ==2.0.2
    - traitlets ==5.15.0
    - loguru >=0.7.2
    - hier-config ==2.3.1
    - pyparsing ==3.3.2
    - toml ==0.10.2
    - typeguard ==4.5.2
    - pyyaml >=6.0.3
    - rich >=14.3.3
    - libpass ==1.9.3
    - hypothesis ==6.152.7

tests:
  - python:
      imports:
        - ciscoconfparse2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - ccp --help

about:
  homepage: https://github.com/mpenning/ciscoconfparse2
  summary: Parse, Audit, Query, Build, and Modify Cisco IOS-style and JunOS-style configs
  description: |
    CiscoConfParse2 is a Python library that divides a network device
    configuration into a set of parent-child relationships, making it
    possible to audit or query configurations against the lines'
    hierarchical structure, and to build or modify configurations in the
    same way. It supports Cisco IOS, IOS-XR, NXOS, and ASA, as well as
    Juniper JunOS-style configs, and installs a `ccp` command-line script
    alongside the library.
  license: GPL-3.0-only
  license_file: LICENSE
  documentation: https://www.pennington.net/py/ciscoconfparse2/
  repository: https://github.com/mpenning/ciscoconfparse2

extra:
  recipe-maintainers:
    - pb01ka
