schema_version: 1

context:
  version: "0.15.0"

package:
  name: absnoise
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/absnoise/absnoise-${{ version }}.tar.gz
  sha256: 69a069078f4fa4f204da9833af6e85c52dabf94fbd40d7023413b577ac00eda5

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10

tests:
  - python:
      imports:
        - absnoise
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/absnoise
  license: Apache-2.0
  license_file: LICENSE
  summary: "Andreev-bound-state occupation noise and detector budgets for proximity Josephson junctions"
  description: |
    Intrinsic occupation noise of Andreev bound states and the sensitivity
    budgets of proximity Josephson thermal detectors: temperature
    resolution, unavoidable noise floors, hidden-state inference from
    measured readout records, and measurement planning for telegraph PSDs.
  repository: https://github.com/TaN-MM-Org/absnoise
  documentation: https://github.com/TaN-MM-Org/absnoise#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
