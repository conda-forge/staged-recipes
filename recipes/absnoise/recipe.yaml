schema_version: 1

context:
  version: "0.17.0"

package:
  name: absnoise
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/absnoise/absnoise-${{ version }}.tar.gz
  sha256: 8d7d271cea13c4d4a241abaadacd8ff40cd056210a79beb12036f23adba8b691

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10

tests:
  - python:
      imports:
        - absnoise
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/absnoise
  license: Apache-2.0
  license_file: LICENSE
  summary: "Occupation noise of Andreev levels and the limits of proximity Josephson thermal detectors"
  description: |
    How well a proximity Josephson junction (two superconductors joined by a
    short piece of normal conductor, such as graphene) can sense temperature
    or detect a single photon. It follows the chain from the Andreev levels
    and the random filling and emptying of those levels to the frequency
    noise, noise-equivalent power and energy resolution of a detector read
    out by a resonator. It also works backward from measured critical-
    current curves, readout traces and noise spectra, and helps plan those
    measurements.
  repository: https://github.com/TaN-MM-Org/absnoise
  documentation: https://github.com/TaN-MM-Org/absnoise#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
