{% set version = "3.7.0" %}
{% set posix = "m2-" if win else "" %}

package:
  name: r-moire
  version: {{ version }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/moire_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/moire/moire_{{ version }}.tar.gz
  sha256: e86cfd5ad4a28ebc645499a414af328858a75b0bb7510209d45742f45a1b5a81

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports:
    - {{ pin_subpackage("r-moire", max_pin="x") }}
  missing_dso_whitelist:
    - "*/R.dll"  # [win]
    - "*/Rblas.dll"  # [win]
    - "*/Rlapack.dll" # [win]

requirements:
  build:
    - {{ compiler("c") }}  # [not win]
    - {{ compiler("m2w64_c") }}  # [win]
    - {{ compiler("cxx") }}  # [not win]
    - {{ compiler("m2w64_cxx") }}  # [win]
    - {{ stdlib("c") }}
    - {{ posix }}filesystem  # [win]
    - {{ posix }}make
    - {{ posix }}sed  # [win]
    - {{ posix }}coreutils  # [win]
    - {{ posix }}zip  # [win]
    - cross-r-base {{ r_base }}  # [build_platform != target_platform]

  host:
    - r-base
    - r-bh
    - r-rcpp
    - r-rcppparallel
    - r-rcppprogress
    - r-dplyr
    - r-ggplot2
    - r-purrr
    - r-rlang
    - r-tidyr

  run:
    - r-base
    - r-rcpp
    - r-rcppparallel
    - r-rcppprogress
    - r-dplyr
    - r-ggplot2
    - r-purrr
    - r-rlang
    - r-tidyr

test:
  commands:
    - $R -e "library('moire')"  # [not win]
    - "\"%R%\" -e \"library('moire')\""  # [win]

about:
  home: https://github.com/EPPIcenter/moire
  doc_url: https://eppicenter.github.io/moire/
  dev_url: https://github.com/EPPIcenter/moire
  summary: A Markov Chain Monte Carlo (MCMC) based approach to Bayesian estimation of individual level multiplicity of infection, within host relatedness, and population allele frequencies from polyallelic genetic data.
  description: >
    Implements a Markov Chain Monte Carlo (MCMC) based approach to Bayesian
    estimation of individual-level multiplicity of infection, within-host
    relatedness, and population allele frequencies from polyallelic genetic
    data. Implements the model described in Murphy and Greenhouse (2024).
    DOI: 10.1093/bioinformatics/btae619.
  license: GPL-3.0-only
  license_family: GPL3
  license_file:
    - "{{ environ['PREFIX'] }}/lib/R/share/licenses/GPL-3"

extra:
  recipe-maintainers:
    - conda-forge/r
    - kathrynmurie
    - m-murphy
