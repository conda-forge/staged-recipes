schema_version: 1

context:
  name: r-moire
  version: "3.7.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://cran.r-project.org/src/contrib/moire_${{ version }}.tar.gz
  sha256: e86cfd5ad4a28ebc645499a414af328858a75b0bb7510209d45742f45a1b5a81

build:
  number: 0

requirements:
  build:
    - if: win
      then:
        - ${{ compiler("m2w64_c") }}
        - ${{ compiler("m2w64_cxx") }}
        - ${{ stdlib("m2w64_c") }}
        - m2-filesystem
        - m2-make
        - m2-sed
        - m2-coreutils
        - m2-zip
      else:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - make
  host:
    - r-base
    - r-bh
    - r-rcpp
    - r-rcppparallel
    - r-rcppprogress
    - r-dplyr
    - r-ggplot2
    - r-purrr
    - r-rlang
    - r-tidyr
  run:
    - r-base
    - r-rcpp
    - r-rcppparallel
    - r-rcppprogress
    - r-dplyr
    - r-ggplot2
    - r-purrr
    - r-rlang
    - r-tidyr

tests:
  - r:
      libraries:
        - moire

about:
  homepage: https://github.com/EPPIcenter/moire
  repository: https://github.com/EPPIcenter/moire
  documentation: https://eppicenter.github.io/moire/
  summary: Bayesian estimation of multiplicity of infection, within-host relatedness, and population allele frequencies from polyallelic genetic data.
  description: >
    Implements a Markov Chain Monte Carlo (MCMC) based approach to Bayesian
    estimation of individual-level multiplicity of infection, within-host
    relatedness, and population allele frequencies from polyallelic genetic
    data. Implements the model described in Murphy and Greenhouse (2024),
    DOI: 10.1093/bioinformatics/btae619.
  license: GPL-3.0-only
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - conda-forge/r
    - kathrynmurie
    - m-murphy
