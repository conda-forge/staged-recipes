schema_version: 1

context:
  python_min: "3.12"
  version: "1.0.0"

package:
  name: cpsat-logutils
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/cpsat-logutils/cpsat_logutils-${{ version }}.tar.gz
  sha256: db8e0b5bf16fae203e08692088e9f8a248846e03934242367f7da5dab10322ee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=2.10

tests:
  - python:
      imports:
        - cpsat_logutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pytest
    files:
      source:
        - example_logs/
        - tests/
    script:
      - pytest -vv

about:
  summary: Parse CP-SAT (OR-Tools) solver logs into line-anchored, JSON-serializable pydantic models.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/d-krupke/cpsat-logutils

extra:
  recipe-maintainers:
    - mgorny
