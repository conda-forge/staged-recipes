context:
  name: dask-setup
  version: "2.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/dask_setup/dask_setup-${{ version }}.tar.gz
  sha256: 7c64b5e89fc3153a47cd2424899d968ab6385e2132a817f18e9785e505b18fbb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dask-setup = dask_setup.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - dask-core >=2024.1.0
    - distributed >=2024.1.0
    - psutil >=5.9
    - pyyaml >=6.0
  run_constraints:
    # Optional: only needed for setup_pbs_cluster()/setup_slurm_cluster().
    - dask-jobqueue >=0.8

tests:
  - python:
      imports:
        - dask_setup
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - dask-setup --help
      # Loads the builtin profiles, so it fails if package data went missing.
      - dask-setup list

about:
  homepage: https://github.com/21centuryweather/dask_setup
  repository: https://github.com/21centuryweather/dask_setup
  summary: HPC-aware Dask setup for PBS (NCI Gadi) and SLURM clusters.
  description: |
    Wraps dask.distributed with HPC-aware defaults: resource detection from
    PBS/SLURM environment variables, spill routing to node-local storage,
    workload-shaped worker topology, profile-based configuration, and
    multi-node clusters via dask-jobqueue.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - greensh16
