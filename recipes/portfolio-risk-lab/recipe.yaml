context:
  name: portfolio-risk-lab
  version: "0.1.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/86/b4/9b9e691a8a4587cb5c93318dc5d2b53a1d6dee2c1fc9c483038098532789/portfolio_risk_lab-0.1.0.tar.gz
  sha256: 15c08b474f3b483fe2faa29caad19ad914653747074b8a4de66ea83f9d381693

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - pandas >=2.0
    - scipy >=1.10

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - portfolio_risk_lab
      pip_check: true

about:
  homepage: https://garroshub.github.io/portfolio-risk-lab/
  summary: 'Portfolio rebalancing and uncertainty-aware risk budgeting for decision support'
  license: MIT
  license_file: LICENSE
  repository: https://github.com/garroshub/portfolio-risk-lab
  documentation: https://github.com/garroshub/portfolio-risk-lab#python-api

extra:
  recipe-maintainers:
    - garroshub
