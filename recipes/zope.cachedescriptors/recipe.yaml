schema_version: 1

context:
  version: "6.0"

package:
  name: zope.cachedescriptors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.cachedescriptors/zope_cachedescriptors-${{ version }}.tar.gz
  sha256: 9bb2a04fd0037a861a8e368e51aa60a3b9d2f4ccbf7b793070df5cc79dde1f74

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.cachedescriptors
        - zope.cachedescriptors.property
        - zope.cachedescriptors.method
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - src/zope/cachedescriptors/method.rst
        - src/zope/cachedescriptors/property.rst
    script:
      - python -m doctest -v src/zope/cachedescriptors/method.rst src/zope/cachedescriptors/property.rst

about:
  homepage: https://github.com/zopefoundation/zope.cachedescriptors
  repository: https://github.com/zopefoundation/zope.cachedescriptors
  documentation: https://zopecachedescriptors.readthedocs.io
  summary: Method and property caching decorators
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
