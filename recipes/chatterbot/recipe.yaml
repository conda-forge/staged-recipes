schema_version: 1

context:
  version: "1.2.15"

package:
  name: chatterbot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chatterbot/chatterbot-${{ version }}.tar.gz
  sha256: b557aa0d12d2c3dd1823785f3b83da786c09356f477e2965fbdbaa8637a1c584

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.15
    - mathparse >=0.2,<0.3
    - python-dateutil >=2.9,<2.10
    - sqlalchemy >=2.0,<2.1
    - spacy >=3.8,<3.9
    - tqdm

tests:
  - python:
      imports:
        - chatterbot
        - chatterbot.logic
        - chatterbot.storage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gunthercox/ChatterBot
  repository: https://github.com/gunthercox/ChatterBot
  documentation: https://docs.chatterbot.us
  license: BSD-3-Clause
  license_file: LICENSE
  summary: ChatterBot is a machine learning, conversational dialog engine
  description: |
    ChatterBot is a conversational dialog engine that generates responses
    from a corpus of known conversations. It is language independent: the
    engine selects a response by searching the closest matching known
    statement, so it can be trained on any language. Storage adapters cover
    SQL and MongoDB backends, and logic adapters can be combined or replaced
    to control how responses are chosen.

extra:
  recipe-maintainers:
    - killua156
