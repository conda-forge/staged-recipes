# v1 recipe for conda-forge staged-recipes / kernelforge-cuda-feedstock.
# Copy this directory into staged-recipes/recipes/kernelforge-cuda/
#
# Builds the CUDA companion from the kernelforge sdist (no separate PyPI sdist)
# via packaging/kernelforge-cuda, matching the PyPI companion layout.
schema_version: 1

context:
  name: kernelforge-cuda
  version: "1.1.0"
  build_number: 0
  # Same upstream tarball as CPU kernelforge (includes packaging/ + src/*.cu).
  sha256: 93e6c71b0209218a4205ed3c4a5a10011f9b0c029d303db12abf2cb9d0994eb4
  torch_proc_type: cuda
  build_string_prefix: cuda${{ cuda_compiler_version | replace('.', '') }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kernelforge/kernelforge-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: ${{ build_number }}
  string: ${{ build_string_prefix }}_py${{ python | version_to_buildstring }}_h${{ hash }}_${{ build_number }}
  # Linux + CUDA only; CPython range matches PyPI companion wheels.
  skip:
    - win
    - osx
    - cuda_compiler_version == "None"
    - match(python, "<3.11")
    - match(python, ">=3.15")
  script:
    file: build
    env:
      CMAKE_GENERATOR: Ninja
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
      TORCH_DONT_CHECK_COMPILER_ABI: "1"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - if: build_platform != host_platform
      then:
        - python
        - cross-python_${{ host_platform }}
        - numpy
        - pytorch
        - pytorch * [build=${{ torch_proc_type }}*]
  host:
    - python
    - pip
    - scikit-build-core >=0.9
    - setuptools-scm >=8
    - setuptools
    - pybind11
    - numpy
    - libblas
    - libcblas
    - liblapack
    - libgomp
    - cuda-version ==${{ cuda_compiler_version }}
    - cuda-cudart-dev
    - libcublas-dev
    - libcusolver-dev
    - libcusparse-dev
    - libnvjitlink-dev
    - pytorch
    - pytorch * [build=${{ torch_proc_type }}*]
    - libtorch
    - libtorch * [build=${{ torch_proc_type }}*]
  run:
    - python
    - numpy >=2
    - libgomp
    # CPU package must be present so cuda_*.so land beside kernelforge/.
    - kernelforge ==${{ version }}
    - pytorch * [build=${{ torch_proc_type }}*]
    - ${{ pin_compatible('cuda-version', lower_bound='x', upper_bound='x') }}

tests:
  - script:
      # Forge builders typically have no GPU / driver; only check the companion
      # modules were installed into site-packages/kernelforge/.
      - python -c "from pathlib import Path; import kernelforge; root = Path(kernelforge.__file__).resolve().parent; so = sorted(root.glob('cuda_*.so')); print('cuda modules:', [p.name for p in so]); assert so, 'no cuda_*.so installed'"

about:
  homepage: https://github.com/andersx/kernelforge
  repository: https://github.com/andersx/kernelforge
  license: MIT
  license_file: LICENSE
  summary: CUDA extensions for KernelForge (Linux)
  description: |
    Linux companion package that installs KernelForge CUDA extension modules
    (cuda_*.so) into site-packages/kernelforge/. Requires the CPU kernelforge
    package and a CUDA build of pytorch from conda-forge.

extra:
  recipe-maintainers:
    - andersx
