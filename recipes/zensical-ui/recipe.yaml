context:
  version: "0.0.41"

package:
  name: zensical-ui
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zensical-ui/zensical_ui-${{ version }}.tar.gz
  sha256: 2268e3533a2e186eb7b67dcc8ccdbfc5994fe114cda9382a505f306256df3d88

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27,<2.0
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - zensical_ui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - package_contents:
      site_packages:
        - zensical_ui/templates/main.html
  - script:
      - python -c "import os, zensical_ui; assert os.path.isfile(os.path.join(zensical_ui.get_theme_dir(), 'base.html'))"

about:
  homepage: https://zensical.org
  summary: Templates and browser assets for Zensical
  description: |
    Templates and browser assets (HTML templates, JavaScript, CSS, and icons) for Zensical,
    a modern static site generator by the creators of Material for MkDocs.
  license: MIT
  license_file:
    - LICENSE
    - dist/.icons/fontawesome/LICENSE.txt
    - dist/.icons/material/LICENSE
    - dist/.icons/octicons/LICENSE
    - dist/.icons/simple/LICENSE.md
    - dist/.icons/lucide/LICENSE
    - dist/assets/javascripts/LICENSE
  documentation: https://zensical.org/docs/
  repository: https://github.com/zensical/ui

extra:
  recipe-maintainers:
    - pavelzw
