# pip check fails on mcstas's dependency nexpy ("nexpy requires jupyter, which is not installed"), not on unviz
context:
  version: "0.1.0"

package:
  name: unviz
  version: ${{ version }}

source:
  url: https://github.com/Lomholy/Union_visualizer/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9cdbfb178393bcf0e0602b090ac176c5c68858d6c333353079e5b1b91e597974

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - unviz = unviz.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - mcstas
    - mapbox_earcut
    - mcstasscript
    - networkx
    - numba
    - numpy
    - pygfx
    - pylinalg
    - qtpy
    - rendercanvas
    - shapely
    - trimesh

tests:
  - python:
      imports:
        - unviz
        - unviz.cli
      # pip check fails on mcstas's dependency nexpy ("nexpy requires jupyter, which is not installed"), not on unviz
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - unviz --help

about:
  homepage: https://github.com/Lomholy/Union_visualizer
  summary: Visualize and export McStas Union sample environments
  description: |
    unviz shows McStas Union sample environments in an interactive 3D viewer
    and exports whole McStas instruments as CAD meshes.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Lomholy
