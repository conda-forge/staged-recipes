context:
  version: "1.5.2"

package:
  name: ocaml-csexp
  version: ${{ version }}

source:
  url: https://github.com/ocaml-dune/csexp/releases/download/${{ version }}/csexp-${{ version }}.tbz
  sha256: 1a14dd04bb4379a41990248550628c77913a9c07f3c35c1370b6960e697787ff

build:
  number: 0
  skip:
    - win
  script:
    # Temporary workaround for conda-forge/ocaml-feedstock#101.
    - if: osx
      then: export CONDA_OCAML_CC="${CC}"
    - if: osx
      then: export CONDA_OCAML_MKEXE="${CC} -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -Wl,-headerpad_max_install_names -Wl,-rpath,@executable_path/../lib"
    - if: osx
      then: export CONDA_OCAML_MKDLL="${CC} -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -shared -Wl,-headerpad_max_install_names -undefined dynamic_lookup"
    - dune build --profile=release -p csexp @install
    - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" csexp

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("ocaml") }}
    - ocaml-dune >=3.4
  host:
    - ocaml >=4.03.0

tests:
  - package_contents:
      strict: true
      files:
        - lib/ocaml/csexp/*
        - doc/csexp/*

about:
  homepage: https://github.com/ocaml-dune/csexp
  repository: https://github.com/ocaml-dune/csexp
  summary: Parsing and printing of S-expressions in canonical form
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - ManuelLerchner
