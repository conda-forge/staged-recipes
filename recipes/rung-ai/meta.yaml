{% set name = "rung-ai" %}
{% set version = "0.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/rung_ai-{{ version }}.tar.gz
  sha256: 9444cf34f5a9f884f34c4f82d579b57786057fe3afe7c3fcf9c8faea2d7327d1

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - rung = rung.cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - hatchling
  run:
    - python >=3.9

test:
  imports:
    - rung
  commands:
    - rung version
    - rung --help

about:
  home: https://github.com/rung-dev/rung
  summary: "A verification-evidence framework: vocabulary, evidence-bundle schema, policy, and a deterministic stdlib-only gate."
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/rung-dev/rung

extra:
  recipe-maintainers:
    - one-kash
