{% set name = "rung-ai" %}
{% set version = "0.1.2" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/rung_ai-{{ version }}.tar.gz
  sha256: 915968465648929bbeaa4c30bceda787a8aa924b24fd19ea24cb997b1398a211

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - rung = rung.cli:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - rung
  commands:
    - rung version
    - rung --help

about:
  home: https://github.com/rung-dev/rung
  summary: "A verification-evidence framework: vocabulary, evidence-bundle schema, policy, and a deterministic stdlib-only gate."
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/rung-dev/rung

extra:
  recipe-maintainers:
    - one-kash
