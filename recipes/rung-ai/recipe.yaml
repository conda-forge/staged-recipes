schema_version: 1

context:
  version: "0.1.2"

package:
  name: rung-ai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rung-ai/rung_ai-${{ version }}.tar.gz
  sha256: 915968465648929bbeaa4c30bceda787a8aa924b24fd19ea24cb997b1398a211

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - rung = rung.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rung
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - rung version
      - rung --help

about:
  homepage: https://github.com/rung-dev/rung
  summary: "A verification-evidence framework: shared vocabulary, evidence-bundle schema, declarative policy, and a deterministic stdlib-only gate."
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/rung-dev/rung

extra:
  recipe-maintainers:
    - one-kash
