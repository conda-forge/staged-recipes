schema_version: 1

context:
  version: "0.2.0"
  python_min: "3.11"

package:
  name: laxate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/laxate/laxate-${{ version }}.tar.gz
  sha256: fb269649caf68d98dfe4a5164a35d00f7f99f6b1d3bf50ef37df946dc4caae3b

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - laxate = laxate.cli:main
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - benched >=0.2.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - laxate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - laxate --help

about:
  homepage: https://github.com/1kbgz/laxate
  repository: https://github.com/1kbgz/laxate
  summary: Cloud benchmark orchestration for Benched
  description: |
    Laxate runs Benched benchmark suites in local environments, containers,
    or ephemeral Hetzner Cloud servers.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - timkpaine
