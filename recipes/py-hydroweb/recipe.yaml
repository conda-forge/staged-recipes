schema_version: 1

context:
  python_min: "3.9"
  version: "1.3.3"

package:
  name: py-hydroweb
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/py-hydroweb/py_hydroweb-${{ version }}.tar.gz
  sha256: 7d422eb26d7c8fcbf4e7c6bf09b11a5209c881d502516021784185cbe62d0d97

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - requests >=2.32.3,<2.33.dev0
    - retry2 >=0.9.5,<0.10.dev0
    - tqdm >=4.67.1,<4.68.dev0

tests:
  - python:
      imports:
        - py_hydroweb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python API to search and download hydrological data from the hydroweb.next catalog
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/py-hydroweb/
  repository: https://github.com/CNES/py-hydroweb

extra:
  recipe-maintainers:
    - pjtys
