schema_version: 1

context:
  version: "1.0.0"

package:
  name: fit_python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fit_python/fit_python-${{ version }}.tar.gz
  sha256: 0858f7b18b66c99214e046690c85997213cef15f1f046dc1accc8b08f41dd724

build:
  number: 0
  skip: match(python, "<3.10")
  script: pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=77
    - wheel
  run:
    - python
    - numpy >=1.23
    - pillow

tests:
  - python:
      imports:
        - fit_python
      pip_check: true
  - script:
      - python tests/smoke_test.py
    files:
      source:
        - tests/smoke_test.py

about:
  homepage: https://github.com/skokg/FiT
  summary: Forward-in-Time spatial object identification and temporal tracking
  description: |
    FiT Python identifies and tracks objects in sequences of 2D or 3D fields.
    It provides a NumPy interface to a C++ implementation of cascading-threshold
    spatial identification and overlap-based temporal tracking, with batch
    processing, parallel spatial identification, and PNG and CSV output helpers.
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/skokg/FiT#readme
  repository: https://github.com/skokg/FiT

extra:
  recipe-maintainers:
    - skokg
