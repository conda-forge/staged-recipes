schema_version: 1

context:
  version: "6.0"
  test_modules:
    - zope.browsermenu.tests.test_addMenuItem
    - zope.browsermenu.tests.test_directives
    - zope.browsermenu.tests.test_fields
    - zope.browsermenu.tests.test_menu
    - zope.browsermenu.tests.test_menudirectives

package:
  name: zope.browsermenu
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.browsermenu/zope_browsermenu-${{ version }}.tar.gz
  sha256: f17f86b05177760338b193db4cfc325c4fc399dc1e054bade185e0c87ca2eb46

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.browser
    - zope.component >=3.7
    - zope.configuration
    - zope.i18nmessageid
    - zope.interface
    - zope.pagetemplate >=3.5
    - zope.publisher >=4.2.1
    - zope.schema
    - zope.security
    - zope.traversing >3.7

tests:
  - python:
      imports:
        - zope.browsermenu
        - zope.browsermenu.menu
        - zope.browsermenu.metaconfigure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest -v ${{ test_modules | join(" ") }}
    requirements:
      run:
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.browsermenu
  repository: https://github.com/zopefoundation/zope.browsermenu
  documentation: https://zopebrowsermenu.readthedocs.io
  summary: Browser menu implementation for Zope
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
