context:
  version: "0.15.2"
  python_min: "3.12"

package:
  name: aiqclib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiqclib/aiqclib-${{ version }}.tar.gz
  sha256: 0c89c27e4e7d20d786f53a619dcc1895edf3590f072c86a84d98f91b0e38010b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - joblib >=1.4.2
    - jsonschema >=4.23.0
    - matplotlib-base >=3.10.8
    - numba >=0.62
    - numpy >=2.2
    - pandas >=2.2
    - polars >=1.30.0
    - pyarrow >=19.0.0
    - pyyaml >=6.0.2
    - scikit-learn >=1.6.1
    - shap >=0.51.0
    - xgboost >=3.0.2

tests:
  - python:
      imports:
        - aiqclib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/AIQC-Hub/aiqclib
  repository: https://github.com/AIQC-Hub/aiqclib
  documentation: https://aiqclib.readthedocs.io/
  summary: Config-driven machine learning library for anomaly detection in CTD ocean data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - takayasaito
