schema_version: 1

context:
  name: intrinsics-kernel
  opam_name: ocaml_intrinsics_kernel
  version: "0.17.2"
  build_number: 0

  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  # ocaml_<platform> matchspec tail: version, plus the gcc_ (MinGW) track on non-unix
  ocaml_spec: ${{ ocaml_compiler_version ~ (".*" if unix else ".* gcc_*") }}

package:
  name: ocaml-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/janestreet/ocaml_intrinsics_kernel/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a91df2e5038b7d5cc8cccbc2b3fd21fcc5acfffcf4e67792ccb4198c32d18562

build:
  number: ${{ build_number }}
  string: ${{ "gcc_" if not unix }}h${{ hash }}_${{ build_number }}
  script: bash ${{ RECIPE_DIR }}/build.sh ${{ opam_name }}

requirements:
  build:
    - ${{ compiler("ocaml") }}
    # compiler("ocaml") renders no toolchain track; name the gcc_ (MinGW) one on non-unix
    - ocaml_${{ target_platform }} ${{ ocaml_spec }}
    # C stubs: a C compiler on every lane
    - if: unix
      then:
        - ${{ stdlib("c") }}
        - ${{ compiler("c") }}
      else:
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
    - ocaml-dune >=3.11
    - ${{ m2 }}make
    - if: not unix
      then:
        - m2-bash
        - m2-coreutils
        - m2-sed
        - m2-grep
        - m2-findutils
  host:
    # library: ocaml's run_export pins the compiler patch version
    - ocaml ${{ ocaml_spec }}
    - ocaml-dune >=3.11
  # the ocaml run_export does not encode the non-unix toolchain track
  run_constraints:
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_spec }}
    # installed dune-package declares (lang dune X.Y); older dune cannot read it
    - ${{ pin_compatible('ocaml-dune', lower_bound='x.x', upper_bound=None) }}

tests:
  - package_contents:
      files:
        - ${{ library }}lib/ocaml/${{ opam_name }}/META
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.cma
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.cmxa
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.a
        - ${{ library }}lib/ocaml/${{ opam_name }}/${{ opam_name }}.cmxs
  - script:
      interpreter: bash
      content:
        - echo 'let () = print_string "intrinsics_kernel ok"' > t.ml
        - ocamlfind ocamlopt -package ocaml_intrinsics_kernel -linkpkg -linkall t.ml -o t
        - ./t | grep -q "intrinsics_kernel ok"
    requirements:
      run:
        - ocaml ${{ ocaml_spec }}
        - ocaml-findlib
        - if: unix
          then:
            - ${{ compiler("c") }}
        - if: not unix
          then:
            - m2-bash
            - m2-coreutils

about:
  homepage: https://github.com/janestreet/ocaml_intrinsics_kernel
  repository: https://github.com/janestreet/ocaml_intrinsics_kernel
  license: MIT
  license_file: LICENSE.md
  summary: Intrinsics kernel library for OCaml (Jane Street)

extra:
  recipe-maintainers:
    - MementoRC
    - ManuelLerchner
