context:
  version: "0.4.2"

package:
  name: nvsmi
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/nvsmi/nvsmi-${{ version }}.tar.gz
  sha256: c1a391c7c4dadc6ec572909ff0372451d464ebadc144e5aa5fbbcc893dcb7bfa

build:
  noarch: python
  script: python -m pip install . -vv --no-build-isolation
  number: 0
  python:
    entry_points:
      - nvsmi = nvsmi:_main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - nvsmi
      pip_check: true
  - script:
      - nvsmi --help

about:
  homepage: https://github.com/pmav99/nvsmi
  summary: A user-friendly wrapper to nvidia-smi
  description: A Python library and command-line interface for querying NVIDIA GPUs through nvidia-smi.
  license: MIT
  license_file: LICENSE.txt
  repository: https://github.com/pmav99/nvsmi

extra:
  recipe-maintainers:
    - jasonjunweilyu
