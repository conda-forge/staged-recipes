context:
  version: "0.4.1"
  python_min: "3.12"

package:
  name: qavf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qavf/qavf-${{ version }}.tar.gz
  sha256: c1081894d38e478d8b0166d7e3b814264f94c86585614f849241636102e38310

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - qavf = qavf.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}
    - python-duckdb >=1.2
    - jinja2 >=3.1
    - markupsafe >=2.1
    - numpy >=1.26
    - polars >=1.32
    - pyarrow >=16
    - pydantic >=2.7
    - pyyaml >=6.0.1
  run_constraints:
    - scipy >=1.11.3
    - pandas >=2.2

tests:
  - python:
      imports:
        - qavf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - qavf --version
      - qavf demo demo --clean
      - qavf run -c demo/qavf.yaml

about:
  homepage: https://github.com/AhmedAredah/qavf
  repository: https://github.com/AhmedAredah/qavf
  documentation: https://github.com/AhmedAredah/qavf/tree/main/docs
  summary: Configurable data QA/QC for files, dataframes and database queries.
  description: |
    QAVF validates files, dataframes and database queries against declared limits,
    statistical expectations and stored baselines. It reports exact violation counts
    with bounded evidence and never reports a pass for a check it could not assess.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - AhmedAredah
