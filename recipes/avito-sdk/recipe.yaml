context:
  version: "0.1.0"

package:
  name: avito-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/avito-sdk/avito_sdk-${{ version }}.tar.gz
  sha256: d363d25238239d15c32526835b970b9baaea52a5dfde35c19c66b2ae70599649

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - avito = avito_sdk.cli:main
      - avito-sdk = avito_sdk.cli:main
      - avito-parser = avito_sdk.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 >=4.10.0
    - requests >=2.28.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - avito_sdk
      pip_check: true
  - script:
      - avito-sdk --help
      - avito --help

about:
  homepage: https://github.com/eminsk/avito-sdk
  summary: High-performance headless Avito scraping and data extraction SDK
  description: |
    avito-sdk is an autonomous, lightweight Python library and SDK for Avito
    with real-time price change tracking, full parameter extraction («О помещении»,
    авто, электроника), seller name extraction, and native async support.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/avito-sdk
  documentation: https://github.com/eminsk/avito-sdk#readme

extra:
  recipe-maintainers:
    - eminsk
