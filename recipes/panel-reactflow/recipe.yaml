context:
  name: panel-reactflow
  version: "0.5.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/panel_reactflow-${{ version }}.tar.gz
  sha256: e1174ea8c2f5cbbefce27d16013a661101e638de27191713bfc33d4b3bf2790f

build:
  noarch: python
  number: 0
  script:
    env:
      # panel compile writes JSX with the locale encoding, which fails on Windows cp1252.
      PYTHONUTF8: "1"
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    # The hatch build hook recompiles the JS bundle with `panel compile`.
    - panel-core >=1.5.0
    - packaging
    - nodejs
    - esbuild
  run:
    - python >=${{ python_min }}
    - panel >=1.5.0
    - packaging

tests:
  - python:
      imports:
        - panel_reactflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/panel-extensions/panel-reactflow
  summary: A Panel wrapper for the React Flow JS library.
  description: |
    panel-reactflow provides interactive node-based graph editors for Panel,
    built on top of the React Flow JavaScript library.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  repository: https://github.com/panel-extensions/panel-reactflow

extra:
  recipe-maintainers:
    - philippjfr
