# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.1"
  python_check_max: "3.14"

package:
  name: arabic-reshaper
  version: ${{ version }}

source:
  - target_directory: dist
    url: https://files.pythonhosted.org/packages/source/a/arabic-reshaper/arabic_reshaper-${{ version }}.tar.gz
    sha256: a0d9b2a9fa29b5f2c1d705f407adf6ca4242405b9cac0e5cc09e6c4f3f8fb68c
  - target_directory: src
    url: https://github.com/mpcabd/python-arabic-reshaper/archive/refs/tags/v${{ version }}.tar.gz
    sha256: eb1b9df3b5aaf3e8c1a454aad9f7754a062c2f2d134d972209b801db933caa7c

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports: arabic_reshaper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - src/arabic_reshaper/tests/
    requirements:
      run:
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      - cd src/arabic_reshaper
      - coverage run --source=arabic_reshaper --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=74

about:
  summary: Reconstruct Arabic sentences to be used in applications that do not support Arabic
  license: MIT
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/arabic-reshaper
  repository: https://github.com/mpcabd/python-arabic-reshaper

extra:
  recipe-maintainers:
    - bollwyvl
