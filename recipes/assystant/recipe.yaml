schema_version: 1

context:
  name: assystant
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 852ee80d63ee9516129a3d7290c78d3e73e2f1583c290c8210f19e061d4a29b1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - assystant = assystant.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }},<3.15
    - numpy
    - pandas >=1.3.0
    - pyiron_workflow >=0.19,<0.21
    - pyiron_workflow_assyst >=0.2.0,<0.3
    - pymatgen >=2023.0.0
    - pyxtal >=1.0
    - pyyaml >=6.0
    - tqdm >=4.0

tests:
  - python:
      imports:
        - assystant
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - assystant --help

about:
  summary: "Command-line driver for ASSYST campaigns: PyXtal generation -> per-structure DFT on SLURM -> collated training dataset"
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/ligerzero-ai/assystant
  repository: https://github.com/ligerzero-ai/assystant

extra:
  recipe-maintainers:
    - ligerzero-ai
