context:
  version: "0.9.1"
  python_min: "3.10"

package:
  name: pygtide
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pygtide/pygtide-{{ version }}.tar.gz
  sha256: 23e385dce3ccba62891322ffc497c9bb124f6d0a2a227525c757377a794d6a63

build:
  noarch: python
  script: python -m pip install . --no-deps -vv --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - wheel
    - numpy >=1.21.0
    - meson
    - ninja
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.21.0
    - pandas <3

tests:
  imports:
    - pygtide
  python_version:
    - ${{ python_min }}.*
    - "*"
  pip_check: true

about:
  home: https://github.com/hydrogeoscience/pygtide
  summary: A Python module and wrapper for ETERNA PREDICT to compute gravitational tides on Earth
  doc_url: https://hydrogeo.science
  license: MPL-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - craigmillernz
    - hydrogeoscience
