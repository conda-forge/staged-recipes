context:
  version: "0.9.1"

package:
  name: pygtide
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pygtide/pygtide-${{ version }}.tar.gz
  sha256: 23e385dce3ccba62891322ffc497c9bb124f6d0a2a227525c757377a794d6a63

build:
  script:
    - if: win
      then:
        - set SETUPTOOLS_USE_DISTUTILS=stdlib
        - python -m pip install . -vv --no-build-isolation
      else:
        - export SETUPTOOLS_USE_DISTUTILS=stdlib
        - python -m pip install . -vv --no-build-isolation
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - setuptools >=61
    - wheel
    - numpy >=1.26,<2
    - meson
    - ninja
    - pip
  run:
    - python
    - numpy >=1.21.0
    - pandas <3

tests:
  - python:
      imports:
        - pygtide
      pip_check: true

about:
  homepage: https://github.com/hydrogeoscience/pygtide
  summary: A Python module and wrapper for ETERNA PREDICT to compute gravitational tides on Earth
  documentation: https://hydrogeo.science
  license: MPL-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - craigmillernz
    - hydrogeoscience
