context:
  version: "0.9.2"

package:
  name: pygtide
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pygtide/pygtide-${{ version }}.tar.gz
  sha256: 43f67c9845d0f2909218ab1fae2eb93191bc28f8d3e8bef5c5f86aa7d8fdf6ff

build:
  skip: match(python, "<3.10")
  number: 0
  script:
    - if: win
      then:
        - set "AR=llvm-ar"
        - set "LIB=%PREFIX%\Library\lib;%BUILD_PREFIX%\Library\lib;%LIB%"
        - "%PYTHON% -m pip install . -vv --no-build-isolation --no-deps"
      else:
        - unset MESON_BUILD_ROOT
        - unset MESON_SOURCE_ROOT
        - unset NINJA_STATUS
        - unset NINJA_LOG_PATH
        - unset MESONINTROSPECT
        - "$PYTHON -m pip install . -vv --no-build-isolation --no-deps"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - if: win
      then:
        - llvm-tools

  host:
    - python
    - pip
    - setuptools >=61
    - wheel
    - meson >=1.1.0
    - ninja
    - numpy >=1.21
    - if: win
      then:
        - libpgmath

  run:
    - python
    - numpy >=1.21
    - pandas

tests:
  - python:
      imports:
        - pygtide
      pip_check: true

about:
  homepage: https://github.com/hydrogeoscience/pygtide
  summary: A Python module and wrapper for ETERNA PREDICT to compute gravitational tides on Earth
  documentation: https://hydrogeo.science
  license: MPL-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - craigmillernz
    - hydrogeoscience
