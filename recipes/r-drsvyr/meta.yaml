{% set version = "0.1.0" %}

package:
  name: r-drsvyr
  version: {{ version }}

source:
  url: https://github.com/klinares/DrSvyR/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 45cd3a12109519594c770dab2d3f471890031a6d9e589ee5d07f170c60995f9d

build:
  number: 0
  noarch: generic
  script: R CMD INSTALL --build .

requirements:
  host:
    - r-base
  run:
    - r-base
    - r-shiny
    - r-bslib
    - r-dplyr
    - r-purrr
    - r-tibble
    - r-tidyr
    - r-stringr
    - r-ggplot2
    - r-readr
    - r-rlang
    - r-survey
    - r-haven
    - r-janitor
    - r-clue
    - r-matrixstats
    - r-future
    - r-furrr
    - r-zip
    - r-knitr
    - r-base64enc
    - r-viridis
    - r-jsonlite
    - r-yaml
    - r-digest
    - r-fs
    - r-markdown
    - r-httpuv

test:
  commands:
    - $R -e "library('drsvyr')"

about:
  home: https://github.com/klinares/DrSvyR
  license: MIT
  license_file: LICENSE
  summary: Latent class segmentation for complex survey data

extra:
  recipe-maintainers:
    - klinares
