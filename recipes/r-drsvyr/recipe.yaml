schema_version: 1

context:
  version: "0.1.0"

package:
  name: r-drsvyr
  version: ${{ version }}

source:
  url: https://github.com/klinares/DrSvyR/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 45cd3a12109519594c770dab2d3f471890031a6d9e589ee5d07f170c60995f9d

build:
  number: 0
  noarch: generic
  script: R CMD INSTALL --build .

requirements:
  # Both host AND run carry the same list, and this is not redundancy -- it is
  #   what R CMD INSTALL actually needs. The identical failure on Linux, macOS
  #   and Windows traced to one cause: every one of these resolved and
  #   installed correctly as a RUN dependency, into the host environment, but
  #   R CMD INSTALL reads DESCRIPTION's Imports: and searches the BUILD-time R
  #   library for them under R's own package names (dplyr, not r-dplyr) the
  #   moment installation starts -- before the run environment the built
  #   package will eventually use is ever consulted. A run-only dependency is
  #   invisible to that check, which is why the host install step logged
  #   success just before R CMD INSTALL itself reported all 27 as missing.
  # Nothing here is compiled, so there is no size or ABI cost to listing them
  #   twice; noarch: generic packages carry this duplication as standard
  #   practice for exactly this reason.
  host:
    - r-base
    - r-base64enc
    - r-bslib
    - r-clue
    - r-digest
    - r-dplyr
    - r-fs
    - r-furrr
    - r-future
    - r-ggplot2
    - r-haven
    - r-httpuv
    - r-janitor
    - r-jsonlite
    - r-knitr
    - r-markdown
    - r-matrixstats
    - r-purrr
    - r-readr
    - r-rlang
    - r-shiny
    - r-stringr
    - r-survey
    - r-tibble
    - r-tidyr
    - r-viridis
    - r-yaml
    - r-zip
  run:
    - r-base
    - r-base64enc
    - r-bslib
    - r-clue
    - r-digest
    - r-dplyr
    - r-fs
    - r-furrr
    - r-future
    - r-ggplot2
    - r-haven
    - r-httpuv
    - r-janitor
    - r-jsonlite
    - r-knitr
    - r-markdown
    - r-matrixstats
    - r-purrr
    - r-readr
    - r-rlang
    - r-shiny
    - r-stringr
    - r-survey
    - r-tibble
    - r-tidyr
    - r-viridis
    - r-yaml
    - r-zip

tests:
  - script:
      - $R -e "library('drsvyr')"

about:
  homepage: https://github.com/klinares/DrSvyR
  license: MIT
  license_file: LICENSE
  summary: Latent class segmentation for complex survey data
  description: |
    A Shiny application that fits a weighted latent class model to a battery
    of survey items on complex survey data, with every standard error derived
    from the survey's own stratified jackknife replicate design. Segment
    prevalences, item-response probabilities and domain estimates are design-
    based; domain estimates additionally carry a BCH three-step correction
    for classification error.
  repository: https://github.com/klinares/DrSvyR

extra:
  recipe-maintainers:
    - klinares
