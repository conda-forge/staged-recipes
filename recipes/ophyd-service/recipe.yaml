schema_version: 1

context:
  python_min: "3.11"
  version: "0.0.2"

package:
  name: ophyd-service
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/ophyd-service/ophyd_service-${{ version }}.tar.gz
  sha256: 8eb7f080585fe2025d7d70cfd5da5a43f12a422bd958bbb1e3c6e57ac7b6aff4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - alembic
    - bluesky-queueserver
    - ophyd-async
    - h5py
    - cachetools
    - fastapi
    - httpx
    - ldap3
    - orjson
    - pamela
    - pydantic >=2,<3
    - pydantic-settings >=2
    - python-jose
    - pyzmq
    - sqlalchemy >=2
    - starlette
    - uvicorn

tests:
  - python:
      imports:
        - ophyd_service
      pip_check: true
      python_version:
        - ${{ python_min }}

about:
  summary: REST API Server for Ophyd Objects.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/ophyd-service/

extra:
  recipe-maintainers:
    - dmgav
    - mrakitin
    - tacaswell
