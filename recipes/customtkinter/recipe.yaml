schema_version: 1
context:
  version: 5.2.2
package:
  name: customtkinter
  version: ${{ version }}
source:
  url: https://pypi.org/packages/source/c/customtkinter/customtkinter-${{ version }}.tar.gz
  sha256: fd8db3bafa961c982ee6030dba80b4c2e25858630756b513986db19113d8d207
build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools >=42
  - wheel
  run:
  - python >=${{ python_min }}
  - darkdetect
  - packaging
  - tk
tests:
- python:
    imports:
    - customtkinter
    pip_check: true
    python_version:
    - ${{ python_min }}.*
    - '*'
- requirements:
    run:
    - python ${{ python_min }}.*
  script:
  - python -c "from importlib.metadata import version; assert version('customtkinter') == '${{ version }}'"
  - python -c "import customtkinter; assert callable(customtkinter.CTk); assert callable(customtkinter.CTkButton)"
about:
  homepage: https://github.com/TomSchimansky/CustomTkinter
  repository: https://github.com/TomSchimansky/CustomTkinter
  summary: A modern and customizable Python UI library based on Tkinter
  license: MIT
  license_file: LICENSE
extra:
  recipe-maintainers:
  - EinarOlafsson
