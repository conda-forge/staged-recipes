schema_version: 1

context:
  version: "1.1.1"

package:
  name: lockkernel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lockkernel/lockkernel-${{ version }}.tar.gz
  sha256: 28df978ffd9d70125058513b2c26a5d8ba4e0a3889191525eb3d569ddd090041

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.8
    - mpmath >=1.2

tests:
  - python:
      imports:
        - lockkernel
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/lockkernel
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  summary: "Locking kernel universality: exact thresholds and exponents of synchronization transitions, and fits of measured branches"
  description: |
    The exact parametric solution of the locking self-consistency for any
    frequency distribution and any locking kernel (thresholds, exponents,
    amplitudes and the order of the transition, in adjustable high
    precision),
    class-resolved cumulant dynamics with exact small-ensemble references,
    and a lab module that fits measured synchronization branches for
    threshold and exponent with error bars and refusals.
  repository: https://github.com/TaN-MM-Org/lockkernel
  documentation: https://github.com/TaN-MM-Org/lockkernel#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
