schema_version: 1

context:
  version: "1.7.0"

package:
  name: lockkernel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lockkernel/lockkernel-${{ version }}.tar.gz
  sha256: 7e0e8c7212aaf0d416ba5537e9589b89a6cae442844485d575a450d8b75c164d

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.8
    - mpmath >=1.2

tests:
  - python:
      imports:
        - lockkernel
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/lockkernel
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  summary: "When coupled oscillators start to move in step: exact thresholds and exponents, and fits of measured onsets"
  description: |
    Many oscillators with slightly different natural frequencies start to
    move in step once their coupling is strong enough. From the spread of
    frequencies and the locking kernel (how strongly an oscillator follows
    the group, as a function of how far its frequency is from the group's),
    the package computes exactly the coupling at which this starts, the
    exponent of the growth above it, and whether the onset is smooth or
    jumps with hysteresis. From a measured onset it fits the threshold and
    the exponent with error bars and says how many measurements a target
    error bar needs.
  repository: https://github.com/TaN-MM-Org/lockkernel
  documentation: https://github.com/TaN-MM-Org/lockkernel#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
