context:
  version: "1.7.9"

package:
  name: r-airgr
  version: ${{ version }}

source:
  url: https://cran.r-project.org/src/contrib/airGR_${{ version }}.tar.gz
  sha256: REPLACE_ME

build:
  number: 0
  script:
    content: R CMD INSTALL --build .

requirements:
  host:
    - r-base >=3.1
  run:
    - r-base >=3.1

tests:
  - commands:
      - R -e "library(airGR); packageVersion('airGR')"

about:
  homepage: https://hydrogr.github.io/airGR/
  summary: A set of hydrological models and tools for rainfall-runoff modelling
  license: CeCILL (>= 2.1)
  license_file: LICENSE
  repository: https://github.com/HydroGR/airGR

extra:
  recipe-maintainers:
    - fbourgin
