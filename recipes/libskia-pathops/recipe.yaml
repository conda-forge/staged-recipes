schema_version: 1

context:
  version: "0.9.2"

package:
  name: libskia-pathops
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/skia-pathops/skia_pathops-${{ version }}.tar.gz
  sha256: 4b6d8459f6f4a69282cb26fca0c2bb0b321cc58a9bf9cc6579a52a391edc0319

build:
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - gn
    - ninja
    - python
  run_exports:
    weak:
      - ${{ pin_subpackage('libskia-pathops', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - skia-pathops/include/pathops/SkPathOps.h
        - skia-pathops/include/core/SkPath.h
      lib:
        - skia-pathops

about:
  homepage: https://skia.org
  repository: https://github.com/fonttools/skia-pathops
  summary: Skia's path operations (PathOps) as a standalone shared C++ library
  description: |
    A trimmed build of Skia exposing SkPath and the PathOps boolean path
    operations, built from the self-contained Skia snapshot vendored by
    the skia-pathops project.
  license: BSD-3-Clause
  license_file: src/cpp/skia-builder/skia/LICENSE

extra:
  recipe-maintainers:
    - hmaarrfk
