{% set name = "pycap-dss" %}
{% set version = "1.3.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pycap_dss-{{ version }}.tar.gz
  sha256: c441c4623588e1754d5422e6f8eaae707dc174eb71fa0b53460ff49745d31b8e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - wheel
    - versioneer
    - pip
  run:
    - python >={{ python_min }}
    - ipython
    - jupyter
    - notebook
    - ipykernel
    - matplotlib-base
    - pyyaml
    - geopandas
    - numpy
    - scipy
    - pandas
    - gdal
    - fiona
    - rasterio >=1.0
    - rasterstats
    - shapely
    - rtree
    - pyproj >=2.0
    - pyshp
    - xlrd
    - openpyxl
    - requests

test:
  imports:
    - pycap
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/doi-usgs/pycap-dss
  summary: Analytical solutions for drawdown and streamflow depletion from high-capacity pumping wells
  doc_url: https://doi-usgs.github.io/pycap-dss/
  license: Unlicense
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - mnfienen
