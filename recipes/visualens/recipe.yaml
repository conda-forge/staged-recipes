schema_version: 1

context:
  version: "1.0.4"
  python_min: "3.12"

package:
  name: visualens
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/v/visualens/visualens-${{ version }}.tar.gz
  sha256: 29d72cd6542d6d4dcd54f81d77ad043a4d0d99187ba85c2cac919c76c3846713

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - visualens = visualens.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - lenstool
    - lenstronomy >=1.11,<2
    - numpy >=1.21,<3
    - scipy >=1.7,<2
    - astropy >=8.0,<9
    - pandas >=1.4,<4
    - matplotlib-base >=3.5,<4
    - pyqt >=5.15,<6.0.0
    - pyqtgraph >=0.13.3,<0.15
    - tqdm >=4.60,<5
    - corner >=2.2,<3
    - reproject >=0.9,<1

tests:
  - python:
      imports:
        - visualens
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A visual interface to explore and manipulate astronomical images, catalogs, and lens models created using Lenstool.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/tomresseguier/visualens/

extra:
  recipe-maintainers:
    - tomresseguier
