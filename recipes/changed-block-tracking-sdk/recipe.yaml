schema_version: 1
package:
  name: changed-block-tracking-sdk
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Changed-Block-Tracking-SDK/language-sdks-v1.0.0/changed-block-tracking-sdk-sdk-source-1.0.0.zip
  sha256: ba9db67483b15889d2d448023fdf2c484f66e16c51ac4b0752aa343e290ee8c0
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - changed_block_tracking_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from changed_block_tracking_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Changed-Block-Tracking-SDK
  summary: Windows x64 Changed-Block-Tracking-SDK Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Changed-Block-Tracking-SDK-C-ffi/LICENSE
  - Changed-Block-Tracking-SDK-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
