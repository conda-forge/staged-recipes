schema_version: 1

context:
  version: "2.0.1"

package:
  name: stepup-queue
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stepup-queue/stepup_queue-${{ version }}.tar.gz
  sha256: a08f0ef21cac71395aeae1cded32127efdce5d99af11e1044c627373feb682e1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - sq-cancel-jobs = stepup.queue.cancel_jobs:cancel_jobs
      - sq-remove-jobs = stepup.queue.remove_jobs:remove_jobs
      - sq-sbatch-and-wait = stepup.queue.sbatch:sbatch

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0
    - setuptools-scm >=8.1
    - pip
  run:
    - __unix
    - python >=${{ python_min }}
    - path >=16.14.0
    - rich >=13.0.0
    - stepup >=4.0.0,<5.0.0a1

tests:
  - if: unix
    then:
      python:
        imports:
          - stepup.queue
        pip_check: true
        python_version:
          - ${{ python_min }}.*
          - "*"
  - if: unix
    then:
      script:
        - sq-cancel-jobs --help
        - sq-remove-jobs --help
        - sq-sbatch-and-wait --help

about:
  summary: Integrate SLURM jobs into a StepUp workflow
  description: |
    StepUp Queue is an experimental StepUp Core extension
    to integrate queued jobs into a workflow.
    It currently supports integration with SLURM
    and is designed to be extensible to other job schedulers.
  license: LGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://reproducible-reporting.github.io/stepup-queue/
  repository: https://github.com/reproducible-reporting/stepup-queue/
  documentation: https://reproducible-reporting.github.io/stepup-queue/

extra:
  recipe-maintainers:
    - tovrstra
