schema_version: 1

context:
  version: "6.0"

package:
  name: zope.tal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.tal/zope_tal-${{ version }}.tar.gz
  sha256: 726f1b6d46c5ce229ea0ee02138de0276de333c30853cd0a38b5981202ba3585

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.i18nmessageid
    - zope.interface

tests:
  - python:
      imports:
        - zope.tal
        - zope.tal.talinterpreter
        - zope.tal.htmltalparser
        - zope.tal.talgenerator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest discover -v zope.tal
    requirements:
      run:
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.tal
  repository: https://github.com/zopefoundation/zope.tal
  documentation: https://zopetal.readthedocs.io
  summary: Zope Template Application Language (TAL)
  license: ZPL-2.1
  license_file:
    - LICENSE.rst
    - COPYRIGHT.rst

extra:
  recipe-maintainers:
    - killua156
