{% set name = "toolregistry" %}
{% set version = "0.14.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e2c697abf4aa70f1f6883e55ce5fa537a2f451e429c0af4327aaacfe12b4c2f6

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - pip
  run:
    - python >={{ python_min }}
    - pydantic >=2.7.2,<3.0.0
    - cloudpickle >=3.0.0
    - llm-rosetta >=0.7.1,<0.8.0
  run_constrained:
    - mcp >=1.0.0,<2.0.0
    - httpx >=0.28.1
    - langchain-core >=0.3,<0.4
    - langchain-community >=0.3,<0.4

test:
  imports:
    - toolregistry
    - toolregistry.tool_registry
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Oaklight/ToolRegistry
  summary: "ToolRegistry: A Protocol-Agnostic Tool Management Library for Function-Calling LLMs"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://toolregistry.readthedocs.io
  dev_url: https://github.com/Oaklight/ToolRegistry

extra:
  recipe-maintainers:
    - Oaklight
