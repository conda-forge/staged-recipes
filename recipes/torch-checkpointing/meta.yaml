{% set version = "0.1.0" %}

package:
  name: torch-checkpointing
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/torch-checkpointing/torch_checkpointing-{{ version }}.tar.gz
  sha256: 304725d78f7c110c521cfdb92357df371a423a0168d38f367cede63c122aea73

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - setuptools >=42.0
    - wheel
    - pip
  run:
    - python >=3.10
    - pytorch >=2.6.0
    - numpy
    - safetensors >=0.4.3
    - typing_extensions >=4.6.0

test:
  imports:
    - torch_checkpointing
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/meta-pytorch/torch_checkpointing
  summary: A high-performance, distributed-training-ready checkpointing library for PyTorch models
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sarthakpati
