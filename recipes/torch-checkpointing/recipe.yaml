schema_version: 1

context:
  python_min: 3.10
  version: 0.1.0

package:
  name: torch-checkpointing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/torch-checkpointing/torch_checkpointing-${{ version }}.tar.gz
  sha256: 304725d78f7c110c521cfdb92357df371a423a0168d38f367cede63c122aea73

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - pytorch >=2.6.0
    - numpy
    - safetensors >=0.4.3
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - torch_checkpointing
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A high-performance, distributed-training-ready checkpointing library for PyTorch models
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/meta-pytorch/torch_checkpointing

extra:
  recipe-maintainers:
    - sarthakpati
