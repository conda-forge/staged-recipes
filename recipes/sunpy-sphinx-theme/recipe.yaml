schema_version: 1

context:
  name: sunpy-sphinx-theme
  version: "2.5.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 0b20bcef4c82ff9ad88f3b9ae9c05311049e1e2dc5c4530aecb572045d9fb4c9

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
  run:
    - python >=${{ python_min }}
    - pydata-sphinx-theme >=0.24.0,<0.25
    - sphinxext-opengraph >=0.13
    - sphinx >=7.3.0

tests:
  - python:
      imports:
        - sunpy_sphinx_theme
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sunpy/sunpy-sphinx-theme
  summary: The sphinx theme for the SunPy website and documentation.
  license: BSD-2-Clause
  license_file: LICENSE.md
  repository: https://github.com/sunpy/sunpy-sphinx-theme

extra:
  recipe-maintainers:
    - alasdairwilson
    - cadair
    - wtbarnes
    - astrofrog
