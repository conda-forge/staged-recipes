schema_version: 1

context:
  version: "0.10.1"

package:
  name: connectrpc
  version: ${{ version }}

source:
  # The sdist doesn't ship the tests.
  url: https://github.com/connectrpc/connect-python/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 882943ca957909ba77c7aa46161cab6e0fe43725da5db87fc489b7db4aa85312

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.0,<0.12.0
  run:
    - python >=${{ python_min }}
    - protobuf >=5.28
    - pyqwest >=0.5.1

tests:
  - python:
      imports:
        - connectrpc
        - connectrpc.client
        - connectrpc.server
        - connectrpc.compression.gzip
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - test/
    requirements:
      run:
        - pytest
        - pytest-asyncio
        - brotli-python
        - zstandard
    script:
      # test_grpc.py needs pyvoy (not on conda-forge) and test_example.py needs
      # upstream's example workspace package.
      - pytest -v test --ignore=test/test_grpc.py --ignore=test/test_example.py

about:
  homepage: https://github.com/connectrpc/connect-python
  repository: https://github.com/connectrpc/connect-python
  documentation: https://connectrpc.com/docs/python/getting-started/
  summary: Server and client runtime library for Connect RPC
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
