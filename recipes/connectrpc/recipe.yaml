schema_version: 1

context:
  version: "0.10.1"

package:
  name: connectrpc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/connectrpc/connectrpc-${{ version }}.tar.gz
  sha256: eaf093a4f0d1b9c854c71839083ed5242a551100e99cf52e3cc5e35663f2a5ea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.0,<0.12.0
  run:
    - python >=${{ python_min }}
    - protobuf >=5.28
    - pyqwest >=0.5.1

tests:
  - python:
      imports:
        - connectrpc
        - connectrpc.client
        - connectrpc.server
        - connectrpc.compression.gzip
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/connectrpc/connect-python
  repository: https://github.com/connectrpc/connect-python
  documentation: https://connectrpc.com/docs/python/getting-started/
  summary: Server and client runtime library for Connect RPC
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
