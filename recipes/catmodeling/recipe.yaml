context:
  version: "0.0.1"
  python_min: "3.10"

package:
  name: catmodeling
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/catmodeling/catmodeling-${{ version }}.tar.gz
  sha256: 1f0b1023ce26f09f1b895822b0f68c23e42e0c1e6b9239e21b7e9a3ce18c6894

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - shapely
    - scipy

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - catmodeling
        - catmodeling.simulate
        - catmodeling.catxl
        - catmodeling.hours_clause
      pip_check: true

about:
  homepage: https://github.com/prthota98/catmodeling
  summary: 'Catastrophe risk modeling: simulate and adjust event/year loss tables, price catXL reinsurance layers, and apply hours clauses.'
  license: AGPL-3.0-or-later
  license_file: LICENSE
  repository: https://github.com/prthota98/catmodeling

extra:
  recipe-maintainers:
    - prthota98
