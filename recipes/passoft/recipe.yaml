context:
  version: "1.0.1"

package:
  name: passoft
  version: ${{ version }}

build:
  number: 0
  noarch: generic
  script: 'true'

requirements:
  host:
    - python >=3.12
  run:
    - __unix
    - python >=3.12
    - bline >=1.1.0
    - calday >=1.1.0
    - ckmseed >=1.1.0
    - coverplot >=1.1.0
    - data2passcal >=1.1.0
    - dataselect >=4.3.2
    - e2h >=1.1.0
    - fixhdr >=1.1.0
    - h2e >=1.1.0
    - julday >=1.1.0
    - lemi2seed >=1.1.0
    - lopt >=1.1.0
    - mseedpeek >=1.1.0
    - earthscope-msi >=4.3.0
    - nexus-passoft >=2.2.0
    - phoenix2seed >=1.1.0
    - refscrub >=1.1.0
    - rt2ms >=1.1.0
    - sohviewer >=1.1.0
    # Pending conda-forge review; uncomment once each is on conda-forge:
    #   stationxml-seed-converter: https://github.com/conda-forge/staged-recipes/pull/33852
    #   stationxml-validator:      https://github.com/conda-forge/staged-recipes/pull/33854
    # - stationxml-seed-converter >=2.1.3
    # - stationxml-validator >=1.7.5

tests:
  # A meta-package ships no files of its own, so check that every tool's
  # command is on PATH in the test environment (installed via run deps).
  - script:
      - command -v bline
      - command -v calday
      - command -v ckmseed
      - command -v coverplot
      - command -v data2passcal
      - command -v dataselect
      - command -v e2h
      - command -v fixhdr
      - command -v h2e
      - command -v julday
      - command -v lemi2seed
      - command -v lopt
      - command -v mseedpeek
      - command -v msi
      - command -v nexus
      - command -v phoenix2seed
      - command -v refscrub
      - command -v rt2ms
      - command -v sohviewer
      # Pending conda-forge review (see run requirements above):
      # - command -v stationxml-seed-converter
      # - command -v stationxml-validator

about:
  homepage: https://epic.earthscope.org/content/software-resources
  summary: PASSOFT software suite - meta-package that installs all PASSOFT tools
  description: |
    passoft is a meta-package that installs the full PASSOFT (PASSCAL Software)
    suite from EarthScope. Installing this package pulls in every individual
    PASSOFT tool (bline, calday, ckmseed, coverplot, data2passcal, dataselect,
    e2h, fixhdr, h2e, julday, lemi2seed, lopt, mseedpeek, earthscope-msi, nexus-passoft,
    phoenix2seed, refscrub, rt2ms, sohviewer) so users can install the whole
    suite with a single command.

    stationxml-seed-converter and stationxml-validator will be added once
    they are available on conda-forge.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://gitlab.com/earthscope/public/epic/passoft/passoft-feedstock

extra:
  recipe-maintainers:
    - omid-earthscope
