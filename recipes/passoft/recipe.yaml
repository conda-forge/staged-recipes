context:
  version: "1.0.0"

package:
  name: passoft
  version: ${{ version }}

build:
  number: 0
  noarch: generic
  script: 'true'

requirements:
  host:
    - python >=3.12
  run:
    - python >=3.12
    - bline >=1.1.0
    - calday >=1.1.0
    - ckmseed >=1.1.0
    - coverplot >=1.1.0
    - data2passcal >=1.1.0
    - dataselect
    - e2h >=1.1.0
    - fixhdr >=1.1.0
    - h2e >=1.1.0
    - julday >=1.1.0
    - lemi2seed >=1.1.0
    - lopt >=1.1.0
    - mseedpeek >=1.1.0
    - earthscope-msi
    - nexus-passoft >=2.2.0
    - phoenix2seed >=1.1.0
    - refscrub >=1.1.0
    - rt2ms >=1.1.0
    - sohviewer >=1.1.0
    # Pending conda-forge review; uncomment once each is on conda-forge:
    #   stationxml-seed-converter: https://github.com/conda-forge/staged-recipes/pull/33852
    #   stationxml-validator:      https://github.com/conda-forge/staged-recipes/pull/33854
    # - stationxml-seed-converter
    # - stationxml-validator

tests:
  - package_contents:
      bin:
        - bline
        - calday
        - ckmseed
        - coverplot
        - data2passcal
        - dataselect
        - e2h
        - fixhdr
        - h2e
        - julday
        - lemi2seed
        - lopt
        - mseedpeek
        - msi
        - nexus
        - phoenix2seed
        - refscrub
        - rt2ms
        - sohviewer
        # Pending conda-forge review (see run requirements above):
        # - stationxml-seed-converter
        # - stationxml-validator

about:
  homepage: https://epic.earthscope.org/content/software-resources
  summary: PASSOFT software suite - meta-package that installs all PASSOFT tools
  description: |
    passoft is a meta-package that installs the full PASSOFT (PASSCAL Software)
    suite from EarthScope. Installing this package pulls in every individual
    PASSOFT tool (bline, calday, ckmseed, coverplot, data2passcal, dataselect,
    e2h, fixhdr, h2e, julday, lemi2seed, lopt, mseedpeek, earthscope-msi, nexus-passoft,
    phoenix2seed, refscrub, rt2ms, sohviewer) so users can install the whole
    suite with a single command.

    stationxml-seed-converter and stationxml-validator will be added once
    they are available on conda-forge.
  license: GPL-3.0-or-later
  repository: https://gitlab.com/earthscope/public/epic/passoft/passoft-feedstock

extra:
  recipe-maintainers:
    - omid-earthscope
