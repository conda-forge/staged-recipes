context:
  version: "1.0.0"

package:
  name: passoft
  version: ${{ version }}

build:
  number: 0
  noarch: generic
  script: 'true'

requirements:
  host:
    - python >=3.9
  run:
    - python >=3.9
    - bline ==${{ version }}
    - calday ==${{ version }}
    - ckmseed ==${{ version }}
    - coverplot ==${{ version }}
    - data2passcal ==${{ version }}
    - dataselect
    - e2h ==${{ version }}
    - fixhdr ==${{ version }}
    - h2e ==${{ version }}
    - julday ==${{ version }}
    - lemi2seed ==${{ version }}
    - lopt ==${{ version }}
    - mseedpeek ==${{ version }}
    - earthscope-msi
    - nexus-passoft ==${{ version }}
    - phoenix2seed ==${{ version }}
    - refscrub ==${{ version }}
    - rt2ms ==${{ version }}
    - sohviewer ==${{ version }}
    - stationxml-seed-converter
    - stationxml-validator

tests:
  - package_contents:
      bin:
        - bline
        - calday
        - ckmseed
        - coverplot
        - data2passcal
        - dataselect
        - e2h
        - fixhdr
        - h2e
        - julday
        - lemi2seed
        - lopt
        - mseedpeek
        - msi
        - nexus
        - phoenix2seed
        - refscrub
        - rt2ms
        - sohviewer
        - stationxml-seed-converter
        - stationxml-validator

about:
  homepage: https://epic.earthscope.org/content/software-resources
  summary: PASSOFT software suite - meta-package that installs all PASSOFT tools
  description: |
    passoft is a meta-package that installs the full PASSOFT (PASSCAL Software)
    suite from EarthScope. Installing this package pulls in every individual
    PASSOFT tool (bline, calday, ckmseed, coverplot, data2passcal, dataselect,
    e2h, fixhdr, h2e, julday, lemi2seed, lopt, mseedpeek, earthscope-msi, nexus-passoft,
    phoenix2seed, refscrub, rt2ms, sohviewer, stationxml-seed-converter,
    stationxml-validator) so users can install the whole suite with a single
    command.
  license: GPL-3.0-or-later
  repository: https://gitlab.com/earthscope/public/epic/passoft/passoft-feedstock

extra:
  recipe-maintainers:
    - omid-earthscope
