context:
  version: "0.4.4"

package:
  name: sangfor-scp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sangfor-scp/sangfor_scp-${{ version }}.tar.gz
  sha256: a0aab270da8ac4376c3f89e77e7ce8b781be03bb27ab0bf7c0bdf4ab3d38af07

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - scp-health = sangfor_scp.cli:health_main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - requests >=2.28.0
    - urllib3 >=1.26.0
  run_constraints:
    - pycryptodome >=3.17

tests:
  - python:
      imports:
        - sangfor_scp
        - sangfor_scp.health
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - pycryptodome
    script:
      # 0.4.4 on Windows: test_render_and_csv splits paths on "/" and the CLI
      # needs a UTF-8 console; both fixed upstream for the next release.
      - if: win
        then:
          - pytest -q tests -k "not test_render_and_csv"
          - set PYTHONUTF8=1
          - scp-health --help
        else:
          - pytest -q tests
          - scp-health --help

about:
  homepage: https://github.com/erelbi/sangfor-scp
  repository: https://github.com/erelbi/sangfor-scp
  documentation: https://github.com/erelbi/sangfor-scp#readme
  summary: Python client for the Sangfor Cloud Platform (SCP) Open-API
  description: |
    sangfor-scp is a Python client library for the Sangfor Cloud Platform (SCP)
    Open-API. It covers virtual machines (create, clone, migrate, power,
    console), networks, images, volumes, elastic IPs, tasks, alarms and
    monitoring metrics, with EC2 (AWS4-HMAC-SHA256) and token authentication,
    automatic pagination and async task polling. It also ships the scp-health
    command, a read-only platform health report.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - erelbi
