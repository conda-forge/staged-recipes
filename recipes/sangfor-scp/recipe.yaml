context:
  version: "0.4.5"

package:
  name: sangfor-scp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sangfor-scp/sangfor_scp-${{ version }}.tar.gz
  sha256: 58cc471930d3513ae16272679c5d6422845f1adab5dd70336daeaad0750dcef8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - scp-health = sangfor_scp.cli:health_main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - requests >=2.28.0
    - urllib3 >=1.26.0
  run_constraints:
    - pycryptodome >=3.17

tests:
  - python:
      imports:
        - sangfor_scp
        - sangfor_scp.health
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - pycryptodome
    script:
      - pytest -q tests
      - scp-health --help

about:
  homepage: https://github.com/erelbi/sangfor-scp
  repository: https://github.com/erelbi/sangfor-scp
  documentation: https://github.com/erelbi/sangfor-scp#readme
  summary: Python client for the Sangfor Cloud Platform (SCP) Open-API
  description: |
    sangfor-scp is a Python client library for the Sangfor Cloud Platform (SCP)
    Open-API. It covers virtual machines (create, clone, migrate, power,
    console), networks, images, volumes, elastic IPs, tasks, alarms and
    monitoring metrics, with EC2 (AWS4-HMAC-SHA256) and token authentication,
    automatic pagination and async task polling. It also ships the scp-health
    command, a read-only platform health report.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - erelbi
