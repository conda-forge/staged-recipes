context:
  version: 27.0.0

package:
  name: tsgettoolbox-modis
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-modis/tsgettoolbox_modis-${{ version }}.tar.gz
  sha256: dabde7bfbfce2d356ad29bbf424f7309e179bcdf336174a94b52c7bdf01f9a02

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - aiodns >3.6.0
  - async_retriever
  - numpy
  - pandas
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
      - tsgettoolbox_modis
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: Plugin for tsgettolbox to retrieve MODIS data from the LP DAAC Data Pool.
  description: |
    The 'tsgettoolbox_modis' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    MODIS.
  homepage: https://pypi.org/project/tsgettoolbox-modis/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
