context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-modis
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-modis/tsgettoolbox_modis-${{ version }}.tar.gz
  sha256: dabde7bfbfce2d356ad29bbf424f7309e179bcdf336174a94b52c7bdf01f9a02

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools>=80
  - pip
  run:
  - python >=3.10
  - aiodns >3.6.0
  - async_retriever
  - numpy
  - pandas
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_modis
    pip_check: true

about:
  summary: Plugin for tsgettoolbox to retrieve MODIS data from the LP DAAC Data Pool.
  description: |
