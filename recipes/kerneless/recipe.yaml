context:
  name: kerneless
  version: "1.0.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/DOI-USGS/kerneless/archive/refs/tags/${{ version }}.tar.gz
    sha256: a68b0e2f506cd81e8e27f27be1e3d49301bdf15a7bb83d6582d9f38b749b40c5
  # The leap seconds kernel the SPICE comparison tests load. It is not in the
  # repository, and the tests would otherwise download it at test time.
  - url: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
    sha256: 678e32bdb5a744117a467cd9601cd6b373f0e9bc9bbde1371d5eee39600a039b
    target_directory: tests

build:
  number: 0
  # setup.py installs the headers to <prefix>/include/kerneless/ via data_files.
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - pybind11
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=45
    - wheel
    - pybind11 >=2.6.0
  run:
    - python

tests:
  - python:
      imports:
        - kerneless
      pip_check: true

  # The headers land in the include prefix, and only there.
  - script:
      - if: unix
        then:
          - test -f $PREFIX/include/kerneless/utcet.h
          - test -f $PREFIX/include/kerneless/dsk_reader.h
          - test ! -e $SP_DIR/include
        else:
          - if not exist %PREFIX%\include\kerneless\utcet.h exit 1
          - if not exist %PREFIX%\include\kerneless\dsk_reader.h exit 1
          - if exist %SP_DIR%\include exit 1

  # The installed headers are usable with no build system: dsk_reader.h as C99,
  # and both headers as C++11 linked across two translation units.
  - files:
      source:
        - tests/smoke/
    requirements:
      run:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    script:
      - if: unix
        then:
          - $CC -std=c99 -Wall -Wextra -I$PREFIX/include tests/smoke/smoke.c -o smoke_c
          - ./smoke_c
          - $CXX -std=c++11 -Wall -Wextra -I$PREFIX/include -DKERNELESS_SMOKE_MAIN -c tests/smoke/smoke.cpp -o smoke_main.o
          - $CXX -std=c++11 -Wall -Wextra -I$PREFIX/include -c tests/smoke/smoke.cpp -o smoke_other.o
          - $CXX smoke_main.o smoke_other.o -o smoke_cxx
          - ./smoke_cxx

  # The upstream suite, checked against NAIF SPICE.
  - files:
      source:
        - tests/
    requirements:
      run:
        - pytest
        - spiceypy >=5.0.0
    script:
      - python -c "import spiceypy"
      - pytest tests -v

about:
  homepage: https://github.com/DOI-USGS/kerneless
  repository: https://github.com/DOI-USGS/kerneless
  summary: SPICE-compatible time conversion and DSK reading with no SPICE kernels or toolkit
  description: |
    kerneless provides header-only C/C++ implementations of SPICE-compatible
    UTC/ET time conversion (kerneless/utcet.h) and DSK type-2 reading
    (kerneless/dsk_reader.h), plus Python bindings. The headers are installed
    to <prefix>/include/kerneless/ for C and C++ consumers.
  license: CC0-1.0
  license_file:
    - LICENSE.md
    - DISCLAIMER.md

extra:
  recipe-maintainers:
    - Kelvinrr
