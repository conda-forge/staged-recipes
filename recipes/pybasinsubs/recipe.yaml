context:
  name: pybasinsubs
  version: "0.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d1e0d8112ec65133e1e5a7c942b09e8a12268c48e3988273ff84c29d10adf89f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pybasinsubs-ui = pybasinsubs.cli:ui
      - pybasinsubs-tracer = pybasinsubs.cli:tracer

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - pandas
    - matplotlib-base
    - openpyxl
    - scikit-image
    - panel
    - bokeh
    - ipywidgets
    - streamlit

tests:
  - python:
      imports:
        - pybasinsubs
        - pybasinsubs.backstrip
        - pybasinsubs.flexure
        - pybasinsubs.thermal
        - pybasinsubs.paleobathy
        - pybasinsubs.faults
        - pybasinsubs.plotting
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "A sedimentary basin analysis toolkit: decompaction, backstripping, paleowater depth, fault restoration and thermal maturity"
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/GeoLarryLai/pyBasinSubs
  repository: https://github.com/GeoLarryLai/pyBasinSubs

extra:
  recipe-maintainers:
    - GeoLarryLai
