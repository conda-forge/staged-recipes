context:
  name: pybasinsubs
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8f445dca41375af0d533f4b85dcdbda0d9f2c61c2f84b2ffd529d38762a19da8
  patches:
    # streamlit-drawable-canvas is not on conda-forge; the conda build has no
    # mouse drawing in the Streamlit tracer (the Panel tracer is unaffected)
    - drop-streamlit-drawable-canvas.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pybasinsubs-ui = pybasinsubs.cli:ui
      - pybasinsubs-tracer = pybasinsubs.cli:tracer

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - pandas
    - matplotlib-base
    - openpyxl
    - scikit-image
    - panel
    - bokeh
    - ipywidgets
    - streamlit

tests:
  - python:
      imports:
        - pybasinsubs
        - pybasinsubs.backstrip
        - pybasinsubs.flexure
        - pybasinsubs.thermal
        - pybasinsubs.paleobathy
        - pybasinsubs.faults
        - pybasinsubs.plotting
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "A sedimentary basin analysis toolkit: decompaction, backstripping, paleowater depth, fault restoration and thermal maturity"
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://geolarrylai.com/projects/pyBasinSubs/
  repository: https://github.com/GeoLarryLai/pyBasinSubs

extra:
  recipe-maintainers:
    - GeoLarryLai
