context:
  name: pybasinsubs
  version: "0.3.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 6be13c52f6092e6c8c3c8c74e66577c6bc79b34500ce1880a8f2de805a9256de

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pybasinsubs-app = pybasinsubs.webapp:main
      - pybasinsubs-ui = pybasinsubs.webapp:main
      - pybasinsubs-tracer = pybasinsubs.webapp:tracer

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - pandas
    - matplotlib-base
    - openpyxl
    - scikit-image
    - fastapi >=0.110
    - uvicorn >=0.27

tests:
  - python:
      imports:
        - pybasinsubs
        - pybasinsubs.backstrip
        - pybasinsubs.flexure
        - pybasinsubs.thermal
        - pybasinsubs.paleobathy
        - pybasinsubs.faults
        - pybasinsubs.plotting
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "A sedimentary basin analysis toolkit: decompaction, backstripping, paleowater depth, fault restoration and thermal maturity"
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/GeoLarryLai/pyBasinSubs
  repository: https://github.com/GeoLarryLai/pyBasinSubs

extra:
  recipe-maintainers:
    - GeoLarryLai
