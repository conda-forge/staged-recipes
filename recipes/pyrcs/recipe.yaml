schema_version: 1

context:
  version: "1.2.1"
  python_min: "3.12"

package:
  name: pyrcs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyrcs/pyrcs-${{ version }}.tar.gz
  sha256: e6ff05c228a5e8f543581259f0e7ea52003aab206e053697f34db40db6d4e4ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pyhelpers >=2.5.0,<2.6.dev0
    - beautifulsoup4
    - requests
    - pandas

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pyrcs
      pip_check: true

about:
  summary: An open-source tool for collecting railway codes used in different UK rail industry systems.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mikeqfu/pyrcs
  documentation: https://pyrcs.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - mikeqfu
