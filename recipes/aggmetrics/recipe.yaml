context:
  version: "0.2.0"

package:
  name: aggmetrics
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aggmetrics/aggmetrics-${{ version }}.tar.gz
  sha256: 8f8186c9205ea7f208ad5cfbf39b11bed8aa34cee2f6ff0f0aa1c35140954963

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.20

tests:
  - python:
      imports:
        - aggmetrics
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "import aggmetrics; assert aggmetrics.__version__ == '${{ version }}'"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/rcprati/aggmetrics
  summary: Aggregating classification performance measures for machine learning
  description: |
    aggmetrics extends any binary performance measure expressed in the four
    confusion-matrix counts to multiclass, multilabel, ordinal, cost-sensitive,
    soft-label and cross-validation settings by substituting one of four
    aggregation operators for the usual `average` switch. It stores the
    structural properties of each measure, can infer them from a user-supplied
    formula, and warns when a measure is used where it does not behave as
    commonly assumed. It depends only on NumPy.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://aggmetrics.readthedocs.io
  repository: https://github.com/rcprati/aggmetrics

extra:
  recipe-maintainers:
    - rcprati
