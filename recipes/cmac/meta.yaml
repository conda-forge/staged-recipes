{% set version = "0.1.0" %}

package:
  name: cmac
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/c/cmac/cmac-{{ version }}.tar.gz
  sha256: 3c2060eb3a246f053c588db528df755d97b3eeff1d58b89c74537baa08141bfb

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
  host:
    - python
    - setuptools >=45
    - wheel
    - cython
    - numpy >=2.0  # [py>=39]
    - pip
  run:
    - python
    - {{ pin_compatible('numpy') }}

test:
  imports:
    - cmac
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/EVS-ATMOS/cmac2.0
  summary: Corrected Moments in Antenna Coordinates
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rcjackson
    - zssherman
