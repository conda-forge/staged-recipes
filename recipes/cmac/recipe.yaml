schema_version: 1

context:
  version: 0.1.0

package:
  name: cmac
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cmac/cmac-${{ version }}.tar.gz
  sha256: 3c2060eb3a246f053c588db528df755d97b3eeff1d58b89c74537baa08141bfb

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools >=45
    - wheel
    - cython
    - pip
    - xarray
    - arm_pyart
    - scikit-fuzzy
    - wradlib
    - s3fs >=2021.11.0
  run:
    - python
    - ${{ pin_compatible('numpy') }}
    - scipy
    - matplotlib-base
    - cartopy
    - cmweather
    - netcdf4
    - distributed
    - xarray
    - arm_pyart
    - scikit-fuzzy
    - wradlib
    - s3fs >=2021.11.0

tests:
  - python:
      imports:
        - cmac
  - requirements:
      run:
        - pip
        - python
        - xarray
        - scikit-fuzzy
        - arm_pyart
        - cython
        - wradlib
        - scipy
        - matplotlib-base
        - cartopy
        - cmweather
        - netcdf4
        - distributed
        - s3fs >=2021.11.0
    script:
      - pip check

about:
  summary: Corrected Moments in Antenna Coordinates
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/EVS-ATMOS/cmac2.0

extra:
  recipe-maintainers:
    - rcjackson
    - zssherman
