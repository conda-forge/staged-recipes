schema_version: 1

context:
  version: "0.1019.0"
  python_min: "3.10"

package:
  name: nominal-api
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/n/nominal-api/nominal_api-${{ version }}.tar.gz
    sha256: 22966f0ed9b9de3246e2fa6ae3615fdee4a26dc5a63409c9dfa6253e99f90a02
  - url: https://raw.githubusercontent.com/nominal-io/nominal-client/v1.99.0/LICENSE
    sha256: cc41871bd9a30e36884b723bf4ef26c1e428fb28936eac7c8c9bd43e9a550309
    file_name: LICENSE

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - conjure-python-client >=2.8.0,<4
    - requests

tests:
  - python:
      imports:
        - nominal_api
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Generated Python client for the Nominal API
  license: MIT
  license_file: LICENSE
  homepage: https://nominal.io
  repository: https://github.com/nominal-io/nominal-client

extra:
  recipe-maintainers:
    - wolfv
