context:
  version: "0.1.3"

package:
  name: rtxui
  version: ${{ version }}

source:
  url: https://github.com/ArthurSonzogni/RTXUI/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b9fdef7b50c8c70a74451e46d0a1a120d93a0badf6817e87ba33a5a72804cba4

build:
  number: 0
  script:
    - if: win
      then:
        - cmake -S . -B build -G Ninja %CMAKE_ARGS% -DBUILD_SHARED_LIBS=ON -DRTXUI_BUILD_TESTS=OFF -DRTXUI_BUILD_EXAMPLES=OFF
        - cmake --build build
        - cmake --install build
      else:
        # conda-forge ships a libc++ newer than macOS's: the C++ features
        # Clang marks unavailable on old macOS (floating-point
        # std::from_chars) are there. Without effect on Linux.
        - export CXXFLAGS="${CXXFLAGS} -D_LIBCPP_DISABLE_AVAILABILITY"
        - cmake -S . -B build -G Ninja ${CMAKE_ARGS} -DBUILD_SHARED_LIBS=ON -DRTXUI_BUILD_TESTS=OFF -DRTXUI_BUILD_EXAMPLES=OFF
        - cmake --build build
        - cmake --install build

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja

tests:
  - package_contents:
      include:
        - rtxui/rtxui.hpp
      files:
        - if: unix
          then: lib/cmake/rtxui/rtxui-config.cmake
          else: Library/lib/cmake/rtxui/rtxui-config.cmake
  - files:
      recipe:
        - test/
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
    script:
      - if: win
        then:
          - cmake -S test -B test/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%LIBRARY_PREFIX%
          - cmake --build test/build
          - test\build\app.exe
        else:
          # RTXUI's headers use std::from_chars too.
          - cmake -S test -B test/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${PREFIX} -DCMAKE_CXX_FLAGS=-D_LIBCPP_DISABLE_AVAILABILITY
          - cmake --build test/build
          - ./test/build/app

about:
  homepage: https://github.com/ArthurSonzogni/RTXUI
  repository: https://github.com/ArthurSonzogni/RTXUI
  documentation: https://arthursonzogni.github.io/RTXUI/
  summary: C++ terminal user interfaces built from HTML templates, CSS and reactive state
  description: |
    RTXUI builds terminal user interfaces the way a browser builds pages:
    components declare HTML templates, style them with CSS (flexbox, grid,
    transitions) and bind C++ members into them.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ArthurSonzogni
