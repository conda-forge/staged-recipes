schema_version: 1

context:
  version: "0.1.2"
  python_min: "3.10"

package:
  name: cht-tide
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/cht-tide/cht_tide-${{ version }}.tar.gz
  sha256: bca2233aa5ee2a310a79cbb9e3ad2cc03af577d6fbb48db46b42b41071edba5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - toml
    - pandas
    - geopandas
    - boto3
    - botocore
    - pyproj
    - shapely
    - xarray

tests:
  - python:
      imports:
        - cht_tide
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Combining tidal components into time series
  description: |-
    CHT Tide fits tidal harmonic constituents to observed water levels and
    predicts water levels from known constituents. It also provides access to
    gridded tide models and station databases; those datasets are distributed
    separately from the package.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Deltares/cht_tide
  repository: https://github.com/Deltares/cht_tide

extra:
  recipe-maintainers:
    - roeldegoede