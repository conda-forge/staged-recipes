schema_version: 1

context:
  version: "0.2.0"

package:
  name: qbiocode
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/q/qbiocode/qbiocode-${{ version }}.tar.gz
  sha256: 29b69270eabc1ac94f24def95ad1d062b84be6c3249488d375b6fbe8f472d87a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - qprofiler = qbiocode.apps.qprofiler.cli:main
      - qprofiler-batch = qbiocode.apps.qprofiler.qprofiler_batchmode:main
      - qsage = qbiocode.apps.sage.sage:main
      - quvine = qbiocode.apps.quvine.cli:main

requirements:
  host:
    - python >=3.10,<3.13
    - pip
    - setuptools
  run:
    - python >=3.10,<3.13
    # Core dependencies
    - dill
    - h5py
    - hfda
    - hydra-core
    - ipykernel
    - joblib
    - matplotlib-base
    - networkx
    - numpy
    - optuna
    - pandas
    - pyyaml
    # Qiskit ecosystem
    - qiskit ==2.2.0
    - qiskit-aer ==0.17.0
    - qiskit-algorithms ==0.4.0
    - qiskit-ibm-runtime ==0.44.0
    - qiskit-ibm-transpiler ==0.11.0
    - qiskit-machine-learning ==0.9.0
    - qiskit-nature ==0.7.2
    # ML and data science
    - scikit-dimension
    - scikit-learn
    - scipy
    - seaborn
    - pytorch
    - tqdm
    - umap-learn
    - xgboost
    # Single-cell / multi-omics
    - scanpy
    - anndata
    - leidenalg
    - igraph

tests:
  - python:
      imports:
        - qbiocode
        - qbiocode.data_generation
        - qbiocode.embeddings
        - qbiocode.evaluation
        - qbiocode.learning
        - qbiocode.utils
        - qbiocode.visualization
        - qbiocode.apps.qprofiler
        - qbiocode.apps.sage
      pip_check: false
  - script:
      - qprofiler --help
      - qprofiler-batch --help
      - qsage --help
      - quvine --help

about:
  homepage: https://github.com/qiskit-community/QBioCode
  license: Apache-2.0
  license_file: LICENSE
  summary: Quantum machine learning applications for healthcare and life sciences
  description: |
    QBioCode provides a comprehensive suite of computational resources for quantum
    machine learning applications in healthcare and life science data analysis.
    It includes tools for benchmarking quantum and classical ML models, analyzing
    data complexity, and making informed model selection decisions.

    Key Features:
    - QProfiler: Automated ML benchmarking with data complexity analysis
    - QSage: Meta-learning tool for intelligent model selection
    - QuVINE: Quantum View-based Network Embeddings for graph data
    - Data Generation: Create artificial datasets with controlled complexity
    - Quantum ML Support: QSVC, PQK, VQC, QNN implementations
    - Classical ML Baselines: RF, SVM, LR, DT, NB, MLP, XGBoost
  documentation: https://qiskit-community.github.io/QBioCode/
  repository: https://github.com/qiskit-community/QBioCode

extra:
  recipe-maintainers:
    - futro
