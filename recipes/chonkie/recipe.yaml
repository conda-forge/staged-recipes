# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.0"

package:
  name: chonkie
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/chonkie/chonkie-${{ version }}.tar.gz
  sha256: 4352aa214b66376c32523e524b94b7f1456a5e7611c48037dadb45e46f436b18

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - tqdm >=4.64.0
    - numpy >=2.0.0
    - chonkie-core >=0.10.2
    - tenacity >=8.0.0
    - httpx >=0.28.1
    - tokie >=0.0.10

tests:
  - python:
      imports:
        - chonkie
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: 🦛 CHONK your texts with Chonkie ✨ - The no-nonsense chunking library
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/feyninc/chonkie
  repository: https://github.com/feyninc/chonkie
  documentation: https://docs.chonkie.ai/common/welcome

extra:
  recipe-maintainers:
    - pb01ka
