{% set name = "vecstore" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/PhilipJohnBasile/vecstore/archive/1868a6273174f58856af25ba6c45eb057d3bbfd0.tar.gz
  sha256: 09b19547e24e93ca1fe704485df1c4fa25464de635d617bae9eb7e4310596721

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses
    - pkg-config
    - libprotobuf

test:
  commands:
    - vecstore-server --help

about:
  home: https://github.com/PhilipJohnBasile/vecstore
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Embeddable vector database with HNSW search and RAG tooling
  description: |
    VecStore is an embeddable Rust vector database with HNSW indexing,
    metadata filtering, hybrid search, snapshots, and an optional HTTP/gRPC
    server. This recipe builds the server feature from the immutable source
    commit corresponding to the repository's current 0.1.0 package version.
  doc_url: https://docs.rs/vecstore
  dev_url: https://github.com/PhilipJohnBasile/vecstore

extra:
  recipe-maintainers:
    - PhilipJohnBasile
