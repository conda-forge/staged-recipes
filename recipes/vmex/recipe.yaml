schema_version: 1

context:
  version: "0.4.0"

package:
  name: vmex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vmex/vmex-${{ version }}.tar.gz
  sha256: af29c0d708634ac87e8654dcfb0f96831bc401feed045c3fb434b39f71e68510

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - vmex = vmex.core.cli:main
      - vmec = vmex.core.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
    - packaging
  run:
    - python >=${{ python_min }}
    - numpy
    - jax
    - jaxlib
    - scipy
    - netcdf4
    - matplotlib-base
    - booz-xform-jax
    - solvax >=0.8.8
    - packaging
    # python < 3.11
    - tomli

tests:
  - python:
      imports:
        - vmex
        # deprecation shim kept by upstream for the vmec_jax -> vmex rename
        - vmec_jax
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - vmex --help
      - vmec --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: JAX implementation of VMEC2000 with differentiable fixed-boundary and branch-local free-boundary research paths
  license: MIT
  license_file: LICENSE
  homepage: https://vmex.readthedocs.io/
  repository: https://github.com/uwplasma/vmex
  documentation: https://vmex.readthedocs.io/

extra:
  recipe-maintainers:
    - matthewfeickert
    - RKHashmani
