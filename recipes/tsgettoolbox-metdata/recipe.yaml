    tsgettoolbox_metdata - Quick Guide
    ==================================
    The 'tsgettoolbox_metdata' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get daily time-series data from
    the gridded Metdata product.  The tsgettoolbox_metdata will work with Python
    3.10+.

    Documentation
    -------------
    Reference documentation is at `tsgettoolbox METDATA API`_.

    Installation
    ------------
    At the command line::

        $ pip install tsgettoolbox_metdata

        OR

        $ conda install -c conda-forge tsgettoolbox_metdata

    Usage Summary - Command Line
    ----------------------------
    Just run 'tsgettoolbox --help' to get a list of subcommands.  To get detailed
    help for a particular sub-command, for instance 'metdata', type 'tsgettoolbox
    metdata --help'.

    +-------------+----------+--------+---------+----------+-----------------------+
    | Sub-command | Spatial  | Time   | Type    | Time     | Description           |
    |             | Extent   | Extent |         | Interval |                       |
    +=============+==========+========+=========+==========+=======================+
    | metdata     | NAmerica | 1980-  | grid    | D        | Daily data from       |
    |             |          |        | 4km     |          | METDATA based on      |
    |             |          |        |         |          | PRISM.                |
    +-------------+----------+--------+---------+----------+-----------------------+

    +-------------------+-------------+
    | Time Interval     | Description |
    | Code              |             |
    +===================+=============+
    | D                 | Daily       |
    +-------------------+-------------+

    Usage Summary - Python Library
    ------------------------------
    To use the tsgettoolbox in a project::

        from tsgettoolbox import tsgettoolbox
        df = tsgettoolbox.metdata(29.6, -82.3, variables="pr")
        print(df.head())

    Refer to the API Documentation at `tsgettoolbox METDATA API`_.

    Usage Summary - Command Line
    ----------------------------

        tsgettoolbox metdata 29.6 -82.3 --variables pr > output.csv

    Refer to the command line documentation at `tsgettoolbox METDATA CLI`_.

