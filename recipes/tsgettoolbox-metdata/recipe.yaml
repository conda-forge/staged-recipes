context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-metdata
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-metdata/tsgettoolbox_metdata-${{ version }}.tar.gz
  sha256: 9badd2cd0d3ca8ba7b9f635a637e63a30ae593445ba9efc61ab6cee1183ca924

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools>=80
  - pip
  run:
  - python >=3.10
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_metdata
    pip_check: true

about:
  summary: Plugin for tsgettoolbox to retrieve time series data from Metdata.
  description: |
