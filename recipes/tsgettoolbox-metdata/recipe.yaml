context:
  version: 27.0.0

package:
  name: tsgettoolbox-metdata
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-metdata/tsgettoolbox_metdata-${{ version }}.tar.gz
  sha256: 9badd2cd0d3ca8ba7b9f635a637e63a30ae593445ba9efc61ab6cee1183ca924

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_metdata
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: Plugin for tsgettoolbox to retrieve time series data from Metdata.
  description: |
    The 'tsgettoolbox_metdata' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get daily time-series data from
    the gridded Metdata product.
  homepage: https://pypi.org/project/tsgettoolbox-metdata/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
