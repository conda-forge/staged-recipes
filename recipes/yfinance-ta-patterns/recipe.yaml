context:
  name: yfinance-ta-patterns
  version: "0.3.35"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yfinance-ta-patterns/yfinance_ta_patterns-${{ version }}.tar.gz
  sha256: 755ba32285a37496880e7ea9567d4207d76b8c83ea5d356a94e97845869d800d

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - pandas >=1.3.0
    - numpy >=1.20
    - pytz >=2022.5
    - rich >=10.0.0
    - yfinance >=0.2.50

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - yfinance_ta_patterns
      pip_check: true
  - script:
      - python -m yfinance_ta_patterns.cli --help

about:
  homepage: https://github.com/eminsk/yfinance-ta-patterns
  summary: Institutional-grade market candlestick pattern scanner with multi-asset backtesting and AI confluence scoring
  description: |
    Institutional-grade market candlestick pattern scanner with multi-asset
    backtesting, AI confluence scoring, and LLM market intelligence.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/yfinance-ta-patterns
  documentation: https://github.com/eminsk/yfinance-ta-patterns#readme

extra:
  recipe-maintainers:
    - eminsk
