schema_version: 1

context:
  version: "1.13.0"

package:
  name: manuel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/manuel/manuel-${{ version }}.tar.gz
  sha256: 5d63120de8fa6d927780b69ae28aa3e9d1669b10af3d32785f3fba11a5be885a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - manuel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python
        - zope.testing
    script:
      - python -m unittest -v -b manuel.tests.test_suite

about:
  summary: Manuel lets you build tested documentation.
  license: Apache-2.0
  license_file:
    - LICENSE.rst
    - COPYRIGHT.rst
  homepage: http://pypi.python.org/pypi/manuel
  documentation: https://pythonhosted.org/manuel/
  repository: https://github.com/benji-york/manuel/

extra:
  recipe-maintainers:
    - mgorny
