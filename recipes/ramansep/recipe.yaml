schema_version: 1

context:
  version: "0.17.0"

package:
  name: ramansep
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/ramansep/ramansep-${{ version }}.tar.gz
  sha256: a670df70340d26f8f87f68abb533074e9b66656c4354717a6be4adda961423b1

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.8

tests:
  - python:
      imports:
        - ramansep
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/ramansep
  license: Apache-2.0
  license_file: LICENSE
  summary: "Separate strain from carrier density in 2D-material Raman maps using two Raman peaks"
  description: |
    A Raman peak moves both when a 2D material is stretched and when charge
    is added. Two peaks that respond differently can tell the two apart:
    ramansep solves the two equations at every pixel of a map and returns a
    strain map and a charge-density map, each with an error bar. It also
    reads instrument text exports, fits peak positions, picks the pair of
    peaks that separates the two causes best, checks with three or more
    peaks whether strain plus charge explains the data, and helps measure
    the response coefficients on your own instrument.
  repository: https://github.com/TaN-MM-Org/ramansep
  documentation: https://github.com/TaN-MM-Org/ramansep#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
