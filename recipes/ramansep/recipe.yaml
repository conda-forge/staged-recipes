schema_version: 1

context:
  version: "0.15.0"

package:
  name: ramansep
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/ramansep/ramansep-${{ version }}.tar.gz
  sha256: 12a62af085878f2e9a14be1062f0d6d8ba8903d731c1592632a367b2e999e07e

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.8

tests:
  - python:
      imports:
        - ramansep
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/ramansep
  license: Apache-2.0
  license_file: LICENSE
  summary: "Separate strain from carrier density in 2D-material Raman maps by two-mode inversion"
  description: |
    Two-mode inversion of Raman peak shifts into separate strain and
    carrier-density maps with honest error bars, including first-order
    propagation of calibration-coefficient uncertainty, published cited
    coefficient sets for MoS2 and graphene, and residual-based
    self-consistency flags.
  repository: https://github.com/TaN-MM-Org/ramansep
  documentation: https://github.com/TaN-MM-Org/ramansep#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
