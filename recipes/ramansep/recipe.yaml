schema_version: 1

context:
  version: "0.11.0"

package:
  name: ramansep
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/ramansep/ramansep-${{ version }}.tar.gz
  sha256: 9b417d2378d678aa69643f6466f9dc6e570426589c805ade499a96246e06e9a2

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.8

tests:
  - python:
      imports:
        - ramansep
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/ramansep
  license: Apache-2.0
  license_file: LICENSE
  summary: "Separate strain from carrier density in 2D-material Raman maps by two-mode inversion"
  description: |
    Two-mode inversion of Raman peak shifts into separate strain and
    carrier-density maps with honest error bars, including exact
    propagation of calibration-coefficient uncertainty, published cited
    coefficient sets for MoS2 and graphene, and residual-based
    self-consistency flags.
  repository: https://github.com/TaN-MM-Org/ramansep
  documentation: https://github.com/TaN-MM-Org/ramansep#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
