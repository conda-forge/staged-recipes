schema_version: 1

context:
  name: smf-solver
  version: "0.2.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/danlil240/opt_solver/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ca6fce663cd96e2a7e6458696085a66949e51735c61fa0fb9ef378bddccec72c

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.20
    - ninja
    - pkgconf
  host:
    - blas-devel
    - libblas
    - liblapack
    - libcblas
    # Only AMD (BSD-3-Clause) is linked; not the full `suitesparse`
    # metapackage, which also pulls in the GPL/LGPL components.
    - libamd
    - if: linux
      then: libgomp
      else: llvm-openmp
  run_exports:
    - ${{ pin_subpackage('smf-solver', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - smf/smf_c.h
      lib:
        - smf_c
        - smf_ma97
  - files:
      recipe:
        - test/
    requirements:
      run:
        - ${{ compiler('c') }}
        - cmake >=3.20
        - ninja
    script:
      - cmake -S test -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build build
      - ctest --test-dir build --output-on-failure
  - if: unix
    then:
      script:
        - pkg-config --exists --exact-version=${{ version }} smf-solver
      requirements:
        run:
          - pkgconf

about:
  homepage: https://github.com/danlil240/opt_solver
  repository: https://github.com/danlil240/opt_solver
  license: MIT AND Apache-2.0
  license_file:
    - LICENSE
    - solver/third_party/LICENSE-Apache-2.0.txt
    - solver/third_party/README.md
    - solver/third_party/metis/LICENSE
    - solver/third_party/gklib/LICENSE.txt
  summary: Sparse symmetric multifrontal direct linear solver (Cholesky / LDL^T) for IPOPT and KKT systems
  description: |
    smf is a C++20 sparse symmetric multifrontal direct solver designed for
    interior-point optimizers (IPOPT, CasADi, cyipopt, JuMP/MadNLP). It ships
    a versioned C ABI (libsmf_c, pkg-config smf-solver) for native
    linear_solver=smf integration as well as a drop-in HSL MA97 plugin
    (libsmf_ma97).

extra:
  recipe-maintainers:
    - danlil240
