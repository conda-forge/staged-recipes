context:
  version: "1.1.0"

package:
  name: npap
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/npap/npap-${{ version }}.tar.gz
  sha256: 1dd9099175b5fe894b65a2c6dc422f1b7599c9895b8100b0d0c7e0c208a3d9a4

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools >=61
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - hdbscan >=0.8.41
    - kmedoids >=0.5.4
    - networkx >=3.0
    - numpy >=1.24
    - pandas >=2.0
    - plotly >=5.24
    - scikit-learn >=1.3
    - scipy >=1.10

tests:
  - python:
      imports:
        - npap
        - npap.aggregation
        - npap.datasets
        - npap.input
        - npap.partitioning
        - npap.visualization
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/IEE-TUGraz/NPAP
  summary: Network Partitioning & Aggregation Package for Python
  description: |
    NPAP is an open-source Python library for partitioning and aggregating
    network graphs, with a focus on electrical power systems. Built on top of
    NetworkX, it provides a strategy-based architecture for reducing the
    spatial complexity of networks while preserving their essential physical
    properties.

    It offers geographical, electrical-distance and voltage-aware partitioning
    strategies, a three-tier aggregation pipeline (topology, physical and
    statistical), and interactive Plotly-based visualization. Every stage is
    pluggable through documented strategy interfaces, so custom loaders,
    partitioners and aggregation rules can be registered without modifying
    the package.
  license: MIT
  license_file: LICENSE
  documentation: https://npap.readthedocs.io
  repository: https://github.com/IEE-TUGraz/NPAP

extra:
  recipe-maintainers:
    - MarcoAnarmo