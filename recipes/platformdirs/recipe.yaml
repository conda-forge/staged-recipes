schema_version: 1

context:
  version: "4.14.8"

package:
  name: platformdirs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/platformdirs/platformdirs-${{ version }}.tar.gz
  sha256: 96893d686e84e9e6f358a9ea41a8de544df66dbf2ba6cda250e7dc73acf85b9b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-fancy-pypi-readme >=25.1
    - hatch-vcs >=0.5
    - hatchling >=1.29
    - python-sbom >=0.1.2
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - platformdirs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A small Python package for determining appropriate platform-specific dirs, e.g. a `user data dir`.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tox-dev/platformdirs
  repository: https://github.com/tox-dev/platformdirs
  documentation: https://platformdirs.readthedocs.io

extra:
  recipe-maintainers:
    - jan-janssen
