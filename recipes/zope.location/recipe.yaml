schema_version: 1

context:
  version: "6.0"

package:
  name: zope.location
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.location/zope_location-${{ version }}.tar.gz
  sha256: baa3e0e8eab734ff908ffd9860185c8de458025d49eae62f11ba3b16579ee6ce

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ==78.1.1
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface >=4.0.2
    - zope.schema >=4.2.2
    - zope.proxy >=4.0.1

tests:
  - python:
      imports:
        - zope.location
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.location
  repository: https://github.com/zopefoundation/zope.location
  summary: Zope Location
  license: ZPL-2.1
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - killua156
