
schema_version: 1

context:
  version: "1.21.4"
  python_min: "3.12"

package:
  name: chaostoolkit
  version: ${{ version }}

source:
  url: https://github.com/chaostoolkit/chaostoolkit/archive/refs/tags/${{ version }}.tar.gz
  sha256: 7b68af1ed7b605fc769b38d5947e8d09128146842836acce226c6a43b78addfd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - click >=8.0
    - click-plugins >=1.1
    - chaostoolkit-lib >=1.45.1
    - importlib-metadata >=6.0
    - pyyaml >=6.0.1

tests:
  - python:
      imports:
        - chaostoolkit
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - script:
      - chaos --help

about:
  homepage: https://chaostoolkit.org/
  repository: https://github.com/chaostoolkit/chaostoolkit
  documentation: https://chaostoolkit.org/reference/concepts/
  license: Apache-2.0
  license_file: LICENSE
  summary: Chaos Engineering Toolkit for everyone
  description: |
    The Chaos Toolkit is a simple CLI-driven tool for
    writing and running Chaos Engineering experiments.

extra:
  recipe-maintainers:
    - jsmolic
