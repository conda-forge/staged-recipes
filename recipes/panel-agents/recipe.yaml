context:
  name: panel-agents
  version: "0.1.0b0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/panel_agents-${{ version }}.tar.gz
  sha256: db7ef78cea68760a33bea165444ef3571d7b28aae1003b428d874c5a8992c549

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - panel >=1.9.0
    - panel-material-ui >=0.16.0
    - pydantic >=2.12
  run_constraints:
    - pydantic-ai-slim >=2.60
    - fastmcp-slim >=4.1,<5

tests:
  - python:
      imports:
        - panel_agents
        - panel_agents.components
        - panel_agents.artifacts
        - panel_agents.state
        - panel_agents.policy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/panel-extensions/panel-agents
  repository: https://github.com/panel-extensions/panel-agents
  summary: Panel components for building agent user interfaces.
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - philippjfr
