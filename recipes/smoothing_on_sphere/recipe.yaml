schema_version: 1

context:
  version: "6.0.0"

package:
  name: smoothing_on_sphere
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/smoothing_on_sphere/smoothing_on_sphere-${{ version }}.tar.gz
  sha256: e49a9f16dfd96a3f787fd0b050895de3e496c0f12d891f8a660fc8e5813a1044

build:
  number: 0
  skip: match(python, "<3.10")
  script:
    - if: unix
      then: bash "$RECIPE_DIR/build.sh"
    - if: win
      then: call "%RECIPE_DIR%\build.bat"

requirements:
  build:
    - ${{ stdlib('c') }}
    - if: unix
      then:
        - ${{ compiler('clang') }}
        - ${{ compiler('clangxx') }}
    - if: win
      then:
        - ${{ compiler('cxx') }}
        - clang
  host:
    - python
    - pip
    - setuptools >=77
    - wheel
    - llvm-openmp
  run:
    - python
    - numpy >=1.23
    - llvm-openmp

tests:
  - python:
      imports:
        - smoothing_on_sphere
      pip_check: true
  - script:
      - python tests/test_smoothing_on_sphere.py -v
    files:
      source:
        - tests/test_smoothing_on_sphere.py

about:
  homepage: https://github.com/skokg/Smoothing_on_Sphere
  summary: Area-weighted smoothing of fields on a sphere
  description: |
    Smoothing on Sphere provides a NumPy interface to C++ implementations
    of area-weighted spherical smoothing using direct KD-tree searches,
    reusable KD-tree caches and overlap detection, with OpenMP parallelism.
  license: MIT
  license_file:
    - LICENSE
    - licenses/THIRD_PARTY_NOTICES.txt
    - licenses/LLVM-OpenMP.txt
  documentation: https://github.com/skokg/Smoothing_on_Sphere#readme
  repository: https://github.com/skokg/Smoothing_on_Sphere

extra:
  recipe-maintainers:
    - skokg
