schema_version: 1

context:
  version: "0.2.0"

package:
  name: faxforagents
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/faxforagents/faxforagents-${{ version }}.tar.gz
  sha256: 9524cb9b0713ca0d8e5aecd3b3c9bd35bd48f00a3b3863be561f2cf96f0b2441

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - faxforagents = faxforagents.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.27,<1
    - pydantic >=2.6,<3
    # The `cli` extra on PyPI. Included so the `faxforagents` command works out of the box.
    - typer >=0.12
    - rich >=13

tests:
  - python:
      imports:
        - faxforagents
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - faxforagents --help

about:
  summary: Python client for Fax for Agents, a fax API so AI agents can send and receive faxes
  description: |
    Fax for Agents is a fax API, a hosted MCP server and SDKs built so AI agents
    can send and receive faxes. It is made by JSB Holdings LLC. This package is
    the Python SDK: a sync and an async client, webhook signature verification,
    typed models generated from the OpenAPI document, and a small CLI.
  license: MIT
  license_file: LICENSE
  homepage: https://faxforagents.com
  documentation: https://faxforagents.com/docs
  repository: https://github.com/faxforagents/sdk-python

extra:
  recipe-maintainers:
    - bensynapse
