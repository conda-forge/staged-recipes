schema_version: 1
package:
  name: windows-keyboard-mouse-filter
  version: 1.0.0
source:
- url: https://github.com/titanfyre/Windows-Keyboard-Mouse-Filter/releases/download/input-language-sdks-v1.0.0/windows-keyboard-mouse-filter-input-sdks-1.0.0-source.zip
  sha256: d571d0e95c95f26668032d98982f8617e3d30f052cdf36a9fd6a3960da52d0dd
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - windows_keyboard_mouse_filter
    pip_check: true
- script:
  - python -m pip check
  - python -c "from windows_keyboard_mouse_filter import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Windows-Keyboard-Mouse-Filter
  summary: Windows x64 Windows-Keyboard-Mouse-Filter Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Windows-Keyboard-Mouse-Filter-C-ffi/LICENSE
  repository: https://github.com/titanfyre/Windows-Keyboard-Mouse-Filter
extra:
  recipe-maintainers:
  - TitanCSA
