# The variants of alexandria; the compilers and the C standard library come
# from the global pinning of conda-forge, the GPU support from the platform,
# see the context of recipe.yaml
mpi:
  - mpich
  - openmpi
# librdkit 2026.03 is built with Boost 1.90, while the global pinning still has
# 1.88; this follows the libboost190 migration of conda-forge and can go once
# that is done
libboost_devel:
  - "1.90"
libboost_headers:
  - "1.90"
