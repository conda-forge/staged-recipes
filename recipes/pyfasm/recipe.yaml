context:
  version: "0.1.0"

package:
  name: pyfasm
  version: ${{ version }}

source:
  url: https://github.com/eminsk/pyfasm/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ea7c8687902d8580690168a3d5f1ff840af05651b87277e0332ec93c575eaec6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - pyfasm = pyfasm.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pyfasm
      pip_check: true
  - script:
      - pyfasm --help

about:
  homepage: https://github.com/eminsk/pyfasm
  summary: Universal Native No-GIL (3.13t-3.16t) & PyPy (3.8-3.12) to pure x86_64 FASM compiler & bundler for Windows, Linux, macOS, and DLL
  description: |
    PyFASM is a high-performance cross-platform native compiler that translates Python
    code directly into pure x86_64 Flat Assembler (FASM) machine code with zero runtime
    overhead, no virtual machine, and complete elimination of the Global Interpreter Lock (Zero-GIL).
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/pyfasm
  documentation: https://github.com/eminsk/pyfasm#readme

extra:
  recipe-maintainers:
    - eminsk
