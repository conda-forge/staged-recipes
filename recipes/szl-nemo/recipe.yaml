schema_version: 1

context:
  version: "0.4.2"

package:
  name: szl-nemo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/szl-nemo/szl_nemo-0.4.2.tar.gz
  sha256: b46c09e105975905035502a0f122afb6ee67955227c25a5e287e9767dd81606e

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - szl_nemo
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/szl-holdings/szl-nemo
  repository: https://github.com/szl-holdings/szl-nemo
  documentation: https://github.com/szl-holdings/szl-nemo#readme
  license: Apache-2.0
  license_file: LICENSE
  summary: Deterministic doctrine checker and proof-carrying inference-envelope witness.
  description: |
    Deterministic doctrine checker (rules R1-R5) and proof-carrying inference-envelope witness. It is not
    Nemotron, not an LLM and not a CUDA kernel: a small dependency-free package that evaluates an inference
    envelope against a declared doctrine and emits the decision together with the evidence that produced it.

extra:
  recipe-maintainers:
    - stephenlutar2-hash
