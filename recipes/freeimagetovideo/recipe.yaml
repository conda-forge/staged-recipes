context:
  version: "0.1.0"

package:
  name: freeimagetovideo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/freeimagetovideo/freeimagetovideo-${{ version }}.tar.gz
  sha256: 89ae11e7f710f8d4ad12567cd63a8f369fcd42a65fae4a1d96f8e2cd063d8ac2

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - freeimagetovideo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://freeimagetovideo.ai
  summary: Official Python SDK and CLI for Free Image to Video
  description: |
    Free image to video AI with no daily cap: start with no sign-up, keep going on a free account.
    Every video comes with sound and no watermark. Dependency-free Python client and CLI for
    text-to-video and image-to-video generation via the Free Image to Video API.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/hanshs474/fitv-py
  documentation: https://freeimagetovideo.readthedocs.io/

extra:
  recipe-maintainers:
    - hanshs474
