context:
  version: "0.2.4"

package:
  name: firecrawl-anydoc
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/f/firecrawl-anydoc/firecrawl_anydoc-${{ version }}.tar.gz
  sha256: 3e29460272fea81cde08fd5af11f6b0f1ff05919214ddc939867f72362c83032

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.9,<2
  run:
    - python

tests:
  - python:
      imports:
        - anydoc
        - anydoc._anydoc
      pip_check: true
  - script: python run_test.py
    files:
      recipe:
        - run_test.py

about:
  homepage: https://github.com/firecrawl/anydoc
  summary: Convert documents to GitHub-Flavored Markdown
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/firecrawl/anydoc

extra:
  recipe-maintainers:
    - eunos-1128
