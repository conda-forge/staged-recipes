schema_version: 1

context:
  version: "6.0"

package:
  name: zope.exceptions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.exceptions/zope_exceptions-${{ version }}.tar.gz
  sha256: 0ac0e078ecdd8acb5da231c39fc6454bdf3249216fd1c06d0578bf8ea6bf3299

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface

tests:
  - python:
      imports:
        - zope.exceptions
        - zope.exceptions.exceptionformatter
        - zope.exceptions.log
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # dotted names: the formatter tests assert on the full module name
      - python -m unittest -v zope.exceptions.tests.test_exceptionformatter zope.exceptions.tests.test_log

about:
  homepage: https://github.com/zopefoundation/zope.exceptions
  repository: https://github.com/zopefoundation/zope.exceptions
  documentation: https://zopeexceptions.readthedocs.io
  summary: Zope Exceptions
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
