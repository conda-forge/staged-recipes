schema_version: 1

context:
  version: "0.2.2"

package:
  name: pyfock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyfock/pyfock-${{ version }}.tar.gz
  sha256: cf022839e88f6d931f8f6d7eb50a811aa61cbd8c32f4318bdeb3756053d016ad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ={{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >={{ python_min }} 
    - numba >=0.57.0rc1
    - numexpr >=2.7.3
    - joblib >=1.2.0
    - numpy >=1.21.6
    - llvmlite >=0.40.0rc1
    - opt_einsum >=v3.3.0
    - threadpoolctl >=3.1.0
    - numgrid
    - psutil

tests:
  - python:
      imports:
        - pyfock
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A simplistic and efficient pure-python quantum chemistry library from Phys Whiz.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/manassharma07/pyfock

extra:
  recipe-maintainers:
    - jan-janssen
