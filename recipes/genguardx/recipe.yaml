schema_version: 1

context:
  name: genguardx
  version: "2026.11.11"
  python_min: "3.11"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/py3/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}-py3-none-any.whl
  sha256: d5349a10406505aff72cdf36dae095b08ca1f46ecb744b5c37c6e1c32cd9ad97

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install ${{ name }}-${{ version }}-py3-none-any.whl -vv --no-deps --no-build-isolation
    # The license file is inside the wheel.
    - ${{ PYTHON }} -m zipfile -e ${{ name }}-${{ version }}-py3-none-any.whl wheel
  python:
    entry_points:
      - ggx = genguardx.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - httpx2
    - python-dateutil
    - plotly >=4.0
    - pydantic
    - typing_extensions
    - numpy
    - pandas
    - python-duckdb >=2,<3
    - pyarrow
    - databricks-sql-connector

tests:
  - python:
      imports:
        - genguardx
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - ggx --version
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://genguardx.ai
  summary: Python SDK and command line for the GenGuardX platform
  description: |
    Python SDK for GenGuardX, the GenAI evaluation, governance and model-risk platform by
    Corridor Platforms.
  license: Apache-2.0
  license_file: wheel/${{ name }}-${{ version }}.dist-info/licenses/LICENSE
  documentation: https://docs.genguardx.ai
  repository: https://pypi.org/project/genguardx/

extra:
  recipe-maintainers:
    - JS-CodeGamer
