# The upstream binaries require these at runtime: the Linux toolchain is built
# on Amazon Linux 2023 (glibc 2.34), and SwiftPM and sourcekit-lsp in the macOS
# toolchain have a minimum deployment target of macOS 14.0.
c_stdlib:  # [unix]
  - sysroot                   # [linux]
  - macosx_deployment_target  # [osx]
c_stdlib_version:  # [unix]
  - "2.34"  # [linux]
  - "14.0"  # [osx]
