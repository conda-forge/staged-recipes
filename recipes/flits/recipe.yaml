schema_version: 1

context:
  name: flits
  version: "1.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9335799b9860fbc10d0b470153ec8c2e114d87555cb6c7cea992dce611131314

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - flits = flits.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=82.0.1
    - wheel
  run:
    - python >=${{ python_min }}
    - fastapi >=0.115,<1
    - uvicorn >=0.30,<1
    - numpy >=1.26,<3
    - scipy >=1.11.4,<2
    - astropy-base >=6.0,<9
    - pydantic >=2.7,<3
    - matplotlib-base >=3.8,<4
    - h5py >=3.10,<4

tests:
  - python:
      imports:
        - flits
        - flits.session
        - flits.measure
        - flits.web.app
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - flits --help
      - flits measure --help
      - flits inspect --help
      - flits schema measurement

about:
  homepage: https://dirkkuiper.github.io/flits/
  repository: https://github.com/DirkKuiper/flits
  documentation: https://dirkkuiper.github.io/flits/
  summary: Interactive and scriptable fast radio burst (FRB) analysis
  description: |
    FLITS (Fast-Look Interactive Transient Suite) measures fast radio bursts
    in dynamic spectra: SIGPROC filterbank, PSRFITS search and fold data, and
    CHIME/FRB HDF5. It masks interference, localizes the burst, optimizes the
    DM, and measures S/N, flux, fluence, widths, arrival times, drift rate and
    rotation measure, with each uncertainty classified. It offers a browser
    interface, a command line (`flits measure`) and a Python API, and saves
    analyses as replayable session snapshots.
  # The interface bundles plotly.js (MIT) so it works without a CDN.
  license: GPL-3.0-only AND MIT
  license_file:
    - LICENSE
    - flits/web_static/vendor/plotly-2.35.2.LICENSE.txt

extra:
  recipe-maintainers:
    - DirkKuiper
