context:
  version: 0.10.0

package:
  name: betterproto2
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/betterproto2/betterproto2-${{ version }}.tar.gz
  sha256: fa0bcc3b87b6fd9151cd0058c153e480830f55fddb5afe3fef92e842490be266

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - uv-build >=0.9.7,<0.12
  - pip
  run:
  - python >=${{ python_min }}
  - python-dateutil >=2.9.0.post0
  - typing-extensions >=4.14.0

tests:
- python:
    imports:
    - betterproto2
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - '*'

about:
  summary: A better Protobuf / gRPC generator & library
  license: MIT
  license_file: LICENSE.md
  homepage: https://pypi.org/project/betterproto2/
  documentation: https://betterproto.github.io/python-betterproto2/

extra:
  recipe-maintainers:
    - jsmolic
