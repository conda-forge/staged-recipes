context:
  name: knot-floer-homology
  version: "1.2.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/3-manifolds/knot_floer_homology/archive/refs/tags/${{ version }}_as_released.tar.gz
    sha256: d594fc76b59d03054fe717ab187f8e5574c5f6572bf71bc5441bde6df94d610c

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
    - cython
  run:
    - python

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - knot_floer_homology
        - knot_floer_homology.hfk
      pip_check: true
  - script:
      - python -m knot_floer_homology.test

about:
  homepage: https://github.com/3-manifolds/knot_floer_homology
  repository: https://github.com/3-manifolds/knot_floer_homology
  summary: Python wrapper for Zoltán Szabó's HFK Calculator
  description: |
    A Python wrapper for Zoltán Szabó's HFK Calculator, which computes
    knot Floer homology of knots in S^3 from a planar diagram code.
    It is used by SnapPy and SageMath.
  license: GPL-2.0-or-later
  #  The README holds a license statement and a reference to GNU General Public License, version 2
  license_file:
    - README.rst
    - LICENSE

extra:
  recipe-maintainers:
    - soapy1
