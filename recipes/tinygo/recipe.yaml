context:
  name: tinygo
  version: "0.44.0"
  # TinyGo 0.44 targets LLVM 22. Upstream builds against its own fork
  # (tinygo-org/llvm-project) which adds the experimental Xtensa backend; we
  # build against stock conda-forge LLVM, so Xtensa (ESP32/ESP8266) targets
  # are not available.
  llvm_major: "22"
  # contents of llvm-version.txt in the tinygo source
  llvm_fork_commit: 472a22901c0dd9edc2903ad5c435d9076a745a6e
  cmsis_svd_commit: 05a9562ec59b87945a8d7177a4b08b7aa2f2fd58

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/tinygo-org/tinygo/archive/refs/tags/v${{ version }}.tar.gz
    sha256: a1b582f5e8a1ed111314e34922c3584c2e10b848b23dd2b861116a84547edfbf
  # compiler-rt builtins sources and clang headers are shipped in the release
  # layout and compiled on demand by tinygo for each target. These come from
  # the tinygo LLVM fork at the commit pinned in llvm-version.txt, since
  # tinygo relies on builtins (e.g. arm/aeabi_uread4.S) not in stock LLVM 22.
  # This archive and cmsis-svd-data below are left unextracted (file_name)
  # and only the needed paths are extracted in build.sh: in full they unpack
  # to ~8 GB, which exhausts the CI runner's disk.
  - url: https://github.com/tinygo-org/llvm-project/archive/${{ llvm_fork_commit }}.tar.gz
    sha256: 3ec660c9881ca7fc53792623d79d8d407623c9416c089e493d38e1e8e8e26ee7
    file_name: llvm-project.tar.gz
    target_directory: archives
  # git submodules, pinned to the commits referenced by the v${{ version }} tag
  - url: https://github.com/ARM-software/CMSIS/archive/9fe411cef1cef5de58e5957b89760759de44e393.tar.gz
    sha256: b61f6ceeef65469780d985518d41513d3853e61f51cc777d4010ff4c315d51e4
    target_directory: lib/CMSIS
  - url: https://github.com/avr-rust/avr-mcu/archive/6624554c02b237b23dc17d53e992bf54033fc228.tar.gz
    sha256: 0f7a130d82a6b6f3cc171e42dfaf62228e0f987239c87711996d4f54b49ad9e0
    target_directory: lib/avr
  - url: https://github.com/ivmai/bdwgc/archive/7577ca7c2dc7364bb6733dab23be34231279db6b.tar.gz
    sha256: 70508190844a314b2603ef1cfb9ec2f8e25bc3da3eae8a50ed0daedbf8ac9cfb
    target_directory: lib/bdwgc
  - url: https://github.com/cmsis-svd/cmsis-svd-data/archive/${{ cmsis_svd_commit }}.tar.gz
    sha256: e93862aaeb93be28e9aa6ffda4da4dabe935b3abcc9a2edae74f04b897203827
    file_name: cmsis-svd-data.tar.gz
    target_directory: archives
  - url: https://github.com/tinygo-org/macos-minimal-sdk/archive/d7462e1318e724116b45d2de98d51bbdcddef856.tar.gz
    sha256: 466aa26b20906287115afcc76351139a2250594d5fc1d7dbdb1b0e8ca1e64aa6
    target_directory: lib/macos-minimal-sdk
  - url: https://github.com/mingw-w64/mingw-w64/archive/8526cb618269440a94810b94b77f8bd48c5c3396.tar.gz
    sha256: bb5d4e7481b4a2de59fc4a1d07eee7c3b02e38425a10b311b2f6a041820b1418
    target_directory: lib/mingw-w64
  - url: https://github.com/tinygo-org/musl-libc/archive/7a43f6fea9081bdd53d8a11cef9e9fab0348c53d.tar.gz
    sha256: 9198c244bf27662ec2c601f5efc1ec48ea23e541275aec795961a7c1fe5ec48b
    target_directory: lib/musl
  - url: https://github.com/NordicSemiconductor/nrfx/archive/d779b49fc59c7a165e7da1d7cd7d57b28a059f16.tar.gz
    sha256: 0b65a3cd26a67b7171baf3558d0f9c77f61220a3925eab58201cfa9406e31aab
    target_directory: lib/nrfx
  - url: https://github.com/picolibc/picolibc/archive/036919b76d7124f25f1d82554a06c921708cd4b1.tar.gz
    sha256: e6a5c3b6b39fd21cea2b62ddd177339434c72a14db45a3b6b34d663a659198be
    target_directory: lib/picolibc
  - url: https://github.com/tinygo-org/py32-svd/archive/6aa7396c1d4d20be61cc62f283fa3835665c7361.tar.gz
    sha256: d2cb0215dc9f255725b11b62a551eeb7fc268a1036da8c672074154c233f5e29
    target_directory: lib/py32-svd
  - url: https://github.com/tinygo-org/stm32-svd/archive/bfed180b639863db414221bdb6aa77e198f464f5.tar.gz
    sha256: 04a80535e565662fbdc3d1eb43598dbc5a7e040e54777af13fd6076efa38e6a7
    target_directory: lib/stm32-svd
  - url: https://github.com/WebAssembly/wasi-cli/archive/6ae82617096e83e6606047736e84ac397b788631.tar.gz
    sha256: ff94a92649ddb9a43e7b5d6411684d124b87ef065d91100b0e35646253e5288e
    target_directory: lib/wasi-cli
  - url: https://github.com/WebAssembly/wasi-libc/archive/1dfe5c302d1c5ab621f7abf04620fae92700fd22.tar.gz
    sha256: 1bf642d35f8876a256824db01a43436c0b83ce4a0865578d03c37b16937a9b06
    target_directory: lib/wasi-libc
  - url: https://github.com/tinygo-org/net/archive/70037cf71f1ae14175781e162c9c76d1ac730ece.tar.gz
    sha256: 2db7b51235bcd2813df02bb9760c36156e8fc10a574aab92806716f81ba6d09d
    target_directory: src/net

build:
  number: 0
  skip:
    - win
  script:
    file: build.sh
    env:
      LLVM_MAJOR: ${{ llvm_major }}
      LLVM_FORK_COMMIT: ${{ llvm_fork_commit }}
      CMSIS_SVD_COMMIT: ${{ cmsis_svd_commit }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('go-cgo') }}
    - go-licenses
    - make
  host:
    - llvmdev ${{ llvm_major }}.*
    - clangdev ${{ llvm_major }}.*
    - libclang ${{ llvm_major }}.*
    - lld ${{ llvm_major }}.*
    - zlib
    - zstd
  run:
    # llvmdev/clangdev carry no run_exports for the shared libraries
    - libllvm${{ llvm_major }}
    - libclang13 ${{ llvm_major }}.*
    # soname is libclang-cpp.so.<major>.<minor>
    - libclang-cpp${{ llvm_major }}.1
    # tinygo compiles the standard library from a regular Go installation.
    # Supported range is MinimumGoMinorVersion..MaximumGoMinorVersion in
    # compileopts/config.go.
    - go >=1.25,<1.28
    # wasm-opt, used for wasm targets
    - binaryen

tests:
  - package_contents:
      bin:
        - tinygo
      files:
        - lib/tinygo/bin/tinygo
        - lib/tinygo/src/runtime/internal/sys/zversion.go
        - lib/tinygo/src/device/arm/arm.go
        - lib/tinygo/src/device/rp/rp2040.go
        - lib/tinygo/lib/clang/include/stdint.h
        - lib/tinygo/lib/compiler-rt-builtins/LICENSE.TXT
        - lib/tinygo/targets/pico.json
  - files:
      recipe:
        - hello.go
    script:
      - tinygo version
      - test "$(tinygo env TINYGOROOT)" = "$CONDA_PREFIX/lib/tinygo"
      # host build
      - tinygo build -o hello hello.go
      - ./hello | grep "hello from tinygo"
      # WebAssembly (exercises wasi-libc and wasm-opt)
      - tinygo build -target=wasip1 -o hello.wasm hello.go
      - test -s hello.wasm
      # microcontroller (exercises picolibc, compiler-rt and device files)
      - tinygo build -target=pico -o hello.elf hello.go
      - test -s hello.elf
    requirements:
      run:
        - binaryen

about:
  homepage: https://tinygo.org/
  summary: Go compiler for small places. Microcontrollers, WebAssembly (WASM/WASI), and command-line tools.
  description: |
    TinyGo is a Go compiler intended for use in small places such as
    microcontrollers, WebAssembly (wasm/wasi), and command-line tools. It
    reuses libraries used by the Go language tools alongside LLVM to provide
    an alternative way to compile programs written in Go.

    Note: this build uses stock LLVM, so Xtensa targets (ESP32, ESP8266) are
    not supported.
  license: BSD-3-Clause AND Apache-2.0 WITH LLVM-exception AND MIT AND BSD-2-Clause AND Apache-2.0 AND ZPL-2.1
  license_file:
    - LICENSE
    - llvm-project/compiler-rt/LICENSE.TXT
    - llvm-project/clang/LICENSE.TXT
    - llvm-project/lld/LICENSE.TXT
    - lib/bdwgc/LICENSE
    - lib/cmsis-svd/LICENSE-APACHE
    - lib/mingw-w64/COPYING
    - lib/musl/COPYRIGHT
    - lib/nrfx/LICENSE
    - lib/picolibc/COPYING.picolibc
    - lib/stm32-svd/LICENSE-APACHE
    - lib/stm32-svd/LICENSE-MIT
    - lib/wasi-libc/LICENSE
    - lib/wasi-libc/LICENSE-APACHE
    - lib/wasi-libc/LICENSE-APACHE-LLVM
    - lib/wasi-libc/LICENSE-MIT
    - src/net/LICENSE
    - license-files/
  documentation: https://tinygo.org/docs/
  repository: https://github.com/tinygo-org/tinygo

extra:
  recipe-maintainers:
    - benmoss
