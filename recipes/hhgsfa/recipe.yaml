context:
  version: "0.1.0"
  python_min: "3.11"

package:
  name: hhgsfa
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hhgsfa/hhgsfa-${{ version }}.tar.gz
  sha256: f0366ff04dd25ca06666c32f80f080aadb36fd0831d7ae527e6a5c218d43191e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10

tests:
  - python:
      imports:
        - hhgsfa
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/melvinrdn/hhgsfa
  summary: Strong-field approximation and analytic dipole phase for high-order harmonic generation
  license: MIT
  license_file: LICENSE
  documentation: https://melvinrdn.github.io/hhgsfa/
  repository: https://github.com/melvinrdn/hhgsfa

extra:
  recipe-maintainers:
    - melvinrdn
