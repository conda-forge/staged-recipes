{% set name = "cptec-monan" %}
{% set version = "0.1.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/cptec-monan-{{ version }}.tar.gz
  sha256: 5df873119231eaa6e411ad7a3fa8c28a9367a89e4d71bb6b8c592caade0b5f3f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - pip
  run:
    - python >=3.10
    - numpy
    - pandas
    - matplotlib-base
    - netcdf4
    - xarray
    - dask-core
    - tqdm
    - gdal

test:
  imports:
    - monanmodel
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://monan-model.readthedocs.io/en/latest/
  homepage: https://monan-model.readthedocs.io/en/latest/
  dev_url: https://github.com/framework-CPTEC/CPTEC_MONAN
  doc_url: https://github.com/framework-CPTEC/CPTEC_MONAN
  summary: Módulo para distribuição do Modelo MONAN do CPTEC.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - framework-CPTEC
