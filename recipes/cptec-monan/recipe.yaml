schema_version: 1

context:
  version: "0.1.5"

package:
  name: cptec-monan
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/cptec-monan/cptec_monan-${{ version }}.tar.gz
  sha256: 5df873119231eaa6e411ad7a3fa8c28a9367a89e4d71bb6b8c592caade0b5f3f

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - monan_load = monanmodel.CPTEC_MONAN:main

requirements:

  build:
    - python >=3.10
    - pip
    - setuptools
    - wheel

  host:
    - python >=3.10
    - pip
    - setuptools
    - wheel

  run:
    - python >=3.10
    - numpy
    - pandas
    - matplotlib-base
    - netcdf4
    - xarray
    - dask-core
    - tqdm
    - gdal

tests:
  - python:
      imports:
        - monanmodel
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - monan_load --help

about:
  summary: Módulo para distribuição de Modelos Numéricos.
  license: MIT
  license_file: LICENSE
  homepage: https://monan-model.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - framework-CPTEC
