schema_version: 1

context:
  version: "0.1.5"

package:
  name: cptec-monan
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/cptec-monan/cptec_monan-${{ version }}.tar.gz
  sha256: 5df873119231eaa6e411ad7a3fa8c28a9367a89e4d71bb6b8c592caade0b5f3f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - pip
  run:
    - python >=3.10
    - numpy
    - pandas
    - xarray
    - requests
    - matplotlib-base
    - scipy
    - netcdf4

test:
  imports:
    - sazonal
  commands:
    - pip check
  requires:
    - pip

      
about:
  home: https://monan-model.readthedocs.io/en/latest/
  homepage: https://monan-model.readthedocs.io/en/latest/
  dev_url: https://github.com/framework-CPTEC/CPTEC_MONAN
  doc_url: https://github.com/framework-CPTEC/CPTEC_MONAN
  summary: Módulo para distribuição do Modelo MONAN do CPTEC.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - framework-CPTEC
