context:
  version: 0.1.7
  build_number: '0'

package:
  name: cptec-monan
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/c/cptec-monan/cptec_monan-${{ version }}.tar.gz
  sha256: 4a61d98286bc542cc3681c5ad484ee1610005362aaf4b99c111a108898d998f9

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .

requirements:
  build:
    - setuptools
  host:
    - python >=3.12,<3.13
    - pip
    - setuptools
  run:
  - python >=3.12,<3.13
  - numpy
  - pandas
  - matplotlib
  - netcdf4
  - xarray
  - dask
  - tqdm
  - gdal

tests:
- python:
    imports:
    - monanmodel
    pip_check: true

about:
  homepage: https://monan-model.readthedocs.io/en/latest/
  summary: Módulo para distribuição de Modelos Numéricos.
  description: "Framework\n\nDescrição\nÉ um pacote Python para a distribuição de dados brutos dos Modelos Numéricos de forma segmentada/particionada. Com esse pacote o usuário não necessita fazer o Download de todo o volume bruto o pacote auxilia a manipular somente a sua necessidade.\n\nsupport Python >= 3.10.\n\nDocumentação completa disponível em: [Read the Docs](https://monan-model.readthedocs.io/en/latest/)\n\n    \n"
  license: MIT
