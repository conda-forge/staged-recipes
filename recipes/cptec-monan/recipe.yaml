context:
  version: 0.1.7
  python_min: "3.10"

package:
  name: cptec-monan
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/cptec-monan/cptec_monan-${{ version }}.tar.gz
  sha256: 4a61d98286bc542cc3681c5ad484ee1610005362aaf4b99c111a108898d998f9

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - matplotlib-base
    - netcdf4
    - xarray
    - dask
    - tqdm
    - gdal

tests:
  - python:
      imports:
        - monanmodel
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://monan-model.readthedocs.io/en/latest/
  summary: Módulo para distribuição de Modelos Numéricos.
  description: |
    Framework para distribuição segmentada de dados brutos dos modelos
    numéricos MONAN.

    Permite ao usuário acessar apenas os subconjuntos necessários dos
    dados sem realizar o download de todo o volume disponível.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/framework-CPTEC/CPTEC_MONAN

extra:
  recipe-maintainers:
    - framework-CPTEC
