schema_version: 1

context:
  version: 0.9.2
  name: gamd_openmm
  python_min: "3.9"

package:
  name: gamd_openmm
  version: ${{ version }}

source:
  url: https://github.com/MiaoLab20/gamd-openmm/archive/refs/tags/0.9.2.tar.gz
  sha256: 1985b25855b73f8ad3af96a3077eea57705b250bb5545fda5da6c717e1996d8c
  patches:
    - versioneer-py312.patch

build:
  number: 0
  skip:
    - win
  script: |
    python -m pip install . -vv --no-deps --no-build-isolation
    mkdir -p ${PREFIX}/bin
    cp gamdRunner ${PREFIX}/bin/gamdRunner
    chmod +x ${PREFIX}/bin/gamdRunner

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - versioneer
  run:
    - python
    - numpy
    - parmed
    - pytest
    - openmm
    - matplotlib-base
    - mdtraj
    - netcdf4
    - pillow >=10

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - gamd
      pip_check: true
  - script:
      - python -c "import gamd"
      - gamdRunner --help

about:
  summary: Gaussian Accelerated Molecular Dynamics (GaMD) is a biomolecular enhanced sampling method that works by adding a harmonic boost potential to smoothen the system potential energy surface.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/MiaoLab20/gamd-openmm
  repository: https://github.com/MiaoLab20/gamd-openmm

extra:
  recipe-maintainers:
    - FNTwin
