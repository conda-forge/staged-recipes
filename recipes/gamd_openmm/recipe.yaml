schema_version: 1

context:
  version: 0.9.2
  name: gamd_openmm
  python_min: "3.7"

package:
  name: gamd_openmm
  version: ${{ version }}

source:
  git: https://github.com/MiaoLab20/gamd-openmm.git
  rev: 184420964665d35c1c6e97729e95e2a33d9a5c86
  patches:
    - versioneer-py312.patch

build:
  number: 0
  noarch: python
  script: |
    python -m pip install . -vv --no-deps --no-build-isolation
    mkdir -p ${PREFIX}/bin
    cp gamdRunner ${PREFIX}/bin/gamdRunner
    chmod +x ${PREFIX}/bin/gamdRunner

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - versioneer
  run:
    - python >=${{ python_min }}
    - numpy
    - parmed
    - pytest
    - openmm
    - matplotlib-base
    - mdtraj

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - gamd
      pip_check: true
  - script:
      - python -c "import gamd"
      - gamdRunner --help

about:
  summary: Gaussian Accelerated Molecular Dynamics (GaMD) is a biomolecular enhanced sampling method that works by adding a harmonic boost potential to smoothen the system potential energy surface.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/MiaoLab20/gamd-openmm
  repository: https://github.com/MiaoLab20/gamd-openmm

extra:
  recipe-maintainers:
    - FNTwin
