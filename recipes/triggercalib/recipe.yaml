context:
  name: triggercalib
  version: "2.0.11"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 87f6901f608826cb232cba0046ba392925c54b03197a3defd9a62e4344d63433

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - triggercalib.sideband = triggercalib.commands.sideband:main
      - triggercalib.fit_and_count = triggercalib.commands.fit_and_count:main
      - triggercalib.sweights = triggercalib.commands.sweights:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - lhcbstyle
    - numpy
    - pyyaml
    - root
    # Only package for Linux/MacOS
    - __unix

tests:
  - python:
      imports:
        - triggercalib
        - triggercalib.core
        - triggercalib.utils
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - triggercalib.sideband --help
      - triggercalib.fit_and_count --help
      - triggercalib.sweights --help

about:
  homepage: https://gitlab.cern.ch/lhcb-rta/triggercalib
  repository: https://gitlab.cern.ch/lhcb-rta/triggercalib
  documentation: https://triggercalib.docs.cern.ch/
  summary: A turnkey package for estimating LHCb trigger efficiencies
  description: |
    TriggerCalib implements the TISTOS method (Eur. Phys. J. C 86 (2026) 731) to estimate
    trigger efficiencies in LHCb analyses, with sideband subtraction,
    fit-and-count and sWeights background mitigation.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - GoodingJamie
