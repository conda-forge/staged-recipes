schema_version: 1
package:
  name: processguard-sdk
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/ProcessGuard-SDK/language-sdks-v1.0.0/processguard-sdk-sdk-source-1.0.0.zip
  sha256: 379f9365e339793e59e1cb7e5705040224eccc29a336d93c02d2f1faa58b1f36
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - processguard_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from processguard_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/ProcessGuard-SDK
  summary: Windows x64 ProcessGuard-SDK Python SDK with source-built native bridge
  license: MIT
  license_file:
  - ProcessGuard-SDK-C-ffi/LICENSE
  - ProcessGuard-SDK-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
