context:
  version: "0.1.0"

package:
  name: scene-streamer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scene-streamer/scene_streamer-${{ version }}.tar.gz
  sha256: 9d8ea72edd4eb99a254c7fb28685851dc744191c9864fee299e8c1937ac3952b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.9
    - numpy >=1.23
    - pillow >=9
    # the notebook widget (the `notebook` extra upstream)
    - anywidget >=0.9

tests:
  - python:
      imports:
        - scene_streamer
        - scene_streamer.hub
        - scene_streamer.window
        - scene_streamer.widget
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/menpo/scene-streamer
  summary: Stream frames from an OpenGL scene renderer to a browser, a notebook widget or an app window
  description: |
    scene-streamer runs a small web server in the process that owns an OpenGL
    scene renderer and streams its frames (H.264 or JPEG over one websocket) to
    a browser page, a Jupyter notebook widget or an app window, and forwards the
    page's camera gestures back to the scene. It knows nothing about meshes or
    OpenGL: the package that owns the scene and the renderer supplies them
    through the protocols in scene_streamer.protocols. menpo3d is the first such
    package. H.264 needs PyAV (not a dependency of this package: without it
    frames are sent as JPEG).
  license: BSD-3-Clause
  license_file: LICENSE.txt
  documentation: https://scene-streamer.readthedocs.io/
  repository: https://github.com/menpo/scene-streamer

extra:
  recipe-maintainers:
    - patricksnape
