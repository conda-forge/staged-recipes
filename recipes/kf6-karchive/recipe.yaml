context:
  name: kf6-karchive
  version: "6.24.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://download.kde.org/stable/frameworks/6.24/karchive-${{ version }}.tar.xz
  sha256: b68faa1c9012e40bbed516d8bb6be21e743af5aafb0249a84c29a7d9ff150d0d

build:
  number: 0
  skip:
    - win
  script:
    - cmake -B build -G Ninja
        ${CMAKE_ARGS}
        -DKDE_INSTALL_LIBDIR=lib
        -DBUILD_TESTING=OFF
    - cmake --build build
    - cmake --install build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - pkgconf
  host:
    - qt6-main >=6.8.0
    - extra-cmake-modules >=6.24.0
    - zlib
    - bzip2
    - liblzma-devel
    - openssl
    - zstd
  run:
    - qt6-main >=6.8.0
    - zlib
    - bzip2
    - liblzma-devel
    - openssl
    - zstd

tests:
  - package_contents:
      lib:
        - libKF6Archive

about:
  homepage: https://api.kde.org/karchive-index.html
  repository: https://invent.kde.org/frameworks/karchive
  documentation: https://develop.kde.org/docs/features/karchive/
  license: BSD-2-Clause AND LGPL-2.0-or-later
  license_file:
    - LICENSES/BSD-2-Clause.txt
    - LICENSES/LGPL-2.0-or-later.txt
  summary: KDE Frameworks 6 archive and compression library
  description: |
    KArchive (KF6 Archive) is a KDE Frameworks 6 library for reading and
    writing compressed and archived files (gzip, bzip2, xz, zstd, tar,
    zip, ...). This recipe provides the Qt 6 build of the framework,
    exposed through the KF6::Archive CMake target.
extra:
  recipe-maintainers:
    - claudiushaag
