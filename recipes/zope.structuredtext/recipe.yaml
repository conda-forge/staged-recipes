schema_version: 1

context:
  version: "6.0"

package:
  name: zope.structuredtext
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.structuredtext/zope_structuredtext-${{ version }}.tar.gz
  sha256: 3ec31e22459711dde25e0ee3dc744f2cb70ac77ab090776a11a901db4b7ab94f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.structuredtext
        - zope.structuredtext.document
        - zope.structuredtext.html
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest discover -v zope.structuredtext

about:
  homepage: https://github.com/zopefoundation/zope.structuredtext
  repository: https://github.com/zopefoundation/zope.structuredtext
  documentation: https://zopestructuredtext.readthedocs.io
  summary: StructuredText parser
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
