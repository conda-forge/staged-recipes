schema_version: 1

context:
  version: "6.0"

package:
  name: zope.structuredtext
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.structuredtext/zope_structuredtext-${{ version }}.tar.gz
  sha256: 3ec31e22459711dde25e0ee3dc744f2cb70ac77ab090776a11a901db4b7ab94f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.structuredtext
        - zope.structuredtext.document
        - zope.structuredtext.html
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      interpreter: python
      content: |
        import importlib, pkgutil, sys, unittest
        import zope.structuredtext as pkg
        loader = unittest.defaultTestLoader
        suite = unittest.TestSuite()
        for info in pkgutil.walk_packages(pkg.__path__, pkg.__name__ + "."):
            if info.name.rsplit(".", 1)[-1].startswith("test"):
                m = importlib.import_module(info.name)
                suite.addTest(m.test_suite() if hasattr(m, "test_suite") else loader.loadTestsFromModule(m))
        result = unittest.TextTestRunner(verbosity=2).run(suite)
        sys.exit(not result.wasSuccessful() or result.testsRun == 0)

about:
  homepage: https://github.com/zopefoundation/zope.structuredtext
  repository: https://github.com/zopefoundation/zope.structuredtext
  documentation: https://zopestructuredtext.readthedocs.io
  summary: StructuredText parser
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
