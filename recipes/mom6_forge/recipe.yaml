schema_version: 1

context:
  version: "0.3.1"

package:
  name: mom6_forge
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mom6_forge/mom6_forge-${{ version }}.tar.gz
  sha256: 4337dffd0afc1165e905b7f45fe8298b736c2582b24dbf0f3d2c390ff6e1dcfe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - setuptools
    - numpy
    - xarray
    - matplotlib-base
    - scipy
    - netcdf4
    - ipywidgets
    - cartopy
    - cf_xarray
    - xesmf
    - dask-core
    - regionmask
    - gitpython
    - git

tests:
  - python:
      imports:
        - mom6_forge
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: MOM6 simple grid and bathymetry generator
  license: Apache-2.0
  license_file: LICENSE.md
  homepage: https://github.com/NCAR/mom6_forge

extra:
  recipe-maintainers:
    - angus-g
