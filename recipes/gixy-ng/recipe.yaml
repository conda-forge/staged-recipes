context:
  version: "0.2.53"

package:
  name: gixy-ng
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gixy_ng/gixy_ng-${{ version }}.tar.gz
  sha256: 6dcc4175f48dd1edcc7a2a1def647f2689a465a511361b77b6f00c242f17c86a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - gixy = gixy.cli.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ngxparse >=0.5.16
    - jinja2 >=2.8
    - configargparse >=0.11.0

tests:
  - python:
      imports:
        - gixy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - gixy --version
      - gixy --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://gixy.getpagespeed.com/
  repository: https://github.com/dvershinin/gixy
  documentation: https://gixy.getpagespeed.com/
  summary: NGINX configuration static analyzer focused on security
  description: |
    Gixy is a static analyzer for nginx configurations. Its main goal
    is to detect security misconfigurations and to automate the
    discovery of common flaws: HTTP response splitting via tainted
    variables in proxy/redirect contexts, host spoofing on
    virtual-host dispatch, alias-traversal "off-by-slash"
    misconfigurations, missing add_header inheritance, weak SSL/TLS
    ciphers, and other patterns documented at the project site.

    This recipe tracks the actively-maintained `gixy-ng' PyPI
    distribution (the binary remains `gixy'), which ships fixes and
    additional plugins on top of the original Yandex upstream.
  license: MPL-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dvershinin
