schema_version: 1

context:
  version: "0.4.1"
  python_min: "3.11"

package:
  name: nvalchemi-toolkit-ops
  version: ${{ version }}

source:
  url: https://codeload.github.com/NVIDIA/nvalchemi-toolkit-ops/tar.gz/refs/tags/v${{ version }}
  sha256: 9035dc52230e65b6a736376ca476b8578b7c29337876e21512150aee7250d1ea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - numpy
    - warp-lang >=1.13.0

tests:
  - python:
      imports:
        - nvalchemiops
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "import nvalchemiops; assert nvalchemiops.__version__ == '${{ version }}'"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/NVIDIA/nvalchemi-toolkit-ops
  summary: High-performance NVIDIA Warp primitives for GPU-enabled computational chemistry and atomistic simulation workflows.
  description: |
    NVIDIA ALCHEMI Toolkit-Ops provides GPU-optimized, batched primitives for
    atomistic simulations, including neighbor lists, molecular dynamics,
    geometry optimization, dispersion, and electrostatics kernels.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://nvidia.github.io/nvalchemi-toolkit-ops/
  repository: https://github.com/NVIDIA/nvalchemi-toolkit-ops

extra:
  recipe-maintainers:
    - njzjz
