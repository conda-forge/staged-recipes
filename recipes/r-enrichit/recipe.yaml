schema_version: 1

context:
  version: "0.2.6"

package:
  name: r-enrichit
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/enrichit_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/enrichit/enrichit_${{ version }}.tar.gz
  sha256: 7e985cf6a10d63a2469e8db289d40ea1b2ba5c5bc6c5ecfb68cfb2c17f1268a7

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/
    missing_dso_allowlist:
      - if: win
        then:
          - "*/R.dll"
          - "*/Rblas.dll"
          - "*/Rlapack.dll"

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - cross-r-base ${{ r_base }}.*
        - r-matrix
        - r-rcpp >=1.0.10
        - r-rcppeigen
        - r-rlang
        - r-yulab.utils >0.2.1
    - if: not win
      then:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - make
    - if: win
      then:
        - ${{ compiler('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
        - ${{ stdlib('m2w64_c') }}
        - m2-filesystem
        - m2-make
        - m2-sed
        - m2-coreutils
        - m2-zip
  host:
    - r-base
    - r-matrix
    - r-rcpp >=1.0.10
    - r-rcppeigen
    - r-rlang
    - r-yulab.utils >0.2.1
  run:
    - r-base
    - r-matrix
    - r-rcpp >=1.0.10
    - r-rlang
    - r-yulab.utils >0.2.1

tests:
  - r:
      libraries:
        - enrichit

about:
  homepage: https://yulab-smu.top/biomedical-knowledge-mining-book/
  repository: https://github.com/YuLab-SMU/enrichit
  summary: "'C++' Implementations of Functional Enrichment Analysis"
  description: |
    Fast implementations of functional enrichment analysis methods using 'C++'
    via 'Rcpp': over-representation analysis (ORA), gene set enrichment
    analysis (GSEA), weighted ORA and GSEA, network-based set enrichment
    analysis, multi-omics integration, and Random Walk with Restart using
    'RcppEigen'. Used by clusterProfiler, DOSE and enrichplot.
  # src/esCalculation.* and src/gsea_multilevel* are adapted from fgsea (MIT)
  license: Artistic-2.0 AND MIT
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/Artistic-2.0
    - LICENSE-fgsea

extra:
  recipe-maintainers:
    - conda-forge/r
    - musharna
