schema_version: 1
package:
  name: interceptor-multilang
  version: 1.0.1
source:
  url: https://github.com/TitanCSA/Interceptor-MultiLang/archive/1351bdc9af75832bfd3178566fdb2f12bd9df29a.tar.gz
  sha256: c93e26052c5806f88640f86893626a509d4fc57285bda8cf6982bc5d1b020fed
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - interceptor
    pip_check: true
- script:
  - python -m pip check
  - python -c "from interceptor import Interceptor; io = Interceptor(); io.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/Interceptor-MultiLang
  summary: Windows x64 input driver Python SDK; driver installed separately
  description: 'Python bindings with a native bridge compiled from source. The matching Interceptor driver must be installed separately.

    Documentation, examples and license files are included in the package.

    '
  license: MIT
  license_file:
  - LICENSE
  documentation: https://github.com/TitanCSA/Interceptor-MultiLang
  repository: https://github.com/TitanCSA/Interceptor-MultiLang
extra:
  recipe-maintainers:
  - TitanCSA
