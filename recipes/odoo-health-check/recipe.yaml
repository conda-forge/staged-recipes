schema_version: 1

context:
  name: odoo-health-check
  version: "0.1.2"
  python_min: "3.10"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/odoo_health_check-${{ version }}.tar.gz
  sha256: 51a4caabad8018d09fd2d84cd574a281ef753d2d9c9dd5e9542c072bdcf1f514

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - odoo-health-check = odoo_health_check.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - odoo_health_check
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - odoo-health-check --help

about:
  homepage: https://www.jaikin.eu/integrateur-odoo-france
  summary: Audit a public Odoo website in one command (indexability, exposure, security headers, version).
  description: |
    odoo-health-check is a command-line tool that audits a public Odoo website:
    search-engine indexability (robots.txt and the common website domain
    misconfiguration), public exposure of the database manager, HTTPS/HSTS and
    security headers, detected Odoo version and sitemap. Pure Python, no
    dependencies. Maintained by JAIKIN, an Odoo integrator in France.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/Jaikin-SASU/odoo-health-check

extra:
  recipe-maintainers:
    - victorwhale
