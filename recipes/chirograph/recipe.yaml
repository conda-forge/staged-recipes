context:
  version: "0.2.1"

package:
  name: chirograph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chirograph/chirograph-${{ version }}.tar.gz
  sha256: 926d7674dd613d0a4d2684934d5152dd6361b9cc5d11c0c5de6d8ff9253750ad

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - chiro = chirograph.cli:main
      - chirograph = chirograph.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - chirograph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - chiro --help
      - chiro test-vectors --check

about:
  homepage: https://github.com/swarbricklab/chirograph
  summary: Portable, content-addressed manifests for scientific datasets
  description: |
    Chirograph describes a dataset's files, their checksums, and their provenance in
    a portable, content-addressed .chiro.json manifest, so any copy can be verified
    and any drift from it detected. The core is a zero-dependency reference
    implementation of the file format.
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/swarbricklab/chirograph/tree/main/docs
  repository: https://github.com/swarbricklab/chirograph

extra:
  recipe-maintainers:
    - johnyaku
