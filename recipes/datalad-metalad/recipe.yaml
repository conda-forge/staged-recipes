schema_version: 1
context:
  python_min: '3.10'
package:
  name: datalad-metalad
  version: 0.4.22
source:
  url: https://files.pythonhosted.org/packages/f9/4f/d0f0ce074bb8024bc47d02564bd75742dec91ad08220e7cac28c0b7a81e1/datalad_metalad-0.4.22.tar.gz
  sha256: 14c48598de4fd23298ac0b326f8d9d1b215fef756d67dd4d173108cedbad1756
build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -v
requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools
  - wheel
  run:
  - python >=${{ python_min }}
  - datalad >=0.18
  - datalad-metadata-model >=0.3.10
  - datalad-deprecated
  - pytest
  - pyyaml
tests:
- python:
    imports:
    - datalad_metalad
    pip_check: true
about:
  homepage: https://github.com/datalad/datalad-metalad
  summary: DataLad extension for semantic metadata handling
  license: MIT
  license_file: COPYING
extra:
  recipe-maintainers:
  - Shavindra
