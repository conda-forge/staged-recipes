# The deephaven-core monorepo may tag more than what the Python client releases.
# The default tag-based sources would pick these up. githubreleases only follows
# /releases/latest (a published, non-draft, non-prerelease Release).
bot:
  version_updates:
    sources:
      - githubreleases
    allowed_tag_globs:
      - "v[0-9]*.[0-9]*"
