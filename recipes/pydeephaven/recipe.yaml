context:
  version: "42.6"

package:
  name: pydeephaven
  version: ${{ version }}

source:
  url: https://github.com/deephaven/deephaven-core/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9ffb349a5495909c7c0e6fe2958b084eed6a514f1103024e44a1a33a6e4da5fb

build:
  noarch: python
  number: 0
  script:
    content:
      - cd py/client
      - python -m pip install . -vv
    env:
      # setup.py requires DEEPHAVEN_VERSION to compute the package version.
      DEEPHAVEN_VERSION: ${{ version }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=64
    - wheel
    # setup.py imports packaging directly; it is not declared in pyproject.toml.
    - packaging
  run:
    - python >=3.9
    - pyarrow
    # pydeephaven unconditionally imports pyarrow.flight, which the pyarrow
    # metapackage does not pull in on its own.
    - libarrow-flight
    - bitstring
    - grpcio
    - protobuf
    - numpy
    - pandas

tests:
  - python:
      imports:
        - pydeephaven
        - deephaven_core
      pip_check: true

about:
  homepage: https://deephaven.io/
  summary: The Deephaven Python Client
  description: |
    pydeephaven is the Deephaven Python Client. It is a client API that
    allows Python applications to remotely connect to and interact with a
    Deephaven server over gRPC: running queries, creating and manipulating
    tables, and streaming data to and from the server.
  license: LicenseRef-Deephaven-Community-License-1.0
  license_file: LICENSE.md
  documentation: https://deephaven.io/core/client-api/python/
  repository: https://github.com/deephaven/deephaven-core

extra:
  recipe-maintainers:
    - pb01ka
