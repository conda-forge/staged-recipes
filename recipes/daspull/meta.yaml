{% set name = "daspull" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/daspull-{{ version }}.tar.gz
  sha256: 7e1adc4b287d0e6e37391f4e6f40e76fb967f50c4cff475ff878ef0421da933d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - daspull = daspull.cli:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - requests >=2.31
    - tqdm >=4.66
    - pyyaml >=6
    - certifi >=2023

test:
  imports:
    - daspull
  commands:
    - daspull --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/konietse/daspull
  summary: Simple, dependency-light downloader for Distributed Acoustic Sensing (DAS) data - no Globus required.
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/konietse/daspull#readme
  dev_url: https://github.com/konietse/daspull

extra:
  recipe-maintainers:
    - konietse
