schema_version: 1

context:
  version: 0.3.7

package:
  name: pyfvs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyfvs/pyfvs-${{ version }}.tar.gz
  sha256: 43afe8edd712a5e76c261a047c8329ebc554dffa60b3de568beee068f485c639

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . --no-build-isolation --no-deps -vv --config-settings=setup-args="-Dbuildtype=release" --config-settings=setup-args="-Dfvsvariants=pn,wc,so,op,oc,ec,ca,nc,bm,ie,ci,ak,ws"


requirements:
  build:
    - meson
    - ninja
    - python
    - setuptools-scm
    
    # Non-Windows targets use the default UNIX toolchain
    - if: linux
      then:
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
        - ${{ stdlib('c') }}
        - patchelf

        
    # Windows targets explicitly pull the GNU MinGW/m2w64 tools
    - if: win
      then:
        - ${{ compiler('m2w64_cxx') }}
        - ${{ compiler('m2w64_fortran') }}
        - ${{ stdlib('m2w64_c') }}

    # macOS targets force GNU compilers instead of Clang
    - if: osx
      then:
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
        - ${{ stdlib('c') }}

  host:
    - python
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
    - meson-python >=0.20.0
    - numpy
    
  run:
    - python
    - confuse
    - click
    - pandas
    - numpy
    - typing_extensions

tests:
  - python:
      imports:
        - pyfvs
      pip_check: true
  - script:
      - python -c "import pyfvs;print(list(pyfvs.list_variants().keys()))"

about:
  summary: Python wrappers and utilities for using the Forest Vegetation Simulator
  license: MIT AND ISO-permission
  license_file:
    - LICENSE
    - fvs/license.txt
  homepage: https://github.com/forest-modeling/PyFVS

extra:
  recipe-maintainers:
    - tharen
