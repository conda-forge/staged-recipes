schema_version: 1

context:
  version: 0.3.7

package:
  name: pyfvs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyfvs/pyfvs-${{ version }}.tar.gz
  sha256: 43afe8edd712a5e76c261a047c8329ebc554dffa60b3de568beee068f485c639

build:
  number: 0
  script:
  - if: win
    then: |
      set "PATH=%BUILD_PREFIX%\Library\bin;%PATH%"

      echo === CC=%CC%
      echo === CXX=%CXX%
      echo === FC=%FC%
      where x86_64-w64-mingw32-gcc.exe || echo === prefixed gcc NOT FOUND
      where gcc.exe                    || echo === plain gcc NOT FOUND
      where gfortran.exe               || echo === plain gfortran NOT FOUND
      if defined CC ( "%CC%" --version || echo === CC FAILED TO RUN )

      meson setup _dbg -Dfvsvariants=pn || type _dbg\meson-logs\meson-log.txt
      
      :: Prevent Meson to use ninja instead of vs
      ${{ PYTHON }} -m pip install . --no-build-isolation --no-deps -vv -Csetup-args="--backend=ninja" --config-settings=setup-args="-Dbuildtype=release" --config-settings=setup-args="-Dfvsvariants=pn"

  - if: not win
    then: |
      ${{ PYTHON }} -m pip install . --no-build-isolation --no-deps -vv --config-settings=setup-args="-Dbuildtype=release" --config-settings=setup-args="-Dfvsvariants=pn"

requirements:
  build:
    - meson
    - ninja
    - python
    - setuptools-scm

    - if: not win
      then:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
        - ${{ stdlib('c') }}

    - if: win
      then:
        - m2w64-toolchain
        - m2w64-gcc-fortran
        - ${{ compiler('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
        - ${{ compiler('m2w64_fortran') }}
        - ${{ stdlib('m2w64_c') }}

    # Non-Windows targets use the default UNIX toolchain
    - if: linux
      then:
        - patchelf

  host:
    - python
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
    - meson-python >=0.20.0
    - numpy
    
  run:
    - python
    - confuse
    - click
    - pandas
    - numpy
    - typing_extensions

tests:
  - python:
      imports:
        - pyfvs
      pip_check: true
  - script:
      - python -c "import pyfvs;print(list(pyfvs.list_variants().keys()))"

about:
  summary: Python wrappers and utilities for using the Forest Vegetation Simulator
  license: MIT AND ISO-permission
  license_file:
    - LICENSE
    - fvs/license.txt
  homepage: https://github.com/forest-modeling/PyFVS

extra:
  recipe-maintainers:
    - tharen
