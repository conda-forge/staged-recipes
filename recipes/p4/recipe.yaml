schema_version: 1

context:
  version: "1.0.0"
  python_min: "3.12"

package:
  name: p4
  version: ${{ version }}

source:
  url: https://github.com/glotzerlab/p4/releases/download/v${{ version }}/p4-v${{ version }}.zip
  sha256: 9db2af4760a13335d309b61c454f3762d4fcae55da6be8a1c0cde07d037ad2ba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.0
  run:
    - python >=${{ python_min }}
    - hoomd >=5.0.0
    - gsd >=4.2.0
    - coxeter >=0.10.0
    - rowan >=1.3.2
    - numpy >=2.3.5
    - plotly >=6.6.0
    - tqdm >=4.68.3

tests:
  - python:
      imports:
      - p4
      pip_check: true
      python_version: ${{ python_min }}.*

  - script:
    - pytest test -v
    requirements:
      run:
        - pytest >=9.0.2
        - scipy >=1.16.3

about:
  homepage: https://github.com/glotzerlab/p4
  license: BSD-3-Clause
  license_file: LICENSE

  summary: "Evaluate particle interaction models with HOOMD-blue and Plotly"
  
  description: |
    p4 is a package for creating and analyzing models of particles and their
    interactions, based on HOOMD-blue and Plotly. Users can measure energy,
    force, and torque fields created by rigid bodies of particles interacting
    via pairwise potentials, and then interactively plot those bodies and
    fields in 3D, 2D, or 1D.

  documentation: https://p4-hoomd.readthedocs.io/en/latest
  repository: https://github.com/glotzerlab/p4

extra:
  recipe-maintainers:
    - josephburkhart
    - joaander
