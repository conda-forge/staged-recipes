context:
  version: "0.1.0"

package:
  name: emaki
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/emaki/emaki-${{ version }}.tar.gz
  sha256: 9c9af7c1d1212fc4092b0cde4e6526e1c242a9296442ec90fe1bd6033b071e32

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - emaki
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://emaki.ai
  summary: Python SDK and CLI for Emaki (Seedance 2.5 and 2.0 AI video generation)
  description: |
    Zero-dependency Python client and CLI for Emaki (emaki.ai), a Japanese-language
    AI video generation platform supporting Seedance 2.5, Seedance 2.5 Flash, and
    Seedance 2.0 text-to-video and image-to-video generation.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/hanshs474/emaki-py
  documentation: https://emaki.readthedocs.io/

extra:
  recipe-maintainers:
    - hanshs474
