context:
  version: "0.1.2"

package:
  name: aiida-dlpoly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiida-dlpoly/aiida_dlpoly-${{ version }}.tar.gz
  sha256: bed9738bd73796b9fdc3f971d498fd5a17bcf47d6de5312fbaed9d44d79199a0

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiida-core >=2.5
    - numpy
    - ruamel.yaml

tests:
  - python:
      imports:
        - aiida_dlpoly
        - aiida_dlpoly.calculations.base
        - aiida_dlpoly.parsers.base
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - aiida-dlpoly --help

about:
  homepage: https://github.com/stfc/aiida-dlpoly
  summary: AiiDA workflow plugin for the DL_POLY molecular dynamics software package
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/stfc/aiida-dlpoly

extra:
  recipe-maintainers:
    - BTSpeake
