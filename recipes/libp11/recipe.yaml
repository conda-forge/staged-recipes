context:
  name: libp11
  version: "0.4.21"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/OpenSC/libp11/releases/download/libp11-${{ version }}/libp11-${{ version }}.tar.gz
  sha256: efdb523aef8613d447e6a2d38227d4b389866f4bcf4b503130acd7f759490847

build:
  number: 0
  skip:
    - win
    - osx
  script:
    - ./configure --prefix=$PREFIX
    - make
    - make install

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - pkgconf
  host:
    - openssl
  run:
    - openssl

tests:
  - package_contents:
      lib:
        - libp11.so

about:
  homepage: https://github.com/OpenSC/libp11
  license: LGPL-2.1-or-later
  license_file: COPYING
  summary: High-level wrapper around the PKCS#11 API
  description: |
    libp11 is a library that provides a high-level API to the PKCS#11
    standard API. It wraps PKCS#11 tokens and keys and exposes them through
    an OpenSSL-compatible interface, for example as an OpenSSL engine or
    provider.
extra:
  recipe-maintainers:
    - claudiushaag
