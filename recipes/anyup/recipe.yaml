context:
  name: anyup
  # Upstream has not tagged a release; version comes from pyproject.toml
  version: "0.1.0"
  commit: 351807a9c4287368732cc247f26c7c81c9139af4
  python_min: "3.10"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/wimmerth/anyup/archive/${{ commit }}.tar.gz
  sha256: 8966bf78f7f7444eaad415b57c8e8fde76acf1ef0b15e51d02925ab358df9778

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    # PEP 639 license expression in pyproject.toml
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - hydra-core
    - matplotlib-base
    - numpy
    - pytorch
    - rich
    - scikit-learn
    - tensorboard
    - timm
    - torchvision
  # natten is an optional extra enabling the faster NATTEN attention block;
  # it is only built for linux with CUDA, so it is not a hard dependency

tests:
  - python:
      imports:
        - anyup
        - anyup.model
        - anyup.backbone
        - anyup.utils.training
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://wimmerth.github.io/anyup/
  summary: 'AnyUp: Universal Feature Upsampling'
  description: |
    AnyUp is a method for feature upsampling that can be applied to any
    vision feature at any resolution, without encoder-specific training.
  license: CC-BY-4.0
  license_file: LICENSE
  repository: https://github.com/wimmerth/anyup

extra:
  recipe-maintainers:
    - hmaarrfk
