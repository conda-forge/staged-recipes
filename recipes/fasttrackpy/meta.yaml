{% set name = "fasttrackpy" %}
{% set version = "0.6.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5c975cf8c90e374aa703102d03d8869d9b64024a7018eae7c8615a06407eda28

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - fasttrack = fasttrackpy.cli:fasttrack

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - uv-build >=0.10.0,<0.11.0
  run:
    - python >={{ python_min }},<3.14
    - aligned-textgrid >=0.8.1
    - click >=8.3.1
    - cloudpickle >=3.1.2
    - cloup >=3.0.8
    - filetype >=1.2.0
    - joblib >=1.5.3
    - matplotlib-base >=3.10.8
    - numba >=0.61.0
    - polars >=1.38.1
    - praat-parselmouth >=0.4.7
    - pyyaml >=6.0.3
    - scipy >=1.15.3
    - tqdm >=4.67.3

test:
  imports:
    - fasttrackpy
  commands:
    - pip check
    - fasttrack --help
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://fasttrackiverse.github.io/fasttrackpy/
  summary: A python implementation of FastTrack
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - IvoLeist
