schema_version: 1
context:
  python_min: '3.14'
package:
  name: shacl-py
  version: 0.4.1b0
source:
  url: https://files.pythonhosted.org/packages/b4/5d/d41813f2b5915143c60875509b85e1071b45965fc396e9f11a09dc1f71bf/shacl_py-0.4.1b0.tar.gz
  sha256: 011d183b6d768023bb785634e5b9e639c402ae3caa4a9c3d75c0581869bbc70a
build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -v
  python:
    entry_points:
    - shacl-py = shacl_py.cli:main
requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - hatchling
  run:
  - python >=${{ python_min }}
  - filelock <4,>=3.12
  - datalad-metalad <0.5,>=0.4.22
  - streamlit <2,>=1.55
  - pyyaml <7,>=6
  - jsonschema <5,>=4.26
  - ruamel.yaml <0.20,>=0.18.6
tests:
- python:
    imports:
    - shacl_py
    pip_check: true
- script:
  - shacl-py --help
about:
  homepage: https://github.com/Shavindra/shacl-py
  summary: Minimal Python viewer for DataLad Concepts metadata
  license: MIT AND CC-BY-4.0
  license_file:
  - LICENSE
  - src/shacl_py/schemas/CONCEPTS-LICENSE
  - src/shacl_py/schemas/PROVENANCE.md
extra:
  recipe-maintainers:
  - Shavindra
