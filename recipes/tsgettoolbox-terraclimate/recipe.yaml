context:
  version: 27.0.0

package:
  name: tsgettoolbox-terraclimate
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-terraclimate/tsgettoolbox_terraclimate-${{ version }}.tar.gz
  sha256: 23c5191abd356f6afb13ebc4c7f3c3f01c5dca9a50f94644ca82769a5092ad54

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - pandas
  - tsgettoolbox >=27.0.0

tests:
  - python:
      imports:
      - tsgettoolbox_terraclimate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Plugin for tsgettoolbox to access TerraClimate data.
  description: |
    The 'tsgettoolbox_terraclimate' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    Terraclimate project.
  homepage: https://pypi.org/project/tsgettoolbox-terraclimate/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
