context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-terraclimate
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-terraclimate/tsgettoolbox_terraclimate-${{ version }}.tar.gz
  sha256: 23c5191abd356f6afb13ebc4c7f3c3f01c5dca9a50f94644ca82769a5092ad54

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools>=80
  - pip
  run:
  - python >=3.10
  - pandas
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_terraclimate
    pip_check: true

