schema_version: 1

context:
  version: "0.4.0"

package:
  name: nxselector
  version: ${{ version }}

source:
  url: https://github.com/lavue-org/qtchecker/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8011591cb871d6abed1f73216e6af5b1c3f08e5835c832084e001b9842228be8

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip 
    - wheel
  run:
    - python >=${{ python_min }}
    - pyqt >=5.15,<6

tests:
  - python:
      imports:
        - qtchecker

      python_version:
        - ${{ python_min }}.*
        - "*"


about:
  homepage: https://github.com/lavue-org/qtchecker
  repository: https://github.com/lavue-org/qtchecker
  license: GPL-2.0-or-later
  license_file: COPYRIGHT
  summary: Qt Checker
  description: |
    Qt Checker is a simple helper module to perform PyQt GUI tests

extra:
  recipe-maintainers:
    - jkotan
