context:
  version: "1.0.2"

package:
  name: jupyterlab-cursor-light
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-cursor-light/jupyterlab_cursor_light-${{ version }}.tar.gz
  sha256: 279b017f416f04708f53669bd6b83f8801399b9fe50ec79b9665b2271762e9ec

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - hatch-jupyter-builder >=0.5
    - hatch-nodejs-version >=0.3.2
    - jupyterlab >=4.0.0,<5
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jupyterlab_cursor_light
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - package_contents:
      files:
        - share/jupyter/labextensions/jupyterlab-cursor-light/package.json

about:
  homepage: https://github.com/jtpio/jupyterlab-cursor-theme
  summary: JupyterLab light theme with Cursor vibes
  description: |
    A JupyterLab light theme with Cursor vibes, shipped as a prebuilt extension.
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/jtpio/jupyterlab-cursor-theme

extra:
  recipe-maintainers:
    - SylvainCorlay
