schema_version: 1

context:
  name: nats-server
  version: "2.15.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/nats-io/nats-server/archive/v${{ version }}.tar.gz
  sha256: 24ce9fe9a069d049f6050231b81f2c9e00ad4f456801c002fb9a5bf15ebd6cc2

build:
  number: 0
  script:
    env:
      GOTOOLCHAIN: local   # never auto-download a newer Go toolchain
      CGO_ENABLED: "0"
    content:
      - if: unix
        then:
          - go build -trimpath -ldflags="-s -w" -o ${PREFIX}/bin/nats-server .
        else:
          - go build -trimpath -ldflags="-s -w" -o %LIBRARY_BIN%\nats-server.exe .
      - go-licenses save . --save_path=library_licenses --ignore=github.com/nats-io/nats-server/v2

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - package_contents:
      bin:
        - nats-server
  - script:
      - nats-server --version

about:
  homepage: https://nats.io
  repository: https://github.com/nats-io/nats-server
  documentation: https://docs.nats.io
  summary: High-performance server for NATS.io, the cloud and edge native messaging system
  description: |
    NATS is a simple, secure and performant communications system for digital
    systems, services and devices. nats-server is the Go implementation of the
    NATS server, including JetStream persistence.
  license: Apache-2.0
  license_file:
    - LICENSE
    - library_licenses/

extra:
  recipe-maintainers:
    - carlodri
