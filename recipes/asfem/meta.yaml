{% set version = "0.9" %}
{% set commit = "738277f34a5fb0968b25d440736c58968fabcb89" %}
{% set build = 0 %}
{% set mpi_prefix = "mpi_" + mpi %}

package:
  name: asfem
  version: "{{ version }}"

source:
  url: https://github.com/MatMechLab/AsFem/archive/{{ commit }}.tar.gz
  sha256: 0b6f3d0bc16e0afe1d5a344aa884c2c247ec89ef2a3e9cb03a1b82ee1b1ff118

build:
  number: {{ build }}
  string: {{ mpi_prefix }}_h{{ PKG_HASH }}_{{ build }}
  skip: true  # [not linux]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
    - pkg-config
  host:
    - {{ mpi }}
    - eigen
    - metis
    - nlohmann_json
    - petsc 3.24.*
  run:
    - {{ mpi }}

test:
  commands:
    - asfem -i "$PREFIX/share/asfem/examples/tutorial/step1-2d.json" --read-only
    - asfem -i "$PREFIX/share/asfem/examples/tutorial/step2-2d.json"

about:
  home: https://github.com/MatMechLab/AsFem
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Advanced Simulation kit based on Finite Element Method
  doc_url: https://matmechlab.github.io/AsFem/
  dev_url: https://github.com/MatMechLab/AsFem

extra:
  recipe-maintainers:
    - yangbai90
