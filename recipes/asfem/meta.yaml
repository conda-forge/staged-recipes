{% set version = "0.9" %}
{% set build = 0 %}
{% set mpi_prefix = "mpi_" + mpi %}

package:
  name: asfem
  version: "{{ version }}"

source:
  url: https://github.com/MatMechLab/AsFem/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 4e77077faccfe3141d9c43dd685163950749e1e505371d1f87bef5d7ef8a6d41
  patches:
    - 0001-initialize-ksp-allocation-state.patch

build:
  number: {{ build }}
  string: {{ mpi_prefix }}_h{{ PKG_HASH }}_{{ build }}
  skip: true  # [not linux]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
    - pkg-config
  host:
    - {{ mpi }}
    - eigen
    - metis
    - nlohmann_json
    - petsc
  run:
    - {{ mpi }}
    - petsc

test:
  commands:
    - asfem -i "$PREFIX/share/asfem/examples/tutorial/step1-2d.json" --read-only
    - asfem -i "$PREFIX/share/asfem/examples/tutorial/step2-2d.json"

about:
  home: https://github.com/MatMechLab/AsFem
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Advanced Simulation kit based on Finite Element Method
  doc_url: https://matmechlab.github.io/AsFem/
  dev_url: https://github.com/MatMechLab/AsFem

extra:
  recipe-maintainers:
    - yangbai90
