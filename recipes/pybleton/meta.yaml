{% set version = "0.1.0" %}

package:
  name: pybleton
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pybleton/pybleton-{{ version }}.tar.gz
  sha256: ab889aed633bfcc5b7f2da0830b58b7977b3f9c97aa5d5062bacd2d9d9f65525

build:
  entry_points:
    - pybleton = pybleton.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - pydantic >=2.0.0
    - python-osc >=1.8.3

test:
  imports:
    - pybleton
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/pybleton/
  summary: Modern Python SDK & FastMCP Server for Ableton Live
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - whs2k
