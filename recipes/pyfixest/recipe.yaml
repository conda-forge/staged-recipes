context:
  version: "0.60.0"

package:
  name: pyfixest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyfixest/pyfixest-${{ version }}.tar.gz
  sha256: ec4f4759b5b53c19aaf6ea81ddc745d57c7c8c5577f8d859a2fc9ca2c73e3aa7

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -v
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.8,<2
  run:
    - python >=3.10
    - formulaic >=1.1.0
    - joblib >=1.4.2
    - maketables >=0.1.0
    - narwhals >=1.13.3
    - numpy >=1.25.2
    - pandas >=1.1.0
    - scipy >=1.6
    - seaborn >=0.13.2
    - tabulate >=0.9.0
    - tqdm >=4.0.0

tests:
  - python:
      imports:
        - pyfixest
        - pyfixest.core._core_impl
      pip_check: true
  - script:
      - python -c "import pyfixest; assert pyfixest.__version__ == '0.60.0'; assert callable(pyfixest.feols)"

about:
  homepage: https://pyfixest.com
  repository: https://github.com/py-econometrics/pyfixest
  documentation: https://pyfixest.com
  summary: Fast high-dimensional fixed-effect estimation
  license: MIT
  license_file:
    - LICENSE.md
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - EinarOlafsson
