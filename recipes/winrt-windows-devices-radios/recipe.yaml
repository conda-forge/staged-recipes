context:
  version: "4!10.0.28000.2957"

package:
  name: winrt-windows-devices-radios
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/winrt-windows-devices-radios/winrt_windows_devices_radios-${{ version }}.tar.gz
  sha256: 27e336bee43b941742b65a66b848735b3eb92ff41436e92dfe87805bd008a084

build:
  number: 0
  # Pure-Python projection, but it only works on Windows (it needs winrt-runtime).
  skip:
    - not win
    - match(python, "<3.11")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling
    - winrt-table-compiler >=4,<5
  run:
    - python
    - winrt-runtime >=4.0.0,<5
    - winrt-windows-foundation-collections >=${{ version }}
    - winrt-windows-foundation >=${{ version }}

tests:
  - python:
      imports:
        - winrt.windows.devices.radios
      pip_check: true

about:
  summary: PyWinRT projection of the Windows.Devices.Radios namespace
  homepage: https://github.com/pywinrt/pywinrt
  repository: https://github.com/pywinrt/pywinrt
  documentation: https://pywinrt.readthedocs.io
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
