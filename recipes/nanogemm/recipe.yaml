context:
  name: nanogemm
  version: "0.3.6"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nanogemm/nanogemm-${{ version }}.tar.gz
  sha256: f0527251635a05ef822d1c3458ca01df34a93479a6211be87555acd71ab99f10

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    - numpy
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - nanogemm
      pip_check: true

about:
  homepage: https://github.com/eminsk/nanogemm
  summary: Minimalist, bare-metal SIMD & Assembly GEMM engine for Python
  description: |
    Minimalist, bare-metal General Matrix Multiplication (GEMM) engine
    designed for sub-microsecond CPU inference and scientific computing.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/nanogemm
  documentation: https://github.com/eminsk/nanogemm#readme

extra:
  recipe-maintainers:
    - eminsk
