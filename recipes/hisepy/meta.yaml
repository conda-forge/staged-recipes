{% set version = "1.15.26.dev1" %}
{% set name = "hisepy" %}

package:
  name: hisepy
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/h/hisepy/hisepy-1.15.26.dev1.tar.gz
  sha256: bcd2c795ee6d9105316fa9152ce042eac395825f9d545dcdde70bf07cf5355c2

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.9
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >=3.9
    - pandas >=2.2.3
    - numpy >=1.26.4
    - pyyaml >=6.0.2
    - plotly >=5.23.0
    - dash >=2.17.0
    - python-kaleido >=0.2.1
    - google-cloud-storage >=2.16.0
    - requests >=2.32.3
    - h5py >=3.12.1
    - pyreadr >=0.5.3
    - psutil >=7.0.0
    - termcolor >=2.3.0
    - ray >=2.44.1
    - astor >=0.8.1
    - ipython >=9.5.0
    - tomli-w >=1.2.0
    - google-genai >=1.73.1

test:
  imports:
    - hisepy
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/aifimmunology/hisepy
  summary: Python Interface to the Allen Institute For Immunology's Human Immune System Explorer (HISE)
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jamesdharv
