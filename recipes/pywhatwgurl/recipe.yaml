schema_version: 1

context:
  version: "0.1.2"

package:
  name: pywhatwgurl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pywhatwgurl/pywhatwgurl-${{ version }}.tar.gz
  sha256: 762078828fd7df601b5fcc03800080f6b5d8f88e797e9bb210636d46e929a672

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - idna >=3.4

tests:
  - python:
      imports:
        - pywhatwgurl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Pure Python implementation of the WHATWG URL Standard.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pywhatwgurl/
  documentation: https://pywhatwgurl.github.io/pywhatwgurl

extra:
  recipe-maintainers:
    - synapticarbors
