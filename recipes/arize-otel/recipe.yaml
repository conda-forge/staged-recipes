context:
  version: "0.14.1"

package:
  name: arize-otel
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/arize-otel/arize_otel-${{ version }}.tar.gz
  sha256: 1d609d35b21a2538307fe293a8193d876159d8f669cb76befee98f543db53875

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }},<3.15
    - openinference-instrumentation >=0.1.56
    - openinference-semantic-conventions >=0.1.5
    - opentelemetry-sdk >=1.22
    - opentelemetry-exporter-otlp >=1.22
    - opentelemetry-proto >=1.12.0
    - requests >=2,<3

tests:
  - python:
      imports:
      - arize.otel
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://arize.com
  summary: OpenTelemetry tracing helpers for Arize
  description: |
    arize-otel provides Arize-aware OpenTelemetry defaults for instrumenting
    LLM applications and exporting their traces to Arize.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://arize.com/docs/ax/instrument/what-are-traces
  repository: https://github.com/Arize-ai/arize-otel-python

extra:
  recipe-maintainers:
    - pb01ka
