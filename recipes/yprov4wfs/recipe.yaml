schema_version: 1

context:
  version: "0.0.8"

package:
  name: yprov4wfs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yprov4wfs/yprov4wfs-${{ version }}.tar.gz
  sha256: 9e05b9a84f6a1cd240880a43fe8212f2e26818e54b2e5746abe4e1b9d579c152

build:
  number: 0
  noarch: python
  script:
    env:
      # setup.py reads README.md without an explicit encoding, so Python falls
      # back to the locale encoding. That is cp1252 on Windows, which cannot
      # decode the UTF-8 README. Reported upstream:
      # https://github.com/HPCI-Lab/yProv4WFs
      PYTHONUTF8: "1"
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - yprov4wfs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A module for tracking the provenance of a workflow using a Workflow Management System.
  # NOTE TO ANYONE UPDATING THIS RECIPE: the license changed after 0.0.8.
  # 0.0.8 is GPL-3.0 consistently (LICENSE, setup.py and PKG-INFO all agree).
  # Upstream relicensed to Apache-2.0 on 2025-11-07, after 0.0.8 was released,
  # so any version newer than 0.0.8 needs `license` updated here.
  # Be careful: that relicense only touched the LICENSE file. As of tag v0.1.2
  # the LICENSE is Apache-2.0 but pyproject.toml and setup.py still declare
  # GPLv3, so the two disagree. Check both before changing this field.
  # (Newer versions are also GitHub-only -- PyPI has had nothing past 0.0.8
  # since 2025-04-30 -- and declare version 0.0.9 even at tag v0.1.2.)
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/HPCI-Lab/yProv4WFs

extra:
  recipe-maintainers:
    - martinRenou
    - arjxn-py
