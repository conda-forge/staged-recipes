context:
  version: "0.3.0"
  python_min: "3.9"

package:
  name: ponys-ai-resources
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/ponys-ai-resources/ponys_ai_resources-${{ version }}.tar.gz
  sha256: 6ce8540e1c4ff71611df9c017e3ca5d915e4ecbbfb5c72f772def288baf164cc

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ponys_ai_resources
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "from ponys_ai_resources import characters, product_url; assert len(characters()) == 104; assert product_url() == 'https://ponys.ai/'"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://ponys.ai/
  summary: Official Ponys.ai product-link and multilingual-feed helpers
  description: |
    Ponys AI Resources provides dependency-free Python helpers for resolving
    official product links, reading a bundled audited character catalog, and
    locating public multilingual feeds. It does not call a private API.
  license: MIT
  license_file: LICENSE
  documentation: https://feeds.ponys.ai/integrations/
  repository: https://github.com/wujoe132/ponys-ai-resources-python

extra:
  recipe-maintainers:
    - wujoe132
