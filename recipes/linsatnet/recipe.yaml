context:
  version: "0.1.3"

package:
  name: linsatnet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/L/LinSATNet/LinSATNet-${{ version }}.tar.gz
  sha256: 53b4e42571e00c425511d7d74347404e703d45b093a01d9740e3e68a20388876

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytorch >=1.0.0

tests:
  - python:
      imports:
        - LinSATNet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Thinklab-SJTU/LinSATNet
  summary: A neural network layer enforcing positive linear constraints on network outputs
  license: MIT
  license_file: LICENSE
  repository: https://github.com/Thinklab-SJTU/LinSATNet

extra:
  recipe-maintainers:
    - RJMW
