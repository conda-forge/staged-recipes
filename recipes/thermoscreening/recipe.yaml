schema_version: 1

context:
  name: thermoscreening
  version: "0.2.2"
  python_min: "3.12"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8aade10e020225fbbdb2d90fefaf38f9b34f14f88a74f57a8eaafd4eded795ab

build:
  number: 0
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - thermo = ThermoScreening.cli.thermo:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.26
    - scipy
    - pymatgen-core >=2026.5.18
    - beartype
    - ase
    - rdkit
    - pqanalysis >=1.3.0

tests:
  - python:
      python_version: ["${{ python_min }}.*", "*"]
      imports:
        - ThermoScreening
        - ThermoScreening.thermo
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - thermo --help

about:
  homepage: https://github.com/MolarVerse/ThermoScreening
  documentation: https://molarverse.github.io/ThermoScreening/
  repository: https://github.com/MolarVerse/ThermoScreening
  license: LGPL-2.1-or-later
  license_file: LICENSE
  summary: Thermochemical property calculation and screening for molecular systems.
  description: |
    ThermoScreening calculates thermochemical properties for molecular systems
    with DFTB+ and xTB backends. It provides conformer generation, batch
    screening, and post-processing for reaction/redox free energies and
    conformer-ensemble (Boltzmann) thermochemistry.

extra:
  recipe-maintainers:
    - galjos
