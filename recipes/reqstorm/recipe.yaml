context:
  version: "2.4.1"

package:
  name: reqstorm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/reqstorm/reqstorm-${{ version }}.tar.gz
  sha256: c4814af54182ad8959f49e5483cc3ccde0a5e4011f0a14b391dd4b8beff04ae1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - reqstorm = reqstorm._cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.9,<4
  run_constraints:
    - aiohttp-socks >=0.10
    - pydantic >=2

tests:
  - python:
      imports:
        - reqstorm
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - reqstorm --version
      - reqstorm --help
      - python -c "import reqstorm; print(reqstorm.estimate(7000, rate_limit='100/min'))"

about:
  homepage: https://reqstorm.github.io
  summary: Send thousands of HTTP requests with rate limits, retries, pagination, progress and logs
  description: |
    reqstorm sends large numbers of HTTP requests concurrently from Python or the
    command line and gives one result per request. Per-host rate limits (including
    following the server's 429 responses), retries with capped exponential backoff,
    pagination, token refresh, caching, proxies, progress and logging are built in,
    and results can be written to JSON Lines, CSV, SQLite, PostgreSQL or MySQL.
  license: MIT
  license_file: LICENSE
  documentation: https://reqstorm.github.io
  repository: https://github.com/melihcolpan/reqstorm

extra:
  recipe-maintainers:
    - melihcolpan
