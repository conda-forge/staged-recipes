context:
  version: "0.93.5"

package:
  name: gh-aw
  version: ${{ version }}

source:
  - url: https://github.com/github/gh-aw/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 2bc903b2c9c7f5eac3e556c7c903d51c1bee38db3a181b03b37946a1a09d3783
    target_directory: src
  - url: https://raw.githubusercontent.com/inconshreveable/mousetrap/v1.1.0/LICENSE
    sha256: 4819582701f150b28a563a6cd8ed0bf5a754e3c67b90ad38d78ba4131bf77795
    file_name: LICENSE-mousetrap

build:
  number: 0
  script:
    - cd src
    - go-licenses save ./cmd/gh-aw --save_path ../library_licenses --ignore github.com/inconshreveable/mousetrap
    - if: unix
      then: go build -v -trimpath -o $PREFIX/bin/gh-aw -ldflags="-s -w -X main.version=v${{ version }} -X main.isRelease=true" ./cmd/gh-aw
      else: go build -v -trimpath -o %LIBRARY_BIN%\gh-aw.exe -ldflags="-s -X main.version=v${{ version }} -X main.isRelease=true" ./cmd/gh-aw

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - gh-aw --help
      - gh-aw version
  - package_contents:
      bin:
        - gh-aw
      strict: true

about:
  homepage: https://github.github.com/gh-aw/
  summary: GitHub Agentic Workflows
  description: |
    gh-aw is a gh CLI extension for GitHub Agentic Workflows: write agentic
    workflows in natural language markdown and run them in GitHub Actions.
  license: MIT
  license_file:
    - src/LICENSE
    - library_licenses/
    - LICENSE-mousetrap
  documentation: https://github.github.com/gh-aw/
  repository: https://github.com/github/gh-aw

extra:
  recipe-maintainers:
    - pavelzw
