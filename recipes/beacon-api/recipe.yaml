schema_version: 1

context:
  python_min: "3.10"
  version: "1.3.4"

package:
  name: beacon-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/beacon-api/beacon_api-${{ version }}.tar.gz
  sha256: dd24429d9c597c234271b7ee301218823005fd27ce535c67faf8e6f7d0923cc5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - cibuildwheel
    - pip
  run:
    - python >=${{ python_min }}
    - requests >=2.0.0
    - pandas >=2.0.0
    - pyarrow >=17.0.0,!=19.0.0
    - xarray >=2023.1.0
    - fsspec >=2023.1.0
    - dask-core >=2023.1.0
    - zarr >=2.18
    - networkx >=3.0.0
    - matplotlib-base >=3.0.0
    - netcdf4 >=1.5.0
    - typing_extensions >=4.10.0
    - numpy >=1.23.0
    - geopandas >=1.1.0
    - deprecated >=1.2.14

tests:
  - python:
      imports:
        - beacon_api
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Python interface wrapper for interacting with Beacon Nodes.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/beacon-api/

extra:
  recipe-maintainers:
    - Choopsy
    - robinskil
