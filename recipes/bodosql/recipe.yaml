context:
  version: "2026.10"

package:
  name: bodosql
  version: ${{ version }}

source:
  url: https://github.com/bodo-ai/Bodo/archive/refs/tags/${{ version }}.zip
  sha256: 0ce3b82a4103562c1abccf86e74435b00ca6edaf1f59d6d6f0ab59bc791a0d94

build:
  noarch: python
  skip: win and osx
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install ./BodoSQL -vv --no-deps --no-build-isolation
  number: 0

requirements:
    host:
        - pip
        - python ${{ python_min }}.*
        - setuptools >=64
        - setuptools_scm >=8
        - openjdk 17.*
        - maven

    run:
        - python >=${{ python_min }}
        - openjdk 17.*
        - bodo  ==${{ version }}
        - py4j ==0.10.9.9

tests:
  - python:
      imports:
        - bodosql
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      file: test.py

about:
  homepage: https://bodo.ai
  documentation: https://docs.bodo.ai/latest/
  repository: https://github.com/bodo-ai/Bodo
  summary: Distributed SQL engine for large-scale analytics
  description: |
    BodoSQL is a high performance distributed SQL engine for large data sets built using Bodo's HPC and compiler technologies. 
    It includes a cost-based query optimizer, supports data source such as Iceberg and Parquet, and has tight integration with Python.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ehsantn
    - IsaacWarren
    - scott-routledge2
    - DrTodd13
