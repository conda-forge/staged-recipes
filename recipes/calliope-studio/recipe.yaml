schema_version: 1

context:
  version: "0.1.2"
  python_min: "3.12"

package:
  name: calliope-studio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/calliope-studio/calliope_studio-${{ version }}.tar.gz
  sha256: ef6b0235c958c5244c2d07976d15649f620942f74563b9c5841e38d3b6e0757e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - calliope-studio = calliope_studio.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - calliope >=0.7.0,<0.8.0
    - fastapi >=0.115
    - uvicorn >=0.34
    - pyarrow >=17
    - ruamel.yaml >=0.18
    - click >=8.2
    - platformdirs >=4
    - pandas >=2.1.3
    - xarray >=2024.1
    - numpy >=1.26
    - pydantic >=2.7
    - netcdf4 >=1.6

tests:
  - python:
      imports:
        - calliope_studio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - calliope-studio --version

about:
  summary: Web UI for defining, running and analysing Calliope models.
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - THIRD_PARTY_LICENSES.md
  homepage: https://pypi.org/project/calliope-studio/
  repository: https://github.com/sjpfenninger/calliope-studio

extra:
  recipe-maintainers:
    - sjpfenninger
