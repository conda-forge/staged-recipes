mpi:
  - mpich

# --- mpich generation -------------------------------------------------------
# Ahead of conda-forge's base pinning (`mpich: 4`) because the 64-bit-Xt_int yaxt
# this stack requires exists only against mpich 5, and an mpich-4 build of this
# package could not co-install with it. Full rationale, including why the
# override is global to the PR rather than per-recipe, is in
# recipes/lfric-env/variants.yaml -- keep these three in agreement.
mpich:
  - "5"
