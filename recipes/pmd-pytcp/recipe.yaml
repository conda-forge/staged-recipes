context:
  version: "0.3.9"

package:
  name: pmd-pytcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pmd_pytcp/pmd_pytcp-${{ version }}.tar.gz
  sha256: 6429509ac8ba45ba17dee12e14c3d06d7bbadd5c12f0d6d4a961bf4bafe19ca5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pytcpd=pmd_pytcp.daemon.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - pmd-net-addr ==0.0.3
    - pmd-net-proto ==0.0.3
    - typing_extensions >=4.6

tests:
  - python:
      imports:
        - pmd_pytcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ccie18643/PyTCP
  summary: PyTCP userspace TCP/IP stack
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
