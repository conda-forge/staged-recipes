schema_version: 1

context:
  version: "2.2.0"

package:
  name: shapely
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/shapely/shapely-${{ version }}.tar.gz
  sha256: e8865e553d874a1ec4a032057ea81fca9def37b188cd8fb550af3b3480b3f88c

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython
        - numpy >=2
        - geos
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - cython
    - geos
    - meson-python >=0.15.0,!=0.22.0
    - numpy >=2
    - pkg-config
  run:
    - python
    - numpy >=1.26

tests:
  - python:
      imports:
        - shapely
      pip_check: true
  - requirements:
      run:
        - pytest
    script:
      - python -m pytest --pyargs shapely.tests

about:
  summary: Manipulation and analysis of geometric objects
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/shapely/
  documentation: https://shapely.readthedocs.io/

extra:
  recipe-maintainers:
    - akrherz
    - ocefpaf
    - pelson
    - phobson
    - xylar
    - jorisvandenbossche
    - mwtoews
