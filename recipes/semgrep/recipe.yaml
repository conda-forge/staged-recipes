# semgrep = semgrep-core (OCaml, arch) + semgrep (Python CLI, noarch).
#
# Notes:
#  - semgrep-core needs ~120 OCaml packages (ppxlib, lwt, eio, cohttp, tls, ...)
#    that are not on conda-forge. They are VENDORED into the dune workspace at
#    semgrep/duniverse/<dir> from an opam solve (see building/vendored.txt header
#    and building/classification.tsv). The source list between the BEGIN/END
#    markers below is generated by building/gen_sources.py with
#    `--prefix semgrep/duniverse`, then hand-edited (this block is the source of
#    truth; the version-bump procedure and the manual post-edits are in the
#    gen_sources.py docstring). hmap and jsonm are removed from it (published
#    as ocaml-hmap / ocaml-jsonm), and ocamlfind/num/zarith are handled
#    separately (see next point).
#  - findlib, num and zarith are built PRIVATELY into ${SRC_DIR}/_tools
#    (building/build_findlib.sh, building/build_semgrep_core.sh) and are never
#    installed into $PREFIX / published. Libraries that already exist on
#    conda-forge or in this repo are host dependencies instead.
#  - HIDDEN(#35158): ppxlib, dune-configurator, ocplib-endian, lwt, lwt_ppx and
#    logs (with lwt) are also built privately until conda-forge/staged-recipes#35158
#    publishes ocaml-ppxlib/-dune-configurator/-ocplib-endian/-lwt/-lwt-ppx.
#    Every line added or changed for this carries the marker `HIDDEN(#35158)`:
#    `grep -rn 'HIDDEN(#35158)' recipes/` lists everything to revert. Per package:
#    delete its source entry (nondune/<name>), delete its hidden_* call line in
#    building/build_semgrep_core.sh, uncomment its host dep below. Once all are
#    restored, also delete the helper functions, patches/hidden/, the
#    ocamlbuild build dep, and restore ocaml-logs' --with-lwt true.
#    (logs: the private copy shadows host ocaml-logs, which ocaml-bos needs.)
#  - Patches (apply to the semgrep tarball):
#      0001 drop obackward + pyro-caml-instruments (src/main)
#      0002 drop memtrace + pyro-caml ppx (libs/commons)
#      0003 no-op telemetry (libs/telemetry; removes opentelemetry/ocurl deps)
#      0004 use system tree-sitter runtime (no network download at dune time)
#      0005 cli: relax pyproject pins to lower bounds
#      0006 no vendored tree-sitter runtime/CLI build (core/dune; core/test data-only)
#      0007 src/core: Opentelemetry types -> Telemetry.scope / user_data (after 0003)
#      0008 cli: relax mcp floor to >=1.28.1 (no mcp 1.x >=1.29 on conda-forge)
#      0009 cli: skip hard/3,hard/4 stack candidates when hard is RLIM_INFINITY (py3.15 -> EAGAIN)
#  - Platforms: linux-64, osx-64, osx-arm64; non-unix (win-64) being attempted.
schema_version: 1

context:
  version: "1.180.0"
  findlib_version: "1.9.8"
  # non-unix: conda-forge ocaml has gcc_ and vs2022_ tracks; semgrep-core uses the gcc (MinGW) track like the ocaml-* recipes.
  c_toolchain: ${{ "" if unix else "gcc_*" }}

recipe:
  name: semgrep-split
  version: ${{ version }}

source:
  - url: https://github.com/semgrep/semgrep/archive/refs/tags/v${{ version }}.tar.gz
    sha256: c99bcd539198c6b0fc3a16ce522fce9b575dbe52c31577e2767003f0917d9f8a
    target_directory: semgrep
    patches:
      - patches/0001-drop-obackward-and-pyro-caml-instruments.patch
      - patches/0002-drop-memtrace-and-pyro-caml-ppx.patch
      - patches/0003-no-op-telemetry.patch
      - patches/0004-use-system-tree-sitter.patch
      - patches/0005-cli-relax-pins.patch
      - patches/0006-no-vendored-tree-sitter-runtime.patch
      - patches/0007-core-use-telemetry-types.patch
