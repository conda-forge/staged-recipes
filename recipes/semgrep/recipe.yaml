build:
  number: 0

outputs:
  - package:
      name: semgrep-core
      version: ${{ version }}
    build:
      script: bash ${{ RECIPE_DIR }}/building/build_semgrep_core.sh
      # python and perl are build helpers only; the binary does not link them, so
      # keep them out of the variant (one semgrep-core build, not one per python)
      variant:
        ignore_keys:
          - python
          - perl
    requirements:
      build:
        - python  # unpacks pecu (build_semgrep_core.sh)
        - perl  # in-place edits in build_semgrep_core.sh
        - if: unix
          then:
            - ${{ compiler("c") }}
            - ${{ compiler("cxx") }}
            - ${{ stdlib("c") }}
          else:
            # MinGW gcc/g++ (grammar scanner.cc stubs need cc1plus); compiler("c") would be vs2022
            - ${{ compiler("m2w64_c") }}
            - ${{ compiler("m2w64_cxx") }}
            - ${{ stdlib("m2w64_c") }}
        - ocaml ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
        - ocaml-dune 3.24.*
        # menhir (parser generator) and cppo (preprocessor) are NOT vendored.
        # build >=1: menhirLib under lib/ocaml (build 0 used lib/menhirLib)
        - ocaml-menhir[version='20230608.*', build_number='>=1']
        - ocaml-cppo 1.8.0.*
        - make
        - pkg-config
        # no opam: its git dep's msys perl breaks pkg-config on non-unix; hidden_topkg installs logs.install itself  # HIDDEN(#35158)
        - ocamlbuild 0.16.* *_3  # HIDDEN(#35158): topkg build of the private logs
        - if: win
          then:
            - m2-grep  # zarith's Makefile greps META for its version
      host:
        - ocaml ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
        # menhirLib runtime (linked into the parsers); see note under build
        - ocaml-menhir[version='20230608.*', build_number='>=1']
        # provided from conda (opam name -> conda name); min versions from the opam solve
        - ocaml-cmdliner >=2.1.1
        - ocaml-re >=1.14.0
        - ocaml-yojson >=3.0.0
        - ocaml-csexp >=1.5.2
        - ocaml-sexplib0 >=0.17.0
        - ocaml-stdlib-shims >=0.3.0
        - ocaml-ppx-derivers >=1.2.1
        - ocaml-compiler-libs >=0.17.0
        # seq is a stdlib shim (classification.tsv 'base'); gen is not used by any dune file -> both omitted
        - ocaml-topkg >=1.1.1
        - ocaml-astring >=0.8.5
        - ocaml-fmt >=0.11.0
        - ocaml-fpath >=0.7.3
        - ocaml-logs >=0.10.0  # HIDDEN(#35158): ocaml-bos needs it; logs.lwt comes from the private nondune/logs that shadows it. Restore: published ocaml-logs has lwt again
        # - ocaml-lwt >=6.1.2  # HIDDEN(#35158): restore when on conda-forge
        # - ocaml-lwt-ppx >=6.1.2  # HIDDEN(#35158): restore when on conda-forge
        # ppxlib 0.38.0 is built privately (nondune/ppxlib) until ocaml-ppxlib is on conda-forge  # HIDDEN(#35158)
        # - ocaml-dune-configurator >=3.24.2  # HIDDEN(#35158): restore when on conda-forge
        # - ocaml-ocplib-endian >=1.2  # HIDDEN(#35158): restore when on conda-forge
        - ocaml-rresult >=0.7.0
        - ocaml-bos >=0.3.0
        - ocaml-uutf >=1.0.4
        - ocaml-uuidm >=0.9.10
        - ocaml-uucp >=17.0.0  # semgrep.opam:39 declares >= 17.0.0
        - ocaml-xmlm >=1.4.0
        # mtime: transitive only, no constraint in semgrep opam files; 2.1.0 accepted
        - ocaml-mtime
        - ocaml-ptime >=1.2.0
        - ocaml-hmap >=0.8.1
        - ocaml-jsonm >=1.0.2
        # C / system libs
        - gmp
        - libcurl
        - libev
        - pcre2
        - libffi
        # libtree-sitter ships lib/pkgconfig/tree-sitter.pc; CF 0.27.1 LANGUAGE_VERSION 15, MIN_COMPATIBLE 13 -> vendored ABI-14 grammars OK
        - libtree-sitter
        # zlib/zstd: no linkage in semgrep dune files; zstd was only needed by comprmarsh (via obackward, dropped by patch 0001)
      run:
        # run: C libs come from host run_exports (gmp, pcre2, libcurl, libffi, libev, libtree-sitter); revisit after first build with ldd
        - gmp
    tests:
      - script:
          - if: unix
            then:
              - semgrep-core -version | grep -F "${{ version }}"
              - semgrep-core -version | grep -F a35fe83061
              - test -z "$(semgrep-core -version | grep -F dirty)"
            else:
              # non-unix test scripts run in cmd: no grep/test
              - semgrep-core -version | findstr /C:"${{ version }}"
              - semgrep-core -version | findstr /C:a35fe83061
        # Core_CLI.ml:593 prints 'semgrep-core version: <ver> (<Git_info.commit>)'; commit pinned via SEMGREP_GIT_COMMIT in build_semgrep_core.sh
    about:
      # semgrep-core statically links everything vendored above: semgrep's own libs,
      # the tree-sitter grammars and menhir parsers, the duniverse, and the private
      # nondune/ and findlib/ builds. One id per distinct license found there
      # (opam license: fields, else the license text). The opam solve vendors
      # mirage-crypto, whose tarball ships no license file (ISC / BSD-2-Clause / MIT per opam).
      license: >-
        LGPL-2.1-only AND LGPL-2.1-only WITH OCaml-LGPL-linking-exception
        AND LGPL-2.1-or-later AND LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
        AND LGPL-2.0-only WITH OCaml-LGPL-linking-exception
        AND LGPL-3.0-or-later WITH OCaml-LGPL-linking-exception
        AND MIT AND ISC AND BSD-2-Clause AND BSD-3-Clause AND Apache-2.0
        AND CC0-1.0 AND Unlicense AND QPL-1.0
      license_file:
        - semgrep/LICENSE
        - semgrep/COPYRIGHT
        - semgrep/cli/src/semgrep/semgrep_interfaces/LICENSE
        # Licenses of the vendored duniverse, libs/, menhir parsers, tree-sitter grammars and the
        # private nondune/ + findlib/ builds, collected by build_semgrep_core.sh (top-level files
        # only): license_file globs would recurse into _build/, tests and dune's vendor/ dirs.
        - vendored-licenses/

  - package:
      name: semgrep
      version: ${{ version }}
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install ./semgrep/cli --no-deps --no-build-isolation -vv
      python:
        # conda generates the launchers at install time; pip's non-unix .exe stubs exit 1 silently
        entry_points:
          - semgrep = semgrep.console_scripts.entrypoint:main
          - pysemgrep = semgrep.console_scripts.pysemgrep:main
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - setuptools
        - wheel
      run:
        - python >=${{ python_min }}
        - semgrep-core ==${{ version }}
        - attrs >=21.3
        - boltons >=21.0
        - click-option-group >=0.5,<0.6
        - click >=8.4.2
        - colorama >=0.4.0,<0.5
        - exceptiongroup >=1.2.0
        - glom >=23.3
        - jsonschema >=4.25.1
        - mcp >=1.28.1,<2  # fastmcp removed in mcp 2; no 1.x >=1.29 on conda-forge
        - opentelemetry-api >=1.37.0
        - opentelemetry-sdk >=1.37.0
        - opentelemetry-exporter-otlp-proto-http >=1.37.0
        - opentelemetry-instrumentation-requests >=0.58b0
        - opentelemetry-instrumentation-threading >=0.58b0
        - packaging >=21.0
        - peewee >=3.14
        - pyjwt >=2.15.0,<3
        - cryptography
        - requests >=2.22,<3
        - rich >=13.5.2
        - ruamel.yaml >=0.18.15
        - ruamel.yaml.clib >=0.2.15
        - semantic_version >=2.10.0,<2.11
        - tomli >=2.4.0
        - typing_extensions >=4.2,<5
        - urllib3 >=2,<3
        - wcmatch >=8.3
        # pywin32 skipped (no non-unix build)
    tests:
      - python:
          imports:
            - semgrep
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
      # python, not sh: non-unix test scripts run in cmd (no heredoc/grep)
      - files:
          recipe:
            - testing/test_semgrep_scan.py
        script:
          - python testing/test_semgrep_scan.py

about:
  homepage: https://semgrep.dev
  repository: https://github.com/semgrep/semgrep
  # top level = the noarch semgrep output (python CLI + semdep externals: packaging is
  # Apache-2.0 or BSD-2-Clause, parsy is MIT); semgrep-core overrides it in its own about
  # (semgrep.opam and semgrep/COPYRIGHT: LGPL 2.1 only, no "or later")
  license: LGPL-2.1-only AND MIT AND (Apache-2.0 OR BSD-2-Clause)
  license_file:
    - semgrep/LICENSE
    - semgrep/cli/src/semdep/external/packaging/LICENSE
    - semgrep/cli/src/semdep/external/packaging/LICENSE.APACHE
    - semgrep/cli/src/semdep/external/packaging/LICENSE.BSD
    - semgrep/cli/src/semdep/external/parsy/LICENSE
  summary: Lightweight static analysis for many languages

extra:
  recipe-maintainers:
    - MementoRC
    - ManuelLerchner
