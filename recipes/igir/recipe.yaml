schema_version: 1

context:
  name: igir
  version: "5.7.2"
  # Pinned submodule commits of the native addons' vendored dependencies, see
  # https://github.com/emmercm/igir/blob/v5.7.2/.gitmodules
  sevenzip_zstd_commit: 2dcb6815c0e6877988171c47e1824b86172ff3b2
  mame_commit: f34f02505e32c1993c6a782b6814232cbfc74e36
  dolphin_commit: f84df02055ab9610feec48e65648cac5a3c098fa
  maxcso_commit: 961f232cf99d546b2b7e704c0ecf3fc5bea52221
  zlib_commit: 14763ac7c6c03bca62c39e35c03cf5bfc7728802
  zstd_commit: 63779c798237346c2b245c546c40b72a5a5913fe

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Upstream repository: license file and lock file (used to generate ThirdPartyLicenses.txt)
  - url: https://github.com/emmercm/igir/archive/refs/tags/v${{ version }}.tar.gz
    sha256: ea5341ed3a40054bfbf2f6d26f6c76902c6d5ec949d66d38692218656245875b
  # Published npm package: compiled JS plus the prebuilt Node-API addons (with WASM fallbacks)
  - url: https://registry.npmjs.org/igir/-/igir-${{ version }}.tgz
    sha256: f33699011a0be183a64b9674eb050109338195049529926ba08d3399419852ad
    file_name: igir-${{ version }}.tgz
  # Licenses of the libraries statically linked into the prebuilt Node-API addons.
  # 7zip addon
  - url: https://raw.githubusercontent.com/mcmilk/7-Zip-zstd/${{ sevenzip_zstd_commit }}/COPYING
    sha256: efd01ecf087d0345468c57f7146879952c39c8daf4c461876a95de1c0d1722f3
    file_name: 7-Zip-zstd-COPYING
    target_directory: licenses
  # chdman addon (MAME + its 3rdparty flac, lzma, zlib, zstd)
  - url: https://raw.githubusercontent.com/mamedev/mame/${{ mame_commit }}/COPYING
    sha256: 60e9b2e1e0832d74696a9a0317693bb6cbe317747caad589a338e2c7636933e4
    file_name: mame-COPYING
    target_directory: licenses
  - url: https://raw.githubusercontent.com/mamedev/mame/${{ mame_commit }}/3rdparty/flac/COPYING.Xiph
    sha256: 12600ea1a7affcbf469bd0d8b2cd725e4167114a2ee834b88f5d2857bfd7ddbf
    file_name: flac-COPYING.Xiph
    target_directory: licenses
  - url: https://raw.githubusercontent.com/mamedev/mame/${{ mame_commit }}/3rdparty/lzma/DOC/lzma-sdk.txt
    sha256: 34348c69fe95eda81de53db2f37382acae6a0157f2708652d612ceb8fff05f6c
    file_name: lzma-sdk.txt
    target_directory: licenses
  - url: https://raw.githubusercontent.com/mamedev/mame/${{ mame_commit }}/3rdparty/zlib/LICENSE
    sha256: e32ff4e00d9d94930537635291da39e7e612703334bf6fde8c7f1686fe8a45a2
    file_name: zlib-LICENSE
    target_directory: licenses
  # zstd addon (same license file as MAME's 3rdparty/zstd)
  - url: https://raw.githubusercontent.com/facebook/zstd/${{ zstd_commit }}/LICENSE
    sha256: 7055266497633c9025b777c78eb7235af13922117480ed5c674677adc381c9d8
    file_name: zstd-LICENSE
    target_directory: licenses
  # dolphin-tool addon (Dolphin + its Externals bzip2, liblzma, mbedtls, zlib-ng, fmt)
  - url: https://raw.githubusercontent.com/dolphin-emu/dolphin/${{ dolphin_commit }}/COPYING
    sha256: 695114256e306a5e1ca407bc6e2a11877b112328dbe990253b52f59726e01b4b
    file_name: dolphin-COPYING
    target_directory: licenses
  - url: https://gitlab.com/bzip2/bzip2/-/raw/6a8690fc8d26c815e798c588f796eabe9d684cf0/LICENSE
    sha256: c6dbbf828498be844a89eaa3b84adbab3199e342eb5cb2ed2f0d4ba7ec0f38a3
    file_name: bzip2-LICENSE
    target_directory: licenses
  - url: https://raw.githubusercontent.com/dolphin-emu/dolphin/${{ dolphin_commit }}/Externals/liblzma/COPYING
    sha256: bcb02973ef6e87ea73d331b3a80df7748407f17efdb784b61b47e0e610d3bb5c
    file_name: liblzma-COPYING
    target_directory: licenses
  - url: https://raw.githubusercontent.com/dolphin-emu/dolphin/${{ dolphin_commit }}/Externals/mbedtls/LICENSE
    sha256: cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30
    file_name: mbedtls-LICENSE
    target_directory: licenses
  - url: https://raw.githubusercontent.com/zlib-ng/zlib-ng/ce01b1e41da298334f8214389cc9369540a7560f/LICENSE.md
    sha256: d3c80be055d94d798eaa786116e84fa0b010bc11420b5d2060d978ea77845436
    file_name: zlib-ng-LICENSE.md
    target_directory: licenses
  - url: https://raw.githubusercontent.com/fmtlib/fmt/e424e3f2e607da02742f73db84873b8084fc714c/LICENSE
    sha256: 07580f2a3b35709ce703d523f447b242f6dfec7582a8c0df102c7fa2849375f8
    file_name: fmt-LICENSE
    target_directory: licenses
  # maxcso addon (maxcso + its bundled lz4, libdeflate, zlib)
  - url: https://raw.githubusercontent.com/unknownbrackets/maxcso/${{ maxcso_commit }}/LICENSE.md
    sha256: a214be8d6a41c18b6d23cd231d6fd9ec66e3b74ff94bba3ddeabc52ae413bf9f
    file_name: maxcso-LICENSE.md
    target_directory: licenses
  - url: https://raw.githubusercontent.com/unknownbrackets/maxcso/${{ maxcso_commit }}/lz4/lib/LICENSE
    sha256: d15d99c8dc6b0ec22174c0e563a95bc40f9363ca7f9d9d793bb5c5a8e8d0af71
    file_name: lz4-LICENSE
    target_directory: licenses
  - url: https://raw.githubusercontent.com/unknownbrackets/maxcso/${{ maxcso_commit }}/libdeflate/COPYING
    sha256: 5d246dd2537307b80fed9ba5fdddf5d0fe7a8f023393a071182b9daed56b40fe
    file_name: libdeflate-COPYING
    target_directory: licenses
  # zlib-1.1.3 addon (zlib 1.1.3 has no separate license file; the license is in its README)
  - url: https://raw.githubusercontent.com/madler/zlib/${{ zlib_commit }}/README
    sha256: a3dca6792d71e5439b49bd7d50b4fd1972d5712195e87286e08fca18fcfcf93a
    file_name: zlib-1.1.3-README
    target_directory: licenses

build:
  number: 0

requirements:
  build:
    - if: not win
      then: pnpm
  host:
    - nodejs
    - pnpm
    - pnpm-licenses >=2.1.0
    - if: linux
      then:
        - libstdcxx
        - libgcc
  run:
    # igir is plain JS plus Node-API addons, so it works with any supported nodejs major.
    # https://github.com/emmercm/igir/blob/v5.7.2/package.json#L13
    - nodejs >=22.22.2,<23|>=24.15.0
    - if: linux
      then:
        # The prebuilt native addons link against libstdc++ (GLIBCXX_3.4.30)
        - libstdcxx >=12
        - libgcc
  ignore_run_exports:
    from_package:
      - nodejs

tests:
  - script:
      - igir --help
      - if: not win
        then: igir --version | grep "${{ version }}"
        else: igir --version | findstr "${{ version }}"

about:
  homepage: https://igir.io/
  summary: A zero-setup ROM collection manager that sorts, filters, extracts or archives, patches, and reports on collections of any size on any OS
  description: |
    Igir is a ROM collection manager that sorts, filters, extracts or archives,
    patches, and reports on collections of any size. It supports DATs from
    No-Intro, Redump, TOSEC and more, reads and writes zip, 7z, rar, tar,
    gzip, CHD, CSO, RVZ/WIA/GCZ and other archive formats, and can apply
    IPS, BPS, UPS, APS, PPF, xdelta and other patch formats.
  license: GPL-3.0-or-later AND GPL-2.0-or-later AND LGPL-2.1-or-later AND Apache-2.0 AND BSD-3-Clause AND BSD-2-Clause AND MIT AND ISC AND Zlib AND bzip2-1.0.6
  license_file:
    - LICENSE
    - ThirdPartyLicenses.txt
    - licenses/
  documentation: https://igir.io/
  repository: https://github.com/emmercm/igir

extra:
  recipe-maintainers:
    - pavelzw
