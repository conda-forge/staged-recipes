schema_version: 1

context:
  version: "2.11.3"

package:
  name: r-bat
  version: ${{ version }}

source:
  url: https://cran.r-project.org/src/contrib/BAT_${{ version }}.tar.gz
  sha256: 9cc987b25c0a700ff6123a34d6d11d7faacf1b093105eea572d3fc8af684f117

build:
  number: 0
  script: R CMD INSTALL --build .
  merge_build_and_host_envs: true
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  host:
    - r-MASS
    - r-TreeTools
    - r-ape
    - r-base
    - r-boot
    - r-geometry
    - r-hypervolume
    - r-nls2
    - r-phytools
    - r-terra
    - r-vegan
  run:
    - r-MASS
    - r-TreeTools
    - r-ape
    - r-base
    - r-boot
    - r-geometry
    - r-hypervolume
    - r-nls2
    - r-phytools
    - r-terra
    - r-vegan

tests:
  - script:
      - if: not win
        then: $R -e "library('BAT')"
      - if: win
        then: "\"%R%\" -e \"library('BAT')\""

about:
  summary: Includes algorithms to assess alpha and beta diversity in all their dimensions (taxonomic, phylogenetic and functional). It allows performing a number of analyses based on species identities/abundances, phylogenetic/functional distances, trees, convex-hulls or kernel density n-dimensional hypervolumes depicting species relationships. Cardoso et al. (2015) <doi:10.1111/2041-210X.12310>.
  license: GPL-3.0-only
  license_file:
    - LICENSE
  homepage: https://cran.r-project.org/package=BAT
extra:
  recipe-maintainers:
    - PaulineSGN
    - conda-forge/r
