context:
  name: rprank
  version: 0.0.1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/brsynth/rpRank/archive/refs/tags/${{ version }}.tar.gz
  sha256: d509c8aaa808e133f7a5cc48ea232940e5b645b9c393908f0376aeda40608dd7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} setup.py install

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - brs_utils>=1.26.0
    - rplibs>=6.9.5

tests:
  - python:
      imports:
        - rprank
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m rprank --help

about:
  homepage: https://github.com/brsynth/rpRank/tree/main
  summary: "Rank a list of pathways according to their global score"
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ramez17khaled
