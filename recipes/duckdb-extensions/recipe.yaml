context:
  version: "2.0.0"

package:
  name: duckdb-extensions
  version: ${{ version }}

source:
  url: https://github.com/santosh-d3vpl3x/duckdb_extensions/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f51088b07e27a7fd191bd19ff4cc63d0ee8fe6d18a07f4533b665e3720e51d21

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - python-duckdb ==2.0.0

tests:
  - python:
      imports:
        - duckdb_extensions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/santosh-d3vpl3x/duckdb_extensions
  summary: DuckDB extensions as python package
  license: MIT
  license_file: LICENSE.md
  documentation: https://github.com/santosh-d3vpl3x/duckdb_extensions#readme
  repository: https://github.com/santosh-d3vpl3x/duckdb_extensions

extra:
  recipe-maintainers:
    - pb01ka
