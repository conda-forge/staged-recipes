schema_version: 1

context:
  version: "1.5.8"

package:
  name: python-rtmidi
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/python-rtmidi/python_rtmidi-${{ version }}.tar.gz
  sha256: 7f9ade68b068ae09000ecb562ae9521da3a234361ad5449e83fc734544d004fa

build:
  number: 0
  script:
    # The sdist ships a C++ file pre-generated by Cython 3.0.5, which does not
    # support recent Python versions; remove it so meson regenerates it.
    - ${{ PYTHON }} -c "import os; os.remove('src/_rtmidi.cpp')"
    - if: unix
      then: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation -Csetup-args=${MESON_ARGS// / -Csetup-args=}
      else: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - meson
    - ninja
    - pkg-config
  host:
    - python
    - pip
    - cython
    - meson-python
    # MIDI backends: ALSA + JACK on Linux, CoreMIDI on macOS (system
    # framework), WinMM on Windows (system library).
    - if: linux
      then:
        - alsa-lib
        - jack
  run:
    - python

tests:
  - python:
      imports:
        - rtmidi
        - rtmidi.midiutil
      pip_check: true
  - requirements:
      run:
        - python
    script:
      - if: linux
        then: python -c "import rtmidi; apis = rtmidi.get_compiled_api(); assert rtmidi.API_LINUX_ALSA in apis and rtmidi.API_UNIX_JACK in apis, apis"
      - if: osx
        then: python -c "import rtmidi; apis = rtmidi.get_compiled_api(); assert rtmidi.API_MACOSX_CORE in apis, apis"
      - if: win
        then: python -c "import rtmidi; apis = rtmidi.get_compiled_api(); assert rtmidi.API_WINDOWS_MM in apis, apis"

about:
  summary: A Python binding for the RtMidi C++ library implemented using Cython.
  license: MIT
  license_file:
    - LICENSE.md
    - src/rtmidi/LICENSE
  homepage: https://github.com/SpotlightKid/python-rtmidi
  repository: https://gitlab.com/SpotlightKid/python-rtmidi/
  documentation: https://spotlightkid.github.io/python-rtmidi/

extra:
  recipe-maintainers:
    - HeavyTony2
