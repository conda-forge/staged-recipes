[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.27"
cmake.source-dir = "../symmetrix"
wheel.exclude = ["lib/", "lib64/", "include/", "bin/"]
wheel.packages = ["source/symmetrix_backend_cuda12_sm80"]

[project]
name = "symmetrix-xl-cuda12-sm80"
version = "0.1.1"
description = "Symmetrix native backend for CUDA 12 and NVIDIA sm80"
requires-python = ">=3.10"
dependencies = ["symmetrix-xl==0.1.1"]

[project.entry-points."symmetrix.backends"]
"cuda12-sm80" = "symmetrix_backend_cuda12_sm80"
