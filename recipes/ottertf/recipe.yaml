schema_version: 1

context:
  version: "0.2.0"
  python_min: "3.12"

package:
  name: ottertf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/ottertf/ottertf-${{ version }}.tar.gz
  sha256: 5fd4f3d34d9315f16bdfa87c1f2b75bc1fb83ccc0acb34c0162dd8af0a05ee1a

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ottertf
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      interpreter: python
      content: |
        import ottertf

        assert ottertf.__version__ == "${{ version }}", ottertf.__version__

about:
  homepage: https://github.com/tschuelia/ottertf
  summary: Extract HTML embedded in RTF (MS-OXRTFEX de-encapsulation).
  description: |
    otteRTF 🦦 extracts HTML encapsulated in Rich Text Format documents
    according to Microsoft's MS-OXRTFEX specification.
  license: MIT
  license_file: LICENSE
  documentation: https://tschuelia.github.io/ottertf/
  repository: https://github.com/tschuelia/ottertf

extra:
  recipe-maintainers:
    - tschuelia
