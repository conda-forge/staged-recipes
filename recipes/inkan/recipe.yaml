context:
  name: inkan
  version: "0.5.1"
  python_min: "3.9"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 12a7e7b3c6da9471d46fc658f721fc8d667837af53cf652a466ac33ab78a6950

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68.0
  run:
    - python >=${{ python_min }}
    - pytorch >=2.0

tests:
  - python:
      imports:
        - inkan
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/NAVEENMN/inkan
  summary: "inKAN: Fast B-spline Kolmogorov-Arnold Network (KAN) layers for PyTorch"
  description: |
    inKAN provides fast, stable uniform cubic B-spline Kolmogorov-Arnold Network
    layers for PyTorch. Drop-in nn.Linear replacement with learnable spline
    activations, 2.8-5.4x faster than Cox-de Boor implementations.
  license: MIT
  license_file: LICENSE
  documentation: https://naveenmn.github.io/inkan/
  repository: https://github.com/NAVEENMN/inkan

extra:
  recipe-maintainers:
    - NAVEENMN
