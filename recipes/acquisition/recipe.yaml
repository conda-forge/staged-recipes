schema_version: 1

context:
  version: "6.4"

package:
  name: acquisition
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/acquisition/acquisition-${{ version }}.tar.gz
  sha256: 50f041fd60706b811f76425ea018ec8a71a0f0d0df0f070413db3b8778996cea

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - extensionclass >=4.2.0
    - zope.interface

tests:
  - python:
      imports:
        - Acquisition
        - Acquisition._Acquisition
        - Acquisition.interfaces
      pip_check: true
  - script:
      - python -m unittest -v Acquisition.tests

about:
  homepage: https://github.com/zopefoundation/Acquisition
  repository: https://github.com/zopefoundation/Acquisition
  summary: Mechanism that lets objects obtain attributes from their containment hierarchy
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
