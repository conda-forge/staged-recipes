{% set version = "0.3.0" %}
{% set python_min = "3.10" %}

package:
  name: mulaconf
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/m/mulaconf/mulaconf-{{ version }}.tar.gz
  sha256: 7b176df09af8a2dfd238039192f5fcbc94f173b55cc4798784d14440e9014a08

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.20.0
    - scipy >=1.7.0
    - scikit-learn >=1.0.0
    - pytorch >=2.0.0
    - pandas >=2.0.0
    - tqdm >=4.10.0

test:
  imports:
    - mulaconf
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/k-kostas/MuLaConf
  summary: Conformal Prediction for Multi-label classification.
  doc_url: https://mulaconf.readthedocs.io/
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - k-kostas
