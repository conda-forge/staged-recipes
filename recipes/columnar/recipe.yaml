schema_version: 1

context:
  version: "1.4.1"

package:
  name: columnar
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/C/Columnar/Columnar-${{ version }}.tar.gz
    sha256: c3cb57273333b2ff9cfaafc86f09307419330c97faa88dcfe23df05e6fbb9c72
  # The sdist doesn't include the license, so take it from the v1.4.1 tag.
  - url: https://raw.githubusercontent.com/MaxTaggart/columnar/548a21daa1907448418a1f26c8a966e7cb6c37ab/LICENSE.txt
    sha256: ed50ff698e505a4e5c3d3423f64d11f1f9a32cb42ca08fb8a458c88d0e678774
    file_name: LICENSE.txt

build:
  number: 0
  noarch: python
  script:
    # setup.py reads the UTF-8 README without an encoding, which breaks
    # on Windows' default cp1252 codec.
    env:
      PYTHONUTF8: "1"
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - toolz
    - wcwidth

tests:
  - python:
      imports:
        - columnar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "from columnar import columnar; out = columnar([['a', 1], ['b', 2]], ['name', 'n'], no_borders=True); assert 'NAME' in out and 'b' in out"

about:
  homepage: https://github.com/MaxTaggart/columnar
  repository: https://github.com/MaxTaggart/columnar
  summary: A tool for printing data in a columnar format.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - killua156
