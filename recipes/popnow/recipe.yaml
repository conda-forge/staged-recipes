context:
  version: "0.3.0"

package:
  name: popnow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/popnow/popnow-${{ version }}.tar.gz
  sha256: b9b56c79b3571d0863f1ef1b124a06a247b137b7fa13f42fb12d8a194145c28d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
  run:
    - python >=${{ python_min }}
    - httpx >=0.25,<1

tests:
  - python:
      imports:
        - popnow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://popnow.ai
  summary: Typed Python SDK for the PopNow API for AI video, image, music and speech generation
  description: |
    Typed Python client for the PopNow API. It creates video, image, music and
    speech generation tasks, quotes their price before they run and follows them
    to completion.
  license: MIT
  license_file: LICENSE
  documentation: https://popnow.ai/docs
  repository: https://github.com/popnow-ai/popnow-python

extra:
  recipe-maintainers:
    - kyuminjo
