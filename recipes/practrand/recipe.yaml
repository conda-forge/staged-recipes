schema_version: 1

context:
  version: "0.96"

package:
  name: practrand
  version: ${{ version }}

source:
  url: https://downloads.sourceforge.net/project/pracrand/PractRand_${{ version }}.zip
  sha256: e4caf7fda98b2c597bbda3b576753cf5a0f6047aab837c82be370ab798a672e1

build:
  number: 0
  skip:
    - win
    - osx

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - patch

tests:
  - script:
      - test -x "${PREFIX}/bin/RNG_test"
      - test -x "${PREFIX}/bin/RNG_output"
      - test -x "${PREFIX}/bin/RNG_benchmark"
      - RNG_test jsf64 -tlmax 1MB
      - RNG_output jsf64 1KB > /dev/null

about:
  homepage: https://pracrand.sourceforge.net/
  license: CC0-1.0
  license_file: doc/license.txt
  summary: Statistical tests and pseudo-random number generators
  description: |
    PractRand provides command-line tools for testing, generating, and
    benchmarking random number streams. This package installs RNG_test,
    RNG_output, and RNG_benchmark.
  documentation: https://pracrand.sourceforge.net/

extra:
  recipe-maintainers:
    - mikemhenry
