context:
  version: "0.0.21"

package:
  name: library-skills
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/l/library_skills/library_skills-${{ version }}.tar.gz
  sha256: 285b7d8b8f5d772478ac89ed6ca9fa45ca0ac695e2425a43df68930f47a59004

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0
  python:
    entry_points:
      - library-skills = library_skills.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >=0.11.7,<0.12.0
  run:
    - python >=${{ python_min }}
    - pyyaml >=5.3.1
    - rich-toolkit >=0.20.1
    - typer >=0.26.1

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - library_skills
      pip_check: true
  - script: library-skills --help

about:
  homepage: https://library-skills.io
  summary: 'Library Skills, AI Agents using libraries, as intended, always up to date.'
  license: MIT
  license_file: LICENSE
  documentation: https://library-skills.io
  repository: https://github.com/tiangolo/library-skills

extra:
  recipe-maintainers:
    - m-rossi
