context:
  version: "0.1.0"

package:
  name: fast
  version: ${{ version }}

source:
  url: https://codeload.github.com/openbioseq/fast/tar.gz/refs/tags/v${{ version }}
  sha256: 30c0f4e3bce4db9b338f2adbb0ae49704619b75c82be89ad9777dd3b57f4493c

build:
  number: 0
  script: build

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - package_contents:
      bin:
        - fast
  - script:
      - fast --version

about:
  homepage: https://github.com/openbioseq/fast
  repository: https://github.com/openbioseq/fast
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Fast FASTA/FASTQ toolkit
  description: |
    fast is a fast FASTA/FASTQ toolkit with stats, fa2fq, fq2fa, merge,
    head and sample subcommands. It uses block-wise streaming reads,
    record-aligned parallelism, and multi-threaded gzip/BGZF decompression.

extra:
  recipe-maintainers:
    - dwpeng
