context:
  version: "0.1.1"

package:
  name: micompress
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/micompress/micompress-${{ version }}.tar.gz
  sha256: e884ac2913d5d68b0656e980784a109beb8c6e179f6e63e795dc0578fcd10081

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - micompress = micompress.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - micompress
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - micompress --help

about:
  homepage: https://micompress.com
  repository: https://github.com/micompress/micompress-python
  summary: Compress images, PDFs, video, audio, documents and archives from the command line via micompress.com
  description: |
    MiCompress is a small command-line client (standard library only) for the micompress.com
    compression service. It uploads each file over HTTPS, and writes the optimized result next to it.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - huuhuybn
