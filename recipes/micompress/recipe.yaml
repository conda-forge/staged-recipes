context:
  version: "0.1.0"

package:
  name: micompress
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/micompress/micompress-${{ version }}.tar.gz
  sha256: 80a2402d6c4987dfd8b69a2a93165d6b9f10661e8367cec83cc3a2e891cbae59

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - micompress = micompress.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - micompress
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - micompress --help

about:
  homepage: https://micompress.com
  repository: https://github.com/micompress/micompress-python
  summary: Compress images, PDFs, video, audio, documents and archives from the command line via micompress.com
  description: |
    MiCompress is a small command-line client (standard library only) for the micompress.com
    compression service. It uploads each file over HTTPS, and writes the optimized result next to it.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - huuhuybn
