context:
  version: "2026.9.0"

package:
  name: lin
  version: ${{ version }}

source:
  url: https://github.com/aaronkwhite/linear-cli/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 64e0944183b99783544a391657467fea6aa6e6e77c169334944c76257ebca45e

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script: lin --help
  - package_contents:
      bin:
        - lin
      strict: true

about:
  homepage: https://github.com/aaronkwhite/linear-cli
  summary: Fast, agent-friendly Linear CLI — manage issues, projects, cycles from the terminal
  description: |
    lin is a fast, native CLI for Linear. Manage issues, projects, cycles,
    custom views and more from your terminal, with JSON output for agents.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/aaronkwhite/linear-cli

extra:
  recipe-maintainers:
    - pavelzw
