schema_version: 1

context:
  version: "6.0"
  test_modules:
    - zope.annotation.tests.test_attributeannotations
    - zope.annotation.tests.test_configure
    - zope.annotation.tests.test_factory

package:
  name: zope.annotation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.annotation/zope_annotation-${{ version }}.tar.gz
  sha256: ad44c641811d4a9fdfebd3d6839840032b4b84c4c052cda6911febc981101e53

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.component
    - zope.location
    - zope.proxy

tests:
  - python:
      imports:
        - zope.annotation
        - zope.annotation.attribute
        - zope.annotation.interfaces
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # dotted names: test_factory asserts on the full module name
      - python -m unittest -v ${{ test_modules | join(" ") }}
    requirements:
      run:
        - zope.configuration
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.annotation
  repository: https://github.com/zopefoundation/zope.annotation
  documentation: https://zopeannotation.readthedocs.io
  summary: Object annotation mechanism
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
