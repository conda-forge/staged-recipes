schema_version: 1

context:
  version: "0.3.0"
  python_min: "3.10"

package:
  name: gpib-ctypes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gpib-ctypes/gpib_ctypes-${{ version }}.tar.gz
  sha256: 73d97a4cd98ce0fb5bbe8a679c58b9475750f68dcc237f411c71cf486a9f8c26

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pytest-runner
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - gpib_ctypes
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: GPIB interface implemented using ctypes
  license: GPL-2.0-only
  license_file: LICENSE
  homepage: https://github.com/tivek/gpib_ctypes
  repository: https://github.com/tivek/gpib_ctypes

extra:
  recipe-maintainers:
    - wolfv
