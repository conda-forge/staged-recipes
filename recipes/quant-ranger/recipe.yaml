schema_version: 1

context:
  version: "0.1.1"
  python_min: "3.14"

package:
  name: quant-ranger
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/quant-ranger/quant_ranger-${{ version }}.tar.gz
  sha256: 45fe788894537ee8d2863df3fdaae5ff660e0fa3380291d766569a164d7cdd8b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - quant-ranger = quant_ranger.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    # pyproject.toml
    - python >=${{ python_min }}
    - copier >=9.8.0,<10
    - packaging >=26.2
    - pixi-diff-to-markdown >=0.3.3,<0.4.0
    - pydantic >=2.13.4,<3
    - pygithub >=2.9.1,<3
    - pyyaml >=6.0.3,<7
    - requests >=2.34.2,<3
    - rich >=15.0.0,<16
    - tomlkit >=0.15.0,<0.16.0
    - typer >=0.25.1,<0.26
    - urllib3 >=2.7.0,<3
    - zizmor ==1.22.0
    # pixi.toml
    - git >=2.54.0,<3
    - mergiraf >=0.17.0,<0.18.0
    - rattler-sandbox >=0.2.3,<0.3.0

tests:
  - python:
      imports:
        - quant_ranger
      # conda-forge's zizmor ships no dist-info
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - quant-ranger --help
      - quant-ranger update --help

about:
  summary: Tool for maintenance work across GitHub repositories.
  description: |
    Automated repository maintenance across GitHub organizations. quant-ranger
    discovers applicable work, runs typed update tasks in fresh checkouts, and
    can publish the results as pull requests.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/quantco/quant-ranger
  repository: https://github.com/quantco/quant-ranger
  documentation: https://ranger.quantco.cloud/

extra:
  recipe-maintainers:
    - pavelzw
    - ytausch
