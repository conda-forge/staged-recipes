context:
  name: llm-prices
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/llm_prices-${{ version }}.tar.gz
  sha256: 0905445a039853e71320d6e86df190e8f7e3050663875ff67fb13dce94c12c91

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - llm_prices
      pip_check: true
      python_version: ${{ python_min }}.*
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    script:
      - pytest tests -v

about:
  homepage: https://github.com/Mattbusel/llm-prices
  summary: Dated, source-cited LLM API prices per 1M tokens with provider-aware model-id lookup and exact decimal costs
  description: |
    llm-prices is a table of LLM API prices (Anthropic, OpenAI, Google Gemini,
    DeepSeek, Mistral, xAI, Groq, Together, Fireworks, Cohere) in USD per 1M
    tokens. Every row carries the provider's pricing page and the date it was
    checked. It looks up model ids the way SDKs send them (dated snapshots,
    aliases, Bedrock and Vertex ids, LangChain provider names) and prices a
    usage record, including cache reads and writes, batch and long-context
    tiers, as floats or exact Decimals. Pure Python, no dependencies, no
    network access.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/Mattbusel/llm-prices
  documentation: https://github.com/Mattbusel/llm-prices/tree/main/python

extra:
  recipe-maintainers:
    - Mattbusel
