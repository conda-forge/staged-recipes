schema_version: 1

context:
  version: "7.0"

package:
  name: zope.filerepresentation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.filerepresentation/zope_filerepresentation-${{ version }}.tar.gz
  sha256: 58604043795f98e37908912d53c7f582b42fc248314c31fab7df010cd3e889f4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.schema

tests:
  - python:
      imports:
        - zope.filerepresentation
        - zope.filerepresentation.interfaces
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest discover -v zope.filerepresentation

about:
  homepage: https://github.com/zopefoundation/zope.filerepresentation
  repository: https://github.com/zopefoundation/zope.filerepresentation
  documentation: https://zopefilerepresentation.readthedocs.io
  summary: File-system Representation Interfaces
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
