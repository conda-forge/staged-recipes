schema_version: 1

context:
  name: alibabacloud-gateway-pop
  version: "0.1.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/alibabacloud_gateway_pop-${{ version }}.tar.gz
  sha256: 6ea867666ecc99c4cfaedbbfa68540cf10ad311f283a7a6e5221425a4693ea59

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - alibabacloud-gateway-spi >=0.0.2,<1.0.0
    - alibabacloud-credentials >=1.0.2,<2.0.0
    - darabonba-core >=1.0.9,<2.0.0

tests:
  - python:
      imports:
        - alibabacloud_gateway_pop
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Alibaba Cloud POP SDK Library for Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/aliyun/alibabacloud-gateway
  repository: https://github.com/aliyun/alibabacloud-gateway/tree/master/alibabacloud-gateway-pop

extra:
  recipe-maintainers:
    - xylar
