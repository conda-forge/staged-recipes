context:
  version: "1.0"

package:
  name: einshape
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/einshape/einshape-${{ version }}.tar.gz
  sha256: 53538d75dd099f4ead4a4f786fafdcb0b729bb587e0b3afeca25ceef18c9ac14

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - absl-py
    - numpy

tests:
  - python:
      imports:
        - einshape
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "import numpy as np, einshape; assert einshape.numpy_einshape('ab->ba', np.zeros((2, 3))).shape == (3, 2)"

about:
  homepage: https://github.com/google-deepmind/einshape
  summary: DSL-based reshaping library for JAX, TensorFlow and NumPy
  description: |
    einshape is a small DSL for reshaping, transposing, squeezing and tiling
    arrays with a single einsum-style string, with backends for JAX,
    TensorFlow and NumPy. JAX and TensorFlow are optional; install whichever
    backend you use alongside it.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/google-deepmind/einshape

extra:
  recipe-maintainers:
    - dannon
