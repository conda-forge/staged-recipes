schema_version: 1

context:
  version: "1.4"

package:
  name: snappy-manifolds
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/snappy-manifolds/snappy_manifolds-${{ version }}.tar.gz
  sha256: 3a5b354e6cb545bed6d13a5f0b99a399d03a352c51111662150632c0c7d316dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=59
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - snappy_manifolds
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Database of snappy manifolds
  license: GPL-2.0-or-later
  license_file: LICENSE
  homepage: https://github.com/3-manifolds/snappy_manifolds

extra:
  recipe-maintainers:
    - jsmolic
