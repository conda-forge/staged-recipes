# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: thop
  version: "0.1.1"
  commit: "43c064afb71383501e41eaef9e8c8407265cf77f"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/Lyken17/pytorch-OpCounter/archive/${{ commit }}.tar.gz
  sha256: cbda9dc83ad9b78a9fbc8d89f8f1fb1da8ca284b39faab3e9ed697fb2bee909f
  patches:
    - fix_version.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pytorch

tests:
  - python:
      imports:
        - thop
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A tool to count the FLOPs of PyTorch model
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Lyken17/pytorch-OpCounter
  repository: https://github.com/Lyken17/pytorch-OpCounter

extra:
  recipe-maintainers:
    - flferretti
