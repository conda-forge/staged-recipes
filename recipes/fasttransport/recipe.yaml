schema_version: 1

context:
  version: "0.0.1"
  python_min: "3.11"

package:
  name: fasttransport
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fasttransport/fasttransport-${{ version }}.tar.gz
  sha256: c88fc989fb333efb4d3221379178600bac2f0c7156ad6f8d614ba7eafad39e3a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - pip
  run:
    - python >=${{ python_min }}
    - fastcore >=2.2.11
    - httpx2 >=2.9.1

tests:
  - python:
      imports:
        - fasttransport
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Sync and async HTTP transports over httpx2, plus base classes for small REST clients
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/AnswerDotAI/fasttransport
  documentation: https://AnswerDotAI.github.io/fasttransport/
  repository: https://github.com/AnswerDotAI/fasttransport

extra:
  recipe-maintainers:
    - thewchan
