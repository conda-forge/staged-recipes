{% set name = "paddocktimeseries" %}
{% set version = "1.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/paddocktimeseries/paddocktimeseries-{{ version }}.tar.gz
  sha256: 8a62ff87b30a6fef3ba92411c6a715d561d2e5458fe1fd08bb1d4927a8f30962

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >={{ python_min }}
    - troi-core >=0.1.1
    - pysentinel2
    - pysilo-store
    - pyozwald
    - pycopdem
    - pyslga
    - numpy
    - scipy
    - pandas
    - xarray
    - zarr
    - dask
    - rasterio
    - rioxarray
    - geopandas
    - shapely
    - pyproj
    - affine
    - netcdf4
    - matplotlib-base
    - pillow
    - opencv
    - rich
    - tabulate
    - statsmodels
    - scikit-learn
    - pysheds
    - cvxpy
    - ecos
    - datacube
    - segment-geospatial
    - pytorch
    - ffmpeg

test:
  imports:
    - PaddockTS
    - PaddockTS.paths
  # pip check omitted: conda-forge's segment-geospatial does not ship pip
  # metadata for segment-anything/smoothify, which fails pip check through
  # no fault of this package.
  requires:
    - python {{ python_min }}

about:
  home: https://github.com/johnburley3000/paddocktimeseries
  summary: Paddock-scale Sentinel-2 time series, segmentation, phenology and reports
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thestochasticman
    - johnburley3000
