{% set name = "paddocktimeseries" %}
{% set version = "1.0.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/paddocktimeseries/paddocktimeseries-{{ version }}.tar.gz
  sha256: bb40d3b43e113dca00cc2cccfb343a382d395ea2160e56a05f486b7d8681c05c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >={{ python_min }}
    - troi-core
    - pysentinel2
    - pysilo-store
    - pyozwald
    - pycopdem
    - pyslga
    - numpy
    - scipy
    - pandas
    - xarray
    - zarr
    - dask
    - rasterio
    - rioxarray
    - geopandas
    - shapely
    - pyproj
    - affine
    - netcdf4
    - matplotlib-base
    - pillow
    - opencv
    - rich
    - tabulate
    - statsmodels
    - scikit-learn
    - pysheds
    - cvxpy
    - ecos
    - datacube
    - segment-geospatial
    - pytorch
    - tensorflow
    - ffmpeg

test:
  imports:
    - PaddockTS
    - PaddockTS.paths
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/johnburley3000/paddocktimeseries
  summary: Paddock-scale Sentinel-2 time series, segmentation, phenology and reports
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thestochasticman
    - johnburley3000
