{% set name = "paddocktimeseries" %}
{% set version = "1.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/paddocktimeseries/paddocktimeseries-{{ version }}.tar.gz
  sha256: 8a62ff87b30a6fef3ba92411c6a715d561d2e5458fe1fd08bb1d4927a8f30962

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >={{ python_min }}
    # Lower bounds are the versions the 1.0.2 release was run and tested
    # with (major.minor); they also keep the conda solve tractable, which
    # an unbounded 30-package environment is not.
    - troi-core >=0.1.1
    - pysentinel2 >=0.1.0
    - pysilo-store >=0.1.0
    - pyozwald >=0.1.0
    - pycopdem >=0.1.0
    - pyslga >=0.1.0
    - numpy >=2.4
    - scipy >=1.17
    - pandas >=3.0
    - xarray >=2026.4
    - zarr >=3.1
    - dask >=2026.3
    - rasterio >=1.4
    - rioxarray >=0.19
    - geopandas >=1.1
    - shapely >=2.1
    - pyproj >=3.7
    - affine >=2.4
    - netcdf4 >=1.7
    - matplotlib-base >=3.10
    - pillow >=12.0
    - opencv >=4.13
    - rich >=15.0
    - tabulate >=0.10
    - statsmodels >=0.14
    - scikit-learn >=1.8
    - pysheds >=0.5
    - cvxpy >=1.8
    - ecos >=2.0
    - datacube >=1.9
    - segment-geospatial >=1.3
    - pytorch >=2.10
    - ffmpeg >=8.0

test:
  imports:
    - PaddockTS
    - PaddockTS.paths
  # pip check omitted: conda-forge's segment-geospatial does not ship pip
  # metadata for segment-anything/smoothify, which fails pip check through
  # no fault of this package.
  requires:
    - python {{ python_min }}

about:
  home: https://github.com/johnburley3000/paddocktimeseries
  summary: Paddock-scale Sentinel-2 time series, segmentation, phenology and reports
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thestochasticman
    - johnburley3000
