# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.3"

package:
  name: quax
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/quax/quax-${{ version }}.tar.gz
  sha256: 962f907f9aa8d41a09330e060897af6e6f10d47fc9ff15de163ccfa550f6eed3

build:
  number: 0
  # jaxlib has no win-64 build on conda-forge (at any version), so jax - and
  # therefore quax - cannot be solved on Windows. The platform skip is required,
  # which rules out noarch: python (conda-forge forbids selectors on noarch).
  skip:
    - win
  script:
    env:
      HATCH_VCS_PRETEND_VERSION: ${{ version }}
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python
    - equinox >=0.13.2
    - jax >=0.7.2
    - jaxtyping >=0.3.3
    - packaging >=20.0
    - plum-dispatch >=2.5.7
  run_constraints:
    - rigetti-quax <0a0

tests:
  - python:
      imports:
        - quax
      pip_check: true

about:
  homepage: https://github.com/nstarman/quax
  summary: 'Multiple dispatch in JAX via custom interpreters'
  description: |
    quax implements multiple dispatch over abstract array types in JAX. It lets
    you write ordinary JAX code against array-like objects - symbolic zeros,
    arrays with units, structured matrices, quantised tensors - and have that
    code keep working through jit, grad and the other JAX transformations, by
    routing operations through custom interpreters.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/nstarman/quax

extra:
  recipe-maintainers:
    - MementoRC
