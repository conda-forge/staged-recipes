schema_version: 1

context:
  version: "0.6.0"

package:
  name: r-quadmesh
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/quadmesh_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/quadmesh/quadmesh_${{ version }}.tar.gz
  sha256: 32e888f9e048c3827033334a476401ab2fc9ccd4e468e833661388e4d7b03dac

build:
  number: 0
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
    - r-raster
    - r-gridbase
    - r-png
    - r-sp
    - r-geometry
    - r-reproj >=0.4.0
    - r-scales
    - r-palr
    - r-terra
  run:
    - r-base
    - r-raster
    - r-gridbase
    - r-png
    - r-sp
    - r-geometry
    - r-reproj >=0.4.0
    - r-scales
    - r-palr
    - r-terra

tests:
  - r:
      libraries:
        - quadmesh
  - files:
      source:
        - tests/
    requirements:
      run:
        - r-testthat
    script:
      - Rscript -e "testthat::test_file('tests/testthat.R', stop_on_failure=TRUE)"

about:
  homepage: https://github.com/hypertidy/quadmesh
  summary: Quadrangle Mesh
  description: |-
    Create surface forms from matrix or 'raster' data for
    flexible plotting and conversion to other mesh types. The
    functions 'quadmesh' or 'triangmesh' produce a continuous
    surface as a 'mesh3d' object as used by the 'rgl' package.
    This is used for plotting raster data in 3D (optionally with
    texture), and allows the application of a map projection
    without data loss and many processing applications that are
    restricted by inflexible regular grid rasters. There are
    discrete forms of these continuous surfaces available with
    'dquadmesh' and 'dtriangmesh' functions.
  license: GPL-3.0-only
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  repository: https://github.com/hypertidy/quadmesh

extra:
  recipe-maintainers:
    - conda-forge/r
    - mdsumner

