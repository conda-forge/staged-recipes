schema_version: 1

context:
  name: llm-visuals
  version: "0.14.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/DingoOz/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5194738c0bc93920d676f153e2cc7d1862915bf41e29e52180a8ecb8ce13091e

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: thin
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root "${PREFIX}" --path .
        else:
          - cargo auditable install --locked --no-track --bins --root "%LIBRARY_PREFIX%" --path .

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - llm-visuals --help
  - package_contents:
      bin:
        - llm-visuals

about:
  homepage: https://github.com/DingoOz/llm-visuals
  summary: Live terminal dashboard for a locally running LLM
  description: "Live truecolor terminal dashboard for a locally running LLM: tok/s, TTFT, GPUs, context, MTP acceptance, layer and real expert routing (llama.cpp)"
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/DingoOz/llm-visuals

extra:
  recipe-maintainers:
    - p-vdp
