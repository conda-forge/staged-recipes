# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: a2ui-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/a2ui-core/a2ui_core-${{ version }}.tar.gz
  sha256: 840749f45c477a1a4958a64a9c521dca13192693d745cbf45caafb34902ed6fc

build:
  number: 0
  noarch: python
  script:
    content: ${{ PYTHON }} -m pip install . -vv
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - babel >=2.14.0
    - jsonschema >=4.26.0
    - pydantic >=2.10.0
    - referencing >=0.37.0
    - regex >=2024.11.6

tests:
  - python:
      imports:
        - a2ui.core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m pytest tests/ --import-mode=importlib -m "not performance"
        --ignore=tests/test_codegen_pydantic.py
        --ignore=tests/test_agent_to_renderer_schema.py
        --ignore=tests/test_basic_catalog_documents.py
        --ignore=tests/test_catalog_json.py
        --ignore=tests/test_common_types_schema.py
        --ignore=tests/test_conformance.py
        --ignore=tests/test_peer_catalogs.py
        --ignore=tests/test_reference_map.py
    files:
      source:
        - tests/
    requirements:
      run:
        - pytest
        - pytest-asyncio

about:
  homepage: https://a2ui.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: A2UI Python SDK - Core Library
  description: |
    Framework-agnostic Python library providing the core data models, reactive
    state management, and JSON Schema validation for the A2UI protocol (v0.9
    and later). Implements the protocol's message envelopes (CreateSurface,
    UpdateComponents, UpdateDataModel, DeleteSurface), a reactive state model,
    data binding, and a catalog system for compiled and JSON Schema-based
    component/function definitions, for use by Python server agents,
    rendering backends, and conformance testing frameworks.
  repository: https://github.com/a2ui-project/a2ui/tree/main/python/a2ui_core

extra:
  recipe-maintainers:
    - pb01ka
