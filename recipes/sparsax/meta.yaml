{% set version = "0.9.0" %}

package:
  name: sparsax
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sparsax-{{ version }}.tar.gz
  sha256: 6d69a19f8c84972536d933f86682c382aa5da2e3e71b850adb3bc73c3faba553

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.9
    - scikit-build-core >=0.10
    - nanobind >=2.0
    - jax >=0.9.0
    - pip
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  run:
    - python >=3.9
    - jax >=0.9.0
    - numpy

test:
  imports:
    - sparsax
  commands:
    - pip check
  requires:
    - pip

about:
  summary: JAX-native sparse direct solvers via SuiteSparse (CHOLMOD + KLU)
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - AddYourGitHubIdHere
