schema_version: 1

context:
  version: "0.9.0"

package:
  name: "sparsax"
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sparsax-${{ version }}.tar.gz
  sha256: 6d69a19f8c84972536d933f86682c382aa5da2e3e71b850adb3bc73c3faba553

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.9
    - scikit-build-core >=0.10
    - nanobind >=2.0
    - jax >=0.9.0
    - pip
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  
  run:
    - python >=3.9
    - jax >=0.9.0
    - numpy

tests:
  - python:
      imports:
        - sparsax
      pip_check: true

about:
  summary: JAX-native sparse direct solvers via SuiteSparse (CHOLMOD + KLU)
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - knaaptime
