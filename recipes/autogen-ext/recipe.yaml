schema_version: 1

context:
  version: "0.7.5"

package:
  name: autogen-ext
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/autogen-ext/autogen_ext-${{ version }}.tar.gz
  sha256: 711ab9238ea66ff2abef163c331e538092bdea661620727a4a9b2ebce1c22df9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - autogen-core ==0.7.5

tests:
  - python:
      imports:
        - autogen_ext
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: AutoGen extensions library
  license: MIT
  license_file: LICENSE-CODE
  homepage: https://pypi.org/project/autogen-ext/

extra:
  recipe-maintainers:
    - jsmolic
