schema_version: 1
package:
  name: vdevice
  version: 1.0.0
source:
  url: https://github.com/TitanCSA/Vdevice/releases/download/language-sdks-v1.0.0/vdevice-sdk-source-1.0.0.zip
  sha256: 152d669311f9f60b4d886d0cd3c872544ab82ce555b6e164de71c9a2eae2426c
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - vdevice
    pip_check: true
- script:
  - python -m pip check
  - python -c "from vdevice import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/Vdevice
  summary: Windows x64 Vdevice Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Vdevice-C-ffi/LICENSE
  - Vdevice-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
