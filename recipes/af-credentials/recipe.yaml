schema_version: 1

context:
  version: "0.1.0"

package:
  name: af-credentials
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/af_credentials/af_credentials-${{ version }}.tar.gz
  sha256: dafe201f737dc987f6aa1f4b1a7862549cb22f45db0b14066518728496c82517

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=0.7
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - httpx2 >=2.5.0
    - pyjwt >=2.8

tests:
  - python:
      imports:
        - af_credentials
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Identity-token verification and x509 proxy redemption for AF MCP Platform
  homepage: https://github.com/maniaclab/af-credentials
  repository: https://github.com/maniaclab/af-credentials
  documentation: https://maniaclab.uchicago.edu/af-credentials/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kratsg
