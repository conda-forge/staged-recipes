context:
  version: "0.1.1"

package:
  name: mangabinder
  version: ${{ version }}

source:
  url: https://github.com/Preygle/manga-downloader/releases/download/v${{ version }}/mangabinder-${{ version }}.tar.gz
  sha256: c470e3a4fb1c6204cfb9c971b825835cc8695c00307f08030b68fd282216f348

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - mangabinder = mangabinder.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
  run:
    - python >=${{ python_min }}
    - pillow >=9.1
    - tqdm >=4.60
    - pypdf >=3.9
    - pypdfium2 >=4.0

tests:
  - python:
      imports:
        - mangabinder
        - mangabinder.cli
        - mangabinder.web
        - mangabinder.cbz
        - mangabinder.volumes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - mangabinder --version
      - mangabinder --help

about:
  homepage: https://github.com/Preygle/manga-downloader
  summary: Download manga chapters, convert them to PDF, bind them into volumes and export CBZ
  description: |
    MangaBinder downloads every chapter of a manga series from an online reader,
    converts the chapters to PDF, binds them into volumes using MangaDex / AniList
    volume data (with a bookmark per chapter) and exports CBZ for e-readers. It has
    a command line (`mangabinder download URL --volumes`) and a local browser
    interface (`mangabinder web`).
  license: MIT
  license_file: LICENSE
  repository: https://github.com/Preygle/manga-downloader
  documentation: https://github.com/Preygle/manga-downloader#readme

extra:
  recipe-maintainers:
    - Preygle
