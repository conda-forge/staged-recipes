context:
  version: "2026.08.03.00"

package:
  name: fbthrift
  version: ${{ version }}

source:
  url: https://github.com/facebook/fbthrift/archive/v${{ version }}.tar.gz
  sha256: 7649cdbcdcedd36159d6de089dc2c5bc51e93f724ef581371b51fce906a9df85
  patches:
    # Make find_package(FBThrift) work without fbthrift's source-tree CMake
    # modules and without finding its dependencies first.
    - 0001-Find-dependencies-in-the-CMake-config.patch
    # The static compiler libraries are only linked into thrift1.
    - 0002-Do-not-install-the-static-compiler-libraries.patch
    # thriftmetadata compiles against generated headers that it did not wait
    # for, which fails in builds with low parallelism.
    - 0003-Generate-thrift-types-before-compiling-thriftmetadata.patch

build:
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - fizz ==${{ version }}
    - folly ==${{ version }}
    - mvfst ==${{ version }}
    - wangle ==${{ version }}
    - xxhash
    # Libraries referenced by folly's exported CMake targets.
    - bzip2
    - double-conversion
    - fmt
    - gflags
    - glog
    - if: linux
      then: libaio
    - libboost-devel
    - libevent
    - liblzma-devel
    - libsodium
    - lz4-c
    - openssl
    - snappy
    - zlib
    - zstd
  run_exports:
    # fbthrift is ABI-unstable: consumers must use the exact same version.
    - ${{ pin_subpackage('fbthrift', upper_bound='x.x.x.x') }}

tests:
  - package_contents:
      bin:
        - thrift1
      lib:
        - thriftcpp2
        - thriftprotocol
      include:
        - thrift/lib/cpp2/protocol/Serializer.h
        - thrift/ThriftLibrary.cmake
      files:
        - lib/cmake/fbthrift/FBThriftConfig.cmake
  - files:
      recipe:
        - test/
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        # folly's CMake config needs these development files.
        - libboost-devel
        - liblzma-devel
        - zlib
    script:
      - cmake -S test -B build -G Ninja ${CMAKE_ARGS}
      - cmake --build build
      - ./build/fbthrift_test

about:
  homepage: https://github.com/facebook/fbthrift
  summary: Facebook's branch of Apache Thrift, including a new C++ server
  description: |
    Thrift is a serialization and RPC framework for service communication.
    This package contains the fbthrift compiler (thrift1) and the C++ runtime
    libraries, including the RPC transport stack built on fizz, wangle and
    mvfst.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/facebook/fbthrift

extra:
  recipe-maintainers:
    - baszalmstra
