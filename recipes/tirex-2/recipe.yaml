schema_version: 1

context:
  version: "0.4.0"

package:
  name: tirex-2
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/t/tirex-2/tirex_2-${{ version }}.tar.gz
  sha256: cba2b7f296ec6f6654c7f2ad5d719c6f4f5c376009dec8890e25495ba03faadb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68
    - pip
  run:
    - python >=${{ python_min }}
    # upstream also requires pytorch >=2.10.0 / numpy >=2.3.3 on python >=3.14;
    # conda-forge only has builds for python 3.14 from those versions onward
    - pytorch >=2.8.0
    - numpy >=2.1.3
    - flashrnn >=1.0.8
    - mlstm-kernels >=2.0.6
    - pyyaml >=6
    - huggingface_hub >=0.35.3
    - safetensors >=0.6
    - narwhals >=2.0

tests:
  - python:
      imports:
        - tirex2
      # pip check is disabled because flashrnn's upstream metadata requires
      # the `ninja` python package (conda-forge ships the ninja binary only)
      # and triton (Linux) / triton-windows (Windows), which are optional there.
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: TiRex-2 time series forecasting inference
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/NX-AI/tirex-2
  repository: https://github.com/NX-AI/tirex-2
  documentation: https://nx-ai.github.io/tirex-2/

extra:
  recipe-maintainers:
    - uruthia
    - daidahao
    - martinloretzzz
    - lukfischer
