context:
  version: "0.28.2"

package:
  name: open-knowledge
  version: ${{ version }}

source:
  - url: https://registry.npmjs.org/@inkeep/open-knowledge/-/open-knowledge-${{ version }}.tgz
    sha256: 26a399eff2ba688494e07b7f4f99efec0411ff602e3822c311304e041416a8f0
  # The npm tarball ships prebuilt native bindings only, build them from here.
  - url: https://github.com/inkeep/open-knowledge/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 9031f2a644c8a8a628e67d625ea864a48127ea17537b009fa934742be86136f3
    target_directory: repo

build:
  number: 0
  dynamic_linking:
    binary_relocation: false
  script:
    - if: win
      then:
        - call npm pack --ignore-scripts
        - call npm install --global --ignore-scripts --prefix "%PREFIX%\lib" inkeep-open-knowledge-${{ version }}.tgz
        - cd repo\packages\native-config
        - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
        - cargo build --release --locked
        - node "%RECIPE_DIR%\build.js"
      else:
        - npm pack --ignore-scripts
        - npm install --global --ignore-scripts inkeep-open-knowledge-${{ version }}.tgz
        - cd repo/packages/native-config
        - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
        - cargo build --release --locked
        - node "$RECIPE_DIR/build.js"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - nodejs >=24
  run:
    - git
    - nodejs >=24

tests:
  - script:
      - ok --version
      - ok --help
      - ok config validate
      - open-knowledge --version

about:
  homepage: https://openknowledge.ai/
  summary: Beautiful, AI-native markdown editor and LLM wiki
  description: |
    OpenKnowledge is a local-first markdown editor for knowledge bases,
    LLM wikis, specifications, and notes. It includes a web UI, CLI, MCP
    server, agent skills, semantic search, and Git-based sharing.
  license: GPL-3.0-or-later
  license_file:
    - dist/LICENSE
    - dist/THIRD_PARTY_NOTICES.md
    - repo/packages/native-config/THIRDPARTY.yml
  documentation: https://openknowledge.ai/docs
  repository: https://github.com/inkeep/open-knowledge

extra:
  recipe-maintainers:
    - timkpaine
