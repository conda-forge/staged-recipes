# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kedro-azureml-pipeline
  version: "0.1.0"
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/kedro_azureml_pipeline/kedro_azureml_pipeline-${{ version }}.tar.gz
  sha256: 01810c45540f539a06dc367d8ac006d99f879553ad7a355ddb2a3d4630850f14

build:
  number: 0
  noarch: python
  script:
    env:
      WARNINGS: "ignore::kedro.KedroPythonVersionWarning"
      PYTHONWARNINGS: "ignore::UserWarning"
    content:
      - "${{ PYTHON }} -m pip install -vv --use-pep517 --no-deps --no-build-isolation ."

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - kedro >=1.0.0
    - kedro-datasets >=1.0.0
    - pydantic >=2.6.4
    - cachetools >=5.0.0
    - cloudpickle >=3.0.0
    - azure-ai-ml >=1.2.0
    - pyarrow >=18.0.0
  run_constraints:
    # The optional `mlflow` extra: not installed by default, but bounded when present.
    - azureml-mlflow >=1.42.0
    - mlflow >=3.13
    - kedro-mlflow >=2.0.0

tests:
  - python:
      imports:
        - kedro_azureml_pipeline
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Orchestrate Kedro pipelines with Azure ML Pipeline
  description: |
    Kedro AzureML Pipeline is a Kedro plugin that translates a Kedro pipeline into an
    Azure ML pipeline job, with each Kedro node running as a separate step. It supports
    code-upload and Docker-image workflows, scheduling, Azure ML data assets,
    distributed training, and an optional MLflow integration.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/stateful-y/kedro-azureml-pipeline
  documentation: https://kedro-azureml-pipeline.readthedocs.io
  repository: https://github.com/stateful-y/kedro-azureml-pipeline

extra:
  recipe-maintainers:
    - gtauzin
