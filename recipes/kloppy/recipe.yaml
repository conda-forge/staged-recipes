schema_version: 1

context:
  version: "3.19.1"

package:
  name: kloppy
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/k/kloppy/kloppy-${{ version }}.tar.gz
  sha256: c2e592f8728a0bbe07566f048938b84edb0352064864996a150973a5d7c0ac0a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - kloppy-query = kloppy.cmdline:run_query

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - lxml >=4.4.0
    - typing_extensions
    - sortedcontainers >=2
    - fsspec >=2024.12.0
    - aiohttp
    - requests
    - pytz >=2025.2
    - python-dateutil >=2.9.0.post0

  run_constraints:
    - networkx >=2.4,<3
    - s3fs <2026.1.0
    - pandas >=2.0.3
    - polars >=0.16.6
    - pyarrow >=17.0.0

tests:
  - python:
      imports:
        - kloppy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
        - networkx >=2.4,<3
    script:
      - kloppy-query --help

about:
  summary: Soccer Data Processing, Simplified
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/kloppy/
  repository: https://github.com/PySport/kloppy
  documentation: https://kloppy.pysport.org/

extra:
  recipe-maintainers:
    - probberechts
