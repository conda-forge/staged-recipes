schema_version: 1

context:
  name: require3
  version: "6.0.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/epics-e3/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: c787f7fe533fb285044bda53589ffa58fc1f8263b05b6a0c8dc408d4eb05291f

build:
  skip:
    - win
  number: 0

requirements:
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x.x') }}
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - perl
  host:
    - epics-base
    - pvxs
    - readline
  run:
    - python

tests:
  - package_contents:
      files:
        - etc/conda/activate.d/require3_activate.sh
        - etc/conda/deactivate.d/require3_deactivate.sh
      bin:
        - iocsh
      lib:
        - require
  - script:
      - iocsh --version

about:
  homepage: https://github.com/epics-e3/require3
  summary: EPICS module for dynamically loading functionality at runtime
  license: LGPL-3.0-only
  license_file: LICENSE
  documentation: https://epics-e3.github.io/
  repository: https://github.com/epics-e3/require3

extra:
  recipe-maintainers:
    - lucmaga
    - simon-ess
    - daneos
    - pgap
    - lucianocguedes
    - dharaujo
