context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-nldas3
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-nldas3/tsgettoolbox_nldas3-${{ version }}.tar.gz
  sha256: 2bc02c3f3fc87c679db099bfde427c89b0d3eb45f1d61acfed5e9201e43e5846

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools >=80
  - pip
  run:
  - python >=3.10
  - dask
  - fsspec
  - pandas
  - pydantic >=2
  - tabulate
  - tsgettoolbox >=27.0.0
  - xarray

tests:
  - python:
    imports:
      - tsgettoolbox_nldas3
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: Plugin for tsgettoolbox to access NLDAS-3 data from AWS S3.
  description: |
    .. image:: https://img.shields.io/coveralls/github/timcera/tsgettoolbox_nldas3
        :alt: Test Coverage
        :target: https://coveralls.io/r/timcera/tsgettoolbox_nldas3?branch=master
        :height: 20

    .. image:: https://img.shields.io/pypi/v/tsgettoolbox_nldas3
        :alt: Latest release
        :target: https://pypi.python.org/pypi/tsgettoolbox_nldas3/
        :height: 20

    .. image:: https://img.shields.io/pypi/l/tsgettoolbox_nldas3
        :alt: BSD-3 clause license
        :target: https://pypi.python.org/pypi/tsgettoolbox_nldas3/
        :height: 20

    .. image:: https://img.shields.io/pypi/pyversions/tsgettoolbox_nldas3
        :alt: PyPI - Python Version
        :target: https://pypi.org/project/tsgettoolbox_nldas3/
        :height: 20

    tsgettoolbox_nldas3 - Quick Guide
    =================================
    The 'tsgettoolbox_nldas3' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    National Land Data Assimilation System version 3.  The tsgettoolbox_nldas3 will
    work with Python 3.10+.

    Documentation
    -------------
    Reference documentation is at `tsgettoolbox_documentation`_.

    Installation
    ------------
    At the command line::

        $ pip install tsgettoolbox_nldas3

        OR

        $ conda install -c conda-forge tsgettoolbox_nldas3

    Usage Summary - Command Line
    ----------------------------
    Just run 'tsgettoolbox --help' to get a list of subcommands.  To get detailed
    help for a particular sub-command, for instance 'nldas3', type 'tsgettoolbox
    nldas3 --help'.

    +---------------------+----------+--------+---------+----------+-----------------------+
    | Sub-command         | Spatial  | Time   | Type    | Time     | Description           |
    |                     | Extent   | Extent |         | Interval |                       |
    +=====================+==========+========+=========+==========+=======================+
    | ldas_nldas3_forcing | NAmerica | 2001-  | grid    | HDM      | NLDAS3 Weather        |
    |                     |          |        | 0.01deg |          | Forcing A (surface)   |
    +---------------------+----------+--------+---------+----------+-----------------------+

    +-------------------+-------------+
    | Time Interval     | Description |
    | Code              |             |
    +===================+=============+
    | H                 | Hourly      |
    +-------------------+-------------+
    | D                 | Daily       |
    +-------------------+-------------+
    | M                 | Monthly     |
    +-------------------+-------------+

    Usage Summary - Python Library
    ------------------------------
    To use the tsgettoolbox in a project::

        from tsgettoolbox import tsgettoolbox
        df = tsgettoolbox.ldas_nldas3_forcing(
            34,
            -100,
            variables=["Tair", "Qair"],
            endDate="2002-01-01",
            time_interval="daily",
            )
        print(df.head())

    Refer to the API Documentation at `tsgettoolbox_api`_.

    Usage Summary - Command Line
    ----------------------------

        tsgettoolbox ldas_nldas3_forcing \
            34  \
            -100  \
            --variables=["Tair", "Qair"] \
            --endDate="2002-01-01" \
            --time_interval="daily" > output.csv

    Refer to the command line documentation at `tsgettoolbox_cli`_.

