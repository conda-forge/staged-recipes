context:
  version: 27.0.0

package:
  name: tsgettoolbox-nldas3
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-nldas3/tsgettoolbox_nldas3-${{ version }}.tar.gz
  sha256: 2bc02c3f3fc87c679db099bfde427c89b0d3eb45f1d61acfed5e9201e43e5846

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - dask
  - fsspec
  - pandas
  - pydantic >=2
  - tabulate
  - tsgettoolbox >=27.0.0
  - xarray

tests:
  - python:
      imports:
        - tsgettoolbox_nldas3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Plugin for tsgettoolbox to access NLDAS-3 data from AWS S3.
  description: |
    The 'tsgettoolbox_nldas3' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    National Land Data Assimilation System version 3.
  homepage: https://pypi.org/project/tsgettoolbox_nldas3/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
