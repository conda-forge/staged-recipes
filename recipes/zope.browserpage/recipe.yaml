schema_version: 1

context:
  version: "6.0"
  test_modules:
    - zope.browserpage.tests.test_boundpagetemplate
    - zope.browserpage.tests.test_expressiontype
    - zope.browserpage.tests.test_metaconfigure
    - zope.browserpage.tests.test_namedtemplate
    - zope.browserpage.tests.test_page
    - zope.browserpage.tests.test_simpleviewclass
    - zope.browserpage.tests.test_viewzpt

package:
  name: zope.browserpage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.browserpage/zope_browserpage-${{ version }}.tar.gz
  sha256: 058b825dc6661f5b2c3683b3b65fbfda511d08159c6847831cd1ff67ffb0a45d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.tal >=4.2.0
    - zope.pagetemplate
    - zope.component >=3.7
    - zope.configuration
    - zope.interface
    - zope.publisher >=3.8
    - zope.schema
    - zope.security
    - zope.traversing

tests:
  - python:
      imports:
        - zope.browserpage
        - zope.browserpage.metaconfigure
        - zope.browserpage.simpleviewclass
        - zope.browserpage.viewpagetemplatefile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest -v ${{ test_modules | join(" ") }}
    requirements:
      run:
        - zope.browsermenu
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.browserpage
  repository: https://github.com/zopefoundation/zope.browserpage
  documentation: https://zopebrowserpage.readthedocs.io
  summary: ZCML directives for configuring browser views for Zope
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
