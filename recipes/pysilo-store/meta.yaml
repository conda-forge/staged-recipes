{% set name = "pysilo-store" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pysilo-store/pysilo_store-{{ version }}.tar.gz
  sha256: a15ef55cfdabb8f71bd22bbd6d2e403ff15e483d8eb742e4959f3f2525f219a7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >={{ python_min }}
    - troi-core
    - attrs
    - typing_extensions
    - pandas

test:
  imports:
    - pysilo
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/thestochasticman/pysilo
  summary: Machine-wide cache of SILO daily climate data for Australia
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thestochasticman
    - johnburley3000
