schema_version: 1

context:
  version: "0.0.7"

package:
  name: pyavd-utils
  version: ${{ version }}

source:
  # No sdist is published to PyPI (only wheels), so we build from the tagged
  # GitHub release of the actual source repository instead.
  url: https://github.com/aristanetworks/pyavd-utils/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d84ee7ed10c50a2717eb7f21319f9a220f8c18edf71b06e59a064e0557d718a0

build:
  number: 0
  skip: is_abi3 and not is_python_min
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  python:
    version_independent: ${{ is_abi3 }}

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - if: is_abi3
      then: python-abi3
    - python
    - pip
    - setuptools >=71.0
    - setuptools-rust >=1.12.0
  run:
    - python

tests:
  - python:
      imports:
        - pyavd_utils
        - pyavd_utils.passwords
        - pyavd_utils.validation
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
      pip_check: true
  - if: is_abi3
    then:
      requirements:
        run:
          - abi3audit
      script:
        - if: unix
          then: abi3audit $SP_DIR/pyavd_utils/passwords.abi3.so $SP_DIR/pyavd_utils/validation.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit %SP_DIR%/pyavd_utils/passwords.pyd %SP_DIR%/pyavd_utils/validation.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  homepage: https://github.com/aristanetworks/pyavd-utils
  summary: Rust based utilities used by PyAVD
  description: |
    pyavd-utils provides Rust-accelerated utilities (password hashing and
    schema validation) used internally by PyAVD, Arista's Python library
    for AVD (Ansible Validated Designs) data models. It is not intended to
    be used directly and may not follow semantic versioning.
  license: Apache-2.0
  license_file:
    - LICENSE
    - pyavd_utils/THIRD_PARTY_LICENSES.txt
    - THIRDPARTY.yml
  repository: https://github.com/aristanetworks/pyavd-utils

extra:
  recipe-maintainers:
    - pb01ka
