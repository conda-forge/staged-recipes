schema_version: 1

context:
  version: "1.1.0"

package:
  name: dataproc-spark-connect
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dataproc-spark-connect/dataproc_spark_connect-${{ version }}.tar.gz
  sha256: c4d7337a422e80fe6c5cab7ca4e642de5948c6f5dcbe2e6d6ae4aafd32aad55e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.19
    - google-cloud-dataproc >=5.18
    - packaging >=20.0
    - pyspark >=4.0.0,<4.1.0
    - tqdm >=4.67
    - websockets >=14.0
    # upstream asks for pyspark[connect]; conda-forge has no package for that
    # extra and its pyspark carries only the pandas/pyarrow/numpy part, so the
    # grpc half is listed here
    - grpcio >=1.67.0
    - grpcio-status >=1.67.0
    - googleapis-common-protos >=1.65.0

tests:
  - python:
      imports:
        - google.cloud.dataproc_spark_connect
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GoogleCloudDataproc/dataproc-spark-connect-python
  repository: https://github.com/GoogleCloudDataproc/dataproc-spark-connect-python
  license: Apache-2.0
  license_file: LICENSE
  summary: Dataproc client library for Spark Connect
  description: |
    dataproc-spark-connect extends the Spark Connect Python client with
    support for Google Cloud Dataproc. It creates and manages Dataproc
    Spark sessions from a local environment or a notebook, so a remote
    Dataproc cluster can be driven through the ordinary Spark Connect
    DataFrame API. IPython magics for session management are included.

extra:
  recipe-maintainers:
    - killua156
