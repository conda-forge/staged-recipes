schema_version: 1

context:
  name: ewccli
  version: 0.7.1
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ewccli-${{ version }}.tar.gz
  sha256: 0bb1cc0baafaeb91a0085b90a2070146ec3d6ee0960b5b786f8922ee9f76a243  # UPDATE IT

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ewc = ewccli.ewccli:cli

requirements:
  host:
    - python >=${{ python_min }}
    - hatchling >=1.5
    - pip
  run:
    - python >=${{ python_min }}
    - requests ==2.32.5
    - click ==8.3.0
    - rich ==14.1.0
    - rich-click ==1.9.2
    - prompt-toolkit ==3.0.52
    - pyyaml ==6.0.3
    - cryptography ==46.0.2
    - python-openstackclient ==8.2.0
    - ansible ==10.7.0
    - ansible-runner ==2.4.0
    - python-kubernetes ==34.1.0
    - pydantic == 2.12.5

tests:
  - python:
      imports:
        - ewccli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}
    script:
        - ewc --help

about:
  summary: Python package to handle EWC resources.
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://pypi.org/project/ewccli/
  repository: https://github.com/ewcloud/ewccli

extra:
  recipe-maintainers:
    - pacospace
    - tervo
