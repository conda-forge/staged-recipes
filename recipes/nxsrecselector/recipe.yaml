schema_version: 1

context:
  version: "4.12.0"

package:
  name: nxsrecconfig
  version: ${{ version }}

source:
  url: https://github.com/nexdatas/nxsrecselector/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a0da4f9613420ea17875be07e8b1557e7cceae36b11619008c60e8cf260df6ab

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - argcomplete
    - lxml
    - pytango
    - pytz
    - nxstools >=4.29.0
    - pymysql
    - sardana
    - nxswriter
    - nxsconfigserver

tests:
  - python:
      imports:
        - nxsrecconfig
        - nxsrecconfig.CheckerThread
        - nxsrecconfig.Converter
        - nxsrecconfig.Describer
        - nxsrecconfig.DynamicComponent
        - nxsrecconfig.MacroServerPools
        - nxsrecconfig.NXSConfig
        - nxsrecconfig.ProfileManager
        - nxsrecconfig.Release
        - nxsrecconfig.Selection
        - nxsrecconfig.Selector
        - nxsrecconfig.Settings
        - nxsrecconfig.StreamSet
        - nxsrecconfig.Utils
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - if: unix
        then:
          - test -x "$PREFIX/bin/NXSRecSelector"
          - NXSRecSelector --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/nexdatas/nxsrecselector
  repository: https://github.com/nexdatas/nxsrecselector
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: NeXus Recorder Selector tango server
  description: |
    NXSRecSelector is a Tango server with Sardana Recorder settings.
    It serves as a backend of nxselector GUI to select NeXus components
    and to configure measurement group used in sardana scans.

extra:
  recipe-maintainers:
    - jkotan
