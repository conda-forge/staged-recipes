context:
  version: "0.3.0"

package:
  name: lazyssh
  version: ${{ version }}

source:
  url: https://github.com/adembc/lazyssh/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 36cd630b3cd9447e88904171cbb64944aeacbbd62c15db66d8a0e4a4486ffe88
  target_directory: src

build:
  number: 0
  script:
    - cd src
    - go-licenses save ./cmd --save_path ../library_licenses
    - if: unix
      then: go build -v -o $PREFIX/bin/lazyssh -ldflags="-s -w -X main.version=v${{ version }}" ./cmd
      else: go build -v -o %LIBRARY_BIN%\lazyssh.exe -ldflags="-s -X main.version=v${{ version }}" ./cmd

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script: lazyssh --help
  - package_contents:
      bin:
        - lazyssh
      strict: true

about:
  homepage: https://github.com/adembc/lazyssh
  summary: Terminal-based SSH manager inspired by lazydocker and k9s
  description: |
    lazyssh is a terminal UI for browsing, connecting to, and managing
    SSH servers defined in ~/.ssh/config.
  license: Apache-2.0
  license_file:
    - src/LICENSE
    - library_licenses/
  repository: https://github.com/adembc/lazyssh

extra:
  recipe-maintainers:
    - moritzwilksch
