schema_version: 1

context:
  version: "2.4.2"

package:
  name: windows-curses
  version: ${{ version }}

source:
  url: https://github.com/zephyrproject-rtos/windows-curses/archive/v${{ version }}.tar.gz
  sha256: 22f097c3bf9844188b58bab3cb631a1f816d46570eb79f48bbbe83b85c860406

build:
  skip:
    - not win
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
  host:
    - python
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - windows_curses
      pip_check: true

about:
  summary: Windows Curses Python module
  license: EPL-2.0
  license_file: LICENSE
  homepage: https://github.com/zephyrproject-rtos/windows-curses

extra:
  recipe-maintainers:
    - thewchan
