context:
  name: agentjit
  version: "0.1.4"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agentjit/agentjit-${{ version }}.tar.gz
  sha256: 6c77e112098939fb20d836c85b3bf16f22087ec611550f1371b3c7cc18ece04a

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - agentjit
      pip_check: true

about:
  homepage: https://github.com/eminsk/agentjit
  summary: Just-In-Time Compiler for AI Agent Trajectories
  description: |
    AgentJIT traces dynamic agent trajectories and compiles them into pure,
    type-safe, ultra-fast Python code with zero token cost.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/eminsk/agentjit
  documentation: https://github.com/eminsk/agentjit#readme

extra:
  recipe-maintainers:
    - eminsk
