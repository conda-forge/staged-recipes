schema_version: 1

context:
  name: pflare
  version: "1.27.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/PFLAREProject/PFLARE/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 2ea428f9e9f8041554932e384308643b9e8b02e22f772faac2b675d889281e0e

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - make
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython
        - numpy
        - ${{ mpi }}
  host:
    - python
    - setuptools
    - cython
    - numpy
    - ${{ mpi }}
    # pflare requires petsc >=3.26, pinned in conda_build_config.yaml
    - petsc
    # PFLARE only supports real scalars
    - petsc * real_*
    - petsc4py
    - libblas
    - liblapack
  run:
    - python
    - petsc4py

tests:
  - python:
      imports:
        - pflare
      pip_check: false
  - package_contents:
      lib:
        - pflare
      include:
        - pflare.h

about:
  homepage: https://github.com/PFLAREProject/PFLARE
  summary: Library with parallel iterative methods for asymmetric linear systems built on PETSc.
  description: |
    PFLARE provides scalable, parallel iterative methods for asymmetric linear
    systems, including the AIRG reduction multigrid (PCAIR) and polynomial
    approximate inverses (PCPFLAREINV), as PETSc preconditioners usable from
    C, Fortran and Python (via petsc4py).
  license: MIT
  license_file: LICENSE
  repository: https://github.com/PFLAREProject/PFLARE
  documentation: https://github.com/PFLAREProject/PFLARE#readme

extra:
  recipe-maintainers:
    - stevendargaville
