context:
  version: "2.2.4"

package:
  name: dagrejs-graphlib
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@dagrejs/graphlib/-/graphlib-${{ version }}.tgz
  sha256: bb9d64d04cfa124ebaef8898953ea270a5f7128f3efe7347da88758ea78ddfd3
  target_directory: graphlib

build:
  number: 0
  noarch: generic
  script: |
    mkdir -p "$PREFIX/lib/node_modules/@dagrejs/graphlib"
    cp -R "$SRC_DIR/graphlib/." "$PREFIX/lib/node_modules/@dagrejs/graphlib"

tests:
  - package_contents:
      files:
        - lib/node_modules/@dagrejs/graphlib/package.json
  - script:
      - node -e "const graphlib = require(process.env.PREFIX + '/lib/node_modules/@dagrejs/graphlib'); const graph = new graphlib.Graph(); graph.setNode('a'); if (!graph.hasNode('a')) process.exit(1)"
    requirements:
      run:
        - nodejs

about:
  homepage: https://github.com/dagrejs/graphlib
  repository: https://github.com/dagrejs/graphlib
  summary: A directed and undirected multigraph library
  license: MIT
  license_file: graphlib/LICENSE

extra:
  recipe-maintainers:
    - phreed
