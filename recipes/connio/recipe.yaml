schema_version: 1

context:
  version: "0.2.0"

package:
  name: connio
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/connio/connio-${{ version }}.tar.gz
  sha256: a06a4965d1ce6a4621b511183a98f04a1e2c50ae59ca20f55537d5fea3501aaa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.5
    - pip
    - setuptools
  run:
    - python >=3.5
    - serialio >=2.2
    - sockio >=0.11

tests:
  - python:
      imports:
        - connio
      pip_check: true

about:
  summary: Concurrency agnostic socket API
  license: GPL-3.0-or-later
  repository: https://github.com/tiagocoutinho/connio/

extra:
  recipe-maintainers:
    - rhomspuron
