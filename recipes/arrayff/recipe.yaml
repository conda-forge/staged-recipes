context:
  version: "0.0.1"
  python_min: "3.12"

package:
  name: arrayff
  version: ${{ version }}

source:
  url: https://github.com/LiuGaoyong/ArrayFF/releases/download/v${{ version }}/arrayff-${{ version }}.tar.gz
  sha256: 9002e0aa31eedaab8943fa4ccb173741f757b5882ad0009d3bf42700d4cc7cfa

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - ase >=3.20
    - autograd >=1.6
    - autoray >=0.1
    - numpy >=2.0
    - scipy >=1.10
    - scikit-learn >=1.5

tests:
  - python:
      imports:
        - arrayff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/LiuGaoyong/ArrayFF
  summary: The Force Field Library Based on Multiple Array Backends like NumPy, PyTorch, JAX.
  description: |
    The Force Field Library Based on Multiple Array Backends like NumPy, PyTorch, JAX.
  license: GPL-3.0-or-later
  license_file: src/LICENSE
  repository: https://github.com/LiuGaoyong/ArrayFF

extra:
  recipe-maintainers:
    - LiuGaoyong
