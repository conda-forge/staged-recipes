schema_version: 1

context:
  name: msmbuilder-neo
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/msmbuilder_neo-${{ version }}.tar.gz
  sha256: c6a59c592d4c9d50fdb1f9970e040d474c295c09fe654e0bdb8b16bf1edd320a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - msmb = msmbuilder.scripts.msmb:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - meson-python >=0.17
    - meson >=1.4
    - ninja
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.11
    - scikit-learn >=1.3
    - joblib
    - pandas >=1.5
    - mdtraj >=1.10
    - numba >=0.60
    - h5py >=3.8
    - fastcluster
    - jinja2
    - pyyaml
    - tqdm
    - numpydoc
  run_constraints:
    # msmbuilder-neo installs the same `msmbuilder` package and `msmb`
    # command as the original msmbuilder, so the two cannot coexist
    - msmbuilder <0.0a0

tests:
  - python:
      imports:
        - msmbuilder
        - msmbuilder.msm
        - msmbuilder.decomposition
        - msmbuilder.cluster
        - msmbuilder.featurizer
        - msmbuilder.lumping
      python_version:
        - ${{ python_min }}.*
        - "*"
      # pip check runs below: conda-forge's mdtraj declares netcdf4 in its
      # Python metadata without depending on it
      pip_check: false
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
        - netcdf4
    script:
      - pip check
      - msmb -h

about:
  summary: 'Statistical models for biomolecular dynamics: featurization, tICA, VAMP, clustering, Markov state models and HMMs'
  description: |
    MSMBuilder Neo is a modernized fork of MSMBuilder (via msmbuilder2022):
    featurization of molecular dynamics simulations, tICA and VAMP,
    clustering, Markov state models, hidden Markov models, transition path
    theory, PCCA+ macrostates and reproducible YAML pipelines. It is
    imported as `msmbuilder` and provides the `msmb` command, so it cannot
    be installed together with the original `msmbuilder` package.
  license: LGPL-2.1-or-later
  license_file: LICENSE
  homepage: https://github.com/sbhakat/msmbuilder-neo
  documentation: https://sbhakat.github.io/msmbuilder-neo/
  repository: https://github.com/sbhakat/msmbuilder-neo

extra:
  recipe-maintainers:
    - sbhakat
