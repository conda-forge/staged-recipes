schema_version: 1

context:
  version: "0.2.0"

package:
  name: sphinx-searchlite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinx-searchlite/sphinx_searchlite-${{ version }}.tar.gz
  sha256: 74b82fd6461383c03f108825f2d03047ae500207009532c1155a5a91aa72e718

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - sphinx >=7.2.6,<10

tests:
  - python:
      imports:
        - sphinx_searchlite
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/python-project-templates/sphinx-searchlite
  summary: Client-side BM25 documentation search for any Sphinx theme
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/python-project-templates/sphinx-searchlite

extra:
  recipe-maintainers:
    - timkpaine
