schema_version: 1

context:
  python_min: "3.11"
  version: "0.20.0"

package:
  name: earthcarekit
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/e/earthcarekit/earthcarekit-${{ version }}.tar.gz
  sha256: b2a4315e804afeaf6aa89e83be56d8974afa57d79ad0a269e0745ba5d05e43f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - ecdownload = earthcarekit.download.main:main
      - ecquicklook = earthcarekit.plot.quicklook.main:main
      - ecki = earthcarekit.ecki.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2.3.2
    - pandas >=2.3.1
    - xarray >=2025.7.1
    - matplotlib-base >=3.10.3
    - plotly >=6.2.0
    - seaborn >=0.13.2
    - cartopy >=0.24.1
    - cmcrameri >=1.9
    - scipy >=1.16.1
    - owslib >=0.34.1
    - jupyterlab >=4.4.5
    - h5netcdf >=1.6.3
    - netcdf4 >=1.7.2
    - h5py >=3.16.0
    - tomli-w >=1.2.0
    - tqdm >=4.67.3
    - lxml >=6.0.2
    - aiohttp >=3.14.0
    - fsspec >=2026.3.0
    - pystac-client >=0.9.0

tests:
  - python:
      imports:
        - earthcarekit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - ecdownload --help
      - ecquicklook --help
      - ecki --help

about:
  summary: A Python package to simplify working with EarthCARE satellite data.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/earthcarekit/
  repository: https://github.com/TROPOS-RSD/earthcarekit
  documentation: https://tropos-rsd.github.io/earthcarekit/

extra:
  recipe-maintainers:
    - koenigleon
