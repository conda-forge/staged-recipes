context:
  version: "0.0.2"

package:
  name: remotezip2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/remotezip2/remotezip2-${{ version }}.tar.gz
  sha256: db38fb14d0c297af6da8756808bb25f9d3b2c23c7639a14f7a74794b2fc9a261

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - python-remotezip2=remotezip2:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
  run:
    - python >=${{ python_min }}
    # missing from the upstream package metadata
    - requests

tests:
  - python:
      imports:
        - remotezip2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python-remotezip2 --help

about:
  homepage: https://github.com/doronz88/python-remotezip2
  summary: Access zip files over HTTP without downloading the whole archive
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
