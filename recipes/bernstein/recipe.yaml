context:
  version: "3.22.0"
  python_min: "3.12"

package:
  name: bernstein
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bernstein/bernstein-${{ version }}.tar.gz
  sha256: f70d6c7d7e8060b733a658a00d511814c82d62a6795199b0ebf3c5dec9c5356f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bernstein = bernstein.cli.main:cli
      - bernstein-worker = bernstein.core.worker:main
      - bernstein-bench = bernstein.eval.bench.bench_cli:bench_group
      - verify-audit-receipt = bernstein.core.verifier.audit_receipt_verifier:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - fastapi >=0.115
    - starlette >=1.0.1
    - uvicorn >=0.30
    - httpx >=0.27
    - cryptography >=50.0.0
    - pyyaml >=6.0
    - rich >=13.0
    - textual >=1.0
    - click >=8.3.3
    - openai >=2.36.0
    - pydantic-settings >=2.13.1
    - python-dotenv >=1.2.2
    - setproctitle >=1.3
    - prometheus_client >=0.21
    - pluggy >=1.5
    - mcp >=1.28.1,<2
    - watchdog >=4.0
    - opentelemetry-api >=1.41.1
    - opentelemetry-sdk >=1.41.1
    - opentelemetry-exporter-otlp >=1.41.1
    - pillow >=12.3.0
    - pyfiglet >=1.0
    - terminaltexteffects >=0.11
    - websockets >=14.0
    - signxml >=4.0
    - defusedxml >=0.7.1
    - keyring >=25.0
    - jsonschema >=4.20
    - asn1crypto >=1.5
    - cbor2 >=5.6
    - reportlab >=5,<6
    - python-frontmatter >=1.1
    - idna >=3.15
    - packaging >=24
    - python-tzdata >=2024.1

tests:
  - python:
      imports:
        - bernstein
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - bernstein --help

about:
  homepage: https://bernstein.run
  summary: Open-source governance layer for AI agents
  description: |
    Bernstein runs agent CLIs (Claude Code, Codex, Gemini CLI and 40+ others)
    in per-task git worktrees under a deterministic scheduler with no model in
    the coordination loop, so replaying a plan reproduces its task graph.
    Each run produces signed lineage and an optional HMAC audit chain that a
    reviewer can verify offline.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://docs.bernstein.run
  repository: https://github.com/sipyourdrink-ltd/bernstein

extra:
  recipe-maintainers:
    - chernistry
