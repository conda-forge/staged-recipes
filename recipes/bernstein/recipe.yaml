context:
  version: "4.0.2"
  python_min: "3.12"

package:
  name: bernstein
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bernstein/bernstein-${{ version }}.tar.gz
  sha256: b6cd330d9e7ac859db34c9e0d5ecc8f66f631bf02e1366d8dbab669fb4c018ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bernstein = bernstein.cli.main:cli
      - bernstein-worker = bernstein.core.worker:main
      - bernstein-bench = bernstein.eval.bench.bench_cli:bench_group
      - verify-audit-receipt = bernstein.core.verifier.audit_receipt_verifier:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - fastapi >=0.162.4
    - starlette >=1.0.1
    - uvicorn >=0.30
    - httpx >=0.27
    - cryptography >=50.0.0
    - pyyaml >=6.0
    - rich >=13.0
    - textual >=1.0
    - click >=8.5.1
    - openai >=3.49.0
    - pydantic >=2.14.3
    - pydantic-settings >=2.13.1
    - python-dotenv >=1.2.2
    - setproctitle >=1.3
    - prometheus_client >=0.21
    - pluggy >=1.5
    - mcp >=2.3.0,<2.4
    - watchdog >=4.0
    - opentelemetry-api >=1.45.1
    - opentelemetry-sdk >=1.41.1
    - opentelemetry-exporter-otlp >=1.41.1
    - pillow >=13.0.0
    - pyfiglet >=1.0
    - terminaltexteffects >=0.11
    - websockets >=14.0
    - signxml >=4.0
    - lxml >=6.1.3
    - defusedxml >=0.7.1
    - keyring >=25.0
    - jsonschema >=4.20
    - asn1crypto >=1.5
    - cbor2 >=6.2.1
    - reportlab >=5,<6
    - idna >=3.15
    - packaging >=24
    - python-tzdata >=2024.1

tests:
  - python:
      imports:
        - bernstein
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - bernstein --help

about:
  homepage: https://bernstein.run
  summary: Open-source governance layer for AI agents
  description: |
    Bernstein runs agent CLIs (Claude Code, Codex, Gemini CLI and others)
    in per-task git worktrees under a deterministic scheduler with no model in
    the coordination loop, so replaying a plan reproduces its task graph.
    Runs are recorded in a replay journal and a lineage record; an opt-in
    HMAC-chained audit log adds receipts that can be verified offline.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://docs.bernstein.run
  repository: https://github.com/sipyourdrink-ltd/bernstein

extra:
  recipe-maintainers:
    - chernistry
