context:
  version: "0.11.0"

package:
  name: qrcode-barcode-scanner
  version: ${{ version }}

source:
  # The published PyPI source distribution, built with maturin.
  - url: https://pypi.org/packages/source/q/qrcode-barcode-scanner/qrcode_barcode_scanner-${{ version }}.tar.gz
    sha256: 1ca488eaa04eec33022cf7211221c888b2ea8b00d3889e68b2ae8e5e066d1f03
  # The test image of tag v0.11.0: a QR code and a Code 128 in one picture.
  - url: https://raw.githubusercontent.com/qrcode-ai-com/qrcode-barcode-scanner-rust/v${{ version }}/fixtures/symbology/mixed-code128-qr.png
    sha256: c636e8d56df483ff1ec06dbe9b5bcba226c579f8fc1c3d10c4ccf4e100762ec8
    file_name: mixed-code128-qr.png
    target_directory: test-fixture

build:
  number: 0
  script:
    # The sdist keeps the rxing overflow checks in its own release profile; no panic=abort.
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cargo-bundle-licenses --manifest-path qrcode-ai-scanner-py/Cargo.toml --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.9.3,<2
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.9.3,<2
  run:
    - python

tests:
  - python:
      imports:
        - qrcode_barcode_scanner
      pip_check: true
  - files:
      source:
        - test-fixture/mixed-code128-qr.png
      recipe:
        - test_scan.py
    requirements:
      run:
        - python
    script:
      - python test_scan.py test-fixture/mixed-code128-qr.png

about:
  homepage: https://github.com/qrcode-ai-com/qrcode-barcode-scanner-rust
  summary: Offline QR code and barcode scanning for Python, with QR scannability scores
  description: |
    qrcode_barcode_scanner reads every QR code and barcode in image bytes and returns the
    report as a dictionary: the format, text and raw bytes of each code, its position, and a
    scannability score for QR codes. It runs locally in a native extension; nothing is uploaded.
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - qrcode-ai-scanner/LICENSE-APACHE-2.0
    - qrcode-ai-scanner/THIRD-PARTY.md
    - THIRDPARTY.yml
  repository: https://github.com/qrcode-ai-com/qrcode-barcode-scanner-rust
  documentation: https://github.com/qrcode-ai-com/qrcode-barcode-scanner-rust/blob/main/docs/api/python.mdx

extra:
  recipe-maintainers:
    - ThibautMelen
