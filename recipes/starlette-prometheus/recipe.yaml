schema_version: 1

context:
  version: 0.10.0

package:
  name: starlette-prometheus
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/starlette-prometheus/starlette_prometheus-${{ version }}.tar.gz
  sha256: 77d1e9cfad572206e8de242975bd00a62e33685eb330389f2add04e4d719d47d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    # Upstream declares requires = ["poetry>=0.12"] with
    # build-backend = "poetry.masonry.api", which lives in poetry proper, not
    # poetry-core. Mirrored exactly rather than substituted.
    - python ${{ python_min }}.*
    - poetry >=0.12
    - pip
  run:
    # requires-python is <4.0,>=3.8; the 3.8 floor is below conda-forge's, so
    # python_min governs. The <4.0 cap is a no-op and is not carried over.
    - python >=${{ python_min }}
    - starlette >=0.12.2
    - prometheus_client >=0.12

tests:
  - python:
      imports:
        - starlette_prometheus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Prometheus integration for Starlette
  # LICENSE reads "either version 3 ... or (at your option) any later version",
  # and PyPI declares GPL-3.0+. That is -or-later, not -only.
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/PeRDy/starlette-prometheus
  repository: https://github.com/PeRDy/starlette-prometheus

extra:
  recipe-maintainers:
    - killua156
