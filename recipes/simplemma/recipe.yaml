schema_version: 1

context:
  version: "0.9.1"

package:
  name: simplemma
  version: ${{ version }}

source:
  url: https://github.com/adbar/simplemma/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0bc08f33c2fbe9e5396bc77e83242ed2f5aba43c16e8a07095cf9fc8f36a6ab3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - simplemma
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A simple multilingual lemmatizer for Python.
  license: MIT
  license_file:
    - LICENSE
    - licenses/*.txt
  homepage: https://github.com/adbar/simplemma

extra:
  recipe-maintainers:
    - thewchan
