schema_version: 1

context:
  version: "0.9.1"

package:
  name: simplemma
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/simplemma/simplemma-${{ version }}.tar.gz
  sha256: 98ebcaf659bd1e281d9d87716a95d5c148d318dc18d866d3549990d6b3334749

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - simplemma
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A simple multilingual lemmatizer for Python.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/adbar/simplemma

extra:
  recipe-maintainers:
    - thewchan
