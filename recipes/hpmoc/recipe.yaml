schema_version: 1

context:
  name: hpmoc
  version: "1.0.0"

package:
  name: hpmoc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: a1114c667818779b0278c034ae5c78ee5c6b044822d5a933f05b67ed3036976b
  patches:
    # hpmoc/healpy.py uses importlib.util without importing it, so a bare
    # `import hpmoc` fails unless something else imported it first
    - 0001-import-importlib-util.patch

build:
  number: 0
  noarch: python
  # --no-build-isolation skips bump2version, which upstream lists as a
  # build requirement but only uses for release tagging
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - flit-core >=2,<4
    - pip
    - python ${{ python_min }}.*
  run:
    - astropy-base
    - astropy-healpix
    - matplotlib-base
    - numpy >=1.21
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - hpmoc
        - hpmoc.partial
      pip_check: true
      python_version: ["${{ python_min }}.*", "3.14.*"]

about:
  summary: HEALPix multi-order coordinate (MOC) sky map tools
  description: |
    Utilities for working with HEALPix sky maps, including multi-order
    coordinate (MOC) sky maps as used in gravitational-wave alerts.
  homepage: https://github.com/markalab/hpmoc
  repository: https://github.com/markalab/hpmoc
  documentation: https://hpmoc.stc.sh/
  license: GPL-2.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bpiotrzkowski
