{% set name = "protocolith" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/protocolith-{{ version }}.tar.gz
  sha256: 8f0b2dd220aa1ed9cb7d6a31c2adb4d2d71c3886ed15d18b7325ab3635f84cba

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - protocolith = protocolith.cli:main
    - plith = protocolith.cli:main

requirements:
  host:
    - python >=3.11
    - pip
    - hatchling
    - hatch-fancy-pypi-readme >=24.1.0
  run:
    - python >=3.11

test:
  imports:
    - protocolith
    - protocolith.core
  commands:
    - pip check
    - protocolith --version
    - plith --version
  requires:
    - pip

about:
  home: https://github.com/Protocolith/protocolith
  summary: Records, verifies and issues trial records: frozen protocol, hashed sources, honest result status.
  description: |
    Protocolith freezes a protocol before a run, records results in a hash-chained ledger, verifies the ledger and issues
    evidence cards. The core uses only the Python standard library and ships a command line, a Python API and an MCP server.
  license: Apache-2.0
  license_family: APACHE
  license_file:
    - LICENSE
    - NOTICE
  doc_url: https://protocolith.github.io/protocolith/docs/
  dev_url: https://github.com/Protocolith/protocolith

extra:
  recipe-maintainers:
    - NeoZorK
