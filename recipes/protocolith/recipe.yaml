context:
  version: "0.6.0"
  python_min: "3.11"

package:
  name: protocolith
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/protocolith/protocolith-${{ version }}.tar.gz
  sha256: 8f0b2dd220aa1ed9cb7d6a31c2adb4d2d71c3886ed15d18b7325ab3635f84cba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - protocolith = protocolith.cli:main
      - plith = protocolith.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-fancy-pypi-readme >=24.1.0
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - protocolith
        - protocolith.core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - protocolith --version
      - plith --version

about:
  homepage: https://github.com/Protocolith/protocolith
  summary: Records, verifies and issues trial records: frozen protocol, hashed sources, honest result status
  description: |
    Protocolith freezes a protocol before a run, records results in a hash-chained
    ledger, verifies the ledger and issues evidence cards. The core uses only the
    Python standard library and ships a command line, a Python API and an MCP server.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://protocolith.github.io/protocolith/docs/
  repository: https://github.com/Protocolith/protocolith

extra:
  recipe-maintainers:
    - NeoZorK
