# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"
  # platform
  export: ${{ "export" if unix else "set" }}
  env_src_dir: ${{ "${SRC_DIR}" if unix else "%SRC_DIR%" }}
  # go
  go_mod: github.com/Open-MBEE/OpenSysML
  go_build: go build -v -buildmode=pie -trimpath -modcacherw
  go_bin: ${{ "%LIBRARY_BIN%\\sysml.exe" if win else "$PREFIX/bin/sysml" }}
  # python
  py_dir: ${{ go_mod }}/client/python
  python_check_max: "3.14"
  py_grpcio_min: "1.83.0"
  py_protobuf_min: "7.35.1"

recipe:
  name: opensysml
  version: ${{ version }}

source:
  url: https://${{ go_mod }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: aee03fe0b5a41fc6d06ee1640bed4f7963da96c9acce4bb269c83f480908ebf9
  target_directory: ${{ go_mod }}

build:
  number: 0

outputs:
  - package:
      name: opensysml-go
    requirements:
      build:
        - ${{ compiler("go-nocgo") }}
        - go-licenses
    build:
      script:
        content:
          - ${{ export }} "GOPATH=${{ env_src_dir }}"
          - cd ${{ go_mod }}/cmd/sysml
          - ${{ go_build }} -o "${{ go_bin }}"
          - go-licenses save . --save_path "${{ SRC_DIR }}/library_licenses" --ignore ${{ go_mod }}
    tests:
      - package_contents:
          strict: true
          bin:
            - sysml
      - script:
          - sysml --version
    about:
      license_file:
        - ${{ go_mod }}/LICENSE
        - library_licenses/

  - package:
      name: opensysml-python
    build:
      noarch: python
      python:
        entry_points:
          - opensysml-generate = opensysml.generate:main
      script:
        - cd ${{ py_dir }}
        - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools >=77
      run:
        - grpcio >=${{ py_grpcio_min }}
        - protobuf >=${{ py_protobuf_min }}
        - python >=${{ python_min }}
        - sigstore >=4.5.0,<5
    tests:
      - package_contents:
          strict: true
          files:
            - etc/conda/test-files/opensysml-python
          site_packages:
            - opensysml/**
            - opensysml-${{ version }}.dist-info/**
      - python:
          imports: opensysml
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - files:
          source:
            - ${{ py_dir }}/tests/**
            - pyproject.toml
        requirements:
          run:
            - grpcio-tools ${{ py_grpcio_min }}.*
            - psutil >=5.9.0
            - pytest-cov >=5.0.0
            - pytest-mock >=3.10.0
            - python ${{ python_min }}.*
            # use mins from above
            - pip
            - grpcio ${{ py_grpcio_min }}.*
            - protobuf ${{ py_protobuf_min }}.*
        script:
          - pip check
          - cd ${{ py_dir }}
          - coverage run --source opensysml --branch -m pytest -vv --tb=long --color=yes
          - coverage report --show-missing --skip-covered --fail-under=100

about:
  summary: Open Source SysML v2 Implementation in Go
  homepage: https://opensysml.org
  license: Apache-2.0
  license_file: ${{ go_mod }}/LICENSE
  repository: https://github.com/Open-MBEE/OpenSysML

extra:
  feedstock-name: opensysml
  recipe-maintainers:
    - bollwyvl
