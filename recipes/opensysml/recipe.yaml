# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.0"
  summary: Open Source SysML v2 Implementation in Go
  # platform
  export: ${{ "export" if unix else "set" }}
  env_src_dir: ${{ "${SRC_DIR}" if unix else "%SRC_DIR%" }}
  cat: ${{ "cat" if unix else "" }}
  grep: ${{ "grep -iE " if unix else "findstr /r /c:" }}
  # go
  go_mod: github.com/Open-MBEE/OpenSysML
  go_ld_flags: -s -w -X main.Version=${{ version }}
  go_licenses: |-
    go-licenses save . --save_path library_licenses --ignore ${{ go_mod }}
  go_build: ${{ go_licenses }} && go build -v -buildmode=pie -trimpath -modcacherw -ldflags="${{ go_ld_flags }}"
  # go packages
  go_cli_bin: ${{ "%LIBRARY_BIN%\\sysml.exe" if win else "${PREFIX}/bin/sysml" }}
  go_grpc_bin: ${{ "%LIBRARY_BIN%\\sysml-grpc.exe" if win else "${PREFIX}/bin/sysml-grpc" }}
  go_lsp_bin: ${{ "%LIBRARY_BIN%\\sysml-lsp.exe" if win else "${PREFIX}/bin/sysml-lsp" }}
  go_jpy_bin: ${{ "%LIBRARY_BIN%\\sysml-jupyter-kernel.exe" if win else "${PREFIX}/bin/sysml-jupyter-kernel" }}
  # python
  py_dir: ${{ go_mod }}/client/python
  python_check_max: "3.14"
  py_grpcio_min: "1.83.0"
  py_protobuf_min: "7.35.1"
  pip_install: pip install . --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
  # jupyter
  py_jpy_dir: ${{ go_mod }}/client/jupyter-kernel
  js_labext_dir: ${{ go_mod }}/editor/jupyterlab
  jupyterlab_min: "4.5"
  jupyterlab_max: "5"
  # test
  grep_version: ${{ grep }}${{ version | replace(".", "\\.") }}

recipe:
  name: opensysml
  version: ${{ version }}

source:
  url: https://${{ go_mod }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a2b5e7fc73105db6edaeab83245c7b09ffee23837b08c8d7a4df4de5e7e18349
  target_directory: ${{ go_mod }}
  patches:
    - 0000-conda-sysml-grpc-path.patch

build:
  number: 0

outputs:
  # go #########################################################################
  - package:
      name: opensysml
    requirements:
      build:
        - ${{ compiler("go-nocgo") }}
        - go-licenses
    build:
      script:
        content:
          - ${{ export }} "GOPATH=${{ env_src_dir }}"
          - cd ${{ go_mod }}/cmd/sysml
          - ${{ go_build }} -o "${{ go_cli_bin }}"
    tests:
      - package_contents:
          strict: true
          bin:
            - sysml
      - script:
          - sysml --help
          - sysml --version
          - sysml --version | ${{ grep_version }}
    about:
      license_file:
        - ${{ go_mod }}/LICENSE
        - ${{ go_mod }}/cmd/sysml/library_licenses/**

  - package:
      name: opensysml-grpc
    requirements:
      build:
        - ${{ compiler("go-nocgo") }}
        - go-licenses
    build:
      script:
        content:
          - ${{ export }} "GOPATH=${{ env_src_dir }}"
          - cd ${{ go_mod }}/cmd/sysml-grpc
          - ${{ go_build }} -o "${{ go_grpc_bin }}"
          - cd "${{ RECIPE_DIR }}"
          - if: unix
            then:
              - mkdir -p "${PREFIX}/etc/conda/env_vars.d"
              - |-
                echo "{\"OPENSYSML_BINARY\": \"${PREFIX}/bin/sysml-grpc\"}" > "${PREFIX}/etc/conda/env_vars.d/opensysml-grpc.json"
            else:
              - mkdir "%PREFIX%\etc\conda\env_vars.d"
              - |-
                echo {"OPENSYSML_BINARY": "%PREFIX%\\Library\\bin\\sysml-grpc.exe"} > "%PREFIX%\\etc\\conda\\env_vars.d\\opensysml-grpc.json"
    tests:
      - package_contents:
          strict: true
          files:
            - etc/conda/env_vars.d/opensysml-grpc.json
          bin:
            - sysml-grpc
      - script:
          - sysml-grpc --help
          - sysml-grpc --version
          - sysml-grpc --version | ${{ grep_version }}
    about:
      summary: ${{ summary }} - GRPC server
      license_file:
        - ${{ go_mod }}/LICENSE
        - ${{ go_mod }}/cmd/sysml-grpc/library_licenses/**

  - package:
      name: opensysml-jupyter-kernel
    requirements:
      build:
        - ${{ compiler("go-nocgo") }}
        - go-licenses
    build:
      script:
        content:
          - ${{ export }} "GOPATH=${{ env_src_dir }}"
          - cd ${{ go_mod }}/cmd/sysml-jupyter-kernel
          - ${{ go_build }} -o "${{ go_jpy_bin }}"
          - if: build_platform == target_platform
            then:
              - sysml-jupyter-kernel --help
              - sysml-jupyter-kernel -install -prefix "${{ PREFIX }}"
    tests:
      - package_contents:
          strict: true
          bin:
            - sysml-jupyter-kernel
          files:
            - share/jupyter/kernels/sysml/kernel.json
            - share/jupyter/kernels/sysml/**
      - script:
          - sysml-jupyter-kernel --help
          - sysml-jupyter-kernel --version
          - sysml-jupyter-kernel --version | ${{ grep_version }}
      - requirements:
          run:
            - jupyter_server
        script:
          - jupyter kernelspec list --json
          - jupyter kernelspec list --json | ${{ grep }}sysml-jupyter-kernel
    about:
      summary: ${{ summary }} - Jupyter Kernel
      license_file:
        - ${{ go_mod }}/LICENSE
        - ${{ go_mod }}/cmd/sysml-jupyter-kernel/library_licenses/**

  - package:
      name: opensysml-lsp
    requirements:
      build:
        - ${{ compiler("go-nocgo") }}
        - go-licenses
    build:
      script:
        content:
          - ${{ export }} "GOPATH=${{ env_src_dir }}"
          - cd ${{ go_mod }}/cmd/sysml-lsp
          - ${{ go_build }} -o "${{ go_lsp_bin }}"
    tests:
      - package_contents:
          strict: true
          bin:
            - sysml-lsp
      - script:
          - sysml-lsp --help
          - sysml-lsp --version
          - sysml-lsp --version | ${{ grep_version }}
    about:
      summary: ${{ summary }} - Language Server
      license_file:
        - ${{ go_mod }}/LICENSE
        - ${{ go_mod }}/cmd/sysml-lsp/library_licenses/**

  # python #####################################################################
  - package:
      name: opensysml-python
    build:
      noarch: python
      python:
        entry_points:
          - opensysml-generate = opensysml.generate:main
          - opensysml-fmi-runner = opensysml.fmi_runner:main
      script:
        - cd ${{ py_dir }}
        - ${{ PYTHON }} -m ${{ pip_install }}
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - setuptools >=77
      run:
        - grpcio >=${{ py_grpcio_min }}
        - protobuf >=${{ py_protobuf_min }}
        - python >=${{ python_min }}
        - sigstore >=4.5.0,<5
        # conda-forge baseline instead of runtime downloading
        - ${{ pin_subpackage("opensysml-grpc", upper_bound="x.x.x") }}
        # not appearing in `pyproject.toml`, but is tested behind a `which`
        - z3-solver >=4.8.12
    tests:
      - package_contents:
          strict: true
          files:
            - etc/conda/test-files/opensysml-python/**
          site_packages:
            - opensysml/**
            - opensysml-${{ version }}.dist-info/**
      - python:
          imports: opensysml
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - files:
          source:
            - ${{ go_mod }}/conformance/fixtures/behavior.sysml
            - ${{ go_mod }}/conformance/fixtures/views.sysml
            - ${{ go_mod }}/internal/doc/docrender/testdata/telescope_report.golden.html
            - ${{ go_mod }}/internal/doc/docrender/testdata/telescope_report.golden.md
            - ${{ go_mod }}/internal/doc/docrender/testdata/telescope_report.sysml
            - ${{ go_mod }}/internal/doc/docrender/testdata/verdict_report.sysml
            - ${{ go_mod }}/internal/frontend/repl/testdata/vehicle_package.sysml
            - ${{ go_mod }}/tests/grpc/testdata/conformance/document_query_object_by_path.sysml
            - ${{ go_mod }}/tests/grpc/testdata/conformance/document_query_states.sysml
            - ${{ go_mod }}/tests/migrate/testdata/xmi/layout.layout.xml
            - ${{ go_mod }}/tests/migrate/testdata/xmi/layout.xmi
            - ${{ go_mod }}/tests/migrate/testdata/xmi/vehicle.xmi
            - ${{ py_dir }}/pyproject.toml
            - ${{ py_dir }}/tests/**
        requirements:
          run:
            - grpcio-tools ${{ py_grpcio_min }}.*
            - psutil >=5.9.0
            - pytest-cov >=5.0.0
            - pytest-mock >=3.10.0
            - pandas
            # manual pip check
            - pip
            - python ${{ python_min }}.*
            # .. for minimum pins more aggressively
            - grpcio ${{ py_grpcio_min }}.*
            - protobuf ${{ py_protobuf_min }}.*
        script:
          env:
            CF_OPENSYSML_PY_TEST_ROOT: ${{ py_dir }}
          file: test-opensysml-python.py
    about:
      summary: Python client library for OpenSysML, a SysML v2 parser and execution runtime
      homepage: https://pypi.org/project/opensysml

  - package:
      name: jupyter-opensysml-kernel
    build:
      noarch: python
      python:
        entry_points:
          - jupyter-opensysml-kernel = jupyter_opensysml_kernel.__main__:main
      script:
        - pushd ${{ js_labext_dir }}
        - npm install
        - npm run build
        - popd
        - cd ${{ py_jpy_dir }}
        - ${{ PYTHON }} -m ${{ pip_install }}
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools >=77
        - jupyterlab >=${{ jupyterlab_min }},<${{ jupyterlab_max }}
      run:
        - ${{ pin_subpackage("opensysml-jupyter-kernel", exact=True) }}
        - jupyter_client >=7.0
        - python >=${{ python_min }}
    tests:
      - package_contents:
          strict: true
          site_packages:
            - jupyter_opensysml_kernel/**
            - jupyter_opensysml_kernel-${{ version }}.dist-info/**
      - python:
          imports: jupyter_opensysml_kernel
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - requirements:
          run:
            - jupyterlab ${{ jupyterlab_min }}.*
            - python ${{ python_min }}.*
        script:
          - jupyter-opensysml-kernel --help
          - jupyter-opensysml-kernel --version
          - jupyter labextension list
          - jupyter kernelspec list
    about:
      summary: Jupyter kernel for SysML v2, backed by the OpenSysML REPL
      homepage: https://pypi.org/project/jupyter-opensysml-kernel
      license_file:
        - ${{ go_mod }}/LICENSE
        - ${{ py_jpy_dir }}/labextension/static/third-party-licenses.json

about:
  summary: ${{ summary }}
  homepage: https://opensysml.org
  license: Apache-2.0
  license_file: ${{ go_mod }}/LICENSE
  repository: https://github.com/Open-MBEE/OpenSysML

extra:
  feedstock-name: opensysml
  recipe-maintainers:
    - bollwyvl
