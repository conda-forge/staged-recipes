schema_version: 1

context:
  version: "0.0.2"

package:
  name: mailsort
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mailsort/mailsort-${{ version }}.tar.gz
  sha256: df55c7ab41cd68bb2afa7dcb18019616b1dd7bc0c940e9b99737b16653f5fa6d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - mailsort = mailsort.__main__:command_line_parser

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.23.5,<=2.5.1
    - tqdm >=4.64.1,<=4.70.1
    - pandas >=1.5.3,<=3.0.5
    - scikit-learn >=1.2.2,<=1.9.0
    - sqlalchemy >=2.0.0,<=2.0.52

tests:
  - python:
      imports:
        - mailsort
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - mailsort --help

about:
  summary: Assign labels to emails on any IMAP mail server based on their similarity to other emails assigned to the same label.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/jan-janssen/mailsort

extra:
  recipe-maintainers:
    - jan-janssen
