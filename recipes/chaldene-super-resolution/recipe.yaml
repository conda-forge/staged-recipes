schema_version: 1

context:
  version: "0.1.0"

package:
  name: chaldene-super-resolution
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chaldene-super-resolution/chaldene_super_resolution-${{ version }}.tar.gz
  sha256: 302ec37c1a2f4e01095a5e8c40cfb8d26000bca790759919974525384dd73d8a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - pytorch >=1.13.0
    - torchvision >=0.14.0
    - matplotlib-base
    - tensorboard
    - scipy
    - tifffile
    - opencv
    - pandas
    - imutils
    - image-registration
    - numpy >=1.23.0
    - pytest
    - warmup-scheduler
    - tqdm
    - imagecodecs

tests:
  - python:
      imports:
        - super_resolution
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Super resolution based on EMDiffuse
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/chaldene-super-resolution/

extra:
  recipe-maintainers:
    - jan-janssen
