context:
  version: "2.4.5"

package:
  name: wamr-jit
  version: ${{ version }}

source:
  url: https://github.com/wasm-micro-runtime/wasm-micro-runtime/archive/refs/tags/WAMR-${{ version }}.tar.gz
  sha256: 1ab09d51099f276ca4a1d6629f6b589aab2bd0caa01445e05031a4bed22c199b

build:
  number: 0
  script: build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - if: linux
      then:
        - llvmdev >=19,<20
    - if: win
      then:
        - llvmdev >=19,<20
    - if: osx
      then:
        - llvmdev >=18,<19
    - zlib
  run:
    - if: linux
      then:
        - libllvm19 >=19,<20
        - libgcc >=14
        - libstdcxx >=14
    - if: win
      then:
        - llvmdev >=19,<20
    - if: osx
      then:
        - llvmdev >=18,<19
  ignore_run_exports:
    from_package:
      - zlib

tests:
  - package_contents:
      lib:
        - iwasm
      include:
        - wasm_c_api.h
        - wasm_export.h
        - lib_export.h

about:
  homepage: https://github.com/wasm-micro-runtime/wasm-micro-runtime
  repository: https://github.com/wasm-micro-runtime/wasm-micro-runtime
  documentation: https://bytecodealliance.github.io/wamr.dev/
  license: Apache-2.0 WITH LLVM-exception
  license_file: LICENSE
  summary: WebAssembly Micro Runtime with LLVM JIT support

extra:
  recipe-maintainers:
    - tritao
