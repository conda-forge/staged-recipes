{% set name = "multimetricdiagram" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/multimetricdiagram-{{ version }}.tar.gz
  sha256: 660f02d0a7c85573dc56912229cb64472afcfa85f4765ec154c66173b32dfbe6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.26
    - matplotlib-base >=3.8

test:
  imports:
    - multimetricdiagram
    - multimetricdiagram.alt.taylor
  source_files:
    - tests
  commands:
    - pip check
    - pytest tests -q
  requires:
    - pip
    - pytest
    - python {{ python_min }}

about:
  home: https://github.com/oceanmodeling/multimetricdiagram
  summary: 'Multimetric diagram: 5-metric (total/bias/pattern/amplitude/phase) alternative, that rewards realistic variance, to Taylor diagram'
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/oceanmodeling/multimetricdiagram

extra:
  recipe-maintainers:
    - DanCodiga
    - tomsail