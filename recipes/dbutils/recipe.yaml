schema_version: 1

context:
  version: "3.2.0"

package:
  name: dbutils
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/dbutils/dbutils-${{ version }}.tar.gz
  sha256: dfe3f5eb6e383042d68ad07e4e9778b2abbcc4627a283f85efc8210319c075d2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dbutils
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - pytest
        - pytest-asyncio
    script:
      - pytest -vvv tests
    files:
      source:
        - tests/

about:
  summary: Database connections for multi-threaded environments.
  license: MIT
  license_file: LICENSE
  homepage: https://webwareforpython.github.io/DBUtils/
  documentation: https://webwareforpython.github.io/DBUtils/main.html

extra:
  recipe-maintainers:
    - jsmolic
