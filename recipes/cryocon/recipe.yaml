schema_version: 1

context:
  version: "3.3.1"

package:
  name: cryocon
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/cryocon/cryocon-${{ version }}.tar.gz
  sha256: 42986ab399eaf42e98a0fe7d59d1e2c330fb5608f4b906ad4e224a47c56e9123

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - CryoCon = cryocon.tango.server:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - connio >=0.2
    - pytango

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "3.*"
      imports:
        - cryocon
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - CryoCon --help

about:
  summary: CryCon library
  license: "LGPL-3.0-or-later"
  license_file: LICENSE.txt
  homepage: https://github.com/tiagocoutinho/cryocon

extra:
  recipe-maintainers:
    - rhomspuron
