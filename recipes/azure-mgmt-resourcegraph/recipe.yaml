schema_version: 1

context:
  version: "8.0.1"

package:
  name: azure-mgmt-resourcegraph
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/azure-mgmt-resourcegraph/azure_mgmt_resourcegraph-${{ version }}.tar.gz
  sha256: 55a21d66da6b28a080d903eca192d02fc1cfd0775e139b30d44117ca4ba6ad1f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - msrest >=0.7.1
    - azure-mgmt-core >=1.6.0
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: Microsoft Azure Resourcegraph Management Client Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/azure-mgmt-resourcegraph/

extra:
  recipe-maintainers:
    - jsmolic
