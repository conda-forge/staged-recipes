schema_version: 1

context:
  python_min: "3.10"
  version: "2.0.0"

package:
  name: glacier-strain-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/glacier-strain-tools/glacier_strain_tools-${{ version }}.tar.gz
  sha256: d48f65aa9ec5433582c3b400e2596f6f32a517ca27ad3ceb5e411b02ea5b5652

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - strain_tools = strain_tools._cli:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.2
    - pip
  run:
    - python >=${{ python_min }}
    - rioxarray >=0.16.0
    - numpy
    - numba
    - matplotlib-base

tests:
  - python:
      imports:
        - strain_tools
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - strain_tools --help

about:
  summary: Tools for deriving surface-parallel strain rates and directions from glacier velocity fields.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/trchudley/glacier-strain-tools

extra:
  recipe-maintainers:
    - trchudley
