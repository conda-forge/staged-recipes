schema_version: 1

context:
  version: 1.0.0b260721

package:
  name: agent-framework-anthropic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agent-framework-anthropic/agent_framework_anthropic-${{ version }}.tar.gz
  sha256: dc5d51321375e3dec0dd204561ed0dd0c7362f39abf43b17125e6d52a1a1aa74

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.11,<4.0
    - pip
  run:
    - python >=${{ python_min }}
    - agent-framework-core >=1.11.0,<2
    - anthropic >=0.80.0,<0.117.0

tests:
  - python:
      imports:
        - agent_framework_anthropic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Anthropic integration for Microsoft Agent Framework
  license: MIT
  license_file: LICENSE
  homepage: https://aka.ms/agent-framework
  repository: https://github.com/microsoft/agent-framework
  documentation: https://github.com/microsoft/agent-framework/tree/main/python/packages/anthropic

extra:
  recipe-maintainers:
    - killua156
