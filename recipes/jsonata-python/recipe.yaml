schema_version: 1

context:
  version: "0.7.2"

package:
  name: jsonata-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonata-python/jsonata_python-${{ version }}.tar.gz
  sha256: f976c3bf06a675cf0076f65cbe224af73afdd1ac0f959133c6b0763d2af7b165

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - jsonata = jsonata.cli.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jsonata_python
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - jsonata --help

about:
  summary: Pure Python implementation of JSONata
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/rayokota/jsonata-python

extra:
  recipe-maintainers:
    - jan-janssen
