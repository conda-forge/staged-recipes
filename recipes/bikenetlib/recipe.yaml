schema_version: 1

context:
  python_min: "3.12"
  version: "0.6.0"

package:
  name: bikenetlib
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/bikenetlib/bikenetlib-${{ version }}.tar.gz
  sha256: 79468333e95040b66413be13aa979e01a5c676c9d79879672398acb83883e938

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}
    - geopandas >=1
    - matplotlib-base
    - osmnx >=2
    - geojson

tests:
  - python:
      imports:
        - bikenetlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: BikeNetKit Python core utility package
  license: AGPL-3.0-only
  license_file: LICENSE
  homepage: https://bikenetkit.org/
  documentation: https://docs.bikenetkit.org/BikeNetLib/
  repository: https://github.com/BikeNetKit/BikeNetLib/

extra:
  recipe-maintainers:
    - mszell
