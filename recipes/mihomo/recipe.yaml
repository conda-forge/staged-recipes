schema_version: 1

context:
  version: "1.19.30"

package:
  name: mihomo
  version: ${{ version }}

source:
  url: https://github.com/MetaCubeX/mihomo/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ee8a7107707e4bd485460139b1944e7be30016393783f2b4e928c14880c8ca8b

build:
  number: 0

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - mihomo -v
      - if: unix
        then: mihomo -v | grep -F "${{ version }}"
      - if: unix
        then: if mihomo -v | grep -F "unknown time"; then false; fi
      - if: win
        then: mihomo -v | findstr /C:"${{ version }}"

about:
  homepage: https://github.com/MetaCubeX/mihomo
  repository: https://github.com/MetaCubeX/mihomo
  documentation: https://wiki.metacubex.one/
  summary: Another Mihomo Kernel
  description: |
    Mihomo is a rule-based proxy kernel with a local HTTP/HTTPS/SOCKS server,
    built-in DNS, and support for VMess, VLESS, Shadowsocks, Trojan, Snell,
    TUIC, and Hysteria.
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - library_licenses/

extra:
  recipe-maintainers:
    - trim21
