schema_version: 1

context:
  version: "1.0.9"

package:
  name: adk-mongodb-session
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/adk-mongodb-session/adk_mongodb_session-${{ version }}.tar.gz
  sha256: 305a3686b26a38f4f0ed1d593059c39984f8435d5362e768b615a48ade6af215

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - pymongo >=4.7,<5.0
    - google-adk >=1.15.1

tests:
  - python:
      imports:
        - adk_mongodb_session
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: A project to integrate together Agent Development Kit (ADK) with MongoDB session management as backend storage.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/adk-mongodb-session/

extra:
  recipe-maintainers:
    - jsmolic
