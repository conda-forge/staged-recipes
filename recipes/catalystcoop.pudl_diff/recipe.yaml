schema_version: 1

context:
  name: catalystcoop.pudl_diff
  version: "0.1.1"
  python_min: "3.14"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/catalystcoop.pudl_diff/catalystcoop_pudl_diff-${{ version }}.tar.gz
  sha256: cc5c82099f92b2d9e85263f724fc76169729156c679531cd8979a1002cf301e8

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - pudl_diff = pudl_diff.cli:main
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.32
    - hatch-vcs >=0.5
    - pip
  run:
    - python >=${{ python_min }}
    - click >=8.5
    - gcsfs >=2026
    - polars >=2
    - psutil >=7
    - pydantic >=2.13
    - s3fs >=2026
    - universal_pathlib >=0.3.10

tests:
  - python:
      imports:
        - pudl_diff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pudl_diff --help

about:
  homepage: https://docs.catalyst.coop/pudl-diff
  summary: Compare two sets of PUDL Parquet outputs, and report on what changed.
  description: |
    pudl_diff compares two sets of PUDL Parquet outputs, local or remote, table
    by table: their schemas, row counts, and row contents (matched on primary
    keys where a table has them). It writes a colorized terminal summary, a JSON
    report described by a published JSON Schema, and Parquet files of the
    differing rows.
  license: MIT
  license_file: LICENSE.txt
  documentation: https://docs.catalyst.coop/pudl-diff
  repository: https://github.com/catalyst-cooperative/pudl-diff

extra:
  recipe-maintainers:
    - zaneselvans
