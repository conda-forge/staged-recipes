schema_version: 1

context:
  version: "0.1.5"
  python_min: "3.10"

package:
  name: py-nfi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/py-nfi/py_nfi-${{ version }}.tar.gz
  sha256: eec7b6fe444dcfe2393839f8ec19630f98565dd0c1ded93d30331cc8686a6ca8

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - scipy
    - tqdm

tests:
  - python:
      imports:
        - nfi
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/ivandevert/py-nfi
  license: MIT
  license_file: LICENSE
  summary: Normalized frequency index (nFI) computation for earthquake source spectra
  description: |
    py-nfi computes the normalized frequency index (nFI) from earthquake
    spectra. nFI is a data-driven measure of the relative high-frequency
    content of a seismic source, providing an observation-based alternative
    to stress-drop estimation for characterizing source behavior at high
    frequencies.
  repository: https://github.com/ivandevert/py-nfi

extra:
  recipe-maintainers:
    - ivandevert
