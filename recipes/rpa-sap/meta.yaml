{% set name = "rpa-sap" %}
{% set version = "2.0.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/rpa_sap-{{ version }}.tar.gz
  sha256: a3b8a426705e013a76641d22b2356a42ef80b21b9c49c9a9a30e8334ee956497

build:
  skip: true  # [not win]
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - openpyxl >=3.1.5
    - pandas >=2.3.3
    - psutil >=7.2.2
    - python-dotenv >=1.2.2
    - pywin32 >=311
    - requests >=2.31.0

test:
  imports:
    - rpa_sap
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/21010/rpa-sap
  summary: "A comprehensive Python library for robust SAP GUI automation and RFC integration, designed for RPA workflows."
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - "21010"
