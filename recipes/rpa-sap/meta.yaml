{% set name = "rpa-sap" %}
{% set version = "2.0.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/rpa_sap-{{ version }}.tar.gz
  sha256: 77644421f1f48e202847e7418ae69068a59775a03c6e422fc859fa2f0a559ba9

build:
  skip: true  # [not win]
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling
  run:
    - python >=3.10
    - openpyxl >=3.1.5
    - pandas >=2.3.3
    - psutil >=7.2.2
    - python-dotenv >=1.2.2
    - pywin32 >=311
    - requests >=2.31.0
    - wmi >=1.5.1

test:
  imports:
    - rpa_sap
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/21010/rpa-sap
  summary: "A comprehensive Python library for robust SAP GUI automation and RFC integration, designed for RPA workflows."
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - 21010
