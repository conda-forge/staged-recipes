context:
  name: causal-hybrid-control
  version: "0.6.0"
  python_min: "3.11"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/causal_hybrid_control-${{ version }}.tar.gz
  sha256: 02605487b60d1c1c2233b01fe050e93e76fd6151f2d84ea2c63b345e4bba826f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    # mirrors requires-python and [project].dependencies in pyproject.toml
    - python >=${{ python_min }},<3.15
    - jax >=0.4.30
    - diffrax >=0.6
    - optax >=0.2.3
    - equinox >=0.11.4
    - numpy >=2.0
    - scipy >=1.13

tests:
  - python:
      imports:
        - chc
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "import chc, sys; sys.exit(chc.__version__ != '${{ version }}')"

about:
  homepage: https://github.com/causaldyn/causal-hybrid-control
  repository: https://github.com/causaldyn/causal-hybrid-control
  summary: Physics-structured dynamics with a learned causal residual, controlled by constrained optimal control / MPC.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ilgrad
