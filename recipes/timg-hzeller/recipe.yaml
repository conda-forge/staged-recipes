context:
  version: "1.6.3"

package:
  name: timg-hzeller
  version: ${{ version }}

source:
  url: https://github.com/hzeller/timg/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 59c908867f18c81106385a43065c232e63236e120d5b2596b179ce56340d7b01
  patches:
    - patches/0001-remove-conflicting-getopt-declaration.patch

build:
  number: 0
  skip:
    - win

requirements:
  build:
    - cmake
    - ninja
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - pkg-config
    - pandoc
  host:
    - libdeflate
    - libsixel
    - libjpeg-turbo
    - libexif
    - graphicsmagick
    - librsvg
    - cairo
    # pkg-config resolves the full dependency chain at configure time, so the
    # headers and .pc files of transitive deps must be present too. The libfoo
    # packages pulled in automatically ship only the runtime libraries.
    - expat
    - xorg-xorgproto
    - glib
    - poppler
    - ffmpeg
  run:
    # Everything else timg links against is pinned automatically by the
    # run_exports of the corresponding host dependency; graphicsmagick is the
    # one that does not define any, so it has to be listed explicitly.
    - graphicsmagick
  ignore_run_exports:
    by_name:
      # expat is a configure-time only dependency, needed so that pkg-config
      # can resolve fontconfig's Requires; timg never links against it.
      - libexpat

tests:
  - script:
      - timg --version

about:
  homepage: https://github.com/hzeller/timg
  summary: Terminal image and video viewer (Sixel, Kitty, iTerm2, block graphics)
  description: |
    timg displays images, animated GIFs and videos in the terminal. On terminals
    that implement the Sixel protocol, the Kitty Graphics Protocol, or the iTerm2
    Graphics Protocol, images are shown in full resolution. On regular terminals,
    images are rendered using 24-bit color unicode block characters.
  # timg itself is GPL-2.0-only, but it compiles in two header-only libraries
  # from third_party/: qoi (MIT) and stb_image (MIT OR Unlicense; MIT elected
  # here). Their licence texts live inside the headers themselves, so those are
  # packaged directly. third_party/stb/stb_image_resize2.h is NOT included, as
  # it is guarded by WITH_TIMG_STB_RESIZE and swscale is used for resizing.
  license: GPL-2.0-only AND MIT
  license_file:
    - LICENSE
    - third_party/qoi/qoi.h
    - third_party/stb/stb_image.h
  documentation: https://timg.sh/
  repository: https://github.com/hzeller/timg

extra:
  recipe-maintainers:
    - pmav99
