schema_version: 1

context:
  version: "0.1.0"
  python_min: "3.10"

package:
  name: xlsxflat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xlsxflat/xlsxflat-${{ version }}.tar.gz
  sha256: 8498f8ca00935359dc958e627a8e82ab0d8f8b3f18b5ec9ac048505c8fd06c5e

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - xlsxflat = xlsxflat.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68
    - pip
  run:
    - python >=${{ python_min }}
    - openpyxl >=3.1

tests:
  - python:
      imports:
        - xlsxflat
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - xlsxflat --help

about:
  homepage: https://github.com/Rezarys/xlsxflat
  summary: Turn a tree of messy .xlsx reports into one flat table, with a report of every change.
  description: xlsxflat reads a file or folder of .xlsx reports and writes one flat table, plus a report listing every change it made on the way.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/Rezarys/xlsxflat

extra:
  recipe-maintainers:
    - Rezarys
