context:
  name: pygeodata-browser
  version: "0.5.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pygeodata_browser/pygeodata_browser-${{ version }}.tar.gz
  sha256: f12d5bdccd5abb5eabd385c5b21077f7a63646c44848e1da25bf906bd34d4286

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - pygeodata >=0.5,<0.6
    - flask
    - msgspec
    - platformdirs
    - pillow

tests:
  - python:
      imports:
        - pygeodata_browser
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/jasperroebroek/pygeodata-browser
  repository: https://github.com/jasperroebroek/pygeodata-browser
  summary: Registry browser (QC and code-review dashboard) for pygeodata
  license: MIT
  license_file:
    - LICENSE
    - api/static/app/THIRD_PARTY_LICENSES.txt

extra:
  recipe-maintainers:
    - jasperroebroek
