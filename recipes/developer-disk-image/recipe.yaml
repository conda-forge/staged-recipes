context:
  version: "0.3.0"

package:
  name: developer-disk-image
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/developer_disk_image/developer_disk_image-${{ version }}.tar.gz
  sha256: 1fb9841dcc5cf81e697b6e0a9c14909c059c1893d675b38398a91c08cb7ba8bc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - developer_disk_image
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/doronz88/DeveloperDiskImage
  summary: Download Apple DeveloperDiskImage files
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
