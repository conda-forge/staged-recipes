schema_version: 1

context:
  version: "3.0.1"

package:
  name: tsrc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tsrc/tsrc-${{ version }}.tar.gz
  sha256: 17ac5fccb7682b994aeb9f1d5c7d5b8a640758250aad5142064674b9d72ed114

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - tsrc = tsrc.cli.main:main

requirements:
  host:
    - python >=3.9,<4.0
    - poetry-core
    - pip
  run:
    - python >=3.8.0,<4.0.0
    - attrs >=19.3.0,<20.0.0
    - cli-ui >=0.11.0,<0.12.0
    - colored-traceback >=0.3.0,<0.4.0
    - ruamel_yaml >=0.18.5,<0.19.0
    - schema >=0.7.1,<0.8.0
    - tabulate >=0.8.6,<0.9.0
    - unidecode >=1.1.1,<2.0.0

tests:
  - python:
      imports:
        - tsrc
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - tsrc --help

about:
  summary: Manage groups of git repositories
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/your-tools/tsrc
  documentation: https://your-tools.github.io/tsrc

extra:
  recipe-maintainers:
    - saimn
