context:
  version: "0.7.0"

package:
  name: tinyopt
  version: ${{ version }}

source:
  url: https://github.com/julien-michot/tinyopt/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 514adec614adf56d8cd869df12f8e937473d2f65fc8b33998d1df9d715c11485

build:
  number: 0
  noarch: generic
  script:
    # Commands for Unix (Linux / macOS)
    - if: unix
      then: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DTINYOPT_BUILD_TESTS=OFF -DTINYOPT_BUILD_DOCS=ON -DTINYOPT_BUILD_PACKAGES=OFF -DTINYOPT_BUILD_PIP_PACKAGE=OFF
        cmake --build build --target docs

    # Commands for Windows
    - if: win
      then: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DTINYOPT_BUILD_TESTS=OFF -DTINYOPT_BUILD_DOCS=OFF -DTINYOPT_BUILD_PACKAGES=OFF -DTINYOPT_BUILD_PIP_PACKAGE=OFF

    - cmake --build build
    - cmake --install build

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.25
    - ninja
    - python >=3.12
    - doxygen >=1.18
    - sphinx <8
    - breathe >=4.35
    - sphinx-rtd-theme >=1.0
    - myst-parser >=2.0
  host:
    - eigen >=3.4
  run:
    - eigen >=3.4

tests:
  - script:
    - if: win
      then: |
        - python -c "import os; assert os.path.isfile(os.path.join(os.environ['PREFIX'], 'include', 'tinyopt', 'tinyopt.h'))"
        - python -c "import os; assert os.path.isfile(os.path.join(os.environ['PREFIX'], 'share', 'doc', 'tinyopt', '3rdparty', 'ceres', 'LICENSE'))"
        - python -c "import os; assert os.path.isfile(os.path.join(os.environ['PREFIX'], 'lib', 'cmake', 'Tinyopt', 'TinyoptConfig.cmake'))"
    - if: unix
      then: |
          test -f $PREFIX/include/tinyopt/tinyopt.h
          test -f $PREFIX/share/doc/tinyopt/3rdparty/ceres/LICENSE
          test -f $PREFIX/share/doc/tinyopt/guide/index.html
          test -f $PREFIX/lib/cmake/Tinyopt/TinyoptConfig.cmake
about:
  homepage: https://github.com/julien-michot/tinyopt
  license: Apache-2.0
  license_file: LICENSE
  summary: A lightweight, header-only C++20 optimization library
  description: |
    Tinyopt is a super fast header-only C++20 library for unconstrained optimization and nonlinear least squares.
  repository: https://github.com/julien-michot/tinyopt
  documentation: https://github.com/julien-michot/tinyopt

extra:
  recipe-maintainers:
    - julien-michot
