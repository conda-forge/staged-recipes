schema_version: 1

context:
  name: lz-gb-code
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lz_gb_code/lz_gb_code-${{ version }}.tar.gz
  sha256: 7f61783a7dd04eb8f46a1c4cbd7d334f9b82634ad34fac80b43b2faf95fbc84d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - csl_generator = gb_code.csl_generator:main
      - gb_generator = gb_code.gb_generator:main
      - inplane_shift = gb_code.inplane_shift:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.14.0
    - pyyaml

tests:
  - python:
      imports:
        - gb_code
        - gb_code.csl_generator
        - gb_code.gb_generator
        - gb_code.inplane_shift
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Grain boundary generation code with pymatgen/ASE output support (fork of GB_code)
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ligerzero-ai/GB_code
  repository: https://github.com/ligerzero-ai/GB_code

extra:
  recipe-maintainers:
    - ligerzero-ai
