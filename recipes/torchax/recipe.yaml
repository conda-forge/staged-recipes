context:
  version: "0.0.13"

package:
  name: torchax
  version: ${{ version }}

source:
  url: https://github.com/google/torchax/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9a88a6d83e01241ff0e6fd55798541d74d4d4b2d76f19c6f0733bbe2042c0de0
  patches:
    # Backports of google/torchax#99, #102 and #108 for current PyTorch.
    - remove-cholesky.patch
    - pytorch-2.13-compatibility.patch
    - optional-qr.patch
    # Approved upstream: https://github.com/google/torchax/pull/110
    - optional-distributed.patch

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python =${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - jax >=0.6.2
    - numpy
    - optax
    - pytorch >=2.8

tests:
  - package_contents:
      site_packages:
        - torchax
  # conda-forge does not publish jaxlib for Windows:
  # https://github.com/conda-forge/jaxlib-feedstock/issues/161
  - if: not win
    then:
      - script:
          - python -m pip check
          - python test_torchax.py
        requirements:
          run:
            - python ${{ python_min }}.*
            - pip
            # Select the BLAS provider for CI only.
            - libblas * *openblas
        files:
          recipe:
            - test_torchax.py
      - script:
          - python -m pip check
          - python test_torchax.py
        requirements:
          run:
            - python
            - pip
            - libblas * *openblas
        files:
          recipe:
            - test_torchax.py

about:
  homepage: https://github.com/google/torchax
  summary: PyTorch frontend for JAX and graph-level interoperability
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://google.github.io/torchax/
  repository: https://github.com/google/torchax

extra:
  recipe-maintainers:
    - anutosh491
