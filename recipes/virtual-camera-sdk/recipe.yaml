schema_version: 1
package:
  name: virtual-camera-sdk
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Virtual-Camera-SDK/language-sdks-v1.0.0/virtual-camera-sdk-sdk-source-1.0.0.zip
  sha256: 115803eb74d388df64bed002e3fd1ea32f23687f68dd4d0955d6d647b35f0e95
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - virtual_camera_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from virtual_camera_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Virtual-Camera-SDK
  summary: Windows x64 Virtual-Camera-SDK Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Virtual-Camera-SDK-C-ffi/LICENSE
  - Virtual-Camera-SDK-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
