schema_version: 1

context:
  version: "3.1"

package:
  name: zope.globalrequest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.globalrequest/zope_globalrequest-${{ version }}.tar.gz
  sha256: 5863e2eb8794b9b321c3ae7159acf2979a3d0b714849a34b3a7a021e3b415bed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - zope.interface
    - zope.publisher
    - zope.traversing

tests:
  - python:
      imports:
        - zope.globalrequest
        - zope.globalrequest.local
        - zope.globalrequest.subscribers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest -v zope.globalrequest.tests

about:
  homepage: https://github.com/zopefoundation/zope.globalrequest
  repository: https://github.com/zopefoundation/zope.globalrequest
  summary: Global way of retrieving the currently active request
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
