context:
  version: "1.2.0"

package:
  name: flask-weasyprint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-weasyprint/flask_weasyprint-${{ version }}.tar.gz
  sha256: fc20a4fb5a18f311c98772a0b6c8428df345b15cdb2b356dff24962a4328287d

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.2,<4
    - pip
  run:
    - python >=${{ python_min }}
    - flask >=2.3.0
    - weasyprint >=68.0

tests:
  - python:
      imports:
        - flask_weasyprint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://doc.courtbouillon.org/flask-weasyprint/stable/
  summary: Make PDF files in your Flask app with WeasyPrint
  description: |
    Flask-WeasyPrint generates PDF files out of your Flask website thanks to
    WeasyPrint. It lets a Flask view be rendered straight to a PDF response,
    reusing the same URL dispatching, request/response objects, and Jinja
    templates as the rest of the application.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://doc.courtbouillon.org/flask-weasyprint/stable/
  repository: https://github.com/Kozea/Flask-WeasyPrint

extra:
  recipe-maintainers:
    - pb01ka
