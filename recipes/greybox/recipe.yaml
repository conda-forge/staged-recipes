schema_version: 1

context:
  version: "1.0.11"

package:
  name: greybox
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/greybox/greybox-${{ version }}.tar.gz
  sha256: ebb575d527496b1fef9ced71b9eb49edbeff0b5be659459ce6e6c57cc5a20ea7

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - setuptools >=45
    - wheel
    - pybind11 >=2.10
    - pip
  run:
    - python
    - numpy >=1.20.0
    - scipy >=1.7.0
    - pandas >=1.3.0
    - nlopt >=2.7.0
    - matplotlib-base >=3.5

tests:
  - python:
      imports:
        - greybox
      pip_check: true

about:
  summary: Toolbox for model building and forecasting
  license: Apache-2.0 AND LGPL-2.1-only
  license_file:
    - LICENSE
    - extern/carma/LICENSE
  homepage: https://openforecast.org/
  documentation: https://openforecast-org.github.io/greybox/
  repository: https://github.com/openforecast-org/greybox

extra:
  recipe-maintainers:
    - thewchan
