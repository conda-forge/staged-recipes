{% set name = "szl" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: bdbc6437c50ee32391cfa6275cb1282ac0beb1dd6abdc72746ff5a5b7344b625

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10

test:
  requires:
    - pip
  imports:
    - szl
    - szl.kamachikuna
    - szl.khipu
    - szl.provenance
    - szl.router
    - szl.openshell
  commands:
    - python -c "from szl import kamachikuna; assert kamachikuna.gate('x', True)[1] == 'ALLOWED'"

about:
  home: https://szlholdings.com/
  license: Apache-2.0
  license_file: LICENSE
  summary: The receipts layer for governed AI - khipu signing, the Kamachikuna constitution, provenance badges, the two-axis Truth Router.
  description: |
    szl is the SZL Holdings receipts layer for governed AI: signed
    hash-chained receipts (khipu), the machine-checked Kamachikuna
    constitution as callable gates, provenance badges, and two-axis
    honesty routing. Stdlib-only; no runtime dependencies.
  doc_url: https://github.com/szl-holdings/szl-gpu-bridge/tree/main/sdk
  dev_url: https://github.com/szl-holdings/szl-gpu-bridge

extra:
  recipe-maintainers:
    - stephenlutar2-hash