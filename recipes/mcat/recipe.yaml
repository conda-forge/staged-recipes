context:
  version: "0.6.5"

package:
  name: mcat
  version: ${{ version }}

source:
  - if: linux and x86_64
    then:
      url: https://github.com/Skardyy/mcat/releases/download/v${{ version }}/mcat-v${{ version }}-x86_64-unknown-linux-gnu.tar.xz
      sha256: 8a1e09f63e5e079ae4cd35a9a83f3c1fac92e5e328cd645e752e1bbdaefaa45c
      target_directory: dist
  - if: linux and aarch64
    then:
      url: https://github.com/Skardyy/mcat/releases/download/v${{ version }}/mcat-v${{ version }}-aarch64-unknown-linux-gnu.tar.xz
      sha256: 09c8b1c295583959497ded8cad79e67e15f033eb51325a245f582889e723d7bc
      target_directory: dist
  - if: osx and x86_64
    then:
      url: https://github.com/Skardyy/mcat/releases/download/v${{ version }}/mcat-v${{ version }}-x86_64-apple-darwin.tar.xz
      sha256: 38eb97cdf855e20ec5caf3805250173e4405ab6e5195096bbd9ccf5390dc672f
      target_directory: dist
  - if: osx and arm64
    then:
      url: https://github.com/Skardyy/mcat/releases/download/v${{ version }}/mcat-v${{ version }}-aarch64-apple-darwin.tar.xz
      sha256: 952afbc231517cdcb09e8b4f19001364bf68ebbce66f5b0f4b7a7d65b4df1c22
      target_directory: dist
  - if: win
    then:
      url: https://github.com/Skardyy/mcat/releases/download/v${{ version }}/mcat-v${{ version }}-x86_64-pc-windows-msvc.zip
      sha256: 51a8bfda59f5dbc5a5b286cfbb94c5919d484ea8db00a35fab15fc863423e15c
      target_directory: dist

build:
  number: 0
  skip:
    - ppc64le
    - s390x
  dynamic_linking:
    binary_relocation: false
  script:
    - if: unix
      then: |
        mkdir -p "${PREFIX}/bin"
        install -m 755 dist/mcat "${PREFIX}/bin/mcat"
        cp dist/LICENSE ./LICENSE
        mkdir -p "${PREFIX}/share/bash-completion/completions" \
                 "${PREFIX}/share/zsh/site-functions" \
                 "${PREFIX}/share/fish/vendor_completions.d"
        cp dist/completions/mcat.bash "${PREFIX}/share/bash-completion/completions/mcat"
        cp dist/completions/_mcat "${PREFIX}/share/zsh/site-functions/_mcat"
        cp dist/completions/mcat.fish "${PREFIX}/share/fish/vendor_completions.d/mcat.fish"
      else: |
        if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
        copy dist\mcat.exe "%LIBRARY_BIN%\mcat.exe"
        copy dist\LICENSE LICENSE

tests:
  - script:
      - mcat --version
      - mcat --help
  - package_contents:
      bin:
        - mcat

about:
  homepage: https://github.com/Skardyy/mcat
  summary: Terminal image, video, PDF, and Markdown viewer
  description: |
    mcat parses, converts and previews files directly in your terminal.
    It handles images, video, PDF, Markdown, Office documents, LaTeX/Typst
    and archives, using inline graphics protocols (kitty, iterm2, sixel)
    with an ASCII fallback, plus an interactive zoom and pan viewer and an
    image-enabled `ls`.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/Skardyy/mcat

extra:
  recipe-maintainers:
    - Skardyy
