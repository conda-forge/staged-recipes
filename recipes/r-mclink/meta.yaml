{% set version = '1.1.2' %}

{% set posix = 'm2-' if win else '' %}
{% set native = 'm2w64-' if win else '' %}

package:
  name: r-mclink
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/mclink_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/mclink/mclink_{{ version }}.tar.gz
  sha256: c3a378578da00cbb2fd09f75ac1ca0c177e9d9070c76a5ed89b6bfa5c0aa16a6

build:
  merge_build_host: True  # [win]
  # If this is a new build for the same version, increment the build number.
  number: 0
  # no skip
  script: R CMD INSTALL --build . ${R_ARGS}
  # This is required to make R link correctly on Linux.
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]

  host:
    - r-base
    - r-data.table >=1.17.8
    - r-dplyr >=1.1.4
    - r-stringr >=1.5.1
    - r-tibble >=3.2.1

  run:
    - r-base
    - r-data.table >=1.17.8
    - r-dplyr >=1.1.4
    - r-stringr >=1.5.1
    - r-tibble >=3.2.1

test:
  commands:
    # You can put additional test commands to be run here.
    - $R -e "library('mclink')"           # [not win]
    - "\"%R%\" -e \"library('mclink')\""  # [win]

  # You can also put a file called run_test.py, run_test.sh, or run_test.bat
  # in the recipe that will be run at test time.

  # requires:
    # Put any additional test requirements here.

about:
  home: https://github.com/LiuyangLee/mclink
  license: GPL-3
  summary: Provides tools for analyzing metabolic pathway completeness, abundance, and transcripts
    using KEGG Orthology (KO) data from (meta)genomic and (meta)transcriptomic studies.
    Supports both completeness (presence/absence) and abundance-weighted analyses. Includes
    built-in KEGG reference datasets. For more details see Li et al. (2023) <doi:10.1038/s41467-023-42193-7>.
  license_family: GPL3
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  recipe-maintainers:
    - LiuyangLee

