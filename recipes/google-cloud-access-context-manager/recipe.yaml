context:
  name: google-cloud-access-context-manager
  version: "0.6.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_access_context_manager-${{ version }}.tar.gz
  sha256: 4d998e4a81c424f51f6c5c6aacb27d7806116d30b556c708ac0a89c37fe51ad8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core-grpc >=2.25.0,<3.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - google.identity.accesscontextmanager
        - google.identity.accesscontextmanager.type
        - google.identity.accesscontextmanager.v1
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-access-context-manager
  summary: Google Cloud Access Context Manager Protobufs
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/googleapis/google-cloud-python

extra:
  recipe-maintainers:
    - pb01ka
