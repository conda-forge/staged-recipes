{% set name = "zeroarmor" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/harshitpratap1113-glitch/zeroarmor/releases/download/v1.0.0/zeroarmor-1.0.0.tar.gz
  sha256: 697da835db6018410951309feace36ca668b3e7b5cfb4b61f929bb7da14eea70

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8

test:
  imports:
    - zeroarmor
  commands:
    - python -c "import zeroarmor; print('✅ ZeroArmor Conda Shield Active!')"

about:
  home: https://github.com/harshitpratap1113-glitch/zeroarmor
  summary: 22-Vector 1-Line Runtime Application Self-Protection (RASP) Security Shield for Python
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/harshitpratap1113-glitch/zeroarmor

extra:
  recipe-maintainers:
    - harshitpratap1113-glitch
