schema_version: 1

context:
  name: healpix-plot
  version: "2026.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/healpix_plot-${{ version }}.tar.gz
  sha256: 0af69c02bd91145f2326b8dbaa548a28d3bc35c7ac5c12ca11b97f26f9bb849b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80.0
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - healpix-geo
    - numpy >=2.3
    - matplotlib-base
    - cartopy
    - numpy_groupies
    - affine
    - scipy

tests:
  - python:
      imports:
        - healpix_plot
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - pytest --pyargs healpix_plot -v
    requirements:
      run:
        - pytest
        - python ${{ python_min }}.*
    files:
      source:
        - healpix_plot/tests/

about:
  homepage: https://github.com/GRID4EARTH/healpix-plot
  summary: Plotting HEALPix data with matplotlib and cartopy
  description: |
    healpix-plot resamples HEALPix cell data onto regular grids and plots it
    with matplotlib and cartopy (including a mollview-style projection).
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/GRID4EARTH/healpix-plot
  documentation: https://grid4earth.eu/healpix-plot/

extra:
  recipe-maintainers:
    - tinaok
    - jmdelouis
    - benbovy
