schema_version: 1

context:
  python_min: "3.11"
  version: "26.7.0"

package:
  name: scippneutron_algorithms
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scippneutron_algorithms/scippneutron_algorithms-${{ version }}.tar.gz
  sha256: c11dc515e00b307cef09202b9b3981fc2935da3f9b4d5a8d8d49fae49948d347

build:
  skip: true # [py < 311]
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cd rust && cargo-bundle-licenses --format yaml --output ../THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1,<2
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.13,<2.0
    - pip
  run:
    - python
    - numpy >=2
    - scipp >=25.11.0
    - scipy >=1.7.0

tests:
  - python:
      imports:
        - scippneutron_algorithms
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Optimized and compiled algorithms for ScippNeutron
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/scipp/scippneutron_algorithms
  repository: https://github.com/scipp/scippneutron_algorithms
  documentation: https://scipp.github.io/scippneutron_algorithms

extra:
  recipe-maintainers:
    - jl-wynen
    - conda-forge/scipp
