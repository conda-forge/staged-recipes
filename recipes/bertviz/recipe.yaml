context:
  version: "1.4.1"

package:
  name: bertviz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bertviz/bertviz-${{ version }}.tar.gz
  sha256: 28d5c350a45dd4ece16f74df3f44ed15548e3ebaf36d837ac93bc60a594bf07a

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - pip
  run:
    - python
    - transformers >=2.0
    - pytorch >=1.0
    - tqdm
    - boto3
    - requests
    - regex
    - sentencepiece
    - ipython >=7.14

tests:
  - python:
      imports:
      - bertviz
      pip_check: true

about:
  homepage: https://github.com/jessevig/bertviz
  summary: Attention visualization tool for NLP Transformer models.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - aerdasaliko
