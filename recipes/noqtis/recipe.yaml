context:
  version: "0.1.4"

package:
  name: noqtis
  version: ${{ version }}

source:
  url: https://github.com/rootcoder007/noqtis/releases/download/v${{ version }}/noqtis-${{ version }}.tar.gz
  sha256: 5947768511c94b369d76e416c09de6af5eabc013c04020a2e198c1e9701064b2

build:
  number: 0
  script:
    - if: unix
      then:
        - cmake -S . -B build -G Ninja ${CMAKE_ARGS} -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_INSTALL_LIBDIR=lib -DNQSHARED=ON -DNQWERROR=OFF -DNQOSSL=OFF
        - cmake --build build --parallel ${CPU_COUNT}
        - if [[ "${CONDA_BUILD_CROSS_COMPILATION:-}" != "1" ]]; then ctest --test-dir build --output-on-failure -j ${CPU_COUNT}; fi
        - cmake --install build
      else:
        - cmake -S . -B build -G Ninja %CMAKE_ARGS% -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%LIBRARY_PREFIX% -DNQSHARED=ON -DNQWERROR=OFF -DNQOSSL=OFF
        - if errorlevel 1 exit 1
        - cmake --build build --parallel %CPU_COUNT%
        - if errorlevel 1 exit 1
        - ctest --test-dir build --output-on-failure -j %CPU_COUNT%
        - if errorlevel 1 exit 1
        - cmake --install build
        - if errorlevel 1 exit 1

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage('noqtis', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - noqtis.h
      lib:
        - if: unix
          then: noqtis
      files:
        - if: win
          then: Library/bin/noqtis-0.dll
      bin:
        - noqtis
  - script:
      - noqtis --version
      - noqtis help

about:
  homepage: https://github.com/rootcoder007/noqtis
  repository: https://github.com/rootcoder007/noqtis
  documentation: https://rootcoder007.github.io/noqtis/
  summary: Post-quantum signing, KEMs and sealed input records in C11
  description: |
    noqtis (Notary of Quantum-Safe Traceable Inputs and Seals) is a C11
    library and command-line tool for post-quantum signatures (ML-DSA,
    SLH-DSA, hybrid ML-DSA + Ed25519), key encapsulation (ML-KEM, HQC) and
    sealed, signed records of the input files an analysis used.
  license: Apache-2.0 WITH LLVM-exception
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - rootcoder007
