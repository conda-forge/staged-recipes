schema_version: 1

context:
  name: physicskit
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8fa0d147d233f93ee6e15e41ca955ccffda358d952b94d48ca611caa683a65c4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.6
    - numba >=0.58
    - plotly >=5.15
    - sympy >=1.11
    - tqdm >=4.65

tests:
  - python:
      imports:
        - physicskit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cpoli/physicskit
  repository: https://github.com/cpoli/physicskit
  documentation: https://cpoli.github.io/physicskit/
  summary: Unified scientific toolkit for computational physics
  description: |
    General Relativity, Quantum Mechanics, Chaos, Random Matrix Theory, Statistical Mechanics, Classical Dynamics, and Condensed Matter.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpoli
