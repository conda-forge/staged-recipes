# The Nextcloud desktop client is built against the macOS 13.0 deployment
# target (upstream sets CMAKE_OSX_DEPLOYMENT_TARGET to 13.0) and uses the
# macOS 13-only SMAppService API for login items (src/common/utility_mac.mm).
# Raise c_stdlib_version and the SDK for the osx subdirs so the build runs
# against MacOSX13.0.sdk (which provides SMAppService.h) and the packages
# carry the matching __osx >= 13 constraint via the c_stdlib metapackage.
c_stdlib_version:         # [osx]
  - '13.0'                # [osx]
MACOSX_SDK_VERSION:       # [osx]
  - '13.0'                # [osx]
