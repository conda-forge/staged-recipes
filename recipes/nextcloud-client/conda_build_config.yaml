# The Nextcloud desktop client builds for the osx subdirs at the macOS 13.0
# deployment target (upstream sets CMAKE_OSX_DEPLOYMENT_TARGET to 13.0 and
# uses the macOS 13-only SMAppService API for login items, unguarded, in
# src/common/utility_mac.mm) and against the macOS 26 SDK (major-only
# alias: the SDK provisioner resolves it to the newest pinned 26.x, 26.5
# from Apple's CDN manifest, 26.1 from the legacy mirror): the GUI tray
# popup uses NSGlassEffectView, an AppKit class that only exists in the
# macOS 26 SDK. The code guards that use with @available(macOS 26.0, *),
# so the 13.0 deployment target stays valid; the two values are
# independent in this build system (deployment target from the C standard
# library version, SDK from the macOS SDK version key; see build_all.py).
c_stdlib_version:         # [osx]
  - '13.0'                # [osx]
MACOSX_SDK_VERSION:       # [osx]
  - '26'                  # [osx]
