context:
  name: nextcloud-client
  version: "35.0.3"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/nextcloud/desktop/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8e79f3df02e04740e03cf1d254c9016265ce2fac88cbd3a745c41d9659fc0134

build:
  number: 0
  skip:
    - win
    - osx
  script:
    - cmake -B build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=${{ PREFIX }}
        -DBUILD_GUI=OFF
        -DBUILD_TESTING=OFF
        -DBUILD_SHELL_INTEGRATION=OFF
        -DBUILD_SHELL_INTEGRATION_ICONS=OFF
    - cmake --build build
    - cmake --install build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - pkgconf
  host:
    - qt6-main
    - qt6-keychain
    - extra-cmake-modules
    - openssl
    - sqlite
    - zlib
    - libp11
    - kdsingleapplication
    - kf6-karchive
  run:
    - qt6-main
    - qt6-keychain
    - openssl
    - sqlite
    - zlib
    - libp11
    - kf6-karchive

tests:
  - package_contents:
      bin:
        - nextcloudcmd
  - script:
    - nextcloudcmd --version

about:
  homepage: https://nextcloud.com/client/
  repository: https://github.com/nextcloud/desktop
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Nextcloud desktop client (nextcloudcmd command-line sync client)
  description: |
    The Nextcloud desktop client synchronizes files between a Nextcloud
    server and the local file system. This package builds the client
    without the GUI (BUILD_GUI=OFF) and provides the nextcloudcmd
    command-line sync client, which can be scripted and run headless.
extra:
  recipe-maintainers:
    - luadebug
