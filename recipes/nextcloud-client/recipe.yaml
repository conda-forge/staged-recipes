context:
  name: nextcloud-client
  version: "35.0.3"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/nextcloud/desktop/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8e79f3df02e04740e03cf1d254c9016265ce2fac88cbd3a745c41d9659fc0134
  patches:
    # Upstream installs the app-bundle-only container-migration.plist to
    # ${OWNCLOUD_OSX_BUNDLE}/Contents/Resources without the
    # BUILD_OWNCLOUD_OSX_BUNDLE guard that every other bundle install has;
    # in a non-bundle build the empty variable makes the destination the
    # absolute path /Contents/Resources and cmake --install fails.
    - patches/0001-guard-app-bundle-install-for-non-bundle-builds.patch

build:
  number: 0
  skip:
    - win
  script:
    - cmake -B build -G Ninja
        ${CMAKE_ARGS}
        -DBUILD_TESTING=OFF
        -DBUILD_SHELL_INTEGRATION=OFF
        -DBUILD_SHELL_INTEGRATION_ICONS=OFF
    - cmake --build build
    - cmake --install build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - pkgconf
  host:
    - qt6-main >=6.5.0
    - qt6-keychain
    - extra-cmake-modules >=6.0.0
    - openssl >=1.1.0
    - sqlite >=3.9.0
    - zlib
    - libp11
    - kdsingleapplication
    - kf6-karchive
  run:
    - qt6-main >=6.5.0
    - qt6-keychain
    - openssl >=1.1.0
    - sqlite >=3.9.0
    - zlib
    - libp11
    - kf6-karchive

tests:
  - package_contents:
      bin:
        - nextcloud
        - nextcloudcmd
  - script:
    - nextcloudcmd --version
    # The GUI executable constructs the QApplication even for --version,
    # so use the offscreen platform plugin for the headless CI test.
    - QT_QPA_PLATFORM=offscreen nextcloud --version

about:
  homepage: https://nextcloud.com/client/
  repository: https://github.com/nextcloud/desktop
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Nextcloud desktop client (GUI and nextcloudcmd command-line sync client)
  description: |
    The Nextcloud desktop client synchronizes files between a Nextcloud
    server and the local file system. This package provides the graphical
    client (nextcloud) as well as the nextcloudcmd command-line sync
    client, which can be scripted and run headless. File-manager shell
    integrations (Nautilus/Dolphin on Linux, Finder Sync on macOS) and the
    macOS auto-updater (Sparkle) are not built.
extra:
  recipe-maintainers:
    - claudiushaag
