context:
  version: "0.1.2"
  commit: 21b3dfe5f68c205be4086469335fd2fc2ce11ed2

package:
  name: libserialport
  version: ${{ version }}

source:
  url: https://github.com/sigrokproject/libserialport/archive/${{ commit }}.zip
  sha256: 8cac3873785312ac9e4a3f6406652e2cac0b0eac3f5fecbed78810d5111bf96e

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: unix
      then:
        - autoconf
        - automake
        - libtool
        - make
  run_exports:
    - ${{ pin_subpackage('libserialport', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - libserialport.h
      lib:
        - if: win
          then: libserialport
          else: serialport

about:
  homepage: https://sigrok.org/wiki/Libserialport
  summary: cross-platform library for writing software that uses serial ports.
  description: |
    A minimal, cross-platform shared library written in C
    that is intended to take care of the OS-specific details
    when writing software that uses serial ports.
  license: LGPL-3.0-or-later
  license_file: COPYING
  documentation: https://sigrok.org/wiki/Libserialport
  repository: https://github.com/sigrokproject/libserialport

extra:
  recipe-maintainers:
    - peter-mitrano
    - peter-mitrano-ar
