context:
  version: "0.1.3"
  commit: a461d528e6fbcb7e93f1a0233e973e728f9eabcc

package:
  name: libserialport
  version: ${{ version }}

source:
  url: https://github.com/hpax/libserialport/archive/${{ commit }}.zip
  sha256: ad564f64c108384d695632c6eee4ec64003293630f75752da0a808a83b2b3c2f

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake
    - if: unix
      then: make
  run_exports:
    - ${{ pin_subpackage('libserialport', upper_bound='x.x') }}

tests:
  - files:
      source:
        - if: unix
          then:
            - build/test_timing
            - build/test_feature_guards
        - if: win
          then:
            - build/Release/test_timing.exe
            - build/Release/test_feature_guards.exe
    script:
      - if: unix
        then:
          - ./build/test_timing
          - ./build/test_feature_guards
      - if: win
        then:
          - build\Release\test_timing.exe
          - build\Release\test_feature_guards.exe
  - requirements:
      run:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake-package-check
    script:
      - cmake-package-check libserialport --targets libserialport::libserialport
  - package_contents:
      include:
        - libserialport.h
      lib:
        - if: win
          then: libserialport
          else: serialport

about:
  homepage: https://sigrok.org/wiki/Libserialport
  summary: cross-platform library for writing software that uses serial ports.
  description: |
    A minimal, cross-platform shared library written in C
    that is intended to take care of the OS-specific details
    when writing software that uses serial ports.
  license: LGPL-3.0-or-later
  license_file: COPYING
  documentation: https://sigrok.org/wiki/Libserialport
  repository: https://github.com/hpax/libserialport

extra:
  recipe-maintainers:
    - peter-mitrano
    - peter-mitrano-ar
