context:
  version: "0.1.2"

package:
  name: libserialport
  version: ${{ version }}

source:
  url: https://github.com/sigrokproject/libserialport/archive/refs/tags/libserialport-${{ version }}.zip
  sha256: fe3eaacb8b5f15b0ea4c8133057f7c9e5bd11d18fa34639662bab95404e65b93

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: unix
      then:
        - autoconf
        - automake
        - libtool
        - make
  run_exports:
    - ${{ pin_subpackage('libserialport', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - libserialport.h
      lib:
        - if: win
          then: libserialport
          else: serialport

about:
  homepage: https://sigrok.org/wiki/Libserialport
  summary: cross-platform library for writing software that uses serial ports.
  description: |
    A minimal, cross-platform shared library written in C
    that is intended to take care of the OS-specific details
    when writing software that uses serial ports.
  license: LGPL-3.0-or-later
  license_file: COPYING
  documentation: https://sigrok.org/wiki/Libserialport
  repository: https://github.com/sigrokproject/libserialport

extra:
  recipe-maintainers:
    - petermitrano
    - peter-mitrano-ar
