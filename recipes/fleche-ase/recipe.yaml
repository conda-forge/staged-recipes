schema_version: 1

context:
  name: fleche-ase
  version: "1.0.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fleche_ase-${{ version }}.tar.gz
  sha256: 71e51489681dd851a6d5941ca1a0813a16dccef3643be1c78a21e0e8f65fcd56

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64.0
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - ase >=3.28,<4
    # fleche's core; the conda-forge `fleche` package is a metapackage, which
    # deliberately does not include this plugin.
    - fleche-base >=0.24.0
    - fleche-numpy >=1.0.0

tests:
  - python:
      imports:
        - fleche_ase
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      # The hooks reach fleche through its entry point; without them fleche
      # raises Indigestible for Atoms.
      - python -c "from ase import Atoms; from fleche.digest import digest; digest(Atoms('H2', positions=[[0, 0, 0], [0, 0, 0.74]]))"

about:
  homepage: https://github.com/pmrv/fleche
  documentation: https://fleche.readthedocs.io/
  repository: https://github.com/pmrv/fleche
  summary: ASE digest hooks for fleche
  description: |
    Lets fleche digest ASE objects.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pmrv
