context:
  version: "0.3.4"

package:
  name: auto-eeg-analysis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/auto-eeg-analysis/auto_eeg_analysis-${{ version }}.tar.gz
  sha256: 147e31c71b05bac29e5c6e2f391312562639e92593dd39b5996bd8f1debe166e

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -v
  python:
    entry_points:
      - aea-eeg = auto_eeg_analysis.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - auto_eeg_analysis
        - auto_eeg_analysis.cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - aea-eeg --version
      - aea-eeg init aea-smoke-study --agent codex
      - python -c "from pathlib import Path; p = Path('aea-smoke-study'); assert (p / 'RESOURCE_INDEX.md').is_file(); assert (p / 'skills/eeg-erp/SKILL.md').is_file(); assert (p / '.agents/skills/eeg-erp/SKILL.md').is_file(); assert len(list(p.glob('skills/*/SKILL.md'))) == 22; assert sum(not x.parent.name.startswith('_') for x in p.glob('recipes/*/RECIPE.md')) == 10"

about:
  homepage: https://dengzhe-hou.github.io/Auto-EEG-Analysis/
  summary: Reusable EEG analysis skills and study recipes for large language model agents
  description: |
    AEA packages EEG analysis procedures, study recipes, and workflow helpers.
    The aea-eeg command initializes a new study directory with the bundled resources.
  license: MIT AND CC-BY-4.0
  license_file: LICENSE
  documentation: https://github.com/dengzhe-hou/Auto-EEG-Analysis/blob/main/docs/GETTING_STARTED.md
  repository: https://github.com/dengzhe-hou/Auto-EEG-Analysis

extra:
  recipe-maintainers:
    - dengzhe-hou
