schema_version: 1

context:
  version: "0.8.0"

package:
  name: faim-wako-searchfirst
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/f/faim-wako-searchfirst/faim_wako_searchfirst-${{ version }}.tar.gz
  sha256: d0d6300d8974c244ca6dd14de3bc9d47bbcf5a4099b3ee3585e877e647b2230d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - cellpose <4
    - numpy <2.1
    - confuse
    - rich
    - scikit-image
    - tqdm
    - typer

tests:
  - python:
      imports:
        - faim_wako_searchfirst
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSES/MIT.txt
  homepage: https://pypi.org/project/faim-wako-searchfirst/
  repository: https://github.com/fmi-faim/faim-wako-searchfirst
  summary: Python scripts for the SearchFirst option in Wako Software Suite
  documentation: https://github.com/fmi-faim/faim-wako-searchfirst

extra:
  recipe-maintainers:
    - imagejan
