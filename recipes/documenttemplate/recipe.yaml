schema_version: 1

context:
  version: "5.4"
  test_modules:
    - DocumentTemplate.sequence.tests.testSequence
    - DocumentTemplate.tests.testDTML
    - DocumentTemplate.tests.testDTMLUnicode
    - DocumentTemplate.tests.testSecurity
    - DocumentTemplate.tests.test_DT_If
    - DocumentTemplate.tests.test_DT_In
    - DocumentTemplate.tests.test_DT_InSV
    - DocumentTemplate.tests.test_DT_Raise
    - DocumentTemplate.tests.test_DT_Try
    - DocumentTemplate.tests.test_DT_Var
    - DocumentTemplate.tests.test_DocumentTemplate
    - DocumentTemplate.tests.test_Util
    - DocumentTemplate.tests.test_permissions
    - DocumentTemplate.tests.test_templatedict
    - DocumentTemplate.tests.testustr
    - TreeDisplay.tests

package:
  name: documenttemplate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/documenttemplate/documenttemplate-${{ version }}.tar.gz
  sha256: 856f9cafe783d5b0f09c14aeb32e5439400110ddf0113e1ce3d0f54e884b7c4e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - accesscontrol >=4.0a5
    - acquisition
    - extensionclass >=4.1a1
    - restrictedpython >=4.0a1
    - roman
    - zexceptions
    - zope.sequencesort
    - zope.structuredtext

tests:
  - python:
      imports:
        - DocumentTemplate
        - DocumentTemplate.DT_HTML
        - DocumentTemplate.DT_Util
        - TreeDisplay
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest -v ${{ test_modules | join(" ") }}
    requirements:
      run:
        - docutils

about:
  homepage: https://github.com/zopefoundation/DocumentTemplate
  repository: https://github.com/zopefoundation/DocumentTemplate
  summary: Document Templating Markup Language (DTML)
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
