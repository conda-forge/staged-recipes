context:
  version: "0.2.0"

package:
  name: archivefs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/archivefs/archivefs-${{ version }}.tar.gz
  sha256: 7ce4a87180441ff34acafc07314bfef93d80a319cc00c9ae942c3150b564e1af

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - archivefs = archivefs.cli:main

requirements:
  host:
    - python
    - pip
    - setuptools >=77
    - setuptools-scm >=8
    - wheel
  run:
    - python >=3.9
    - fsspec >=2023.9.0
    - requests >=2.28

tests:
  - python:
      imports:
        - archivefs
        - archivefs.backends.mendeley
        - archivefs.backends.cbioportal
      pip_check: true
  - script:
      - archivefs --help

about:
  homepage: https://github.com/swarbricklab/archivefs
  summary: Read-only fsspec filesystems for scientific data archives (EGA, Zenodo, Mendeley, cBioPortal, GEO, BIA)
  description: |
    archivefs lets you address data in scientific repositories by accession/DOI and
    pull it through the fsspec ecosystem - including DVC via dvc import-url - with
    checksum certainty and version-controlled provenance.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://github.com/swarbricklab/archivefs/tree/main/docs
  repository: https://github.com/swarbricklab/archivefs

extra:
  recipe-maintainers:
    - johnyaku
