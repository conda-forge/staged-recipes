{% set name = "vera-explain" %}
{% set version = "1.1.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/vera_explain-{{ version }}.tar.gz
  sha256: eb337b96fb666e1849590074c848a6076f98166cbcdbde075a5b091e672b0236

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=2
    - pandas
    - scipy
    - scikit-learn
    - kdepy
    - contourpy
    - shapely >=2
    - matplotlib-base >=3.6
    - glasbey
    - networkx
    - requests
    - tqdm

test:
  imports:
    - vera
    - vera.explain
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/pavlin-policar/vera
  summary: Your 2D embeddings, explained. Automatically.
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/pavlin-policar/vera

extra:
  recipe-maintainers:
    - pavlin-policar
