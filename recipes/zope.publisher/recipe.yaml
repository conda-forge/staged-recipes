schema_version: 1

context:
  version: "8.1"

package:
  name: zope.publisher
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.publisher/zope_publisher-${{ version }}.tar.gz
  sha256: 87a354a029afa3f8fcde802e6323ed9e53b6b96b6e17e94323e945a19194d192

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - multipart >=1.1.0
    - zope.browser
    - zope.component
    - zope.configuration
    - zope.contenttype >=4.0.0
    - zope.event
    - zope.exceptions
    - zope.i18n >=4.0.0
    - zope.interface >=4.0.1
    - zope.location
    - zope.proxy
    - zope.security >=4.0.0

tests:
  - python:
      imports:
        - zope.publisher
        - zope.publisher.browser
        - zope.publisher.http
        - zope.publisher.publish
        - zope.publisher.xmlrpc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # dotted names: discover puts zope/publisher on sys.path, so its http.py
      # and xmlrpc.py shadow the stdlib modules
      - python -m unittest -v zope.publisher.tests.test_baserequest zope.publisher.tests.test_baseresponse zope.publisher.tests.test_browserlanguages zope.publisher.tests.test_browserrequest zope.publisher.tests.test_browserresponse zope.publisher.tests.test_ftp zope.publisher.tests.test_http zope.publisher.tests.test_httpcharsets zope.publisher.tests.test_ipublication zope.publisher.tests.test_mapply zope.publisher.tests.test_principallogging zope.publisher.tests.test_publisher zope.publisher.tests.test_requestdataproperty zope.publisher.tests.test_testing zope.publisher.tests.test_xmlrpc zope.publisher.tests.test_xmlrpcrequest zope.publisher.tests.test_zcml
    requirements:
      run:
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.publisher
  repository: https://github.com/zopefoundation/zope.publisher
  documentation: https://zopepublisher.readthedocs.io
  summary: The Zope publisher publishes Python objects on the web
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
