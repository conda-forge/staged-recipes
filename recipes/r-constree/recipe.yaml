schema_version: 1

context:
  version: "1.0.0"

package:
  name: r-constree
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/ConsTree_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/ConsTree/ConsTree_${{ version }}.tar.gz
  sha256: ca0521929d8fd8df732d5caaecf7d6c88da200fb2c2b40b0b77e68b80b7d65ac

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/
    missing_dso_allowlist:
      - if: win
        then:
          - "*/R.dll"
          - "*/Rblas.dll"
          - "*/Rlapack.dll"

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - cross-r-base ${{ r_base }}.*
    - if: not win
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - make
    - if: win
      then:
        - ${{ compiler('m2w64_c') }}
        - ${{ stdlib('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
        - m2-filesystem
        - m2-make
        - m2-sed
        - m2-coreutils
        - m2-zip
  host:
    - r-base
    - if: linux
      then:
        - libgomp
    - if: osx
      then:
        - llvm-openmp
    - r-ape >=5.6
    - r-rcpp >=1.0.0
    - r-rdpack >=2.6
    - r-treetools >=2.3.0
  run:
    - r-base
    - r-ape >=5.6
    - r-rcpp >=1.0.0
    - r-rdpack >=2.6
    - r-treetools >=2.3.0

tests:
  - r:
      libraries:
        - ConsTree

about:
  homepage: https://constree.github.io/
  repository: https://github.com/ms609/ConsTree
  documentation: https://constree.github.io/
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: "Fast Algorithms for Phylogenetic Consensus Trees"
  description: |
    Efficient construction of phylogenetic consensus trees. Methods include
    strict, majority-rule, majority-rule (+), loose (combinable component /
    semi-strict), greedy, Adams, frequency difference, R*, and local
    consensus.

extra:
  recipe-maintainers:
    - conda-forge/r
    - ms609
