context:
  name: eksctl
  version: "0.231.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/eksctl-io/eksctl/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c2f64df7beb3770b4a5f8663f17c3b0ab8da6a349445036bfa5b5edd69b1bd5c
  target_directory: src

build:
  number: 0
  # Only linux-64 has been built and tested so far. Other platforms are
  # welcome; remove this skip once their build and tests pass.
  skip:
    - target_platform != "linux-64"
  script:
    env:
      CGO_ENABLED: "0"
    content:
      - cd src
      # Bundle the licenses of every vendored Go dependency. nodeadm is MIT-0,
      # which go-licenses can't classify, so copy its LICENSE from the module
      # cache by hand.
      - go-licenses save ./cmd/eksctl --save_path ../library_licenses --ignore github.com/weaveworks/eksctl --ignore github.com/awslabs/amazon-eks-ami/nodeadm
      - mkdir -p ../library_licenses/github.com/awslabs/amazon-eks-ami/nodeadm
      - cp "$(go list -m -f '{{.Dir}}' github.com/awslabs/amazon-eks-ami/nodeadm)/LICENSE" ../library_licenses/github.com/awslabs/amazon-eks-ami/nodeadm/LICENSE
      # Mirror upstream's goreleaser build (.github/.goreleaser.yml). An empty
      # PreReleaseID makes `eksctl version` report the bare release version
      # instead of the "-dev" suffix baked into pkg/version/release.go.
      - go build -v -trimpath -tags "netgo release" -o $PREFIX/bin/eksctl -ldflags "-s -w -X github.com/weaveworks/eksctl/pkg/version.PreReleaseID=" ./cmd/eksctl
      - mkdir -p $PREFIX/share/bash-completion/completions $PREFIX/share/zsh/site-functions $PREFIX/share/fish/vendor_completions.d
      - $PREFIX/bin/eksctl completion bash > $PREFIX/share/bash-completion/completions/eksctl
      - $PREFIX/bin/eksctl completion zsh > $PREFIX/share/zsh/site-functions/_eksctl
      - $PREFIX/bin/eksctl completion fish > $PREFIX/share/fish/vendor_completions.d/eksctl.fish

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - eksctl --help
      - test "$(eksctl version)" = "${{ version }}"
  - package_contents:
      bin:
        - eksctl
      files:
        - share/bash-completion/completions/eksctl
        - share/zsh/site-functions/_eksctl
        - share/fish/vendor_completions.d/eksctl.fish
      strict: true

about:
  homepage: https://eksctl.io
  summary: The official CLI for Amazon EKS
  description: |
    eksctl is a simple CLI tool for creating and managing clusters on Amazon
    EKS, written in Go and using CloudFormation.
  license: Apache-2.0
  license_file:
    - src/LICENSE
    - library_licenses/
  repository: https://github.com/eksctl-io/eksctl
  documentation: https://eksctl.io/introduction/

extra:
  recipe-maintainers:
    - dlqqq
