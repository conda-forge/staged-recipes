context:
  version: "2.5.0"

package:
  name: daemonize
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/daemonize/daemonize-${{ version }}.tar.gz
  sha256: dd026e4ff8d22cb016ed2130bc738b7d4b1da597ef93c074d2adb9e4dea08bc3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        # daemonize uses Unix-only modules (fcntl, pwd, grp)
        - if: unix
          then: daemonize
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/thesharp/daemonize
  summary: Library for writing system daemons in Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
