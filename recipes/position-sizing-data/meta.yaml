{% set name = "position-sizing-data" %}
{% set version = "0.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/position_sizing_data-{{ version }}.tar.gz
  sha256: e754c4e89905867827fe49ac3ca1fe9f5334dd304792ec6f7df46c94c4a4aed3

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=61
  run:
    - python >=3.9

test:
  requires:
    - pip
  imports:
    - position_sizing_data
  commands:
    - pip check

about:
  home: https://positionsizetool.com/
  summary: Reference data and arithmetic for risk-based position sizing across forex, stocks and crypto futures
  license: MIT
  license_file: LICENSE
  license_family: MIT
  doc_url: https://github.com/tk25719/position-sizing-data
  dev_url: https://github.com/tk25719/position-sizing-data

extra:
  recipe-maintainers:
    - tk25719
