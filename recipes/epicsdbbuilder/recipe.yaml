schema_version: 1

context:
  name: epicsdbbuilder
  version: "1.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
    sha256: 698ad5882de4a626a82086139ff95204e8de72e63d03d9f22d4418da3a6c8566
  # The sdist does not include the license file
  - url: https://raw.githubusercontent.com/dls-controls/epicsdbbuilder/${{ version }}/LICENSE
    sha256: b40930bbcf80744c86c46a12bc9da056641d722716c378f5659b9e555ef833e1
    file_name: LICENSE

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - wheel
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - epicsdbbuilder
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: EPICS Database Builder
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/dls-controls/epicsdbbuilder

extra:
  recipe-maintainers:
    - jwlodek
