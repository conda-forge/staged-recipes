context:
  version: "0.1.2"

package:
  name: skillmodels
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/skillmodels/skillmodels-${{ version }}.tar.gz
  sha256: 2c8018bd21bea9cb1c8d580c0a1287ab6e9283772bb424f3bbdae0143eecd755

build:
  script: python -m pip install . -vv
  number: 0
  skip:
    - win

requirements:
  host:
    - python 3.14.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=3.14,<3.15
    - beartype >=0.22
    - dags >=0.5.1
    - jax >=0.9
    - jupyter-book >=2
    - python-kaleido >=1.2
    - numpy >=2.4
    - optimagic >=0.5.4
    - pandas >=3
    - plotly >=6.6
    - pytask >=0.5.8
    - pytask-parallel >=0.5.2
    - scikit-learn >=1.5

tests:
  - python:
      imports:
        - skillmodels
      pip_check: true

about:
  homepage: https://github.com/OpenSourceEconomics/skillmodels
  repository: https://github.com/OpenSourceEconomics/skillmodels
  documentation: https://skillmodels.readthedocs.io
  summary: Estimators for skill formation models
  description: |
    skillmodels implements estimators for nonlinear dynamic latent factor models,
    used primarily for skill formation research in economics. It provides
    Kalman-filter-based maximum likelihood estimation of models following
    Cunha, Heckman and Schennach (2010, Econometrica).
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmgaudecker
    - janosg
