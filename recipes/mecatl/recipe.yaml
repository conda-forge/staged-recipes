context:
  version: "0.0.38"

package:
  name: mecatl
  version: ${{ version }}

source:
  url: https://github.com/stacklok/mecatl/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 2630df20bae98f512fcccdf82f9e25f066c1a5b04716c3605039a263035c66e1
  target_directory: src

build:
  number: 0
  skip:
    - win
  script:
    - cd src
    - go-licenses save ./cmd/mecated ./cmd/mecatui --save_path ../library_licenses
    - go build -v -o $PREFIX/bin/mecated -ldflags="-s -w" ./cmd/mecated
    - go build -v -o $PREFIX/bin/mecatui -ldflags="-s -w" ./cmd/mecatui

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script: mecated --help
  - script: mecatui --help
  - package_contents:
      bin:
        - mecated
        - mecatui
      strict: true

about:
  homepage: https://github.com/stacklok/mecatl
  summary: Open source, cloud-native agent harness (server + terminal client)
  description: |
    Mecatl is an open source, cloud-native agent harness. It provides the
    loop, tools, permissions, hooks, delegation, and service boundaries for
    running AI agents as production workloads on infrastructure you operate.

    This package installs mecated (the server) and mecatui (the terminal
    client), matching the project's official Homebrew formula. Other
    binaries in the repository (mecak8s, mecatequi, mecademo) are not
    included; see the upstream README for building those from source.
  license: Apache-2.0
  license_file:
    - src/LICENSE
    - library_licenses/
  documentation: https://mecatl.dev/docs
  repository: https://github.com/stacklok/mecatl

extra:
  recipe-maintainers:
    - keponk
