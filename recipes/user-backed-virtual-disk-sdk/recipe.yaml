schema_version: 1
package:
  name: user-backed-virtual-disk-sdk
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/User-Backed-Virtual-Disk-SDK/language-sdks-v1.0.0/user-backed-virtual-disk-sdk-sdk-source-1.0.0.zip
  sha256: 0a52a1a6a07bbc4d98be8b05170c14e8dff5b34cda515ce88106cd2ff2c0d84b
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - user_backed_virtual_disk_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from user_backed_virtual_disk_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/User-Backed-Virtual-Disk-SDK
  summary: Windows x64 User-Backed-Virtual-Disk-SDK Python SDK with source-built native bridge
  license: MIT
  license_file:
  - User-Backed-Virtual-Disk-SDK-C-ffi/LICENSE
  - User-Backed-Virtual-Disk-SDK-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
