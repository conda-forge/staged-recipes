schema_version: 1

context:
  version: "3.25.0"

package:
  name: nxselector
  version: ${{ version }}

source:
  url: https://github.com/nexdatas/nxselector/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d10dc595922b38e636e102116b4a36c3e19d08c978cfad59302e8704ab16cd74

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - pytango
    - taurus
    - nxsrecselector

tests:
  - python:
      imports:
        - nxsselector
        - nxsselector.AddDataSourceDlg
        - nxsselector.CommandThread
        - nxsselector.Data
        - nxsselector.Descriptions
        - nxsselector.Detectors
        - nxsselector.DynamicTools
        - nxsselector.EdDataDlg
        - nxsselector.EdListDlg
        - nxsselector.ElementModel
        - nxsselector.Element
        - nxsselector.Frames
        - nxsselector.GroupsDlg
        - nxsselector.InfoDlg
        - nxsselector.LDataDlg
        - nxsselector.MessageBox
        - nxsselector.OrderDlg
        - nxsselector.Preferences
        - nxsselector.PropertiesDlg
        - nxsselector.qtapi
        - nxsselector.Selector
        - nxsselector.ServerState
        - nxsselector.Storage
        - nxsselector.Views

      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - if: unix
        then:
          - test -x "$PREFIX/bin/nxselector"
          - nxselector --help
    requirements:
      run:
        - python ${{ python_min }}.*
    files:
      source:
        - site-packages/nxsselector/qrc/resources.rcc
  - package_contents:
      files:
        - site-packages/nxsselector/qrc/resources.rcc


about:
  homepage: https://github.com/nexdatas/nxselector
  repository: https://github.com/nexdatas/nxselector
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: NeXus Component Selector GUI
  description: |
    NeXus Component Selector is a GUI configuration tool dedicated to select
    components as well as datasources which constitute
    the XML configuration strings of Nexus Data Writer via Sardana NeXus Recorder.

extra:
  recipe-maintainers:
    - jkotan
