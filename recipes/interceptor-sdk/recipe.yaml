schema_version: 1
package:
  name: interceptor-sdk
  version: 1.0.1
source:
- url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Interceptor/input-language-sdks-v1.0.0/interceptor-input-sdks-1.0.0-source.zip
  sha256: 19ada3388528aaa18010ffb094464c5dc08e465fe2235edf6ef7c6332ef2a2d5
- url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Interceptor/binding-namespaces-v2.0.0/interceptor_sdk-1.0.1.tar.gz
  sha256: 5f919981a23a0737da739a6328e118616afdf09eba98d2dfb2a3f7dc27eae9fc
  target_directory: corrected-python
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - interceptor_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from interceptor_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/Interceptor
  summary: Windows x64 Interceptor Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Interceptor-C-ffi/LICENSE
  repository: https://github.com/TitanCSA/Interceptor
extra:
  recipe-maintainers:
  - TitanCSA
