context:
  name: pica-suite
  version: "1.0.8"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[:1] }}/${{ name }}/pica_suite-${{ version }}.tar.gz
  sha256: f6a37b6c40458e8d5d4f33fa52c91f7f1f33892a2445b429ef5366e34dba716d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pica-gui = pica.main_v2:main_advanced
      - pica-cli = pica.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.22.4
    - pandas >=1.4.2
    - matplotlib-base >=3.5.2
    - pyvisa >=1.12.0
    # >=0.14: conda-forge's 0.13.x builds report version 0.0.0 to pip
    - pymeasure >=0.14.0
    - pyvisa-py >=0.5.3
    - pillow >=10.3.0
    - psutil >=5.9.8
    - zeroconf >=0.113.0

tests:
  - python:
      imports:
        - pica
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  # pica-gui opens a Tk window and pica-cli waits for keyboard input; neither
  # has a --help flag, so on conda-forge's headless CI only check that the
  # entry-point targets import and that both launchers were installed.
  - script:
      - python -c "from pica.main_v2 import main_advanced; from pica.cli import main"
      - python -c "import pymeasure, pyvisa, pyvisa_py, matplotlib.backends.backend_tkagg"
      # shutil.which, not `command -v`: this test also runs under cmd.exe on win_64
      - python -c "import shutil, sys; sys.exit(0 if shutil.which('pica-gui') and shutil.which('pica-cli') else 1)"

about:
  homepage: https://github.com/prathameshnium/PICA-Python-Instrument-Control-and-Automation
  summary: 'PICA: Advanced High-Precision Transport Measurement Automation with Python'
  license: MIT
  license_file: LICENSE
  documentation: https://prathameshnium.github.io/PICA-Python-Instrument-Control-and-Automation/
  repository: https://github.com/prathameshnium/PICA-Python-Instrument-Control-and-Automation

extra:
  recipe-maintainers:
    - prathameshnium
