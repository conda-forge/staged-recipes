context:
  version: "3.4.0"
  python_min: "3.12"

package:
  name: esgprep
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/e/esgprep/esgprep-${{ version }}.tar.gz
  sha256: 595b097b2a52c3160113aa631f1dc09516f537581ae471927ee8392517cb0884
  patches:
    - windows-devnull.patch

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - esgdrs = esgprep.esgdrs:main
      - esgmapfile = esgprep.esgmapfile:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
  run:
    - python >=${{ python_min }}
    - esgvoc >=7.0.0
    - hurry.filesize >=0.9
    - lockfile >=0.12.2
    - netcdf4 >=1.7.2
    - numpy >=2.2.6
    - rapidfuzz >=3.0.0
    - requests >=2.32.3
    - treelib >=1.7.1

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - esgprep
      pip_check: true
  - script:
      - esgdrs --help
      - esgmapfile --help

about:
  homepage: https://esgf.github.io/esgf-prepare/
  repository: https://github.com/ESGF/esgf-prepare
  summary: Toolbox to prepare data for ESGF publication
  description: |
    esgprep provides tools to prepare datasets for publication through
    the Earth System Grid Federation (ESGF). It includes command-line
    utilities for working with Data Reference Syntax (DRS) information
    and generating mapfiles, using ESGF controlled vocabularies.
  license: CECILL-C
  license_file:
    - LICENSE-fr.txt
    - LICENSE.txt
  documentation: https://esgf.github.io/esgf-prepare/

extra:
  recipe-maintainers:
    - cofinoa
    - ltroussellier
