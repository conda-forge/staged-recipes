schema_version: 1

context:
  python_min: "3.12"
  version: "1.2.5"

package:
  name: esi-shakelib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/esi-shakelib/esi_shakelib-${{ version }}.tar.gz
  sha256: 3f7ab9a7ea46db7292df6ca8a8879a424dcd19fe4e0b1cb1a179e3ed3a5c144d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - setuptools-scm >=3.4
    - pip
  run:
    - python >=${{ python_min }}
    - esi-core >=1.2.9
    - esi-utils-colors >=1.0.3
    - esi-utils-vectors >=1.0.2
    - importlib-resources
    - mapio >=0.8.8
    - cartopy >=0.22.0
    - gmpacket >=0.1.10
    - matplotlib-base >=3.8.0
    - numpy >=1.26,<2.5
    - openquake.engine <=3.24.1
    - numba
    - alpha-shapes >=1.0.0
    - pandas >=2.1.1
    - scipy >=1.11.2
    - setuptools <82
    - shapely >=2.0.1
    - scikit-image >=0.21.0
    - usgs-strec >=2.2.8
    - dill

tests:
  - python:
      imports:
        - esi_shakelib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: USGS Earthquake Impact Library for ShakeMap
  license: SL
  license_file: LICENSE.md
  homepage: https://pypi.org/project/esi-shakelib/

extra:
  recipe-maintainers:
    - ocefpaf
