schema_version: 1

context:
  version: "0.1.7"

package:
  name: bnunicodenormalizer
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/bnunicodenormalizer/bnunicodenormalizer-${{ version }}.tar.gz
  sha256: 86a3489cc81c73d2afb4e265bd2d0d8bc52fc8a2374e210c899e0260940bc091

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - bnunicodenormalizer
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - python -c "from bnunicodenormalizer import Normalizer; r = Normalizer()(chr(0x995) + chr(0x9c7) + chr(0x9be)); print(r); assert r['normalized'] == chr(0x995) + chr(0x9cb)"

about:
  homepage: https://github.com/mnansary/bnUnicodeNormalizer
  summary: Bangla Unicode Normalization Toolkit
  description: |
    Unicode normalization for Bangla (Bengali) text, plus normalizers for
    other Indic scripts, developed by Bengali.AI.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/mnansary/bnUnicodeNormalizer

extra:
  recipe-maintainers:
    - BeyondITL-Mossaddique
