context:
  version: "0.8.0"
  plugin_dir: share/zsh/plugins/zsh-syntax-highlighting

package:
  name: zsh-syntax-highlighting
  version: ${{ version }}

source:
  url: https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/${{ version }}.tar.gz
  sha256: 5981c19ebaab027e356fe1ee5284f7a021b89d4405cc53dc84b476c3aee9cc32

build:
  number: 0
  skip: win
  script: |
    make install \
      PREFIX="${PREFIX}" \
      SHARE_DIR="${PREFIX}/${{ plugin_dir }}" \
      DOC_DIR="${PREFIX}/share/doc/zsh-syntax-highlighting"

requirements:
  build:
    - make
  run:
    - zsh >=4.3.11

tests:
  - package_contents:
      files:
        - ${{ plugin_dir }}/zsh-syntax-highlighting.zsh
        - ${{ plugin_dir }}/highlighters/main/main-highlighter.zsh
  - script: |
      zsh -f -c 'source "${PREFIX}/${{ plugin_dir }}/zsh-syntax-highlighting.zsh"; (( ${+functions[_zsh_highlight]} ))'

about:
  homepage: https://github.com/zsh-users/zsh-syntax-highlighting
  summary: Fish shell like syntax highlighting for Zsh
  description: |
    Highlights commands while they are typed at the Zsh prompt, so errors
    such as unknown commands or unclosed quotes are visible before the line
    is run.

    Activate it by adding this as the last line of your .zshrc:

      source "${CONDA_PREFIX}/share/zsh/plugins/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh"
  license: BSD-3-Clause
  license_file: COPYING.md
  documentation: https://github.com/zsh-users/zsh-syntax-highlighting/blob/master/docs/highlighters.md
  repository: https://github.com/zsh-users/zsh-syntax-highlighting

extra:
  recipe-maintainers:
    - ManuelLerchner
