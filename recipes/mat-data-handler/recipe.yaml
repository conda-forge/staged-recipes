schema_version: 1

context:
  name: mat-data-handler
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/mat_data_handler/mat_data_handler-${{ version }}.tar.gz
  sha256: 53ecbcd58f58ec54f566102595e732346be1b61e7fae0a4ee2ab93ec341ef3bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - mat-build-database = mat_data_handler.database:main
      - mat-extract-params = mat_data_handler.extract:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }} 
    - pyyaml >=6.0
    - jsonschema >=4.18
    - referencing >=0.30

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - mat_data_handler
  - script:
      - mat-build-database --help
      - mat-extract-params --help

about:
  license: MIT
  license_file: LICENSE
  summary: Validate, combine, and export crystal-plasticity material parameter sets for Abaqus UMATs.
  description: |
    mat-data-handler is a python toolbox for the validation, combination, and export of crystal-plasticity material parameter sets for 
    crystal plasticity models. It fetches material data from https://github.com/ICAMS/mat-data over the network at runtime (or from MAT_DATA_LOCAL_PATH), 
    rather than depending on a packaged data distribution.
  homepage: https://github.com/ICAMS/mat-data-handler
  repository: https://github.com/ICAMS/mat-data-handler
  documentation: https://github.com/ICAMS/mat-data-handler#readme

extra:
  recipe-maintainers:
    - AHartmaier
