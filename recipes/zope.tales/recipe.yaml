schema_version: 1

context:
  version: "7.0"

package:
  name: zope.tales
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.tales/zope_tales-${{ version }}.tar.gz
  sha256: 8f09b52085334fd8e4195e40b766d5eef2021dba4a254c397ec5f2d5ccc1b677

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ==78.1.1
    - wheel
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface

tests:
  - python:
      imports:
        - zope.tales
        - zope.tales.tales
        - zope.tales.expressions
        - zope.tales.engine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      interpreter: python
      content: |
        from zope.tales.engine import Engine; ctx = Engine.getContext(x=41); assert ctx.evaluate(Engine.compile('python: x + 1')) == 42

about:
  homepage: https://github.com/zopefoundation/zope.tales
  repository: https://github.com/zopefoundation/zope.tales
  documentation: https://zopetales.readthedocs.io
  summary: Zope Template Application Language Expression Syntax (TALES)
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
