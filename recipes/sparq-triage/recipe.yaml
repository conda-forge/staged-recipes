schema_version: 1

context:
  version: "0.10.0"

package:
  name: sparq-triage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sparq-triage/sparq_triage-${{ version }}.tar.gz
  sha256: 4ec2511bf846695000cc321af04b6f3028eb50293345ed99e07e66715a785465

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10

tests:
  - python:
      imports:
        - sparq
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/sparq-triage
  license: Apache-2.0
  license_file: LICENSE
  summary: "Physics-in-the-loop autonomous triage of single-photon emitters"
  description: |
    HBT histogram twin, exact master-equation references, spiking
    estimators, sequential tests that stop early, heralded-g2/CAR closed
    forms, and closed-loop reinforcement-learning screening of
    single-photon emitters. Fits of several dip shapes with
    goodness-of-fit tests, a sampled posterior of g2(0), exact
    acquisition planning, a model-free sequential test, an exact
    heralded-source detector model and a PicoQuant PTU reader are
    included. The machine-learning extras (PyTorch) are optional; the
    physics core is NumPy/SciPy only.
  repository: https://github.com/TaN-MM-Org/sparq-triage
  documentation: https://github.com/TaN-MM-Org/sparq-triage#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
