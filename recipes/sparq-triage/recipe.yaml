schema_version: 1

context:
  version: "0.16.0"

package:
  name: sparq-triage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sparq-triage/sparq_triage-${{ version }}.tar.gz
  sha256: 2e029246331d1f7a0a25bd6e469a1568145beda0ff82a243f77afefe3504a1da

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10

tests:
  - python:
      imports:
        - sparq
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/sparq-triage
  license: Apache-2.0
  license_file: LICENSE
  summary: "Decide whether a light source gives out one photon at a time, from two-detector coincidence data"
  description: |
    Works from the record of a two-detector coincidence measurement (a
    histogram, raw time stamps or a PicoQuant PTU file) and answers how deep
    the dip at zero delay is and how sure that is, which dip shape fits the
    data, whether the site is a single-photon emitter and with what
    probability, how long to measure, and when a measurement can stop early.
    The package is imported as sparq.
  repository: https://github.com/TaN-MM-Org/sparq-triage
  documentation: https://github.com/TaN-MM-Org/sparq-triage#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
