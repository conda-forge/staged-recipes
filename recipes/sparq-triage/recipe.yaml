schema_version: 1

context:
  version: "0.9.1"

package:
  name: sparq-triage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sparq-triage/sparq_triage-${{ version }}.tar.gz
  sha256: 5b7374c171e952f0f200b2ef927ba87c1619ac764026982433877f60880c3811

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10

tests:
  - python:
      imports:
        - sparq
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/sparq-triage
  license: Apache-2.0
  license_file: LICENSE
  summary: "Physics-in-the-loop autonomous triage of single-photon emitters"
  description: |
    HBT histogram twin, exact master-equation references, spiking
    estimators, sequential tests that stop early, heralded-g2/CAR closed
    forms, and closed-loop reinforcement-learning screening of
    single-photon emitters. The machine-learning extras (PyTorch) are
    optional; the physics core is NumPy/SciPy only.
  repository: https://github.com/TaN-MM-Org/sparq-triage
  documentation: https://github.com/TaN-MM-Org/sparq-triage#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
