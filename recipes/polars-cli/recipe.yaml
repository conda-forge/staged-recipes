context:
  version: "0.9.0"

package:
  name: polars-cli
  version: ${{ version }}

source:
  url: https://github.com/pola-rs/polars-cli/archive/refs/tags/${{ version }}.tar.gz
  sha256: 8a3733bf50779c454ec014db0501d63318e6104ac9dd59aa4037688cfc34c126

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      # ethnum 1.5.0 as pinned in Cargo.lock transmutes `()` into `TryFromIntError`,
      # which no longer compiles since that type stopped being zero-sized. Fixed in 1.5.1.
      - cargo update --package ethnum --precise 1.5.3
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - if: linux
      then:
        # jemallocator is a linux-only dependency and jemalloc-sys builds the
        # bundled jemalloc with configure + make
        - make

tests:
  - script:
      - polars --help
      - polars -c "select 1 as a"
  - package_contents:
      bin:
        - polars
      strict: true

about:
  homepage: https://github.com/pola-rs/polars-cli
  summary: CLI interface for running SQL queries with Polars as backend
  description: |
    The Polars command line interface provides a convenient way to execute SQL
    commands using Polars as a backend. Running `polars` without any arguments
    starts an interactive shell in which SQL commands can be executed against
    local files, with results printed as tables or written out as CSV, JSON,
    Parquet, Arrow IPC or Markdown.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/pola-rs/polars-cli

extra:
  recipe-maintainers:
    - pavelzw
