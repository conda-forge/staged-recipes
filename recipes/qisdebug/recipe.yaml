context:
  name: qisdebug
  version: "0.1.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 83129e347084836defb3be1f2bffa9035132c8a8546bba1bd213bd212a40f562

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - qisdebug = qisdebug._cli.app:main
      - qisdebug-mcp = qisdebug._mcp:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - qiskit >=1.0
    - pydantic >=2.5
    - typer >=0.12
    - rich >=13
    - textual >=0.60
  # Optional features, installed separately: qiskit-aer (statevector capture),
  # matplotlib-base (image rendering), pywebview (GUI), mcp (agent server).
  run_constraints:
    - qiskit-aer >=0.14
    - matplotlib-base >=3.5
    - pywebview >=5.0
    - mcp >=1.0

tests:
  - python:
      imports:
        - qisdebug
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - qisdebug --version
      - qisdebug --help
      - qisdebug version

about:
  homepage: https://github.com/kriss-u/QisDebug
  repository: https://github.com/kriss-u/QisDebug
  documentation: https://github.com/kriss-u/QisDebug#readme
  summary: Zero-touch instrumentation and timeline debugging for Qiskit circuits
  description: |
    QisDebug attaches construction, transpilation and execution tracing to
    existing Qiskit code with a single start() call, records everything that
    happens to each circuit on a timeline (including mid-execution
    statevectors on Aer), and explores it in a native GUI or terminal viewer.
    Optional features need extra packages: qiskit-aer for statevector capture,
    matplotlib-base for image rendering, pywebview for the GUI, and mcp for the
    qisdebug-mcp agent server.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kriss-u
