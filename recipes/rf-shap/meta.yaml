{% set name = "rf-shap" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/rf_shap-{{ version }}.tar.gz
  sha256: 2734951f83280886749a7028bbaa6851ade218904c2ec2f4c9c80b57eded3db9

build:
  noarch: python
  number: 0
  entry_points:
    - rf-shap = rf_shap.cli:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.9
    - numpy >=1.23
    - pandas >=1.5
    - xarray >=2023.1
    - netcdf4 >=1.6
    - scikit-learn >=1.3
    - scipy >=1.10
    - pyyaml >=6.0
    - matplotlib-base >=3.7

test:
  imports:
    - rf_shap
  commands:
    - pip check
    - rf-shap --help
  requires:
    - pip

about:
  home: https://github.com/feinihuang9554-max/RF_SHAP_ESMValTool
  summary: Cube-native tree-ensemble and SHAP diagnosis for ESM-observation relationships
  description: |
    rf-shap learns collocated predictor-to-target mappings with tree ensembles
    and returns skill metrics plus SHAP explanations as climate data cubes,
    for use with ESMValTool and offline workflows.
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/feinihuang9554-max/RF_SHAP_ESMValTool
  dev_url: https://github.com/feinihuang9554-max/RF_SHAP_ESMValTool

extra:
  recipe-maintainers:
    - feinihuang9554-max
