context:
  version: "0.9.0"

package:
  name: ti84-evo-cli
  version: ${{ version }}

source:
  url: https://github.com/Inspyre-Softworks/ti84-evo-for-pycharm/archive/refs/tags/${{ version }}.tar.gz
  sha256: 784e095cb505740bbc5022532ebbda04ed04d32b28a6e9d8f88d3c9e65771601

build:
  number: 0
  noarch: generic

requirements:
  build:
    - openjdk >=25,<26
  run:
    - openjdk >=25,<26

tests:
  - script:
      - ti84-evo --help

about:
  homepage: https://github.com/Inspyre-Softworks/ti84-evo-for-pycharm
  summary: Send, synchronize, inspect, and back up TI-84 Evo calculator files
  description: |
    TI-84 Evo CLI is the standalone command-line interface from the TI-84 Evo
    PyCharm plugin. It can inspect, transfer, synchronize, and back up calculator
    files without requiring PyCharm.
  license: MIT
  license_file:
    - LICENSE
    - third-party/Apache-2.0.txt
    - third-party/JCodec-LICENSE.txt
    - third-party/JNA-LICENSE.txt
    - third-party/jSerialComm-NOTICE.txt
    - third-party/THIRD-PARTY-NOTICES.md
  documentation: https://ti84-evo-for-pycharm.readthedocs.io/
  repository: https://github.com/Inspyre-Softworks/ti84-evo-for-pycharm

extra:
  recipe-maintainers:
    - tayjaybabee
