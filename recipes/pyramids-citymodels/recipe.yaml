context:
  version: "0.3.0"

package:
  name: pyramids-citymodels
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyramids-citymodels/pyramids_citymodels-${{ version }}.tar.gz
  sha256: 288a95e88b393c07794a2dc04db10bb63efeb400fe5280d0248166b498ee1742

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80.0.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    # pyramids-core (PyPI) is packaged as `pyramids` on conda-forge; the import
    # name stays `pyramids`. The 0.3.0 release declares pyramids-core >=0.72.0,
    # which is satisfiable on conda-forge (latest 0.74.0). conda `pyramids`
    # pulls in the real GDAL/osgeo stack, so GDAL is not declared here.
    - pyramids >=0.72.0
    - numpy >=2.0.0
    - shapely >=2.0.0
    - geopandas >=1.0.0

tests:
  - python:
      imports:
        - pyramids_citymodels
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/serapeum-org/pyramids-citymodels
  repository: https://github.com/serapeum-org/pyramids-citymodels
  documentation: https://serapeum-org.github.io/pyramids-citymodels
  summary: "3D city-model file-format drivers for pyramids: CityGML, CityJSON and more"
  description: |
    pyramids-citymodels reads and writes 3D city-model file formats (CityGML,
    CityJSON and more) as pyramids objects. It owns only the file-format
    drivers; every GIS operation lives upstream in pyramids.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MAfarrag
