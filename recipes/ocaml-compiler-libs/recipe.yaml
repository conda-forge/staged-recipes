context:
  version: "0.17.0"

package:
  name: ocaml-compiler-libs
  version: ${{ version }}

source:
  url: https://github.com/janestreet/ocaml-compiler-libs/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9b9644d7351db699e57ddba7c767bb4153e6e988ccf45ead2fb238a3bd75cdc7

build:
  number: 0
  skip:
    - win
  script:
    - dune build --profile=release -p ocaml-compiler-libs @install
    - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" ocaml-compiler-libs

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler("ocaml") }}
    - ocaml-dune >=1.5.1
  host:
    - ocaml >=5.2.0

tests:
  - package_contents:
      strict: true
      files:
        - lib/ocaml/ocaml-compiler-libs/*
        - doc/ocaml-compiler-libs/*

about:
  homepage: https://github.com/janestreet/ocaml-compiler-libs
  repository: https://github.com/janestreet/ocaml-compiler-libs
  summary: OCaml compiler libraries repackaged with a namespaced interface
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - ManuelLerchner
    - MementoRC
