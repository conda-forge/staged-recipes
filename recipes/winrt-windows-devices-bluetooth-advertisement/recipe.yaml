context:
  version: "4!10.0.28000.2957"

package:
  name: winrt-windows-devices-bluetooth-advertisement
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/winrt-windows-devices-bluetooth-advertisement/winrt_windows_devices_bluetooth_advertisement-${{ version }}.tar.gz
  sha256: 0123ebd97b37c5cfacc7b67cb348b9be839e645c8ea07df40e58db989eca676d

build:
  number: 0
  # Pure-Python projection, but it only works on Windows (it needs winrt-runtime).
  skip:
    - not win
    - match(python, "<3.11")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling
    - winrt-table-compiler >=4,<5
  run:
    - python
    - winrt-runtime >=4.1.0,<5
    - winrt-windows-foundation-collections >=${{ version }}
    - winrt-windows-foundation >=${{ version }}
    - winrt-windows-storage-streams >=${{ version }}

tests:
  - python:
      imports:
        - winrt.windows.devices.bluetooth.advertisement
      pip_check: true

about:
  summary: PyWinRT projection of the Windows.Devices.Bluetooth.Advertisement namespace
  homepage: https://github.com/pywinrt/pywinrt
  repository: https://github.com/pywinrt/pywinrt
  documentation: https://pywinrt.readthedocs.io
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
