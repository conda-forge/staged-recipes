schema_version: 1

context:
  version: "6.1.1"

package:
  name: oslotest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oslotest/oslotest-${{ version }}.tar.gz
  sha256: 5ce97347734f08ca626bb496962a8bc7adbae9693730f5859d9c5293d4a2fd80

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pbr >=6.1.1
    - pip
  run:
    - python >=${{ python_min }}
    - fixtures >=3.0.0
    - testtools >=2.2.0

tests:
  - python:
      imports:
        - oslotest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - if: not win
    then:
      - script:
          - python -m unittest discover -v oslotest

about:
  summary: Oslo test framework
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://docs.openstack.org/oslotest

extra:
  recipe-maintainers:
    - mgorny
