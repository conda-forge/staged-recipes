context:
  version: "0.1.0"

package:
  name: s1proc
  version: ${{ version }}

source:
  url: https://github.com/WWSAR/sentinel_gpu_processor/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5be74d1be861493c3119c4bba6853cc33b16daab1dbc9ed0ccb2df34732c2968

build:
  skip:
    - osx
    - cuda_compiler_version == "None"
  number: 0
  script:
    - if: win
      then:
        - bld.bat
    - if: unix
      then:
        - bash ${{ SRC_DIR }}/build.sh
  python:
    entry_points:
      - s1proc = s1proc.cli:main

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - ${{ stdlib("c") }}
    - cuda-cudart
    - cuda-cudart-dev
    - if: unix
      then: cuda-cudart-static
    - cmake
    - ninja
    - libcufft-dev
  host:
    - python
    - pip
    - setuptools
    - libtiff
    - sqlite
    - cuda-cudart
    - cuda-cudart-dev
    - if: unix
      then: cuda-cudart-static
    - libcufft-dev
  run:
    - python
    - cuda-cudart
    - libcufft
    - sqlite
    - libtiff
    - numpy >=1.23
    - pandas >=2.0
    - numba >=0.58
    - requests >=2.31
    - matplotlib-base >=3.8
    - tyro >=0.9
    - tqdm >=4
    - pyaps3 >=0.3.7
    - sentineleof >=0.12.0
    - sardem >=0.13.0
    - gdal >=3.10
    - zarr >=2.18.3,<3
    - dacite >=1.9.2
    - ruamel.yaml >=0.18.0
    - platformdirs >=4.0
    - cupy
    - dask >=2024.1.0
    - fsspec >=2024.6.0,<2027.0.0
    - nvidia-ml-py >=12.535.0,<14.0.0

tests:
  - python:
      imports:
      - s1proc
      pip_check: true

about:
  homepage: https://github.com/WWSAR/sentinel_gpu_processor
  summary: 'A user-friendly Sentinel-1 radar image processor'
  description: |
    s1proc is a GPU-accelerated Sentinel-1 InSAR processing pipeline written in
    Python and CUDA. It takes you from raw data discovery all the way to deformation
    time series through a single s1proc CLI.
  license: MIT
  license_file: LICENSE.txt
  repository: https://github.com/WWSAR/sentinel_gpu_processor

extra:
  recipe-maintainers:
    - aik9508
    - ak2325
