schema_version: 1

context:
  version: "1.2.1"

package:
  name: desearch-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/desearch-py/desearch_py-${{ version }}.tar.gz
  sha256: af137b23503699b6971730eb645f9fa94fad3ce8c516849126ed9606a02f6870

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.8
    - pydantic >=2.0
    - typing_extensions

tests:
  - python:
      imports:
        - desearch_py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Desearch-ai/desearch.py
  repository: https://github.com/Desearch-ai/desearch.py
  summary: A Python SDK for interacting with the Desearch API service.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Chkhikvadze
