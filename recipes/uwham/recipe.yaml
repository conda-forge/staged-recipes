schema_version: 1

package:
  name: uwham
  version: "1.0.1"

source:
  url: https://github.com/pittbin/UWHAM-and-SWHAM/archive/refs/tags/v1.0.1.tar.gz
  sha256: 221b9a7632d9f9a6cd223c763fce436bd4d935fd324556b1c055f87bf9c07ffb
  # v1.0.1 builds the math.h-><cmath> fix directly upstream (old sysroots /
  # glibc 2.17 no longer hit the C++17 isinf/isnan conflict), so no patch needed.
  # (Earlier v1.0.0 needed recipes/uwham/math_h_to_cmath.patch; removed on bump.)

build:
  number: 0
  # POSIX-only code (unistd.h, getopt) -> no Windows builds
  skip:
    - win

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
  host:
    - gsl
    - libopenblas

tests:
  - script: uwham -h
  - package_contents:
      bin:
        - uwham
        - swham
        - sreswham

about:
  homepage: https://github.com/pittbin/UWHAM-and-SWHAM
  license: MIT
  license_file: LICENSE
  summary: Unbinned and Stochastic Weighted Histogram Analysis Method

extra:
  recipe-maintainers:
    - pittbin
