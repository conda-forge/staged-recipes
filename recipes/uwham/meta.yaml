package:
  name: uwham
  version: "1.0.0"

source:
  url: https://github.com/pittbin/UWHAM-and-SWHAM/archive/refs/tags/v1.0.0.tar.gz
  sha256: cc53becfe5769b9f9eeffd114e4b698971126ca90d5e17f0bf85afa6795384eb

build:
  number: 0
  # POSIX-only code (unistd.h, getopt) -> no Windows builds
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake
    - make
  host:
    - gsl
  run:
    - gsl

test:
  commands:
    - uwham -h
    - test -f $PREFIX/bin/uwham
    - test -f $PREFIX/bin/swham
    - test -f $PREFIX/bin/sreswham

about:
  home: https://github.com/pittbin/UWHAM-and-SWHAM
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Unbinned and Stochastic Weighted Histogram Analysis Method

extra:
  recipe-maintainers:
    - pittbin
