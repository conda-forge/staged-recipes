schema_version: 1

context:
  version: "0.3.1"

package:
  name: python-sbom
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/python-sbom/python_sbom-${{ version }}.tar.gz
  sha256: 37d0fa3d0a16fddc3d88099e147e164ddb3055e8bc3424506ef41dd80f723a73

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - python-sbom = python_sbom._cli._main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-fancy-pypi-readme >=25.1
    - hatch-vcs >=0.5
    - hatchling >=1.32.4
    - python-installer >=1.1
    - packageurl-python >=0.11.1
    - zipremove >=0.10
    - pip
  run:
    - python >=${{ python_min }}
    - python-installer >=1.1
    - packageurl-python >=0.11.1
    - packaging >=26.3
    - zipremove >=0.10

tests:
  - python:
      imports:
        - python_sbom
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python-sbom --help

about:
  summary: "SBOMs for Python distributions: write PEP 770 CycloneDX SBOMs into wheels."
  license: Apache-2.0 AND MIT
  license_file:
    - LICENSE
    - src/python_sbom/_validate/schemas/LICENSE
  homepage: https://github.com/tox-dev/python-sbom
  repository: https://github.com/tox-dev/python-sbom
  documentation: https://python-sbom.readthedocs.io

extra:
  recipe-maintainers:
    - beenje
