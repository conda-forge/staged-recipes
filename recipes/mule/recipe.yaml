context:
  name: mule
  version: "2026.09.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/MetOffice/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: fae8c2670a8641cb39c44e6ee360323a867c91ca0d8810558b468d5ad7789267

  patches:
    # conda-forge's shumlib is built with CMake: one libshum exporting
    # GET_SHUMLIB_VERSION(), without the per-component libraries and
    # *_version.h headers of shumlib's Makefile build
    - shumlib_cmake.patch

build:
  skip:
    - win
    - osx
  script:
    - python -m pip install ./mule -vv
    - python -m pip install ./um_packing -vv
    - python -m pip install ./um_ppibm -vv
    - python -m pip install ./um_spiral_search -vv
    - python -m pip install ./um_utils -vv
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - numpy
    - shumlib =2026.07.2
  run:
    - python
    - numpy
    - six
    - shumlib

tests:
  # Some packages might need a `test/commands` key to check CLI.
  - python:
      # A list of modules that the test will try to import
      imports:
      - mule
      - um_packing
      - um_ppibm
      - um_spiral_search
      - um_utils
      # Also run `pip check` to verify the integrity 
      pip_check: true
  - script:
      - mule-pumf --help
  - script:
      - pytest
    requirements:
        run:
            - pytest
    files:
        recipe:
            - mule/lib/mule/tests
            - mule/lib/um_utils/tests

about:
  homepage: https://github.com/MetOffice/mule
  summary: 'Python packages providing an interface to the various files used and produced by the Met Office Unified Model (UM)'
  description: |
    Mule is an API written in Python which allows you to access and manipulate files produced by the UM (Unified Model, of the Met Office (UK)).
  license: BSD-3-Clause
  license_file: LICENCE
  documentation: https://metoffice.github.io/mule
  repository: https://github.com/MetOffice/mule

extra:
  recipe-maintainers:
    - ScottWales
    - ickc
