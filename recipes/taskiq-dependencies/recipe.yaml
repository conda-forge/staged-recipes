schema_version: 1

context:
  version: "1.5.7"

package:
  name: taskiq-dependencies
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/taskiq-dependencies/taskiq_dependencies-${{ version }}.tar.gz
  sha256: 0d3b240872ef152b719153b9526d866d2be978aeeaea6600e878414babc2dcb4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - taskiq_dependencies
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/taskiq-python/taskiq-dependencies
  summary: FastAPI-like dependency injection for taskiq
  description: |
    Taskiq-dependencies adds FastAPI-like dependency injection to Python
    projects. It is part of the taskiq ecosystem but has no dependencies
    of its own, so it can be used independently in any project.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pb01ka
