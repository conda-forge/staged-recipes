context:
  version: "0.1.0"

package:
  name: spaday-codemirror
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-codemirror/spaday_codemirror-${{ version }}.tar.gz
  sha256: b67c76d85e97742a5ed74816782d507a48469e9e729f6c98fdf3a431165c0e1f

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.8.2,<1

tests:
  - python:
      imports:
        - spaday_codemirror
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: CodeMirror 6 code editor for spaday
  homepage: https://github.com/1kbgz/spaday-codemirror
  repository: https://github.com/1kbgz/spaday-codemirror

extra:
  recipe-maintainers:
    - timkpaine
