context:
  name: persian-rag
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/persian_rag-${{ version }}.tar.gz
  sha256: 47b6de6e821a404d1a1ef26a56bb148c53aa3bf866f3ae2d9398d26357579701

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - persian-rag = persian_rag.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.25
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - persian_rag
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - persian-rag --help

about:
  homepage: https://github.com/sadrmanesh/persian-rag
  summary: Persian-first retrieval-augmented generation toolkit
  description: |
    persian-rag builds retrieval-augmented generation systems over Persian (Farsi)
    text: Persian normalization, document loaders, chunking, BM25 and dense
    retrieval with rank fusion, Persian query rewriting, reranking, cited answers,
    evaluation, and an optional HTTP API. The core install has no dependencies;
    models, vector stores, parsers, and the server are optional extras on PyPI.
  license: MIT
  license_file: LICENSE
  documentation: https://sadrmanesh.github.io/persian-rag/
  repository: https://github.com/sadrmanesh/persian-rag

extra:
  recipe-maintainers:
    - sadrmanesh
