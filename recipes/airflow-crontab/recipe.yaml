schema_version: 1

context:
  name: airflow-crontab
  version: "0.1.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/airflow-crontab/airflow_crontab-${{ version }}.tar.gz
  sha256: eb41b31694b0436f8e612d7694c5b0b5e98bdb64aa510e4c7dc5a42ec647e731

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - airflow_crontab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/airflow-laminar/airflow-crontab
  summary: Airflow DAG generation from cron syntax
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://airflow-laminar.github.io/airflow-crontab/
  repository: https://github.com/airflow-laminar/airflow-crontab

extra:
  recipe-maintainers:
    - timkpaine
