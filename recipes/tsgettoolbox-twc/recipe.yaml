context:
  version: 27.0.0

package:
  name: tsgettoolbox-twc
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-twc/tsgettoolbox_twc-${{ version }}.tar.gz
  sha256: e670e3d00d29f284bee8c0605443905a68e769f9a7f767bb907b9a820ee057fe

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=80
  - pip
  run:
  - python >=${{ python_min }}
  - aiodns >3.6.0
  - async_retriever
  - pandas
  - requests
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
      - tsgettoolbox_twc
    pip_check: true
    python_version:
      - ${{ python_min }}.*
      - "*"

about:
  summary: Plugin for tsgettoolbox to download time series data from the Texas Weather Connection (TWC).
  description: |
    The 'tsgettoolbox_twc' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    Texas Weather Connection (TWC).
  homepage: https://pypi.org/project/tsgettoolbox-twc/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
