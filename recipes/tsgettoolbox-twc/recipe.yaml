context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-twc
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-twc/tsgettoolbox_twc-${{ version }}.tar.gz
  sha256: e670e3d00d29f284bee8c0605443905a68e769f9a7f767bb907b9a820ee057fe

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools>=80
  - pip
  run:
  - python >=3.10
  - aiodns >3.6.0
  - async_retriever
  - pandas
  - requests
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_twc
    pip_check: true

about:
  summary: Plugin for tsgettoolbox to download time series data from the Texas Weather Connection (TWC).
  description: |
    .. image:: https://img.shields.io/coveralls/github/timcera/tsgettoolbox_twc
