context:
  version: "0.2.0"

package:
  name: opack2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opack2/opack2-${{ version }}.tar.gz
  sha256: 997ab3fe4540610f10c8072a34fa69246c229b5e2bbf3f383cbe6f2884cbf1a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - arrow
    - bytestruct >=0.1.0

tests:
  - python:
      imports:
        - opack2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/doronz88/opack2
  summary: Python library for parsing Apple's OPACK format
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
