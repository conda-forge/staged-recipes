schema_version: 1

context:
  version: "0.7.3"

package:
  name: physionet
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/physionet/physionet-${{ version }}.tar.gz
  sha256: 5d08c7c17c65221a6c7fce6636af9ee9655e130632660c68d3efef52e69ca0fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - physionet = physionet.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - openpyxl
    - requests
    - urllib3 >=1.26.0
    - tqdm >=4.66.0
    - boto3 >=1.26.0
    - fsspec >=2025.7.0

tests:
  - python:
      imports:
        - physionet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - physionet --help

about:
  summary: A collection of tools for working with the PhysioNet repository.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/physionet/

extra:
  recipe-maintainers:
    - larsoner
