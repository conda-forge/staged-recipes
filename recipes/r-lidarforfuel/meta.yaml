{% set version = "1.0.0" %}
package:
  name: r-lidarforfuel
  version: {{ version|replace("-", "_") }}

source:
  url: https://github.com/oliviermartin7/LidarForFuel/archive/refs/tags/V{{ version }}.tar.gz 
  sha256: 83585e5563ca2f7c8e7740dff60185433f969f294a233f4aa0e91ae8fc18fdc4

build:
  number: 0
  merge_build_host: true
  script: R CMD INSTALL --build .
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  host:
    - r-FNN
    - r-Rfast
    - r-base 
    - r-circular
    - r-data.table
    - r-dplyr
    - r-fastcluster
    - r-plyr
    - r-lidr
    - r-rgl
    - r-dicekriging
    - r-stringr
    - r-progress
    - r-gtools
    - r-pracma
    - r-pkgcond
    - r-r.matlab
    - r-svmisc
    - r-terra
  run:
    - r-FNN
    - r-Rfast
    - r-base
    - r-circular
    - r-data.table
    - r-dplyr
    - r-fastcluster
    - r-plyr
    - r-lidr
    - r-rgl
    - r-dicekriging
    - r-stringr
    - r-progress
    - r-gtools
    - r-pracma
    - r-pkgcond
    - r-r.matlab
    - r-svmisc
    - r-terra
test:
  commands:
    - $R -e "library('LidarForFuel')"  # [not win]
    - "\"%R%\" -e \"library('LidarForFuel')\""  # [win]

about:
  home: https://github.com/oliviermartin7/LidarForFuel
  summary: This package provides a set of tools to compute fuel metrics. The method is fully described in  the paper Martin-Ducup et al 2024 "Unlocking the Potential of Als Data for Direct Assessment of Fuel Load and Vertical Structure.".
  license: GPL-3.0-or-later

extra:
  recipe-maintainers:
    - Marie59
