schema_version: 1

context:
  name: fin-primitives
  version: "3.3.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fin-primitives/fin_primitives-${{ version }}.tar.gz
  sha256: 075f770a94505ba3740543a588e24d9164c907e83fbcd896d066493355797233

build:
  number: 0
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      MATURIN_PEP517_ARGS: --locked
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != host_platform
      then:
        - python
        - cross-python_${{ host_platform }}
        - maturin >=1.7,<2
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
  host:
    - if: is_abi3
      then: python-abi3
    - python
    - pip
    - maturin >=1.7,<2
  run:
    - python

tests:
  - python:
      imports:
        - fin_primitives
      pip_check: true
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
  - script:
      interpreter: python
      content: |
        import fin_primitives as fp

        assert len(fp.catalogue()) > 700

        # Wilder's RSI(14) example series, checked against a plain Python Wilder RSI.
        closes = [44.34, 44.09, 44.15, 43.61, 44.33, 44.83, 45.10, 45.42, 45.84, 46.08,
                  45.89, 46.03, 45.61, 46.28, 46.28, 46.00, 46.03, 46.41, 46.22, 45.64]
        got = fp.rsi(closes, 14)
        assert len(got) == len(closes)
        assert all(v is None for v in got[:14])
        diffs = [b - a for a, b in zip(closes, closes[1:])]
        gain = sum(max(d, 0.0) for d in diffs[:14]) / 14
        loss = sum(max(-d, 0.0) for d in diffs[:14]) / 14
        want = [100 - 100 / (1 + gain / loss)]
        for d in diffs[14:]:
            gain = (gain * 13 + max(d, 0.0)) / 14
            loss = (loss * 13 + max(-d, 0.0)) / 14
            want.append(100 - 100 / (1 + gain / loss))
        for g, w in zip(got[14:], want):
            assert abs(float(g) - w) < 1e-6, (g, w)

        ind = fp.Indicator("rsi", 14)
        last = None
        for i in range(20):
            last = ind.update(str(100 + i))
        assert last == 100, last
        print("fin-primitives RSI check passed")
  - if: is_abi3
    then:
      requirements:
        run:
          - abi3audit
      script:
        - if: unix
          then: abi3audit $SP_DIR/fin_primitives/_fin_primitives.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit %SP_DIR%\fin_primitives\_fin_primitives.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  homepage: https://fin-primitives.vercel.app/
  summary: Exact decimal trading indicators from Rust (RSI, EMA, MACD, Bollinger, ATR and 700+ more) for Python, numpy, pandas and polars
  description: |
    fin-primitives computes 743 streaming technical indicators (RSI, EMA, SMA, MACD,
    Bollinger, ATR, ADX, VWAP, Ichimoku, SuperTrend and the rest) in exact decimal
    arithmetic, through one Indicator class with streaming updates and batch helpers
    for lists, numpy arrays, pandas Series and polars Series. It is a compiled abi3
    extension built from the fin-primitives Rust crate and has no runtime dependencies;
    numpy, pandas and polars are only used when you pass their types in.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/Mattbusel/fin-primitives
  documentation: https://github.com/Mattbusel/fin-primitives/blob/main/docs/python.md

extra:
  recipe-maintainers:
    - Mattbusel
