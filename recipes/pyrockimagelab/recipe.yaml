context:
  name: pyrockimagelab
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9e89d77ab4cfe53911ade2a85b7bf328101177e8578d452ca55140eb0bdfbcb2

build:
  number: 0
  noarch: python
  script:
    # conda-forge's opencv does not provide the opencv-python distribution metadata
    - ${{ "sed -i.bak '/opencv-python/d' pyproject.toml" if unix else "powershell -Command \"(Get-Content pyproject.toml) -notmatch 'opencv-python' | Set-Content pyproject.toml\"" }}
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyrockimagelab = pyrockimagelab.core_box.processing:main
      - pyrockimagelab-app = pyrockimagelab.webapp:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.20
    - py-opencv >=4.5
    - pillow >=8.3
    - matplotlib-base >=3.5
    - fastapi >=0.100
    - uvicorn >=0.23
    - pillow-heif >=0.13

tests:
  - python:
      imports:
        - pyrockimagelab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Browser app and tools for core and outcrop image processing, data collection, and geological classification and analysis
  license: AGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://geolarrylai.com/projects/pyRockImageLab/
  repository: https://github.com/GeoLarryLai/pyRockImageLab

extra:
  recipe-maintainers:
    - GeoLarryLai
