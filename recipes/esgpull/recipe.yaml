context:
  name: esgpull
  version: "0.9.6"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/esgpull/esgpull-${{ version }}.tar.gz
  sha256: 1c11a02f5f03e4b411e4a63d756b414def936f839fdfe929d36d5280518d28e7

build:
  noarch: python
  script: python -m pip install . -vv
  python:
    entry_points:
      - esgpull = esgpull.cli:main
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiofiles >=22.1.0
    - alembic >=1.8.1
    - click >=8.1.3
    - click-params >=0.4.0
    - httpx >=0.23.0
    - nest-asyncio >=1.5.6
    - pyopenssl >=22.1.0
    - pyyaml >=6.0
    - tomlkit >=0.11.5
    - rich >=12.6.0
    - sqlalchemy >=2.0.0b2,<2.1
    - setuptools >=65.4.1
    - aiostream >=0.4.5
    - attrs >=22.1.0
    - cattrs >=22.2.0
    - platformdirs >=2.6.2
    - pyparsing >=3.0.9
    - packaging >=25.0
    - pydantic >=2.11.7
    - pydantic-settings >=2.10.1

tests:
  - python:
      imports:
        - esgpull
        - esgpull.cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - esgpull --help

about:
  homepage: https://github.com/ESGF/esgf-download
  summary: ESGF data discovery, download, replication tool
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/ESGF/esgf-download
  documentation: https://esgf.github.io/esgf-download/

extra:
  recipe-maintainers:
    - cofinoa
