schema_version: 1

context:
  version: "0.10.0"

package:
  name: esgpull
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/e/esgpull/esgpull-${{ version }}.tar.gz
  sha256: c62f4fba187020fb16eb8808fa83abc0aa17dcb31e832be1e3b087a6fff0ba30

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - esgpull = esgpull.cli:main

requirements:
  host:
    - python ${{ python_min }}.* 
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - aiofiles >=22.1.0
    - aiostream >=0.4.5
    - alembic >=1.8.1
    - attrs >=22.1.0
    - cattrs >=22.2.0
    - click >=8.1.3
    - click-params >=0.4.0
    - httpx >=0.23.0
    - nest-asyncio >=1.5.6
    - packaging >=25.0
    - platformdirs >=2.6.2
    - pydantic >=2.11.7
    - pydantic-settings >=2.10.1
    - pyopenssl >=22.1.0
    - pyparsing >=3.0.9
    - pystac-client >=0.9.0
    - pyyaml >=6.0
    - rich >=12.6.0
    - setuptools >=65.4.1
    - sqlalchemy >=2.0.0b2,<2.1
    - tomlkit >=0.11.5

tests:
  - python:
      imports:
        - esgpull
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python
    script:
      - esgpull --help
      - esgpull --version

about:
  summary: ESGF data discovery, download, replication tool
  description: |
    esgpull is a tool that simplifies usage of the ESGF Search API for data discovery,
    and manages procedures related to downloading and storing files from ESGF.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  homepage: https://pypi.org/project/esgpull/
  documentation: https://esgf.github.io/esgf-download/

extra:
  recipe-maintainers:
    - Zeitsperre
