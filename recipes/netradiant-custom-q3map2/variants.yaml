# Build variants, picked up automatically by rattler-build as this file sits
# next to recipe.yaml.

# Upstream only supports GCC-compatible compilers. On Windows this is
# conda-forge's MinGW-w64 GCC (UCRT), matching upstream's MSYS2 builds.
c_compiler:
  - if: osx
    then: clang
    else: gcc
cxx_compiler:
  - if: osx
    then: clangxx
    else: gxx
c_compiler_version:
  - if: osx
    then: "19"
    else: "15"
cxx_compiler_version:
  - if: osx
    then: "19"
    else: "15"

# Minimum OS versions: std::filesystem requires macOS 10.15, which is below
# conda-forge's global macOS baseline (11.0), so the baseline is used as is
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
c_stdlib_version:
  - if: linux
    then: "2.28"
  - if: osx
    then: "11.0"
