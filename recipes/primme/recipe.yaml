schema_version: 1

context:
  version: "3.2.3"

package:
  name: primme
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/p/primme/primme-${{ version }}.tar.gz
    sha256: adc241c41a01adbf34d9975b2c14f58374de001f8b155a573628e99c11f67b47
  # The sdist ships no license file at all: MANIFEST.in is only `graft src` plus
  # `include primme.c`, so COPYING.txt never makes it in. Fetch it from the
  # matching upstream tag so info/licenses/ records the terms of the code that is
  # actually redistributed.
  - url: https://raw.githubusercontent.com/primme/primme/v${{ version }}/COPYING.txt
    sha256: 2f7c56263247476d83e0723ad465ed38a6f717ff2e0b559eee0aa5251f414de5
    file_name: COPYING.txt

build:
  number: 0
  # Windows cannot work without patching upstream. setup.py's BLAS fallback (see
  # the host section) asks for `libraries = ['lapack', 'blas']`, which MSVC
  # resolves as lapack.lib/blas.lib, but conda-forge's libblas and liblapack ship
  # only Library/bin/libblas.dll and Library/bin/liblapack.dll on win -- there is
  # no import library in the prefix under any name, so there is nothing to link
  # against. PRIMME also compiles with F77UNDERSCORE, whose trailing-underscore
  # symbol names do not match MKL's undecorated Windows LP64 symbols. Upstream's
  # `Operating System :: Microsoft :: Windows` classifier refers to building
  # against a Fortran toolchain, not to this path. conda-forge's r-primme is not a
  # counterexample: it links R's own Rblas.dll/Rlapack.dll and whitelists them as
  # missing DSOs, never touching these shims.
  skip: win
  script:
    # Guard setup.py's BLAS autodetection, which is silent and order-dependent.
    # get_numpy_options() tries pkgconfig probes for {,lib}{openblas,mkl,blis,lapack},
    # then scipy_openblas32, then scipy_openblas64 (which also forces
    # PRIMME_BLASINT_SIZE=64), and only then falls back to the generic
    # `libraries = ['lapack', 'blas']` that this recipe wants. Neither
    # scipy_openblas32 nor scipy_openblas64 exists on conda-forge, so only a stray
    # pkgconfig in host could divert the build -- and it would do so quietly,
    # linking one implementation directly instead of the variant-agnostic shims.
    # Nothing in host depends on pkgconfig today; this asserts that stays true.
    - 'python -c "import importlib.util as u; mods = [m for m in (''pkgconfig'', ''scipy_openblas32'', ''scipy_openblas64'') if u.find_spec(m)]; assert not mods, str(mods) + '' would divert setup.py off its generic lapack/blas fallback''"'
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    # C only: the extension is C, and the vendored PRIMME sources are C. There is
    # no C++ and no Fortran here -- PRIMME calls BLAS/LAPACK through its own C
    # prototypes in src/primme/linalg/blaslapack_private.h.
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=61.0
    - wheel
    - numpy
    # Deliberately no cython. The sdist ships a primme.c pregenerated by Cython
    # 3.0.11 alongside primme.pyx, and setuptools rewrites the .pyx source back to
    # that .c unless Cython is importable. Installing Cython here would instead
    # discard the vetted primme.c and regenerate from primme.pyx, whose first line
    # requests `language_level=2` -- deprecated in Cython 3 and slated for removal.
    # A build with only numpy, setuptools and wheel succeeds, so there is no reason
    # to take that risk.
    #
    # Link the generic BLAS/LAPACK shims so one build works with whichever
    # implementation the user selects (`conda install "libblas=*=*_mkl"` and
    # friends). This is why the build script keeps setup.py on its fallback branch:
    # the blas feedstock installs lapack.pc/blas.pc for the openblas variant alone,
    # so the pkgconfig branch would link a different library on each variant.
    # PRIMME defaults PRIMME_BLASINT_SIZE to 32
    # (src/primme/linalg/blaslapack_private.h), which matches these LP64 shims, so
    # no macro override is needed.
    - libblas
    - liblapack
  run:
    - python
    # scipy is a genuine runtime dependency, not just a test one: eigsh and svds
    # accept scipy.sparse matrices and LinearOperators, and primme.pyx imports
    # scipy.sparse.linalg.aslinearoperator at module scope. Upstream sets no
    # version floor, so neither does this. numpy is intentionally absent -- numpy's
    # run_exports (`numpy >=<abi level>,<3`) supplies the correct bounds from the
    # host pin, as do libblas's and liblapack's.
    - scipy

tests:
  - python:
      # A single top-level module, primme.cpython-*.so, rather than a package:
      # setup.py compiles primme.pyx together with 25 vendored PRIMME C files into
      # one Extension(name="primme"), so there are no submodules to import.
      imports:
        - primme
      pip_check: true
  - script:
      # Exercise the solvers rather than just the import, because a mislinked or
      # unlinked BLAS is this recipe's main failure mode and still imports cleanly.
      # A diagonal matrix has exactly known eigenvalues, so these are deterministic
      # and quick. The spectrum starts at 1 rather than 0 so every expected value is
      # exact: with arange(100) the smallest eigenvalue comes back as ~4e-15 and
      # would pass only by np.allclose's atol.
      - python -c "import numpy as np, scipy.sparse as sp, primme; A=sp.diags(np.arange(1., 101.)); v,_=primme.eigsh(A, 3, which='SA', tol=1e-10); assert np.allclose(np.sort(v), [1., 2., 3.]), v"
      - python -c "import numpy as np, scipy.sparse as sp, primme; A=sp.diags(np.arange(1., 101.)); v,_=primme.eigsh(A, 3, which='LA', tol=1e-10); assert np.allclose(np.sort(v), [98., 99., 100.]), v"
      # Complex Hermitian input reaches the z* LAPACK entry points, a different set
      # of symbols from the real d* ones above, checked against a dense reference.
      - python -c "import numpy as np, scipy.sparse as sp, primme; n=64; A=sp.diags(np.arange(1., n+1.)).astype(complex)+sp.diags([0.5j*np.ones(n-1)], [1])+sp.diags([-0.5j*np.ones(n-1)], [-1]); v,_=primme.eigsh(A.tocsr(), 2, which='SA', tol=1e-10); assert np.allclose(np.sort(v), np.sort(np.linalg.eigvalsh(A.toarray()))[:2], atol=1e-7), v"
      # svds is the package's other half and reaches PRIMME's separate SVDS code.
      - python -c "import numpy as np, scipy.sparse as sp, primme; A=sp.diags(np.arange(1., 51.)); s=primme.svds(A, 3, which='LM', tol=1e-10)[1]; assert np.allclose(np.sort(s), [48., 49., 50.]), s"
      # Matrix-free operation through a LinearOperator, which is how downstream
      # callers such as fulqrum drive PRIMME. Only eigsh is covered: svds on a
      # LinearOperator is broken upstream, raising PrimmeSvdsError -141 out of a
      # "got differing extents in dimension 0" ValueError in the matvec wrapper.
      - python -c "import numpy as np, scipy.sparse as sp, primme; from scipy.sparse.linalg import aslinearoperator; A=sp.diags(np.arange(1., 101.)); v,_=primme.eigsh(aslinearoperator(A), 3, which='LA', tol=1e-10, v0=np.ones((100, 3))); assert np.allclose(np.sort(v), [98., 99., 100.]), v"
      # The error types are public API; callers catch them by name.
      - python -c "import primme; assert issubclass(primme.PrimmeError, Exception) and issubclass(primme.PrimmeSvdsError, Exception)"
    requirements:
      run:
        - numpy
        - scipy

about:
  homepage: https://www.cs.wm.edu/~andreas/software
  summary: PRIMME wrapper for Python, for iterative eigenvalue and singular value problems
  description: |
    PRIMME (PReconditioned Iterative MultiMethod Eigensolver) finds a small number
    of eigenvalues and eigenvectors of a large, sparse, real symmetric or complex
    Hermitian matrix, and singular values and vectors of a large, sparse matrix. It
    can target the largest, smallest or interior parts of the spectrum, and accepts
    a preconditioner to accelerate convergence.

    This package provides the Python interface, whose primme.eigsh and primme.svds
    follow the calling conventions of their scipy.sparse.linalg counterparts.
    Matrices may be supplied as dense arrays, as SciPy sparse matrices, or
    matrix-free as a scipy.sparse.linalg.LinearOperator.

    The PRIMME C library is compiled into the extension module from sources bundled
    in the sdist, so there is no separate shared library to install.
  # BSD-3-Clause rather than a conjunctive expression, although COPYING.txt quotes
  # four notices. Only two cover code this package ships, and both are
  # BSD-3-Clause: PRIMME's own (College of William & Mary) and the NumPy Developers
  # notice covering the Python interface. The other two, SPARSKIT (LGPL-2.1-or-later)
  # and ComplexSPARSKIT (LGPL-3.0-or-later), are introduced by COPYING.txt as "Work
  # under tests", and that tests/ directory is not in the PyPI sdist -- MANIFEST.in
  # ships only src and primme.c, and nothing under src/, primme.pyx or primme.c
  # references SPARSKIT. Naming the LGPL would assert terms for code absent from
  # the package.
  license: BSD-3-Clause
  license_file: COPYING.txt
  documentation: https://www.cs.wm.edu/~andreas/software/doc/readme.html
  repository: https://github.com/primme/primme

extra:
  recipe-maintainers:
    - garrison
