# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: motorbridge-smart-servo
  version: "0.0.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/motorbridge_smart_servo-${{ version }}.tar.gz
    sha256: fb65f3f6e765e6b1915071c255caaf112fad3796fa1761aeee0132d15b8a0989
  - url: https://raw.githubusercontent.com/motorbridge/motorbridge/v0.5.6/LICENSE
    sha256: 9b0f2103caa4190c598c25a7effed4c62464cbc15e5efcf397d2ac21897f327c
    file_name: LICENSE

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  python:
    entry_points:
      - motorbridge-smart-servo = motorbridge_smart_servo.cli:main

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - maturin >=1.7,<2
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
  host:
    - python
    - maturin >=1.7,<2
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - motorbridge_smart_servo
      pip_check: true
  - script:
      - motorbridge-smart-servo --help

about:
  summary: PyO3 bindings for MotorBridge Smart Servo
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/motorbridge/motorbridge-smart-servo
  repository: https://github.com/motorbridge/motorbridge-smart-servo

extra:
  recipe-maintainers:
    - flferretti
