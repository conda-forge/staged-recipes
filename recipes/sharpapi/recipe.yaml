schema_version: 1

context:
  version: "0.4.1"

package:
  name: sharpapi
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/sharpapi/sharpapi-${{ version }}.tar.gz
  sha256: 988a044ae737a7d607bea038c3a7a0ebd28aa91352cb8e988187aca10373abae

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.25.0
    - pydantic >=2.0.0

tests:
  - python:
      imports:
        - sharpapi
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://sharpapi.io
  license: MIT
  license_file: LICENSE
  summary: Official Python SDK for the SharpAPI real-time sports betting odds API
  description: |
    Python client for the SharpAPI sports betting odds API. It provides synchronous and
    asynchronous clients, an SSE streaming client for real-time data, and pydantic models
    for the odds, +EV and arbitrage responses.
  documentation: https://docs.sharpapi.io/sdks/python

extra:
  recipe-maintainers:
    - sharpapi-io
