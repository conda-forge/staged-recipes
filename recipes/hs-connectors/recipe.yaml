schema_version: 1

context:
  version: "0.8.0"

package:
  name: hs-connectors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hs-connectors/hs_connectors-${{ version }}.tar.gz
  sha256: 07fcb1b6d0ea2014f9c7f12cffcd67338954d0552a44a2dfb54a833c37722c5e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=82.0.1
    - setuptools-git-versioning >=2.0,<3
    - packaging
    - pip
  run:
    - python >=${{ python_min }}
    - safetensors
    - pytorch
    - __unix  # Needs fnctl

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - '*'
      imports:
        - hs_connectors

about:
  summary: Pluggable backends for transferring hidden states between vLLM and Speculators during online and offline training.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/hs-connectors/
  repository: https://github.com/vllm-project/speculators/tree/main/hs_connectors

extra:
  recipe-maintainers:
    - xhochy
