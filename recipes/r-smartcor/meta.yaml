{% set version = '1.0.1' %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-smartcor
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/smartcor_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/smartcor/smartcor_{{ version }}.tar.gz
  sha256: e3faab1d28c6696b51076d50d759b6f5532637e93f924036a85f6b45c4197d4d

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-cli >=3.0.0
    - r-generics
    - r-ggplot2 >=3.4.0
    - r-mvtnorm
    - r-polycor
    - r-rlang >=1.0.0
    - r-tibble
    - r-withr
  run:
    - r-base
    - r-cli >=3.0.0
    - r-generics
    - r-ggplot2 >=3.4.0
    - r-mvtnorm
    - r-polycor
    - r-rlang >=1.0.0
    - r-tibble
    - r-withr

test:
  commands:
    - $R -e "library('smartcor')"           # [not win]
    - "\"%R%\" -e \"library('smartcor')\""  # [win]

about:
  home: https://harshvardhaniimi.github.io/smartcor/, https://github.com/harshvardhaniimi/smartcor
  license: GPL-3.0-only
  summary: Detects variable types (continuous, count, binary, ordinal, categorical) and selects
    the appropriate correlation method for each pair. Supports Pearson, Spearman, Kendall's
    tau, point-biserial, rank-biserial, phi, tetrachoric, polychoric, polyserial, Cramer's
    V, Tschuprow's T, Theil's U, Yule's Q, and Goodman-Kruskal's gamma, each with a
    confidence interval and p-value. Explains the selection rationale in the output,
    follows tidy data principles, and works in both interactive and scripted workflows.
    The methodology is described in Harshvardhan and Ranjan (2026) <doi:10.48550/arXiv.2607.22285>.
  license_family: GPL3
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  recipe-maintainers:
    - conda-forge/r
    - mschilli87

