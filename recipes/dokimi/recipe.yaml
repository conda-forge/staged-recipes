context:
  version: "0.1.0"

package:
  name: dokimi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dokimi/dokimi-${{ version }}.tar.gz
  sha256: 4c99e8c8ca78c9bce988d18953ce1ff87d5a0c4faf8b5ff888e794336dbe985e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dokimi = dokimi.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - pyyaml >=6.0.1,<7
    - jsonschema >=4.20,<5
    - litellm >=1.105.0
    - httpx >=0.27.0
    - numpy >=1.24.0
    - scipy >=1.11.0
    - pygithub >=2.1.0
    - datasets >=2.20,<6
    - openai >=1.51,<3

tests:
  - python:
      imports:
        - dokimi
        - dokimi.cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - dokimi --version
      - dokimi --help

about:
  homepage: https://github.com/intel/dokimi
  summary: Measures whether a skill, MCP doc source, documentation set or agent profile actually improves AI-agent answers and task outcomes
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://intel.github.io/dokimi/
  repository: https://github.com/intel/dokimi

extra:
  recipe-maintainers:
    - vchamarthi
