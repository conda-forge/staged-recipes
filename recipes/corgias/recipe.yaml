schema_version: 1

context:
  name: corgias
  version: "0.1.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f0f9f1dcc51815547c6d8077bfbd76815bcd903bdaf4685c3c81b7c41efcc236

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - corgias = corgias.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }},<3.13
    - ete3
    - polars >=1.26.0
    - scipy >=1.7.0
    - statsmodels >=0.14.4
    - tqdm >=4.0.0

tests:
  - python:
      imports:
        - corgias
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - corgias --help

about:
  summary: Phylogenetic profiling tool for identifying co- and anti-correlated orthologs in large-scale prokaryotic genome datasets
  description: |
    The `corgias asr` subcommand requires pastml, which is not available on
    conda-forge. Install it separately with: pip install pastml
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/ynishimuraLv/corgias
  repository: https://github.com/ynishimuraLv/corgias
  documentation: https://github.com/ynishimuraLv/corgias

extra:
  recipe-maintainers:
    - ynishimuraLv
