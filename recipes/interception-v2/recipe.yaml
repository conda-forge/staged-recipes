schema_version: 1
package:
  name: interception-v2
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Interception-V2/language-sdks-v1.0.0/interception-v2-sdk-source-1.0.0.zip
  sha256: 61a062ecad9650103db2f3a74fad1e739640edf530a7c5c00b6102badb4927f2
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - interception_v2
    pip_check: true
- script:
  - python -m pip check
  - python -c "from interception_v2 import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/Interception-V2
  summary: Windows x64 Interception-V2 Python SDK with source-built native bridge
  license: LGPL-3.0-or-later
  license_file:
  - Interception-V2-C-ffi/LICENSE
  - Interception-V2-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
