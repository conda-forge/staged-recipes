schema_version: 1

context:
  name: systemd-timers-pydantic
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/systemd-timers-pydantic/systemd_timers_pydantic-${{ version }}.tar.gz
  sha256: a244536ce607a274e130f47a18376fa43f2f9f12774e0783e42ac59b7777c624

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - systemd-pydantic

tests:
  - python:
      imports:
        - systemd_timers_pydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/airflow-laminar/systemd-timers-pydantic
  summary: Pydantic models for systemd-timers
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://airflow-laminar.github.io/systemd-timers-pydantic/
  repository: https://github.com/airflow-laminar/systemd-timers-pydantic

extra:
  recipe-maintainers:
    - timkpaine
