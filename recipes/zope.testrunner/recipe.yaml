schema_version: 1

context:
  version: "8.4"

package:
  name: zope.testrunner
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.testrunner/zope_testrunner-${{ version }}.tar.gz
  sha256: 42f5b99dd2e2f62f0993e7f28e689fa8be4f036a989e0fbfc3b3c8af2820d2ea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - zope-testrunner = zope.testrunner:run

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - zope.exceptions
    - zope.interface

tests:
  - python:
      imports:
        - zope.testrunner
        - zope.testrunner.runner
        - zope.testrunner.options
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - zope-testrunner --help
      - zope-testrunner --auto-path -vc -s zope.testrunner
    requirements:
      run:
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.testrunner
  repository: https://github.com/zopefoundation/zope.testrunner
  documentation: https://zopetestrunner.readthedocs.io
  summary: Zope testrunner script
  license: ZPL-2.1
  license_file:
    - LICENSE.md
    - COPYRIGHT.rst

extra:
  recipe-maintainers:
    - killua156
