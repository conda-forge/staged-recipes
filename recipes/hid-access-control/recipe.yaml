schema_version: 1
package:
  name: hid-access-control
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/HID-Access-Control/language-sdks-v1.0.0/hid-access-control-sdk-source-1.0.0.zip
  sha256: 680be671c8dd164629ff8e2d5948aa05e627894565cccccb11122c46cffe3edc
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - hid_access_control
    pip_check: true
- script:
  - python -m pip check
  - python -c "from hid_access_control import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/HID-Access-Control
  summary: Windows x64 HID-Access-Control Python SDK with source-built native bridge
  license: MIT
  license_file:
  - HID-Access-Control-C-ffi/LICENSE
  - HID-Access-Control-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
