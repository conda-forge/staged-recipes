schema_version: 1

context:
  name: nomad-pydantic
  version: "0.2.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nomad-pydantic/nomad_pydantic-${{ version }}.tar.gz
  sha256: d65016b2deffd78bd0ff3062ce680b4bc6d4ed16fec77762e8ee2e2654821225

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - hydra-core >=1.3,<2
    - pydantic >=2,<3

tests:
  - python:
      imports:
        - nomad_pydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/airflow-laminar/nomad-pydantic
  summary: Pydantic models for nomad
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://airflow-laminar.github.io/nomad-pydantic/
  repository: https://github.com/airflow-laminar/nomad-pydantic

extra:
  recipe-maintainers:
    - timkpaine
