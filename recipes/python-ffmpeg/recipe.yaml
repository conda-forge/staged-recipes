schema_version: 1

context:
  version: "2.0.12"

package:
  name: python_ffmpeg
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/python-ffmpeg/python_ffmpeg-${{ version }}.tar.gz
  sha256: 19ac80af5a064a2f53c245af1a909b2d7648ea045500d96d3bcd507b88d43dc7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pyee
    - typing_extensions

tests:
  - python:
      imports:
        - ffmpeg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*

about:
  summary: A python binding for FFmpeg which provides sync and async APIs
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jonghwanhyeon/python-ffmpeg

extra:
  recipe-maintainers:
    - ReimarBauer
