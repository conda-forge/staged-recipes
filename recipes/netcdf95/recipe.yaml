context:
  version: "0.16"

package:
  name: netcdf95
  version: ${{ version }}

source:
  url: https://github.com/lguez/NetCDF95/archive/refs/tags/v${{ version }}.zip
  sha256: 409f6b124ff67bf265cc250db64e59bf185ce80abf1ec1cb48b2397a319c223c

build:
  skip:
    - win
  number: 0

requirements:
  build:
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
    - jumble
    - pkg-config
  run_exports:
    - ${{ pin_subpackage("netcdf95", upper_bound="x.x.x") }}
  host:
    - libnetcdf
    - netcdf-fortran

tests:
  - package_contents:
      lib:
        - netcdf95
      include:
        - netcdf95.mod

  # Check compatibility with gfortran 13.
  - script: consumer.sh
    files:
      source:
        - Tests/test_netcdf95.f90
        - Tests/plouf.nc
    requirements:
      build:
        - gfortran_${{ target_platform }} 13.*

  # Check forward compatibility with gfortran 15.
  - script: consumer.sh
    files:
      source:
        - Tests/test_netcdf95.f90
        - Tests/plouf.nc
    requirements:
      build:
        - gfortran_${{ target_platform }} 15.*

about:
  homepage: https://github.com/lguez/NetCDF95
  summary: "Alternate Fortran interface to the NetCDF library"
  description: |
    NetCDF95 is an alternative Fortran interface to the NetCDF
    library, meant to be friendlier and more secure. It also fills
    gaps in the official Fortran 90 interface.
  license: GPL-3.0-only
  license_file:
    - LICENSE
  documentation: https://lguez.github.io/NetCDF95

extra:
  recipe-maintainers:
    - lguez
