package:
  name: chromite
  version: 1.0.0

source:
  url: https://pypi.io/packages/source/c/chromite/chromite-0.6.3.tar.gz
  sha256: 717ac5cbfe293c3459ccae473ffdee45df6936601a400ae1ecd5a82960b04d17

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - python >=3.10
    - pip
  run:
    - python >=3.10

test:
  imports:
    - Chromite

about:
  home: https://github.com/NastyaNoTamashii/Chromite
  license: MIT
  license_family: MIT
  summary: Chromite is a framework for text and ASCI formatting in Python.
  description: |
    Chromite provides powerful tools for text and ASCI formatting in Python.
    It's designed to simplify the creation of beautifully formatted console output.
  doc_url: https://github.com/NastyaNoTamashii/Chromite/blob/main/README.md
  dev_url: https://github.com/NastyaNoTamashii/Chromite

extra:
  recipe-maintainers:
    - NastyaNoTamashii