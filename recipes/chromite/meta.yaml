package:
  name: chromite
  version: 1.0.0

source:
  url: https://files.pythonhosted.org/packages/source/c/chromite/chromite-0.6.3.tar.gz
  sha256: 717ac5cbfe293c3459ccae473ffdee45df6936601a400ae1ecd5a82960b04d17

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}

test:
  imports:
    - Chromite
  requires:
    - python {{ python_min }}

about:
  home: https://github.com/NastyaNoTamashii/Chromite
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Chromite is a framework for text and ASCI formatting in Python.
  description: |
    Chromite is a powerful Python framework for text and ASCI formatting.
    It provides tools to easily create beautifully formatted console output
    with colors, styles, and ASCII art support.
  doc_url: https://github.com/NastyaNoTamashii/Chromite/blob/main/README.md
  dev_url: https://github.com/NastyaNoTamashii/Chromite

extra:
  recipe-maintainers:
    - NastyaNoTamashii
