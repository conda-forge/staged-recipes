context:
  name: disp-xr
  version: "0.5.1"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/disp_xr-${{ version }}.tar.gz
  sha256: d0bfe5a8ff1af02d1c0a2a64066fe8afce688725c0201a367ad66ab820e24c7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - disp_xr = disp_xr.cli:cli_app

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}
    - click >=7.0
    - dask-core
    - donfig >=0.8
    - flox
    - fsspec
    - h5netcdf
    - h5py
    - netcdf4
    - numbagg
    - numpy
    - packaging
    - pandas
    - pydantic >=2.4
    - pyproj
    - pyyaml
    - rasterio
    - rioxarray >=0.23
    - scipy
    - threadpoolctl
    - xarray
    - zarr >=3.1.6

tests:
  - python:
      imports:
        - disp_xr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - disp_xr --help

about:
  homepage: https://github.com/mgovorcin/disp-xr
  documentation: https://mgovorcin.github.io/disp-xr/
  repository: https://github.com/mgovorcin/disp-xr
  summary: Xarray tools for OPERA surface displacement (DISP) products
  description: |
    Open, chain, mask, re-reference and fit OPERA DISP-S1 (and DISP-NISAR)
    displacement time series as lazy xarray datasets; downsample, compare
    with GNSS, and export to Zarr, NetCDF and GeoTIFF.
  license: BSD-3-Clause AND Apache-2.0
  license_file:
    - LICENSE
    - LICENSES/opera-utils-BSD-3-Clause.txt
    - LICENSES/geepers-Apache-2.0.txt
    - LICENSES/geepers-NOTICE.txt

extra:
  recipe-maintainers:
    - mgovorcin
