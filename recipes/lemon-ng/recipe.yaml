context:
  name: lemon-ng
  version: "1.4.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/dmeoli/lemon-ng/archive/${{ version }}.tar.gz
  sha256: 60aeaf56b6bc32b97a34fccf1efb49de98c765b1b21865544ec686ddeeff5b2d

build:
  number: 0

requirements:
  run_exports:
    - ${{ pin_subpackage(name, upper_bound="x.x") }}
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja

tests:
  - package_contents:
      include:
        - lemon/list_graph.h
        - lemon/network_simplex.h
        - lemon/config.h
  - files:
      source:
        - test/install/
    requirements:
      run:
        - ${{ compiler("cxx") }}
        - cmake
        - ninja
    script:
      - cmake -S test/install -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build build
      - if: unix
        then: ./build/install_test
        else: build\install_test.exe

about:
  homepage: https://github.com/dmeoli/lemon-ng
  repository: https://github.com/dmeoli/lemon-ng
  documentation: https://dmeoli.github.io/lemon-ng/
  license: BSL-1.0 AND BSD-3-Clause
  license_file:
    - LICENSE
    - lemon/random.h
  summary: A maintained fork of LEMON, a C++ library of graphs and of network optimization
  description: |
    lemon-ng is a maintained fork of LEMON, the Library for Efficient
    Modeling and Optimization in Networks: a C++ template library of graphs,
    maps and heaps and of the algorithms of network optimization built on
    them (shortest paths, maximum and minimum cost flows, matchings,
    connectivity, cuts and cycles). It keeps the headers and the namespace of
    LEMON, compiles from C++11 to C++23, and fixes the defects of LEMON 1.3.1.

extra:
  recipe-maintainers:
    - dmeoli
