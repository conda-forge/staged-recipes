context:
  version: "0.9.10"

package:
  name: pyprms
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyprms/pyprms-${{ version }}.tar.gz
  sha256: 8559e47436db01553c3e13fb52fa18237993e30c5ef5ccf1ab32faca2f29ca19

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - cartopy
    - dask
    - fsspec
    - geopandas
    - matplotlib-base
    - netcdf4 !=1.7.4
    - networkx >=2
    - numpy
    - pandas
    - pyproj
    - rich
    - shapely
    # the sphinx packages are runtime requirements of the upstream
    # metadata (enforced by pip_check below), not only doc-build deps
    - sphinx
    - sphinx-autodoc-typehints
    - sphinx-book-theme
    - xarray
    - zarr <3

tests:
  - python:
      imports:
        - pyPRMS
      pip_check: true
      python_version:
       - ${{ python_min }}.*
       - "*"

about:
  homepage: https://github.com/DOI-USGS/pyPRMS
  repository: https://github.com/DOI-USGS/pyPRMS
  summary: Python library for the Precipitation-Runoff Modeling System (PRMS)
  license: CC0-1.0
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - jmccreight
    - pnorton-usgs
