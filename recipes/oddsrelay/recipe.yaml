context:
  version: "0.1.1"

package:
  name: oddsrelay
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oddsrelay/oddsrelay-${{ version }}.tar.gz
  sha256: 1fc3f0b7de6710525f74b555e1bdec26f6c29e405151113b733eae50dd216a36

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.12,<4
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - oddsrelay
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://oddsrelay.io
  summary: Python client for the OddsRelay odds API, UK and Irish bookmaker and exchange odds
  description: |
    The Python client for the OddsRelay odds API. It returns bookmaker and exchange odds for the UK
    and Ireland as JSON, uses the standard library only, and needs an OddsRelay API key.
  license: MIT
  license_file: LICENSE
  documentation: https://oddsrelay.io/docs
  repository: https://github.com/oddsrelay/oddsrelay-python

extra:
  recipe-maintainers:
    - oddsrelay
