schema_version: 1

context:
  version: "18.7"

package:
  name: pest_hp
  version: ${{ version }}

source:
  - url: https://s3.amazonaws.com/docs.pesthomepage.org/source_code/linuxpest_hp_${{ version }}.zip
    sha256: 86514dec1db343eb81c66e283eb53b7e5f743006cc47658a8da0ba1016566521

build:
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler('fortran') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - unzip
    - gfortran
    - gcc

tests:
  - script:
      - test -f $PREFIX/bin/agent_hp
      - test -f $PREFIX/bin/cmaes_hp
      - test -f $PREFIX/bin/ensimod
      - test -f $PREFIX/bin/ensiprep
      - test -f $PREFIX/bin/jactest_hp
      - test -f $PREFIX/bin/pcost_hp
      - test -f $PREFIX/bin/pest_hp
      - test -f $PREFIX/bin/postensiunc
      - test -f $PREFIX/bin/pwhisp_hp
      - test -f $PREFIX/bin/rsi_hp

about:
  summary: PEST_HP automates calibration and calibration-constrained uncertainty analysis of any numerical model.
  description: |
    PEST_HP interacts with a model through the model’s own input and output
    files for Highly Parameterized (HP) models. While estimating or adjusting
    its parameters, it runs a model many times. These model runs can be
    conducted either in serial or in parallel. Advanced dimensional-reduction
    methods can dramatically reduce the number of model runs required for
    attainment of a high level of model-to-measurement fit.
  license: LicenseRef-DISCLAIMER
  license_file: LICENSE.txt
  homepage: https://pesthomepage.org/
  documentation: https://s3.amazonaws.com/docs.pesthomepage.org/documents/all_manuals.zip

extra:
  recipe-maintainers:
    - timcera
