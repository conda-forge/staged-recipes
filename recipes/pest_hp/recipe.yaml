schema_version: 1

context:
  version: "18.7"

package:
  name: pest_hp
  version: ${{ version }}

source:
  - if: unix
    then:
      url: https://s3.amazonaws.com/docs.pesthomepage.org/source_code/unixpest_hp${{ version }}.zip
      sha256: e84c3edb49116cd397b8da1bf495943d49acfe2d51ced5102fdcccfee74cb2cb
  - if: win
    then:
      url: https://s3.amazonaws.com/docs.pesthomepage.org/software/hp_suite${{ version }}.zip
      sha256: 6c165a5aeb8ef7463c7240de442bf01915bf1ba5a15a71343990cf59aeb26849

build:
  number: 0

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler('fortran') }}
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - make
        - unzip
        - gfortran
        - gcc

tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/bin/agent_hp
          - test -f $PREFIX/bin/cmaes_hp
          - test -f $PREFIX/bin/ensimod
          - test -f $PREFIX/bin/ensiprep
          - test -f $PREFIX/bin/jactest_hp
          - test -f $PREFIX/bin/pcost_hp
          - test -f $PREFIX/bin/pest_hp
          - test -f $PREFIX/bin/postensiunc
          - test -f $PREFIX/bin/pwhisp_hp
          - test -f $PREFIX/bin/rsi_hp
      - if: win
        then:
          - if not exist %PREFIX%\bin\agent_hp.exe exit 1
          - if not exist %PREFIX%\bin\cmaes_hp.exe exit 1
          - if not exist %PREFIX%\bin\ensimod.exe exit 1
          - if not exist %PREFIX%\bin\ensiprep.exe exit 1
          - if not exist %PREFIX%\bin\jactest_hp.exe exit 1
          - if not exist %PREFIX%\bin\pcost_hp.exe exit 1
          - if not exist %PREFIX%\bin\pest_hp.exe exit 1
          - if not exist %PREFIX%\bin\postensiunc.exe exit 1
          - if not exist %PREFIX%\bin\pwhisp_hp.exe exit 1
          - if not exist %PREFIX%\bin\rsi_hp.exe exit 1

about:
  summary: PEST_HP automates calibration and calibration-constrained uncertainty analysis of any numerical model.
  description: |
    PEST_HP interacts with a model through the model’s own input and output
    files for Highly Parameterized (HP) models. While estimating or adjusting
    its parameters, it runs a model many times. These model runs can be
    conducted either in serial or in parallel. Advanced dimensional-reduction
    methods can dramatically reduce the number of model runs required for
    attainment of a high level of model-to-measurement fit.
  license: LicenseRef-DISCLAIMER
  license_file: LICENSE.txt
  homepage: https://pesthomepage.org/
  documentation: https://s3.amazonaws.com/docs.pesthomepage.org/documents/all_manuals.zip

extra:
  recipe-maintainers:
    - timcera
