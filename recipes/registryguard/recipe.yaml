schema_version: 1
package:
  name: registryguard
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/RegistryGuard/language-sdks-v1.0.0/registryguard-sdk-source-1.0.0.zip
  sha256: b10ae9c095487de4b4a0f5d6ca3076e929d9bfb75b6e08dc360bac962c74ebb5
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - registryguard
    pip_check: true
- script:
  - python -m pip check
  - python -c "from registryguard import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/RegistryGuard
  summary: Windows x64 RegistryGuard Python SDK with source-built native bridge
  license: MIT
  license_file:
  - RegistryGuard-C-ffi/LICENSE
  - RegistryGuard-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
