schema_version: 1

context:
  version: "6.0"
  test_modules:
    - zope.site.tests.test_bwc
    - zope.site.tests.test_configure
    - zope.site.tests.test_folder
    - zope.site.tests.test_localsitemanager
    - zope.site.tests.test_registration
    - zope.site.tests.test_site
    - zope.site.tests.test_sitemanagercontainer

package:
  name: zope.site
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.site/zope_site-${{ version }}.tar.gz
  sha256: d8139a3ad0f3e51732082dc98db8de29c834a6594126e63f25be6ea2ebc4064b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.annotation
    - zope.container
    - zope.deprecation
    - zope.security
    - zope.component >=4.5.0
    - zope.event
    - zope.interface >=4.5.0
    - zope.lifecycleevent
    - zope.location

tests:
  - python:
      imports:
        - zope.site
        - zope.site.folder
        - zope.site.hooks
        - zope.site.site
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest -v ${{ test_modules | join(" ") }}
    requirements:
      run:
        - zodb
        - zope.configuration
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.site
  repository: https://github.com/zopefoundation/zope.site
  documentation: https://zopesite.readthedocs.io
  summary: Local registries for zope component architecture
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
