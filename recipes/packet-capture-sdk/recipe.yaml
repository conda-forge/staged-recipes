schema_version: 1
package:
  name: packet-capture-sdk
  version: 1.0.0
source:
  url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/Packet-Capture-SDK/language-sdks-v1.0.0/packet-capture-sdk-sdk-source-1.0.0.zip
  sha256: c75db08a86aa68a9a36daf93da9f555eb683b2143ebcecc0ccbf582ceaa1f007
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - packet_capture_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from packet_capture_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Packet-Capture-SDK
  summary: Windows x64 Packet-Capture-SDK Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Packet-Capture-SDK-C-ffi/LICENSE
  - Packet-Capture-SDK-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
