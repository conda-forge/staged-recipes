context:
  version: "2.0.3"

package:
  name: libayatana-appindicator-glib
  version: ${{ version }}

source:
  url: https://github.com/AyatanaIndicators/libayatana-appindicator-glib/archive/${{ version }}.tar.gz
  sha256: 20292209616b34674e391fdbd6dfd23dfcee3ba9e04f67f30faac29bf4c2d3a4

build:
  number: 0
  # StatusNotifierItem is a DBus/freedesktop protocol; upstream only targets Linux.
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - pkg-config
    # g-ir-scanner, vapigen and gi-docgen run on the build machine.
    - gobject-introspection
    - vala
    - gi-docgen
  host:
    - glib
    # gio-2.0.pc lists zlib as a Requires, so pkg-config needs it present.
    - zlib
    - gobject-introspection
    - vala
  # zlib is only there to satisfy pkg-config; nothing here links against it.
  ignore_run_exports:
    from_package:
      - zlib

tests:
  - package_contents:
      include:
        - libayatana-appindicator-glib/ayatana-appindicator.h
        - libayatana-appindicator-glib/ayatana-appindicator-enum-types.h
      lib:
        - ayatana-appindicator-glib
      files:
        - lib/pkgconfig/ayatana-appindicator-glib.pc
        - share/gir-1.0/AyatanaAppIndicatorGlib-2.0.gir
        - lib/girepository-1.0/AyatanaAppIndicatorGlib-2.0.typelib
        - share/vala/vapi/ayatana-appindicator-glib.vapi
        - share/vala/vapi/ayatana-appindicator-glib.deps

  - script:
      - pkg-config --exists --print-errors ayatana-appindicator-glib
      - test "$(pkg-config --modversion ayatana-appindicator-glib)" = "${{ version }}"
    requirements:
      run:
        - pkg-config
        # transitively required by gio-2.0.pc
        - zlib

about:
  homepage: https://github.com/AyatanaIndicators/libayatana-appindicator-glib
  summary: GLib-only library for exporting application indicators over StatusNotifierItem
  description: |
    libayatana-appindicator-glib allows applications to
    export a menu and an icon into an indicator/tray area of a desktop shell,
    using the freedesktop.org StatusNotifierItem DBus protocol.

    Unlike libayatana-appindicator,
    this variant depends only on GLib/GIO
    and pulls in no GTK or libdbusmenu dependency,
    so the toolkit-specific rendering is left entirely to the consuming application.
  license: GPL-3.0-only
  license_file: COPYING
  repository: https://github.com/AyatanaIndicators/libayatana-appindicator-glib

extra:
  recipe-maintainers:
    - maurosilber
