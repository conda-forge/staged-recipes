schema_version: 1

context:
  version: "6.0"

package:
  name: zope.i18n
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.i18n/zope_i18n-${{ version }}.tar.gz
  sha256: 93bd26a20c931cd5ac14c5f36fc3f62e4a98b37bb7ac7cc5e646cba34dac7dc8
  patches:
    # compile .po files with msgfmt from gettext-tools instead of the
    # unmaintained python-gettext, as Debian does
    # https://github.com/zopefoundation/zope.i18n/issues/16
    - use-msgfmt.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - gettext-tools
    - pytz
    - zope.deprecation
    - zope.schema
    - zope.i18nmessageid >=4.3
    - zope.component

tests:
  - python:
      imports:
        - zope.i18n
        - zope.i18n.compile
        - zope.i18n.translationdomain
        - zope.i18n.locales
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # test_imessagecatalog and locales test_xmlfactory only hold abstract base
      # cases that zope.testrunner builds via test_suite(), so they are left out
      - python -m unittest -v zope.i18n.locales.tests.test_docstrings zope.i18n.locales.tests.test_fallbackcollator zope.i18n.locales.tests.test_locales zope.i18n.tests.test zope.i18n.tests.test_compile zope.i18n.tests.test_formats zope.i18n.tests.test_gettextmessagecatalog zope.i18n.tests.test_itranslationdomain zope.i18n.tests.test_negotiator zope.i18n.tests.test_plurals zope.i18n.tests.test_simpletranslationdomain zope.i18n.tests.test_testmessagecatalog zope.i18n.tests.test_translationdomain zope.i18n.tests.test_zcml zope.i18n.tests.testi18nawareobject
    requirements:
      run:
        - zope.configuration
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.i18n
  repository: https://github.com/zopefoundation/zope.i18n
  documentation: https://zopei18n.readthedocs.io
  summary: Zope Internationalization Support
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
