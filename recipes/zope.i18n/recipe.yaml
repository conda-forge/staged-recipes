schema_version: 1

context:
  version: "6.0"

package:
  name: zope.i18n
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.i18n/zope_i18n-${{ version }}.tar.gz
  sha256: 93bd26a20c931cd5ac14c5f36fc3f62e4a98b37bb7ac7cc5e646cba34dac7dc8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ==78.1.1
  run:
    - python >=${{ python_min }}
    - setuptools
    - python-gettext
    - pytz
    - zope.deprecation
    - zope.schema
    - zope.i18nmessageid >=4.3
    - zope.component

tests:
  - python:
      imports:
        - zope.i18n
        - zope.i18n.translationdomain
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.i18n
  repository: https://github.com/zopefoundation/zope.i18n
  summary: Zope Internationalization Support
  license: ZPL-2.1
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - killua156
