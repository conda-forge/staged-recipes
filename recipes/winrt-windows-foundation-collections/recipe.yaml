context:
  version: "4!10.0.28000.2957"

package:
  name: winrt-windows-foundation-collections
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/winrt-windows-foundation-collections/winrt_windows_foundation_collections-${{ version }}.tar.gz
  sha256: 38989873bbdace2346d24168ceb66359800b7429128ea2ef1a36da55b255af1e

build:
  number: 0
  # Pure-Python projection, but it only works on Windows (it needs winrt-runtime).
  skip:
    - not win
    - match(python, "<3.11")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling
    - winrt-table-compiler >=4,<5
  run:
    - python
    - winrt-runtime >=4.0.0,<5
    - winrt-windows-foundation >=${{ version }}

tests:
  - python:
      imports:
        - winrt.windows.foundation.collections
      pip_check: true

about:
  summary: PyWinRT projection of the Windows.Foundation.Collections namespace
  homepage: https://github.com/pywinrt/pywinrt
  repository: https://github.com/pywinrt/pywinrt
  documentation: https://pywinrt.readthedocs.io
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
