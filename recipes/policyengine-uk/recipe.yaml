context:
  version: "2.179.1"
  python_min: "3.11"

package:
  name: policyengine-uk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/policyengine-uk/policyengine_uk-${{ version }}.tar.gz
  sha256: 9da7f9df2947a5309c34bc51b5b0750bbedd0d7fde647fc6df3b31837bc5bb4e

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - microdf-python >=1.2.1
    - policyengine-core >=3.34.9
    - pydantic >=2.11.7
    - pytables >=3.10.2

tests:
  - python:
      imports:
        - policyengine_uk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PolicyEngine/policyengine-uk
  summary: PolicyEngine tax-benefit model for the United Kingdom
  license: AGPL-3.0-only
  license_file: LICENSE
  repository: https://github.com/PolicyEngine/policyengine-uk

extra:
  recipe-maintainers:
    - MementoRC
