# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.001"
  sans_commit: 7925f50f649b3813257faf2f4c0b381011f434f1
  mono_commit: 154d50362016cc3e873eb21d242cd0772384c8f9

package:
  name: font-ttf-atkinson-hyperlegible-next
  version: ${{ version }}

source:
  - target_directory: atkinson-hyperlegible-next
    url: https://github.com/googlefonts/atkinson-hyperlegible-next/archive/${{ sans_commit }}.tar.gz
    sha256: 4b455dcf5ce2d6261df7caf6f4d035c893b446f14269106a07bc03c204368626
  - target_directory: atkinson-hyperlegible-next-mono
    url: https://github.com/googlefonts/atkinson-hyperlegible-next-mono/archive/${{ mono_commit }}.tar.gz
    sha256: d8b50ca876781ef6c2f0e1dd1a7ed6896a7f7769242e76be901b98c6d7edfafb

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p "${PREFIX}/fonts"
    - cd "${SRC_DIR}/atkinson-hyperlegible-next/fonts"
    - cp ttf/*.ttf variable/*.ttf "${PREFIX}/fonts/"
    - cd "${SRC_DIR}/atkinson-hyperlegible-next-mono/fonts"
    - cp ttf/*.ttf variable/*.ttf "${PREFIX}/fonts/"

tests:
  - package_contents:
      strict: true
      files:
        - fonts/AtkinsonHyperlegibleMono-Bold.ttf
        - fonts/AtkinsonHyperlegibleMono-BoldItalic.ttf
        - fonts/AtkinsonHyperlegibleMono-ExtraBold.ttf
        - fonts/AtkinsonHyperlegibleMono-ExtraBoldItalic.ttf
        - fonts/AtkinsonHyperlegibleMono-ExtraLight.ttf
        - fonts/AtkinsonHyperlegibleMono-ExtraLightItalic.ttf
        - fonts/AtkinsonHyperlegibleMono-Italic.ttf
        - fonts/AtkinsonHyperlegibleMono-Italic[[]wght].ttf
        - fonts/AtkinsonHyperlegibleMono-Light.ttf
        - fonts/AtkinsonHyperlegibleMono-LightItalic.ttf
        - fonts/AtkinsonHyperlegibleMono-Medium.ttf
        - fonts/AtkinsonHyperlegibleMono-MediumItalic.ttf
        - fonts/AtkinsonHyperlegibleMono-Regular.ttf
        - fonts/AtkinsonHyperlegibleMono-SemiBold.ttf
        - fonts/AtkinsonHyperlegibleMono-SemiBoldItalic.ttf
        - fonts/AtkinsonHyperlegibleMono[[]wght].ttf
        - fonts/AtkinsonHyperlegibleNext-Bold.ttf
        - fonts/AtkinsonHyperlegibleNext-BoldItalic.ttf
        - fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf
        - fonts/AtkinsonHyperlegibleNext-ExtraBoldItalic.ttf
        - fonts/AtkinsonHyperlegibleNext-ExtraLight.ttf
        - fonts/AtkinsonHyperlegibleNext-ExtraLightItalic.ttf
        - fonts/AtkinsonHyperlegibleNext-Italic.ttf
        - fonts/AtkinsonHyperlegibleNext-Italic[[]wght].ttf
        - fonts/AtkinsonHyperlegibleNext-Light.ttf
        - fonts/AtkinsonHyperlegibleNext-LightItalic.ttf
        - fonts/AtkinsonHyperlegibleNext-Medium.ttf
        - fonts/AtkinsonHyperlegibleNext-MediumItalic.ttf
        - fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
        - fonts/AtkinsonHyperlegibleNext-SemiBoldItalic.ttf
        - fonts/AtkinsonHyperlegibleNext[[]wght].ttf

about:
  summary: New (2024) second version of the Atkinson Hyperlegible fonts (sans-serif and monospace)
  license: OFL-1.1
  license_file:
    - atkinson-hyperlegible-next/OFL.txt
    - atkinson-hyperlegible-next-mono/OFL.txt
  homepage: https://www.brailleinstitute.org/freefont
  repository: https://github.com/googlefonts/atkinson-hyperlegible-next

extra:
  recipe-maintainers:
    - bollwyvl
