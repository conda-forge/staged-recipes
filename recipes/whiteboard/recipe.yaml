schema_version: 1

context:
  name: whiteboard
  version: "0.1.3"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/devdotfast/whiteboard/releases/download/v${{ version }}/dev-fast-review-${{ version }}-1.x86_64.rpm
  sha256: dac3dc6668baa18215783c1d7551fac14bd3e693641eca20689df710e35d04b2
  file_name: whiteboard.rpm

build:
  number: 0
  skip:
    - not (linux and x86_64)
  dynamic_linking:
    # Repackaged upstream Electron build: leave the prebuilt binaries untouched.
    binary_relocation: false

requirements:
  build:
    - libarchive
  run:
    # Upstream's bundled native Node modules require glibc 2.38.
    - __glibc >=2.38
    - git

tests:
  - package_contents:
      bin:
        - review
        - review-desktop
      files:
        - share/whiteboard/review
        - share/whiteboard/resources/app/review-runtime/dist/cli.js
        - Menu/whiteboard.json

about:
  homepage: https://dev.fast
  repository: https://github.com/devdotfast/whiteboard
  summary: Open-source canvas for thoughtful software design
  description: |
    Whiteboard is a desktop app, built on a vendored Code - OSS fork, where
    coding agents such as Claude Code and Codex draw reviews, diagrams, and
    decision logs next to the code they describe. `review-desktop` starts the
    app and `review` is the command-line interface that agents use.
  license: MIT
  license_file:
    - usr/share/review/resources/app/LICENSE.txt
    - usr/share/review/resources/app/ThirdPartyNotices.txt
    - usr/share/review/resources/app/licenses/
    - usr/share/review/resources/app/review-runtime/LICENSE
    - usr/share/review/resources/app/review-runtime/THIRD_PARTY_NOTICES.md
    - usr/share/review/LICENSES.chromium.html

extra:
  recipe-maintainers:
    - jeongseok-meta
