context:
  name: physverify
  version: "0.6.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 201f9b9a0f81a30a2860bd625b994bfdaa060aeef999a1ef47d075708f22f972

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - physverify = physverify.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - tomli >=1.1

tests:
  - python:
      imports:
        - physverify
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - physverify --help

about:
  homepage: https://github.com/rcgiri-physics/physverify
  summary: Checks that a physics simulation solves the right equations at the right accuracy
  license: MIT
  license_file: LICENSE
  documentation: https://rcgiri-physics.github.io/physverify/
  repository: https://github.com/rcgiri-physics/physverify

extra:
  recipe-maintainers:
    - rcgiri-physics
