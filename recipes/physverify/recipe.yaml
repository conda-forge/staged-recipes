context:
  name: physverify
  version: "0.9.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: be94fe4138bd5f7c6b8007143c9f6cca38f9f3f731d4164635b006cf1a9ea690

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - physverify = physverify.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - tomli >=1.1

tests:
  - python:
      imports:
        - physverify
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - physverify --help

about:
  homepage: https://github.com/rcgiri-physics/physverify
  summary: Code verification for numerical simulation
  license: MIT
  license_file: LICENSE
  documentation: https://rcgiri-physics.github.io/physverify/
  repository: https://github.com/rcgiri-physics/physverify

extra:
  recipe-maintainers:
    - rcgiri-physics
