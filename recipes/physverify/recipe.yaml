context:
  name: physverify
  version: "0.5.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: bf626f2f3fe5ae249fccf238ce015553ac55f5ac5038759da7731975b23eab94

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - physverify = physverify.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.24

tests:
  - python:
      imports:
        - physverify
      python_version: ${{ python_min }}.*
  - script:
      - physverify --help

about:
  homepage: https://github.com/rcgiri-physics/physverify
  summary: Checks that a physics simulation solves the right equations at the right accuracy
  license: MIT
  license_file: LICENSE
  documentation: https://rcgiri-physics.github.io/physverify/
  repository: https://github.com/rcgiri-physics/physverify

extra:
  recipe-maintainers:
    - rcgiri-physics
