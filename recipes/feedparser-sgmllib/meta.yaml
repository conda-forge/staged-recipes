{% set version = "1.0.0" %}

package:
  name: feedparser-sgmllib
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/f/feedparser-sgmllib/feedparser_sgmllib-{{ version }}.tar.gz
  sha256: f73861ca2f6bb2798b2499fbab62d34bd27fd13379704a38ed616c67eb0a76a6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - feedparser_sgmllib
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/feedparser-sgmllib/
  summary: sgmllib from Python 2.7. For feedparser use only.
  doc_url: https://feedparser-sgmllib.readthedocs.io
  dev_url: https://github.com/python-syndication/feedparser-sgmllib
  license: PSF-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - step21
