schema_version: 1

context:
  version: "2.1.0"

package:
  name: feedparser-sgmllib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/feedparser-sgmllib/feedparser_sgmllib-${{ version }}.tar.gz
  sha256: 61facf2918c4389b5b00714f76c5e03431ffcd94cd1f51d657edd6cd7c396579

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - feedparser_sgmllib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: sgmllib from Python 2.7. For feedparser use only.
  license: PSF-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/feedparser-sgmllib/
  repository: https://github.com/python-syndication/feedparser-sgmllib
  documentation: https://feedparser-sgmllib.readthedocs.io

extra:
  recipe-maintainers:
    - step21