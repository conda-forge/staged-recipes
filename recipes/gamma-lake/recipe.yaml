context:
  version: "0.1.0"
  python_min: "3.11"

package:
  name: gamma-lake
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gamma-lake/gamma_lake-${{ version }}.tar.gz
  sha256: 78960e52d77ae59e7b0c9559158915fa6722327eddde457b3ebde8e12b2f1ffa

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - ccflow >=0.8
    - deltalake
    - packaging
    - polars >=0.20
    - pyarrow >=10
    - pydantic >=2
    - ray-core
    - typing-extensions >=4.4.0

tests:
  - python:
      imports:
        - gammalake
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Point72/gamma-lake
  summary: High-performance feature store built on Delta Lake and Ray
  description: |
    Gamma Lake is a feature store built on Delta Lake and Ray, designed for
    efficient storage, versioning, and retrieval of time-indexed features
    backed by Polars DataFrames.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/Point72/gamma-lake
  documentation: https://github.com/Point72/gamma-lake/wiki

extra:
  recipe-maintainers:
    - timkpaine
