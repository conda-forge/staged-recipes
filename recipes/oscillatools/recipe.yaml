context:
  name: oscillatools
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oscillatools/oscillatools-${{ version }}.tar.gz
  sha256: 72d66d21a4cdde903f33bf5b369644b6ced24296eec3a3eabeebd304be4cc2eb

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - numpy >=1.24,<3.0
    - scipy >=1.10,<2.0

tests:
  - python:
      imports:
        - oscillatools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Differentiable, control-oriented toolkit for coupled-phase-oscillator (Kuramoto) dynamics
  description: |
    oscillatools provides classical coupled-phase-oscillator dynamics,
    observables, sensitivities and control-oriented numerical tools on a
    NumPy and SciPy floor. It is the classical toolkit used by
    scpn-quantum-control.
  license: AGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/anulum/scpn-quantum-control
  repository: https://github.com/anulum/scpn-quantum-control
  documentation: https://anulum.github.io/scpn-quantum-control/oscillatools/

extra:
  recipe-maintainers:
    - anulum
