schema_version: 1

context:
  version: "2.0.0"

package:
  name: mcp-types
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-types/mcp_types-${{ version }}.tar.gz
  sha256: d7d939b9285c9961ae8866ba75ef85da34d12bafe276efbf4eb6a131786d8379

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - uv-dynamic-versioning
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=2.12.0
    - typing_extensions >=4.13.0

tests:
  - python:
      imports:
        - mcp_types
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"

about:
  summary: Model Context Protocol wire types
  license: MIT
  license_file: LICENSE
  homepage: https://modelcontextprotocol.io
  documentation: https://py.sdk.modelcontextprotocol.io/

extra:
  recipe-maintainers:
    - jan-janssen
