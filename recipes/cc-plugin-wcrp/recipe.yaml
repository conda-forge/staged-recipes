context:
  version: "2.3.5"

package:
  name: cc-plugin-wcrp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cc-plugin-wcrp/cc_plugin_wcrp-${{ version }}.tar.gz
  sha256: 72660fac11112a22be2c64e07d21d3cad4c17ef8e1d71e9cc9573ffab3c0feb6

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python
    - pip
    - setuptools >=42
    - setuptools-scm >=3.4
    - wheel
  run:
    - python >=3.10
    - compliance-checker >=5.1.2
    - netcdf4
    - cftime
    - toml
    - esgvoc
    - pooch
    - pyfive >=1.1.1
    - pydantic >=2.12.5

tests:
  - python:
      imports:
        - plugins
        - checks
      pip_check: true

about:
  homepage: https://github.com/ESGF/cc-plugin-wcrp
  summary: Compliance Checker plugins for WCRP project specifications
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/ESGF/cc-plugin-wcrp

extra:
  recipe-maintainers:
    - cofinoa
