{% set version = "0.2.0" %}

package:
  name: torch-flash
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/torch-flash/torch_flash-{{ version }}.tar.gz
  sha256: 9bd15bb558f57e40176f9331bf619995d1cc755d055f6da1660470f3239853e7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.11
    - hatchling >=1.27
    - pip
  run:
    - python >=3.11
    - chemicals >=1.5.2
    - numpy >=1.26
    - pyyaml >=6.0
    - pytorch >=2.4,<3
    - typing_extensions >=4.10

test:
  imports:
    - torch_flash
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/ThermoPhase-FCSRG/torch-flash
  summary: Differentiable phase-equilibrium flash calculations built on PyTorch
  doc_url: https://thermophase-fcsrg.github.io/torch-flash
  license: LGPL-2.1-only
  license_file:
    - LICENSE
    - COPYRIGHT

extra:
  recipe-maintainers:
    - volpatto
    - ggrbill
