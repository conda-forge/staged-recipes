schema_version: 1

context:
  python_min: "3.11"
  version: "0.2.0"

package:
  name: torch-flash
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/torch-flash/torch_flash-${{ version }}.tar.gz
  sha256: 9bd15bb558f57e40176f9331bf619995d1cc755d055f6da1660470f3239853e7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}
    - chemicals >=1.5.2
    - numpy >=1.26
    - pyyaml >=6.0
    - pytorch >=2.4,<3
    - typing_extensions >=4.10

tests:
  - python:
      imports:
        - torch_flash
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Differentiable phase-equilibrium flash calculations built on PyTorch
  license: LGPL-2.1-only
  license_file:
    - LICENSE
    - COPYRIGHT
  homepage: https://github.com/ThermoPhase-FCSRG/torch-flash
  documentation: https://thermophase-fcsrg.github.io/torch-flash

extra:
  recipe-maintainers:
    - volpatto
    - ggrbill
