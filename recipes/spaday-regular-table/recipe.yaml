context:
  version: "0.2.0"
  python_min: "3.11"

package:
  name: spaday-regular-table
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-regular-table/spaday_regular_table-${{ version }}.tar.gz
  sha256: 14142dd77ef8046b8dd638aa8f010f696048ce700ed074ef17eb62b263bf8ce3

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.6.0

tests:
  - python:
      imports:
        - spaday_regular_table
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Viewport-virtualized data tables for spaday
  homepage: https://github.com/1kbgz/spaday-regular-table
  repository: https://github.com/1kbgz/spaday-regular-table

extra:
  recipe-maintainers:
    - timkpaine
