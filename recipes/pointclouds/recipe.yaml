context:
  version: "0.2.0"

package:
  name: pointclouds
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pointclouds/pointclouds-${{ version }}.tar.gz
  sha256: c285b6f607f39e9db07c9aa176a89d031a130e684003d0b16067872dde2af5ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - laspy >=2.5
    # laspy's LAZ backend (the PyPI `laspy[lazrs]` extra); conda package name is
    # `lazrs-python`, import name `lazrs`.
    - lazrs-python
    - numpy >=2.0.0
    - pyproj >=3.7
    - scipy >=1.10

tests:
  - python:
      imports:
        - pointclouds
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/serapeum-org/pointclouds
  repository: https://github.com/serapeum-org/pointclouds
  documentation: https://serapeum-org.github.io/pointclouds
  summary: "Point cloud (LAS/LAZ/COPC) I/O, filtering, decimation and gridding"
  description: |
    pointclouds reads, filters, decimates and grids point-cloud files
    (LAS/LAZ/COPC/EPT) with a GDAL-free core (numpy/laspy/pyproj/scipy).
    pyramids is an optional extra, not a required dependency.
  license: GPL-3.0-only
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - MAfarrag
