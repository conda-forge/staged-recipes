schema_version: 1

context:
  version: "1.2.1"

package:
  name: climate-aware-task-scheduler
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/climate-aware-task-scheduler/climate_aware_task_scheduler-${{ version }}.tar.gz
  sha256: f62c023cf2d20535a63fbc4036a801b091a864d959c9f9feb71238d7fc192eac

build:
  number: 0
  skip: match(python, "<3.10")
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - cats = cats.cli:main

requirements:
  host:
    - python
    - setuptools >=61.0.0
    - pip
  run:
    - python
    - requests-cache >=1.0
    - pyyaml >=6.0
    - if: win
      then: tzdata

tests:
  - python:
      imports:
        - cats
      pip_check: true

  - requirements:
      run:
        - pytest
        - pytest-subprocess==1.5.0
    files:
      source:
        - tests/test_main.py
    script:
      # Basic testing only, covering both Python API and CLI operation
      - pytest tests/test_main.py
      - cats --help

  - requirements:
      run:
        - pytest
        - numpy>=1.5.0
    files:
      source:
        - tests/test_footprint.py
    script:
      - pytest tests/test_footprint.py

about:
  summary: Climate aware task scheduler
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/climate-aware-task-scheduler/
  documentation: https://cats.readthedocs.io/

extra:
  recipe-maintainers:
    - sadielbartholomew
    - abhidg
