context:
  version: "2.144.4"

package:
  name: policyengine-us
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/policyengine-us/policyengine_us-${{ version }}.tar.gz
  sha256: 7ebd8efa57f684fb0b01292389ca820f1787dd7798a3efd76a977d6dbf50eace

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - microdf-python >=1.0.0
    - pandas >=3.0
    - policyengine-core >=3.36.0
    - spm-calculator >=1.1.0,<1.2
    - pytables >=3.9
    - tqdm >=4.67.1

tests:
  - python:
      imports:
        - policyengine_us
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PolicyEngine/policyengine-us
  summary: PolicyEngine tax-benefit model for the United States
  license: AGPL-3.0-only
  license_file: LICENSE
  repository: https://github.com/PolicyEngine/policyengine-us

extra:
  recipe-maintainers:
    - MementoRC
