schema_version: 1

context:
  version: 0.3.5

package:
  name: hklpy2_solvers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hklpy2-solvers/hklpy2_solvers-${{ version }}.tar.gz
  sha256: c0995b3deb4ab828bfa545947e3441b8926f44a6102797ea4d5430912ba95d6a

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # hklpy2 depends on hkl (libhkl), ATM only linux-64.
  skip:
    - not linux

requirements:
  host:
    - hatch-vcs
    - hatchling
    - python
    - pip
  run:
    - ad-hoc-diffractometer >=0.11.2
    - hklpy2 >=0.7.1
    - numpy
    - python
    - __linux 

tests:
  - python:
      imports:
        - hklpy2_solvers
      pip_check: true
  - script:
      - python -c "import hklpy2; psic = hklpy2.creator(geometry='psic', solver='ad_hoc')"

