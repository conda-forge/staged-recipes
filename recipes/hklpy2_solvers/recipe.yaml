schema_version: 1

context:
  version: 0.3.5

package:
  name: hklpy2_solvers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hklpy2_solvers/hklpy2_solvers-{{ version }}.tar.gz
  sha256: c0995b3deb4ab828bfa545947e3441b8926f44a6102797ea4d5430912ba95d6a

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # hklpy2 depends on hkl (libhkl), ATM only linux-64.
  skip: true  # [not linux or py<310]

requirements:
  host:
    - hatch-vcs
    - hatchling
    - python ${{ python_min }}.*
    - pip
  run:
    - ad-hoc-diffractometer >=0.11.2
    - hklpy2 >=0.7.1
    - numpy
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hklpy2_solvers
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - python -c "import hklpy2; psic = hklpy2.creator(geometry='psic', solver='ad_hoc')"

about:
  homepage: https://github.com/prjemian/hklpy2_solvers
  license: LicenseRef-UChicago-Argonne-LLC-License
  license_file: LICENSE
  summary: 'Solvers for the hklpy2 diffractometer control package.'
  description: |
    **hklpy2-solvers** provides solvers that plug into the
    `hklpy2 <https://blueskyproject.io/hklpy2/>`_ diffractometer control
    framework via its entry-point interface.
  documentation: https://prjemian.github.io/hklpy2_solvers/
  repository: https://github.com/prjemian/hklpy2_solvers

extra:
  recipe-maintainers:
    - prjemian
