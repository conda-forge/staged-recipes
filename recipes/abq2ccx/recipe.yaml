schema_version: 1

context:
  version: "1.7.0"

package:
  name: abq2ccx
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/abq2ccx/abq2ccx-${{ version }}.tar.gz
  sha256: 862e94af06c6fdfb41538bfad1f3cfae846bc23ccfe9ffc279bedc063ec95e15

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - abq2ccx = abq2ccx:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - abq2ccx
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - abq2ccx --version
      - abq2ccx --help

about:
  homepage: https://github.com/sandervdbroek/abq2ccx
  summary: Convert Abaqus .inp decks to CalculiX (ccx) decks
  description: |
    abq2ccx converts an Abaqus .inp deck into a CalculiX (ccx) deck. Every Abaqus card is
    passed through, translated into the CalculiX construct that does the same, or commented
    out with a warning that says what to do; nothing is dropped silently. It is one Python
    file with no dependencies. Install the calculix package alongside it to run the
    converted decks.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/sandervdbroek/abq2ccx
  documentation: https://github.com/sandervdbroek/abq2ccx/blob/main/docs/user-guide.md

extra:
  recipe-maintainers:
    - sandervdbroek
