schema_version: 1

context:
  version: "1.2.1"

package:
  name: anaconda-opentelemetry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anaconda-opentelemetry/anaconda_opentelemetry-${{ version }}.tar.gz
  sha256: b715eb087918e7c2b573821c6e3d7c3a39ff3af0ff843c4cdc54c3cc7606cd88

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.9
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=3.9
    - pyyaml >=6.0.2
    - opentelemetry-api ==1.38.0
    - opentelemetry-exporter-otlp-proto-common ==1.38.0
    - opentelemetry-exporter-otlp-proto-grpc ==1.38.0
    - opentelemetry-exporter-otlp-proto-http ==1.38.0
    - opentelemetry-proto ==1.38.0
    - opentelemetry-sdk ==1.38.0
    - opentelemetry-semantic-conventions ==0.59b0
    - grpcio >=1.71.0

tests:
  - python:
      imports:
        - anaconda_opentelemetry
      pip_check: true

about:
  summary: Anaconda opentelemetry package wrapper.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/anaconda-opentelemetry/

extra:
  recipe-maintainers:
    - AlbertDeFusco
    - SaundersR1999

