schema_version: 1

context:
  version: "1.3.0"

package:
  name: anaconda-opentelemetry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anaconda-opentelemetry/anaconda_opentelemetry-${{ version }}.tar.gz
  sha256: f0084647f1b8ae91fab6db413cc5f5793174ee35f5d2fb1ef7cff033eb960bba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.40.0,<1.44.0a0
    - opentelemetry-sdk >=1.40.0,<1.44.0a0
    - opentelemetry-exporter-otlp-proto-grpc >=1.40.0,<1.44.0a0
    - opentelemetry-exporter-otlp-proto-http >=1.40.0,<1.44.0a0
    - grpcio >=1.71.0
    - requests >=2.32.5

tests:
  - python:
      imports:
        - anaconda_opentelemetry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Anaconda opentelemetry package wrapper.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/anaconda-opentelemetry/

extra:
  recipe-maintainers:
    - AlbertDeFusco
    - SaundersR1999
