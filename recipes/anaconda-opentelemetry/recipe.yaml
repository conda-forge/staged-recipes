schema_version: 1

context:
  version: "1.2.2"

package:
  name: anaconda-opentelemetry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anaconda-opentelemetry/anaconda_opentelemetry-${{ version }}.tar.gz
  sha256: 183b393f75911df1bfeef07f46a252f749604af77fd4b901ca49f486206d20eb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - pyyaml >=6.0.2
    - opentelemetry-api ==1.40.0
    - opentelemetry-exporter-otlp-proto-common ==1.40.0
    - opentelemetry-exporter-otlp-proto-grpc ==1.40.0
    - opentelemetry-exporter-otlp-proto-http ==1.40.0
    - opentelemetry-proto ==1.40.0
    - opentelemetry-sdk ==1.40.0
    - opentelemetry-semantic-conventions ==0.61b0
    - grpcio >=1.71.0

tests:
  - python:
      imports:
        - anaconda_opentelemetry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Anaconda opentelemetry package wrapper.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/anaconda-opentelemetry/

extra:
  recipe-maintainers:
    - AlbertDeFusco
    - SaundersR1999

