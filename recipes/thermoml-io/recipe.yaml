schema_version: 1

context:
  python_min: "3.11"
  version: "0.1.2"

package:
  name: thermoml-io
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/thermoml-io/thermoml_io-${{ version }}.tar.gz
  sha256: 776dda3f3d7b1faf704caf76908934ef50f993d0253b01b2a6bc13c27d09bda2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}
    - defusedxml >=0.7,<1
    - xmlschema >=4.3,<5
    - citationlib ==0.2.1
    - pyyaml >=6
    - pyarrow >=15

tests:
  - python:
      imports:
        - thermoml_io
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Faithful, provenance-aware ThermoML ingestion, search, and tabular export
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/ThermoPhase-FCSRG/thermoml-io
  documentation: https://thermophase-fcsrg.github.io/thermoml-io
  repository: https://github.com/ThermoPhase-FCSRG/thermoml-io

extra:
  recipe-maintainers:
    - volpatto
