schema_version: 1

context:
  version: "3.3.9"

package:
  name: pyrobotiqgripper
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyrobotiqgripper/pyrobotiqgripper-${{ version }}.tar.gz
  sha256: c207ba55ee5ee3e392e140edd1a6303a0494cee99402e78c1d34c5ebb21dc8a3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyrobotiqgripper-joystick = pyrobotiqgripper.joystick_cli:main

requirements:
  host:
    - python >=3.10.0
    - uv-build >=0.9.4,<1.0.0
    - pip
  run:
    - python >=3.10.0
    - pymodbus >=3.12.1
    - pyserial >=3.5
    - numpy >=1.28
    - pygame
    - pynput
    - python-sounddevice

tests:
  - python:
      imports:
        - pyrobotiqgripper
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - PYNPUT_BACKEND=dummy pyrobotiqgripper-joystick --help

about:
  summary: Python Driver for Robotiq Grippers
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pyrobotiqgripper/

extra:
  recipe-maintainers:
    - nmarticorena
