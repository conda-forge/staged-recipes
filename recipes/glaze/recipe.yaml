schema_version: 1

context:
  name: glaze
  version: 9.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version | replace('-','.') }}

source:
  url: https://github.com/stephenberry/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 55f8a675397c505f9bee6c160e1c26b0085868f185d04d7a7727531fdbff4bd4

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - asio
    - cmake
    - ninja
    - pkg-config

tests:
  - package_contents:
      include:
        - glaze/glaze.hpp
  - script:
      - if: unix
        then:
          - $CXX -std=c++23 -I${PREFIX}/include src/main.cpp -o main
          - ./main
      - if: win
        then:
          - "%CXX% /std:c++latest /EHsc /I%LIBRARY_INC% src/main.cpp /Fe:main.exe"
          - if %errorlevel% neq 0 exit /b %errorlevel%
          - main.exe
    files:
      source:
        - src/main.cpp
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}

about:
  homepage: https://github.com/stephenberry/glaze
  license: MIT
  license_file: LICENSE
  summary: Extremely fast, in memory, JSON and reflection library for modern C++
  description: |
    One of the fastest JSON libraries in the world. Glaze reads and writes from object memory,
    simplifying interfaces and offering incredible performance.
    
    - Pure, compile time reflection for structs (with optional C++26 P2996 backend)
    - JSON RFC 8259 compliance with UTF-8 validation
    - Standard C++ library support
    - Header only
    - Direct to memory serialization/deserialization
    - Compile time maps with constant time lookups and perfect hashing
    - No exceptions (compiles with -fno-exceptions)
    - No runtime type information necessary (compiles with -fno-rtti)
    - MessagePack serialization with binary ext + partial read/write support
  repository: https://github.com/stephenberry/glaze

extra:
  recipe-maintainers:
    - nodtem66