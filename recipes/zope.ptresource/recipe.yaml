schema_version: 1

context:
  version: "6.1"

package:
  name: zope.ptresource
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.ptresource/zope_ptresource-${{ version }}.tar.gz
  sha256: 090c0c6282d3c19984a8594973675064034e758a8268c243fbefc5cbb6c837d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - zope.browserresource
    - zope.interface
    - zope.pagetemplate
    - zope.publisher
    - zope.security

tests:
  - python:
      imports:
        - zope.ptresource
        - zope.ptresource.ptresource
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest -v zope.ptresource.tests
    requirements:
      run:
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.ptresource
  repository: https://github.com/zopefoundation/zope.ptresource
  documentation: https://zopeptresource.readthedocs.io
  summary: Page template resource plugin for zope.browserresource
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
