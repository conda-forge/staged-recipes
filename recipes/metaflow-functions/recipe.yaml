schema_version: 1

context:
  version: "0.2.7"

package:
  name: metaflow-functions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/metaflow-functions/metaflow_functions-${{ version }}.tar.gz
  sha256: a0cdf9d37a513ca3060fe4a427df07cdbf1deb900fe82e78ca1f1b97cc23f5a8

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - metaflow >=2.16.0
    - psutil >=5.8.0
    - cffi
    - fastavro
    - ray-default

tests:
  - python:
      imports:
        - metaflow_extensions.nflx.plugins.functions
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/Netflix/metaflow-nflx-extensions
  repository: https://github.com/Netflix/metaflow-nflx-extensions
  summary: Metaflow Functions
  description: >-
    Metaflow Functions is a Metaflow extension package from Netflix that
    provides function-based extensions for Metaflow flows.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - npow
    - romain-intel
