schema_version: 1

context:
  version: "0.3"

package:
  name: solarutils
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/solarutils/SolarUtils-${{ version }}.tar.gz
  sha256: b1143ddd423e56468e7fafdcd364a3431bf871ac4d9dc761050c40c6ec5e371c
  patches:
    - patch_compiler_for_conda_forge.diff
    - avoid-c23-keywords.patch
    - fix-macos-dylib-linking.patch

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - setuptools
    - pip
  run:
    - python
    - setuptools

tests:
  - python:
      imports:
        - solar_utils
      pip_check: true

about:
  summary: Python wrappers around NREL SOLPOS and SPECTRL2
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/SunPower/SolarUtils
  documentation: https://pythonhosted.org/SolarUtils/

extra:
  recipe-maintainers:
    - mikofski
