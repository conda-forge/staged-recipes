# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: foxglove-sdk
  version: "0.25.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/foxglove_sdk-${{ version }}.tar.gz
    sha256: 8230f3c32ea3ab715818687377491594ec9c7e58e6b0ed8ed91aadf937ce706b
  - url: https://raw.githubusercontent.com/foxglove/foxglove-sdk/main/LICENSE
    sha256: da11235665c17d4c1634072dae92b8ba1b38d6fdde2ccf19a6bbede33253f58d
    file_name: LICENSE

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - maturin >=1.7,<2
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
  host:
    - python
    - maturin >=1.7,<2
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - foxglove
      pip_check: true

about:
  summary: Foxglove Python SDK
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://foxglove.dev/
  repository: https://github.com/foxglove/foxglove-sdk

extra:
  recipe-maintainers:
    - flferretti
