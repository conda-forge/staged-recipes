schema_version: 1

context:
  version: "1.15.2"

package:
  name: pystac-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-core/pystac_core-${{ version }}.tar.gz
  sha256: 3720485dd06334e6536afe8f2b8bb0def5c65437170e0251b3417abb89d6b3f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - python-dateutil >=2.7.0
    - pystac-core

tests:
  - python:
      imports:
        - pystac
        - pystac.extensions.base
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Core functionality for PySTAC without extensions. Most users will want to use pystac, not this package
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-core/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
