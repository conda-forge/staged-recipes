package:
  name: zyra
  version: "2.0.0"

source:
  url: https://github.com/AndreaPallotta/zyra/archive/refs/tags/v2.0.0.tar.gz
  sha256: 7997fe3a00ae7d638eca5808eaa21887b44a67ceb972ed08d352ddcc05f20f24

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - {{ stdlib("c") }}
  host:
    - rust
  run:
    - rust

test:
  commands:
    - zyra version
    - zyra help

about:
  home: https://zyra-lang.dev
  license: MIT
  license_file: LICENSE
  summary: Fast, expressive, self-hosted compiled programming language targeting Native, WASM, and JS.
  doc_url: https://zyra-lang.dev
  dev_url: https://github.com/AndreaPallotta/zyra

extra:
  recipe-maintainers:
    - AndreaPallotta
