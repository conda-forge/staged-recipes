{% set name = "vorpy3" %}
{% set version = "3.4.0" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 69eae59f35763634752a52f06ee9a52b333b885b9bd40d23a90b93b368fe7406

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"
  entry_points:
    - vorpy = vorpy.__main__:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - wheel
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - matplotlib-base
    - pandas
    - plotly
    - shapely
    - sympy
    - numba
    - pillow

test:
  imports:
    - vorpy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jackericson98/vorpy
  license: MIT
  license_file: LICENSE
  summary: A Python package for Voronoi analysis of molecular structures
  doc_url: https://github.com/jackericson98/vorpy
  dev_url: https://github.com/jackericson98/vorpy

extra:
  recipe-maintainers:
    - jackericson98
