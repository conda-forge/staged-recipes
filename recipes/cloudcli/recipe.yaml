schema_version: 1

context:
  name: cloudcli
  version: "1.37.8"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/siteboon/claudecodeui/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7056ff7e446e9bfe84f92c3e6b45ce6c1a22a3d15f8fc7a929d97249631495e9

build:
  number: 0
  # native node modules (node-pty, bcrypt, better-sqlite3); Linux only for now
  skip:
    - not linux
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - make
    - python
    - nodejs
  host:
    - nodejs
  run:
    # native modules are built against this Node ABI
    - ${{ pin_compatible('nodejs', upper_bound='x') }}
    - ripgrep

tests:
  - script:
      - cloudcli --version
      - cloudcli --help
      - cd $PREFIX/lib/node_modules/@cloudcli-ai/cloudcli && node -e "require('better-sqlite3'); require('bcrypt'); require('node-pty')"
      - test -x $PREFIX/lib/node_modules/@cloudcli-ai/cloudcli/node_modules/@vscode/ripgrep/bin/rg

about:
  homepage: https://cloudcli.ai
  repository: https://github.com/siteboon/claudecodeui
  summary: Web and mobile UI for Claude Code, Codex, Cursor CLI and other coding agents
  description: |
    CloudCLI (formerly Claude Code UI) is a web UI for managing coding-agent
    sessions and projects from desktop or mobile. Run `cloudcli` and open the
    printed URL.

    This package does not bundle the agent CLIs. Install `claude` (Claude Code)
    and/or `codex` (conda-forge) separately and keep them on PATH, or set
    CLAUDE_CLI_PATH / CODEX_CLI_PATH.
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - NOTICE
    - third-party-licenses.txt

extra:
  recipe-maintainers:
    - mediocretech
