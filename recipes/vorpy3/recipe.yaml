schema_version: 1

context:
  version: "3.5.0"
  python_min: "3.9"

package:
  name: vorpy3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vorpy3/vorpy3-${{ version }}.tar.gz
  sha256: 194c05674eda31217c737d197c7303aa960a89f4449b7035cadb4b96f979779e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - vorpy = vorpy.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - matplotlib-base
    - pandas
    - numba
    - shapely
    - pillow

tests:
  - python:
      imports:
        - vorpy
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A Python package for Voronoi analysis of molecular structures
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jackericson98/vorpy

extra:
  recipe-maintainers:
    - jackericson98