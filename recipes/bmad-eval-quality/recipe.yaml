# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.0"

package:
  name: bmad-eval-quality
  version: ${{ version }}

source:
  url: https://github.com/bmad-code-org/bmad-eval-quality/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 391944c1e8d0fea1c2e1b1cb717a1e9866f2ee50191cac570be1af3a0a565049

build:
  number: 0
  noarch: generic

requirements:
  host:
    - nodejs
  run:
    - nodejs
    - if: unix
      then:
        - __unix
    - if: win
      then:
        - __win

tests:
  - script:
      - if: not win
        then:
          - test "$(eval-quality --version)" = ${{ version }}
          - eval-quality --help | grep -q "eval-quality score"
          - eval-quality compile --in "${PREFIX}/lib/node_modules/eval-quality/corpus/dev/contracts/satisfied-declarations.json" > /dev/null
        else:
          - eval-quality.bat --version
          - eval-quality.bat --help | findstr /C:"eval-quality score"
          - eval-quality.bat compile --in "%PREFIX%\lib\node_modules\eval-quality\corpus\dev\contracts\satisfied-declarations.json" > NUL

about:
  homepage: https://github.com/bmad-code-org/bmad-eval-quality
  license: Apache-2.0 AND MIT
  license_file:
    - LICENSE
    - node_modules/zod/LICENSE
  summary: Compile, seal, preflight and score Behavioral Evaluation Contracts — grades an evaluation by a twin-run (clean vs planted-defect) loop
  description: |
    eval-quality compiles and scores Behavioral Evaluation Contracts: versioned
    JSON declaring which behaviors to probe, what evidence counts, and the
    pass/fail oracles. Its one idea is the twin-run loop — run the same contract
    against a clean system and against one with a single planted defect; a
    strong contract passes clean and fails mutated. The tool executes nothing
    itself: a harness runs the system under test and hands over observations
    and a sealed run record; eval-quality grades the evaluation, not the
    system. Ships the `eval-quality` CLI (compile, seal, preflight, score),
    the contract JSON schemas and the development corpus of example contracts.
  repository: https://github.com/bmad-code-org/bmad-eval-quality

extra:
  recipe-maintainers:
    - rxm7706
