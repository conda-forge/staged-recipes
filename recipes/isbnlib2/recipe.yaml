schema_version: 1

context:
  version: "3.11.23"

package:
  name: isbnlib2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/isbnlib2/isbnlib2-${{ version }}.tar.gz
  sha256: eaeb96dc946e43d0228a0c4f3860e7dd0bc26ebf47b14912f27545f63fbf5b5d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - isbnlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Extract, clean, transform, hyphenate and metadata for ISBNs (International Standard Book Number).
  license: LGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/hans-fritz-pommes/isbnlib

extra:
  recipe-maintainers:
    - tovrstra
