schema_version: 1

context:
  version: "0.1.2"

package:
  name: pyearthmesh
  version: ${{ version }}

source:
  url: https://github.com/changliao1025/pyearthmesh/archive/v${{ version }}.tar.gz
  sha256: 3438715d96edb5d46a882165df1896d26d98c88034d0036450817b9a31b4fb05

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.20.0
    - pyearth >=0.2.5
    - pyyaml >=6.0

tests:
  - python:
      imports:
        - pyearthmesh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A lightweight mesh generation and manipulation package for Earth science applications
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/changliao1025/pyearthmesh
  repository: https://github.com/changliao1025/pyearthmesh
  documentation: https://pyearthmesh.readthedocs.io/

extra:
  recipe-maintainers:
    - changliao1025
