schema_version: 1

context:
  version: "0.1.1"

package:
  name: pyearthmesh
  version: ${{ version }}

source:
  url: https://github.com/changliao1025/pyearthmesh/archive/v${{ version }}.tar.gz
  sha256: 76efb3da262c4364d9252a922ef09d9c44e0efc16bbc00dd72448228a3f63ca9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.20.0
    - pyearth >=0.2.1

tests:
  - python:
      imports:
        - pyearthmesh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A lightweight mesh generation and manipulation package for Earth science applications
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/changliao1025/pyearthmesh

extra:
  recipe-maintainers:
    - changliao1025
