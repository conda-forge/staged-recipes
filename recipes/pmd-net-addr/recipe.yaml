context:
  version: "0.0.3"

package:
  name: pmd-net-addr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pmd_net_addr/pmd_net_addr-${{ version }}.tar.gz
  sha256: 1b0fcb3b77f30076237360eb4cf0243483278a2650fd4a194985cc69b1de07e5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.6

tests:
  - python:
      imports:
        - pmd_net_addr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ccie18643/PyTCP
  summary: Network address classes from the PyTCP stack
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
