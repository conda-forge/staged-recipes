{% set name = "diffpy.cmipdf" %}
{% set version = "0.1.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/d/diffpy_cmipdf/diffpy_cmipdf-{{ version }}.tar.gz
  sha256: 5ca43bbff8516ecd2dc591d90d5b3609f3c2de4c1e67003826646b9291ae664f

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .
  entry_points:
    - diffpy-cmipdf = diffpy.cmipdf.cmipdf_app:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-git-versioning >=2.0
    - pip

  run:
    - python >={{ python_min }}
    - numpy
    - diffpy.srreal
    - diffpy.srfit
    - diffpy.structure

test:
  requires:
    - python {{ python_min }}
    - pip
    - pytest

  source_files:
    - tests

  imports:
    - diffpy.cmipdf

  commands:
    - pip check
    - diffpy-cmipdf --version
    - pytest

about:
  home: https://github.com/diffpy/diffpy.cmipdf/
  summary: The code of the PDF pack of the diffpy.cmi package.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  description: |
    The code of the PDF pack of the diffpy.cmi package.
  dev_url: https://github.com/diffpy/diffpy.cmipdf/

extra:
  recipe-maintainers:
    - sbillinge
    - cadenmyers13
