context:
  name: diffpy.cmipdf
  version: "0.1.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/diffpy_cmipdf/diffpy_cmipdf-${{ version }}.tar.gz
  sha256: 5ca43bbff8516ecd2dc591d90d5b3609f3c2de4c1e67003826646b9291ae664f

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - diffpy-cmipdf = diffpy.cmipdf.cmipdf_app:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-git-versioning >=2.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - diffpy.srreal
    - diffpy.srfit >=3.4.0
    - diffpy.structure

tests:
  - python:
      imports:
        - diffpy.cmipdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    script:
      - diffpy-cmipdf --version
      - pytest

about:
  homepage: https://github.com/diffpy/diffpy.cmipdf/
  summary: The code of the PDF pack of the diffpy.cmi package.
  description: |
    The code of the PDF pack of the diffpy.cmi package.
  license: BSD-3-Clause
  license_file: LICENSE.rst
  repository: https://github.com/diffpy/diffpy.cmipdf/

extra:
  recipe-maintainers:
    - sbillinge
    - cadenmyers13
