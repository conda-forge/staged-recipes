context:
  name: scikit-clarans
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/scikit_clarans-${{ version }}.tar.gz
  sha256: edc4f5917d4d03ef46324479c43893de717e86f461b2751270059bfa99f1cac0

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ninja
  host:
    - python
    - pip
    - meson-python >=0.15.0
    - ninja
    - cython >=3.0
    - numpy
  run:
    - python
    - ${{ pin_compatible('numpy') }}
    - scikit-learn
    - scipy

tests:
  - python:
      imports:
        - clarans
      pip_check: true
  - script:
      - python -c "import clarans; assert clarans.HAS_CYTHON, 'Cython kernel missing'; print('Verified version:', clarans.__version__)"

about:
  homepage: https://github.com/ThienNguyen3001/scikit-clarans
  summary: A scikit-learn compatible implementation of CLARANS clustering algorithm
  license: MIT
  license_file: LICENSE
  documentation: https://scikit-clarans.readthedocs.io/
  repository: https://github.com/ThienNguyen3001/scikit-clarans

extra:
  recipe-maintainers:
    - ThienNguyen3001
