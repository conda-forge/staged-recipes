schema_version: 1

context:
  version: "0.3.4"
  python_min: "3.12"

package:
  name: remotestate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/remotestate/remotestate-${{ version }}.tar.gz
  sha256: f9fbe1a2914125dbb9e3e0f54a26d3d0395b49decb075a3b61feb8c588992c7b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1,<2
    - pip
  run:
    - python >=${{ python_min }}
    - fastapi >=0.136,<1
    - pydantic >=2,<3
    - uvicorn >=0.46,<1

tests:
  - python:
      imports:
        - remotestate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python component of a framework for stateful React frontends
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/bcdev/remotestate

extra:
  recipe-maintainers:
    - pont-us
