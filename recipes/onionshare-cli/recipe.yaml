schema_version: 1

context:
  version: "2.6.5"

package:
  name: onionshare-cli
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/o/onionshare_cli/onionshare_cli-${{ version }}.tar.gz
    sha256: 6280e93307e5b8e78df5c23b346156d3cd3b8cb831e920ae33c3bb0edaf80ba2
    patches:
      - patches/0001-relax-dependency-pins.patch
  # Neither the sdist nor the wheel ships a license file.
  - url: https://raw.githubusercontent.com/onionshare/onionshare/v${{ version }}/LICENSE.txt
    sha256: 00209f6e6b6efaba0d150005ab108364bfeef6418345410835d725623661da4f
    file_name: LICENSE.txt

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - onionshare-cli = onionshare_cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - click
    - colorama
    - eventlet
    - flask 3.1.*
    - flask-compress >=1.24,<2
    - flask-socketio >=5.6,<6
    - gevent >=26.5.0
    - gevent-websocket
    - packaging >=24
    - psutil
    - pynacl >=1.6.2,<2
    - pysocks
    - qrcode >=7.4.2
    - requests >=2.32.3
    - stem >=1.8.0
    - unidecode
    - urllib3 >=2.7,<3
    - waitress >=3.0.1,<4
    - werkzeug 3.1.*
    - tor

tests:
  - python:
      imports:
        - onionshare_cli
        - onionshare_cli.web
      python_version:
        - ${{ python_min }}.*
        - "*"
      # conda-forge's stem 1.8.0 ships `Platform: UNKNOWN` in its metadata,
      # which recent pip versions report as "not supported on this platform".
      pip_check: false
  - script:
      - onionshare-cli --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://onionshare.org/
  repository: https://github.com/onionshare/onionshare
  documentation: https://docs.onionshare.org/
  license: GPL-3.0-or-later
  license_file: LICENSE.txt
  summary: Securely and anonymously share files, host websites, and chat with friends using the Tor network
  description: |
    OnionShare is an open source tool that lets you securely and anonymously
    share files, host websites, and chat with friends using the Tor network.

    It works by starting a web server, making it accessible as a Tor onion
    service, and generating an unguessable web address so others can download
    files from you, or upload files to you. It does not require setting up a
    separate server or using a third party file-sharing service.

    This is the command line interface. The Qt desktop application is not
    packaged yet.

extra:
  recipe-maintainers:
    - pavelzw
