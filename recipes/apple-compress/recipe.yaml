context:
  version: "0.2.3"

package:
  name: apple-compress
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apple_compress/apple_compress-${{ version }}.tar.gz
  sha256: a1c855cec8bd73210ae9522c53a841ca515ded2f0c9d5b4e728d0d93fee46a29

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - acompress=apple_compress.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - click >=8.1.7,<9.0.0
    - loguru >=0.7.2,<0.8.0

tests:
  - python:
      imports:
        - if: osx
          then: apple_compress
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/m1stadev/apple-compress
  summary: Python bindings for Apple's libcompression
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
