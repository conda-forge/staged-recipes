context:
  version: "0.2.2"
  python_min: "3.11"

package:
  name: policyengine-il
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/policyengine-il/policyengine_il-${{ version }}.tar.gz
  sha256: b84cdb35b730ffe50bd3673ee1ccb3fae476a1ff51548daef7ac860d9830ad49

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2.1,<3
    - policyengine-core >=3.25,<4

tests:
  - python:
      imports:
        - policyengine_il
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PolicyEngine/policyengine-il
  summary: PolicyEngine tax-benefit model for Israel
  license: AGPL-3.0-only
  license_file: LICENSE
  repository: https://github.com/PolicyEngine/policyengine-il

extra:
  recipe-maintainers:
    - MementoRC
