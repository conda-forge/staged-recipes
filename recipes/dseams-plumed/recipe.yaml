schema_version: 1

context:
  version: "0.4.0"

package:
  name: dseams-plumed
  version: ${{ version }}

source:
  url: https://github.com/d-SEAMS/dseams-plumed/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 64875602af290cd43e0cbb1b282341835a86b622369f4707c5e43495fdde9b15

build:
  number: 0
  # libseams is not built on Windows. The engine port is not done.
  skip:
    - win

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - meson >=1.3
    - ninja
    - pkgconf
  host:
    - libseams >=2.14.0,<2.15
    - plumed
  run:
    - plumed

tests:
  - script:
      - if: linux
        then:
          - test -f "${PREFIX}/lib/libdseams_plumed.so"
          - ldd "${PREFIX}/lib/libdseams_plumed.so"
      - if: osx
        then:
          - test -f "${PREFIX}/lib/libdseams_plumed.dylib"

about:
  homepage: https://dseams.info
  repository: https://github.com/d-SEAMS/dseams-plumed
  license: MIT
  license_file: LICENSE
  summary: PLUMED action for the d-SEAMS topological ice score
  description: |
    dseams-plumed is the PLUMED module that counts cages and the largest
    ice cluster with the d-SEAMS engine. It links the installed libseams
    package. PLUMED loads the module.

extra:
  recipe-maintainers:
    - HaoZeke
    - amritagos
    - RuhiRG
