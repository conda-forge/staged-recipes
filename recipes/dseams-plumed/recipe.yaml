schema_version: 1

context:
  version: "0.4.0"

package:
  name: dseams-plumed
  version: ${{ version }}

source:
  url: https://github.com/d-SEAMS/dseams-plumed/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 64875602af290cd43e0cbb1b282341835a86b622369f4707c5e43495fdde9b15

build:
  number: 0
  # libseams is not built on Windows. The engine port is not done.
  skip:
    - win

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - meson >=1.3
    - ninja
    - pkgconf
  host:
    - libseams >=2.14.0,<2.15
    - plumed
  run:
    - ${{ pin_compatible('plumed', upper_bound='x.x') }}

tests:
  - files:
      recipe:
        - plumed.dat
        - frames.xyz
    script:
      - echo "LOAD FILE=${PREFIX}/lib/libdseams_plumed${SHLIB_EXT}" > load.dat
      - cat plumed.dat >> load.dat
      - plumed driver --natoms 64 --parse-only --plumed load.dat
      - plumed driver --plumed load.dat --ixyz frames.xyz --length-units A
      - test "$(awk 'NR == 2 {print $2, $3, $4, $5, $6}' ICE)" = "64 64 1 64 0"
      - test "$(awk 'NR == 3 {print $2, $3, $4, $5, $6}' ICE)" = "0 0 0 0 0"

about:
  homepage: https://dseams.info
  repository: https://github.com/d-SEAMS/dseams-plumed
  license: MIT
  license_file: LICENSE
  summary: PLUMED action for the d-SEAMS topological ice score
  description: |
    dseams-plumed is the PLUMED module that counts cages and the largest
    ice cluster with the d-SEAMS engine. It links the installed libseams
    package. PLUMED loads the module.

extra:
  recipe-maintainers:
    - HaoZeke
