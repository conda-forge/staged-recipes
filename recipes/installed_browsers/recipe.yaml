schema_version: 1

context:
  version: "0.1.5"

package:
  name: installed_browsers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/installed_browsers/installed_browsers-${{ version }}.tar.gz
  sha256: fb71f5d9f5bc13e5afcb82a903d3f4aa3dcf8240073057c08aba678d01a61072

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - if: win
      then:
        - __win
        - pywin32 >=303,<311
      else:
        - __unix
        - pyxdg >=0.27,<0.29

tests:
  - python:
      imports:
        - installed_browsers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python library to check installed browsers
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/undeflorate/installed_browsers

extra:
  recipe-maintainers:
    - thewchan
