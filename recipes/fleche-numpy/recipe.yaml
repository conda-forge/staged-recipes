schema_version: 1

context:
  name: fleche-numpy
  version: "1.0.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fleche_numpy-${{ version }}.tar.gz
  sha256: 1dbbaca57ce97330f5a64b8748caeec5e91c853912507db7fa4db31e5db4bf43

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64.0
    - pip
  run:
    - python >=${{ python_min }},<3.15
    # fleche's core; the conda-forge `fleche` package is a metapackage that
    # pulls this one in, so depending on it would be circular.
    - fleche-base >=0.24.0
    - numpy >=1.26

tests:
  - python:
      imports:
        - fleche_numpy
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      # The hooks reach fleche through its entry point; without them fleche
      # raises Indigestible for arrays.
      - python -c "import numpy as np; from fleche.digest import digest; digest(np.arange(3)); digest(np.timedelta64(1, 's'))"

about:
  homepage: https://github.com/pmrv/fleche
  documentation: https://fleche.readthedocs.io/
  repository: https://github.com/pmrv/fleche
  summary: numpy digest hooks for fleche
  description: |
    Lets fleche digest numpy arrays and scalars, so functions taking them can
    be cached.  Installed by the conda-forge `fleche` metapackage.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pmrv
