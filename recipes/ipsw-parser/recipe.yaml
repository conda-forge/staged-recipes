context:
  version: "1.9.0"

package:
  name: ipsw-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipsw_parser/ipsw_parser-${{ version }}.tar.gz
  sha256: 4b2f355e0abd307458af4963f9d3aca4d4ab2d73a5f7100d59c000427e444109

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ipsw-parser=ipsw_parser.__main__:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=70.1
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - ansilogs >=1.1.0
    - bytestruct >=0.1.0
    - pyimg4 >=0.8.8
    - requests
    - remotezip2
    - typer

tests:
  - python:
      imports:
        - ipsw_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - ipsw-parser --help

about:
  homepage: https://github.com/doronz88/ipsw_parser
  summary: Utility for parsing and extracting data from IPSW files
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
