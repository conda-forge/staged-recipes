schema_version: 1

context:
  version: "0.2.0"

package:
  name: looot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/looot/looot-${{ version }}.tar.gz
  sha256: 1af83ac31afcbfa5c257ba81b265f1cae802966fe6d783380db397ec1d11c615

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx >=0.27,<1

tests:
  - python:
      imports:
        - looot
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://looot.ai
  license: MIT
  license_file: LICENSE
  summary: Python client for the looot API, one token for 300+ data providers.
  description: |
    Official Python client for the looot API. Search, inspect and run data
    provider operations (email finding and verification, company enrichment,
    SERP, scraping and more) with one token and one prepaid balance. Ships a
    sync client and an async client built on httpx.
  repository: https://github.com/loootai/looot-python
  documentation: https://docs.looot.ai

extra:
  recipe-maintainers:
    - walidboulanouar
