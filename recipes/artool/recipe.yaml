schema_version: 1

context:
  version: "0.11.2"

package:
  name: r-artool
  version: ${{ version }}

source:
  - url: https://cran.r-project.org/src/contrib/ARTool_${{ version }}.tar.gz
    sha256: 3c3963b10e2d25ae1620a87d569f1cdc1ced878eeedc7c2e1e9625be53bcd34a
  - path: LICENSE

build:
  number: 0
  noarch: generic
  script:
    - R CMD INSTALL --build .
    - if: unix
      then:
        - cp ./LICENSE $PREFIX/lib/R/library/ARTool/LICENSE

requirements:
  host:
    - r-base >=3.2
    - r-lme4
    - r-car >=2.0-24
    - r-plyr
    - r-magrittr
    - r-dplyr
    - r-emmeans
  run:
    - r-base >=3.2
    - r-lme4
    - r-car >=2.0-24
    - r-plyr
    - r-magrittr
    - r-dplyr
    - r-emmeans

tests:
  - script:
      - R -e "library('ARTool')"

about:
  homepage: https://github.com/mjskay/ARTool/
  repository: https://github.com/mjskay/ARTool/
  summary: Aligned Rank Transform
  description: |
    The aligned rank transform for nonparametric factorial ANOVAs as
    described by Wobbrock, Findlater, Gergle, and Higgins (2011)
    <doi:10.1145/1978942.1978963>. Also supports aligned rank transform
    contrasts as described by Elkin, Kay, Higgins, and Wobbrock (2021)
    <doi:10.1145/3472749.3474784>.
  license: GPL-2.0-or-later
  license_file: LICENSE
  documentation: https://cran.r-project.org/web/packages/ARTool/ARTool.pdf

extra:
  recipe-maintainers:
    - gallardoalba
