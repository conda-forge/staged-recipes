schema_version: 1

context:
  name: bioio-czi
  version: "3.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/bioio_czi-${{ version }}.tar.gz
  sha256: 1b11f23529fe46fd6a0777ff535227c9a5f402cd58cf8ccd314007b62d83d5ac

build:
  number: 0
  noarch: python
  script:
    - sed -i -E 's/"aicspylibczi>=[0-9.]+"/"aicspylibczi>=3.3.1"/' pyproject.toml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=65
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - aicspylibczi >=3.3.1
    - pylibczirw
    - libpsl
    - aiohttp
    - bioio-base >=3.4.0
    - dask-core >=2021.4.1
    - numpy >=1.24
    - fsspec >=2022.8.0
    - lxml >=5
    - ome-types >=0.3.4
    - python-dateutil >=2.9.0.post0
    - requests
    - xarray >=2022.6.0

tests:
  - python:
      imports:
        - bioio_czi
        - bioio_czi.aicspylibczi_reader.reader
        - bioio_czi.pylibczirw_reader.reader
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - python -c "from importlib.metadata import entry_points as e; assert 'bioio-czi' in [x.name for x in e(group='bioio.readers')]"
      - python -c "from bioio_czi import Reader"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: A BioIO reader plugin for reading Zeiss CZI files.
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/bioio-devs/bioio-czi
  repository: https://github.com/bioio-devs/bioio-czi
  documentation: https://bioio-devs.github.io/bioio-czi

extra:
  recipe-maintainers:
    - rmassei
