schema_version: 1

context:
  name: bioio-czi
  version: "3.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/bioio_czi-${{ version }}.tar.gz
  sha256: a6d496197c57e0fdb1b51c13ca28d97ed72c547e04d359f92600cd4bbc2b428b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}
    - aicspylibczi >=4.0.1
    - libpsl
    - libssh2
    - dask >=2021.4.1
    - aiohttp
    - bioio-base >=3.4.0
    - dask-core >=2021.4.1
    - fsspec >=2022.8.0
    - lxml >=4.6
    - ome-types >=0.3.4
    - pylibczirw
    - python-dateutil >=2.9.0.post0
    - requests
    - xarray >=2022.6.0

tests:
  - python:
     imports:
       - bioio_czi
     pip_check: true
     python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "from bioio_czi import Reader"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/bioio-devs/bioio-czi
  documentation: https://github.com/bioio-devs/bioio-czi
  license:  GPL-3.0-only
  license_file: LICENSE
  summary: A Bioio reader plugin for reading czi images.

extra:
  recipe-maintainers:
    - rmassei
