schema_version: 1

context:
  python_min: "3.11"
  version: "0.2.0"

package:
  name: soba_reference_repo
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/soba_reference_repo/soba_reference_repo-${{ version }}.tar.gz
  sha256: f4ed0a4781091b2f04b9569fa1a8210e5344304d358d3b5126ad29d49078fe59

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - soba_reference_repo = soba_reference_repo.cli:main
      - soba_validate_parquets = soba_reference_repo.validator:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - pyarrow
    - matplotlib-base

tests:
  - python:
      imports:
        - soba_reference_repo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - soba_reference_repo --help
      - soba_validate_parquets --help

about:
  summary: Recipe-driven SOBA reference TEST/TARGET dataset exporter
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/soba-reference-repo/

extra:
  recipe-maintainers:
    - iliasreg
