{% set version = "1.1.0" %}

package:
  name: molsym
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/m/molsym/molsym-{{ version }}.tar.gz
  sha256: 9028482c104595e613f40f948daf4bd428c2b0b910a4e3f37bc08ed8a8b631dc

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python =={{ python_min }}
    - setuptools >=64
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.23.4

test:
  imports:
    - molsym
  commands:
    - pip check
  requires:
    - pip
    - python =={{ python_min }}

about:
  home: https://github.com/NASymmetry/MolSym
  summary: A program for molecular symmetry detection and SALC construction
  doc_url: https://molsym.readthedocs.io
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - nlk36701
