schema_version: 1

context:
  version: "0.2.2"

package:
  name: instanttensor
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/i/instanttensor/instanttensor-${{ version }}.tar.gz
  sha256: aca07c1afe4fde23dcbfb53044e2bef50dad4c0af054317acc669a1c8dc2b325

build:
  number: 0
  skip: not linux
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - make
  host:
    - python
    - setuptools >=65.0
    - wheel
    - pip
  run:
    - python
    - pytorch >=2.8.0

tests:
  - python:
      imports:
        - instanttensor
      pip_check: true

about:
  summary: An ultra-fast, distributed Safetensors loader
  license: LGPL-2.1-only AND Apache-2.0 AND MIT AND BSD-3-Clause AND GPL-2.0-only
  license_file:
    - LICENSE
    - csrc/third_party/pybind11/LICENSE
    - csrc/third_party/liburing/LICENSE
    - csrc/third_party/liburing/COPYING.GPL
    - csrc/third_party/liburing/COPYING
    - csrc/third_party/liburing/debian/copyright
    - csrc/third_party/libaio/COPYING
    - csrc/third_party/dlpack/LICENSE
    - csrc/third_party/atomic_queue/LICENSE
  homepage: https://pypi.org/project/instanttensor/
  repository: https://github.com/scitix/InstantTensor

extra:
  recipe-maintainers:
    - shermansiu
