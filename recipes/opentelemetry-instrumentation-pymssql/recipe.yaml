schema_version: 1

context:
  version: 0.66b2

package:
  name: opentelemetry-instrumentation-pymssql
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/opentelemetry-instrumentation-pymssql/opentelemetry_instrumentation_pymssql-${{ version }}.tar.gz
  sha256: a84189f6e1a368db216eea6253e3db557bab3e030f54b602e892a2458ee24a6a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.12,<2.dev0
    - opentelemetry-instrumentation ==0.66b2
    - opentelemetry-instrumentation-dbapi ==0.66b2
    - pymssql

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.pymssql
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: OpenTelemetry pymssql instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-pymssql

extra:
  recipe-maintainers:
    - jsmolic
