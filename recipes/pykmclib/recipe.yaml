context:
  name: pykmclib
  version: "0.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/LiuGaoyong/pykmclib/releases/download/v${{ version }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9a5650b0f3e16e7825eac8b7cee54c6ca9abf7e8e2c1a9ed6c6702d0349e3aa9

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - pybind11
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake >=3.21
    - ninja
  host:
    - python
    - pip
    - scikit-build-core >=1.1
    - pybind11 >=3.0
  run:
    - python
    - numpy >=1.21

tests:
  - python:
      imports:
        - pykmclib
        - pykmclib.Backend
      pip_check: true
  - script:
      - python -c "from pykmclib.Backend import Backend, Custom; assert Backend.MPICommons.isMaster()"
      - pytest -q tests
    requirements:
      run:
        - pytest
    files:
      source:
        - tests/

about:
  homepage: https://github.com/LiuGaoyong/pykmclib
  summary: Lattice kinetic Monte Carlo simulations (Python front end, C++ backend)
  description: |
    pykmclib repackages KMCLib, the general framework for lattice kinetic Monte
    Carlo simulations, as a modern Python distribution built with
    scikit-build-core and pybind11. The computationally heavy backend is the
    original KMCLib C++ code; the Python API follows upstream KMCLib.
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
    - third_party/KMCLib/LICENSE.txt
  documentation: https://github.com/LiuGaoyong/pykmclib
  repository: https://github.com/LiuGaoyong/pykmclib

extra:
  recipe-maintainers:
    - LiuGaoyong
