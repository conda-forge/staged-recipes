schema_version: 1

context:
  version: "26.9.4"
  # upstream tags use a zero-padded month, PyPI normalizes it away
  tag: "26.09.4"
  core_i18n_commit: 49925703d0e1c2328cae2b7f7ade286ed147976d
  desktop_ftl_commit: 8a58eb9663b6f78528198a1be9a72a4896ec2c83

package:
  name: anki
  version: ${{ version }}

source:
  - url: https://github.com/ankitects/anki/archive/refs/tags/${{ tag }}.tar.gz
    sha256: 1328f316e7bb32bf56572a7b6cb6aad6f99694c8642719acf4390b0f3f7c7933
    patches:
      - patches/0001-Allow-overriding-the-Python-interpreter-used-to-loca.patch
      - patches/0002-Call-the-ruff-executable-directly-when-formatting-ge.patch
  # git submodules with the translation files, required by the anki_i18n crate
  - url: https://github.com/ankitects/anki-core-i18n/archive/${{ core_i18n_commit }}.tar.gz
    sha256: 17ff545c542cb3c1962ed903d01b1506c114befe44560f347756561fd8a09e49
    target_directory: ftl/core-repo
  - url: https://github.com/ankitects/anki-desktop-ftl/archive/${{ desktop_ftl_commit }}.tar.gz
    sha256: dc7af677b02c337d8634267640bd909c1758d2cdead94c900eddaabe3b618630
    target_directory: ftl/qt-repo

build:
  number: 0
  # rsbridge enables pyo3's `abi3-py39`, so one limited-API build serves every CPython.
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      ANKI_TAG: ${{ tag }}
    file: build

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
    - python
    - mypy-protobuf
    - ruff
    - libprotobuf
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
  host:
    - python
    - if: is_abi3
      then: python-abi3
    - pip
    - hatchling
    - protobuf
  run:
    - python
    - decorator
    - markdown
    - orjson
    - ${{ pin_compatible('protobuf', lower_bound='x.x', upper_bound='8') }}
    - requests
    - pysocks
    - typing_extensions
    - if: linux
      then: distro

tests:
  - python:
      imports:
        - anki
        - anki.collection
      pip_check: true
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
  - files:
      recipe:
        - test_anki.py
    script:
      - python test_anki.py
  - if: is_abi3
    then:
      script:
        - if: win
          then: abi3audit %SP_DIR%\anki\_rsbridge.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit $SP_DIR/anki/_rsbridge.so -s -v --assume-minimum-abi3 ${{ python_min }}
      requirements:
        run:
          - abi3audit

about:
  homepage: https://apps.ankiweb.net/
  summary: Python library for Anki, the spaced repetition flashcard program
  description: |
    Core Python library for Anki. It wraps Anki's Rust backend and exposes the
    API used by the desktop app and add-ons to read and write collections,
    notes, cards, decks and to run the scheduler.
  license: AGPL-3.0-or-later AND BSD-3-Clause AND CC-BY-4.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/ankitects/anki
  documentation: https://addon-docs.ankiweb.net/

extra:
  recipe-maintainers:
    - pavelzw
