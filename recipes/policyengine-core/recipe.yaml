context:
  version: "3.36.1"

package:
  name: policyengine-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/policyengine-core/policyengine_core-${{ version }}.tar.gz
  sha256: c428835fc481794cee2eb858c0846a360fc52a6ee89b7fcc55fa42e77251d4ae
  patches:
    - patches/0001-relax-pyvis-floor.patch

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - dpath <3
    - h5py >=3,<4
    - huggingface_hub >=0.25.1
    - ipython >=8,<9
    - microdf-python >=1.0.0
    - numexpr <3
    - numpy >=2.1.0,<3
    - pandas >=1
    - plotly >=5,<6
    - psutil >=6,<7
    - pytest >=8,<10
    - pyvis >=0.3.2
    - requests >=2,<3
    - sortedcontainers <3
    - standard-imghdr
    - wheel <1

tests:
  - python:
      imports:
        - policyengine_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PolicyEngine/policyengine-core
  summary: Core engine for PolicyEngine tax-benefit microsimulation models
  license: AGPL-3.0-only
  license_file: LICENSE
  repository: https://github.com/PolicyEngine/policyengine-core

extra:
  recipe-maintainers:
    - MementoRC
