schema_version: 1

context:
  version: "0.5.0"

package:
  name: dataclass-extensions
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/dataclass-extensions/dataclass_extensions-${{ version }}.tar.gz
  sha256: 4308b28a0d3eeea16cfd7e4bd49c06b803d030df5ecd74349559f9140263ec7a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions
    - pyyaml

tests:
  - python:
      imports:
        - dataclass_extensions
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Additional functionality for Python dataclasses
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/epwalsh/dataclass-extensions

extra:
  recipe-maintainers:
    - xhochy
