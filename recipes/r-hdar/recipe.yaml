schema_version: 1

context:
  version: "1.0.9"

package:
  name: r-hdar
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/hdar_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/hdar/hdar_${{ version }}.tar.gz
  sha256: a14fe299ca0a642128f3859e6d7f3172ccc84485b1b52003ec23e7fe44aeb4e0

build:
  number: 0
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
    - r-htmltools
    - r-httr2
    - r-jsonlite
    - r-magrittr
    - r-progress
    - r-r6
    - r-scales
    - r-stringr
  run:
    - r-base
    - r-htmltools
    - r-httr2
    - r-jsonlite
    - r-magrittr
    - r-progress
    - r-r6
    - r-scales
    - r-stringr

tests:
  - r:
      libraries:
        - hdar

about:
  license: GPL-3.0-or-later
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  summary: 'REST API Client for Accessing Data on WEkEO HDA V2'
  description: |-
    Provides seamless access to the WEkEO Harmonised Data Access (HDA) API,
    enabling users to query, download and process data efficiently from the
    HDA platform. It integrates the HDA datasets into R workflows, including
    interactive authentication, asynchronous search and order handling, and
    download of the resulting files.
  homepage: https://www.wekeo.eu/
  repository: https://github.com/eea/hdar
  documentation: https://cran.r-project.org/package=hdar

extra:
  recipe-maintainers:
    - MatMatt
