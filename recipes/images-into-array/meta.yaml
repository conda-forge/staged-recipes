{% set name = "images-into-array" %}
{% set version = "3.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/images_into_array-{{ version }}.tar.gz
  sha256: 12016e1d79ff1933858599c0704e466e05fd64b080a18c5fec5739fa5e339e04

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.8
    - pip
  run:
    - python >=3.8
    - numpy
    - opencv
    - tqdm

test:
  imports:
    - images_into_array
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/sujitmandal/images-into-array
  summary: Convert multiple images into NumPy arrays and different color spaces
  license: MIT
  license_file: LICENSE
  doc_url: https://sujitmandal.github.io/images-into-array/
  dev_url: https://github.com/sujitmandal/images-into-array/

extra:
  recipe-maintainers:
    - sujitmandal
