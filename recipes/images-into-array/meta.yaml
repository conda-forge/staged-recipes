{% set name = "images-into-array" %}
{% set version = "3.0.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 12016e1d79ff1933858599c0704e466e05fd64b080a18c5fec5739fa5e339e04

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - python >=3.6

test:
  imports:
    - images_into_array

about:
  home: "https://github.com/sujitmandal/images-into-array"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Convert Multiple Images into a Array and Different Color Spaces into a Array"
  doc_url: https://sujitmandal.github.io/images-into-array/
  dev_url: https://github.com/sujitmandal/images-into-array

extra:
  recipe-maintainers:
    - sujitmandal