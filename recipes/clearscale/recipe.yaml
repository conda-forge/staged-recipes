schema_version: 1

context:
  version: "0.9.0"

package:
  name: clearscale
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/clearscale/clearscale-${{ version }}.tar.gz
  sha256: a4172af29390d34ede9d6c4c184d8c97f11e296be5c48d792c8edbf082022538

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - clearscale
        - clearscale.ome_zarr
        - clearscale.characterization
        - clearscale.types
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - 3.*
  - script:
      - python -c "from importlib.metadata import version; import clearscale; assert version('clearscale') == clearscale.__version__ == '${{ version }}'"
      - python -m pytest -q tests
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    files:
      source:
        - tests/

about:
  homepage: https://github.com/ilastik/clearscale
  summary: Clear multiscale image metadata manipulation
  description: |
    clearscale is a dependency-free Python library for handling multiscale
    image metadata. It provides an abstraction layer over metadata formats
    like OME-Zarr, along with tools for creating and manipulating metadata 
    independently of data processing.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE
    - LICENSE-MIT
    - LICENSE-APACHE
  documentation: https://clearscale.readthedocs.io/
  repository: https://github.com/ilastik/clearscale

extra:
  recipe-maintainers:
    - btbest
