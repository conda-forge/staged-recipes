schema_version: 1

context:
  posix: '"m2-" if win else ""'
  native: '"m2w64-" if win else ""'

package:
  name: r-rtmb
  version: ${{ version }}

source:
  - url: https://cran.r-project.org/src/contrib/RTMB_${{ version }}.tar.gz
    sha256: a87b21eb5b30071c702b6b45866dfd2ee2aee51d78da0cbf4fdab5d7c1454635
  - url: https://raw.githubusercontent.com/kaskr/RTMB/refs/heads/master/LICENSE
    sha256: 77edd1e10e3d76e590e4c8f0692ce1446a5539196a84b65323a1f51c0da69668
    file_name: LICENSE

build:
  number: 0
  script: R CMD INSTALL --build .
  merge_build_and_host_envs: true
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  build:
    - if: build_platform != target_platform
      then: cross-r-base ${{ r_base }}
    - if: unix
      then: autoconf
    - ${{ stdlib('c') }}
    - if: unix
      then: ${{ compiler('c') }}
    - if: win
      then: ${{ compiler('m2w64_c') }}
    - if: unix
      then: ${{ compiler('cxx') }}
    - if: win
      then: ${{ compiler('m2w64_cxx') }}
    - if: win
      then: m2-base
  host:
    - r-MASS
    - r-Matrix
    - r-Rcpp >=1.0.9
    - r-TMB >=1.9.7
    - r-base
    - r-methods
  run:
    - r-MASS
    - r-Matrix
    - r-Rcpp >=1.0.9
    - r-TMB >=1.9.7
    - r-base
    - r-methods

tests:
  - script:
      - if: not win
        then: $R -e "library('RTMB')"
      - if: win
        then: "\"%R%\" -e \"library('RTMB')\""

about:
  summary: Native 'R' interface to 'TMB' (Template Model Builder) so models can be written entirely in 'R' rather than 'C++'. Automatic differentiation, to any order, is available for a rich subset of 'R' features, including linear algebra for dense and sparse matrices, complex arithmetic, Fast Fourier Transform, probability distributions and special functions. 'RTMB' provides easy access to model fitting and validation following the principles of Kristensen, K., Nielsen, A., Berg, C. W., Skaug, H., & Bell, B. M. (2016) <DOI:10.18637/jss.v070.i05> and Thygesen, U.H., Albertsen, C.M., Berg,
    C.W. et al. (2017) <DOI:10.1007/s10651-017-0372-4>.
  license: GPL-2.0-or-later
  license_file: LICENSE
  homepage: https://github.com/kaskr/RTMB

extra:
  recipe-maintainers:
    - conda-forge/r
    - ccwang002
