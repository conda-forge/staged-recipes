schema_version: 1

context:
  version: 0.0.3

package:
  name: raddb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/raddb/raddb-${{ version }}.tar.gz
  sha256: c67b2cf705fb34ca50e64d945113c9fdd7f2c30e6f77b11710c7ca782e4ac045

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.11
    - setuptools >=77.0.0
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >=3.11
    - numpy
    - pandas
    - polars
    - geopandas
    - shapely >=2.0
    - pyproj >=3.0
    - xarray
    - pyyaml
    - pyarrow
    - matplotlib-base
    - netcdf4
    - zarr

tests:
  - python:
      imports:
        - raddb
      pip_check: true

about:
  summary: Archive and query radar data in partitioned Parquet files from xarray DataTree objects
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/raddb/

extra:
  recipe-maintainers:
    - ghiggi
