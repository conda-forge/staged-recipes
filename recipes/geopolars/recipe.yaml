context:
  version: "0.1.0a4"
  # 0.1.0a4 -> 0.1.0-alpha.4, the version upstream tags with and reports as
  # geopolars.__version__
  upstream_version: ${{ version | replace("a", "-alpha.") }}
  tag: v${{ upstream_version }}

package:
  name: geopolars
  version: ${{ version }}

source:
  url: https://github.com/pola-rs/geopolars/archive/refs/tags/${{ tag }}.tar.gz
  sha256: 00881b27baa449fae7e13bf4d42067d5de5f57872773a152f381a03ef1116425
  patches:
    - patches/0001-build-with-maturin-1.x.patch

build:
  number: 0
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # Never let prost-build fall back to compiling its vendored protobuf with
      # cmake; ${PROTOC} from libprotobuf is enough. See build.sh for details.
      PROTOC_NO_VENDOR: "1"
    file: build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    # Only to satisfy prost-build's build script, see build.sh.
    - libprotobuf
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.0,<2
  host:
    - python
    - if: is_abi3
      then:
        - python-abi3
    - pip
    - maturin >=1.0,<2
  run:
    - python
    - polars >=0.14.19
    - pyarrow >=4.0
    - numpy >=1.16.0

tests:
  - python:
      imports:
        - geopolars
        - geopolars.datasets
      pip_check: true
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
  - package_contents:
      site_packages:
        - geopolars/__init__.py
        - geopolars/datasets/naturalearth_lowres.arrow
        - if: is_abi3
          then: geopolars/geopolars.${{ 'abi3.so' if unix else 'pyd' }}
          else: geopolars/geopolars.${{ '*.so' if unix else '*.pyd' }}
  - if: is_abi3
    then:
      requirements:
        run:
          - abi3audit
      script:
        - if: unix
          then: abi3audit $SP_DIR/geopolars/geopolars.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit %SP_DIR%\geopolars\geopolars.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
  - script:
      - python -c "import geopolars; assert geopolars.__version__ == '${{ upstream_version }}'"
      # Exercise the compiled geo kernels through the Python API.
      - python test_geopolars.py
    files:
      recipe:
        - test_geopolars.py

about:
  homepage: https://github.com/pola-rs/geopolars
  summary: Geospatial extensions for Polars
  description: |
    GeoPolars extends the Polars DataFrame library for use with geospatial
    data. It uses GeoArrow as the internal memory model, is written in Rust
    with bindings to Python, and is multithreading capable.

    At this point GeoPolars is a prototype and should not be considered
    production-ready.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/pola-rs/geopolars
  documentation: https://docs.rs/geopolars

extra:
  recipe-maintainers:
    - pavelzw
