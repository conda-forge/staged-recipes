schema_version: 1

context:
  version: 0.1.0

package:
  name: opentile-jpeg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentile-jpeg/opentile_jpeg-${{ version }}.tar.gz
  sha256: a54247279e94781b08238fe92d974aba8d8012fde6077b0c4818314034449b2e

build:
  number: 0
  script:
    - if: unix
      then:
        - |
          ${{ PYTHON }} -c '
          p = open("CMakeLists.txt").read()
          p = p.replace("-DWITH_TESTS=0", "-DWITH_TESTS=0 -DCMAKE_INSTALL_LIBDIR=lib")
          open("CMakeLists.txt", "w").write(p)
          '
        - export CFLAGS="${CFLAGS} -include stdio.h -include stddef.h -include stdint.h"
        - export CXXFLAGS="${CXXFLAGS} -include stdio.h -include stddef.h -include stdint.h"
    - >-
      ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
      -Ccmake.verbose=true
      -Cbuild.verbose=true

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - nanobind >=2.2
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.18
    - pkg-config
    - nasm
    - if: unix
      then:
        - make
      else:
        - ninja
  host:
    - python ${{ python_min }}.*
    - scikit-build-core >=0.10
    - nanobind >=2.2
    - libjpeg-turbo
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - pillow >=10.0
    - hypothesis >=6.100

tests:
  - python:
      imports:
        - opentile_jpeg
      pip_check: true

about:
  summary: "Lossless JPEG operations in the DCT-coefficient domain: crop, compose, optimize, and fill without re-encoding."
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/opentile-jpeg/

extra:
  recipe-maintainers:
    - sarthakpati
