schema_version: 1

context:
  version: 0.1.0

package:
  name: opentile-jpeg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentile-jpeg/opentile_jpeg-${{ version }}.tar.gz
  sha256: a54247279e94781b08238fe92d974aba8d8012fde6077b0c4818314034449b2e

build:
  number: 0
  script:
    - if: unix
      then:
        - |
          ${{ PYTHON }} -c '
          import os
          for root, _, files in os.walk("."):
              for fn in files:
                  path = os.path.join(root, fn)
                  if fn.endswith(".py"):
                      s = open(path, encoding="utf-8").read()
                      s2 = s.replace("\"-DWITH_TESTS=0\"", "\"-DWITH_TESTS=0\", \"-DCMAKE_INSTALL_LIBDIR=lib\"")
                      s2 = s2.replace("\x27-DWITH_TESTS=0\x27", "\x27-DWITH_TESTS=0\x27, \x27-DCMAKE_INSTALL_LIBDIR=lib\x27")
                      if s2 != s:
                          open(path, "w", encoding="utf-8").write(s2)
                  elif fn == "CMakeLists.txt" or fn.endswith(".cmake"):
                      s = open(path, encoding="utf-8").read()
                      s2 = s.replace("-DWITH_TESTS=0", "-DWITH_TESTS=0 -DCMAKE_INSTALL_LIBDIR=lib")
                      if s2 != s:
                          open(path, "w", encoding="utf-8").write(s2)
          '
        - export CFLAGS="${CFLAGS} -include stdio.h -include stddef.h -include stdint.h"
        - export CXXFLAGS="${CXXFLAGS} -include stdio.h -include stddef.h -include stdint.h"
    - if: linux
      then:
        # conda's CMAKE_ARGS sets CMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY, so
        # find_library cannot see the absolute libjpeg-turbo prefix. The -C define
        # below does not take effect; this appended entry does.
        - export CMAKE_ARGS="${CMAKE_ARGS} -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH"
    - >-
      ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
      -Ccmake.verbose=true
      -Cbuild.verbose=true
      -Ccmake.define.CMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
      -Ccmake.define.CMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - nanobind >=2.2
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.18
    - pkgconf
    - nasm
    - if: unix
      then:
        - make
      else:
        - ninja
  host:
    - python
    - scikit-build-core >=0.10
    - nanobind >=2.2
    - pip
  run:
    - python
    - numpy >=1.22

tests:
  - python:
      imports:
        - opentile_jpeg
      pip_check: true

about:
  summary: "Lossless JPEG operations in the DCT-coefficient domain: crop, compose, optimize, and fill without re-encoding."
  license: Apache-2.0 AND IJG AND Zlib
  license_file:
    - LICENSE
    - licenses/libjpeg-turbo-LICENSE.md
    - licenses/libjpeg-turbo-README.ijg
  homepage: https://pypi.org/project/opentile-jpeg/

extra:
  recipe-maintainers:
    - sarthakpati
