schema_version: 1

context:
  name: ppx_devtools-optcomp
  version: "0.1"
  build_number: 0

  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  # ocaml_<platform> matchspec tail: version, plus the gcc_ (MinGW) track on non-unix
  ocaml_spec: ${{ ocaml_compiler_version ~ (".*" if unix else ".* gcc_*") }}

package:
  name: ocaml-ppx-devtools-optcomp
  version: ${{ version }}

source:
  url: https://github.com/ocsigen/ppx_devtools/releases/download/${{ version }}/ppx_devtools-${{ version }}.tbz
  sha256: 46ad4e62a213e3c0852c02cd1cc182d88ec89afa284a45a4316cfb3ffc0bcb9c

build:
  number: ${{ build_number }}
  string: ${{ "gcc_" if not unix }}h${{ hash }}_${{ build_number }}
  script: bash ${{ RECIPE_DIR }}/build.sh

requirements:
  build:
    - ${{ compiler("ocaml") }}
    # compiler("ocaml") renders no toolchain track; name the gcc_ (MinGW) one on non-unix
    - ocaml_${{ target_platform }} ${{ ocaml_spec }}
    # no C stubs; ocamlopt still links through the C compiler on non-unix
    - if: unix
      then:
        - ${{ stdlib("c") }}
      else:
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
    - ocaml-dune >=3.20
    - ${{ m2 }}make
    - if: not unix
      then:
        - m2-bash
        - m2-coreutils
        - m2-sed
        - m2-grep
        - m2-findutils
  host:
    # library: ocaml's run_export pins the compiler patch version
    - ocaml ${{ ocaml_compiler_version }}.*
    # the noarch ocaml metapackage does not pin the non-unix toolchain track
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_spec }}
    - ocaml-ppxlib >=0.33
  run:
    - ocaml-ppxlib >=0.33
  # the ocaml run_export does not encode the non-unix toolchain track
  run_constraints:
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_spec }}

tests:
  - package_contents:
      files:
        - ${{ library }}lib/ocaml/${{ name }}/META
        - ${{ library }}lib/ocaml/${{ name }}/ppx_devtools_optcomp.cma
        - ${{ library }}lib/ocaml/${{ name }}/ppx_devtools_optcomp.cmxa
        - ${{ library }}lib/ocaml/${{ name }}/ppx_devtools_optcomp.a
        - ${{ library }}lib/ocaml/${{ name }}/ppx_devtools_optcomp.cmxs
  - script: bash testing/test_optcomp.sh
    files:
      recipe:
        - testing/test_optcomp.sh
    requirements:
      run:
        - ocaml ${{ ocaml_compiler_version }}.*
        - if: not unix
          then:
            - ocaml_${{ target_platform }} ${{ ocaml_spec }}
        - ocaml-dune >=3.20
        - if: unix
          then:
            - ${{ compiler("c") }}
        - if: not unix
          then:
            - m2-bash
            - m2-coreutils

about:
  homepage: https://github.com/ocsigen/ppx_devtools
  repository: https://github.com/ocsigen/ppx_devtools
  license: LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
  license_file: LICENSE
  summary: Lightweight ppx for conditional compilation
  description: |
    ppx_devtools-optcomp gates code at compile time with [@if] attributes,
    depending on the OCaml version, the operating system or the compiler flavour.

extra:
  recipe-maintainers:
    - MementoRC
    - ManuelLerchner
