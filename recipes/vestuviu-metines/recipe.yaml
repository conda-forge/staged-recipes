context:
  name: vestuviu-metines
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ello-lithuania/vestuviu-metines/archive/refs/tags/python-v${{ version }}.tar.gz
  sha256: 402fc6988e4a535307c208c687eae5e3309aa16256986030fed20bb09965a44f

build:
  number: 0
  noarch: python
  script: python -m pip install ./python -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - vestuviu-metines = vestuviu_metines.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - vestuviu_metines
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - vestuviu-metines --help
      - vestuviu-metines --version
      - vestuviu-metines 25
      - vestuviu-metines --data 2010-06-12

about:
  homepage: https://vestuviumetines.lt/
  summary: 'Lithuanian wedding anniversary names (vestuvių metinės): Python library and CLI'
  description: |
    Lietuviški vestuvių metinių pavadinimai pagal metus ir vestuvių datą.
    Lithuanian wedding anniversary names by year or by wedding date, as a Python library and CLI.
    Code MIT, data CC BY-SA 4.0.
  license: MIT AND CC-BY-SA-4.0
  license_file:
    - python/LICENSE
    - python/DATA_LICENSE
  documentation: https://vestuviumetines.lt/
  repository: https://github.com/ello-lithuania/vestuviu-metines

extra:
  recipe-maintainers:
    - ello-lithuania
