context:
  version: "2.0.1"

package:
  name: pyjson5
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pyjson5/pyjson5-${{ version }}.tar.gz
  sha256: a5b0e322e847b198a50d8a1ef16d6b2b19129644dc018d76773e81ef1487ca39

build:
  skip:
    - match(python, "<3.8")
  script: python -m pip install . -vv
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - cython <4,>=3.1
    - setuptools >=61
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - pyjson5
      pip_check: true

about:
  homepage: https://github.com/Kijewski/pyjson5
  summary: JSON5 serializer and parser for Python 3 written in Cython.
  documentation: https://pyjson5.readthedocs.io/
  repository: https://github.com/Kijewski/pyjson5
  license: MIT AND Apache-2.0
  license_file:
    - LICENSE.MIT
    - LICENSE.Apache
    - third-party/json5-tests/LICENSE.md

extra:
  recipe-maintainers:
    - jack-pappas
