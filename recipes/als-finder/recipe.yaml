schema_version: 1

context:
  version: 1.1.1

package:
  name: als-finder
  version: ${{ version }}

source:
  url: https://github.com/cms-2024-hudak/als-finder/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 26cb4b4459aad389b0758acd3f90d75b035a56d2c41707ff1876548a5a14f4ca

build:
  noarch: python
  number: 0
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - als-finder = als_finder.cli:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools_scm
    - pip
  run:
    - python >=${{ python_min }}
    - geopandas
    - requests
    - click
    - python-dotenv
    - shapely
    - pyproj
    - tqdm
    - pyogrio
    - pdal
    - python-pdal
    - pystac
    - stac-validator
    - psutil

tests:
  - python:
      imports:
        - als_finder
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - als-finder --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/cms-2024-hudak/als-finder
  repository: https://github.com/cms-2024-hudak/als-finder
  license: MIT
  license_file: LICENSE
  summary: Cloud-native CLI engine for discovering raw LiDAR point cloud metadata globally.

extra:
  recipe-maintainers:
    - jgrn307
