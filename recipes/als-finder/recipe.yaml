schema_version: 1

context:
  version: 1.2.0

package:
  name: als-finder
  version: ${{ version }}

source:
  url: https://github.com/cms-2024-hudak/als-finder/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 3dcac46f9c50715ce9f5199272ba997ad79ba93714e2bdaaff2d8af29acce356

build:
  noarch: python
  number: 0
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - als-finder = als_finder.cli:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools_scm
    - pip
  run:
    - python >=${{ python_min }}
    - geopandas
    - requests
    - click
    - python-dotenv
    - shapely
    - pyproj
    - tqdm
    - pyogrio
    - pdal
    - python-pdal
    - pystac
    - stac-validator
    - psutil

tests:
  - python:
      imports:
        - als_finder
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - als-finder --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/cms-2024-hudak/als-finder
  repository: https://github.com/cms-2024-hudak/als-finder
  license: MIT
  license_file: LICENSE
  summary: CLI engine for discovering, streaming, and partitioning raw LiDAR point cloud data globally.

extra:
  recipe-maintainers:
    - jgrn307
