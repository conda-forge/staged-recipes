schema_version: 1
context:
  python_min: '3.10'
package:
  name: datalad-metadata-model
  version: 0.3.11
source:
  url: https://files.pythonhosted.org/packages/1a/00/74e4a9efa33645dfb896d2a762bb2d131c97015187a7d7568bb21576b77e/datalad-metadata-model-0.3.11.tar.gz
  sha256: 95a113bb0eb5a27bf61b4a0ea6111f7cb01d707c0eba98359d9b8b87fcb078b4
build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -v
  python:
    entry_points:
    - mdc = tools.metadata_creator.main:main
requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools
  - wheel
  run:
  - python >=${{ python_min }}
  - appdirs
  - click
  - fasteners
tests:
- python:
    imports:
    - dataladmetadatamodel
    pip_check: true
about:
  homepage: https://github.com/christian-monch/metadata-model
  summary: Datalad Metadata Model
  license: MIT
  license_file: LICENSE
extra:
  recipe-maintainers:
  - Shavindra
