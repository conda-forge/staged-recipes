context:
  version: "4.5.0"

package:
  name: google-cloud-asset
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-asset/google_cloud_asset-${{ version }}.tar.gz
  sha256: 55ca670d06046d6e8cf80f5fcd680c10d31c7d8407659904975fbbd41b757c97

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core-grpc >=2.28.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - google-cloud-access-context-manager >=0.2.2,<1.0.0
    - google-cloud-org-policy >=1.13.1,<2.0.0
    - google-cloud-os-config >=1.20.1,<2.0.0
    - grpc-google-iam-v1 >=0.14.2,<1.0.0
    - grpcio >=1.59.0,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - google.cloud.asset
        - google.cloud.asset_v1
        - google.cloud.asset_v1p1beta1
        - google.cloud.asset_v1p2beta1
        - google.cloud.asset_v1p5beta1
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-asset
  summary: Google Cloud Asset API client library
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://cloud.google.com/python/docs/reference/cloudasset/latest
  repository: https://github.com/googleapis/google-cloud-python

extra:
  recipe-maintainers:
    - pb01ka
