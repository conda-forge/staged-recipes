schema_version: 1

context:
  version: "4.0.1"

package:
  name: python-redis-lock
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/python-redis-lock/python_redis_lock-${{ version }}.tar.gz
  sha256: 57995e13dce196301138d710d4f132d667c200cd814718e081bf299d6cf11d70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80
    - pip
  run:
    - python >=${{ python_min }}
    - redis-py >=2.10.0

tests:
  - python:
      imports:
        - redis_lock
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: Lock context manager implemented via redis SETNX/BLPOP.
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/python-redis-lock/
  documentation: https://python-redis-lock.readthedocs.io/

extra:
  recipe-maintainers:
    - jsmolic
