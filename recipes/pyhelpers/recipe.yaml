schema_version: 1

context:
  version: "2.5.2"
  python_min: "3.12"

package:
  name: pyhelpers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyhelpers/pyhelpers-${{ version }}.tar.gz
  sha256: 7a1c2982363bdaaa2fc557c7ce6b47eeda501ccf0bfe28a8db31a38a6db90740

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - psycopg2
    - pyproj
    - requests
    - shapely
    - sqlalchemy

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pyhelpers
      pip_check: true

about:
  summary: An open-source toolkit for facilitating Python users' data manipulation tasks.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mikeqfu/pyhelpers
  documentation: https://pyhelpers.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - mikeqfu
