context:
  name: taxrebalance
  version: "0.2.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/taxrebalance/taxrebalance-${{ version }}.tar.gz
  sha256: e307d7ba69a0faf82166fac8bcea973c1dc106e411d432d9e14937cc8ec956f2

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.26,<3
    - cvxpy >=1.6.5,<2
    - osqp >=1.0.4,<1.1

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - taxrebalance
        - tax_rebalancing
      pip_check: true

about:
  homepage: https://github.com/garroshub/taxrebalance
  summary: 'Tax-aware portfolio rebalancing with Canadian ACB and U.S. tax-lot models'
  license: MIT
  license_file: LICENSE
  repository: https://github.com/garroshub/taxrebalance
  documentation: https://garroshub.github.io/taxrebalance/

extra:
  recipe-maintainers:
    - garroshub
