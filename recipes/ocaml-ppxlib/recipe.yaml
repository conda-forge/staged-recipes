context:
  version: "0.38.0"

package:
  name: ocaml-ppxlib
  version: ${{ version }}

source:
  url: https://github.com/ocaml-ppx/ppxlib/releases/download/${{ version }}/ppxlib-${{ version }}.tbz
  sha256: 89e049b3102f6670a213d34d802ea3ab0fc530a8959d2f1a1e8db830063429a3

build:
  number: 0
  skip:
    - win
  script:
    - dune build --profile=release -p ppxlib @install
    - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" ppxlib

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler("ocaml") }}
    - ocaml-dune >=3.8
  host:
    - ocaml >=4.08.0,<5.6.0
    - ocaml-compiler-libs >=0.11.0
    - ocaml-ppx-derivers >=1.0
    - ocaml-sexplib0 >=0.12
    - ocaml-stdlib-shims
  run:
    # ppxlib's META requires these, so consumers need them too.
    - ocaml-compiler-libs >=0.11.0
    - ocaml-ppx-derivers >=1.0
    - ocaml-sexplib0 >=0.12
    - ocaml-stdlib-shims

tests:
  - package_contents:
      strict: true
      files:
        - lib/ocaml/ppxlib/**
        - doc/ppxlib/**

about:
  homepage: https://github.com/ocaml-ppx/ppxlib
  repository: https://github.com/ocaml-ppx/ppxlib
  documentation: https://ocaml-ppx.github.io/ppxlib/
  summary: Standard infrastructure for ppx rewriters
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - ManuelLerchner
    - MementoRC
