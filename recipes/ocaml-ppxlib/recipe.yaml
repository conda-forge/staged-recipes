schema_version: 1

context:
  name: ppxlib
  version: "0.38.0"

  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  c_toolchain: ${{ "" if unix else "gcc_*" }}

package:
  name: ocaml-${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/ocaml-ppx/ppxlib/releases/download/${{ version }}/ppxlib-${{ version }}.tbz
  sha256: 89e049b3102f6670a213d34d802ea3ab0fc530a8959d2f1a1e8db830063429a3

build:
  number: 0
  script: bash ${{ RECIPE_DIR }}/building/build_dune_pkg.sh ppxlib

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
      else:
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
    # Windows: conda-forge ocaml has gcc_ and vs2022_ tracks; these recipes use the gcc (MinGW) track only.
    - ocaml 5.4.* ${{ c_toolchain }}
    - ocaml-dune 3.24.*
    - ${{ m2 }}make
    - if: not unix
      then:
        - m2-bash
  host:
    - ocaml 5.4.* ${{ c_toolchain }}
    - ocaml-compiler-libs >=0.11
    - ocaml-ppx-derivers >=1.0
    - ocaml-sexplib0 >=0.12
    - ocaml-stdlib-shims
  run:
    - ocaml-compiler-libs >=0.11
    - ocaml-ppx-derivers >=1.0
    - ocaml-sexplib0 >=0.12
    - ocaml-stdlib-shims

tests:
  - package_contents:
      files:
        - ${{ library }}lib/ocaml/${{ name }}/META
        - ${{ library }}lib/ocaml/${{ name }}/ppxlib.cmxa
        - ${{ library }}lib/ocaml/${{ name }}/ast/ppxlib_ast.cmxa
        - ${{ library }}lib/ocaml/${{ name }}/astlib/astlib.cmxa
  - script: bash testing/test_ppxlib.sh
    files:
      recipe:
        - testing/test_ppxlib.sh
    requirements:
      run:
        - ocaml 5.4.* ${{ c_toolchain }}
        - ocaml-dune 3.24.*
        - if: unix
          then:
            - ${{ compiler("c") }}
        - if: not unix
          then:
            - m2-bash

about:
  homepage: https://github.com/ocaml-ppx/ppxlib
  repository: https://github.com/ocaml-ppx/ppxlib
  license: MIT
  license_file: LICENSE.md
  summary: Standard infrastructure for ppx rewriters

extra:
  recipe-maintainers:
    - MementoRC
    - ManuelLerchner
