context:
  version: "2.0.0"

package:
  name: pycrashreport
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pycrashreport/pycrashreport-${{ version }}.tar.gz
  sha256: 31d5e32faa3a047fe01e923bde3eaf1ec86b23e264babf2fc8f7b61fe4812342

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pycrashreport=pycrashreport.__main__:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
  run:
    - python >=${{ python_min }}
    - typer

tests:
  - python:
      imports:
        - pycrashreport
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - pycrashreport --help

about:
  homepage: https://github.com/doronz88/pycrashreport
  summary: Parser for Apple crash reports
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
