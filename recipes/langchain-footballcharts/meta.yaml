{% set name = "langchain-footballcharts" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/langchain_footballcharts-{{ version }}.tar.gz
  # Obtain exact sdist sha256 via: curl -sL https://pypi.org/pypi/langchain-footballcharts/0.1.0/json | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256'
  sha256: 867ef03afe8be63f2921b53f580db0db889b056b07826593ef15b6abf7d9c8ad

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - langchain-core >=0.2.0
    - pydantic >=2.0
    - requests >=2.28

test:
  imports:
    - langchain_footballcharts
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://www.football-charts.com/developers
  summary: LangChain tools for Football Charts — tables, results, fixtures, goal timing, and Monte Carlo projections across 93 football leagues.
  license: MIT
  license_file: LICENSE
  doc_url: https://www.football-charts.com/developers
  dev_url: https://github.com/ddevetak/langchain-footballcharts

extra:
  recipe-maintainers:
    - ddevetak
