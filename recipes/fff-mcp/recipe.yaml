context:
    version: "0.11.0"

package:
    name: fff-mcp
    version: ${{ version }}

source:
    url: https://github.com/dmtrKovalenko/fff/archive/v${{ version }}.tar.gz
    sha256: 6451acd63168af029e3afc28faf534a9389b941d01467027a0e5e7bac180b26d

build:
    number: 0
    script:
        env:
            CARGO_PROFILE_RELEASE_STRIP: symbols
            CARGO_PROFILE_RELEASE_LTO: fat
        content:
            - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
            - if: unix
              then: cargo auditable install -j ${CPU_COUNT} --root "${PREFIX}" --path crates/fff-mcp --locked --no-track
              else: cargo auditable install -j %CPU_COUNT% --root "%PREFIX%" --path crates/fff-mcp --locked --no-track

requirements:
    build:
        - ${{ stdlib('c') }}
        - ${{ compiler('rust') }}
        - cargo-bundle-licenses
        - cargo-auditable

tests:
    - script:
          - fff-mcp --version
          - fff-mcp --help
    - package_contents:
          strict: true
          bin:
              - fff-mcp

about:
    homepage: https://github.com/dmtrKovalenko/fff
    summary: "A file search toolkit for humans and AI agents. Really fast."
    description: |
        The fastest and the most accurate file search SDK for AI agents, Neovim, Rust, C, Python, Bun and NodeJS.
    license: MIT
    license_file:
        - LICENSE
        - THIRDPARTY.yml
    repository: https://github.com/dmtrKovalenko/fff

extra:
    recipe-maintainers:
        - XhstormR
