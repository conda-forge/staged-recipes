context:
  version: "0.1.0"

package:
  name: bayesline
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bayesline/bayesline-${{ version }}.tar.gz
  sha256: 34df4ec81921f32d831653f157037d44379e5fb0af0223d36ac6bcb910dd8f2a

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bayesline = BayesLine:console_main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - numba >=0.59

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - BayesLine
        - bayesline
      pip_check: true
  - script:
      - bayesline --version
      - python -m bayesline --version

about:
  homepage: https://wiki.ligo.org/Bursts/BayesWave/BayesLine
  summary: Bayesian power spectral density estimation for gravitational-wave strain data
  description: |
    BayesLine estimates the power spectral density of gravitational-wave
    strain data using a parallel-tempered reversible-jump MCMC. It models the
    smooth spectrum with an Akima spline, narrow instrumental lines with
    finite-duration Tukey-windowed Lorentzians, and optional broad spectral
    structure with Gaussian bumps.
  license: GPL-2.0-or-later
  license_file: LICENSE
  documentation: https://wiki.ligo.org/Bursts/BayesWave/BayesLine

extra:
  recipe-maintainers:
    - eXtremeGravityInstitute
