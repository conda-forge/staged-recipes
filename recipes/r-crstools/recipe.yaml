context:
  version: "1.2.0"

package:
  name: r-crstools
  version: ${{ version }}

source:
  url:
    - https://cran.r-project.org/src/contrib/crstools_${{ version }}.tar.gz
    - https://cran.r-project.org/src/contrib/Archive/crstools/crstools_${{ version }}.tar.gz
  sha256: cdbf1e28da9ee25d06a4606fa5961406e8186f9dc8c6d4d1dd5fa8c03981771a

build:
  noarch: generic
  number: 0
  skip:
    - win
  merge_build_and_host_envs: true
  script: R CMD INSTALL --build .

requirements:
  build:
    - r-base
    - ${{ "m2-zip" if win else "zip" }}
  host:
    - r-base
    - r-fields
    - r-sf
    - r-ggplot2
    - r-terra
    - r-cli
    - r-jpeg
    - r-rlang
  run:
    - r-base
    - r-fields
    - r-sf
    - r-ggplot2
    - r-terra
    - r-cli
    - r-jpeg
    - r-rlang

tests:
  - r:
      libraries:
        - crstools

about:
  homepage: https://evolecolgroup.github.io/crstools/
  summary: Tools to work with projections
  description: |
    Choose the appropriate map projection for a given application, visualise
    the resulting distortion, and georeference data from unknown projections.
  license: GPL-3.0-or-later
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  repository: https://github.com/EvolEcolGroup/crstools
  documentation: https://evolecolgroup.github.io/crstools/

extra:
  recipe-maintainers:
    - dramanica
