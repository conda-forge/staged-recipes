context:
  version: 27.0.0

package:
  name: tsgettoolbox-rivergages
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-rivergages/tsgettoolbox_rivergages-${{ version }}.tar.gz
  sha256: 5a99105b0e0ca57116fe695314b804fbab84dea4bba5210c0d7ef4eeda49ff8b

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80
    - pip
  run:
    - python >=${{ python_min }}
    - beautifulsoup4
    - pandas
    - platformdirs
    - requests
    - tsgettoolbox >=27.0.0

tests:
  - python:
      imports:
        - tsgettoolbox_rivergages
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Plugin for tsgettoolbox to retrieve data from the USACE Rivergages web service.
  description: |
    The 'tsgettoolbox_rivergages' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    USACE Rivergages web service.
  homepage: https://pypi.org/project/tsgettoolbox-rivergages/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
