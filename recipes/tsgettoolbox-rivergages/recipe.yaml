    tsgettoolbox_rivergages - Quick Guide
    =====================================
    The 'tsgettoolbox_rivergages' is a plugin-in for 'tsgettoolbox' that supplies
    a command line interface and Python library to get time-series data from the
    USACE Rivergages web service.  The tsgettoolbox_rivergages will work with
    Python 3.10+.

    Documentation
    -------------
    Reference documentation is at `tsgettoolbox_documentation`_.

    Installation
    ------------
    At the command line::

        $ pip install tsgettoolbox_rivergages

        OR

        $ conda install -c conda-forge tsgettoolbox_rivergages

    Usage Summary - Command Line
    ----------------------------
    Just run 'tsgettoolbox --help' to get a list of subcommands.  To get detailed
    help for a particular sub-command, for instance 'rivergages', type 'tsgettoolbox
    rivergages --help'.

    +-------------+---------+--------+---------+----------+-----------------------+
    | Sub-command | Spatial | Time   | Type    | Time     | Description           |
    |             | Extent  | Extent |         | Interval |                       |
    +=============+=========+========+=========+==========+=======================+
    | rivergages  | US      | varies | station | varies   | USACE river gages     |
    +-------------+---------+--------+---------+----------+-----------------------+

    Usage Summary - Python Library
    ------------------------------
    To use the tsgettoolbox in a project::

        from tsgettoolbox import tsgettoolbox
        df = tsgettoolbox.rivergages(
            "NAGA4",
            "HT",
            start_date="2015-11-04",
            end_date="2015-12-05"
        )
        print(df.head())

    Refer to the API Documentation at `tsgettoolbox_api`_.

    Usage Summary - Command Line
    ----------------------------

        tsgettoolbox rivergages \
            "NAGA4" \
            "HT" \
            --start_date="2015-11-04" \
            --end_date="2015-12-05" > output.csv

    Refer to the command line documentation at `tsgettoolbox_cli`_.

