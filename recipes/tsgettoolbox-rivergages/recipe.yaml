context:
  version: 27.0.0
  build_number: '0'

package:
  name: tsgettoolbox-rivergages
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/t/tsgettoolbox-rivergages/tsgettoolbox_rivergages-${{ version }}.tar.gz
  sha256: 5a99105b0e0ca57116fe695314b804fbab84dea4bba5210c0d7ef4eeda49ff8b

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.10
  - setuptools>=80
  - pip
  run:
  - python >=3.10
  - beautifulsoup4
  - pandas
  - platformdirs
  - requests
  - tsgettoolbox >=27.0.0

tests:
- python:
    imports:
    - tsgettoolbox_rivergages
    pip_check: true

