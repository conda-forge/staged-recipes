context:
  version: "1.0.1"

package:
  name: edcal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/edcal/edcal-${{ version }}.tar.gz
  sha256: f736a94aa10f8aaae32fcb3456111d277b361bdde3515c76e7366f5f03da89f9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - edcal = edcal.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - algodif >=1.1.0
    - numpy
    - scipy
    - h5py
    - joblib
    - pyside6
    - pyqtgraph

tests:
  - python:
      imports:
        - edcal
        - edcal.lib.utilities
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  homepage: https://github.com/algodif/edcal
  license: Apache-2.0
  license_file: LICENSE
  summary: GUI software for energy and q calibration of energy-dispersive X-ray detectors, built on Algodif

extra:
  recipe-maintainers:
    - nghia-vo
