# Recipe for typesafe-sdk, the dependency behind pandera's `decisions` extra.
# This package must land on conda-forge before the pandera-feedstock
# `pandera-decisions` subpackage can build.

schema_version: 1

context:
  name: typesafe-sdk
  version: "0.7.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name|replace("-", "_") }}-${{ version }}.tar.gz
  sha256: 1eeeb0dc80a7161d84896db42a5016dc0a7c8872fa16540b70163e5357b6d398

build:
  number: 0
  noarch: python
  # uv_build is the declared PEP 517 build backend; --no-build-isolation lets
  # conda provide it from the host environment.
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.11
    - pip
    - uv-build >=0.12.5,<0.14
  run:
    - python >=3.10
    - anyio >=4.0.0
    - httpx2 >=2.0.0
    - packaging >=24.0
    - pydantic >=2.12.0
    - pydantic-core >=2.41.1
    - tenacity >=9.0.0
    - truststore >=0.10.0
    - typing-extensions >=4.13.0

tests:
  - python:
      imports:
        - typesafe_sdk
      pip_check: true

about:
  homepage: https://typesafe.ai
  repository: https://github.com/typesafe-ai/typesafe-sdk-python
  documentation: https://docs.typesafe.ai/go/python-sdk
  summary: Python SDK for TypeSafe AI API
  description: |
    Python SDK for the TypeSafe AI API.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cosmicBboy
