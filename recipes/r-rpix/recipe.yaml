schema_version: 1

context:
  version: "0.6.0"

package:
  name: r-rpix
  version: ${{ version }}

source:
  # rpix is not on CRAN; it is released from GitHub tags.
  url: https://github.com/roaldarbol/rpix/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a311971a7d8767df933b2467130d555dc2de58016e4787273c2dbab617aeab71

build:
  number: 0
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
    - r-cli
    - r-jsonlite
    - r-lifecycle
    - r-processx
  run:
    - r-base
    - r-cli
    - r-jsonlite
    - r-lifecycle
    - r-processx

tests:
  - r:
      libraries:
        - rpix

about:
  homepage: https://roald-arboel.com/rpix/
  repository: https://github.com/roaldarbol/rpix
  documentation: https://roald-arboel.com/rpix/
  license: MIT
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/MIT
    - LICENSE
    - LICENSE.md
  summary: Manage R Project Dependencies with 'Pixi'
  description: |
    An interface to the 'Pixi' package manager (<https://pixi.sh>) from R.
    Add, remove and search for conda packages, and set up and work with
    'Pixi' projects from the R console.

extra:
  recipe-maintainers:
    - conda-forge/r
    - roaldarbol
