schema_version: 1

context:
  version: "6.0"
  test_modules:
    - zope.traversing.browser.tests
    - zope.traversing.tests.test_conveniencefunctions
    - zope.traversing.tests.test_dependencies
    - zope.traversing.tests.test_lang
    - zope.traversing.tests.test_namespacetrversal
    - zope.traversing.tests.test_presentation
    - zope.traversing.tests.test_publicationtraverse
    - zope.traversing.tests.test_skin
    - zope.traversing.tests.test_traverser
    - zope.traversing.tests.test_vh

package:
  name: zope.traversing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.traversing/zope_traversing-${{ version }}.tar.gz
  sha256: bd27945c4434f225ad451d8664d7b023306e40b6563060fce821e89f12b82412

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - transaction
    - zope.component
    - zope.i18n
    - zope.i18nmessageid
    - zope.interface >=4.0.4
    - zope.location >=3.7.0
    - zope.proxy
    - zope.publisher
    - zope.security

tests:
  - python:
      imports:
        - zope.traversing
        - zope.traversing.api
        - zope.traversing.adapters
        - zope.traversing.browser
        - zope.traversing.namespace
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # test_vhosting needs zope.browserresource, which itself depends on this package
      - python -m unittest -v ${{ test_modules | join(" ") }}
    requirements:
      run:
        - zope.annotation
        - zope.configuration
        - zope.tales
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.traversing
  repository: https://github.com/zopefoundation/zope.traversing
  documentation: https://zopetraversing.readthedocs.io
  summary: Resolving paths in the object hierarchy
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
