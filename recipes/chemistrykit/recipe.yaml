schema_version: 1

context:
  version: "0.2.1"

package:
  name: chemistrykit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chemistrykit/chemistrykit-${{ version }}.tar.gz
  sha256: e642862f93041373192c36b85f296cfeb3e583a8d7fea24d3486d93d434e9183

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.6
    - numba >=0.58
    - plotly >=5.15
    - sympy >=1.11
    - tqdm >=4.65

tests:
  - python:
      imports:
        - chemistrykit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cpoli/chemistrykit
  repository: https://github.com/cpoli/chemistrykit
  documentation: https://cpoli.github.io/chemistrykit/
  summary: Unified numerical toolkit for computational chemistry
  description: |
    Reaction kinetics, thermodynamics, quantum chemistry, electrochemistry, spectroscopy, and more, sharing common ODE integrators and chemical constants.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpoli
