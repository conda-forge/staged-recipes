schema_version: 1

context:
  name: numgrid
  version: "2.2.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/dftlibs/numgrid/archive/v${{ version }}.tar.gz
  sha256: 8805e006fc59c4d187d7d4b230acf2797729d984af7304eb6ab0420a4c8fb5a7

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - maturin build --release --locked --interpreter ${{ PYTHON }}
      - ${{ PYTHON }} -m pip install --no-deps --no-index --find-links target/wheels numgrid

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses

  host:
    - python
    - pip
    - maturin

  run:
    - python

tests:
  - python:
      imports:
        - numgrid
  - script:
      - python -c "import numgrid; r, w = numgrid.radial_grid_kk(100); assert len(r) == 100; assert len(w) == 100"

about:
  homepage: https://github.com/dftlibs/numgrid
  repository: https://github.com/dftlibs/numgrid
  documentation: https://github.com/dftlibs/numgrid
  license: MPL-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Numerical integration grid for molecules
  description: |
    NumGrid is a library that produces numerical integration grids for
    molecules based on atom coordinates, atom types, and basis set
    information. It provides Rust and Python bindings.

extra:
  recipe-maintainers:
    - jan-janssen
