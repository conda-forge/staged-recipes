context:
  version: "1.10.0"

package:
  name: timewarrior
  version: ${{ version }}

source:
  url: https://github.com/GothenburgBitFactory/timewarrior/releases/download/v${{ version }}/timew-${{ version }}.tar.gz
  sha256: a9c9966cfd9fed6c4d4895dc2de530902e736608f4033799af4fe06edf0dd438
  patches:
    - patches/0001-do-not-install-libshared.patch

build:
  number: 0
  script: build.sh
  skip:
    # Windows is explicitly unsupported upstream outside of WSL:
    # https://github.com/GothenburgBitFactory/timewarrior/issues/84
    - win

requirements:
  build:
    - ${{ compiler('c') }} 
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - make

tests:
  - script:
      # Make timewarrior directory to avoid prompt about its creation
      content: |
        mkdir ${HOME}/.timewarrior
        touch ${HOME}/.timewarrior/timewarrior.cfg
        mkdir ${HOME}/.timewarrior/data
        timew help
        timew --version

about:
  homepage: https://timewarrior.net
  repository: https://github.com/GothenburgBitFactory/timewarrior
  documentation: https://timewarrior.net/docs
  license: MIT
  license_file:
    - LICENSE
  summary: Timewarrior - Command line Time Tracker
  description: |
    Timewarrior is Free and Open Source Software that tracks time from the command line.

extra:
  recipe-maintainers:
    - wshanks
