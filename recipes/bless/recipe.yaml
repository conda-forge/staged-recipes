schema_version: 1

context:
  name: bless
  version: "0.4.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/HaoZeke/bless/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8de70dfc1a1f61a48d185f1cbbe17a0d81a8e1f04deacf6cc32db9b0a2035772

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - bless --help
  - package_contents:
      bin:
        - bless
      strict: true

about:
  homepage: https://github.com/HaoZeke/bless
  summary: CLI logging helper for repeated development runs with metadata tracking
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/HaoZeke/bless

extra:
  recipe-maintainers:
    - HaoZeke
