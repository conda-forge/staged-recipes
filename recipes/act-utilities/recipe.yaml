context:
  version: "1.9b"

package:
  name: act-utilities
  version: ${{ version }}

source:
  url: https://github.com/AlexandriaChemistry/ACT-utilities/archive/v${{ version }}.tar.gz
  sha256: 6a0a012617f6cf93ffd3174e837e73c6ff880bf019f6b537f3c2e9f85ae07360

build:
  number: 0
  noarch: python
  script:
    - cmake -S . -B build -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_TESTING=OFF -DPython3_EXECUTABLE=$PYTHON
    - cmake --install build

requirements:
  build:
    - cmake >=3.24
    - make
  host:
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - numpy
    - matplotlib-base
    - rdkit
    - pyyaml
    - xmltodict

tests:
  - python:
      imports:
        - actutils
        - molprops
        - mol_json
      pip_check: false
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - coords2molprop -h
      - test -f $PREFIX/bin/gauss2molprop
      - test -f $PREFIX/share/act/atom_bond.xml
      - test -f $PREFIX/share/act/atomtypes_gui.csv

about:
  homepage: https://github.com/AlexandriaChemistry/ACT-utilities
  repository: https://github.com/AlexandriaChemistry/ACT-utilities
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Python modules, scripts and data files of the Alexandria Chemistry Toolkit (ACT)
  description: |
    Pre- and post-processing scripts, converters to molprop files, the
    interface to OpenMM and the data files, such as alexandria.json and
    atomprops.csv, of the Alexandria Chemistry Toolkit. The package
    alexandria, the programs of ACT, requires them.

extra:
  recipe-maintainers:
    - dspoel
    - JulianKoengeter
    - MansRosenbaum
