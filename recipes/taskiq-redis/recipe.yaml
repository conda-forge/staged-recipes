schema_version: 1

context:
  version: "1.2.4"

package:
  name: taskiq-redis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/taskiq-redis/taskiq_redis-${{ version }}.tar.gz
  sha256: be7df97ea39f9572c5cdc15d6db0de0c8d78fa5d5b4db626f9673840383032ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.13,<0.10.0
  run:
    - python >=${{ python_min }}
    - taskiq >=0.13.0
    - redis-py >=8.0.0,<9

tests:
  - python:
      imports:
        - taskiq_redis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/taskiq-python/taskiq-redis
  summary: Redis integration for taskiq
  description: |
    Taskiq-redis is a plugin for taskiq that adds a broker and a result
    backend based on Redis, for use with the taskiq distributed task queue.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/taskiq-python/taskiq-redis

extra:
  recipe-maintainers:
    - pb01ka
