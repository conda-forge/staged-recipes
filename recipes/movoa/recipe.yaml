context:
  version: "0.1.0"

package:
  name: movoa
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/movoa/movoa-${{ version }}.tar.gz
  sha256: f38f1da9530c624ce237e2ec26d7ac15abaaa5cdfa41cfc5f7c53ec2450c8db0

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - movoa
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://movoa.ai
  summary: Official Python SDK for Movoa (text to video and photo to video with sound)
  description: |
    Unlimited AI video generator with sound: on paid plans the tenth take of a shot costs what
    the first did, and your first clip is free to make right now. Dependency-free Python SDK
    for Movoa (movoa.ai): text to video and photo to video with sound.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/hanshs474/movoa-py
  documentation: https://movoa.readthedocs.io/

extra:
  recipe-maintainers:
    - hanshs474
