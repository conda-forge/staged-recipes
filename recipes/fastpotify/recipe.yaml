context:
  version: "0.4.1"

package:
  name: fastpotify
  version: ${{ version }}

source:
  url: https://github.com/crmne/fastpotify/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 4e8512d77dde4956a25b1470e8419a118a5a3e6fd93084c238048061c95808dc

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content: brush $RECIPE_DIR/build.sh

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - brush
    - cargo-auditable
    - cargo-bundle-licenses
    - pkg-config
  host:
    - if: linux
      then:
        - alsa-lib
        - libxkbcommon
        - pulseaudio-client
        - wayland
        - xorg-libx11
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxrandr
  run:
    - if: linux
      then:
        - alsa-lib
        - libgl
        - libxkbcommon
        - pulseaudio-client
        - wayland
        - xorg-libx11
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxrandr

tests:
  - script:
      - fastpotify --help
  - package_contents:
      bin:
        - fastpotify
      files:
        - Menu/fastpotify.*
      strict: true

about:
  homepage: https://fastpotify.rocks
  summary: Fast, lightweight, native Spotify client
  description: |
    Fastpotify is a native Spotify client with local playback, Spotify
    Connect, media-key integration, and system tray support.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/crmne/fastpotify

extra:
  recipe-maintainers:
    - baszalmstra
