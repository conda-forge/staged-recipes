context:
  version: "0.4.1"

package:
  name: fastpotify
  version: ${{ version }}

source:
  url: https://github.com/crmne/fastpotify/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 4e8512d77dde4956a25b1470e8419a118a5a3e6fd93084c238048061c95808dc

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
          - mkdir -p ${{ PREFIX }}/Menu
          - cp $RECIPE_DIR/menu.json ${{ PREFIX }}/Menu/fastpotify.json
          - cp packaging/macos/icon-1024.png ${{ PREFIX }}/Menu/fastpotify.png
          - if: osx
            then:
              - bash packaging/macos/bundle.sh ${{ PREFIX }}/bin/fastpotify Fastpotify.app ${{ version }}
              - cp Fastpotify.app/Contents/Resources/fastpotify.icns ${{ PREFIX }}/Menu/fastpotify.icns
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
          - if not exist %PREFIX%\Menu mkdir %PREFIX%\Menu
          - copy %RECIPE_DIR%\menu.json %PREFIX%\Menu\fastpotify.json
          - copy packaging\windows\fastpotify.ico %PREFIX%\Menu\fastpotify.ico
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - pkg-config
  host:
    - if: linux
      then:
        - alsa-lib
        - libxkbcommon
        - pulseaudio-client
        - wayland
        - xorg-libx11
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxrandr
  run:
    - if: linux
      then:
        - alsa-lib
        - libgl
        - libxkbcommon
        - pulseaudio-client
        - wayland
        - xorg-libx11
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxrandr

tests:
  - script:
      - fastpotify --help
  - package_contents:
      bin:
        - fastpotify
      files:
        - Menu/fastpotify.*
      strict: true

about:
  homepage: https://fastpotify.rocks
  summary: Fast, lightweight, native Spotify client
  description: |
    Fastpotify is a native Spotify client with local playback, Spotify
    Connect, media-key integration, and system tray support.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/crmne/fastpotify

extra:
  recipe-maintainers:
    - baszalmstra
