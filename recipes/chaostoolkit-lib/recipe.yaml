schema_version: 1

context:
  version: "1.45.1"
  python_min: "3.12"

package:
  name: chaostoolkit-lib
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/chaostoolkit-lib/chaostoolkit_lib-${{ version }}.tar.gz
  sha256: f514a6b63e636feb3b2d19a839db182add49bdf83a3bad6c9e8da11feae28f2b

build:
  number: 0
  noarch: python
  script:
    content: ${{ PYTHON }} -m pip install . -vv
    env:
      PDM_BUILD_SCM_VERSION: ${{ version }}

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - requests >=2.31.0
    - pyyaml >=6.0.1
    - importlib-metadata >=6.7.0
    - charset-normalizer >=3.3.2
    - python-json-logger >=2.0.7
    - colorama >=0.4.4

tests:
  - python:
      imports:
        - chaoslib
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: Chaos Toolkit core library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://chaostoolkit.org/
  documentation: https://chaostoolkit.org

extra:
  recipe-maintainers:
    - jsmolic
