schema_version: 1

context:
  version: "1.0.0"

package:
  name: surfs-up
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/surfs-up/surfs_up-${{ version }}.tar.gz
  sha256: 10b80578692e5c81463c8a8b34705b036db8951fcb5080cd58a032a2317fa9bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - surf-make-ephemeris = surf.scripts.make_ephemeris:main
      - surf-open-examples = surf.scripts.open_examples_notebook:main
      - surfs-up = surfs_up.web.app:main
      - surfs-up-web = surfs_up.web.app:main
      - surfs-up-worker = surfs_up.jobs:main

requirements:
  host:
    - python >=3.12
    - setuptools >=61.0
    - pip
  run:
    - python >=3.12
    - appdirs >=1.4.4
    - astropy-base >=7.1.0
    - dtaidistance >=2.5.1
    - flask >=3.1.0
    - h5py >=3.14.0
    - imageio >=2.37.0
    - imageio-ffmpeg >=0.6.0
    - joblib >=1.3.0
    - jupyterlab >=4.4.7
    - matplotlib-base >=3.10.6
    - netcdf4 >=1.6.2
    - numba >=0.61.2
    - numpy >=2.2.6
    - onnxruntime >=1.15.0
    - pandas >=2.3.2
    - requests >=2.32.5
    - scipy >=1.16.1
    - scikit-image >=0.26.0
    - sunpy >=7.0.1
    - tqdm >=4.67.1

tests:
  - python:
      imports:
        - surf
        - surfs_up
      pip_check: true

about:
  summary: Space-weather Utilities for Research and Forecasting (SURF)
  license: MIT
  license_file: LICENSE.md
  homepage: https://github.com/University-of-Reading-Space-Science/SURF

extra:
  recipe-maintainers:
    - LukeBarnard
