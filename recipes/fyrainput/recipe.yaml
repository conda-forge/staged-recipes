schema_version: 1
package:
  name: fyrainput
  version: 1.0.0
source:
- url: https://raw.githubusercontent.com/TitanCSA/sdk-packages/f6abf965e5a3e229c1b450322212aa07ec5a4cfc/release-assets/FyraInput/input-language-sdks-v1.0.0/fyrainput-input-sdks-1.0.0-source.zip
  sha256: 32174a73189404e168e13f481e130c6154d74dc4ce153a4ecc806a66dca3b183
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - fyrainput
    pip_check: true
- script:
  - python -m pip check
  - python -c "from fyrainput import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/TitanCSA/FyraInput-SDK
  summary: Windows x64 FyraInput Python SDK with source-built native bridge
  license: MIT
  license_file:
  - FyraInput-C-ffi/LICENSE
  repository: https://github.com/TitanCSA/FyraInput-SDK
extra:
  recipe-maintainers:
  - TitanCSA
