context:
  name: hydroseason
  version: "0.2.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/hydroseason-${{ version }}.tar.gz
  sha256: 269b40b5d8b5fa6e7784699d96aa4aa97b35bdd45ae135c2b32b357ae6843e1c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - hydroseason = hydroseason.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }},<3.14
    - pandas >=2.0
    - numpy >=1.24

tests:
  - python:
      imports:
        - hydroseason
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - hydroseason --help
      - hydroseason --version

about:
  homepage: https://github.com/tayerthiaggo/hydroseason
  summary: Remote-sensing-first hydro-year detection from monthly surface-water extent
  description: |
    HydroSeason tests whether a catchment's satellite surface-water extent
    record floods and dries on a reliable annual cycle. Seasonal records get
    per-year hydrological-year boundaries and wet/dry phases; aseasonal records
    get flood events and low-water spells. This package provides the core
    (CSV/DataFrame) workflow; install geopandas, rioxarray, odc-stac and the
    other raster/STAC dependencies for NetCDF/Zarr input and DEA fetching.
  license: MIT
  license_file:
    - LICENSE
    - hydroseason/_assets/LEAFLET-LICENSE.txt
    - hydroseason/_assets/PLOTLY-LICENSE.txt
  documentation: https://tayerthiaggo.github.io/hydroseason/
  repository: https://github.com/tayerthiaggo/hydroseason

extra:
  recipe-maintainers:
    - tayerthiaggo
