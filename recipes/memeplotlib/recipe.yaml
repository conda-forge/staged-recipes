schema_version: 1

context:
  name: memeplotlib
  version: "0.6.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c6ad269105035e2c0e0a636054e4310ec6d387b5859026c55f8df3a4776d931c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - memeplotlib = memeplotlib.__main__:main
      - memeplotlib-mcp = memeplotlib._mcp:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.8.0
    - numpy >=1.16.0
    - pillow >=8.0.0
    - platformdirs >=2.0.0
    - requests >=2.20.0
  run_constraints:
    # The MCP server (`memeplotlib-mcp`) is an optional extra; if mcp is
    # installed it must be the 2.x API the server is written against.
    - mcp >=2,<3

tests:
  - python:
      imports:
        - memeplotlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - memeplotlib --help
      - memeplotlib --version

about:
  homepage: https://github.com/brianckeegan/memeplotlib
  repository: https://github.com/brianckeegan/memeplotlib
  documentation: https://brianckeegan.github.io/memeplotlib/
  summary: Memes with Python's matplotlib
  description: |
    memeplotlib creates image-macro memes with matplotlib. memegen.link
    renders memegen templates server-side by default; a local Pillow
    renderer handles custom images, explicit font sizes, custom outlines
    and per-line styling. It has a functional API (meme, memify), a
    chainable Meme builder, generated alt text, a CLI, and an optional
    MCP server.
  # memeplotlib is MIT; the bundled Anton display font is SIL OFL 1.1.
  license: MIT AND OFL-1.1
  license_file:
    - LICENSE
    - src/memeplotlib/fonts/OFL.txt

extra:
  recipe-maintainers:
    - brianckeegan
