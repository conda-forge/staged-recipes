context:
  version: "5.7.0"
  python_min: "3.12"

package:
  name: gsolve
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gsolve/gsolve-${{ version }}.tar.gz
  sha256: ebdb91c8e708cb4d8b6569d6ac42bcef7bf286b06821aea0789b6a07a236b43d

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python == {{ python_min }}
    - hatchling
    - uv-dynamic-versioning
    - pip
  run:
    - python >= {{ python_min }}
    - boule 0.6.*
    - harmonica <0.8
    - matplotlib-base >=3.11.1
    - numpy >=2.4.6
    - openpyxl >=3.1.5
    - pandas <3
    - pydata-sphinx-theme >=0.16.1
    - pygtide >=0.9.1
    - pyhardisp >=0.2.1
    - rioxarray >=0.22.0
    - tqdm >=4.67.3
    - xarray >2025.12

tests:
  - python:
      imports:
        - gsolve
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://pypi.org/project/gsolve/
  summary: A Python package for processing gravity survey data.
  documentation: https://gns-science.github.io/gsolve/
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - craigmillernz
