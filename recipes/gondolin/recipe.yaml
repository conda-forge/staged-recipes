schema_version: 1

context:
  version: 0.13.0

package:
  name: gondolin
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@earendil-works/gondolin/-/gondolin-${{ version }}.tgz
  sha256: 11048422f4672d3306ccdf97beafd9d95216df9dfadc776e30af97d0c4fd01d1

build:
  number: 0
  noarch: generic
  script:
    # `npm install --global` ignores --omit=optional; install in place instead to skip
    # the optional prebuilt krun runner binaries and ssh2's native cpu-features addon
    - mkdir -p $PREFIX/lib/node_modules/@earendil-works/gondolin $PREFIX/bin
    - cp -R dist package.json README.md LICENSE $PREFIX/lib/node_modules/@earendil-works/gondolin/
    - npm install --prefix $PREFIX/lib/node_modules/@earendil-works/gondolin --omit=dev --omit=optional --ignore-scripts --no-package-lock
    - chmod +x $PREFIX/lib/node_modules/@earendil-works/gondolin/dist/bin/gondolin.js
    - ln -s ../lib/node_modules/@earendil-works/gondolin/dist/bin/gondolin.js $PREFIX/bin/gondolin
    - pnpm install --prod --no-optional --ignore-scripts
    - pnpm-licenses generate-disclaimer --prod --output-file=third-party-licenses.txt

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  host:
    - nodejs >=22.19.0
  run:
    - nodejs >=22.19.0
    - __unix
  ignore_run_exports:
    from_package:
      - nodejs

tests:
  - script:
      - gondolin --help
  - package_contents:
      files:
        - lib/node_modules/@earendil-works/gondolin/package.json

about:
  homepage: https://github.com/earendil-works/gondolin
  summary: Local Linux micro-VMs with programmable network and filesystem control
  description: |
    Gondolin runs untrusted code (e.g. generated by AI agents) inside a fast
    local Linux micro-VM while keeping network and filesystem access under
    host-side policy control that can be customized via JavaScript.
    Running VMs requires QEMU to be installed on the host.
  license: Apache-2.0
  license_file:
    - LICENSE
    - third-party-licenses.txt
  documentation: https://github.com/earendil-works/gondolin/tree/main/docs
  repository: https://github.com/earendil-works/gondolin

extra:
  recipe-maintainers:
    - pavelzw
