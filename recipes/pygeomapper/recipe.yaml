context:
  name: pygeomapper
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f14eefbe70169f817e32b76df0afba1d8da1cc64c27e3895522d003edc777c74
  patches:
    # forge3d is not on conda-forge; the conda build has no forge3d render
    # backend and render_with_forge3d uses the built-in Rust fallback
    - drop-forge3d.patch

build:
  number: 0
  skip:
    - win
    # pyo3 0.22 supports CPython up to 3.13
    - match(python, ">=3.14")
  script:
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.5,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.5,<2
  run:
    - python
    - numpy >=1.22.0
    - scipy >=1.9.0
    - matplotlib-base >=3.6.0
    - rasterio >=1.3.0
    - pyproj >=3.4.0
    - tifffile >=2023.1.0
    - pillow >=9.0.0
    - pystac-client >=0.7.0
    - scikit-learn >=1.2.0
    - spyndex >=0.4.0
    - xdem >=0.0.18
    - pywbt >=0.2.0

tests:
  - python:
      imports:
        - pygeomapper
        - pygeomapper._core
        - pygeomapper.terrain_analysis
        - pygeomapper.spectral_indices
        - pygeomapper.surface_change
        - pygeomapper.viewer_3d
        - pygeomapper.cross_section
        - pygeomapper.raster_io
      pip_check: true

about:
  summary: A toolkit for automated geological and geomorphic mapping from surface geology, remote sensing and DEM data, with 3D terrain visualization and analysis
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - NOTICE
    - THIRDPARTY.yml
  homepage: https://geolarrylai.com/projects/pyGeoMapper/
  repository: https://github.com/GeoLarryLai/pyGeoMapper

extra:
  recipe-maintainers:
    - GeoLarryLai
