context:
  name: abb-librws
  version: 1.2.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Carlo-Rosso/abb_librws/archive/refs/tags/v${{ version }}.tar.gz
  sha256: eeae6eaad4d944b6c6d71c74fe9569bed9689d180b024f30547e3811ca3fe5fd

build:
  number: 0
  script:
    - cmake -G Ninja -B build -S . ${{ "%CMAKE_ARGS%" if win else "$CMAKE_ARGS" }} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_EXAMPLES=OFF
    - cmake --build build --parallel
    - cmake --install build

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - poco

tests:
  - package_contents:
      lib:
        - abb_librws
      include:
        - abb_librws/rws_interface.h
        - abb_librws/rws_common.h
        - abb_librws/abb_librws_export.h
      files:
        - ${{ "Library/" if win }}share/abb_librws/abb_librwsConfig.cmake

about:
  homepage: https://github.com/Carlo-Rosso/abb_librws
  license: BSD-3-Clause
  license_file: LICENSE
  summary: C++ client library for ABB Robot Web Services (RWS)
  description: |
    A C++ library for interfacing with ABB robot controllers supporting Robot Web Services
  repository: https://github.com/Carlo-Rosso/abb_librws

extra:
  recipe-maintainers:
    - Carlo-Rosso
