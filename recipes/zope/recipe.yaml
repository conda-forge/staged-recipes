schema_version: 1

context:
  version: "6.3"

package:
  name: zope
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope/zope-${{ version }}.tar.gz
  sha256: c75e5d37ab0f0684e0f1693940f3a1d55ad13bdf281bf5e0abe45b7b5e6cc4e2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - addzopeuser = Zope2.utilities.adduser:main
      - runwsgi = Zope2.Startup.serve:main
      - mkwsgiinstance = Zope2.utilities.mkwsgiinstance:main
      - zconsole = Zope2.utilities.zconsole:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - accesscontrol
    - acquisition
    - btrees
    - chameleon
    - datetime
    - documenttemplate
    - extensionclass
    - multimapping
    - pastedeploy
    - persistence
    - restrictedpython
    - zconfig
    - zodb >=6.4.dev0
    - multipart
    - transaction
    - waitress
    - zexceptions
    - z3c.pt
    - zope.browser
    - zope.browsermenu
    - zope.browserpage
    - zope.browserresource
    - zope.component
    - zope.configuration
    - zope.container
    - zope.contentprovider
    - zope.contenttype
    - zope.datetime
    - zope.deferredimport
    - zope.event
    - zope.exceptions
    - zope.globalrequest
    # zope.i18n[zcml]: the zcml extra pulls in zope.component, zope.configuration
    # and zope.security, which are all listed here
    - zope.i18n
    - zope.i18nmessageid
    - zope.interface
    - zope.lifecycleevent
    - zope.location
    - zope.pagetemplate
    - zope.processlifetime
    - zope.proxy
    - zope.ptresource
    - zope.publisher
    - zope.schema
    - zope.security
    - zope.sequencesort
    - zope.site
    - zope.size
    - zope.tal
    - zope.tales
    - zope.testbrowser
    - zope.testing
    - zope.traversing
    - zope.viewlet

tests:
  - python:
      imports:
        - Zope2
        - Zope2.Startup.run
        - OFS.Application
        - OFS.Folder
        - ZPublisher.WSGIPublisher
        - App.config
        - Products.Five
        - Products.PageTemplates.ZopePageTemplate
        - webdav
        - ZTUtils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # the sdist ships the test .po files but not the compiled .mo files,
      # so let zope.i18n compile them when the tests register translations
      - if: win
        then: set "zope_i18n_compile_mo_files=true"
        else: export zope_i18n_compile_mo_files=true
      # test_no_second_transaction_is_created_if_closed passes on its own but
      # depends on test order when the whole suite runs in one process
      - zope-testrunner --auto-path -vc -s App -s OFS -s Products.Five -s Products.PageTemplates -s Products.SiteAccess -s Testing -s webdav -s zmi -s Zope2 -s ZPublisher -s ZTUtils -t "!test_no_second_transaction_is_created_if_closed"
    requirements:
      run:
        - zope.testrunner
  - script:
      - mkwsgiinstance --help
      - runwsgi --help
      - addzopeuser --help
      - zconsole --help
      # create a real instance and check its config files are written
      - mkwsgiinstance -d zinst -u admin:admin
      - python -c "import os; assert os.path.isfile('zinst/etc/zope.conf') and os.path.isfile('zinst/etc/zope.ini')"

about:
  homepage: https://github.com/zopefoundation/Zope
  repository: https://github.com/zopefoundation/Zope
  documentation: https://zope.readthedocs.io
  summary: Zope application server / web framework
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
