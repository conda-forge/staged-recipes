schema_version: 1

context:
  name: pynamodb-async
  version: 0.1.2
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pynamodb_async-${{ version }}.tar.gz
  sha256: 6c2a6aa01581152cf028d742e318f78d7c8f599ba15f3d84eedbe1660056e0fe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.24
    - hatch-vcs >=0.5
    - setuptools-scm >=10
    - pip
  run:
    - python >=${{ python_min }}
    - pynamodb >=6.1,<6.2
    - aiobotocore >=2.13.0

tests:
  - python:
      imports:
        - pynamodb_async
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/zeroae/pynamodb-async
  summary: Native asyncio API for PynamoDB, built on aiobotocore
  license: MIT
  license_file: LICENSE
  repository: https://github.com/zeroae/pynamodb-async

extra:
  recipe-maintainers:
    - sodre
