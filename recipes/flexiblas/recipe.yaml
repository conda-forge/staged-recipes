context:
  version: "3.5.0"

recipe:
  name: flexiblas
  version: ${{ version }}

source:
  url: https://github.com/mpimd-csc/flexiblas/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 175bd4ad7b44348c5dc0531c7a0169ad451cbc9a3d018dd17f01d4a0d0244680

build:
  number: 0

outputs:
  - staging:
      name: flexiblas-build
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('fortran') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
        - make
      host:
        - libopenblas
        - libblas * *netlib
        - libcblas * *netlib
        - liblapack * *netlib
        - liblapacke * *netlib
    build:
      script:
        # conda-forge libopenblas on macOS installs libopenblas.0.dylib (id
        # @rpath/libopenblas.0.dylib). There is no libopenblas.dylib, so the
        # Check_Fortran_Function_Exists(DAXPY) probe dies in the generator
        # ("No rule to make target") before ld runs. libomp is already an
        # LC_LOAD_DYLIB of that library; listing it again overlinks.
        - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ PREFIX }} -DSYSCONFDIR=${{ PREFIX }}/etc -DBLAS_AUTO_DETECT=OFF -DEXAMPLES=OFF -DTESTS=OFF -DFLEXIBLAS_DEFAULT=OPENBLASPTHREAD -DFLEXIBLAS_DEFAULT_BLAS=OPENBLASPTHREAD -DEXTRA=OpenBLASPThread -DOpenBLASPThread_LIBRARY=${{ PREFIX }}/lib/${{ 'libopenblas.0.dylib' if osx else 'libopenblas.so.0' }} -DSYS_BLAS_LIBRARY=${{ PREFIX }}/lib/libblas${{ '.dylib' if osx else '.so' }} -DSYS_LAPACK_LIBRARY=${{ PREFIX }}/lib/liblapack${{ '.dylib' if osx else '.so' }}
        - cmake --build build --parallel ${{ env.get("CPU_COUNT", default="1") }}
        - cmake --install build

  - package:
      name: libflexiblas
    inherit:
      from: flexiblas-build
      run_exports: false
    build:
      number: 0
      skip:
        # Initial conda-forge submission wires Linux/macOS backend libraries and rc config.
        # Windows backend wiring (DLL naming/loading + config defaults) is deferred.
        - win
      files:
        - lib/libflexiblas*
        - lib/flexiblas/**
        - include/flexiblas/**
        - lib/pkgconfig/flexiblas*.pc
        - etc/flexiblasrc
        - etc/flexiblasrc.d/**
    requirements:
      run_exports:
        - ${{ pin_subpackage('libflexiblas', upper_bound='x') }}
      run:
        - libopenblas
        - libblas * *netlib
        - libcblas * *netlib
        - liblapack * *netlib
        - liblapacke * *netlib
    tests:
      - script:
          - pkg-config --exists flexiblas
          - $CC test_flexiblas_c.c -o test_flexiblas_c -I${PREFIX}/include -L${PREFIX}/lib -Wl,-rpath,${PREFIX}/lib -lflexiblas -lm
          - $FC test_flexiblas_fortran.f90 -o test_flexiblas_fortran -L${PREFIX}/lib -Wl,-rpath,${PREFIX}/lib -lflexiblas
          - FLEXIBLAS=OPENBLASPTHREAD ./test_flexiblas_c
          - FLEXIBLAS=NETLIB ./test_flexiblas_c
          - FLEXIBLAS=OPENBLASPTHREAD ./test_flexiblas_fortran
          - FLEXIBLAS=NETLIB ./test_flexiblas_fortran
        files:
          recipe:
            - test_flexiblas_c.c
            - test_flexiblas_fortran.f90
        requirements:
          run:
            - pkg-config
            - ${{ compiler('c') }}
            - ${{ compiler('fortran') }}

  - package:
      name: flexiblas
    inherit:
      from: flexiblas-build
      run_exports: false
    build:
      number: 0
      skip:
        # Initial conda-forge submission wires Linux/macOS backend libraries and rc config.
        # Windows backend wiring (DLL naming/loading + config defaults) is deferred.
        - win
      files:
        - bin/flexiblas
        - bin/flexiblas-config
        - share/man/man1/flexiblas*.1
    requirements:
      run:
        - ${{ pin_subpackage('libflexiblas', exact=True) }}
    tests:
      - script:
          - flexiblas -h
          - flexiblas list
          - flexiblas print
          - FLEXIBLAS=OPENBLASPTHREAD flexiblas print > flexiblas-openblas.txt 2>&1
          - cat flexiblas-openblas.txt
          - grep -q OPENBLASPTHREAD flexiblas-openblas.txt
          - if grep -F -q "not found" flexiblas-openblas.txt; then echo "OPENBLASPTHREAD fell back to NETLIB"; exit 1; fi

about:
  homepage: https://github.com/mpimd-csc/flexiblas
  repository: https://github.com/mpimd-csc/flexiblas
  summary: Runtime BLAS/LAPACK wrapper with switchable backend libraries
  description: |
    FlexiBLAS provides BLAS and LAPACK entry points and dispatches calls
    to a selected backend at runtime. This package is configured with
    conda-forge provided NETLIB and OpenBLAS backends.
  license: LGPL-3.0-or-later AND BSD-3-Clause
  license_file:
    - COPYING
    - COPYING.NETLIB

extra:
  recipe-maintainers:
    - HaoZeke
