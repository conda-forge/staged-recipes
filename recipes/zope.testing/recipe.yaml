schema_version: 1

context:
  version: "6.2"

package:
  name: zope.testing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.testing/zope_testing-${{ version }}.tar.gz
  sha256: 0de47f3c1a96cbec15ae7a1607d5a142ec39e501728055434358c2f4cf0f21a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=78.1.1,<82
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - zope
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python
    script:
      - python -c "import sys, unittest; from zope.testing.tests import test_suite; sys.exit(0 if unittest.TextTestRunner(verbosity=1).run(test_suite()).wasSuccessful() else 1)"

about:
  summary: Zope testing helpers
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt
  homepage: https://pypi.org/project/zope.testing/
  repository: https://github.com/zopefoundation/zope.testing

extra:
  recipe-maintainers:
    - mgorny
