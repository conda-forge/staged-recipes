context:
  version: "3.0.2"
  python_min: "3.12"

package:
  name: nos-tlplot
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/73/73/840d2353ed2f2f231bf4730dc5f60e2de4a7bbcfb539b86afc21665a9762/nos_tlplot-3.0.2.tar.gz
  sha256: fb0d83292886c8b6bbe5ebfce95f4ad9e2ea55c20666f41a11e17de340b41560

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=2.5
    - pandas >=3.0
    - matplotlib-base >=3.11
    - seaborn >=0.13
    - pyarrow >=25.0
    - openpyxl >=3.1
    - pillow >=13.0

tests:
  - python:
      imports:
        - nos_tlplot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nos-tlplot/NOS-TLPlot-Package
  summary: 'Visualization Tool for Newcastle–Ottawa Scale Risk-of-Bias Assessments'
  description: |
    NOS-TLPlot is an open-source Python package for visualising Newcastle–Ottawa Scale (NOS)
    risk-of-bias assessments. It converts NOS star ratings into publication-ready traffic-light
    plots and 13 specialized visualizations, enabling reviewers and readers to interpret
    study-level risk-of-bias results clearly and reproducibly.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://nos-tlplot.github.io
  repository: https://github.com/nos-tlplot/NOS-TLPlot-Package

extra:
  recipe-maintainers:
    - aurumz-rgb
