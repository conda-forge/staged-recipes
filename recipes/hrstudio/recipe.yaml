schema_version: 1

context:
  version: "1.1.3"
  python_min: "3.12"

package:
  name: hrstudio
  version: ${{ version }}

source:
  url: "https://github.com/yyyyy-9/HRS/archive/refs/tags/v${{ version }}.tar.gz"
  sha256: 993176fb4f9f9792268f088f8262657bf4520a954dc2e47c16be898b5caeb755

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - hrs = html_report_studio.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - html_report_studio
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - hrs --version
      - hrs info
      - python -m html_report_studio --version
      - "python -c \"from importlib.metadata import version; from html_report_studio.release_info import load_release; assert version('hrstudio') == load_release()['python_version'] == '${{ version }}'\""
      - "python -c \"import html_report_studio; from html_report_studio.release_info import SOURCE_SPEC; from pathlib import Path; p=Path(html_report_studio.__file__).parent; assert all((p/n).is_file() for n in ['MANIFEST.json','web/app.js','web/help.html','LICENSE','COPYRIGHT',SOURCE_SPEC])\""

about:
  homepage: "https://github.com/yyyyy-9/HRS"
  summary: "Local Markdown report editor with offline HTML assets"
  description: |
    HRS is a local Markdown report editor for free notes and engineering reports.
    The package includes the local web application, offline frontend assets and
    the hrs command. It binds to 127.0.0.1 and keeps user state outside the
    installation. Word export requires separate optional native components.
  license: GPL-3.0-or-later
  license_file:
    - app/LICENSE
    - app/COPYRIGHT
  repository: "https://github.com/yyyyy-9/HRS"
  documentation: "https://github.com/yyyyy-9/HRS#readme"

extra:
  recipe-maintainers:
    - yyyyy-9
