schema_version: 1

context:
  version: "1.0.0"

package:
  name: unipatch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/unipatch/unipatch-${{ version }}.tar.gz
  sha256: 993df2fe49f8114a95eaaf088ecf498c0dd20a8387caa17d63e8d1c29ea50af1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.12.1,<0.13
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - unipatch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Apply unified diffs in memory, compatible with GNU patch.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/unipatch/

extra:
  recipe-maintainers:
    - MatthewNeko
