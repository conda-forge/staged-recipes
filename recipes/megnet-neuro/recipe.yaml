context:
  name: megnet-neuro
  version: "0.3.5"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/megnet-neuro/megnet_neuro-${{ version }}.tar.gz
  sha256: d5c6e83cf1f030a1fdec48314bdd024e05440a57edbc8578e9326f4756c5fea4
  patches:
    - fix-v0.3.5-packaging.patch

build:
  number: 0
  skip:
    - win
    - match(python, "<=3.10")
  script:
    - rm -rf MEGnet_neuro.egg-info
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - mne >1.10
    - numpy
    - scipy
    - pandas
    - munch
    - nibabel
    - joblib
    - pytorch
    - keras >3.0
    - scikit-learn
    - huggingface_hub >=0.24.0
    - matplotlib-base
    - pillow

tests:
  - python:
      imports:
        - MEGnet
        - MEGnet.megnet_init
        - MEGnet.megnet_utilities
        - MEGnet.prep_inputs.ICA
      pip_check: true
  - package_contents:
      bin:
        - ICA.py
        - megnet_init
        - megnet_qc_plots.py
  - script:
      - ICA.py --help
      - megnet_qc_plots.py --help

about:
  homepage: https://github.com/nih-megcore/MegNet
  summary: Calculate and classify ICAs using the MEGnet deep-learning architecture
  description: |
    MEGnet-neuro uses MNE-Python to preprocess MEG data, calculate Infomax
    independent components, and classify those components with the MEGnet
    deep-learning architecture.
  license: LicenseRef-LICENSE
  license_file: LICENSE
  repository: https://github.com/nih-megcore/MegNet

extra:
  recipe-maintainers:
    - jstout211
