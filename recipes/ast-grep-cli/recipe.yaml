# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.45.3"

package:
  name: ast-grep-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ast-grep-cli/ast_grep_cli-${{ version }}.tar.gz
  sha256: d8b527b71655eede16637311bc3ca49624b8198c48bffeb5dcf06a78332bf917

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - maturin >=1.1,<2.0
    - puccinialin
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ast_grep_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Structural Search and Rewrite code at large scale using precise AST pattern.
  license: MIT
  license_file: LICENSE
  homepage: https://ast-grep.github.io/
  documentation: https://ast-grep.github.io/

extra:
  recipe-maintainers:
    - rxm7706
