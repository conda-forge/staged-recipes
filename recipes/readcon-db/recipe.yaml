context:
  name: readcon-db
  version: "0.1.4"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/lode-org/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8a258eeda494f65986b0febdc3c207883a41b7ee4d04c8c97a0b2fa5275857a4

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - cargo-c
  # Shared C ABI. Rust statically links crates.io readcon-core into this
  # cdylib; do not add a conda run dep on readcon-core (duplicate rust-std).
  run_exports:
    - ${{ pin_subpackage('readcon-db', upper_bound='x.x') }}

tests:
  - package_contents:
      files:
        - if: linux
          then:
            - lib/libreadcon_db.so
            - include/readcon-db.h
            - lib/pkgconfig/readcon-db.pc
        - if: osx
          then:
            - lib/libreadcon_db.dylib
            - include/readcon-db.h
            - lib/pkgconfig/readcon-db.pc
        - if: win
          then:
            - Library/bin/readcon_db.dll
            - Library/lib/readcon_db.dll.lib
            - Library/include/readcon-db.h
            - Library/lib/pkgconfig/readcon-db.pc

about:
  homepage: https://github.com/lode-org/readcon-db
  summary: Mmap-backed CON frame corpus (LMDB) with C FFI
  description: |
    readcon-db is a mmap-backed CON/convel corpus store (LMDB via Heed)
    with xxHash exact match and a C ABI. The shared library statically
    links the readcon-core Rust crate from crates.io; it does not
    require the conda-forge readcon-core package.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/lode-org/readcon-db
  documentation: https://lode-org.github.io/readcon-db/

extra:
  recipe-maintainers:
    - HaoZeke
