schema_version: 1

context:
  python_min: "3.13"
  version: "0.7.6"

package:
  name: mantis-rtm
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/mantis-rtm/mantis_rtm-${{ version }}.tar.gz
  sha256: 44a81d86c7f9ddbc714d0d85002f27f954460c811771dad7b0b9c545fec30542

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - ${{ PYTHON }} -c "import shutil, pathlib, sysconfig; shutil.copytree('examples', pathlib.Path(sysconfig.get_path('purelib')) / 'mantis' / 'examples', dirs_exist_ok=True)"
  python:
    entry_points:
      - generate-equations = mantis.generate_equation_system:main
      - generate_equations = mantis.generate_equation_system:main
      - generate-equation-system = mantis.generate_equation_system:main
      - generate_equation_system = mantis.generate_equation_system:main
      - plot_data_new = mantis.plot_data_new:main
      - mantis_create_examples = mantis.mantis_create_examples:main
      - mantis-create-examples = mantis.mantis_create_examples:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - matplotlib-base
    - numba
    - pint
    - watchdog
    - scipy >=1.18.1

tests:
  - python:
      imports:
        - mantis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - generate-equations --help
      - generate_equations --help
      - generate-equation-system --help
      - generate_equation_system --help
      - plot_data_new --help
      - mantis_create_examples --help
      - mantis-create-examples --help
      - python -c "from mantis.mantis_create_examples import copy_examples; p = copy_examples('tmp_examples'); assert (p / '00readme.md').is_file()"

about:
  summary: "MANTIS: A Monolithic Assembly of Nonlinear Transport Interactions Solver"
  license: AGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/uliw/mantis

extra:
  recipe-maintainers:
    - uliw
