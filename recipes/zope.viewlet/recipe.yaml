schema_version: 1

context:
  version: "6.1"

package:
  name: zope.viewlet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.viewlet/zope_viewlet-${{ version }}.tar.gz
  sha256: 2d27c2bbab476785b1ace6d35c9022ea66984db2ef55d9997d2c41a9a89bbaa1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - zope.browserpage
    - zope.component
    - zope.configuration
    - zope.contentprovider
    - zope.event
    - zope.i18nmessageid
    - zope.interface
    - zope.location
    - zope.publisher
    - zope.schema
    - zope.security
    - zope.traversing

tests:
  - python:
      imports:
        - zope.viewlet
        - zope.viewlet.manager
        - zope.viewlet.viewlet
        - zope.viewlet.metaconfigure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # test_suite() also runs the README and directives doctests
      - python -c "import sys, unittest; from zope.viewlet.tests import test_suite; sys.exit(not unittest.TextTestRunner(verbosity=2).run(test_suite()).wasSuccessful())"
    requirements:
      run:
        - zope.size
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.viewlet
  repository: https://github.com/zopefoundation/zope.viewlet
  documentation: https://zopeviewlet.readthedocs.io
  summary: Zope Viewlets
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
