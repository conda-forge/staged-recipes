schema_version: 1

context:
  version: "6.0"

package:
  name: zope.datetime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.datetime/zope_datetime-${{ version }}.tar.gz
  sha256: c110ff575fbfbac9dc549d825b6a673c8023a047a9f8a9594b8aa56ab1472513

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ==78.1.1
    - wheel
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.datetime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      interpreter: python
      content: |
        from zope.datetime import rfc1123_date; assert rfc1123_date(0) == 'Thu, 01 Jan 1970 00:00:00 GMT'

about:
  homepage: https://github.com/zopefoundation/zope.datetime
  repository: https://github.com/zopefoundation/zope.datetime
  documentation: https://zopedatetime.readthedocs.io
  summary: Zope datetime
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
