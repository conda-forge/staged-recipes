schema_version: 1

context:
  version: "6.0"

package:
  name: zope.datetime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.datetime/zope_datetime-${{ version }}.tar.gz
  sha256: c110ff575fbfbac9dc549d825b6a673c8023a047a9f8a9594b8aa56ab1472513

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.datetime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      interpreter: python
      content: |
        import importlib, pkgutil, sys, unittest
        import zope.datetime as pkg
        import os, time
        os.environ["TZ"] = "UTC"
        if hasattr(time, "tzset"):
            time.tzset()
        loader = unittest.defaultTestLoader
        suite = unittest.TestSuite()
        for info in pkgutil.walk_packages(pkg.__path__, pkg.__name__ + "."):
            if info.name.rsplit(".", 1)[-1].startswith("test"):
                m = importlib.import_module(info.name)
                suite.addTest(m.test_suite() if hasattr(m, "test_suite") else loader.loadTestsFromModule(m))
        result = unittest.TextTestRunner(verbosity=2).run(suite)
        sys.exit(not result.wasSuccessful() or result.testsRun == 0)

about:
  homepage: https://github.com/zopefoundation/zope.datetime
  repository: https://github.com/zopefoundation/zope.datetime
  documentation: https://zopedatetime.readthedocs.io
  summary: Zope datetime
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
