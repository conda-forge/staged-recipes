schema_version: 1

context:
  version: "51.0"

package:
  name: dconf
  version: ${{ version }}

source:
  url: https://download.gnome.org/sources/dconf/${{ (version | split('.'))[0] }}/dconf-${{ version }}.tar.xz
  sha256: e65c1b7867f836faad9f9ee04acf5c5a6cae2bbc784833fe093207e0cb590248

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - glib
    - meson
    - ninja
    - pkgconf
  host:
    - dbus
    - glib >=2.76
    - zlib
  ignore_run_exports:
    # dbus.pc gives the service directory; gio-2.0.pc needs zlib for pkg-config.
    from_package:
      - dbus
      - zlib
  run_exports:
    - ${{ pin_subpackage('dconf') }}

tests:
  - requirements:
      run:
        - python
    files:
      recipe:
        - test-backend.py
    script:
      - dconf help
      - python test-backend.py

about:
  homepage: https://gitlab.gnome.org/GNOME/dconf
  repository: https://gitlab.gnome.org/GNOME/dconf
  summary: Low-level configuration system and GSettings backend
  license: LGPL-2.1-or-later
  license_file:
    - COPYING
    - subprojects/gvdb/COPYING

extra:
  recipe-maintainers:
    - flaviut
