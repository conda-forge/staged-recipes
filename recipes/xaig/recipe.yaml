schema_version: 1

context:
  version: "0.4.0"

package:
  name: xaig
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/x/xaig/xaig-${{ version }}.tar.gz
  sha256: 22bb8004c1b4f2b3b495def01a61ea92baee198c91b719856912462f3e0216f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - xaig = xaig._cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - click >=8.1

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - xaig
      pip_check: true
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - xaig --help

about:
  summary: "Light, framework-agnostic tooling for E3SM AI campaigns: latent-space diagnostics, sparse autoencoders, figures, a local app"
  license: BSD-3-Clause
  license_file:
    - LICENSE
  homepage: https://e3sm-project.github.io/aigroup
  repository: https://github.com/E3SM-Project/aigroup
  documentation: https://e3sm-project.github.io/aigroup/package/

extra:
  recipe-maintainers:
    - mahf708
