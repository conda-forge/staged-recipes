{% set name = "madrigalweb" %}
{% set version = "3.3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/madrigalweb-{{ version }}.tar.gz
  sha256: 3eb5c621d0914980a5dc3e0885966f95bd8ae6ac82e694ff1c89afd004aa9b5d

build:
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - setuptools >=61.0
    - pip
  run:
    - python

test:
  imports:
    - madrigalWeb.madrigalWeb
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://cedar.openmadrigal.org
  summary: Python Madrigal Remote API
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kcariglia
