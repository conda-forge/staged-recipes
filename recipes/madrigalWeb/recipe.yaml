schema_version: 1

context:
  name: madrigalWeb
  version: "3.3.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/madrigalweb-${{ version }}.tar.gz
  sha256: 3eb5c621d0914980a5dc3e0885966f95bd8ae6ac82e694ff1c89afd004aa9b5d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >= 3.7
    - setuptools >=61.0
    - pip
  run:
    - python >= 3.7

tests:
  - python:
      imports:
        - madrigalWeb
      pip_check: true

about:
  summary: Python Madrigal Remote API
  license: MIT
  license_file: LICENSE
  homepage: https://cedar.openmadrigal.org

extra:
  recipe-maintainers:
    - kcariglia
