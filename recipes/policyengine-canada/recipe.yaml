context:
  version: "0.99.2"
  python_min: "3.11"

package:
  name: policyengine-canada
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/policyengine-canada/policyengine_canada-${{ version }}.tar.gz
  sha256: d36da3babf4b460a2ca2bfc0d091322b1ee491295d9ac427d64171ed969144ca
  patches:
    - patches/0001-drop-unused-and-dev-deps.patch

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - dpath <3
    - h5py >=3,<4
    - microdf-python >=1.2.1
    - numexpr <3
    - pandas >=2.2.0
    - plotly >=5.6.0,<6
    - policyengine-core >=3.23.6
    - requests >=2.27.1,<3
    - sortedcontainers <3
    - tqdm >=4.46.0,<5
    - wheel <1

tests:
  - python:
      imports:
        - policyengine_canada
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/PolicyEngine/policyengine-canada
  summary: PolicyEngine tax-benefit model for Canada
  license: AGPL-3.0-only
  license_file: LICENSE
  repository: https://github.com/PolicyEngine/policyengine-canada

extra:
  recipe-maintainers:
    - MementoRC
