context:
  version: "0.1.3"

package:
  name: pyfasm64
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyfasm64/pyfasm64-${{ version }}.tar.gz
  sha256: 4079a402c8af71b59cee4c2dff9ba34d32c2cdf16c023d90ffa7bb82f4238af3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - pyfasm64 = pyfasm.cli:main
      - pyfasm = pyfasm.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pyfasm
      pip_check: true
  - script:
      - pyfasm64 --help
      - pyfasm --help

about:
  homepage: https://github.com/eminsk/pyfasm
  summary: Universal Native No-GIL (3.13t-3.16t) & PyPy (3.8-3.12) to pure x86_64 FASM compiler & bundler for Windows, Linux, macOS, and DLL
  description: |
    PyFASM64 is a high-performance cross-platform native compiler that translates Python
    code directly into pure x86_64 Flat Assembler (FASM) machine code with zero runtime
    overhead, no virtual machine, and complete elimination of the Global Interpreter Lock (Zero-GIL).
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/pyfasm
  documentation: https://github.com/eminsk/pyfasm#readme

extra:
  recipe-maintainers:
    - eminsk
