context:
  name: kontragentpro-mcp
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/kontragentpro_mcp-${{ version }}.tar.gz
  sha256: 3f3e14ab0443d8d8e744d886e0a101d7c8d40bdc472516f6a319677bbdc48bd8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - kontragentpro-mcp = kontragentpro_mcp.server:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.27
    - mcp >=1.2.0

tests:
  - python:
      imports:
        - kontragentpro_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://kontragentpro.ru
  summary: MCP server for Russian company data by tax ID (INN) from official open state registries
  description: |
    Model Context Protocol server that gives AI assistants data on Russian companies by tax ID (INN):
    registry details, multi-year financial statements, bankruptcy records, state inspections and
    trademarks from official open registries. Works without an API key on the anonymous free tier;
    a free key raises the rate limits.
  license: MIT
  license_file: LICENSE
  documentation: https://kontragentpro.ru/api/v2/docs
  repository: https://github.com/kontragentpro/kontragentpro-mcp

extra:
  recipe-maintainers:
    - iwdri
