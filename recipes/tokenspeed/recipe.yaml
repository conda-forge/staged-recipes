schema_version: 1

context:
  version: 0.1.1
  build_number: 0

recipe:
  name: tokenspeed
  version: ${{ version }}

source:
  url: https://github.com/lightseekorg/tokenspeed/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b4fa50d7ce2ef8fcc1ca5dceb449c32d299e9f90104fc93b5e774ed5f39a72bc
  patches:
    - 0001-conda-kernel-build.patch

build:
  number: ${{ build_number }}

outputs:

  - package:
      name: tokenspeed-mla
      version: 0.2.16

    build:
      skip:
        - not linux
      script: ${{ PYTHON }} -m pip install ./tokenspeed-mla -vv --no-deps --no-build-isolation

    requirements:
      host:
        - python
        - pip
        - setuptools >=69.5.1
        - wheel
      run:
        - python
        - apache-tvm-ffi <0.2,>=0.1.11
        - nvidia-cutlass-dsl >=4.8.0
        - tokenspeed-triton >=3.8.10.post20260920
        - pytorch

    tests:
      - python:
          imports:
            - tokenspeed_mla
          pip_check: true

    about:
      homepage: https://pypi.org/project/tokenspeed-mla/
      summary: Speed-of-light TokenSpeed MLA kernels.
      license: MIT AND Apache-2.0 AND BSD-3-Clause
      license_file:
        - LICENSE
        - tokenspeed-mla/THIRDPARTYNOTICES

  - package:
      name: tokenspeed-kernel-amd
      version: 0.1.4

    build:
      skip:
        - not linux
      script: ${{ PYTHON }} -m pip install ./tokenspeed-kernel-amd -vv --no-deps --no-build-isolation

    requirements:
      host:
        - python
        - pip
        - setuptools >=69.5.1
        - wheel
      run:
        - python
        - pytorch
        - tokenspeed-triton >=3.8.10.post20260920

    tests:
      - python:
          imports:
            - tokenspeed_kernel_amd
          pip_check: true

    about:
      homepage: https://pypi.org/project/tokenspeed-kernel-amd/
      summary: TokenSpeed AMD-specific high-performance kernels.
      license: MIT
      license_file:
        - LICENSE
        - tokenspeed-kernel-amd/THIRDPARTYNOTICES

  - package:
      name: tokenspeed-kernel-npu
      version: 0.1.0

    build:
      skip:
        - not linux
      script: ${{ PYTHON }} -m pip install ./tokenspeed-kernel-npu -vv --no-deps --no-build-isolation

    requirements:
      host:
        - python
        - pip
        - setuptools >=69.5.1
        - wheel
      run:
        - python
        - pytorch
        - triton-ascend ==3.2.1

    tests:
      - python:
          imports:
            - tokenspeed_kernel_npu
          pip_check: true

    about:
      homepage: https://pypi.org/project/tokenspeed-kernel-npu/
      summary: TokenSpeed Ascend-specific kernels.
      license: MIT
      license_file:
        - LICENSE
        - tokenspeed-kernel-npu/THIRDPARTYNOTICES

  - package:
      name: tokenspeed-scheduler
      version: 0.1.25

    build:
      skip:
        - not linux
      script: ${{ PYTHON }} -m pip install ./tokenspeed-scheduler -vv --no-deps --no-build-isolation

    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake >=3.22
        - ninja >=1.11
      host:
        - python
        - pip
        - scikit-build-core >=0.9.5
        - nanobind >=2.13.0
        - tokenspeed-spdlog ==1.15.1
        - openssl
      run:
        - python
        - numpy

    tests:
      - python:
          imports:
            - tokenspeed_scheduler
          pip_check: true

    about:
      homepage: https://pypi.org/project/tokenspeed-scheduler/
      summary: TokenSpeed C++ scheduler with Python bindings
      license: MIT
      license_file: LICENSE

  - package:
      name: tokenspeed-kernel
      version: 0.1.4

    build:
      skip:
        - not linux
      string: cuda${{ cuda_compiler_version | version_to_buildstring }}_py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      script: build-kernel.sh

    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ compiler('cuda') }}
        - ${{ stdlib('c') }}
      host:
        - python
        - pip
        - setuptools >=69.5.1
        - wheel
        - cuda-cudart-dev
        - cuda-driver-dev
        - libcublas-dev
        - spdlog
        - packaging
        - psutil
        - numpy
        - pytorch ==2.14.0
        - apache-tvm-ffi ==0.1.13.post3
        - tokenspeed-proton >=3.8.10.post20260920
        - tokenspeed-triton >=3.8.10.post20260920
        - nvidia-cutlass-dsl ==4.8.0
        - nvidia-cutlass-dsl-libs-cu13 ==4.8.0
        - flashinfer-python ==0.7.1rc2
        - nvidia-cudnn-frontend ==1.30.0
        - nvidia-ml-py ==13.580.82
        - nvtx
        - tokenspeed-deepep ==2.1.0.post20260810
        - tokenspeed-deepgemm ==2.8.0.post20260924
        - tokenspeed-flashmla ==1.0.0.post20260924
        - tokenspeed-deepselect ==1.0.0.post20260910
        - ${{ pin_subpackage('tokenspeed-mla', exact=True) }}
        - tokenspeed-fast-hadamard-transform ==1.1.0.post20260920
        - tokenspeed-fa3 ==3.0.0.post20260810
        - tokenspeed-fa4 ==4.0.0.post20260923
        - tokenspeed-quack ==0.6.4.post20260923
        - tokenspeed-trtllm-kernel ==1.3.0.post20260924
        - tokenspeed-flashkda ==0.0.1.post20260901
        - tokenspeed-cutedsl-kda ==0.1.0.post20260923
      run:
        - python
        - cuda-version >=13,<14
        - cuda-cudart
        - libcublas
        - packaging
        - wheel
        - psutil
        - numpy
        - pytorch ==2.14.0
        - apache-tvm-ffi ==0.1.13.post3
        - tokenspeed-proton >=3.8.10.post20260920
        - tokenspeed-triton >=3.8.10.post20260920
        - nvidia-cutlass-dsl ==4.8.0
        - nvidia-cutlass-dsl-libs-cu13 ==4.8.0
        - flashinfer-python ==0.7.1rc2
        - nvidia-cudnn-frontend ==1.30.0
        - nvidia-ml-py ==13.580.82
        - nvtx
        - tokenspeed-deepep ==2.1.0.post20260810
        - tokenspeed-deepgemm ==2.8.0.post20260924
        - tokenspeed-flashmla ==1.0.0.post20260924
        - tokenspeed-deepselect ==1.0.0.post20260910
        - ${{ pin_subpackage('tokenspeed-mla', exact=True) }}
        - tokenspeed-fast-hadamard-transform ==1.1.0.post20260920
        - tokenspeed-fa3 ==3.0.0.post20260810
        - tokenspeed-fa4 ==4.0.0.post20260923
        - tokenspeed-quack ==0.6.4.post20260923
        - tokenspeed-trtllm-kernel ==1.3.0.post20260924
        - tokenspeed-flashkda ==0.0.1.post20260901
        - tokenspeed-cutedsl-kda ==0.1.0.post20260923

    tests:
      - python:
          imports:
            - tokenspeed_kernel
          pip_check: true
      - script:
          - test -f "$SP_DIR/tokenspeed_kernel/thirdparty/cuda/objs/rope/rope.so"

    about:
      homepage: https://pypi.org/project/tokenspeed-kernel/
      summary: TokenSpeed kernels
      license: MIT AND Apache-2.0 AND BSD-3-Clause
      license_file:
        - LICENSE
        - tokenspeed-kernel/python/THIRDPARTYNOTICES

  - package:
      name: tokenspeed
      version: ${{ version }}

    build:
      skip:
        - not linux
      script: ${{ PYTHON }} -m pip install ./python -vv --no-deps --no-build-isolation

    requirements:
      host:
        - python
        - pip
        - setuptools ==83.0.0
        - wheel
      run:
        - python
        - aiohttp
        - compressed-tensors
        - dill
        - einops
        - fastapi
        - grpcio-health-checking ==1.81.1
        - grpcio-reflection ==1.81.1
        - hf-transfer
        - huggingface_hub
        - modelscope
        - msgspec
        - ninja
        - numpy
        - openai >=2.24.1
        - openai-harmony
        - orjson
        - packaging
        - partial-json-parser
        - peft
        - pillow
        - prometheus-client
        - psutil
        - pybase64
        - pybind11
        - pydantic
        - py-spy
        - pytest-asyncio
        - python-multipart
        - pyzmq
        - requests
        - setproctitle
        - tiktoken
        - pytorch
        - torchvision
        - ${{ pin_subpackage('tokenspeed-kernel', exact=True) }}
        - tokenspeed-mooncake >=0.3.13.post20260929
        - ${{ pin_subpackage('tokenspeed-scheduler', exact=True) }}
        - tokenspeed-smg ==1.10.1.post20260920
        - tokenspeed-smg-grpc-proto ==0.4.18.post20260920
        - tokenspeed-smg-grpc-servicer ==0.9.1.post20260920
        - torch_memory_saver ==0.0.9.post1
        - tqdm
        - transformers ==5.12.0
        - uv
        - uvicorn
        - uvloop
        - xgrammar ==0.2.3
        - viztracer

    tests:
      - python:
          imports:
            - tokenspeed
          pip_check: true
      - script:
          - tokenspeed --help
          - ts --help

    about:
      homepage: https://pypi.org/project/tokenspeed/
      summary: TokenSpeed is a speed-of-light LLM inference engine.
      license: MIT AND Apache-2.0
      license_file:
        - LICENSE
        - python/THIRDPARTYNOTICES

about:
  homepage: https://github.com/lightseekorg/tokenspeed
  repository: https://github.com/lightseekorg/tokenspeed
  documentation: https://github.com/lightseekorg/tokenspeed/tree/main/docs
  summary: TokenSpeed LLM inference engine and accelerator components
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - shermansiu
