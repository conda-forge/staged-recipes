{% set name = "eccopy" %}
{% set version = "1.0.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 860a975f832dad0c22a0b7ada4e97b4c8c53b643733718cf99b3b0d1361aec04

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    # Matches pyproject's build-system requirement: PEP 639 SPDX license
    # expressions need setuptools >= 77.
    - setuptools >=77
    - wheel
  run:
    - python >={{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - numba >=0.58

test:
  imports:
    - eccopy
    - eccopy.eccopy1d
    - eccopy.eccopy2d_v
    - eccopy.eccopy2d_h
    - eccopy.eccopy3d
    - eccopy.stats
  requires:
    - python {{ python_min }}
    - pip
    - pytest >=7.4
    - matplotlib-base >=3.7
  source_files:
    - eccopy/tests
  commands:
    - pip check
    # Confirm the .mat reference data files installed correctly.
    - python -c "from eccopy.core.classification import _DISK_STREL_DIR, _DISK_DECOMP_DIR; import os; assert os.listdir(_DISK_STREL_DIR); assert os.listdir(_DISK_DECOMP_DIR)"
    - pytest eccopy/tests -q

about:
  home: https://github.com/iancornejo/EccoPy
  summary: Data-agnostic Python implementation of the ECCO radar echo classification algorithm
  description: |
    EccoPy separates convective from stratiform radar echo using the ECCO
    (Echo Classification from COnvectivity) algorithm, in four variants
    covering 1-D series, vertical cross-sections, horizontal composites and
    full 3-D volumes. It operates purely on NumPy arrays and performs no
    file I/O, making it independent of coordinate system, file format and
    radar type. The classification path is ported from the reference MATLAB
    ECCO-V and C++ ConvStratFinder implementations developed at the NSF
    National Center for Atmospheric Research.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://github.com/iancornejo/EccoPy#readme
  dev_url: https://github.com/iancornejo/EccoPy

extra:
  recipe-maintainers:
    - iancornejo
