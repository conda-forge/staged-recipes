# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Internxt Drive Desktop for Linux from drive-desktop-linux.

context:
  version: "2.5.2"

package:
  name: internxt-drive-desktop-linux
  version: ${{ version }}

source:
  url: https://github.com/internxt/drive-desktop-linux/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 1ea94b8d63bc5060918612bb84d40f2cf86f10e77f250349821a8cf5129eb70b
  patches:
    - fix-typeorm-imports.patch

build:
  number: 0
  skip:
    - not linux
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - nodejs >=18,<19
    - pnpm
    - pnpm-licenses
  host:
    - nodejs >=18,<19
    - libfuse
  run:
    - nodejs >=18,<19
    - libfuse

tests:
  - package_contents:
      files:
        - lib/internxt-drive-desktop-linux/dist/main/main.js
        - lib/internxt-drive-desktop-linux/package.json
        - bin/internxt-drive-desktop-linux
  - script:
      - which internxt-drive-desktop-linux

about:
  homepage: https://internxt.com
  summary: Internxt Drive Desktop for Linux - encrypted cloud storage client
  description: |
    Internxt Drive for Linux is a privacy-focused cloud storage desktop
    application. It uses FUSE for virtual filesystem mounting, and files are
    end-to-end encrypted and synchronized with the Internxt cloud service.
  license: MIT OR AGPL-3.0-only
  license_file:
    - LICENSE
    - third-party-licenses.txt
  repository: https://github.com/internxt/drive-desktop-linux

extra:
  recipe-maintainers:
    - phreed
