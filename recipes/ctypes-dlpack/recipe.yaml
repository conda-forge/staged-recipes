schema_version: 1

context:
  version: "0.1.0"

package:
  name: ctypes-dlpack
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/ctypes-dlpack/ctypes_dlpack-${{ version }}.tar.gz
  sha256: a1f8811e761f05bc28aa60cab2674afe4f6c7242255987214776cfc04c605132

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ctypes_dlpack
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Ctypes helpers for DLPack interop
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/metatensor/ctypes-dlpack/

extra:
  recipe-maintainers:
    - Luthaf
