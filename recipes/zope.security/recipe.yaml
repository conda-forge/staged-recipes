schema_version: 1

context:
  version: "8.4"

package:
  name: zope.security
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.security/zope_security-${{ version }}.tar.gz
  sha256: 917b33a868bd63f57f6edbb63d73dec71b5ae5ce528976ac10e3df2bde92da0d

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - zope.proxy
  run:
    - python
    - zope.component
    - zope.i18nmessageid
    - zope.interface
    - zope.location
    - zope.proxy >=6.1
    - zope.schema >=4.2.0

tests:
  - python:
      imports:
        - zope.security
        - zope.security._proxy
        - zope.security._zope_security_checker
      pip_check: true

about:
  homepage: https://github.com/zopefoundation/zope.security
  repository: https://github.com/zopefoundation/zope.security
  documentation: https://zopesecurity.readthedocs.io
  summary: Zope Security Framework
  license: ZPL-2.1
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - killua156
