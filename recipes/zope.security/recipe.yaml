schema_version: 1

context:
  version: "8.5"

package:
  name: zope.security
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.security/zope_security-${{ version }}.tar.gz
  sha256: 24f851caf94a63d957f3fb9be092f0510c0c839cb387e5825c099fbe925502ca

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - zope.proxy
  run:
    - python
    - zope.component
    - zope.i18nmessageid
    - zope.interface
    - zope.location
    - zope.proxy >=6.1
    - zope.schema >=4.2.0

tests:
  - python:
      imports:
        - zope.security
        - zope.security._proxy
        - zope.security._zope_security_checker
        - zope.security.checker
        - zope.security.proxy
      pip_check: true
  - script:
      - python -m unittest -v zope.security.tests.test_adapter zope.security.tests.test_checker zope.security.tests.test_compile_flags zope.security.tests.test_decorator zope.security.tests.test_location zope.security.tests.test_management zope.security.tests.test_metaconfigure zope.security.tests.test_permission zope.security.tests.test_protectclass zope.security.tests.test_proxy zope.security.tests.test_simpleinteraction zope.security.tests.test_simplepolicies zope.security.tests.test_testing zope.security.tests.test_zcml zope.security.tests.test_zcml_functest
    requirements:
      run:
        - btrees
        - zope.configuration
        - zope.exceptions
        - zope.testing

about:
  homepage: https://github.com/zopefoundation/zope.security
  repository: https://github.com/zopefoundation/zope.security
  documentation: https://zopesecurity.readthedocs.io
  summary: Zope Security Framework
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
