# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: specproc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/specproc/specproc-${{ version }}.tar.gz
  sha256: bebc64c74291f10057f510b1cb97e58be18ebbb15220d9777ad03454275ae26b

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - specproc = specproc.main:main
      - specproc.air2vac = specproc.utils.airvac:air2vac_main
      - specproc.vac2air = specproc.utils.airvac:vac2air_main
      - specproc.identify = specproc.utils.identify:main
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - setuptools >=77
    - python ${{ python_min }}.*
  run:
    - numpy
    - scipy
    - astropy-base
    - matplotlib-base
    - pyqt
    - python >=${{ python_min }}

tests:
  - python:
      imports: specproc
      pip_check: true
  - script:
      - specproc --version

about:
  license: MIT
  license_file: LICENSE
  summary: A spectral processing tool for slit/echelle spectrograph FITS data
  description: |
    SpecProc is a PyQt5-based pipeline for reducing slit and echelle spectrograph
    FITS data: overscan/bias correction, cosmic-ray removal, aperture tracing,
    scattered-light subtraction, flat-fielding, optimal extraction, de-blazing,
    wavelength calibration and order stitching. It ships telescope profiles for
    Xinglong 2.16m HRS/BFOSC, Lijiang 2.4m HRS, Muztagh-Ata 1.93m slit and
    Nanshan 1.2m fibre echelle data.
  homepage: https://github.com/abiao-github/SpecProc
  repository: https://github.com/abiao-github/SpecProc
  documentation: https://github.com/abiao-github/SpecProc#readme

extra:
  recipe-maintainers:
    - abiao-github
