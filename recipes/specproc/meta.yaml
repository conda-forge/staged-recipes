{% set name = "specproc" %}
{% set version = "1.0.2" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: bebc64c74291f10057f510b1cb97e58be18ebbb15220d9777ad03454275ae26b

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - specproc = specproc.main:main
    - specproc.air2vac = specproc.utils.airvac:air2vac_main
    - specproc.vac2air = specproc.utils.airvac:vac2air_main
    - specproc.identify = specproc.utils.identify:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - astropy
    - matplotlib-base
    - pyqt

test:
  imports:
    - specproc
  commands:
    - pip check
    - python -c "import specproc; print(specproc.__version__)"
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/abiao-github/SpecProc
  summary: A spectral processing tool for slit/echelle spectrograph FITS data
  description: |
    SpecProc is a PyQt5-based pipeline for reducing slit and echelle spectrograph
    FITS data: overscan/bias correction, cosmic-ray removal, aperture tracing,
    scattered-light subtraction, flat-fielding, optimal extraction, de-blazing,
    wavelength calibration and order stitching. It ships telescope profiles for
    Xinglong 2.16m HRS/BFOSC, Lijiang 2.4m HRS, Muztagh-Ata 1.93m slit and
    Nanshan 1.2m fibre echelle data.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/abiao-github/SpecProc
  doc_url: https://github.com/abiao-github/SpecProc#readme

extra:
  recipe-maintainers:
    - abiao-github
