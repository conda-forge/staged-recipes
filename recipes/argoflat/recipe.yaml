schema_version: 1

context:
  version: "0.1.0rc2"
  python_min: "3.12"

package:
  name: argoflat
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/argoflat/argoflat-${{ version }}.tar.gz
  sha256: 3854d5b780d34db3916ab57657f7b8dd0f0af53f3b26f091c95a3eeac2e4066c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.11.4,<0.12.0
    - pip
  run:
    - python >=${{ python_min }}
    - argopy >=1.5
    - dask-core >=2026.8
    - h5py >=3.16
    - netcdf4 >=1.7
    - pyarrow >=26.0
    - s3fs >=2026.9
    - xarray >=2026.9
    - zarr >=3.4

tests:
  - python:
      imports:
        - argoflat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "ARGOFLAT: The Argo dataset as a lossless, analysis-ready cloud-optimised contiguous ragged array"
  license: EUPL-1.2
  license_file: LICENSE
  homepage: https://github.com/euroargodev/argoflat

extra:
  recipe-maintainers:
    - gmaze
