context:
  version: "5.2.5"

package:
  name: scientific-computing-system-2.0
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scientific-computing-system-2.0/scientific_computing_system_2_0-${{ version }}.tar.gz
  sha256: 9e53f8d75d3ecb56211679c6d6785ac6efca6f73825f1b3b19bf0e6fe414e7c5

build:
  noarch: python
  number: 0
  script:
    env:
      CDS_PURE: "1"
    content: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.10
    - numpy >=1.26
    - scipy >=1.11
    - pandas >=2.2
    - matplotlib-base >=3.8

tests:
  - python:
      imports:
        - cds2
      pip_check: true

about:
  homepage: https://github.com/Furox-Art/scientific-computing-system-2.0
  license: MIT
  license_file: LICENSE
  summary: NumPy build of scientific-computing-system. Not a separate product.
  description: |
    Accelerated build of scientific-computing-system on NumPy, SciPy, pandas,
    and matplotlib. The pure-Python package remains scientific-computing-system.
    This recipe sets CDS_PURE=1 so the optional C extensions are not compiled.
  documentation: https://furox-art.github.io/scientific-computing-system-2.0/
  repository: https://github.com/Furox-Art/scientific-computing-system-2.0

extra:
  recipe-maintainers:
    - Furox-Art
