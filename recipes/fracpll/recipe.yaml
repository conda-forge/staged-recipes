schema_version: 1

context:
  version: "0.9.0"

package:
  name: fracpll
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fracpll/fracpll-${{ version }}.tar.gz
  sha256: 818c302a270897cfb4489ac5ec63ce3db7e3879d61f7c970ae1ba7e3792bdefc

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.8

tests:
  - python:
      imports:
        - fracpll
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/fracpll
  license: Apache-2.0
  license_file: LICENSE
  summary: "Design and check charge-pump fractional-N frequency synthesizers from measured parts"
  description: |
    Works from the numbers you measured or designed (the oscillator's tuning
    curve, noise measurements, pump current, filter parts) and answers
    whether the loop is stable and with what margin, which second- or third-
    order filter gives the wanted bandwidth and phase margin, how much phase
    noise and jitter the output has, whether and how fast the loop locks,
    which spurs the fractional divider and leakage create, how long a jitter
    measurement must average, and how well the bandwidth and margins are
    known given the uncertainty of the parts. It refuses to answer where its
    formulas are not valid.
  repository: https://github.com/TaN-MM-Org/fracpll
  documentation: https://github.com/TaN-MM-Org/fracpll#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
