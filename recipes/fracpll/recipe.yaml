schema_version: 1

context:
  version: "0.1.0"

package:
  name: fracpll
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fracpll/fracpll-${{ version }}.tar.gz
  sha256: d52e05dbe61182e3d7ae9e665edc9fefebdcde3779678a938825391dd6e49970

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.22
    - scipy >=1.8

tests:
  - python:
      imports:
        - fracpll
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/TaN-MM-Org/fracpll
  license: Apache-2.0
  license_file: LICENSE
  summary: "Charge-pump fractional-N PLL design from measured pieces, with validity refusals"
  description: |
    Loop stability with Gardner-limit validity refusals, exact
    integer-accumulator MASH delta-sigma sequences and their quantization
    phase PSD, closed-loop phase-noise assembly from measured NoiseSpec
    points with mandatory provenance, monotone PCHIP tuning curves from
    measured (Vc, f) points, averaged nonlinear lock transients tested
    against the closed-form static offset, and closed-form planning of
    jitter-measurement error bars.
  repository: https://github.com/TaN-MM-Org/fracpll
  documentation: https://github.com/TaN-MM-Org/fracpll#readme

extra:
  recipe-maintainers:
    - Tanvir-Mahmud-Mahim
