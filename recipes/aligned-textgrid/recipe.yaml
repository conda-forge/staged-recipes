context:
  version: "0.8.1"

package:
  name: aligned-textgrid
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/aligned-textgrid/aligned_textgrid-${{ version }}.tar.gz
  sha256: 9961683f3b9a51602fb88662e5fe5681059793a5895398bc61cdb2392c9b7cac

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - praatio <7.0.0,>=6.0.0
    - cloudpickle <4.0.0,>=3.0.0
    - toml <0.11.0,>=0.10.2
    - polars <2.0.0,>=1.23.0
    - numpy <3.0.0,>=2.1.0

tests:
  - python:
      imports:
        - aligned_textgrid
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://forced-alignment-and-vowel-extraction.github.io/alignedTextGrid
  summary: Classes for defining sequential information from TextGrids
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - IvoLeist
