{% set version = '0.1.0' %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-dfba
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/DFBA_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/DFBA/DFBA_{{ version }}.tar.gz
  sha256: f95a98619321fc1190e1daf2fd2cfc8e529eacba72db7a779f5dac6fae9edc8b

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('DFBA')"           # [not win]
    - "\"%R%\" -e \"library('DFBA')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=DFBA
  license: GPL-2.0-only
  summary: A set of functions to perform distribution-free Bayesian analyses. Included are Bayesian
    analogues to the frequentist Mann-Whitney U test, the Wilcoxon Signed-Ranks test,
    Kendall's Tau Rank Correlation Coefficient, Goodman and Kruskal's Gamma, McNemar's
    Test, the binomial test, the sign test, the median test, as well as distribution-free
    methods for testing contrasts among condition and for computing Bayes factors for
    hypotheses. The package also includes procedures to estimate the power of distribution-free
    Bayesian tests based on data simulations using various probability models for the
    data. The set of functions provide data analysts with a set of Bayesian procedures
    that avoids requiring parametric assumptions about measurement error and is robust
    to problem of extreme outlier scores.
  license_family: GPL2
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2'

extra:
  recipe-maintainers:
    - conda-forge/r
