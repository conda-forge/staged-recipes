schema_version: 1

context:
  version: "0.1.61"

package:
  name: openinference-instrumentation-litellm
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/openinference-instrumentation-litellm/openinference_instrumentation_litellm-${{ version }}.tar.gz
  sha256: dc6f3c6a73bf6334417bed7534ea077985bf3454d437d0b9a6541c699326135a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api
    - opentelemetry-sdk
    - opentelemetry-instrumentation
    - openinference-instrumentation >=0.1.82
    - openinference-semantic-conventions >=0.1.46
    - wrapt
    - setuptools

tests:
  - python:
      imports:
        - openinference.instrumentation.litellm
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: OpenInference liteLLM Instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Arize-ai/openinference/tree/main/python/instrumentation/openinference-instrumentation-litellm

extra:
  recipe-maintainers:
    - jsmolic
