schema_version: 1

context:
  version: 1.0.0

package:
  name: perseo_perturbations
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/perseo_perturbations/perseo_perturbations-${{ version }}.tar.gz
  sha256: a9a2488ebad7df83af8b6cc6828c1a4c7cd6893e51d9ab5e5cd128e15796d4a8

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
        - ${{ stdlib('c') }}
    - if: win
      then:
        # On Windows, we use the MinGW-w64 toolchain instead of the default
        # MSVC/Flang toolchain. The legacy Flang 5 compiler appears to be
        # incompatible with the -fms-runtime-lib=dll flag passed by Meson.
        # This configuration match the toolchain used to build the Windows wheels.
        - ${{ compiler('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
        - ${{ compiler('m2w64_fortran') }}
        - ${{ stdlib('m2w64_c') }}

  host:
    - python
    - numpy >2
    - meson-python
    - meson >=1.1.0
    - ninja
    - pip
    - wheel

  run:
    - python
    - numpy >2
    - scipy >1.13
    - pandas >=1.4.0
    - xarray >=2026.4.0
    - more-itertools
    - netcdf4
    - pymap3d >=3.2
    - perseo-core >=1.0.0,<2

tests:
  - python:
      imports:
        - perseo_perturbations
        - perseo_perturbations.geodynamics.solid
      pip_check: true

about:
  homepage: https://github.com/aresys-srl/perseo
  documentation: https://opensource.aresys.it/perseo
  summary: "Python Ecosystem for Remote Sensing & Earth Observation: computing geodynamics displacements and atmospheric delays for SAR products."
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - matteoaletti
