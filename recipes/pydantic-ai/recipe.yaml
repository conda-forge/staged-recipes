schema_version: 1

context:
  version: "2.42.0"

package:
  name: pydantic-ai-slim
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydantic-ai-slim/pydantic_ai_slim-${{ version }}.tar.gz
  sha256: 045c788b1636e0ed79542f2b7562d2688a3e3701744ed7379a928fceec446336

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anyio >=4.7.0
    - genai-prices >=0.1.6
    - griffe >=2.0
    - httpx2 >=2.7
    - opentelemetry-api >=1.28.0
    - pydantic >=2.12
    - pydantic-graph ==${{ version }}
    - typing-inspection >=0.4.0

tests:
  - python:
      imports:
        - pydantic_ai
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - pip check
    requirements:
      run:
        - pip

about:
  homepage: https://ai.pydantic.dev
  summary: AI Agent Framework, the Pydantic way (slim package without extras)
  repository: https://github.com/pydantic/pydantic-ai
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Yash990-bit
