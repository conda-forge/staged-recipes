schema_version: 1

context:
  name: silo
  release: "2026-09-16T00-00-00Z"
  # commit of the RELEASE.${{ release }} tag, stamped into the binary
  # (upstream's buildscripts/gen-ldflags.go reads it via `git log`)
  commit: 2a4d51406b7ed87af5fe6fe0f801f3290f96eb3c

package:
  name: ${{ name }}
  version: ${{ release | replace("-", ".") | replace("T", ".") | replace("Z", "") }}

source:
  url: https://github.com/pgsty/silo/archive/RELEASE.${{ release }}.tar.gz
  sha256: 66cd4ec1ab311ab2d479b4798df028cbf9976d9b072234973185a4cbe8f7c4ae

build:
  number: 0
  script:
    file: build
    env:
      RELEASE: ${{ release }}
      GIT_COMMIT: ${{ commit }}

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - silo --version
      - silo --help
  - package_contents:
      bin:
        - silo
      strict: true

about:
  homepage: https://silo.pgsty.com
  license: AGPL-3.0-only
  license_file:
    - LICENSE
    - library_licenses/
    - NOTICE
  summary: S3-compatible object storage, a MinIO fork maintained by PGSTY
  description: |
    Silo is a community-maintained fork of the MinIO object storage server. It keeps
    the S3 / IAM API surface, on-disk format and MINIO_* environment variables of
    MinIO, so it can be used as a drop-in replacement for MinIO-compatible workloads.
  documentation: https://silo.pgsty.com
  repository: https://github.com/pgsty/silo

extra:
  recipe-maintainers:
    - soapy1
