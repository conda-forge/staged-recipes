# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "20260903131801.0.0"
  release_tag: "RELEASE.2026-09-03T13-18-01Z"

package:
  name: silo
  version: ${{ version }}

source:
  - if: linux and x86_64
    then:
      url: https://github.com/pgsty/silo/releases/download/${{ release_tag }}/silo_${{ version }}_linux_amd64.tar.gz
      sha256: cbe5c01eac0a97ccb22fa252eafa432e8608bfde7e3ea27a324cb5ed625a1e96
  - if: linux and aarch64
    then:
      url: https://github.com/pgsty/silo/releases/download/${{ release_tag }}/silo_${{ version }}_linux_arm64.tar.gz
      sha256: 311846ca9387de36f8e34daa8bf1a130684cc7b8c61aa39581264249eb8df0cf
  - if: osx and x86_64
    then:
      url: https://github.com/pgsty/silo/releases/download/${{ release_tag }}/silo_${{ version }}_darwin_amd64.tar.gz
      sha256: 35b4121f6ca2ba79514c3536e5f7f79ae8f7fe6fb88288efbdfa2ae8d5283131
  - if: osx and arm64
    then:
      url: https://github.com/pgsty/silo/releases/download/${{ release_tag }}/silo_${{ version }}_darwin_arm64.tar.gz
      sha256: bcfd90d51ab6dffc34193aac260464097bb1d2decdd2598538e618bc02ada668
  - if: win and x86_64
    then:
      url: https://github.com/pgsty/silo/releases/download/${{ release_tag }}/silo_${{ version }}_windows_amd64.tar.gz
      sha256: ed3d6e4937cd92435799947590c5478121a4c760cb81d14750da65258f655211

build:
  number: 0
  script:
    - if: unix
      then:
        - mkdir -p "${PREFIX}/bin"
        - cp silo "${PREFIX}/bin/silo"
        - chmod +x "${PREFIX}/bin/silo"
      else:
        - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
        - copy /Y silo.exe "%LIBRARY_BIN%\silo.exe"

tests:
  - script:
      - silo --version

about:
  license: AGPL-3.0-only
  license_file:
    - LICENSE
    - NOTICE
  summary: Community-maintained fork of the MinIO server — S3-compatible object storage, single static binary
  description: |
    Silo is a community-maintained fork of the MinIO server codebase, created after
    upstream MinIO removed its free console and stopped shipping prebuilt community
    binaries in 2026. Silo preserves the S3 / IAM API surface, on-disk format, and
    MINIO_* environment variables, so it is a drop-in local/dev replacement for
    MinIO-compatible workloads.

    This recipe repackages the upstream self-contained release binary — there is
    no conda-forge Go toolchain build path for this project's release pipeline
    (the release is produced by GoReleaser against the upstream MinIO build
    scripts and embeds a web console asset bundle), so the prebuilt per-platform
    binary is wrapped directly, mirroring the .NET/Go binary-repackage pattern
    used elsewhere in this skill for similar release-only upstreams.
  homepage: https://github.com/pgsty/silo
  repository: https://github.com/pgsty/silo
  documentation: https://silo.pgsty.com/

extra:
  recipe-maintainers:
    - rxm7706
