schema_version: 1

context:
  version: "1.1.0"
  python_min: "3.10"

package:
  name: pyvicp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyvicp/pyvicp-${{ version }}.tar.gz
  sha256: 0ceab011ee904a9b1cf9b7e017195ba36907180e9fbf390fe4a716c09d8310bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
    - setuptools-scm >=3.4.3
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyvicp
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: LeCroy VICP protocol in pure Python
  license: LGPL-2.1-or-later
  license_file: LICENSE
  homepage: https://github.com/bobmcnamara/pyvicp
  repository: https://github.com/bobmcnamara/pyvicp

extra:
  recipe-maintainers:
    - wolfv
