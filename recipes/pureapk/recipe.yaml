context:
  version: "0.1.1"

package:
  name: pureapk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pureapk/pureapk-${{ version }}.tar.gz
  sha256: 0cc5e74e92970694eb21e9bd223d2dbfdc5d6f12dbfd9ec7a307e8199dd42930

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pureapk = pureapk.cli:main
      - pyapk = pyapk.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pureapk
      pip_check: true
  - script:
      - pureapk --help
      - pyapk --help

about:
  homepage: https://github.com/eminsk/pyapk
  summary: Pure Python Android APK Engine, Multi-Store Packager & Toolchain
  description: |
    pureapk is an ultra-fast, zero-dependency, pure Python Android APK parser,
    inspector, builder, and multi-store packaging toolchain supporting Google Play
    (AAB), Apple App Store (IPA), Microsoft Store (MSIX), and Kivy/Pygame apps.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/pyapk
  documentation: https://github.com/eminsk/pyapk#readme

extra:
  recipe-maintainers:
    - eminsk
