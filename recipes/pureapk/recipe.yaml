context:
  version: "1.13.0"

package:
  name: pureapk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pureapk/pureapk-${{ version }}.tar.gz
  sha256: 52bde115171486ef1f1bb482bae22321f7de0cf25e5fe4a24d018ade5976820b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pureapk = pureapk.cli:main
      - pyapk = pureapk.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pureapk
        - pyapk
      pip_check: true
  - script:
      - pureapk --help
      - pyapk --help
      - pureapk --version
      - python -c "import pureapk, pyapk; assert pureapk.__version__ == '${{ version }}'"

about:
  homepage: https://github.com/eminsk/pyapk
  license: MIT
  license_file: LICENSE
  summary: High-performance pure Python APK inspection, multi-store packager, and framework toolchain with zero dependencies.
  description: |
    pureapk is a pure Python, zero-dependency toolkit for inspecting,
    analyzing, and packaging Android application packages (APK, AAB),
    Apple iOS IPAs, and Microsoft Windows MSIX packages.
  repository: https://github.com/eminsk/pyapk
  documentation: https://github.com/eminsk/pyapk#readme

extra:
  recipe-maintainers:
    - eminsk
