context:
  version: "0.1.0"

package:
  name: pureapk
  version: ${{ version }}

source:
  url: https://github.com/eminsk/pyapk/releases/download/v${{ version }}/pureapk-${{ version }}.tar.gz
  sha256: 7bff40eae031c31f5fc690d98a82c2181e1a1b05e4902488e28578d0c068ea7c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pureapk = pureapk.cli:main
      - pyapk = pyapk.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pureapk
        - pyapk
      pip_check: true
  - script:
      - pureapk --help
      - pyapk --help

about:
  homepage: https://github.com/eminsk/pyapk
  summary: Pure Python Android APK Engine, Multi-Store Packager & Toolchain
  description: |
    pureapk is an ultra-fast, zero-dependency, pure Python Android APK parser,
    inspector, builder, and multi-store packaging toolchain supporting Google Play
    (AAB), Apple App Store (IPA), Microsoft Store (MSIX), and Kivy/Pygame apps.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/pyapk
  documentation: https://github.com/eminsk/pyapk#readme

extra:
  recipe-maintainers:
    - eminsk
