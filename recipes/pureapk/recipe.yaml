context:
  version: "0.1.2"

package:
  name: pureapk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pureapk/pureapk-${{ version }}.tar.gz
  sha256: d80bdb92323b4dfe3d9fcbdba928b5c56f3c8f9682599977c6c2e49a9f1c97af

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pureapk = pureapk.cli:main
      - pyapk = pyapk.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pureapk
        - pyapk
      pip_check: true
  - script:
      - pureapk --help
      - pyapk --help
      - pureapk --version

about:
  homepage: https://github.com/eminsk/pyapk
  license: MIT
  license_file: LICENSE
  summary: High-performance pure Python APK inspection, multi-store packager, and framework toolchain with zero dependencies.
  description: |
    pureapk is a pure Python, zero-dependency toolkit for inspecting,
    analyzing, and packaging Android application packages (APK, AAB),
    Apple iOS IPAs, and Microsoft Windows MSIX packages. Compatible with
    CPython 3.8 - 3.16, Free-Threaded (No-GIL), and PyPy.
  repository: https://github.com/eminsk/pyapk
  documentation: https://github.com/eminsk/pyapk#readme

extra:
  recipe-maintainers:
    - eminsk
