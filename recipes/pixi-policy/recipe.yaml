# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: pixi-policy
  version: ${{ version }}

source:
  # pixi-policy is released from the aesir-oss/pixi-ext-contrib workspace, which tags each extension separately:
  # this package's releases are the pixi-policy-vX.Y.Z tags.
  url: https://github.com/aesir-oss/pixi-ext-contrib/archive/refs/tags/pixi-policy-v${{ version }}.tar.gz
  sha256: 6ca7ad260050e3f86b11209e03b573501d7b24edf773d9c1a3d1de112f62f8af

build:
  number: 0
  script:
    # The repository root is a Cargo workspace; the crate is crates/pixi-policy. Cargo.lock and the release profile
    # stay at the root, which cargo uses for a workspace member, and the shared crate it depends on
    # (crates/pixi-ext-common) is compiled in from the same tarball.
    - if: unix
      then: cargo auditable install --locked --bins --no-track --path crates/pixi-policy --root "$PREFIX"
      else: cargo auditable install --locked --bins --no-track --path crates/pixi-policy --root "%LIBRARY_PREFIX%"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      # osx_arm64 is cross-compiled on an osx_64 runner, which cannot execute the resulting binary.
      - if: build_platform == target_platform
        then:
          - pixi-policy --version
          - pixi-policy --help
          # Needs no workspace and no network: lists every rule.
          - pixi-policy explain
  - package_contents:
      bin:
        - pixi-policy
      strict: true

about:
  homepage: https://aesir-oss.github.io/pixi-ext-contrib/pixi-policy/
  repository: https://github.com/aesir-oss/pixi-ext-contrib
  documentation: https://aesir-oss.github.io/pixi-ext-contrib/pixi-policy/latest/
  summary: Check what a pixi workspace's environments may contain against a written policy
  description: |
    A pixi extension that checks pixi.toml and pixi.lock against pixi-policy.toml: where packages come from, banned
    packages and versions, SPDX license allow, review and deny lists, manifest and lockfile hygiene, and waivers that
    expire. It reports each finding with a fix hint, as text, JSON or SARIF, and exits non-zero so CI can stop a merge.
    Every check runs offline. Once installed with `pixi global install pixi-policy`, pixi discovers the `pixi-policy`
    executable on PATH and exposes it as `pixi policy`.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - millsks
