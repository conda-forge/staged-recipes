schema_version: 1

context:
  version: "0.1.2"
  python_min: "3.12"

package:
  name: hv-anndata
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/h/hv-anndata/hv_anndata-${{ version }}.tar.gz
  sha256: dbc49fa95ba09953c3db0865ce5af0bd765cd4c2ec7d9f5286015c6635a0f879

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-docstring-description
    - hatch-vcs
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - anndata >=0.13
    - fast-array-utils
    - holoviews >=1.23
    - numpy
    - pandas
    - scanpy

tests:
  - python:
      imports:
        - hv_anndata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/hv-anndata/
  summary: HoloViews support for anndata

extra:
  recipe-maintainers:
    - hoxbro
