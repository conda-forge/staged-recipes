context:
  version: "3.7"

package:
  name: ocaml-sedlex
  version: ${{ version }}

source:
  url: https://github.com/ocaml-community/sedlex/archive/refs/tags/v${{ version }}.tar.gz
  sha256: edb489710f5f937e69c7c11bb165fca91595d35059990c877c79f292b3e00851

build:
  number: 0
  skip:
    - win
  script:
    - dune build --profile=release -p sedlex @install
    - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" sedlex

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler("ocaml") }}
    - ocaml-dune >=3.0
  host:
    - ocaml >=4.08
    - ocaml-ppxlib >=0.26.0
    - ocaml-gen
  run:
    # sedlex's META requires gen, and sedlex.ppx requires ppxlib.
    - ocaml-ppxlib >=0.26.0
    - ocaml-gen

tests:
  - package_contents:
      strict: true
      files:
        - lib/ocaml/sedlex/**
        - doc/sedlex/**

about:
  homepage: https://github.com/ocaml-community/sedlex
  repository: https://github.com/ocaml-community/sedlex
  documentation: https://ocaml-community.github.io/sedlex/index.html
  summary: An OCaml lexer generator for Unicode
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ManuelLerchner
    - MementoRC
